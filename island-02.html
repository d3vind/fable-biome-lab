        fn(x+Math.cos(a)*rr,z+Math.sin(a)*rr); } };
      if((wear>0.5||thin>0.42)&&r2<0.36){
        // the metalled edge sheds its own stone, and the ground gives up more.
        // Chippings come off a road in runs, never one at a time.
        vclump(st.i(3,6),st.r(0.3,1.0),(cx,cz)=>{
          const r=st.r(0.05,0.16), cy=groundL(cx,cz);

          addTuft(uB,cx,groundL(cx,cz),cz,st,worn.clone().lerp(col(PAL.woodDeep),0.36),
            worn.clone().lerp(col(PAL.leafShade),0.22),
            st.r(0.12,0.24)+(1-wear)*st.r(0.10,0.28),st.i(3,5));
          local.understory++; });
      } else if(enc<0.40&&r2>0.93){

        // colour of dead grass rather than of bone
        vclump(st.i(2,4),st.r(0.3,0.9),(cx,cz)=>{
          addSeedhead(uB,cx,groundL(cx,cz),cz,st,mixc(PAL.meadow,PAL.road,0.26),
            mixc(PAL.meadow,PAL.road,0.52).lerp(col(PAL.bark),0.18),
            st.r(0.38,0.74)*(0.5+0.5*(1-wear)));
          local.seedheads++; });
      } else if(enc<0.42&&r2>0.76){

          st.pick([mixc(PAL.sky,0xffffff,0.40),mixc(PAL.blossom,0xfff3e6,0.34),

      } else {
        vclump(st.i(3,6),st.r(0.4,1.2),(cx,cz)=>{
          addTuft(uB,cx,groundL(cx,cz),cz,st,lush.clone().lerp(col(PAL.woodDeep),0.30+enc*0.24),
            lush.clone().lerp(col(PAL.leafShade),0.34),
            st.r(0.20,0.48)*(0.55+0.45*(1-wear)),st.i(3,5));

  }

  const live={meshes:[],local};
  if(nearB.p.length){ const m=new THREE.Mesh(bufGeo(nearB),treeMatNear);
    m.castShadow=(QCFG.shadow>0); m.matrixAutoUpdate=false; m.name='band-near-'+copy+'-'+bi;
    scene.add(m); live.meshes.push(m); bookMesh(m,true,copy); }
  if(midB.p.length){ const m=new THREE.Mesh(bufGeo(midB),treeMatMid);
    m.castShadow=(QCFG.shadow>0); m.matrixAutoUpdate=false; m.name='band-mid-'+copy+'-'+bi;
    scene.add(m); live.meshes.push(m); bookMesh(m,true,copy); }

  b.live=live;
  for(const k of Object.keys(local)) if(counts[k]!==undefined) counts[k]+=local[k];
  corridorRejects+=local.corridorRejects;

}
function disposeBand(copy,bi){
  const b=COPY_BANDS[copy][bi];
  if(!b.live) return;
  for(const m of b.live.meshes){ scene.remove(m); m.geometry.dispose();
    const ix=ISLAND_MESHES.indexOf(m); if(ix>=0) ISLAND_MESHES.splice(ix,1); }
  for(const k of Object.keys(b.live.local)) if(counts[k]!==undefined) counts[k]-=b.live.local[k];
  b.live=null;

}
let residentBands=0;
function updateResidency(g,budget){
  let made=0, live=0;
  for(let c=0;c<XFORMS.length;c++){
    const seg=ISLAND_SEGS[c];
    const sLoc=g-seg.g0;
    const lo=sLoc-QCFG.behind, hi=sLoc+QCFG.ahead;
    for(let i=0;i<NBAND;i++){
      const b=COPY_BANDS[c][i];
      const want=(b.s1>lo&&b.s0<hi);
      if(want&&!b.live){ if(made<budget){ realizeBand(c,i); made++; } }
      else if(!want&&b.live) disposeBand(c,i);
      if(b.live) live++;
    }
  }
  residentBands=live;
  RES.peak=Math.max(RES.peak,live);
  return made;
}
function plannedResidentBands(g){
  let n=0;
  for(let c=0;c<XFORMS.length;c++){
    const seg=ISLAND_SEGS[c];
    const sLoc=g-seg.g0;
    for(let i=0;i<NBAND;i++){
      const b=COPY_BANDS[c][i];
      if(b.s1>sLoc-QCFG.behind&&b.s0<sLoc+QCFG.ahead) n++;
    }
  }
  return n;
}
function disposeAllBands(){ for(let c=0;c<XFORMS.length;c++) for(let i=0;i<NBAND;i++) disposeBand(c,i); }

// ============================================================
// HOST SKY FURNITURE — clouds and a far country, so the island is seen

// ============================================================
const worldC={x:CF.cx,z:CF.cz};
const cloudMeshes=[];
{
  const cloudMat=new THREE.MeshLambertMaterial({vertexColors:true,fog:false,side:THREE.DoubleSide,
    emissive:mixc(PAL.cloud,0xFFFFFF,0.3),emissiveIntensity:0.52});
  // a cloud is welded from its lobes: any triangle whose centroid lies inside
  // a sibling lobe is never emitted, so overlapping surfaces cannot z-fight
  function weldedPuff(B,lobes,st,cTop,cBot){
    const D=ICOD[1];
    for(let li=0;li<lobes.length;li++){
      const L=lobes[li];
      const p1=st.r(0,TAU);
      const nrm=(i)=>{
        const x=D.p.getX(i), y=D.p.getY(i), z=D.p.getZ(i);
        const yy=y<0?y*0.72:y;
        let nx=x/L.rx, ny=yy/L.ry, nz=z/L.rz;
        const nl=Math.hypot(nx,ny,nz)||1;
        return [nx/nl,ny/nl,nz/nl];
      };
      const vert=(i)=>{
        const x=D.p.getX(i), y=D.p.getY(i), z=D.p.getZ(i);
        const j=1+0.07*Math.sin(Math.atan2(z,x)*2+y*2.0+p1);
        const yy=y<0?y*0.72:y;
        return [L.x+x*L.rx*j, L.y+yy*L.ry*j, L.z+z*L.rz*j, y];
      };

        const a=vert(D.idx[i]), b=vert(D.idx[i+1]), c=vert(D.idx[i+2]);
        const mx=(a[0]+b[0]+c[0])/3, my=(a[1]+b[1]+c[1])/3, mz=(a[2]+b[2]+c[2])/3;
        let buried=false;
        for(let lj=0;lj<lobes.length&&!buried;lj++){
          if(lj===li) continue;
          const O=lobes[lj];
          const ex=(mx-O.x)/O.rx, ey=(my-O.y)/O.ry, ez=(mz-O.z)/O.rz;
          if(ex*ex+ey*ey+ez*ez<0.72) buried=true;
        }
        if(buried) continue;
        const ym=(a[3]+b[3]+c[3])/3;
        const cc=cBot.clone().lerp(cTop,clamp(0.48+0.55*ym,0,1));
        pushTri(B,[a[0],a[1],a[2]],[b[0],b[1],b[2]],[c[0],c[1],c[2]],cc,
          nrm(D.idx[i]),nrm(D.idx[i+1]),nrm(D.idx[i+2]));
      }
    }
  }
  // The weather habit, in geometry. The near band is bigger, lower and more
  // than twice as fast as the valley's, because that is what a ridge feels

}
const lifeMatDark=new THREE.MeshBasicMaterial({color:mixc(PAL.woodDeep,PAL.bark,0.24),fog:true});

const birdGeo=(()=>{ const B=Buf(); B.sway=0; const c=mixc(PAL.woodDeep,PAL.bark,0.22);

  pushTri(B,[0,0,0.42],[0,0,-0.42],[1.15,0.16,0],c); return bufGeo(B); })();
const flitGeo=(()=>{ const B=Buf(); B.sway=0; const c=col(0xffffff);

function addBlobTo(B,x,y,z,rx,ry,rz,cTop,cBot){

    const ym=(v[0][3]+v[1][3]+v[2][3])/3;
    pushTri(B,[v[0][0],v[0][1],v[0][2]],[v[1][0],v[1][1],v[1][2]],[v[2][0],v[2][1],v[2][2]],
      cBot.clone().lerp(cTop,clamp(0.5+0.5*ym,0,1)));

const animalGeo=(()=>{
  const B=Buf(); B.sway=0;

const POOLS={

{

for(const k of Object.keys(POOLS)) bookMesh(POOLS[k].im,true,0);
const liveLife=[];
let lifeFired=0;
const _lm=new THREE.Matrix4(), _lq=new THREE.Quaternion(), _le=new THREE.Euler(), _lv=new THREE.Vector3(), _ls=new THREE.Vector3();
const XF0=XFORMS[0];
function takeSlot(kind,n){
  const P=POOLS[kind], out=[];
  for(let i=0;i<P.n&&out.length<n;i++) if(!P.slots[i].busy){ P.slots[i].busy=true; out.push(i); }

}
function releaseLife(L){
  if(!L||L.released) return;
  L.released=true;
  const P=L.kind?POOLS[L.kind]:null;
  if(!P||!L.idx||!L.idx.length) return;
  for(const i of L.idx){
    if(P.slots[i]) P.slots[i].busy=false;
    _lm.makeScale(0,0,0); P.im.setMatrixAt(i,_lm);
  }
  P.im.instanceMatrix.needsUpdate=true;
}
function clearAllLife(){
  for(const L of liveLife.slice()) releaseLife(L);

    const P=POOLS[k];
    for(let i=0;i<P.n;i++){ P.slots[i].busy=false; _lm.makeScale(0,0,0); P.im.setMatrixAt(i,_lm); }
    P.im.instanceMatrix.needsUpdate=true;

function spawnLife(ev,frame){
  const st=subStream('lifespawn',ev.id);

  const lx=frame.lx, lz=frame.lz, tx=frame.tx, tz=frame.tz;
  const mk=(kind,n,make)=>{
    const idx=takeSlot(kind,n); if(!idx.length) return;
    const L={kind,idx,t:0,dur:ev.dur,ev,released:false,parts:idx.map((_,i)=>make(i,st))};
    liveLife.push(L);
  };
  if(ev.kind==='pipits'){
    // flushed off the verge: low, fast, straight away, gone
    mk('bird',st.i(4,6),(i,s)=>{
      const ahead=s.r(22,46), side=ev.side;
      return {x:fx+tx*ahead+lx*side*s.r(6,18), y:fy+s.r(0.6,2.2), z:fz+tz*ahead+lz*side*s.r(6,18),
        vx:lx*side*s.r(9,15)+tx*s.r(1,5), vy:s.r(0.6,1.6), vz:lz*side*s.r(9,15)+tz*s.r(1,5),
        sc:s.r(0.30,0.44), ph:s.r(0,TAU), bob:s.r(2.2,4.0)};
    });
  } else if(ev.kind==='flock'){
    mk('bird',st.i(9,13),(i,s)=>{
      const a=s.r(0,TAU), rr=s.r(10,52), ahead=s.r(150,330);
      const bx=fx+tx*ahead+lx*ev.side*s.r(40,150)+Math.cos(a)*rr;
      const bz=fz+tz*ahead+lz*ev.side*s.r(40,150)+Math.sin(a)*rr;
      return {x:bx,y:groundW(bx,bz)+s.r(0.4,2.5),z:bz,
        vx:s.r(-4,4)+tx*s.r(2,7), vy:s.r(2.6,4.6), vz:s.r(-4,4)+tz*s.r(2,7),
        sc:s.r(0.75,1.15), ph:s.r(0,TAU), bob:s.r(1,2.4), rise:true};
    });
  } else if(ev.kind==='moths'){
    // small pale things, low, keeping out of the wind
    mk('flit',st.i(6,10),(i,s)=>{
      const ahead=s.r(8,40), off=ev.side*s.r(RH+3.0,ev.radius||22);
      const cx=fx+tx*ahead+lx*off, cz=fz+tz*ahead+lz*off;

    });
  } else if(ev.kind==='hare'){
    // a hare on open ground does not bolt for cover, because there is none.
    // It runs long, flat and across, and it is out of sight before it stops.
    mk('animal',1,(i,s)=>{
      const ahead=s.r(30,58), off=ev.side*s.r(RH+6,RH+22);
      const x=fx+tx*ahead+lx*off, z=fz+tz*ahead+lz*off;
      return {x,y:groundW(x,z),z,vx:lx*ev.side*s.r(5.5,8.0)+tx*s.r(-1,2),vy:0,
        vz:lz*ev.side*s.r(5.5,8.0)+tz*s.r(-1,2),sc:s.r(0.52,0.70),hop:s.r(9,13),ph:s.r(0,TAU),

    const wx=WIND.dx*XF0.c+WIND.dz*XF0.s, wz=-WIND.dx*XF0.s+WIND.dz*XF0.c;
    liveLife.push({kind:null,idx:[],t:0,dur:ev.dur,ev,released:false,

let moteBoost=0;
function updateLife(dt,wT){
  WL.uGlint.value.set(0,0,0,0);
  moteBoost=Math.max(0,moteBoost-dt*0.8);
  for(let i=liveLife.length-1;i>=0;i--){
    const L=liveLife[i];
    L.t+=dt;
    const fade=clamp(Math.min(L.t/1.2,(L.dur-L.t)/1.6),0,1);
    if(L.glint){
      const s=Math.sin(clamp(L.t/L.dur,0,1)*Math.PI);
      if(L.glint.vx!==undefined){ L.glint.x+=L.glint.vx*dt; L.glint.z+=L.glint.vz*dt; }
      WL.uGlint.value.set(L.glint.x,L.glint.z,L.glint.r,s*0.95);
    }
    if(L.kind){
      const im=POOLS[L.kind].im;
      for(let k=0;k<L.idx.length;k++){
        const p=L.parts[k], slot=L.idx[k];
        let sc=p.sc*fade;
        if(L.kind==='bird'){
          p.x+=p.vx*dt; p.z+=p.vz*dt;
          if(p.rise){ p.y+=p.vy*dt; p.vy=Math.max(0.6,p.vy-dt*0.35); }
          else p.y+=Math.sin(wT*1.6+p.ph)*p.bob*dt;
          _le.set(0,Math.atan2(p.vx,p.vz),Math.sin(wT*7+p.ph)*0.32);
          _lq.setFromEuler(_le); _lv.set(p.x,p.y,p.z); _ls.set(sc,sc,sc);
        } else if(L.kind==='flit'){
          const t=wT*p.sp+p.ph;
          const x=p.ax+Math.sin(t)*p.span, z=p.az+Math.cos(t*0.77)*p.span;
          const y=p.ay+Math.sin(t*(p.water?2.6:1.7))*(p.water?0.22:0.55);
          _le.set(Math.sin(wT*(p.water?26:13)+p.ph)*(p.water?0.25:0.95),Math.atan2(Math.cos(t),-Math.sin(t*0.77)),0);
          _lq.setFromEuler(_le); _lv.set(x,y,z); _ls.set(sc,sc,sc);
        } else {
          p.x+=p.vx*dt; p.z+=p.vz*dt;
          const gy=groundW(p.x,p.z);
          const hop=p.hop?Math.abs(Math.sin(wT*p.hop+p.ph))*0.22:0;
          sc=p.sc*clamp(Math.min(L.t/0.6,(p.fade-L.t)/1.1),0,1);
          _le.set(0,Math.atan2(p.vx,p.vz),0);
          _lq.setFromEuler(_le); _lv.set(p.x,gy+hop,p.z); _ls.set(sc,sc,sc);
        }
        if(sc<=0.0005) _lm.makeScale(0,0,0); else _lm.compose(_lv,_lq,_ls);
        im.setMatrixAt(slot,_lm);
      }
      im.instanceMatrix.needsUpdate=true;
    }
    if(L.t>=L.dur){ releaseLife(L); liveLife.splice(i,1); }
  }
}
// ---- the resident larks: two of them, on the island's own clock ----
// A skylark does not go anywhere. It goes UP, holds station over one patch of
// its own ground, and comes down onto it again. That makes it the right bird
// for this place and, incidentally, the honest pause proof: the rider can
// stand still for as long as they like and the lark is still working, because
// it was never riding. Its whole path is derived from the LOCAL plan, so it

const RESIDENT_LARKS=(()=>{

      const fr=getFrame(LFRAME,clamp(s,0,LFRAME.len-1));

function updateResidentLarks(wT){
  const im=RESIDENT_LARKS.im;

    const p=RESIDENT_LARKS.parts[i];
    const T=XFORMS[p.copy];
    const t=wT*p.sp+p.ph;
    // a tight hover that wanders slowly over its own patch, and a song flight
    // that climbs and sinks without ever leaving it
    const lx=p.ax+Math.sin(t*1.7)*p.drift+Math.sin(wT*p.dsp+p.ph)*p.drift*1.5;
    const lz=p.az+Math.cos(t*1.31)*p.drift+Math.cos(wT*p.dsp*0.83+p.ph)*p.drift*1.5;
    const climb=0.5+0.5*Math.sin(wT*0.13+p.ph);

    const w=T.fwd(lx,lz);

  }

// ============================================================
// LOCAL BOUNDS — the runtime face of "no absolute world coordinates"
// The plan hash proves the island's identity was frozen before the placement
// was read. That is necessary and not sufficient: a single world coordinate
// baked into a REALIZED vertex would still pass it. So every static island
// mesh is taken back through its own copy's transform and its vertices are
// required to land inside the island's own local extent. Anything authored
// against a world position — "it always sits at x" — lands somewhere else
// entirely and shows up here as an outlier, whatever the plan hash says.
// Instanced and point geometry is excluded and counted separately: its
// template lives at the origin and its placement is a per-frame matrix, so
// its vertex buffer cannot carry the defect this probe looks for.
// ============================================================
const LOCAL_BOUND=(()=>{
  let minX=1e9,maxX=-1e9,minZ=1e9,maxZ=-1e9;
  for(let i=0;i<=LFRAME.N;i++){
    minX=Math.min(minX,LFRAME.x[i]); maxX=Math.max(maxX,LFRAME.x[i]);
    minZ=Math.min(minZ,LFRAME.z[i]); maxZ=Math.max(maxZ,LFRAME.z[i]);
  }
  const pad=320;   // the island's authored reach (246 m) plus a tile of slack
  return {x0:minX-pad,x1:maxX+pad,z0:minZ-pad,z1:maxZ+pad};
})();
function localBoundsProbe(){
  let checked=0, outside=0, worst=0, skipped=0, worstName=null;
  for(const m of ISLAND_MESHES){
    const c=m.userData.copy;
    if(c===undefined||c<0){ skipped++; continue; }
    if(m.isInstancedMesh||m.isPoints){ skipped++; continue; }
    const g=m.geometry, pos=g&&g.getAttribute('position');
    if(!pos||!pos.count){ skipped++; continue; }
    const T=XFORMS[c];
    const step=Math.max(1,Math.floor(pos.count/500));
    for(let i=0;i<pos.count;i+=step){
      const l=T.inv(pos.getX(i),pos.getZ(i));
      const over=Math.max(LOCAL_BOUND.x0-l[0],l[0]-LOCAL_BOUND.x1,
                          LOCAL_BOUND.z0-l[1],l[1]-LOCAL_BOUND.z1,0);
      checked++;
      if(over>worst){ worst=over; worstName=m.name; }
      if(over>1.0) outside++;
    }
  }
  return {checked,outside,skipped,worstOverM:Math.round(worst*100)/100,worstMesh:worstName};
}

      seated:{lowered:GROUND_STAT.lowered,raised:GROUND_STAT.raised,unseatable:GROUND_STAT.culled}};
  },
  markDebug(){ markProvenance('debug'); return RUN.provenance; },
  setDbg(x,y,z){ WL.uDbg.value.set(x,y,z); return WL.uDbg.value.toArray(); },
  setTrack(v){ WL.uTrack.value=v; return v; },
  // How much of the island actually reaches the common end of the
  // valley->common turf transition. open = 1 - enc*2.4 is steep enough that a
  // tenth of residual enclosure costs a quarter of the shift.
  openProbe(){
    const rows=[];
    for(let s=10;s<L_ISL;s+=10){
      const enc=enclosureAt(s);
      rows.push({s:Math.round(s),enc:+enc.toFixed(3),open:+clamp(1-enc*2.4,0,1).toFixed(3)});
    }
    const o=rows.map(r=>r.open).sort((a,b)=>a-b);
    const q=(t)=>o[clamp(Math.floor(t*(o.length-1)),0,o.length-1)];
    return { samples:rows.length, p10:q(0.1), p50:q(0.5), p90:q(0.9),
      fracFullyOpen:+(o.filter(v=>v>0.95).length/o.length).toFixed(3),
      fracHalfOrLess:+(o.filter(v=>v<=0.5).length/o.length).toFixed(3),
      profile:rows.filter((_,i)=>i%12===0).map(r=>[r.s,r.open]) };
  },
  // What is actually resident, by distance from the road. The middle distance
  // is a band, not a vibe: if it is empty this says so in objects per km.
  densityProbe(){
    const B=[[0,10],[10,30],[30,60],[60,100],[100,200],[200,400]];
    const bi=(d)=>{ for(let i=0;i<B.length;i++) if(d>=B[i][0]&&d<B[i][1]) return i; return -1; };
    const grove=B.map(()=>0), form=B.map(()=>0);
    // and the same again for the OPEN MIDDLE only — the aggregate is dominated
    // by the two wooded ends, which is not where the frames were taken
    const isOpen=(s)=>clamp(1-enclosureAt(clamp(s,0,L_ISL))*2.4,0,1)>0.95;
    const gOpen=B.map(()=>0), fOpen=B.map(()=>0);
    let openM=0; for(let s=0;s<L_ISL;s+=5) if(isOpen(s)) openM+=5;
    for(const t of TREES){ if(t.unseatable) continue; const i=bi(t.d); if(i<0) continue;
      if(t.formation) form[i]++; else grove[i]++;
      if(isOpen(t.s)){ if(t.formation) fOpen[i]++; else gOpen[i]++; } }
    const rel=B.map(()=>({n:0,s:0,q:0}));
    for(let s=40;s<L_ISL-40;s+=25){
      const fr=getFrame(LFRAME,clamp(s,0,LFRAME.len-1));
      for(const sd of [1,-1]) for(let u=6;u<400;u+=8){
        const i=bi(u); if(i<0) continue;
        const x=fr.x+fr.lx*u*sd, z=fr.z+fr.lz*u*sd;
        const h=realizedGroundL(x,z)-fr.y;
        rel[i].n++; rel[i].s+=h; rel[i].q+=h*h;
      }
    }
    const km=L_ISL/1000;
    return B.map((b,i)=>{
      const m=rel[i].s/Math.max(1,rel[i].n);
      return { band:b[0]+'-'+b[1]+'m', groveTrees:grove[i], formationTrees:form[i],
        objectsPerKm:+(((grove[i]+form[i]))/km).toFixed(1),
        openMiddleObjects:gOpen[i]+fOpen[i],
        openMiddlePerKm:+(((gOpen[i]+fOpen[i]))/Math.max(0.001,openM/1000)).toFixed(1),
        reliefStdM:+Math.sqrt(Math.max(0,rel[i].q/Math.max(1,rel[i].n)-m*m)).toFixed(2) };
    });
  },
  // Is the mid-distance stone pass actually firing? It is gated on thin soil,
  // and a gate is a claim about a distribution nobody has looked at.
  thinBandProbe(){
    const out=[];
    for(const band of [[10,30],[34,60],[60,90],[90,118]]){
      const v=[];
      for(let s=40;s<L_ISL-40;s+=13){
        if(clamp(1-enclosureAt(clamp(s,0,L_ISL))*2.4,0,1)<0.9) continue;
        const fr=getFrame(LFRAME,clamp(s,0,LFRAME.len-1));
        for(const sd of [1,-1]) for(let u=band[0];u<band[1];u+=9){
          const x=fr.x+fr.lx*u*sd, z=fr.z+fr.lz*u*sd;
          const sl=Math.abs(groundL(x+2.5,z)-groundL(x-2.5,z))/5+Math.abs(groundL(x,z+2.5)-groundL(x,z-2.5))/5;
          v.push(thinSoilL(x,z,sl));
        }
      }
      v.sort((a,b)=>a-b);
      const q=(t)=>v[clamp(Math.floor(t*(v.length-1)),0,v.length-1)];
      out.push({band:band[0]+'-'+band[1]+'m', n:v.length,
        p50:+q(0.5).toFixed(3), p75:+q(0.75).toFixed(3), p90:+q(0.9).toFixed(3),
        fracOver40:+(v.filter(x=>x>0.40).length/v.length).toFixed(3),
        fracOver16:+(v.filter(x=>x>0.16).length/v.length).toFixed(3)});
    }
    return out;
  },
  // The far masses, measured rather than inferred: what the authored geometry
  // and colour actually carry before fog and lighting get to them.
  farMassProbe(){
    if(!FAR_MASS_MESH) return null;
    const g=FAR_MASS_MESH.geometry;
    const c=g.getAttribute('color'), p=g.getAttribute('position'), n=g.getAttribute('normal');
    const L=[], NY=[];
    for(let i=0;i<c.count;i++){
      L.push(0.2126*c.getX(i)+0.7152*c.getY(i)+0.0722*c.getZ(i));
      if(n) NY.push(Math.abs(n.getY(i)));
    }
    L.sort((a,b)=>a-b);
    const q=(t)=>L[clamp(Math.floor(t*(L.length-1)),0,L.length-1)];
    return { triangles:Math.floor(p.count/3), vertices:c.count,
      lumP10:+q(0.1).toFixed(4), lumP50:+q(0.5).toFixed(4), lumP90:+q(0.9).toFixed(4),
      authoredSpread:+(q(0.9)-q(0.1)).toFixed(4),
      authoredRatio:+(q(0.9)/Math.max(1e-4,q(0.1))).toFixed(2),
      meanAbsNormalY:+(NY.reduce((a,b)=>a+b,0)/Math.max(1,NY.length)).toFixed(3),
      fogNear:scene.fog?scene.fog.near:null, fogFar:scene.fog?scene.fog.far:null,
      note:'authored vertex colour only; fog and the far material self-lit term act after this' };
  },
  localBounds(){ return localBoundsProbe(); },
  groundWalk(s,u0,u1,step){
    const T=XFORMS[0], fr=getFrame(LFRAME,clamp(s,0,LFRAME.len-1));
    const out=[];
    for(let u=u0;u<=u1;u+=(step||4)){
      const w=T.fwd(fr.x+fr.lx*u,fr.z+fr.lz*u);
      out.push([u,+groundW(w[0],w[1]).toFixed(2)]);
    }
    let jump=0, at=null;
    for(let i=1;i<out.length;i++){ const d=Math.abs(out[i][1]-out[i-1][1]);
      if(d>jump){ jump=d; at=out[i][0]; } }
    return {maxStepM:+jump.toFixed(2), atU:at, profile:out};
  },
  // The keeper's fork-integrity question, asked of this island's flanks: is
  // there drawn ground everywhere, and is any of it drawn twice? Rays are fired
  // straight down at the scene the renderer is actually holding, rather than
  // asking the code what it believes. A lone ray slipping between two triangles
  // is invisible; a contiguous block of them is a window onto the sky, and a
  // percentage cannot tell the two apart — so the biggest CONNECTED group of
  // misses is reported alongside the count.
  surfaceIntegrity(step,reach){
    const st=step||16, rr=reach||(ISLAND_REACH+300);
    const targets=terrainMeshes.concat(corridorMeshes).filter(m=>m.geometry);
    const ray=new THREE.Raycaster(); ray.far=5000;
    const T=XFORMS[0];
    const dir=new THREE.Vector3(0,-1,0), org=new THREE.Vector3();
    const cols=Math.floor(rr*2/st)+1;
    const rows=[];
    let samples=0, misses=0, multi=0, maxGap=0, worst=null;
    for(let s=6;s<LFRAME.len-6;s+=st*2){
      const fr=getFrame(LFRAME,s);
      const row=[];
      for(let j=0;j<cols;j++){
        const u=-rr+j*st;
        const w=T.fwd(fr.x+fr.lx*u,fr.z+fr.lz*u);
        org.set(w[0],T.fwdY(fr.y)+700,w[1]);
        ray.set(org,dir);
        const hits=ray.intersectObjects(targets,false);
        samples++;
        if(!hits.length){ misses++; row.push(1); }
        else {
          row.push(0);
          if(hits.length>1){
            const gap=hits[1].distance-hits[0].distance;
            if(gap>0.25) multi++;
            if(gap>maxGap){ maxGap=gap; worst={s:Math.round(s),u:Math.round(u),gapM:Math.round(gap*100)/100}; }
          }
        }
      }
      rows.push(row);
    }
    // largest connected block of misses, four-connected
    let biggest=0;
    const H=rows.length, W=cols, seen=rows.map(r=>r.map(()=>0));
    for(let i=0;i<H;i++) for(let j=0;j<W;j++){
      if(!rows[i][j]||seen[i][j]) continue;
      let n=0; const stack=[[i,j]]; seen[i][j]=1;
      while(stack.length){
        const [a,b]=stack.pop(); n++;
        for(const [da,db] of [[1,0],[-1,0],[0,1],[0,-1]]){
          const p=a+da, q=b+db;
          if(p<0||q<0||p>=H||q>=W||seen[p][q]||!rows[p][q]) continue;
          seen[p][q]=1; stack.push([p,q]);
        }
      }
      if(n>biggest) biggest=n;
    }
    return {samples,misses,largestConnectedMiss:biggest,
      doubleDrawnSamples:multi,maxSurfaceGapM:Math.round(maxGap*100)/100,worst,
      stepM:st,reachM:rr,meshes:targets.length};
  },
  contrast(){ return {seamContrast:VAL.roadContrastRatio, roadLum:VAL.roadLum,
    groundLumMedian:VAL.groundLumMedian, groundLumP95:VAL.groundLumP95,
    roadOverGroundMedian:VAL.roadOverGroundMedian, roadOverGroundP95:VAL.roadOverGroundP95,
    stoneLitLum:VAL.stoneLitLum}; },
  // the divide, the grooves and the green way, in numbers
  partingProbe(){
    const fr=getFrame(LFRAME,clamp(DIVIDE.g,0,LFRAME.len-1));
    const prof=[];
    for(let u=-240;u<=240;u+=20){
      const x=fr.x+fr.lx*u, z=fr.z+fr.lz*u;
      prof.push([u,+(groundL(x,z)-fr.y).toFixed(2)]);
    }
    // how wide the wedge is, walked out from the junction
    const wedge=[];
    for(let a=20;a<=Math.min(340,DROVE.len);a+=40){
      const t=clamp(a/Math.max(1,DROVE.len),0,0.999), seg=DROVE.pts.length-1;
      const fi=t*seg, i0=Math.floor(fi), ft=fi-i0;
      const p=DROVE.pts[i0], q=DROVE.pts[Math.min(seg,i0+1)];
      const px=lerp(p[0],q[0],ft), pz=lerp(p[1],q[1],ft);
      wedge.push({alongM:a, roadGapM:+routeInfoL(px,pz).d.toFixed(1)});
    }
    return {
      divide:{halfWidthM:+DIVIDE.halfW.toFixed(1), fallM:+DIVIDE.h.toFixed(1),
        aspect:+(DIVIDE.halfW/DIVIDE.h).toFixed(1), obliquityDeg:+(DIVIDE.obl*180/Math.PI).toFixed(1),
        maxLateralSlopePct:VAL.maxLateralSlopePct, maxLateralSlopeAt:VAL.maxLateralSlopeAt},
      crossSectionAtCrest:prof,
      grooves:GROOVES.map(G=>({depthM:+G.depth.toFixed(1),widthM:+G.w.toFixed(0),
        headRoadDistM:+routeInfoL(G.hx,G.hz).d.toFixed(1),
        minRoadDistM:+(()=>{ let m=1e9; for(const p of G.pts) m=Math.min(m,routeInfoL(p[0],p[1]).d); return m; })().toFixed(1)})),
      grooveHeadsApartM:+Math.hypot(GROOVES[0].hx-GROOVES[1].hx,GROOVES[0].hz-GROOVES[1].hz).toFixed(1),
      drove:{atM:Math.round(DROVE.g),lengthM:Math.round(DROVE.len),side:DROVE.side,
        widthM:+DROVE.w.toFixed(2),sinkM:+DROVE.sink.toFixed(2),wedge},
      fallSide:S_FALL,
    };
  },
  // A3: raycast the SILHOUETTE, not an offset above the ground. For every
  // thorn, walk the road and ask whether the crown itself clears the ground
  // between it and the eye — at the height the crown actually is.
  silhouetteProbe(){
    const T=XFORMS[0];
    const out=[];
    for(const t of TREES){
      if(t.formation!=='wind-sisters'&&t.formation!=='fork-wedge') continue;
      if(t.unseatable||t.y===undefined) continue;
      const cr=1.9*t.scl, cy=t.y+4.6*t.scl;
      let bestFrames=0, firstAt=null, lastAt=null;
      for(let s=Math.max(4,t.s-320);s<Math.min(LFRAME.len-4,t.s+140);s+=10){
        const fr=getFrame(LFRAME,s);
        const ew=T.fwd(fr.x+fr.lx*0.9,fr.z+fr.lz*0.9);
        const eye={x:ew[0],y:T.fwdY(fr.y)+EYE_H,z:ew[1]};
        let clear=false;
        for(const dx of [-cr,0,cr]){
          const w=T.fwd(t.x+dx*0.7,t.z);
          const tx=w[0], ty=T.fwdY(cy), tz=w[1];
          let blocked=false;
          for(let f=0.06;f<0.97&&!blocked;f+=0.03){
            const px=lerp(eye.x,tx,f), pz=lerp(eye.z,tz,f);
            if(groundW(px,pz)>lerp(eye.y,ty,f)+0.30) blocked=true;
          }
          if(!blocked){ clear=true; break; }
        }
        if(clear){ bestFrames++; if(firstAt===null) firstAt=Math.round(s); lastAt=Math.round(s); }
      }
      out.push({formation:t.formation, atM:Math.round(t.s), roadDistM:+t.d.toFixed(1),
        scl:+t.scl.toFixed(2), visibleStations:bestFrames,
        firstVisibleAtM:firstAt, lastVisibleAtM:lastAt,
        visibleRoadM:(firstAt===null)?0:(lastAt-firstAt)});
    }
    return {thorns:out, everInvisible:out.filter(o=>o.visibleStations===0).length};
  },
  // the long view off the falling side, station by station
  browProbe(){
    const T=XFORMS[0];
    const out=[];
    for(let s=movStart('brow')-80;s<movEnd('brow')+80;s+=40){
      const fr=getFrame(LFRAME,clamp(s,0,LFRAME.len-1));
      const ew=T.fwd(fr.x+fr.lx*0.9,fr.z+fr.lz*0.9);
      const eyeY=T.fwdY(fr.y)+EYE_H;
      let reach=0, dropAt200=0;
      for(let r=40;r<=1000;r+=20){
        const w=T.fwd(fr.x+fr.lx*S_FALL*r,fr.z+fr.lz*S_FALL*r);
        if(groundW(w[0],w[1])>eyeY) break;
        reach=r;
        if(r===200) dropAt200=+(T.fwdY(fr.y)-groundW(w[0],w[1])).toFixed(1);
      }
      out.push({atM:Math.round(s), eyeReachM:reach, dropAt200M:dropAt200});
    }
    return {stations:out, maxReachM:Math.max.apply(null,out.map(o=>o.eyeReachM)),
      fallSide:S_FALL};
  },};

window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
