<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Summerglass Island 02 — The High Parting</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#5EC2E8; }
  canvas { display:block; }
  #hint {
    position:fixed; left:14px; bottom:12px; user-select:none; pointer-events:none;
    color:#F2E3BC; text-shadow:0 1px 3px rgba(22,52,44,0.6);
    font:14px system-ui, sans-serif; letter-spacing:0.02em; opacity:0.9; z-index:9;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="hint">W/S ride &middot; A/D drift &middot; drag to look &middot; Space pause &middot; R restart</div>
<script type="module">
import * as THREE from 'three';
// ============================================================
// SUMMERGLASS ISLAND 02 — THE HIGH PARTING
// The road leaves the soil. A bounded, composable segment where
// the country changes register without changing season: out of
// enclosed lowland through one last gate onto thin grazed ground
// over stone, up onto the broad shoulder of a divide, past the
// place where an old green way parts from the metalled road and
// goes down the far side, along the brow with the land falling
// away and the weather running over it, and down at last to the
// first soil. No standing water anywhere: on a watershed the
// water has already gone, and its absence is the subject.
//
// Two stages, as in the keeper: the PLAN freezes the island's
// identity from its seed, entirely in the local frame, before
// either the quality tier or the placement is read; the
// REALIZATION spends geometry on it at the chosen quality,
// through whatever rigid transform the host hands down.
//
// The machinery below is island 01's on purpose — welded tubes,
// shaded cloud bases, height declared against the road, seating,
// residency, the swept budget harness. The PLACE is new from the
// ground up: no station, motif or composition survives the combe.
// ============================================================

const capturedErrors=[];
window.addEventListener('error',(e)=>{ capturedErrors.push(String(e.message||e)); });
window.addEventListener('unhandledrejection',(e)=>{ capturedErrors.push('rejection: '+String((e.reason&&e.reason.message)||e.reason)); });
// three.js reports shader compile failures through console.error, which is not
// a page error — capture those too, or the proof would miss a broken material
{
  const orig=console.error.bind(console);
  console.error=(...args)=>{ try{
    const s=args.map(a=>String(a)).join(' ');
    if(/shader|program|webgl/i.test(s)) capturedErrors.push('console: '+s.slice(0,180));
  }catch(e){} orig(...args); };
}

// ---------- island identity, quality, placement ----------
const qs=new URLSearchParams(location.search);
const ISLAND_ID='summerglass-island-02';
const SEED_TEXT=(qs.get('iseed')&&qs.get('iseed').length)?qs.get('iseed'):'PARTING-3311';
// the tier and the placement are not read until the plan is frozen; both
// counters record when they first were, and the plan records what it saw
let QUALITY_READS=0, QUALITY_READS_AT_PLAN=-1;
let PLACEMENT_READS=0, PLACEMENT_READS_AT_PLAN=-1;
const QUALITY=(()=>{ const q=(qs.get('quality')||'standard').toLowerCase();
  return (q==='low'||q==='high')?q:'standard'; })();
const readQuality=()=>{ QUALITY_READS++; return QUALITY; };
const PLACEMENT_RAW={
  headingDeg:(()=>{ const v=parseFloat(qs.get('heading')); return isFinite(v)?v:0; })(),
  entryGradePct:(()=>{ const v=parseFloat(qs.get('egrade')); return isFinite(v)?Math.max(-2,Math.min(2,v)):0; })(),
  copies:(qs.get('copies')==='2')?2:1,
};
const readPlacement=()=>{ PLACEMENT_READS++; return PLACEMENT_RAW; };

function xmur3(str){ let h=1779033703^str.length;
  for(let i=0;i<str.length;i++){ h=Math.imul(h^str.charCodeAt(i),3432918353); h=(h<<13)|(h>>>19); }
  return ()=>{ h=Math.imul(h^(h>>>16),2246822507); h=Math.imul(h^(h>>>13),3266489909); return (h^=h>>>16)>>>0; };
}
const SEED_HASH=xmur3(ISLAND_ID+'::'+SEED_TEXT)();
function mb32(a){ return ()=>{ a|=0; a=(a+0x6D2B79F5)|0;
  let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
function streamFrom(f){
  return {
    f, r:(a,b)=>a+(b-a)*f(), i:(a,b)=>Math.floor(a+(b-a+1)*f()),
    chance:(p)=>f()<p, pick:(arr)=>arr[Math.floor(f()*arr.length)],
    gauss:()=>{ let s=0; for(let k=0;k<4;k++) s+=f(); return (s-2)*0.72; },
  };
}
// named, independent streams on the island's own seed channel — a change in
// one can never perturb another
function makeStream(name){ return streamFrom(mb32(xmur3(ISLAND_ID+'::'+SEED_TEXT+'::'+name)())); }
// positional sub-stream: identity depends on (islandId, seed, name, ids) only,
// never on realization order — so an object is the same object every time the
// band re-enters residency, and the same object under every placement
function subStream(name,...ids){ return streamFrom(mb32(xmur3(ISLAND_ID+'::'+SEED_TEXT+'::'+name+'#'+ids.join(','))())); }

const ROUTE=makeStream('plan/route'), ELEV=makeStream('plan/elevation'),
      LANDF=makeStream('plan/landform'), STONE=makeStream('plan/stone'),
      GROVE=makeStream('plan/groves'), ECO=makeStream('plan/ecology'),
      FORM=makeStream('plan/formations'), LIFE=makeStream('plan/life'),
      CLOUD=makeStream('host/clouds');

// ---------- hashes ----------
function fnv(){ let h=0x811C9DC5; return {
  feed(...vals){ for(const v of vals){ const s=(typeof v==='number')?(Math.abs(v)<1e-7?'0.0000':v.toFixed(4)):String(v);
    for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,0x01000193); } } },
  hex(){ return (h>>>0).toString(16).padStart(8,'0'); } }; }
const H={ route:fnv(), elev:fnv(), terrain:fnv(), eco:fnv(), life:fnv(), plan:fnv(), real:fnv() };

// ---------- palette: the keeper's eight colours, one summer ----------
const PAL={
  sky:0x5EC2E8, cloud:0xFFFBEF, sunGrass:0xC3E56A, meadow:0x74B851,
  leafShade:0x3C7A55, woodDeep:0x1B4239, bark:0x6B4A34, road:0xE9DCB4,
  blossom:0xEBAFB9,
};
const EYE_H=1.86, PITCH_BIAS=0.052;
const col=(h)=>new THREE.Color(h);
const mixc=(a,b,t)=>col(a).lerp(col(b),t);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,v)=>{ const t=clamp((v-a)/(b-a||1e-6),0,1); return t*t*(3-2*t); };
const TAU=Math.PI*2;
const lumOf=(c)=>0.2126*c.r+0.7152*c.g+0.0722*c.b;

// ---------- frozen value noise (island-local: sampled in LOCAL coordinates
// only, so the land is the same land under every placement) ----------
function noiseTable(stream){ const T=new Float32Array(1024); for(let i=0;i<1024;i++) T[i]=stream.f(); return T; }
function makeNoise2(T){
  const hash=(x,y)=>{ let n=(x*374761393+y*668265263)|0; n=(n^(n>>>13))|0; n=Math.imul(n,1274126177); return T[((n^(n>>>16))>>>0)&1023]; };
  return (x,y)=>{
    const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
    const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
    return lerp(lerp(hash(xi,yi),hash(xi+1,yi),u),lerp(hash(xi,yi+1),hash(xi+1,yi+1),u),v);
  };
}
const nLand=makeNoise2(noiseTable(LANDF)), nEco=makeNoise2(noiseTable(ECO));
function fbmL(x,y){ return nLand(x,y)*0.53+nLand(x*2.07+7.7,y*2.07+3.1)*0.29+nLand(x*4.31+17.9,y*4.31+11.3)*0.18; }
function fbmE(x,y){ return nEco(x,y)*0.62+nEco(x*2.51+5.1,y*2.51+9.7)*0.38; }

// ============================================================
// PLAN — MOVEMENTS
// Five movements over roughly two kilometres. The shape is a
// one-way crossing, not a loop of interest: enclosed country is
// left through one gate and never returns until the very end, and
// what happens between is the ground changing under the road.
// ============================================================
const CRUISE=10.0;
const L_ISL=ROUTE.r(1890,2050);
const MOV=[
  {key:'gate',    name:'The Last Gate',  end:0.14},
  {key:'thin',    name:'Thin Ground',    end:0.37},
  {key:'parting', name:'The Parting',    end:0.58},
  {key:'brow',    name:'The Long Brow',  end:0.81},
  {key:'soil',    name:'The First Soil', end:1.0},
];
for(let i=0;i<MOV.length-1;i++) MOV[i].end=clamp(MOV[i].end+ROUTE.r(-0.012,0.012),(i?MOV[i-1].end:0)+0.06,0.96);
const MOVS={}; for(const m of MOV) MOVS[m.key]=m.end*L_ISL;
const movEnd=(k)=>MOVS[k];
const movStart=(k)=>{ const i=MOV.findIndex(m=>m.key===k); return i?MOV[i-1].end*L_ISL:0; };
function movementOf(s){ const f=clamp(s,0,L_ISL)/L_ISL;
  for(const m of MOV) if(f<=m.end) return m.name; return MOV[MOV.length-1].name; }
H.route.feed(L_ISL); for(const m of MOV) H.route.feed(m.end);

const GRADE_CAP=0.066;
const MIN_RADIUS=158;
const SDS=2;

// ============================================================
// PLAN — CENTRELINE (LOCAL)
// Entry at the local origin, tangent along +Z. Curvature is three broad
// composed bows — out along the rows, back around the pool, out again on
// the climb — plus a small seeded wobble, faded at both ends so the
// boundary tangents are exact.
// ============================================================
// The road does not wander here. A road on open high ground goes
// where the ground lets it: one long working turn as it climbs onto
// the shoulder, a straight run over the parting where the ground is
// level enough not to argue, and a slow lean back along the brow.
// Three bows, but the middle of the island is deliberately the
// straightest part of it — the crest is where the LAND turns.
const BOWS=[];
{
  const b=(s0,s1,deg)=>BOWS.push({s0,s1,a:(deg*Math.PI/180)/((s1-s0)*2/Math.PI)});
  const j=(lo,hi)=>ROUTE.r(lo,hi);
  b(j(150,200), j(880,950),  j(46,58));     // the working turn onto the shoulder
  b(j(1180,1240),j(1560,1620),-j(20,28));   // the lean back along the brow
  b(j(1620,1680),j(1880,1940), j(10,16));   // straightening for the handover
  for(const w of BOWS) H.route.feed(w.s0,w.s1,w.a);
}
const WOB={ wl:ROUTE.r(420,560), a:1/ROUTE.r(2600,3800), ph:ROUTE.r(0,TAU) };
H.route.feed(WOB.wl,WOB.a,WOB.ph);
// the opening is composed, not sampled: the road bends away inside the first
// two hundred metres so the gate arrives as a discovery and not as an
// announcement — and beyond the gate the ground has already begun to fall
// out of the sight line, so what shows through it is sky.
// Its own stream, so it can never perturb what was already planned.
const OPENING=makeStream('plan/opening');
const OPEN_BOW=(OPENING.chance(0.5)?1:-1)/OPENING.r(360,450);
H.route.feed(OPEN_BOW);
function curvatureAt(s){
  let k=0;
  for(const w of BOWS){
    if(s<w.s0||s>w.s1) continue;
    k+=w.a*Math.sin(Math.PI*(s-w.s0)/(w.s1-w.s0));
  }
  k+=OPEN_BOW*Math.sin(Math.PI*clamp((s-16)/225,0,1));
  k+=WOB.a*Math.sin(TAU*s/WOB.wl+WOB.ph)*smooth(40,180,s)*(1-smooth(L_ISL-180,L_ISL-40,s));
  return k;
}

// ============================================================
// PLAN — ELEVATION (LOCAL)
// One long climb onto the divide, a short drop off its crest, and
// then a level brow that hands the road on still high. The exit is
// NOT a plunge — the boundary contract will not carry one — so the
// descent is stated by the country falling away beside the road
// rather than by the road falling. Grades are zero at both ends by
// construction; the keeper's grade cap and vertical easing apply.
//
// It is also deliberately smoother than the combe. Rollers are the
// signature of soft deep ground; on thin ground over rock the road
// takes what the rock gives it and the surface reads long.
// ============================================================
const ELEV_P={
  lift:ELEV.r(13.0,15.6), climb:ELEV.r(15.0,18.0), off:ELEV.r(12.0,14.4),
  r1:[ELEV.r(100,140),ELEV.r(580,640)], r2:[ELEV.r(620,680),ELEV.r(1030,1090)],
  r3:[ELEV.r(1180,1240),ELEV.r(1580,1650)],
};
const ROLLERS=[
  {wl:ELEV.r(430,520),a:ELEV.r(0.50,0.85),ph:ELEV.r(0,TAU)},
];
H.elev.feed(ELEV_P.lift,ELEV_P.climb,ELEV_P.off);
for(const r of ROLLERS) H.elev.feed(r.wl,r.a,r.ph);
function baseElev(s){
  let y=ELEV_P.lift*smooth(ELEV_P.r1[0],ELEV_P.r1[1],s)
       +ELEV_P.climb*smooth(ELEV_P.r2[0],ELEV_P.r2[1],s)
       -ELEV_P.off*smooth(ELEV_P.r3[0],ELEV_P.r3[1],s);
  const fade=smooth(30,170,s)*(1-smooth(L_ISL-170,L_ISL-30,s));
  for(const r of ROLLERS) y+=r.a*Math.sin(TAU*s/r.wl+r.ph)*fade;
  return y;
}
function blurArray(y,passes){
  const n=y.length, t=new Float32Array(n);
  for(let p=0;p<passes;p++){
    t[0]=y[0]; t[n-1]=y[n-1];
    for(let i=1;i<n-1;i++) t[i]=(y[i-1]+y[i]*2+y[i+1])*0.25;
    y.set(t);
  }
}
const EDS=2;
const ELEVATION=(()=>{
  const n=Math.ceil(L_ISL/EDS)+1;
  const y=new Float32Array(n);
  for(let i=0;i<n;i++) y[i]=baseElev(i*EDS);
  for(let i=1;i<n;i++){ const d=y[i]-y[i-1], m=GRADE_CAP*EDS;
    if(d> m) y[i]=y[i-1]+m; else if(d<-m) y[i]=y[i-1]-m; }
  for(let i=n-2;i>=0;i--){ const d=y[i]-y[i+1], m=GRADE_CAP*EDS;
    if(d> m) y[i]=y[i+1]+m; else if(d<-m) y[i]=y[i+1]-m; }
  blurArray(y,44);
  let asc=0,desc=0,maxG=0;
  for(let i=1;i<n;i++){ const d=y[i]-y[i-1];
    if(d>0) asc+=d; else desc-=d;
    maxG=Math.max(maxG,Math.abs(d)/EDS); }
  return {y,asc,desc,maxG,n};
})();
function spineY(s){
  const i=clamp(s/EDS,0,ELEVATION.n-1), i0=Math.floor(i), t=i-i0, i1=Math.min(i0+1,ELEVATION.n-1);
  return lerp(ELEVATION.y[i0],ELEVATION.y[i1],t);
}
H.elev.feed(ELEVATION.asc,ELEVATION.desc,ELEVATION.maxG);

// ---------- the local spine walk: entry at origin, tangent +Z ----------
const NS=Math.ceil(L_ISL/SDS)+1;
const spine={x:new Float32Array(NS),y:new Float32Array(NS),z:new Float32Array(NS),hd:new Float32Array(NS)};
{
  let x=0,z=0,hd=0;
  for(let i=0;i<NS;i++){
    const s=i*SDS;
    spine.x[i]=x; spine.z[i]=z; spine.y[i]=spineY(s); spine.hd[i]=hd;
    const k=curvatureAt(s+SDS*0.5);
    hd+=k*SDS;
    x+=Math.sin(hd)*SDS; z+=Math.cos(hd)*SDS;
    if((i%32)===0) H.route.feed(x,z,spine.y[i]);
  }
}
function spineAt(s){
  const i=clamp(s/SDS,0,NS-1), i0=Math.floor(i), t=i-i0, i1=Math.min(i0+1,NS-1);
  return { x:lerp(spine.x[i0],spine.x[i1],t), y:lerp(spine.y[i0],spine.y[i1],t),
           z:lerp(spine.z[i0],spine.z[i1],t), hd:lerp(spine.hd[i0],spine.hd[i1],t) };
}

// ---------- frame table: 2 m arc-length samples, eight channels, matching
// the keeper exactly: x, y, z, tx, tz, lx, lz, k ----------
function framesFromPoints(pts){
  const RS=2;
  const X=[],Y=[],Z=[];
  let prev=pts[0], acc=0, target=0;
  X.push(prev[0]); Y.push(prev[1]); Z.push(prev[2]);
  for(let i=1;i<pts.length;i++){
    const p=pts[i], d=Math.hypot(p[0]-prev[0],p[2]-prev[2]);
    if(d<1e-7) continue;
    while(target+RS<=acc+d){ target+=RS; const t=(target-acc)/d;
      X.push(lerp(prev[0],p[0],t)); Y.push(lerp(prev[1],p[1],t)); Z.push(lerp(prev[2],p[2],t)); }
    acc+=d; prev=p;
  }
  const F={x:Float32Array.from(X),y:Float32Array.from(Y),z:Float32Array.from(Z),RS};
  F.N=F.x.length-1; F.len=F.N*RS;
  const tmp=new Float32Array(F.N+1);
  const blur=(arr,passes)=>{ for(let p=0;p<passes;p++){
    tmp[0]=arr[0]; tmp[F.N]=arr[F.N];
    for(let i=1;i<F.N;i++) tmp[i]=(arr[i-1]+arr[i]*2+arr[i+1])*0.25;
    arr.set(tmp); } };
  blur(F.x,5); blur(F.z,5); blur(F.y,40);
  F.tx=new Float32Array(F.N+1); F.tz=new Float32Array(F.N+1);
  F.lx=new Float32Array(F.N+1); F.lz=new Float32Array(F.N+1); F.k=new Float32Array(F.N+1);
  for(let i=0;i<=F.N;i++){
    const i0=Math.max(0,i-1), i1=Math.min(F.N,i+1);
    let tx=F.x[i1]-F.x[i0], tz=F.z[i1]-F.z[i0];
    const L=Math.hypot(tx,tz)||1; tx/=L; tz/=L;
    F.tx[i]=tx; F.tz[i]=tz; F.lx[i]=tz; F.lz[i]=-tx;
  }
  for(let i=1;i<F.N;i++){
    const cr=F.tx[i-1]*F.tz[i+1]-F.tz[i-1]*F.tx[i+1];
    F.k[i]=cr/(2*RS);
  }
  return F;
}
function getFrame(F,s){
  s=clamp(s,0,F.len-0.001);
  const i=s/F.RS, i0=Math.floor(i), t=i-i0, i1=Math.min(i0+1,F.N);
  return { x:lerp(F.x[i0],F.x[i1],t), y:lerp(F.y[i0],F.y[i1],t), z:lerp(F.z[i0],F.z[i1],t),
    tx:lerp(F.tx[i0],F.tx[i1],t), tz:lerp(F.tz[i0],F.tz[i1],t),
    lx:lerp(F.lx[i0],F.lx[i1],t), lz:lerp(F.lz[i0],F.lz[i1],t), k:lerp(F.k[i0],F.k[i1],t) };
}
const LFRAME=(()=>{
  const pts=[];
  for(let s=0;s<=L_ISL;s+=SDS){ const p=spineAt(s); pts.push([p.x,p.y,p.z]); }
  return framesFromPoints(pts);
})();
H.route.feed(LFRAME.len);

// declared boundary poses, measured on the built frames rather than assumed
const ENTRY_POSE=(()=>{
  const a=getFrame(LFRAME,0), b=getFrame(LFRAME,6);
  return { x:0,y:0,z:0, headingRad:Math.atan2(a.tx,a.tz), gradePct:(b.y-a.y)/6*100 };
})();
const EXIT_POSE=(()=>{
  const a=getFrame(LFRAME,LFRAME.len-6.01), b=getFrame(LFRAME,LFRAME.len-0.01);
  return { x:b.x,y:b.y,z:b.z, headingRad:Math.atan2(b.tx,b.tz), gradePct:(b.y-a.y)/6*100 };
})();
const HEADING_STAT=(()=>{
  let maxAbs=0;
  for(let i=0;i<=LFRAME.N;i++){
    const h=Math.atan2(LFRAME.tx[i],LFRAME.tz[i]);
    maxAbs=Math.max(maxAbs,Math.abs(h));
  }
  return { netDeg:EXIT_POSE.headingRad*180/Math.PI, maxAbsDeg:maxAbs*180/Math.PI };
})();

const ROAD_W=ROUTE.r(4.62,4.94), RH=ROAD_W/2, SHOULDER=3.0, EXCL=RH+SHOULDER;
const APRON=66;
H.route.feed(ROAD_W,ENTRY_POSE.gradePct,EXIT_POSE.gradePct,HEADING_STAT.netDeg);

// ============================================================
// PLAN — ENCLOSURE
// One pulse at the beginning and a much smaller one at the very end.
// Between them the enclosure is ZERO — not "open" but out: no canopy,
// no shade, no shelter, for a kilometre and a half. The long flat
// nothing in the middle of this curve is the island's whole argument,
// and it is the reason nothing else is allowed to be added there.
// ============================================================
const ENC=[];
{
  const E=(s0,s1,peak)=>ENC.push({s0,s1,peak});
  E(-90, movEnd('gate')+ECO.r(6,34), ECO.r(0.62,0.74));            // the last enclosed country
  E(movStart('soil')+ECO.r(60,130), L_ISL+ECO.r(70,140), ECO.r(0.24,0.34)); // the first soil back
  for(const e of ENC) H.eco.feed(e.s0,e.s1,e.peak);
}
function enclosureAt(s){
  let w=0;
  for(const e of ENC){
    const mid=(e.s0+e.s1)*0.5, half=(e.s1-e.s0)*0.5;
    const t=1-clamp(Math.abs(s-mid)/Math.max(1,half),0,1);
    w=Math.max(w,e.peak*(t*t*(3-2*t)));
  }
  return clamp(w,0,1);
}

// ---------- local route field: distance to the LOCAL frames only ----------
const rCell=24, rGridL=new Map();
const rKey=(a,b)=>a*46341+b;
{
  for(let i=0;i<=LFRAME.N;i++){
    const k=rKey(Math.floor(LFRAME.x[i]/rCell),Math.floor(LFRAME.z[i]/rCell));
    let c=rGridL.get(k); if(!c){ c=[]; rGridL.set(k,c); }
    const ia=Math.max(0,i-1), ib=Math.min(LFRAME.N,i+1);
    const slope=(LFRAME.y[ib]-LFRAME.y[ia])/((ib-ia)*LFRAME.RS||1);
    c.push(LFRAME.x[i],LFRAME.y[i],LFRAME.z[i],i*LFRAME.RS,LFRAME.tx[i],LFRAME.tz[i],slope);
  }
}
const _ril={d:0,y:0,s:0,u:0};
function routeInfoL(x,z){
  const gx=Math.floor(x/rCell), gz=Math.floor(z/rCell);
  let bd=1e18,by=0,bs=0,bu=0;
  for(let R=1;R<=14;R++){
    for(let ax=gx-R;ax<=gx+R;ax++) for(let az=gz-R;az<=gz+R;az++){
      if(R>1&&Math.abs(ax-gx)<R&&Math.abs(az-gz)<R) continue;
      const c=rGridL.get(rKey(ax,az)); if(!c) continue;
      for(let i=0;i<c.length;i+=7){
        const dx=x-c[i], dz=z-c[i+2];
        const t=clamp(dx*c[i+4]+dz*c[i+5],-1,1);
        const ex=dx-c[i+4]*t, ez=dz-c[i+5]*t;
        const d=ex*ex+ez*ez;
        if(d<bd){ bd=d; by=c[i+1]+c[i+6]*t; bs=c[i+3]+t;
          const fr=c; bu=(dx*fr[i+5]-dz*fr[i+4]); }
      }
    }
    if(bd<((R-1)*rCell)*((R-1)*rCell)&&R>1) break;
  }
  if(bd>1e17){ _ril.d=999; _ril.y=0; _ril.s=clamp(z,0,L_ISL); _ril.u=999; return _ril; }
  _ril.d=Math.sqrt(bd); _ril.y=by; _ril.s=bs; _ril.u=bu;
  return _ril;
}
// distance from a point to a polyline, in the local frame
function polyDist(pts,x,z){
  let bd=1e18;
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i], b=pts[i+1];
    const abx=b[0]-a[0], abz=b[1]-a[1];
    const t=clamp(((x-a[0])*abx+(z-a[1])*abz)/Math.max(1e-6,abx*abx+abz*abz),0,1);
    const dx=x-(a[0]+abx*t), dz=z-(a[1]+abz*t);
    bd=Math.min(bd,dx*dx+dz*dz);
  }
  return Math.sqrt(bd);
}
// arc length along a polyline to the nearest point on it
function polyAlong(pts,x,z){
  let bd=1e18, best=0, acc=0;
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i], b=pts[i+1];
    const abx=b[0]-a[0], abz=b[1]-a[1];
    const L=Math.hypot(abx,abz);
    const t=clamp(((x-a[0])*abx+(z-a[1])*abz)/Math.max(1e-6,abx*abx+abz*abz),0,1);
    const dx=x-(a[0]+abx*t), dz=z-(a[1]+abz*t);
    const d=dx*dx+dz*dz;
    if(d<bd){ bd=d; best=acc+L*t; }
    acc+=L;
  }
  return best;
}

// ============================================================
// PLAN — THE DIVIDE
// The one big form, and the reason the island exists. A whaleback whose
// crest runs OBLIQUELY across the road: the road climbs its flank, crosses
// the top, and comes down onto the brow of the other side.
//
// A3b, CHECKED AT PLAN TIME, BEFORE ANYTHING IS COMPOSED ON IT:
//   half-width 232-286 m against a 17.0-22.5 m fall is between 10:1 and
//   17:1. At that ratio the crest never presents an edge from the lane and
//   reads as GROUND. Island 01's r~87 m against a 20-26 m rise was ~3.7:1
//   and read as an object standing on the field. This number is WIDE by
//   construction and is never to be reduced: shrinking it would buy back a
//   few thousand triangles and spend the entire skyline break.
//
// Nothing stands on the divide. It is not a pedestal; there is no group of
// trees on its crown; it is not looked AT from a composed viewpoint. It is
// the shape of the ground the road is riding over, and the rider is on it
// for eight hundred metres.
// ============================================================
const DIVIDE=(()=>{
  const g=FORM.r(1040,1120);
  const fr=getFrame(LFRAME,clamp(g,0,LFRAME.len-1));
  const obl=FORM.r(0.50,0.76)*(FORM.chance(0.5)?1:-1);
  return { g, x:fr.x, z:fr.z, dir:Math.atan2(fr.tx,fr.tz)+obl, obl,
    halfW:FORM.r(232,286), h:FORM.r(17.0,22.5),
    farExtra:FORM.r(8.5,13.0), farReach:FORM.r(1.42,1.72),
    farSign:(FORM.chance(0.5)?1:-1),
    lenHalf:FORM.r(720,900), lenFade:FORM.r(300,420) };
})();
H.terrain.feed(DIVIDE.g,DIVIDE.dir,DIVIDE.halfW,DIVIDE.h,DIVIDE.farReach,DIVIDE.farSign);
const _dvC=Math.cos(DIVIDE.dir), _dvS=Math.sin(DIVIDE.dir);
const divideAcross=(x,z)=>(x-DIVIDE.x)*_dvC-(z-DIVIDE.z)*_dvS;
const divideAlong =(x,z)=>(x-DIVIDE.x)*_dvS+(z-DIVIDE.z)*_dvC;
// how far the ground has fallen from the crest at this point
function divideDrop(x,z){
  const al=divideAlong(x,z);
  const env=1-smooth(DIVIDE.lenHalf,DIVIDE.lenHalf+DIVIDE.lenFade,Math.abs(al));
  if(env<=1e-4) return 0;
  const cd=divideAcross(x,z);
  const far=((cd>=0)?1:-1)===DIVIDE.farSign;
  const W=DIVIDE.halfW*(far?DIVIDE.farReach:1);
  const D=DIVIDE.h+(far?DIVIDE.farExtra:0);
  const t=clamp(Math.abs(cd)/W,0,1);
  return D*(t*t*(3-2*t))*env;
}
// the divide read along the road's own line, so the form is expressed as a
// DEPARTURE from the lane rather than as a lump that could sit under it
const DIV_REF=(()=>{
  const n=Math.ceil(L_ISL/20)+1, a=new Float32Array(n);
  for(let i=0;i<n;i++){ const p=spineAt(i*20); a[i]=divideDrop(p.x,p.z); }
  blurArray(a,6);
  return a;
})();
const divRefAt=(s)=>{ const i=clamp(s/20,0,DIV_REF.length-1), i0=Math.floor(i);
  return lerp(DIV_REF[i0],DIV_REF[Math.min(i0+1,DIV_REF.length-1)],i-i0); };
// which side of the road the country falls away on: measured, not chosen
const S_FALL=(()=>{
  const fr=getFrame(LFRAME,clamp(DIVIDE.g,0,LFRAME.len-1));
  let a=0,b=0;
  for(const r of [90,150,210]){
    a+=divideDrop(fr.x+fr.lx*r,fr.z+fr.lz*r);
    b+=divideDrop(fr.x-fr.lx*r,fr.z-fr.lz*r);
  }
  return a>=b?1:-1;
})();
H.terrain.feed('fall',S_FALL);

// ============================================================
// PLAN — THE PARTING
// Two dry drainage lines, heads within a hundred metres of each other on
// the crest, running in OPPOSITE directions down the two flanks. Neither
// carries water in this weather and neither ever will while the rider is
// here; what they carry is the information that from this ridge the water
// leaves two ways. That is the whole reason a watershed is a place.
//
// They are wide and shallow — 34-50 m across, 2.6-3.9 m deep — because a
// groove that reads as a trench reads as excavation. Held well off the
// corridor; neither crosses the road, so there is nothing to bridge.
// ============================================================
const GROOVES=(()=>{
  const out=[];
  const fr=getFrame(LFRAME,clamp(DIVIDE.g,0,LFRAME.len-1));
  for(const sgn of [1,-1]){
    const st=subStream('groove',sgn);
    const hd=DIVIDE.dir+sgn*Math.PI*0.5;            // straight downhill off the crest
    let off=st.r(54,82), hx=0, hz=0;
    for(let k=0;k<30;k++){
      hx=fr.x+Math.sin(hd)*off; hz=fr.z+Math.cos(hd)*off;
      if(routeInfoL(hx,hz).d>EXCL+26) break;
      off+=9;
    }
    const pts=[[hx,hz]];
    let a=hd, px=hx, pz=hz;
    const nseg=st.i(4,5), seg=st.r(76,98);
    for(let i=0;i<nseg;i++){
      a+=st.r(-0.20,0.20);
      px+=Math.sin(a)*seg; pz+=Math.cos(a)*seg;
      pts.push([px,pz]);
    }
    out.push({pts, w:st.r(34,50), depth:st.r(2.6,3.9), sgn, hx, hz});
  }
  for(const G of out){ for(const p of G.pts) H.terrain.feed(p[0],p[1]); H.terrain.feed(G.w,G.depth); }
  return out;
})();
function grooveWeight(x,z){
  let best=0;
  for(const G of GROOVES){
    const gd=polyDist(G.pts,x,z);
    if(gd>G.w) continue;
    best=Math.max(best,1-smooth(G.w*0.26,G.w,gd));
  }
  return best;
}
const grooveNear=(x,z)=>Math.min(polyDist(GROOVES[0].pts,x,z),polyDist(GROOVES[1].pts,x,z));

// ============================================================
// PLAN — THE STONE
// On thin ground the bones show. Outcrop bands follow the contour, which
// on this land is a line parallel to the crest — so a scar is not a shape
// placed on the hill, it is a value of "across the crest" where the rock
// happens to reach the surface. That makes them ground by construction.
//
// A3b: a scar is an EDGE, not a dome. 1.6-3.0 m of step over a 3.5-6.5 m
// transition is a scarp you could stand on; nothing here has a silhouette
// that could be mistaken for a landmark.
// ============================================================
const SCARS=(()=>{
  const out=[];
  const n=STONE.i(5,6);
  for(let i=0;i<n;i++){
    const st=subStream('scar',i);
    // anchored to a station the rider actually passes, then expressed in crest
    // coordinates so the band still follows the contour rather than the road
    const s=lerp(movEnd('gate')+40,L_ISL-140,(i+st.r(0.15,0.85))/n);
    const fr=getFrame(LFRAME,clamp(s,0,LFRAME.len-1));
    const sd=st.chance(0.5)?1:-1;
    const off=st.r(26,96);
    const px=fr.x+fr.lx*off*sd, pz=fr.z+fr.lz*off*sd;
    const cd=divideAcross(px,pz), alm=divideAlong(px,pz);
    const half=st.r(70,150);
    out.push({cd, al0:alm-half, al1:alm+half,
      h:st.r(1.8,3.2), w:st.r(14,22), face:(cd>=0?1:-1), atM:Math.round(s)});
  }
  for(const s of out) H.terrain.feed(s.cd,s.al0,s.al1,s.h,s.w);
  return out;
})();

// ============================================================
// PLAN — THE GREEN WAY  (vocabulary: fork-wedge)
// Where the road commits to one flank, an older way commits to the other.
// It is not a second lane: no stone, no shoulder, no corridor mesh, nothing
// the host has to know about. It is two worn ruts and a sunken band of
// shorter turf, painted per-pixel, over a ground depression declared against
// the same datum as everything else. It cannot tear, because there is only
// ever one surface.
//
// The wedge between the two ways is the composition. It opens from nothing
// at the junction to a hundred and forty metres of empty turf, and it fills
// itself in the only honest order: bare, then a stone, then — far out, where
// there is finally room — one thorn.
// ============================================================
const DROVE=(()=>{
  const st=makeStream('plan/drove');
  const g=movStart('parting')+st.r(58,124);
  const fr=getFrame(LFRAME,clamp(g,0,LFRAME.len-1));
  const side=-S_FALL;                 // it goes down the flank the road leaves
  const rd=Math.atan2(fr.tx,fr.tz);
  const div=st.r(0.30,0.42)*side;
  const pts=[[fr.x,fr.z]];
  let a=rd+div*0.35, px=fr.x, pz=fr.z;
  // exactly six segments: the way is handed to the fragment shader as a fixed
  // uniform polyline, and a fixed polyline needs a fixed length
  const nseg=6, seg=st.r(66,86);
  for(let i=0;i<nseg;i++){
    a+=div*(i===0?0.75:st.r(0.10,0.34));
    px+=Math.sin(a)*seg; pz+=Math.cos(a)*seg;
    pts.push([px,pz]);
  }
  // hollowW is the GROUND footprint and widthM is the worn surface. They are
  // different numbers on purpose: a used way dishes the land either side of
  // itself over a far wider span than its own ruts, and only the wide part can
  // be carried by a sixteen-metre tile.
  return { g, side, pts, w:st.r(4.4,5.4), hollowW:st.r(12.0,15.0), sink:st.r(0.38,0.52),
           rut:st.r(0.88,1.06), len:(nseg*seg) };
})();
for(const p of DROVE.pts) H.terrain.feed(p[0],p[1]);
H.terrain.feed(DROVE.g,DROVE.w,DROVE.sink);
const droveDist=(x,z)=>polyDist(DROVE.pts,x,z);
const droveAlong=(x,z)=>polyAlong(DROVE.pts,x,z);

// ---------- the ground: one local function, used by everything ----------
const CROWN=0.11;
function corridorProfile(a,cut){
  if(a<=RH) return CROWN*(1-(a/RH)*(a/RH));
  let h=-0.30*smooth(RH,RH+0.95,a);
  h-=0.24*smooth(RH+0.7,RH+1.9,a);
  h-=0.34*smooth(RH+1.7,RH+4.6,a);
  h-=0.44*Math.exp(-Math.pow((a-(RH+4.0))/2.4,2))*clamp(cut,0,1)*smooth(RH,RH+1.4,a);
  return h;
}
// the country's own undulation, and the amount of it the corridor lets through
function bankMix(s){ return clamp(0.40+0.34*enclosureAt(clamp(s,0,L_ISL)),0.36,0.80); }
function indepLand(x,z){
  return (fbmL(x/520+3.3,z/520+9.1)-0.5)*26
       + (fbmL(x/205+21.7,z/205+5.3)-0.5)*11;
}
const INDEP_REF=(()=>{
  const n=Math.ceil(L_ISL/20)+1, a=new Float32Array(n);
  for(let i=0;i<n;i++){ const p=spineAt(i*20); a[i]=indepLand(p.x,p.z); }
  blurArray(a,26);
  return a;
})();
const indepRefAt=(s)=>{ const i=clamp(s/20,0,INDEP_REF.length-1), i0=Math.floor(i);
  return lerp(INDEP_REF[i0],INDEP_REF[Math.min(i0+1,INDEP_REF.length-1)],i-i0); };
// TEXTURE ONLY. Deliberately a third of the combe's amplitude: rollers and
// lumps are the signature of soft deep ground, and this ground is not that.
// Nothing structural is ever summed in here — see declareAgainst* below.
function textureRelief(x,z,d){
  const g=smooth(16,120,d);
  let r=(fbmL(x/560+11.7,z/560+2.9)-0.5)*34;
  r+=(fbmL(x/196+31.1,z/196+17.4)-0.5)*17;
  r+=(fbmL(x/58+7.7,z/58+41.3)-0.5)*5.6;
  return r*g;
}

// ---------- A3: every imposed feature declares its height ----------
// Island 01 learned this the expensive way: a bump summed onto unconstrained
// noise stood eight metres BELOW the road on one seed, and a sunken landmark
// is how three forty-metre elders vanish from their own skyline. So no form
// below is ADDED to the terrain. Each one names a height it wants and a
// weight, and the ground is drawn toward that height from a datum that is
// itself controlled — the road's own height for anything that has to read
// from the lane, the designed smooth surface for anything that has to read
// against its own surroundings. Noise is never a datum.
function declareAgainstRoad(y,roadY,want,w){
  return (w<=1e-4)?y:lerp(y,roadY+want,clamp(w,0,1));
}
function declareAgainstBase(y,baseY,want,w){
  return (w<=1e-4)?y:lerp(y,baseY+want,clamp(w,0,1));
}
function declareCutBelowBase(y,baseY,depth,w){
  return (w<=1e-4)?y:lerp(y,Math.min(y,baseY-depth),clamp(w,0,1));
}

// LOCAL ground: complete, placement-free
function groundL(x,z){
  const ri=routeInfoL(x,z);
  // 1. the datum. The road's height, plus the country's own undulation and
  //    the divide, both expressed as a DEPARTURE from their own value along
  //    the route — so neither can drag the lane up or down.
  const datum=ri.y
    +(indepLand(x,z)-indepRefAt(ri.s))*bankMix(ri.s)
    -(divideDrop(x,z)-divRefAt(ri.s));
  // 2. texture, and nothing but texture
  let y=datum+textureRelief(x,z,ri.d);
  // 3. the imposed forms, each declared, each held off the corridor
  { const gw=grooveWeight(x,z);
    if(gw>1e-3){
      let dep=0;
      for(const G of GROOVES){
        const gd=polyDist(G.pts,x,z);
        if(gd>G.w) continue;
        dep=Math.max(dep,G.depth*(1-smooth(G.w*0.26,G.w,gd)));
      }
      y=declareCutBelowBase(y,datum,dep,smooth(EXCL+9,EXCL+30,ri.d));
    } }
  { const cd=divideAcross(x,z), al=divideAlong(x,z);
    for(const S of SCARS){
      if(al<S.al0-50||al>S.al1+50) continue;
      const dc=(cd-S.cd)*S.face;
      if(Math.abs(dc)>S.w*2.6) continue;
      const along=smooth(S.al0,S.al0+44,al)*(1-smooth(S.al1-44,S.al1,al));
      const step=smooth(-S.w,S.w,dc);
      y=declareAgainstBase(y,datum,(step-0.5)*S.h,along*0.80*smooth(EXCL+7,EXCL+26,ri.d));
    } }
  { const dd=droveDist(x,z);
    if(dd<DROVE.hollowW*1.5){
      const t=1-smooth(DROVE.hollowW*0.30,DROVE.hollowW,dd);
      const grow=smooth(10,50,droveAlong(x,z));
      y=declareCutBelowBase(y,datum,DROVE.sink,t*grow);
    } }
  // 4. the road's own engineered corridor
  // The combe blended its engineered corridor out over twenty-six to a hundred
  // and thirty metres, which on a flank means the land beside the road is flat
  // for a hundred metres and then remembers it is on a hillside. Here the
  // corridor lets go by twenty: the ground tilts from the shoulder outward,
  // which is the whole sensation of traversing a slope.
  const w=1-smooth(6.5,clamp(17+Math.abs(datum-ri.y)*2.4,23,78),ri.d);
  if(w>1e-4) y=lerp(y,ri.y+corridorProfile(ri.d,y-ri.y),w);
  // 5. within the shoulder the ground is never permitted above the lane's edge,
  //    and the metre beside the stone always carries it
  if(ri.d<RH+2.5) y=Math.min(y,ri.y+corridorProfile(Math.max(ri.d,RH+0.001),0)+0.015);
  if(ri.d<RH+1.7) y=Math.max(y,ri.y+corridorProfile(Math.max(ri.d,RH+0.001),0)-0.012);
  return y;
}

// ---------- thin soil: where the rock is at or near the surface ----------
// This is the material fact that says the country has changed, and it is
// read by the ground colour, by the shader, and by what is allowed to grow.
function thinSoilL(x,z,slope){
  const cd=divideAcross(x,z), al=divideAlong(x,z);
  const env=1-smooth(DIVIDE.lenHalf,DIVIDE.lenHalf+DIVIDE.lenFade,Math.abs(al));
  // thinnest along the crest, where the wind has had longest at it
  // the crest is where the soil is thinnest, but "thinnest" is not "paved":
  // a rock sheet three hundred metres across is a quarry floor, not a down
  let t=clamp(1-Math.abs(cd)/(DIVIDE.halfW*0.55),0,1)*0.34*env;
  for(const S of SCARS){
    if(al<S.al0-44||al>S.al1+44) continue;
    const dc=(cd-S.cd)*S.face;
    const along=smooth(S.al0,S.al0+40,al)*(1-smooth(S.al1-40,S.al1,al));
    // the exposed face is downhill of the band, where the step sheds its soil
    t=Math.max(t,(1-smooth(S.w*0.3,S.w*2.2,Math.abs(dc+S.w*0.55)))*along);
  }
  // and wherever the ground is steep enough to shed what it had. The threshold
  // is high on purpose: a flank at twenty-five degrees is grass, and treating
  // every slope as scree painted a whole hillside the colour of wet slate.
  if(slope) t=Math.max(t,clamp((slope-0.62)*1.4,0,0.50));
  t*=0.42+0.92*fbmE(x/64+13.3,z/64+41.7);
  return clamp(t,0,1);
}
// shelter: the lee of a scar and the floor of a groove, where the wind is off
// the grass and something can grow to its own height
function shelterL(x,z){
  let s=clamp(1-grooveNear(x,z)/26,0,1)*0.75;
  const cd=divideAcross(x,z), al=divideAlong(x,z);
  for(const S of SCARS){
    if(al<S.al0-20||al>S.al1+20) continue;
    const dc=(cd-S.cd)*S.face;
    if(dc<0||dc>S.w*4.0) continue;
    const along=smooth(S.al0,S.al0+20,al)*(1-smooth(S.al1-20,S.al1,al));
    s=Math.max(s,(1-smooth(S.w*1.2,S.w*4.0,dc))*along*0.7);
  }
  return clamp(s,0,1);
}
for(let s=0;s<L_ISL;s+=120){ const p=spineAt(s); H.terrain.feed(groundL(p.x+55,p.z),groundL(p.x-55,p.z+30)); }

// ============================================================
// PLAN — SIGHTLINES
// Three, and two of them are about keeping things OUT. On open ground the
// composition is made by what is not there.
// ============================================================
const SIGHT=[];
function addSight(s0,s1,side,half,tag){ SIGHT.push({s0,s1,side,half,tag}); }
function inSight(x,z,s,d,side){
  for(const S of SIGHT){
    if(s<S.s0||s>S.s1) continue;
    if(S.side&&S.side!==side) continue;
    if(d<S.half) return true;
  }
  return false;
}
// the opening hundred metres stay honest so the entry never reads as a wall
addSight(4,96,0,12,'entry');
// the wedge: the composed opening onto the parting. Everything the ground
// does between the two ways has to be visible or the parting is just a rut.
addSight(DROVE.g-26,DROVE.g+264,DROVE.side,124,'fork-wedge');
// the brow: the long view off the falling side is the payoff for a kilometre
// of restraint, and one support grove in the wrong place would close it
addSight(movStart('brow')-40,movEnd('brow')+70,S_FALL,205,'brow');

// ============================================================
// PLAN — THE WEATHER HABIT
// The island declares a prevailing wind IN ITS OWN FRAME, because that is
// what it is: a fact about this ground, written into the shape of everything
// that has stood on it. Every thorn on the island leans the same way, the
// grass is combed the same way, and the air moves the same way. The host's
// clouds do what the host's sky does — a gust at four hundred metres and the
// wind that bent a sixty-year-old thorn are not the same wind, and pretending
// they are would make the island depend on its placement.
// ============================================================
const WIND=(()=>{
  const st=makeStream('plan/wind');
  const a=st.r(0,TAU);
  return { dir:a, dx:Math.sin(a), dz:Math.cos(a), strength:st.r(0.82,1.0) };
})();
H.eco.feed('wind',WIND.dir,WIND.strength);

// ============================================================
// PLAN — FORMATIONS
// Four names out of the eight, and the restraint is the point:
//   dappled-gate   ONE gate, at the entry only. The last trees. Crossed.
//   fork-wedge     the green way parting from the road, and the one thorn
//                  that stands where the wedge is finally wide enough
//   wind-sisters   solitary wind-bitten thorns on the open ground — not a
//                  group on a crown, not seen from a composed viewpoint, not
//                  a landmark: single trees, alone, most of them passed close
//   light-shaft    three pockets of visible air, all of them about shade —
//                  the last of it, the wind carrying the ground away, the
//                  first of it back
// water-aperture is unused because there is no water; fernfold-shaft because
// there is no fernfold; orchard-row because the rows are the combe's; and
// bellroot-approach because the hero tree belongs to the hollow.
// ============================================================
const FORMATION_TREES=[];
const FAMS=['oak','beech','birch','leaning','windshaped','thorn'];

// ---- dappled-gate: once, at the entry. It is not repeated at the exit ----
// Island 01 gated both ends and read as a room. This island is a CROSSING:
// the enclosed country is behind a single gate, it is left through it, and
// it does not come back until the ground itself comes back.
const GATE=(()=>{
  const out=[];
  const st=makeStream('plan/gate');
  const s0=movEnd('gate')-st.r(52,74);
  const side=st.chance(0.5)?1:-1;
  const mk=(ds,sd,off,fam,scl,lean)=>out.push({s:s0+ds,side:sd,off:EXCL+off,fam,scl,lean});
  mk(st.r(-6,6),      side,  st.r(1.8,3.0), 'oak',     st.r(1.30,1.52),  0.9);
  mk(st.r(19,29),    -side,  st.r(2.6,5.0), 'beech',   st.r(1.10,1.30), -0.9);
  mk(st.r(38,50),     side,  st.r(4.0,8.0), 'leaning', st.r(0.94,1.14),  0.5);
  mk(st.r(56,70),    -side,  st.r(6.0,12.0),'birch',   st.r(0.86,1.06), -0.4);
  // and the last one of all, standing out on the open side, already leaning
  // the way everything up here leans
  mk(st.r(84,104),    side,  st.r(9.0,15.0),'windshaped', st.r(0.96,1.14), 1);
  return out;
})();
for(const G of GATE){
  const fr=getFrame(LFRAME,clamp(G.s,0,LFRAME.len-1));
  const x=fr.x+fr.lx*G.off*G.side, z=fr.z+fr.lz*G.off*G.side;
  FORMATION_TREES.push({x,z,fam:G.fam,scl:G.scl,lean:G.lean,
    leanDir:(G.fam==='windshaped')?WIND.dir
            :Math.atan2(fr.tx,fr.tz)+(G.side>0?-1:1)*Math.PI*0.5,
    s:G.s,enc:0.55,formation:'dappled-gate'});
}
const GATE_S=GATE[0].s;

// ---- fork-wedge: the one thorn on the wedge ----
// It stands where the wedge has opened far enough to hold a tree, which is
// the only place a tree could have survived being between two ways.
const WEDGE_TREE=(()=>{
  const st=makeStream('plan/wedge');
  for(let k=0;k<40;k++){
    const along=st.r(150,300);
    // walk out the drove and step off it into the middle of the wedge
    const t=clamp(along/Math.max(1,DROVE.len),0,0.98);
    const seg=DROVE.pts.length-1;
    const fi=t*seg, i0=Math.floor(fi), ft=fi-i0;
    const a=DROVE.pts[i0], b=DROVE.pts[Math.min(seg,i0+1)];
    const px=lerp(a[0],b[0],ft), pz=lerp(a[1],b[1],ft);
    const ri=routeInfoL(px,pz);
    if(ri.d<52) continue;                      // the wedge is not open yet
    // halfway between the two ways
    const fr=getFrame(LFRAME,clamp(ri.s,0,LFRAME.len-1));
    const sd=Math.sign(ri.u)||DROVE.side;
    const mx=(px+(fr.x+fr.lx*sd*EXCL))*0.5;
    const mz=(pz+(fr.z+fr.lz*sd*EXCL))*0.5;
    if(routeInfoL(mx,mz).d<EXCL+8) continue;
    if(droveDist(mx,mz)<9) continue;
    if(grooveNear(mx,mz)<15) continue;
    return {x:mx,z:mz,s:ri.s};
  }
  return null;
})();
if(WEDGE_TREE){
  FORMATION_TREES.push({x:WEDGE_TREE.x,z:WEDGE_TREE.z,fam:'thorn',scl:1.16,lean:1,
    leanDir:WIND.dir,s:WEDGE_TREE.s,enc:0.0,formation:'fork-wedge'});
}

// ---- wind-sisters: the solitary thorns ----
// Five to seven, spread over the whole open middle, each one ALONE. Two of
// them close enough to the verge that the rider goes past within a few
// metres and can see how hard the wind has been on them; the rest far out,
// where a single small tree in a large empty field is the scale reference
// that makes the field large.
const THORNS=(()=>{
  const out=[];
  const st=makeStream('plan/thorns');
  const n=st.i(5,7);
  const s0=movEnd('gate')+110, s1=movStart('soil')-80;
  for(let i=0;i<n;i++){
    const sub=subStream('thorn',i);
    const near=sub.chance(0.34);
    let got=null;
    for(let k=0;k<50&&!got;k++){
      const s=clamp(lerp(s0,s1,(i+sub.r(0.12,0.88))/n)+sub.r(-26,26),s0,s1);
      // A2: nothing deliberate stands near anything else deliberate
      if(Math.abs(s-GATE_S)<130) continue;
      if(Math.abs(s-DROVE.g)<150) continue;
      const side=sub.chance(0.5)?1:-1;
      const off=near?sub.r(EXCL+2.2,EXCL+9):sub.r(38,165);
      const fr=getFrame(LFRAME,clamp(s,0,LFRAME.len-1));
      const x=fr.x+fr.lx*off*side, z=fr.z+fr.lz*off*side;
      // A2, enforced where it is decided rather than measured afterwards: a
      // thorn's exclusion zone is EUCLIDEAN, because two trees a hundred metres
      // apart along the road and two hundred apart across it are not crowding
      // each other, and two thirty metres apart on the same bearing are.
      { let clash=false;
        for(const p of out) if(Math.hypot(p.x-x,p.z-z)<110) clash=true;
        if(WEDGE_TREE&&Math.hypot(WEDGE_TREE.x-x,WEDGE_TREE.z-z)<130) clash=true;
        for(const G of FORMATION_TREES) if(G.formation==='dappled-gate'&&
          Math.hypot(G.x-x,G.z-z)<130) clash=true;
        if(clash) continue; }
      if(routeInfoL(x,z).d<EXCL+1.8) continue;
      if(droveDist(x,z)<12) continue;
      if(grooveNear(x,z)<16) continue;
      if(thinSoilL(x,z,0)>0.66) continue;         // nothing takes root in bare rock
      got={x,z,s,near,scl:near?sub.r(1.02,1.24):sub.r(1.10,1.42)};
    }
    if(got) out.push(got);
  }
  return out;
})();
for(const T of THORNS){
  FORMATION_TREES.push({x:T.x,z:T.z,fam:'thorn',scl:T.scl,lean:1,
    leanDir:WIND.dir+subStream('thornlean',Math.round(T.s)).r(-0.10,0.10),
    s:T.s,enc:0.0,formation:'wind-sisters'});
}
for(const t of FORMATION_TREES) H.eco.feed(t.x,t.z,t.fam,t.scl,t.formation);
// A2 audit, computed rather than asserted: the closest any two deliberate
// things come to each other along the road
const FORMATION_SPACING=(()=>{
  // measured the way it is enforced: euclidean, between deliberate things. The
  // gate is one thing, not five, so it contributes its own centre once.
  const pts=FORMATION_TREES.filter(t=>t.formation!=='dappled-gate').map(t=>[t.x,t.z]);
  { const g=FORMATION_TREES.filter(t=>t.formation==='dappled-gate');
    if(g.length) pts.push([g.reduce((a,t)=>a+t.x,0)/g.length,g.reduce((a,t)=>a+t.z,0)/g.length]); }
  let m=1e9;
  for(let i=0;i<pts.length;i++) for(let j=i+1;j<pts.length;j++)
    m=Math.min(m,Math.hypot(pts[i][0]-pts[j][0],pts[i][1]-pts[j][1]));
  return (m>1e8)?0:Math.round(m);
})();

// ============================================================
// PLAN — GROVES AND BANDED TREES
// Woodland exists in exactly two places on this island: behind the gate and
// at the far end where the soil comes back. Across the open middle the grove
// generator produces NOTHING, and that emptiness is not a gap in the
// composition — it is the composition. The only exception is a handful of
// far masses out past a hundred and sixty metres, which are the shoulders of
// the country and never crowd the road.
// ============================================================
const TREES=[];
const treeCell=40, treeGrid=new Map();
function treeAdd(t){
  TREES.push(t);
  const k=rKey(Math.floor(t.x/treeCell),Math.floor(t.z/treeCell));
  let c=treeGrid.get(k); if(!c){c=[];treeGrid.set(k,c);} c.push(t);
}
function treeNear(x,z,r){
  const gx=Math.floor(x/treeCell), gz=Math.floor(z/treeCell), R=Math.ceil(r/treeCell);
  for(let ax=gx-R;ax<=gx+R;ax++) for(let az=gz-R;az<=gz+R;az++){
    const c=treeGrid.get(rKey(ax,az)); if(!c) continue;
    for(const t of c) if((t.x-x)*(t.x-x)+(t.z-z)*(t.z-z)<r*r) return true; }
  return false;
}
function famScale(fam,st){
  return { oak:st.r(1.0,1.35), beech:st.r(1.0,1.3), birch:st.r(0.78,1.05),
           leaning:st.r(0.86,1.15), windshaped:st.r(0.8,1.08),
           thorn:st.r(0.86,1.18) }[fam];
}
// A2: every deliberate thing keeps a zone about three times its own size.
// A grove that lands inside one is simply not planned.
function deliberateClear(s,x,z){
  if(Math.abs(s-GATE_S)<40) return true;         // the gate owns its own stretch
  for(const t of FORMATION_TREES){
    if(t.formation==='dappled-gate') continue;
    const r=(t.formation==='fork-wedge')?92:74;
    if(Math.hypot(x-t.x,z-t.z)<r) return false;
  }
  return true;
}
const GROVES=[];
{
  const openMix=['oak','windshaped','birch','leaning'];
  const woodMix=['beech','oak','beech','birch','oak','leaning'];
  let s=-60, gi=0;
  while(s<L_ISL+40){
    const enc=enclosureAt(s);
    const st=subStream('grove',gi);
    // OPEN GROUND PLANTS NOTHING. Below a real enclosure the only thing that
    // may be planned is a far mass, and most stretches do not get one.
    const nG=enc>0.50?st.i(2,3):(enc>0.20?st.i(1,2):(st.chance(0.22)?1:0));
    for(let q=0;q<nG;q++){
      const roll=st.f();
      let role,off,rx,rz,dens;
      if(enc<0.20){ role='wall'; off=st.r(168,238); rx=st.r(30,58); rz=st.r(34,74); dens=st.r(0.55,0.85); }
      else if(roll<0.30+0.24*enc){ role='frame'; off=st.r(EXCL+1.6,16); rx=st.r(6,13); rz=st.r(8,19); dens=st.r(0.6,1.0); }
      else if(roll<0.74){ role='support'; off=st.r(20,60); rx=st.r(12,26); rz=st.r(15,34); dens=st.r(0.6,1.0); }
      else { role='wall'; off=st.r(70,150); rx=st.r(26,60); rz=st.r(30,80); dens=st.r(0.7,1.0); }
      const side=st.chance(0.5)?1:-1;
      GROVES.push({ id:GROVES.length, s, side, off, rx, rz, rot:st.r(0,TAU), role, dens,
                    mix:(enc>0.45)?woodMix:openMix, enc, hero:st.chance(role==='frame'?0.10:0.04) });
    }
    gi++;
    s+=lerp(74,20,enc)*subStream('grovestep',gi).r(0.8,1.25);
  }
  for(const gr of GROVES) H.eco.feed(gr.s,gr.off,gr.side,gr.role);
}
{
  for(const gr of GROVES){
    const fr=getFrame(LFRAME,clamp(gr.s,0,LFRAME.len-1));
    const cx=fr.x+fr.lx*gr.off*gr.side, cz=fr.z+fr.lz*gr.off*gr.side;
    const area=Math.PI*gr.rx*gr.rz;
    const target=Math.round(clamp(area/(gr.role==='frame'?95:(gr.role==='support'?150:260))*gr.dens,1,30));
    const st=subStream('trees',gr.id);
    let placed=0;
    for(let att=0;att<target*9&&placed<target;att++){
      const a=st.r(0,TAU), rr=Math.sqrt(st.f());
      const ex=Math.cos(a)*gr.rx*rr, ez=Math.sin(a)*gr.rz*rr;
      const ca=Math.cos(gr.rot), sa=Math.sin(gr.rot);
      const x=cx+ex*ca-ez*sa, z=cz+ex*sa+ez*ca;
      const ri=routeInfoL(x,z);
      const fam=st.pick(gr.mix);
      const scl=famScale(fam,st)*(gr.hero&&placed===0?st.r(1.24,1.44):1);
      const rad=1.5*scl;
      if(ri.d<EXCL+rad+0.6) continue;
      if(droveDist(x,z)<10) continue;               // nothing grows in a used way
      if(!deliberateClear(ri.s,x,z)) continue;
      if(thinSoilL(x,z,0)>0.60) continue;           // no wood stands on bare rock
      if(inSight(x,z,ri.s,ri.d,Math.sign(ri.u)||1)) continue;
      if(treeNear(x,z,2.0*scl+st.r(0.4,2.4))) continue;
      treeAdd({ x,z,fam,scl,lean:st.r(-1,1),
        leanDir:(fam==='windshaped')?WIND.dir+st.r(-0.3,0.3):st.r(0,TAU),
        role:(placed===0&&gr.hero)?'hero':gr.role, grove:gr.id,
        d:ri.d, s:ri.s, roadY:ri.y, enc:gr.enc, formation:null });
      placed++;
    }
  }
  for(const t of FORMATION_TREES){
    const ri=routeInfoL(t.x,t.z);
    treeAdd({ x:t.x,z:t.z,fam:t.fam,scl:t.scl,lean:t.lean,leanDir:t.leanDir,
      role:(t.formation==='wind-sisters'||t.formation==='fork-wedge')?'landmark':'formation', grove:-1,
      d:ri.d, s:t.s, roadY:ri.y, enc:t.enc, formation:t.formation });
  }
  TREES.sort((a,b)=>a.s-b.s||a.x-b.x);
  for(let i=0;i<TREES.length;i+=13) H.eco.feed(TREES[i].x,TREES[i].z,TREES[i].fam);
  H.eco.feed(TREES.length);
}

// ============================================================
// PLAN — AMBIENT LIFE AND VISIBLE AIR
// Scheduled by island distance (ride-clock); animated on the world's own
// clock, so pausing the rider never pauses the place. Two resident larks
// belong to the island outright and are never scheduled at all.
// ============================================================
const LIFE_EVENTS=[];
{
  const add=(s,kind,opt)=>LIFE_EVENTS.push(Object.assign({
    s:clamp(s,40,L_ISL-40), kind, id:LIFE_EVENTS.length, fired:false },opt||{}));
  add(lerp(movStart('thin'),movEnd('thin'),0.30),'pipits',{side:-S_FALL});
  add(lerp(movStart('thin'),movEnd('thin'),0.78),'gust');       // the wind crosses the grass
  add(DROVE.g+30,'moths',{radius:22,side:DROVE.side});
  add(lerp(movStart('brow'),movEnd('brow'),0.34),'flock',{far:true,side:S_FALL});
  add(lerp(movStart('brow'),movEnd('brow'),0.72),'gust');
  add(lerp(movStart('soil'),L_ISL,0.30),'hare',{side:-S_FALL});
  for(const e of LIFE_EVENTS){
    const st=subStream('life',e.id);
    e.dur=st.r(8,14); if(e.side===undefined) e.side=st.chance(0.5)?1:-1; e.s=clamp(e.s+st.r(-12,12),40,L_ISL-40);
    H.life.feed(e.s,e.kind,e.dur,e.side);
  }
  LIFE_EVENTS.sort((a,b)=>a.s-b.s);
}
// the island's planned pockets of visible air, named in the vocabulary.
// All three are about shade: the last of it, its complete absence with the
// wind carrying the ground through the light instead, and the first of it back.
const AIR_POCKETS=(()=>{
  const out=[];
  const add=(s,w,strength,why)=>out.push({s,w,strength,why});
  add(GATE_S+LIFE.r(10,32),LIFE.r(42,62),LIFE.r(0.9,1.15),'light-shaft');
  add(lerp(movStart('brow'),movEnd('brow'),LIFE.r(0.35,0.6)),LIFE.r(70,110),LIFE.r(0.7,0.95),'light-shaft');
  add(lerp(movStart('soil'),L_ISL,LIFE.r(0.25,0.5)),LIFE.r(44,66),LIFE.r(0.85,1.1),'light-shaft');
  out.sort((a,b)=>a.s-b.s);
  for(const o of out) H.life.feed('air',Math.round(o.s),Math.round(o.w),o.why);
  return out;
})();
function airAmountAt(s){
  let v=0.08;
  for(const o of AIR_POCKETS){
    const t=1-clamp(Math.abs(s-o.s)/o.w,0,1);
    v=Math.max(v,0.08+o.strength*t*t*(3-2*t));
  }
  return v;
}

const VOCAB_ALLOWLIST=['dappled-gate','light-shaft','fernfold-shaft','fork-wedge',
  'water-aperture','wind-sisters','orchard-row','bellroot-approach'];
const VOCAB_USED=(()=>{
  const used=new Set();
  for(const t of TREES) if(t.formation) used.add(t.formation);
  for(const S of SIGHT) if(VOCAB_ALLOWLIST.includes(S.tag)) used.add(S.tag);
  for(const o of AIR_POCKETS) used.add(o.why);
  return Array.from(used).sort();
})();

// ============================================================
// PLAN HASH — the island's complete identity, before quality or placement
// ============================================================
const PLAN_SUMMARY={
  islandId:ISLAND_ID, seed:SEED_TEXT, lengthM:Math.round(LFRAME.len),
  movements:MOV.map(m=>m.name),
  netElevationM:Math.round((EXIT_POSE.y-ENTRY_POSE.y)*10)/10,
  netHeadingDeg:Math.round(HEADING_STAT.netDeg*10)/10,
  maxGradePct:Math.round(ELEVATION.maxG*1000)/10,
  fallSide:S_FALL, crestAtM:Math.round(DIVIDE.g), droveAtM:Math.round(DROVE.g),
  divideHalfWidthM:Math.round(DIVIDE.halfW), divideFallM:Math.round(DIVIDE.h*10)/10,
  scars:SCARS.length, grooves:GROOVES.length, thorns:THORNS.length,
  windDeg:Math.round(WIND.dir*180/Math.PI),
  plannedTrees:TREES.length, groves:GROVES.length,
  lifeEvents:LIFE_EVENTS.length, airPockets:AIR_POCKETS.length,
  vocabulary:VOCAB_USED.join(','),
};
{
  H.plan.feed(H.route.hex(),H.elev.hex(),H.terrain.hex(),H.eco.hex(),H.life.hex());
  for(const k of Object.keys(PLAN_SUMMARY)) H.plan.feed(k,String(PLAN_SUMMARY[k]));
}
const PLAN_HASH=H.plan.hex();
QUALITY_READS_AT_PLAN=QUALITY_READS;       // the plan never asked what tier this is
PLACEMENT_READS_AT_PLAN=PLACEMENT_READS;   // ...nor where it will stand

// ============================================================
// REALIZATION — quality tiers change representation cost, never identity
// ============================================================
const QCFG={
  low:      { row:7.0, tile:18, ahead:460, behind:190, under:0.34, nearD:13, midD:56, farD:230, shadow:0,    part:0.5, tuftBand:10, capNear:3, capMid:9,  bandTreeCap:14, lobe:0, view:1500, roundMid:3, dpr:1.0 },
  standard: { row:5.0, tile:16, ahead:540, behind:220, under:0.62, nearD:17, midD:70, farD:300, shadow:1024, part:1.0, tuftBand:14, capNear:5, capMid:11, bandTreeCap:16, lobe:1, view:1620, roundMid:6, dpr:1.25 },
  // high spends its budget on fidelity — shadow resolution, device pixels,
  // near articulation, view reach — not on more geometry than standard
  high:     { row:5.0, tile:14, ahead:520, behind:220, under:0.64, nearD:22, midD:78, farD:320, shadow:2048, part:1.3, tuftBand:13, capNear:6, capMid:10, bandTreeCap:14, lobe:1, view:1900, roundMid:7, dpr:1.5 },
}[readQuality()];
H.real.feed(QUALITY); for(const k of Object.keys(QCFG)) H.real.feed(k,QCFG[k]);

// ============================================================
// THE HOST — everything from here to the island realization is the mount:
// a placement transform, connective travel either side, and the world's
// own sky and light. It reads the island's boundary contract (entry pose,
// exit pose, road width, a ground sampler) and nothing else.
// ============================================================
const PLACEMENT=(()=>{
  const p=readPlacement();
  return { headingRad:p.headingDeg*Math.PI/180, entryGrade:p.entryGradePct/100, copies:p.copies };
})();
const APPROACH_LEN=280, EXIT_LEN=340, GAP_LEN=190;

// a rigid transform: local -> world. Rotation about Y so local +Z maps to
// the world heading; then translation.
function makeXform(wx,wy,wz,headingRad){
  const c=Math.cos(headingRad), s=Math.sin(headingRad);
  return {
    c,s,wx,wy,wz,heading:headingRad,
    fwd:(x,z)=>[wx+x*c+z*s, wz-x*s+z*c],
    fwdY:(y)=>wy+y,
    inv:(X,Z)=>{ const dx=X-wx, dz=Z-wz; return [dx*c-dz*s, dx*s+dz*c]; },
  };
}
// world assembly: approach, island copies, gap, exit — as separate frame
// tables so the island's own frames pass through untouched
const SEGMENTS=[];
const XFORMS=[];
{
  let hx=0, hz=0, hy=40, hd=PLACEMENT.headingRad;    // an arbitrary world start; nothing depends on it
  const walk=(len,gradeAt,curveAt)=>{
    const pts=[[hx,hy,hz]];
    const n=Math.ceil(len/SDS);
    for(let i=1;i<=n;i++){
      const s=i*SDS;
      hd+=(curveAt?curveAt(s):0)*SDS;
      hx+=Math.sin(hd)*SDS; hz+=Math.cos(hd)*SDS;
      hy+=(gradeAt?gradeAt(s):0)*SDS;
      pts.push([hx,hy,hz]);
    }
    return framesFromPoints(pts);
  };
  // approach: the host's grade, easing to the island's declared entry grade
  const eg=PLACEMENT.entryGrade, ig=ENTRY_POSE.gradePct/100;
  const A=walk(APPROACH_LEN,(s)=>lerp(eg,ig,smooth(APPROACH_LEN-120,APPROACH_LEN-16,s)),
    (s)=>0.0011*Math.sin(s*0.013+0.9)*(1-smooth(APPROACH_LEN-90,APPROACH_LEN-10,s)));
  SEGMENTS.push({F:A,island:false,copy:-1});
  for(let k=0;k<PLACEMENT.copies;k++){
    // mount copy k at the walker's pose
    const T=makeXform(hx,hy,hz,hd);
    XFORMS.push(T);
    const F={ RS:LFRAME.RS, N:LFRAME.N, len:LFRAME.len,

  return mix(1.0,mix(0.42,1.06,cut),clamp(canopy,0.0,1.0));
}`;
// The common. Grazed turf over rock: finer clumping than deep meadow, a lot
// more of it dry, combed along the island's own prevailing wind — and, where
// the soil has worn through, the rock itself. High-frequency terms are faded
// out with distance, because detail finer than a pixel is not detail, it is
// shimmer (A4: vertex-colour detail below tile frequency aliases away; the
// same is true of shader detail below screen frequency).
const COMMON_GLSL=`
{
  float vd=distance(vWPos,cameraPosition);
  float hifade=mix(1.0,1.0-smoothstep(55.0,190.0,vd),uDbg.z);
  float clump=wlNoise(vWPos.xz*0.60+vec2(4.7,1.9))*0.56+wlNoise(vWPos.xz*1.50+vec2(9.1,6.3))*0.44;
  float coarse=wlNoise(vWPos.xz*0.095+vec2(21.0,13.0));
  float lush=smoothstep(0.42,0.80,clump*0.62+coarse*0.38);
  // VALUE, not chroma. This used to be a per-channel multiplier, and a
  // multiplier that suppresses blue can only make a green MORE saturated —
  // which is the exact opposite of what happens to grass as it dries. It cost
  // the island its central claim: measured, the authored turf left the vertex
  // path at sat 0.394 and arrived on screen at 0.470, one point off island 01's
  // 0.48. Lushness is allowed to change how bright the grass is and nothing else.
  diffuseColor.rgb*=1.06-0.12*lush;
  float dry=smoothstep(0.46,0.82,coarse*0.66+wlNoise(vWPos.xz*0.34+vec2(31.0,2.0))*0.34);
  // and dryness is a mix TOWARD a low-chroma colour, which is the only
  // operation that can actually take saturation out
  diffuseColor.rgb=mix(diffuseColor.rgb,uDryCol,dry*0.55);
  // the wind's comb: streaks long along the wind and short across it
  vec2 wq=vec2(dot(vWPos.xz,uWindW),dot(vWPos.xz,vec2(-uWindW.y,uWindW.x)));
  float comb=wlNoise(vec2(wq.x*0.030,wq.y*0.28))*0.62+wlNoise(vec2(wq.x*0.085,wq.y*0.70))*0.38;
  diffuseColor.rgb*=1.0+(comb-0.5)*0.19*hifade*uDbg.y;
  // The bones. Everything about the rock is sampled in CREST coordinates —
  // long along the contour, short across it — because that is the direction
  // bedding actually runs, and a rock band that runs the wrong way across a
  // hillside reads as a stain. vThin is how far the soil has worn through.
  vec2 cq=vec2(dot(vWPos.xz,uCrestW),dot(vWPos.xz,vec2(-uCrestW.y,uCrestW.x)));
  float rn=wlNoise(vec2(cq.x*0.055,cq.y*0.30)+vec2(5.3,8.8))*0.60
          +wlNoise(vec2(cq.x*0.170,cq.y*0.90)+vec2(1.1,3.3))*0.40;
  float rk=smoothstep(0.42,0.78,vThin*1.10+(rn-0.5)*0.72);
  // A scar at three hundred metres is not a pale sheet. Close up you are
  // looking at the SUNLIT TOPS of the beds, and it is bright; from across a
  // valley you are looking at the FACES, which are in shadow all day, and it is
  // a dark band. Getting that the wrong way round is what filled the first brow
  // captures with white blotches — pale paint smeared over the one part of the
  // frame the whole island exists to show.
  rk*=mix(0.46,1.0,hifade);
  float bed=smoothstep(0.30,0.72,wlNoise(vec2(cq.x*0.04,cq.y*0.55)+vec2(17.0,29.0))*0.60
                                +wlNoise(vec2(cq.x*0.14,cq.y*1.60)+vec2(3.0,41.0))*0.40*hifade);
  vec3 stn=mix(uStoneSh,uStoneLit,bed*mix(0.50,0.92,hifade));
  diffuseColor.rgb=mix(diffuseColor.rgb,stn,rk*0.66*uDbg.x);
  // the joints between the beds, which is what makes rock read as rock
  float jn=abs(fract(cq.y*0.115+wlNoise(cq*0.04)*0.5)-0.5);
  diffuseColor.rgb*=1.0-smoothstep(0.40,0.5,jn)*rk*0.36*(0.35+0.65*hifade)*uDbg.x;
  // TERRACETTES. Lines of constant HEIGHT, which is why they need no slope
  // maths of their own: on flat ground the contours are metres apart and
  // nothing shows, and on a flank they crowd together into the horizontal
  // banding that is the single most recognisable thing about grazed downland.
  // Sheep put them there, walking along the hill instead of up it, and they
  // are what makes this ground read as DRAWN rather than painted.
  {
    float cy=vWPos.y*0.82+wlNoise(vWPos.xz*0.075+vec2(9.0,4.0))*0.42;
    float ct=fract(cy);
    // antialiased by their own screen-space rate: where the contours crowd
    // closer than a pixel the banding fades out on its own, so the amplitude
    // can be honest near the rider without shimmering on the far hillside
    float aa=1.0-smoothstep(0.10,0.34,fwidth(cy));
    float line=exp(-pow((ct-0.5)/0.145,2.0));
    float amt=smoothstep(0.05,0.20,vSlope)*aa*uTrack;
    diffuseColor.rgb*=1.0-line*0.135*amt;
    diffuseColor.rgb=mix(diffuseColor.rgb,diffuseColor.rgb*vec3(1.07,1.04,0.94),
                         exp(-pow((ct-0.14)/0.12,2.0))*amt*0.55);
  }
  float grain=wlNoise(vWPos.xz*3.7)*0.5+wlNoise(vWPos.xz*9.1+3.3)*0.5;
  diffuseColor.rgb*=1.0+(grain-0.5)*0.07*hifade;
  // a gust crossing the common turns the grass over and it goes silver for a
  // second. uGlint carries the running front; it is the same uniform island 01
  // used to catch light on a mown margin, put to the only use this ground has
  // for it.
  if(uGlint.w>0.001){
    float gd=distance(vWPos.xz,uGlint.xy);
    float prox=1.0-smoothstep(uGlint.z*0.28,uGlint.z,gd);
    diffuseColor.rgb+=vec3(0.86,0.92,0.76)*prox*uGlint.w*0.30*(1.0-rk);
  }
}`;
// The green way lives in the SHADER for the same reason island 01's swathes
// did: a one-metre rut cannot survive sixteen-metre tile vertices. The drove
// weight and the signed metres from its centreline ride along as attributes
// and the ruts are painted per-pixel. No second road mesh exists anywhere, so
// there is no second surface to disagree with the first — which is the whole
// reason this island can carry a fork at all.
const DROVE_GLSL=`
{
  vec2 dinf=droveInfo(vWPos.xz);
  float rag=(wlNoise(vWPos.xz*0.30+vec2(31.0,7.0))-0.5)*2.2;
  float dw=1.0-smoothstep(uDroveW*0.52+rag,uDroveW*1.25+rag,dinf.x);
  if(dw>0.004){
    float vd2=distance(vWPos,cameraPosition);
    float hif=1.0-smoothstep(90.0,300.0,vd2);
    float brk=wlNoise(vWPos.xz*0.75+vec2(4.0,7.0))*0.6+wlNoise(vWPos.xz*2.30)*0.4;
    float w=dw*smoothstep(0.18,0.50,brk*0.40+dw*0.60);
    diffuseColor.rgb=mix(diffuseColor.rgb,uWayTurf,0.62*w);
    float r=abs(abs(dinf.y)-uRutOff);
    float rut=exp(-pow(r/0.46,2.0))*(0.40+0.60*hif);
    diffuseColor.rgb=mix(diffuseColor.rgb,uRutCol,rut*w*0.85*smoothstep(0.18,0.58,brk));
    float crown=exp(-pow(dinf.y/0.62,2.0));
    diffuseColor.rgb*=1.0+crown*w*0.07;
  }
}`;
function groundedMat(mat,opts){
  const o=opts||{};
  mat.onBeforeCompile=(sh)=>{
    Object.assign(sh.uniforms,WL);
    sh.vertexShader=sh.vertexShader
      .replace('#include <common>','#include <common>\nvarying vec3 vWPos;'+(o.canopy?'\nattribute float aCanopy; varying float vCanopy;':'')
        +(o.drove?'\nattribute float aThin; attribute float aSlope; varying float vThin; varying float vSlope;':''))
      .replace('#include <worldpos_vertex>','#include <worldpos_vertex>\n{ vec4 wp2=modelMatrix*vec4(transformed,1.0);\n#ifdef USE_INSTANCING\n wp2=modelMatrix*instanceMatrix*vec4(transformed,1.0);\n#endif\n vWPos=wp2.xyz;'+(o.canopy?' vCanopy=aCanopy;':'')+(o.drove?' vThin=aThin; vSlope=aSlope;':'')+' }');
    sh.fragmentShader=sh.fragmentShader
      .replace('#include <common>','#include <common>\nvarying vec3 vWPos;'+(o.canopy?'varying float vCanopy;':'const float vCanopy=0.0;')
        +(o.drove?'varying float vThin; varying float vSlope;':'const float vThin=0.0;\nconst float vSlope=0.0;')+'\n'+WL_GLSL)
      .replace('#include <color_fragment>','#include <color_fragment>\n'+(o.common?COMMON_GLSL:'')+(o.drove?DROVE_GLSL:''))
      .replace('vec3 outgoingLight = ',
        'float wl=cloudShadowAt(vWPos.xz)*dappleAt(vWPos.xz,vCanopy);\n'+
        'reflectedLight.directDiffuse*=wl;\nreflectedLight.indirectDiffuse*=mix(0.80,1.0,wl);\nvec3 outgoingLight = ');
  };

}

// ---------- the sky dome ----------
{
  const m=new THREE.ShaderMaterial({

    side:THREE.BackSide, depthWrite:false, fog:false,

      float sd=acos(clamp(dot(d,normalize(uSunW)),-1.0,1.0));

// ============================================================
// GROUND COLOUR — the keeper's painted-field logic, moved uphill.
//
// The trap on this island is that limestone in full sun is almost exactly the
// colour of the road, and a road that is the same value as its own country
// stops leading. So the change of soil is NOT bought by making the grass
// paler — it is bought by making it drier, browner and slightly DARKER than
// the valley's, and by letting the stone be the only pale thing besides the
// road. The vertex colour carries the bias; the stone itself is painted
// per-pixel, in bands, with its shaded faces intact.
// ============================================================
const C_SUN=col(PAL.sunGrass), C_MEAD=col(PAL.meadow), C_SHADE=col(PAL.leafShade),
      C_DEEP=col(PAL.woodDeep), C_ROAD=col(PAL.road);
const C_LOAM=mixc(PAL.bark,PAL.woodDeep,0.42);
// The two countries this island crosses between, as two pairs of colours.
// The valley's green is the one island 01 lives in. The common's is bitten
// short and half burnt off by August, and it is DARKER and browner than the
// valley — not paler. Paler was the trap: limestone in full sun is almost
// exactly the value of the road, and a road the same value as its own country
// stops leading it.
const C_VALLEY_LO=col(PAL.meadow), C_VALLEY_HI=mixc(PAL.sunGrass,PAL.meadow,0.10);
const C_COMMON_LO=mixc(PAL.meadow,PAL.bark,0.46).lerp(col(PAL.sunGrass),0.24);
// The lush end (LO) is deliberately left where it was: the hollows of a
// downland common ARE green, and the range between green hollow and fawn top is
// most of what makes the ground read as modelled rather than tinted. Only the
// dry end moves. Measured across the field the turf now spans sat 0.298-0.484
// against island 01's 0.48, at a road/turf luminance ratio of 1.49-1.89:1 —
// the road is still the palest thing in every frame and its seam gate is
// untouched at 3.40:1.
const C_COMMON_HI=mixc(PAL.sunGrass,PAL.road,0.66).lerp(col(PAL.bark),0.46);
const C_STONE_LIT=mixc(PAL.road,PAL.leafShade,0.24).lerp(col(PAL.bark),0.12);
const C_STONE_SH=mixc(PAL.bark,PAL.woodDeep,0.34).lerp(col(PAL.leafShade),0.22);
const _gc=new THREE.Color(), _gcLo=new THREE.Color(), _gcHi=new THREE.Color();
function groundColorL(x,z,slope,enc,thin,rel,ri){
  const t=fbmE(x/150+3.1,z/150+9.4)*0.62+fbmE(x/47+21.3,z/47+7.7)*0.38;
  const t2=fbmE(x/23+17.7,z/23+5.5);
  // The ground's own colour IS the kind of country it is. The gate is not a
  // row of trees with the same field on both sides of it — the turf goes from
  // valley green to common fawn as it is crossed, and that one fact is most of
  // the answer to "has the country changed, or am I still riding the same
  // field". Nothing else on this island had to carry that on its own.
  const open=clamp(1-enc*2.4,0,1);
  _gcLo.copy(C_VALLEY_LO).lerp(C_COMMON_LO,open);
  _gcHi.copy(C_VALLEY_HI).lerp(C_COMMON_HI,open);
  const e=clamp(0.14+t*0.94+rel*0.028-slope*1.20,0,1);
  _gc.copy(_gcLo).lerp(_gcHi,e);
  _gc.lerp(C_DRY,clamp((slope-0.18)*1.4,0,0.46)*open*(0.42+0.58*t2));
  _gc.lerp(C_SHADE,clamp(enc*0.84,0,0.84));
  _gc.lerp(C_LOAM,clamp((enc-0.60)*1.5,0,0.34)*clamp(t2*1.3,0,1));
  // only the BIAS toward stone; the rock itself is COMMON_GLSL's job
  _gc.lerp(C_STONE_LIT,clamp(thin*0.34,0,0.34));
  return _gc;
}

// ============================================================
// THE ROAD AND ITS CORRIDOR — one conformal mesh per segment, the island's
// built from its own LOCAL frames and transformed whole, so its geometry is
// identical under every placement.
// ============================================================
const C_ROAD_CORE=mixc(PAL.road,0xFFF2D2,0.16);
const C_ROAD_MID=mixc(PAL.road,PAL.bark,0.055);
const C_ROAD_EDGE=mixc(PAL.road,PAL.bark,0.26).lerp(col(PAL.leafShade),0.08);
const C_SEAM=(()=>{
  const target=lumOf(C_ROAD_MID)/3.4;
  const hue=mixc(PAL.bark,PAL.woodDeep,0.42);
  const k=target/Math.max(lumOf(hue),1e-4);
  return new THREE.Color(clamp(hue.r*k,0,1),clamp(hue.g*k,0,1),clamp(hue.b*k,0,1));
})();
const C_SHOULDER=mixc(PAL.road,PAL.bark,0.46).lerp(col(PAL.sunGrass),0.10);
const C_WORNGRASS=mixc(PAL.meadow,PAL.bark,0.24).lerp(col(PAL.sunGrass),0.16);
const ROAD_CONTRAST=lumOf(C_ROAD_MID)/lumOf(C_SEAM);
const COLS=(()=>{
  const c=[];
  for(const t of [-1,-0.72,-0.40,-0.14,0.14,0.40,0.72,1]) c.push(t*RH);
  for(const a of [0.22,0.6,1.15,1.9,2.9,4.4,8.0,12.5,18,25,33,43,54,APRON]){ c.push(RH+a); c.push(-(RH+a)); }
  c.sort((p,q)=>p-q);
  return c;
})();
const corridorMat=new THREE.MeshLambertMaterial({vertexColors:true,
  emissive:new THREE.Color(0x120e07),emissiveIntensity:1});
corridorMat.onBeforeCompile=(sh)=>{
  Object.assign(sh.uniforms,WL);
  sh.vertexShader=sh.vertexShader
    .replace('#include <common>','#include <common>\nvarying vec3 vWPos; attribute float aCanopy; attribute float aS; attribute float aLat; attribute float aMat; attribute float aThin; attribute float aSlope;\nvarying float vCanopy; varying float vS; varying float vLat; varying float vMat; varying float vThin; varying float vSlope;')
    .replace('#include <worldpos_vertex>','#include <worldpos_vertex>\n{ vec4 wp2=modelMatrix*vec4(transformed,1.0); vWPos=wp2.xyz; vCanopy=aCanopy; vS=aS; vLat=aLat; vMat=aMat; vThin=aThin; vSlope=aSlope; }');
  sh.fragmentShader=sh.fragmentShader
    .replace('#include <common>','#include <common>\nvarying vec3 vWPos; varying float vCanopy; varying float vS; varying float vLat; varying float vMat; varying float vThin; varying float vSlope;\n'+WL_GLSL)
    .replace('#include <color_fragment>',`#include <color_fragment>
    if(vMat<0.5){
      float slab=wlHash(vec2(floor(vS/8.7),0.0));
      float seam=smoothstep(0.42,0.0,abs(fract(vS/8.7)-0.5)*8.7-(0.30+0.30*slab));
      float repair=smoothstep(0.63,0.78,wlNoise(vWPos.xz*0.055+vec2(17.0,3.0)));
      float grain=wlNoise(vWPos.xz*2.1)*0.5+wlNoise(vWPos.xz*6.3+9.1)*0.5;
      float wear=smoothstep(0.75,0.05,abs(vLat));
      diffuseColor.rgb*=1.0-seam*0.115-repair*0.065-(grain-0.5)*0.085;
      diffuseColor.rgb*=1.0+wear*0.045;
    } else {
      float g=wlNoise(vWPos.xz*0.36)*0.6+wlNoise(vWPos.xz*1.15+5.3)*0.4;
      float edge=abs(vLat);
      float brk=wlNoise(vWPos.xz*0.55+vec2(3.1,9.7))*0.6+wlNoise(vWPos.xz*1.9)*0.4;
      float scuff=smoothstep(1.02,1.55,edge+(brk-0.5)*0.42);
      diffuseColor.rgb=mix(diffuseColor.rgb,diffuseColor.rgb*vec3(1.10,1.06,0.94),(1.0-scuff)*0.55);
      float loam=smoothstep(0.62,0.18,abs(edge-1.28)+(brk-0.5)*0.5);
      diffuseColor.rgb=mix(diffuseColor.rgb,vec3(0.44,0.36,0.25),loam*0.30);
      diffuseColor.rgb*=0.92+0.16*g;
      float blendM=smoothstep(1.5,3.4,edge);
      vec3 preM=diffuseColor.rgb;
      ${COMMON_GLSL}
      diffuseColor.rgb=mix(preM,diffuseColor.rgb,blendM);
      ${DROVE_GLSL}
    }`)
    .replace('vec3 outgoingLight = ',
      'float wl=cloudShadowAt(vWPos.xz)*dappleAt(vWPos.xz,vCanopy);\n'+
      'if(vMat<0.5) wl=mix(1.0,wl,0.55);\n'+
      'reflectedLight.directDiffuse*=wl;\n'+
      'reflectedLight.indirectDiffuse=reflectedLight.indirectDiffuse*mix(0.86,1.0,wl)+diffuseColor.rgb*(vMat<0.5?0.30:0.34)*wl;\n'+
      'vec3 outgoingLight = ');
};

const ISLAND_MESHES=[];   // everything the island itself pays for, per copy
const HOST_MESHES=[];
function bookMesh(m,island,copy){ (island?ISLAND_MESHES:HOST_MESHES).push(m); m.userData.copy=copy; return m; }

// island corridor rows are indexed by LOCAL station so the mesh is the same
// mesh under every placement; host segments use their own world frames
function buildCorridorSegment(seg){
  const isIsland=seg.island;
  const F=isIsland?LFRAME:seg.F;
  const T=isIsland?XFORMS[seg.copy]:null;
  const row=QCFG.row;
  const rows=Math.max(2,Math.round(F.len/row)+1);
  const W=COLS.length;
  const P=new Float32Array(rows*W*3), C=new Float32Array(rows*W*3);
  const CA=new Float32Array(rows*W), SS=new Float32Array(rows*W), LT=new Float32Array(rows*W), MT=new Float32Array(rows*W);
  const TH=new Float32Array(rows*W), SL=new Float32Array(rows*W);
  const IDX=[];
  for(let r=0;r<rows;r++){
    const s=F.len*r/(rows-1);
    const fr=getFrame(F,s);
    const enc=isIsland?enclosureAt(s):0.12;
    for(let j=0;j<W;j++){
      const u=COLS[j], a=Math.abs(u), k=r*W+j;
      const x=fr.x+fr.lx*u, z=fr.z+fr.lz*u;
      let y, mat, cc, th=0, sl=0;
      if(a<=RH+1e-4){
        y=fr.y+CROWN*(1-(a/RH)*(a/RH));
        mat=0;
        const tl=Math.abs(u)/RH;
        cc=C_ROAD_CORE.clone().lerp(C_ROAD_MID,smooth(0.0,0.62,tl)).lerp(C_ROAD_EDGE,smooth(0.62,1.0,tl));
      } else {
        mat=1;
        let base;
        if(isIsland){
          const ri=routeInfoL(x,z);
          y=groundL(x,z);
          sl=Math.abs(groundL(x+fr.lx*3,z+fr.lz*3)-groundL(x-fr.lx*3,z-fr.lz*3))/6;
          th=thinSoilL(x,z,sl);
          base=groundColorL(x,z,0,enc,th,y-ri.y,ri).clone();
        } else {
          y=groundW(x,z);
          base=groundColorL(x,z,0,enc,0,0,null).clone();
        }
        const seamW=0.34, shoW=lerp(1.05,0.55,enc), grW=lerp(2.6,1.5,enc);
        const d0=a-RH;
        cc=base;
        cc.lerp(C_WORNGRASS,1-smooth(seamW+shoW,seamW+shoW+grW,d0));
        cc.lerp(C_SHOULDER,(1-smooth(seamW,seamW+shoW,d0))*lerp(0.86,0.45,enc));
        cc.lerp(C_SEAM,1-smooth(seamW*0.55,seamW,d0));
      }
      if(isIsland){
        const w=T.fwd(x,z);
        P[k*3]=w[0]; P[k*3+1]=T.fwdY(y); P[k*3+2]=w[1];
      } else {
        P[k*3]=x; P[k*3+1]=y; P[k*3+2]=z;
      }
      C[k*3]=cc.r; C[k*3+1]=cc.g; C[k*3+2]=cc.b;
      CA[k]=enc; SS[k]=(seg.g0+s); LT[k]=u/RH; MT[k]=mat;
      TH[k]=th; SL[k]=sl;
    }
  }
  for(let r=0;r<rows-1;r++) for(let j=0;j<W-1;j++){
    const k=r*W+j;
    IDX.push(k,k+W,k+1, k+1,k+W,k+W+1);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(C,3));

  let nNear=0,nMid=0,nAll=0,nRound=0;
  for(const t of ordered){
    if(nAll>=QCFG.bandTreeCap) break;
    nAll++;
    let tier=(t.d<=QCFG.nearD)?2:((t.d<=QCFG.midD)?1:0);
    // the caps bound spend, but never below the rider's nose: a tier-1 trunk
    // at the verge is a slab with a sparse crown, and the rule is written —
    // anything passed within ~10 m stays articulated
    if(tier===2&&nNear>=QCFG.capNear&&t.d>12) tier=1;
    if(tier===1&&nMid>=QCFG.capMid) tier=0;
    const overhang=overhangFor(t);
    if(tier===2){ buildTree(nearB,t,2,overhang,true); local.articulatedNear++; nNear++; }
    else if(tier===1){
      const round=(nRound<QCFG.roundMid&&t.d<=64);
      if(round) nRound++;

    else { buildTree(midB,t,0,undefined,false); local.farTrees++; }
    local.trees++;

    const dark=mixc(PAL.woodDeep,PAL.bark,0.30).lerp(col(PAL.leafShade),0.18);
    addPatch(uB,t.x,seatOnGroundL(t.x,t.z,0)+0.03,t.z,1.1*t.scl+st.r(0,0.7),dark);

      const nr=Math.round(st.i(2,4)*QCFG.under);

        const a=st.r(0,TAU), rr=st.r(0.7,2.4)*t.scl;
        const x=t.x+Math.cos(a)*rr, z=t.z+Math.sin(a)*rr;

  }
  // ---- growth on thin ground ----
  // The rule island 01 learned and this island inherits: in open field, growth
  // is held to PATCHES and the VERGE, never sprinkled. An even scatter of
  // tufts across a common reads as litter (A4), and on ground this bare it
  // would also erase the only thing worth looking at, which is the ground.
  // What changes here is the vocabulary of what grows: grazed tussock instead
  // of hay, cushion plants where the rock is at the surface, seedheads only
  // where something is out of the wind, and stone in RUNS rather than singly.
  {
    // A4: an even scatter of single tufts across an open field reads as
    // litter, not as grass. Fewer sites, and each one grows a CLUMP — which is
    // also how grazed turf actually works, because what the sheep leave is
    // whatever they could not get their teeth around.
    const N=Math.round(QCFG.tuftBand*BAND/10*QCFG.under*0.44);
    const st=subStream('under',bi);

      const lat=(st.chance(0.5)?1:-1)*(roll<0.62?st.r(RH+0.55,RH+9):st.r(RH+9,30));
      const x=fr.x+fr.lx*lat+st.r(-3,3), z=fr.z+fr.lz*lat+st.r(-3,3);

          clump(x,z,st.i(4,8),st.r(0.8,2.2),(cx,cz)=>{
            addTuft(uB,cx,groundL(cx,cz),cz,st,gc.clone().lerp(col(PAL.leafShade),0.28),
              gc.clone().lerp(col(PAL.sunGrass),0.36),

  // The growth sampler above reaches thirty metres and the open-ground groves
  // start at a hundred and sixty-eight, so the band the eye actually rests on
  // was carrying 0.7 objects per kilometre. This pass fills it with the one
  // thing that belongs there: bedrock coming through, in runs, following the
  // contour it beds along. No new vocabulary, nothing that stands up, nothing
  // that could be mistaken for a landmark — A2 is untouched because a stone
  // bed is ground.

    const st=subStream('midstone',bi);
    const N=Math.round(9*BAND/100*QCFG.under);
    for(let i=0;i<N;i++){
      const s=st.r(b.s0,b.s1);
      if(clamp(1-enclosureAt(clamp(s,0,L_ISL))*2.4,0,1)<0.9) continue;   // open middle only
      const fr=getFrame(LFRAME,clamp(s,0,LFRAME.len-1));
      const lat=(st.chance(0.5)?1:-1)*st.r(34,118);

        const bx=x+Math.sin(ang)*rr+st.r(-1.1,1.1), bz=z+Math.cos(ang)*rr+st.r(-1.1,1.1);
        if(routeInfoL(bx,bz).d<32) continue;
        const r=st.r(0.34,0.86)*(q?st.r(0.55,1.0):1);
        const by=groundL(bx,bz);
        addBlob(uB,bx,by+r*0.20,bz,st,r*st.r(1.3,2.1),r*st.r(0.26,0.40),r*st.r(0.9,1.5),cLit,cSh,0);

    const st=subStream('verge',bi);
    const N=Math.round((b.s1-b.s0)/4.2*QCFG.under);

      const s=st.r(b.s0,b.s1);
      const fr=getFrame(LFRAME,clamp(s,0,LFRAME.len-1));
      const side=st.chance(0.5)?1:-1;
      const off=st.r(0,1)**0.62;
      const lat=side*(RH+0.34+off*4.6);
      const x=fr.x+fr.lx*lat, z=fr.z+fr.lz*lat;
      const ri=routeInfoL(x,z);
      if(ri.d<EXCL){ local.corridorRejects++; continue; }
      if(droveDist(x,z)<DROVE.w*0.55) continue;
      const y=groundL(x,z);
      const enc=enclosureAt(ri.s);
      const thin=thinSoilL(x,z,0);
      const wear=clamp(1-off*1.6,0,1);
      uB.can=clamp(enc,0,1);
      const r2=st.f();
      const worn=mixc(PAL.meadow,PAL.bark,0.34).lerp(col(PAL.sunGrass),0.22);
      const lush=mixc(PAL.meadow,PAL.leafShade,0.20).lerp(col(PAL.sunGrass),0.26);
      const vclump=(n,rad,fn)=>{ for(let q=0;q<n;q++){
