<!DOCTYPE html>
<html lang="en">
<head>

<title>Summerglass Hollow</title>

  canvas { display:block; }
  #hint {
    position:fixed; left:14px; bottom:12px; user-select:none; pointer-events:none;
    color:#F2E3BC; text-shadow:0 1px 3px rgba(22,52,44,0.6);
    font:14px system-ui, sans-serif; letter-spacing:0.02em; opacity:0.9; z-index:9;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
  }
}

<body>
<div id="hint">W/S ride &middot; A/D steer &amp; choose &middot; drag to look &middot; Space pause &middot; R restart</div>
<script type="module">
import * as THREE from 'three';
// ============================================================
// SUMMERGLASS HOLLOW
// A seeded bicycle passage through one remembered summer afternoon.
// Two stages: the PLAN freezes the world's identity from the seed;
// the REALIZATION spends geometry on it at the chosen quality.
// The hills are the argument: they hide, reveal, compress and release.
// ============================================================

const capturedErrors=[];
window.addEventListener('error',(e)=>{ capturedErrors.push(String(e.message||e)); });
window.addEventListener('unhandledrejection',(e)=>{ capturedErrors.push('rejection: '+String((e.reason&&e.reason.message)||e.reason)); });

// ---------- seed + quality ----------
const qs=new URLSearchParams(location.search);
const SEED_TEXT=(qs.get('seed')&&qs.get('seed').length)?qs.get('seed'):'SUMMERGLASS-8421';
// the tier is not read until the plan is frozen; QUALITY_READS records when it
// first was, and the plan stage records the count it saw
let QUALITY_READS=0, QUALITY_READS_AT_PLAN=-1;
const QUALITY=(()=>{ const q=(qs.get('quality')||'standard').toLowerCase();
  return (q==='low'||q==='high')?q:'standard'; })();
const readQuality=()=>{ QUALITY_READS++; return QUALITY; };

function xmur3(str){ let h=1779033703^str.length;
  for(let i=0;i<str.length;i++){ h=Math.imul(h^str.charCodeAt(i),3432918353); h=(h<<13)|(h>>>19); }
  return ()=>{ h=Math.imul(h^(h>>>16),2246822507); h=Math.imul(h^(h>>>13),3266489909); return (h^=h>>>16)>>>0; };
}
const SEED_HASH=xmur3(SEED_TEXT)();
function mb32(a){ return ()=>{ a|=0; a=(a+0x6D2B79F5)|0;
  let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
function streamFrom(f){
  return {
    f, r:(a,b)=>a+(b-a)*f(), i:(a,b)=>Math.floor(a+(b-a+1)*f()),
    chance:(p)=>f()<p, pick:(arr)=>arr[Math.floor(f()*arr.length)],
    gauss:()=>{ let s=0; for(let k=0;k<4;k++) s+=f(); return (s-2)*0.72; },
  };
}
// named, independent streams — a change in one can never perturb another
function makeStream(name){ return streamFrom(mb32(xmur3(SEED_TEXT+'::'+name)())); }
// positional sub-stream: identity depends on (seed, name, ids) only, never on
// realization order — so an object is the same object every time it re-enters residency
function subStream(name,...ids){ return streamFrom(mb32(xmur3(SEED_TEXT+'::'+name+'#'+ids.join(','))())); }

const ROUTE=makeStream('plan/route'), ELEV=makeStream('plan/elevation'), FORKS=makeStream('plan/fork'),
      LANDF=makeStream('plan/landform'), WATER=makeStream('plan/water'), HERO=makeStream('plan/hero'),
      GROVE=makeStream('plan/groves'), ECO=makeStream('plan/ecology'), LAND=makeStream('plan/landmarks'),
      LIFE=makeStream('plan/life'), SND=makeStream('plan/sound'), WX=makeStream('plan/weather'),
      CLOUD=makeStream('plan/clouds');

// ---------- hashes ----------
function fnv(){ let h=0x811C9DC5; return {
  feed(...vals){ for(const v of vals){ const s=(typeof v==='number')?(Math.abs(v)<1e-7?'0.0000':v.toFixed(4)):String(v);
    for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,0x01000193); } } },
  hex(){ return (h>>>0).toString(16).padStart(8,'0'); } }; }
const H={ route:fnv(), elev:fnv(), terrain:fnv(), eco:fnv(), life:fnv(), weather:fnv(), plan:fnv(), real:fnv() };

// ---------- palette: eight colours, one summer ----------
const PAL={
  sky:0x5EC2E8,            // clear summer sky blue
  cloud:0xFFFBEF,          // warm cloud white
  sunGrass:0xC3E56A,       // pale sunlit grass
  meadow:0x74B851,         // medium summer green
  leafShade:0x3C7A55,      // cool blue-green canopy shadow
  woodDeep:0x1B4239,       // deep woodland teal
  bark:0x6B4A34,           // warm umber bark and soil
  road:0xE9DCB4,           // pale warm road stone
  blossom:0xEBAFB9,        // small blossom / seedhead accent
};
const col=(h)=>new THREE.Color(h);
const mixc=(a,b,t)=>col(a).lerp(col(b),t);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,v)=>{ const t=clamp((v-a)/(b-a||1e-6),0,1); return t*t*(3-2*t); };
const TAU=Math.PI*2;
const lumOf=(c)=>0.2126*c.r+0.7152*c.g+0.0722*c.b;

// ---------- frozen value noise ----------
function noiseTable(stream){ const T=new Float32Array(1024); for(let i=0;i<1024;i++) T[i]=stream.f(); return T; }
function makeNoise2(T){
  const hash=(x,y)=>{ let n=(x*374761393+y*668265263)|0; n=(n^(n>>>13))|0; n=Math.imul(n,1274126177); return T[((n^(n>>>16))>>>0)&1023]; };
  return (x,y)=>{
    const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
    const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
    return lerp(lerp(hash(xi,yi),hash(xi+1,yi),u),lerp(hash(xi,yi+1),hash(xi+1,yi+1),u),v);
  };
}
const nLand=makeNoise2(noiseTable(LANDF)), nEco=makeNoise2(noiseTable(ECO));
function fbmL(x,y){ return nLand(x,y)*0.53+nLand(x*2.07+7.7,y*2.07+3.1)*0.29+nLand(x*4.31+17.9,y*4.31+11.3)*0.18; }
function fbmE(x,y){ return nEco(x,y)*0.62+nEco(x*2.51+5.1,y*2.51+9.7)*0.38; }
// ============================================================
// PLAN — CHAPTERS
// Eight chapters, laid out on the clock of a ~11 minute ride at cruise,
// then jittered structurally by seed.
// ============================================================
const CRUISE=9.5;
const L_TOTAL=ROUTE.r(6180,6560);
const TAIL=430;                                   // the road runs on past the rest
const CH=[
  {key:'gate',      name:'The Dappled Gate',     end:0.111},
  {key:'sunbank',   name:'Sunbank',              end:0.215},
  {key:'fernfold',  name:'Fernfold',             end:0.333},
  {key:'fork',      name:'The Mosswater Choice', end:0.417},
  {key:'joining',   name:'Joining Woods',        end:0.611},
  {key:'glasswater',name:'Glasswater Shelf',     end:0.722},
  {key:'cloudstep', name:'Cloudstep Rise',       end:0.861},
  {key:'bellroot',  name:'Bellroot Exhale',      end:1.0},
];
for(let i=0;i<CH.length-1;i++){
  CH[i].end=clamp(CH[i].end+ROUTE.r(-0.012,0.012),(i?CH[i-1].end:0)+0.055,0.97);
}
const CHS={}; for(const c of CH) CHS[c.key]=c.end*L_TOTAL;
function chapEndPre(k){ const i=CH.findIndex(c=>c.key===k); return i>0?CH[i-1].end*L_TOTAL:0; }
const chapEnd=(k)=>CHS[k];
const chapStart=(k)=>{ const i=CH.findIndex(c=>c.key===k); return i? CH[i-1].end*L_TOTAL : 0; };
function chapterOf(s){ const f=clamp(s,0,L_TOTAL)/L_TOTAL;
  for(const c of CH) if(f<=c.end) return c.name; return CH[CH.length-1].name; }
function chapterKeyOf(s){ const f=clamp(s,0,L_TOTAL)/L_TOTAL;
  for(const c of CH) if(f<=c.end) return c.key; return 'bellroot'; }
H.route.feed(L_TOTAL); for(const c of CH) H.route.feed(c.end);

// ============================================================
// PLAN — CENTRELINE
// Curvature is a smooth seeded sum of long sinusoids, so the road is
// tangent- and curvature-continuous by construction: no kinks, ever.
// ============================================================
const MIN_RADIUS=158;
const SDS=2;                                        // plan sample step, metres
const NS=Math.ceil((L_TOTAL+TAIL)/SDS)+1;
const CURVE=[];
{
  let amp=0;
  // one long sweeping bow, so two chapters far apart on the road can end up
  // near each other in the country, then four shorter ones for flow
  CURVE.push({wl:ROUTE.r(2100,3200),a:2.1,ph:ROUTE.r(0,TAU)}); amp+=2.1;
  for(let i=0;i<4;i++){
    const wl=ROUTE.r(255,1050), a=ROUTE.r(0.30,0.85);
    CURVE.push({wl,a,ph:ROUTE.r(0,TAU)});
    amp+=a;
  }
  const k=1/MIN_RADIUS/amp;
  for(const c of CURVE){ c.a*=k; H.route.feed(c.wl,c.a,c.ph); }
}
// the opening is composed, not sampled: the road bends away inside the first
// two hundred metres so the rider is promised somewhere rather than shown it
const OPEN_BOW=(ROUTE.chance(0.5)?1:-1)/ROUTE.r(340,430);
function curvatureAt(s){
  let k=0;
  for(const c of CURVE) k+=c.a*Math.sin(TAU*s/c.wl+c.ph);
  k+=OPEN_BOW*Math.sin(Math.PI*clamp((s-20)/230,0,1));
  return k;
}
H.route.feed(OPEN_BOW);

// ============================================================
// PLAN — ELEVATION
// Rollers, signature climbs, chapter shaping; then a grade limiter and a
// vertical easing pass so every grade arrives and leaves smoothly.
// ============================================================
const S_FORK_SPLIT_FRAC=0.417;
const EDS=2;
const GRADE_CAP=0.066;
const FORK_SIDE=FORKS.chance(0.5)?1:-1;             // +1: Sunpath climbs to the left
const S_SPLIT=chapEndPre('fork')+FORKS.r(30,90);   // the wedge
const ARM_LEN=FORKS.r(560,660);
const S_MERGE_SPINE=S_SPLIT+ARM_LEN;
const S_SHELF0=S_SPLIT, S_SHELF1=S_MERGE_SPINE;
const FORK_COMMIT_LEAD=118;   // metres past the split before the line is committed
CH[3].end=clamp(S_MERGE_SPINE/L_TOTAL,CH[2].end+0.05,CH[4].end-0.05);
for(const c of CH) CHS[c.key]=c.end*L_TOTAL;
const SUN_LIFT=FORKS.r(9,12), MOSS_DROP=FORKS.r(5.5,7.5);
const SUN_OUT=FORKS.r(34,46);
let MOSS_OUT=SUN_OUT*FORKS.r(0.66,0.80);
const MOSS_WOB=FORKS.r(7.5,10.5), SUN_WOB=FORKS.r(3,5);
const SUN_PH=FORKS.r(0,TAU), MOSS_PH=FORKS.r(0,TAU);
// The profile is not a ramp with ripples on it. It is a sequence of rises and
// falls — rollers — whose sizes are biased chapter by chapter, so a climb is
// three linked rises with partial recoveries and a hollow is a run of falls.
const BREATH=[], KNOTS=[];
const TREND=ELEV.r(0.0044,0.0074);   // the hollow climbs, gently, all the way through
const CHAP_BIAS=[];
{
  for(let i=0;i<2;i++) BREATH.push({wl:ELEV.r(1700,2900),a:ELEV.r(1.2,2.6),ph:ELEV.r(0,TAU)});
  const G=chapEnd('gate'), SB=chapEnd('sunbank'), FF=chapEnd('fernfold'), FK=chapEnd('fork'),
        JW=chapEnd('joining'), GW=chapEnd('glasswater'), CS=chapEnd('cloudstep');
  const B=(s,v)=>CHAP_BIAS.push({s,v});
  const HOLD=(s0,s1,v)=>{ B(s0,v); B(s1,v); };
  B(-260,0.05);
  HOLD(G*0.20,G*0.46,-ELEV.r(0.40,0.50));               // the opening looks down the hollow
  B(G*0.98,0.24);
  HOLD(G+110,SB-170,ELEV.r(0.46,0.58));                 // Sunbank rides up across open ground
  B(SB+30,0.02);
  HOLD(SB+140,FF-190,-ELEV.r(0.56,0.68));               // Fernfold falls into the compression
  B(FF+30,-0.06);
  HOLD(S_SHELF0-40,S_SHELF1+40,0.05);                   // the fork stands on a shelf
  HOLD(FK+200,FK+ELEV.r(560,680),ELEV.r(0.54,0.64));    // a signature climb inside the trees
  B(JW-140,-ELEV.r(0.10,0.20));
  HOLD(JW+90,GW-ELEV.r(260,340),0.08);                  // Glasswater is a shelf
  B(GW-90,0.10);
  HOLD(GW+90,lerp(GW,CS,0.38),ELEV.r(0.56,0.66));       // Cloudstep: three linked rises
  B(lerp(GW,CS,0.55),ELEV.r(0.02,0.14));                //   with partial recoveries
  HOLD(lerp(GW,CS,0.62),CS-110,ELEV.r(0.56,0.66));
  HOLD(CS+90,CS+ELEV.r(250,340),ELEV.r(0.46,0.58));     // the last shelf under Bellroot
  HOLD(L_TOTAL-ELEV.r(470,540),L_TOTAL-ELEV.r(120,180),-ELEV.r(0.54,0.66));  // the valley lets go
  B(L_TOTAL+TAIL+200,-0.20);
  CHAP_BIAS.sort((p,q)=>p.s-q.s);
  const biasAt=(s)=>{
    if(s<=CHAP_BIAS[0].s) return CHAP_BIAS[0].v;
    for(let i=1;i<CHAP_BIAS.length;i++){
      if(s<=CHAP_BIAS[i].s){
        const t=(s-CHAP_BIAS[i-1].s)/Math.max(1,CHAP_BIAS[i].s-CHAP_BIAS[i-1].s);
        return lerp(CHAP_BIAS[i-1].v,CHAP_BIAS[i].v,t*t*(3-2*t));
      }
    }
    return CHAP_BIAS[CHAP_BIAS.length-1].v;
  };
  // climbs are laid a little gentler than descents, which is both kinder on a
  // bicycle and what buys the route its ascent inside the grade contract
  const GUP=0.040, GDN=0.049;
  let s=-220, dir=ELEV.chance(0.5)?1:-1, y=0, run=0;
  KNOTS.push({s,y,dir});
  while(s<L_TOTAL+TAIL+240){
    const ds=ELEV.r(92,206);
    const mid=s+ds*0.5;
    const bias=clamp(biasAt(mid),-0.88,0.88);
    // amplitude is a fraction of what the grade contract allows. The direction
    // the chapter wants takes all of it; the other direction gets only what the
    // bias leaves, which is how a climb becomes linked rises with recoveries.
    const fav=(dir>0)===(bias>=0);
    const mag=Math.abs(bias);
    let amp=(dir>0?GUP:GDN)*ds*ELEV.r(0.84,1.0);
    if(!fav) amp*=clamp(1-1.30*mag,0.22,1);
    // the fork stands on a shelf so both arms have room to part vertically
    amp*=1-0.62*smooth(S_SHELF0-190,S_SHELF0-30,mid)*(1-smooth(S_SHELF1+30,S_SHELF1+190,mid));
    amp=Math.min(amp,0.052*ds);
    y+=dir*Math.max(0.25,amp);
    s+=ds;
    KNOTS.push({s,y,dir});
    // where the land really means it, two or three rises link up with only a
    // partial recovery between them, instead of a strict up-down alternation
    const want=Math.sign(bias);
    const keep=(Math.abs(bias)>0.46&&dir===want&&run<2&&ELEV.f()<(Math.abs(bias)-0.44)*1.8);
    if(keep) run++; else { dir=-dir; run=0; }
  }
  for(const k of KNOTS) H.elev.feed(k.s,k.y);
  H.elev.feed(TREND);
  for(const b of BREATH) H.elev.feed(b.wl,b.a,b.ph);
}
function knotY(s,scale){
  let lo=0, hi=KNOTS.length-1;
  if(s<=KNOTS[0].s) return KNOTS[0].y*scale;
  if(s>=KNOTS[hi].s) return KNOTS[hi].y*scale;
  while(hi-lo>1){ const m=(lo+hi)>>1; if(KNOTS[m].s<=s) lo=m; else hi=m; }
  const a=KNOTS[lo], b=KNOTS[hi];
  const t=(s-a.s)/Math.max(1e-6,b.s-a.s);
  return lerp(a.y,b.y,t*t*(3-2*t))*scale;
}
function blurArray(y,passes){
  const n=y.length, t=new Float32Array(n);
  for(let p=0;p<passes;p++){
    t[0]=y[0]; t[n-1]=y[n-1];
    for(let i=1;i<n-1;i++) t[i]=(y[i-1]+y[i]*2+y[i+1])*0.25;
    y.set(t);
  }
}
function buildElevation(scale){
  const n=Math.ceil((L_TOTAL+TAIL)/EDS)+1;
  const y=new Float32Array(n);
  for(let i=0;i<n;i++){
    const s=i*EDS;
    let v=knotY(s,scale)+TREND*s;
    for(const B of BREATH) v+=B.a*Math.sin(TAU*s/B.wl+B.ph);
    y[i]=v;
  }
  for(let i=1;i<n;i++){ const d=y[i]-y[i-1], m=GRADE_CAP*EDS;
    if(d> m) y[i]=y[i-1]+m; else if(d<-m) y[i]=y[i-1]-m; }
  for(let i=n-2;i>=0;i--){ const d=y[i]-y[i+1], m=GRADE_CAP*EDS;
    if(d> m) y[i]=y[i+1]+m; else if(d<-m) y[i]=y[i+1]-m; }
  blurArray(y,54);                          // vertical easing, sigma ~ 10 m
  let asc=0,desc=0,maxG=0;
  for(let i=1;i<n;i++){ const d=y[i]-y[i-1];
    if(d>0) asc+=d; else desc-=d;
    maxG=Math.max(maxG,Math.abs(d)/EDS); }
  return {y,asc,desc,maxG,n};
}
const ASC_TARGET=ELEV.r(128,148);
let ELEVATION;
{
  const a=buildElevation(1.0);
  let scale=clamp(ASC_TARGET/Math.max(a.asc,1),0.80,1.22);
  ELEVATION=buildElevation(scale);
  if(ELEVATION.asc<ASC_TARGET*0.93||ELEVATION.asc>ASC_TARGET*1.09){
    scale=clamp(scale*ASC_TARGET/Math.max(ELEVATION.asc,1),0.80,1.24);
    ELEVATION=buildElevation(scale);
  }
  ELEVATION.rollerScale=scale;
  H.elev.feed(scale,ELEVATION.asc,ELEVATION.desc,ELEVATION.maxG);
}
function spineY(s){
  const i=clamp(s/EDS,0,ELEVATION.n-1), i0=Math.floor(i), t=i-i0, i1=Math.min(i0+1,ELEVATION.n-1);
  return lerp(ELEVATION.y[i0],ELEVATION.y[i1],t);
}
// rollers, measured on the built profile rather than assumed
const ROLLER_STAT=(()=>{
  const y=ELEVATION.y, n=ELEVATION.n;
  // collect extrema, then merge any pair whose swing is below the roller floor
  let ex=[{i:0,y:y[0],k:y[1]>=y[0]?-1:1}];
  for(let i=1;i<n-1;i++){
    if(y[i]>=y[i-1]&&y[i]>y[i+1]) ex.push({i,y:y[i],k:1});
    else if(y[i]<=y[i-1]&&y[i]<y[i+1]) ex.push({i,y:y[i],k:-1});
  }
  ex.push({i:n-1,y:y[n-1],k:y[n-1]>=y[n-2]?1:-1});
  for(;;){
    let bi=-1,bv=1e9;
    for(let i=1;i<ex.length-2;i++){
      const v=Math.abs(ex[i].y-ex[i+1].y);
      if(v<bv){ bv=v; bi=i; }
    }
    if(bi<0||bv>=1.5) break;
    ex.splice(bi,2);
  }
  let count=0, sumA=0, sumW=0;
  const amps=[];
  for(let i=1;i<ex.length-1;i++){
    if(ex[i].k!==1) continue;
    const amp=Math.min(ex[i].y-ex[i-1].y,ex[i].y-ex[i+1].y);
    const wl=(ex[i+1].i-ex[i-1].i)*EDS;
    if(amp>=1.2&&wl>=120){ count++; amps.push([Math.round(amp*20)/10,Math.round(wl)]); sumA+=amp*2; sumW+=wl; }
  }
  return {count,amps,meanAmpM:count?sumA/count:0,meanWavelengthM:count?sumW/count:0};
})();

// ---------- the spine walk ----------
const spine={x:new Float32Array(NS),y:new Float32Array(NS),z:new Float32Array(NS),hd:new Float32Array(NS)};
{
  let x=0,z=0,hd=ROUTE.r(0,TAU);
  for(let i=0;i<NS;i++){
    const s=i*SDS;
    spine.x[i]=x; spine.z[i]=z; spine.y[i]=spineY(s); spine.hd[i]=hd;
    const k=curvatureAt(s+SDS*0.5);
    hd+=k*SDS;
    x+=Math.sin(hd)*SDS; z+=Math.cos(hd)*SDS;
    if((i%64)===0) H.route.feed(x,z,spine.y[i]);
  }
}
function spineAt(s){
  const i=clamp(s/SDS,0,NS-1), i0=Math.floor(i), t=i-i0, i1=Math.min(i0+1,NS-1);
  return { x:lerp(spine.x[i0],spine.x[i1],t), y:lerp(spine.y[i0],spine.y[i1],t),
           z:lerp(spine.z[i0],spine.z[i1],t), hd:lerp(spine.hd[i0],spine.hd[i1],t) };
}

// ============================================================
// PLAN — THE MOSSWATER CHOICE
// Two arms that disagree about everything: height, radius, sightline,
// ground, and what they show you at the end.
// ============================================================
H.route.feed(FORK_SIDE,S_SPLIT,ARM_LEN,SUN_LIFT,MOSS_DROP,SUN_OUT,MOSS_OUT);

function armPoints(kind){
  const pts=[]; const n=26;
  const side=(kind==='sun'?FORK_SIDE:-FORK_SIDE);
  const out=(kind==='sun'?SUN_OUT:MOSS_OUT);
  const lift=(kind==='sun'?SUN_LIFT:-MOSS_DROP);
  const wobN=(kind==='sun'?1.0:2.0);                 // Mosswater turns more often
  const wobA=(kind==='sun'?SUN_WOB:MOSS_WOB);
  const wobP=(kind==='sun'?SUN_PH:MOSS_PH);
  const s0=S_SPLIT-70, s1=S_MERGE_SPINE+70;
  for(let i=0;i<=n;i++){
    const t=i/n, s=lerp(s0,s1,t);
    const sp=spineAt(s);

function reliefAt(x,z,d){
  const g=smooth(16,125,d);
  let r=(fbmL(x/520+11.7,z/520+2.9)-0.5)*186;      // the shape of the country
  r+=(fbmL(x/188+31.1,z/188+17.4)-0.5)*62;         // banks, shoulders, bowls
  r+=(fbmL(x/62+7.7,z/62+41.3)-0.5)*14;            // the ground's own roughness
  r*=g;
  if(KNOLL){ const dx=x-KNOLL.x, dz=z-KNOLL.z;
    r+=KNOLL.h*Math.exp(-(dx*dx+dz*dz)/(KNOLL.r*KNOLL.r))*smooth(120,340,d); }
  return r;
}

// ---------- water: the beck, the ford, the Glasswater pool ----------
const STREAM=[];
// The beck keeps one side of the road for the whole hollow — no crossing where
// the lanes are close together — and crosses once, under a low bridge, well
// after the rejoin.
const BECK_X=lerp(0,1,WATER.r(0.34,0.62));
let BECK_XG=0;
{
  const SIDE=-FORK_SIDE;
  const g0=chapEnd('sunbank')+WATER.r(20,90), g1=chapEnd('joining')-WATER.r(60,140);
  BECK_XG=lerp(S_MERGE_G+150,g1-160,BECK_X);
  let off=WATER.r(18,26), ph=WATER.r(0,TAU);
  const armAt=(g)=>(g>S_SPLIT-20&&g<S_MERGE_G+20?'moss':'sun');
  for(let g=g0;g<=g1;g+=9){
    const arm=armAt(g);
    const fr=getFrame(FRAMES[arm],clamp(toLocal(arm,g),0,FRAMES[arm].len-1));
    off+=WATER.r(-1.3,1.3); off=clamp(off,15,34);
    const breathe=Math.sin(g*0.0095+ph)*4.0;
    const flip=1-2*smooth(BECK_XG-15,BECK_XG+15,g);
    const o=(off+breathe)*SIDE*flip;
    const p=new THREE.Vector3(fr.x+fr.lx*o,0,fr.z+fr.lz*o);
    p.g=g;
    STREAM.push(p);
  }
  // never inside the corridor except at the one place it was asked to cross
  for(const p of STREAM){
    if(Math.abs(p.g-BECK_XG)<28) continue;
    for(let guard=0;guard<16;guard++){
      const ri=routeInfo(p.x,p.z);
      const dm=Math.min(ri.dA[0],ri.dA[1]);
      if(dm>=13) break;
      const arm=(ri.dA[1]<ri.dA[0])?'moss':'sun';
      const F=FRAMES[arm];
      const fr=getFrame(F,clamp(nearestS(F,p.x,p.z),0,F.len-1));
      const side=Math.sign((p.x-fr.x)*fr.lx+(p.z-fr.z)*fr.lz)||1;
      const push=Math.min(6,(13.8-dm));
      p.x+=fr.lx*side*push; p.z+=fr.lz*side*push;
    }
  }
  for(let q=0;q<8;q++) for(let i=1;i<STREAM.length-1;i++){
    STREAM[i].x=(STREAM[i-1].x+STREAM[i].x*2+STREAM[i+1].x)*0.25;
    STREAM[i].z=(STREAM[i-1].z+STREAM[i].z*2+STREAM[i+1].z)*0.25; }
  // smoothing can pull a point back toward the stone: hold the line afterwards
  for(const p of STREAM){
    if(Math.abs(p.g-BECK_XG)<28) continue;
    for(let guard=0;guard<10;guard++){
      const ri=routeInfo(p.x,p.z);
      const dm=Math.min(ri.dA[0],ri.dA[1]);
      if(dm>=12.5) break;
      const arm=(ri.dA[1]<ri.dA[0])?'moss':'sun';
      const F=FRAMES[arm];
      const fr=getFrame(F,clamp(nearestS(F,p.x,p.z),0,F.len-1));
      const side=Math.sign((p.x-fr.x)*fr.lx+(p.z-fr.z)*fr.lz)||1;
      p.x+=fr.lx*side*(13.2-dm); p.z+=fr.lz*side*(13.2-dm);
    }
  }
  // the water sits in the land it runs through, and at the crossing it sits
  // well under the road so the bridge has something to span
  for(const p of STREAM){
    const ri=routeInfo(p.x,p.z);
    const land=refAt(p.x,p.z)+reliefAt(p.x,p.z,ri.d);
    p.y=land-0.85;
    if(Math.abs(p.g-BECK_XG)<40) p.y=Math.min(p.y,ri.y-2.15);
  }
  for(let q=0;q<7;q++) for(let i=1;i<STREAM.length-1;i++)
    STREAM[i].y=(STREAM[i-1].y+STREAM[i].y*2+STREAM[i+1].y)*0.25;
  const desc=STREAM[0].y>=STREAM[STREAM.length-1].y;
  if(desc){ for(let i=1;i<STREAM.length;i++) STREAM[i].y=Math.min(STREAM[i].y,STREAM[i-1].y-0.012); }
  else { for(let i=STREAM.length-2;i>=0;i--) STREAM[i].y=Math.min(STREAM[i].y,STREAM[i+1].y-0.012); }
}
const sCell=26, sGrid=new Map();
for(const p of STREAM){ const k=rKey(Math.floor(p.x/sCell),Math.floor(p.z/sCell));
  let c=sGrid.get(k); if(!c){c=[];sGrid.set(k,c);} c.push(p); }
function streamInfo(x,z){
  const gx=Math.floor(x/sCell), gz=Math.floor(z/sCell);
  let bd=1e18,by=0;
  for(let ax=gx-1;ax<=gx+1;ax++) for(let az=gz-1;az<=gz+1;az++){
    const c=sGrid.get(rKey(ax,az)); if(!c) continue;
    for(const p of c){ const dx=p.x-x,dz=p.z-z,d=dx*dx+dz*dz; if(d<bd){bd=d;by=p.y;} } }
  return {d:bd>1e17?999:Math.sqrt(bd),y:by};
}
// the Glasswater pool: set back behind the fringe, shown through one gap
// A pool is a composed thing, not an accident of where the noise happened to
// dip. Two rules make it one: it must stand entirely clear of the lane's own
// ground, and its surface must sit a knowable few metres below the lane, so the
// rider looks *down* onto water instead of at a bank. Everything else — the
// basin under it, the shelf across to it, the bank behind it — is derived.
// A reveal that opens beside the rider is not a reveal — you ride past it and
// never turn your head. So the station is chosen, not sampled: among the
// candidates in the chapter, take the one where the water sits about twenty
// degrees off the heading a hundred metres back, which puts it in frame and
// moving across it as you come on.
function composePool(arm,gLo,gHi,off,leadHi,halfFov,rx,rz){
  // Score a candidate by how long the water actually stays inside the rider's
  // own view cone on the way in, not by one flattering instant. A pool that is
  // dead ahead for a single frame and abeam for the rest is not a moment.
  let best=null, fallback=null;
  for(let k=0;k<=28;k++){
    const g=lerp(gLo,gHi,k/28);
    const fr=getFrame(FRAMES[arm],clamp(toLocal(arm,g),0,FRAMES[arm].len-1));
    for(const side of [-1,1]){
      const cx=fr.x+fr.lx*off*side, cz=fr.z+fr.lz*off*side;
      // measured against the direction the camera actually faces — a chord to a
      // look-ahead point — not the instantaneous tangent, which on a bend can be
      // fifteen degrees off where the rider is really looking
      let hits=0, first=null, last=null, weight=0, angMid=0;
      for(let L=leadHi;L>=34;L-=8){
        const fa=getFrame(FRAMES[arm],clamp(toLocal(arm,g-L),0,FRAMES[arm].len-1));
        const fb=getFrame(FRAMES[arm],clamp(toLocal(arm,g-L+22),0,FRAMES[arm].len-1));
        let hx=fb.x-fa.x, hz=fb.z-fa.z; const hl=Math.hypot(hx,hz)||1; hx/=hl; hz/=hl;
        const dx=cx-fa.x, dz=cz-fa.z, len=Math.hypot(dx,dz)||1;
        const ang=Math.acos(clamp((dx*hx+dz*hz)/len,-1,1));
        if(L>leadHi*0.68&&L<leadHi*0.82) angMid=ang*180/Math.PI;
        if(ang<halfFov){ hits++; weight+=1-ang/halfFov; if(first===null) first=L; last=L; }
      }
      const cand={score:-weight,g,side,cx,cz,fr,hits,
        windowM:(first!==null)?(first-last):0, angDeg:angMid};
      if(!fallback||cand.score<fallback.score-1e-9) fallback=cand;
      // near the fork the other arm is close enough that a pool sized off one
      // lane can land squarely on the other. Every candidate has to clear both.
      let clear=true;
      for(let a=0;a<12&&clear;a++){
        const t=a/12*TAU;
        const px=cx+Math.cos(t)*rx*1.06, pz=cz+Math.sin(t)*rz*1.06;
        if(routeInfo(px,pz).d<EXCL+7) clear=false;
      }
      if(clear&&(!best||cand.score<best.score-1e-9)) best=cand;
    }
  }
  return best||fallback;
}
const POOL=(()=>{

  const off=rx*1.04+EXCL+WATER.r(7,13);

const PONDS=[POOL,MOSSPOOL];
for(const P of PONDS) P.bed=P.y-2.0;
// A pool set in a basin is invisible from a road at eye height: the near rim
// occludes the whole surface, which is how a chapter called Glasswater Shelf
// ended up with no visible water in it. So each pool is given a shelf — a wedge
// of ground between the lane and the near bank that falls away monotonically,
// clamped below the rider's sight line. The far bank is deliberately left high,
// because the water needs a dark bank behind it to read against.
const SHELVES=PONDS.map(P=>{
  const arm=(P.name==='mosswater')?'moss':'sun';
  const fr=getFrame(FRAMES[arm],clamp(toLocal(arm,P.g),0,FRAMES[arm].len-1));
  const off=(P.cx-fr.x)*fr.lx+(P.cz-fr.z)*fr.lz;    // signed lateral offset of the pool
  return { P, arm, fr, off, side:Math.sign(off)||1,
           uNear:Math.abs(off)-P.rx*0.94,           // where the near bank begins
           halfV:P.rx*1.55+26,                      // how far along the lane it opens
           backV:(P.rx*1.55+26)*2.4 };              // and much further back up the approach
});
function shelfY(x,z,y,rd){
  for(const S of SHELVES){
    const dx=x-S.fr.x, dz=z-S.fr.z;
    const v=dx*S.fr.tx+dz*S.fr.tz;                  // along the lane
    const ext=(v<0)?S.backV:S.halfV;                // the approach side reaches further
    if(Math.abs(v)>ext) continue;
    const u=(dx*S.fr.lx+dz*S.fr.lz)*S.side;         // toward the pool
    // The shelf begins outside the verge, never inside it: within the corridor's
    // own row spacing it changes faster than the drawn mesh can follow, and
    // anything standing on the analytic ground would float above its triangles.
    if(u<RH+7.5||u>S.uNear+1.5) continue;
    const t=clamp((u-(RH+7.5))/Math.max(4,S.uNear+1.5-(RH+7.5)),0,1);
    // eased so the ground rolls off the verge rather than shearing away from it
    const ramp=lerp(S.fr.y-0.55,S.P.y+0.30,t*t*(3-2*t));
    const fade=(1-smooth(ext*0.42,ext,Math.abs(v)))*smooth(RH+7.5,RH+13,u);
    y=lerp(y,Math.min(y,ramp),fade);
  }
  return y;
}
function inShelf(x,z,margin){
  for(const S of SHELVES){
    const dx=x-S.fr.x, dz=z-S.fr.z;
    const vv=dx*S.fr.tx+dz*S.fr.tz;
    if(Math.abs(vv)>((vv<0)?S.backV:S.halfV)*0.92) continue;
    const u=(dx*S.fr.lx+dz*S.fr.lz)*S.side;
    if(u>RH+4.0&&u<S.uNear+(margin||0)) return true;
  }
  return false;
}

// ---------- the ground: one function, used by everything that touches it ----------
const CROWN=0.11;
function corridorProfile(a,cut){
  // a: lateral distance from the road centreline; cut>0 where the land stands above the road
  if(a<=RH) return CROWN*(1-(a/RH)*(a/RH));
  let h=-0.30*smooth(RH,RH+0.95,a);                 // the shoulder carries the stone's edge, then rolls off
  h-=0.24*smooth(RH+0.7,RH+1.9,a);                  // then the contact band steps down
  h-=0.34*smooth(RH+1.7,RH+4.6,a);                  // and the verge falls away
  h-=0.44*Math.exp(-Math.pow((a-(RH+4.0))/2.4,2))*clamp(cut,0,1)*smooth(RH,RH+1.4,a);  // a drain along the cut side
  return h;
}
function surfaceY(x,z){
  const ri=routeInfo(x,z);
  const base=refAt(x,z)+reliefAt(x,z,ri.d);
  // each lane keeps its own bed; whichever is nearer owns the ground outright,
  // and only near the medial line between them do the two beds ever mix
  const w0=1-smooth(8.5,clamp(20+Math.abs(base-ri.yA[0])*3.4,26,132),ri.dA[0]);
  const w1=1-smooth(8.5,clamp(20+Math.abs(base-ri.yA[1])*3.4,26,132),ri.dA[1]);
  let y=base;
  if(w0>1e-4||w1>1e-4){
    const d0=Math.max(ri.dA[0],0.6), d1=Math.max(ri.dA[1],0.6);
    const p0=1/Math.pow(d0,10), p1=1/Math.pow(d1,10);
    const e0=ri.yA[0]+corridorProfile(ri.dA[0],base-ri.yA[0]);
    const e1=ri.yA[1]+corridorProfile(ri.dA[1],base-ri.yA[1]);
    let eng=(p0*e0+p1*e1)/(p0+p1);
    // inside the shoulder the nearest lane owns the ground outright: nothing
    // from the other lane is allowed to lift the ground beside this one
    const own=1-smooth(RH+3.0,RH+9.5,ri.d);
    eng=lerp(eng,ri.y+corridorProfile(ri.d,base-ri.y),own);
    y=lerp(base,eng,Math.max(w0,w1));
  }
  // the beck cuts its own channel; the road's shoulder is never part of it
  const si=streamInfo(x,z);
  if(si.d<12){
    const t=(1-smooth(1.2,10,si.d))*smooth(RH+1.0,RH+2.8,ri.d);
    y=lerp(y,Math.min(y,si.y-0.5),t);
  }
  for(const P of PONDS){
    const pdx=x-P.cx, pdz=z-P.cz;
    if(Math.abs(pdx)>P.rx*3.0||Math.abs(pdz)>P.rx*3.0) continue;
    const pc=Math.cos(-P.rot), ps=Math.sin(-P.rot);
    const px=pdx*pc-pdz*ps, pz=pdx*ps+pdz*pc;
    const pr=Math.hypot(px/P.rx,pz/P.rz);
    if(pr<2.05){
      // the bed is set, not merely cut down to: a pool lying across a slope has
      // to have a floor, or the far half of it drains straight out of frame
      const t=(1-smooth(1.10,2.05,pr))*smooth(RH+9,RH+24,ri.d);
      y=lerp(y,P.bed,t);
    }
    // a rim the water can be held by: outside the basin the ground rises above
    // the surface, so a pool never reads as a puddle poured down a hillside
    if(pr>=1.0&&pr<2.7){
      const rim=P.y+0.35+2.1*smooth(1.05,2.4,pr);
      // held well clear of the corridor: inside the road's own row spacing the
      // rim varies faster than the drawn mesh can follow, and props standing on
      // the analytic ground would float above the triangles beneath them
      y=lerp(y,Math.max(y,rim),smooth(RH+9,RH+26,ri.d)*(1-smooth(2.3,2.7,pr)));
    }
  }
  y=shelfY(x,z,y,ri.d);
  // a hard guarantee: within the shoulder of either lane the ground is never
  // permitted above that lane's own edge, whatever else has been added here
  for(let a=0;a<2;a++){
    if(ri.dA[a]<RH+2.5&&ri.dA[a]<=ri.d+0.01)
      y=Math.min(y,ri.yA[a]+corridorProfile(Math.max(ri.dA[a],RH+0.001),0)+0.015);
  }
  // and the matching guarantee in the other direction: whatever a pool basin,
  // a shelf or a ditch wants to do out in the field, the metre of ground either
  // side of the stone still carries it. A road that is not held up is not a road.
  for(let a=0;a<2;a++){
    if(ri.dA[a]<RH+1.7&&ri.dA[a]<=ri.d+0.01)
      y=Math.max(y,ri.yA[a]+corridorProfile(Math.max(ri.dA[a],RH+0.001),0)-0.012);
  }
  return y;
}

// Corridors that stay clear so a designed view can actually happen.

const SIGHT=[];
function addSight(g0,g1,side,half,tag){ SIGHT.push({g0,g1,side,half,tag}); }
function inSight(x,z,g,d,side){
  for(const S of SIGHT){

// PLAN — GROVES
// One cohesive broadleaf family, six structural archetypes, assembled into
// groups: clustered support, backdrop mass, and a few hero silhouettes.
// ============================================================
const FAMS=['oak','beech','birch','leaning','windshaped','orchard'];
const GROVES=[], GROVE_WINDOWS=[], LAYER_WINDOWS=[];

  const openMix=['oak','windshaped','orchard','birch','leaning'];

      const st=subStream('grove',gi,arm);
      const nGroves=enc>0.55?st.i(2,4):(enc>0.25?st.i(1,3):(st.chance(0.7)?1:0));
      for(let q=0;q<nGroves;q++){
        const roll=st.f();

        if(roll<0.34+0.24*enc){ role='frame'; off=st.r(EXCL+1.4,16); rx=st.r(7,15); rz=st.r(9,22); dens=st.r(0.6,1.0); }
        else if(roll<0.72){ role='support'; off=st.r(20,62); rx=st.r(13,30); rz=st.r(16,40); dens=st.r(0.6,1.0); }
        else if(roll<0.92){ role='wall'; off=st.r(62,168); rx=st.r(30,70); rz=st.r(34,90); dens=st.r(0.7,1.0); }
        else { role='far'; off=st.r(168,420); rx=st.r(60,130); rz=st.r(60,140); dens=st.r(0.5,0.9); }
        const side=st.chance(0.5)?1:-1;

        GROVES.push({ id:GROVES.length, g, arm, side, off, rx, rz, rot:st.r(0,TAU), role, dens,
                      mix, enc, hero:st.chance(role==='frame'?0.14:0.07) });

  }

  // each one is a designed opening: mass on one side, a gap that hands the eye
  // forward down the road, and something waiting in the gap.
  const winAt=[
    {g:chapEnd('gate')*0.30, kind:'frame'},
    {g:chapEnd('gate')*0.86, kind:'aperture'},
    {g:lerp(chapEnd('gate'),chapEnd('sunbank'),0.44), kind:'clearing'},
    {g:lerp(chapEnd('sunbank'),chapEnd('fernfold'),0.26), kind:'arch'},
    {g:lerp(chapEnd('sunbank'),chapEnd('fernfold'),0.72), kind:'frame'},
    {g:S_SPLIT-GROVE.r(70,120), kind:'aperture'},
    {g:lerp(chapEnd('fork'),chapEnd('joining'),0.24), kind:'arch'},
    {g:lerp(chapEnd('fork'),chapEnd('joining'),0.55), kind:'frame'},
    {g:lerp(chapEnd('fork'),chapEnd('joining'),0.86), kind:'aperture'},
    {g:POOL.apertureG, kind:'water-aperture'},
    {g:MOSSPOOL.apertureG, kind:'water-aperture'},
    {g:lerp(chapEnd('glasswater'),chapEnd('cloudstep'),0.42), kind:'clearing'},
    {g:chapEnd('cloudstep')+GROVE.r(120,220), kind:'frame'},
    {g:L_TOTAL-GROVE.r(230,300), kind:'clearing'},
  ];

// The Wind Sisters: three wind-shaped trees on a skyline ridge, planned so that
// they can be read from Sunbank and again, from the other side, at Glasswater.
const SISTERS=(()=>{
  // A callback only works if the same thing can genuinely be seen twice. The
  // route bows; collect the station pairs, chapters apart, that come closest in
  // space, and stand the Sisters on a knoll between the first pair that works.
  const pairs=[];
  for(let gA=chapEnd('gate')*0.5;gA<chapEnd('fernfold')-60;gA+=30){
    const a=getFrame(FRAMES.sun,toLocal('sun',gA));
    let bestB=null;
    for(let gB=Math.max(gA+1500,chapEnd('fork'));gB<L_TOTAL-200;gB+=30){
      const b=getFrame(FRAMES.sun,toLocal('sun',gB));
      const d=Math.hypot(a.x-b.x,a.z-b.z);
      if(!bestB||d<bestB.d) bestB={gA,gB,d,a,b};
    }
    if(bestB) pairs.push(bestB);
  }
  pairs.sort((p,q)=>p.d-q.d);
  // keep a handful of well-separated candidates rather than five neighbours
  const cand=[];
  for(const p of pairs){ if(cand.every(c=>Math.abs(c.gA-p.gA)>180)) cand.push(p); if(cand.length>=6) break; }
  const sees=(fr,x,z,y)=>{
    const ex=fr.x, ez=fr.z, ey=fr.y+1.62;
    const D=Math.hypot(x-ex,z-ez);
    if(D>1500||D<130) return false;
    for(let t=0.05;t<0.96;t+=0.028){
      const px=lerp(ex,x,t), pz=lerp(ez,z,t);
      if(groundY(px,pz)>lerp(ey,y,t)+1.0) return false;
    }
    return true;
  };
  let best=null;
  for(let ci=0;ci<cand.length;ci++){
    const P=cand[ci], a=P.a, b=P.b, gap=P.d;
    let local=null;
    for(let t=0;t<200;t++){
      const st=subStream('sisters',ci,t);
      const spread=clamp(0.42-gap/9000,0.14,0.42);
      const mx=lerp(a.x,b.x,st.r(0.5-spread,0.5+spread)), mz=lerp(a.z,b.z,st.r(0.5-spread,0.5+spread));
      const ang=st.r(0,TAU), rad=st.r(180,Math.max(240,Math.min(470,gap*0.28)));
      const x=mx+Math.cos(ang)*rad, z=mz+Math.sin(ang)*rad;
      if(routeInfo(x,z).d<190) continue;
      let bx=x,bz=z,by=groundY(x,z);
      for(let k=0;k<12;k++){
        const aa=k/12*TAU, cx2=x+Math.cos(aa)*38, cz2=z+Math.sin(aa)*38;
        if(routeInfo(cx2,cz2).d<190) continue;
        const cy=groundY(cx2,cz2);
        if(cy>by){ bx=cx2; bz=cz2; by=cy; }
      }
      const crown=by+30;
      const vA=sees(a,bx,bz,crown), vB=sees(b,bx,bz,crown);
      const score=(vA?1000:0)+(vB?1000:0)+by
        -Math.abs(Math.hypot(bx-a.x,bz-a.z)-Math.hypot(bx-b.x,bz-b.z))*0.05;
      if(!local||score>local.score) local={x:bx,y:by,z:bz,score,gA:P.gA,gB:P.gB,vA,vB,pairD:gap,a,b};
      if(vA&&vB&&t>16) break;
    }
    if(local&&(!best||local.score>best.score)) best=local;
    if(best&&best.vA&&best.vB) break;
  }
  if(!best){ const P=cand[0]||{a:{x:0,z:0},b:{x:0,z:0},gA:0,gB:0,d:0};
    const x=P.a.x+380,z=P.a.z+200; best={x,y:groundY(x,z),z,score:0,gA:P.gA,gB:P.gB,pairD:P.d,a:P.a,b:P.b}; }
  // how high the crown must stand for both viewpoints to clear the ground
  // between: measured, not guessed
  best.needCrown=(()=>{
    let need=best.y+16;
    for(const fr of [best.a,best.b]){
      const ey=fr.y+1.62;
      for(let t=0.08;t<0.97;t+=0.02){
        const px=lerp(fr.x,best.x,t), pz=lerp(fr.z,best.z,t);
        const obst=groundY(px,pz)+1.2;
        if(obst>ey) need=Math.max(need,ey+(obst-ey)/t);
      }
    }
    return need;
  })();
  return best;
})();

// THE ROAD AND ITS CORRIDOR

// ============================================================

  const cMidL=LEAF_MID.clone().lerp(LEAF_SHADE,shade*0.52);
  const cShL=LEAF_SHADE.clone().lerp(LEAF_DEEP,shade*0.56);
  const bSun=A.bark?BIRCH_SUN:BARK_SUN, bSh=A.bark?BIRCH_SHADE:BARK_SHADE;
  // ---- trunk: tapered, gently bent, with a real base ----
  const nSeg=tier===2?5:(tier===1?3:2);
  const tp=[];
  for(let i=0;i<=nSeg;i++){
    const f=i/nSeg;
    const bend=Math.sin(f*Math.PI*0.72)*leanAmt*H;
    tp.push(new THREE.Vector3(t.x+Math.sin(leanDir)*bend+(i?st.r(-0.14,0.14)*S:0),

                              t.z+Math.cos(leanDir)*bend+(i?st.r(-0.14,0.14)*S:0)));

  tube(B,tp,R*(tier===2?1.16:1.35),R*(tier===2?0.34:0.5),tier===2?7:(tier===1?5:4),bSun,bSh);
  if(tier===2){

    for(let i=0;i<nr;i++){
      const a=st.r(0,TAU), rl=R*st.r(2.0,3.4);
      tube(B,[new THREE.Vector3(t.x,t.y+R*st.r(1.5,2.4),t.z),

  // The old tiering inflated the radius to make three coarse lobes fill the
  // space, so a tree visibly ballooned as it crossed an LOD boundary and rows
  // of them fused into one dark shelf. Silhouette is now tier-invariant.
  // A crown right at the verge is scaled down as well as lifted. Subdividing it

  // and the budget is better spent on the fifty trees behind it.

  for(let i=0;i<nLimb;i++){

    const reach=crownR*st.r(0.45,0.85);

  // pushed wide it stops reading as the shaded underside of foliage and starts
  // reading as a dark shelf, and a row of such shelves fuses into a wall.
  lobe(B,top.x+Math.sin(skewA)*crownR*skew*0.6,crownY-crownR*0.30,top.z+Math.cos(skewA)*crownR*skew*0.6,
    crownR*st.r(0.60,0.76),crownR*st.r(0.34,0.44),crownR*st.r(0.60,0.76),st,cShL,LEAF_DEEP,0.17,Math.max(0,detail-1),0.30);

  // neighbours interpenetrate and the silhouette is a run of soft scallops
  // rather than a scatter of separate beads. Most of them hang off a limb end,
  // which is what makes the outline lopsided instead of a ring.
  for(let i=0;i<nL;i++){
    const a=st.r(0,TAU);
    let da=Math.abs(((a-gapA+Math.PI*3)%TAU)-Math.PI);
    if(da<gapW&&st.chance(0.72)) continue;                  // the gap that lets sky through
    const rr=crownR*st.r(0.16,0.58);
    let cx=top.x+Math.sin(a)*rr+Math.sin(skewA)*crownR*skew;
    let cz=top.z+Math.cos(a)*rr+Math.cos(skewA)*crownR*skew;
    let up=st.r(-0.34,0.52);
    if(limbs.length&&st.chance(0.62)){
      const e=limbs[st.i(0,limbs.length-1)];
      cx=lerp(cx,e.x+st.r(-0.22,0.22)*crownR,0.72);
      cz=lerp(cz,e.z+st.r(-0.22,0.22)*crownR,0.72);
      up=(e.y-crownY)/crownR+st.r(0.10,0.46);

      high?cSunL:cMidL, high?cMidL:cShL, 0.19, detail);

  // edge the original had. They sit inside the main radius so they read as part
  // of the same mass, not as satellites orbiting it.
  if(tier>=1){
    const nEdge=tier===2?st.i(4,6):st.i(2,3);
    for(let i=0;i<nEdge;i++){
      const a=st.r(0,TAU);
      let da=Math.abs(((a-gapA+Math.PI*3)%TAU)-Math.PI);
      if(da<gapW*0.8&&st.chance(0.75)) continue;
      const rr=crownR*st.r(0.46,0.78);
      const lr=crownR*st.r(0.20,0.32);
      lobe(B,top.x+Math.sin(a)*rr+Math.sin(skewA)*crownR*skew,
        crownY+crownR*st.r(-0.22,0.42),top.z+Math.cos(a)*rr+Math.cos(skewA)*crownR*skew,
        lr*st.r(0.9,1.22),lr*st.r(0.8,1.05),lr*st.r(0.9,1.22),st,

  lobe(B,top.x+Math.sin(skewA)*crownR*skew*1.15,crownY+crownR*st.r(0.36,0.52),top.z+Math.cos(skewA)*crownR*skew*1.15,
    crownR*st.r(0.40,0.54),crownR*st.r(0.36,0.48),crownR*st.r(0.40,0.54),st,
    LEAF_SUN.clone().lerp(col(PAL.sunGrass),0.34-shade*0.18),cSunL,0.18,detail);

}
function treeMaterial(emis){
  const m=new THREE.MeshLambertMaterial({vertexColors:true,
    emissive:new THREE.Color(emis===undefined?0x131a10:emis),emissiveIntensity:1});
  m.onBeforeCompile=(sh)=>{
    Object.assign(sh.uniforms,WL);
    sh.vertexShader=sh.vertexShader
      .replace('#include <common>','#include <common>\nuniform float uWTime; attribute float aSway; varying vec3 vWPos;')
      .replace('#include <begin_vertex>',`#include <begin_vertex>
      {
        float ph=dot(position.xz,vec2(0.037,0.031));
        float sw=sin(uWTime*0.72+ph)*0.62+sin(uWTime*1.51+ph*2.1)*0.24;
        transformed.x+=sw*aSway*0.62; transformed.z+=cos(uWTime*0.63+ph)*aSway*0.34;
      }`)
      .replace('#include <worldpos_vertex>','#include <worldpos_vertex>\n{ vec4 wp2=modelMatrix*vec4(transformed,1.0);\n#ifdef USE_INSTANCING\n wp2=modelMatrix*instanceMatrix*vec4(transformed,1.0);\n#endif\n vWPos=wp2.xyz; }');
    sh.fragmentShader=sh.fragmentShader
      .replace('#include <common>','#include <common>\nvarying vec3 vWPos;\n'+WL_GLSL)
      .replace('#include <color_fragment>','#include <color_fragment>\n{ diffuseColor.rgb*=mix(1.0,0.84,uWet); }')
      .replace('vec3 outgoingLight = ','float wl=cloudShadowAt(vWPos.xz);\nreflectedLight.directDiffuse*=wl;\nreflectedLight.indirectDiffuse=reflectedLight.indirectDiffuse*mix(0.86,1.0,wl)+diffuseColor.rgb*0.46*wl;\nvec3 outgoingLight = ');
  };

}

const heroInfo={ pos:HERO_POS.clone(), crownTop:0, limbClearance:99, pods:[], podsWorld:[] };
{
  const G=HERO;

  const H0=G.r(37,45);

    const aa=twist+f*G.r(0.8,1.5);

  }
  tube(B,spineP,R0,R0*0.42,11,bSun,bSh);
  for(let i=0;i<7;i++){
    const a=i/7*TAU+G.r(-0.1,0.1);
    const off=R0*0.86;
    const st=[];
    for(let k=0;k<spineP.length;k++){
      const f=k/(spineP.length-1);

  }

    const reach=G.r(5.5,9.5);
    const fx=tx+Math.sin(a)*reach, fz=tz+Math.cos(a)*reach;
    if(routeInfo(fx,fz).d<EXCL+0.8) continue;

      new THREE.Vector3(tx+Math.sin(a)*R0*0.8,ty+G.r(4.5,7.5),tz+Math.cos(a)*R0*0.8),
      new THREE.Vector3(tx+Math.sin(a)*(R0+reach*0.45),ty+G.r(1.6,2.8),tz+Math.cos(a)*(R0+reach*0.45)),
      new THREE.Vector3(fx,fy+0.35,fz)],false,'centripetal',0.5);
    const pts=[]; for(let k=0;k<=6;k++) pts.push(c.getPointAt(k/6));
    tube(B,pts,G.r(0.72,1.0),0.22,6,bSun,bSh);
    if(G.chance(0.7)){
      const a2=a+G.r(0.14,0.34)*(G.chance(0.5)?1:-1);
      const f2x=tx+Math.sin(a2)*reach*0.66, f2z=tz+Math.cos(a2)*reach*0.66;
      tube(B,[new THREE.Vector3(tx+Math.sin(a2)*R0*0.7,ty+G.r(1.8,3.2),tz+Math.cos(a2)*R0*0.7),

    }

  // principal limbs; two of them lean out over the lane, high and clear
  const ends=[];
  const nF=G.i(5,6);
  const crownSkew=G.r(0,TAU);
  const towardRoad=Math.atan2(heroFr.x-tx,heroFr.z-tz);
  for(let i=0;i<nF;i++){

    const a=overRoad?towardRoad+G.r(-0.42,0.42):crownSkew+i/nF*TAU+G.r(-0.4,0.4);

    const b0=spineP[overRoad?G.i(3,5):G.i(5,8)].clone();

      overRoad?(getFrame(FRAMES.sun,toLocal('sun',HERO_G)).y+G.r(8.6,11.4)):(ty+H0*G.r(0.62,0.82)),

          [p[0]+Math.cos(a0)*r,p[1]-L*0.36,p[2]+Math.sin(a0)*r],cTop);
        pushTri(pb,[p[0]+Math.cos(a0)*r,p[1]-L*0.36,p[2]+Math.sin(a0)*r],
          [p[0]+Math.cos(a1)*r,p[1]-L*0.36,p[2]+Math.sin(a1)*r],
          [p[0],p[1]-L,p[2]],cBot);

}

function underMaterial(){
  const m=new THREE.MeshLambertMaterial({vertexColors:true,side:THREE.DoubleSide,
    emissive:new THREE.Color(0x0d1006),emissiveIntensity:1});
  m.onBeforeCompile=(sh)=>{
    Object.assign(sh.uniforms,WL);
    sh.vertexShader=sh.vertexShader
      .replace('#include <common>','#include <common>\nuniform float uWTime; attribute float aSway; attribute float aCanopy; attribute float aKind; attribute float aUp;\nvarying vec3 vWPos; varying float vCanopy; varying float vKind;')
      .replace('#include <beginnormal_vertex>','#include <beginnormal_vertex>\n objectNormal=mix(objectNormal,vec3(0.0,1.0,0.0),step(0.5,aUp));')
      .replace('#include <begin_vertex>',`#include <begin_vertex>
      {
        float ph=dot(position.xz,vec2(0.19,0.16));
        float gust=sin(uWTime*1.25+ph)*0.6+sin(uWTime*2.4+ph*1.7)*0.26+sin(uWTime*0.47+ph*0.35)*0.42;
        transformed.x+=gust*aSway*0.26; transformed.z+=cos(uWTime*0.97+ph)*gust*aSway*0.15;
      }`)
      .replace('#include <worldpos_vertex>','#include <worldpos_vertex>\n{ vec4 wp2=modelMatrix*vec4(transformed,1.0); vWPos=wp2.xyz; vCanopy=aCanopy; vKind=aKind; }');
    sh.fragmentShader=sh.fragmentShader
      .replace('#include <common>','#include <common>\nvarying vec3 vWPos; varying float vCanopy; varying float vKind;\n'+WL_GLSL)
      .replace('#include <color_fragment>',`#include <color_fragment>
      { diffuseColor.rgb*=mix(1.0,0.85,uWet);
        if(vKind>0.5&&vKind<1.5&&uGlint.w>0.001){
          float d=distance(vWPos.xz,uGlint.xy);
          float prox=1.0-smoothstep(uGlint.z*0.35,uGlint.z,d);
          float pick=step(0.74,wlHash(floor(vWPos.xz*3.1)));
          diffuseColor.rgb+=vec3(1.0,0.94,0.72)*prox*pick*uGlint.w;
        } }`)
      .replace('vec3 outgoingLight = ','float wl=cloudShadowAt(vWPos.xz)*dappleAt(vWPos.xz,vCanopy);\nreflectedLight.directDiffuse*=wl;\nreflectedLight.indirectDiffuse=reflectedLight.indirectDiffuse*mix(0.85,1.0,wl)+diffuseColor.rgb*0.38*wl;\nvec3 outgoingLight = ');
  };
  return m;
}
const underMat=underMaterial();
function UBuf(){ return {p:[],c:[],s:[],k:[],a:[],u:[],sway:0,kind:0,can:0,up:1}; }
function uTri(B,a,b,c,cc){
  B.p.push(a[0],a[1],a[2], b[0],b[1],b[2], c[0],c[1],c[2]);
  for(let i=0;i<3;i++){ B.c.push(cc.r,cc.g,cc.b); B.s.push(B.sway); B.k.push(B.kind); B.a.push(B.can); B.u.push(B.up); }
}
function uQuad(B,a,b,c,d,cc){ uTri(B,a,b,c,cc); uTri(B,a,c,d,cc); }
function uGeo(B){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(B.p,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(B.c,3));
  g.setAttribute('aSway',new THREE.Float32BufferAttribute(B.s,1));
  g.setAttribute('aKind',new THREE.Float32BufferAttribute(B.k,1));
  g.setAttribute('aCanopy',new THREE.Float32BufferAttribute(B.a,1));
  g.setAttribute('aUp',new THREE.Float32BufferAttribute(B.u,1));
  g.computeVertexNormals();
  return g;
}
function addTuft(B,x,y,z,st,cLo,cHi,h,blades){
  B.kind=0;
  for(let i=0;i<blades;i++){
    const a=st.r(0,TAU), w=h*st.r(0.16,0.30), hh=h*st.r(0.7,1.25);
    const dx=Math.cos(a)*w, dz=Math.sin(a)*w;
    const bx=Math.sin(a)*h*st.r(0.10,0.34), bz=Math.cos(a)*h*st.r(0.10,0.34);
    B.sway=0;
    B.p.push(x-dx,y,z-dz, x+dx,y,z+dz, x+bx,y+hh,z+bz);
    for(let k=0;k<3;k++){ const c=(k===2)?cHi:cLo; B.c.push(c.r,c.g,c.b); B.k.push(0); B.a.push(B.can); B.u.push(1); }
    B.s.push(0,0,hh);
  }
}
function addFern(B,x,y,z,st,cLo,cHi,h){
  B.kind=0; B.sway=h*0.35;
  const n=st.i(3,5);
  for(let i=0;i<n;i++){
    const a=i/n*TAU+st.r(-0.3,0.3), r=h*st.r(0.7,1.1);
    const dx=Math.sin(a), dz=Math.cos(a);
    uQuad(B,[x,y+0.02,z],[x+dx*r*0.35,y+h*0.42,z+dz*r*0.35],
            [x+dx*r,y+h*0.58,z+dz*r],[x+dx*r*0.5,y+h*0.16,z+dz*r*0.5],
            cLo.clone().lerp(cHi,st.r(0.2,0.7)));
  }
  B.sway=0;
}
function addSeedhead(B,x,y,z,st,cStalk,cHead,h){
  B.kind=0; B.sway=h*0.9;
  const a=st.r(0,TAU), lean=st.r(0.04,0.14);
  const tx=x+Math.sin(a)*h*lean, tz=z+Math.cos(a)*h*lean;
  uQuad(B,[x-0.014,y,z],[x+0.014,y,z],[tx+0.010,y+h*0.78,tz],[tx-0.010,y+h*0.78,tz],cStalk);
  B.kind=1;
  for(const b of [0.35,1.92]){
    const dx=Math.sin(b)*h*0.055, dz=Math.cos(b)*h*0.055;
    uQuad(B,[tx-dx,y+h*0.74,tz-dz],[tx+dx,y+h*0.74,tz+dz],
            [tx+dx*0.6,y+h,tz+dz*0.6],[tx-dx*0.6,y+h,tz-dz*0.6],cHead);
  }
  B.kind=0; B.sway=0;
}
function addFlower(B,x,y,z,st,cStem,cPetal,h){
  B.kind=0; B.sway=h*0.7;
  uQuad(B,[x-0.012,y,z],[x+0.012,y,z],[x+0.008,y+h*0.72,z],[x-0.008,y+h*0.72,z],cStem);
  B.kind=2;
  for(const b of [0.2,1.77]){
    const dx=Math.sin(b)*h*0.15, dz=Math.cos(b)*h*0.15;
    uQuad(B,[x-dx,y+h*0.72,z-dz],[x+dx,y+h*0.72,z+dz],
            [x+dx*0.72,y+h*0.96,z+dz*0.72],[x-dx*0.72,y+h*0.96,z-dz*0.72],cPetal);
  }
  B.kind=0; B.sway=0;
}
function addBlob(B,x,y,z,st,rx,ry,rz,cTop,cBot,swayAmt){
  const D=ICOD[0];
  const pu=B.up; B.up=0;
  B.sway=swayAmt||0;
  const p1=st.r(0,TAU);
  const vert=(i)=>{ const vx=D.p.getX(i), vy=D.p.getY(i), vz=D.p.getZ(i);
    const j=1+0.22*Math.sin(Math.atan2(vz,vx)*3+p1);
    return [x+vx*rx*j,y+(vy<0?vy*0.5:vy)*ry*j,z+vz*rz*j,vy]; };
  for(let i=0;i<D.idx.length;i+=3){
    const a=vert(D.idx[i]), b=vert(D.idx[i+1]), c=vert(D.idx[i+2]);
    const ym=(a[3]+b[3]+c[3])/3;
    uTri(B,[a[0],a[1],a[2]],[b[0],b[1],b[2]],[c[0],c[1],c[2]],cBot.clone().lerp(cTop,clamp(0.45+0.6*ym,0,1)));
  }
  B.sway=0; B.up=pu;
}
function addPatch(B,x,y,z,r,cc){
  B.kind=0; B.sway=0;
  const n=7;
  for(let i=0;i<n;i++){
    const a0=i/n*TAU, a1=(i+1)/n*TAU;
    uTri(B,[x,y+0.035,z],[x+Math.cos(a1)*r,y+0.035,z+Math.sin(a1)*r],[x+Math.cos(a0)*r,y+0.035,z+Math.sin(a0)*r],cc);
  }
}
function addLog(B,x,y,z,st,len,r,rot,gy){
  const dx=Math.sin(rot), dz=Math.cos(rot);
  // borrow the tree tube builder; its normals are discarded because the
  // understory geometry derives its own
  const tb={p:B.p,c:B.c,s:B.s,n:[],sway:0};
  const before=B.p.length/3;
  // both ends rest on the ground they are actually lying on
  const y0=gy(x-dx*len,z-dz*len)+r*0.85, y1=gy(x+dx*len,z+dz*len)+r*0.8;
  tube(tb,[new THREE.Vector3(x-dx*len,y0,z-dz*len),new THREE.Vector3(x+dx*len,y1,z+dz*len)],
    r,r*0.8,5,BARK_SUN,mixc(PAL.bark,PAL.woodDeep,0.55));
  const added=B.p.length/3-before;
  for(let i=0;i<added;i++){ B.k.push(0); B.a.push(B.can); B.u.push(0); }
}

// ============================================================
// BANDS — deterministic residency along the route
// Vegetation, growth and ground contact are realised band by band and
// released behind the rider. Identity comes from position, never from
// the order in which bands happened to be built.
// ============================================================
const BAND=200;
const NBAND=Math.ceil(FRAMES.sun.len/BAND)+1;
const bandTrees=Array.from({length:NBAND},()=>[]);
const staticFar=[];
for(const t of TREES){
  // the Sisters are a fixed point of the whole ride: they must not be released
  // with the band they happen to be scheduled in, or the callback has nothing
  // left to call back to
  if(t.d>QCFG.farD||t.formation==='wind-sisters'){ staticFar.push(t); continue; }
  const bi=clamp(Math.floor(t.g/BAND),0,NBAND-1);
  bandTrees[bi].push(t);
}
// distant individuals are static: they belong to the far reading, not to residency
{
  const groups=[[],[],[],[]];
  const c0=spineAt(L_TOTAL*0.5);
  for(const t of staticFar){
    const a=Math.atan2(t.x-c0.x,t.z-c0.z);
    groups[clamp(Math.floor((a+Math.PI)/TAU*4),0,3)].push(t);
  }
  for(const grp of groups){
    if(!grp.length) continue;
    const B=Buf();
    for(const t of grp) buildTree(B,t,t.formation==='wind-sisters'?1:0);
    const m=new THREE.Mesh(bufGeo(B),treeMatFar); m.matrixAutoUpdate=false;
    scene.add(m);
  }
  H.real.feed('staticfar',staticFar.length);
}

const counts={ trees:0, articulatedNear:0, midTrees:0, farTrees:0, staticFarTrees:staticFar.length,
  understory:0, flowers:0, seedheads:0, ferns:0, shrubs:0, reeds:0, groundContacts:0, rocksLogs:0 };
const RES={ realized:0, disposed:0, peak:0 };
const bands=Array.from({length:NBAND},(_,i)=>({i,g0:i*BAND,g1:(i+1)*BAND,live:null}));

function realizeBand(bi){
  const b=bands[bi];
  if(b.live) return;
  const nearB=Buf(), midB=Buf(), uB=UBuf();
  const local={trees:0,articulatedNear:0,midTrees:0,farTrees:0,understory:0,flowers:0,
    seedheads:0,ferns:0,shrubs:0,reeds:0,groundContacts:0,rocksLogs:0,corridorRejects:0,corridorViolations:0};
  // ---- trees: the nearest get the geometry, and the budget is bounded by
  // construction rather than by hoping the plan was sparse enough ----
  const ordered=bandTrees[bi].slice().sort((a,b)=>a.d-b.d||a.x-b.x||a.z-b.z);
  let nNear=0,nMid=0,nAll=0;
  for(const t of ordered){
    if(nAll>=QCFG.bandTreeCap) break;
    nAll++;
    let tier=(t.d<=QCFG.nearD)?2:((t.d<=QCFG.midD)?1:0);
    if(tier===2&&nNear>=QCFG.capNear) tier=1;
    if(tier===1&&nMid>=QCFG.capMid) tier=0;
    // A tree at the verge must hold its canopy high enough to ride under. At
    // five metres the crown hung in the rider's face and its lobes read as
    // plates across the top of the frame; at nine it reads as a ceiling.
    const overhang=(t.d<EXCL+10)?(t.roadY+9.0):undefined;
    if(tier===2){ buildTree(nearB,t,2,overhang); local.articulatedNear++; nNear++; }
    else if(tier===1){ buildTree(midB,t,1,overhang); local.midTrees++; nMid++; }
    else { buildTree(midB,t,0); local.farTrees++; }
    local.trees++;
    // every tree gets its ground: a cool contact patch and flattened growth
    const st=subStream('base',Math.round(t.x*10),Math.round(t.z*10));
    const dark=mixc(PAL.woodDeep,PAL.bark,0.30).lerp(col(PAL.leafShade),0.18);
    addPatch(uB,t.x,t.y,t.z,1.15*t.scl+st.r(0,0.7),dark);
    local.groundContacts++;
    if(tier>=1){
      const nr=Math.round(st.i(2,4)*QCFG.under);
      for(let i=0;i<nr;i++){
        const a=st.r(0,TAU), rr=st.r(0.7,2.4)*t.scl;
        const x=t.x+Math.cos(a)*rr, z=t.z+Math.sin(a)*rr;
        uB.can=clamp(t.enc,0,1);
        addTuft(uB,x,groundY(x,z),z,st,mixc(PAL.woodDeep,PAL.leafShade,0.5),mixc(PAL.leafShade,PAL.meadow,0.4),st.r(0.34,0.64),3);
        local.understory++;
      }
    }
  }
  // ---- growth, keyed to what the ground is actually doing here ----
  {
    const N=Math.round(QCFG.tuftBand*BAND/10*QCFG.under);
    const st=subStream('under',bi);
    const arms=(b.g0<S_MERGE_G+120&&b.g1>S_SPLIT-120)?['sun','moss']:['sun'];
    for(let i=0;i<N;i++){
      const arm=arms.length>1?(st.chance(0.5)?'sun':'moss'):'sun';
      const g=st.r(b.g0,b.g1);
      const sLoc=toLocal(arm,g);
      if(sLoc<0||sLoc>FRAMES[arm].len) continue;
      if(arm==='moss'&&(sLoc<S_COMMIT.moss-60||sLoc>S_MERGE.moss+60)) continue;
      const fr=getFrame(FRAMES[arm],sLoc);
      // bias toward the verge and the bank edge, where growth breaks a silhouette
      const roll=st.f();
      const lat=(st.chance(0.5)?1:-1)*(roll<0.55?st.r(RH+0.55,RH+9):(roll<0.85?st.r(RH+9,34):st.r(34,QCFG.midD*0.95)));
      const x=fr.x+fr.lx*lat+st.r(-3,3), z=fr.z+fr.lz*lat+st.r(-3,3);
      const ri=routeInfo(x,z);
      if(ri.d<EXCL){ local.corridorRejects++; continue; }
      const si=streamInfo(x,z);
      if(si.d<1.1) continue;
      let pin=99;
      for(const P of PONDS) pin=Math.min(pin,Math.hypot((x-P.cx)/P.rx,(z-P.cz)/P.rz));
      if(pin<0.92) continue;
      const y=groundY(x,z);
      const gHere=toGlobal(ri.arm===1?'moss':'sun',ri.s);
      const enc=enclosureAt(gHere,ri.arm===1?'moss':'sun')*clamp(1.3-ri.d/80,0,1);
      const moist=clamp(1-si.d/26,0,1);
      const slope=Math.abs(groundY(x+2.5,z)-groundY(x-2.5,z))/5+Math.abs(groundY(x,z+2.5)-groundY(x,z-2.5))/5;
      // Growth comes in patches, not as an even sprinkle. The mask is what
      // makes a meadow read as fields of something rather than as scatter, but
      // it was culling so hard that the fields were mostly bare.
      const mask=fbmE(x/19+7,z/19+13);
      if(mask<0.27-slope*0.5-moist*0.12) continue;
      uB.can=clamp(enc,0,1);
      const gc=groundColor(x,z,slope,enc,moist,y-refAt(x,z)).clone();
      const r2=st.f();
      if(pin<1.75&&pin>=0.92){                     // reeds hold the pool's margin
        addFern(uB,x,y,z,st,mixc(PAL.leafShade,PAL.meadow,0.35),mixc(PAL.sunGrass,PAL.meadow,0.5),st.r(0.70,1.30));
        local.reeds++;
      } else if(moist>0.45&&si.d<12){
        addFern(uB,x,y,z,st,mixc(PAL.woodDeep,PAL.leafShade,0.45),mixc(PAL.leafShade,PAL.meadow,0.45),st.r(0.52,1.00));
        local.ferns++;
      } else if(enc>0.44){
        if(r2<0.62){ addFern(uB,x,y,z,st,mixc(PAL.woodDeep,PAL.leafShade,0.4),mixc(PAL.leafShade,PAL.meadow,0.35),st.r(0.46,0.92)); local.ferns++; }
        else if(r2<0.86){ addTuft(uB,x,y,z,st,gc.clone().lerp(col(PAL.woodDeep),0.44),gc.clone().lerp(col(PAL.leafShade),0.24),st.r(0.28,0.58),st.i(4,6)); local.understory++; }
        else { addBlob(uB,x,y+0.18,z,st,st.r(0.42,0.78),st.r(0.30,0.52),st.r(0.42,0.78),mixc(PAL.meadow,PAL.leafShade,0.30),mixc(PAL.leafShade,PAL.woodDeep,0.26),0.18); local.shrubs++; }
      } else if(enc<0.30&&slope<0.30&&r2<0.30){
        addSeedhead(uB,x,y,z,st,mixc(PAL.meadow,PAL.road,0.34),mixc(PAL.road,0xFFE79A,0.35),st.r(0.62,1.12));
        local.seedheads++;
      } else if(enc<0.34&&r2<0.24){
        addFlower(uB,x,y,z,st,mixc(PAL.meadow,PAL.sunGrass,0.5),
          st.pick([mixc(PAL.blossom,PAL.meadow,0.30),mixc(PAL.blossom,0xfff3e6,0.35),mixc(PAL.road,PAL.sunGrass,0.40),mixc(PAL.road,0xFFDE79,0.35)]),st.r(0.28,0.50));
        local.flowers++;
      } else {
        addTuft(uB,x,y,z,st,gc.clone().lerp(col(PAL.woodDeep),0.34),gc.clone().lerp(col(PAL.leafShade),0.30),st.r(0.30,0.62),st.i(4,6));
        local.understory++;
      }
    }
  }
  // ---- the verge proper: the metre and a half either side of the stone, which
  // is where a lane is actually read. Grass here has been ridden over, so it
  // lies flatter and drier at the edge and stands up again further out, with
  // seedheads leaning into the light over the shoulder. ----
  {
    const st=subStream('verge',bi);
    const N=Math.round((b.g1-b.g0)/2.1*QCFG.under);
    const arms=(b.g0<S_MERGE_G+120&&b.g1>S_SPLIT-120)?['sun','moss']:['sun'];
    for(let i=0;i<N;i++){
      const arm=arms.length>1?(st.chance(0.5)?'sun':'moss'):'sun';
      const g=st.r(b.g0,b.g1);
      const sLoc=toLocal(arm,g);
      if(sLoc<0||sLoc>FRAMES[arm].len) continue;
      if(arm==='moss'&&(sLoc<S_COMMIT.moss-40||sLoc>S_MERGE.moss+40)) continue;
      const fr=getFrame(FRAMES[arm],sLoc);
      const side=st.chance(0.5)?1:-1;
      // the near edge is worn thin; growth thickens outward
      const off=st.r(0,1)**0.62;
      const lat=side*(RH+0.34+off*4.6);
      const x=fr.x+fr.lx*lat, z=fr.z+fr.lz*lat;
      const ri=routeInfo(x,z);
      if(ri.d<EXCL){ local.corridorRejects++; continue; }
      if(streamInfo(x,z).d<1.1) continue;
      let pin=99;
      for(const P of PONDS) pin=Math.min(pin,Math.hypot((x-P.cx)/P.rx,(z-P.cz)/P.rz));
      if(pin<0.95) continue;
      const y=groundY(x,z);
      const gHere=toGlobal(arm,sLoc);
      const enc=enclosureAt(gHere,arm);
      const wear=clamp(1-off*1.6,0,1);            // 1 at the stone, 0 by the meadow
      uB.can=clamp(enc,0,1);
      const r2=st.f();
      const worn=mixc(PAL.meadow,PAL.bark,0.30).lerp(col(PAL.sunGrass),0.20);
      const lush=mixc(PAL.meadow,PAL.leafShade,0.20).lerp(col(PAL.sunGrass),0.26);
      if(wear>0.55&&r2<0.30){
        // scuffed grit and small stones pressed into the shoulder
        const r=st.r(0.07,0.20);
        addBlob(uB,x,y+r*0.4,z,st,r,r*0.62,r*st.r(0.7,1.3),
          mixc(PAL.road,PAL.bark,0.34),mixc(PAL.bark,PAL.woodDeep,0.42),0);
        local.rocksLogs++;
      } else if(r2<0.20+wear*0.34){
        addTuft(uB,x,y,z,st,worn.clone().lerp(col(PAL.woodDeep),0.38),worn.clone().lerp(col(PAL.leafShade),0.22),
          st.r(0.14,0.26)+ (1-wear)*st.r(0.12,0.34),st.i(4,6));
        local.understory++;
      } else if(enc<0.40&&r2>0.86){
        addSeedhead(uB,x,y,z,st,mixc(PAL.meadow,PAL.road,0.30),mixc(PAL.road,0xFFE79A,0.30),
          st.r(0.52,1.00)*(0.5+0.5*(1-wear)));
        local.seedheads++;
      } else if(enc<0.42&&r2>0.74){
        addFlower(uB,x,y,z,st,mixc(PAL.meadow,PAL.sunGrass,0.46),
          st.pick([mixc(PAL.blossom,PAL.meadow,0.28),mixc(PAL.blossom,0xfff3e6,0.34),
                   mixc(PAL.road,0xFFDE79,0.32),mixc(PAL.sunGrass,0xffffff,0.42)]),st.r(0.24,0.44));
        local.flowers++;
      } else {
        addTuft(uB,x,y,z,st,lush.clone().lerp(col(PAL.woodDeep),0.30+enc*0.24),
          lush.clone().lerp(col(PAL.leafShade),0.34),st.r(0.28,0.62)*(0.55+0.45*(1-wear)),st.i(4,6));
        local.understory++;
      }
    }
  }
  // ---- rocks and fallen wood: rare, subordinate, always explaining the ground ----
  {
    const st=subStream('props',bi);
    const N=Math.round(st.i(3,9)*(QUALITY==='low'?0.6:1));
    for(let i=0;i<N;i++){
      const g=st.r(b.g0,b.g1);
      const fr=getFrame(FRAMES.sun,clamp(toLocal('sun',g),0,FRAMES.sun.len-1));
      const lat=(st.chance(0.5)?1:-1)*st.r(RH+2.6,46);
      const x=fr.x+fr.lx*lat, z=fr.z+fr.lz*lat;
      const ri=routeInfo(x,z);
      if(ri.d<EXCL+0.8){ local.corridorRejects++; continue; }
      if(streamInfo(x,z).d<1.4) continue;
      const y=groundY(x,z);
      const slope=Math.abs(groundY(x+3,z)-groundY(x-3,z))/6;
      uB.can=clamp(enclosureAt(g,'sun'),0,1);
      if(st.chance(0.5)&&slope>0.13){
        const r=st.r(0.5,1.5);
        addBlob(uB,x,y+r*0.26,z,st,r,r*0.58,r*st.r(0.7,1.2),
          mixc(PAL.road,PAL.bark,0.30).lerp(col(PAL.sunGrass),0.10),
          mixc(PAL.bark,PAL.leafShade,0.40),0);
        addPatch(uB,x,y,z,r*1.25,mixc(PAL.bark,PAL.leafShade,0.45));
      } else {
        addLog(uB,x,y,z,st,st.r(0.8,2.1),st.r(0.13,0.24),st.r(0,TAU),groundY);
        addPatch(uB,x,y,z,st.r(0.8,1.5),mixc(PAL.woodDeep,PAL.leafShade,0.35));
      }
      local.rocksLogs++;
    }
  }
  const live={meshes:[],local};
  if(nearB.p.length){ const m=new THREE.Mesh(bufGeo(nearB),treeMatNear);
    m.castShadow=(QCFG.shadow>0); m.matrixAutoUpdate=false; scene.add(m); live.meshes.push(m); }
  // mid-distance trees cast too: without them the meadow beyond twenty metres
  // has no shadow in it at all, and the whole scene reads as flat noon light
  if(midB.p.length){ const m=new THREE.Mesh(bufGeo(midB),treeMatMid);
    m.castShadow=(QCFG.shadow>0); m.matrixAutoUpdate=false; scene.add(m); live.meshes.push(m); }
  if(uB.p.length){ const m=new THREE.Mesh(uGeo(uB),underMat);
    m.matrixAutoUpdate=false; m.receiveShadow=(QCFG.shadow>0); scene.add(m); live.meshes.push(m); }
  b.live=live;
  for(const k of Object.keys(local)) if(counts[k]!==undefined) counts[k]+=local[k];
  corridorViolations+=local.corridorViolations;
  corridorRejects+=local.corridorRejects;
  RES.realized++;
  if(typeof RUN!=='undefined'&&RUN) RUN.bandsRealized++;

// ============================================================
// WATER — an original lightweight treatment. Two scrolling wave layers,
// analytic normals from their derivatives, a shallow-to-deep ramp, a faked

// no ray marching: this is a pond, not an ocean.

const waterMat=new THREE.ShaderMaterial({
  uniforms:{ uWTime:WL.uWTime, uWet:WL.uWet, uFogC:{value:new THREE.Color(AIR)},

  vertexShader:`attribute float aT; attribute float aEdge; attribute float aCan;
    varying float vT; varying float vE; varying float vC; varying vec3 vW;
    void main(){ vT=aT; vE=aEdge; vC=aCan; vec4 wp=modelMatrix*vec4(position,1.0); vW=wp.xyz;
      gl_Position=projectionMatrix*viewMatrix*wp; }`,
  fragmentShader:`uniform float uWTime; uniform float uWet; uniform vec3 uFogC;
    uniform float uFogN; uniform float uFogF; uniform vec3 uSun;

    vec3 wave(vec2 p,float amp){
      float e=0.35;
      float c=n2(p), dx=n2(p+vec2(e,0.0))-c, dz=n2(p+vec2(0.0,e))-c;
      return vec3(c*amp, dx*amp/e, dz*amp/e);

      vec2 w2=vW.xz*1.05+vec2(-uWTime*0.11,uWTime*0.19);

      float depth=clamp(1.0-abs(vE),0.0,1.0);

      // is mostly sky is a mirror, and this one is meant to have depth in it
      vec3 c=mix(body,skyc,clamp(0.07+fres*0.58,0.0,0.52));

let moteBoost=0;
function updateLife(dt){
  WL.uGlint.value.set(0,0,0,0);
  moteBoost=Math.max(0,moteBoost-dt*0.8);
  for(let i=liveLife.length-1;i>=0;i--){
    const L=liveLife[i];
    L.t+=dt;
    const fade=clamp(Math.min(L.t/1.2,(L.dur-L.t)/1.6),0,1);
    if(L.glint){
      const s=Math.sin(clamp(L.t/L.dur,0,1)*Math.PI);
      WL.uGlint.value.set(L.glint.x,L.glint.z,L.glint.r,s*0.85);
    }
    if(L.motes) moteBoost=Math.max(moteBoost,fade);
    if(L.kind){
      const im=POOLS[L.kind].im;
      for(let k=0;k<L.idx.length;k++){
        const p=L.parts[k], slot=L.idx[k];
        let sc=p.sc*fade;
        if(L.kind==='bird'){
          p.x+=p.vx*dt; p.z+=p.vz*dt;
          if(p.rise){ p.y+=p.vy*dt; p.vy=Math.max(0.6,p.vy-dt*0.35); }
          else p.y+=Math.sin(wTime*1.6+p.ph)*p.bob*dt;
          _le.set(0,Math.atan2(p.vx,p.vz),Math.sin(wTime*7+p.ph)*0.32);
          _lq.setFromEuler(_le); _lv.set(p.x,p.y,p.z); _ls.set(sc,sc,sc);
        } else if(L.kind==='flit'){
          const t=wTime*p.sp+p.ph;

          const y=p.ay+Math.sin(t*(p.water?2.6:1.7))*(p.water?0.22:0.55);
          _le.set(Math.sin(wTime*(p.water?26:13)+p.ph)*(p.water?0.25:0.95),Math.atan2(Math.cos(t),-Math.sin(t*0.77)),0);
          _lq.setFromEuler(_le); _lv.set(x,y,z); _ls.set(sc,sc,sc);
        } else {
          if(p.wait!==undefined&&L.t<p.wait){ /* it is standing, watching */ }
          else { p.x+=p.vx*dt; p.z+=p.vz*dt; }
          const gy=groundY(p.x,p.z);
          const hop=p.hop?Math.abs(Math.sin(wTime*p.hop+p.ph))*0.22:0;

}

const _frustum=new THREE.Frustum(), _pv=new THREE.Matrix4(), _pt=new THREE.Vector3();

function groundClear(ex,ey,ez,tx,ty,tz,tol){
  const D=Math.hypot(tx-ex,tz-ez);
  const steps=clamp(Math.round(D/14),6,80);
  for(let i=1;i<steps;i++){
    const t=i/steps;
    const px=lerp(ex,tx,t), pz=lerp(ez,tz,t), py=lerp(ey,ty,t);
    if(groundY(px,pz)>py+(tol===undefined?0.8:tol)) return false;
  }

}

const audio={ctx:null,L:null,lastChirp:0,nextChirp:SOUND_PLAN.chirpGap[0],

function audioStart(){
  if(audio.ctx) return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return;
    const ctx=new AC(); audio.ctx=ctx;
    if(ctx.state==='suspended'&&ctx.resume) ctx.resume().catch(()=>{});
    const master=ctx.createGain(); master.gain.value=0.5; master.connect(ctx.destination);
    const nb=ctx.createBuffer(1,Math.max(1,Math.floor(ctx.sampleRate*2)),ctx.sampleRate);
    const ch=nb.getChannelData(0);
    let sn=SEED_HASH>>>1;
    for(let i=0;i<ch.length;i++){ sn=(sn*1103515245+12345)>>>0; ch[i]=(sn/2147483648-1)*0.5; }
    const mk=(type,freq,q,g0)=>{
      const src=ctx.createBufferSource(); src.buffer=nb; src.loop=true;
      const f=ctx.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q;
      const g=ctx.createGain(); g.gain.value=g0;
      src.connect(f); f.connect(g); g.connect(master); src.start();
      return {f,g};
    };
    audio.L={ wind:mk('lowpass',360,0.6,0.08), leaves:mk('bandpass',1650,1.0,0),
      tyre:mk('lowpass',880,0.8,0), water:mk('bandpass',2400,2.4,0), rain:mk('bandpass',3400,0.9,0), master };
  }catch(e){ capturedErrors.push('audio: '+(e&&e.message)); }

function tone(freqs,gain,dec){
  const ctx=audio.ctx; if(!ctx||!audio.L) return;
  try{
    const t0=ctx.currentTime+0.02;
    for(const [f,g2,d] of freqs){
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0,t0);
      g.gain.linearRampToValueAtTime(gain*g2,t0+0.014);
      g.gain.exponentialRampToValueAtTime(0.0004,t0+d*dec);
      o.connect(g); g.connect(audio.L.master);
      o.start(t0); o.stop(t0+d*dec+0.08);
    }
  }catch(e){}
}
function chirp(st){
  const ctx=audio.ctx; if(!ctx||!audio.L) return;
  try{
    const t0=ctx.currentTime+0.02, n=st.i(2,4);
    for(let i=0;i<n;i++){
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type='sine';
      const f0=st.r(2400,3700);
      o.frequency.setValueAtTime(f0,t0+i*0.13);
      o.frequency.exponentialRampToValueAtTime(f0*st.r(1.1,1.5),t0+i*0.13+0.07);
      g.gain.setValueAtTime(0,t0+i*0.13);
      g.gain.linearRampToValueAtTime(0.026,t0+i*0.13+0.02);
      g.gain.exponentialRampToValueAtTime(0.0007,t0+i*0.13+0.12);
      o.connect(g); g.connect(audio.L.master);
      o.start(t0+i*0.13); o.stop(t0+i*0.13+0.14);
    }
  }catch(e){}
}

function audioUpdate(dt,wT,r){
  const A=audio; if(!A.ctx||!A.L) return;
  try{

    const gust=0.72+0.28*Math.sin(wT/SOUND_PLAN.gustPeriod*TAU)+0.10*Math.sin(wT*0.61);
    A.L.wind.g.gain.setTargetAtTime(0.072*gust,now,0.4);
    const enc=enclosureAt(r.g,r.branch);
    A.L.leaves.g.gain.setTargetAtTime(0.05*enc*gust,now,0.6);
    const spd=(r.paused||r.ended)?0:r.v;
    A.L.tyre.g.gain.setTargetAtTime(clamp(spd/18,0,1)*0.048,now,0.25);
    A.L.tyre.f.frequency.setTargetAtTime(540+spd*55,now,0.3);
    const fr=getFrame(FRAMES[r.branch],r.sM);
    let wd=streamInfo(fr.x,fr.z).d;
    for(const P of PONDS) wd=Math.min(wd,Math.hypot(fr.x-P.cx,fr.z-P.cz)-P.rx);
    A.L.water.g.gain.setTargetAtTime(0.072*clamp(1-wd/28,0,1),now,0.5);
    A.L.rain.g.gain.setTargetAtTime(0.085*weatherState.amount,now,0.7);
    const st=subStream('snd',Math.floor(wT/3));
    if(wT-A.lastChirp>A.nextChirp){ A.lastChirp=wT;
      A.nextChirp=lerp(SOUND_PLAN.chirpGap[0],SOUND_PLAN.chirpGap[1],st.f());
      if(st.chance(0.82)) chirp(st); }
    if(wT-A.lastCreak>A.nextCreak){ A.lastCreak=wT;
      A.nextCreak=lerp(SOUND_PLAN.creakGap[0],SOUND_PLAN.creakGap[1],st.f());
      tone([[92,1,1],[137,0.4,0.7]],0.017,0.8); }
    const hd=Math.abs(r.g-HERO_G);
    if(hd<110&&A.podsArmed){ A.podsArmed=false;
      tone([[318,1,1],[476,0.5,0.8],[712,0.22,0.6]],0.016,3.2); }
    if(hd>170) A.podsArmed=true;

}

// ============================================================
// VALIDATION — measured against the realised world
// ============================================================
const VAL={};
{
  let maxKink=0,maxStep=0;
  for(const F of [FRAMES.sun,FRAMES.moss]) for(let i=1;i<F.N;i++){
    maxKink=Math.max(maxKink,Math.acos(clamp(F.tx[i]*F.tx[i-1]+F.tz[i]*F.tz[i-1],-1,1)));
    maxStep=Math.max(maxStep,Math.abs(F.y[i]-F.y[i-1]));
  }
  VAL.maxKinkRad=maxKink; VAL.maxStepM=maxStep;
  VAL.roadContinuity=(maxKink<0.055&&maxStep<0.30);

  // ---- the road, measured on the triangles the renderer actually draws ----
  // Three distinct things, kept distinct:
  //   surface   the rideable stone
  //   support   the shoulder immediately beside it, which must carry the edge
  //   landform  the bank, ditch or cut beyond, which is free to rise or fall
  let surfaceGapMax=0, supportGapMax=0, vergeDropMax=0, tilePokeCount=0, tilePokeMax=0,
      analyticDevMax=0, camBelow=0, samples=0, unsupported=0;
  const scanArm=(arm,s0,s1)=>{
    const F=FRAMES[arm];
    for(let s=s0;s<s1;s+=4){
      const fr=getFrame(F,s);
      for(const sd of [-1,1]){
        // the stone's own edge, read off the corridor mesh
        const uEdge=sd*RH;
        const yEdge=realizedCorridorY(arm,s,uEdge);
        if(yEdge===null) continue;
        samples++;
        // the support: ground immediately beside the stone, 0.22 m outboard.
        // Further out the verge is free to fall away — that is the design.
        const ySup=realizedCorridorY(arm,s,sd*(RH+0.22));
        const atCrossing=Math.abs(toGlobal(arm,s)-BECK_XG)<34;   // the bridge abutment is masonry
        if(ySup!==null&&!atCrossing){
          const gap=yEdge-ySup;
          supportGapMax=Math.max(supportGapMax,gap);
          if(gap>0.08) unsupported++;
        }
        const yVerge=realizedCorridorY(arm,s,sd*(RH+4.4));
        if(yVerge!==null) vergeDropMax=Math.max(vergeDropMax,yEdge-yVerge);
        // nothing from the coarse ground field may stand through the stone
        const ex=fr.x+fr.lx*uEdge, ez=fr.z+fr.lz*uEdge;
        const tY=realizedTileY(ex,ez);
        if(tY!==null&&tY>yEdge-0.02){ tilePokeCount++; tilePokeMax=Math.max(tilePokeMax,tY-yEdge); }
        // the analytic ground the props stand on must agree with the drawn mesh
        const yAnalytic=groundY(fr.x+fr.lx*sd*(RH+4.4),fr.z+fr.lz*sd*(RH+4.4));
        if(yVerge!==null){
          const dev=Math.abs(yAnalytic-yVerge);
          if(dev>analyticDevMax){ analyticDevMax=dev;
            VAL.analyticWorst={arm,s:Math.round(s),g:Math.round(toGlobal(arm,s)),side:sd,
              analytic:Math.round(yAnalytic*100)/100,mesh:Math.round(yVerge*100)/100}; }
        }
      }
      // the road surface itself against the ground function it was built from
      const yMid=realizedCorridorY(arm,s,0);
      if(yMid!==null) surfaceGapMax=Math.max(surfaceGapMax,Math.abs(yMid-(fr.y+CROWN)));
      if(fr.y+1.62<groundY(fr.x,fr.z)) camBelow++;
    }
  };
  scanArm('sun',2,FRAMES.sun.len-2);
  scanArm('moss',Math.max(2,S_COMMIT.moss-30),Math.min(FRAMES.moss.len-2,S_MERGE.moss+30));
  VAL.samples=samples;
  VAL.roadSurfaceGapM=surfaceGapMax;          // mesh vs the plan it was built from
  VAL.roadSupportGapM=supportGapMax;          // stone edge above the ground 0.22 m outboard
  VAL.vergeDropM=vergeDropMax;                // the designed fall to the verge, 4.4 m out
  VAL.roadUnsupportedSamples=unsupported;
  VAL.tilePokeThroughCount=tilePokeCount;
  VAL.tilePokeThroughMaxM=tilePokeMax;
  // The largest divergence between the drawn triangulated corridor and the
  // continuous ground function everything else stands on. It is not an error
  // budget: it peaks where the two lanes' shoulders cross at the fork, which is
  // a crease no triangulation samples exactly. Reported with its location so it
  // can be judged rather than trusted.
  VAL.analyticVsRealizedMaxM=analyticDevMax;
  VAL.cameraBelowTerrain=camBelow;
  VAL.roadNeverFloats=(supportGapMax<=0.08);
  VAL.roadNeverUnderTerrain=(tilePokeCount===0);

  // every planned solid object against the exclusion corridor
  let excl=0, minTreeD=1e9;
  for(const t of TREES){ minTreeD=Math.min(minTreeD,t.d); if(t.d<EXCL) excl++; }
  for(const P of PONDS){
    const fr=getFrame(FRAMES[P.name==='mosswater'?'moss':'sun'],
      clamp(toLocal(P.name==='mosswater'?'moss':'sun',P.g),0,FRAMES.sun.len-1));
    if(Math.hypot(P.cx-fr.x,P.cz-fr.z)<EXCL+P.rx) excl++;
  }
  if(routeInfo(HERO_POS.x,HERO_POS.z).d<EXCL) excl++;
  VAL.exclusionViolations=excl; VAL.minTreeCorridorM=minTreeD;
  // the beck is allowed under the road, but only where a crossing was planned
  {
    let runs=0, inRun=false, unplanned=0;
    for(const p of STREAM){
      const near=routeInfo(p.x,p.z).d<RH+1.5;
      if(near&&!inRun){
        runs++;
        if(Math.abs((p.g||0)-BECK_XG)>40) unplanned++;
      }
      inRun=near;
    }
    VAL.beckCrossings=runs; VAL.beckUnplannedCrossings=unplanned;
  }

  // fork: how far the arms actually get from each other, and how they come back
  let sep=0;
  for(let t=0.05;t<0.95;t+=0.02){
    const a=armCurve.sun.getPointAt(t), b=armCurve.moss.getPointAt(t);
    sep=Math.max(sep,a.distanceTo(b));
  }
  VAL.forkMaxSeparationM=sep;
  const eA=getFrame(FRAMES.sun,S_MERGE.sun), eB=getFrame(FRAMES.moss,S_MERGE.moss);
  VAL.rejoinErrorM=Math.hypot(eA.x-eB.x,eA.z-eB.z);
  VAL.armDurationSunS=ARM_TRUE.sun/CRUISE; VAL.armDurationMossS=ARM_TRUE.moss/CRUISE;
  VAL.armDurationDeltaPct=Math.abs(ARM_TRUE.sun-ARM_TRUE.moss)/Math.max(1,ARM_TRUE.sun)*100;
  let elevDelta=0;
  for(let t=0.15;t<0.85;t+=0.02)
    elevDelta=Math.max(elevDelta,Math.abs(armCurve.sun.getPointAt(t).y-armCurve.moss.getPointAt(t).y));
  VAL.forkElevationSplitM=elevDelta;
  VAL.branchDivergence=(sep>34&&elevDelta>12&&VAL.rejoinErrorM<3.5);

  // crests that genuinely hide the road and then give it back:
  // walk the sightline envelope forward and look for road that falls below it
  let hidden=0;
  for(const c of CRESTS){
    const s0=toLocal('sun',Math.max(0,c.g-120));
    const eye=getFrame(FRAMES.sun,s0).y+1.62;
    let maxSlope=-1e9, hiddenM=0;
    for(let d=25;d<300;d+=5){
      const f=getFrame(FRAMES.sun,clamp(s0+d,0,FRAMES.sun.len-1));
      const sl=(f.y-eye)/d;
      if(sl>=maxSlope-1e-6) maxSlope=sl;
      else if((maxSlope-sl)*d>1.1) hiddenM+=5;
    }
    if(hiddenM>=45) hidden++;
  }
  VAL.crestOcclusions=hidden;

  // the Wind Sisters: where along the route can they actually be seen? The
  // callback is real if two of those places are a long way apart on the road.
  const seeFrom=(g)=>{
    const fr=getFrame(FRAMES.sun,toLocal('sun',clamp(g,0,L_TOTAL)));
    const ex=fr.x, ez=fr.z, ey=fr.y+1.62;
    const tx=SISTERS.x, tz=SISTERS.z, ty=SISTERS.y+14;
    const D=Math.hypot(tx-ex,tz-ez);
    if(D>1520||D<120) return false;
    for(let t=0.06;t<0.94;t+=0.035){
      const px=lerp(ex,tx,t), pz=lerp(ez,tz,t), py=lerp(ey,ty,t);
      if(groundY(px,pz)>py+1.0) return false;
    }
    return true;
  };
  const visStations=[];
  for(let g=40;g<L_TOTAL;g+=60) if(seeFrom(g)) visStations.push(Math.round(g));
  VAL.sistersVisibleStations=visStations.length;
  VAL.sistersViewSpanM=visStations.length>1?(visStations[visStations.length-1]-visStations[0]):0;
  VAL.sistersFirstSeenAtM=visStations.length?visStations[0]:null;
  VAL.sistersLastSeenAtM=visStations.length?visStations[visStations.length-1]:null;
  VAL.sistersVisibleFromSunbank=seeFrom(SISTERS.gA);
  VAL.sistersVisibleFromGlasswater=seeFrom(SISTERS.gB);
  // the same piece of country, recognised again after a kilometre of riding
  VAL.spatialCallback=VAL.sistersViewSpanM>=1200&&visStations.length>=6;

  // the rest, and the road that keeps going past it
  const stopFr=getFrame(FRAMES.sun,toLocal('sun',S_STOP));
  VAL.restEdgeDropM=Math.max(
    Math.abs(stopFr.y-groundY(stopFr.x+RH*1.4*stopFr.lx,stopFr.z+RH*1.4*stopFr.lz)),
    Math.abs(stopFr.y-groundY(stopFr.x-RH*1.4*stopFr.lx,stopFr.z-RH*1.4*stopFr.lz)));
  { let clear=true;
    for(const t of TREES) if(Math.hypot(t.x-stopFr.x,t.z-stopFr.z)<EXCL) clear=false;
    VAL.restSafe=clear&&VAL.restEdgeDropM<1.1; }
  VAL.roadBeyondStopM=FRAMES.sun.len-toLocal('sun',S_STOP);
  VAL.roadContrastRatio=ROAD_CONTRAST;

  // grades and totals, measured separately on each realised line
  VAL.arm={};
  for(const arm of ['sun','moss']){
    const F=FRAMES[arm];
    let maxG=0,asc=0,desc=0,within=0,n=0;
    for(let i=1;i<=F.N;i++){
      const d=F.y[i]-F.y[i-1], g=Math.abs(d)/F.RS;
      maxG=Math.max(maxG,g); n++; if(g<=0.055) within++;
      if(d>0) asc+=d; else desc-=d;
    }
    VAL.arm[arm]={ ascentM:asc, descentM:desc, maxGradePct:maxG*100, within55Pct:within/n*100 };
  }
  VAL.maxGradePct=VAL.arm.sun.maxGradePct; VAL.ascentM=VAL.arm.sun.ascentM; VAL.descentM=VAL.arm.sun.descentM;
  VAL.gradeWithin55Pct=VAL.arm.sun.within55Pct;
  VAL.maxGradeMossPct=VAL.arm.moss.maxGradePct;
  VAL.maxGradeAnyPct=Math.max(VAL.arm.sun.maxGradePct,VAL.arm.moss.maxGradePct);
}

      forkMaxSeparationM:Math.round(VAL.forkMaxSeparationM*10)/10,
      forkElevationSplitM:Math.round(VAL.forkElevationSplitM*10)/10,

let wTime=0, lastNow=performance.now(), camInit=false, pitchSm=null, eyePrevY=null;
let fixedStep=0;
const camFwd=new THREE.Vector3(0,0,1);
const windDrift=WL.uCloudMove.value;
