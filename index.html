}
/* ============================================================================
 * LIFE — flocks with distinct silhouettes and behaviour, readable moments,
 * the one impossible encounter. All motion is time-based and deterministic.
 * ========================================================================== */

function makeBirdGeo(span, bodyLen, top, belly) {
  const pos = [], col = [], wing = [], idx = [];
  const push = (x, y, z, c, w) => { pos.push(x, y, z); col.push(c[0], c[1], c[2]); wing.push(w); return pos.length / 3 - 1; };
  // body: flat diamond, belly light / top dark via two layers
  const b0 = push(0, 0.02, bodyLen * 0.55, top, 0), b1 = push(-bodyLen * 0.16, 0.02, 0, top, 0),
    b2 = push(bodyLen * 0.16, 0.02, 0, top, 0), b3 = push(0, 0.05, -bodyLen * 0.45, top, 0);
  idx.push(b0, b1, b2, b1, b3, b2);
  const u0 = push(0, -0.02, bodyLen * 0.55, belly, 0), u1 = push(-bodyLen * 0.16, -0.02, 0, belly, 0),
    u2 = push(bodyLen * 0.16, -0.02, 0, belly, 0), u3 = push(0, -0.05, -bodyLen * 0.45, belly, 0);
  idx.push(u0, u2, u1, u1, u2, u3);
  for (const sgn of [-1, 1]) {
    const r0 = push(sgn * bodyLen * 0.14, 0, bodyLen * 0.18, top, 0);
    const r1 = push(sgn * bodyLen * 0.14, 0, -bodyLen * 0.12, top, 0);
    const m0 = push(sgn * span * 0.26, 0.01, bodyLen * 0.08, top, 0.35);
    const m1 = push(sgn * span * 0.26, 0.01, -bodyLen * 0.16, top, 0.35);
    const t0 = push(sgn * span * 0.5, 0.02, -bodyLen * 0.06, mix3(top, [0.12, 0.12, 0.13], 0.5), 1);
    if (sgn < 0) idx.push(r0, m0, r1, r1, m0, m1, m0, t0, m1);
    else idx.push(r0, r1, m0, r1, m1, m0, m0, m1, t0);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setAttribute('aWing', new THREE.Float32BufferAttribute(wing, 1));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

function initLifeGeos() {
  GEOS.gullBird = makeBirdGeo(1.15, 0.5, [0.62, 0.64, 0.66], [0.92, 0.93, 0.94]);
  GEOS.pelican = makeBirdGeo(2.4, 1.15, [0.45, 0.42, 0.38], [0.78, 0.74, 0.68]);
  GEOS.wader = makeBirdGeo(0.5, 0.24, [0.30, 0.27, 0.24], [0.94, 0.94, 0.92]);
  GEOS.kestrel = makeBirdGeo(0.78, 0.36, [0.5, 0.36, 0.24], [0.85, 0.8, 0.72]);
  GEOS.seal = new THREE.SphereGeometry(0.5, 9, 7);
  GEOS.seal.scale(0.62, 0.5, 1.75);
  GEOS.otter = new THREE.SphereGeometry(0.22, 7, 5);
  GEOS.otter.scale(0.8, 0.5, 1.9);
  GEOS.dolphin = new THREE.SphereGeometry(0.4, 9, 7);
  GEOS.dolphin.scale(0.5, 0.55, 2.2);
}

class Flock {
  constructor(world, seg, ev, kind) {
    this.world = world; this.seg = seg; this.ev = ev; this.kind = kind;
    const ct = ev.content;
    this.n = ct.count || 1;
    const geo = kind === 'pelicans' ? GEOS.pelican : (kind === 'waders' ? GEOS.wader : (kind === 'raptor' ? GEOS.kestrel : GEOS.gullBird));
    const mat = kind === 'pelicans' ? MATS.birdSlow : (kind === 'waders' || kind === 'raptor' ? MATS.birdFast : MATS.bird);
    this.mesh = new THREE.InstancedMesh(geo, mat, this.n);
    this.mesh.frustumCulled = false;
    this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    this.seedK = ev.sourceId;
    this.offs = [];
    for (let i = 0; i < this.n; i++) {
      this.offs.push({
        a: hash01(this.seedK, 'a', i) * TAU, r: 0.55 + hash01(this.seedK, 'r', i),
        v: 0.8 + hash01(this.seedK, 'v', i) * 0.5, ph: hash01(this.seedK, 'p', i) * TAU,
        up: (hash01(this.seedK, 'u', i) - 0.5),
      });
    }
    this.tmpM = new THREE.Matrix4(); this.tmpQ = new THREE.Quaternion();
    this.tmpE = new THREE.Euler(); this.tmpV = new THREE.Vector3(); this.tmpS = new THREE.Vector3(1, 1, 1);
    this.fr = {}; this.wp = [0, 0]; this.wl = [0, 0];
  }
  setBird(i, x, y, z, yaw, pitch, roll, sc) {
    this.tmpE.set(pitch, yaw, roll, 'YXZ');
    this.tmpQ.setFromEuler(this.tmpE);
    this.tmpV.set(x, y, z);
    this.tmpS.set(sc, sc, sc);
    this.tmpM.compose(this.tmpV, this.tmpQ, this.tmpS);
    this.mesh.setMatrixAt(i, this.tmpM);
  }
  anchor(sOff, dOff) {
    frameAt(this.seg.line, this.ev.stationOffsetM + (sOff || 0), this.fr);
    worldPos(this.seg.T, this.fr.x + this.fr.lx * (dOff), this.fr.z + this.fr.lz * (dOff), this.wp);
    return this.wp;
  }
  update(t) {
    const ct = this.ev.content;
    if (this.kind === 'gullWheel') {
      const a = this.anchor(0, ct.d);
      for (let i = 0; i < this.n; i++) {
        const o = this.offs[i];
        const ang = o.a + t * 0.14 * o.v * (i % 2 ? 1 : -1);
        const r = ct.r * o.r;
        const x = a[0] + Math.cos(ang) * r, z = a[1] + Math.sin(ang) * r;
        const y = ct.alt + Math.sin(t * 0.4 * o.v + o.ph) * 4 + o.up * 6;
        const yaw = -ang + (i % 2 ? -Math.PI / 2 : Math.PI / 2);
        this.setBird(i, x, y, z, yaw, 0, (i % 2 ? -0.3 : 0.3), 1);
      }
    } else if (this.kind === 'waders') {
      // one tight flock: a leader loop over the wet sand, the flock turning as one
      const span = ct.loopS[1] - ct.loopS[0];
      const u = (Math.sin(t * 0.11) * 0.5 + 0.5);
      const sL = ct.loopS[0] + u * span;
      const dL = lerp(ct.zoneD[0], ct.zoneD[1], Math.sin(t * 0.23) * 0.5 + 0.5);
      frameAt(this.seg.line, sL, this.fr);
      worldPos(this.seg.T, this.fr.x + this.fr.lx * dL, this.fr.z + this.fr.lz * dL, this.wp);
      const gy = Math.max(0.5, groundY(this.world, this.seg, sL, dL, this.wp[0], this.wp[1]));
      const alt = gy + 4.5 + 2.5 * Math.sin(t * 0.31);
      const heading = Math.cos(t * 0.11) >= 0 ? 0 : Math.PI;   // along the loop
      const bank = clamp(Math.sin(t * 0.23) * Math.cos(t * 0.11) * 1.4, -1, 1);
      const wt = worldVec(this.seg.T, this.fr.tx, this.fr.tz, [0, 0]);
      const yawBase = Math.atan2(wt[0], wt[1]) + heading + bank * 0.5;
      for (let i = 0; i < this.n; i++) {
        const o = this.offs[i];
        const lx2 = Math.cos(o.a) * o.r * 7, lz2 = Math.sin(o.a) * o.r * 4;
        const x = this.wp[0] + lx2 * Math.cos(yawBase) + lz2 * Math.sin(yawBase);
        const z = this.wp[1] - lx2 * Math.sin(yawBase) + lz2 * Math.cos(yawBase);
        const y = alt + o.up * 3 + Math.sin(t * 2 + o.ph) * 0.4;
        this.setBird(i, x, y, z, yawBase, 0, bank * 1.1, 1);
      }
    } else if (this.kind === 'pelicans') {
      // single file along the cliff face, BELOW the rider's eye
      const spanS = ct.s1 - ct.s0;
      for (let i = 0; i < this.n; i++) {
        const u = ((t * (spanS / ct.period) - i * 9) % (spanS + 260) + (spanS + 260)) % (spanS + 260) - 130;
        const sB = ct.s0 + clamp(u, -130, spanS + 130);
        frameAt(this.seg.line, clamp(sB, 0, this.seg.line.length), this.fr);
        const deckY = this.fr.y;
        worldPos(this.seg.T, this.fr.x + this.fr.lx * ct.dOff, this.fr.z + this.fr.lz * ct.dOff, this.wp);
        const wt = worldVec(this.seg.T, this.fr.tx, this.fr.tz, [0, 0]);
        const y = deckY - ct.dropBelowDeck + Math.sin(u * 0.02 + i) * 1.4;
        this.setBird(i, this.wp[0], Math.max(y, 6), this.wp[1], Math.atan2(wt[0], wt[1]), 0, Math.sin(i + t * 0.2) * 0.06, 1);
      }
    } else if (this.kind === 'raptor') {
      const dd = this.ev.content.arm && this.seg.ref.fork ? this.seg.ref.fork.armCut.offAt(this.ev.stationOffsetM) : (ct.d || -16);
      const a = this.anchor(0, dd);
      const gy = groundY(this.world, this.seg, this.ev.stationOffsetM, dd, a[0], a[1]);
      // held motionless on the wind, facing the sea (the wind's source)
      const wl2 = worldVec(this.seg.T, this.fr.lx, this.fr.lz, [0, 0]);
      const yaw = Math.atan2(wl2[0], wl2[1]);
      this.setBird(0, a[0] + Math.sin(t * 1.3) * 0.12, gy + ct.alt + Math.sin(t * 0.9) * 0.3, a[1], yaw, 0.12, 0, 1);
    }
    this.mesh.instanceMatrix.needsUpdate = true;
  }
}

class LifeSystem {
  constructor(world, seg) {
    this.world = world; this.seg = seg; this.p = seg.ref;
    this.group = new THREE.Group();
    this.flocks = [];
    this.animals = [];
    this.lifts = [];
    this.spout = null; this.dolphins = null; this.secondLight = null;
    const fr = {}, wp = [0, 0];
    for (const ev of this.p.lifeEvents) {
      const ct = ev.content;
      if (ct.type === 'gullWheel') this.addFlock(ev, 'gullWheel');
      else if (ct.type === 'waders') this.addFlock(ev, 'waders');
      else if (ct.type === 'pelicans') this.addFlock(ev, 'pelicans');
      else if (ct.type === 'raptor') { const f = new Flock(world, seg, ev, 'raptor'); f.n = 1; this.flocks.push(f); this.group.add(f.mesh); }
      else if (ct.type === 'seals' || ct.type === 'sealsSlide') {
        const at = ct.at ? this.p.formations.find(f => f.sourceId.endsWith('/' + ct.at)) : null;
        const d = at ? at.content.d : ct.d;
        frameAt(seg.line, ev.stationOffsetM, fr);
        worldPos(seg.T, fr.x + fr.lx * d, fr.z + fr.lz * d, wp);
        const baseY = at && at.content.type === 'skerry' ? at.content.h * 0.55 : Math.max(0.5, groundY(world, seg, ev.stationOffsetM, d, wp[0], wp[1]));
        const seals = [];
        for (let i = 0; i < ct.count; i++) {
          const m = new THREE.Mesh(GEOS.seal, MATS.seal);
          const a = hash01(ev.sourceId, 'sa', i) * TAU, r = hash01(ev.sourceId, 'sr', i) * 4;
          m.position.set(wp[0] + Math.cos(a) * r, baseY + 0.2, wp[1] + Math.sin(a) * r);
          m.rotation.y = hash01(ev.sourceId, 'sy', i) * TAU;
          m.scale.setScalar(0.8 + hash01(ev.sourceId, 'ss', i) * 0.5);
          this.group.add(m);
          seals.push({ m, home: m.position.clone(), phase: hash01(ev.sourceId, 'sp', i) * TAU });
        }
        this.animals.push({ type: ct.type, ev, seals, slid: false, slideT: -1 });
      }
      else if (ct.type === 'otter') {
        frameAt(seg.line, ev.stationOffsetM, fr);
        worldPos(seg.T, fr.x + fr.lx * ct.d, fr.z + fr.lz * ct.d, wp);
        const m = new THREE.Mesh(GEOS.otter, MATS.seal);
        m.position.set(wp[0], 0.05, wp[1]);
        this.group.add(m);
        this.animals.push({ type: 'otter', m, x: wp[0], z: wp[1] });
      }
      else if (ct.type === 'dolphins') {
        const pods = [];
        for (let i = 0; i < ct.count; i++) {
          const m = new THREE.Mesh(GEOS.dolphin, MATS.dolphin);
          m.visible = false;
          this.group.add(m);
          pods.push(m);
        }
        this.dolphins = { ev, pods, t0: -1 };
      }
      else if (ct.type === 'whaleSpout') {
        const sp = new THREE.Sprite(MATS.sprayTex);
        sp.visible = false;
        sp.scale.set(6, 10, 1);
        this.group.add(sp);
        this.spout = { ev, sp, t0: -1 };
      }
      else if (ct.type === 'gullLift') {
        const gulls = [];
        frameAt(seg.line, ev.stationOffsetM, fr);
        worldPos(seg.T, fr.x + fr.lx * 7.7, fr.z + fr.lz * 7.7, wp);
        for (let i = 0; i < ct.count; i++) {
          const m = new THREE.Mesh(GEOS.gullBird, MATS.bird);
          const off = i * 8;
          frameAt(seg.line, ev.stationOffsetM + off, fr);
          worldPos(seg.T, fr.x + fr.lx * 7.7, fr.z + fr.lz * 7.7, wp);
          m.position.set(wp[0], fr.y + 1.0, wp[1]);
          m.userData.home = m.position.clone();
          this.group.add(m);
          gulls.push(m);
        }
        this.lifts.push({ ev, gulls, state: 'perched', t0: 0 });
      }
      else if (ct.type === 'secondLight') {
        this.secondLight = { ev, armed: false, t0: -1, mesh: null };
      }
    }
  }
  addFlock(ev, kind) {
    const f = new Flock(this.world, this.seg, ev, kind);
    this.flocks.push(f);
    this.group.add(f.mesh);
  }
  update(t, dt, riderSeg, riderS, riderPos) {
    const near = riderSeg === this.seg;
    for (const f of this.flocks) f.update(t);
    for (const a of this.animals) {
      if (a.type === 'sealsSlide' && near && !a.slid && Math.abs(riderS - a.ev.stationOffsetM) < 70) { a.slid = true; a.slideT = t; }
      if (a.seals) {
        for (let i = 0; i < a.seals.length; i++) {
          const s = a.seals[i];
          if (a.slideT >= 0) {
            const u = clamp((t - a.slideT) / 4 - i * 0.18, 0, 1);
            s.m.position.set(s.home.x, s.home.y - u * (s.home.y + 0.4), s.home.z);
            s.m.rotation.x = -u * 0.8;
            s.m.visible = u < 0.98;
          } else {
            s.m.rotation.z = Math.sin(t * 0.4 + s.phase) * 0.07;   // haul-out shuffle
          }
        }
      }
      if (a.type === 'otter') {
        const bob = Math.sin(t * 0.8 + 1) * 0.1;
        const dive = (Math.sin(t * 0.09) > 0.75) ? -0.8 : 0;
        a.m.position.y = 0.02 + bob + dive;
        a.m.rotation.y = t * 0.15;
      }
    }
    if (this.dolphins) {
      const D = this.dolphins;
      if (near && D.t0 < 0 && riderS > D.ev.stationOffsetM && !this.world.rideFlags['dolphins:' + this.p.setPieceId]) {
        D.t0 = t; this.world.rideFlags['dolphins:' + this.p.setPieceId] = true;
      }
      if (D.t0 >= 0) {
        const u = (t - D.t0) / 14;
        const fr = {}, wp = [0, 0];
        for (let i = 0; i < D.pods.length; i++) {
          const m = D.pods[i];
          if (u >= 1) { m.visible = false; continue; }
          const sB = D.ev.stationOffsetM - 120 + u * 300 + i * 9;
          frameAt(this.seg.line, clamp(sB, 0, this.seg.line.length), fr);
          worldPos(this.seg.T, fr.x + fr.lx * D.ev.content.d, fr.z + fr.lz * D.ev.content.d, wp);
          const leap = Math.sin(u * 44 + i * 1.7);
          m.visible = leap > -0.4;
          m.position.set(wp[0], Math.max(-0.5, leap) * 1.1 - 0.25, wp[1]);
          const wt = worldVec(this.seg.T, fr.tx, fr.tz, [0, 0]);
          m.rotation.set(-Math.cos(u * 44 + i * 1.7) * 0.7, Math.atan2(wt[0], wt[1]), 0, 'YXZ');
        }
      }
    }
    if (this.spout) {
      const S = this.spout;
      const flagKey = 'whale:' + this.p.setPieceId;
      if (near && S.t0 < 0 && riderS > S.ev.stationOffsetM && !this.world.rideFlags[flagKey]) {
        S.t0 = t + S.ev.content.delayS;
        this.world.rideFlags[flagKey] = true;
      }
      if (S.t0 >= 0 && t >= S.t0) {
        const u = (t - S.t0) / 9;
        if (u >= 1) S.sp.visible = false;
        else {
          if (!S.sp.visible) {
            const fr = {}, wp = [0, 0];
            frameAt(this.seg.line, S.ev.stationOffsetM, fr);
            worldPos(this.seg.T, fr.x + fr.lx * S.ev.content.d, fr.z + fr.lz * S.ev.content.d, wp);
            S.sp.position.set(wp[0], 2, wp[1]);
            S.sp.visible = true;
          }
          const rise = sm(0, 0.25, u), fade = 1 - sm(0.45, 1, u);
          S.sp.scale.set(5 + u * 10, 4 + rise * 12, 1);
          S.sp.position.y = 1 + rise * 5;
          S.sp.material.opacity = 0.7 * fade;
        }
      }
    }
    for (const L of this.lifts) {
      if (L.state === 'perched' && near && Math.abs(riderS - L.ev.stationOffsetM) < 30 && !this.world.rideFlags['lift:' + L.ev.sourceId]) {
        L.state = 'flying'; L.t0 = t;
        this.world.rideFlags['lift:' + L.ev.sourceId] = true;
      }
      if (L.state === 'flying') {
        const u = (t - L.t0) / 9;
        for (let i = 0; i < L.gulls.length; i++) {
          const g = L.gulls[i], h = g.userData.home;
          if (u >= 1) {
            g.position.copy(h);
            g.rotation.set(0, 0, 0);
          } else {
            const a = u * TAU * 1.2 + i * 1.9;
            const r = 14 * Math.sin(Math.PI * clamp(u, 0, 1));
            g.position.set(h.x + Math.cos(a) * r, h.y + Math.sin(Math.PI * u) * (9 + i), h.z + Math.sin(a) * r - u * 18);
            g.rotation.y = -a + Math.PI / 2;
            g.rotation.z = 0.35;
          }
        }
        if (u >= 1) L.state = 'done';
      }
    }
    // THE SECOND LIGHT: once, far out at sea, an answer three seconds late
    if (this.secondLight && this.p.lighthouseWorld) {
      const SL = this.secondLight, lw = this.p.lighthouseWorld, ct = SL.ev.content;
      if (!SL.armed && near && riderS > SL.ev.stationOffsetM && !this.world.rideFlags['secondLight']) {
        SL.armed = true; SL.t0 = t + 4;
        this.world.rideFlags['secondLight'] = true;
        const fr = {}, wp = [0, 0];
        frameAt(this.seg.line, SL.ev.stationOffsetM, fr);
        const wl2 = worldVec(this.seg.T, fr.lx, fr.lz, [0, 0]);
        const wt2 = worldVec(this.seg.T, fr.tx, fr.tz, [0, 0]);
        const b = ct.bearingDeg * DEG;
        const dx = wt2[0] * Math.cos(b) + wl2[0] * Math.sin(b);
        const dz = wt2[1] * Math.cos(b) + wl2[1] * Math.sin(b);
        const grp = new THREE.Group();
        const beamGeo = new THREE.CylinderGeometry(0.2, 2.6, 70, 8, 1, true);
        beamGeo.rotateZ(Math.PI / 2); beamGeo.translate(35, 0, 0);
        const bm = new THREE.Mesh(beamGeo, MATS.beamFar);
        grp.add(bm);
        const gl = new THREE.Sprite(MATS.lampGlowFar);
        gl.scale.set(10, 10, 1);
        grp.add(gl);
        worldPos(this.seg.T, fr.x, fr.z, wp);
        grp.position.set(wp[0] + dx * ct.dist, 2.5, wp[1] + dz * ct.dist);
        grp.visible = false;
        this.group.add(grp);
        SL.mesh = grp;
      }
      if (SL.armed && SL.t0 >= 0 && t >= SL.t0 && SL.mesh) {
        const dur = ct.sweeps * lw.period;
        const u = (t - SL.t0) / dur;
        if (u >= 1) { SL.mesh.visible = false; }
        else {
          SL.mesh.visible = true;
          // same period, three seconds late
          const phase = ((t - ct.lateS) / lw.period) * TAU;
          SL.mesh.rotation.y = phase;
          MATS.lampGlowFar.opacity = 0.45 + 0.4 * Math.sin(phase * 2);
        }
      }
    }
  }
  dispose() {
    this.group.traverse(o => { if (o.geometry && !Object.values(GEOS).includes(o.geometry)) o.geometry.dispose(); });
  }
}

 * WATER & AIR — ocean, surf strip with sets/run-up/foam decay, spray fields,
 * the blowhole, blown sand, and the preview sky dome.

function makeOcean() {
  const geo = new THREE.CircleGeometry(6500, 48);
  geo.rotateX(-Math.PI / 2);
  const mesh = new THREE.Mesh(geo, MATS.ocean);
  mesh.position.y = -0.06;
  mesh.renderOrder = 1;

/* Shore strip: the animated water edge. Terrain-following sheet carrying
 * per-vertex ground height; the shader plays sets, swash, and foam over it. */
function* shoreChunkSteps(world, seg, ci, quality, into) {
  const s0 = ci * C.CHUNK_LEN, s1 = Math.min(s0 + C.CHUNK_LEN, seg.line.length);
  const step = ROW_STEP[quality] * 2;
  const nRows = Math.round((s1 - s0) / step) + 1;
  const nCols = 15;
  const fr = {}, wpO = [0, 0], wlO = [0, 0];
  // find the wet band per row
  const rows = [];
  for (let r = 0; r < nRows; r++) {
    const s = clamp(s0 + r * step, 0, seg.line.length);
    frameAt(seg.line, s, fr);
    worldPos(seg.T, fr.x, fr.z, wpO);
    worldVec(seg.T, fr.lx, fr.lz, wlO);
    let dWet0 = -1, dWet1 = -1;
    for (let d = 8.4; d <= 262; d += 4) {
      const y = groundY(world, seg, s, d, wpO[0] + wlO[0] * d, wpO[1] + wlO[1] * d);
      if (dWet0 < 0 && y < 2.6) dWet0 = d - 4;
      if (dWet0 >= 0 && y < -6.5) { dWet1 = d + 6; break; }
    }
    if (dWet0 < 0) dWet0 = 200;
    if (dWet1 < 0) dWet1 = 262;
    rows.push({ s, d0: Math.max(8.6, dWet0), d1: dWet1, fx: wpO[0], fz: wpO[1], lx: wlO[0], lz: wlO[1] });
    if ((r & 15) === 15) yield;
  }
  const nV = nRows * nCols;
  const pos = new Float32Array(nV * 3), aInfo = new Float32Array(nV * 3);
  for (let r = 0; r < nRows; r++) {
    const R = rows[r];
    for (let q = 0; q < nCols; q++) {
      const t = q / (nCols - 1);
      const d = lerp(R.d0, R.d1, Math.pow(t, 1.25));
      const wx = R.fx + R.lx * d, wz = R.fz + R.lz * d;
      const gy = groundY(world, seg, R.s, d, wx, wz);
      const i = r * nCols + q;
      pos[i * 3] = wx; pos[i * 3 + 1] = 0.04; pos[i * 3 + 2] = wz;
      aInfo[i * 3] = gy; aInfo[i * 3 + 1] = R.s; aInfo[i * 3 + 2] = d;
    }
  }
  const idx = new Uint32Array((nRows - 1) * (nCols - 1) * 6);
  let k = 0;
  for (let r = 0; r < nRows - 1; r++) {
    for (let q = 0; q < nCols - 1; q++) {
      const a = r * nCols + q, b = a + 1, c2 = a + nCols, d2 = c2 + 1;
      idx[k++] = a; idx[k++] = c2; idx[k++] = b;
      idx[k++] = b; idx[k++] = c2; idx[k++] = d2;
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aInfo', new THREE.BufferAttribute(aInfo, 3));
  geo.setIndex(new THREE.BufferAttribute(idx, 1));
  geo.computeBoundingSphere();
  const mesh = new THREE.Mesh(geo, MATS.shore);
  mesh.renderOrder = 2;
  mesh.matrixAutoUpdate = false;
  into.shore = mesh;
  into.tris += idx.length / 3;
  yield;
}

/* Spray / blown sand: shader-animated instanced puffs inside bounded pockets. */
const SPRAY_QUALITY = { low: 0.35, standard: 1.0, high: 1.5 };
function buildSprayField(world, seg, quality) {
  const p = seg.ref;
  const emitters = [];
  for (const ap of p.airPockets) if (ap.content.type === 'spray') emitters.push(ap);
  const dune = p.zones.kind === 'dune';
  const perEmitter = Math.round(90 * SPRAY_QUALITY[quality]);
  const sandN = dune ? Math.round(140 * SPRAY_QUALITY[quality]) : 0;
  const total = emitters.length * perEmitter + sandN + (p.blowholeWorld ? 60 : 0);
  if (!total) return null;
  const geo = new THREE.PlaneGeometry(1, 1);
  const inst = new THREE.InstancedBufferGeometry();
  inst.index = geo.index;
  inst.setAttribute('position', geo.getAttribute('position'));
  inst.setAttribute('uv', geo.getAttribute('uv'));
  const seeds = new Float32Array(total * 4);   // x,z base | phase | kind
  const bases = new Float32Array(total * 4);   // world x, y, z | scale
  let n = 0;
  const fr = {}, wpO = [0, 0], wlO = [0, 0];
  const put = (wx, wy, wz, sc, phase, kind) => {
    bases[n * 4] = wx; bases[n * 4 + 1] = wy; bases[n * 4 + 2] = wz; bases[n * 4 + 3] = sc;
    seeds[n * 4] = hash01('sp', seg.key, n * 2), seeds[n * 4 + 1] = hash01('sp', seg.key, n * 2 + 1);
    seeds[n * 4 + 2] = phase; seeds[n * 4 + 3] = kind;
    n++;
  };
  for (const em of emitters) {
    const ct = em.content;
    for (let i = 0; i < perEmitter; i++) {
      const s = lerp(ct.s0, ct.s1, hash01(em.sourceId, 's', i));
      const d = lerp(ct.d0, ct.d1, hash01(em.sourceId, 'd', i));
      frameAt(seg.line, clamp(s, 0, seg.line.length), fr);
      worldPos(seg.T, fr.x + fr.lx * d, fr.z + fr.lz * d, wpO);
      put(wpO[0], ct.y0 + 1, wpO[1], 1.6 + hash01(em.sourceId, 'sc', i) * 3.4, hash01(em.sourceId, 'ph', i), 0);
    }
  }
  for (let i = 0; i < sandN; i++) {
    const s = C.HANDOFF_M + hash01(seg.key, 'sand', i) * (p.length - 2 * C.HANDOFF_M);
    const side = hash01(seg.key, 'sside', i) < 0.7 ? 1 : -1;
    const d = side * (7.4 + hash01(seg.key, 'sd', i) * 17);
    frameAt(seg.line, s, fr);
    worldPos(seg.T, fr.x + fr.lx * d, fr.z + fr.lz * d, wpO);
    const gy = groundY(world, seg, s, d, wpO[0], wpO[1]);
    put(wpO[0], gy + 0.25, wpO[1], 0.9 + hash01(seg.key, 'ssc', i) * 1.6, hash01(seg.key, 'sph', i), 1);
  }
  if (p.blowholeWorld) {
    const b = p.blowholeWorld;
    for (let i = 0; i < 60; i++) {
      put(b.x + (hash01('bh', seg.key, i) - 0.5) * 1.4, b.y + 0.5, b.z + (hash01('bh2', seg.key, i) - 0.5) * 1.4,
        1.2 + hash01('bh3', seg.key, i) * 2.2, i / 60, 2);
    }
  }
  inst.setAttribute('aBase', new THREE.InstancedBufferAttribute(bases, 4));
  inst.setAttribute('aSeed', new THREE.InstancedBufferAttribute(seeds, 4));
  inst.instanceCount = n;
  const mesh = new THREE.Mesh(inst, MATS.spray);
  mesh.frustumCulled = false;
  mesh.renderOrder = 6;
  return mesh;
}
/* ============================================================================
 * MATERIALS — one injection system for bounded air pockets (airPockets family),
 * the preview-only global haze, wind sway, wetness, and the road surface.
 * ========================================================================== */

const SALT = {
  uniforms: {
    uTime: { value: 0 },
    uWindDir: { value: new THREE.Vector3(-0.94, 0, -0.33) }, // sea -> land (set from mean heading at boot)
    uSunDirW: { value: new THREE.Vector3(0.3, 0.2, 0.9) },
    uHazeOn: { value: 1 },
    uHazeAmt: { value: 0.00026 },
    uHazeColor: { value: new THREE.Color(PAL.hazePearl[0], PAL.hazePearl[1], PAL.hazePearl[2]) },
    uPockN: { value: 0 },
    uPockA: { value: Array.from({ length: 32 }, () => new THREE.Vector4()) },
    uPockB: { value: Array.from({ length: 32 }, () => new THREE.Vector4()) },
    uBlowFire: { value: 0 },
    uPocketsOn: { value: 1 },
  },
  mode: 'salt',

const GLSL_ATMOS_PARS = `
uniform float uTime; uniform vec3 uSunDirW; uniform float uHazeOn; uniform vec3 uHazeColor;
uniform float uHazeAmt; uniform int uPockN; uniform vec4 uPockA[32]; uniform vec4 uPockB[32];
uniform float uPocketsOn;
vec3 saltAtmos(vec3 col, vec3 wp, vec3 camP) {
  vec3 rd = wp - camP; float dist = length(rd) + 0.001;
  if (uPocketsOn > 0.5) {
    float od = 0.0; float tintAcc = 0.0;
    for (int i = 0; i < 32; i++) {
      if (i >= uPockN) break;
      vec3 c = uPockA[i].xyz; float den = uPockA[i].w; vec3 ir = uPockB[i].xyz;
      float acc = 0.0;
      for (int k = 0; k < 8; k++) {
        vec3 p = camP + rd * ((float(k) + 0.5) * 0.125);
        vec3 q = (p - c) * ir;
        float r2 = dot(q, q);
        if (r2 < 1.0) { float w = 1.0 - r2; acc += w * w; }
      }
      float o = acc * den * dist * 0.125;
      od += o; tintAcc += o * uPockB[i].w;
    }
    float pockF = 1.0 - exp(-od);
    float tint = od > 0.0001 ? clamp(tintAcc / od, 0.0, 1.0) : 0.0;
    vec3 pcol = uHazeColor * (1.03 + 0.09 * tint);   // sea fog is backlit, faintly luminous
    col = mix(col, pcol, pockF);
  }
  if (uHazeOn > 0.5) {
    float hh = max(wp.y, 1.0);
    float f = 1.0 - exp(-dist * uHazeAmt * exp(-hh * 0.0045));
    float sunT = pow(max(dot(rd / dist, uSunDirW), 0.0), 6.0);
    vec3 hz = mix(uHazeColor, uHazeColor * vec3(1.08, 0.99, 0.88), sunT);
    col = mix(col, hz, clamp(f, 0.0, 0.92));
  }
  return col;
}`;

function saltify(mat, opts) {
  opts = opts || {};
  mat.onBeforeCompile = (shader) => {
    Object.assign(shader.uniforms, SALT.uniforms);
    shader.vertexShader = shader.vertexShader

#ifdef USE_INSTANCING
  float hgt = clamp(position.y, 0.0, 2.0);

  float gust = 0.5 + 0.5 * sin(uTime * 1.9 + aPhase) + 0.4 * sin(uTime * 0.31 + aPhase * 0.7);

#ifdef USE_INSTANCING
  vWorldP = (modelMatrix * instanceMatrix * vec4(transformed, 1.0)).xyz;
#else
  vWorldP = (modelMatrix * vec4(transformed, 1.0)).xyz;

${opts.aux ? 'vAux = aAux;' : ''}
${opts.tint ? 'vTint = aTint;' : ''}

    }

        .replace('#include <roughnessmap_fragment>',

        .replace('#include <color_fragment>', `#include <color_fragment>
{
  float tn1 = rvn(vWorldP.xz * 1.9);

    }

        .replace('#include <color_fragment>', `{

/* ============================================================================
 * ENGINE — renderer, streaming, rider, camera, lights, boot, restart.
 * ========================================================================== */

function parseParams() {
  const u = new URLSearchParams(location.search);
  const q = (u.get('quality') || 'standard').toLowerCase();
  return {
    seed: u.get('seed') || C.DEFAULT_SEED,
    quality: ['low', 'standard', 'high'].includes(q) ? q : 'standard',
    light: (u.get('light') || 'salt').toLowerCase() === 'flat' ? 'flat' : 'salt',
    qa: u.get('qa') === '1',
    hold: u.get('hold') === '1',
  };
}

const ENGINE = {
  world: null, scene: null, renderer: null, camera: null,
  chunks: new Map(), buildQueue: [], activeGen: null,
  formations: new Map(), life: new Map(), spray: new Map(),
  rider: null, params: null, t: 0, timeScale: 1, holdUntil: 2.6,
  metrics: { frameDt: [], slice: { arr: [], over: 0, ceiling: 0, n: 0 }, buildExcluded: false },
  sun: null, hemi: null, muted: true, audio: null,
  ended: false, pockets: [],
};

/* ------------------------------------------------------------- air pockets */
function realizePockets(world) {
  const out = [];
  const fr = {}, wp = [0, 0];
  for (const seg of world.segments) {
    if (seg.kind !== 'piece') continue;
    const p = seg.ref;
    for (const ap of p.airPockets) {
      const ct = ap.content;
      const len = ct.s1 - ct.s0;
      const nSub = Math.max(1, Math.ceil(len / 130));
      const midD = (ct.d0 + ct.d1) / 2, midY = (ct.y0 + ct.y1) / 2;
      const rd = (ct.d1 - ct.d0) / 2 + 14, ry = (ct.y1 - ct.y0) / 2 + 6;
      const denNorm = nSub > 1 ? ct.density / 1.75 : ct.density;  // neighbouring sub-volumes overlap
      for (let i = 0; i < nSub; i++) {
        const s = ct.s0 + (i + 0.5) * len / nSub;
        frameAt(seg.line, clamp(s, 0, seg.line.length), fr);
        worldPos(seg.T, fr.x + fr.lx * midD, fr.z + fr.lz * midD, wp);
        const rs = len / nSub * 0.72 + 20;
        out.push({
          cx: wp[0], cy: midY, cz: wp[1],
          irx: 1 / Math.max(rs, rd), iry: 1 / ry, irz: 1 / Math.max(rs, rd),
          den: denNorm, tint: ct.type === 'spray' ? 1 : 0,
          segKey: seg.key, type: ct.type,
        });
      }
    }
  }
  world.pockets = out;
}
function updatePocketUniforms(camX, camZ) {
  const U = SALT.uniforms;
  let n = 0, imm = 0;
  const camY = ENGINE.camera.position.y;
  for (const p of ENGINE.world.pockets) {
    if (n >= 32) break;
    const dx = p.cx - camX, dz = p.cz - camZ;
    if (dx * dx + dz * dz > 1800 * 1800) continue;
    U.uPockA.value[n].set(p.cx, p.cy, p.cz, p.den);
    U.uPockB.value[n].set(p.irx, p.iry, p.irz, p.tint);
    if (p.type === 'fog') {
      const q1 = dx * p.irx, q2 = (camY - p.cy) * p.iry, q3 = dz * p.irz;
      const r2 = q1 * q1 + q2 * q2 + q3 * q3;
      if (r2 < 1) imm = Math.min(1, imm + (1 - r2) * clamp(p.den * 16, 0, 1));
    }
    n++;
  }
  U.uPockN.value = n;
  // fog occludes the sun (and flattens ground bounce): no glare inside the bank
  ENGINE.fogImm = imm;
  if (ENGINE.sunBase !== undefined) ENGINE.sun.intensity = ENGINE.sunBase * (1 - 0.82 * imm);
  if (ENGINE.hemiBase !== undefined) ENGINE.hemi.intensity = ENGINE.hemiBase * (1 - 0.34 * imm);
}

/* ------------------------------------------------------------------ chunks */
function* chunkPipeline(world, seg, ci, quality) {
  const into = { tris: 0, counts: {}, terrain: null, road: null, furniture: null, eco: null, shore: null };
  yield* terrainChunkSteps(world, seg, ci, quality, into);
  yield* roadChunkSteps(world, seg, ci, quality, into);
  yield* furnitureChunkSteps(world, seg, ci, quality, into);
  yield* ecologyChunkSteps(world, seg, ci, quality, into);
  yield* shoreChunkSteps(world, seg, ci, quality, into);
  const group = new THREE.Group();
  group.matrixAutoUpdate = false;
  for (const k of ['terrain', 'road', 'furniture', 'eco', 'shore']) if (into[k]) group.add(into[k]);
  return { group, tris: into.tris, counts: into.counts };
}

function chunkKey(seg, ci) { return seg.key + ':' + ci; }

function scheduleChunk(seg, ci) {
  const key = chunkKey(seg, ci);
  if (ENGINE.chunks.has(key)) return;
  ENGINE.chunks.set(key, { key, seg, ci, state: 'queued', group: null, tris: 0, counts: {} });
  ENGINE.buildQueue.push(key);
}

function disposeChunk(key) {
  const ch = ENGINE.chunks.get(key);
  if (!ch) return;
  if (ch.group) {
    ENGINE.scene.remove(ch.group);
    ch.group.traverse(o => {
      if (o.geometry) o.geometry.dispose();
    });
  }
  ENGINE.chunks.delete(key);
}

/* Run queued build work inside the slice budget. Publish only complete chunks. */
function pumpBuilds(budgetMs) {
  const t0 = performance.now();
  while (performance.now() - t0 < budgetMs) {
    if (!ENGINE.activeGen) {
      // take the nearest queued chunk
      let bestI = -1, bestD = 1e18;
      const rw = riderWorldS();
      for (let i = 0; i < ENGINE.buildQueue.length; i++) {
        const ch = ENGINE.chunks.get(ENGINE.buildQueue[i]);
        if (!ch || ch.state !== 'queued') continue;
        const d = Math.abs(ch.seg.worldS0 + ch.ci * C.CHUNK_LEN + 100 - rw);
        if (d < bestD) { bestD = d; bestI = i; }
      }
      if (bestI < 0) { ENGINE.buildQueue.length = 0; return; }
      const key = ENGINE.buildQueue.splice(bestI, 1)[0];
      const ch = ENGINE.chunks.get(key);
      if (!ch) continue;
      ch.state = 'building';
      ENGINE.activeGen = { gen: chunkPipeline(ENGINE.world, ch.seg, ch.ci, ENGINE.params.quality), ch };
    }
    const { gen, ch } = ENGINE.activeGen;
    const s0 = performance.now();
    const r = gen.next();
    const ms = performance.now() - s0;
    recordSlice(ms);
    if (r.done) {
      ch.group = r.value.group; ch.tris = r.value.tris; ch.counts = r.value.counts;
      ch.state = 'ready';
      ENGINE.scene.add(ch.group);
      accumulateCounts(ch);
      ENGINE.activeGen = null;
    }
  }
}
function recordSlice(ms) {
  const m = ENGINE.metrics.slice;
  m.n++;
  if (ms > C.SLICE_BUDGET_MS) m.over++;
  if (ms > C.SLICE_CEILING_MS) m.ceiling++;
  if (m.arr.length < 20000) m.arr.push(ms);
}
function accumulateCounts(ch) {
  const seg = ch.seg;
  if (seg.kind !== 'piece') return;
  const p = seg.ref;
  p.countedChunks = p.countedChunks || new Set();
  if (p.countedChunks.has(ch.ci)) return;
  p.countedChunks.add(ch.ci);
  p.counts = p.counts || { grass: 0, elements: 0, organisms: 0, furniture: 0 };
  for (const k of ['grass', 'elements', 'organisms', 'furniture']) p.counts[k] += ch.counts[k] || 0;
}

function riderWorldS() {
  const r = ENGINE.rider;
  const leg = r.legs[r.legIdx];
  const localSpine = leg.line.frames === leg.seg.line.frames
    ? r.s
    : frameAt(leg.line, r.s, {}).sSpine;
  return leg.seg.worldS0 + localSpine;
}

function updateStreaming() {
  const rw = riderWorldS();
  const want = new Set();
  for (const seg of ENGINE.world.segments) {
    const nCh = Math.ceil(seg.ref.length / C.CHUNK_LEN);
    for (let ci = 0; ci < nCh; ci++) {
      const mid = seg.worldS0 + ci * C.CHUNK_LEN + C.CHUNK_LEN / 2;
      if (mid > rw - C.BEHIND_BUILD_M && mid < rw + C.AHEAD_BUILD_M) {
        want.add(chunkKey(seg, ci));
        scheduleChunk(seg, ci);
      }
    }
    // piece-level: formations, life, spray
    const segMid = seg.worldS0 + seg.ref.length / 2;
    const inRange = Math.abs(segMid - rw) < seg.ref.length / 2 + 2400;
    if (seg.kind === 'piece') {
      if (inRange && !ENGINE.formations.has(seg.key)) {
        const g = buildPieceFormations(ENGINE.world, seg);
        ENGINE.formations.set(seg.key, g);
        ENGINE.scene.add(g);
        const life = new LifeSystem(ENGINE.world, seg);
        ENGINE.life.set(seg.key, life);
        ENGINE.scene.add(life.group);
        const sp = buildSprayField(ENGINE.world, seg, ENGINE.params.quality);
        if (sp) { ENGINE.spray.set(seg.key, sp); ENGINE.scene.add(sp); }
      } else if (!inRange && ENGINE.formations.has(seg.key)) {
        const g = ENGINE.formations.get(seg.key);
        ENGINE.scene.remove(g);
        g.traverse(o => { if (o.geometry && !Object.values(GEOS).includes(o.geometry)) o.geometry.dispose(); });
        ENGINE.formations.delete(seg.key);
        const life = ENGINE.life.get(seg.key);
        if (life) { ENGINE.scene.remove(life.group); life.dispose(); ENGINE.life.delete(seg.key); }
        const sp = ENGINE.spray.get(seg.key);
        if (sp) { ENGINE.scene.remove(sp); sp.geometry.dispose(); ENGINE.spray.delete(seg.key); }
      }
    }
  }
  for (const key of Array.from(ENGINE.chunks.keys())) {
    const ch = ENGINE.chunks.get(key);
    const mid = ch.seg.worldS0 + ch.ci * C.CHUNK_LEN + C.CHUNK_LEN / 2;
    if (mid < rw - C.BEHIND_DROP_M || mid > rw + C.AHEAD_DROP_M) {
      if (ch.state === 'ready') disposeChunk(key);
      else if (ch.state === 'queued') { ENGINE.chunks.delete(key); }
    }
  }
}

/* Build everything wanted for the current position, synchronously (QA/boot). */
function settleStreaming() {
  ENGINE.metrics.buildExcluded = true;
  let guard = 0;
  updateStreaming();
  while (guard++ < 100000) {
    const pending = ENGINE.buildQueue.length > 0 || ENGINE.activeGen;
    if (!pending) break;
    pumpBuilds(50);
  }
  ENGINE.metrics.buildExcluded = false;
}

/* -------------------------------------------------------------------- rider */
function buildLegs(world) {
  const legs = [];
  for (const seg of world.segments) {
    if (seg.kind === 'piece' && seg.ref.fork) {
      const fk = seg.ref.fork;
      legs.push({ seg, line: seg.line, s0: 0, s1: fk.f0, forkGate: true });
      legs.push({ seg, line: null, s0: 0, s1: 0, armSlot: true });   // resolved at the gate
      legs.push({ seg, line: seg.line, s0: fk.f1, s1: seg.ref.length });
    } else {
      legs.push({ seg, line: seg.line, s0: 0, s1: seg.ref.length });
    }
  }
  return legs;
}

function makeRider(world) {
  return {
    legs: buildLegs(world), legIdx: 0, s: 8, v: 0, targetV: C.CRUISE_SPEED,
    lat: 0, latVel: 0, steer: 0, forkPref: 0, chosenArm: null,
    lookYaw: 0, lookPitch: 0, dragging: false, paused: false,
  };
}

function advanceRider(dt) {
  const r = ENGINE.rider;
  if (r.paused || ENGINE.ended) return;
  if (ENGINE.t < ENGINE.holdUntil) return;
  const accel = r.targetV > r.v ? 2.6 : 4.2;
  r.v += clamp(r.targetV - r.v, -accel * dt, accel * dt);
  // steering: lateral offset within the lane (lat is along +l = LEFT/seaward)
  r.lat = clamp(r.lat - r.steer * dt * 2.6, -2.6, 2.6);
  if (r.steer === 0) r.lat *= Math.pow(0.5, dt / 2.5);
  if (r.steer !== 0) r.forkPref = r.steer;
  let leg = r.legs[r.legIdx];
  r.s += r.v * dt;
  while (leg && r.s > leg.s1) {
    const overflow = r.s - leg.s1;
    if (r.legIdx >= r.legs.length - 1) {
      // route end: ease out and stop
      r.s = leg.s1;
      ENGINE.ended = true;
      setHud('ride complete — R restarts from the same seed');
      return;
    }
    r.legIdx++;
    let next = r.legs[r.legIdx];
    if (next.armSlot) {
      // A / left leans seaward onto the tideline arm; D / right takes the cutting
      const fk = leg.seg.ref.fork;
      const arm = (r.forkPref > 0) || (r.forkPref === 0 && r.lat < -0.8) ? fk.armCut : fk.armTide;
      r.chosenArm = arm === fk.armTide ? 'tide' : 'cut';
      next.line = arm; next.s0 = 0; next.s1 = arm.length;
    }
    r.s = next.s0 + overflow;
    leg = next;
  }
}

const _camFr = {}, _camFr2 = {};
function riderPose(out) {
  const r = ENGINE.rider;
  const leg = r.legs[r.legIdx];
  frameAt(leg.line, r.s, _camFr);
  const wp = worldPos(leg.seg.T, _camFr.x + _camFr.lx * r.lat, _camFr.z + _camFr.lz * r.lat, [0, 0]);
  const wt = worldVec(leg.seg.T, _camFr.tx, _camFr.tz, [0, 0]);
  out.x = wp[0]; out.z = wp[1]; out.y = _camFr.y + C.EYE_HEIGHT;
  out.yaw = Math.atan2(wt[0], wt[1]);
  out.k = _camFr.k;
  out.grade = _camFr.gradePercent;
  out.leg = leg;
  return out;
}

const _pose = {};
function updateCamera(dt) {
  if (ENGINE.camLock) return;
  const r = ENGINE.rider;
  riderPose(_pose);
  const leg = _pose.leg;

  const wpA = worldPos(leg.seg.T, _camFr2.x + _camFr2.lx * r.lat * 0.4, _camFr2.z + _camFr2.lz * r.lat * 0.4, [0, 0]);
  const aheadYaw = Math.atan2(wpA[0] - _pose.x, wpA[1] - _pose.z);

  while (dyaw > Math.PI) dyaw -= TAU;
  while (dyaw < -Math.PI) dyaw += TAU;
  const baseYaw = _pose.yaw + dyaw * 0.55;
  const cam = ENGINE.camera;
  cam.position.set(_pose.x, _pose.y, _pose.z);
  const yaw = baseYaw + r.lookYaw;
  const pitch = clamp(-_pose.grade * 0.004 + r.lookPitch, -1.1, 0.75);
  const roll = clamp(-_pose.k * r.v * 0.11, -2.2 * DEG, 2.2 * DEG);
  cam.rotation.set(0, 0, 0);
  cam.rotateY(-yaw + Math.PI);   // three cameras look down -Z; our yaw faces +Z convention
  cam.rotateX(pitch);
  cam.rotateZ(roll);
}

/* ------------------------------------------------------------------ lights */
function applyLightRig(mode) {
  SALT.mode = mode;
  const world = ENGINE.world;
  // mean heading across the pieces for a stable sun/wind basis
  let sx = 0, sz = 0;
  for (const seg of world.segments) {
    if (seg.kind !== 'piece') continue;
    for (let i = 0; i < seg.line.frames.length; i += 40) {
      const f = seg.line.frames[i];
      const wv = worldVec(seg.T, f.tx, f.tz, [0, 0]);
      sx += wv[0]; sz += wv[1];
    }
  }
  const meanYaw = Math.atan2(sx, sz);
  const latX = Math.cos(meanYaw), latZ = -Math.sin(meanYaw); // left of mean travel
  SALT.uniforms.uWindDir.value.set(-latX + Math.sin(meanYaw) * 0.35, 0, -latZ + Math.cos(meanYaw) * 0.35).normalize();
  const flat = mode === 'flat';
  const el = (flat ? 55 : C.SUN_ELEV_DEG) * DEG;
  const az = flat ? meanYaw + 2.4 : meanYaw + 26 * DEG; // low sun ahead-seaward
  const sunDir = new THREE.Vector3(
    Math.sin(az) * Math.cos(el) * (flat ? 1 : 1) + (flat ? 0 : latX * 0.22),
    Math.sin(el),
    Math.cos(az) * Math.cos(el) + (flat ? 0 : latZ * 0.22)).normalize();
  SALT.uniforms.uSunDirW.value.copy(sunDir);
  SALT.uniforms.uHazeOn.value = flat ? 0 : 1;
  ENGINE.sun.color.setRGB(...(flat ? [1, 1, 1] : [1.0, 0.85, 0.68]));
  ENGINE.sun.intensity = flat ? 2.9 : 4.2;
  ENGINE.sunBase = ENGINE.sun.intensity;
  ENGINE.sun.position.copy(sunDir).multiplyScalar(600);
  ENGINE.hemi.color.setRGB(...(flat ? [0.70, 0.71, 0.73] : [0.55, 0.64, 0.77]));
  ENGINE.hemi.groundColor.setRGB(...(flat ? [0.40, 0.39, 0.38] : [0.50, 0.44, 0.36]));
  ENGINE.hemi.intensity = flat ? 1.05 : 1.0;
  ENGINE.hemiBase = ENGINE.hemi.intensity;
  ENGINE.renderer.toneMapping = flat ? THREE.LinearToneMapping : THREE.ACESFilmicToneMapping;
  ENGINE.renderer.toneMappingExposure = flat ? 1.0 : 1.05;
  MATS.sky.uniforms.uFlat.value = flat ? 1 : 0;
  MATS.ocean.uniforms.uFlat.value = flat ? 1 : 0;
  MATS.shore.uniforms.uFlat.value = flat ? 1 : 0;
}

function updateShadowCamera() {
  const sun = ENGINE.sun;
  const cam = ENGINE.camera;
  const snap = 8;
  const cx = Math.round(cam.position.x / snap) * snap;
  const cz = Math.round(cam.position.z / snap) * snap;
  sun.position.set(cx, 0, cz).addScaledVector(SALT.uniforms.uSunDirW.value, 640);
  sun.target.position.set(cx, 0, cz);
  sun.target.updateMatrixWorld();
}

/* --------------------------------------------------------------- lighthouse */
function updateLighthouse(t) {
  for (const [key, life] of ENGINE.life) {
    const p = life.p;
    if (!p.lighthouseWorld) continue;
    const lw = p.lighthouseWorld;
    const phase = (t / lw.period) * TAU;
    lw.beams.rotation.y = phase;
    // lamp flares when a beam sweeps the camera bearing
    const cam = ENGINE.camera.position;
    const bearing = Math.atan2(cam.x - lw.x, cam.z - lw.z);
    let d = (phase % Math.PI) - (((bearing % Math.PI) + Math.PI) % Math.PI);
    const flash = Math.exp(-Math.pow(Math.sin(phase - bearing), 2) * 60);
    lw.glowMat.opacity = 0.35 + 0.65 * flash;
  }
  // blowhole envelope from its planned schedule
  let fire = 0;
  for (const [key, life] of ENGINE.life) {
    const p = life.p;
    if (!p.blowholeWorld) continue;
    const sched = p.blowholeWorld.schedule;
    let cycle = 0;
    for (const iv of sched) cycle += iv;
    let tt = ((t % cycle) + cycle) % cycle;
    for (const iv of sched) {
      if (tt < iv) { fire = Math.max(fire, tt > iv - 3.5 ? sm(iv - 3.5, iv - 2.2, tt) * (1 - sm(iv - 1.2, iv, tt)) : 0); break; }
      tt -= iv;
    }
    if (fire > 0.01 && ENGINE.audio) ENGINE.audio.blowhole(fire, p.blowholeWorld);
  }
  SALT.uniforms.uBlowFire.value = fire;
}

/* --------------------------------------------------------------------- HUD */
function setHud(extra) {
  const hud = document.getElementById('hud');
  hud.textContent = extra
    ? extra
    : 'W/S speed · A/D steer · drag look · space pause · R restart · M sound';
}
function setTag() {
  document.getElementById('tag').textContent =
    `${ENGINE.params.seed} · ${ENGINE.params.quality}${ENGINE.params.light === 'flat' ? ' · flat light' : ''}`;
}

/* ---------------------------------------------------------------- controls */
function bindControls() {
  const r = ENGINE.rider;
  const kd = (e) => {
    if (ENGINE.audio === null && !e.repeat) startAudio();
    switch (e.code) {
      case 'KeyW': case 'ArrowUp': ENGINE.rider.targetV = C.MAX_SPEED; break;
      case 'KeyS': case 'ArrowDown': ENGINE.rider.targetV = 2.2; break;
      case 'KeyA': case 'ArrowLeft': ENGINE.rider.steer = -1; break;
      case 'KeyD': case 'ArrowRight': ENGINE.rider.steer = 1; break;
      case 'Space': ENGINE.rider.paused = !ENGINE.rider.paused; e.preventDefault(); break;
      case 'KeyR': restartRide(); break;
      case 'KeyM': toggleMute(); break;
    }
    if (ENGINE.t < ENGINE.holdUntil && ['KeyW', 'ArrowUp'].includes(e.code)) ENGINE.holdUntil = 0;
  };
  const ku = (e) => {
    switch (e.code) {
      case 'KeyW': case 'ArrowUp': case 'KeyS': case 'ArrowDown': ENGINE.rider.targetV = C.CRUISE_SPEED; break;
      case 'KeyA': case 'ArrowLeft': if (ENGINE.rider.steer < 0) ENGINE.rider.steer = 0; break;
      case 'KeyD': case 'ArrowRight': if (ENGINE.rider.steer > 0) ENGINE.rider.steer = 0; break;
    }
  };
  window.addEventListener('keydown', kd);
  window.addEventListener('keyup', ku);
  const cv = ENGINE.renderer.domElement;
  let px = 0, py = 0;
  cv.addEventListener('pointerdown', (e) => { ENGINE.rider.dragging = true; px = e.clientX; py = e.clientY; if (ENGINE.audio === null) startAudio(); });
  window.addEventListener('pointerup', () => { ENGINE.rider.dragging = false; });
  window.addEventListener('pointermove', (e) => {
    if (!ENGINE.rider.dragging) return;
    ENGINE.rider.lookYaw = clamp(ENGINE.rider.lookYaw + (e.clientX - px) * 0.003, -1.15, 1.15);
    ENGINE.rider.lookPitch = clamp(ENGINE.rider.lookPitch - (e.clientY - py) * 0.0024, -0.62, 0.38);
    px = e.clientX; py = e.clientY;
  });
  window.addEventListener('resize', () => {
    ENGINE.camera.aspect = innerWidth / innerHeight;
    ENGINE.camera.updateProjectionMatrix();
    ENGINE.renderer.setSize(innerWidth, innerHeight);
  });
}

function restartRide() {
  ENGINE.rider = makeRider(ENGINE.world);
  ENGINE.world.rideFlags = {};
  ENGINE.t = 0;
  ENGINE.holdUntil = 2.6;
  ENGINE.ended = false;
  // life systems carry one-shot visual state: rebuild them clean
  for (const [key, life] of Array.from(ENGINE.life)) {
    ENGINE.scene.remove(life.group);
    life.dispose();
    ENGINE.life.delete(key);
  }
  const segStart = ENGINE.world.segments[0];
  setHud();
  updateStreaming();
}

/* -------------------------------------------------------------------- boot */
function bootFail(msg) {
  const el = document.getElementById('fail');
  el.style.display = 'flex';
  el.textContent = 'SALTLIGHT REACH failed to build: ' + msg;
  throw new Error(msg);
}

function boot() {
  ENGINE.params = parseParams();
  const canvas = document.getElementById('stage');
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true,
      preserveDrawingBuffer: ENGINE.params.qa, powerPreference: 'high-performance' });
  } catch (e) { bootFail('WebGL unavailable: ' + e.message); }
  ENGINE.renderer = renderer;
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.6));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  if (ENGINE.params.quality !== 'low') {
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  }
  initMaterials();
  initFurnitureGeos();
  initEcoGeos();
  initLifeGeos();

  const world = buildWorldPlan(ENGINE.params.seed);
  ENGINE.world = world;
  world.rideFlags = {};
  world.stats = { musselYMin: 99, musselYMax: -99 };
  if (world.validation.errors.length) bootFail(world.validation.errors.join(' | '));
  realizePockets(world);

  const scene = new THREE.Scene();
  ENGINE.scene = scene;
  ENGINE.camera = new THREE.PerspectiveCamera(66, innerWidth / innerHeight, 0.3, 15000);
  ENGINE.sun = new THREE.DirectionalLight(0xffffff, 3);
  ENGINE.sun.castShadow = ENGINE.params.quality !== 'low';
  const sh = ENGINE.sun.shadow;
  sh.mapSize.setScalar(ENGINE.params.quality === 'high' ? 4096 : 2048);
  sh.camera.left = -170; sh.camera.right = 170; sh.camera.top = 170; sh.camera.bottom = -170;
  sh.camera.near = 200; sh.camera.far = 1100;
  sh.bias = -0.0006;
  sh.normalBias = 1.2;
  scene.add(ENGINE.sun);
  scene.add(ENGINE.sun.target);
  ENGINE.hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
  scene.add(ENGINE.hemi);
  ENGINE.ocean = makeOcean();
  scene.add(ENGINE.ocean);
  ENGINE.skyDome = makeSky();
  scene.add(ENGINE.skyDome);

  ENGINE.rider = makeRider(world);
  applyLightRig(ENGINE.params.light);
  setHud();
  setTag();
  bindControls();
  installProof();
  if (ENGINE.params.qa) installQA();
  if (ENGINE.params.hold) ENGINE.holdUntil = 1e9;

  // the opening frame must be complete before it is ever shown
  settleStreaming();
  ENGINE.lastRaf = performance.now();
  requestAnimationFrame(tick);
}

function tick(now) {
  const rawMs = now - ENGINE.lastRaf;
  const dtRaw = Math.min(rawMs / 1000, 0.05);
  ENGINE.lastRaf = now;
  const dt = dtRaw * ENGINE.timeScale;
  if (!ENGINE.measuring) ENGINE.t += dt;
  const m = ENGINE.metrics.frameDt;
  m.push(rawMs);
  if (m.length > 4000) m.shift();
  SALT.uniforms.uTime.value = ENGINE.t;
  advanceRider(dt);
  updateStreaming();
  pumpBuilds(C.SLICE_BUDGET_MS);
  updateCamera(dt);
  updateShadowCamera();
  updatePocketUniforms(ENGINE.camera.position.x, ENGINE.camera.position.z);
  ENGINE.ocean.position.x = ENGINE.camera.position.x;
  ENGINE.ocean.position.z = ENGINE.camera.position.z;
  ENGINE.skyDome.position.copy(ENGINE.camera.position);
  const rw = riderWorldS();
  for (const [key, life] of ENGINE.life) {
    const leg = ENGINE.rider.legs[ENGINE.rider.legIdx];
    const rp = leg.seg === life.seg ? (leg.line.frames === leg.seg.line.frames ? ENGINE.rider.s : frameAt(leg.line, ENGINE.rider.s, {}).sSpine) : -1e9;
    life.update(ENGINE.t, dt, leg.seg, rp, ENGINE.camera.position);
  }
  updateLighthouse(ENGINE.t);
  if (ENGINE.audio) ENGINE.audio.update();
  ENGINE.renderer.render(ENGINE.scene, ENGINE.camera);
  requestAnimationFrame(tick);
}
/* ============================================================================

    this.surf.g.connect(this.surfPan); this.surfPan.connect(master);
    this.wind = mk('bandpass', 750, 0.4, 0); this.wind.g.connect(master);
    this.hiss = mk('highpass', 2800, 0.5, 0); this.hiss.g.connect(master);
    this.tyre = mk('lowpass', 800, 0.8, 0); this.tyre.g.connect(master);
    this.blow = mk('lowpass', 300, 0.7, 0); this.blow.g.connect(master);
    this.hum = ctx.createOscillator(); this.hum.frequency.value = 64;
    this.humG = ctx.createGain(); this.humG.gain.value = 0;
    this.hum.connect(this.humG); this.humG.connect(master);
    this.hum.start();
    this.lastFoghornEpoch = -1;
    this.lastGull = 0;
    master.gain.setTargetAtTime(0.85, ctx.currentTime, 0.8);
  }
  set(g, v, tc) { g.gain.setTargetAtTime(clamp(v, 0, 1.5), this.ctx.currentTime, tc || 0.4); }

      g.gain.exponentialRampToValueAtTime(gain, when + 0.7);
      g.gain.setValueAtTime(gain, when + 1.7);
      g.gain.exponentialRampToValueAtTime(0.0001, when + 2.4);

  }
  blowhole(fire, pos) {
    const d = Math.hypot(ENGINE.camera.position.x - pos.x, ENGINE.camera.position.z - pos.z);

  }
  update() {

    else if (kind === 'cliff') shoreDist = 40 + (pieceWeight(p, sp) > 0.4 ? 18 : 80);
    else if (kind === 'slip') shoreDist = leg.line.id && leg.line.id.endsWith(':tide') ? 24 : p.zones.shoreD;
    else if (kind === 'fog') shoreDist = p.zones.shoreD;

      if (pk.type !== 'fog') continue;

    }

    const surfGain = clamp(70 / (shoreDist + 26), 0.06, 0.85) * (0.45 + 0.55 * setEnv) * (1 + fogAmt * 0.35);
    this.set(this.surf.g, ENGINE.muted ? 0 : surfGain * 0.5);
    this.surf.f.frequency.setTargetAtTime(520 - fogAmt * 220, this.ctx.currentTime, 0.5);
    // pan toward the sea relative to look direction
    const wl = worldVec(seg.T, fr.lx, fr.lz, [0, 0]);
    const camYaw = Math.atan2(-ENGINE.camera.matrixWorld.elements[8], -ENGINE.camera.matrixWorld.elements[10]);
    const rightX = Math.cos(camYaw), rightZ = -Math.sin(camYaw);
    this.surfPan.pan.setTargetAtTime(clamp(rightX * wl[0] + rightZ * wl[1], -1, 1) * 0.6, this.ctx.currentTime, 0.3);
    const exposure = kind === 'cliff' ? 0.9 : (kind === 'dune' ? 0.65 : 0.5);
    this.set(this.wind.g, ENGINE.muted ? 0 : 0.10 * exposure * (1 - fogAmt * 0.65));
    this.set(this.hiss.g, ENGINE.muted ? 0 : (kind === 'dune' ? 0.035 : 0.012) * (1 - fogAmt * 0.7));
    const wet = roadWetness(seg, leg.line, sp, r.chosenArm === 'cut' ? 'cut' : 'tide');
    const patch = p ? nearestPatch(p.roadPatches, sp, 0) : null;
    const onPatch = patch && sp > patch.s0 && sp < patch.s0 + patch.len;
    this.set(this.tyre.g, ENGINE.muted || r.paused ? 0 : clamp(r.v / C.MAX_SPEED, 0, 1) * (onPatch ? 0.035 : 0.06) * (1 + wet * 0.5));
    this.tyre.f.frequency.setTargetAtTime(500 + r.v * 40 + wet * 300, this.ctx.currentTime, 0.3);
    this.set(this.humG, ENGINE.muted ? 0 : 0.012 * exposure * (0.5 + 0.5 * Math.sin(ENGINE.t * 0.37)));

    for (const [key, life] of ENGINE.life) {
      const lw = life.p.lighthouseWorld;
      if (!lw) continue;
      const epoch = Math.floor(ENGINE.t / lw.foghornEvery);
      if (epoch !== this.lastFoghornEpoch && !ENGINE.muted) {
        this.lastFoghornEpoch = epoch;
        const d = Math.hypot(ENGINE.camera.position.x - lw.x, ENGINE.camera.position.z - lw.z);
        const g = clamp(900 / (d + 120), 0.02, 0.5) * (0.5 + fogAmt);
        const dtNext = (epoch + 1) * lw.foghornEvery - ENGINE.t;
        this.foghorn(this.ctx.currentTime + dtNext, clamp(g, 0, 0.6));
      }
    }
    // gull cries near active gull flocks
    if (ENGINE.t - this.lastGull > 2.2 && !ENGINE.muted) {
      for (const [key, life] of ENGINE.life) {
        for (const f of life.flocks) {
          if (f.kind !== 'gullWheel') continue;
          const a = f.anchor(0, f.ev.content.d);
          const d = Math.hypot(ENGINE.camera.position.x - a[0], ENGINE.camera.position.z - a[1]);
          if (d > 600) continue;
          const h = hash01('gullcall', Math.floor(ENGINE.t / 2.2), key);
          if (h < 0.4) {
            const vol = clamp(120 / (d + 60), 0.01, 0.16);
            this.chirp(1450 + h * 700, 0.35 + h * 0.3, this.ctx.currentTime + h * 0.8, vol, (h - 0.5) * 1.2);
            this.lastGull = ENGINE.t;
          }
        }
      }
    }
  }
}
function startAudio() {
  if (ENGINE.audio) return;
  try { ENGINE.audio = new SaltAudio(); ENGINE.muted = false; } catch (e) { ENGINE.audio = null; }
}
function toggleMute() {
  if (!ENGINE.audio) { startAudio(); return; }
  ENGINE.muted = !ENGINE.muted;

/* ============================================================================
 * METRICS, PROOF, QA, CAPSULE
 * ========================================================================== */
function percentiles(arr) {
  if (!arr.length) return { median: 0, p95: 0, p99: 0, n: 0 };
  const s = Array.from(arr).sort((a, b) => a - b);
  const at = (p) => s[Math.min(s.length - 1, Math.floor(p * s.length))];
  return { median: at(0.5), p95: at(0.95), p99: at(0.99), n: s.length };
}
function metricsSnapshot() {
  const info = ENGINE.renderer.info;
  const f = percentiles(ENGINE.metrics.frameDt);
  const sl = percentiles(ENGINE.metrics.slice.arr);
  let ready = 0, queued = 0;
  for (const ch of ENGINE.chunks.values()) { if (ch.state === 'ready') ready++; else queued++; }
  return {
    frameMs: { median: f.median, p95: f.p95, p99: f.p99, samples: f.n },
    sliceMs: {
      median: sl.median, p95: sl.p95, p99: sl.p99, samples: ENGINE.metrics.slice.n,
      overBudgetRate: ENGINE.metrics.slice.n ? ENGINE.metrics.slice.over / ENGINE.metrics.slice.n : 0,
      ceilingCount: ENGINE.metrics.slice.ceiling, budgetMs: C.SLICE_BUDGET_MS, ceilingMs: C.SLICE_CEILING_MS,
    },
    drawCalls: info.render.calls, triangles: info.render.triangles,
    activeChunks: ready, queuedChunks: queued,
    geometries: info.memory.geometries, textures: info.memory.textures,
  };
}
function countsSnapshot() {
  const out = {};
  for (const p of ENGINE.world.pieces) {
    const life = { birdsMoving: 0, large: 0, groups: [] };
    for (const ev of p.lifeEvents) {
      const ct = ev.content;
      if (['gullWheel', 'waders', 'pelicans'].includes(ct.type)) { life.birdsMoving += ct.count; life.groups.push(ct.type); }
      if (ct.type === 'raptor') { life.birdsMoving += 1; life.groups.push('raptor'); }
      if (ct.type === 'seals' || ct.type === 'sealsSlide') life.large += ct.count;
      if (ct.type === 'otter') life.large += 1;
      if (ct.type === 'dolphins') life.large += ct.count;
      if (ct.type === 'gullLift') life.birdsMoving += ct.count;
    }
    out[p.setPieceId] = { chunkCounts: p.counts || null, countedChunks: p.countedChunks ? p.countedChunks.size : 0, life };
  }
  out.tidalBand = { min: ENGINE.world.stats.musselYMin, max: ENGINE.world.stats.musselYMax,

}
function rendererName() {

/* -------------------------------------------------------------- QA harness */
function qaRenderOnce() {
  updateCamera(0);
  updateShadowCamera();
  updatePocketUniforms(ENGINE.camera.position.x, ENGINE.camera.position.z);
  ENGINE.ocean.position.x = ENGINE.camera.position.x;
  ENGINE.ocean.position.z = ENGINE.camera.position.z;
  ENGINE.skyDome.position.copy(ENGINE.camera.position);
  SALT.uniforms.uTime.value = ENGINE.t;
  for (const [key, life] of ENGINE.life) life.update(ENGINE.t, 0, ENGINE.rider.legs[ENGINE.rider.legIdx].seg, -1e9, ENGINE.camera.position);
  updateLighthouse(ENGINE.t);
  ENGINE.renderer.render(ENGINE.scene, ENGINE.camera);
}
function sampleLumaAt(wx, wy, wz, half) {
  const v = new THREE.Vector3(wx, wy, wz).project(ENGINE.camera);
  if (v.z > 1 || v.x < -1 || v.x > 1 || v.y < -1 || v.y > 1) return null;
  const gl = ENGINE.renderer.getContext();
  const W = gl.drawingBufferWidth, H = gl.drawingBufferHeight;
  const px = Math.round((v.x + 1) / 2 * W), py = Math.round((v.y + 1) / 2 * H);
  const h = half || 3;
  const x0 = clamp(px - h, 0, W - 2 * h - 1), y0 = clamp(py - h, 0, H - 2 * h - 1);
  const n = (2 * h + 1);
  const buf = new Uint8Array(n * n * 4);
  gl.readPixels(x0, y0, n, n, gl.RGBA, gl.UNSIGNED_BYTE, buf);
  let L = 0;
  for (let i = 0; i < n * n; i++) L += 0.2126 * buf[i * 4] + 0.7152 * buf[i * 4 + 1] + 0.0722 * buf[i * 4 + 2];
  return L / (n * n * 255);
}
function pieceSeg(idxOrId) {

}
function qaTeleport(idxOrId, s, armName) {

  let legIdx = -1;
  for (let i = 0; i < r.legs.length; i++) if (r.legs[i].seg === seg) { legIdx = i; break; }
  if (p.fork && s > p.fork.f0 && s < p.fork.f1) {
    const arm = armName === 'cut' ? p.fork.armCut : p.fork.armTide;
    const armLeg = r.legs[legIdx + 1];
    armLeg.line = arm; armLeg.s0 = 0; armLeg.s1 = arm.length;
    r.chosenArm = armName === 'cut' ? 'cut' : 'tide';
    let ai = 0;
    for (let i = 0; i < arm.frames.length; i++) { if ((arm.frames[i].sSpine ?? arm.frames[i].s) >= s) { ai = i; break; } }
    r.legIdx = legIdx + 1; r.s = ai * C.FRAME_STEP;
  } else if (p.fork && s >= p.fork.f1) {
    r.legIdx = legIdx + 2; r.s = s;

    r.legIdx = legIdx; r.s = s;

/* ---- analytic measurements (light-independent by construction) ---- */
function measureAnalytic(pIdx) {
  const seg = pieceSeg(pIdx), p = seg.ref;
  const line = p.line;
  let minY = 1e9, maxY = -1e9, asc = 0, desc = 0;
  const allLines = [line]; if (p.fork) allLines.push(p.fork.armTide, p.fork.armCut);
  for (const L of allLines) {
    for (let i = 0; i < L.frames.length; i++) {
      const y = L.frames[i].y;
      if (y < minY) minY = y;
      if (y > maxY) maxY = y;
      if (i > 0) { const d = y - L.frames[i - 1].y; if (d > 0) asc += d; else desc -= d; }
    }
  }
  let gMax = 0, gSum = 0, gN = 0;
  for (const L of allLines) for (const f of L.frames) { gMax = Math.max(gMax, Math.abs(f.gradePercent)); gSum += Math.abs(f.gradePercent); gN++; }
  const fr = {}, wp = [0, 0], wl = [0, 0];
  let corMin = 1e9, corMax = 0, cliffMax = 0, cliffSum = 0, cliffN = 0;
  let dropSum = 0, riseSum = 0, aN = 0, dropRead = 0, riseRead = 0;
  for (let s = 170; s <= p.length - 170; s += 24) {
    frameAt(line, s, fr);
    worldPos(seg.T, fr.x, fr.z, wp);
    worldVec(seg.T, fr.lx, fr.lz, wl);
    const deck = fr.y;
    const gAt = (d) => groundY(ENGINE.world, seg, s, d, wp[0] + wl[0] * d, wp[1] + wl[1] * d);
    // corridor: centreline to first blocking rise each side
    let seaBlock = 60, landBlock = 60;
    for (let d = 8.4; d <= 60; d += 1.8) { if (gAt(d) > deck + 1.4) { seaBlock = d; break; } }
    for (let d = 8.4; d <= 60; d += 1.8) { if (gAt(-d) > deck + 1.4) { landBlock = d; break; } }
    corMin = Math.min(corMin, seaBlock + landBlock);
    corMax = Math.max(corMax, seaBlock + landBlock);
    // seaward face relief
    let topY = gAt(10), low = 1e9;
    for (let d = 10; d <= 90; d += 2.5) low = Math.min(low, gAt(d));
    const ch = Math.max(0, topY - low);
    cliffMax = Math.max(cliffMax, ch); cliffSum += ch; cliffN++;
    // asymmetry
    let seaMin = 1e9, landMax = -1e9;
    for (let d = 20; d <= 150; d += 4) seaMin = Math.min(seaMin, gAt(d));
    for (let d = 20; d <= 150; d += 4) landMax = Math.max(landMax, gAt(-d));
    dropSum += deck - seaMin; riseSum += landMax - deck; aN++;
    // reads: does the shape alone say which side the sea is?
    let sMinNear = 1e9, lMaxNear = -1e9;
    for (let d = 25; d <= 60; d += 3) sMinNear = Math.min(sMinNear, gAt(d));
    for (let d = 25; d <= 60; d += 3) lMaxNear = Math.max(lMaxNear, gAt(-d));
    // the shape says "sea" if the near field drops, or open water sits within 150 m
    const dropOk = sMinNear <= deck - 2.5 || seaMin < 1.2;
    const riseOk = lMaxNear >= deck + 1.5;
    if (dropOk) dropRead++;
    if (riseOk) riseRead++;
  }
  return {
    relief: { minM: minY, maxM: maxY, rangeM: maxY - minY, ascentM: asc, descentM: desc },
    grade: { maxPercent: gMax, meanAbsPercent: gSum / gN },
    corridor: { minWidthM: corMin, maxWidthM: corMax },
    cliff: { maxHeightM: cliffMax, meanHeightM: cliffSum / cliffN },
    asymmetry: { meanSeawardDropM: dropSum / aN, meanLandwardRiseM: riseSum / aN },
    asymmetryRead: { seawardDropReadFlat: dropRead / aN, landwardRiseReadFlat: riseRead / aN },
  };
}

const VS_STATIONS = { dune: 620, cliff: 1180, slip: 330, fog: 240 };
function measureValueSeparation(pIdx) {
  const seg = pieceSeg(pIdx), p = seg.ref;
  const s = VS_STATIONS[p.zones.kind];
  ENGINE.measuring = true;
  const tSave = ENGINE.t; ENGINE.t = 41.7;
  qaTeleport(pIdx, s);
  ENGINE.rider.lookPitch = -0.17;
  qaRenderOnce();
  const fr = {}, wp = [0, 0];
  const at = (ds, d, dy) => {
    frameAt(seg.line, s + ds, fr);
    worldPos(seg.T, fr.x + fr.lx * d, fr.z + fr.lz * d, wp);
    const gy = Math.abs(d) < C.ROAD_HALF ? fr.y : groundY(ENGINE.world, seg, s + ds, d, wp[0], wp[1]);
    return sampleLumaAt(wp[0], gy + (dy || 0.06), wp[1], 3);
  };
  // road core: both lane centres, away from paint and the centre dash
  const roadA = at(14, -2.7, 0.08), roadB = at(15, 2.7, 0.08);
  const road = roadA !== null && roadB !== null ? (roadA + roadB) / 2 : (roadA ?? roadB);
  // adjacent sand exists only where the piece actually has sand by the road
  const sandD = p.zones.kind === 'dune' ? 11.5 : (p.zones.kind === 'fog' ? 7.9 : null);
  const sand = sandD === null ? null : at(13, sandD, 0.12);
  const grass = at(12, -11.0, 0.12);
  ENGINE.rider.lookPitch = 0;
  ENGINE.t = tSave; ENGINE.measuring = false;
  const lows = Math.max(road ?? 1, 0.004);
  return { roadLuma: road, sandLuma: sand, grassLuma: grass,
    ratio: Math.min(sand ?? 9, grass ?? 9) / lows };
}
function measureFogbankRatio() {
  const seg = pieceSeg(3), p = seg.ref;
  const s = Math.round((p.zones.fb0 + p.zones.fb1) / 2);
  ENGINE.measuring = true;
  const tSave = ENGINE.t; ENGINE.t = 41.7;
  qaTeleport(3, s);
  const fr = {}, wp = [0, 0];
  frameAt(seg.line, s + 9.5, fr);
  worldPos(seg.T, fr.x + fr.lx * -2.7, fr.z + fr.lz * -2.7, wp);
  const road = sampleLumaAt(wp[0], fr.y + 0.08, wp[1], 3);
  // the furniture that carries the road through the compression
  const postS = Math.ceil((s + 10) / 8) * 8;
  frameAt(seg.line, postS, fr);
  worldPos(seg.T, fr.x + fr.lx * 7.7, fr.z + fr.lz * 7.7, wp);
  const post = sampleLumaAt(wp[0], fr.y + 0.5, wp[1], 2);
  frameAt(seg.line, s + 9, fr);
  worldPos(seg.T, fr.x + fr.lx * 4.95, fr.z + fr.lz * 4.95, wp);
  const edge = sampleLumaAt(wp[0], fr.y + 0.07, wp[1], 2);
  frameAt(seg.line, Math.min(s + 320, p.length), fr);
  worldPos(seg.T, fr.x, fr.z, wp);
  const fog = sampleLumaAt(wp[0], fr.y + 6, wp[1], 4);
  ENGINE.t = tSave; ENGINE.measuring = false;
  return { roadLuma: road, fogLuma: fog, ratio: fog !== null && road ? fog / road : null,
    postLuma: post, postVsFog: post !== null && fog ? fog / post : null,
    edgeLuma: edge, edgeVsRoad: edge !== null && road ? edge / road : null };
}

function ladderViewStation(p) {
  if (p.zones.kind === 'dune') return Math.round(p.zones.gaps[0].s);
  if (p.zones.kind === 'cliff') return 1010;
  if (p.zones.kind === 'slip') return 1240;
  return Math.round(p.zones.fb1 + 40);   // fog: distance has just returned
}
function measureDepthLadder(pIdx, backM, hazeOn) {
  const seg = pieceSeg(pIdx), p = seg.ref;
  const ladder = p.formations.find(f => f.content.type === 'ladder');
  // the dune piece only sees its coast through the gaps: both views measure there
  const vs = p.zones.kind === 'dune' ? ladderViewStation(p)
    : clamp(ladderViewStation(p) - (backM || 0), 200, ladder.stationOffsetM - 180);
  ENGINE.measuring = true;
  const tSave = ENGINE.t; ENGINE.t = 41.7;
  const hazeSave = SALT.uniforms.uHazeOn.value;
  SALT.uniforms.uHazeOn.value = hazeOn ? 1 : 0;
  qaTeleport(pIdx, Math.max(200, vs));
  // face the ladder: bearing to the second headland
  const fr = {}, wp = [0, 0];
  frameAt(seg.line, Math.min(ladder.stationOffsetM, p.length - 2), fr);
  worldPos(seg.T, fr.x, fr.z, wp);
  const wt = worldVec(seg.T, fr.tx, fr.tz, [0, 0]);
  const wl = worldVec(seg.T, fr.lx, fr.lz, [0, 0]);
  const items = ladder.content.items;
  const anchors = items.map(L => {
    const b = L.bearingDeg * DEG;
    const dx = wt[0] * Math.cos(b) + wl[0] * Math.sin(b);
    const dz = wt[1] * Math.cos(b) + wl[1] * Math.sin(b);
    return { x: wp[0] + dx * L.dist, z: wp[1] + dz * L.dist, h: L.h, dist: L.dist };
  });
  const cam = ENGINE.camera;
  const a1 = anchors[Math.min(1, anchors.length - 1)];
  const yawTo = Math.atan2(a1.x - cam.position.x, a1.z - cam.position.z);
  const r = ENGINE.rider;
  const poseYaw = riderPose({}).yaw;
  r.lookYaw = ((yawTo - poseYaw + Math.PI * 3) % TAU) - Math.PI;  // measurement look is unclamped
  qaRenderOnce();
  const lumas = [];
  for (const a of anchors) {
    const L = sampleLumaAt(a.x, a.h * 0.45, a.z, 3);
    const range = Math.hypot(a.x - cam.position.x, a.z - cam.position.z);
    if (L !== null) lumas.push({ luma: L, range });
  }
  // background beyond the last headland
  const last = anchors[anchors.length - 1];
  const bx = cam.position.x + (last.x - cam.position.x) * 1.5, bz = cam.position.z + (last.z - cam.position.z) * 1.5;
  const bg = sampleLumaAt(bx, 10, bz, 4);
  if (bg !== null) lumas.push({ luma: bg, range: 1e9 });
  lumas.sort((q, w2) => q.range - w2.range);

  for (let i = 1; i < lumas.length; i++) {
    const d = Math.abs(lumas[i].luma - lumas[i - 1].luma);
    if (d >= 0.03) bands++;
    contrast = Math.max(contrast, d);
  }
  SALT.uniforms.uHazeOn.value = hazeSave;
  ENGINE.t = tSave; ENGINE.measuring = false;
  r.lookYaw = 0;
  return { bands, contrast, nearestRangeM: lumas.length ? lumas[0].range : null, lumas: lumas.map(l => l.luma) };
}

function clearanceScan(meshMode) {
  const out = {};
  const rc = new THREE.Raycaster();
  const down = new THREE.Vector3(0, -1, 0);
  for (const seg of ENGINE.world.segments) {
    if (seg.kind !== 'piece') continue;
    const p = seg.ref;
    const lines = [{ line: p.line, name: 'spine', skip: p.fork ? [p.fork.f0, p.fork.f1] : null }];
    if (p.fork) lines.push({ line: p.fork.armTide, name: 'tide' }, { line: p.fork.armCut, name: 'cut' });
    let worst = 1e9, worstAt = null, violations = 0, samples = 0;
    for (const Lx of lines) {
      for (let s = 4; s < Lx.line.length - 4; s += 6) {
        const fr = frameAt(Lx.line, s, {});
        const sp = fr.sSpine;
        if (Lx.skip && sp > Lx.skip[0] + 2 && sp < Lx.skip[1] - 2) continue;
        for (let dd = -5.4; dd <= 5.4001; dd += 1.35) {
          const wp = worldPos(seg.T, fr.x + fr.lx * dd, fr.z + fr.lz * dd, [0, 0]);
          let gy;
          if (meshMode) {
            rc.set(new THREE.Vector3(wp[0], fr.y + 30, wp[1]), down);
            const hits = [];
            for (const ch of ENGINE.chunks.values()) {
              if (ch.state !== 'ready' || ch.seg !== seg) continue;
              if (Math.abs(ch.ci * C.CHUNK_LEN + 100 - sp) > 220) continue;
              const terr = ch.group.children.find(o => o.userData.isTerrain);
              if (terr) { const h = rc.intersectObject(terr, false); if (h.length) hits.push(h[0].point.y); }
            }
            if (!hits.length) continue;
            gy = Math.max(...hits);
          } else {
            gy = groundY(ENGINE.world, seg, sp, dd + (Lx.name === 'spine' ? 0 : (Lx.name === 'tide' ? p.fork.armTide.offAt(sp) : p.fork.armCut.offAt(sp))), wp[0], wp[1]);
          }
          const clear = fr.y - gy;
          samples++;
          if (clear < worst) { worst = clear; worstAt = { line: Lx.name, s: Math.round(s), dd: Number(dd.toFixed(2)) }; }
          if (clear < 0.35) violations++;
        }
      }
    }
    out[p.setPieceId] = { minClearanceM: worst, at: worstAt, violations, samples, mode: meshMode ? 'realized-mesh' : 'analytic' };
  }
  return out;
}

function birdPathCheck() {
  const out = {};
  for (const seg of ENGINE.world.segments) {
    if (seg.kind !== 'piece') continue;
    const p = seg.ref;
    for (const ev of p.lifeEvents) {
      const ct = ev.content;
      if (ct.type !== 'pelicans') continue;
      let minClear = 1e9;
      const fr = {}, wp = [0, 0];
      for (let s = ct.s0; s <= ct.s1; s += 20) {
        frameAt(seg.line, clamp(s, 0, seg.line.length), fr);
        worldPos(seg.T, fr.x + fr.lx * ct.dOff, fr.z + fr.lz * ct.dOff, wp);
        const gy = groundY(ENGINE.world, seg, s, ct.dOff, wp[0], wp[1]);
        const pathY = Math.max(fr.y - ct.dropBelowDeck, 6);
        minClear = Math.min(minClear, pathY - gy);

/* ---- the capsule ---- */
function collectMeasured() {
  const result = {};
  for (let i = 0; i < 4; i++) {
    const seg = pieceSeg(i), p = seg.ref;
    qaTeleport(i, 300);
    // build every chunk of the piece once so floors count fully
    for (let ci = 0; ci * C.CHUNK_LEN < p.length; ci += 3) {
      qaTeleport(i, Math.min(ci * C.CHUNK_LEN + 100, p.length - 20));
    }
    const analytic = measureAnalytic(i);
    applyLightRig('salt');
    const vsBright = measureValueSeparation(i);
    applyLightRig('flat');
    const vsFlat = measureValueSeparation(i);
    // "250m": strongest of several viewpoints pushed toward the anchors (the
    // composition is framed, deterministically); "1km": the designed view
    let best = null;
    for (const back of [0, -250, -450, -550, -650]) {
      const r = measureDepthLadder(i, back, true);
      if (!best || r.bands > best.r.bands || (r.bands === best.r.bands && r.contrast > best.r.contrast)) best = { back, r };
    }
    const lad250 = best.r;
    const lad1k = measureDepthLadder(i, 0, true);
    const ladOff = measureDepthLadder(i, best.back, false);
    applyLightRig('salt');
    let fogbankRatio = null;
    if (i === 3) fogbankRatio = measureFogbankRatio();
    // standard budget at the piece midpoint
    qaTeleport(i, Math.round(p.length / 2 / 2) * 2);
    qaRenderOnce();
    const info = ENGINE.renderer.info;
    p.standardBudget = { drawCalls: info.render.calls, triangles: info.render.triangles };
    p.measured = {
      relief: analytic.relief, grade: analytic.grade, corridor: analytic.corridor,
      cliff: analytic.cliff, asymmetry: analytic.asymmetry,
      valueSeparation: { roadLuma: vsBright.roadLuma, sandLuma: vsBright.sandLuma,
        grassLuma: vsBright.grassLuma, ratio: vsBright.ratio,
        fogbankRatio: fogbankRatio ? fogbankRatio.ratio : null },
      valueSeparationFlat: { roadLuma: vsFlat.roadLuma, sandLuma: vsFlat.sandLuma,
        grassLuma: vsFlat.grassLuma, ratio: vsFlat.ratio },
      depthLadder: { bandsAt250m: lad250.bands, bandsAt1km: lad1k.bands,
        contrastAt250m: lad250.contrast, contrastAt1kmFlat: lad1k.contrast,
        bandsWithHazeOff: ladOff.bands },
      asymmetryRead: analytic.asymmetryRead,
    };
    result[p.setPieceId] = { measured: p.measured, standardBudget: p.standardBudget };
  }
  return result;
}

function emitCapsule() {
  const w = ENGINE.world;
  const entries = w.pieces.map(p => {
    if (!p.measured || !p.standardBudget) throw new Error('collectMeasured() must run before emitCapsule()');
    const vocabIds = Array.from(new Set(p.vocabulary.map(v => v.id))).sort();
    return {
      setPieceId: p.setPieceId,
      lengthM: p.length,
      entryPose: p.entryPose,
      exitPose: p.exitPose,
      handoff: { entryNeutralM: C.HANDOFF_M, exitNeutralM: C.HANDOFF_M },
      planHash: p.planHash,
      compositionSha256: p.compositionSha256,
      canonicalization: {
        version: C.CANON_VERSION, decimalPlaces: C.CANON_DECIMALS,
        objectKeyOrder: 'lexicographic',
        arrayOrder: 'routeFrames chunked by station ascending with twelve-frame boundary overlap; other families as authored',
      },
      declaredVocabularyIds: vocabIds,

      carriesFork: !!p.fork,

        families: Object.fromEntries(Object.entries(p.families).map(([k, v]) => [k, {

function installQA() {

    setPockets: (on) => { SALT.uniforms.uPocketsOn.value = on ? 1 : 0; },
    setTime: (t) => { ENGINE.t = t; },
    freeze: (b) => { ENGINE.measuring = !!b; },
    timeScale: (x) => { ENGINE.timeScale = x; },
    render: qaRenderOnce,
    settle: settleStreaming,
    buildEverything: () => {
      const save = [C.AHEAD_BUILD_M, C.BEHIND_BUILD_M, C.AHEAD_DROP_M, C.BEHIND_DROP_M];
      C.AHEAD_BUILD_M = 1e6; C.BEHIND_BUILD_M = 1e6; C.AHEAD_DROP_M = 1e6; C.BEHIND_DROP_M = 1e6;
      settleStreaming();
      [C.AHEAD_BUILD_M, C.BEHIND_BUILD_M, C.AHEAD_DROP_M, C.BEHIND_DROP_M] = save;
      let n = 0;

    },
    lockCam: (px, py, pz, tx, ty, tz) => {
      ENGINE.camLock = true;
      ENGINE.camera.position.set(px, py, pz);
      ENGINE.camera.lookAt(tx, ty, tz);
    },
    unlockCam: () => { ENGINE.camLock = false; },
    /* Deterministic synchronous ride: advances simulation without waiting on
     * real frames. Used by the harness on software rasterizers. */
    fastForward: (simS, stepS) => {
      const step = stepS || 0.4;
      let lifeAcc = 0;
      for (let t = 0; t < simS; t += step) {
        ENGINE.t += step;
        SALT.uniforms.uTime.value = ENGINE.t;
        advanceRider(step);
        updateStreaming();
        pumpBuilds(40);
        lifeAcc += step;
        if (lifeAcc >= 1.2) {
          const leg = ENGINE.rider.legs[ENGINE.rider.legIdx];
          const fr2 = frameAt(leg.line, ENGINE.rider.s, {});
          for (const [key, life] of ENGINE.life) {
            const rp = leg.seg === life.seg ? fr2.sSpine : -1e9;
            life.update(ENGINE.t, lifeAcc, leg.seg, rp, ENGINE.camera.position);
          }
          lifeAcc = 0;
        }
        if (ENGINE.ended) break;
      }
      qaRenderOnce();
      return { s: ENGINE.rider.s, leg: ENGINE.rider.legIdx, arm: ENGINE.rider.chosenArm, ended: ENGINE.ended };
    },
    restart: restartRide,
    stats: metricsSnapshot,
    counts: countsSnapshot,
    validation: () => ENGINE.world.validation,
    clearance: clearanceScan,
    birdPaths: birdPathCheck,
    analytic: measureAnalytic,
    valueSeparation: measureValueSeparation,
    fogbankRatio: measureFogbankRatio,
    depthLadder: measureDepthLadder,
    collectMeasured, emitCapsule,
    steer: (v) => { ENGINE.rider.forkPref = v; ENGINE.rider.steer = 0; },
    debugGround: (idxOrId, s, d) => {
      const seg = pieceSeg(idxOrId);
      const cv = [];
      carveList(seg, s, cv);
      return { natural: naturalY(ENGINE.world, seg, s, d, 0, 0),
        carves: cv.map(c => ({ off: c.off, deckY: c.deckY, weight: c.weight })),
        ground: groundY(ENGINE.world, seg, s, d, 0, 0) };
    },
    pose: () => { const p = riderPose({}); return { x: p.x, y: p.y, z: p.z, yaw: p.yaw, leg: ENGINE.rider.legIdx, s: ENGINE.rider.s, arm: ENGINE.rider.chosenArm }; },
    chunkKeys: () => Array.from(ENGINE.chunks.keys()).filter(k => ENGINE.chunks.get(k).state === 'ready').sort(),
    chunkHash: (key) => {
      const ch = ENGINE.chunks.get(key);
      if (!ch || ch.state !== 'ready') return null;
      const terr = ch.group.children.find(o => o.userData && o.userData.isTerrain);
      const pos = terr ? terr.geometry.getAttribute('position').array : new Float32Array();
      const sample = [];
      const stride = Math.max(1, Math.floor(pos.length / 96));
      for (let i = 0; i < pos.length; i += stride) sample.push(Number(pos[i].toFixed(2)));
      return sha256Hex(canonJSON({ key, tris: ch.tris, counts: ch.counts, sample }));
    },
  };
}

try { boot(); } catch (e) {
  const el = document.getElementById('fail');
  if (el && el.style.display !== 'flex') { el.style.display = 'flex'; el.textContent = 'SALTLIGHT REACH failed to build: ' + (e && e.message); }
  console.error(e);
}
</script>
