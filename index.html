<script type="module">
import * as THREE from 'three';

/* ============================================================
   SUNSCAR PASSAGE III — the country that drinks in secret
   A seeded 4:47 PM ride through the Great Shear, weeks after
   the last desert rain. The water is gone; everything still
   arranges itself around where it travelled.
   default seed 7319 · ?seed=<uint32> · ?quality=low|standard|high
   ============================================================ */

// ---------- error capture (feeds the proof surface) ----------
const capturedErrors=[];
window.addEventListener('error',(e)=>{ capturedErrors.push('error: '+(e.message||'?')); });
window.addEventListener('unhandledrejection',(e)=>{ capturedErrors.push('rejection: '+((e.reason&&e.reason.message)||e.reason||'?')); });

// ---------- seed: one normalized uint32 root, named streams ----------
const qs=new URLSearchParams(location.search);
const QA=qs.get('qa')==='1';
const SEED=(()=>{ const raw=qs.get('seed');
  if(raw!==null&&/^\d+$/.test(raw)){ const v=Number(raw); if(v<=0xFFFFFFFF) return v>>>0; }
  return 7319; })();
const QUALITY_REQ=(()=>{ const q=qs.get('quality');
  return (q==='low'||q==='high'||q==='standard')?q:'standard'; })();
const QUALITY=QUALITY_REQ;   // resolved == requested; plan identity never depends on it
function xmur3(str){ let h=1779033703^str.length;
  for(let i=0;i<str.length;i++){ h=Math.imul(h^str.charCodeAt(i),3432918353); h=h<<13|h>>>19; }
  return function(){ h=Math.imul(h^(h>>>16),2246822507); h=Math.imul(h^(h>>>13),3266489909); return (h^=h>>>16)>>>0; }; }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const streamRegistry={};
function makeStream(name){
  const id=xmur3('sunscar3:'+name+':'+SEED)();
  if(streamRegistry[name]===undefined) streamRegistry[name]=(id>>>0).toString(16).padStart(8,'0');
  const f=mulberry32(id);
  const s={ f, r:(a,b)=>a+(b-a)*f(), i:(a,b)=>Math.floor(a+(b-a+1)*f()),
    pick:(arr)=>arr[Math.floor(f()*arr.length)], chance:(p)=>f()<p };
  const tab=new Float32Array(256); for(let i=0;i<256;i++) tab[i]=f();
  s.n1=(x)=>{ const i=Math.floor(x), u=(x-i)*(x-i)*(3-2*(x-i));
    const a=tab[((i%256)+256)%256], b=tab[(((i+1)%256)+256)%256]; return a+(b-a)*u; };
  s.fbm=(x)=>s.n1(x)*0.6+s.n1(x*2.17+7.3)*0.27+s.n1(x*4.9+19.1)*0.13;
  return s;
}
// world-plan streams — consumed completely during planning, never in the render loop
const ROUTE=makeStream('route');
const GEO=makeStream('geology');
const TERR=makeStream('terrain');
const VEG=makeStream('vegetation');
const CACT=makeStream('cactus');
const PLACE=makeStream('built-places');
const ATMO=makeStream('atmosphere');
const LIFE=makeStream('ambient-life');
const SND=makeStream('sound-events');
// presentation-only stream — free to differ per quality tier, never feeds a hash
const PRES=makeStream('presentation');
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
const TAU=Math.PI*2;

// ---------- FNV-1a hashing over quantized plan data ----------
function fnvInit(){ return 0x811c9dc5; }
function fnvAdd(h,v){ v=Math.round(v*50)|0;
  h^=v&0xff; h=Math.imul(h,0x01000193); h^=(v>>>8)&0xff; h=Math.imul(h,0x01000193); return h; }
function fnvStr(h,s){ for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,0x01000193); } return h; }
const hex8=(h)=>(h>>>0).toString(16).padStart(8,'0');

// ---------- palette: nine anchors, zero default grey ----------
const PAL={
  cream:0xFFEFC9,   // sunlit cream — high faces, sky floor
  gold:0xF2B45C,    // late gold — the working light
  sandstone:0xD98B57,
  rust:0xA84A2C,
  rose:0xC97E70,    // dusty rose — warm shadow, haze
  wine:0x5E2E3D,    // dark wine — deep shadow, road stones
  aubergine:0x2C1E38, // zenith and deepest occlusion only
  sage:0x71835F,    // muted mineral green — the flora register
  cyan:0xA6BBB4,    // dusty cyan — distance, sky, cool flora accent
};
const col=h=>new THREE.Color(h);
function mixc(a,b,t){ return col(a).lerp(col(b),t); }

// ---------- renderer ----------
let renderer;
try{ renderer=new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' }); }
catch(e){ document.getElementById('fatal').style.display='flex'; throw e; }
if(!renderer.capabilities.isWebGL2){ document.getElementById('fatal').style.display='flex'; throw new Error('WebGL2 required'); }
document.body.appendChild(renderer.domElement);
const DPR=Math.min(window.devicePixelRatio||1, QUALITY==='low'?1.0:(QUALITY==='high'?1.6:1.25));
renderer.setPixelRatio(DPR);
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.NoToneMapping;   // flat graphic bands; the palette is the grade
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFShadowMap;
let contextLost=false;
renderer.domElement.addEventListener('webglcontextlost',(e)=>{ contextLost=true; capturedErrors.push('webgl context lost'); e.preventDefault(); });

const scene=new THREE.Scene();
const FOG_C=mixc(PAL.rose,PAL.cyan,0.42).lerp(col(PAL.gold),0.10);
scene.background=FOG_C.clone();
scene.fog=new THREE.Fog(FOG_C.clone(), 240, 3400);
const camera=new THREE.PerspectiveCamera(66, window.innerWidth/window.innerHeight, 0.1, 9000);

// one governing low sun — 4:47 PM, still above the rim
const SUN_ELEV=0.20;
const sunDir=new THREE.Vector3(0,Math.sin(SUN_ELEV),-Math.cos(SUN_ELEV)); // horizontal part set after the route exists
const sun=new THREE.DirectionalLight(mixc(PAL.gold,PAL.cream,0.4),2.35);
scene.add(sun); scene.add(sun.target);
sun.castShadow=true;
sun.shadow.mapSize.set(QUALITY==='low'?1024:2048,QUALITY==='low'?1024:2048);
sun.shadow.bias=-0.0007;
const hemi=new THREE.HemisphereLight(mixc(PAL.cyan,PAL.rose,0.45),mixc(PAL.wine,PAL.rust,0.42),1.38);
scene.add(hemi);

// four-step toon gradient — lifted floor so shadow never crushes to black
const gradTex=(()=>{ const d=new Uint8Array([74,74,74,255, 128,128,128,255, 208,208,208,255, 255,255,255,255]);
  const t=new THREE.DataTexture(d,4,1,THREE.RGBAFormat); t.needsUpdate=true;
  t.minFilter=THREE.NearestFilter; t.magFilter=THREE.NearestFilter; return t; })();
const rockMat=new THREE.MeshToonMaterial({ vertexColors:true, gradientMap:gradTex });
const rockMatShadow=new THREE.MeshToonMaterial({ vertexColors:true, gradientMap:gradTex });

// ============================================================
// WORLD PLAN · ROUTE — seven-part journey grammar, one real fork
// All plan streams are consumed here, in fixed order, before any
// realization. Quality never touches anything in this section.
// ============================================================
const L_TOTAL=ROUTE.r(7650,8350);
const CH_NAMES=[
  ['Kilnlight Terrace','First Ochre Reach','The Warm Approach'],
  ['The Cactus Ward','Relay Gardens','The Drinking Rows'],
  ['Ledger Fork','The Two Answers','Fork of Small Waters'],
  ['Wallshadow Narrows','The Compression','Closewalls'],
  ['The Long Stair','Rimclimb','Aster Grade'],
  ['Sunscar Contact','The Keeping Pool','Shear Passage'],
  ['The Listening Field','Afterglow Reach','The Long Exhale'],
];
const CHAPS=(()=>{
  const spans=[ROUTE.r(0.070,0.090),ROUTE.r(0.112,0.132),ROUTE.r(0.148,0.172),
               ROUTE.r(0.112,0.136),ROUTE.r(0.150,0.178),ROUTE.r(0.128,0.152)];
  const out=[]; let f=0;
  for(let i=0;i<7;i++){
    const f1=i<6? f+spans[i] : 1;
    out.push({ idx:i, name:ROUTE.pick(CH_NAMES[i]), f0:f, f1, s0:f*L_TOTAL, s1:f1*L_TOTAL });
    f=f1;
  }
  return out;
})();
const chapterAt=(s)=>{ const f=clamp(s/L_TOTAL,0,0.9999);
  for(const c of CHAPS) if(f<c.f1) return c; return CHAPS[6]; };
// the fork lives inside chapter 2 (index 2)
const S_FORK=(CHAPS[2].f0+ROUTE.r(0.010,0.020))*L_TOTAL;
const S_JOIN=(CHAPS[3].f0-ROUTE.r(0.012,0.020))*L_TOTAL;
// the Shear passage sits late in chapter 5
const S_GATE=(CHAPS[5].f0+(CHAPS[5].f1-CHAPS[5].f0)*ROUTE.r(0.58,0.70))*L_TOTAL;
// grade targets (percent) — integrated then smoothed into elevation
const G_PLAN={ g0:ROUTE.r(-1.3,-0.5), g1:ROUTE.r(-0.5,0.5), g2:ROUTE.r(-0.4,0.6),
  g3:ROUTE.r(0.9,1.8), g4:ROUTE.r(4.5,5.6), ramp1:ROUTE.r(0.22,0.36), ramp2:ROUTE.r(0.58,0.74),
  rampG:ROUTE.r(7.4,8.2), g5a:ROUTE.r(1.2,2.0), g6:ROUTE.r(-5.2,-4.2) };
function gradeAt(f){
  const c=chapterAt(f*L_TOTAL), t=(f-c.f0)/(c.f1-c.f0);
  switch(c.idx){
    case 0: return G_PLAN.g0;
    case 1: return G_PLAN.g1;
    case 2: return G_PLAN.g2;
    case 3: return G_PLAN.g3;
    case 4:{ let g=G_PLAN.g4;
      if(Math.abs(t-G_PLAN.ramp1)<0.05||Math.abs(t-G_PLAN.ramp2)<0.05) g=G_PLAN.rampG;
      return g; }
    case 5: return lerp(G_PLAN.g5a,-1.2,smooth(0.15,0.8,t));
    default: return lerp(G_PLAN.g6,0,smooth(0.55,1,t));
  }
}
// heading walk — axis-guided (corridor axis -Z), z strictly monotonic,
// so the route can never cross itself; gate window rides straight
const bendLog=[];
const spine=[];
let START_X0=0, START_Z0=0;
{
  let x=ROUTE.r(-30,30), z=0, heading=ROUTE.r(-0.10,0.10), s=0;
  START_X0=x; START_Z0=z;
  const emit=(px,pz,ps)=>{ spine.push({x:px,z:pz,s:ps}); };
  emit(x,z,0);
  let guard=0;
  while(s<L_TOTAL&&guard++<900){
    const f=s/L_TOTAL;
    const gateWin=s>S_GATE-340&&s<S_GATE+280;
    const c=chapterAt(s);
    // straight — long at the opening so the promise reads, long in the gate
    let run= s<150? 150 : gateWin? 80 : ROUTE.r(c.idx===3?38:52, c.idx===3?86:132);
    for(let d=4;d<=run&&s<L_TOTAL;d+=4){ x+=Math.sin(heading)*4; z-=Math.cos(heading)*4; s+=4; emit(x,z,s); }
    if(s>=L_TOTAL) break;
    if(gateWin){ // decay heading gently toward the slot axis (straight-on)
      const corr=clamp(-heading,-0.4,0.4);
      if(Math.abs(corr)>0.02){
        const R=110, ang=Math.abs(corr), dir=Math.sign(corr);
        const steps=Math.max(1,Math.ceil((R*ang)/4));
        for(let k=0;k<steps&&s<L_TOTAL;k++){ heading+=dir*ang/steps; x+=Math.sin(heading)*4; z-=Math.cos(heading)*4; s+=4; emit(x,z,s); }
      }
      continue;
    }
    const inForkWin=s>S_FORK-80&&s<S_JOIN+80;
    const tight=c.idx===3;
    const climb=c.idx===4;
    // the fork span keeps its base axis gentle: a 90 m lateral arm offset
    // cusps against any spine bend tighter than the offset itself
    const R=inForkWin? ROUTE.r(260,420) : tight? ROUTE.r(34,58) : climb? ROUTE.r(60,120) : ROUTE.r(44,110);
    let ang=ROUTE.r(0.26,inForkWin?0.20:(tight?0.88:(climb?0.55:0.62)));
    if(inForkWin&&ang>0.2) ang=0.2;
    let dir=(heading>0?-1:1);
    if(ROUTE.chance(0.34)) dir=-dir;
    if(Math.abs(heading+dir*ang)>0.80) dir=-dir;
    const steps=Math.max(2,Math.ceil((R*ang)/4));
    for(let k=0;k<steps&&s<L_TOTAL;k++){ heading+=dir*ang/steps; x+=Math.sin(heading)*4; z-=Math.cos(heading)*4; s+=4; emit(x,z,s); }
    bendLog.push({s,R,ang,dir});
  }
}
// elevation: integrate chapter grades, then roll the crests
{
  let h=0;
  for(let i=0;i<spine.length;i++){ h+=gradeAt(spine[i].s/L_TOTAL)/100*4; spine[i].y=h; }
  for(let pass=0;pass<4;pass++)
    for(let i=1;i<spine.length-1;i++)
      spine[i].y=(spine[i-1].y+spine[i].y*2+spine[i+1].y)/4;
}
const spinePos=(s)=>{
  const i=clamp(s/4,0,spine.length-1.001), i0=Math.floor(i), t=i-i0;
  const a=spine[i0], b=spine[Math.min(i0+1,spine.length-1)];
  return new THREE.Vector3(lerp(a.x,b.x,t),lerp(a.y,b.y,t),lerp(a.z,b.z,t));
};
const spineLeft=(s)=>{
  const a=spinePos(Math.max(0,s-6)), b=spinePos(Math.min(L_TOTAL,s+6));
  const tx=b.x-a.x, tz=b.z-a.z, l=Math.hypot(tx,tz)||1;
  return new THREE.Vector3(tz/l,0,-tx/l);
};
// ---------- the fork: Coldwash (left) and Sunshelf (right) ----------
// Coldwash drops into a shaded slot of cactus gardens; Sunshelf climbs
// an exposed bright bench. Parity enforced to within 8 percent.
const FORK_NOISE=ROUTE.n1;
let FORK_AMP_L=ROUTE.r(56,74);        // left arm bulges left (positive lateral)
let FORK_AMP_R=-ROUTE.r(66,90);       // right arm bulges right
const FORK_DY_L=-ROUTE.r(2.4,3.8), FORK_DY_R=ROUTE.r(6.0,9.5);
function armPoints(amp,dy){
  // 12 m control spacing through the arm — dense points fight the offsets and kink the spline
  const pts=[]; const i0=Math.round(S_FORK/4), i1=Math.round(S_JOIN/4);
  for(let i=i0;i<=i1;i+=3){
    const t=(i-i0)/(i1-i0);
    const bulge=Math.pow(Math.sin(Math.PI*t),1.35);
    const off=bulge*amp*(0.92+0.16*FORK_NOISE(i*0.05+amp));   // slow meander, no zigzag
    const p=spinePos(spine[i].s).addScaledVector(spineLeft(spine[i].s),off);
    // height splits only after the arms are laterally clear of each other,
    // so terrain conformance near mouth and join is single-valued
    p.y+=dy*smooth(0.08,0.38,t)*smooth(0.92,0.62,t);
    pts.push(p);
  }
  if((i1-i0)%3!==0){ const p=spinePos(spine[i1].s); pts.push(p); }
  return pts;
}
function routeCurve(amp,dy){
  const i0=Math.round(S_FORK/4), i1=Math.round(S_JOIN/4);
  const pts=[];
  for(let i=0;i<i0;i++) pts.push(new THREE.Vector3(spine[i].x,spine[i].y,spine[i].z));
  for(const p of armPoints(amp,dy)) pts.push(p);
  for(let i=i1+1;i<spine.length;i++) pts.push(new THREE.Vector3(spine[i].x,spine[i].y,spine[i].z));
  return new THREE.CatmullRomCurve3(pts,false,'centripetal');
}
function buildFrames(curve){
  const len=curve.getLength(), N=Math.ceil(len), step=len/N;
  const p=curve.getSpacedPoints(N);
  const F={x:new Float32Array(N+1),y:new Float32Array(N+1),z:new Float32Array(N+1),
    tx:new Float32Array(N+1),tz:new Float32Array(N+1),lx:new Float32Array(N+1),lz:new Float32Array(N+1),
    k:new Float32Array(N+1),len,step,N};
  const yaw=new Float32Array(N+1);
  for(let i=0;i<=N;i++){ F.x[i]=p[i].x; F.y[i]=p[i].y; F.z[i]=p[i].z; }
  for(let i=0;i<=N;i++){
    const a=Math.max(0,i-1), b=Math.min(N,i+1);
    let tx=F.x[b]-F.x[a], tz=F.z[b]-F.z[a]; const l=Math.hypot(tx,tz)||1; tx/=l; tz/=l;
    F.tx[i]=tx; F.tz[i]=tz; F.lx[i]=tz; F.lz[i]=-tx; yaw[i]=Math.atan2(tx,-tz);
  }
  const wrap=(a)=>{ while(a>Math.PI)a-=2*Math.PI; while(a<-Math.PI)a+=2*Math.PI; return a; };
  const kR=new Float32Array(N+1);
  for(let i=1;i<N;i++) kR[i]=wrap(yaw[i+1]-yaw[i-1])/(2*step);
  for(let i=0;i<=N;i++){ let sm=0,n=0;
    for(let j=Math.max(0,i-9);j<=Math.min(N,i+9);j++){ sm+=kR[j]; n++; } F.k[i]=sm/n; }
  return F;
}
function nearestS(F,p){ let best=1e9,bs=0;
  for(let i=0;i<=F.N;i+=3){ const d=(F.x[i]-p.x)**2+(F.z[i]-p.z)**2; if(d<best){best=d;bs=i*F.step;} }
  return bs; }
// deterministic parity loop — no stream draws inside
let FRAMES, S_FORK_L, S_JOIN_L, S_FORK_R, S_JOIN_R, armLenL, armLenR;
{
  const forkP0=spinePos(S_FORK), joinP0=spinePos(S_JOIN);
  for(let iter=0;iter<7;iter++){
    const curveL=routeCurve(FORK_AMP_L,FORK_DY_L);
    const curveR=routeCurve(FORK_AMP_R,FORK_DY_R);
    FRAMES={ left:buildFrames(curveL), right:buildFrames(curveR) };
    S_FORK_L=nearestS(FRAMES.left,forkP0); S_JOIN_L=nearestS(FRAMES.left,joinP0);
    S_FORK_R=nearestS(FRAMES.right,forkP0); S_JOIN_R=nearestS(FRAMES.right,joinP0);
    armLenL=S_JOIN_L-S_FORK_L; armLenR=S_JOIN_R-S_FORK_R;
    const par=Math.abs(armLenL-armLenR)/Math.max(armLenL,armLenR);
    if(par<=0.07) break;
    if(armLenL>armLenR) FORK_AMP_L*=0.90; else FORK_AMP_R*=0.90;
  }
}
const _fr={};
function getFrame(F,s){
  s=clamp(s,0,F.len-0.001);
  const f=s/F.step, i=Math.min(F.N-1,Math.floor(f)), t=f-i;
  _fr.x=F.x[i]+(F.x[i+1]-F.x[i])*t; _fr.y=F.y[i]+(F.y[i+1]-F.y[i])*t; _fr.z=F.z[i]+(F.z[i+1]-F.z[i])*t;
  _fr.tx=F.tx[i]+(F.tx[i+1]-F.tx[i])*t; _fr.tz=F.tz[i]+(F.tz[i+1]-F.tz[i])*t;
  _fr.lx=F.lx[i]+(F.lx[i+1]-F.lx[i])*t; _fr.lz=F.lz[i]+(F.lz[i+1]-F.lz[i])*t;
  _fr.k=F.k[i]+(F.k[i+1]-F.k[i])*t; return _fr;
}
// map right-frame arclength onto primary (left-frame) arclength
function rightToPrimary(s){
  if(s<=S_FORK_R) return s*(S_FORK_L/Math.max(1,S_FORK_R));
  if(s<=S_JOIN_R) return S_FORK_L+(s-S_FORK_R)*(armLenL/Math.max(1,armLenR));
  return S_JOIN_L+(s-S_JOIN_R);
}
// gate anchor: the local frame of the Great Shear
const gateC=spinePos(S_GATE);
const gateFwd=(()=>{ const a=spinePos(S_GATE-24), b=spinePos(S_GATE+24);
  const v=new THREE.Vector3(b.x-a.x,0,b.z-a.z); return v.normalize(); })();
const gateLeft=new THREE.Vector3(gateFwd.z,0,-gateFwd.x);
// the sun rakes across the slot axis — cross light, not glare
const SUN_SIDE=ATMO.chance(0.5)?1:-1;
const SUN_YAW_OFF=SUN_SIDE*ATMO.r(0.42,0.60);
{
  const az=Math.atan2(gateFwd.x,gateFwd.z)+SUN_YAW_OFF;
  sunDir.set(Math.sin(az)*Math.cos(SUN_ELEV),Math.sin(SUN_ELEV),Math.cos(az)*Math.cos(SUN_ELEV)).normalize();
}
const sunAz2=new THREE.Vector2(sunDir.x,sunDir.z).normalize();
// ---------- corridor truth: fine hash of every ribbon metre ----------
// Samples every 2 m on both frame sets plus the 220 m ending run-out.
// This one structure answers every "how close is the road" question —

  for(let i=0;i<8;i++){ const a=i/8*TAU;
    const rr=r*(1+(i%2)*0.18), ex=Math.cos(a)*rr*stretch, ez=Math.sin(a)*rr;
    pts.push([x+ca*ex-sa*ez, y, z+sa*ex+ca*ez]); }
  const ctr=[x,y,z];
  for(let i=0;i<8;i++) pushTri(B,pts[i],pts[(i+1)%8],ctr,c);
}
// striped upright prism with a leanable top ring (barrels, tanks, drums)
function prismStriped(B,cx,cy,cz,r0,r1,h,sides,cA,cB,cTop,leanX=0,leanZ=0){
  const bot=[],top=[];
  for(let i=0;i<sides;i++){ const a=i/sides*TAU;
    bot.push([cx+Math.cos(a)*r0,cy,cz+Math.sin(a)*r0]);
    top.push([cx+Math.cos(a)*r1+leanX,cy+h,cz+Math.sin(a)*r1+leanZ]); }
  for(let i=0;i<sides;i++){ const j=(i+1)%sides;
    pushQuad(B,bot[i],bot[j],top[j],top[i],(i%2)?cA:cB); }
  if(cTop){ const ctr=[cx+leanX,cy+h,cz+leanZ];
    for(let i=0;i<sides;i++) pushTri(B,top[i],top[(i+1)%sides],ctr,cTop); }
  return {bot,top};
}

// ---------- geology archetypes: eleven silhouette families ----------
const bandFor=(t,mute)=>{
  const c= t<0.28? mixc(PAL.rust,PAL.wine,0.38)
        : t<0.55? col(PAL.rust)
        : t<0.8? col(PAL.sandstone)
        : mixc(PAL.sandstone,PAL.cream,0.28);
  return c.lerp(col(PAL.rose),clamp(mute,0,0.5));
};
function ringPts(cx,cz,yaw,r,sides,jit,R){
  const pts=[];
  for(let i=0;i<sides;i++){ const a=yaw+i/sides*TAU;
    const rr=r*(1+R.r(-jit,jit));
    pts.push([cx+Math.cos(a)*rr,0,cz+Math.sin(a)*rr]); }
  return pts;
}
const setY=(pts,y)=>pts.map(p=>[p[0],y,p[2]]);
function strataForm(B,x,z,y0,opt,R){
  const {levels,w,hTot,taper,lean,jit,mute}=opt;
  // wide forms earn more facets — a 200 m mesa must not show 40 m flat faces
  const sides=Math.min(14,Math.max(opt.sides,Math.floor(w/16)));
  let r=w/2, y=y0, prev=null;
  for(let l=0;l<levels;l++){
    const t=l/Math.max(1,levels-1);
    const hL=(hTot/levels)*R.r(0.75,1.3);
    const rTop=r*lerp(1,taper,1/levels)*R.r(0.9,1.02);
    const leanX=Math.cos(lean.az)*Math.tan(lean.a), leanZ=Math.sin(lean.az)*Math.tan(lean.a);
    const bot=prev||setY(ringPts(x,z,R.r(0,6.28),r,sides,jit,R),y);
    let top=setY(ringPts(x,z,R.r(0,6.28),rTop*R.r(0.82,0.98),sides,jit,R),y+hL);
    top=top.map(p=>[p[0]+leanX*(y+hL-y0),p[1],p[2]+leanZ*(y+hL-y0)]);
    const c=bandFor(t,mute);
    const cT=c.clone().lerp(col(PAL.sandstone),0.25);
    for(let i=0;i<bot.length;i++){
      const j=(i+1)%bot.length;
      pushQuad(B,bot[i],bot[j],top[j%top.length],top[i%top.length],
        R.chance(0.16)?c.clone().lerp(col(PAL.wine),0.4):c);
    }
    const ctr=[x+leanX*(y+hL-y0),y+hL,z+leanZ*(y+hL-y0)];
    for(let i=0;i<top.length;i++) pushTri(B,top[i],top[(i+1)%top.length],ctr,cT);
    prev=top; r=rTop; y+=hL;
  }
  return y;
}
// true worst-case half-extents per archetype — centre-point tests are forbidden
const FOOT_R={ steppedMesa:68,faultFin:44,flutedCliff:42,undercutShelf:26,fracturedSlab:12,
  talusApron:24,washTerrace:38,layeredButtress:36,brokenCaprock:42,hoodoo:6,strataRib:48 };
function footRadius(type,sc){ return (FOOT_R[type]||20)*sc; }
const ARCH={
  steppedMesa(B,x,z,sc,mute,R){ strataForm(B,x,z,terrainH(x,z)-3,
    {levels:R.i(3,6),w:R.r(60,120)*sc,hTot:R.r(28,64)*sc,taper:R.r(0.5,0.75),
     lean:{a:R.r(0,0.03),az:0},sides:R.i(6,8),jit:0.16,mute},R); },
  faultFin(B,x,z,sc,mute,R){
    const h=R.r(20,44)*sc,w=R.r(18,40)*sc,th=R.r(4,8)*sc;
    const yaw=Math.atan2(gateFwd.x,-gateFwd.z)+R.r(-0.3,0.3);
    const y0=terrainH(x,z)-2, lean=R.r(0.08,0.22)*(R.chance(0.5)?1:-1);
    const ca=Math.cos(yaw),sa=Math.sin(yaw);
    const c=bandFor(0.6,mute), cD=c.clone().lerp(col(PAL.wine),0.4);
    for(let seg=0;seg<2;seg++){
      const w2=w*(seg?0.55:1), h2=h*(seg?0.72:1), off=seg?w*0.42:0;
      const bx=x+sa*off, bz=z-ca*off;
      const bot=[[bx-sa*w2/2-ca*th/2,y0,bz+ca*w2/2-sa*th/2],[bx+sa*w2/2-ca*th/2,y0,bz-ca*w2/2-sa*th/2],
                 [bx+sa*w2/2+ca*th/2,y0,bz-ca*w2/2+sa*th/2],[bx-sa*w2/2+ca*th/2,y0,bz+ca*w2/2+sa*th/2]];
      const top=bot.map(p=>[p[0]+lean*h2*ca,y0+h2*R.r(0.8,1.1),p[2]+lean*h2*sa]);
      pushBlock(B,bot,top,seg?cD:c,c.clone().lerp(col(PAL.cream),0.2));

  flutedCliff(B,x,z,sc,mute,R){
    const n=R.i(4,7), yaw=R.r(0,6.28), h=R.r(22,46)*sc;

    for(let i=0;i<n;i++){

      const bx=x+ca*off+sa*dep, bz=z+sa*off-ca*dep;
      const bot=[[bx-ca*w/2-sa*3,y0,bz-sa*w/2+ca*3],[bx+ca*w/2-sa*3,y0,bz+sa*w/2+ca*3],
                 [bx+ca*w/2+sa*3,y0,bz+sa*w/2-ca*3],[bx-ca*w/2+sa*3,y0,bz-sa*w/2-ca*3]];
      const top=bot.map(p=>[p[0],y0+hh,p[2]]);

  undercutShelf(B,x,z,sc,mute,R){

      lean:{a:0,az:0},sides:6,jit:0.1,mute},R);
    strataForm(B,x,z,y1-1,{levels:2,w:R.r(28,44)*sc,hTot:R.r(7,14)*sc,taper:0.85,
      lean:{a:R.r(0,0.05),az:R.r(0,6.28)},sides:7,jit:0.14,mute},R);
  },
  fracturedSlab(B,x,z,sc,mute,R){
    const w=R.r(7,18)*sc,dep=R.r(5,13)*sc,th=R.r(1.4,3.2)*sc,yaw=R.r(0,6.28),tilt=R.r(0.06,0.3);
    const y0=terrainH(x,z)-0.5, ca=Math.cos(yaw),sa=Math.sin(yaw);
    const bot=[[x-ca*w/2-sa*dep/2,y0,z-sa*w/2+ca*dep/2],[x+ca*w/2-sa*dep/2,y0,z+sa*w/2+ca*dep/2],
               [x+ca*w/2+sa*dep/2,y0,z+sa*w/2-ca*dep/2],[x-ca*w/2+sa*dep/2,y0,z-sa*w/2-ca*dep/2]];
    const top=bot.map((p,i)=>[p[0],y0+th+(i<2?tilt*w:0)+R.r(-0.4,0.4),p[2]]);
    pushBlock(B,bot,top,bandFor(0.45,mute).lerp(col(PAL.wine),0.2),bandFor(0.75,mute));
  },
  talusApron(B,x,z,sc,mute,R){
    strataForm(B,x,z,terrainH(x,z)-2,{levels:2,w:R.r(24,42)*sc,hTot:R.r(4,8)*sc,taper:0.35,
      lean:{a:0,az:0},sides:8,jit:0.2,mute},R);
  },
  washTerrace(B,x,z,sc,mute,R){
    const yaw=R.r(0,6.28), len=R.r(28,64)*sc, ca=Math.cos(yaw),sa=Math.sin(yaw);
    let y0=terrainH(x,z)-1.5;
    const segs=Math.max(2,Math.round(len/16));   // broken terrace edge, never one long box
    for(let stp=0;stp<R.i(2,3);stp++){
      const w=len*(1-stp*0.25), dep=R.r(8,14), hh=R.r(2,4);

        const bot=[A(u0,-dep/2,y0),A(u1,-dep/2,y0),A(u1,dep/2,y0),A(u0,dep/2,y0)];

  },
  brokenCaprock(B,x,z,sc,mute,R){

      hTot:R.r(22,40)*sc,taper:0.7,lean:{a:R.r(0,0.03),az:0},sides:7,jit:0.15,mute},R);
    for(let k=0;k<R.i(2,3);k++){
      const w=R.r(7,15)*sc, th=R.r(2,4)*sc, tilt=R.r(0.1,0.4);
      const bx=x+R.r(-13,13)*sc, bz=z+R.r(-13,13)*sc, yaw=R.r(0,6.28);

// ---------- flora builders: cacti are architecture ----------
function cactusLantern(B,x,z,sc,R,opt={}){
  const y0=terrainH(x,z)-0.15;
  const body=mixc(PAL.sage,PAL.cyan,R.r(0.05,0.35)).lerp(col(PAL.wine),R.r(0,0.14));
  const rib=body.clone().lerp(col(PAL.wine),0.28);
  const bud=body.clone().lerp(col(PAL.cream),0.35);
  const H=R.r(2.6,6.6)*sc, rr=lerp(0.17,0.32,clamp(H/7,0,1));
  const kA=R.r(0,TAU), kM=R.r(0,0.10);
  let y=y0, cx=x, cz=z, r=rr;
  for(let i=0;i<3;i++){
    const h=H/3, r1=r*(i===2?0.62:0.9);
    prismStriped(B,cx,y,cz,r,r1,h,7,body,rib,i===2?bud:null,
      Math.cos(kA)*kM*h*(i-1),Math.sin(kA)*kM*h*(i-1));
    cx+=Math.cos(kA)*kM*h*(i-1); cz+=Math.sin(kA)*kM*h*(i-1);
    y+=h; r=r1;
  }
  const nArms=H>3.4?R.i(0,4):0;
  for(let a=0;a<nArms;a++){
    const az=R.r(0,TAU), hA=R.r(0.35,0.72)*H, out=R.r(0.45,0.85), up=R.r(0.7,1.6)*sc;
    const ax=x+Math.cos(az)*rr*0.8, azz=z+Math.sin(az)*rr*0.8;
    const ex=x+Math.cos(az)*(rr*0.6+out), ez=z+Math.sin(az)*(rr*0.6+out);
    strut(B,ax,y0+hA,azz,ex,y0+hA+0.28,ez,rr*1.15,rr*1.15,rib);
    prismStriped(B,ex,y0+hA+0.2,ez,rr*0.62,rr*0.45,up,6,body,rib,bud,0,0);
  }
  if(opt.nestHole){ // a raven keeps this address
    const hy=y0+H*0.78, az=Math.atan2(sunAz2.y,sunAz2.x);
    const hx=x+Math.cos(az)*rr*0.95, hz=z+Math.sin(az)*rr*0.95;
    const u=[-Math.sin(az)*0.10,0,Math.cos(az)*0.10];
    pushQuad(B,[hx-u[0],hy-0.13,hz-u[2]],[hx+u[0],hy-0.13,hz+u[2]],
      [hx+u[0],hy+0.13,hz+u[2]],[hx-u[0],hy+0.13,hz-u[2]],col(PAL.aubergine));
  }
  if(opt.scar){ // healed lightning scar
    const az=R.r(0,TAU);
    const hx=x+Math.cos(az)*rr*0.98, hz=z+Math.sin(az)*rr*0.98;
    const u=[-Math.sin(az)*0.05,0,Math.cos(az)*0.05];
    pushQuad(B,[hx-u[0],y0+H*0.2,hz-u[2]],[hx+u[0],y0+H*0.2,hz+u[2]],
      [hx+u[0]+0.1,y0+H*0.85,hz+u[2]],[hx-u[0]+0.1,y0+H*0.85,hz-u[2]],
      mixc(PAL.wine,PAL.rust,0.4));
  }
  apron(B,x,z,rr*2.4,0,1,mixc(PAL.rust,PAL.wine,0.55));
  return H;
}
function cactusPads(B,x,z,sc,R){
  const y0=terrainH(x,z)-0.06;
  const body=mixc(PAL.sage,PAL.wine,R.r(0.1,0.3));
  const edge=body.clone().lerp(col(PAL.cream),0.22);
  const n=R.i(3,8);
  let px=x, pz=z, py=y0, baseYaw=R.r(0,TAU);
  for(let i=0;i<n;i++){
    const rad=R.r(0.26,0.42)*sc, yaw=baseYaw+R.r(-0.9,0.9), tilt=R.r(-0.22,0.22);
    const ca=Math.cos(yaw),sa=Math.sin(yaw);
    const th=0.07*sc;
    const pts=[[0,-rad,0],[rad*0.75,-rad*0.45,0],[rad*0.95,rad*0.3,0],[rad*0.4,rad,0],
               [-rad*0.4,rad,0],[-rad*0.95,rad*0.3,0],[-rad*0.75,-rad*0.45,0]];
    const T=(p,s2)=>[px+ca*p[0]+sa*(tilt*p[1]+s2*th), py+rad+p[1], pz+sa*p[0]-ca*(tilt*p[1]+s2*th)];
    for(let k=1;k<pts.length-1;k++){
      pushTri(B,T(pts[0],1),T(pts[k],1),T(pts[k+1],1),body);
      pushTri(B,T(pts[0],-1),T(pts[k+1],-1),T(pts[k],-1),body);
    }
    for(let k=0;k<pts.length;k++){ const q=(k+1)%pts.length;
      pushQuad(B,T(pts[k],1),T(pts[q],1),T(pts[q],-1),T(pts[k],-1),edge); }
    if(R.chance(0.5)){ // fruit on the sun edge
      const fx=px+ca*rad*0.5, fz=pz+sa*rad*0.5, fy=py+rad*1.9;
      const fc=mixc(PAL.rose,PAL.rust,R.r(0,0.6));
      pushTri(B,[fx-0.05,fy,fz],[fx+0.05,fy,fz],[fx,fy+0.11,fz+0.02],fc);
    }
    px+=ca*rad*R.r(0.7,1.1); pz+=sa*rad*R.r(0.7,1.1); py+=rad*R.r(0.4,0.9);
    if(R.chance(0.4)){ px=x+R.r(-0.5,0.5)*sc; pz=z+R.r(-0.5,0.5)*sc; py=y0; }
  }
  apron(B,x,z,0.8*sc,0,1.2,mixc(PAL.rust,PAL.wine,0.5));
}
function cactusBarrel(B,x,z,sc,R){

function cactusCholla(B,x,z,sc,R){
  const y0=terrainH(x,z)-0.08;
  const old=mixc(PAL.wine,PAL.rust,0.35);
  const young=mixc(PAL.sage,PAL.cream,R.r(0.3,0.5)); // backlit fuzz halo
  const seg=(ax,ay,az,len,el,azm,w,depth)=>{
    const bx2=ax+Math.cos(azm)*Math.cos(el)*len, by2=ay+Math.sin(el)*len, bz2=az+Math.sin(azm)*Math.cos(el)*len;
    strut(B,ax,ay,az,bx2,by2,bz2,w,w,depth===0?old:young);
    if(depth<2){ const n=R.i(1,2);
      for(let i=0;i<n;i++) seg(bx2,by2,bz2,len*R.r(0.6,0.85),clamp(el+R.r(-0.5,0.9),0.1,1.4),
        azm+R.r(-1.4,1.4),w*0.75,depth+1); }

const gateW=(a,y,b)=>[gateC.x+gateLeft.x*a+gateFwd.x*b, y, gateC.z+gateLeft.z*a+gateFwd.z*b];

        const cTop=bandFor(0.75+t*0.2,0);

        const top=[gateW(i1,y+hL,a0+SR.r(-2,2)),gateW(o0,y+hL,a0),gateW(o0,y+hL,a1),gateW(i1,y+hL,a1+SR.r(-2,2))];

function vegMaterial(){

    uniforms:vegUniforms, side:THREE.DoubleSide,
    vertexShader:`
    attribute vec3 iPos; attribute float iSc; attribute float iPh; attribute vec3 iCol;
    uniform float uTime; uniform vec3 uWind;
    varying vec3 vC; varying float vY; varying vec3 vW;
    void main(){
      vC=iCol; vY=uv.y;
      vec3 p=position*iSc;
      float gust=sin(uTime*1.05+dot(iPos.xz,uWind.xz)*0.045+iPh);
      float sway=(0.20+0.16*gust)*p.y*p.y/max(iSc,0.001);
      p+=uWind*sway;
      vec3 w=p+iPos; vW=w;
      gl_Position=projectionMatrix*viewMatrix*vec4(w,1.0);
    }`,
    fragmentShader:`
    uniform vec3 uFogC; uniform float uFogN; uniform float uFogF; uniform vec3 uCam;
    varying vec3 vC; varying float vY; varying vec3 vW;
    void main(){
      vec3 c=vC*(0.62+0.5*vY);
      float fogA=clamp((distance(vW,uCam)-uFogN)/(uFogF-uFogN),0.0,0.93);
      c=mix(c,uFogC,fogA);
      gl_FragColor=vec4(c,1.0);
    }`,
  });
}
function bladeGeo(nBlades,w,h,curve){

    const tip=[ca*curve,h*(0.8+0.3*((b*37)%10)/10),sa*curve];
    P.push(-sa*w/2,0,ca*w/2, sa*w/2,0,-ca*w/2, tip[0],tip[1],tip[2]);
    UVQ.push(0,0, 0,0, 0,1);

  g.setAttribute('uv',new THREE.Float32BufferAttribute(UVQ,2));
  g.setIndex(IDX);

}

function buildInstanced(recsList,geo,colorsFor){

  ig.index=geo.index; ig.setAttribute('position',geo.getAttribute('position'));
  ig.setAttribute('uv',geo.getAttribute('uv'));

  recsList.forEach((r,i)=>{

function buildChunk(id){
  const pi=chunkState.pool.findIndex(p=>p.id===id);
  if(pi>=0){
    const p=chunkState.pool.splice(pi,1)[0];
    for(const m of p.meshes) chunkGroup.add(m);
    chunkState.built.set(id,p); chunkState.reused++;
  } else {
    const meshes=buildChunkMeshes(chunkPlans[id]);
    for(const m of meshes) chunkGroup.add(m);
    chunkState.built.set(id,{id,meshes}); chunkState.created++;
  }
  chunkState.peak=Math.max(chunkState.peak,chunkState.built.size);
}
function dropChunk(id){
  const ch=chunkState.built.get(id); if(!ch) return;
  chunkState.built.delete(id);
  for(const m of ch.meshes) chunkGroup.remove(m);
  chunkState.pool.push(ch);
  while(chunkState.pool.length>6){
    const old=chunkState.pool.shift();
    for(const m of old.meshes) m.geometry.dispose();
    chunkState.disposed++;
  }
}

  for(let i=0;i<_dropIds.length;i++) dropChunk(_dropIds[i]);

function makePointsSystem(name,count,color,size,alphaMax,init,step){
  const pos=new Float32Array(count*3), alp=new Float32Array(count);
  const st={p:new Float32Array(count*3),vx:new Float32Array(count),vy:new Float32Array(count),
    vz:new Float32Array(count),life:new Float32Array(count),maxLife:new Float32Array(count),idx:0};
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('aAlpha',new THREE.BufferAttribute(alp,1));
  const m=new THREE.ShaderMaterial({
    uniforms:{ uCam:{value:new THREE.Vector3()}, uPx:{value:900}, uAmp:{value:1} },
    transparent:true, depthWrite:false,
    vertexShader:`
    attribute float aAlpha; uniform vec3 uCam; uniform float uPx; uniform float uAmp;
    varying float vA;
    void main(){
      vec4 mv=viewMatrix*vec4(position,1.0);
      float d=-mv.z;
      vA=aAlpha*uAmp*(1.0-clamp((d-800.0)/1500.0,0.0,1.0));
      gl_PointSize=clamp(${size.toFixed(1)}*uPx/max(1.0,d),1.0,6.0);
      gl_Position=projectionMatrix*mv;
    }`,
    fragmentShader:`
    varying float vA;
    void main(){
      vec2 q=gl_PointCoord-0.5;
      float a=smoothstep(0.5,0.1,length(q))*${alphaMax.toFixed(3)}*vA;
      if(a<0.004) discard;
      gl_FragColor=vec4(${color},a);
    }`,
  });
  const pts=new THREE.Points(g,m);
  pts.frustumCulled=false;
  scene.add(pts);
  const sys={name,count,st,geoPos:pos,geoAlp:alp,geo:g,mat:m,init,step};
  for(let i=0;i<count;i++) init(sys,i);

}
// spawn helper: clamp a particle's straight run so it never crosses the corridor.
// Samples every ~5 m of the path — the corridor is 10.8 m wide, so no straight
// segment can slip through between consecutive clear samples.
function clampSpan(x,y,z,dx,dz,span){
  let ok=span;
  const n=Math.max(5,Math.ceil(span/5));
  for(let i=1;i<=n;i++){
    const t=i/n;
    const px=x+dx*span*t, pz=z+dz*span*t;
    const ri=routeInfo(px,pz);
    if(ri.d<ROAD_HW+1.3&&y<ri.h+4.5){ ok=span*((i-1)/n); break; }
  }
  return Math.max(ok,4);
}
function spawnFromPlan(sys,i,rec,vScale,vertical){
  const st=sys.st;
  const jx=DUST_RT.r(-3,3), jz=DUST_RT.r(-3,3);
  let x=rec.x+jx, z=rec.z+jz;
  const y=rec.y+DUST_RT.r(-0.5,1.5);
  if(routeInfo(x,z).d<ROAD_HW+1.3){ x=rec.x; z=rec.z; }   // jitter never enters the corridor
  const spd=rec.spd*vScale;
  const span=clampSpan(x,y,z,windDir.x,windDir.z,rec.span);
  st.p[i*3]=x; st.p[i*3+1]=y; st.p[i*3+2]=z;
  st.vx[i]=windDir.x*spd; st.vz[i]=windDir.z*spd; st.vy[i]=vertical;
  st.maxLife[i]=span/Math.max(0.5,spd);
  st.life[i]=st.maxLife[i]*DUST_RT.f();   // staggered starts
}

let lifeCheckCursor=0;
function updateAnimals(wT,dt,riderS,riderPos){
  // — small ground life —
  for(const a of ACTORS.small){
    a.t+=dt;
    if(a.kind==='quail'&&a.flying){
      const t=clamp(a.t/a.dur,0,1);
      a.x=lerp(a.fx,a.tx,t); a.z=lerp(a.fz,a.tz,t);
      a.fh=Math.sin(Math.PI*t)*4.5;
      a.yaw=Math.atan2(a.tx-a.fx,a.tz-a.fz);
      if(t>=1){ a.flying=false; a.cx=a.tx; a.cz=a.tz; a.mode='peck'; a.t=0; a.dur=a.st.r(2,5); a.fh=0; }
    } else if(a.mode==='rest'||a.mode==='peck'){
      if(a.t>a.dur){
        a.mode='dart'; a.t=0; a.dur=a.st.r(0.5,1.1);
        const home=a.kind==='quail'?{x:a.cx,z:a.cz}:a.home;
        const s2=safeSpot(home.x,home.z,a.kind==='quail'?4:(a.home.r||5),a.st);
        a.fx=a.x; a.fz=a.z; a.tx=s2.x; a.tz=s2.z;
        a.yaw=Math.atan2(a.tx-a.fx,a.tz-a.fz);
      }
    } else {
      const t=clamp(a.t/a.dur,0,1);
      a.x=lerp(a.fx,a.tx,t); a.z=lerp(a.fz,a.tz,t);
      if(t>=1){ a.mode=a.kind==='quail'?'peck':'rest'; a.t=0;
        a.dur=a.st.r(a.kind==='lizard'?2:3,a.kind==='lizard'?9:10); }
    }
    const bob=a.kind==='quail'&&a.mode==='peck'?Math.max(0,Math.sin(a.t*7))*0.03:0;
    setInst(smallMesh,a.i,a.x,terrainH(a.x,a.z)+0.04+a.fh-bob,a.z,a.yaw,0,0,a.sc);
  }
  smallMesh.instanceMatrix.needsUpdate=true;
  // — birds —
  for(const b of ACTORS.birds){
    if(b.kind==='raven'){
      b.t+=dt;
      if(b.mode==='perched'){
        b.x=b.perch.x; b.y=b.perch.y; b.z=b.perch.z;
        b.yaw+=Math.sin(wT*0.7+b.i)*0.004;   // small head turns
        if(b.t>b.dwell){
          b.mode='fly'; b.t=0;
          let next=b.perch, tries=0;
          while(tries++<8){ const cand=perchPts[b.st.i(0,perchPts.length-1)];
            const d=Math.hypot(cand.x-b.perch.x,cand.z-b.perch.z);
            if(d>30&&d<520){ next=cand; break; } }
          b.from=b.perch; b.to=next;
          const d=Math.hypot(next.x-b.perch.x,next.z-b.perch.z);
          b.dur=Math.max(2,d/9);
          if(AUDIO.ok&&Math.hypot(b.x-riderPos.x,b.z-riderPos.z)<160) sndWing();
        }
      } else {
        const t=clamp(b.t/b.dur,0,1);
        const arc=Math.sin(Math.PI*t)*Math.min(16,b.dur*2.4);
        b.x=lerp(b.from.x,b.to.x,t); b.z=lerp(b.from.z,b.to.z,t);
        b.y=lerp(b.from.y,b.to.y,t)+arc;
        b.yaw=Math.atan2(b.to.x-b.from.x,b.to.z-b.from.z);
        if(t>=1){ b.mode='perched'; b.perch=b.to; b.t=0;
          b.dwell=b.st.r(8,28);
          if(AUDIO.ok&&b.st.chance(0.4)&&Math.hypot(b.x-riderPos.x,b.z-riderPos.z)<220) sndRaven(b.x-riderPos.x);
        }
      }
      const flap=b.mode==='fly'?Math.sin(wT*11+b.i)*0.65:0.06;
      setInst(birdMesh,b.i,b.x,b.y,b.z,b.yaw,0,flap,b.sc);
    } else { // vulture
      const v=b.v;
      b.rMul+=(b.rTgt-b.rMul)*(1-Math.exp(-dt*0.3));
      const a=wT*v.w+v.ph;
      const cx=v.x+windDir.x*wT*v.drift*0.3, cz=v.z+windDir.z*wT*v.drift*0.3;
      b.x=cx+Math.cos(a)*v.r*b.rMul; b.z=cz+Math.sin(a)*v.r*b.rMul;
      b.y=v.y+Math.sin(wT*0.09+v.ph)*6;
      b.yaw=Math.atan2(-Math.sin(a),Math.cos(a))*Math.sign(v.w);
      const tilt=0.18*Math.sign(v.w);
      setInst(birdMesh,b.i,b.x,b.y,b.z,b.yaw,0,tilt,b.sc);
    }
  }

  // — cliff grazers —
  for(const h of ACTORS.horns){
    h.t+=dt;
    if(h.mode==='walk'){
      h.u+=h.b.spd*dt*h.dir*0.5;
      if(h.u>0.98){h.u=0.98;h.dir=-1;} if(h.u<0.02){h.u=0.02;h.dir=1;}
      if(h.t>h.dur){ h.mode='pause'; h.t=0; h.dur=h.st.r(3,9); }
    } else if(h.t>h.dur){ h.mode='walk'; h.t=0; h.dur=h.st.r(6,14); }
    const path=h.b.path;
    const fi=h.u*(path.length-1), i0=Math.floor(fi), tt=fi-i0;
    const p0=path[i0], p1=path[Math.min(path.length-1,i0+1)];
    const x=lerp(p0.x,p1.x,tt), z=lerp(p0.z,p1.z,tt), y=lerp(p0.y,p1.y,tt);
    const yaw=Math.atan2(p1.x-p0.x,p1.z-p0.z)+(h.dir<0?Math.PI:0);
    const headUp=h.mode==='pause'?-0.12:0;
    setInst(hornMesh,h.i,x,y,z,yaw,headUp,0,h.sc);
  }
  hornMesh.instanceMatrix.needsUpdate=true;
  // — crossers and the rare fox —
  for(const hp of ACTORS.hops){
    if(hp.kind==='rabbit'){
      if(hp.mode==='wait'){ hp.x=hp.cross.x0; hp.z=hp.cross.z0;
        setInst(hopMesh,hp.i,hp.x,terrainH(hp.x,hp.z)+0.02,hp.z,0,0,0,0.001); continue; }
      if(hp.mode==='run'){
        hp.t+=dt;
        const t=clamp(hp.t/hp.dur,0,1);
        hp.x=lerp(hp.cross.x0,hp.cross.x1,t); hp.z=lerp(hp.cross.z0,hp.cross.z1,t);
        hp.yaw=Math.atan2(hp.cross.x1-hp.cross.x0,hp.cross.z1-hp.cross.z0);
        const hop=Math.abs(Math.sin(t*22))*0.22;
        setInst(hopMesh,hp.i,hp.x,terrainH(hp.x,hp.z)+0.04+hop,hp.z,hp.yaw,0,0,hp.sc);
        if(t>=1){ hp.mode='gone'; }
        continue;
      }
      setInst(hopMesh,hp.i,hp.cross.x1,terrainH(hp.cross.x1,hp.cross.z1)+0.02,hp.cross.z1,hp.yaw,0,0,

        const sF=hp.s0+hp.t*10.4;
        const f=frameAtPrimary(clamp(sF,0,SP_LEN-1),0);
        const done=hp.t>hp.fox.dur;
        const off=done? 9.6+(hp.t-hp.fox.dur)*6 : 9.6;
        hp.x=f.x+f.lx*hp.side*off; hp.z=f.z+f.lz*hp.side*off;
        hp.yaw=Math.atan2(f.tx,f.tz)+(done?hp.side*0.7:0);
        const trot=Math.abs(Math.sin(hp.t*9))*0.08;
        setInst(hopMesh,hp.i,hp.x,terrainH(hp.x,hp.z)+0.04+trot,hp.z,hp.yaw,0,0,hp.sc);
        if(hp.t>hp.fox.dur+2.5) hp.mode='rest';
        continue;
      }
      setInst(hopMesh,hp.i,hp.x,terrainH(hp.x,hp.z)+0.02,hp.z,hp.yaw,0,0,hp.sc*0.9);
    }
  }
  hopMesh.instanceMatrix.needsUpdate=true;
  // measured life-path sovereignty — rotating sample of live GROUND actors
  // (a flushed covey crossing in the air is flight, not a ground path)
  const pool=ACTORS.small;
  if(pool.length){
    const a=pool[lifeCheckCursor%pool.length]; lifeCheckCursor++;
    if(!(a.kind==='quail'&&a.flying)){
      const ri=routeInfo(a.x,a.z);
      if(ri.d<CLEAR_D-0.4) MEASURE.lifePathIntrusions++;
    }
  }
}

const AUDIO={ctx:null,ok:false,started:false};
let SND_RT=makeStream('sound-rt');
function audioInit(){
  if(AUDIO.started) return;
  AUDIO.started=true;
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    AUDIO.ctx=ctx;
    const master=ctx.createGain(); master.gain.value=0.85;
    const comp=ctx.createDynamicsCompressor();
    master.connect(comp); comp.connect(ctx.destination);
    AUDIO.master=master;
    const noiseBuf=(()=>{ const b=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
      const d=b.getChannelData(0);
      let v=0;
      for(let i=0;i<d.length;i++){ v=v*0.98+(Math.random()*2-1)*0.14; d[i]=v*3; }
      return b; })();
    AUDIO.noiseBuf=noiseBuf;
    const mkLoop=(filterType,f0,q,g0)=>{
      const src=ctx.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
      const flt=ctx.createBiquadFilter(); flt.type=filterType; flt.frequency.value=f0; flt.Q.value=q;
      const g=ctx.createGain(); g.gain.value=g0;
      src.connect(flt); flt.connect(g); g.connect(master); src.start();
      return {src,flt,g};
    };
    AUDIO.wind=mkLoop('lowpass',420,0.6,0.05);
    AUDIO.whistle=mkLoop('bandpass',980,9,0.0);
    AUDIO.tire=mkLoop('bandpass',520,0.8,0.0);
    AUDIO.crackle=mkLoop('highpass',2400,0.7,0.0);
    AUDIO.ok=true;
  }catch(e){ AUDIO.ok=false; capturedErrors.push('audio unavailable: '+(e.message||'?')); }
}
function oneShot(build){
  if(!AUDIO.ok) return;
  try{ build(AUDIO.ctx,AUDIO.master); }catch(e){}
}
function sndChime(base,panX){
  oneShot((ctx,master)=>{
    const pan=ctx.createStereoPanner? ctx.createStereoPanner():null;
    const out=pan||master;
    if(pan){ pan.pan.value=clamp(panX,-1,1); pan.connect(master); }
    for(const [mul,g0,dec] of [[1,0.07,3.4],[2.76,0.03,2.2],[5.4,0.014,1.3]]){
      const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=base*mul;
      const g=ctx.createGain(); g.gain.setValueAtTime(g0,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0004,ctx.currentTime+dec);
      o.connect(g); g.connect(out); o.start(); o.stop(ctx.currentTime+dec+0.1);
      o.onended=()=>{ g.disconnect(); o.disconnect(); if(pan&&mul===5.4) pan.disconnect(); };
    }
  });

    o.frequency.exponentialRampToValueAtTime(370,ctx.currentTime+0.16);

    g.gain.exponentialRampToValueAtTime(0.05,ctx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0004,ctx.currentTime+0.2);
    o.connect(f); f.connect(g); g.connect(master);

function sndQuail(){

    let t=ctx.currentTime;
    for(const [f0,d] of [[880,0.07],[1160,0.06],[760,0.1]]){
      const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f0;
      const g=ctx.createGain(); g.gain.setValueAtTime(0.02,t);
      g.gain.exponentialRampToValueAtTime(0.0004,t+d);
      o.connect(g); g.connect(master); o.start(t); o.stop(t+d+0.03);

    for(const sys of dustSystems){
      if(sys.name==='sheets') sys.mat.uniforms.uAmp.value=amp*(1+gustEnv*0.5);
      else if(sys.name==='grit') sys.mat.uniforms.uAmp.value=(ch.idx===6?0.4:1)*(0.7+gustEnv*0.8);
      else if(sys.name==='spill') sys.mat.uniforms.uAmp.value=(worldT-spillBoostT<9)?2.3:0.9;
      else if(sys.name==='thermal') sys.mat.uniforms.uAmp.value=1+(bladeTarget>0.5?0.8:0);
    }
    if(devilSys){
      const on=worldT-devilT<42;
      devilSys.sys.mat.uniforms.uAmp.value+=((on?1:0)-devilSys.sys.mat.uniforms.uAmp.value)*(1-Math.exp(-dt*0.5));
      if(on){ devilSys.x+=windDir.x*7.5*dt; devilSys.z+=windDir.z*7.5*dt; }
    }
  }
  // movers
  for(const w of MOVERS.wheels) if(w.mesh) w.mesh.rotation.x=worldT*(0.7+gustEnv*2.2);
  for(const w of MOVERS.anemos) if(w.mesh) w.mesh.rotation.y=worldT*(3+gustEnv*9);
  for(const w of MOVERS.sheaves) if(w.mesh) w.mesh.rotation.z=worldT*0.35;
  if(MOVERS.chimeMesh){
    MOVERS.chimeTubes.forEach((t2,i)=>{
      const sway=Math.sin(worldT*2.1+t2.ph)*(0.04+gustEnv*0.22);
      _ae.set(sway,0,Math.cos(worldT*1.7+t2.ph)*(0.03+gustEnv*0.18)); _aq.setFromEuler(_ae);
      _am.compose(_av.set(t2.x,t2.y,t2.z),_aq,_as.set(1,t2.len,1));
      MOVERS.chimeMesh.setMatrixAt(i,_am);
    });
    MOVERS.chimeMesh.instanceMatrix.needsUpdate=true;
  }
  if(MOVERS.vaneMesh){
    MOVERS.vanes.forEach((v,i)=>{
      let tilt=Math.sin(worldT*0.8+v.ph)*(0.10+gustEnv*0.30);
      if(vaneWave){
        const waveS=vaneWave.s0+(worldT-vaneWave.t0)*13;
        tilt+=1.1*Math.exp(-Math.pow((v.sP-waveS)/26,2));
        if(worldT-vaneWave.t0>60) vaneWave=null;
      }
      _ae.set(tilt,WIND_AZ,0); _aq.setFromEuler(_ae);
      _am.compose(_av.set(v.x,v.y,v.z),_aq,_as.set(1,1,1));
      MOVERS.vaneMesh.setMatrixAt(i,_am);
    });
    MOVERS.vaneMesh.instanceMatrix.needsUpdate=true;
  }
  if(MOVERS.crawler){
    const cr=MOVERS.crawler;
    const path=cr.path;
    if(!cr.segLens){ cr.segLens=[]; cr.total=0;
      for(let i2=0;i2<path.length-1;i2++){ const L2=Math.hypot(path[i2+1].x-path[i2].x,path[i2+1].z-path[i2].z);
        cr.segLens.push(L2); cr.total+=L2; } }
    const segLens=cr.segLens, total=cr.total;
    const nearEnd=sPrim>SP_LEN-280;
    if(nearEnd&&!cr.greeted){ cr.greeted=true; cr.pauseT=worldT; }
    const paused2=cr.pauseT&&worldT-cr.pauseT<3.2;
    if(!cr.tAcc) cr.tAcc=cr.phase*total;
    if(!paused2) cr.tAcc=(cr.tAcc+cr.spd*dt)%total;
    let dAcc=cr.tAcc, seg=0;
    while(seg<segLens.length-1&&dAcc>segLens[seg]){ dAcc-=segLens[seg]; seg++; }
    const p0=path[seg], p1=path[seg+1], tt=segLens[seg]>0?dAcc/segLens[seg]:0;
    cr.mesh.position.set(lerp(p0.x,p1.x,tt),lerp(p0.y,p1.y,tt),lerp(p0.z,p1.z,tt));
    cr.mesh.rotation.y=Math.atan2(p1.x-p0.x,p1.z-p0.z)+Math.PI/2;
    const blink=paused2? (Math.sin(worldT*14)>0?1:0.1) : (Math.sin(worldT*2.2)>0.85?1:0.35);
    cr.beacon.material.color.copy(mixc(PAL.gold,PAL.cream,0.3)).multiplyScalar(blink);
  }
  // the blade and the pool
  {
    const inSlotNow=Math.abs(sPrim-S_GATE)<SHEAR.depth*0.5+60;
    const tgt=(bladeTarget>0.5&&inSlotNow)?1:(bladeTarget>0.5?0.55:0.25);
    if(bladeMat) bladeMat.uniforms.uAmp.value+=(tgt-bladeMat.uniforms.uAmp.value)*(1-Math.exp(-dt*0.8));
    poolUniforms.uGlow.value+=((bladeTarget>0.5?0.9:0.25)-poolUniforms.uGlow.value)*(1-Math.exp(-dt*0.6));
    poolUniforms.uTime.value=worldT;
  }
  // promise layer crossfade
  if(shearFarMat){
    const dGate=Math.hypot(camera.position.x-gateC.x,camera.position.z-gateC.z);
    shearFarMat.uniforms.uFade.value=smooth(1600,2600,dGate);
  }
  // shadow volume follows the rider
  {
    _shadowTarget.set(f.x+f.tx*50,f.y,f.z+f.tz*50);
    const sx=Math.round(_shadowTarget.x/8)*8, sz=Math.round(_shadowTarget.z/8)*8;
    sun.position.set(sx+sunDir.x*600,_shadowTarget.y+sunDir.y*600+120,sz+sunDir.z*600);
    sun.target.position.set(sx,_shadowTarget.y,sz);
    const sc=sun.shadow.camera;
    sc.left=-190; sc.right=190; sc.top=190; sc.bottom=-120; sc.near=280; sc.far=1100;
    sc.updateProjectionMatrix();
  }
  // uniforms
  vegUniforms.uTime.value=worldT; vegUniforms.uCam.value.copy(camera.position);
  roadUniforms.uCam.value.copy(camera.position);
  audioFrame(dt,sPrim,camera.position);
  // hint
  const hintBase='W/S speed · A/D line · mouse look · Space pause · R restart';
  hintEl.textContent=rideState.ended?'R ride again':(rideState.paused?'PAUSED · '+hintBase:hintBase);
  if(QA&&(frameId%20===0)){
    qaEl.textContent='seed '+SEED+' · '+chapterAtP(sPrim).name+' · '+rideState.branch
      +'\ns '+rideState.s.toFixed(0)+'/'+Math.round(FRAMES[rideState.branch].len)
      +' · '+(frameTimes.length?Math.round(10000/(frameTimes.slice(-60).reduce((a,b)=>a+b,0)/Math.min(60,frameTimes.length)))/10:0)+'fps'
      +'\ncalls '+lastInfo.calls+' · tris '+lastInfo.tris
      +'\nchunks '+chunkState.built.size+' (c'+chunkState.created+' r'+chunkState.reused+' d'+chunkState.disposed+')'
      +'\nroute '+routeHash+' · world '+worldHash;
  }
  renderer.info.autoReset=false;
  renderer.info.reset();
  renderer.render(scene,camera);
  lastInfo={calls:renderer.info.render.calls,tris:renderer.info.render.triangles,
    points:renderer.info.render.points,lines:renderer.info.render.lines};
});
window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
</body>
</html>
