<body>
<div id="hint">W/S speed &middot; A/D line &middot; mouse look &middot; Space pause &middot; R restart</div>
<div id="nogl">This experience needs WebGL2.</div>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   AFTERLIGHT CIRCUIT — a seeded night cycling route
   Default seed: 1189  (choose another with ?seed=<integer>)
   ============================================================ */

// ---------- seeded PRNG (no Math.random anywhere) ----------
const qs = new URLSearchParams(location.search);
const seedParam = Number.parseInt(qs.get('seed'), 10);
const SEED = (Number.isFinite(seedParam) ? seedParam : 1189) >>> 0;
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const R  = mulberry32(SEED);                 // world-construction stream
const RF = mulberry32((SEED ^ 0x9E3779B9)>>>0); // runtime effect stream (respawns etc.)
const rr = (a,b)=>a+(b-a)*R();
const ri = (a,b)=>Math.floor(a+(b-a+1)*R());
const pick = arr=>arr[Math.floor(R()*arr.length)];
const chance = p=>R()<p;
const clamp = THREE.MathUtils.clamp;

// ---------- palette (8 anchors, converted to linear by THREE.Color) ----------
const HEX = { ink:0x05060A, aub:0x150A24, vio:0x3C204D, teal:0x7EA8B8, rose:0xC45D8C, ora:0xC85A2B, amb:0xE4AE59, pap:0xD5C6B0 };
const col = h=>new THREE.Color(h);
function vary(c, v){ const o=c.clone(); const m=1+(R()*2-1)*v; o.r=clamp(o.r*m,0,1); o.g=clamp(o.g*m,0,1); o.b=clamp(o.b*m,0,1); return o; }
function scale(c, m){ const o=c.clone(); o.multiplyScalar(m); return o; }
const BLACK = col(0x000000);

// facade base tones (dark, deliberate — no neutral grey anywhere)
const FACADES = [ col(0x1B1030), col(0x241738), col(0x160C26), col(0x1F1526), col(0x11182A), col(0x261320), col(0x2A2030), col(0x121022) ];
// window light tints
function winTint(){ const r=R(); if(r<0.55) return scale(col(HEX.amb), rr(0.75,1.0)); if(r<0.77) return scale(col(HEX.pap), rr(0.5,0.72)); if(r<0.9) return scale(col(HEX.teal), rr(0.5,0.75)); return scale(col(HEX.rose), rr(0.65,0.9)); }

// ---------- renderer ----------
const cv = document.createElement('canvas');
document.body.appendChild(cv);
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas: cv, antialias:false, powerPreference:'high-performance' });
} catch(e) { document.getElementById('nogl').style.display='flex'; throw e; }
if (!renderer.capabilities.isWebGL2){ document.getElementById('nogl').style.display='flex'; throw new Error('WebGL2 required'); }
const DPR = Math.min(window.devicePixelRatio||1, 1.5);
renderer.setPixelRatio(DPR);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;   // deliberate filmic response
renderer.toneMappingExposure = 1.2;                   // deliberate exposure
renderer.outputColorSpace = THREE.SRGBColorSpace;     // deliberate output space
renderer.shadowMap.enabled = false;                   // deliberate: night scene — depth is built from
                                                      // baked facade grime, fog layering and emissive
                                                      // light instead of a moon shadow pass.
const scene = new THREE.Scene();
scene.background = col(HEX.ink);
scene.fog = new THREE.Fog(0x140B20, 26, 930);         // deliberate linear fog, retuned per chapter

const camera = new THREE.PerspectiveCamera(64, window.innerWidth/window.innerHeight, 0.1, 1700);

// lights for the few classic (Lambert) materials
scene.add(new THREE.HemisphereLight(0x2A1840, 0x0A0810, 1.4));
const moon = new THREE.DirectionalLight(0x7EA8B8, 0.5); moon.position.set(-0.4,1,0.25); scene.add(moon);
const fill = new THREE.DirectionalLight(0xC45D8C, 0.14); fill.position.set(0.6,0.7,-0.4); scene.add(fill);

// ---------- shared uniforms + GLSL chunks ----------
const U = {
  uTime:{value:0}, uCam:{value:new THREE.Vector3()},
  uFogColor:{value:col(0x140B20)}, uFogNear:{value:26}, uFogFar:{value:930},
};
const GLSL_H = `
float h11(float p){ vec3 q=fract(vec3(p)*vec3(0.1031,0.1030,0.0973)); q+=dot(q,q.yzx+33.33); return fract((q.x+q.y)*q.z); }
float h21(vec2 p){ vec3 q=fract(vec3(p.xyx)*vec3(0.1031,0.1030,0.0973)); q+=dot(q,q.yzx+33.33); return fract((q.x+q.y)*q.z); }
float n2(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f);
  float a=h21(i),b=h21(i+vec2(1.0,0.0)),c=h21(i+vec2(0.0,1.0)),d=h21(i+vec2(1.0,1.0));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y); }
float flick(float mode,float ph,float t){
  if(mode<0.5) return 0.86+0.14*sin(t*0.7+ph*6.2831);
  if(mode<1.5) return 0.55+0.5*sin(t*1.9+ph*6.2831);
  if(mode<2.5){ float h=h11(floor(t*11.0)+ph*97.0); float g=h11(floor(t*2.3)+ph*31.0);
    return (h<0.14?0.12:1.0)*(0.72+0.35*g); }
  if(mode<3.5){ return 0.12+step(mod(t*1.1+ph*3.0,3.0),1.15); }
  float h=h11(floor(t*6.0)+ph*53.0); return h<0.7?0.05:(0.9+0.4*h11(floor(t*29.0)+ph)); }
`;
const GLSL_FOG = `
uniform vec3 uFogColor; uniform float uFogNear; uniform float uFogFar;
float fogF(float z){ return clamp((z-uFogNear)/(uFogFar-uFogNear),0.0,1.0); }
`;
function shaderMat(o){
  const u = Object.assign({}, o.uniforms||{});
  u.uTime=U.uTime; u.uCam=U.uCam; u.uFogColor=U.uFogColor; u.uFogNear=U.uFogNear; u.uFogFar=U.uFogFar;
  return new THREE.ShaderMaterial({ vertexShader:o.vs, fragmentShader:o.fs, uniforms:u,
    transparent:o.transparent||false, depthWrite:o.depthWrite!==undefined?o.depthWrite:true,
    depthTest:o.depthTest!==undefined?o.depthTest:true, blending:o.blending||THREE.NormalBlending,
    side:o.side||THREE.FrontSide, polygonOffset:o.polygonOffset||false,
    polygonOffsetFactor:o.polygonOffsetFactor||0, polygonOffsetUnits:o.polygonOffsetUnits||0 });
}

// ============================================================
// ROUTE — one coherent representation drives everything
// ============================================================
const G = 56;                       // grid pitch (street centre to street centre)
const STREET_HALF = 8;              // street half-width (road + sidewalks)
const NODES = [ [5,15],[5,12],[6,12],[6,10],[4,10],[4,8],[7,8],[7,7],[9,7],[9,5],
                [7,5],[7,3],[8,3],[8,1],[10,1],[10,3],[12,3],[12,6],[12,8],[11,8] ];
const NODEH = [ 0,0,0,0,0,0,0,0,1,10, 18,26,29,34,29,14,3.5,1.2,1.2,1.2 ];
// seeded jitter of interior nodes (route stays in its streets; layout breathes with the seed)
const nPts = NODES.map((n,i)=>{
  let jx=0,jz=0;
  if(i>0 && i<NODES.length-1 && i!==13){ jx=rr(-2.4,2.4); jz=rr(-2.4,2.4); }
  return new THREE.Vector3(n[0]*G+jx, NODEH[i], n[1]*G+jz);
});
// rounded-corner polyline for the spline
const plPts=[]; const nodePl=[];   // nodePl[i] = index into plPts nearest node i
{
  const RC=15;
  for(let i=0;i<nPts.length;i++){
    const P=nPts[i];
    if(i===0){ plPts.push(P.clone()); nodePl.push(plPts.length-1); continue; }
    const Q=nPts[i-1];
    const seg=new THREE.Vector3().subVectors(P,Q); const segL=Math.hypot(seg.x,seg.z);
    const dirIn=new THREE.Vector3(seg.x/segL,0,seg.z/segL);
    const rc=Math.min(RC, segL*0.38);
    // straight subdivision from previous exit to this entry
    const prevExit = plPts[plPts.length-1];
    const entry = new THREE.Vector3(P.x-dirIn.x*rc, 0, P.z-dirIn.z*rc);
    entry.y = THREE.MathUtils.lerp(Q.y,P.y, 1-rc/segL);
    const span = new THREE.Vector3().subVectors(entry, prevExit); const spanL=Math.hypot(span.x,span.z);
    const steps=Math.max(1,Math.round(spanL/34));
    for(let s2=1;s2<steps;s2++){
      const t=s2/steps;
      plPts.push(new THREE.Vector3(prevExit.x+span.x*t, prevExit.y+(entry.y-prevExit.y)*t, prevExit.z+span.z*t));
    }
    plPts.push(entry);
    if(i===nPts.length-1){ plPts.push(P.clone()); nodePl.push(plPts.length-1); break; }
    // corner: entry, pulled midpoint, exit
    const N2=nPts[i+1];
    const seg2=new THREE.Vector3().subVectors(N2,P); const seg2L=Math.hypot(seg2.x,seg2.z);
    const dirOut=new THREE.Vector3(seg2.x/seg2L,0,seg2.z/seg2L);
    const rc2=Math.min(RC, seg2L*0.38);
    const exit=new THREE.Vector3(P.x+dirOut.x*rc2, 0, P.z+dirOut.z*rc2);
    exit.y = THREE.MathUtils.lerp(P.y,N2.y, rc2/seg2L);
    const mid=new THREE.Vector3((entry.x+exit.x)/2,(entry.y+exit.y)/2,(entry.z+exit.z)/2).lerp(P,0.55);
    plPts.push(mid); nodePl.push(plPts.length-1);
    plPts.push(exit);
  }
}
const routeCurve = new THREE.CatmullRomCurve3(plPts, false, 'centripetal');
const ROUTE_LEN = routeCurve.getLength();
const NF = Math.ceil(ROUTE_LEN/0.7);
const STEP = ROUTE_LEN/NF;
const rPts = routeCurve.getSpacedPoints(NF);
const FR = { x:new Float32Array(NF+1), y:new Float32Array(NF+1), z:new Float32Array(NF+1),
             tx:new Float32Array(NF+1), ty:new Float32Array(NF+1), tz:new Float32Array(NF+1),
             lx:new Float32Array(NF+1), lz:new Float32Array(NF+1), k:new Float32Array(NF+1) };
{
  for(let i=0;i<=NF;i++){ FR.x[i]=rPts[i].x; FR.y[i]=rPts[i].y; FR.z[i]=rPts[i].z; }
  const yawArr=new Float32Array(NF+1);
  for(let i=0;i<=NF;i++){
    const a=Math.max(0,i-1), b=Math.min(NF,i+1);
    let tx=FR.x[b]-FR.x[a], ty=FR.y[b]-FR.y[a], tz=FR.z[b]-FR.z[a];
    const l=Math.hypot(tx,ty,tz)||1; tx/=l; ty/=l; tz/=l;
    FR.tx[i]=tx; FR.ty[i]=ty; FR.tz[i]=tz;
    const hl=Math.hypot(tx,tz)||1;
    FR.lx[i]=tz/hl; FR.lz[i]=-tx/hl;      // left = up x tangent
    yawArr[i]=Math.atan2(-tx,-tz);
  }
  const wrapPi = a=>{ while(a>Math.PI)a-=2*Math.PI; while(a<-Math.PI)a+=2*Math.PI; return a; };
  const kRaw=new Float32Array(NF+1);
  for(let i=1;i<NF;i++) kRaw[i]=wrapPi(yawArr[i+1]-yawArr[i-1])/(2*STEP);
  for(let i=0;i<=NF;i++){                 // box blur for calm banking
    let s=0,n=0; for(let j=Math.max(0,i-12);j<=Math.min(NF,i+12);j++){ s+=kRaw[j]; n++; }
    FR.k[i]=s/n;
  }
}
const _fr = {};
function getFrame(d){
  d = clamp(d, 0, ROUTE_LEN-0.001);
  const f=d/STEP, i=Math.min(NF-1,Math.floor(f)), t=f-i;
  _fr.x=FR.x[i]+(FR.x[i+1]-FR.x[i])*t; _fr.y=FR.y[i]+(FR.y[i+1]-FR.y[i])*t; _fr.z=FR.z[i]+(FR.z[i+1]-FR.z[i])*t;
  _fr.tx=FR.tx[i]+(FR.tx[i+1]-FR.tx[i])*t; _fr.ty=FR.ty[i]+(FR.ty[i+1]-FR.ty[i])*t; _fr.tz=FR.tz[i]+(FR.tz[i+1]-FR.tz[i])*t;
  _fr.lx=FR.lx[i]+(FR.lx[i+1]-FR.lx[i])*t; _fr.lz=FR.lz[i]+(FR.lz[i+1]-FR.lz[i])*t;
  _fr.k=FR.k[i]+(FR.k[i+1]-FR.k[i])*t;
  return _fr;
}
// distance to route (2D spatial hash of frames) — the protected-corridor test
const rHash=new Map();
{
  for(let i=0;i<=NF;i+=3){
    const key=(Math.floor(FR.x[i]/16)+512)*4096+(Math.floor(FR.z[i]/16)+512);
    let a=rHash.get(key); if(!a){ a=[]; rHash.set(key,a); } a.push(i);
  }
}
const _q={d:1e9,h:0,i:0};
function distToRoute(x,z){
  _q.d=1e9;
  const cx=Math.floor(x/16)+512, cz=Math.floor(z/16)+512;
  for(let a=-1;a<=1;a++) for(let b=-1;b<=1;b++){
    const lst=rHash.get((cx+a)*4096+(cz+b)); if(!lst) continue;
    for(let m=0;m<lst.length;m++){ const i=lst[m];
      const dx=FR.x[i]-x, dz=FR.z[i]-z, dd=Math.hypot(dx,dz);
      if(dd<_q.d){ _q.d=dd; _q.h=FR.y[i]; _q.i=i; }
    }
  }
  return _q;
}
// clearance test for ground objects: keep 2D distance OR vertical separation
function corridorClear(x,z,margin,y0,y1){
  const q=distToRoute(x,z);
  if(q.d>margin) return true;
  if(y1!==undefined && (y1<q.h-1 || y0>q.h+5)) return true;
  return false;
}
// cumulative route distance at each design node
const nodeD = NODES.map((n,i)=>{
  const px=nPts[i].x, pz=nPts[i].z; let best=1e9,bd=0;
  for(let f=0;f<=NF;f+=2){ const dd=(FR.x[f]-px)**2+(FR.z[f]-pz)**2; if(dd<best){ best=dd; bd=f*STEP; } }
  return bd;
});
const D_TRAM=nodeD[5], D_CLIMB=nodeD[8], D_PEAK=nodeD[13], D_FLOOD=nodeD[16], D_END=ROUTE_LEN;
const startD=clamp(Number.parseFloat(qs.get('d'))||6,0,ROUTE_LEN-40);

// ============================================================
// GEOMETRY BUILDERS
// ============================================================
function Builder(ext){ return { p:[], n:[], c:[], u:ext?[]:null, i4:ext?[]:null, k:ext?[]:null, t:ext?[]:null, idx:[], vc:0, ext:!!ext }; }
function face(B,pts,nrm,colr,uvfn,kind,tint,inf){
  for(let m=0;m<4;m++){ const p=pts[m];
    B.p.push(p[0],p[1],p[2]); B.n.push(nrm[0],nrm[1],nrm[2]); B.c.push(colr.r,colr.g,colr.b);
    if(B.ext){ const uv=uvfn(p); B.u.push(uv[0],uv[1]);
      B.i4.push(inf[0],inf[1],inf[2],inf[3]); B.k.push(kind); B.t.push(tint.r,tint.g,tint.b); } }
  B.idx.push(B.vc,B.vc+1,B.vc+2, B.vc,B.vc+2,B.vc+3); B.vc+=4;
}
const INF0=[3,3,0,0];
// kinds: 0 solid, 1 windows, 2 glowing storefront, 3 panel/concrete, 4 roll door, 5 roof
function box(B,x0,y0,z0,x1,y1,z1,o){
  o=o||{};
  const c=o.c||BLACK, ct=o.cTop||c, k=o.kind||0, kt=(o.kindTop!==undefined)?o.kindTop:5;
  const tn=o.tint||BLACK, inf=o.inf||INF0;
  const kPX=(o.kPX!==undefined)?o.kPX:k, kNX=(o.kNX!==undefined)?o.kNX:k;
  const kPZ=(o.kPZ!==undefined)?o.kPZ:k, kNZ=(o.kNZ!==undefined)?o.kNZ:k;
  if(!o.noPX) face(B,[[x1,y0,z1],[x1,y0,z0],[x1,y1,z0],[x1,y1,z1]],[1,0,0],c,p=>[p[2],p[1]],kPX,tn,inf);
  if(!o.noNX) face(B,[[x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0]],[-1,0,0],c,p=>[p[2],p[1]],kNX,tn,inf);
  if(!o.noPZ) face(B,[[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]],[0,0,1],c,p=>[p[0],p[1]],kPZ,tn,inf);
  if(!o.noNZ) face(B,[[x1,y0,z0],[x0,y0,z0],[x0,y1,z0],[x1,y1,z0]],[0,0,-1],c,p=>[p[0],p[1]],kNZ,tn,inf);
  if(o.top!==false) face(B,[[x0,y1,z1],[x1,y1,z1],[x1,y1,z0],[x0,y1,z0]],[0,1,0],ct,p=>[p[0],p[2]],kt,tn,inf);
  if(o.bottom) face(B,[[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]],[0,-1,0],c,p=>[p[0],p[2]],0,tn,inf);
}
function buildGeom(B){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(B.p,3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(B.n,3));
  if(B.ext){
    g.setAttribute('aCol', new THREE.Float32BufferAttribute(B.c,3));
    g.setAttribute('aUvm', new THREE.Float32BufferAttribute(B.u,2));
    g.setAttribute('aInf', new THREE.Float32BufferAttribute(B.i4,4));
    g.setAttribute('aKind', new THREE.Float32BufferAttribute(B.k,1));
    g.setAttribute('aTint', new THREE.Float32BufferAttribute(B.t,3));
  } else {
    g.setAttribute('color', new THREE.Float32BufferAttribute(B.c,3));
  }
  g.setIndex(B.idx);
  return g;
}

// facade shader — every building face is drawn by this
const facadeMat = shaderMat({
  vs:`
  attribute vec3 aCol; attribute vec2 aUvm; attribute vec4 aInf; attribute float aKind; attribute vec3 aTint;
  varying vec3 vC; varying vec2 vUvm; varying vec4 vInf; varying float vK; varying vec3 vT;
  varying vec3 vN; varying vec3 vW; varying float vZ;
  void main(){
    vC=aCol; vUvm=aUvm; vInf=aInf; vK=aKind; vT=aTint; vN=normal;
    vec4 wp=modelMatrix*vec4(position,1.0); vW=wp.xyz;
    vec4 mv=viewMatrix*wp; vZ=-mv.z;
    gl_Position=projectionMatrix*mv;
  }`,
  fs:`
  ${GLSL_H}${GLSL_FOG}
  uniform float uTime; uniform vec3 uCam;
  varying vec3 vC; varying vec2 vUvm; varying vec4 vInf; varying float vK; varying vec3 vT;
  varying vec3 vN; varying vec3 vW; varying float vZ;
  void main(){
    vec3 alb=vC; vec3 emi=vec3(0.0); float k=vK;
    float wW=vInf.x, wH=vInf.y, litR=vInf.z, sd=vInf.w;
    if(k>0.5&&k<1.5){
      vec2 g=vUvm/vec2(wW,wH);
      vec2 cell=floor(g); vec2 f=fract(g);
      vec2 gw=fwidth(g);
      float fade=clamp(1.45-max(gw.x,gw.y)*3.2,0.0,1.0);  // stop grid aliasing at range
      float hh=h21(cell+vec2(sd,sd*1.7));
      float winO=step(0.20,f.x)*step(f.x,0.82)*step(0.26,f.y)*step(f.y,0.78);
      float win=step(0.24,f.x)*step(f.x,0.78)*step(0.30,f.y)*step(f.y,0.74);
      float frame=winO-win;
      float lit=step(1.0-litR,hh);
      float rare=step(0.962,h21(cell+vec2(sd*2.3,5.1)));
      float tw=mix(1.0, step(0.35,h21(cell+vec2(floor(uTime*0.12))+vec2(sd,0.0))), rare);
      float fl=mix(1.0, flick(2.0,hh,uTime), step(0.985,hh));
      float bright=0.75+0.85*h21(cell+vec2(3.3,sd));
      float curt=mix(1.0, smoothstep(0.72,0.40,f.y), step(0.62,h21(cell+vec2(2.2,sd))));
      alb=mix(alb, alb*0.35+vec3(0.006,0.009,0.017), win*fade);  // unlit glass still reads
      alb*=1.0+0.30*frame*fade;                                   // sills and reveals
      alb*=0.86+0.14*step(0.10,f.y);                              // floor slab shadow line
      vec3 winGlow=win*lit*tw*fl*vT*bright*curt*0.95;
      vec3 avgGlow=vT*litR*0.36;
      emi+=mix(avgGlow,winGlow,fade);
      alb*=0.92+0.08*sin(cell.x*2.4+sd*9.0);
    } else if(k>1.5&&k<2.5){
      if(wW<1.4){ // signature stripe on towers
        float dashv=step(0.16,fract(vUvm.y/2.3));
        emi+=vT*(0.75+0.3*sin(uTime*0.5+vUvm.y*0.3+sd))*dashv*0.85;
        alb*=0.5;
      } else {   // storefront glass: mullions, transom, dark bays
        float mull=step(0.10,fract(vUvm.x/1.5));
        float trans=1.0-0.6*smoothstep(2.35,2.6,vUvm.y);
        float seg=0.22+0.78*step(0.52,h21(vec2(floor(vUvm.x/3.8),sd)));
        emi+=vT*(0.8+0.22*sin(uTime*0.6+sd*6.0))*mull*trans*seg*0.5;
        alb*=0.42;
      }
    } else if(k>2.5&&k<3.5){
      float sx=step(0.05,fract(vUvm.x/2.6)); float sy=step(0.06,fract(vUvm.y/2.2));
      alb*=0.76+0.24*sx*sy;
    } else if(k>3.5&&k<4.5){
      alb*=0.80+0.20*sin(vUvm.x*7.0);
      alb*=0.72+0.28*smoothstep(0.0,0.7,vUvm.y);
    } else if(k>4.5){
      alb=alb*1.12+vec3(0.008)*n2(vW.xz*0.8);
    }
    vec3 n=normalize(vN);
    float sky=n.y*0.42+0.58;
    vec3 li=vec3(0.055,0.038,0.085)*sky + vec3(0.012,0.010,0.016)*(1.0-sky);
    li+=vec3(0.10,0.14,0.16)*max(dot(n,normalize(vec3(-0.4,1.0,0.25))),0.0)*0.5;
    li+=vec3(0.10,0.05,0.07)*max(dot(n,normalize(vec3(0.6,0.7,-0.4))),0.0)*0.35;
    vec3 c=alb*li*8.5;
    c*=0.62+0.38*smoothstep(0.2,5.5,vW.y - 0.0);
    c+=vec3(0.30,0.17,0.07)*exp(-max(vW.y-0.5,0.0)*0.30)*0.16;
    c+=emi;
    c=mix(c,uFogColor,fogF(vZ));
    gl_FragColor=vec4(c,1.0);
  }`,
});

const POOLS = {};
function defPool(name, geom){ POOLS[name]={ geom, mats:[], cols:[] }; }
const _pm=new THREE.Matrix4(), _pq=new THREE.Quaternion(), _ps=new THREE.Vector3(), _pv=new THREE.Vector3(), _pe=new THREE.Euler();
function addInst(name, px,py,pz, ry, sx,sy,sz, c){
  const P=POOLS[name];
  _pe.set(0,ry,0); _pq.setFromEuler(_pe);
  _pm.compose(_pv.set(px,py,pz), _pq, _ps.set(sx,sy,sz));
  P.mats.push(_pm.clone()); P.cols.push(c);
}
const _sv=new THREE.Vector3(), _sd=new THREE.Vector3(), UPV=new THREE.Vector3(0,1,0);
function strut(name,ax,ay,az,bx,by,bz,t,c){
  const P=POOLS[name];
  _sd.set(bx-ax,by-ay,bz-az); const l=_sd.length(); if(l<0.01) return;
  _pq.setFromUnitVectors(UPV,_sd.normalize());
  _pm.compose(_sv.set(ax,ay,az), _pq, _ps.set(t,l,t));
  P.mats.push(_pm.clone()); P.cols.push(c);
}

function frontPoint(r,front,t,off){

// shrink a parcel rect until it clears the protected corridor
function fitRect(r){
  let need=0;
  for(const [px,pz] of [[r.x0,r.z0],[r.x1,r.z0],[r.x0,r.z1],[r.x1,r.z1],
      [(r.x0+r.x1)/2,r.z0],[(r.x0+r.x1)/2,r.z1],[r.x0,(r.z0+r.z1)/2],[r.x1,(r.z0+r.z1)/2]]){
    const q=distToRoute(px,pz);
    if(q.h<3.5) need=Math.max(need, 9.0-q.d);
  }
  if(need>0){ r={x0:r.x0+need,z0:r.z0+need,x1:r.x1-need,z1:r.z1-need}; }
  if(r.x1-r.x0<5||r.z1-r.z0<5) return null;
  return r;
}
function buildParcel(r,district,det,hMul){
  r=fitRect(r); if(!r) return;
  const cx=(r.x0+r.x1)/2, cz=(r.z0+r.z1)/2;
  // designed vista: keep roofs low along the opening sightline to the Raincatcher
  {
    const vsx=cx-280, vsz=cz-834, vd=Math.hypot(vsx,vsz);
    if(vd<790 && vsz<0){
      const dA=Math.abs(Math.atan2(vsx,-vsz)-0.213);
      if(dA<0.11){ hMul*=0.5; if(vd<470){ district='south'; hMul*=0.8; } }
      else if(dA<0.19){ hMul*=0.72; if(vd<470) district='south'; }
    }
  }
  const B=chunkFor(cx,cz);
  // face the street nearest the route
  let front=0,best=1e9;
  const mids=[[cx,r.z0-1],[r.x1+1,cz],[cx,r.z1+1],[r.x0-1,cz]];
  for(let f2=0;f2<4;f2++){ const q=distToRoute(mids[f2][0],mids[f2][1]); if(q.d<best){best=q.d;front=f2;} }
  const isCorner=chance(0.3);
  const arch=pickArch(district,isCorner);
  const st=newStyle(district); st.hMul=hMul*rr(0.85,1.15);
  ARCHS[arch](B,r,front,st,det);
  buildingStats.count++; buildingStats.arch[arch]=(buildingStats.arch[arch]||0)+1;
  if(det>1){ cableAnchors.push({x:r.x0,y:0,z:r.z0}); }
}

    const N2=new THREE.Vector3(tpts[i+1][0],0,tpts[i+1][1]);

let s=startD, speed=0, targetSpeed=9;
let lat=0, latT=0, latV=0;
let yawOff=0, pitOff=0, lastMouse=-10, baseYaw=0, roll=0, ant=0, firstFrame=true;
const keys={};
function restart(){
  s=startD; speed=0; targetSpeed=9; lat=0; latT=0; latV=0;
  yawOff=0; pitOff=0; started=false; holdT=0; ended=false; paused=false; firstFrame=true;
}
window.addEventListener('keydown',(e)=>{
  if(e.code==='Space'){ e.preventDefault(); if(!e.repeat) paused=!paused; return; }
  if(e.code==='KeyR'&&!e.repeat){ restart(); return; }
  keys[e.code]=true;
});
window.addEventListener('keyup',(e)=>{ keys[e.code]=false; });
window.addEventListener('mousemove',(e)=>{
  const mx=e.movementX||0, my=e.movementY||0;
  yawOff=clamp(yawOff-mx*0.0021,-2.6,2.6);
  pitOff=clamp(pitOff-my*0.0019,-1.0,0.9);
  lastMouse=simT;
});
cv.addEventListener('click',()=>{ try{ cv.requestPointerLock&&cv.requestPointerLock(); }catch(e){} });
const wrapPi=a=>{ while(a>Math.PI)a-=2*Math.PI; while(a<-Math.PI)a+=2*Math.PI; return a; };

// chapter fog schedule
const FOGK=[
  [0,               26, 960, col(0x140B20)],
  [D_TRAM*0.85,     23, 780, col(0x150C23)],
  [D_CLIMB,         30, 960, col(0x170D26)],
  [D_PEAK-90,       32,1000, col(0x180E27)],
  [D_PEAK+130,      28, 880, col(0x131024)],
  [D_FLOOD+90,      20, 730, col(0x0F1220)],
  [1e9,             20, 730, col(0x0F1220)],
];
function updateFog(d){
  let a=FOGK[0], b=FOGK[1];
  for(let i=0;i<FOGK.length-1;i++){ if(d>=FOGK[i][0]&&d<FOGK[i+1][0]){ a=FOGK[i]; b=FOGK[i+1]; break; } }
  const t=clamp((d-a[0])/Math.max(1,(b[0]-a[0])),0,1), tt=t*t*(3-2*t);
  U.uFogNear.value=a[1]+(b[1]-a[1])*tt;
  U.uFogFar.value=a[2]+(b[2]-a[2])*tt;
  U.uFogColor.value.copy(a[3]).lerp(b[3],tt);
  scene.fog.color.copy(U.uFogColor.value);
  scene.fog.near=U.uFogNear.value; scene.fog.far=U.uFogFar.value;
}

// ============================================================
// MAIN LOOP
// ============================================================
let lastNow=performance.now();
const _dg=dynGlow.pos.array, _ds=dynStreak.pos.array;
function setDyn(arr,i,x,y,z){ arr[i*3]=x; arr[i*3+1]=y; arr[i*3+2]=z; }
renderer.setAnimationLoop(()=>{
  const now=performance.now();
  const dt=Math.min((now-lastNow)/1000,0.05); lastNow=now;
  simT+=dt; U.uTime.value=simT; gradePass.uniforms.uT.value=simT;

  // ---- ride state ----
  if(!started){ holdT+=dt; if(holdT>=1.05) started=true; }
  if(keys['KeyW']) targetSpeed=clamp(targetSpeed+7.5*dt,4,18);
  if(keys['KeyS']) targetSpeed=clamp(targetSpeed-9*dt,4,18);
  const steer=(keys['KeyA']?1:0)-(keys['KeyD']?1:0);  // lat runs along the LEFT vector
  if(steer) latT=clamp(latT+steer*5.2*dt,-2.55,2.55);
  else latT*=Math.exp(-dt*0.12);
  const f=getFrame(s);
  if(started&&!paused){
    const gradeMul=clamp(1-f.ty*3.2,0.55,1.28);
    const tgt=ended?0:targetSpeed*gradeMul;
    speed+=(tgt-speed)*(1-Math.exp(-dt*0.85));
    s+=speed*dt;
    if(s>ROUTE_LEN-24) ended=true;
  }
  const nl=lat+(latT-lat)*(1-Math.exp(-dt*5));
  latV=latV+(((nl-lat)/Math.max(dt,0.001))-latV)*0.3; lat=nl;

  // ---- camera ----
  const yawTgt=Math.atan2(-f.tx,-f.tz);
  if(firstFrame){ baseYaw=yawTgt; firstFrame=false; }
  baseYaw+=wrapPi(yawTgt-baseYaw)*(1-Math.exp(-dt*7));
  ant+=(clamp(f.k*speed*0.9,-0.15,0.15)-ant)*(1-Math.exp(-dt*3));
  const rollTgt=clamp(Math.atan(f.k*speed*speed/9.81)*0.5,-0.2,0.2)+latV*0.028;
  roll+=(rollTgt-roll)*(1-Math.exp(-dt*4));
  const idle=simT-lastMouse>1.6;
  const dec=Math.exp(-dt*(idle?1.0:0.22));
  yawOff*=dec; pitOff*=dec;
  camera.rotation.order='YXZ';
  // designed opening: hold the Raincatcher in the upper central third, ease out with distance
  const openBias=Math.exp(-Math.max(0,s-startD)*0.02);
  camera.rotation.y=baseYaw+ant+yawOff-0.15*openBias+Math.sin(simT*1.15)*0.005*(speed/9);
  camera.rotation.x=Math.asin(clamp(f.ty,-1,1))*0.72-0.025+0.03*openBias+pitOff;
  camera.rotation.z=-roll;
  camera.position.set(f.x+f.lx*lat, f.y+1.55, f.z+f.lz*lat);
  U.uCam.value.copy(camera.position);
  skyMesh.position.copy(camera.position);
  skyMesh.material.uniforms.uLmAz.value=Math.atan2(56-camera.position.z,448-camera.position.x);
  updateFog(s);

  // ---- ambient life (never stops) ----
  if(turbineRotor) turbineRotor.rotation.y=simT*0.55;
  // tram
  {
    const st=tramCyc(simT+tramT0);
    const t01=clamp(st.d/tramLen,0,0.9999);
    const p=tramCurve.getPointAt(t01), tg=tramCurve.getTangentAt(t01);
    tramGrp.position.set(p.x,9.12,p.z);
    tramGrp.rotation.y=Math.atan2(tg.x,tg.z)+ (st.dir<0?Math.PI:0);
    const fw=st.dir<0? tg.clone().negate():tg;
    setDyn(_dg,0,p.x+fw.x*7.7,10.3,p.z+fw.z*7.7);
    setDyn(_dg,1,p.x-fw.x*7.7,10.3,p.z-fw.z*7.7);
  }
  // vehicles
  vehicles.forEach((v,i)=>{
    const travel=((v.phase+simT*v.v)%v.span+v.span)%v.span;
    const c2=v.dir>0? v.a+travel : v.b-travel;
    let px,pz,fx2,fz2;
    if(v.axis==='z'){ px=v.fixed; pz=c2; fx2=0; fz2=v.dir; }
    else { px=c2; pz=v.fixed; fx2=v.dir; fz2=0; }
    v.grp.position.set(px,0.05,pz);
    v.grp.rotation.y=Math.atan2(fx2,fz2)+Math.PI;
    const base=2+i*4;
    setDyn(_dg,base,  px+fx2*2.4-fz2*0.7, 0.85, pz+fz2*2.4+fx2*0.7);
    setDyn(_dg,base+1,px+fx2*2.4+fz2*0.7, 0.85, pz+fz2*2.4-fx2*0.7);
    setDyn(_dg,base+2,px-fx2*2.3-fz2*0.6, 0.9,  pz-fz2*2.3+fx2*0.6);
    setDyn(_dg,base+3,px-fx2*2.3+fz2*0.6, 0.9,  pz-fz2*2.3-fx2*0.6);
    setDyn(_ds,i, px+fx2*7.5, 0.12, pz+fz2*7.5);
  });
  // drones
  drones.forEach((d2,i)=>{
    const a2=simT*d2.w+d2.ph;
    const px=d2.cx+Math.cos(a2)*d2.rx, pz=d2.cz+Math.sin(a2)*d2.rz;
    const py=d2.h+Math.sin(simT*0.5+d2.ph)*d2.bob;
    d2.grp.position.set(px,py,pz);
    const vx=-Math.sin(a2)*d2.rx*d2.w, vz2=Math.cos(a2)*d2.rz*d2.w;
    d2.grp.rotation.y=Math.atan2(-vx,-vz2);
    d2.grp.rotation.z=Math.sin(simT*0.8+d2.ph)*0.08;
    const base=26+i*2;
    setDyn(_dg,base,px,py-0.15,pz);
    setDyn(_dg,base+1,px,py+0.22,pz);
  });
  dynGlow.pos.needsUpdate=true; dynStreak.pos.needsUpdate=true;
  // splashes recycle through the world ahead of the rider
  {
    const arr=splashPos.array;
    for(let i=40;i<SPLASH_N;i++){
      let sd=splashD[i];
      while(sd<s-16) sd+=86;
      while(sd>s+70) sd-=86;
      if(sd!==splashD[i]){ splashD[i]=sd; splashLat[i]=(RF()*2-1)*4.4; }
      const fd=getFrame(sd);
      arr[i*3]=fd.x+fd.lx*splashLat[i]; arr[i*3+1]=fd.y+0.06; arr[i*3+2]=fd.z+fd.lz*splashLat[i];
    }
    splashPos.needsUpdate=true;
  }
  composer.render();
});

// resize
window.addEventListener('resize',()=>{
  const w=window.innerWidth,h=window.innerHeight;
  camera.aspect=w/h; camera.updateProjectionMatrix();
  renderer.setSize(w,h);
  composer.setSize(w,h);
});
</script>
