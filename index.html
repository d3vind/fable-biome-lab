<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunscar Passage</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#1A0830; }
  canvas { display:block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';

/* ============================================================
   SUNSCAR PASSAGE — a seeded corridor through Red Canyon
   Utah gravel at magic hour, ten years after the last human.
   One string seed drives the whole world.
   ============================================================ */

const WORLD_SEED = 'SUNSCAR-PASSAGE-01';

// ---------- seeded PRNG (string -> streams). No Math.random. ----------
function xmur3(str){ let h=1779033703^str.length;
  for(let i=0;i<str.length;i++){ h=Math.imul(h^str.charCodeAt(i),3432918353); h=h<<13|h>>>19; }
  return function(){ h=Math.imul(h^(h>>>16),2246822507); h=Math.imul(h^(h>>>13),3266489909); return (h^=h>>>16)>>>0; }; }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const seedGen = xmur3(WORLD_SEED);
const R  = mulberry32(seedGen());   // world-construction stream
const RT = mulberry32(seedGen());   // runtime stream (pebble recycling)
const rr = (a,b)=>a+(b-a)*R();
const ri = (a,b)=>Math.floor(a+(b-a+1)*R());
const pick = a=>a[Math.floor(R()*a.length)];
const clamp = (x,a,b)=>Math.min(b,Math.max(a,x));
const lerp = (a,b,t)=>a+(b-a)*t;
const smooth = (a,b,x)=>{ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };

// value noise on the build stream (frozen tables so it is seed-stable)
const NTAB = new Float32Array(512); for(let i=0;i<512;i++) NTAB[i]=R();
function n1(x){ const i=Math.floor(x), f=x-i, u=f*f*(3-2*f);
  const a=NTAB[((i%512)+512)%512], b=NTAB[(((i+1)%512)+512)%512]; return a+(b-a)*u; }
function fbm1(x){ return n1(x)*0.62 + n1(x*2.13+7.7)*0.26 + n1(x*4.71+19.3)*0.12; }

// ---------- palette (Red Canyon, locked to magic hour) ----------
const PAL = {
  zenith:0x1A0830, magenta:0x34104A, coral:0xB83A56, orange:0xE8693E, peach:0xF4945A,
  groundA:0x8A4A2B, groundB:0x6E3A21, road:0x5E331D, roadEdge:0x38200F,
  dust:0xC97B4A, rock:0x7C3A26, rockDark:0x4A2014, rim:0xF4945A,
  sage:0x4A4A38, sagePurple:0x4E3A50, spire:0x1E0E14,
  cyan:0x46E0D4, magentaC:0xE04ACF,
  duskFog:0x6A2C50, glowFog:0xE8693E,
};
const col = h=>new THREE.Color(h);

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 1.75));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;   // deliberate: flat saturated illustration, not film
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = col(PAL.magenta);
const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 9000);

// ---------- shared uniforms + GLSL ----------
const U = {
  uTime:{value:0}, uCam:{value:new THREE.Vector3()},
  uSunDir:{value:new THREE.Vector3(0,0,-1)},         // set after the route is generated
  uDusk:{value:col(PAL.duskFog)}, uGlow:{value:col(PAL.glowFog)},
};
const GLSL_H = `
float h11(float p){ vec3 q=fract(vec3(p)*vec3(0.1031,0.1030,0.0973)); q+=dot(q,q.yzx+33.33); return fract((q.x+q.y)*q.z); }
float h21(vec2 p){ vec3 q=fract(vec3(p.xyx)*vec3(0.1031,0.1030,0.0973)); q+=dot(q,q.yzx+33.33); return fract((q.x+q.y)*q.z); }
float n2(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f);
  float a=h21(i),b=h21(i+vec2(1.0,0.0)),c=h21(i+vec2(0.0,1.0)),d=h21(i+vec2(1.0,1.0));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y); }
`;
const GLSL_FOG = `
uniform vec3 uCam; uniform vec3 uSunDir; uniform vec3 uDusk; uniform vec3 uGlow;
float fogAmt(float dist){ return 1.0-exp(-dist*0.00115); }
vec3 fogTint(vec3 wp){
  vec3 dir=normalize(wp-uCam);
  float toSun=max(dot(normalize(vec3(dir.x,0.0,dir.z)),uSunDir),0.0);
  float glow=pow(toSun,3.0);
  return mix(uDusk,uGlow,glow*0.75);
}
vec3 applyFog(vec3 c, vec3 wp){
  float d=distance(wp,uCam);
  return mix(c, fogTint(wp), fogAmt(d));
}
`;
function shaderMat(o){
  const u=Object.assign({},o.uniforms||{});
  u.uTime=U.uTime; u.uCam=U.uCam; u.uSunDir=U.uSunDir; u.uDusk=U.uDusk; u.uGlow=U.uGlow;
  return new THREE.ShaderMaterial({ vertexShader:o.vs, fragmentShader:o.fs, uniforms:u,
    transparent:!!o.transparent, depthWrite:o.depthWrite!==undefined?o.depthWrite:true,
    depthTest:o.depthTest!==undefined?o.depthTest:true, blending:o.blending||THREE.NormalBlending,
    side:o.side||THREE.FrontSide, vertexColors:!!o.vertexColors });
}

// ============================================================
// ROUTE — five phases, one real fork, all structure from the seed
// ============================================================
const TOTAL = rr(2150, 2600);              // metres of spine
let fr=[rr(0.16,0.21), rr(0.15,0.20), rr(0.21,0.26), rr(0.21,0.26)];
{ const s=fr[0]+fr[1]+fr[2]+fr[3]; const p5=1-s;
  if(p5<0.13){ const k=(1-0.14)/s; fr=fr.map(v=>v*k); } }
const SB=[0, fr[0]*TOTAL, (fr[0]+fr[1])*TOTAL, (fr[0]+fr[1]+fr[2])*TOTAL,
          (fr[0]+fr[1]+fr[2]+fr[3])*TOTAL, TOTAL];   // phase boundaries
const PHASES=['open','passage','mesa','climb','exhale'];
function phaseOf(s){ for(let i=4;i>=0;i--) if(s>=SB[i]) return PHASES[Math.min(i,4)]; return PHASES[0]; }
// fork lives inside the mesa phase
const S_FORK = SB[2]+ (SB[3]-SB[2])*rr(0.10,0.18);
const S_JOIN = S_FORK + rr(260,330);
// climb crest, where the arch waits
const S_CREST = SB[3] + (SB[4]-SB[3])*rr(0.60,0.75);
const CLIMB_H = rr(22,30);
function evalH(s){
  let h = fbm1(s*0.004+3.1)*4.4 - 2.2;                    // gentle rolls all through
  h += smooth(SB[1],SB[2],s)*-2.5;                        // passage dips slightly
  h += smooth(SB[3],S_CREST,s)*CLIMB_H;                   // the long crested climb
  h -= smooth(S_CREST+30,SB[5]-60,s)*(CLIMB_H*0.55);      // exhale descent to the viewpoint
  return h;
}
// spine points: heading walk with phase-shaped curvature
const spinePts=[]; const spineS=[];
{
  let x=0,z=0,heading=0; const STEP=40;
  // per-phase turn character (radians per 40 m step)
  const turnAmp=[rr(0.05,0.09), rr(0.10,0.16), rr(0.05,0.10), rr(0.05,0.08), rr(0.02,0.05)];
  let wob=R()*10;
  for(let s=0;s<=TOTAL+STEP;s+=STEP){
    spinePts.push(new THREE.Vector3(x,evalH(Math.min(s,TOTAL)),z));
    spineS.push(Math.min(s,TOTAL));
    const ph=PHASES.indexOf(phaseOf(Math.min(s,TOTAL)));
    let turn=(fbm1(s*0.011+wob)-0.5)*2*turnAmp[ph];
    // drift right through the mesa, come back through the climb —
    // so the left fork genuinely skirts closer to the arch's ridge
    turn+= ph===2?0.020 : ph===3?-0.014 : 0.0;
    heading+=turn;
    x+=Math.sin(heading)*STEP; z-=Math.cos(heading)*STEP;
  }
}
// index helpers on the spine
function spineIdx(s){ return clamp(Math.round(s/40),0,spinePts.length-1); }
function spinePos(s){
  const i=clamp(s/40,0,spinePts.length-1.001), i0=Math.floor(i), t=i-i0;
  return spinePts[i0].clone().lerp(spinePts[Math.min(i0+1,spinePts.length-1)],t);
}
function spineLeft(s){
  const a=spinePos(Math.max(0,s-8)), b=spinePos(Math.min(TOTAL,s+8));
  const tx=b.x-a.x, tz=b.z-a.z, l=Math.hypot(tx,tz)||1;
  return new THREE.Vector3(tz/l,0,-tx/l);
}
// branch bulges: left skirts the arch side, right loops behind the balanced rock
const AMP_L=rr(30,48), AMP_R=-rr(46,72);
function branchPts(amp){
  const out=[]; const i0=spineIdx(S_FORK), i1=spineIdx(S_JOIN);
  for(let i=i0;i<=i1;i++){
    const t=(i-i0)/(i1-i0);
    const off=Math.pow(Math.sin(t*Math.PI),1.6)*amp*(0.85+0.3*n1(i*0.7+amp));
    const p=spinePts[i].clone().addScaledVector(spineLeft(spineS[i]),off);
    out.push(p);
  }
  return out;
}
function fullRoute(amp){
  const i0=spineIdx(S_FORK), i1=spineIdx(S_JOIN);
  const pts=[...spinePts.slice(0,i0), ...branchPts(amp), ...spinePts.slice(i1+1)];
  return new THREE.CatmullRomCurve3(pts,false,'centripetal');
}
const curveL=fullRoute(AMP_L), curveR=fullRoute(AMP_R);
function buildFrames(curve){
  const len=curve.getLength(); const N=Math.ceil(len/1.0); const step=len/N;
  const p=curve.getSpacedPoints(N);
  const F={x:new Float32Array(N+1),y:new Float32Array(N+1),z:new Float32Array(N+1),
           tx:new Float32Array(N+1),tz:new Float32Array(N+1),
           lx:new Float32Array(N+1),lz:new Float32Array(N+1),k:new Float32Array(N+1),
           len,step,N};
  for(let i=0;i<=N;i++){ F.x[i]=p[i].x; F.y[i]=p[i].y; F.z[i]=p[i].z; }
  const yaw=new Float32Array(N+1);
  for(let i=0;i<=N;i++){
    const a=Math.max(0,i-1), b=Math.min(N,i+1);
    let tx=F.x[b]-F.x[a], tz=F.z[b]-F.z[a]; const l=Math.hypot(tx,tz)||1; tx/=l; tz/=l;
    F.tx[i]=tx; F.tz[i]=tz; F.lx[i]=tz; F.lz[i]=-tx;
    yaw[i]=Math.atan2(tx,-tz);
  }
  const wrap=a=>{ while(a>Math.PI)a-=2*Math.PI; while(a<-Math.PI)a+=2*Math.PI; return a; };
  const kR=new Float32Array(N+1);
  for(let i=1;i<N;i++) kR[i]=wrap(yaw[i+1]-yaw[i-1])/(2*step);
  for(let i=0;i<=N;i++){ let s=0,n=0;
    for(let j=Math.max(0,i-10);j<=Math.min(N,i+10);j++){ s+=kR[j]; n++; } F.k[i]=s/n; }
  return F;
}
const FRAMES={ left:buildFrames(curveL), right:buildFrames(curveR) };
const _fr={};
function getFrame(F,s){
  s=clamp(s,0,F.len-0.001);
  const f=s/F.step, i=Math.min(F.N-1,Math.floor(f)), t=f-i;
  _fr.x=F.x[i]+(F.x[i+1]-F.x[i])*t; _fr.y=F.y[i]+(F.y[i+1]-F.y[i])*t; _fr.z=F.z[i]+(F.z[i+1]-F.z[i])*t;
  _fr.tx=F.tx[i]+(F.tx[i+1]-F.tx[i])*t; _fr.tz=F.tz[i]+(F.tz[i+1]-F.tz[i])*t;
  _fr.lx=F.lx[i]+(F.lx[i+1]-F.lx[i])*t; _fr.lz=F.lz[i]+(F.lz[i+1]-F.lz[i])*t;
  _fr.k=F.k[i]+(F.k[i+1]-F.k[i])*t;
  return _fr;
}
// fork arc-length markers on each frame set (branch bulge starts at the same spine point)
function nearestS(F,p){ let best=1e9,bs=0;
  for(let i=0;i<=F.N;i+=4){ const d=(F.x[i]-p.x)**2+(F.z[i]-p.z)**2; if(d<best){best=d;bs=i*F.step;} }
  return bs; }
const forkPos=spinePos(S_FORK), joinPos=spinePos(S_JOIN);
const S_FORK_L=nearestS(FRAMES.left,forkPos),  S_JOIN_L=nearestS(FRAMES.left,joinPos);
const S_FORK_R=nearestS(FRAMES.right,forkPos), S_JOIN_R=nearestS(FRAMES.right,joinPos);
// the dying light lives where the crest points
{
  const a=spinePos(S_CREST-10), b=spinePos(S_CREST+10);
  const tx=b.x-a.x, tz=b.z-a.z, l=Math.hypot(tx,tz)||1;
  U.uSunDir.value.set(tx/l,0,tz/l);
}
const sunAz=Math.atan2(U.uSunDir.value.x,-U.uSunDir.value.z);
const endPos=spinePos(TOTAL-4), endLeft=spineLeft(TOTAL-4);
const endFwd=(()=>{ const a=spinePos(TOTAL-30), b=spinePos(TOTAL-2);
  const v=new THREE.Vector3(b.x-a.x,0,b.z-a.z); return v.normalize(); })();

// ============================================================
// PROOF — runtime-generated instrumentation, no hardcoded counts
// ============================================================
const proofState={ pebbles:0, boulders:0, sage:0, landmarks:{}, terrainHash:'', fps:0,
  drawCalls:0, triangles:0, forkBranch:null, ended:false, audio:{started:false,events:[]} };
let rideS=0, rideBranch='left';
window.__proof = {
  get seed(){ return WORLD_SEED; },
  get pebbles(){ return proofState.pebbles; },
  get boulders(){ return proofState.boulders; },
  get sage(){ return proofState.sage; },
  get landmarks(){ return proofState.landmarks; },
  get terrainPhase(){ return phaseOf(Math.min(rideS,TOTAL)); },
  get forkBranch(){ return proofState.forkBranch; },
  get terrainHash(){ return proofState.terrainHash; },
  get fps(){ return Math.round(proofState.fps*10)/10; },
  get drawCalls(){ return proofState.drawCalls; },
  get triangles(){ return proofState.triangles; },
  get s(){ return Math.round(rideS*10)/10; },
  get routeLength(){ return { left:Math.round(FRAMES.left.len), right:Math.round(FRAMES.right.len) }; },
  get ended(){ return proofState.ended; },
  get audio(){ return proofState.audio; },
};
// FNV-1a over route + terrain arrays — same seed must reproduce this exactly
function fnv(arrs){
  let h=0x811c9dc5;
  for(const a of arrs) for(let i=0;i<a.length;i+=7){
    const v=Math.round(a[i]*100)|0;
    h^=v&0xff; h=Math.imul(h,0x01000193); h^=(v>>>8)&0xff; h=Math.imul(h,0x01000193);
  }
  return (h>>>0).toString(16).padStart(8,'0');
}

// ============================================================
// SKY — magic hour, locked. Two celestial bodies. Sparse stars.
// ============================================================
const C0=(()=>{ const b=new THREE.Box3(); for(const p of spinePts) b.expandByPoint(p);
  const c=new THREE.Vector3(); b.getCenter(c); c.y=0; return c; })();
function azDir(az,el){ return new THREE.Vector3(Math.sin(az)*Math.cos(el),Math.sin(el),-Math.cos(az)*Math.cos(el)); }
const moonDir=azDir(sunAz+0.52,0.34);          // teal moon, upper-right of the glow
const planetDir=azDir(sunAz-0.60,0.24);        // ringed planet, low left — asymmetry sells it
const planetA=new THREE.Vector3().crossVectors(planetDir,new THREE.Vector3(0,1,0)).normalize();
const planetB=new THREE.Vector3().crossVectors(planetA,planetDir).normalize()
  .applyAxisAngle(planetDir,0.5);
{
  const m=shaderMat({
    uniforms:{ uMoon:{value:moonDir}, uPlanet:{value:planetDir},
      uPA:{value:planetA}, uPB:{value:planetB} },
    vs:`varying vec3 vD; void main(){ vD=position;
      vec4 mv=modelViewMatrix*vec4(position,1.0); gl_Position=projectionMatrix*mv; }`,
    fs:`${GLSL_H}
    uniform float uTime; uniform vec3 uSunDir; uniform vec3 uMoon; uniform vec3 uPlanet;
    uniform vec3 uPA; uniform vec3 uPB;
    varying vec3 vD;
    void main(){
      vec3 d=normalize(vD);
      float e=d.y;
      // vertical gradient: peach -> orange -> coral -> magenta -> indigo
      vec3 c=mix(vec3(0.957,0.580,0.353),vec3(0.910,0.412,0.243),smoothstep(0.000,0.055,e));
      c=mix(c,vec3(0.722,0.227,0.337),smoothstep(0.045,0.16,e));
      c=mix(c,vec3(0.204,0.063,0.290),smoothstep(0.14,0.42,e));
      c=mix(c,vec3(0.102,0.031,0.188),smoothstep(0.40,0.75,e));
      // horizon glow toward the dying sun
      float toSun=max(dot(normalize(vec3(d.x,0.0,d.z)),uSunDir),0.0);
      float low=exp(-max(e,0.0)*9.0);
      float glow=pow(toSun,4.0)*low;
      c+=vec3(0.957,0.580,0.353)*glow*0.55;
      c+=vec3(1.0,0.84,0.66)*pow(toSun,26.0)*exp(-max(e,0.0)*16.0)*0.55;
      // coral haze band above the horizon
      float band=exp(-pow((e-0.045)/0.028,2.0));
      c=mix(c,vec3(0.722,0.227,0.337),band*0.34*(0.5+0.5*toSun));
      // high thin cloud drift, slow
      float cl=n2(vec2(atan(d.x,-d.z)*4.0+uTime*0.006, e*34.0));
      cl*=n2(vec2(atan(d.x,-d.z)*9.0-uTime*0.004, e*60.0));
      c=mix(c,vec3(0.35,0.13,0.30),smoothstep(0.42,0.75,cl)*smoothstep(0.06,0.16,e)*smoothstep(0.5,0.25,e)*0.5);
      // stars: sparse, warm-white with a few teal accents, thinning to the glow
      vec3 sp=d*230.0; vec3 cell=floor(sp); vec3 f=fract(sp)-0.5;
      float sh=h21(cell.xy+cell.z*7.31);
      float starVis=smoothstep(0.16,0.34,e)*(1.0-glow*0.95);
      if(sh>0.982){
        float b=(sh-0.982)/0.018;
        float tw=0.75+0.25*sin(uTime*(1.2+b*2.0)+sh*40.0);
        float ds=length(f);
        float star=smoothstep(0.30,0.05,ds)*b*tw*starVis;
        vec3 sc=h21(cell.xy*1.7+3.3)>0.88 ? vec3(0.55,0.95,0.92) : vec3(1.0,0.93,0.82);
        c+=sc*star*0.85;
      }
      // teal moon with craters and a breathing halo (~20 s)
      float md=acos(clamp(dot(d,uMoon),-1.0,1.0));
      float halo=0.058*(1.0+0.26*sin(uTime*0.314159));
      c+=vec3(0.35,0.75,0.72)*exp(-md*md/(halo*halo))*0.22;
      float moon=smoothstep(0.0300,0.0272,md);
      if(moon>0.0){
        vec3 mo=d-uMoon*dot(d,uMoon);
        float cr=n2(mo.xy*220.0+mo.z*140.0+7.0)*0.5+n2(mo.xy*430.0+31.0)*0.5;
        vec3 mc=mix(vec3(0.58,0.93,0.90),vec3(0.36,0.66,0.66),smoothstep(0.42,0.72,cr));
        float limb=smoothstep(0.0300,0.0180,md);
        c=mix(c,mc*(0.75+0.25*limb),moon);
      }
      // small ringed planet, static: the second body
      float pd=acos(clamp(dot(d,uPlanet),-1.0,1.0));
      vec3 po=d-uPlanet*dot(d,uPlanet);
      float pu=dot(po,uPA), pv=dot(po,uPB);
      float ringR=length(vec2(pu,pv*2.6));
      float ring=smoothstep(0.0165,0.0150,ringR)*smoothstep(0.0105,0.0120,ringR);
      float disc=smoothstep(0.0072,0.0060,pd);
      vec3 pc=vec3(0.89,0.78,0.66);
      c=mix(c,pc*0.92,disc);
      c+=pc*ring*0.55*(1.0-disc);
      gl_FragColor=vec4(c,1.0);
    }`,
    side:THREE.BackSide, depthWrite:false,
  });
  const dome=new THREE.Mesh(new THREE.SphereGeometry(6500,48,24),m);
  dome.position.copy(C0); scene.add(dome);
}

// ============================================================
// GROUND — one shallow valley that breathes with the phases
// ============================================================
const groundArrays={pos:null};
let groundHAt=null;
{
  const LAT=[-320,-240,-175,-125,-88,-62,-44,-30,-20,-13,-8,-5,-3.2,-2.1,0,2.1,3.2,5,8,13,20,30,44,62,88,125,175,240,320];
  const STEPG=6;
  const rows=Math.floor(TOTAL/STEPG)+1;
  const P=[],CC=[],IDX=[];
  const passC=s=>smooth(SB[1]-40,SB[1]+50,s)*(1-smooth(SB[2]-60,SB[2]+40,s));
  const mesaC=s=>smooth(SB[2]-30,SB[2]+70,s)*(1-smooth(SB[3]-70,SB[3]+40,s));
  const wallNoise=rr(0,100);
  function groundH(s,lat){
    const a=Math.abs(lat), base=evalH(s);
    const bedY=spinePos(s).y;               // the exact height the road curves through
    const cP=passC(s);
    const ws=lerp(56,15,cP), steep=lerp(0.11,0.46,cP);
    let lift=a>ws? (a-ws)*steep*(0.55+0.55*fbm1(s*0.02+lat*0.05+wallNoise)) : 0;
    lift=Math.min(lift,52);
    let h=base+lift+Math.pow(a/320,2)*16;
    if(lat>58&&lat<175){ // the mesa rides the left through phase three

// THE ROAD — the surface a rider stares at for the whole ride

    vs:`attribute vec2 aUv; varying vec2 vUv; varying vec3 vW;
    void main(){ vUv=aUv; vec4 wp=modelMatrix*vec4(position,1.0); vW=wp.xyz;
      gl_Position=projectionMatrix*viewMatrix*wp; }`,
    fs:`${GLSL_H}${GLSL_FOG}
    uniform float uTime; uniform float uLen; uniform float uSeedOff;
    varying vec2 vUv; varying vec3 vW;
    vec3 pebbleLayer(vec2 p, float size, inout float mask){
      vec2 g=p/size; vec2 cell=floor(g); vec2 f=fract(g)-0.5;
      float rnd=h21(cell+uSeedOff);

      float d=length(f-cj);

      mask=max(mask,m);

      vec3 c=base;

        vec3 pb=pebbleLayer(p+vec2(7.3,3.1),0.048,mB);

const AudioSys={ ctx:null, started:false, master:null, crunchGain:null, crunchBp:null,

      for(let i=0;i<d.length;i++) d[i]=nr()*2-1; }

    const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=420; lp.Q.value=0.6;
    const wg=ctx.createGain(); wg.gain.value=0.11;
    w.connect(lp); lp.connect(wg); wg.connect(master); w.start();
    // canyon-shaped gust resonance
    const w2=ctx.createBufferSource(); w2.buffer=nb; w2.loop=true; w2.playbackRate.value=0.71;
    const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=430; bp.Q.value=5.5;
    const gg=ctx.createGain(); gg.gain.value=0;

    // tire crunch, near-field, pitched by speed

    } else if(type==='chimes'){
      for(let i=0;i<4;i++){
        const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=rrt(1100,2200);
        const g=ctx.createGain(); g.gain.value=0;
        o.connect(g); g.connect(out);
        const ts=t0+i*rrt(0.3,0.9);
        g.gain.setValueAtTime(0,ts); g.gain.linearRampToValueAtTime(0.028,ts+0.01);
        g.gain.exponentialRampToValueAtTime(0.0001,ts+2.6);
        o.start(ts); o.stop(ts+2.8);
      }
    }
  }catch(e){}
}

// ============================================================
// THE RIDER — pure POV, chase camera, momentum, one real choice
// ============================================================
const CRUISE=7.5, VMAX=14, VMIN=2.2;
let v=CRUISE, latT=0, paused=false, rideClock=0;
let forkLocked=false, pendingBranch='left';
let yawOff=0,pitchOff=0,dragging=false,lastMX=0,lastMY=0;
const S_DECIDE=S_FORK_L-95;
const keys={};
function restart(){
  rideS=0; v=CRUISE; latT=0; paused=false; rideClock=0;
  forkLocked=false; pendingBranch='left'; rideBranch='left';
  proofState.forkBranch=null; proofState.ended=false;
  yawOff=0; pitchOff=0;
  birdPlan.active=false; birdPlan.done=false; bird.visible=false;
  for(const e of audioEvents) e.fired=false;
}
window.addEventListener('keydown',(e)=>{
  initAudio();
  if(e.code==='Space'){ e.preventDefault(); if(!e.repeat) paused=!paused; return; }
  if(e.code==='KeyR'&&!e.repeat){ restart(); return; }
  keys[e.code]=true;
});
window.addEventListener('keyup',(e)=>{ keys[e.code]=false; });
window.addEventListener('mousedown',(e)=>{ initAudio(); dragging=true; lastMX=e.clientX; lastMY=e.clientY; });
window.addEventListener('mouseup',()=>{ dragging=false; });
window.addEventListener('mouseleave',()=>{ dragging=false; });
window.addEventListener('mousemove',(e)=>{
  if(!dragging) return;
  yawOff=clamp(yawOff-(e.clientX-lastMX)*0.0022,-0.55,0.55);
  pitchOff=clamp(pitchOff-(e.clientY-lastMY)*0.0018,-0.34,0.20);
  lastMX=e.clientX; lastMY=e.clientY;
});
const camPos=new THREE.Vector3(), camTgt=new THREE.Vector3();
const fwdS=new THREE.Vector3(0,0,-1);
let camInit=false, lean=0;
const frameTimes=[]; let fpsEma=60;
renderer.info.autoReset=false;
let lastNow=performance.now();

renderer.setAnimationLoop(()=>{
  const now=performance.now();
  const rawDt=(now-lastNow)/1000; lastNow=now;
  const dt=Math.min(rawDt,0.05);
  U.uTime.value+=dt; rideClock+=dt;
  frameTimes.push(rawDt*1000); if(frameTimes.length>240) frameTimes.shift();
  fpsEma=fpsEma*0.95+(1/Math.max(rawDt,0.0001))*0.05;
  proofState.fps=fpsEma;

  const F=FRAMES[rideBranch];
  // slope sampled ahead for grade feel (getFrame reuses one object — copy first)
  const fA=getFrame(F,rideS+4); const yAhead=fA.y;
  const f=getFrame(F,rideS);
  const slope=(yAhead-f.y)/4;

  if(!paused&&!proofState.ended){
    if(keys['KeyW']||keys['ArrowUp']) v=Math.min(VMAX,v+4.5*dt);
    else if(keys['KeyS']||keys['ArrowDown']) v=Math.max(VMIN,v-7*dt);
    else v+=(CRUISE-v)*Math.min(1,dt*0.35);
    const steer=((keys['KeyA']||keys['ArrowLeft'])?1:0)-((keys['KeyD']||keys['ArrowRight'])?1:0);
    if(steer) latT=clamp(latT+steer*2.8*dt,-1.25,1.25);
    else latT*=Math.exp(-dt*0.85);
    const vEff=v*(1-clamp(slope*2.0,-0.12,0.16));
    rideS+=vEff*dt;
    // the fork: steering picks it, locked before the geometry divides
    if(!forkLocked){
      if(rideS>S_DECIDE-90&&rideS<S_DECIDE){
        if(latT>0.15) pendingBranch='left';
        else if(latT<-0.15) pendingBranch='right';
      }
      if(rideS>=S_DECIDE){
        forkLocked=true; rideBranch=pendingBranch;
        proofState.forkBranch=pendingBranch;
      }
    }
    const L_end=F.len;
    if(rideS>L_end-26){ v=Math.max(0,v-6*dt); if(v<0.1){ v=0; proofState.ended=true; } }
    rideS=Math.min(rideS,L_end-12);
  }

  // chase camera
  const up=new THREE.Vector3(0,1,0);
  const fwd=new THREE.Vector3(f.tx,0,f.tz);
  fwdS.lerp(fwd,1-Math.exp(-dt*3.2)).normalize();
  const left=new THREE.Vector3(f.lx,0,f.lz);
  const rider=new THREE.Vector3(f.x,f.y,f.z).addScaledVector(left,latT*0.6).add(new THREE.Vector3(0,1.30,0));
  const wantPos=rider.clone().addScaledVector(fwdS,-4.8).addScaledVector(up,1.85);
  if(!camInit){ camPos.copy(wantPos); fwdS.copy(fwd); camInit=true; }
  camPos.lerp(wantPos,1-Math.exp(-dt*5));
  camTgt.copy(rider).addScaledVector(fwdS,8.5).addScaledVector(up,0.55);
  camera.position.copy(camPos);
  // mouse look: rotate the target around the camera, road stays in frame
  const toT=camTgt.clone().sub(camPos);
  toT.applyAxisAngle(up,yawOff);
  const right=new THREE.Vector3().crossVectors(toT,up).normalize();
  toT.applyAxisAngle(right,pitchOff);
  camera.lookAt(camPos.clone().add(toT));
  const leanTgt=clamp(-f.k*v*v*0.05,-0.10,0.10);
  lean+=(leanTgt-lean)*(1-Math.exp(-dt*4));
  camera.rotateZ(lean);
  if(!dragging){ yawOff*=Math.exp(-dt*1.4); pitchOff*=Math.exp(-dt*1.4); }
  U.uCam.value.copy(camera.position);

  // pebbles ride with you on the active branch
  {
    const arr=pebbleMesh.geometry.getAttribute('iOff');
    const a=arr.array;
    for(let i=0;i<pebbleData.s.length;i++){
      let ps=pebbleData.s[i];
      while(ps<rideS-6) ps+=76;
      while(ps>rideS+70) ps-=76;
      if(ps!==pebbleData.s[i]){ pebbleData.s[i]=ps; pebbleData.lat[i]=rrt(-1.9,1.9); }
      const pf=getFrame(F,ps);
      a[i*3]=pf.x+pf.lx*pebbleData.lat[i]; a[i*3+1]=pf.y+0.045; a[i*3+2]=pf.z+pf.lz*pebbleData.lat[i];
    }
    arr.needsUpdate=true;
  }
  // crystal halos breathe on their own 4-second hearts
  for(const cu of crystalUniforms) cu.mat.opacity=0.45+0.4*(0.5+0.5*Math.sin(U.uTime.value*1.5708+cu.phase));
  // the bird
  if(!birdPlan.done&&!birdPlan.active&&rideClock>birdPlan.t){
    birdPlan.active=true; birdPlan.t0=rideClock;
    birdPlan.p0.copy(rider).addScaledVector(fwd,85).addScaledVector(left,95); birdPlan.p0.y=rider.y+rrt(13,20);
    birdPlan.p1.copy(rider).addScaledVector(fwd,35).addScaledVector(left,-95); birdPlan.p1.y=rider.y+rrt(10,16);
    bird.visible=true;
  }
  if(birdPlan.active){
    const u2=(rideClock-birdPlan.t0)/birdPlan.dur;
    if(u2>=1){ birdPlan.active=false; birdPlan.done=true; bird.visible=false; }
    else{
      bird.position.lerpVectors(birdPlan.p0,birdPlan.p1,u2);
      bird.position.y+=Math.sin(u2*Math.PI)*4;
      const dir=birdPlan.p1.clone().sub(birdPlan.p0);
      bird.rotation.y=Math.atan2(dir.x,dir.z);
      const flap=Math.sin(rideClock*7)*0.55;
      bird.userData.w1.rotation.z=flap; bird.userData.w2.rotation.z=-flap;
    }
  }
  // sound follows the ride
  if(AudioSys.ctx){
    const ctx=AudioSys.ctx;
    if(ctx.state==='suspended'){ ctx.resume().catch(()=>{}); }
    const cg=AudioSys.crunchGain;
    const target=(paused||proofState.ended)?0:clamp(v/VMAX,0,1)*0.16;
    cg.gain.setTargetAtTime(target,ctx.currentTime,0.08);
    AudioSys.crunchBp.frequency.setTargetAtTime(1150+v*72,ctx.currentTime,0.1);
    if(ctx.currentTime>AudioSys.nextGust){
      const g=AudioSys.gustGain.gain, t0=ctx.currentTime;
      g.cancelScheduledValues(t0); g.setValueAtTime(0.001,t0);
      g.linearRampToValueAtTime(0.055,t0+1.6); g.exponentialRampToValueAtTime(0.0001,t0+4.2);
      AudioSys.gustBp.frequency.setValueAtTime(360,t0);
      AudioSys.gustBp.frequency.linearRampToValueAtTime(rrt(520,680),t0+4.0);
      AudioSys.nextGust=t0+rrt(8,20);
    }
    for(const e of audioEvents) if(!e.fired&&rideClock>e.t){ e.fired=true; playEvent(e.type); }
  }

  renderer.info.reset();
  renderer.render(scene,camera);
  proofState.drawCalls=renderer.info.render.calls;
  proofState.triangles=renderer.info.render.triangles;
});
window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
</body>
