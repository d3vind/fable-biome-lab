      while (Math.abs(b) < 75) { groundSample(piece, ctxB, best.s, b + 0.4, probe); if (probe.cls !== CLS.FAIRWAY) break; b += 0.4; }
      return { s: best.s, l: (a + b) / 2, runHalf: (b - a) / 2 };
    };
    const list = picked.map(finish);
    return all ? list : list[0];
  };
  const contrastAtAnchor = (pieceIdx, anchor, dyaw, debug) => {
    const piece = app.world.pieces[pieceIdx];
    const out = {};
    const back = Math.max(24, Math.abs(anchor.l) * 1.1);
    const sCam = Math.max(10, anchor.s - back);
    const ctx0 = gatherFeatures(piece, anchor.s - 60, anchor.s + 60);
    groundSample(piece, ctx0, anchor.s, anchor.l, out);
    if (out.cls !== CLS.FAIRWAY) return null;
    const ms = out.ms, ml = out.ml;
    const px2 = -ml, pl2 = ms;
    const phase0 = out.phase;
    groundSample(piece, ctx0, anchor.s + px2 * 0.5, anchor.l + pl2 * 0.5, out);
    const phaseRate = (out.phase - phase0) / 0.5;
    if (!isFinite(phaseRate) || Math.abs(phaseRate) < 0.05) return null;
    const yaw = clamp(Math.atan2(anchor.l, anchor.s - sCam) + dyaw, -0.9, 0.9);
    seekSync(pieceIdx, sCam, 'A', 0, yaw, -0.06);
    const casters = buildCasters(piece, anchor.s - 40, anchor.s + 40, app.sunTo);
    const wv = new THREE.Vector3();
    const shOut = {};
    const sums = [{ v: 0, n: 0 }, { v: 0, n: 0 }];
    const bands = [];
    let prev = null;
    const subs = [];
    for (let k = -6; k <= 6; k++) { subs.push(k + 0.35); subs.push(k + 0.65); }
    for (const kSub of subs) {
      const phaseK = Math.floor(phase0) + kSub;
      const dPerp = (phaseK - phase0) / phaseRate;
      if (anchor.runHalf && Math.abs(dPerp) > anchor.runHalf - 1.0) continue; // interior bands only
      const ss = anchor.s + px2 * dPerp, ll = anchor.l + pl2 * dPerp;
      groundSample(piece, ctx0, ss, ll, out);
      if (out.cls !== CLS.FAIRWAY || out.amp < 0.5) { prev = null; continue; }
      const parity = ((Math.floor(out.phase) % 2) + 2) % 2;
      const loc = slToLocal(piece, ss, ll, 'A');
      pw(piece, loc.x, out.h, loc.z, wv);
      shadeSample(casters, wv.x, wv.y, wv.z, app.sunTo, shOut);
      if (shOut.shade > 0.2 || shOut.dapple > 0.3) { prev = null; continue; }
      const pr = project(piece, ss, ll, 0.04);
      if (pr.behind || pr.x < 12 || pr.x > app.renderer.domElement.width - 12 ||
          pr.y < 12 || pr.y > app.renderer.domElement.height - 12) { prev = null; continue; }
      if (prev && Math.hypot(pr.x - prev.x, pr.y - prev.y) < 4) { prev = pr; continue; }
      prev = pr;
      const patch = readPatch(Math.round(pr.x), Math.round(pr.y), 0);
      if (patch.luma < 0.002) continue;
      sums[parity].v += patch.luma; sums[parity].n++;
      if (debug) bands.push({ k: kSub, parity, luma: +patch.luma.toFixed(4), x: Math.round(pr.x), y: Math.round(pr.y) });
    }
    if (sums[0].n < 2 || sums[1].n < 2) return null;
    const m0 = sums[0].v / sums[0].n, m1 = sums[1].v / sums[1].n;
    const c = Math.abs(m0 - m1) / Math.max(m0, m1, 1e-5);
    return debug ? { c, bands, m0, m1, anchor, sCam, yaw: +yaw.toFixed(2) } : c;
  };
  const stripeContrastOf = (pieceIdx) => {
    const anchors = stripeAnchorOf(pieceIdx, true);
    let singleton = null;
    for (const anchor of anchors) {
      const vals = [];
      for (const dyaw of [-0.28, 0, 0.28]) {
        const c = contrastAtAnchor(pieceIdx, anchor, dyaw, false);
        if (c !== null) vals.push(c);
      }
      if (vals.length >= 2) return Math.min(...vals);   // first well-validated anchor
      if (vals.length === 1 && singleton === null) singleton = vals[0];
    }
    return singleton === null ? 0 : singleton;
  };
  const stripeSweep = () => sweepPiece(1, 260, 1480, 'fairway');
  const sandProbe = (pieceIdx) => {
    const piece = app.world.pieces[pieceIdx];
    const all = [];
    for (const h of piece.F.holes) for (const b of h.bunkers) all.push(b);
    all.sort((a, b2) => Math.abs(a.cl) - Math.abs(b2.cl));
    return all.slice(0, 3);
  };
  const measureValueSeparation = (pieceIdx) => {
    const piece = app.world.pieces[pieceIdx];
    const ranges = [[700, 1500, 'verge'], [260, 1480, 'fairway'], [860, 1320, 'fairway'], [1150, 1430, 'fairway']];
    const [r0, r1, mode] = ranges[pieceIdx];
    let stripe = sweepPiece(pieceIdx, r0, r1, mode);
    if (!stripe && mode === 'fairway') stripe = sweepPiece(pieceIdx, r0, r1, 'verge');
    if (!stripe) stripe = { s: piece.length * 0.5, ratio: 0, road: 0, fwLight: 0, fwDark: 0 };
    let sandLuma = 0, sandRatio = 0;
    for (const b of sandProbe(pieceIdx)) {
      for (const back of [34, 60, 90]) {
        let sView = Math.max(10, b.cs - back);
        if (piece.F.bridge && sView > piece.F.bridge.s0 - 50 && sView < piece.F.bridge.s1 + 10) continue;
        const res = measureAt(pieceIdx, sView, [
          { name: 'road', s: sView + 28, l: 0, dy: 0.06 },
          { name: 'sand', s: b.cs, l: b.cl, dy: 0.05 },
        ]);
        if (validT(res.road) && validT(res.sand) && res.road.luma < 0.09 && res.sand.luma > 0.012) {
          sandLuma = res.sand.luma; sandRatio = res.sand.luma / Math.max(1e-4, res.road.luma);
          break;
        }
      }
      if (sandRatio > 0) break;
    }
    return {
      roadLuma: stripe.road, fairwayLumaLight: stripe.fwLight, fairwayLumaDark: stripe.fwDark,
      sandLuma, ratioToFairwayWorstPhase: stripe.ratio, ratioToSand: sandRatio,
      worstStation: stripe.s,
    };
  };
  const clearanceScan = () => {
    const report = [];
    for (const piece of app.world.pieces) {
      const sunTo = app.sunTo;
      for (const armName of piece.fork ? ['A', 'B'] : ['A']) {
        let minGap = 1e9, viol = 0, cross = 0, samples = 0, minAt = null;
        for (const chunk of piece.chunks) {
          // realized grid: build (or reuse) the chunk's terrain rows
          let st = app.mgr.built.get(piece.idx + ':' + chunk.ci);
          let temp = null;
          if (!st || !st.arr || st.arr.row < st.arr.nRows) {
            temp = { arr: null, s0: chunk.s0, s1: chunk.s1 };
            const ctx2 = gatherFeatures(piece, chunk.s0 - 60, chunk.s1 + 60);
            while (!terrainRows(piece, chunk, ctx2, [], sunTo, temp)) { /* run to completion */ }
            st = temp;
          }
          const frames = armName === 'B' ? piece.fork.armBFrames : piece.frames;
          for (let i = 0; i < frames.length; i++) {
            const f = frames[i];
            const sA = armName === 'B' ? (f.sA !== undefined ? f.sA : null) : f.s;
            if (sA === null || sA < chunk.s0 || sA >= chunk.s1) continue;
            if (onBridge(piece, sA)) continue;  // the ribbon flies the basin
            const bb = piece.F.bridge;
            const abutment = bb && sA > bb.s0 - 3 && sA < bb.s1 + 3; // landing rows:
            // ground legitimately rises to meet the deck; crossings still enforced
            const lB = armName === 'B' ? (f.oA !== undefined ? f.oA : 0) : 0;
            for (let dl = -6.6; dl <= 6.6; dl += 0.55) {
              const l = lB + dl;
              if (Math.abs(l) > 139) continue;
              const ground = realizedHeight(piece, st, sA, l);
              const gap = f.y - ground;
              samples++;
              if (gap < minGap) { minGap = gap; minAt = { s: sA, l }; }
              if (gap < ROAD_SINK_MIN - 0.001 && !abutment) viol++;
              if (Math.abs(dl) <= ROAD_HALF && ground > f.y - 0.05) cross++;
            }
          }
        }
        report.push({ piece: piece.id, arm: armName, minGapM: minGap, violations: viol,
          crossings: cross, samples, minAt });
      }
    }
    return report;
  };
  const finalizeCapsule = () => {
    app.worldTime = 600.0;      // fixed clock: measurements are reproducible
    app.setFlat(false);
    const contrastGraded = [], contrastFlat = [];
    for (let i = 0; i < 4; i++) contrastGraded.push(stripeContrastOf(i));
    app.setFlat(true);          // rebuild under flat neutral daylight
    for (let i = 0; i < 4; i++) contrastFlat.push(stripeContrastOf(i));
    app.setFlat(false);
    for (let i = 0; i < 4; i++) {
      const piece = app.world.pieces[i];
      const vs = measureValueSeparation(i);
      const entry = app.world.capsule[i];
      entry.measured.stripe = {
        bandWidthM: 3.6,
        classesWithStripes: ['fairway', 'firstCut', 'green', 'collar', 'approach', 'tee'],
        contrastGraded: canonNum(contrastGraded[i]),
        contrastFlat: canonNum(contrastFlat[i]),
      };
      entry.measured.valueSeparation = {
        roadLuma: canonNum(vs.roadLuma), fairwayLumaLight: canonNum(vs.fairwayLumaLight),
        fairwayLumaDark: canonNum(vs.fairwayLumaDark), sandLuma: canonNum(vs.sandLuma),
        ratioToFairwayWorstPhase: canonNum(vs.ratioToFairwayWorstPhase), ratioToSand: canonNum(vs.ratioToSand),
      };
      // standard budget at the piece midpoint
      seekSync(i, piece.length / 2, 'A', 0);
      app.renderer.render(app.scene, app.camera);
      const info = app.renderer.info;
      entry.standardBudget = { drawCalls: info.render.calls, triangles: info.render.triangles };
    }
    return JSON.stringify(canonicalize(app.world.capsule), null, 1);
  };
  return {
    seed: SEED, quality: QUALITY, light: Q.light,
    get ready() { return app.ready; },
    world: {
      totalLength: app.world.totalLength,
      pieces: app.world.pieces.map(p => ({ id: p.id, name: p.name, length: p.length,
        worstHeading: p.worstHeading, worstHeadingB: p.worstHeadingB || null })),
      rare: app.world.rare,
    },
    planHashes: app.world.capsule.map(e => ({ id: e.setPieceId, planHash: e.planHash, composition: e.compositionSha256 })),
    seek: seekSync,
    measureAt, stripeSweep, clearanceScan, finalizeCapsule, measureValueSeparation,
    __contrastDebug: (p) => { const a = stripeAnchorOf(p); return a ? contrastAtAnchor(p, a, 0, true) : null; },
    chunkChecksum: (pieceIdx, ci) => {
      const st = app.mgr.built.get(pieceIdx + ':' + ci);
      if (!st || !st.ready || !st.arr) return null;
      let sum = 0;
      const a = st.arr.pos;
      for (let i = 0; i < a.length; i += 7) sum += a[i];
      const c = st.arr.clsGrid;
      let cs = 0;
      for (let i = 0; i < c.length; i++) cs = (cs * 31 + c[i]) >>> 0;
      return { posSum: Math.round(sum * 100) / 100, clsHash: cs, verts: a.length / 3 };
    },
    renderOnce: () => { placeCamera(app, rider); app.renderer.render(app.scene, app.camera); },
    restart: () => restartWorld(app, rider),
    snapshot: () => ({
      renderer: (() => {
        const gl = app.renderer.getContext();
        const ext = gl.getExtension('WEBGL_debug_renderer_info');
        return ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
      })(),
      counts: Object.assign({}, app.counts, {
        birds: app.birds.reduce((a, g) => a + g.plan.count, 0),
        birdGroups: app.birds.length,
        animals: app.animals.length,
        plantsPlanned: app.world.pieces.reduce((a, p) => a + p.plants.filter(x => x.kind !== 'tuft').length, 0),
        tuftsPlanned: app.world.pieces.reduce((a, p) => a + p.plants.filter(x => x.kind === 'tuft').length, 0),
        detailsPlanned: app.world.pieces.reduce((a, p) => a + p.groundDetails.length, 0),
        holes: app.world.pieces.reduce((a, p) => a + p.F.holes.length, 0),
        flagsPlanned: app.world.pieces.reduce((a, p) => a + p.F.flags.length + p.F.farFlags.length, 0),
      }),
      seatErrors: app.proof.seatErrors,
      frame: percentileStats(app.metrics.frameMs),
      slice: percentileStats(app.metrics.sliceMs),
      sliceOverBudget: app.metrics.overBudget,
      sliceTotal: app.metrics.sliceTotal,
      draw: { calls: app.renderer.info.render.calls, triangles: app.renderer.info.render.triangles },
      chunks: { built: app.mgr.built.size, pending: app.mgr.pending() },
      rider: { pieceIdx: rider.pieceIdx, s: rider.s, arm: rider.arm, v: rider.v },
    }),
  };
}

/* ----------------------------------------------------------------- loop ---- */
function main() {
  const app = buildApp();
  const rider = makeRider();
  bindInput(app, rider);
  app.mgr.ensure(rider.pieceIdx, rider.s);
  window.__AZALEA__ = makeQA(app, rider);
  window.__SCENE__ = app.scene;
  window.__APP__ = app;
  app.ready = false;
  document.getElementById('title').classList.add('show');
  let last = performance.now();
  let revealFade = 0;
  const advanceWorld = (dt) => {
    app.time += dt;
    app.worldTime += dt;   // the world never pauses — only the rider does
    const wasReady = app.ready;
    if (!app.ready) {
      app.mgr.work(24);
      if (app.mgr.readyAround(rider.pieceIdx, rider.s)) {
        app.ready = true;
        if (Q.fast) { rider.holding = false; document.getElementById('hud').classList.add('show'); }
      }
    } else {
      app.mgr.ensure(rider.pieceIdx, rider.s);
      app.mgr.work(6);
    }
    updateRider(app, rider, dt);
    ensureCreatures(app, rider);
    updateExposure(app, rider, dt);
    updateSprinklers(app, rider, dt);
    updateAmbience(app, rider, dt);
    const time = app.worldTime;
    sharedUniforms().uTime.value = time;
    placeCamera(app, rider);
    sharedUniforms().uCamPos.value.copy(app.camera.position);
    for (const g of app.birds) updateBirdGroup(app, g, time * 1000);
    for (const m of app.animals) updateAnimal(app, m, dt, rider.s, rider.pieceIdx);
    return wasReady;
  };
  app.advanceWorld = advanceWorld;
  const tick = () => {
    requestAnimationFrame(tick);
    if (app.qaDriving) return;             // QA autopilot owns the clock
    const now = performance.now();
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const wasReady = advanceWorld(dt);
    if (app.ready) {
      app.renderer.render(app.scene, app.camera);
      app.metrics.frameMs.push(performance.now() - now);
      if (!wasReady) setTimeout(() => document.getElementById('title').classList.remove('show'), 3600);
    }
  };
  tick();

  /* QA autopilot: fixed sim steps through the SAME update path, honest
     synced renders. Wall time bound by render throughput, not rAF pacing. */
  window.__AZALEA__.autopilot = async (simSeconds, opts) => {
    const o = opts || {};
    app.qaDriving = true;
    rider.paused = false; rider.holding = false; rider.finished = false;
    rider.dragging = true; rider.look.yaw = o.yaw || 0; rider.look.pitch = o.pitch || 0;
    if (o.keys) rider.keys = o.keys;
    const STEP = 1 / 30;
    const renderEvery = o.renderEvery || 30;
    const gl = app.renderer.getContext();
    const px = new Uint8Array(4);
    const renderMs = [];
    let i = 0, transitions = [], lastPiece = rider.pieceIdx, lastArm = rider.arm;
    for (let t = 0; t < simSeconds; t += STEP, i++) {
      advanceWorld(STEP);
      if (rider.pieceIdx !== lastPiece || rider.arm !== lastArm) {
        transitions.push({ t: Math.round(t), piece: rider.pieceIdx, arm: rider.arm, s: Math.round(rider.s) });
        lastPiece = rider.pieceIdx; lastArm = rider.arm;
      }
      if (i % renderEvery === 0) {
        const t0 = performance.now();
        app.renderer.render(app.scene, app.camera);
        gl.readPixels(2, 2, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); // force sync
        renderMs.push(performance.now() - t0);
        await new Promise(r => setTimeout(r, 0));
        if (o.stopWhenFinished && rider.finished) break;
      }
    }
    app.qaDriving = false;
    renderMs.sort((a, b) => a - b);
    const at = (q) => renderMs.length ? renderMs[Math.min(renderMs.length - 1, Math.floor(q * renderMs.length))] : 0;
    return {
      simSeconds: Math.min(simSeconds, i * STEP),
      renders: renderMs.length,
      renderMs: { median: at(0.5), p95: at(0.95), p99: at(0.99), n: renderMs.length },
      slice: app.metrics.sliceMs.stats(), sliceOver: app.metrics.overBudget, sliceTotal: app.metrics.sliceTotal,
      transitions,
      rider: { pieceIdx: rider.pieceIdx, s: Math.round(rider.s * 10) / 10, arm: rider.arm, v: Math.round(rider.v * 10) / 10 },
      finished: rider.finished,
      chunks: { built: app.mgr.built.size, pending: app.mgr.pending() },
      seatErrors: app.proof.seatErrors,
    };
  };
}
main();

</script>
