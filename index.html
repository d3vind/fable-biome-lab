<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Afterlight Confluence</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#05060A; }
  canvas { display:block; }
  #hint {
    position:fixed; left:22px; bottom:16px; z-index:2; pointer-events:none;
    color:rgba(213,198,176,0.48); font:12px/1.4 system-ui, sans-serif;
    letter-spacing:0.14em; user-select:none;
  }
  #nogl {
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    color:#D5C6B0; font:14px system-ui, sans-serif; background:#05060A; z-index:3;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="hint">W/S speed &middot; A/D line &amp; fork &middot; drag look &middot; Space pause &middot; R restart</div>
<div id="nogl">This experience needs WebGL2.</div>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ================================================================
   AFTERLIGHT CONFLUENCE
   A seeded night ride down the water city, from the vigil streets
   to slack water. Circuit's eye; Floodline's skeleton.

   ?seed=<integer|string>   default 1189
   ?quality=low|standard    default standard
   ?d=<meters>              debug start distance
   ?branch=arcade|ropewalk  debug fork preselect
   ================================================================ */
// ---------- seed (integer or string; strings are FNV-hashed) ----------
const qs = new URLSearchParams(location.search);
const seedRaw = qs.get('seed');
function fnv32(str){ let h=0x811c9dc5>>>0; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; } return h>>>0; }
const seedParsed = seedRaw===null ? NaN : Number.parseInt(seedRaw,10);
const SEED = (Number.isFinite(seedParsed) && String(seedParsed)===seedRaw.trim() ? seedParsed
             : seedRaw!==null && seedRaw.length ? fnv32(seedRaw) : 1189) >>> 0;
const SEED_LABEL = seedRaw===null ? '1189' : seedRaw;

// ---------- deterministic streams (no Math.random anywhere in this file) ----------
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function streamOf(salt){ return mulberry32((SEED ^ salt)|0); }
const clamp = THREE.MathUtils.clamp;
const lerp  = THREE.MathUtils.lerp;
function mkR(rnd){ return {
  f: rnd,
  r:(a,b)=>a+(b-a)*rnd(),
  i:(a,b)=>Math.floor(a+(b-a+1)*rnd()),
  pick:(arr)=>arr[Math.min(arr.length-1,Math.floor(rnd()*arr.length))],
  chance:(p)=>rnd()<p,
}; }
const RP = mkR(streamOf(0x00000000));      // structural planning — quality never touches it
const RV = mkR(streamOf(0x51ED2701));      // global visual realization (atlas order, far palette)
const RA_SALT = 0x9E3779B9;
let RA = mkR(streamOf(RA_SALT));           // ambient runtime stream — re-seeded on restart
// per-chunk streams derive from SEED + a chunk key, so build order never matters
function chunkStream(kind, key){ return mkR(mulberry32((SEED ^ fnv32(kind+':'+key))|0)); }

// ---------- FNV-1a plan hashing ----------
function Hasher(){ let h=0x811c9dc5>>>0; return {
  n(v){ const s=(Math.round(v*100)|0).toString(36); for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; } return this; },
  s(v){ const t=String(v); for(let i=0;i<t.length;i++){ h^=t.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; } return this; },
  get(){ return ('00000000'+h.toString(16)).slice(-8); },
  raw(){ return h>>>0; }
}; }

// ---------- palette: the first Afterlight's eight anchors, verbatim ----------
const HEX = { ink:0x05060A, aub:0x150A24, vio:0x3C204D, teal:0x7EA8B8, rose:0xC45D8C, ora:0xC85A2B, amb:0xE4AE59, pap:0xD5C6B0 };
const col = h=>new THREE.Color(h);
const scale = (c,m)=>{ const o=c.clone(); o.multiplyScalar(m); return o; };
function varyR(c,v,rnd){ const o=c.clone(); const m=1+(rnd.f()*2-1)*v; o.r=clamp(o.r*m,0,1); o.g=clamp(o.g*m,0,1); o.b=clamp(o.b*m,0,1); return o; }
const BLACK = col(0x000000);
// facade base tones — dark, deliberate, no neutral grey anywhere
const FACADES = [ col(0x1B1030), col(0x241738), col(0x160C26), col(0x1F1526), col(0x11182A), col(0x261320), col(0x2A2030), col(0x121022) ];
function winTintR(rnd){ const r=rnd.f(); if(r<0.55) return scale(col(HEX.amb),rnd.r(0.75,1.0)); if(r<0.77) return scale(col(HEX.pap),rnd.r(0.5,0.72)); if(r<0.9) return scale(col(HEX.teal),rnd.r(0.5,0.75)); return scale(col(HEX.rose),rnd.r(0.65,0.9)); }

// ---------- quality (identity-neutral: structure and hashes never depend on it) ----------
const QUALITY_TIERS = {
  // retention is identical across tiers so the realized world is provably
  // the same city; low spends fewer pixels, triangles and particles on it
  low:      { dprCap:1.0, rain:2300, splash:170, steamEvery:2, det2:false, farEvery:2, aheadNear:700, aheadFar:1350 },
  standard: { dprCap:1.5, rain:4600, splash:340, steamEvery:1, det2:true,  farEvery:1, aheadNear:700, aheadFar:1350 },
};
const qReq = (qs.get('quality')||'').toLowerCase();
const QUALITY_REQUESTED = qReq || 'standard';
const QUALITY = QUALITY_TIERS[qReq] ? qReq : 'standard';
const Q = QUALITY_TIERS[QUALITY];

// ---------- renderer (Circuit's photographic response, untouched) ----------
const cv = document.createElement('canvas');
document.body.appendChild(cv);
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas: cv, antialias:false, powerPreference:'high-performance' });
} catch(e) { document.getElementById('nogl').style.display='flex'; throw e; }
if (!renderer.capabilities.isWebGL2){ document.getElementById('nogl').style.display='flex'; throw new Error('WebGL2 required'); }
const DPR = Math.min(window.devicePixelRatio||1, Q.dprCap);
renderer.setPixelRatio(DPR);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = false;      // night scene: depth is fog, grime and emissive light
const GL_INFO = (()=>{ try { const gl=renderer.getContext();
  const dbg=gl.getExtension('WEBGL_debug_renderer_info');
  return dbg ? String(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)) : String(gl.getParameter(gl.RENDERER));
} catch(e){ return 'unknown'; } })();

const scene = new THREE.Scene();
scene.background = col(HEX.ink);
scene.fog = new THREE.Fog(0x140B20, 26, 930);
const camera = new THREE.PerspectiveCamera(64, window.innerWidth/window.innerHeight, 0.1, 1700);

// lights for the few classic (Lambert) materials
scene.add(new THREE.HemisphereLight(0x2A1840, 0x0A0810, 1.4));
const moon = new THREE.DirectionalLight(0x7EA8B8, 0.5); moon.position.set(-0.4,1,0.25); scene.add(moon);
const fill = new THREE.DirectionalLight(0xC45D8C, 0.14); fill.position.set(0.6,0.7,-0.4); scene.add(fill);

// ---------- runtime error / context capture (surfaced in proof) ----------
const RUNTIME_ERRORS = [];
window.addEventListener('error', e=>{ if(RUNTIME_ERRORS.length<12) RUNTIME_ERRORS.push(String(e.message||e).slice(0,200)); });
window.addEventListener('unhandledrejection', e=>{ if(RUNTIME_ERRORS.length<12) RUNTIME_ERRORS.push('promise: '+String(e.reason).slice(0,180)); });
let CONTEXT_LOST = false;
cv.addEventListener('webglcontextlost', ()=>{ CONTEXT_LOST = true; });

// ---------- shared uniforms + GLSL chunks ----------
const U = {
  uTime:{value:0}, uCam:{value:new THREE.Vector3()},
  uFogColor:{value:col(0x140B20)}, uFogNear:{value:26}, uFogFar:{value:930},
  uShelter:{value:0},                       // 0 open sky … 1 fully under cover
  uBrown:{value:1},                         // brown-out multiplier for public light
  uWind:{value:new THREE.Vector3(4.2,0,1.5)},
};
const ROAD_SAMPLES = 12;                    // rolling local road frame handed to the splash shader
const uRoadPts = []; for(let i=0;i<ROAD_SAMPLES;i++) uRoadPts.push(new THREE.Vector4(0,0,0,4.7));
U.uRoad = { value: uRoadPts };
const GLSL_H = `
float h11(float p){ vec3 q=fract(vec3(p)*vec3(0.1031,0.1030,0.0973)); q+=dot(q,q.yzx+33.33); return fract((q.x+q.y)*q.z); }
float h21(vec2 p){ vec3 q=fract(vec3(p.xyx)*vec3(0.1031,0.1030,0.0973)); q+=dot(q,q.yzx+33.33); return fract((q.x+q.y)*q.z); }
float n2(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f);
  float a=h21(i),b=h21(i+vec2(1.0,0.0)),c=h21(i+vec2(0.0,1.0)),d=h21(i+vec2(1.0,1.0));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y); }
float flick(float mode,float ph,float t){
  if(mode<0.5) return 0.86+0.14*sin(t*0.7+ph*6.2831);
  if(mode<1.5) return 0.55+0.5*sin(t*1.9+ph*6.2831);
  if(mode<2.5){ float h=h11(floor(t*11.0)+ph*97.0); float g=h11(floor(t*2.3)+ph*31.0);
    return (h<0.14?0.12:1.0)*(0.72+0.35*g); }
  if(mode<3.5){ return 0.12+step(mod(t*1.1+ph*3.0,3.0),1.15); }
  float h=h11(floor(t*6.0)+ph*53.0); return h<0.7?0.05:(0.9+0.4*h11(floor(t*29.0)+ph)); }
`;
const GLSL_FOG = `
uniform vec3 uFogColor; uniform float uFogNear; uniform float uFogFar;
float fogF(float z){ return clamp((z-uFogNear)/(uFogFar-uFogNear),0.0,1.0); }
`;
const GLSL_ROADP = `
uniform vec4 uRoad[${ROAD_SAMPLES}];
vec3 roadProbe(vec2 w){
  float best=1e9; float by=0.0; float bw=4.7;
  for(int i=0;i<${ROAD_SAMPLES-1};i++){
    vec2 a=uRoad[i].xz, b=uRoad[i+1].xz;
    vec2 ab=b-a; float L2=max(dot(ab,ab),0.0001);
    float t=clamp(dot(w-a,ab)/L2,0.0,1.0);
    vec2 p=a+ab*t;
    float d=length(w-p);
    if(d<best){ best=d; by=mix(uRoad[i].y,uRoad[i+1].y,t); bw=mix(uRoad[i].w,uRoad[i+1].w,t); }
  }
  return vec3(best,by,bw);
}
`;
function shaderMat(o){
  const u = Object.assign({}, o.uniforms||{});
  u.uTime=U.uTime; u.uCam=U.uCam; u.uFogColor=U.uFogColor; u.uFogNear=U.uFogNear; u.uFogFar=U.uFogFar;
  u.uShelter=U.uShelter; u.uBrown=U.uBrown; u.uWind=U.uWind;
  if(o.road) u.uRoad=U.uRoad;
  return new THREE.ShaderMaterial({ vertexShader:o.vs, fragmentShader:o.fs, uniforms:u,
    transparent:o.transparent||false, depthWrite:o.depthWrite!==undefined?o.depthWrite:true,
    depthTest:o.depthTest!==undefined?o.depthTest:true, blending:o.blending||THREE.NormalBlending,
    side:o.side||THREE.FrontSide, polygonOffset:o.polygonOffset||false,
    polygonOffsetFactor:o.polygonOffsetFactor||0, polygonOffsetUnits:o.polygonOffsetUnits||0 });
}
// ================================================================
// WORLD PLAN — the whole journey is decided here, by the planning
// stream alone. Quality and visual realization never reach this.
// The city runs south→north, downhill in spirit: streets, works,
// then open water. The road is a river; the plan is its valley.
// ================================================================
const G = 56;                       // street pitch (centre to centre)
const IMIN = 3, IMAX = 31;          // buildable x-cell extent
const cellX = i => i*G;
const cellZ = j => j*G;
const RPA = mkR(streamOf(0xA5B35705));   // ambient SCHEDULING stream (independent of RP/RV)

const CHAPTERS = [
  { key:'vigil',     name:'Vigil Rows' },
  { key:'marrow',    name:'The Marrow Line' },
  { key:'sluice',    name:'Sluice Court' },
  { key:'split',     name:'Brinepool Split' },
  { key:'stacks',    name:'Turbine Stacks' },
  { key:'longwater', name:'The Longwater' },
  { key:'ninegates', name:'Nine Gates Weir' },
  { key:'slack',     name:'Slack Water' },
];
const CH_INDEX = {}; CHAPTERS.forEach((c,k)=>CH_INDEX[c.key]=k);

const PLAN = (function buildPlan(){
  const P = { seed:SEED, seedLabel:SEED_LABEL };
  const spineI = RP.i(13,19);
  P.standpipeSide = RP.chance(0.5)?1:-1;      // the opening's promised landmark sits on this side

  // ---- route walker -------------------------------------------------
  // Monotonic in +z with bounded x wander: the river never crosses itself.
  const nodes = [];
  const used = new Set();
  let ci=spineI, cj=2, lastDir=0;
  const pushNode=(ch)=>{ nodes.push({ i:ci, j:cj, x:cellX(ci), z:cellZ(cj), chapter:ch, y:0 }); used.add(ci*1000+cj); };
  pushNode('vigil');
  function stepZ(run,ch){ for(let k=0;k<run;k++){ cj++; } lastDir=0; pushNode(ch); }
  function stepX(run,dir,ch,allowUsed){ // dir +1 east / -1 west, bounded wander
    let moved=0;
    for(let k=0;k<run;k++){ const ni=ci+dir;
      if(ni<IMIN+2||ni>IMAX-2||Math.abs(ni-spineI)>7||(!allowUsed&&used.has(ni*1000+cj))) break;
      ci=ni; moved++; }
    if(moved>0){ lastDir=dir; pushNode(ch); }
    return moved;
  }
  // a chapter leg: advance dz cells of +z, spending `wander` seeded x-runs on the way
  function chapterLeg(ch, dz, wander, minRun, maxRun){
    let zLeft=dz, wLeft=wander;
    while(zLeft>0){
      const zRun=Math.min(zLeft, RP.i(minRun,maxRun));
      stepZ(zRun,ch); zLeft-=zRun;
      if(wLeft>0 && zLeft>0 && RP.chance(0.62)){
        const dir = lastDir!==0 ? (RP.chance(0.72)?-Math.sign(lastDir):Math.sign(lastDir)) : (RP.chance(0.5)?1:-1);
        if(stepX(RP.i(1,2),dir,ch)>0) wLeft--;
      }
    }
  }

  // 1 — Vigil Rows: the golden straight, then intimate corners
  const openRun = RP.i(4,5);
  stepZ(openRun,'vigil');
  chapterLeg('vigil', 13, 3, 2, 3);
  const vigilEnd = { i:ci, j:cj };

  // 2 — The Marrow Line: reach the rail street, then the long compression run
  chapterLeg('marrow', 3, 1, 1, 2);
  const marrowRunStart = nodes.length-1;
  stepZ(RP.i(5,6),'marrow');                    // the deck rides directly overhead here
  stepZ(RP.i(4,5),'marrow');
  const marrowRunEnd = nodes.length-1;
  chapterLeg('marrow', 2, 1, 1, 2);

  // 3 — Sluice Court: the canal takes the seeded side of the street
  P.canalSide = RP.chance(0.5)?1:-1;
  chapterLeg('sluice', 14, 3, 2, 4);
  const sluiceEnd = { i:ci, j:cj };

  // 4 — Brinepool Split
  const forkIdx = nodes.length-1;
  const fi=ci, fj=cj;
  const arcadeLeft = RP.chance(0.5);            // which side the sheltered arcade departs to
  const rejI = clamp(spineI + RP.i(-2,2), IMIN+3, IMAX-3);
  const rejJ = fj + RP.i(9,11);
  function branchWalk(kind){
    ci=fi; cj=fj; lastDir=0;
    const before=nodes.length;
    const goLeft = kind==='arcade' ? arcadeLeft : !arcadeLeft;
    stepX(kind==='arcade'?1:RP.i(1,2), goLeft?-1:1, 'split');
    if(kind==='arcade'){                        // tight sheltered bays: short runs, more corners
      chapterLeg('split', rejJ-cj-3, 3, 1, 2);
    } else {                                    // the ropewalk: long exposed spans, few corners
      chapterLeg('split', rejJ-cj-3, 1, 3, 5);
    }
    // converge on the rejoin throat (used cells may be crossed here)
    let guard=0;
    while(ci!==rejI && guard++<24){
      if(stepX(Math.abs(rejI-ci), Math.sign(rejI-ci), 'split', true)===0){ if(cj<rejJ-1) stepZ(1,'split'); else break; }
      else if(cj<rejJ-1 && ci!==rejI) stepZ(1,'split');
    }
    while(cj<rejJ) stepZ(1,'split');
    return nodes.splice(before);
  }
  const pathRope = branchWalk('ropewalk');
  const pathArc  = branchWalk('arcade');
  ci=rejI; cj=rejJ; lastDir=0;
  const tailStart = nodes.length;
  stepZ(1,'stacks');

  // 5 — Turbine Stacks: the water works, and the Gullet through a pump hall
  chapterLeg('stacks', 21, 4, 2, 4);
  const shoreNode = nodes[nodes.length-1];

  // 6/7/8 — water chapters leave the grid: causeway, weir, slack water
  const causewayLen = RP.r(1450,1750);
  const weirLen = RP.r(1020,1180);
  const slackLen = RP.r(860,980);
  const cx0 = shoreNode.x, cz0 = shoreNode.z + G;
  const weirX = clamp(cx0 + RP.r(-170,170), cellX(IMIN+4), cellX(IMAX-4));
  const jog = RP.r(-40,40);
  for(let k=1;k<=5;k++){
    const t=k/5;
    nodes.push({ i:0,j:0, x: lerp(cx0,weirX,t*t*(3-2*t)) + Math.sin(t*Math.PI)*jog,
                 z: cz0 + causewayLen*t, chapter:'longwater', y:0 });
  }
  const wz = cz0 + causewayLen;
  const wSkew = RP.r(-0.12,0.12);
  for(const t of [0.22,0.5,0.66,0.85,1.0]){
    nodes.push({ i:0,j:0, x: weirX + wSkew*weirLen*(t-0.6), z: wz + weirLen*t, chapter:'ninegates', y:0 });
  }
  const hx = weirX + wSkew*weirLen*0.4 + RP.r(-60,60);
  const sz0 = wz + weirLen;
  for(const t of [0.3,0.62,0.85,1.0]){
    nodes.push({ i:0,j:0, x: lerp(weirX + wSkew*weirLen*0.4, hx, t*t*(3-2*t)), z: sz0 + slackLen*t, chapter:'slack', y:0 });
  }
  P.bayZ = shoreNode.z + G*0.6;               // the shoreline: land yields to black water
  P.causewayLen = causewayLen; P.weirLen = weirLen; P.slackLen = slackLen;

  // ---- assemble branch node lists -----------------------------------
  const head = nodes.slice(0, forkIdx+1);
  const tail = nodes.slice(tailStart);
  const cloneL = a=>a.map(n=>({ i:n.i,j:n.j,x:n.x,z:n.z,chapter:n.chapter,y:0 }));
  P.nodesA = cloneL(head.concat(pathArc, tail));    // arcade line — the sheltered default
  P.nodesB = cloneL(head.concat(pathRope, tail));   // ropewalk line — the exposed climb
  P.fork = { index: forkIdx, arcadeLeft,
             leftBranch: arcadeLeft?'arcade':'ropewalk', rightBranch: arcadeLeft?'ropewalk':'arcade',
             defaultBranch: 'arcade',                  // the centred line always falls to shelter
             rejoin:{ i:rejI, j:rejJ, x:cellX(rejI), z:cellZ(rejJ) } };

  // ---- heights -------------------------------------------------------
  const CH_Y = {
    vigil:[[0,0],[1,0]], marrow:[[0,0],[1,0]], sluice:[[0,0],[1,0]],
    stacks:[[0,0],[0.6,1.2],[1,2.4]],
    longwater:[[0,2.4],[0.5,2.6],[1,2.4]],
    ninegates:[[0,2.4],[0.34,3.4],[0.55,7.4],[0.75,7.4],[1,3.2]],
    slack:[[0,3.2],[0.5,2.3],[1,2.2]],
  };
  const SPLIT_Y = {
    arcade:[[0,0],[1,0]],
    ropewalk:[[0,0],[0.22,8.8],[0.5,11.2],[0.72,9.6],[1,0]],
  };
  P.CH_Y=CH_Y; P.SPLIT_Y=SPLIT_Y;
  function keyY(keys,t){
    for(let k=1;k<keys.length;k++){ if(t<=keys[k][0]||k===keys.length-1){
      const a=keys[k-1],b=keys[k]; const u=clamp((t-a[0])/Math.max(1e-6,b[0]-a[0]),0,1);
      return lerp(a[1],b[1],u*u*(3-2*u)); } }
    return keys[keys.length-1][1];
  }
  function applyHeights(list, branchKey){
    const chIdx = {};
    list.forEach((n,k)=>{ (chIdx[n.chapter]=chIdx[n.chapter]||[]).push(k); });
    for(const ch of CHAPTERS){
      const idx=chIdx[ch.key]; if(!idx||!idx.length) continue;
      const n0=idx[0], n1=idx[idx.length-1];
      const cum=[0];
      for(let k=n0+1;k<=n1;k++) cum.push(cum[cum.length-1]+Math.hypot(list[k].x-list[k-1].x, list[k].z-list[k-1].z));
      const total=Math.max(1,cum[cum.length-1]);
      for(let k=n0;k<=n1;k++){
        const t=cum[k-n0]/total;
        let y = ch.key==='split' ? keyY(SPLIT_Y[branchKey],t) : keyY(CH_Y[ch.key],t);
        if(ch.key==='vigil')  y += Math.sin(t*6.1+0.4)*0.35;
        if(ch.key==='sluice') y += Math.sin(t*5.3+1.2)*0.3;
        if(ch.key==='longwater') y += Math.sin(t*7.7)*0.35;
        list[k].y=y;
      }
    }
    return list;
  }
  applyHeights(P.nodesA,'arcade');
  applyHeights(P.nodesB,'ropewalk');
  P.marrowRun = { a:marrowRunStart, b:marrowRunEnd };

  // ---- landmarks -----------------------------------------------------
  { let li=0; P.nodesA.forEach((nn,k)=>{ if(nn.chapter==='vigil') li=k; });
    const n = P.nodesA[li];

function smooth01(t){ t=clamp(t,0,1); return t*t*(3-2*t); }
function roundPolyline(nodes){
  const out=[]; const RCMAX=16;
  for(let i=0;i<nodes.length;i++){
    const P=new THREE.Vector3(nodes[i].x,nodes[i].y,nodes[i].z); P.ch=nodes[i].chapter;
    if(i===0){ out.push(P); continue; }
    const Q=new THREE.Vector3(nodes[i-1].x,nodes[i-1].y,nodes[i-1].z);
    const seg=P.clone().sub(Q); const segL=Math.hypot(seg.x,seg.z)||1;
    const dirIn=new THREE.Vector3(seg.x/segL,0,seg.z/segL);
    const rc=Math.min(RCMAX,segL*0.36);
    const prevExit=out[out.length-1];
    const entry=new THREE.Vector3(P.x-dirIn.x*rc, lerp(Q.y,P.y,1-rc/segL), P.z-dirIn.z*rc); entry.ch=nodes[i].chapter;
    const span=entry.clone().sub(prevExit); const spanL=Math.hypot(span.x,span.z);
    const steps=Math.max(1,Math.round(spanL/30));
    for(let s2=1;s2<steps;s2++){ const t=s2/steps;
      const p=new THREE.Vector3(prevExit.x+span.x*t, prevExit.y+(entry.y-prevExit.y)*t, prevExit.z+span.z*t);
      p.ch=nodes[i].chapter; out.push(p); }
    out.push(entry);
    if(i===nodes.length-1){ out.push(P); break; }
    const N2=new THREE.Vector3(nodes[i+1].x,nodes[i+1].y,nodes[i+1].z);
    const seg2=N2.clone().sub(P); const seg2L=Math.hypot(seg2.x,seg2.z)||1;
    const dirOut=new THREE.Vector3(seg2.x/seg2L,0,seg2.z/seg2L);
    const rc2=Math.min(RCMAX,seg2L*0.36);
    const exit=new THREE.Vector3(P.x+dirOut.x*rc2, lerp(P.y,N2.y,rc2/seg2L), P.z+dirOut.z*rc2); exit.ch=nodes[i+1].chapter;
    const mid=new THREE.Vector3((entry.x+exit.x)/2,(entry.y+exit.y)/2,(entry.z+exit.z)/2).lerp(P,0.55); mid.ch=nodes[i].chapter;
    out.push(mid); out.push(exit);
  }
  return out;
}

const STEP0 = 0.7;
function buildBranch(nodes, branchKey){
  const pts0 = roundPolyline(nodes);
  const curve = new THREE.CatmullRomCurve3(pts0, false, 'centripetal');
  const LEN = curve.getLength();
  const NF = Math.ceil(LEN/STEP0);
  const st = LEN/NF;
  const pts = curve.getSpacedPoints(NF);
  const F = { key:branchKey, LEN, NF, STEP:st,
    x:new Float32Array(NF+1), y:new Float32Array(NF+1), z:new Float32Array(NF+1),
    tx:new Float32Array(NF+1), ty:new Float32Array(NF+1), tz:new Float32Array(NF+1),
    lx:new Float32Array(NF+1), lz:new Float32Array(NF+1), k:new Float32Array(NF+1),
    ch:new Uint8Array(NF+1), shel:new Float32Array(NF+1), off:new Float32Array(NF+1) };
  for(let i=0;i<=NF;i++){ F.x[i]=pts[i].x; F.y[i]=pts[i].y; F.z[i]=pts[i].z; }
  const yawA=new Float32Array(NF+1);
  const recomputeTangents=()=>{
    for(let i=0;i<=NF;i++){
      const a=Math.max(0,i-1), b=Math.min(NF,i+1);
      let tx=F.x[b]-F.x[a], ty=F.y[b]-F.y[a], tz=F.z[b]-F.z[a];
      const l=Math.hypot(tx,ty,tz)||1; tx/=l; ty/=l; tz/=l;
      F.tx[i]=tx; F.ty[i]=ty; F.tz[i]=tz;
      const hl=Math.hypot(tx,tz)||1;
      F.lx[i]=tz/hl; F.lz[i]=-tx/hl;
      yawA[i]=Math.atan2(-tx,-tz);
    }
  };
  recomputeTangents();
  const wrapPi=a=>{ while(a>Math.PI)a-=2*Math.PI; while(a<-Math.PI)a+=2*Math.PI; return a; };
  const computeK=()=>{
    const kRaw=new Float32Array(NF+1);
    for(let i=1;i<NF;i++) kRaw[i]=wrapPi(yawA[i+1]-yawA[i-1])/(2*st);
    for(let i=0;i<=NF;i++){ let s=0,n=0; for(let j=Math.max(0,i-12);j<=Math.min(NF,i+12);j++){ s+=kRaw[j]; n++; } F.k[i]=s/n; }
  };
  computeK();
  // chapter index per frame: from where design nodes actually land on the arc
  {
    const marks=[{d:0,c:CH_INDEX[nodes[0].chapter]||0}];
    let fi=0;
    for(let n=1;n<nodes.length;n++){
      let best=1e9,bi=fi;
      for(let i=fi;i<=NF;i++){
        const dd=(F.x[i]-nodes[n].x)**2+(F.z[i]-nodes[n].z)**2;
        if(dd<best){ best=dd; bi=i; } else if(i-bi>320) break;
      }
      fi=bi;
      const c=CH_INDEX[nodes[n].chapter]||0;
      if(c!==marks[marks.length-1].c) marks.push({d:bi*st,c});
    }
    let mi=0;
    for(let i=0;i<=NF;i++){ const d=i*st;
      while(mi<marks.length-1&&d>=marks[mi+1].d) mi++;
      F.ch[i]=marks[mi].c; }
    for(let i=1;i<=NF;i++) if(F.ch[i]<F.ch[i-1]) F.ch[i]=F.ch[i-1];
  }
  // continuous vertical profile: elevation is re-derived per frame from the
  // chapter curves, so no polyline-subdivision slope kink ever reaches the eye
  {
    const keyY=(keys,t)=>{
      for(let k=1;k<keys.length;k++){ if(t<=keys[k][0]||k===keys.length-1){
        const a=keys[k-1],b=keys[k]; const u=clamp((t-a[0])/Math.max(1e-6,b[0]-a[0]),0,1);
        return lerp(a[1],b[1],u*u*(3-2*u)); } }
      return keys[keys.length-1][1];
    };
    const spansL=[]; let cur=-1;
    for(let i=0;i<=NF;i++){ if(F.ch[i]!==cur){ if(spansL.length) spansL[spansL.length-1].i1=i-1;
      spansL.push({c:F.ch[i],i0:i,i1:NF}); cur=F.ch[i]; } }
    for(const sp2 of spansL){
      const key=CHAPTERS[sp2.c].key;
      const n0=sp2.i0, n1=Math.max(sp2.i0+1,sp2.i1);
      const prof = key==='split'? PLAN.SPLIT_Y[branchKey] : PLAN.CH_Y[key];
      for(let i=n0;i<=sp2.i1;i++){
        const t=(i-n0)/(n1-n0);
        let y=keyY(prof,t);
        if(key==='vigil')  y+=Math.sin(t*6.1+0.4)*0.35;
        if(key==='sluice') y+=Math.sin(t*5.3+1.2)*0.3;
        if(key==='longwater') y+=Math.sin(t*7.7)*0.35;
        F.y[i]=y;
      }
    }
  }
  recomputeTangents(); computeK();
  F.recomputeTangents=recomputeTangents; F.computeK=computeK;
  return F;
}

const BR = { arcade: buildBranch(PLAN.nodesA,'arcade'), ropewalk: buildBranch(PLAN.nodesB,'ropewalk') };
const BRANCH_KEYS = ['arcade','ropewalk'];

// ---- chapter spans per branch ----------------------------------------
function chapterSpans(F){
  const out=[]; let cur=-1;
  for(let i=0;i<=F.NF;i++){
    if(F.ch[i]!==cur){
      if(out.length) out[out.length-1].end=i*F.STEP;
      out.push({ key:CHAPTERS[F.ch[i]].key, name:CHAPTERS[F.ch[i]].name, start:i*F.STEP, end:F.LEN });
      cur=F.ch[i];
    }
  }
  if(out.length) out[out.length-1].end=F.LEN;
  for(const c of out) c.length=c.end-c.start;
  return out;
}
const SPANS = { arcade: chapterSpans(BR.arcade), ropewalk: chapterSpans(BR.ropewalk) };
function spanOf(branchKey, chKey){ return SPANS[branchKey].find(c=>c.key===chKey); }
function chD(branchKey, chKey, t){ const c=spanOf(branchKey,chKey); return c ? c.start + c.length*t : 0; }

const FORKGEO = (function(){
  const fnode = PLAN.nodesA[PLAN.fork.index];
  const rx = PLAN.fork.rejoin.x, rz = PLAN.fork.rejoin.z;
  function findD(F,x,z,from,to){
    let best=1e9,bd=0;
    const i0=Math.max(0,Math.floor(from/F.STEP)), i1=Math.min(F.NF,Math.ceil(to/F.STEP));
    for(let i=i0;i<=i1;i++){ const d=(F.x[i]-x)**2+(F.z[i]-z)**2; if(d<best){ best=d; bd=i*F.STEP; } }
    return bd;
  }
  const D_FORK = findD(BR.arcade, fnode.x, fnode.z, 0, BR.arcade.LEN);
  const RJ = { arcade: findD(BR.arcade, rx, rz, D_FORK+120, BR.arcade.LEN),
               ropewalk: findD(BR.ropewalk, rx, rz, D_FORK+120, BR.ropewalk.LEN) };
  const OFF=6.4, RAMP=46;
  const sideOf = { arcade: PLAN.fork.arcadeLeft?1:-1, ropewalk: PLAN.fork.arcadeLeft?-1:1 };
  for(const key of BRANCH_KEYS){
    const F=BR[key], side=sideOf[key], rj=RJ[key];
    const mEnd = rj-14;
    for(let i=0;i<=F.NF;i++){
      const d=i*F.STEP;
      let m=0;
      if(d>D_FORK-RAMP&&d<D_FORK) m=smooth01((d-(D_FORK-RAMP))/RAMP);
      else if(d>=D_FORK&&d<=mEnd-RAMP) m=1;
      else if(d>mEnd-RAMP&&d<mEnd) m=1-smooth01((d-(mEnd-RAMP))/RAMP);
      F.off[i]=side*OFF*m;
      if(m>0){ F.x[i]+=F.lx[i]*F.off[i]; F.z[i]+=F.lz[i]*F.off[i]; }
    }
    F.recomputeTangents(); F.computeK();
  }
  return { D_FORK, RJ, OFF, RAMP, side:sideOf,
           node:{x:fnode.x,y:fnode.y,z:fnode.z}, rejoin:{x:rx,z:rz} };
})();
const D_FORK_GATE = FORKGEO.D_FORK - FORKGEO.RAMP;

function addShelter(branchKey, d0, d1, amt){ SHELTER_SPANS[branchKey].push([d0,d1,amt]); }

function findNearestD(F,x,z,from,to){

const _fr = { x:0,y:0,z:0,tx:0,ty:0,tz:0,lx:0,lz:0,k:0,ch:0,shel:0,off:0 };
function getFrame(F,d){

  _fr.x=F.x[i]+(F.x[i+1]-F.x[i])*t; _fr.y=F.y[i]+(F.y[i+1]-F.y[i])*t; _fr.z=F.z[i]+(F.z[i+1]-F.z[i])*t;

// ---- style ----
function newStyle(C){
  const mood=PLAN.mood[C.chKey]||PLAN.mood.vigil;
  const rv=C.rv;
  const fi=(rv.i(0,7)+mood.paletteRoll)%8;
  return { c:varyR(FACADES[fi],0.22,rv), tint:winTintR(rv),
    inf:[rv.r(2.4,3.3), rv.r(2.9,3.5), clamp(mood.litR*rv.r(0.65,1.4),0.04,0.5), rv.r(0,100)],
    hMul: mood.hMul };
}
function parapet(B,x0,z0,x1,z1,y,h,c){
  box(B,x0-0.12,y,z0-0.12,x1+0.12,y+h,z0+0.3,{c}); box(B,x0-0.12,y,z1-0.3,x1+0.12,y+h,z1+0.12,{c});
  box(B,x0-0.12,y,z0,x0+0.3,y+h,z1,{c}); box(B,x1-0.3,y,z0,x1+0.12,y+h,z1,{c});
}
function ledge(B,x0,z0,x1,z1,y,c){ box(B,x0-0.28,y,z0-0.28,x1+0.28,y+0.4,z1+0.28,{c}); }
function roofKit(C,x0,z0,x1,z1,y,det,c,nearRoute){
  const rv=C.rv, B=C.fac;
  const cx=(x0+x1)/2, cz=(z0+z1)/2, w=x1-x0, dp=z1-z0;
  const dark=scale(c,0.8);
  if(det<1){ if(rv.chance(0.5)) box(B,cx-1.2,y,cz-1.2,cx+1.2,y+rv.r(1,2.4),cz+1.2,{c}); return; }
  if(rv.chance(0.55)){ const p=[cx+rv.r(-w*0.25,w*0.25),cz+rv.r(-dp*0.25,dp*0.25),rv.r(1,1.8),rv.r(1.8,3.4)]; pTank(C,p[0],y,p[1],p[2],p[3],dark); }
  const nAc=rv.i(0,det>1?3:1);
  for(let i=0;i<nAc;i++){ const p=[x0+rv.r(1,Math.max(1.2,w-1)),z0+rv.r(1,Math.max(1.2,dp-1)),rv.r(0,6.28)]; if(LOD2) pAC(C,p[0],y,p[1],p[2],dark); }
  if(rv.chance(0.5)){ const p=[x0+rv.r(0.6,Math.max(0.8,w-0.6)),z0+rv.r(0.6,Math.max(0.8,dp-0.6)),rv.r(2.5,7)]; if(LOD2) pAntenna(C,p[0],y,p[1],p[2],dark); }
  // roof scupper + downspout head: rain leaves the roof somewhere real
  if(rv.chance(0.6)){
    const side=rv.chance(0.5)?1:-1, sx=rv.chance(0.5)?x0+0.2:x1-0.2;
    box(B,sx-0.22,y-0.3,cz-0.22+side*0,sx+0.22,y+0.12,cz+0.22,{c:scale(c,0.7)});
  }
  if(nearRoute&&rv.chance(0.5)) steamC(C,cx+rv.r(-2,2),y+0.4,cz+rv.r(-2,2),rv.r(2.2,3.6),rv.r(4,7),rv.f()*10,rv.r(0.3,0.55));
}
function entrance(C,r,front,st,det){
  const rv=C.rv, B=C.fac;
  const t=rv.r(0.2,0.8), dw=rv.r(1.6,2.4);
  const [ex,ez]=frontPoint(r,front,t,0);
  const n=frontN(front);
  const x0=ex-(n[1]!==0?dw/2:0.35)+(n[0]<0?-0.85:0), x1=ex+(n[1]!==0?dw/2:0.35)+(n[0]>0?0.85:0);
  const z0=ez-(n[0]!==0?dw/2:0.35)+(n[1]<0?-0.85:0), z1=ez+(n[0]!==0?dw/2:0.35)+(n[1]>0?0.85:0);
  const kf={0:'kNZ',1:'kPX',2:'kPZ',3:'kNX'}[front];
  const o={c:scale(st.c,0.8), tint:scale(col(HEX.amb),rv.r(0.34,0.5)), inf:st.inf, kindTop:K_SOLID};
  o[kf]=K_STORE;
  box(B,x0,C.gy,z0,x1,C.gy+3.0,z1,o);
  if(det>1&&rv.chance(0.6)){ const [gx,gz]=frontPoint(r,front,t,1.3); glowC(C,gx,C.gy+3.1,gz,0.3,scale(col(HEX.amb),0.42),0,rv.f(),0); }
}
// ---- archetypes: eight inherited families, four born here ----
function archWorkshop(C,r,front,st,det){
  const rv=C.rv,B=C.fac,gy=C.gy;
  const h=rv.r(6,11)*st.hMul;
  const kf={0:'kNZ',1:'kPX',2:'kPZ',3:'kNX'}[front];
  box(B,r.x0,gy,r.z0,r.x1,gy+h,r.z1,{c:st.c,tint:st.tint,inf:st.inf,kind:rv.chance(0.3)?K_BRICK:K_WIN});
  const w=frontWidth(r,front);
  const dw=Math.min(6,w*0.4), t=rv.r(0.25,0.55);
  const fs={0:{x0:r.x0+w*t-dw/2,z0:r.z0-0.35,x1:r.x0+w*t+dw/2,z1:r.z0+0.5},
            2:{x0:r.x0+w*t-dw/2,z0:r.z1-0.5,x1:r.x0+w*t+dw/2,z1:r.z1+0.35},
            1:{x0:r.x1-0.5,z0:r.z0+w*t-dw/2,x1:r.x1+0.35,z1:r.z0+w*t+dw/2},
            3:{x0:r.x0-0.35,z0:r.z0+w*t-dw/2,x1:r.x0+0.5,z1:r.z0+w*t+dw/2}}[front];
  const od={c:scale(st.c,0.85),tint:st.tint,inf:st.inf,kindTop:K_SOLID}; od[kf]=K_DOOR;
  box(B,fs.x0,gy,fs.z0,fs.x1,gy+4.2,fs.z1,od);
  if(det>0) entrance(C,r,front,st,det);
  parapet(B,r.x0,r.z0,r.x1,r.z1,gy+h,rv.r(0.5,0.9),scale(st.c,0.85));
  roofKit(C,r.x0,r.z0,r.x1,r.z1,gy+h,det,st.c,det>1);
  if(det>1){
    const [ax,az]=frontPoint(r,front,rv.r(0.15,0.85),1.0);
    pAwning(C,ax,gy+3.4,az,frontYaw(front),rv.r(2.4,4),varyR(rv.pick([col(HEX.ora),col(HEX.rose),col(HEX.teal)]),0.2,rv));
    const [sx2,sz2]=frontPoint(r,front,rv.r(0.3,0.7),0.4);
    C.signAnchors.push({x:sx2,y:gy+rv.r(4.5,5.6),z:sz2,yaw:frontYaw(front),kind:'flush'});
    const [px2,pz2]=frontPoint(r,front,rv.chance(0.5)?0.06:0.94,0.35);
    pDownspout(C,px2,gy,pz2,h,scale(st.c,0.7));
  }
  return h;
}
function archCafe(C,r,front,st,det){
  const rv=C.rv,B=C.fac,gy=C.gy;
  const h=rv.r(5,8.5)*st.hMul;
  const kf={0:'kNZ',1:'kPX',2:'kPZ',3:'kNX'}[front];
  box(B,r.x0,gy,r.z0,r.x1,gy+h,r.z1,{c:st.c,tint:st.tint,inf:st.inf,kind:K_WIN});
  const w=frontWidth(r,front);
  // the glass never runs the whole front: darkness pays for the light
  const bw=Math.min(w-1.2, rv.r(6,10)), bt=rv.r(0.25,0.75);
  const in0=(w-bw)*bt, in1=w-bw-in0;
  const fs={0:{x0:r.x0+in0,z0:r.z0-0.3,x1:r.x1-in1,z1:r.z0+0.6},
            2:{x0:r.x0+in0,z0:r.z1-0.6,x1:r.x1-in1,z1:r.z1+0.3},
            1:{x0:r.x1-0.6,z0:r.z0+in0,x1:r.x1+0.3,z1:r.z1-in1},
            3:{x0:r.x0-0.3,z0:r.z0+in0,x1:r.x0+0.6,z1:r.z1-in1}}[front];
  const tint=rv.pick([scale(col(HEX.amb),0.68), scale(col(HEX.pap),0.42), scale(col(HEX.rose),0.58)]);
  const ob={c:scale(st.c,0.7),tint,inf:st.inf,kindTop:K_SOLID}; ob[kf]=K_STORE;
  box(B,fs.x0,gy+0.2,fs.z0,fs.x1,gy+3.2,fs.z1,ob);
  if(det>0){
    const nA=Math.max(1,Math.floor(w/4.5));
    for(let i=0;i<nA;i++){
      const [ax,az]=frontPoint(r,front,(i+0.5)/nA,1.0);
      pAwning(C,ax,gy+3.5,az,frontYaw(front),rv.r(2.6,3.6),varyR(rv.pick([col(HEX.ora),col(HEX.rose),col(HEX.teal)]),0.25,rv));
    }
  }
  parapet(B,r.x0,r.z0,r.x1,r.z1,gy+h,0.7,scale(st.c,0.85));
  if(det>1){
    for(let i=0;i<rv.i(2,4);i++){ const p=[rv.r(r.x0+1,r.x1-1),rv.r(r.z0+1,r.z1-1),rv.r(0,6.28)]; if(LOD2) pChair(C,p[0],gy+h,p[1],p[2],scale(st.c,0.75)); }
    for(let i=0;i<3;i++) glowC(C,rv.r(r.x0+1,r.x1-1),gy+h+rv.r(1.2,2),rv.r(r.z0+1,r.z1-1),0.35,scale(col(HEX.amb),0.65),1,rv.f(),0);
    const [sx2,sz2]=frontPoint(r,front,rv.r(0.15,0.85),0.9);
    C.signAnchors.push({x:sx2,y:gy+rv.r(4.2,5.4),z:sz2,yaw:frontYaw(front)+Math.PI/2,kind:'blade'});
    // someone in the doorway, out of the rain
    if(rv.chance(0.4)){ const [fx2,fz2]=frontPoint(r,front,rv.r(0.3,0.7),0.9);
      pFigure(C,fx2,gy+0.15,fz2,frontYaw(front)+Math.PI,{ember:rv.chance(0.5)}); }
  }
  roofKit(C,r.x0,r.z0,r.x1,r.z1,gy+h,Math.min(det,1),st.c,false);
  return h;
}
function archSlab(C,r,front,st,det){
  const rv=C.rv,B=C.fac,gy=C.gy;
  const h=rv.r(15,30)*st.hMul;
  box(B,r.x0,gy,r.z0,r.x1,gy+h,r.z1,{c:st.c,tint:st.tint,inf:st.inf,kind:K_WIN});
  const coreW=rv.r(2.5,3.5);
  const sideR={0:{x0:r.x1-coreW,z0:r.z0+2,x1:r.x1+1.2,z1:r.z0+2+coreW},
               2:{x0:r.x0-1.2,z0:r.z1-2-coreW,x1:r.x0+coreW,z1:r.z1-2},
               1:{x0:r.x0+2,z0:r.z1-coreW,x1:r.x0+2+coreW,z1:r.z1+1.2},
               3:{x0:r.x1-2-coreW,z0:r.z0-1.2,x1:r.x1-2,z1:r.z0+coreW}}[front];
  box(B,sideR.x0,gy,sideR.z0,sideR.x1,gy+h+2.2,sideR.z1,{c:scale(st.c,0.82),tint:scale(st.tint,0.5),inf:st.inf,kind:K_WIN});
  if(det>0){
    const w=frontWidth(r,front), bays=Math.max(1,Math.floor(w/3.6));
    for(let fl=1; fl*3.2+2.4<h; fl++){
      for(let b2=0;b2<bays;b2++){
        if(!rv.chance(0.75)) continue;
        const [bx2,bz2]=frontPoint(r,front,(b2+0.5)/bays,0.55);
        const n=frontN(front);
        box(B,bx2-(n[1]!==0?1.35:0.55),gy+fl*3.2,bz2-(n[0]!==0?1.35:0.55),
             bx2+(n[1]!==0?1.35:0.55),gy+fl*3.2+0.14,bz2+(n[0]!==0?1.35:0.55),{c:scale(st.c,0.8),kindTop:K_SOLID});
      }
    }
  }
  if(rv.chance(0.6)){
    const in2=rv.r(1.5,3);
    box(B,r.x0+in2,gy+h,r.z0+in2,r.x1-in2,gy+h+rv.r(3,5.5),r.z1-in2,{c:scale(st.c,0.92),tint:st.tint,inf:st.inf,kind:K_WIN});
  }
  ledge(B,r.x0,r.z0,r.x1,r.z1,gy+h-0.4,scale(st.c,0.8));
  entrance(C,r,front,st,det);
  roofKit(C,r.x0,r.z0,r.x1,r.z1,gy+h,det,st.c,det>1);
  return h;
}
function archTower(C,r,front,st,det){
  const rv=C.rv,B=C.fac,gy=C.gy;
  const h=rv.r(38,86)*st.hMul;
  const cx=(r.x0+r.x1)/2, cz=(r.z0+r.z1)/2;
  let w=(r.x1-r.x0)/2, dp=(r.z1-r.z0)/2, y=gy;
  const lvls=h>60?3:2;
  const hs=[]; let rem=h;
  for(let i=0;i<lvls;i++){ const hh=i===lvls-1?rem:rem*rv.r(0.42,0.6); hs.push(hh); rem-=hh; }
  for(let i=0;i<lvls;i++){
    box(B,cx-w,y,cz-dp,cx+w,y+hs[i],cz+dp,{c:st.c,tint:st.tint,inf:st.inf,kind:K_WIN});
    const pc=scale(st.c,0.72);

  for(const [ox,oz] of [[-w/2+0.5,-dp/2+0.5],[w/2-0.5,-dp/2+0.5],[-w/2+0.5,dp/2-0.5],[w/2-0.5,dp/2-0.5]])
    strutB(C.furn,x+ox,-1.7,z+oz,x+ox,1.9,z+oz,0.3,col(0x1A1428));
  box(C.fac,x-w/2-0.3,1.9,z-dp/2-0.3,x+w/2+0.3,2.2,z+dp/2+0.3,{c:col(0x1C1630)});
  box(C.fac,x-w/2+0.6,2.2,z-dp/2+0.6,x+w/2-0.6,2.2+rv.r(2.2,3.4),z+dp/2-0.6,
    {c:varyR(col(0x241A34),0.15,rv),tint:scale(col(HEX.rose),0.8),inf:[2.2,2.2,0.5,rv.r(0,100)],kind:K_WIN});
  glowC(C,x,2.2+rv.r(2.6,3.6),z,0.5,scale(col(HEX.rose),0.85),4,rv.f(),0.3);
  if(rv.chance(0.5)) steamC(C,x+rv.r(-1,1),2.6,z+rv.r(-1,1),rv.r(1.5,2.4),rv.r(3,5),rv.f()*10,0.35);
  CENSUS.buildings++; CENSUS.byFamily.stiltShed=(CENSUS.byFamily.stiltShed||0)+1;
}
const ARCHS={ workshop:archWorkshop, cafe:archCafe, slab:archSlab, tower:archTower,
              walkup:archWalkup, warehouse:archWarehouse, mixed:archMixed, infra:archInfra,
              arcadeRow:archArcadeRow, pumpHall:archPumpHall, canalTerrace:archCanalTerrace };
function pickFamily(C, rs){
  const t=rs.f(), ch=C.chKey;
  if(ch==='vigil')  return t<0.30?'walkup': t<0.52?'cafe': t<0.72?'workshop': t<0.86?'slab': t<0.95?'warehouse':'mixed';
  if(ch==='marrow') return t<0.38?'workshop': t<0.62?'warehouse': t<0.8?'walkup': t<0.92?'infra':'slab';
  if(ch==='sluice') return t<0.34?'canalTerrace': t<0.52?'warehouse': t<0.68?'walkup': t<0.8?'slab': t<0.9?'mixed':'infra';
  if(ch==='split')  return C.branch==='arcade' ? (t<0.55?'arcadeRow': t<0.8?'cafe':'walkup')
                                               : (t<0.5?'warehouse': t<0.8?'workshop':'infra');
  if(ch==='stacks') return t<0.34?'pumpHall': t<0.55?'infra': t<0.72?'warehouse': t<0.86?'tower':'workshop';
  if(ch==='slack')  return t<0.34?'cafe': t<0.6?'workshop': t<0.82?'walkup':'warehouse';
  return t<0.4?'walkup': t<0.7?'workshop':'warehouse';
}
// ================================================================
// STREAMED CHUNKS — the journey is built as it is ridden, from
// stable inputs only: seed, branch, chunk index. Bounded retention.
// ================================================================
const CH_LEN=128, FAR_LEN=512;
const CHUNKS=new Map();          // key -> { group, meshes, lists… }
const staticMeshes=[];           // distance-culled against fog each frame
const PARCEL_GRID=new Set();     // world-cell occupancy (8 m) — persists; builds are ordered
function parcelCellsFree(x0,z0,x1,z1){
  for(let cx=Math.floor(x0/8);cx<=Math.floor(x1/8);cx++)
    for(let cz=Math.floor(z0/8);cz<=Math.floor(z1/8);cz++)
      if(PARCEL_GRID.has(cx*100000+cz)) return false;
  return true;
}
function parcelCellsTake(x0,z0,x1,z1){
  for(let cx=Math.floor(x0/8);cx<=Math.floor(x1/8);cx++)
    for(let cz=Math.floor(z0/8);cz<=Math.floor(z1/8);cz++)
      PARCEL_GRID.add(cx*100000+cz);
}
// road spans owned by the fork assembly (chunks skip road/kerb here)
const ROAD_EXCL={ arcade:[], ropewalk:[] };
function roadExcluded(branch,d){ for(const [a,b] of ROAD_EXCL[branch]) if(d>=a&&d<=b) return true; return false; }

function newChunkCtx(key, chKey, branch){
  const C={ key, chKey, branch,
    fac:Builder(true), furn:Builder(false),
    roadP:[], roadU:[], roadH:[], roadI:[], roadV:0,
    glow:[], streak:[], sign:[], flow:[], steam:[], cableSpans:[], water:[],
    signAnchors:[], ratPts:[], heronPts:[],
    rs:chunkStream('struct',key), rv:chunkStream('vis',key), ra:chunkStream('amb',key),
    hash:Hasher(), group:new THREE.Group(), meshes:[], gy:0, steamN:0 };
  C.hash.s(key);
  return C;
}
function roadStation(C,f,d,half){
  const y=f.y+0.055;
  const b=C.roadP.length/3;            // absolute vertex index of this station's first vert
  C.roadP.push(f.x-f.lx*half,y-0.02,f.z-f.lz*half, f.x,y+0.035,f.z, f.x+f.lx*half,y-0.02,f.z+f.lz*half);
  C.roadU.push(-1,d, 0,d, 1,d);
  C.roadH.push(half,half,half);
  if(C.roadV>0){                        // connect to the previous station of THIS run only
    C.roadI.push(b-3,b,b+1, b-3,b+1,b-2, b-2,b+1,b+2, b-2,b+2,b-1);
  }
  C.roadV++;
}
function endRoadRun(C){ C.roadV=0; }    // breaks the strip between disjoint runs

// ---- kerbs / girders / parapets, chapter-aware (Circuit's language) ----
function edgeKit(C,F,d0,d1){
  const curbC=col(0x1B1430), girdC=col(0x191129), fascC=col(0x2A1C40), railC=col(0x342647);
  const st=F.STEP, i0=Math.max(0,Math.floor(d0/st)), i1=Math.min(F.NF-4,Math.floor(d1/st));
  let lastPier=-99, lastPile=-99, lastRail=-99;
  const rv=C.rv;
  for(let i=i0;i<i1;i+=4){
    const d=i*st;
    if(roadExcluded(C.branch,d)) continue;
    const y=F.y[i], x=F.x[i], z=F.z[i], lx=F.lx[i], lz=F.lz[i];
    const i2=Math.min(F.NF,i+4);
    const x2=F.x[i2], z2=F.z[i2], y2=F.y[i2], lx2=F.lx[i2], lz2=F.lz[i2];
    const chK=CHAPTERS[F.ch[i]].key;
    const overWater = (chK==='longwater'||chK==='ninegates'||chK==='slack');
    if(y>2.9&&!overWater){
      // viaduct girder + rails (the ropewalk)
      for(const s of [-1,1]){
        face(C.furn,[[x+lx*s*4.95,y-1.6,z+lz*s*4.95],[x2+lx2*s*4.95,y2-1.6,z2+lz2*s*4.95],
                   [x2+lx2*s*4.95,y2+0.05,z2+lz2*s*4.95],[x+lx*s*4.95,y+0.05,z+lz*s*4.95]],
                   [lx*s,0,lz*s],varyR(fascC,0.06,rv),null,0,null,null);
      }
      face(C.furn,[[x-lx*4.95,y-1.6,z-lz*4.95],[x2-lx2*4.95,y2-1.6,z2-lz2*4.95],
                 [x2+lx2*4.95,y2-1.6,z2+lz2*4.95],[x+lx*4.95,y-1.6,z+lz*4.95]],
                 [0,-1,0],girdC,null,0,null,null);
      if(d-lastRail>2.7){
        lastRail=d;
        for(const s of [-1,1]){
          for(const hh of [0.55,1.0]){
            face(C.furn,[[x+lx*s*4.6,y+hh,z+lz*s*4.6],[x2+lx2*s*4.6,y2+hh,z2+lz2*s*4.6],
                       [x2+lx2*s*4.6,y2+hh+0.07,z2+lz2*s*4.6],[x+lx*s*4.6,y+hh+0.07,z+lz*s*4.6]],
                       [lx*s,0,lz*s],railC,null,0,null,null);
          }
          strutB(C.furn,x+lx*s*4.6,y+0.05,z+lz*s*4.6,x+lx*s*4.6,y+1.1,z+lz*s*4.6,0.08,railC);
        }
      }
      if(y>4&&d-lastPier>14){
        lastPier=d;
        obox(C.furn,x,0,z,2.3,y-2.9,2.6,Math.atan2(lx,lz),varyR(girdC,0.1,rv));
        obox(C.furn,x,y-2.9,z,3.5,1.2,3.0,Math.atan2(lx,lz),varyR(girdC,0.1,rv));
      }
    } else if(overWater){
      // causeway / crest: piles and a low parapet over black water
      if(d-lastPile>7&&y<6){
        lastPile=d;
        for(const s of [-1,1]) strutB(C.furn,x+lx*s*3.8,-2.0,z+lz*s*3.8,x+lx*s*3.8,y-0.3,z+lz*s*3.8,0.55,girdC);
      }
      for(const s of [-1,1]){
        face(C.furn,[[x+lx*s*4.75,y-0.6,z+lz*s*4.75],[x2+lx2*s*4.75,y2-0.6,z2+lz2*s*4.75],
                   [x2+lx2*s*4.75,y2+0.38,z2+lz2*s*4.75],[x+lx*s*4.75,y+0.38,z+lz*s*4.75]],
                   [lx*s,0,lz*s],varyR(curbC,0.1,rv),null,0,null,null);
        face(C.furn,[[x+lx*s*4.75,y+0.38,z+lz*s*4.75],[x2+lx2*s*4.75,y2+0.38,z2+lz2*s*4.75],
                   [x2+lx2*s*5.05,y2+0.38,z2+lz2*s*5.05],[x+lx*s*5.05,y+0.38,z+lz*s*5.05]],
                   [0,1,0],varyR(curbC,0.1,rv),null,0,null,null);
      }
    } else {
      // street kerbs
      for(const s of [-1,1]){
        const c=varyR(curbC,0.08,rv);
        face(C.furn,[[x+lx*s*4.72,y+0.0,z+lz*s*4.72],[x2+lx2*s*4.72,y2+0.0,z2+lz2*s*4.72],
                   [x2+lx2*s*4.72,y2+0.19,z2+lz2*s*4.72],[x+lx*s*4.72,y+0.19,z+lz*s*4.72]],
                   [lx*s,0,lz*s],c,null,0,null,null);
        face(C.furn,[[x+lx*s*4.72,y+0.19,z+lz*s*4.72],[x2+lx2*s*4.72,y2+0.19,z2+lz2*s*4.72],
                   [x2+lx2*s*5.12,y2+0.19,z2+lz2*s*5.12],[x+lx*s*5.12,y+0.19,z+lz*s*5.12]],
                   [0,1,0],c,null,0,null,null);
      }
    }
  }
}

// ---- ground: slabs + sidewalks + water planes, per chapter ----
function groundKit(C,F,d0,d1){
  const rv=C.rv, rs=C.rs;
  const chK=C.chKey;
  const st=F.STEP;
  const walkC=col(0x1C1430), slabA=col(0x100A1E), slabB=col(0x171028);
  const yLift = C.branch==='ropewalk' ? -0.015 : 0;   // avoids z-fights where branches touch
  if(chK==='longwater'||chK==='ninegates'){
    // black water: a broad plane per chunk, lit by whatever is really here
    const mid=getFrame(F,(d0+d1)/2);
    const glows=[];
    for(const g of C.glow){ if(glows.length<6&&g.fogR>0.2) glows.push({x:g.x,z:g.z,w:9,c:scale(g.c,0.5)}); }
    C.water.push({ x:mid.x, z:mid.z, w:900, h:d1-d0+220, y:-1.6, glows });
    CENSUS.waterFeatures++;
    return;
  }
  if(chK==='slack'){
    // harbor quay: buildings hold one side; the basin takes the other
    const side=-PLAN.canalSide;
    const mid=getFrame(F,(d0+d1)/2);
    C.water.push({ x:mid.x-mid.lx*side*230, z:mid.z-mid.lz*side*230, w:640, h:d1-d0+240, y:-1.5, glows:[] });
    CENSUS.waterFeatures++;
    for(let d=d0;d<d1;d+=6){
      const f=frameCopy(F,d), f2=frameCopy(F,Math.min(F.LEN-1,d+6));
      const wc=varyR(walkC,0.12,rv);
      for(const ss of [side,-side]){
        face(C.furn,[[f.x+f.lx*ss*4.85,f.y+0.13,f.z+f.lz*ss*4.85],[f2.x+f2.lx*ss*4.85,f2.y+0.13,f2.z+f2.lz*ss*4.85],
                   [f2.x+f2.lx*ss*8.1,f2.y+0.13,f2.z+f2.lz*ss*8.1],[f.x+f.lx*ss*8.1,f.y+0.13,f.z+f.lz*ss*8.1]],
                   [0,1,0],wc,null,0,null,null);
      }
      const sc=varyR(rv.chance(0.5)?slabA:slabB,0.18,rv);
      face(C.furn,[[f.x+f.lx*side*8.1,f.y+0.05,f.z+f.lz*side*8.1],[f2.x+f2.lx*side*8.1,f2.y+0.05,f2.z+f2.lz*side*8.1],
                 [f2.x+f2.lx*side*34,f2.y+0.05,f2.z+f2.lz*side*34],[f.x+f.lx*side*34,f.y+0.05,f.z+f.lz*side*34]],
                 [0,1,0],sc,null,0,null,null);
      // quay wall dropping to the water on the open side
      face(C.furn,[[f.x-f.lx*side*8.1,f.y+0.13,f.z-f.lz*side*8.1],[f2.x-f2.lx*side*8.1,f2.y+0.13,f2.z-f2.lz*side*8.1],
                 [f2.x-f2.lx*side*8.1,-1.8,f2.z-f2.lz*side*8.1],[f.x-f.lx*side*8.1,-1.8,f.z-f.lz*side*8.1]],
                 [-f.lx*side,0,-f.lz*side],varyR(col(0x1C1532),0.08,rv),null,0,null,null);
    }
    return;
  }
  // under an elevated span: dark yards, not a void
  {
    let anyHigh=false;
    for(let d=d0;d<d1;d+=24){ if(getFrame(F,d).y>2.9){ anyHigh=true; break; } }
    if(anyHigh){
      const mid=getFrame(F,(d0+d1)/2);
      face(C.furn,[[mid.x-90,-0.02,mid.z-(d1-d0)/2-30],[mid.x+90,-0.02,mid.z-(d1-d0)/2-30],
                 [mid.x+90,-0.02,mid.z+(d1-d0)/2+30],[mid.x-90,-0.02,mid.z+(d1-d0)/2+30]],
                 [0,1,0],col(0x0B0916),null,0,null,null);
      // yard clutter: containers and sheet stacks the viaduct looks down on
      for(let k=0;k<7;k++){
        const d=d0+rs.r(6,d1-d0-6);
        const f=getFrame(F,d);
        const sdd=rs.chance(0.5)?1:-1, off=rs.r(9,42);
        const px=f.x+f.lx*sdd*off, pz=f.z+f.lz*sdd*off;
        if(!corridorClear(px,pz,7.4,0,3.4)) continue;
        obox(C.furn,px,0,pz,rs.r(2.4,5),rs.r(2.2,3.4),rs.r(2.4,6),rs.r(0,6.28),varyR(col(0x191129),0.2,rv));
      }
    }
  }
  // land: sidewalks hugging the road + coarse block slabs behind
  // (short chords so corner curvature never lets a walk cut the asphalt)
  for(let d=d0;d<d1;d+=6){
    const f=frameCopy(F,d);
    if(f.y>2.9) continue;                        // under the ropewalk the yards handle ground
    const f2=frameCopy(F,Math.min(F.LEN-1,d+6));
    for(const s of [-1,1]){
      const wc=varyR(walkC,0.12,rv);
      const off=4.85;
      face(C.furn,[[f.x+f.lx*s*off,f.y+0.13+yLift,f.z+f.lz*s*off],[f2.x+f2.lx*s*off,f2.y+0.13+yLift,f2.z+f2.lz*s*off],
                 [f2.x+f2.lx*s*(off+3.3),f2.y+0.13+yLift,f2.z+f2.lz*s*(off+3.3)],[f.x+f.lx*s*(off+3.3),f.y+0.13+yLift,f.z+f.lz*s*(off+3.3)]],
                 [0,1,0],wc,null,0,null,null);
      const sc=varyR(rv.chance(0.5)?slabA:slabB,0.18,rv);
      face(C.furn,[[f.x+f.lx*s*(off+3.3),f.y+0.05+yLift,f.z+f.lz*s*(off+3.3)],[f2.x+f2.lx*s*(off+3.3),f2.y+0.05+yLift,f2.z+f2.lz*s*(off+3.3)],
                 [f2.x+f2.lx*s*34,f2.y+0.05+yLift,f2.z+f2.lz*s*34],[f.x+f.lx*s*34,f.y+0.05+yLift,f.z+f.lz*s*34]],
                 [0,1,0],sc,null,0,null,null);
    }
  }
  // far ground sheet so the block edge never reads as a void line
  { const mid=getFrame(F,(d0+d1)/2);
    face(C.furn,[[mid.x-420,-0.06,mid.z-(d1-d0)/2-70],[mid.x+420,-0.06,mid.z-(d1-d0)/2-70],
               [mid.x+420,-0.06,mid.z+(d1-d0)/2+70],[mid.x-420,-0.06,mid.z+(d1-d0)/2+70]],
               [0,1,0],col(0x07060D),null,0,null,null); }
}

// ---- the sluice canal: rain's public procession, one chapter long ----
function canalKit(C,F,d0,d1){
  const rv=C.rv, side=PLAN.canalSide;
  const wallC=col(0x1C1532);
  const st=F.STEP;
  let lastWeir=-999;
  for(let d=d0;d<d1;d+=12){
    const f=frameCopy(F,d), f2=frameCopy(F,Math.min(F.LEN-1,d+12));
    const o0=8.6, o1=14.2;
    // near wall, far wall, water between at -1.15
    for(const o of [o0,o1]){
      face(C.furn,[[f.x+f.lx*side*o,f.y-1.6,f.z+f.lz*side*o],[f2.x+f2.lx*side*o,f2.y-1.6,f2.z+f2.lz*side*o],
                 [f2.x+f2.lx*side*o,f2.y+0.42,f2.z+f2.lz*side*o],[f.x+f.lx*side*o,f.y+0.42,f.z+f.lz*side*o]],
                 [f.lx*side*(o===o0?-1:1),0,f.lz*side*(o===o0?-1:1)],varyR(wallC,0.1,rv),null,0,null,null);
      face(C.furn,[[f.x+f.lx*side*o,f.y+0.42,f.z+f.lz*side*o],[f2.x+f2.lx*side*o,f2.y+0.42,f2.z+f2.lz*side*o],
                 [f2.x+f2.lx*side*(o+0.32),f2.y+0.42,f2.z+f2.lz*side*(o+0.32)],[f.x+f.lx*side*(o+0.32),f.y+0.42,f.z+f.lz*side*(o+0.32)]],
                 [0,1,0],varyR(wallC,0.1,rv),null,0,null,null);
    }
    if(d-lastWeir>rv.r(80,130)){
      lastWeir=d;
      // a weirlet step: the canal audibly drops half a metre
      const mx=f.x+f.lx*side*(o0+o1)/2, mz=f.z+f.lz*side*(o0+o1)/2;
      box(C.furn,mx-2.8,f.y-1.5,mz-0.5,mx+2.8,f.y-0.6,mz+0.5,{c:scale(wallC,0.85)});
      flowC(C,mx,f.y-0.85,mz+0.55,0,Math.atan2(f.tx,f.tz),0,4.6,0.9,scale(col(HEX.teal),0.7),1.8,8,0.55,rv.f());
      steamC(C,mx,f.y-1.1,mz+1.2,2.2,1.6,rv.f()*10,0.3);
      glowC(C,mx,f.y+0.9,mz,0.5,scale(col(HEX.teal),0.5),1,rv.f(),0.3);
    }
  }
  // canal water strip: follows the road, segment by rotated segment
  for(let d=d0;d<d1;d+=32){
    const f=getFrame(F,Math.min(F.LEN-1,d+16));
    C.water.push({ x:f.x+f.lx*side*11.4, z:f.z+f.lz*side*11.4, w:5.4, h:36, y:f.y-1.15,
      yaw:Math.atan2(f.tx,f.tz),
      glows:[{x:f.x+f.lx*side*11.4, z:f.z+f.lz*side*11.4, w:4, c:scale(col(HEX.teal),0.3)}] });
    CENSUS.waterFeatures++;
  }
  // railings between road and canal
  for(let d=d0;d<d1;d+=8){
    const f=frameCopy(F,d), f2=frameCopy(F,Math.min(F.LEN-1,d+8));
    pRailRun(C,f.x+f.lx*side*8.35,f.y+0.14,f.z+f.lz*side*8.35,f2.x+f2.lx*side*8.35,f2.y+0.14,f2.z+f2.lz*side*8.35,col(0x342647));
  }
}
// ---- near-chunk realization ----
function nearestFrameD(F,x,z,d0,d1){
  let best=1e9,bd=d0;
  const i0=Math.max(0,Math.floor(d0/F.STEP)), i1=Math.min(F.NF,Math.ceil(d1/F.STEP));
  for(let i=i0;i<=i1;i+=2){ const dd=(F.x[i]-x)**2+(F.z[i]-z)**2; if(dd<best){ best=dd; bd=i*F.STEP; } }
  return bd;
}
function placeSignC(C,F,d0,d1,a,cell,mode,tint){
  const rv=C.rv;
  const phase=rv.f();
  const s=a.big? rv.r(4.5,6.5) : a.kind==='blade'? rv.r(1.7,2.6) : rv.r(2.0,3.0);

function chunkSphere(C){

    if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y; if(z<minZ)minZ=z; if(z>maxZ)maxZ=z; seen=true; } };
  scan(C.fac.p,3); scan(C.furn.p,3); scan(C.roadP,3);

  const c=new THREE.Vector3((minX+maxX)/2,(minY+maxY)/2,(minZ+maxZ)/2);

  return new THREE.Sphere(c,r);

function makeCableMesh(spans,sphere){
  if(!spans.length) return null;
  const segs=14, P=[],T=[],PH=[],AM=[],PP=[];
  for(const cs of spans){
    const px=cs.bz-cs.az, pz=-(cs.bx-cs.ax);
    const pl=Math.hypot(px,pz)||1;
    for(let i=0;i<segs;i++){
      for(const t of [i/segs,(i+1)/segs]){
        const x=cs.ax+(cs.bx-cs.ax)*t, z=cs.az+(cs.bz-cs.az)*t;
        const y=cs.ay+(cs.by-cs.ay)*t - Math.sin(t*Math.PI)*cs.sag;
        P.push(x,y,z); T.push(t); PH.push(cs.ph); AM.push(cs.amp); PP.push(px/pl,0,pz/pl);
      }
    }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
  g.setAttribute('aT',new THREE.Float32BufferAttribute(T,1));
  g.setAttribute('aPh',new THREE.Float32BufferAttribute(PH,1));
  g.setAttribute('aAm',new THREE.Float32BufferAttribute(AM,1));
  g.setAttribute('aPerp',new THREE.Float32BufferAttribute(PP,3));
  g.boundingSphere=sphere;
  return new THREE.LineSegments(g,cableMat);
}
const ACTIVE_RATPTS=[], ACTIVE_HERONS=[];
function finalizeChunk(C){
  const sphere=chunkSphere(C);
  const add=(m)=>{ if(!m) return; C.meshes.push(m); C.group.add(m); staticMeshes.push(m); };
  if(C.fac.vc>0) add(new THREE.Mesh(buildGeom(C.fac),facadeMat));
  if(C.furn.vc>0) add(new THREE.Mesh(buildGeom(C.furn),furnMat));
  if(C.roadP.length){
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(C.roadP,3));
    g.setAttribute('uv',new THREE.Float32BufferAttribute(C.roadU,2));
    g.setAttribute('aHw',new THREE.Float32BufferAttribute(C.roadH,1));
    g.setIndex(C.roadI); g.computeBoundingSphere();
    add(new THREE.Mesh(g,roadMat));
  }
  add(makeGlowMesh(C.glow,sphere));
  add(makeStreakMesh(C.streak,sphere));
  add(makeSignMesh(C.sign,sphere));
  add(makeFlowMesh(C.flow,sphere));
  add(makeSteamMesh(C.steam,sphere));
  add(makeCableMesh(C.cableSpans,sphere));
  for(const w of C.water){
    const m=new THREE.Mesh(planeGeoW, waterMatFor((w.glows||[]).map(g=>({x:g.x,z:g.z,w:g.w,c:g.c}))));
    m.position.set(w.x,w.y,w.z); m.scale.set(w.w,1,w.h);
    if(w.yaw) m.rotation.y=w.yaw;
    C.meshes.push(m); C.group.add(m); staticMeshes.push(m);
  }
  scene.add(C.group);
  for(const rp2 of C.ratPts) ACTIVE_RATPTS.push({...rp2, state:0, t:0, chunk:C.key});
  for(const hp of C.heronPts) ACTIVE_HERONS.push({...hp, state:0, t:0, chunk:C.key});
  REALIZED_HASH=(REALIZED_HASH ^ C.hash.raw())>>>0;
  CENSUS.chunksBuilt++;
  C.finalized=true;
}
function disposeChunk(key){
  const C=CHUNKS.get(key); if(!C||!C.finalized) { CHUNKS.delete(key); return; }
  for(const m of C.meshes){
    const i=staticMeshes.indexOf(m); if(i>=0) staticMeshes.splice(i,1);
    if(m.geometry&&m.geometry!==planeGeoW) m.geometry.dispose();
    if(m.material!==facadeMat&&m.material!==furnMat&&m.material!==roadMat&&m.material!==glowMat
       &&m.material!==streakMat&&m.material!==signMat&&m.material!==flowMat&&m.material!==steamMat
       &&m.material!==cableMat) m.material.dispose();
  }
  scene.remove(C.group);
  for(let i=ACTIVE_RATPTS.length-1;i>=0;i--) if(ACTIVE_RATPTS[i].chunk===key) ACTIVE_RATPTS.splice(i,1);
  for(let i=ACTIVE_HERONS.length-1;i>=0;i--) if(ACTIVE_HERONS[i].chunk===key) ACTIVE_HERONS.splice(i,1);
  CHUNKS.delete(key);
  CENSUS.chunksDisposed++;
}

function realizeFar(C,idx){
  const F=BR.arcade;
  const d0=idx*FAR_LEN, d1=Math.min(F.LEN,(idx+1)*FAR_LEN);
  const rs=C.rs, rv=C.rv;
  const mid=getFrame(F,(d0+d1)/2);
  C.chKey=CHAPTERS[mid.ch].key;
  const overWater=(C.chKey==='longwater'||C.chKey==='ninegates');
  const farShore=(C.chKey==='slack');
  const n=overWater?10:16;
  for(let k=0;k<n;k++){
    const d=d0+rs.r(0,d1-d0);
    const f=getFrame(F,Math.min(F.LEN-1,d));
    const side=rs.chance(0.5)?1:-1;
    const off=overWater?rs.r(420,760):farShore?rs.r(380,700):rs.r(220,560);
    const x=f.x+f.lx*side*off+rs.r(-60,60), z=f.z+f.lz*side*off+rs.r(-60,60);
    const w=rs.r(14,42), dp=rs.r(14,42), h=rs.r(45,175);
    CENSUS.farTowers++;
    C.hash.s('far').n(x).n(z).n(h);
    // every stream draw happens for every tower; low quality only skips the bake
    const cc=varyR(col(0x100B1E),0.25,rv);
    const tint=rv.chance(0.32)?scale(col(HEX.teal),0.5):scale(col(HEX.amb),0.55);
    const inf=[rs.r(3,4.5),rs.r(3,4),0.055,rv.r(0,100)];
    const beacon=rv.chance(0.2), by2=h+rv.r(2,6), bp=rv.f();
    if(k%Q.farEvery!==0) continue;
    box(C.fac,x-w/2,0,z-dp/2,x+w/2,h,z+dp/2,{c:cc,tint,inf,kind:K_WIN});
    if(beacon) glowC(C,x,by2,z,0.6,scale(col(HEX.rose),0.8),1,bp,1);
  }
}

function lmMarrow(C){
  const F=BR.arcade, rv=C.rv, rs=C.rs;
  const mSpan=spanOf('arcade','marrow');
  const a=PLAN.nodesA[PLAN.marrowRun.a], b=PLAN.nodesA[PLAN.marrowRun.b];
  const dA=findNearestD(F,a.x,a.z,mSpan.start-120,mSpan.end+120);
  const dB=findNearestD(F,b.x,b.z,mSpan.start-120,mSpan.end+120);
  const d0=Math.min(dA,dB), d1=Math.max(dA,dB);
  const deckC=col(0x1D142E), railC=col(0x120D20), strC=col(0x241A38);
  const DY=8.4;
  const pts=[];
  // deck rides the street: it owns this sky
  const ext=130;
  for(let d=d0-ext; d<=d1+ext; d+=2.8){
    const f=getFrame(F,clamp(d,0,F.LEN-1));
    let px=f.x, pz=f.z, tx=f.tx, tz=f.tz;
    if(d<d0){ const f0=getFrame(F,d0); px=f0.x+f0.tx*(d-d0); pz=f0.z+f0.tz*(d-d0); tx=f0.tx; tz=f0.tz; }
    if(d>d1){ const f1=getFrame(F,d1); px=f1.x+f1.tx*(d-d1); pz=f1.z+f1.tz*(d-d1); tx=f1.tx; tz=f1.tz; }
    pts.push({x:px,z:pz,tx,tz});
  }
  for(let i=0;i<pts.length-1;i++){
    const p=pts[i], p2=pts[i+1];
    const lx=p.tz, lz=-p.tx;
    face(C.furn,[[p.x-lx*1.9,DY+0.4,p.z-lz*1.9],[p2.x-lx*1.9,DY+0.4,p2.z-lz*1.9],
               [p2.x+lx*1.9,DY+0.4,p2.z+lz*1.9],[p.x+lx*1.9,DY+0.4,p.z+lz*1.9]],[0,1,0],deckC,null,0,null,null);
    face(C.furn,[[p.x-lx*1.9,DY-0.55,p.z-lz*1.9],[p2.x-lx*1.9,DY-0.55,p2.z-lz*1.9],
               [p2.x+lx*1.9,DY-0.55,p2.z+lz*1.9],[p.x+lx*1.9,DY-0.55,p.z+lz*1.9]],[0,-1,0],scale(deckC,0.7),null,0,null,null);
    for(const s of [-1,1]){
      face(C.furn,[[p.x+lx*s*1.9,DY-0.55,p.z+lz*s*1.9],[p2.x+lx*s*1.9,DY-0.55,p2.z+lz*s*1.9],
                 [p2.x+lx*s*1.9,DY+0.4,p2.z+lz*s*1.9],[p.x+lx*s*1.9,DY+0.4,p.z+lz*s*1.9]],
                 [lx*s,0,lz*s],scale(deckC,0.8),null,0,null,null);
      face(C.furn,[[p.x+lx*s*0.72,DY+0.4,p.z+lz*s*0.72],[p2.x+lx*s*0.72,DY+0.4,p2.z+lz*s*0.72],
                 [p2.x+lx*s*0.72,DY+0.52,p2.z+lz*s*0.72],[p.x+lx*s*0.72,DY+0.52,p.z+lz*s*0.72]],
                 [lx*s,0,lz*s],railC,null,0,null,null);
    }
  }
  // portals: paired columns clear of the kerbs, every 13.5 m
  for(let d=d0-ext+6; d<d1+ext-6; d+=13.5){
    const i=Math.floor((d-(d0-ext))/2.8);
    if(i<0||i>=pts.length) continue;
    const p=pts[i], lx=p.tz, lz=-p.tx;
    for(const s of [-1,1]) strutB(C.furn,p.x+lx*s*6.3,0,p.z+lz*s*6.3,p.x+lx*s*6.3,DY-0.2,p.z+lz*s*6.3,0.5,strC);
    strutB(C.furn,p.x-lx*6.3,DY-0.5,p.z-lz*6.3,p.x+lx*6.3,DY-0.5,p.z+lz*6.3,0.4,strC);
    if(rs.chance(0.4)) glowC(C,p.x,DY-0.7,p.z,0.5,scale(col(HEX.teal),0.55),0,rv.f(),0);
  }
  // deck joints drip: rain finds every seam
  for(let d=d0+10; d<d1; d+=rs.r(24,40)){

    for(const ex of [-7,7]) strutB(C.furn,px+ex,0,pz,px+ex,DY+0.4,pz,0.4,strC);
    box(C.furn,px-7.5,DY+3.1,pz-1.9,px+7.5,DY+3.45,pz+1.9,{c:col(0x18102A)});
    for(const ex of [-6,0,6]) strutB(C.furn,px+ex,DY+0.8,pz+1.3,px+ex,DY+3.1,pz+1.3,0.14,strC);

    C.sign.push({x:px-2,y:DY+2.6,z:pz+side*2.0,yaw:side>0?0:Math.PI,sx:1.9,sy:1.9,cell:CELL_BIKE,c:scale(col(HEX.teal),1.1),mode:0,phase:rv.f()});
    CENSUS.signs++;

    pFigure(C,px-3.4,DY+0.8,pz-0.4,rv.r(0,6.28),{umbrella:true});
  }

function lmFork(C){
  const rv=C.rv;
  const A=BR.arcade, B2=BR.ropewalk;
  // the shared mouth at each end of the split, drawn once on the un-offset line
  function mouth(F,dStart,dEnd){
    // stations on the same global grid as the chunks, overlapping one
    // station past each end so the ribbon joins without a seam
    const iA=Math.max(0, 2*Math.ceil(dStart/(F.STEP*2)) - 2);
    const iB=Math.min(F.NF, 2*Math.floor(dEnd/(F.STEP*2)) + 2);
    for(let i=iA; i<=iB; i+=2){
      const d=i*F.STEP;
      const f=getFrame(F,d);
      const off=Math.abs(f.off);
      const ux=f.x-f.lx*f.off, uz=f.z-f.lz*f.off;
      const half=4.7+off;
      roadStation(C,{x:ux,y:f.y,z:uz,lx:f.lx,lz:f.lz},d,half);
    }
    endRoadRun(C);
  }
  mouth(A,FORKGEO.D_FORK-FORKGEO.RAMP-2,FORKGEO.D_FORK+2);
  mouth(A,FORKGEO.RJ.arcade-FORKGEO.RAMP-16,FORKGEO.RJ.arcade-12);
  mouth(B2,FORKGEO.RJ.ropewalk-FORKGEO.RAMP-16,FORKGEO.RJ.ropewalk-12);
  // splitter island: the kerbed nose that makes the choice physical
  function island(sampler,d0,d1,noseAtStart){
    const curbC=col(0x1B1430);
    let first=null,last=null;
    for(let d=d0;d<=d1;d+=2.8){
      const [ax,ay,az,bx,by,bz]=sampler(d);
      const mx=(ax+bx)/2, mz=(az+bz)/2, my=Math.max(ay,by);
      const sep=Math.hypot(ax-bx,az-bz);
      const gap=sep-9.4-0.5;
      if(gap>0.25&&gap<9){
        const w=Math.min(gap,3.2);
        box(C.furn,mx-w/2,my+0.055,mz-1.5,mx+w/2,my+0.29,mz+1.5,{c:curbC});
        if(!first) first=[mx,my,mz];
        last=[mx,my,mz];
      }
    }
    const nose=noseAtStart?first:last;
    if(nose){
      pBollard(C,nose[0],nose[1]+0.29,nose[2],col(0x241A28),true);
      glowC(C,nose[0],nose[1]+1.6,nose[2],0.8,scale(col(HEX.amb),1.0),1,rv.f(),0.3);
    }
  }
  island((d)=>{ const fa=getFrame(A,d); const ax=fa.x,ay=fa.y,az=fa.z;
                const fb=getFrame(B2,d); return [ax,ay,az,fb.x,fb.y,fb.z]; },
         FORKGEO.D_FORK-14, FORKGEO.D_FORK+150, true);
  island((u)=>{ const fa=getFrame(A,FORKGEO.RJ.arcade-u); const ax=fa.x,ay=fa.y,az=fa.z;
                const fb=getFrame(B2,FORKGEO.RJ.ropewalk-u); return [ax,ay,az,fb.x,fb.y,fb.z]; },
         12, 160, false);
  // the gantry: two glyphs, one promise each
  {
    const f=getFrame(A,D_FORK_GATE-38);
    const yaw=Math.atan2(-f.tx,-f.tz);
    const strC=col(0x2A2038);
    for(const s of [-1,1]) strutB(C.furn,f.x+f.lx*s*6.0,f.y,f.z+f.lz*s*6.0,f.x+f.lx*s*6.0,f.y+6.4,f.z+f.lz*s*6.0,0.22,strC);
    strutB(C.furn,f.x-f.lx*6.0,f.y+6.0,f.z-f.lz*6.0,f.x+f.lx*6.0,f.y+6.0,f.z+f.lz*6.0,0.2,strC);
    const leftIsArc=PLAN.fork.arcadeLeft;
    const cl=leftIsArc?CELL_FORK_L:CELL_FORK_R, cr=leftIsArc?CELL_FORK_R:CELL_FORK_L;
    const tl=leftIsArc?scale(col(HEX.amb),1.1):scale(col(HEX.teal),1.0);
    const tr=leftIsArc?scale(col(HEX.teal),1.0):scale(col(HEX.amb),1.1);
    C.sign.push({x:f.x+f.lx*2.1,y:f.y+4.9,z:f.z+f.lz*2.1,yaw,sx:2.4,sy:2.4,cell:cl,c:tl,mode:0,phase:rv.f()});
    C.sign.push({x:f.x-f.lx*2.1,y:f.y+4.9,z:f.z-f.lz*2.1,yaw,sx:2.4,sy:2.4,cell:cr,c:tr,mode:0,phase:rv.f()});
    CENSUS.signs+=2;
    streakC(C,f.x,f.y+0.09,f.z,Math.atan2(-f.tx,-f.tz),14,3.0,scale(col(HEX.amb),0.55),0,rv.f(),0.6);
  }
  C.hash.s('fork').n(FORKGEO.D_FORK).n(FORKGEO.RJ.arcade).n(FORKGEO.RJ.ropewalk);
}

function lmNineGates(C){

  const N=PLAN.weir.gates, BAY=14;
  const total=N*BAY;
  const brickC=col(0x241636), steelC=col(0x1B1230), concC=col(0x1E1830);
  const openBays=[Math.floor(N*0.22), Math.floor(N*0.5), Math.floor(N*0.78)];
  const moveBay=Math.floor(N*0.62);
  for(let k=0;k<=N;k++){
    const off=(k-N/2)*BAY;

    if(k<N){
      const gx=f.x+perp.x*(off+BAY/2), gz=f.z+perp.z*(off+BAY/2);

// ---- the streaming scheduler: bounded look-ahead, bounded retention ----
function toRopewalkD(dA){
  if(dA<=FORKGEO.D_FORK) return dA;
  if(dA>=FORKGEO.RJ.arcade) return FORKGEO.RJ.ropewalk + (dA-FORKGEO.RJ.arcade);
  const t=(dA-FORKGEO.D_FORK)/(FORKGEO.RJ.arcade-FORKGEO.D_FORK);
  return FORKGEO.D_FORK + t*(FORKGEO.RJ.ropewalk-FORKGEO.D_FORK);
}
const buildQueue=[];
function ensureChunks(sA, buildAll){
  buildQueue.length=0;
  const wantKeys=new Set();
  const push=(key,prio,kind,arg)=>{ wantKeys.add(key);
    if(!CHUNKS.has(key)) buildQueue.push({key,prio,kind,arg}); };
  // near, own line
  {
    const F=BR.arcade;
    const i0=Math.max(0,Math.floor((sA-170)/CH_LEN)), i1=Math.min(Math.floor((F.LEN-1)/CH_LEN),Math.floor((sA+Q.aheadNear)/CH_LEN));
    for(let i=i0;i<=i1;i++) push('arcade:'+i, Math.abs(i*CH_LEN-sA), 'near', {branch:'arcade',idx:i});
  }
  // near, the other line through the split (visible from the gate and beyond;
  // shorter look-ahead than the ridden line — same in every quality tier)
  if(sA>FORKGEO.D_FORK-760 && sA<FORKGEO.RJ.arcade+300){
    const F=BR.ropewalk;
    const sB=toRopewalkD(sA);
    const lo=Math.floor((FORKGEO.D_FORK-FORKGEO.RAMP-60)/CH_LEN), hi=Math.floor((FORKGEO.RJ.ropewalk+120)/CH_LEN);
    const i0=Math.max(lo,Math.floor((sB-170)/CH_LEN)), i1=Math.min(hi,Math.floor((sB+420)/CH_LEN));
    for(let i=i0;i<=i1;i++) push('ropewalk:'+i, Math.abs(i*CH_LEN-sB)+8, 'near', {branch:'ropewalk',idx:i});
  }
  // far silhouettes
  {
    const F=BR.arcade;
    const i0=Math.max(0,Math.floor((sA-320)/FAR_LEN)), i1=Math.min(Math.floor((F.LEN-1)/FAR_LEN),Math.floor((sA+Q.aheadFar)/FAR_LEN));
    for(let i=i0;i<=i1;i++) push('far:'+i, Math.abs(i*FAR_LEN-sA)+4, 'far', {idx:i});
  }
  // landmarks
  for(const lm of LANDMARKS){
    if(sA>lm.trig0-Q.aheadFar+400 && sA<lm.trig1) push('lm:'+lm.key, 2, 'lm', lm);
  }
  buildQueue.sort((a,b)=>a.prio-b.prio);
  const budget = buildAll? 1e9 : 1;
  let built=0;
  for(const q2 of buildQueue){
    if(built>=budget) break;
    buildChunk(q2); built++;
  }
  // dispose what the ride has left behind (one per call)
  for(const [key,C] of CHUNKS){
    if(!C.finalized) continue;
    let drop=false;
    if(C.kind==='near'){
      const dEnd=(C.idx+1)*CH_LEN;
      const ref=C.branchKey==='ropewalk'? toRopewalkD(sA) : sA;
      drop = dEnd < ref-280;
      if(C.branchKey==='ropewalk' && sA>FORKGEO.RJ.arcade+340) drop=true;
    } else if(C.kind==='far'){
      drop = (C.idx+1)*FAR_LEN < sA-560;
    } else if(C.kind==='lm'){
      drop = sA > C.lm.trig1+80;
    }
    if(drop){ disposeChunk(key); break; }
  }
}
function buildChunk(q2){
  if(CHUNKS.has(q2.key)) return;
  let C;
  if(q2.kind==='near'){
    const F=BR[q2.arg.branch];
    C=newChunkCtx(q2.key, 'vigil', q2.arg.branch);
    C.kind='near'; C.idx=q2.arg.idx; C.branchKey=q2.arg.branch;
    CHUNKS.set(q2.key,C);
    realizeNear(C,F,q2.arg.idx);
  } else if(q2.kind==='far'){
    C=newChunkCtx(q2.key, 'far', 'arcade');
    C.kind='far'; C.idx=q2.arg.idx;
    CHUNKS.set(q2.key,C);
    realizeFar(C,q2.arg.idx);
  } else {
    C=newChunkCtx(q2.key, 'lm', 'arcade');
    C.kind='lm'; C.lm=q2.arg;
    CHUNKS.set(q2.key,C);
    q2.arg.builder(C);
  }
  finalizeChunk(C);
}

const skyMesh=(()=>{
  const m=shaderMat({
    vs:`varying vec3 vD; void main(){ vD=position;
      vec4 mv=viewMatrix*vec4(position+cameraPosition,1.0);
      gl_Position=projectionMatrix*mv; gl_Position.z=gl_Position.w*0.99999; }`,
    fs:`${GLSL_H}
    uniform float uTime; uniform float uLmAz; uniform float uSkyDim;
    varying vec3 vD;
    void main(){
      vec3 d=normalize(vD);
      float h=clamp(d.y,-0.08,1.0);
      vec3 zen=vec3(0.004,0.003,0.010);
      vec3 hor=vec3(0.030,0.016,0.048)*mix(0.6,1.0,uSkyDim);
      vec3 c=mix(hor,zen,smoothstep(0.0,0.5,h));
      float az=atan(d.z,d.x);
      float g=n2(vec2(az*2.2,1.7));
      vec3 gl2=mix(vec3(0.10,0.16,0.19),vec3(0.20,0.09,0.13),n2(vec2(az*1.3,7.7)));
      c+=gl2*0.16*pow(1.0-h,3.5)*(0.5+g)*uSkyDim;
      float ad=abs(atan(sin(az-uLmAz),cos(az-uLmAz)));
      c+=vec3(0.09,0.15,0.17)*exp(-ad*ad*4.5)*pow(1.0-h,2.2)*0.42*uSkyDim;
      float cl=n2(vec2(az*3.0+uTime*0.008,d.y*6.0))*n2(vec2(az*7.0-uTime*0.005,d.y*13.0));
      c=mix(c,vec3(0.016,0.010,0.024),smoothstep(0.42,0.8,cl)*smoothstep(0.04,0.35,h)*0.75);
      gl_FragColor=vec4(c,1.0);
    }`,
    uniforms:{uLmAz:{value:0},uSkyDim:{value:1}},
    side:THREE.BackSide, depthWrite:false,
  });
  const mesh=new THREE.Mesh(new THREE.SphereGeometry(1250,24,12),m);
  mesh.frustumCulled=false; mesh.renderOrder=-10; scene.add(mesh);
  return mesh;
})();

function pushDynGlow(x,y,z,size,c,mode,phase,fogR){

function flushDyn(){

  const FK=[];

let AC=null, audioNodes=null;
function audioStart(){
  if(AC) return;
  try { AC=new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ return; }
  const master=AC.createGain(); master.gain.value=0.0;
  const comp=AC.createDynamicsCompressor();
  master.connect(comp); comp.connect(AC.destination);
  // seeded noise buffer
  const NRA=mulberry32((SEED^0x0AD10)|0);
  const buf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
  const ch=buf.getChannelData(0);
  for(let i=0;i<ch.length;i++) ch[i]=NRA()*2-1;
  function noiseThrough(type,freq,q,gain){
    const src=AC.createBufferSource(); src.buffer=buf; src.loop=true;
    src.start(0, (NRA()*1.7)%1.9);
    const f=AC.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q;
    const g=AC.createGain(); g.gain.value=gain;
    src.connect(f); f.connect(g); g.connect(master);
    return {src,f,g};
  }
  const rain=noiseThrough('bandpass',2900,0.55,0.16);   // the veil
  const rumble=noiseThrough('lowpass',130,0.7,0.09);    // the city's chest
  const tire=noiseThrough('bandpass',1600,0.8,0.0);     // wet tyres
  const roar=noiseThrough('lowpass',330,0.6,0.0);       // waterworks
  const hum=(()=>{                                       // mains hum, almost felt
    const o1=AC.createOscillator(); o1.type='triangle'; o1.frequency.value=49.5;
    const o2=AC.createOscillator(); o2.type='triangle'; o2.frequency.value=99.7;
    const g=AC.createGain(); g.gain.value=0.016;
    o1.connect(g); o2.connect(g); g.connect(master); o1.start(); o2.start();
    return {g};
  })();
  master.gain.linearRampToValueAtTime(0.85, AC.currentTime+2.0);
  audioNodes={master,rain,rumble,tire,roar,hum,buf,NRA};
}
function audioBlip(freq,dur,gain,type){
  if(!AC) return;
  const o=AC.createOscillator(); o.type=type||'sine'; o.frequency.value=freq;
  const g=AC.createGain(); g.gain.value=0;
  o.connect(g); g.connect(audioNodes.master);
  const t=AC.currentTime;
  g.gain.linearRampToValueAtTime(gain,t+0.09);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.start(t); o.stop(t+dur+0.1);
}
function audioNoiseBurst(freq,q,dur,gain){
  if(!AC) return;
  const src=AC.createBufferSource(); src.buffer=audioNodes.buf;
  const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq; f.Q.value=q;
  const g=AC.createGain(); g.gain.value=0;
  src.connect(f); f.connect(g); g.connect(audioNodes.master);
  const t=AC.currentTime;
  g.gain.linearRampToValueAtTime(gain,t+dur*0.25);
  g.gain.linearRampToValueAtTime(0.0001,t+dur);
  src.start(t,(audioNodes.NRA()*1.5)%1.5); src.stop(t+dur+0.1);
}
function audioEvent(kind,e){
  if(!AC) return;
  if(kind==='foghorn'){ audioBlip(76,4.2,0.16,'sine'); audioBlip(152,3.0,0.05,'sine'); }
  else if(kind==='skiffhorn'){ audioBlip(130,1.4,0.09,'square'); }
  else if(kind==='gatehorn'){ audioBlip(96,2.6,0.12,'sine'); audioBlip(64,3.4,0.08,'sine'); }
  else if(kind==='thunder'){ audioNoiseBurst(120,0.4,4.5,0.14); }

const frameTimes=[];

const stats={ calls:0, tris:0, fps:0, median:0, p95:0 };

function rideSkip(dm){

renderer.setAnimationLoop(()=>{
  const now=performance.now();

  const dt=Math.min(rawMs/1000,0.05); lastNow=now;
  ambT+=dt; U.uTime.value=ambT; gradePass.uniforms.uT.value=ambT;
  frameTimes.push(rawMs); if(frameTimes.length>240) frameTimes.shift();
  fpsAcc+=dt; fpsN++;
  if(fpsAcc>0.5){ stats.fps=fpsN/fpsAcc; fpsAcc=0; fpsN=0; }

  // ---- ride state (Circuit's model; cruise 7.5) ----
  if(!started){ holdT+=dt; if(holdT>=1.05) started=true; }
  if(keys['KeyW']||keys['ArrowUp']) targetSpeed=clamp(targetSpeed+7.5*dt,4,18);
  if(keys['KeyS']||keys['ArrowDown']) targetSpeed=clamp(targetSpeed-9*dt,4,18);
  const steer=((keys['KeyA']||keys['ArrowLeft'])?1:0)-((keys['KeyD']||keys['ArrowRight'])?1:0);
  if(steer) latT=clamp(latT+steer*5.2*dt,-2.55,2.55);
  else latT*=Math.exp(-dt*0.12);
  getFrame(F,s);
  RIDER_FR.x=_fr.x; RIDER_FR.y=_fr.y; RIDER_FR.z=_fr.z;
  RIDER_FR.tx=_fr.tx; RIDER_FR.ty=_fr.ty; RIDER_FR.tz=_fr.tz;
  RIDER_FR.lx=_fr.lx; RIDER_FR.lz=_fr.lz; RIDER_FR.k=_fr.k;
  RIDER_FR.ch=_fr.ch; RIDER_FR.shel=_fr.shel;
  const f=RIDER_FR;                      // stable snapshot: later getFrame calls reuse _fr
  if(started&&!paused){
    rideT+=dt;
    const gradeMul=clamp(1-f.ty*3.2,0.55,1.28);
    let tgt=ended?0:targetSpeed*gradeMul;
    const remain=F.LEN-s;
    if(remain<130) tgt=Math.min(tgt,Math.max(0,(remain-7)*0.28));  // the measured arrival
    speed+=(tgt-speed)*(1-Math.exp(-dt*0.85));
    s=Math.min(s+speed*dt, F.LEN-8);
    if(!ended&&((remain<18&&speed<1.2)||s>=F.LEN-8.6)){ ended=true; endT=0; }
  }
  if(ended) endT+=dt;
  const nl=lat+(latT-lat)*(1-Math.exp(-dt*5));
  latV=latV+(((nl-lat)/Math.max(dt,0.001))-latV)*0.3; lat=nl;

  // ---- the fork: the line you hold is the road you get ----
  if(!branchLatched&&s>=D_FORK_GATE){
    const leftKey=PLAN.fork.leftBranch, rightKey=PLAN.fork.rightBranch;
    branch = Math.abs(lat)<0.35 ? PLAN.fork.defaultBranch : (lat>0? leftKey : rightKey);

  camera.rotation.y=baseYaw+ant+yawOff+0.13*PLAN.standpipeSide*openBias+Math.sin(ambT*1.15)*0.005*(speed/9);
  camera.rotation.x=Math.asin(clamp(f.ty,-1,1))*0.72-0.025+0.03*openBias+pitOff;
  camera.rotation.z=-roll;
  if(ended){
    const t=smooth01(clamp((endT-1.0)/8,0,1));       // arrival: the eye lifts to the amber path
    camera.rotation.x+=t*0.022;
    camera.rotation.y+=Math.sin(ambT*0.22)*0.02*t;   // and breathes, gently
  }

  U.uCam.value.copy(camera.position);
  skyMesh.position.copy(camera.position);
  basePlane.position.set(camera.position.x,-2.8,camera.position.z);
  // the promise on the sky: first the Standpipe, then the Nine Gates
  const marrowEnd=spanOf(F.key,'marrow').end;
  const prom = s<marrowEnd ? PLAN.standpipe : PLAN.weir;
  skyMesh.material.uniforms.uLmAz.value=Math.atan2(prom.z-camera.position.z,prom.x-camera.position.x);
  updateFog(s);
  skyMesh.material.uniforms.uSkyDim.value=SKY_DIM;
  U.uShelter.value+=(f.shel-U.uShelter.value)*(1-Math.exp(-dt*4));
  updateRoadUniform();
  // gusts breathe, gently — the veil sways, it never lashes
  U.uWind.value.set(4.2+0.5*Math.sin(ambT*0.13), 0, 1.5+0.35*Math.sin(ambT*0.17+2.1));

  // ---- streaming ----
  ensureAcc+=dt;
  if(ensureAcc>0.16){ ensureAcc=0; ensureChunks(toArcadeD(F.key,s), false); }

  // ---- ambient life (never stops) ----
  const sA=toArcadeD(F.key,s);
  updateEvents(sA,F,ambT);
  updateTram(ambT);
  updateVehicles(ambT,camera.position);
  updateDrones(ambT,s,F);
  updateSkiffs(ambT,camera.position);
  updateRats(dt,camera.position);
  updateHerons(dt,camera.position);
  for(const d3 of DYN_LM) d3.update(dt,ambT);
  flushDyn();
  updateAudio(dt,f);

  // ---- fog-distance culling of chunk meshes ----
  {
    const far=U.uFogFar.value*1.06;
    const cp=camera.position;
    for(let i=0;i<staticMeshes.length;i++){
      const m=staticMeshes[i], bs=m.geometry.boundingSphere;
      if(!bs){ m.visible=true; continue; }
      const dx=bs.center.x-cp.x, dy=bs.center.y-cp.y, dz=bs.center.z-cp.z;
      m.visible=(Math.sqrt(dx*dx+dy*dy+dz*dz)-bs.radius)<far;
    }
  }

  renderer.info.autoReset=false;
  renderer.info.reset();
  composer.render();
  stats.calls=renderer.info.render.calls;
  stats.tris=renderer.info.render.triangles;

  // ---- proof: live cheap fields every frame, statistics at 1 Hz ----
  PROOF.distance=+s.toFixed(1);
  PROOF.branch=branchLatched?F.key:null;
  PROOF.branchLatched=branchLatched;
  PROOF.chapter=CHAPTERS[f.ch].name;
  PROOF.chapterKey=CHAPTERS[f.ch].key;
  PROOF.speed=+speed.toFixed(2);
  PROOF.paused=paused; PROOF.ended=ended;
  PROOF.arrived=ended&&endT>0.5;
  PROOF.shelter=+U.uShelter.value.toFixed(3);
  PROOF.weirGate=+WEIR_GATE_STATE.toFixed(3);
  proofAcc+=dt;
  if(proofAcc>1.0){ proofAcc=0; updateProofSlow(); }
});

// ================================================================
// PROOF — a read-only window into what is actually running
// ================================================================
function median(arr,p){ if(!arr.length) return 0;
  const a=arr.slice().sort((x,y)=>x-y);
  return a[Math.min(a.length-1,Math.floor(a.length*p))]; }
const PROOF={
  world:'afterlight-confluence',
  title:'Afterlight Confluence',
  seed:SEED, seedLabel:SEED_LABEL,
  quality:{ requested:QUALITY_REQUESTED, effective:QUALITY, dpr:DPR,
            note:QUALITY_TIERS[QUALITY_REQUESTED]?null:'unknown tier; standard presented' },
  glRenderer:GL_INFO,
  softwareRenderer:/swiftshader|llvmpipe|software/i.test(GL_INFO),
  hashes:{ structural:HASHES.structural, visual:HASHES.visual, ambient:HASHES.ambient,
           world:HASHES.world, realizedContent:'0' },
  route:{
    lengths:{ arcade:+BR.arcade.LEN.toFixed(1), ropewalk:+BR.ropewalk.LEN.toFixed(1) },
    expectedMinutesAtCruise:+(BR.arcade.LEN/7.5/60).toFixed(1),
    chapters:{
      arcade:SPANS.arcade.map(c=>({key:c.key,name:c.name,start:+c.start.toFixed(1),end:+c.end.toFixed(1)})),
      ropewalk:SPANS.ropewalk.map(c=>({key:c.key,name:c.name,start:+c.start.toFixed(1),end:+c.end.toFixed(1)})),
    },
    fork:{ gate:+D_FORK_GATE.toFixed(1), at:+FORKGEO.D_FORK.toFixed(1),
           node:{x:+FORKGEO.node.x.toFixed(1),z:+FORKGEO.node.z.toFixed(1)},
           rejoin:{x:+FORKGEO.rejoin.x.toFixed(1),z:+FORKGEO.rejoin.z.toFixed(1),
                   arcadeD:+FORKGEO.RJ.arcade.toFixed(1), ropewalkD:+FORKGEO.RJ.ropewalk.toFixed(1)},
           leftBranch:PLAN.fork.leftBranch, rightBranch:PLAN.fork.rightBranch,
           defaultBranch:PLAN.fork.defaultBranch },
  },
  landmarks:{
    standpipe:{x:+PLAN.standpipe.x.toFixed(1),z:+PLAN.standpipe.z.toFixed(1),h:+PLAN.standpipe.h.toFixed(1)},
    marrowLine:null,
    brinehouse:'sluice 0.08', sluiceGatehouse:'sluice 0.55',
    gullet:{d:+chD('arcade','stacks',PLAN.gulletT).toFixed(1)},
    nineGates:{x:+PLAN.weir.x.toFixed(1),z:+PLAN.weir.z.toFixed(1),gates:PLAN.weir.gates},
    harborPier:{x:+PLAN.harbor.x.toFixed(1),z:+PLAN.harbor.z.toFixed(1)},
  },
  census:CENSUS,
  animals:{ ratPointsPlanned:0, ratEncounters:0, heronPerches:0, heronLifts:0 },
  actors:{ tram:1, groundVehicles:vehicles.length, drones:PLAN.drones.length, skiffs:skiffs.length,
           figures:0 },
  events:{ scheduled:EVENTS.length, fired:0,
           kinds:EVENTS.map(e=>({kind:e.kind,ch:e.ch,d:+e.d.toFixed(1)})) },
  rain:{ streaks:RAIN_N, splashes:SPLASH_N, foregroundQuadLayer:false },
  chunks:{ built:0, disposed:0, live:0, retainedRange:[0,0] },
  controls:'W/S speed · A/D line & fork · drag look · Space pause · R restart',
  // live
  distance:0, chapter:'', chapterKey:'', branch:null, branchLatched:false,
  speed:0, paused:false, ended:false, arrived:false, shelter:0, weirGate:0,
  drawCalls:0, triangles:0, fps:0, frameMedianMs:0, frameP95Ms:0,
  maxCameraRoll:0, riderContained:true, cameraY:0,
  errors:RUNTIME_ERRORS, contextLost:false,
};
function updateProofSlow(){
  PROOF.drawCalls=stats.calls;
  PROOF.triangles=stats.tris;
  PROOF.fps=+stats.fps.toFixed(1);
  PROOF.frameMedianMs=+median(frameTimes,0.5).toFixed(2);
  PROOF.frameP95Ms=+median(frameTimes,0.95).toFixed(2);
  PROOF.maxCameraRoll=+maxRollSeen.toFixed(4);
  PROOF.riderContained=Math.abs(lat)<=2.8&&Number.isFinite(s);
  PROOF.cameraY=+camera.position.y.toFixed(2);
  PROOF.hashes.realizedContent=('00000000'+REALIZED_HASH.toString(16)).slice(-8);
  PROOF.census=CENSUS;
  PROOF.animals.ratPointsPlanned=CENSUS.ratPoints;
  PROOF.animals.ratEncounters=ratEncounters;
  PROOF.animals.heronPerches=CENSUS.heronPerches;
  PROOF.animals.heronLifts=heronLifts;
  PROOF.actors.figures=CENSUS.figures;
  PROOF.events.fired=eventsFired;
  PROOF.chunks.built=CENSUS.chunksBuilt;
  PROOF.chunks.disposed=CENSUS.chunksDisposed;
  PROOF.chunks.live=CHUNKS.size;
  { let lo=1e9,hi=-1e9;
    for(const [,C] of CHUNKS){ if(C.kind==='near'&&C.branchKey===F.key){ lo=Math.min(lo,C.idx*CH_LEN); hi=Math.max(hi,(C.idx+1)*CH_LEN); } }
    PROOF.chunks.retainedRange=[lo===1e9?0:+lo.toFixed(0), hi===-1e9?0:+hi.toFixed(0)]; }
  PROOF.landmarks.marrowLine=MARROW?{d0:+MARROW.d0.toFixed(1),d1:+MARROW.d1.toFixed(1),deckY:MARROW.DY}:null;
  PROOF.contextLost=CONTEXT_LOST;
  PROOF.rideClock=+rideT.toFixed(1);
  PROOF.ambientClock=+ambT.toFixed(1);
}
// read-only view: internals keep writing PROOF; the window sees a surface
// that silently ignores writes, so the proof is evidence, not an input
const _roCache=new WeakMap();
function roView(obj){
  if(obj===null||typeof obj!=='object') return obj;
  let p=_roCache.get(obj);
  if(!p){
    p=new Proxy(obj,{
      get:(t,k)=>roView(t[k]),
      set:()=>true, deleteProperty:()=>true,
      defineProperty:()=>true, setPrototypeOf:()=>true,
    });
    _roCache.set(obj,p);
  }
  return p;
}
window.__proof=roView(PROOF);

// resize
window.addEventListener('resize',()=>{
  const w=window.innerWidth,h=window.innerHeight;
  camera.aspect=w/h; camera.updateProjectionMatrix();
  renderer.setSize(w,h);
  composer.setSize(w,h);
  bloom.setSize(w/2,h/2);
});

// initial build: the opening exists before the first frame
ensureChunks(toArcadeD(F.key,startD), true);
updateProofSlow();
