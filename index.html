// ---- abyssal causeway pier/rib ----
function gPier(sc, ruin, key) {
  const R = geoRng(key);
  const h = 10 * sc * (1 - ruin * 0.6);
  const g = new THREE.CylinderGeometry(0.55 * sc, 1.0 * sc, h, 8, 3);
  const pos = g.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    if (pos.getY(i) > h * 0.44) { pos.setY(i, h * 0.44 + R() * h * 0.1); pos.setX(i, pos.getX(i) * 0.8); pos.setZ(i, pos.getZ(i) * 0.8); }
  }
  g.computeVertexNormals();
  return [xf(tag(g, 0.78, 0.84, 0.86, 1.2), 0, h / 2, 0)];
}

// ---- courtyard: stylobate + peristyle + fallen pieces ----
function gCourt(sc, ruin, key) {
  const R = geoRng(key);
  const parts = [];
  const w = 16 * sc, l = 20 * sc;
  parts.push(...gStylo(w, l, 2));
  const nx = Math.round(w / 3.4), nz = Math.round(l / 3.4);
  const colH = 4.6 * sc;
  for (let i = 0; i <= nx; i++) for (let j = 0; j <= nz; j++) {
    if (i > 0 && i < nx && j > 0 && j < nz) continue;
    if (R() < 0.35 + ruin * 0.4) continue;
    const cx = -w / 2 + (i / nx) * w, cz = -l / 2 + (j / nz) * l;
    parts.push(...gColumn(colH, 0.55, R() < ruin ? rr(R, 0.3, 0.8) : 0, key + 'c' + i + '_' + j).map(g => xf(g, cx, 0.8, cz)));
  }
  return parts;
}

// ---- amphitheater ----
function gAmphi(rec) {
  const R = geoRng('amphi');
  const parts = [];
  const r0 = 8, tiers = 12, rise = 0.7, depth = 1.55;
  const arcA = -Math.PI * 0.62, arcB = Math.PI * 0.62;      // opening faces the road
  for (let t = 0; t < tiers; t++) {
    const r = r0 + t * depth;
    const segN = Math.max(10, Math.round(r * 0.55 * TESS.seg));
    for (let i = 0; i < segN; i++) {
      const a = lerp(arcA, arcB, i / (segN - 1));
      if (R() < rec.ruin * 0.35) continue;                   // missing seat blocks
      const segLen = (arcB - arcA) * r / segN * 1.02;
      parts.push(xf(box(depth * 0.96, 0.62, segLen, 0.76 + 0.05 * (t % 2), 0.82, 0.81, 1.0 - t * 0.05),
        Math.cos(a) * r, 1.2 + t * rise, Math.sin(a) * r, 0, -a, 0));
    }
    // radial aisle stairs, brighter than the seats so the bowl reads its spokes
    if (t < tiers - 1) for (const aa of [-1.35, -0.65, 0, 0.65, 1.35]) {
      parts.push(xf(box(depth * 1.1, 0.34, 1.1, 1.12, 1.13, 1.08, 0.35),
        Math.cos(aa) * (r + depth / 2), 1.0 + t * rise + rise / 2, Math.sin(aa) * (r + depth / 2), 0, -aa, 0));
    }
  }
  // scaenae: a low broken stage wall closing the mouth chord, pierced at its center
  for (const sd of [1, -1]) {
    const swl = r0 * 0.85;
    const sw = gWallSeg(swl, 2.3, 0.55, 'scaenae' + sd);
    parts.push(xf(sw, -r0 - 2.2, 0.3, sd * (swl / 2 + 1.3)));
  }
  parts.push(...gStatue(0.85, 0.4, 'scanst1').map(g => xf(g, -r0 - 2.6, 0.3, r0 * 0.95)));
  parts.push(...gStatue(0.8, 0.6, 'scanst2').map(g => xf(g, -r0 - 2.6, 0.3, -r0 * 0.95, 0, 1.2, 0)));
  // retaining wall behind the top tier + buttresses
  const rw = r0 + tiers * depth + 0.6;
  const wallN = Math.max(14, Math.round(rw * 0.5 * TESS.seg));
  for (let i = 0; i < wallN; i++) {
    const a = lerp(arcA, arcB, i / (wallN - 1));
    if (R() < rec.ruin * 0.3) continue;
    parts.push(xf(box(1.1, 4.2 + tiers * rise * 0.2, (arcB - arcA) * rw / wallN * 1.05, 0.7, 0.76, 0.77, 1.1),
      Math.cos(a) * rw, 2 + tiers * rise, Math.sin(a) * rw, 0, -a, 0));
    if (i % 4 === 0) parts.push(xf(box(1.8, 3.2, 1.4, 0.66, 0.72, 0.73, 1.2),
      Math.cos(a) * (rw + 1.2), 1.6 + tiers * rise * 0.9, Math.sin(a) * (rw + 1.2), 0, -a, 0));
  }
  // two vomitorium entrances through the seating
  for (const aa of [-0.5, 0.55]) {
    const rMid = r0 + tiers * depth * 0.55;
    parts.push(...gVoussoirArch(1.6, 2.6, 2.2, 0.55, 'amphi-vom' + aa).map(g =>
      xf(g, Math.cos(aa) * rMid, 1 + tiers * rise * 0.4, Math.sin(aa) * rMid, 0, -aa + Math.PI / 2, 0)));
  }
  // performance floor
  parts.push(xf(tag(new THREE.CylinderGeometry(r0 - 0.5, r0 - 0.5, 0.3, Math.max(18, TESS.cyl * 2)), 0.72, 0.78, 0.77, 0.7, false), 0, 0.15, 0));
  // statuary fragments among the seats
  for (let i = 0; i < 4; i++) {
    const a = rr(R, arcA, arcB), rr3 = r0 + rr(R, 2, tiers * depth - 2);
    parts.push(...gStatue(0.7, 0.7, 'amphist' + i).map(g => xf(g, Math.cos(a) * rr3, 1 + (rr3 - r0) / depth * rise, Math.sin(a) * rr3, 0, rr(R, 0, TAU), 0)));
  }
  return parts;
}

// ---- ruined dome housing the bell ----
function gBellDome(rec) {
  const R = geoRng('belldome');
  const parts = [];
  const r = 8.2, drumH = 5.2;
  // drum with window recesses
  const drum = new THREE.CylinderGeometry(r, r * 1.04, drumH, TESS.cyl * 2, 1, true);
  parts.push(xf(tag(drum, 0.9, 0.93, 0.92, 1.0), 0, drumH / 2 + 0.4, 0));
  const winN = 8;
  for (let i = 0; i < winN; i++) {
    const a = i / winN * TAU;
    parts.push(xf(box(1.1, 2.2, 0.5, 0.5, 0.58, 0.62, 0.2), Math.cos(a) * (r - 0.15), drumH * 0.55, Math.sin(a) * (r - 0.15), 0, -a + Math.PI / 2, 0));
  }
  // half-collapsed shell: the breach faces the road (local -x)
  const shell = new THREE.SphereGeometry(r, TESS.sph * 2, TESS.sph, Math.PI * 0.55, Math.PI * 1.45, 0, Math.PI * 0.52);
  const sp = shell.attributes.position;
  for (let i = 0; i < sp.count; i++) {
    const y = sp.getY(i);
    if (y < r * 0.62 && Math.abs(sp.getX(i)) < r * 0.4) sp.setY(i, y + (R() - 0.5) * 0.5);
  }
  shell.computeVertexNormals();
  parts.push(xf(tag(shell, 0.88, 0.92, 0.9, 0.9), 0, drumH + 0.4, 0));
  // ribs
  for (let i = 0; i < 7; i++) {
    const a = Math.PI * 0.55 + (i / 6) * Math.PI * 1.45;
    const rib = new THREE.TorusGeometry(r * 1.01, 0.16, 6, TESS.cyl, Math.PI * 0.5);
    rib.rotateZ(Math.PI / 2); rib.rotateX(-Math.PI / 2); rib.rotateY(a + Math.PI / 2);
    parts.push(xf(tag(rib, 0.96, 0.98, 0.96, 0.7), 0, drumH + 0.4, 0));
  }
  // fallen shell fragments
  for (let i = 0; i < 4; i++) {
    const frag = new THREE.SphereGeometry(r * 0.4, 8, 5, 0, 1.3, 0.5, 0.7);
    parts.push(xf(tag(frag, 0.85, 0.89, 0.87, 1.25), rr(R, -r, -r * 0.3), 0.3, rr(R, -4, 4), rr(R, 0, 3), rr(R, 0, 3), rr(R, 0, 3)));
  }
  // floor
  parts.push(xf(tag(new THREE.CylinderGeometry(r + 1.4, r + 1.8, 0.5, TESS.cyl * 2), 0.85, 0.89, 0.87, 0.8, false), 0, 0.25, 0));
  return parts;
}

// ---- aqueduct: realized per-chunk between s ranges along the abyss edge ----
function gAqueductChunk(rec, sA, sB, chunkOrigin) {
  const parts = [];
  const modL = 8;
  const s0 = Math.max(rec.s0, sA), s1 = Math.min(rec.s1, sB);
  if (s1 <= s0) return parts;
  const i0 = Math.ceil(s0 / modL), i1 = Math.floor(s1 / modL);
  const R = geoRng('aque');
  const channelRise = 6.5;
  for (let i = i0; i < i1; i++) {
    const s = i * modL + modL / 2;
    const rM = mulberry32(streamInt('aque:mod:' + i));
    const collapsed = rM() < rec.ruin * 0.5;
    routeAt(s, _rf);
    const off = armOffset(s, 'R') - rec.off;
    const wx = _rf.x + _rf.nx * off, wz = _rf.z + _rf.nz * off;
    const gy = terrainY(s, off, wx, wz);
    const topY = armY(s, 'R', _rf.y) + channelRise;
    const yaw = Math.atan2(_rf.tx, _rf.tz);
    const pierH = Math.max(2, topY - gy);
    const mk = (g) => { xf(g, wx - chunkOrigin.x, gy, wz - chunkOrigin.z, 0, yaw, 0); parts.push(g); };
    if (collapsed) {
      const stub = Math.max(1.2, pierH * rM() * 0.4);
      mk(xf(box(1.7, stub, 1.7, 0.8, 0.85, 0.86, 1.25), 0, stub / 2, -modL / 2));
      const rub = new THREE.SphereGeometry(1.5, 8, 5);
      rub.scale(1.3, 0.4, 1.1);
      mk(xf(tag(rub, 0.78, 0.83, 0.84, 1.3, false), rr(rM, -1, 1), 0.3, rr(rM, -2, 2)));
      continue;
    }
    // pier with a spread footing that carries weight into the sea floor
    mk(xf(box(2.4, 1.1, 2.4, 0.8, 0.85, 0.85, 1.3), 0, 0.5, -modL / 2));
    mk(xf(box(1.6, pierH, 1.6, 0.86, 0.9, 0.9, 1.1), 0, pierH / 2, -modL / 2));
    mk(xf(box(2.0, 0.4, 2.0, 0.92, 0.95, 0.93, 0.8), 0, pierH - 1.6, -modL / 2));   // impost band
    // arch between piers, with an inner archivolt ring for a layered profile
    for (const g of gVoussoirArch(modL / 2 - 0.9, pierH - 2.4, 1.35, 0.62, 'aq' + i)) {
      g.rotateY(Math.PI / 2);
      mk(xf(g, 0, 0, 0));
    }
    for (const g of gVoussoirArch(modL / 2 - 1.55, pierH - 2.4, 0.8, 0.45, 'aq2' + i)) {
      g.rotateY(Math.PI / 2);
      mk(xf(g, 0, -0.15, 0));
    }
    // channel + parapet, broken in stretches
    mk(xf(box(2.2, 0.5, modL + 0.2, 0.9, 0.94, 0.92, 0.9), 0, pierH + 0.25, 0));
    for (const sd of [1, -1]) {
      if (rM() < 0.75) mk(xf(box(0.4, 0.8, modL * rr(rM, 0.5, 1.0), 0.92, 0.95, 0.93, 0.85), sd * 0.95, pierH + 0.85, rr(rM, -1.5, 1.5)));
    }
    // a maintenance landing juts from every fourth pier
    if (i % 4 === 0) {
      mk(xf(box(3.6, 0.4, 2.6, 0.88, 0.92, 0.9, 0.9), 0, pierH - 0.1, -modL / 2));
      mk(xf(box(0.3, 1.0, 2.4, 0.9, 0.93, 0.91, 0.8), 1.7, pierH + 0.5, -modL / 2));
    }
  }
  return parts;
}

// ---- great temple of the last tide ----
function gTemple(rec) {
  const R = geoRng('temple');
  const parts = [];
  const W = 26, L2 = 40;
  parts.push(...gStylo(W + 8, L2 + 8, 3));
  // peristyle
  const colH = 9.5;
  const nx = 6, nz = 9;
  for (let i = 0; i < nx; i++) for (let j = 0; j < nz; j++) {
    if (i > 0 && i < nx - 1 && j > 0 && j < nz - 1) continue;
    const ruin = R() < rec.ruin ? rr(R, 0.3, 0.8) : (R() < 0.3 ? rr(R, 0.05, 0.2) : 0);
    const cx = -W / 2 + (i / (nx - 1)) * W, cz = -L2 / 2 + (j / (nz - 1)) * L2;
    parts.push(...gColumn(colH, 0.85, ruin, 'tc' + i + '_' + j).map(g => xf(g, cx, 1.2, cz)));
  }
  // cella with the sealed door facing the road (local +x side toward road after rot)
  const cw = W * 0.62, cl = L2 * 0.66, ch2 = 8;
  parts.push(...gWall(cl, ch2, rec.ruin * 0.5, 'tw1').map(g => xf(g, -cw / 2, 1.2, 0)));
  parts.push(...gWall(cl, ch2, rec.ruin * 0.8, 'tw2').map(g => xf(g, cw / 2, 1.2, 0)));
  parts.push(...gWall(cw, ch2, rec.ruin * 0.6, 'tw3').map(g => xf(g, 0, 1.2, -cl / 2, 0, Math.PI / 2, 0)));
  parts.push(...gWall(cw, ch2, rec.ruin * 0.3, 'tw4').map(g => xf(g, 0, 1.2, cl / 2, 0, Math.PI / 2, 0)));
  // THE SEALED DOOR — monumental, dark, framed (faces road side)
  parts.push(xf(box(0.8, 6.2, 3.4, 0.35, 0.42, 0.48, 0.1), cw / 2 + 0.25, 4.2, 0));
  parts.push(xf(box(1.1, 0.9, 4.6, 1.05, 1.06, 1.02, 0.3), cw / 2 + 0.3, 7.6, 0));
  for (const sd of [1, -1]) parts.push(xf(box(1.0, 6.6, 0.7, 1.02, 1.04, 1.0, 0.35), cw / 2 + 0.3, 4.3, sd * 2.35));
  // pediment over the door face
  parts.push(...gPed(1.6, rec.ruin * 0.4, 'tped').map(g => xf(g, cw / 2 + 0.2, ch2 + 1.6, 0, 0, Math.PI / 2, 0)));
  // dome on a tall windowed drum above the cella — the skyline of the whole last chapter
  const dr = cw * 0.6, drumH = 4.6, domeY = 1.2 + ch2 + drumH;
  parts.push(xf(tag(new THREE.CylinderGeometry(dr, dr * 1.04, drumH, TESS.cyl * 2, 1, true), 0.9, 0.94, 0.92, 0.7), 0, 1.2 + ch2 + drumH / 2, 0));
  // drum windows: dark recesses between paired mullions
  const winN2 = 10;
  for (let i = 0; i < winN2; i++) {
    const a = i / winN2 * TAU;
    parts.push(xf(box(1.3, 2.4, 0.5, 0.42, 0.5, 0.56, 0.15),
      Math.cos(a) * (dr - 0.12), 1.2 + ch2 + drumH * 0.52, Math.sin(a) * (dr - 0.12), 0, -a + Math.PI / 2, 0));
    parts.push(xf(box(0.28, 2.6, 0.62, 1.0, 1.02, 1.0, 0.25),
      Math.cos(a + 0.16) * (dr - 0.05), 1.2 + ch2 + drumH * 0.52, Math.sin(a + 0.16) * (dr - 0.05), 0, -(a + 0.16) + Math.PI / 2, 0));
  }
  // buttresses shouldering the drum
  for (let i = 0; i < 8; i++) {
    const a = (i + 0.5) / 8 * TAU;
    parts.push(xf(box(1.5, 3.4, 2.6, 0.86, 0.9, 0.89, 0.8),
      Math.cos(a) * (dr + 0.9), 1.2 + ch2 + 1.4, Math.sin(a) * (dr + 0.9), 0, -a, 0));
  }
  const dome = new THREE.SphereGeometry(dr, TESS.sph * 2, TESS.sph, Math.PI * 0.22, Math.PI * 1.78, 0, Math.PI * 0.5);
  parts.push(xf(tag(dome, 0.93, 0.96, 0.94, 0.55), 0, domeY, 0));
  for (let i = 0; i < 11; i++) {
    const a = Math.PI * 0.22 + (i / 10) * Math.PI * 1.78;
    const rib = new THREE.TorusGeometry(dr * 1.01, 0.17, 6, TESS.cyl, Math.PI * 0.48);
    rib.rotateZ(Math.PI / 2); rib.rotateX(-Math.PI / 2); rib.rotateY(a + Math.PI / 2);
    parts.push(xf(tag(rib, 0.97, 0.99, 0.97, 0.4), 0, domeY, 0));
  }
  // lantern
  if (rec.ruin < 0.5) {
    parts.push(xf(tag(new THREE.CylinderGeometry(1.3, 1.5, 2.0, 8), 0.95, 0.97, 0.95, 0.3), 0, domeY + dr * 0.97, 0));
    parts.push(xf(tag(new THREE.SphereGeometry(0.9, 8, 6, 0, TAU, 0, Math.PI * 0.55), 0.97, 0.99, 0.96, 0.25), 0, domeY + dr * 0.97 + 1.2, 0));
  }
  // grand stair down toward the road
  parts.push(...gStair(2.6, rec.ruin * 0.5, 'tstair').map(g => xf(g, cw / 2 + 6, 0.4, 0, 0, -Math.PI / 2, 0)));
  return parts;
}

// ---- the watching colossus: a broken statue head in the abyss ----
function gColossus(rec) {
  const R = geoRng('colossus');
  const parts = [];
  const S = 11 * rec.sc;
  // skull via lathe profile (lying tilted, half-buried)
  const prof = [];
  const P = [[0.0, 0.0], [0.55, 0.05], [0.8, 0.18], [0.93, 0.4], [1.0, 0.62], [0.96, 0.8], [0.8, 0.93], [0.5, 1.0], [0.0, 1.02]];
  for (const [x, y] of P) prof.push(new THREE.Vector2(x * S * 0.5, y * S));
  const skull = new THREE.LatheGeometry(prof, TESS.lathe * 2);

  parts.push(xf(tag(skull, 0.82, 0.87, 0.88, 0.9), 0, -S * 0.28, 0, 0.9, 0.3, 0.35));

  parts.push(xf(box(S * 0.62, S * 0.09, S * 0.16, 0.85, 0.9, 0.9, 0.8), 0, S * 0.34, S * 0.38, 0.9 - 1.5, 0, 0.35));
  const nose = new THREE.CylinderGeometry(S * 0.05, S * 0.14, S * 0.34, 4, 1);
  parts.push(xf(tag(nose, 0.84, 0.89, 0.89, 0.85), 0, S * 0.2, S * 0.47, 0.6, 0, 0.3));
  // lips ledge
  parts.push(xf(box(S * 0.4, S * 0.07, S * 0.1, 0.8, 0.86, 0.87, 1.0), 0, S * 0.02, S * 0.46, 0.7, 0, 0.3));
  // eye sockets (dark recesses)
  for (const sd of [1, -1]) {
    const eye = new THREE.SphereGeometry(S * 0.09, 10, 8);

  // broken crown fragments scattered
  for (let i = 0; i < 5; i++) {

  return parts;
}

// ---- overlook terrace at the route's end ----
function gOverlook(rec) {
  const parts = [];
  const R = geoRng('overlook');
  // widened terminal plaza
  parts.push(xf(tag(new THREE.CylinderGeometry(13, 13.6, 0.6, 24, 1), 0.4, 0.46, 0.5, 0.4, false), 0, -0.28, 6));
  // balustrade arc beyond the route end
  const rB = 12.2;
  for (let i = 0; i < 17; i++) {
    const a = -Math.PI * 0.42 + (i / 16) * Math.PI * 0.84;
    const bx = Math.sin(a) * rB, bz = 6 + Math.cos(a) * rB;
    if (R() < 0.12) continue;
    parts.push(xf(tag(new THREE.CylinderGeometry(0.14, 0.2, 1.1, 6), 0.96, 0.98, 0.96, 0.4, false), bx, 0.55, bz));
    if (i % 4 === 0) parts.push(xf(box(0.5, 1.4, 0.5, 0.94, 0.96, 0.94, 0.5), bx, 0.7, bz));
  }
  // rail — a horizontal arc capping the balustrade
  const rail = new THREE.TorusGeometry(rB, 0.16, 6, 28, Math.PI * 0.84);
  rail.rotateZ(Math.PI / 2 - Math.PI * 0.42);   // center the arc before laying it flat
  rail.rotateX(Math.PI / 2);
  parts.push(xf(tag(rail, 0.97, 0.99, 0.97, 0.35), 0, 1.15, 6));
  // twin pharos columns flanking the arrival
  for (const sd of [1, -1]) {
    parts.push(...gColumn(8.5, 1.05, 0.06, 'pharos' + sd).map(g => xf(g, sd * 10.5, 0, -6)));
  }
  return parts;
}

// dispatch table: record → array of tagged geometries in local frame
function realizeStruct(rec) {
  const key = rec.t + ':' + rec.s.toFixed(1) + ':' + rec.d.toFixed(1);

  const cell = 24, map = new Map();
  for (let i = 0; i < ROUTE.n; i += 2) {
    const key = Math.floor(ROUTE.px[i] / cell) + ':' + Math.floor(ROUTE.pz[i] / cell);

  for (let ox = -2; ox <= 2; ox++) for (let oz = -2; oz <= 2; oz++) {
    const li = ROUTE_HASH.map.get((cx + ox) + ':' + (cz + oz));
    if (!li) continue;

      const dx = ROUTE.px[i] - x, dz = ROUTE.pz[i] - z;

function lateralStations() {

    else if (d < 38) stepD = 4.2 * mul;
    else if (d < 80) stepD = 8 * mul;

  }

}

  const cols = LAT_ST.length;

/* ---------- the chunk ---------- */
const CHUNKS = new Map();
let chunkStamp = 0;
function buildChunk(ci) {
  const group = new THREE.Group();
  group.matrixAutoUpdate = false;
  const meshes = [];
  const add = (m) => { if (m) { group.add(m); meshes.push(m); } };

  const terrainGeo = buildTerrainGeometry(ci);
  const terrain = new THREE.Mesh(terrainGeo, MATS.terrain);
  terrain.matrixAutoUpdate = false;
  add(terrain);

  const roadGeo = buildRoadGeometry(ci);
  const road = new THREE.Mesh(roadGeo, MATS.road);
  road.matrixAutoUpdate = false;
  add(road);

  const archOut = buildArchitecture(ci);
  if (archOut.arch) { const m = new THREE.Mesh(archOut.arch, MATS.marble); m.matrixAutoUpdate = false; add(m); }
  if (archOut.mosaic) { const m = new THREE.Mesh(archOut.mosaic, MATS.mosaic); m.matrixAutoUpdate = false; add(m); }

  // kelp
  const kelpRecs = BY_CHUNK.kelp[ci];
  add(buildInstanced(PROTO.kelp, kelpRecs, MATS.kelp, (rec, i, mesh) => {
    routeAt(rec.s, _rf);
    const x = _rf.x + _rf.nx * rec.d, z = _rf.z + _rf.nz * rec.d;
    const y = terrainY(rec.s, rec.d, x, z);
    _e1.set(0, rec.ph, 0); _q1.setFromEuler(_e1);
    _m1.compose(_v1.set(x, y - 0.05, z), _q1, _v2.set(rec.g, rec.h, rec.g));
    mesh.setMatrixAt(i, _m1);
  }, { girth: true }));

  // coral by family
  const byFam = {};
  for (const c of BY_CHUNK.coral[ci]) { (byFam[c.f] = byFam[c.f] || []).push(c); }
  for (const fam of Object.keys(byFam)) {
    add(buildInstanced(PROTO.coral[fam], byFam[fam], MATS.coral[fam], (rec, i, mesh) => {
      routeAt(rec.s, _rf);
      const x = _rf.x + _rf.nx * rec.d, z = _rf.z + _rf.nz * rec.d;
      const y = terrainY(rec.s, rec.d, x, z);
      _e1.set(0, rec.rot, 0); _q1.setFromEuler(_e1);
      _m1.compose(_v1.set(x, y - 0.03, z), _q1, _v2.set(rec.sc, rec.sc, rec.sc));
      mesh.setMatrixAt(i, _m1);
    }, { tint: true }));
  }

  // shoulder organisms
  const crabs = BY_CHUNK.smalls[ci].filter(r => r.k === 'crab');
  const stars = BY_CHUNK.smalls[ci].filter(r => r.k === 'star');
  const urchins = BY_CHUNK.smalls[ci].filter(r => r.k === 'urchin');
  add(buildInstanced(PROTO.crab, crabs, MATS.crab, (r, i, m) => placeOnGround(r, i, m)));
  add(buildInstanced(PROTO.star, stars, MATS.smallStatic, (r, i, m) => placeOnGround(r, i, m)));
  add(buildInstanced(PROTO.urchin, urchins, MATS.smallStatic, (r, i, m) => placeOnGround(r, i, m)));

  scene.add(group);
  return { ci, group, meshes, stamp: ++chunkStamp };
}
function disposeChunk(ch) {
  scene.remove(ch.group);
  for (const m of ch.meshes) {
    if (m.geometry) m.geometry.dispose();
  }
}
function updateChunks(riderS) {
  const ci = chunkOf(riderS);
  const want0 = Math.max(0, ci - BEHIND), want1 = Math.min(N_CHUNKS - 1, ci + AHEAD);
  let builtThisFrame = 0;
  for (let i = want0; i <= want1 && builtThisFrame < 2; i++) {
    if (!CHUNKS.has(i)) { CHUNKS.set(i, buildChunk(i)); builtThisFrame++; }
    else CHUNKS.get(i).stamp = ++chunkStamp;
  }
  if (CHUNKS.size > RETAIN) {
    let oldest = null;
    for (const ch of CHUNKS.values()) {
      if (ch.ci >= want0 && ch.ci <= want1) continue;
      if (!oldest || ch.stamp < oldest.stamp) oldest = ch;
    }
    if (oldest) { disposeChunk(oldest); CHUNKS.delete(oldest.ci); }
  }
}
function forceChunksNow(riderS) {
  const ci = chunkOf(riderS);
  for (let i = Math.max(0, ci - BEHIND); i <= Math.min(N_CHUNKS - 1, ci + AHEAD); i++) {
    if (!CHUNKS.has(i)) CHUNKS.set(i, buildChunk(i));
  }
  while (CHUNKS.size > RETAIN + 3) {
    let oldest = null;
    for (const ch of CHUNKS.values()) {
      if (Math.abs(ch.ci - ci) <= AHEAD) continue;
      if (!oldest || ch.stamp < oldest.stamp) oldest = ch;
    }
    if (!oldest) break;
    disposeChunk(oldest); CHUNKS.delete(oldest.ci);
  }
}

(function buildSkyline() {
  const partsNormal = [], partsHero = [];
  let parts = partsNormal;
  const add = (g, x, y, z, ry = 0) => { xf(g, x, y, z, 0, ry, 0); parts.push(g); };
  for (const rec of SKYLINE) {
    parts = rec.hero ? partsHero : partsNormal;
    const S = rec.sc * 30;
    if (rec.t === 'aquesil') {
      // a drowned aqueduct arcade on the horizon
      const nP = 7, span = S * 0.55;
      for (let i = 0; i < nP; i++) {
        add(new THREE.BoxGeometry(S * 0.14, S * 0.8, S * 0.14), rec.x + (i - nP / 2) * span, rec.y + S * 0.4, rec.z + (i - nP / 2) * span * 0.22, 0.5);
      }
      const lin = new THREE.BoxGeometry(nP * span * 1.02, S * 0.16, S * 0.2);
      add(lin, rec.x, rec.y + S * 0.85, rec.z, -0.216);
    } else if (rec.t === 'amphisil') {
      // a stepped bowl, read as stacked arcs
      for (let t = 0; t < 3; t++) {
        const arc = new THREE.TorusGeometry(S * (0.5 + t * 0.22), S * 0.075, 6, 18, Math.PI * 1.15);
        arc.rotateX(Math.PI / 2);
        add(arc, rec.x, rec.y + S * (0.18 + t * 0.16), rec.z, rec.sc * 3.1);
      }
    } else if (rec.t === 'colsil') {
      // a colonnade row with its architrave still riding the columns
      const nC = 6, span = S * 0.34;
      for (let i = 0; i < nC; i++) {
        add(new THREE.CylinderGeometry(S * 0.05, S * 0.06, S * 0.62, 8), rec.x + (i - nC / 2) * span, rec.y + S * 0.31, rec.z + (i - nC / 2) * span * -0.3, 0);
      }
      add(new THREE.BoxGeometry(nC * span * 1.05, S * 0.09, S * 0.16), rec.x, rec.y + S * 0.66, rec.z, 0.29);
    } else if (rec.t === 'dome') {
      const drum = new THREE.CylinderGeometry(S * 0.85, S * 0.92, S * 0.8, 18, 1);
      add(drum, rec.x, rec.y + S * 0.4, rec.z);
      const dome = new THREE.SphereGeometry(S * 0.85, 18, 10, 0, TAU, 0, Math.PI * 0.5);
      add(dome, rec.x, rec.y + S * 0.8, rec.z);
      const lant = new THREE.CylinderGeometry(S * 0.1, S * 0.13, S * 0.3, 8);
      add(lant, rec.x, rec.y + S * 1.68, rec.z);
    } else if (rec.t === 'towers') {
      for (let i = 0; i < 4; i++) {
        const h = S * (0.85 + ((i * 37) % 10) / 12);
        const t = new THREE.BoxGeometry(S * 0.28, h, S * 0.28);
        add(t, rec.x + ((i % 2) * 2 - 1) * S * 0.5, rec.y + h / 2, rec.z + (i > 1 ? 1 : -1) * S * 0.45, i * 0.4);
      }
    } else if (rec.t === 'wall') {
      const w = new THREE.BoxGeometry(S * 2.6, S * 0.85, S * 0.5);
      add(w, rec.x, rec.y + S * 0.35, rec.z, rec.sc * 2.1);
      for (let i = 0; i < 3; i++) {
        const t = new THREE.BoxGeometry(S * 0.3, S * 1.15, S * 0.3);
        add(t, rec.x + (i - 1) * S * 1.4 * Math.cos(rec.sc * 2.1), rec.y + S * 0.57, rec.z - (i - 1) * S * 1.4 * Math.sin(rec.sc * 2.1));
      }
    } else { // ziggurat
      for (let i = 0; i < 4; i++) {
        const w = S * (1.6 - i * 0.33);
        add(new THREE.BoxGeometry(w, S * 0.3, w), rec.x, rec.y + S * (0.15 + i * 0.3), rec.z, rec.sc);
      }

  if (partsNormal.length) {
    const merged = mergeGeometries(partsNormal);
    partsNormal.forEach(g => g.dispose());
    const mesh = new THREE.Mesh(merged, matSkyline);
    mesh.frustumCulled = false;    // huge and cheap; fog does the culling
    scene.add(mesh);
  }
  if (partsHero.length) {
    const merged = mergeGeometries(partsHero);
    partsHero.forEach(g => g.dispose());
    const mesh = new THREE.Mesh(merged, matSkylineHero);
    mesh.frustumCulled = false;
    scene.add(mesh);

})();

/* ---------- faint lights of the drowned capital, seen from the overlook ---------- */
(function buildVistaLights() {
  const V = stream('atmosphere:vista');
  const spots = SKYLINE.filter(r => r.hero);
  if (!spots.length) return;
  const N = [90, 130, 170][QF];
  const pos = new Float32Array(N * 3), seed = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const r = rpick(V, spots);
    const S = r.sc * 30;
    pos[i * 3] = r.x + rr(V, -S, S);
    pos[i * 3 + 1] = r.y + rr(V, S * 1.05, S * 1.72);   // windows near the roofs, above the slope line
    pos[i * 3 + 2] = r.z + rr(V, -S, S);
    seed[i] = V();
  }

  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));

    name: 'vistalights',
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexHead: `attribute float aSeed; varying float vS;`,
    vertexWorld: /* glsl */`
      vS = aSeed;
      float dist = length(wp4.xyz - uCamPos);
      gl_PointSize = clamp((2.2+aSeed*2.8) * (340.0/max(dist,10.0)), 1.4, 6.0);
    `,
    fragmentHead: `varying float vS;`,
    fragmentBody: /* glsl */`
      vec2 pc = gl_PointCoord*2.0-1.0;
      float m = pow(max(0.0, 1.0-length(pc)), 2.0);
      float tw = 0.4+0.6*(0.5+0.5*sin(uTime*(0.3+vS*0.9)+vS*47.0));
      vec3 col = mix(uGold, uEmber, step(0.72, fract(vS*3.3)));
      float dist = length(vWp-uCamPos);
      float fade = exp(-dist*0.0025);
      gl_FragColor = vec4(col*m*tw*fade*0.85, m*tw*fade*0.85);
    `,
  });
  const pts = new THREE.Points(g, mat);
  pts.frustumCulled = false;
  pts.renderOrder = 5;
  scene.add(pts);
})();

const BEAM_CLUSTERS = (() => {
  const B = stream('atmosphere:beams');
  const clusters = [];

    { s: 62, n: 9, always: true },                            // the poster shafts
    { s: POI.temple.s, n: 8, always: true },                  // glory over the temple precinct
    { s: L_TOTAL + 85, n: 7, always: true },                  // light falling on the drowned capital
  ];
  const CH = ROUTE.chapters;
  const perCh = [[0, 2], [1, 2], [2, 3], [3, 2], [4, 2], [6, 3]];
  for (const [c, count] of perCh) {
    for (let i = 0; i < count; i++) specs.push({ s: rr(B, CH[c].s0 + 60, CH[c].s1 - 60), n: ri(B, 4, 8) });
  }
  for (const spec of specs) {
    const quads = [];
    for (let i = 0; i < spec.n; i++) {
      const w = rr(B, 3.5, 9), h = rr(B, 55, 92);
      const q = new THREE.PlaneGeometry(w, h, 1, 4);
      const lat = rr(B, -46, 46), along = rr(B, -55, 55);
      routeAt(spec.s + along, _rf);
      const bx = _rf.x + _rf.nx * lat, bz = _rf.z + _rf.nz * lat;
      const topY = -6;
      // align beam axis with the sun direction; top of the beam sits near the surface glow
      const sun = U.uSunDir.value;
      _q1.setFromUnitVectors(_v1.set(0, 1, 0), sun);
      _m1.compose(_v2.set(bx - sun.x * h * 0.5, topY - sun.y * h * 0.5, bz - sun.z * h * 0.5), _q1, _v3.set(1, 1, 1));
      q.rotateY(rr(B, 0, TAU));
      q.applyMatrix4(_m1);

      q.setAttribute('aPh', new THREE.BufferAttribute(ph, 1));
      quads.push(q);

    const merged = mergeGeometries(quads);
    quads.forEach(q => q.dispose());

  aq.setAttribute('aPh', new THREE.BufferAttribute(aph, 1));

})();

/* ---------- fish schools ---------- */
function protoFish(kind) {
  const dims = {
    silver: [0.09, 0.13, 0.42], reef: [0.12, 0.22, 0.5], ribbon: [0.05, 0.16, 1.15],
    lumen: [0.07, 0.09, 0.3], ceremony: [0.12, 0.2, 0.55],
  }[kind];
  const body = new THREE.SphereGeometry(1, 7, 5);
  body.scale(dims[0], dims[1], dims[2]);
  const tail = new THREE.PlaneGeometry(0.02 + dims[1] * 1.3, dims[1] * 1.6);
  tail.rotateY(Math.PI / 2);
  tail.translate(0, 0, -dims[2] - dims[1] * 0.5);
  const g = mergeGeometries([body, tail]);
  body.dispose(); tail.dispose();
  return g;
}
const SCHOOL_COLORS = {
  silver: [PAL.marble.clone().multiplyScalar(0.75), PAL.marble.clone(), 0],
  reef: [PAL.ink.clone().lerp(PAL.petrol, 0.6), PAL.olive.clone().multiplyScalar(0.8), 0],
  ribbon: [PAL.petrol.clone().lerp(PAL.turquoise, 0.5), PAL.marble.clone().multiplyScalar(0.9), 0],
  lumen: [PAL.petrol.clone(), PAL.turquoise.clone(), 0.55],

const schoolSims = [];

// obstacle query (reused)
function nearestObstacles(x, z, outArr) {
  const cell = OBST_HASH.cell;
  const cx = Math.floor(x / cell), cz = Math.floor(z / cell);
  let n = 0;
  for (let ox = -1; ox <= 1 && n < 6; ox++) for (let oz = -1; oz <= 1 && n < 6; oz++) {
    const li = OBST_HASH.map.get((cx + ox) + ':' + (cz + oz));
    if (!li) continue;
    for (const idx of li) { if (n < 6) outArr[n++] = idx; }
  }
  return n;
}
const _obstIdx = new Int32Array(8);

function updateSchool(sim, dt, t, giantPos, giantActive, riderS) {
  const plan = sim.plan;
  const n = plan.count;
  // --- anchor motion along waypoints (independent of the rider) ---
  const wp = plan.wps[sim.wpIdx];
  routeAt(wp.s, _rf);
  _v1.set(_rf.x + _rf.nx * wp.d, _rf.y + wp.h, _rf.z + _rf.nz * wp.d);
  const dAnchor = _v2.subVectors(_v1, sim.anchor);
  const dl = dAnchor.length();
  if (dl < 16) sim.wpIdx = (sim.wpIdx + 1) % plan.wps.length;
  dAnchor.normalize().multiplyScalar(plan.speed);
  sim.anchorVel.lerp(dAnchor, Math.min(1, dt * 0.6));
  sim.anchor.addScaledVector(sim.anchorVel, dt);
  // procession override: the pale file walks the seat rows, serpentine, row by row
  let procTarget = null;
  if (sim.procession > 0.01) {
    const a = POI.amphi;
    routeAt(a.s, _rf);
    const cx2 = _rf.x + _rf.nx * a.d, cz2 = _rf.z + _rf.nz * a.d;
    const rowT = sim.procT / 11;                       // one full sweep of a row takes ~11 s
    const row = Math.floor(rowT) % 9;
    let ft = rowT - Math.floor(rowT);
    if (row % 2 === 1) ft = 1 - ft;
    const aLoc = lerp(-Math.PI * 0.55, Math.PI * 0.55, ft);
    const psi = aLoc - (a.wYaw || 0);
    const rSeat = 9.5 + row * 1.55;
    procTarget = _v3.set(cx2 + Math.cos(psi) * rSeat, a.floorY + 2.1 + row * 0.7, cz2 + Math.sin(psi) * rSeat);
    sim.anchor.lerp(procTarget, Math.min(1, dt * 1.6) * sim.procession);
  }
  const pos = sim.pos, vel = sim.vel;
  sim.avgVel.set(0, 0, 0);
  const sepR = 1.1, sepR2 = sepR * sepR;
  const tight = 1 - sim.procession * 0.75;
  for (let i = 0; i < n; i++) {
    const ix = i * 3;
    let fx = 0, fy = 0, fz = 0;
    // cohesion toward anchor (jittered per fish so the school has volume)
    const jx = Math.sin(i * 12.9898 + t * 0.21) * plan.spread * tight;
    const jy = Math.sin(i * 78.233 + t * 0.17) * plan.spread * 0.4 * tight;
    const jz = Math.cos(i * 39.425 + t * 0.19) * plan.spread * tight;
    let tx2 = sim.anchor.x + jx, ty2 = sim.anchor.y + jy, tz2 = sim.anchor.z + jz;
    // procession: single-file — follow the fish ahead
    if (sim.procession > 0.5 && i > 0) {
      tx2 = pos[ix - 3]; ty2 = pos[ix - 2]; tz2 = pos[ix - 1];
    }
    fx += (tx2 - pos[ix]) * 0.55; fy += (ty2 - pos[ix + 1]) * 0.7; fz += (tz2 - pos[ix + 2]) * 0.55;
    // separation from ring neighbours

  const x = _rf.x + _rf.nx * dd.d, z = _rf.z + _rf.nz * dd.d;
  const gy = terrainY(dd.s, dd.d, x, z);
  const m = mkGlowSprite(PAL.gold.clone().lerp(PAL.turquoise, 0.3), 7, 0.06);
  m.position.set(x, gy + 4.5, z);   // the seal never quite goes dark
  scene.add(m);
  U.uEventPos.value.set(x, gy + 4, z);
  return m;
})();

/* ---------- impossible current state ---------- */
let currentEventFired = false, currentEventT = 0;
function updateImpossibleCurrent(t, riderS, dt) {
  if (!RARE.impossibleCurrent) return;
  const dd = POI.sealedDoor;
  if (!currentEventFired && riderS > dd.s - 150 && riderS < dd.s - 20) {
    currentEventFired = true; currentEventT = t;
  }
  if (currentEventFired) {
    const k = (t - currentEventT) / 20;
    const amp = k < 1 ? Math.sin(Math.min(1, k * 3) * Math.PI * 0.5) * (1 - smoothstep(0.75, 1, k)) : 0;
    U.uEventStr.value = amp;
    doorGlow.material.uniforms.uGlowA.value = 0.06 + amp * 0.5;
    if (AUDIO.on && amp > 0.5 && !AUDIO._currentToned) { AUDIO._currentToned = true; AUDIO.currentSwell(); }
  }
}

/* ============================================================
   PROCEDURAL AMBIENT SOUND — WebAudio only, after first gesture.
   Silence is part of the world.
   ============================================================ */
const AUDIO = {
  on: false, ctx: null, master: null, _currentToned: false,
  rng: stream('audio'),
  start() {
    if (this.on) return;
    try {
      const ctx = this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      const master = this.master = ctx.createGain();
      master.gain.value = 0.0001;
      master.connect(ctx.destination);
      master.gain.exponentialRampToValueAtTime(0.30, ctx.currentTime + 4);
      // hydrophonic current: looped filtered noise
      const len = 4 * ctx.sampleRate;
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const ch = buf.getChannelData(0);
      let lp = 0;
      for (let i = 0; i < len; i++) { lp += (this.rng() * 2 - 1 - lp) * 0.06; ch[i] = lp * 2.4; }
      const src = ctx.createBufferSource();
      src.buffer = buf; src.loop = true;
      const lpF = ctx.createBiquadFilter(); lpF.type = 'lowpass'; lpF.frequency.value = 210; lpF.Q.value = 0.4;
      const curG = ctx.createGain(); curG.gain.value = 0.5;
      src.connect(lpF).connect(curG).connect(master);
      src.start();
      // slow swell LFO on the current
      const lfo = ctx.createOscillator(); lfo.frequency.value = 0.045;
      const lfoG = ctx.createGain(); lfoG.gain.value = 0.22;
      lfo.connect(lfoG).connect(curG.gain);
      lfo.start();
      this.on = true;
    } catch (e) { /* stay silent */ }
  },
  _tone(freq, dur, gain, type = 'sine', glideTo = 0, attack = 0.8) {
    if (!this.on) return;
    const ctx = this.ctx, t0 = ctx.currentTime;
    const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t0 + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 640;
    o.connect(g).connect(f).connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.1);
  },
  groan() {
    // low structural groan: descending, slightly rough
    const f0 = 46 + this.rng() * 22;
    this._tone(f0, 6 + this.rng() * 4, 0.16, 'triangle', f0 * 0.72, 2.2);
    this._tone(f0 * 2.02, 4, 0.05, 'sawtooth', f0 * 1.5, 2.5);
  },
  click() {
    if (!this.on) return;
    const ctx = this.ctx, t0 = ctx.currentTime;
    const len = 0.06 * ctx.sampleRate;
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const ch = buf.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = (this.rng() * 2 - 1) * Math.exp(-i / len * 14);
    const src = ctx.createBufferSource(); src.buffer = buf;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass';
    bp.frequency.value = 900 + this.rng() * 2400; bp.Q.value = 7;
    const g = ctx.createGain(); g.gain.value = 0.10 + this.rng() * 0.10;
    src.connect(bp).connect(g).connect(this.master);
    src.start(t0);
  },
  whale() {
    const f0 = 160 + this.rng() * 130;
    this._tone(f0, 7 + this.rng() * 4, 0.07, 'sine', f0 * (0.8 + this.rng() * 0.5), 2.8);
  },
  giantMoan(delay) {
    if (!this.on) return;
    const self = this;
    setTimeout(() => {
      const f0 = 30 + self.rng() * 12;
      self._tone(f0, 12, 0.20, 'sine', f0 * 0.8, 4);
      self._tone(f0 * 1.5, 9, 0.07, 'triangle', f0 * 1.2, 4.5);
    }, delay * 1000);
  },
  bell() {
    if (!this.on) return;
    // inharmonic bronze partials, drowned and slow
    const f0 = 148;
    const partials = [[1, 0.20], [2.02, 0.10], [2.76, 0.09], [4.07, 0.05], [5.43, 0.035]];
    for (const [m, g] of partials) this._tone(f0 * m, 9 - m, g, 'sine', 0, 0.02);
  },
  currentSwell() {
    const f0 = 96;
    this._tone(f0, 11, 0.09, 'sine', f0 * 1.26, 4);
    this._tone(f0 * 1.5, 11, 0.05, 'sine', f0 * 1.9, 5);
  },
};
// ambient schedule pump (called each frame with world clock)
let ambIdx = { groan: 0, click: 0, whale: 0 };
function pumpAmbient(t) {
  if (!AUDIO.on) return;
  // fire only near-due events; anything older than 3 s (audio enabled late) is skipped silently
  while (ambIdx.groan < AMBIENT.groans.length && AMBIENT.groans[ambIdx.groan] <= t) { if (AMBIENT.groans[ambIdx.groan] > t - 3) AUDIO.groan(); ambIdx.groan++; }
  while (ambIdx.click < AMBIENT.clicks.length && AMBIENT.clicks[ambIdx.click] <= t) { if (AMBIENT.clicks[ambIdx.click] > t - 3) AUDIO.click(); ambIdx.click++; }
  while (ambIdx.whale < AMBIENT.whales.length && AMBIENT.whales[ambIdx.whale] <= t) { if (AMBIENT.whales[ambIdx.whale] > t - 3) AUDIO.whale(); ambIdx.whale++; }
}

/* ============================================================
   RIDER, CAMERA, GRADE, LOOP, PROOF
   ============================================================ */

// ---------- chapter grading ----------
const GRADES = [
  { fogSh: '#28686f', fogDp: '#0a2231', den: 0.0102, sun: 1.15, caust: 1.10, edge: 0.85 }, // sunlit descent
  { fogSh: '#1b5a4e', fogDp: '#081d24', den: 0.0146, sun: 0.86, caust: 0.9, edge: 1.05 },  // kelp gate: olive enclosure
  { fogSh: '#245f6b', fogDp: '#0a2433', den: 0.0112, sun: 1.02, caust: 1.0, edge: 0.9 },   // column forest
  { fogSh: '#28655c', fogDp: '#0b2530', den: 0.0122, sun: 0.94, caust: 0.95, edge: 1.15 }, // divided current
  { fogSh: '#2b6e72', fogDp: '#0a2331', den: 0.0100, sun: 1.10, caust: 1.05, edge: 0.9 },  // amphitheater: clearing
  { fogSh: '#0b1f30', fogDp: '#020509', den: 0.0215, sun: 0.23, caust: 0.2, edge: 2.1 },   // abyssal crossing: true dark
  { fogSh: '#2d766a', fogDp: '#0b2836', den: 0.0084, sun: 1.14, caust: 1.08, edge: 0.95 }, // temple: the luminous climb
];
GRADES.forEach(g => { g.cSh = new THREE.Color(g.fogSh); g.cDp = new THREE.Color(g.fogDp); });
function applyGrade(s, camY) {
  // smooth blend across chapter boundaries
  const CH = ROUTE.chapters;
  let gA = GRADES[0], gB = GRADES[0], t = 0;
  for (let i = 0; i < 7; i++) {
    const c = CH[i];
    if (s >= c.s0 && s < c.s1) {
      gA = GRADES[i];
      const blendW = 130;
      if (s > c.s1 - blendW && i < 6) { gB = GRADES[i + 1]; t = smoothstep(c.s1 - blendW, c.s1, s); }
      else { gB = gA; t = 0; }
      break;
    }
    if (s >= CH[6].s0) { gA = gB = GRADES[6]; }
  }
  const depthSun = clamp(Math.exp((camY + 36) * 0.014), 0.28, 1.25);
  U.uFogSh.value.copy(gA.cSh).lerp(gB.cSh, t);
  U.uFogDp.value.copy(gA.cDp).lerp(gB.cDp, t);
  U.uFogDen.value = lerp(gA.den, gB.den, t);
  U.uSunI.value = lerp(gA.sun, gB.sun, t) * depthSun;
  U.uCaustI.value = lerp(gA.caust, gB.caust, t) * depthSun;
  MATS.road.uniforms.uEdgeBoost.value = lerp(gA.edge, gB.edge, t);
  renderer.setClearColor(U.uFogDp.value, 1);
}

// ---------- rider state ----------
const rider = {
  s: 4, lat: 0, latV: 0, speed: 0, cruise: 12.5,
  arm: FORK.defaultArm, pref: 0, ended: false, paused: false,
};
let clockT = 0, holdT = 0, started = false;
const HOLD_DURATION = 4.2;

const keys = {};
window.addEventListener('keydown', (e) => {
  if (e.repeat) { keys[e.code] = true; return; }
  keys[e.code] = true;
  AUDIO.start();
  if (e.code === 'Space') { rider.paused = !rider.paused; e.preventDefault(); }
  if (e.code === 'KeyR') restartWorld();
  if (!started && (e.code === 'KeyW' || e.code === 'ArrowUp')) started = true;
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });
window.addEventListener('pointerdown', () => AUDIO.start(), { once: false });

// restrained mouse look
const look = { yaw: 0, pitch: 0, tYaw: 0, tPitch: 0, dragging: false, lx: 0, ly: 0 };
window.addEventListener('pointerdown', (e) => { look.dragging = true; look.lx = e.clientX; look.ly = e.clientY; });
window.addEventListener('pointermove', (e) => {
  if (!look.dragging) return;
  look.tYaw = clamp(look.tYaw - (e.clientX - look.lx) * 0.0032, -0.85, 0.85);
  look.tPitch = clamp(look.tPitch - (e.clientY - look.ly) * 0.0028, -0.5, 0.42);
  look.lx = e.clientX; look.ly = e.clientY;
});
window.addEventListener('pointerup', () => { look.dragging = false; });

function updateRider(dt) {
  if (rider.ended) { rider.speed = Math.max(0, rider.speed - 8 * dt); rider.s += rider.speed * dt; return; }
  const accel = keys.KeyW || keys.ArrowUp, brake = keys.KeyS || keys.ArrowDown;
  const left = keys.KeyA || keys.ArrowLeft, right = keys.KeyD || keys.ArrowRight;
  if (accel) rider.speed = Math.min(19.5, rider.speed + 6.2 * dt);
  else if (brake) rider.speed = Math.max(0, rider.speed - 10.5 * dt);
  else rider.speed += (rider.cruise - rider.speed) * Math.min(1, dt * 0.55);
  // lateral steering
  const steer = (left ? 1 : 0) - (right ? 1 : 0);
  rider.latV += (steer * 6.4 - rider.latV) * Math.min(1, dt * 5);
  rider.lat = clamp(rider.lat + rider.latV * dt, -4.1, 4.1);
  if (!steer) rider.lat *= Math.pow(0.35, dt);   // drift back to the crown
  // fork preference: steer during the approach chooses the arm
  const sep = armOffset(rider.s, 'L') - armOffset(rider.s, 'R');
  if (rider.s > FORK.s0 - 160 && rider.s < FORK.s0 + FORK.T) {
    if (steer > 0) rider.pref = 1;
    else if (steer < 0) rider.pref = -1;
    if (sep < 12) rider.arm = rider.pref > 0 ? 'L' : (rider.pref < 0 ? 'R' : FORK.defaultArm);
  }
  rider.s += rider.speed * dt;
  if (rider.s >= L_TOTAL - 14) {
    rider.ended = true;
    document.getElementById('ending').textContent = 'The Meridian ends above the drowned city — press R to ride again';
    document.getElementById('ending').style.opacity = 1;
  }
}

const camTarget = new THREE.Vector3(), camPos = new THREE.Vector3();
let camRoll = 0;
function updateCamera(dt) {
  const s = rider.s;
  routeAt(s, _rf);
  const off = armOffset(s, rider.arm) + rider.lat;
  const y = armY(s, rider.arm, _rf.y);
  camPos.set(_rf.x + _rf.nx * off, y + EYE_H, _rf.z + _rf.nz * off);
  // look ahead with steering anticipation
  const la = 24;
  routeAt(s + la, _rf2);
  const offA = armOffset(s + la, rider.arm) + rider.lat * 0.55 + rider.latV * 0.8;
  const yA = armY(s + la, rider.arm, _rf2.y);
  camTarget.set(_rf2.x + _rf2.nx * offA, yA + EYE_H * 0.82, _rf2.z + _rf2.nz * offA);
  camera.position.copy(camPos);
  camera.up.set(0, 1, 0);
  camera.lookAt(camTarget);
  // restrained roll from curvature + steering
  const rollT = clamp(-_rf.k * rider.speed * 0.55 - rider.latV * 0.006, -0.045, 0.045);
  camRoll += (rollT - camRoll) * Math.min(1, dt * 2.4);
  camera.rotateZ(camRoll);
  // mouse look on top
  look.yaw += (look.tYaw - look.yaw) * Math.min(1, dt * 6);
  look.pitch += (look.tPitch - look.pitch) * Math.min(1, dt * 6);
  if (!look.dragging) { look.tYaw *= Math.pow(0.25, dt); look.tPitch *= Math.pow(0.25, dt); }
  camera.rotateOnWorldAxis(_up, look.yaw);
  camera.rotateX(look.pitch);
}

// ---------- HUD ----------
const elChapter = document.getElementById('chapter');
const elChapNum = document.getElementById('chapNum');
const elChapName = document.getElementById('chapName');
let lastChapter = -1, chapterHideAt = 0, helpHideAt = 0;
const ROMAN = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII'];
function updateHUD(t) {
  const ch = ROUTE.chapterAt(clamp(rider.s, 0, L_TOTAL - 1));
  if (ch.i !== lastChapter) {
    lastChapter = ch.i;
    elChapNum.textContent = ROMAN[ch.i];
    elChapName.textContent = ch.name;
    elChapter.style.opacity = 0.92;
    chapterHideAt = t + 4.2;
  }
  if (chapterHideAt && t > chapterHideAt) { elChapter.style.opacity = 0; chapterHideAt = 0; }
  if (helpHideAt && t > helpHideAt && !rider.paused) { document.getElementById('help').style.opacity = 0; helpHideAt = 0; }
  if (rider.paused) document.getElementById('help').style.opacity = 0.9;
  document.getElementById('pauseTint').style.background = rider.paused ? 'rgba(4,8,14,0.28)' : 'rgba(4,8,14,0)';
}

// ---------- eye glint schedule (the watching colossus) ----------
function updateEyeGlint(t) {
  if (!eyeGlint) return;
  // a slow line of gold crosses one eye, rarely, never blinking
  const period = 74;
  const k = (t % period) / period;
  const amp = (k > 0.62 && k < 0.7) ? Math.sin((k - 0.62) / 0.08 * Math.PI) : 0;
  eyeGlint.material.uniforms.uGlowA.value = amp * 0.55;
  eyeGlint.lookAt(camera.position);
}

// ---------- beams visibility + amphitheater sweep ----------
function updateBeams(t) {
  for (const cl of BEAM_CLUSTERS.clusters) {
    cl.mesh.visible = Math.abs(cl.s - rider.s) < 640;
  }
  const sw = BEAM_CLUSTERS.sweep;
  const near = Math.abs(POI.amphi.s - rider.s) < 420;
  sw.visible = near;
  if (near) {
    const a = t * 0.045;
    sw.position.set(BEAM_CLUSTERS.amphiX + Math.cos(a) * 12, POI.amphi.floorY + 34, BEAM_CLUSTERS.amphiZ + Math.sin(a) * 12);
    sw.rotation.y = a * 1.7;
  }
}

// ---------- procession trigger ----------
function updateProcession(dt) {
  if (!RARE.procession) return;
  const sim = schoolSims[1]; // the dark reef school turns pale
  const a = POI.amphi;
  const inWindow = Math.abs(rider.s - (a.s - 40)) < 130;
  if (inWindow && sim.procession < 1) sim.procession = Math.min(1, sim.procession + dt * 0.25);
  else if (!inWindow && sim.procession > 0) sim.procession = Math.max(0, sim.procession - dt * 0.12);
  if (sim.procession > 0.01) sim.procT += dt;
}

// ---------- restart ----------
let raf = 0, disposed = false;
function restartWorld() {
  // clean, in-place, identical seed
  for (const ch of CHUNKS.values()) disposeChunk(ch);
  CHUNKS.clear();
  rider.s = 4; rider.lat = 0; rider.latV = 0; rider.speed = 0;
  rider.arm = FORK.defaultArm; rider.pref = 0; rider.ended = false; rider.paused = false;
  clockT = 0; holdT = 0; started = false;
  lastChapter = -1;
  giant.passIdx = 0; giant.active = false; giant.mesh.visible = false;
  turtle.state = 0; turtle.m.visible = false;
  bellSwing = 0; bellSwingV = 0; bellToneAt = -1;
  currentEventFired = false; U.uEventStr.value = 0;
  doorGlow.material.uniforms.uGlowA.value = 0.06;
  ambIdx = { groan: 0, click: 0, whale: 0 };
  AUDIO._currentToned = false;
  for (const sim of schoolSims) { sim.procession = 0; sim.procT = 0; sim.wpIdx = 0; }
  document.getElementById('ending').style.opacity = 0;
  helpHideAt = clockT + 12;
  document.getElementById('help').style.opacity = 0.9;
  forceChunksNow(rider.s);
}

// ---------- performance metrics ----------
const METRICS = { fps: 0, frames: 0, accum: 0, drawCalls: 0, triangles: 0 };
function tickMetrics(dt) {
  METRICS.frames++; METRICS.accum += dt;
  if (METRICS.accum >= 1) {
    METRICS.fps = Math.round(METRICS.frames / METRICS.accum);
    METRICS.frames = 0; METRICS.accum = 0;
  }
  METRICS.drawCalls = renderer.info.render.calls;
  METRICS.triangles = renderer.info.render.triangles;
}

// ---------- main loop ----------
let lastT = performance.now();
const giantPos = new THREE.Vector3();
function frame() {
  raf = requestAnimationFrame(frame);
  const now = performance.now();
  let dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  clockT += dt;
  const t = clockT;

  // opening hold: the poster frame breathes before the ride begins
  if (!started) {
    holdT += dt;
    if (holdT > HOLD_DURATION) started = true;
  }
  const riding = started && !rider.paused;
  if (riding) updateRider(dt);

  updateChunks(rider.s);
  updateCamera(dt);
  applyGrade(rider.s, camera.position.y);

  // shared uniforms
  U.uTime.value = t;
  U.uCamPos.value.copy(camera.position);
  MATS.crab.uniforms.uRider.value.copy(camera.position);

  // life systems keep breathing while paused
  giantPos.copy(giant.mesh.position);
  const dimG = updateGiant(t, rider.s);
  const shadowRay = updateRays(t, dt);
  U.uDim.value += ((dimG * (1 - shadowRay * 0.3)) - U.uDim.value) * Math.min(1, dt * 2);
  for (const sim of schoolSims) updateSchool(sim, dt, t, giantPos, giant.active, rider.s);
  updateBeams(t);
  updateBell(dt);
  updateOctopi();
  updateCuttle(t);
  updateTurtle(t, rider.s);
  updateEyeGlint(t);
  updateImpossibleCurrent(t, rider.s, dt);
  updateProcession(dt);
  pumpAmbient(t);

  waterDome.position.copy(camera.position);
  surfacePlane.position.set(camera.position.x, 0, camera.position.z);

  updateHUD(t);
  renderer.render(scene, camera);
  tickMetrics(dt);
}

// ---------- proof object ----------
const COUNTS = {
  kelp: ECO.kelp.length,
  coral: ECO.coral.length,
  smalls: ECO.smalls.length,
  jellies: ECO.jellies.length,
  rays: CREATURES.rays.length,
  schools: SCHOOLS.length,
  fish: SCHOOLS.reduce((a, s) => a + s.count, 0),
  structures: STRUCTS.length,
  skyline: SKYLINE.length,
  snow: SNOW_N,
  giantPasses: CREATURES.passes.length,
};
function validateClearance() {
  // realized-mesh validation: terrain vertices + architecture vertices vs both arms
  const report = { terrainViolations: 0, archViolations: 0, propViolations: 0, chunks: N_CHUNKS, samples: 0, worst: null };
  for (let ci = 0; ci < N_CHUNKS; ci++) {
    const tg = buildTerrainGeometry(ci);
    const p = tg.attributes.position, sd = tg.attributes.aSD;
    for (let i = 0; i < p.count; i++) {
      const s = sd.getX(i), d = sd.getY(i);
      if (s > L_TOTAL - 6) continue;
      routeAt(s, _rf3);
      for (const arm of ['L', 'R']) {
        const dd = Math.abs(d - armOffset(s, arm));
        if (dd < 7.4) {
          const yA = armY(s, arm, _rf3.y);
          report.samples++;
          if (p.getY(i) > yA - 0.33) {
            report.terrainViolations++;
            if (!report.worst || p.getY(i) - yA > report.worst.dy) report.worst = { ci, s, d, y: p.getY(i), yA, dy: p.getY(i) - yA };
          }
        }
      }
    }
    tg.dispose();
    const arch = buildArchitecture(ci);
    if (arch.arch) {
      const ap = arch.arch.attributes.position;
      const step2 = Math.max(1, Math.floor(ap.count / 20000));
      for (let i = 0; i < ap.count; i += step2) {
        const x = ap.getX(i), y = ap.getY(i), z = ap.getZ(i);
        findRouteSD(x, z, _sd);
        if (_sd.d > 1e8 || _sd.s > L_TOTAL - 6) continue;
        const ad = armDist(_sd.s, _sd.d);
        if (ad < CLEAR_R - 0.05) {
          routeAt(_sd.s, _rf3);
          const yA = Math.min(armY(_sd.s, 'L', _rf3.y), armY(_sd.s, 'R', _rf3.y));
          if (y > yA - 0.25 && y < yA + 7.5) {
            report.archViolations++;
            report.archByChunk = report.archByChunk || {};
            report.archByChunk[ci] = (report.archByChunk[ci] || 0) + 1;
            if (!report.archSamples) report.archSamples = [];
            if (report.archSamples.length < 12 && (report.archSamples.length === 0 ||
                Math.abs(report.archSamples[report.archSamples.length - 1].s - _sd.s) > 8)) {
              report.archSamples.push({ ci, s: Math.round(_sd.s), d: Math.round(_sd.d * 10) / 10, y: Math.round(y * 10) / 10, ad: Math.round(ad * 100) / 100 });
            }
          }
        }
      }
      arch.arch.dispose();
    }
    if (arch.mosaic) arch.mosaic.dispose();
  }
  for (const k of ECO.kelp) if (armDist(k.s, k.d) < CLEAR_R + 0.5) report.propViolations++;
  for (const c of ECO.coral) if (armDist(c.s, c.d) < CLEAR_R + 0.2) report.propViolations++;
  for (const sm of ECO.smalls) if (armDist(sm.s, sm.d) < CLEAR_R) report.propViolations++;
  return report;
}
window.__MERIDIAN__ = Object.freeze({
  seed: SEED,
  quality: QUALITY,
  version: 1,
  hashes: Object.freeze(Object.assign({}, HASHES)),
  plan: Object.freeze({
    lengthM: Math.round(L_TOTAL * 10) / 10,
    chapters: ROUTE.chapters.map(c => ({ name: c.name, s0: Math.round(c.s0), s1: Math.round(c.s1) })),
    fork: { s0: Math.round(FORK.s0), s1: Math.round(FORK.s1), DL: Math.round(FORK.DL * 10) / 10, DR: Math.round(FORK.DR * 10) / 10, defaultArm: FORK.defaultArm },
    rare: Object.assign({}, RARE),
    counts: Object.freeze(Object.assign({}, COUNTS)),
    poi: JSON.parse(JSON.stringify(POI)),
  }),
  metrics() {
    return {
      fps: METRICS.fps, drawCalls: METRICS.drawCalls, triangles: METRICS.triangles,
      activeChunks: CHUNKS.size, geometries: renderer.info.memory.geometries,
      textures: renderer.info.memory.textures, programs: renderer.info.programs ? renderer.info.programs.length : 0,
      riderS: Math.round(rider.s * 10) / 10, speed: Math.round(rider.speed * 100) / 100,
      arm: rider.arm, ended: rider.ended,
      glRenderer: (() => {
        try {
          const gl = renderer.getContext();
          const ext = gl.getExtension('WEBGL_debug_renderer_info');
          return ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
        } catch (e) { return 'unknown'; }
      })(),
    };
  },
  qa: {
    seek(s) { rider.s = clamp(s, 0, L_TOTAL - 1); rider.ended = false; started = true; document.getElementById('ending').style.opacity = 0; forceChunksNow(rider.s); updateCamera(0.016); },
    setArm(a) { if (a === 'L' || a === 'R') { rider.arm = a; rider.pref = a === 'L' ? 1 : -1; } },
    setLat(d) { rider.lat = clamp(d, -4.2, 4.2); },
    pause(p) { rider.paused = !!p; },
    start() { started = true; },
    validate: validateClearance,
    state() {
      return {
        s: rider.s, arm: rider.arm, speed: rider.speed, paused: rider.paused, ended: rider.ended, clock: clockT,
        giant: { active: giant.active, x: Math.round(giant.mesh.position.x), y: Math.round(giant.mesh.position.y), z: Math.round(giant.mesh.position.z), nextIdx: giant.passIdx },
        procession: Math.round((schoolSims[1].procession || 0) * 100) / 100,
        eventStr: Math.round(U.uEventStr.value * 100) / 100,
        bellSwing: Math.round(bellSwing * 1000) / 1000,
      };
    },
  },
});

// ---------- boot ----------
document.getElementById('seedline').textContent = SEED + ' · ' + QUALITY;
document.getElementById('title').style.opacity = 1;
document.getElementById('help').style.opacity = 0.9;
helpHideAt = 14;
setTimeout(() => { const t2 = document.getElementById('title'); t2.style.opacity = 0; }, 11000);
forceChunksNow(rider.s);
updateCamera(0.016);
frame();
