/* ---------------------------------------------------------------- value noise */

 * ROUTE — one authoritative route-frame system.

/* Curvature as a sum of C2 lobes: k(s) = sum A_j * bump((s - c_j) / w_j).

/* Integrate a line: position by fine deterministic stepping, frames every 2 m. */

  frames[0].theta = prevTh;
  for (let i = 1; i < nF; i++) {
    let th = Math.atan2(frames[i].tx, frames[i].tz);
    while (th - prevTh > Math.PI) th -= TAU;
    while (th - prevTh < -Math.PI) th += TAU;
    frames[i].theta = th; prevTh = th;
  }
  for (let i = 0; i < nF; i++) {
    const a = frames[Math.max(0, i - 1)], b = frames[Math.min(nF - 1, i + 1)];
    frames[i].k = (b.theta - a.theta) / ((Math.min(nF - 1, i + 1) - Math.max(0, i - 1)) * C.FRAME_STEP);
    const y = elev.yAt(frames[i].sSpine);
    frames[i].y = y; frames[i].elevationM = y;
  }
  for (let i = 0; i < nF; i++) {
    const a = frames[Math.max(0, i - 1)], b = frames[Math.min(nF - 1, i + 1)];
    frames[i].gradePercent = 100 * (b.y - a.y) / ((Math.min(nF - 1, i + 1) - Math.max(0, i - 1)) * C.FRAME_STEP);
  }
  // C0/C1 continuity by object identity with the spine at both ends
  const iF0 = Math.round(f0 / C.FRAME_STEP), iF1 = Math.round(f1 / C.FRAME_STEP);
  spine.frames[iF0].sSpine = f0;
  spine.frames[iF1].sSpine = f1;
  frames[0] = spine.frames[iF0];
  frames[nF - 1] = spine.frames[iF1];
  const offAt = (s) => amp * offShapeFn(clamp((s - f0) / (f1 - f0), 0, 1));
  return { id, length: armLen, frames, f0, f1, amp, offAt, elev,
    yAtSpine: (s) => elev.yAt(clamp(s, f0, f1)) };
}

/* ------------------------------------------------------------- validators */
function headingRateMax(line) {
  const f = line.frames, span = Math.round(10 / C.FRAME_STEP);
  let worst = 0, at = 0;
  for (let i = 0; i + span < f.length; i++) {
    const d = Math.abs(f[i + span].theta - f[i].theta) / DEG;
    if (d > worst) { worst = d; at = f[i].s; }
  }
  return { maxDegPer10m: worst, atS: at };
}
function gradeStats(line) {
  const f = line.frames;
  let maxAbs = 0, sumAbs = 0;
  for (const fr of f) { const g = Math.abs(fr.gradePercent); if (g > maxAbs) maxAbs = g; sumAbs += g; }
  return { maxPercent: maxAbs, meanAbsPercent: sumAbs / f.length,
    entryGrade: f[0].gradePercent, exitGrade: f[f.length - 1].gradePercent };
}
function validateLine(line, label) {
  const hr = headingRateMax(line);
  const gs = gradeStats(line);
  const errs = [];
  if (hr.maxDegPer10m > C.HEADING_RATE_LIMIT_DEG_PER_10M)
    errs.push(`${label}: heading rate ${hr.maxDegPer10m.toFixed(3)} deg/10m at s=${hr.atS} exceeds ${C.HEADING_RATE_LIMIT_DEG_PER_10M}`);
  if (Math.abs(gs.entryGrade) > C.HANDOFF_GRADE_LIMIT || Math.abs(gs.exitGrade) > C.HANDOFF_GRADE_LIMIT)
    errs.push(`${label}: handoff grade out of bounds (${gs.entryGrade.toFixed(2)} / ${gs.exitGrade.toFixed(2)})`);
  return { headingRate: hr, grade: gs, errors: errs };
}
/* ============================================================================
 * SET-PIECE PLANS — four independent ~2 km moments, each generated pure from
 * (seed, pieceId) via named streams. Nothing here reads quality.
 * ========================================================================== */

const PIECE_IDS = ['saltlight-s1', 'saltlight-s2', 'saltlight-s3', 'saltlight-s4'];

/* Plateau shape for fork offsets: 0 -> 1 -> 0 with C2 ends. */
const plateauShape = (t) => sm(0, 0.42, t) * (1 - sm(0.60, 1, t));

/* Fork-arm elevation: level spans matching the spine's grade at both ends (so
 * overlapping corridors near diverge/rejoin sit at the same height), with the
 * dive/climb confined to the middle. Mid grades are nudged so the arm lands
 * exactly back on the spine elevation. One function per edge: both arms use it. */
function solveArmElev(spineElev, f0, f1, headLen, tailLen, midKeys) {
  const g0 = spineElev.gradeAt(f0), g1 = spineElev.gradeAt(f1);
  const y0 = spineElev.yAt(f0);
  const fE = f1 - tailLen;
  const yEWant = spineElev.yAt(fE);
  const keys = [[f0, g0], [f0 + headLen, g0], ...midKeys.map(k => [k[0], k[1]]), [fE, g1], [f1, g1]];
  for (let it = 0; it < 10; it++) {
    const e = makeElevation(y0, keys);
    const err = e.yAt(fE) - yEWant;
    if (Math.abs(err) < 1e-9) break;
    const span = fE - (f0 + headLen);
    const dg = -err * 100 / span;
    for (let i = 2; i < keys.length - 2; i++) keys[i][1] += dg;
  }
  return makeElevation(y0, keys);
}

/* Even piece length near 2 km, seed-varied (structural change across seeds). */
function pickLength(rng) { return 1940 + 2 * rng.int(0, 79); }  // 1940..2098

function mkItem(pieceId, seed, family, name, stationOffsetM, content) {
  return { sourceId: `${pieceId}::${seed}::${family}/${name}`, stationOffsetM, content };
}

const VOCAB_CLOSED_SET = ['dappled-gate', 'light-shaft', 'fernfold-shaft', 'fork-wedge',
  'water-aperture', 'wind-sisters', 'orchard-row', 'bellroot-approach'];
function declareMotif(plan, vocabId, ourMotif, station) {
  if (!VOCAB_CLOSED_SET.includes(vocabId)) throw new Error(`motif id "${vocabId}" is not in the closed vocabulary set`);
  plan.vocabulary.push({ id: vocabId, motif: ourMotif, stationOffsetM: station });
}

/* Shared curvature-lobe factory: alternating gentle lobes inside the interior. */
function planLobes(rng, length, count, aRange, wRange, forced) {
  const lobes = forced ? forced.slice() : [];
  const inner0 = C.HANDOFF_M + 60, inner1 = length - C.HANDOFF_M - 60;
  let sign = rng.sign();
  for (let i = 0; i < count; i++) {
    const w = rng.range(wRange[0], wRange[1]);
    const c = lerp(inner0 + w, inner1 - w, (i + rng.range(0.15, 0.85)) / count);
    if (c - w < inner0 || c + w > inner1) continue;
    let clash = false;
    for (const L of lobes) if (Math.abs(L.c - c) < (L.w + w) * 0.55) clash = true;
    if (clash) continue;
    lobes.push({ a: sign * rng.range(aRange[0], aRange[1]), c, w });
    sign = -sign;
  }
  lobes.sort((p, q) => p.c - q.c);
  return lobes;
}

/* ============================== S1 — THE DUNE PASSAGE (withholding) ======= */
function planS1(seed) {
  const id = 'saltlight-s1';
  const R = {}; for (const d of GENERATOR_DOMAINS) R[d] = makeStream(seed, id, d);
  const length = pickLength(R.route);
  const entryY = 8.6 + R.route.range(0, 1.6);
  const lobes = planLobes(R.route, length, 4, [0.0008, 0.0019], [240, 400]);
  const gA = R.route.range(1.2, 2.1), gB = R.route.range(0.9, 1.7);
  const gradeKeys = [[0, 0], [C.HANDOFF_M, 0],
    [420, gA], [700, -gB], [1080, gB * 0.8], [1480, -gA * 0.6],
    [length - C.HANDOFF_M, 0], [length, 0]];
  const elev = makeElevation(entryY, gradeKeys);
  const line = buildLine(id + ':spine', length, makeCurvature(lobes), elev, 0);

  // Dune ridge (seaward): crest position/height wander + the gaps that withhold
  const gapCount = R.terrain.int(3, 4);
  const gaps = [];
  for (let i = 0; i < gapCount; i++) {
    gaps.push({
      s: lerp(430, length - 430, (i + R.terrain.range(0.25, 0.75)) / gapCount),
      w: R.terrain.range(15, 23),          // half-width
      floorRel: R.terrain.range(0.7, 1.15) // gap floor stays above road: sea glimpsed, never given
    });
  }
  const zones = {
    kind: 'dune',
    crestD0: R.terrain.range(24, 30), crestWander: R.terrain.range(5, 9),
    crestH0: R.terrain.range(5.6, 7.8), crestHVar: R.terrain.range(1.2, 2.4),
    beachEndD: R.terrain.range(96, 140),   // where sand meets water
    backRise: R.terrain.range(0.052, 0.075),
    gaps,
  };

  const plan = {
    setPieceId: id, seed, length, entryY, line, R, zones,
    oneIdea: 'withholding', carriesFork: false,
    formations: [], groves: [], trees: [], lifeEvents: [], airPockets: [], vocabulary: [],
    chapterSpans: { approach: [C.HANDOFF_M, gaps[0].s - 60], idea: [gaps[0].s - 60, gaps[gapCount - 1].s + 80], release: [gaps[gapCount - 1].s + 80, length - C.HANDOFF_M] },
  };

  // formations: skerries offshore, fence line, gate, cattle grid, headland ladder
  const F = plan.formations;
  F.push(mkItem(id, seed, 'formations', 'skerry-a', Math.round(R.geology.range(700, 1100)),
    { type: 'skerry', d: R.geology.range(380, 470), h: R.geology.range(2.5, 4.5), r: R.geology.range(10, 16) }));
  F.push(mkItem(id, seed, 'formations', 'skerry-b', Math.round(R.geology.range(1100, 1500)),
    { type: 'skerry', d: R.geology.range(430, 560), h: R.geology.range(1.8, 3.2), r: R.geology.range(8, 13) }));
  const fenceS0 = 210, fenceS1 = length - 210;
  F.push(mkItem(id, seed, 'formations', 'fence-line', fenceS0,
    { type: 'fence', d: -14.5, s0: fenceS0, s1: fenceS1, postEvery: 11 }));
  const gateS = Math.round(R.geology.range(500, length - 500));
  F.push(mkItem(id, seed, 'formations', 'gate', gateS, { type: 'gate', d: -14.5 }));
  F.push(mkItem(id, seed, 'formations', 'cattle-grid', Math.round(R.roadHistory.range(300, 480)), { type: 'cattleGrid' }));
  // this piece's own receding coast (shape-built depth ladder, glimpsed in gaps)
  const ladder = [];
  for (let i = 0; i < 3; i++) {
    ladder.push({ dist: [900, 2100, 3600][i], bearingDeg: R.geology.range(14, 30), h: R.geology.range(42, 60) + i * 12,
      w: R.geology.range(430, 680) * (1 + i * 0.5), skew: R.geology.range(-0.4, 0.4), albedoClass: i });
  }
  F.push(mkItem(id, seed, 'formations', 'headland-ladder', length - 300, { type: 'ladder', items: ladder }));

  // groves: lupin banks on stabilised backdune; strandline wrack strips
  for (let i = 0; i < 3; i++) {
    plan.groves.push(mkItem(id, seed, 'groves', `lupin-bank-${i}`, Math.round(R.ecology.range(350, length - 350)),
      { type: 'lupin', d: -R.ecology.range(18, 40), r: R.ecology.range(12, 22), density: R.ecology.range(0.5, 0.9) }));
  }
  plan.groves.push(mkItem(id, seed, 'groves', 'wrack-line-a', 400, { type: 'wrack', dRel: 'beach', s0: 260, s1: length - 260 }));
  // trees: a couple of leaning shore pines far landward
  for (let i = 0; i < 2; i++) {
    plan.trees.push(mkItem(id, seed, 'trees', `shore-pine-${i}`, Math.round(R.ecology.range(400, length - 400)),
      { type: 'pine', d: -R.ecology.range(55, 90), h: R.ecology.range(4.5, 7), lean: R.ecology.range(0.2, 0.38) }));
  }

  // life: wader flock over the beach, gull drift, otter in a gap cove, seals on skerry
  const L = plan.lifeEvents;
  L.push(mkItem(id, seed, 'lifeEvents', 'wader-flock', Math.round(lerp(500, length - 500, R.birds())),
    { type: 'waders', count: 60, zoneD: [zones.beachEndD - 40, zones.beachEndD + 30], loopS: [300, length - 300] }));
  L.push(mkItem(id, seed, 'lifeEvents', 'gull-wheel', Math.round(R.birds.range(600, length - 600)),
    { type: 'gullWheel', count: 44, d: R.birds.range(180, 320), alt: R.birds.range(18, 30), r: R.birds.range(40, 70) }));
  const otterGap = gaps[Math.min(1, gaps.length - 1)];
  L.push(mkItem(id, seed, 'lifeEvents', 'otter', Math.round(otterGap.s), { type: 'otter', d: zones.beachEndD + 18 }));
  L.push(mkItem(id, seed, 'lifeEvents', 'seals-skerry', F[0].stationOffsetM, { type: 'seals', count: 3, at: 'skerry-a' }));
  L.push(mkItem(id, seed, 'lifeEvents', 'gull-lift-1', Math.round(R.birds.range(400, 900)), { type: 'gullLift', count: 3 }));
  L.push(mkItem(id, seed, 'lifeEvents', 'gull-lift-2', Math.round(R.birds.range(1100, 1700)), { type: 'gullLift', count: 4 }));

  // air: faint salt shimmer standing in the two strongest gaps (bounded volumes)
  for (let i = 0; i < Math.min(2, gaps.length); i++) {
    const g = gaps[i];
    plan.airPockets.push(mkItem(id, seed, 'airPockets', `gap-shimmer-${i}`, Math.round(g.s),
      { type: 'haze', s0: g.s - g.w * 2, s1: g.s + g.w * 2, d0: 20, d1: 120, y0: 0, y1: 14, density: 0.011, tint: 'pearl' }));
  }

  // vocabulary: each dune gap is a water-aperture; the fence line is orchard-row
  for (let i = 0; i < gaps.length; i++) declareMotif(plan, 'water-aperture', `dune gap ${i} opening to sea`, Math.round(gaps[i].s));
  declareMotif(plan, 'orchard-row', 'fence line along the backdune', fenceS0);
  return plan;
}

/* ============================== S2 — THE CLIFF REVEAL (the drop) ========== */
function planS2(seed) {
  const id = 'saltlight-s2';
  const R = {}; for (const d of GENERATOR_DOMAINS) R[d] = makeStream(seed, id, d);
  const length = pickLength(R.route);
  const entryY = 33 + R.route.range(0, 2.5);
  const revealC = 760 + R.route.range(0, 120);         // centre of the reveal bend
  const revealW = R.route.range(270, 330);
  const preC = revealC - revealW - R.route.range(60, 140);
  const forced = [
    { a: R.route.range(0.0010, 0.0014), c: preC, w: R.route.range(220, 260) },   // swing seaward first
    { a: -R.route.range(0.0019, 0.0023), c: revealC, w: revealW },               // THE bend (right, around the spur)
  ];
  const lobes = planLobes(R.route, length, 2, [0.0006, 0.0012], [240, 340], forced)
    .filter(L => L.c - L.w > C.HANDOFF_M + 40 && L.c + L.w < length - C.HANDOFF_M - 40);
  const climbG = R.route.range(4.6, 5.4);
  const gradeKeys = [[0, 0], [C.HANDOFF_M, 0], [260, 3.0], [640, climbG], [780, 1.4], [900, 0.4],
    [1480, -0.4], [1640, -2.4], [1800, -0.9], [length - C.HANDOFF_M, 0], [length, 0]];
  const elev = makeElevation(entryY, gradeKeys);
  const line = buildLine(id + ':spine', length, makeCurvature(lobes), elev, 0);

  const revealS = revealC - revealW * 0.25;  // cliff pinches in through the bend
  const zones = {
    kind: 'cliff',
    revealS, revealRamp: 90,
    ceNear: R.terrain.range(12.5, 15.5),   // cliff edge distance once revealed
    ceFar: R.terrain.range(46, 58),        // pre-reveal seaward slope start
    ceWander: R.terrain.range(3, 6),
    faceW: R.terrain.range(6.5, 9.5),      // lateral width of the near-vertical face
    platformY: 1.05, platformW: R.terrain.range(16, 34),
    cliffEndS: length - R.terrain.range(320, 400),  // face lowers toward exit
    hillSlope: R.terrain.range(0.20, 0.27),
    benchS0: 500 + R.terrain.range(0, 60), benchS1: length - 380, benchRel: 8.5, benchD: -(24 + R.terrain.range(0, 7)),
  };

  const plan = {
    setPieceId: id, seed, length, entryY, line, R, zones,
    oneIdea: 'the drop', carriesFork: false,
    formations: [], groves: [], trees: [], lifeEvents: [], airPockets: [], vocabulary: [],
    chapterSpans: { approach: [C.HANDOFF_M, revealS], idea: [revealS, zones.cliffEndS], release: [zones.cliffEndS, length - C.HANDOFF_M] },
  };
  const F = plan.formations;

  // Stack field: varied erosion states; exactly one arch, guaranteed
  const stackTypes = ['stack', 'arch', 'stump', 'stack', 'pillar', 'stump'];
  const nStacks = R.geology.int(5, 6);
  let archPlaced = false;
  for (let i = 0; i < nStacks; i++) {
    let type = stackTypes[R.geology.int(0, stackTypes.length - 1)];
    if (i === 2) { type = 'arch'; }
    if (type === 'arch') { if (archPlaced) type = 'stack'; else archPlaced = true; }
    const s = Math.round(lerp(revealS + 80, zones.cliffEndS - 60, (i + R.geology.range(0.2, 0.8)) / nStacks));
    F.push(mkItem(id, seed, 'formations', `stack-${i}`, s, {
      type, d: zones.ceNear + zones.faceW + zones.platformW + R.geology.range(30, 175),
      h: type === 'stump' ? R.geology.range(4, 9) : (type === 'arch' ? R.geology.range(22, 32) : R.geology.range(32, 58)),
      r: R.geology.range(9, 17), guano: R.geology() < 0.4,
    }));
  }
  const blowS = Math.round(R.geology.range(revealS + 220, zones.cliffEndS - 220));
  F.push(mkItem(id, seed, 'formations', 'blowhole', blowS,
    { type: 'blowhole', d: zones.ceNear + zones.faceW + R.geology.range(6, 12),
      schedule: Array.from({ length: 8 }, () => R.ambient.range(17, 31)) }));
  const skerryS = Math.round(R.geology.range(revealS + 260, zones.cliffEndS - 160));
  F.push(mkItem(id, seed, 'formations', 'seal-skerry', skerryS,
    { type: 'skerry', d: zones.ceNear + zones.faceW + R.geology.range(46, 70), h: 1.6, r: 9 }));
  F.push(mkItem(id, seed, 'formations', 'old-alignment', zones.benchS0,
    { type: 'bench', s0: zones.benchS0, s1: zones.benchS1, d: zones.benchD, rel: zones.benchRel }));
  F.push(mkItem(id, seed, 'formations', 'ruined-abutment', Math.round(R.roadHistory.range(1150, 1420)),
    { type: 'abutment', d: zones.benchD, rel: zones.benchRel }));
  F.push(mkItem(id, seed, 'formations', 'barrier-run', 720, { type: 'barrierRun', s0: 700, s1: Math.round(zones.cliffEndS + 40) }));
  const ladder = [];
  for (let i = 0; i < 4; i++) {
    ladder.push({ dist: [430, 1000, 2300, 4000][i], bearingDeg: R.geology.range(10, 26), h: [52, 74, 94, 110][i] + R.geology.range(-8, 10),
      w: [560, 900, 1500, 2300][i], skew: R.geology.range(-0.35, 0.35), albedoClass: i });
  }
  F.push(mkItem(id, seed, 'formations', 'headland-ladder', length - 260, { type: 'ladder', items: ladder }));

  // groves: thrift cushions band on clifftop, ice plant on the cut, guano ledges
  plan.groves.push(mkItem(id, seed, 'groves', 'thrift-band', Math.round(revealS + 150),
    { type: 'thrift', s0: revealS + 40, s1: zones.cliffEndS, dEdge: true }));
  plan.groves.push(mkItem(id, seed, 'groves', 'iceplant-cut', 420, { type: 'iceplant', s0: 300, s1: 700, side: 'land' }));
  for (let i = 0; i < 2; i++) {
    plan.trees.push(mkItem(id, seed, 'trees', `wind-pine-${i}`, Math.round(R.ecology.range(240, 560)),
      { type: 'pine', d: -R.ecology.range(40, 70), h: R.ecology.range(5, 8), lean: R.ecology.range(0.25, 0.4) }));
  }

  const L = plan.lifeEvents;
  L.push(mkItem(id, seed, 'lifeEvents', 'pelican-line', Math.round(revealS + 100), {
    type: 'pelicans', count: 11, s0: revealS + 40, s1: zones.cliffEndS + 100,
    dropBelowDeck: R.creatures.range(16, 24), dOff: zones.ceNear + zones.faceW + 8 + R.creatures.range(0, 10), period: 78,
  }));
  L.push(mkItem(id, seed, 'lifeEvents', 'gull-colony', F[1].stationOffsetM,
    { type: 'gullWheel', count: 46, d: F[1].content.d, alt: 30, r: 46 }));
  L.push(mkItem(id, seed, 'lifeEvents', 'seals-slide', skerryS, { type: 'sealsSlide', count: 5, at: 'seal-skerry' }));
  L.push(mkItem(id, seed, 'lifeEvents', 'dolphins', Math.round(R.creatures.range(revealS + 200, zones.cliffEndS - 120)),
    { type: 'dolphins', count: 4, d: zones.ceNear + zones.faceW + R.creatures.range(40, 90) }));
  L.push(mkItem(id, seed, 'lifeEvents', 'whale-spout', Math.round(R.rare.range(revealS + 320, zones.cliffEndS - 200)),
    { type: 'whaleSpout', d: R.rare.range(750, 1050), delayS: R.rare.range(5, 9) }));
  L.push(mkItem(id, seed, 'lifeEvents', 'raptor', Math.round(R.birds.range(300, 600)), { type: 'raptor', d: -18, alt: 26 }));

  // air: spray pockets at the blowhole and along the breaker line; arch shaft haze
  plan.airPockets.push(mkItem(id, seed, 'airPockets', 'blowhole-spray', blowS,
    { type: 'spray', s0: blowS - 30, s1: blowS + 30, d0: zones.ceNear, d1: zones.ceNear + 40, y0: 0, y1: 18, density: 0.018, tint: 'spray' }));
  plan.airPockets.push(mkItem(id, seed, 'airPockets', 'breaker-haze', Math.round(revealS + 200),
    { type: 'haze', s0: revealS + 60, s1: zones.cliffEndS, d0: zones.ceNear + 4, d1: zones.ceNear + 90, y0: 0, y1: 12, density: 0.006, tint: 'pearl' }));
  const arch = F.find(f => f.content.type === 'arch');
  if (arch) {
    plan.airPockets.push(mkItem(id, seed, 'airPockets', 'arch-shaft', arch.stationOffsetM,
      { type: 'haze', s0: arch.stationOffsetM - 40, s1: arch.stationOffsetM + 40, d0: arch.content.d - 30, d1: arch.content.d + 30, y0: 0, y1: 24, density: 0.012, tint: 'pearl' }));
    declareMotif(plan, 'light-shaft', 'low light through the sea arch and its haze', arch.stationOffsetM);
  }
  return plan;
}

/* ============================== S3 — THE LANDSLIP (fork) ================== */
function planS3(seed) {
  const id = 'saltlight-s3';
  const R = {}; for (const d of GENERATOR_DOMAINS) R[d] = makeStream(seed, id, d);
  const length = pickLength(R.route);
  const entryY = 15 + R.route.range(0, 1.6);
  const lobes = [
    { a: R.route.range(0.0008, 0.0012), c: 400 + R.route.range(-40, 40), w: 260 },
    { a: -R.route.range(0.0010, 0.0014), c: 1060 + R.route.range(-50, 50), w: 300 },
    { a: R.route.range(0.0006, 0.0010), c: length - 380, w: 220 },
  ];
  const gradeKeys = [[0, 0], [C.HANDOFF_M, 0], [300, 0.9], [460, 0.2], [length - 290, 0.2],
    [length - 180, -0.55], [length - C.HANDOFF_M, 0], [length, 0]];
  const elev = makeElevation(entryY, gradeKeys);
  const line = buildLine(id + ':spine', length, makeCurvature(lobes), elev, 0);

  // Fork stations on frame multiples; the ghost spine between them is the ruin.
  // The arm mouths stay LEVEL with the spine while corridors overlap; the
  // vertical split lives wholly inside the lateral split.
  const f0 = 480;
  const f1 = Math.round((length - 300) / 2) * 2;

  const cutPeak = R.fork.range(11, 13.5);

  L.push(mkItem(id, seed, 'lifeEvents', 'gull-lift-1', Math.round(R.birds.range(240, 480)), { type: 'gullLift', count: 3 }));

  F.push(mkItem(id, seed, 'formations', 'stone-wall', 300, { type: 'fieldWall', d: -16, s0: 240, s1: fb0 + 200, gapEvery: 180 }));

  const L = plan.lifeEvents;

}
/* ============================================================================
 * WORLD ASSEMBLY — the four set-pieces, delivered independently, previewed in
 * sequence with ordinary country between them. Connectors are preview-only and
 * never appear in the capsule.
 * ========================================================================== */

function makeTransform(ox, oz, yaw) {
  return { ox, oz, yaw, cos: Math.cos(yaw), sin: Math.sin(yaw) };
}
function worldPos(T, x, z, out) {
  out = out || [0, 0];
  out[0] = T.ox + x * T.cos + z * T.sin;
  out[1] = T.oz - x * T.sin + z * T.cos;
  return out;
}
function worldVec(T, x, z, out) {
  out = out || [0, 0];
  out[0] = x * T.cos + z * T.sin;
  out[1] = -x * T.sin + z * T.cos;
  return out;
}

/* Piece identity weight: 0 (pure plain country) in the handoffs, 1 inside. */
function pieceWeight(plan, s) {
  return sm(C.HANDOFF_M, C.HANDOFF_M + 105, s) * (1 - sm(plan.length - C.HANDOFF_M - 105, plan.length - C.HANDOFF_M, s));
}

function buildConnector(seed, idx, yStart, yEnd) {
  const R = makeStream(seed, `connector-${idx}`, 'route');
  const dy = yEnd - yStart;
  const needed = Math.abs(dy) * 100 / 1.9 + 140;
  const length = Math.max(260, Math.ceil(needed / 2) * 2);
  const g = dy === 0 ? 0 : 100 * dy / (length - 60);
  const gradeKeys = [[0, 0], [60, g], [length - 60, g], [length, 0]];
  const lobes = length >= 340
    ? [{ a: R.range(0.0005, 0.0011) * (idx % 2 === 0 ? 1 : -1), c: length / 2, w: Math.min(240, length / 2 - 70) }]
    : [];
  const line = buildLine(`conn-${idx}`, length, makeCurvature(lobes), makeElevation(yStart, gradeKeys), 0);
  return { key: `c${idx}`, isConnector: true, length, line, entryY: yStart };
}

function buildWorldPlan(seed) {
  const t0 = performance.now();
  const pieces = [planS1(seed), planS2(seed), planS3(seed), planS4(seed)];
  const plainNoise = makeNoise2D(makeStream(seed, 'world', 'terrain'));
  // strata hardness per piece (geology stream): bedding consistent across each face
  for (const p of pieces) {
    p.strata = Array.from({ length: 40 }, () => Number(p.R.geology().toFixed(4)));
    p.noise = makeNoise2D(p.R.terrain);
    p.ecoNoise = makeNoise2D(p.R.ecology);
    augmentSharedPlanItems(p);
  }

  // sequence: lead connector, S1..S4 with connectors between, tail connector
  const segments = [];
  const connectors = [];
  let T = makeTransform(0, 0, 0);
  const lead = buildConnector(seed, 0, pieces[0].entryY, pieces[0].entryY);
  connectors.push(lead);
  segments.push({ key: 'c0', kind: 'conn', ref: lead, line: lead.line, T });
  const advance = (line) => {
    const end = line.frames[line.frames.length - 1];
    const wp = worldPos(T, end.x, end.z);
    T = makeTransform(wp[0], wp[1], T.yaw + end.theta);
  };
  advance(lead.line);
  for (let i = 0; i < 4; i++) {
    const p = pieces[i];
    p.T = T;
    segments.push({ key: p.setPieceId, kind: 'piece', ref: p, line: p.line, T });
    advance(p.line);
    const exitY = p.line.frames[p.line.frames.length - 1].y;
    const nextY = i < 3 ? pieces[i + 1].entryY : exitY;
    const conn = buildConnector(seed, i + 1, exitY, nextY);
    connectors.push(conn);
    conn.T = T;
    segments.push({ key: conn.key, kind: 'conn', ref: conn, line: conn.line, T });
    advance(conn.line);
  }
  for (const cn of connectors) if (!cn.T) cn.T = segments.find(s => s.key === cn.key).T;

  // cumulative world path stations (spine lengths; used for residency + HUD)
  let cum = 0;
  for (const seg of segments) { seg.worldS0 = cum; cum += seg.ref.length; }
  const totalWorldLen = cum;

  // validators — fail loud at build time, never silently
  const validation = { lines: [], errors: [] };
  for (const p of pieces) {
    const v = validateLine(p.line, p.setPieceId + ':spine');
    validation.lines.push({ id: p.setPieceId + ':spine', ...v });
    validation.errors.push(...v.errors);
    if (p.fork) {
      for (const arm of [p.fork.armTide, p.fork.armCut]) {
        const va = validateLine(arm, arm.id);
        validation.lines.push({ id: arm.id, ...va });
        validation.errors.push(...va.errors);
      }
    }
  }
  for (const cn of connectors) {
    const v = validateLine(cn.line, cn.key);
    validation.lines.push({ id: cn.key, ...v });
    validation.errors.push(...v.errors);
  }

  const world = { seed, pieces, connectors, segments, totalWorldLen, plainNoise, validation,
    buildMs: performance.now() - t0 };
  buildCompositions(world);
  return world;
}

/* --------------------------------------------------------------- capsule
 * Route frames chunked for the composition: chunk 0 holds frames [0..100];
 * chunk n>0 holds [n*100-12 .. (n+1)*100] — exactly twelve overlap frames,
 * duplicated byte-identically because they serialize from the same objects.
 */
function chunkFrameItems(pieceId, seed, lineName, line) {
  const items = [];
  const f = line.frames;
  const nChunks = Math.ceil((f.length - 1) / C.FRAMES_PER_CHUNK);
  for (let n = 0; n < nChunks; n++) {
    const i0 = n === 0 ? 0 : n * C.FRAMES_PER_CHUNK - C.BOUNDARY_OVERLAP;
    const i1 = Math.min((n + 1) * C.FRAMES_PER_CHUNK, f.length - 1);
    const ch = { line: lineName, frameStart: i0, overlap: n === 0 ? 0 : C.BOUNDARY_OVERLAP,
      x: [], y: [], z: [], tx: [], tz: [], lx: [], lz: [], k: [], elevationM: [], gradePercent: [] };
    for (let i = i0; i <= i1; i++) {
      const fr = f[i];
      ch.x.push(fr.x); ch.y.push(fr.y); ch.z.push(fr.z);
      ch.tx.push(fr.tx); ch.tz.push(fr.tz); ch.lx.push(fr.lx); ch.lz.push(fr.lz);
      ch.k.push(fr.k); ch.elevationM.push(fr.elevationM); ch.gradePercent.push(fr.gradePercent);
    }
    items.push(mkItem(pieceId, seed, 'routeFrames', `${lineName}-${String(n).padStart(3, '0')}`,
      n * C.CHUNK_LEN, ch));
  }
  return items;
}

function buildCompositions(world) {
  for (const p of world.pieces) {
    const id = p.setPieceId, seed = world.seed;
    const lastF = p.line.frames[p.line.frames.length - 1];
    p.entryPose = { positionM: [0, p.entryY, 0], headingDegrees: 0, gradePercent: 0 };
    p.exitPose = {
      positionM: [lastF.x, lastF.y, lastF.z],
      headingDegrees: ((lastF.theta / DEG) % 360 + 360) % 360,
      gradePercent: lastF.gradePercent,
    };

    const planItems = [
      mkItem(id, seed, 'plan', 'identity', 0, {
        setPieceId: id, oneIdea: p.oneIdea, identityAxis: 'asymmetry: ocean and open air seaward, rising land landward',
        lengthM: p.length, entryY: p.entryY, carriesFork: !!p.fork,
      }),
      mkItem(id, seed, 'plan', 'chapters', C.HANDOFF_M, { spans: p.chapterSpans, handoff: { entryNeutralM: C.HANDOFF_M, exitNeutralM: C.HANDOFF_M } }),
      mkItem(id, seed, 'plan', 'route', 0, {
        lobes: p.line.kFn.lobes.map(L => ({ a: L.a, c: L.c, w: L.w })),
        gradeKeys: p.line.elev.keys.map(k => [k[0], k[1]]),
      }),
      mkItem(id, seed, 'plan', 'event-schedule', 0, {
        events: p.lifeEvents.map(e => ({ name: e.sourceId.split('/').pop(), stationOffsetM: e.stationOffsetM, type: e.content.type })),
        rare: p.rareEvents || {},
      }),
      mkItem(id, seed, 'plan', 'vocabulary', 0, { declared: p.vocabulary }),
    ];
    if (p.fork) {
      planItems.push(mkItem(id, seed, 'plan', 'fork', p.fork.f0, {
        f0: p.fork.f0, f1: p.fork.f1, presentAt: p.fork.present, defaultArm: p.fork.defaultArm,
        tide: { amp: p.fork.armTide.amp, lengthM: p.fork.armTide.length, gradeKeys: p.fork.armTide.elev.keys.map(k => [k[0], k[1]]) },
        cut: { amp: p.fork.armCut.amp, lengthM: p.fork.armCut.length, gradeKeys: p.fork.armCut.elev.keys.map(k => [k[0], k[1]]) },
      }));
    }
    const terrainItems = [
      mkItem(id, seed, 'terrain', 'zones', 0, { ...p.zones }),
      mkItem(id, seed, 'terrain', 'strata', 0, { bandHeightM: C.STRATA_BAND_H, hardness: p.strata }),
    ];
    let frameItems = chunkFrameItems(id, seed, 'spine', p.line);
    if (p.fork) {
      frameItems = frameItems.concat(
        chunkFrameItems(id, seed, 'arm-tide', p.fork.armTide),
        chunkFrameItems(id, seed, 'arm-cut', p.fork.armCut));
    }
    const fam = (items) => ({ count: items.length, sha256: canonHash(items.map(i => ({ sourceId: i.sourceId, stationOffsetM: i.stationOffsetM, content: i.content }))), items });
    p.families = {
      plan: fam(planItems),
      routeFrames: fam(frameItems),
      terrain: fam(terrainItems),
      formations: fam(p.formations),
      groves: fam(p.groves),
      trees: fam(p.trees),
      lifeEvents: fam(p.lifeEvents),
      airPockets: fam(p.airPockets),
    };
    p.planHash = canonHash({
      setPieceId: id, lengthM: p.length,
      plan: p.families.plan.sha256, terrain: p.families.terrain.sha256,
      formations: p.families.formations.sha256, groves: p.families.groves.sha256,
      trees: p.families.trees.sha256, lifeEvents: p.families.lifeEvents.sha256,
      airPockets: p.families.airPockets.sha256,
    });
    p.compositionSha256 = canonHash({
      families: Object.fromEntries(Object.entries(p.families).map(([k, v]) => [k, {
        count: v.count, sha256: v.sha256,
        items: v.items.map(i => ({ sourceId: i.sourceId, stationOffsetM: i.stationOffsetM, content: i.content })),
      }])),
    });
  }
  world.hashes = {
    route: sha256Hex(world.pieces.map(p => p.families.routeFrames.sha256).join('|')),
    world: sha256Hex(world.pieces.map(p => p.planHash).join('|')),
    geology: sha256Hex(world.pieces.map(p => p.families.terrain.sha256 + p.families.formations.sha256).join('|')),
    ecology: sha256Hex(world.pieces.map(p => p.families.groves.sha256 + p.families.trees.sha256).join('|')),
    events: sha256Hex(world.pieces.map(p => p.families.lifeEvents.sha256 + p.families.airPockets.sha256).join('|')),
  };
}
/* ============================================================================
 * TERRAIN — one profile authority. groundY/groundInfo are the only functions
 * that decide ground height, and every consumer (mesh, ecology seating, road
 * carve validation, event placement) calls them. Asymmetry is structural:
 * d > 0 is always the sea side (drop), d < 0 always the land side (rise).
 * ========================================================================== */

/* THE road-edge function. Every treatment of the verge — trench depth, berm,
 * ditch, sand accumulation, wall clamp beyond the clear radius — lives here
 * and only here, keyed positively by the side name. */
function roadEdgeRel(side, add, deckY, naturalY, sandiness) {
  // add = |dd| lateral distance from the line's centreline
  if (add <= C.SHOULDER_OUT) {
    return deckY - C.ROAD_BURY;                    // trench: ground strictly beneath the ribbon
  }
  if (side === 'sea') {
    if (add <= C.CLEAR_RADIUS) {
      // low sand/gravel berm outside the riding line, scuppers cut it later visually
      const t = (add - C.SHOULDER_OUT) / (C.CLEAR_RADIUS - C.SHOULDER_OUT);
      return deckY - C.ROAD_BURY + (0.30 + 0.25 * sandiness) * sm(0, 1, t);
    }
    const t = sm(C.CLEAR_RADIUS, C.CLEAR_RADIUS + 2.6, add);
    const berm = deckY - C.ROAD_BURY + 0.30 + 0.25 * sandiness;
    return lerp(berm, naturalY, t);
  }
  // land side: catch ditch inside the clear radius, then a wall clamp that lets
  // natural ground rise no faster than a stable cut face beyond it
  if (add <= C.CLEAR_RADIUS) {
    const t = (add - C.SHOULDER_OUT) / (C.CLEAR_RADIUS - C.SHOULDER_OUT);
    return deckY - C.ROAD_BURY - 0.45 * Math.sin(Math.PI * clamp(t, 0, 1)); // ditch dip
  }
  const wall = deckY - 0.55 + (add - C.CLEAR_RADIUS) * 2.35;  // ~67 degree cut face limit
  const t = sm(C.CLEAR_RADIUS, C.CLEAR_RADIUS + 1.8, add);
  return lerp(deckY - C.ROAD_BURY - 0.2, Math.min(naturalY, wall), t);
}

/* Evaluate one line's carve at a point: target height and mask strength.
 * weight lets the S3 ghost spine survive as a broken remnant. Positive keying:
 * side by sign of dd against the seaward-positive convention. Overlapping
 * corridors (fork mouths) are blended by mask weight, never overwritten. */
function carveLineEval(naturalY, dd, deckY, weight, sandiness, out) {
  const add = Math.abs(dd);
  if (add >= C.CLEAR_RADIUS + 3.2 || weight <= 0) { out.m = 0; return out; }
  const side = dd > 0 ? 'sea' : 'land';
  out.target = roadEdgeRel(side, add, deckY, naturalY, sandiness);
  out.m = weight * (1 - sm(C.CLEAR_RADIUS + 1.2, C.CLEAR_RADIUS + 3.2, add));
  return out;
}

/* ------------------------------------------------- piece landform (natural) */
/* Preview backdrop: inland ground swells toward the lateral cap so the land
 * horizon is ground, not void. One definition, used by every land branch. */
function landHorizonRise(d) { return sm(135, 245, -d) * 30; }

function plainAbsY(world, deckY, s, d, wx, wz) {
  const n = world.plainNoise.fbm(wx * 0.013, wz * 0.013, 3, 2.1, 0.5);
  if (d >= 0) {
    let y = deckY - 0.045 * Math.max(0, d - 9) + n * 1.1;
    y = lerp(y, -6, sm(165, 258, d));                       // ordinary coast falls away far out
    return y;
  }
  let y = deckY + 0.058 * Math.max(0, -d - 12) + n * 1.4;
  return Math.min(y, deckY + 20 + n * 2) + landHorizonRise(d) * (1 + 0.2 * n);
}

function duneAbsY(p, s, d, deckY, wx, wz, world) {
  const z = p.zones, N = p.noise;
  if (d >= 0) {
    const dc = z.crestD0 + z.crestWander * N.at(s * 0.006, 3.7);
    let crestH = z.crestH0 + z.crestHVar * N.at(s * 0.011, 9.2);
    for (const g of z.gaps) {
      const u = (s - g.s) / (g.w * 2.2);
      if (u > -1 && u < 1) crestH = lerp(crestH, g.floorRel, smoothBump(u));
    }
    const ripple = 0.22 * N.at(s * 0.09, d * 0.13);
    if (d <= dc) {
      const t = clamp((d - 8.4) / (dc - 8.4), 0, 1);
      return deckY + 0.25 + (crestH - 0.25) * Math.pow(sm(0, 1, t), 1.55) + ripple; // lee slipface: steep near crest
    }
    const beachTop = 1.5, wetEnd = z.beachEndD;
    if (d <= wetEnd) {
      const t = sm(0, 1, (d - dc) / (wetEnd - dc));
      return lerp(deckY + crestH, 0.0, Math.pow(t, 0.85)) + ripple * (1 - t);
    }
    let y = -0.014 * (d - wetEnd) - 0.4;
    return lerp(y, -7, sm(170, 258, d));
  }
  const roll = N.fbm(s * 0.016, d * 0.02, 3, 2.1, 0.5);
  let y = deckY + 0.6 + roll * 1.6 + z.backRise * Math.max(0, -d - 30);
  return Math.min(y, deckY + 26 + roll * 3) + landHorizonRise(d) * (1 + 0.2 * roll);
}

function cliffFaceCurve(t) {
  return 0.14 * sm(0, 0.20, t) + 0.86 * Math.pow(clamp((t - 0.10) / 0.90, 0, 1), 1.10);
}
function cliffAbsY(p, s, d, deckY, wx, wz, world) {
  const z = p.zones, N = p.noise;
  const faceness = sm(z.revealS - z.revealRamp, z.revealS, s) * (1 - sm(z.cliffEndS, z.cliffEndS + 180, s));
  if (d >= 0) {
    // terrace (pre-reveal / post-cliff): moderate seaward fall to the water
    let terrace = deckY - 0.34 * Math.max(0, d - 8.6) + N.at(s * 0.02, d * 0.02) * 1.6;
    terrace = Math.max(terrace, Math.min(terrace, 0) * 0.4 - 3 - 0.01 * d); // ease under sea
    let y = terrace;
    if (faceness > 0.001) {
      const ce = z.ceNear + z.ceWander * N.at(s * 0.008, 1.3);
      const fw = z.faceW;
      const platY = z.platformY + 0.5 * N.at(s * 0.05, d * 0.11) - 0.25;
      let cliffY;
      if (d <= ce) {
        cliffY = deckY - 0.35 - 0.055 * Math.max(0, d - 8.4) + 0.3 * N.at(s * 0.05, d * 0.07); // clifftop grass bench
      } else if (d <= ce + fw) {
        const t = (d - ce) / fw;
        const bench = deckY - 0.35 - 0.055 * (ce - 8.4);
        cliffY = lerp(bench, platY, cliffFaceCurve(t));
      } else {
        const dp = d - (ce + fw);
        if (dp <= z.platformW) cliffY = platY + 0.42 * N.at(s * 0.07, d * 0.09);   // wave-cut platform + pools
        else {
          const ds = dp - z.platformW;
          cliffY = platY - 0.9 - 0.05 * ds;
        }
      }
      y = lerp(terrace, cliffY, faceness);
    }
    return lerp(y, -8, sm(180, 258, d));
  }
  const hn = N.fbm(s * 0.012, d * 0.016, 3, 2.1, 0.5);
  let hill = deckY + z.hillSlope * Math.max(0, -d - 10.5) * (1 + 0.22 * hn) + hn * 1.4;
  hill = Math.min(hill, deckY + 62);
  if (s > z.benchS0 && s < z.benchS1) {   // the old alignment, a terrace in the hillside
    const band = smoothBump((d - z.benchD) / 5.0);
    const fade = sm(z.benchS0, z.benchS0 + 60, s) * (1 - sm(z.benchS1 - 60, z.benchS1, s));
    hill = lerp(hill, deckY + z.benchRel, band * 0.9 * fade);
  }
  return hill;
}

function slipAbsY(p, s, d, deckY, wx, wz, world) {
  const z = p.zones, N = p.noise;
  let y;
  if (d >= 0) {
    const bluffT = sm(8.4, z.bluffEndD, d);
    y = lerp(deckY - 0.35, z.shelfY, Math.pow(bluffT, 0.8)) + 0.5 * N.at(s * 0.02, d * 0.03);
    if (d > z.bluffEndD) {
      const t = sm(z.bluffEndD, z.shoreD, d);
      y = lerp(z.shelfY, 0.25, t) + 0.35 * N.at(s * 0.06, d * 0.08);
      if (d > z.shoreD) y = 0.25 - 0.017 * (d - z.shoreD);
    }
    y = lerp(y, -8, sm(175, 258, d));
  } else {
    const hn = N.fbm(s * 0.013, d * 0.016, 3, 2.1, 0.5);
    y = deckY + z.hillSlope * Math.max(0, -d - 10.5) * (1 + 0.2 * hn) + hn * 1.3;
    y += z.spurH * smoothBump((s - z.spurC) / z.spurSHalf) * sm(6, 26, -d);
    y = Math.min(y, deckY + 55) + landHorizonRise(d) * 0.7;
  }
  // the wound: scar carved into the upper slope, debris fan spilling seaward
  const su = (s - z.slipC) / z.slipSHalf, du = (d - z.slipDC) / z.slipDHalf;
  const u2 = su * su + du * du;
  if (u2 < 1) {
    const m = Math.pow(1 - u2, 1.35);
    if (d < z.slipDC + 6) y -= z.scarDepth * m * sm(-4, 10, z.slipDC + 6 - d);
    const fanN = 1 + 0.5 * N.at(s * 0.05, d * 0.05);
    if (d > z.slipDC - 4) y += 2.6 * m * sm(0, 18, d - z.slipDC + 4) * fanN;
  }
  return y;
}

function fogAbsY(p, s, d, deckY, wx, wz, world) {
  const z = p.zones, N = p.noise;
  let y;
  if (d >= 0) {
    const t = sm(z.bluffEdgeD, z.shoreD, d);
    y = deckY - 0.4 - 0.06 * Math.max(0, d - 8.6);
    if (d > z.bluffEdgeD) y = lerp(y, 0.6 + 0.5 * N.at(s * 0.05, d * 0.07), Math.pow(t, 0.85));
    if (d > z.shoreD) y = 0.5 - 0.02 * (d - z.shoreD) + 0.4 * N.at(s * 0.08, d * 0.1);
    // the promontory that carries the lighthouse
    const pm = smoothBump((s - z.pc) / 150);
    if (pm > 0.001) {
      const along = sm(0, 1, clamp(d / z.pointLen, 0, 1));
      const plateau = z.pointTopY * (1 - Math.pow(along, 3)) + 1.2;
      const neckW = sm(10, 40, d) * (1 - sm(z.pointLen - 14, z.pointLen + 16, d));
      y = Math.max(y, lerp(y, plateau, pm * Math.max(neckW, d < 10 ? 0 : 0))) ;
      if (d >= 10 && d <= z.pointLen + 16) y = Math.max(y, plateau * pm - (1 - pm) * 3);
    }
    y = lerp(y, -8, sm(z.pointLen + 40 > 175 ? z.pointLen + 40 : 175, 262, d));
  } else {
    const hn = N.fbm(s * 0.014, d * 0.018, 3, 2.1, 0.5);
    y = deckY + z.heathRise * Math.max(0, -d - 12) * (1 + 0.25 * hn) + hn * 1.2;
    y = Math.min(y, deckY + 24) + landHorizonRise(d) * (1 + 0.2 * hn);
  }
  return y;
}

const KIND_FN = { dune: duneAbsY, cliff: cliffAbsY, slip: slipAbsY, fog: fogAbsY };

/* Natural (uncarved) ground for a piece or connector, blended to plain country
 * in the handoffs. Connectors are always plain. */
function naturalY(world, seg, s, d, wx, wz) {
  const line = seg.line;
  const deckY = line.elev.yAt(clamp(s, 0, line.length));
  const plain = plainAbsY(world, deckY, s, d, wx, wz);
  if (seg.kind === 'conn') return plain;
  const p = seg.ref;
  const w = pieceWeight(p, s);
  if (w <= 0) return plain;
  const y = KIND_FN[p.zones.kind](p, s, d, deckY, wx, wz, world);
  return lerp(plain, y, w);
}

/* Active carve lines at a station of a segment. One mechanism for every road. */
function carveList(seg, s, out) {
  out.length = 0;
  const line = seg.line;
  if (seg.kind === 'conn' || !seg.ref.fork) {
    out.push({ off: 0, deckY: line.elev.yAt(s), weight: 1, sand: seg.kind !== 'conn' && seg.ref.zones.kind === 'dune' ? 1 : 0.25 });
    return out;
  }
  const p = seg.ref, fk = p.fork;
  if (s < fk.f0 || s > fk.f1) {
    out.push({ off: 0, deckY: line.elev.yAt(s), weight: 1, sand: 0.25 });
    return out;
  }
  // between fork stations: both arms carve; the ghost spine survives as remnant
  out.push({ off: fk.armTide.offAt(s), deckY: fk.armTide.yAtSpine(s), weight: 1, sand: 0.8 });
  out.push({ off: fk.armCut.offAt(s), deckY: fk.armCut.yAtSpine(s), weight: 1, sand: 0.15 });
  const z = p.zones;
  const inBowl = Math.abs(s - z.slipC) < z.slipSHalf * 0.72;
  const t0 = sm(fk.f0, fk.f0 + 90, s), t1 = 1 - sm(fk.f1 - 90, fk.f1, s);
  const ghostW = 0.34 * Math.min(t0, t1) * (inBowl ? 0 : 1);
  if (ghostW > 0.01) out.push({ off: 0, deckY: line.elev.yAt(s), weight: ghostW, sand: 0.3 });
  return out;
}

const _carves = [];
const _cvOut = { target: 0, m: 0 };
function groundY(world, seg, s, d, wx, wz) {
  let y = naturalY(world, seg, s, d, wx, wz);
  carveList(seg, s, _carves);
  let tAcc = 0, wAcc = 0, mAcc = 0, clampY = 1e9;
  for (let i = 0; i < _carves.length; i++) {
    const cv = _carves[i];
    carveLineEval(y, d - cv.off, cv.deckY, cv.weight, cv.sand, _cvOut);
    if (_cvOut.m > 0) {
      const w = _cvOut.m * _cvOut.m * _cvOut.m * _cvOut.m; // sharper masks win overlaps
      tAcc += _cvOut.target * w; wAcc += w; mAcc += _cvOut.m;
    }
    // sovereignty backstop: under any full-weight ribbon+shoulder, ground never rises
    if (cv.weight >= 0.9 && Math.abs(d - cv.off) <= C.SHOULDER_OUT + 0.05) {
      clampY = Math.min(clampY, cv.deckY - 0.42);
    }
  }
  if (wAcc > 1e-9) y = lerp(y, tAcc / wAcc, Math.min(1, mAcc));
  if (clampY < 1e8) y = Math.min(y, clampY);
  return y;
}

/* Strata displacement: bedding read in world y, consistent across each face. */
function strataOffset(p, y, steepness, s) {
  if (!p || steepness < 0.55) return 0;
  const band = Math.floor(y / C.STRATA_BAND_H);
  const idx = ((band % 40) + 40) % 40;
  const hard = p.strata[idx];
  let off = (hard - 0.5) * 1.35;
  if (y > C.TIDE_BAND_LO - 0.2 && y < C.TIDE_BAND_HI + 0.4) off -= 1.15;  // wave-base undercut notch
  return off * sm(0.55, 0.85, steepness);
}

/* ------------------------------------------------------------ classification
 * Material/colour truth for terrain vertices AND ecology habitat predicates.
 */
function groundInfo(world, seg, s, d, wx, wz, out) {
  out = out || {};
  const y = groundY(world, seg, s, d, wx, wz);
  const eps = 1.4;
  const y1 = groundY(world, seg, s, d + eps, wx, wz);
  const y2 = groundY(world, seg, s + eps, d, wx, wz);
  const slope = Math.hypot((y1 - y) / eps, (y2 - y) / eps);
  const p = seg.kind === 'piece' ? seg.ref : null;
  const kind = p ? p.zones.kind : 'plain';
  const w = p ? pieceWeight(p, s) : 0;
  let cls = 'grass';
  const add = Math.abs(d);
  if (add < 5.5) cls = 'under';
  else if (add < C.CLEAR_RADIUS + 0.2) cls = 'verge';
  else if (y < 0.15) cls = 'seabed';
  else if (y < C.TIDE_BAND_HI + 0.3 && slope > 0.5) cls = 'tiderock';
  else if (slope > 0.95) cls = 'rock';
  else if (kind === 'dune' && d > 0 && w > 0.3) cls = d > (p.zones.crestD0 + 6) && y < 2.2 ? 'beach' : 'duneSand';
  else if (kind === 'dune' && d < -14 && w > 0.3) cls = (-d > 95) ? 'grass' : 'backdune';
  else if (kind === 'cliff' && d > 0 && slope > 0.55) cls = 'rock';
  else if (kind === 'slip' && p) {
    const su = (s - p.zones.slipC) / p.zones.slipSHalf, du = (d - p.zones.slipDC) / p.zones.slipDHalf;
    if (su * su + du * du < 1) cls = d < p.zones.slipDC + 4 ? 'scar' : 'debris';
    else if (d > p.zones.bluffEndD && y < 2.4) cls = 'shelf';
  }
  else if (kind === 'fog' && w > 0.3) cls = 'heath';
  if (cls === 'grass' && d > 0 && y < 2.0 && slope < 0.3) cls = 'beach';
  if (cls === 'grass' && d > 0 && slope > 0.38) cls = 'scrub';   // coastal bluff scrub

  // colour: preview palette only — identity never rides on it
  let col, wet = 0, exposure = d > 0 ? 1 : clamp(0.55 - 0.01 * (-d), 0.15, 0.55);
  const nj = (p ? p.noise : world.plainNoise).at(s * 0.11, d * 0.13) * 0.06;
  switch (cls) {
    case 'under': col = [0.05, 0.05, 0.052]; break;
    case 'verge': {
      const sandy = kind === 'dune' ? 0.75 : 0.3;
      col = mix3([0.44, 0.41, 0.35], PAL.drySand, sandy * (0.5 + nj * 4));
      break;
    }
    case 'seabed': col = mix3(PAL.seaDeep, PAL.wetSand, clamp(1 + y * 0.12, 0, 1) * 0.5); wet = 1; break;
    case 'tiderock': { col = mix3(PAL.ironStain, [0.16, 0.17, 0.16], 0.55); wet = y < C.TIDE_BAND_HI ? 1 : 0.4; break; }
    case 'rock': case 'shelf': {
      const band = Math.floor(y / C.STRATA_BAND_H);
      const hard = p ? p.strata[((band % 40) + 40) % 40] : 0.5;
      col = scale3(mix3(PAL.cliffOchre, PAL.ironStain, 0.15 + 0.7 * hard), 0.52 + 0.55 * hard);
      if (cls === 'shelf') { col = mix3(col, PAL.wetSand, 0.4); wet = y < 1.8 ? 0.85 : 0.2; }
      if (y < C.TIDE_BAND_HI) wet = 1;
      break;
    }
    case 'scar': col = PAL.scarRaw; break;
    case 'debris': col = mix3(PAL.scarRaw, PAL.cliffOchre, 0.5); break;
    case 'beach': { const wetT = sm(1.35, 0.25, y); col = mix3(PAL.drySand, PAL.wetSand, wetT); wet = wetT; break; }
    case 'duneSand': col = mix3(PAL.drySand, PAL.marram, 0.22); break;
    case 'backdune': col = mix3(PAL.drySand, PAL.grassDry, 0.55); break;
    case 'heath': col = mix3(PAL.heath, PAL.grassDry, 0.4); break;
    case 'scrub': col = scale3(mix3(PAL.grassShelt, PAL.cliffOchre, 0.45 + nj * 3), 0.92); break;
    default: {
      const shelter = clamp(-d / 60, 0, 1) * 0.6;
      col = mix3(PAL.grassDry, PAL.grassShelt, shelter);
    }
  }
  out.y = y; out.slope = slope; out.cls = cls; out.wet = wet; out.exposure = exposure;
  out.r = clamp(col[0] + nj, 0, 1); out.g = clamp(col[1] + nj, 0, 1); out.b = clamp(col[2] + nj, 0, 1);
  return out;
}

/* ------------------------------------------------------- terrain chunk mesh */
const SEA_COLS = { low: 14, standard: 19, high: 24 };
const LAND_COLS = { low: 10, standard: 14, high: 17 };
const ROW_STEP = { low: 6.25, standard: 3.125, high: 2.5 };

function seaAnchorCurve(seg, s) {
  // increasing d anchor polyline from the berm out to the far cap, per kind
  const line = seg.line;
  const p = seg.kind === 'piece' ? seg.ref : null;
  const kind = p ? p.zones.kind : 'plain';
  if (kind === 'cliff') {
    const z = p.zones, N = p.noise;
    const ce = Math.max(11.5, z.ceNear + z.ceWander * N.at(s * 0.008, 1.3));
    const fw = z.faceW;
    return [8.4, 9.8, ce - 3.5, ce - 1, ce, ce + fw * 0.1, ce + fw * 0.22, ce + fw * 0.36, ce + fw * 0.52,
      ce + fw * 0.68, ce + fw * 0.84, ce + fw * 0.96, ce + fw + 1.2, ce + fw + 4, ce + fw + 10,
      ce + fw + z.platformW, ce + fw + z.platformW + 18, 190, 226, 260];
  }
  if (kind === 'dune') {
    const z = p.zones, N = p.noise;
    const dc = z.crestD0 + z.crestWander * N.at(s * 0.006, 3.7);
    return [8.4, 10, 13, dc - 7, dc - 2.5, dc, dc + 3, dc + 9, dc + 18,
      lerp(dc, z.beachEndD, 0.45), lerp(dc, z.beachEndD, 0.7), z.beachEndD - 8, z.beachEndD - 2,
      z.beachEndD + 5, z.beachEndD + 16, z.beachEndD + 40, 150, 200, 232, 260];
  }
  if (kind === 'slip') {
    const z = p.zones;
    return [8.4, 10, 13, 17, 22, 28, 34, z.bluffEndD, z.bluffEndD + 8, lerp(z.bluffEndD, z.shoreD, 0.4),
      lerp(z.bluffEndD, z.shoreD, 0.7), z.shoreD - 4, z.shoreD + 3, z.shoreD + 12, z.shoreD + 26,
      z.shoreD + 48, 170, 205, 234, 260];
  }
  if (kind === 'fog') {

    for (let i = 0; i < 8; i++) out[idx++] = ROAD_COLS[i];

    if (i1 > i0) out.push({ line: seg.line, i0, i1, lineName: 'spine' });

    for (let a = Math.ceil(arc0 / 12) * 12; a <= arc1; a += 12) {
      frameAt(line, a, fr);
      worldPos(seg.T, fr.x + fr.lx * 4.95, fr.z + fr.lz * 4.95, wpO);
      worldVec(seg.T, fr.tx, fr.tz, wtO);
      cats.push(composeMat(wpO[0], fr.y + 0.05, wpO[1], Math.atan2(wtO[0], wtO[1]), 0, 0, 1, 1, 1));
    }
    // culvert headwalls on the land side
    for (let a = Math.ceil(arc0 / 170) * 170; a <= arc1; a += 170) {
      frameAt(line, a, fr);
      worldPos(seg.T, fr.x - fr.lx * 9.9, fr.z - fr.lz * 9.9, wpO);
      worldVec(seg.T, fr.tx, fr.tz, wtO);
      culverts.push(composeMat(wpO[0], fr.y - 0.75, wpO[1], Math.atan2(wtO[0], wtO[1]), 0, 0, 1, 1, 1));
    }
  }
  yield;
  // fence line / gate / cattle grid (from formations, chunk-clipped)
  if (p) {
    for (const f of p.formations) {
      const ct = f.content;
      if (ct.type === 'fence') {
        for (let a = Math.ceil(Math.max(ct.s0, s0) / ct.postEvery) * ct.postEvery; a <= Math.min(ct.s1, s1); a += ct.postEvery) {
          frameAt(seg.line, a, fr);
          const gi = groundInfo(world, seg, a, ct.d, 0, 0, {});
          worldPos(seg.T, fr.x + fr.lx * ct.d, fr.z + fr.lz * ct.d, wpO);
          worldVec(seg.T, fr.tx, fr.tz, wtO);
          const h = hash01(seg.key, 'fence', a);
          fences.push(composeMat(wpO[0], gi.y - 0.08, wpO[1], Math.atan2(wtO[0], wtO[1]), (h - 0.5) * 0.16, 0, 1, 1, 1));
          if (a > ct.s0) {
            frameAt(seg.line, a - ct.postEvery, fr);
            const giP = groundInfo(world, seg, a - ct.postEvery, ct.d, 0, 0, {});
            const pp = worldPos(seg.T, fr.x + fr.lx * ct.d, fr.z + fr.lz * ct.d, [0, 0]);
            for (const wh of [0.55, 0.95]) {
              const len = Math.hypot(wpO[0] - pp[0], (gi.y - giP.y), wpO[1] - pp[1]);
              const yawC = Math.atan2(wpO[0] - pp[0], wpO[1] - pp[1]) - Math.PI / 2;
              const pitchC = -Math.asin((gi.y - giP.y) / (len || 1));
              wires.push(composeMat(pp[0], giP.y + wh, pp[1], yawC, 0, pitchC, len, 0.6, 0.6));
            }
          }
        }
      }
      if (ct.type === 'cattleGrid' && f.stationOffsetM >= s0 && f.stationOffsetM < s1) {
        frameAt(seg.line, f.stationOffsetM, fr);
        worldVec(seg.T, fr.tx, fr.tz, wtO);
        const yaw = Math.atan2(wtO[0], wtO[1]);
        for (let b = 0; b < 8; b++) {
          const a = f.stationOffsetM - 1.05 + b * 0.3;
          frameAt(seg.line, a, fr);
          worldPos(seg.T, fr.x, fr.z, wpO);
          gridBars.push(composeMat(wpO[0], fr.y + 0.065, wpO[1], yaw, 0, 0, 1, 1, 1));
        }
      }
    }
  }
  const g = new THREE.Group();
  g.matrixAutoUpdate = false;
  if (posts.length) g.add(instMesh(GEOS.post, MATS.timber, posts, true));
  if (cables.length) g.add(instMesh(GEOS.cable, MATS.cable, cables, false));
  if (barriers.length) g.add(instMesh(GEOS.barrier, MATS.concrete, barriers, true));
  if (cats.length) g.add(instMesh(GEOS.catseye, MATS.catseye, cats, false));
  if (culverts.length) g.add(instMesh(GEOS.culvert, MATS.concrete, culverts, false));
  if (fences.length) g.add(instMesh(GEOS.fencePost, MATS.timber, fences, false));
  if (wires.length) g.add(instMesh(GEOS.cable, MATS.cable, wires, false));
  if (gridBars.length) g.add(instMesh(GEOS.gridBar, MATS.steel, gridBars, false));
  into.furniture = g;
  into.counts.furniture = posts.length + barriers.length + cats.length + culverts.length + fences.length + gridBars.length;
  yield;
}
/* ============================================================================
 * FORMATIONS — stacks in varied collapse states, the arch, skerries, the
 * headland depth ladder (shape + albedo, not haze), lighthouse point, the
 * landslip's ruined road, and the fork nose. Piece-level persistent objects.
 * ========================================================================== */

function stratColor(p, y, guano, guanoAmt) {
  const band = Math.floor(y / C.STRATA_BAND_H);
  const hard = p.strata[((band % 40) + 40) % 40];
  let c = scale3(mix3(PAL.cliffOchre, PAL.ironStain, 0.15 + 0.7 * hard), 0.40 + 0.5 * hard);
  if (y < C.TIDE_BAND_HI) c = mix3(c, [0.13, 0.14, 0.14], 0.72);
  else if (y < C.TIDE_BAND_HI + 1.2) c = mix3(c, [0.2, 0.2, 0.2], 0.3);
  if (guano && guanoAmt > 0) c = mix3(c, [0.82, 0.82, 0.78], guanoAmt);
  return c;
}

/* Displaced, strata-banded rock column. type: stack | pillar | stump | skerry */
function makeRockMass(p, seedKey, type, r, h, baseY) {
  const radial = 14, bands = Math.max(3, Math.ceil((h + 3) / 1.1));
  const pos = [], col = [], idx = [];
  const n = makeNoise2D(makeStream(p.seed, p.setPieceId, 'geology-' + seedKey));
  for (let b = 0; b <= bands; b++) {
    const t = b / bands;
    const y = baseY - 3 + (h + 3) * t;
    let taper = type === 'stump' ? 1 - t * 0.45 : (type === 'pillar' ? 0.62 - t * 0.18 : 1 - Math.pow(t, 1.6) * 0.55);
    if (type === 'skerry') taper = Math.sqrt(Math.max(0.02, 1 - t * t));
    const band = Math.floor(y / C.STRATA_BAND_H);
    const hard = p.strata[((band % 40) + 40) % 40];
    let rb = r * taper * (0.82 + 0.42 * hard);
    if (y > C.TIDE_BAND_LO - 0.3 && y < C.TIDE_BAND_HI + 0.2) rb *= 0.82;  // wave notch
    for (let a = 0; a <= radial; a++) {
      const ang = a / radial * TAU;
      const rr = rb * (1 + 0.24 * n.at(Math.cos(ang) * 1.7 + 5, y * 0.35));
      pos.push(Math.cos(ang) * rr, y, Math.sin(ang) * rr);
      const guanoAmt = type !== 'skerry' && y > baseY + h * 0.55 ? sm(0.55, 0.95, t) * 0.65 * Math.max(0, n.at(ang * 2, 9)) : 0;
      const c = stratColor(p, y, true, guanoAmt);
      col.push(c[0], c[1], c[2]);
    }
  }
  for (let b = 0; b < bands; b++) {
    for (let a = 0; a < radial; a++) {
      const i0 = b * (radial + 1) + a, i1 = i0 + 1, i2 = i0 + radial + 1, i3 = i2 + 1;
      idx.push(i0, i2, i1, i1, i2, i3);
    }
  }
  // cap
  const capC = stratColor(p, baseY + h, true, type === 'stump' ? 0 : 0.4);
  const capIdx = pos.length / 3;
  pos.push(0, baseY - 3 + (h + 3), 0); col.push(capC[0], capC[1], capC[2]);
  for (let a = 0; a < radial; a++) idx.push(bands * (radial + 1) + a, bands * (radial + 1) + a + 1, capIdx);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

function makeArch(p, seedKey, r, h, baseY) {
  const g1 = makeRockMass(p, seedKey + 'a', 'stack', r * 0.8, h, baseY);
  const g2 = makeRockMass(p, seedKey + 'b', 'stack', r * 0.72, h * 0.92, baseY);
  g2.translate(r * 2.6, 0, 0);
  // lintel: half-torus span between the pillars
  const lint = new THREE.TorusGeometry(r * 1.3, r * 0.34, 7, 14, Math.PI);
  lint.translate(r * 1.3, 0, 0);
  const posA = lint.getAttribute('position');
  const colA = new Float32Array(posA.count * 3);
  for (let i = 0; i < posA.count; i++) {
    const y = posA.getY(i) + baseY + h * 0.66;
    posA.setY(i, y);
    const c = stratColor(p, y, true, y > baseY + h * 0.6 ? 0.3 : 0);
    colA[i * 3] = c[0]; colA[i * 3 + 1] = c[1]; colA[i * 3 + 2] = c[2];
  }
  lint.setAttribute('color', new THREE.BufferAttribute(colA, 3));
  lint.computeVertexNormals();
  const group = new THREE.Group();
  for (const gg of [g1, g2, lint]) {
    const m = new THREE.Mesh(gg, MATS.rock);
    m.castShadow = true; m.receiveShadow = true;
    group.add(m);
  }
  return group;
}

/* Headland ladder: silhouette + albedo do the separating; haze only helps. */
function makeHeadland(p, item, li) {
  const L = item;
  const segs = 26;
  const pos = [], col = [], idx = [];
  const n = makeNoise2D(makeStream(p.seed, p.setPieceId, `headland-${li}`));
  const albedo = scale3([
    mix3(PAL.grassShelt, PAL.ironStain, 0.45),   // 0: dark scrub over wet base
    mix3(PAL.grassDry, PAL.cliffOchre, 0.45),    // 1: mid mixed slope
    mix3(PAL.drySand, PAL.cliffOchre, 0.35),     // 2: pale scarp
    mix3(PAL.hazePearl, PAL.drySand, 0.45),      // 3: palest, near sky
  ][Math.min(3, L.albedoClass)], [0.50, 0.68, 0.85, 1.0][Math.min(3, L.albedoClass)]);
  for (let i = 0; i <= segs; i++) {
    const t = i / segs;
    const along = (t - 0.5 - L.skew * 0.3) * L.w;
    const prof = Math.pow(Math.sin(Math.PI * clamp(t + L.skew * (t - 0.5), 0.001, 0.999)), 0.85);
    const hh = L.h * prof * (1 + 0.3 * n.at(t * 5, 1));
    const wide = L.w * 0.17 * (0.4 + prof);
    for (const [side, yy] of [[-wide, -3], [0, hh], [wide, -3]]) {
      pos.push(along, yy, side);
      const shade = yy > 0 ? 1 : 0.82;
      col.push(albedo[0] * shade, albedo[1] * shade, albedo[2] * shade);
    }
  }
  for (let i = 0; i < segs; i++) {
    const a = i * 3;
    idx.push(a, a + 3, a + 1, a + 1, a + 3, a + 4, a + 1, a + 4, a + 2, a + 2, a + 4, a + 5);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, MATS.headland);
  m.matrixAutoUpdate = false;
  return m;
}

function signBoardTexture(leftLabel, rightLabel) {
  const cv = document.createElement('canvas');
  cv.width = 256; cv.height = 64;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#e8e4d8'; ctx.fillRect(0, 0, 256, 64);
  ctx.strokeStyle = '#3a3a38'; ctx.lineWidth = 4; ctx.strokeRect(2, 2, 252, 60);
  ctx.fillStyle = '#2c2c2a'; ctx.font = 'bold 20px system-ui';
  ctx.textAlign = 'left'; ctx.fillText('◀ ' + leftLabel, 12, 40);
  ctx.textAlign = 'right'; ctx.fillText(rightLabel + ' ▶', 244, 40);
  const tx = new THREE.CanvasTexture(cv);
  tx.colorSpace = THREE.SRGBColorSpace;
  return tx;
}

function buildPieceFormations(world, seg) {
  const p = seg.ref;
  const group = new THREE.Group();
  group.matrixAutoUpdate = false;
  const fr = {}, wpO = [0, 0], wlO = [0, 0];
  const place = (s, d, obj, sink) => {
    frameAt(seg.line, s, fr);
    worldPos(seg.T, fr.x + fr.lx * d, fr.z + fr.lz * d, wpO);
    const gi = groundInfo(world, seg, s, d, wpO[0], wpO[1], {});
    obj.position.set(wpO[0], gi.y - (sink || 0), wpO[1]);
    obj.updateMatrix ? (obj.matrixAutoUpdate = false, obj.updateMatrix()) : 0;
    group.add(obj);
    return gi;
  };
  for (const item of p.formations) {
    const ct = item.content, s = item.stationOffsetM;
    switch (ct.type) {
      case 'skerry': {
        const g = makeRockMass(p, item.sourceId, 'skerry', ct.r, ct.h, 0);
        const m = new THREE.Mesh(g, MATS.rock);
        m.castShadow = true; m.receiveShadow = true;
        frameAt(seg.line, s, fr);
        worldPos(seg.T, fr.x + fr.lx * ct.d, fr.z + fr.lz * ct.d, wpO);
        m.position.set(wpO[0], 0, wpO[1]);
        m.matrixAutoUpdate = false; m.updateMatrix();
        group.add(m);
        break;
      }
      case 'stack': case 'pillar': case 'stump': case 'arch': {
        frameAt(seg.line, s, fr);
        worldPos(seg.T, fr.x + fr.lx * ct.d, fr.z + fr.lz * ct.d, wpO);
        const baseY = clamp(groundY(world, seg, s, ct.d, wpO[0], wpO[1]), -2.0, 1.2);
        let obj;
        if (ct.type === 'arch') obj = makeArch(p, item.sourceId, ct.r, ct.h, 0);
        else {
          obj = new THREE.Mesh(makeRockMass(p, item.sourceId, ct.type, ct.r, ct.h, 0), MATS.rock);
          obj.castShadow = true; obj.receiveShadow = true;
        }
        obj.position.set(wpO[0], baseY, wpO[1]);
        obj.rotation.y = hash01(item.sourceId, 'rot', 1) * TAU;
        obj.matrixAutoUpdate = false; obj.updateMatrix();
        obj.traverse(o => { if (o.isMesh) { o.matrixAutoUpdate = false; } });
        group.add(obj);
        break;
      }
      case 'ladder': {
        frameAt(seg.line, Math.min(s, seg.line.length - 2), fr);
        worldPos(seg.T, fr.x, fr.z, wpO);
        const wt = worldVec(seg.T, fr.tx, fr.tz, [0, 0]);
        for (let i = 0; i < ct.items.length; i++) {
          const L = ct.items[i];
          const b = L.bearingDeg * DEG;
          // rotate tangent toward seaward (left) by bearing:
          const wl2 = worldVec(seg.T, fr.lx, fr.lz, [0, 0]);
          const dx = wt[0] * Math.cos(b) + wl2[0] * Math.sin(b);
          const dz = wt[1] * Math.cos(b) + wl2[1] * Math.sin(b);
          const hm = makeHeadland(p, L, i);
          hm.position.set(wpO[0] + dx * L.dist, 0, wpO[1] + dz * L.dist);
          hm.rotation.y = Math.atan2(dx, dz) + Math.PI / 2 + L.skew * 0.4;
          hm.updateMatrix();
          group.add(hm);
        }
        break;
      }
      case 'blowhole': {
        const ring = new THREE.Mesh(new THREE.TorusGeometry(1.4, 0.5, 8, 14), MATS.rockDark);
        ring.rotation.x = Math.PI / 2;
        const gi = place(s, ct.d, ring, 0.25);
        ring.userData.fireY = gi.y;
        p.blowholeWorld = { x: ring.position.x, y: gi.y, z: ring.position.z, schedule: ct.schedule };
        break;
      }
      case 'ruinSlab': {
        const slab = new THREE.Mesh(GEOS.slab, MATS.ruinSlab);
        slab.castShadow = true; slab.receiveShadow = true;
        frameAt(seg.line, s, fr);
        worldPos(seg.T, fr.x + fr.lx * ct.d, fr.z + fr.lz * ct.d, wpO);
        const gy = groundY(world, seg, s, ct.d, wpO[0], wpO[1]);
        // half-buried in the debris: pitch follows the local slope
        const gyOut = groundY(world, seg, s, ct.d + 3, wpO[0], wpO[1]);
        const gyFwd = groundY(world, seg, s + 3, ct.d, wpO[0], wpO[1]);
        slab.position.set(wpO[0], gy - 0.22, wpO[1]);
        slab.scale.set(ct.L / 3.4, 1, 1);
        slab.rotation.set(Math.atan2(gyFwd - gy, 3) + ct.tilt * 0.25, ct.yaw, Math.atan2(gyOut - gy, 3) + ct.tilt * 0.2, 'YXZ');
        slab.matrixAutoUpdate = false; slab.updateMatrix();
        group.add(slab);
        break;
      }
      case 'forkNose': {
        const board = new THREE.Mesh(new THREE.PlaneGeometry(2.1, 0.55), MATS.signBoard);
        board.castShadow = true;
        frameAt(seg.line, s, fr);
        worldPos(seg.T, fr.x, fr.z, wpO);
        const wt2 = worldVec(seg.T, fr.tx, fr.tz, [0, 0]);
        const gyN = groundY(world, seg, s, 0, wpO[0], wpO[1]);
        board.position.set(wpO[0], gyN + C.ROAD_BURY + 1.65, wpO[1]);
        board.rotation.y = Math.atan2(wt2[0], wt2[1]) + Math.PI;
        group.add(board);
        for (const px of [-1.0, 1.0]) {
          const post = new THREE.Mesh(GEOS.post, MATS.timber);
          post.position.set(wpO[0] + px * 0.9, gyN + C.ROAD_BURY, wpO[1]);
          post.scale.y = 1.55;
          post.castShadow = true;
          group.add(post);
        }
        // marker stone + old winch post on the wedge between the arms
        const stone = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.95, 0.34), MATS.concrete);
        stone.castShadow = true;
        place(s + 46, 0, stone, 0.18);
        const winch = new THREE.Mesh(GEOS.post, MATS.timber);
        winch.scale.set(1.6, 2.1, 1.6);
        winch.rotation.z = 0.24;
        place(s + 58, -4, winch, 0.2);
        break;
      }
      case 'abutment': {
        for (const off of [0, 4.5]) {
          const b = new THREE.Mesh(new THREE.BoxGeometry(2.4, 3.2, 1.4), MATS.concreteOld);
          b.castShadow = true;
          place(s + off, ct.d, b, 1.3);
        }
        break;
      }
      case 'lighthouse': {
        frameAt(seg.line, s, fr);
        worldPos(seg.T, fr.x + fr.lx * ct.d, fr.z + fr.lz * ct.d, wpO);
        const baseYL = groundY(world, seg, s, ct.d, wpO[0], wpO[1]);
        const lh = new THREE.Group();
        const tower = new THREE.Mesh(new THREE.CylinderGeometry(1.75, 2.3, ct.towerH, 14), MATS.lightTower);
        tower.position.y = ct.towerH / 2;
        tower.castShadow = true;
        const gallery = new THREE.Mesh(new THREE.CylinderGeometry(2.35, 2.35, 0.42, 14), MATS.rockDark);
        gallery.position.y = ct.towerH + 0.2;
        const lamp = new THREE.Mesh(new THREE.CylinderGeometry(1.25, 1.25, 1.5, 12), MATS.lampGlass);
        lamp.position.y = ct.towerH + 1.15;
        const roof = new THREE.Mesh(new THREE.ConeGeometry(1.5, 1.1, 12), MATS.rockDark);
        roof.position.y = ct.towerH + 2.35;
        lh.add(tower, gallery, lamp, roof);
        // the working light: two opposed beams + a glow sprite, rotated per-frame
        const beamGeo = new THREE.CylinderGeometry(0.24, 3.4, 90, 10, 1, true);
        beamGeo.rotateZ(Math.PI / 2); beamGeo.translate(45, 0, 0);
        const beams = new THREE.Group();
        for (const rot of [0, Math.PI]) {
          const bm = new THREE.Mesh(beamGeo, MATS.beam);
          bm.rotation.y = rot;
          beams.add(bm);
        }
        beams.position.y = ct.towerH + 1.15;
        lh.add(beams);
        const glow = new THREE.Sprite(MATS.lampGlow);
        glow.scale.set(7, 7, 1);
        glow.position.y = ct.towerH + 1.15;
        lh.add(glow);
        lh.position.set(wpO[0], baseYL - 0.25, wpO[1]);
        group.add(lh);
        p.lighthouseWorld = { x: wpO[0], y: baseYL + ct.towerH + 0.9, z: wpO[1], period: ct.period,
          foghornEvery: ct.foghornEvery, beams, glowMat: MATS.lampGlow };
        break;
      }
      case 'cottage': {
        frameAt(seg.line, s, fr);
        worldPos(seg.T, fr.x + fr.lx * ct.d, fr.z + fr.lz * ct.d, wpO);
        const gyC = groundY(world, seg, s, ct.d, wpO[0], wpO[1]);
        const cot = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(6.2, 2.9, 4.4), MATS.lightTower);
        body.position.y = 1.45; body.castShadow = true;
        const roofG = new THREE.CylinderGeometry(0.02, 3.3, 2.0, 4, 1);
        const roofM = new THREE.Mesh(roofG, MATS.rockDark);
        roofM.rotation.y = Math.PI / 4;
        roofM.scale.set(1.05, 1, 0.78);
        roofM.position.y = 3.85;
        const chim = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.4, 0.6), MATS.concreteOld);
        chim.position.set(1.8, 4.0, 0);
        cot.add(body, roofM, chim);
        cot.position.set(wpO[0], gyC - 0.15, wpO[1]);
        cot.rotation.y = hash01(item.sourceId, 'rot', 2) * 0.6;
        group.add(cot);
        break;
      }
      case 'wall': {
        for (let d = ct.d0; d < ct.d1; d += 1.9) {
          const w = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.85, 1.85), MATS.concreteOld);
          w.castShadow = true;
          frameAt(seg.line, ct.atS, fr);
          worldPos(seg.T, fr.x + fr.lx * d, fr.z + fr.lz * d, wpO);
          const gyW = groundY(world, seg, ct.atS, d, wpO[0], wpO[1]);
          w.position.set(wpO[0], gyW + 0.28, wpO[1]);
          w.rotation.y = Math.atan2(worldVec(seg.T, fr.lx, fr.lz, [0, 0])[0], worldVec(seg.T, fr.lx, fr.lz, [0, 0])[1]) + Math.PI / 2 + (hash01(item.sourceId, 'w', d) - 0.5) * 0.14;
          group.add(w);
        }
        break;
      }
      case 'fieldWall': {
        for (let ss = ct.s0; ss < ct.s1; ss += 1.9) {
          if ((ss - ct.s0) % ct.gapEvery < 4.2) continue;
          const w = new THREE.Mesh(new THREE.BoxGeometry(1.85, 0.8, 0.45), MATS.concreteOld);
          frameAt(seg.line, ss, fr);
          worldPos(seg.T, fr.x + fr.lx * ct.d, fr.z + fr.lz * ct.d, wpO);
          const gyW = groundY(world, seg, ss, ct.d, wpO[0], wpO[1]);
          const wt3 = worldVec(seg.T, fr.tx, fr.tz, [0, 0]);
          w.position.set(wpO[0], gyW + 0.26, wpO[1]);
          w.rotation.y = Math.atan2(wt3[0], wt3[1]) + (hash01(item.sourceId, 'fw', ss) - 0.5) * 0.1;
          group.add(w);
        }
        break;

          post.position.set(0, 0, off);

        }

/* ============================================================================
 * ECOLOGY — habitat-distributed instancing. Same candidate sequence at every
 * quality tier; tiers realize a prefix. Every instance is seated by the same

const ECO_QUALITY_MULT = { low: 0.45, standard: 1.0, high: 1.35 };

function initEcoGeos() {
  // grass clump: three crossed blades, wide base pinching to a point
  const gp = [], gi = [];
  for (let i = 0; i < 3; i++) {
    const a = i * Math.PI / 3;
    const c = Math.cos(a) * 0.5, s = Math.sin(a) * 0.5;
    const b = gp.length / 3;
    gp.push(-c, 0, -s, c, 0, s, -c * 0.07, 1, -s * 0.07, c * 0.07, 1, s * 0.07);
    gi.push(b, b + 1, b + 2, b + 1, b + 3, b + 2);
  }
  GEOS.grass = new THREE.BufferGeometry();
  GEOS.grass.setAttribute('position', new THREE.Float32BufferAttribute(gp, 3));
  GEOS.grass.setIndex(gi);
  GEOS.grass.computeVertexNormals();
  GEOS.shrub = new THREE.IcosahedronGeometry(0.5, 1);
  GEOS.shrub.scale(1, 0.55, 1); GEOS.shrub.translate(0, 0.24, 0);
  GEOS.rockS = new THREE.DodecahedronGeometry(0.5, 0);
  GEOS.rockS.scale(1, 0.72, 1);
  GEOS.drift = new THREE.CylinderGeometry(0.09, 0.14, 1, 6);
  GEOS.drift.rotateZ(Math.PI / 2);
  GEOS.wrack = new THREE.CircleGeometry(0.5, 7);
  GEOS.wrack.rotateX(-Math.PI / 2);
  GEOS.mussel = new THREE.CircleGeometry(0.5, 8);
  GEOS.mussel.rotateX(-Math.PI / 2);
  GEOS.shell = new THREE.TetrahedronGeometry(0.09, 0);
  GEOS.crab = new THREE.IcosahedronGeometry(0.11, 0);
  GEOS.crab.scale(1.3, 0.5, 1);
  GEOS.anemone = new THREE.CircleGeometry(0.12, 9);
  GEOS.anemone.rotateX(-Math.PI / 2);
  const kp = [], ki = [];
  for (let i = 0; i < 2; i++) {
    const a = i * Math.PI / 2, c = Math.cos(a) * 0.35, s = Math.sin(a) * 0.35;
    const b = kp.length / 3;
    kp.push(-c, 0, -s, c, 0, s, -c, 1.4, -s, c, 1.4, s);
    ki.push(b, b + 1, b + 2, b + 1, b + 3, b + 2);
  }
  GEOS.kelp = new THREE.BufferGeometry();
  GEOS.kelp.setAttribute('position', new THREE.Float32BufferAttribute(kp, 3));
  GEOS.kelp.setIndex(ki);
  GEOS.kelp.computeVertexNormals();
  // perched gull: body + head + tail, ~40 tris
  const gull = new THREE.Group();
  const body = new THREE.SphereGeometry(0.16, 7, 5); body.scale(1, 0.8, 1.5);
  const head = new THREE.SphereGeometry(0.08, 6, 5); head.translate(0, 0.12, 0.2);
  GEOS.gullPerch = mergeGeos([body, head]);
  // trees
  GEOS.trunk = new THREE.CylinderGeometry(0.09, 0.16, 1, 6);
  GEOS.trunk.translate(0, 0.5, 0);
  GEOS.canopy = new THREE.IcosahedronGeometry(0.5, 1);
}
function mergeGeos(list) {
  let pos = [], idx = [], base = 0;
  for (const g of list) {
    const p = g.getAttribute('position');
    for (let i = 0; i < p.count; i++) pos.push(p.getX(i), p.getY(i), p.getZ(i));
    const ix = g.getIndex();
    if (ix) for (let i = 0; i < ix.count; i++) idx.push(ix.getX(i) + base);
    else for (let i = 0; i < p.count; i++) idx.push(i + base);
    base += p.count;
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  out.setIndex(idx);
  out.computeVertexNormals();
  return out;
}

/* Instanced mesh with per-instance tint + sway phase for the foliage shader. */
function instMeshTinted(geo, mat, list, shadow) {
  const m = new THREE.InstancedMesh(geo, mat, list.length);
  const M = new THREE.Matrix4();
  const phase = new Float32Array(list.length);
  const sway = new Float32Array(list.length);
  const colArr = new Float32Array(list.length * 3);
  for (let i = 0; i < list.length; i++) {
    M.fromArray(list[i].m); m.setMatrixAt(i, M);
    phase[i] = list[i].phase || 0;
    sway[i] = list[i].sway || 0;
    colArr[i * 3] = list[i].tint[0]; colArr[i * 3 + 1] = list[i].tint[1]; colArr[i * 3 + 2] = list[i].tint[2];
  }
  m.geometry = geo.clone();
  m.geometry.setAttribute('aPhase', new THREE.InstancedBufferAttribute(phase, 1));
  m.geometry.setAttribute('aSway', new THREE.InstancedBufferAttribute(sway, 1));
  m.geometry.setAttribute('aTint', new THREE.InstancedBufferAttribute(colArr, 3));
  m.instanceMatrix.needsUpdate = true;
  m.castShadow = !!shadow;
  m.receiveShadow = true;
  m.matrixAutoUpdate = false;
  return m;
}

function insideGrove(p, type, s, d) {
  for (const g of p.groves) {
    const ct = g.content;
    if (ct.type !== type) continue;
    if (type === 'lupin' || type === 'kelp') {
      const dd = d - ct.d, ds = s - g.stationOffsetM;
      if (dd * dd + ds * ds < ct.r * ct.r) return true;
    } else if (type === 'thrift' || type === 'iceplant' || type === 'heath') {
      if (s >= ct.s0 && s <= ct.s1) return true;
    }
  }
  return false;
}

function* ecologyChunkSteps(world, seg, ci, quality, into) {
  const s0 = ci * C.CHUNK_LEN, s1 = Math.min(s0 + C.CHUNK_LEN, seg.line.length);
  const p = seg.kind === 'piece' ? seg.ref : null;
  const mult = ECO_QUALITY_MULT[quality];

    kelp: [], kelpPad: [], crab: [], shell: [], anemone: [], gullPerch: [], tree: [] };
  const counts = { grass: 0, elements: 0, organisms: 0 };
  const key = seg.key + ':' + ci;

  for (let i = 0; i < nG; i++) {

    const seaSide = H('g', i, 1) < 0.62;
    const dBias = dune ? Math.pow(H('g', i, 2), 1.5) * 90 + H('g', i, 7) * 30 : H('g', i, 2) * 120;

    const isGrassy = g2.cls === 'grass' || g2.cls === 'heath' || g2.cls === 'backdune' || g2.cls === 'scrub';

    const tint = marram ? mix3([0.17, 0.18, 0.085], [0.27, 0.26, 0.13], H('g', i, 4) * 0.7 + exp * 0.2)

    tree.add(trunk);

    for (let b = 0; b < nBlob; b++) {

      const bh = t.h * (0.55 + b * 0.18);

      blob.position.set(Math.sin(t.lean) * bh * 1.15 + (hash01('tb', t.s, b) - 0.5) * 0.8, bh, (hash01('tb2', t.s, b) - 0.5) * 1.2);

      blob.scale.set(bs * 1.5, bs * (t.type === 'cypress' ? 0.75 : 0.55), bs);
      blob.castShadow = true;
      tree.add(blob);
    }
    // lean direction: downwind = landward = local -d direction in world
    const wl2 = worldVec(seg.T, fr.lx, fr.lz, [0, 0]);
    tree.rotation.y = Math.atan2(-wl2[0], -wl2[1]) + Math.PI / 2;
    tree.position.set(wpO[0], gy - 0.12, wpO[1]);

  into.counts.elements = counts.elements;
  into.counts.organisms = counts.organisms;
