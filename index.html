<!DOCTYPE html>
<html lang="en">
<head>

    color:#F2E3BC; text-shadow:0 1px 3px rgba(22,52,44,0.6);
    font:14px system-ui, sans-serif; letter-spacing:0.02em; opacity:0.9; z-index:9;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
  }

<body>
<div id="hint">W/S ride &middot; A/D steer &amp; choose &middot; drag to look &middot; Space pause &middot; R restart</div>
<script type="module">
import * as THREE from 'three';
// ============================================================
// SUMMERGLASS HOLLOW
// A seeded bicycle passage through one remembered summer afternoon.
// Two stages: the PLAN freezes the world's identity from the seed;
// the REALIZATION spends geometry on it at the chosen quality.
// The hills are the argument: they hide, reveal, compress and release.
// ============================================================

const capturedErrors=[];
window.addEventListener('error',(e)=>{ capturedErrors.push(String(e.message||e)); });
window.addEventListener('unhandledrejection',(e)=>{ capturedErrors.push('rejection: '+String((e.reason&&e.reason.message)||e.reason)); });

// ---------- seed + quality ----------
const qs=new URLSearchParams(location.search);
const SEED_TEXT=(qs.get('seed')&&qs.get('seed').length)?qs.get('seed'):'SUMMERGLASS-8421';
// the tier is not read until the plan is frozen; QUALITY_READS records when it
// first was, and the plan stage records the count it saw
let QUALITY_READS=0, QUALITY_READS_AT_PLAN=-1;
const QUALITY=(()=>{ const q=(qs.get('quality')||'standard').toLowerCase();
  return (q==='low'||q==='high')?q:'standard'; })();
const readQuality=()=>{ QUALITY_READS++; return QUALITY; };

function xmur3(str){ let h=1779033703^str.length;
  for(let i=0;i<str.length;i++){ h=Math.imul(h^str.charCodeAt(i),3432918353); h=(h<<13)|(h>>>19); }
  return ()=>{ h=Math.imul(h^(h>>>16),2246822507); h=Math.imul(h^(h>>>13),3266489909); return (h^=h>>>16)>>>0; };
}
const SEED_HASH=xmur3(SEED_TEXT)();
function mb32(a){ return ()=>{ a|=0; a=(a+0x6D2B79F5)|0;
  let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
function streamFrom(f){
  return {
    f, r:(a,b)=>a+(b-a)*f(), i:(a,b)=>Math.floor(a+(b-a+1)*f()),
    chance:(p)=>f()<p, pick:(arr)=>arr[Math.floor(f()*arr.length)],
    gauss:()=>{ let s=0; for(let k=0;k<4;k++) s+=f(); return (s-2)*0.72; },
  };
}
// named, independent streams — a change in one can never perturb another
function makeStream(name){ return streamFrom(mb32(xmur3(SEED_TEXT+'::'+name)())); }
// positional sub-stream: identity depends on (seed, name, ids) only, never on
// realization order — so an object is the same object every time it re-enters residency
function subStream(name,...ids){ return streamFrom(mb32(xmur3(SEED_TEXT+'::'+name+'#'+ids.join(','))())); }

const ROUTE=makeStream('plan/route'), ELEV=makeStream('plan/elevation'), FORKS=makeStream('plan/fork'),
      LANDF=makeStream('plan/landform'), WATER=makeStream('plan/water'), HERO=makeStream('plan/hero'),
      GROVE=makeStream('plan/groves'), ECO=makeStream('plan/ecology'), LAND=makeStream('plan/landmarks'),
      LIFE=makeStream('plan/life'), SND=makeStream('plan/sound'), WX=makeStream('plan/weather'),
      CLOUD=makeStream('plan/clouds');

// ---------- hashes ----------
function fnv(){ let h=0x811C9DC5; return {
  feed(...vals){ for(const v of vals){ const s=(typeof v==='number')?(Math.abs(v)<1e-7?'0.0000':v.toFixed(4)):String(v);
    for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,0x01000193); } } },
  hex(){ return (h>>>0).toString(16).padStart(8,'0'); } }; }
const H={ route:fnv(), elev:fnv(), terrain:fnv(), eco:fnv(), life:fnv(), weather:fnv(), plan:fnv(), real:fnv() };

// ---------- palette: eight colours, one summer ----------
const PAL={
  sky:0x5EC2E8,            // clear summer sky blue
  cloud:0xFFFBEF,          // warm cloud white
  sunGrass:0xC3E56A,       // pale sunlit grass
  meadow:0x74B851,         // medium summer green
  leafShade:0x3C7A55,      // cool blue-green canopy shadow
  woodDeep:0x1B4239,       // deep woodland teal
  bark:0x6B4A34,           // warm umber bark and soil
  road:0xE9DCB4,           // pale warm road stone
  blossom:0xEBAFB9,        // small blossom / seedhead accent
};
// One eye height for the whole world: the riding camera, the sight lines the
// plan uses to decide what is visible from the road, and the validator that
// checks the camera never ends up inside the terrain.
const EYE_H=1.86, PITCH_BIAS=0.052;
const col=(h)=>new THREE.Color(h);
const mixc=(a,b,t)=>col(a).lerp(col(b),t);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,v)=>{ const t=clamp((v-a)/(b-a||1e-6),0,1); return t*t*(3-2*t); };
const TAU=Math.PI*2;
const lumOf=(c)=>0.2126*c.r+0.7152*c.g+0.0722*c.b;

// ---------- frozen value noise ----------
function noiseTable(stream){ const T=new Float32Array(1024); for(let i=0;i<1024;i++) T[i]=stream.f(); return T; }
function makeNoise2(T){
  const hash=(x,y)=>{ let n=(x*374761393+y*668265263)|0; n=(n^(n>>>13))|0; n=Math.imul(n,1274126177); return T[((n^(n>>>16))>>>0)&1023]; };
  return (x,y)=>{
    const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
    const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
    return lerp(lerp(hash(xi,yi),hash(xi+1,yi),u),lerp(hash(xi,yi+1),hash(xi+1,yi+1),u),v);
  };
}
const nLand=makeNoise2(noiseTable(LANDF)), nEco=makeNoise2(noiseTable(ECO));
function fbmL(x,y){ return nLand(x,y)*0.53+nLand(x*2.07+7.7,y*2.07+3.1)*0.29+nLand(x*4.31+17.9,y*4.31+11.3)*0.18; }
function fbmE(x,y){ return nEco(x,y)*0.62+nEco(x*2.51+5.1,y*2.51+9.7)*0.38; }
// ============================================================
// PLAN — CHAPTERS
// Eight chapters, laid out on the clock of a ~11 minute ride at cruise,
// then jittered structurally by seed.
// ============================================================
const CRUISE=9.5;
const L_TOTAL=ROUTE.r(6180,6560);
const TAIL=430;                                   // the road runs on past the rest
const CH=[
  {key:'gate',      name:'The Dappled Gate',     end:0.111},
  {key:'sunbank',   name:'Sunbank',              end:0.215},
  {key:'fernfold',  name:'Fernfold',             end:0.333},
  {key:'fork',      name:'The Mosswater Choice', end:0.417},
  {key:'joining',   name:'Joining Woods',        end:0.611},
  {key:'glasswater',name:'Glasswater Shelf',     end:0.722},
  {key:'cloudstep', name:'Cloudstep Rise',       end:0.861},
  {key:'bellroot',  name:'Bellroot Exhale',      end:1.0},
];
for(let i=0;i<CH.length-1;i++){
  CH[i].end=clamp(CH[i].end+ROUTE.r(-0.012,0.012),(i?CH[i-1].end:0)+0.055,0.97);
}
const CHS={}; for(const c of CH) CHS[c.key]=c.end*L_TOTAL;
function chapEndPre(k){ const i=CH.findIndex(c=>c.key===k); return i>0?CH[i-1].end*L_TOTAL:0; }
const chapEnd=(k)=>CHS[k];
const chapStart=(k)=>{ const i=CH.findIndex(c=>c.key===k); return i? CH[i-1].end*L_TOTAL : 0; };
function chapterOf(s){ const f=clamp(s,0,L_TOTAL)/L_TOTAL;
  for(const c of CH) if(f<=c.end) return c.name; return CH[CH.length-1].name; }
function chapterKeyOf(s){ const f=clamp(s,0,L_TOTAL)/L_TOTAL;
  for(const c of CH) if(f<=c.end) return c.key; return 'bellroot'; }
H.route.feed(L_TOTAL); for(const c of CH) H.route.feed(c.end);

// ============================================================
// PLAN — CENTRELINE
// Curvature is a smooth seeded sum of long sinusoids, so the road is
// tangent- and curvature-continuous by construction: no kinks, ever.
// ============================================================
const MIN_RADIUS=158;
const SDS=2;                                        // plan sample step, metres
const NS=Math.ceil((L_TOTAL+TAIL)/SDS)+1;
const CURVE=[];
{
  let amp=0;
  // one long sweeping bow, so two chapters far apart on the road can end up
  // near each other in the country, then four shorter ones for flow
  CURVE.push({wl:ROUTE.r(2100,3200),a:2.1,ph:ROUTE.r(0,TAU)}); amp+=2.1;
  for(let i=0;i<4;i++){
    const wl=ROUTE.r(255,1050), a=ROUTE.r(0.30,0.85);
    CURVE.push({wl,a,ph:ROUTE.r(0,TAU)});
    amp+=a;
  }
  const k=1/MIN_RADIUS/amp;
  for(const c of CURVE){ c.a*=k; H.route.feed(c.wl,c.a,c.ph); }
}
// the opening is composed, not sampled: the road bends away inside the first
// two hundred metres so the rider is promised somewhere rather than shown it
const OPEN_BOW=(ROUTE.chance(0.5)?1:-1)/ROUTE.r(340,430);
function curvatureAt(s){
  let k=0;
  for(const c of CURVE) k+=c.a*Math.sin(TAU*s/c.wl+c.ph);
  k+=OPEN_BOW*Math.sin(Math.PI*clamp((s-20)/230,0,1));
  return k;
}
H.route.feed(OPEN_BOW);

// ============================================================
// PLAN — ELEVATION
// Rollers, signature climbs, chapter shaping; then a grade limiter and a
// vertical easing pass so every grade arrives and leaves smoothly.
// ============================================================
const S_FORK_SPLIT_FRAC=0.417;
const EDS=2;
const GRADE_CAP=0.066;
const FORK_SIDE=FORKS.chance(0.5)?1:-1;             // +1: Sunpath climbs to the left
const S_SPLIT=chapEndPre('fork')+FORKS.r(30,90);   // the wedge
const ARM_LEN=FORKS.r(560,660);
const S_MERGE_SPINE=S_SPLIT+ARM_LEN;
const S_SHELF0=S_SPLIT, S_SHELF1=S_MERGE_SPINE;
const FORK_COMMIT_LEAD=118;   // metres past the split before the line is committed
CH[3].end=clamp(S_MERGE_SPINE/L_TOTAL,CH[2].end+0.05,CH[4].end-0.05);
for(const c of CH) CHS[c.key]=c.end*L_TOTAL;
const SUN_LIFT=FORKS.r(9,12), MOSS_DROP=FORKS.r(5.5,7.5);
const SUN_OUT=FORKS.r(34,46);
let MOSS_OUT=SUN_OUT*FORKS.r(0.66,0.80);
const MOSS_WOB=FORKS.r(7.5,10.5), SUN_WOB=FORKS.r(3,5);
const SUN_PH=FORKS.r(0,TAU), MOSS_PH=FORKS.r(0,TAU);
// The profile is not a ramp with ripples on it. It is a sequence of rises and
// falls — rollers — whose sizes are biased chapter by chapter, so a climb is
// three linked rises with partial recoveries and a hollow is a run of falls.
const BREATH=[], KNOTS=[];
const TREND=ELEV.r(0.0044,0.0074);   // the hollow climbs, gently, all the way through
const CHAP_BIAS=[];
{
  for(let i=0;i<2;i++) BREATH.push({wl:ELEV.r(1700,2900),a:ELEV.r(1.2,2.6),ph:ELEV.r(0,TAU)});
  const G=chapEnd('gate'), SB=chapEnd('sunbank'), FF=chapEnd('fernfold'), FK=chapEnd('fork'),
        JW=chapEnd('joining'), GW=chapEnd('glasswater'), CS=chapEnd('cloudstep');
  const B=(s,v)=>CHAP_BIAS.push({s,v});
  const HOLD=(s0,s1,v)=>{ B(s0,v); B(s1,v); };
  B(-260,0.05);
  HOLD(G*0.20,G*0.46,-ELEV.r(0.40,0.50));               // the opening looks down the hollow
  B(G*0.98,0.24);
  HOLD(G+110,SB-170,ELEV.r(0.46,0.58));                 // Sunbank rides up across open ground
  B(SB+30,0.02);
  HOLD(SB+140,FF-190,-ELEV.r(0.56,0.68));               // Fernfold falls into the compression
  B(FF+30,-0.06);
  HOLD(S_SHELF0-40,S_SHELF1+40,0.05);                   // the fork stands on a shelf
  HOLD(FK+200,FK+ELEV.r(560,680),ELEV.r(0.54,0.64));    // a signature climb inside the trees
  B(JW-140,-ELEV.r(0.10,0.20));
  HOLD(JW+90,GW-ELEV.r(260,340),0.08);                  // Glasswater is a shelf
  B(GW-90,0.10);
  HOLD(GW+90,lerp(GW,CS,0.38),ELEV.r(0.56,0.66));       // Cloudstep: three linked rises
  B(lerp(GW,CS,0.55),ELEV.r(0.02,0.14));                //   with partial recoveries
  HOLD(lerp(GW,CS,0.62),CS-110,ELEV.r(0.56,0.66));
  HOLD(CS+90,CS+ELEV.r(250,340),ELEV.r(0.46,0.58));     // the last shelf under Bellroot
  HOLD(L_TOTAL-ELEV.r(470,540),L_TOTAL-ELEV.r(120,180),-ELEV.r(0.54,0.66));  // the valley lets go
  B(L_TOTAL+TAIL+200,-0.20);
  CHAP_BIAS.sort((p,q)=>p.s-q.s);
  const biasAt=(s)=>{
    if(s<=CHAP_BIAS[0].s) return CHAP_BIAS[0].v;
    for(let i=1;i<CHAP_BIAS.length;i++){
      if(s<=CHAP_BIAS[i].s){
        const t=(s-CHAP_BIAS[i-1].s)/Math.max(1,CHAP_BIAS[i].s-CHAP_BIAS[i-1].s);
        return lerp(CHAP_BIAS[i-1].v,CHAP_BIAS[i].v,t*t*(3-2*t));
      }
    }
    return CHAP_BIAS[CHAP_BIAS.length-1].v;
  };
  // climbs are laid a little gentler than descents, which is both kinder on a
  // bicycle and what buys the route its ascent inside the grade contract
  const GUP=0.040, GDN=0.049;
  let s=-220, dir=ELEV.chance(0.5)?1:-1, y=0, run=0;
  KNOTS.push({s,y,dir});
  while(s<L_TOTAL+TAIL+240){
    const ds=ELEV.r(92,206);
    const mid=s+ds*0.5;
    const bias=clamp(biasAt(mid),-0.88,0.88);
    // amplitude is a fraction of what the grade contract allows. The direction
    // the chapter wants takes all of it; the other direction gets only what the
    // bias leaves, which is how a climb becomes linked rises with recoveries.
    const fav=(dir>0)===(bias>=0);
    const mag=Math.abs(bias);
    let amp=(dir>0?GUP:GDN)*ds*ELEV.r(0.84,1.0);
    if(!fav) amp*=clamp(1-1.30*mag,0.22,1);
    // the fork stands on a shelf so both arms have room to part vertically
    amp*=1-0.62*smooth(S_SHELF0-190,S_SHELF0-30,mid)*(1-smooth(S_SHELF1+30,S_SHELF1+190,mid));
    amp=Math.min(amp,0.052*ds);
    y+=dir*Math.max(0.25,amp);
    s+=ds;
    KNOTS.push({s,y,dir});
    // where the land really means it, two or three rises link up with only a
    // partial recovery between them, instead of a strict up-down alternation
    const want=Math.sign(bias);
    const keep=(Math.abs(bias)>0.46&&dir===want&&run<2&&ELEV.f()<(Math.abs(bias)-0.44)*1.8);
    if(keep) run++; else { dir=-dir; run=0; }
  }
  for(const k of KNOTS) H.elev.feed(k.s,k.y);
  H.elev.feed(TREND);
  for(const b of BREATH) H.elev.feed(b.wl,b.a,b.ph);
}
function knotY(s,scale){
  let lo=0, hi=KNOTS.length-1;
  if(s<=KNOTS[0].s) return KNOTS[0].y*scale;
  if(s>=KNOTS[hi].s) return KNOTS[hi].y*scale;
  while(hi-lo>1){ const m=(lo+hi)>>1; if(KNOTS[m].s<=s) lo=m; else hi=m; }
  const a=KNOTS[lo], b=KNOTS[hi];
  const t=(s-a.s)/Math.max(1e-6,b.s-a.s);
  return lerp(a.y,b.y,t*t*(3-2*t))*scale;
}
function blurArray(y,passes){
  const n=y.length, t=new Float32Array(n);
  for(let p=0;p<passes;p++){
    t[0]=y[0]; t[n-1]=y[n-1];
    for(let i=1;i<n-1;i++) t[i]=(y[i-1]+y[i]*2+y[i+1])*0.25;
    y.set(t);
  }
}
function buildElevation(scale){
  const n=Math.ceil((L_TOTAL+TAIL)/EDS)+1;
  const y=new Float32Array(n);
  for(let i=0;i<n;i++){
    const s=i*EDS;
    let v=knotY(s,scale)+TREND*s;
    for(const B of BREATH) v+=B.a*Math.sin(TAU*s/B.wl+B.ph);
    y[i]=v;
  }
  for(let i=1;i<n;i++){ const d=y[i]-y[i-1], m=GRADE_CAP*EDS;
    if(d> m) y[i]=y[i-1]+m; else if(d<-m) y[i]=y[i-1]-m; }
  for(let i=n-2;i>=0;i--){ const d=y[i]-y[i+1], m=GRADE_CAP*EDS;
    if(d> m) y[i]=y[i+1]+m; else if(d<-m) y[i]=y[i+1]-m; }
  blurArray(y,54);                          // vertical easing, sigma ~ 10 m
  let asc=0,desc=0,maxG=0;
  for(let i=1;i<n;i++){ const d=y[i]-y[i-1];
    if(d>0) asc+=d; else desc-=d;
    maxG=Math.max(maxG,Math.abs(d)/EDS); }
  return {y,asc,desc,maxG,n};
}
const ASC_TARGET=ELEV.r(128,148);
let ELEVATION;
{
  const a=buildElevation(1.0);
  let scale=clamp(ASC_TARGET/Math.max(a.asc,1),0.80,1.22);
  ELEVATION=buildElevation(scale);
  if(ELEVATION.asc<ASC_TARGET*0.93||ELEVATION.asc>ASC_TARGET*1.09){
    scale=clamp(scale*ASC_TARGET/Math.max(ELEVATION.asc,1),0.80,1.24);
    ELEVATION=buildElevation(scale);
  }
  ELEVATION.rollerScale=scale;
  H.elev.feed(scale,ELEVATION.asc,ELEVATION.desc,ELEVATION.maxG);
}
function spineY(s){
  const i=clamp(s/EDS,0,ELEVATION.n-1), i0=Math.floor(i), t=i-i0, i1=Math.min(i0+1,ELEVATION.n-1);
  return lerp(ELEVATION.y[i0],ELEVATION.y[i1],t);
}
// rollers, measured on the built profile rather than assumed
const ROLLER_STAT=(()=>{
  const y=ELEVATION.y, n=ELEVATION.n;
  // collect extrema, then merge any pair whose swing is below the roller floor
  let ex=[{i:0,y:y[0],k:y[1]>=y[0]?-1:1}];
  for(let i=1;i<n-1;i++){
    if(y[i]>=y[i-1]&&y[i]>y[i+1]) ex.push({i,y:y[i],k:1});
    else if(y[i]<=y[i-1]&&y[i]<y[i+1]) ex.push({i,y:y[i],k:-1});
  }
  ex.push({i:n-1,y:y[n-1],k:y[n-1]>=y[n-2]?1:-1});
  for(;;){
    let bi=-1,bv=1e9;
    for(let i=1;i<ex.length-2;i++){
      const v=Math.abs(ex[i].y-ex[i+1].y);
      if(v<bv){ bv=v; bi=i; }
    }
    if(bi<0||bv>=1.5) break;
    ex.splice(bi,2);
  }
  let count=0, sumA=0, sumW=0;
  const amps=[];
  for(let i=1;i<ex.length-1;i++){
    if(ex[i].k!==1) continue;
    const amp=Math.min(ex[i].y-ex[i-1].y,ex[i].y-ex[i+1].y);
    const wl=(ex[i+1].i-ex[i-1].i)*EDS;
    if(amp>=1.2&&wl>=120){ count++; amps.push([Math.round(amp*20)/10,Math.round(wl)]); sumA+=amp*2; sumW+=wl; }
  }
  return {count,amps,meanAmpM:count?sumA/count:0,meanWavelengthM:count?sumW/count:0};
})();

// ---------- the spine walk ----------
const spine={x:new Float32Array(NS),y:new Float32Array(NS),z:new Float32Array(NS),hd:new Float32Array(NS)};
{
  let x=0,z=0,hd=ROUTE.r(0,TAU);
  for(let i=0;i<NS;i++){
    const s=i*SDS;
    spine.x[i]=x; spine.z[i]=z; spine.y[i]=spineY(s); spine.hd[i]=hd;
    const k=curvatureAt(s+SDS*0.5);
    hd+=k*SDS;
    x+=Math.sin(hd)*SDS; z+=Math.cos(hd)*SDS;
    if((i%64)===0) H.route.feed(x,z,spine.y[i]);
  }
}
function spineAt(s){
  const i=clamp(s/SDS,0,NS-1), i0=Math.floor(i), t=i-i0, i1=Math.min(i0+1,NS-1);
  return { x:lerp(spine.x[i0],spine.x[i1],t), y:lerp(spine.y[i0],spine.y[i1],t),
           z:lerp(spine.z[i0],spine.z[i1],t), hd:lerp(spine.hd[i0],spine.hd[i1],t) };
}

// ============================================================
// PLAN — THE MOSSWATER CHOICE
// Two arms that disagree about everything: height, radius, sightline,
// ground, and what they show you at the end.
// ============================================================
H.route.feed(FORK_SIDE,S_SPLIT,ARM_LEN,SUN_LIFT,MOSS_DROP,SUN_OUT,MOSS_OUT);

function armPoints(kind){
  const pts=[]; const n=26;
  const side=(kind==='sun'?FORK_SIDE:-FORK_SIDE);
  const out=(kind==='sun'?SUN_OUT:MOSS_OUT);
  const lift=(kind==='sun'?SUN_LIFT:-MOSS_DROP);
  const wobN=(kind==='sun'?1.0:2.0);                 // Mosswater turns more often
  const wobA=(kind==='sun'?SUN_WOB:MOSS_WOB);
  const wobP=(kind==='sun'?SUN_PH:MOSS_PH);

// PLAN — SIGHTLINES
// Corridors that stay clear so a designed view can actually happen.
// ============================================================
const SIGHT=[];
function addSight(g0,g1,side,half,tag){ SIGHT.push({g0,g1,side,half,tag}); }
function inSight(x,z,g,d,side){
  for(const S of SIGHT){
    if(g<S.g0||g>S.g1) continue;
    if(S.side&&S.side!==side) continue;
    if(d<S.half) return true;
  }
  return false;
}

// ---------- crests, measured on the built profile ----------
const CRESTS=[];
{
  const y=ELEVATION.y;
  for(let i=6;i<ELEVATION.n-6;i++){
    if(y[i]>y[i-1]&&y[i]>=y[i+1]){
      let lo=y[i]; for(let j=i;j<Math.min(ELEVATION.n,i+110);j++) lo=Math.min(lo,y[j]);
      let lo2=y[i]; for(let j=i;j>Math.max(0,i-110);j--) lo2=Math.min(lo2,y[j]);
      const prom=Math.min(y[i]-lo,y[i]-lo2);
      if(prom>2.6) CRESTS.push({g:i*EDS,y:y[i],prom});
    }
  }
}

// The Wind Sisters: three wind-shaped trees on a skyline ridge, planned so that
// they can be read from Sunbank and again, from the other side, at Glasswater.
const SISTERS=(()=>{
  // A callback only works if the same thing can genuinely be seen twice. The
  // route bows; collect the station pairs, chapters apart, that come closest in
  // space, and stand the Sisters on a knoll between the first pair that works.
  const pairs=[];
  for(let gA=chapEnd('gate')*0.5;gA<chapEnd('fernfold')-60;gA+=30){
    const a=getFrame(FRAMES.sun,toLocal('sun',gA));
    let bestB=null;
    for(let gB=Math.max(gA+1500,chapEnd('fork'));gB<L_TOTAL-200;gB+=30){
      const b=getFrame(FRAMES.sun,toLocal('sun',gB));
      const d=Math.hypot(a.x-b.x,a.z-b.z);
      if(!bestB||d<bestB.d) bestB={gA,gB,d,a,b};
    }
    if(bestB) pairs.push(bestB);
  }
  pairs.sort((p,q)=>p.d-q.d);
  // keep a handful of well-separated candidates rather than five neighbours
  const cand=[];
  for(const p of pairs){ if(cand.every(c=>Math.abs(c.gA-p.gA)>180)) cand.push(p); if(cand.length>=6) break; }
  const sees=(fr,x,z,y)=>{
    const ex=fr.x, ez=fr.z, ey=fr.y+EYE_H;
    const D=Math.hypot(x-ex,z-ez);
    if(D>1500||D<130) return false;
    for(let t=0.05;t<0.96;t+=0.028){
      const px=lerp(ex,x,t), pz=lerp(ez,z,t);
      if(groundY(px,pz)>lerp(ey,y,t)+1.0) return false;
    }
    return true;
  };
  let best=null;
  for(let ci=0;ci<cand.length;ci++){
    const P=cand[ci], a=P.a, b=P.b, gap=P.d;
    let local=null;
    for(let t=0;t<200;t++){
      const st=subStream('sisters',ci,t);
      const spread=clamp(0.42-gap/9000,0.14,0.42);
      const mx=lerp(a.x,b.x,st.r(0.5-spread,0.5+spread)), mz=lerp(a.z,b.z,st.r(0.5-spread,0.5+spread));
      const ang=st.r(0,TAU), rad=st.r(180,Math.max(240,Math.min(470,gap*0.28)));
      const x=mx+Math.cos(ang)*rad, z=mz+Math.sin(ang)*rad;
      if(routeInfo(x,z).d<190) continue;
      let bx=x,bz=z,by=groundY(x,z);
      for(let k=0;k<12;k++){
        const aa=k/12*TAU, cx2=x+Math.cos(aa)*38, cz2=z+Math.sin(aa)*38;
        if(routeInfo(cx2,cz2).d<190) continue;
        const cy=groundY(cx2,cz2);
        if(cy>by){ bx=cx2; bz=cz2; by=cy; }
      }
      const crown=by+30;
      const vA=sees(a,bx,bz,crown), vB=sees(b,bx,bz,crown);
      const score=(vA?1000:0)+(vB?1000:0)+by
        -Math.abs(Math.hypot(bx-a.x,bz-a.z)-Math.hypot(bx-b.x,bz-b.z))*0.05;
      if(!local||score>local.score) local={x:bx,y:by,z:bz,score,gA:P.gA,gB:P.gB,vA,vB,pairD:gap,a,b};
      if(vA&&vB&&t>16) break;
    }
    if(local&&(!best||local.score>best.score)) best=local;
    if(best&&best.vA&&best.vB) break;
  }
  if(!best){ const P=cand[0]||{a:{x:0,z:0},b:{x:0,z:0},gA:0,gB:0,d:0};
    const x=P.a.x+380,z=P.a.z+200; best={x,y:groundY(x,z),z,score:0,gA:P.gA,gB:P.gB,pairD:P.d,a:P.a,b:P.b}; }
  // how high the crown must stand for both viewpoints to clear the ground
  // between: measured, not guessed
  best.needCrown=(()=>{
    let need=best.y+16;
    for(const fr of [best.a,best.b]){
      const ey=fr.y+EYE_H;
      for(let t=0.08;t<0.97;t+=0.02){
        const px=lerp(fr.x,best.x,t), pz=lerp(fr.z,best.z,t);
        const obst=groundY(px,pz)+1.2;
        if(obst>ey) need=Math.max(need,ey+(obst-ey)/t);
      }
    }
    return need;
  })();
  return best;
})();

// ============================================================
// PLAN — THE TREES THEMSELVES
// Position and identity are world identity; only their representation
// is allowed to change with quality.
// ============================================================
const TREES=[];
const treeCell=40, treeGrid=new Map();
function treeAdd(t){
  TREES.push(t);
  const k=rKey(Math.floor(t.x/treeCell),Math.floor(t.z/treeCell));
  let c=treeGrid.get(k); if(!c){c=[];treeGrid.set(k,c);} c.push(t);
}
function treeNear(x,z,r){
  const gx=Math.floor(x/treeCell), gz=Math.floor(z/treeCell), R=Math.ceil(r/treeCell);
  for(let ax=gx-R;ax<=gx+R;ax++) for(let az=gz-R;az<=gz+R;az++){
    const c=treeGrid.get(rKey(ax,az)); if(!c) continue;
    for(const t of c) if((t.x-x)*(t.x-x)+(t.z-z)*(t.z-z)<r*r) return true; }
  return false;
}
function famScale(fam,st){
  return { oak:st.r(1.0,1.35), beech:st.r(1.0,1.3), birch:st.r(0.78,1.05),
           leaning:st.r(0.86,1.15), windshaped:st.r(0.8,1.08), orchard:st.r(0.52,0.76) }[fam];
}
{
  for(const gr of GROVES){
    const arm=(gr.arm==='moss')?'moss':'sun';
    if(gr.arm==='moss'&&!(gr.g>S_SPLIT-80&&gr.g<S_MERGE_G+80)) continue;
    const fr=getFrame(FRAMES[arm],clamp(toLocal(arm,gr.g),0,FRAMES[arm].len-1));
    const cx=fr.x+fr.lx*gr.off*gr.side, cz=fr.z+fr.lz*gr.off*gr.side;
    const area=Math.PI*gr.rx*gr.rz;
    const target=Math.round(clamp(area/ (gr.role==='frame'?95:(gr.role==='support'?150:(gr.role==='wall'?230:520))) *gr.dens,1,46));
    const st=subStream('trees',gr.id);
    let placed=0;
    for(let att=0;att<target*9&&placed<target;att++){
      const a=st.r(0,TAU), rr=Math.sqrt(st.f());
      const ex=Math.cos(a)*gr.rx*rr, ez=Math.sin(a)*gr.rz*rr;
      const ca=Math.cos(gr.rot), sa=Math.sin(gr.rot);
      const x=cx+ex*ca-ez*sa, z=cz+ex*sa+ez*ca;
      const ri=routeInfo(x,z);
      const fam=st.pick(gr.mix);
      const scl=famScale(fam,st)*(gr.hero&&placed===0?st.r(1.28,1.55):1);
      const rad=1.5*scl;
      if(ri.d<EXCL+rad+0.6) continue;
      if(ri.dA[1]<EXCL+rad+0.6&&gr.g>S_SPLIT-90&&gr.g<S_MERGE_G+90) continue;
      if(streamInfo(x,z).d<4.0) continue;
      let inPond=false;
      for(const P of PONDS) if(Math.hypot((x-P.cx)/(P.rx*1.25),(z-P.cz)/(P.rz*1.25))<1) inPond=true;
      if(inPond) continue;
      // nothing stands in the shelf: the whole point of it is an open sight line
      // from the lane down onto the water
      if(inShelf(x,z,1.5)) continue;
      if(Math.hypot(x-HERO_POS.x,z-HERO_POS.z)<64) continue;
      if(inSight(x,z,ri.s,ri.d,gr.side)) continue;
      if(treeNear(x,z,2.0*scl+st.r(0.4,2.4))) continue;
      const y=groundY(x,z);
      treeAdd({ x,y,z,fam,scl,rot:st.r(0,TAU),lean:st.r(-1,1),
        role:(placed===0&&gr.hero)?'hero':gr.role, grove:gr.id,
        d:ri.d, g:toGlobal(ri.arm===1?'moss':'sun',ri.s), roadY:ri.y,
        enc:gr.enc, window:gr.window||null, layer:gr.layer||null });
      placed++;
    }
  }
  // the nose of the wedge between the two lanes: what makes the fork read
  for(let i=0;i<9;i++){
    const st=subStream('wedge',i);
    const g=lerp(S_SPLIT+70,S_MERGE_G-90,st.f());
    const fr=getFrame(FRAMES.sun,clamp(toLocal('sun',g),0,FRAMES.sun.len-1));
    const fm=getFrame(FRAMES.moss,clamp(toLocal('moss',g),0,FRAMES.moss.len-1));
    const mx=lerp(fr.x,fm.x,st.r(0.35,0.65)), mz=lerp(fr.z,fm.z,st.r(0.35,0.65));
    const x=mx+st.r(-7,7), z=mz+st.r(-7,7);
    const ri=routeInfo(x,z);
    if(Math.min(ri.dA[0],ri.dA[1])<EXCL+3) continue;
    if(treeNear(x,z,7)) continue;
    const fam=st.pick(['oak','birch','windshaped','leaning']);
    treeAdd({x,y:groundY(x,z),z,fam,scl:famScale(fam,st)*st.r(0.85,1.15),rot:st.r(0,TAU),
      lean:st.r(-1,1),role:'support',grove:-4,d:Math.min(ri.dA[0],ri.dA[1]),g,roadY:ri.y,
      enc:0.35,window:null,layer:null,formation:'fork-wedge'});
  }
  // The Dappled Gate's own trees, placed before anything else can crowd them
  for(let i=0;i<GATE_TREES.length;i++){
    const G=GATE_TREES[i], st=subStream('gatetree',i);
    const fr=getFrame(FRAMES.sun,clamp(G.g,0,FRAMES.sun.len-1));
    const x=fr.x+fr.lx*G.off*G.side, z=fr.z+fr.lz*G.off*G.side;
    const ri=routeInfo(x,z);
    if(ri.d<EXCL) continue;
    treeAdd({x,y:groundY(x,z),z,fam:G.fam,scl:G.scl,rot:st.r(0,TAU),lean:G.lean,
      role:'hero',grove:-3,d:ri.d,g:G.g,roadY:ri.y,enc:0.55,window:'gate',layer:'near',
      formation:'dappled-gate'});
  }
  // The Orchard Row — a deliberate, wind-combed line on the Sunpath ridge
  {
    const fr0=toLocal('sun',ORCHARD_ROW.g);
    for(let i=0;i<ORCHARD_ROW.n;i++){
      const st=subStream('orchardrow',i);
      const fr=getFrame(FRAMES.sun,clamp(fr0+(i-ORCHARD_ROW.n/2)*ORCHARD_ROW.spacing,0,FRAMES.sun.len-1));
      const off=ORCHARD_ROW.off+st.r(-2.5,2.5);
      const x=fr.x+fr.lx*off*ORCHARD_ROW.side, z=fr.z+fr.lz*off*ORCHARD_ROW.side;
      const ri=routeInfo(x,z);
      if(ri.d<EXCL+2) continue;
      treeAdd({x,y:groundY(x,z),z,fam:'windshaped',scl:st.r(0.9,1.12),rot:st.r(0,TAU),
        lean:0.85,role:'landmark',grove:-1,d:ri.d,g:ORCHARD_ROW.g,roadY:ri.y,enc:0.2,
        window:null,layer:null,formation:'orchard-row'});
    }
  }
  // The Wind Sisters — three of them, on the skyline, seen twice from two
  // chapters. A landmark has to be a shape you can name, so they are not three

const CLOUD_PLAN=(()=>{

    {n:CLOUD.i(4,5), rr:[1250,2300], span:[220,340], h:[330,430], lift:[48,84],  val:0.90},
    {n:CLOUD.i(3,4), rr:[2300,3600], span:[170,260], h:[420,520], lift:[34,62],  val:0.78},

      lobes.push({ x:CLOUD.r(-0.06,0.06)*spanX, z:CLOUD.r(-0.05,0.05)*spanX,

// The value noise below is evaluated between six and thirteen times per fragment
// on every lit surface in the world — cloud shadow, canopy dapple, and the
// meadow's own paint. Each evaluation needs four corner hashes, and the hash was
// `fract(sin(dot(p,k))*43758.5453)`: a transcendental. That is fifty-odd sines
// per ground pixel, which is the world's real per-pixel cost — geometry is
// nowhere near the budget, fill is.
//
// The four corner hashes of a cell are now baked into one RGBA texel and fetched
// in a single tap. The interpolation that follows is untouched, so this is the
// same KIND of field at the same frequencies; the table is baked with wrap-around
// so it is exactly periodic at 512 cells and has no seam. At the frequencies
// actually used that period is 465 m for the canopy dapple's finest octave and
// 138 m for the ground grain — well beyond the range at which either is a
// legible pattern rather than texture.
//
// It is NOT bit-identical to what the sines produced, and it could not have been:
// `sin` at sixty thousand radians in a 32-bit fragment shader is dominated by
// argument-reduction error, which is a property of the GPU rather than of the
// world. The low-frequency octaves — every cloud shadow, which is the only part
// of this field that composes anything — land at cell indices in the single
// digits and are unchanged. The high-frequency octaves are ground grain and
// canopy mottle, and those were previously being drawn differently on different
// hardware. They are now the same everywhere.

// point against open sward is exactly the silhouette that reads as a thorn.
// Widening the base and lifting the colour did not change that, which is why
// they kept reading as spikes after both.
//
// A blade is now a quad: wide at the root, still a third of that width at the
// tip, cut off flat and leaning. It has a SHOULDER instead of an apex, so where
// blades overlap the clump has a broken horizontal top edge rather than a row of
// converging needles. One low cross-blade is laid through the middle of the
// clump so the mass reads as a tussock sitting in the grass rather than as a
// bundle of separate leaves standing in a ring.

  const P=[[ax,ay,az,cBase,0],[bx,by,bz,cBase,0],[cx,cy,cz,cTop,swayTop],[dx2,dy,dz2,cTop,swayTop]];
  for(const [i0,i1,i2] of [[0,1,2],[0,2,3]]){

  const y0=gy(x-dx*len,z-dz*len)+r*0.85, y1=gy(x+dx*len,z+dz*len)+r*0.8;
  tube(tb,[new THREE.Vector3(x-dx*len,y0,z-dz*len),new THREE.Vector3(x+dx*len,y1,z+dz*len)],
    r,r*0.8,5,BARK_SUN,mixc(PAL.bark,PAL.woodDeep,0.55));
  const added=B.p.length/3-before;
  for(let i=0;i<added;i++){ B.k.push(0); B.a.push(B.can); B.u.push(0); }
}

// ============================================================
// BANDS — deterministic residency along the route
// Vegetation, growth and ground contact are realised band by band and
// released behind the rider. Identity comes from position, never from
// the order in which bands happened to be built.
// ============================================================
// ============================================================
// GROUNDING — every planted thing stands on the surface that is drawn
// The plan places things using the continuous ground function. The renderer
// draws a triangulated approximation of it. Where that approximation dips below
// the function — every convex cell, every crease at the fork — a trunk placed by
// the plan hangs in the air. So once, after all terrain meshes exist and before
// anything is built, every planted position is re-seated onto the drawn surface
// and its collar is sunk a little way into it. This is a system, not a list of
// exceptions, and it runs before residency so a band cannot re-seat differently
// the second time it is realised.
// ============================================================
const GROUND_STAT={ trees:0, lowered:0, maxDropM:0, raised:0, culled:0, maxKeptDropM:0, deepSeated:0 };
const SEAT_LIMIT=1.25;      // beyond this the mesh and the plan disagree too much to plant here
// The plan's own height is a floor guard against a reader that over-reads: a
// trunk is never placed above the drawn surface. But it may not be placed
// arbitrarily far below it either. Wherever the drawn surface sits above the
// plan's function — the graded bank between the fork's arms, every fill, every
// place the road lifts the ground beside it — taking the lower of the two left
// the tree at the plan's height and the ground at the mesh's, and the difference
// was measured at up to nine metres. A tree nine metres under the ground is not
// a badly seated tree, it is an absent one, and nothing in the proof surface
// said so until `buriedOver0_9m` was asked for. So the seat is clamped to a
// depth a root collar can actually absorb.
const SEAT_SINK_MAX=0.55;
function seatOnGround(x,z,sink){
  const a=groundY(x,z), r=realizedGroundY(x,z);
  if(r===null) return a-(sink||0);
  return clamp(Math.min(a,r),r-SEAT_SINK_MAX,r)-(sink||0);
}
// Whether a point is somewhere a triangulated surface can follow the ground is
// a property of the LAND, not of the tier that happens to be drawing it. It is
// measured here against a fixed twelve-metre reference cell, so every quality
// culls exactly the same trees and the planned world stays one world.
const REF_CELL=12;
function meshFollowError(x,z){
  const h=REF_CELL*0.5;
  const c=groundY(x,z);
  const q=(groundY(x-h,z-h)+groundY(x+h,z-h)+groundY(x-h,z+h)+groundY(x+h,z+h))*0.25;
  return c-q;                    // positive: a spike the reference cell misses
}
{
  for(const t of TREES){
    const before=t.y;
    // the collar sinks with the trunk's own size, so a big oak beds in further
    // than a birch and neither shows daylight under its root flare
    const y=seatOnGround(t.x,t.z,0.16+0.10*clamp(t.scl,0.6,3.4));
    const drop=before-y;
    GROUND_STAT.trees++;
    GROUND_STAT.maxDropM=Math.max(GROUND_STAT.maxDropM,drop);
    // A tree standing where no triangulated surface can follow the ground would
    // be buried to its crown by seating. Remove it instead: an absent tree is
    // invisible, a buried one is a defect. The plan keeps it — it is part of
    // this world's identity at every quality — and realization declines to
    // build it, using a tier-independent measure so the same trees are declined
    // at low, standard and high.
    if(meshFollowError(t.x,t.z)>SEAT_LIMIT){ t.unseatable=true; GROUND_STAT.culled++; continue; }
    t.unseatable=false;
    t.y=y;
    if(drop>1e-4){ GROUND_STAT.lowered++; GROUND_STAT.maxKeptDropM=Math.max(GROUND_STAT.maxKeptDropM,drop);
      // seated more than a metre and a half down is effectively buried; that is
      // safe (you cannot see it) but it is worth counting rather than hiding
      if(drop>1.5) GROUND_STAT.deepSeated++; }
    else if(drop<-1e-4) GROUND_STAT.raised++;
  }
}
HERO_POS.y=seatOnGround(HERO_POS.x,HERO_POS.z,0.55);
H.real.feed('seat',GROUND_STAT.lowered,GROUND_STAT.culled,Math.round(GROUND_STAT.maxKeptDropM*100));

const BAND=200;
const NBAND=Math.ceil(FRAMES.sun.len/BAND)+1;
const bandTrees=Array.from({length:NBAND},()=>[]);
const staticFar=[];
for(const t of TREES){
  if(t.unseatable) continue;
  // the Sisters are a fixed point of the whole ride: they must not be released
  // with the band they happen to be scheduled in, or the callback has nothing
  // left to call back to
  if(t.d>QCFG.farD||t.formation==='wind-sisters'){ staticFar.push(t); continue; }
  const bi=clamp(Math.floor(t.g/BAND),0,NBAND-1);
  bandTrees[bi].push(t);
}
// distant individuals are static: they belong to the far reading, not to residency
{
  const groups=[[],[],[],[]];
  const c0=spineAt(L_TOTAL*0.5);
  for(const t of staticFar){
    const a=Math.atan2(t.x-c0.x,t.z-c0.z);
    groups[clamp(Math.floor((a+Math.PI)/TAU*4),0,3)].push(t);
  }
  for(const grp of groups){
    if(!grp.length) continue;
    const B=Buf();
    for(const t of grp) buildTree(B,t,t.formation==='wind-sisters'?1:0);
    const m=new THREE.Mesh(bufGeo(B),treeMatFar); m.matrixAutoUpdate=false;
    scene.add(m);
  }
  H.real.feed('staticfar',staticFar.length);
}

const counts={ trees:0, articulatedNear:0, midTrees:0, farTrees:0, staticFarTrees:staticFar.length,
  understory:0, flowers:0, seedheads:0, ferns:0, shrubs:0, reeds:0, groundContacts:0, rocksLogs:0 };
const RES={ realized:0, disposed:0, peak:0 };
const bands=Array.from({length:NBAND},(_,i)=>({i,g0:i*BAND,g1:(i+1)*BAND,live:null}));

function realizeBand(bi){
  const b=bands[bi];
  if(b.live) return;
  const nearB=Buf(), midB=Buf(), uB=UBuf();
  const local={trees:0,articulatedNear:0,midTrees:0,farTrees:0,understory:0,flowers:0,
    seedheads:0,ferns:0,shrubs:0,reeds:0,groundContacts:0,rocksLogs:0,corridorRejects:0,corridorViolations:0};
  // ---- trees: the nearest get the geometry, and the budget is bounded by
  // construction rather than by hoping the plan was sparse enough ----
  const ordered=bandTrees[bi].slice().sort((a,b)=>a.d-b.d||a.x-b.x||a.z-b.z);
  let nNear=0,nMid=0,nAll=0,nRound=0;
  for(const t of ordered){
    if(nAll>=QCFG.bandTreeCap) break;
    nAll++;
    let tier=(t.d<=QCFG.nearD)?2:((t.d<=QCFG.midD)?1:0);
    if(tier===2&&nNear>=QCFG.capNear) tier=1;
    if(tier===1&&nMid>=QCFG.capMid) tier=0;
    // A tree at the verge must hold its canopy high enough to ride under. At
    // five metres the crown hung in the rider's face and its lobes read as
    // plates across the top of the frame; at nine it reads as a ceiling.
    const overhang=(t.d<EXCL+10)?(t.roadY+9.0):undefined;
    if(tier===2){ buildTree(nearB,t,2,overhang,true); local.articulatedNear++; nNear++; }
    else if(tier===1){
      const round=(nRound<QCFG.roundMid&&t.d<=64);
      if(round) nRound++;
      buildTree(midB,t,1,overhang,round); local.midTrees++; nMid++;
    }
    else { buildTree(midB,t,0,undefined,false); local.farTrees++; }
    local.trees++;
    // every tree gets its ground: a cool contact patch and flattened growth
    const st=subStream('base',Math.round(t.x*10),Math.round(t.z*10));
    const dark=mixc(PAL.woodDeep,PAL.bark,0.30).lerp(col(PAL.leafShade),0.18);
    // on the drawn surface, not at the collar — the collar is bedded below it,
    // and a contact shadow under the ground is a gap rather than a contact
    const surf=realizedGroundY(t.x,t.z);
    addPatch(uB,t.x,(surf===null?t.y:surf),t.z,1.25*t.scl+st.r(0,0.8),dark);
    local.groundContacts++;
    // Growth at a trunk's foot exists to explain the contact, so it is only worth
    // paying for on a tree close enough for that contact to be read. Every tier-1
    // tree in the band used to get two to four, which is thousands of them, and
    // they were blended half-way to the deep woodland teal — far and away the
    // largest population of dark spikes in the world, and the one that followed
    // the rider everywhere because trees do.
    if(tier>=1&&t.d<38){
      const nr=Math.round(st.i(1,2)*QCFG.under);
      for(let i=0;i<nr;i++){
        // Kept inside the contact patch this ring exists to explain. At up to
        // 2.4 scale lengths it reached eight metres from a big oak — outside the
        // patch entirely, so it read as free-standing spikes near a tree rather
        // than as the tree's own base.
        const a=st.r(0,TAU), rr=st.r(0.6,1.35)*t.scl;
        const x=t.x+Math.cos(a)*rr, z=t.z+Math.sin(a)*rr;
        uB.can=clamp(t.enc,0,1);
        const yf=groundY(x,z);
        // Both colours here were absolute constants, so this ring rendered at the
        // same value on a pale open shelf as under closed canopy — the darkest of
        // the four tuft populations against the ground it actually stood on.
        const gcf=groundColor(x,z,0,t.enc,0,yf-refAt(x,z)).clone();
        addTuft(uB,x,yf,z,st,gcf.clone().lerp(col(PAL.meadow),0.26),gcf.clone().lerp(col(PAL.sunGrass),0.40),st.r(0.34,0.64),3);
        local.understory++;
      }
    }
  }
  // ---- growth, keyed to what the ground is actually doing here ----
  {
    const N=Math.round(QCFG.tuftBand*BAND/10*QCFG.under);
    const st=subStream('under',bi);
    const arms=(b.g0<S_MERGE_G+120&&b.g1>S_SPLIT-120)?['sun','moss']:['sun'];
    for(let i=0;i<N;i++){
      const arm=arms.length>1?(st.chance(0.5)?'sun':'moss'):'sun';
      const g=st.r(b.g0,b.g1);
      const sLoc=toLocal(arm,g);
      if(sLoc<0||sLoc>FRAMES[arm].len) continue;
      if(arm==='moss'&&(sLoc<S_COMMIT.moss-60||sLoc>S_MERGE.moss+60)) continue;
      const fr=getFrame(FRAMES[arm],sLoc);
      // bias toward the verge and the bank edge, where growth breaks a silhouette
      const roll=st.f();
      // Nothing scattered past twenty-six metres. A tuft is a handful of thin
      // triangles a third of a metre tall; past about twenty-five metres that is
      // four dark pixels, and a field of them is not a meadow, it is a row of
      // black spikes along the horizon. Growth belongs where the eye can read it
      // as growth — near the verge, and on the bank where it breaks a silhouette.
      const lat=(st.chance(0.5)?1:-1)*(roll<0.66?st.r(RH+0.55,RH+9):st.r(RH+9,26));
      const x=fr.x+fr.lx*lat+st.r(-3,3), z=fr.z+fr.lz*lat+st.r(-3,3);
      const ri=routeInfo(x,z);
      if(ri.d<EXCL){ local.corridorRejects++; continue; }
      const si=streamInfo(x,z);
      if(si.d<1.1) continue;
      let pin=99;
      for(const P of PONDS) pin=Math.min(pin,Math.hypot((x-P.cx)/P.rx,(z-P.cz)/P.rz));
      if(pin<0.92) continue;
      const y=groundY(x,z);
      const gHere=toGlobal(ri.arm===1?'moss':'sun',ri.s);
      const enc=enclosureAt(gHere,ri.arm===1?'moss':'sun')*clamp(1.3-ri.d/80,0,1);
      const moist=clamp(1-si.d/26,0,1);
      const slope=Math.abs(groundY(x+2.5,z)-groundY(x-2.5,z))/5+Math.abs(groundY(x,z+2.5)-groundY(x,z-2.5))/5;
      // Two scales, because a meadow is not an even sprinkle and it is not an
      // even carpet either. The coarse field decides whether this part of the
      // field has growth in it at all — most of it does not, and that emptiness
      // is the point. The fine field varies density inside a patch so its edges
      // are ragged rather than circular.
      // A water margin is not subject to the emptiness rule: a shoreline with
      // nothing on it reads as a hole cut in a lawn. Everywhere else the coarse
      // field decides whether this part of the meadow has growth at all, and
      // most of it does not — that emptiness is the composition.
      const bank=(pin<1.22)?1:0;
      const patch=fbmE(x/64+3.7,z/64+21.1);
      if(!bank&&patch<0.50-moist*0.16-enc*0.14) continue;
      const mask=fbmE(x/19+7,z/19+13);
      if(!bank&&mask<0.34-slope*0.5-moist*0.12-(patch-0.50)*0.8) continue;
      // Out in the open field the two masks cull most samples, and what survives
      // survives ALONE: one tuft standing by itself in ten metres of clean sward
      // does not read as grass, it reads as something dropped there. Growth that
      // far out now has to be in a genuinely strong patch, so when it appears it
      // appears as a group. Water margins are exempt — a shoreline needs its
      // fringe wherever the water happens to lie.
      if(!bank&&lat*lat>(RH+9)*(RH+9)&&patch<0.62-moist*0.10) continue;
      if(bank&&st.chance(0.45)) continue;      // sparse on the bank, never a fringe
      // nothing clutters the foot of a trunk, where it only confuses the eye
      // about whether the tree is standing on the ground
      { let underTree=false;
        for(const tt of bandTrees[bi]){
          if(tt.unseatable) continue;
          const ddx=x-tt.x, ddz=z-tt.z, rr2=(1.05*tt.scl+0.5);
          if(ddx*ddx+ddz*ddz<rr2*rr2){ underTree=true; break; }
        }
        if(underTree) continue; }
      uB.can=clamp(enc,0,1);
      const gc=groundColor(x,z,slope,enc,moist,y-refAt(x,z)).clone();
      const r2=st.f();
      if(bank&&st.chance(0.26)){
        // a few stones and a patch of wet loam where the bank meets the water
        const r=st.r(0.10,0.26);
        addBlob(uB,x,y+r*0.4,z,st,r,r*0.6,r*st.r(0.7,1.3),
          mixc(PAL.road,PAL.bark,0.42),mixc(PAL.bark,PAL.woodDeep,0.5),0);
        addPatch(uB,x,y,z,r*st.r(1.8,3.2),mixc(PAL.bark,PAL.woodDeep,0.42));
        local.rocksLogs++;
      } else if(pin<1.75&&pin>=0.92){               // reeds hold the pool's margin
        addFern(uB,x,y,z,st,mixc(PAL.leafShade,PAL.meadow,0.35),mixc(PAL.sunGrass,PAL.meadow,0.5),st.r(0.70,1.30));
        local.reeds++;
      } else if(moist>0.45&&si.d<12){
        addFern(uB,x,y,z,st,mixc(PAL.woodDeep,PAL.leafShade,0.45),mixc(PAL.leafShade,PAL.meadow,0.45),st.r(0.52,1.00));
        local.ferns++;
      } else if(enc>0.44){
        if(r2<0.62){ addFern(uB,x,y,z,st,mixc(PAL.woodDeep,PAL.leafShade,0.4),mixc(PAL.leafShade,PAL.meadow,0.35),st.r(0.46,0.92)); local.ferns++; }
        else if(r2<0.86){ addTuft(uB,x,y,z,st,gc.clone().lerp(col(PAL.leafShade),0.34),gc.clone().lerp(col(PAL.meadow),0.34),st.r(0.28,0.58),st.i(4,6)); local.understory++; }
        else { addBlob(uB,x,y+0.18,z,st,st.r(0.42,0.78),st.r(0.30,0.52),st.r(0.42,0.78),mixc(PAL.meadow,PAL.leafShade,0.30),mixc(PAL.leafShade,PAL.woodDeep,0.26),0.18); local.shrubs++; }
      } else if(enc<0.30&&slope<0.30&&r2<0.30){
        addSeedhead(uB,x,y,z,st,mixc(PAL.meadow,PAL.road,0.34),mixc(PAL.road,0xFFE79A,0.35),st.r(0.62,1.12));
        local.seedheads++;
      } else if(enc<0.34&&r2<0.24){
        addFlower(uB,x,y,z,st,mixc(PAL.meadow,PAL.sunGrass,0.5),
          st.pick([mixc(PAL.blossom,PAL.meadow,0.30),mixc(PAL.blossom,0xfff3e6,0.35),mixc(PAL.road,PAL.sunGrass,0.40),mixc(PAL.road,0xFFDE79,0.35)]),st.r(0.28,0.50));
        local.flowers++;
      } else {
        // A tussock in an open meadow is lit grass, not a shadow. Blending the
        // base a third of the way to the deep woodland teal made every tuft a
        // black wedge sitting on a bright field; the base now stays in the
        // meadow's own family and the tips catch the sun, so a clump reads as
        // grass at the distance it is actually seen from.
        // A blade is a triangle with TWO vertices at the base colour and one at
        // the tip, so its area-weighted mean is (2*base + tip)/3: a bright tip
        // cannot rescue a sunk base, which is why lifting the tips last time did
        // not stop these reading as dark spikes. leafShade is a canopy-shadow
        // colour and has no business on grass standing in full sun; the base is
        // now darkened toward the meadow's own green instead, by a third as much.
        addTuft(uB,x,y,z,st,gc.clone().lerp(col(PAL.meadow),0.22),gc.clone().lerp(col(PAL.sunGrass),0.45),st.r(0.30,0.62),st.i(4,6));
        local.understory++;
      }
    }
  }
  // ---- the verge proper: the metre and a half either side of the stone, which
  // is where a lane is actually read. Grass here has been ridden over, so it
  // lies flatter and drier at the edge and stands up again further out, with
  // seedheads leaning into the light over the shoulder. ----
  {
    const st=subStream('verge',bi);
    const N=Math.round((b.g1-b.g0)/2.1*QCFG.under);
    const arms=(b.g0<S_MERGE_G+120&&b.g1>S_SPLIT-120)?['sun','moss']:['sun'];
    for(let i=0;i<N;i++){
      const arm=arms.length>1?(st.chance(0.5)?'sun':'moss'):'sun';
      const g=st.r(b.g0,b.g1);
      const sLoc=toLocal(arm,g);
      if(sLoc<0||sLoc>FRAMES[arm].len) continue;
      if(arm==='moss'&&(sLoc<S_COMMIT.moss-40||sLoc>S_MERGE.moss+40)) continue;
      const fr=getFrame(FRAMES[arm],sLoc);
      const side=st.chance(0.5)?1:-1;
      // the near edge is worn thin; growth thickens outward
      const off=st.r(0,1)**0.62;
      const lat=side*(RH+0.34+off*4.6);
      const x=fr.x+fr.lx*lat, z=fr.z+fr.lz*lat;
      const ri=routeInfo(x,z);
      if(ri.d<EXCL){ local.corridorRejects++; continue; }
      if(streamInfo(x,z).d<1.1) continue;
      let pin=99;
      for(const P of PONDS) pin=Math.min(pin,Math.hypot((x-P.cx)/P.rx,(z-P.cz)/P.rz));
      if(pin<0.95) continue;
      const y=groundY(x,z);
      const gHere=toGlobal(arm,sLoc);
      const enc=enclosureAt(gHere,arm);
      const wear=clamp(1-off*1.6,0,1);            // 1 at the stone, 0 by the meadow
      uB.can=clamp(enc,0,1);
      const r2=st.f();
      // These two were fixed constants, so verge grass was GROUND-BLIND: it
      // rendered at the same luminance on the pale open shelves at Glasswater and
      // Bellroot as it did in a woodland hollow. Those shelves are the brightest
      // ground on the route, so that is exactly where the deficit was largest and
      // the tufts read as dark spikes. The verge now takes its colour from the
      // ground it stands in, on the same terms the corridor mesh uses for its own
      // verge — slope zero, moisture over the same divisor — so the two agree.
      const gcv=groundColor(x,z,0,enc,clamp(1-streamInfo(x,z).d/34,0,1),y-refAt(x,z)).clone();
      if(wear>0.55&&r2<0.30){
        // scuffed grit and small stones pressed into the shoulder
        const r=st.r(0.07,0.20);
        addBlob(uB,x,y+r*0.4,z,st,r,r*0.62,r*st.r(0.7,1.3),
          mixc(PAL.road,PAL.bark,0.34),mixc(PAL.bark,PAL.woodDeep,0.42),0);
        local.rocksLogs++;
      } else if(r2<0.20+wear*0.34){
        // ridden-over grass is dusty and warm, not cool and shaded
        addTuft(uB,x,y,z,st,gcv.clone().lerp(col(PAL.bark),0.14),gcv.clone().lerp(col(PAL.sunGrass),0.30),
          st.r(0.14,0.26)+ (1-wear)*st.r(0.12,0.34),st.i(4,6));
        local.understory++;
      } else if(enc<0.40&&r2>0.86){
        addSeedhead(uB,x,y,z,st,mixc(PAL.meadow,PAL.road,0.30),mixc(PAL.road,0xFFE79A,0.30),
          st.r(0.52,1.00)*(0.5+0.5*(1-wear)));
        local.seedheads++;
      } else if(enc<0.42&&r2>0.74){
        addFlower(uB,x,y,z,st,mixc(PAL.meadow,PAL.sunGrass,0.46),
          st.pick([mixc(PAL.blossom,PAL.meadow,0.28),mixc(PAL.blossom,0xfff3e6,0.34),
                   mixc(PAL.road,0xFFDE79,0.32),mixc(PAL.sunGrass,0xffffff,0.42)]),st.r(0.24,0.44));
        local.flowers++;
      } else {
        // enclosure is already carried by gcv through groundColor's shade term,
        // so darkening again by enc here would count it twice
        addTuft(uB,x,y,z,st,gcv.clone().lerp(col(PAL.meadow),0.24),
          gcv.clone().lerp(col(PAL.sunGrass),0.40),st.r(0.28,0.62)*(0.55+0.45*(1-wear)),st.i(4,6));
        local.understory++;
      }
    }
  }
  // ---- rocks and fallen wood: rare, subordinate, always explaining the ground ----
  {
    const st=subStream('props',bi);
    const N=Math.round(st.i(3,9)*(QUALITY==='low'?0.6:1));
    for(let i=0;i<N;i++){
      const g=st.r(b.g0,b.g1);
      const fr=getFrame(FRAMES.sun,clamp(toLocal('sun',g),0,FRAMES.sun.len-1));
      const lat=(st.chance(0.5)?1:-1)*st.r(RH+2.6,46);
      const x=fr.x+fr.lx*lat, z=fr.z+fr.lz*lat;
      const ri=routeInfo(x,z);
      if(ri.d<EXCL+0.8){ local.corridorRejects++; continue; }
      if(streamInfo(x,z).d<1.4) continue;
      const y=groundY(x,z);
      const slope=Math.abs(groundY(x+3,z)-groundY(x-3,z))/6;
      uB.can=clamp(enclosureAt(g,'sun'),0,1);
      if(st.chance(0.5)&&slope>0.13){
        const r=st.r(0.5,1.5);

  // THE SKY — accumulated puffs, softly shaded
  // The Vale's clouds were soft for a reason worth copying: they are built from
  // many small rounded puffs, and a small puff at half a kilometre subtends too
  // little of the view for its facets to register. A coarse surface stretched
  // over the whole formation cannot do that — its triangles are ten metres
  // across and its ridges read as a mountain range hung in the air.
  // So: puffs again, but shaded from the smooth normal of each puff rather than
  // per facet, which is what turns a heap of beads into an accumulated mass.
  // Formations, their positions and their lobes stay exactly as planned; only
  // how finely each puff is tessellated depends on quality.

    // six array slots. A jitter drawn from the stream per slot pulls those copies
    // apart and opens the puff along its own edges; at cloud scale each crack is
    // metres of sky through the middle of a cloud. Keyed to direction instead,
    // every copy of a corner lands on the same point.

function spawnLife(ev,frame,gNow){

    liveLife.push(L);

    mk('bird',st.i(3,5),(i,s)=>{
      const ahead=s.r(34,70), side=ev.side;

        vx:-lx*side*s.r(11,17)+tx*s.r(-2,4), vy:s.r(-0.5,0.9), vz:-lz*side*s.r(11,17)+tz*s.r(-2,4),

      const a=s.r(0,TAU), rr=s.r(10,52), ahead=s.r(150,330);
      const bx=fx+tx*ahead+lx*ev.side*s.r(40,150)+Math.cos(a)*rr;
      const bz=fz+tz*ahead+lz*ev.side*s.r(40,150)+Math.sin(a)*rr;

      if(P){ cx=P.cx+s.r(-P.rx*0.9,P.rx*0.9); cz=P.cz+s.r(-P.rz*0.9,P.rz*0.9); }
      else if(water){ const p=STREAM[Math.floor(s.f()*STREAM.length)]; cx=p.x+s.r(-4,4); cz=p.z+s.r(-4,4); }

    });

    // to forty-five metres out at half scale and bolted directly away at up to
    // four metres a second, fading inside three — a few pixels, moving away,
    // gone before the rider closed. It now does what a rabbit actually does:
    // sits close to the verge and freezes, lets itself be seen, and only then
    // hops away, unhurried.
    mk('animal',1,(i,s)=>{

        vz:lz*ev.side*s.r(1.5,2.5)+tz*s.r(0.4,1.4),sc:s.r(0.74,0.94),hop:s.r(4,6.5),
        ph:s.r(0,TAU),fade:s.r(5.0,7.0),wait:s.r(1.3,2.3)};

    // clinging to a tree that was culled, demoted, or never realised.

      const arr=bandTrees[b]; if(!arr) continue;

      const x=fx+tx*ahead+lx*off, z=fz+tz*ahead+lz*off;
      return {x,y:groundY(x,z),z,vx:lx*ev.side*s.r(0.8,1.6),vy:0,vz:lz*ev.side*s.r(0.8,1.6),
        sc:s.r(1.45,1.8),hop:0,ph:s.r(0,TAU),fade:s.r(4.5,7),wait:s.r(1.6,3.4)};

  }

let moteBoost=0;
function updateLife(dt){
  WL.uGlint.value.set(0,0,0,0);
  moteBoost=Math.max(0,moteBoost-dt*0.8);
  for(let i=liveLife.length-1;i>=0;i--){
    const L=liveLife[i];
    L.t+=dt;
    const fade=clamp(Math.min(L.t/1.2,(L.dur-L.t)/1.6),0,1);
    if(L.glint){
      const s=Math.sin(clamp(L.t/L.dur,0,1)*Math.PI);
      WL.uGlint.value.set(L.glint.x,L.glint.z,L.glint.r,s*0.85);
    }
    if(L.motes) moteBoost=Math.max(moteBoost,fade);
    if(L.kind){
      const im=POOLS[L.kind].im;
      for(let k=0;k<L.idx.length;k++){
        const p=L.parts[k], slot=L.idx[k];
        let sc=p.sc*fade;
        if(L.kind==='bird'){
          p.x+=p.vx*dt; p.z+=p.vz*dt;
          if(p.rise){ p.y+=p.vy*dt; p.vy=Math.max(0.6,p.vy-dt*0.35); }
          else p.y+=Math.sin(wTime*1.6+p.ph)*p.bob*dt;
          _le.set(0,Math.atan2(p.vx,p.vz),Math.sin(wTime*7+p.ph)*0.32);
          _lq.setFromEuler(_le); _lv.set(p.x,p.y,p.z); _ls.set(sc,sc,sc);
        } else if(L.kind==='flit'){
          const t=wTime*p.sp+p.ph;
          const x=p.ax+Math.sin(t)*p.span, z=p.az+Math.cos(t*0.77)*p.span;
          const y=p.ay+Math.sin(t*(p.water?2.6:1.7))*(p.water?0.22:0.55);
          _le.set(Math.sin(wTime*(p.water?26:13)+p.ph)*(p.water?0.25:0.95),Math.atan2(Math.cos(t),-Math.sin(t*0.77)),0);
          _lq.setFromEuler(_le); _lv.set(x,y,z); _ls.set(sc,sc,sc);
        } else if(p.cling){
          // A squirrel on a trunk: still for a moment with a tail-flick, then it
          // goes up. It never leaves the bark, so its height is driven along the
          // trunk rather than by velocity, and it faces out from the trunk.
          const C=p.cling;
          const climbT=Math.max(0,L.t-C.still);
          const y=Math.min(C.top,C.base+climbT*C.climb);
          const flick=Math.sin(wTime*7+p.ph)*0.05*(L.t<C.still?1:0.35);
          sc=p.sc*clamp(Math.min(L.t/0.5,(p.fade-L.t)/1.2),0,1);
          _le.set(0,Math.atan2(-C.lx*C.side,-C.lz*C.side)+flick,0);
          _lq.setFromEuler(_le);
          _lv.set(C.x-C.lx*C.side*C.r,y,C.z-C.lz*C.side*C.r); _ls.set(sc,sc,sc);

          _le.set(0,Math.atan2(p.vx,p.vz),0);
          _lq.setFromEuler(_le); _lv.set(p.x,gy+hop,p.z); _ls.set(sc,sc,sc);

// AIRBORNE — pollen, drifting leaves, high seed motes, and the shower.
// Everything advects; nothing bounces.
// ============================================================
const partSystems=[];
function particleField(n,box,tint,size,opacity,kind){
  const N=Math.max(1,Math.round(n*QCFG.part));
  const base=new Float32Array(N*3), seed=new Float32Array(N);
  const st=subStream('particles',kind);
  for(let i=0;i<N;i++){
    base[i*3]=st.r(0,box.x); base[i*3+1]=st.r(0,box.y); base[i*3+2]=st.r(0,box.z);
    seed[i]=st.r(0,1);

  g.setAttribute('aSeed',new THREE.BufferAttribute(seed,1));
  const m=new THREE.ShaderMaterial({
    transparent:true, depthWrite:false,
    uniforms:{ uWTime:WL.uWTime, uCam:{value:new THREE.Vector3()}, uGround:{value:0},
      uBox:{value:new THREE.Vector3(box.x,box.y,box.z)}, uTint:{value:new THREE.Color(tint)},
      uSize:{value:size}, uOp:{value:opacity}, uBoost:{value:1}, uWind:{value:WL.uCloudMove.value} },
    vertexShader:`attribute float aSeed; uniform float uWTime; uniform vec3 uCam; uniform vec3 uBox;
      uniform float uGround; uniform float uSize; uniform vec2 uWind; varying float vA;
      void main(){
        vec3 p=position;
        float t=uWTime;
        ${kind===0?`p.x+=uWind.x*t*0.55+sin(t*0.35+aSeed*31.0)*2.4; p.z+=uWind.y*t*0.55+cos(t*0.29+aSeed*17.0)*2.4;
                    p.y+=sin(t*0.42+aSeed*44.0)*0.9+t*0.06;`:''}
        ${kind===1?`p.x+=uWind.x*t*1.35+sin(t*0.62+aSeed*23.0)*3.2; p.z+=uWind.y*t*1.35+cos(t*0.51+aSeed*13.0)*3.2;
                    p.y-=mod(t*0.62+aSeed*40.0,uBox.y);`:''}
        ${kind===2?`p.x+=uWind.x*t*0.9+sin(t*0.22+aSeed*29.0)*5.0; p.z+=uWind.y*t*0.9+cos(t*0.19+aSeed*37.0)*5.0;
                    p.y+=mod(t*0.30+aSeed*33.0,uBox.y)*0.6;`:''}
        vec3 anchor=vec3(uCam.x,uGround,uCam.z);
        vec3 w=mod(p-anchor+uBox*0.5,uBox)-uBox*0.5+anchor;
        ${kind===1?`w.y=anchor.y+mod(p.y,uBox.y);`:''}
        ${kind!==1?`w.y=anchor.y+mod(p.y,uBox.y);`:''}
        float d=distance(w,uCam);
        vA=(1.0-smoothstep(48.0,110.0,d))*smoothstep(1.6,6.0,d);
        vec4 mv=viewMatrix*vec4(w,1.0);

      }`,
    fragmentShader:`uniform vec3 uTint; uniform float uOp; uniform float uBoost; varying float vA;
      void main(){

      }`,
  });

  pts.frustumCulled=false;
  scene.add(pts);
  partSystems.push({m,kind,n:N});

}
// Cut to roughly a quarter of what was here, and gated to the planned pockets

// It watches the same frame times the proof surface reports and walks the device
// pixel ratio down a fixed ladder when the world is missing frame budget, and
// back up when it has room to spare. Two rules keep it from being a flicker:
// a rung is only changed after the evidence has held for a run of frames, and
// never more often than once a second and a half. Every step is recorded, so a
// run that only met budget by dropping resolution cannot report a clean pass
// without also reporting how it got there.

let wTime=0, lastNow=performance.now(), camInit=false, pitchSm=null, eyePrevY=null;
let gPrevFrame=null;   // where the rider was on the previous rendered frame
let fixedStep=0;
const camFwd=new THREE.Vector3(0,0,1);
const windDrift=WL.uCloudMove.value;
const worldC=spineAt(L_TOTAL*0.5);
const _eye=new THREE.Vector3(), _fwd=new THREE.Vector3();
const _fpa=new THREE.Vector3(), _fpb=new THREE.Vector3();
// Two objects per frame is two objects per frame: at sixty frames a second for the
// twelve minutes of a ride that is eighty-six thousand allocations whose only
// purpose is to be collected again. Both are reused.
const _lat=new THREE.Vector3(), _camE=new THREE.Euler();
const CLOUD_SPAN=5200;

function updateWeather(dt){
  if(!WEATHER.has) return;
  const W=weatherState;
  if(W.phase==='clear'&&rider.g>WEATHER.startG&&rider.started){ W.phase='shower'; W.t=0; }
  if(W.phase==='shower'){
    W.t+=dt;
    const inR=smooth(0,10,W.t), outR=1-smooth(WEATHER.dur-13,WEATHER.dur,W.t);
    W.amount=WEATHER.strength*Math.min(inR,outR);
    if(W.t>=WEATHER.dur){ W.phase='done'; W.amount=0; }
  }
  WL.uWet.value=W.amount;
  rainMat.uniforms.uAmt.value=W.amount;
  rainMat.userData.pts.visible=W.amount>0.002;
  sun.intensity=2.75*(1-0.16*W.amount);       // the sun never leaves
  hemi.intensity=0.9*(1+0.12*W.amount);
}

function tick(){

  const now=performance.now();
  const dtRaw=(now-lastNow)/1000; lastNow=now;
  const dt=fixedStep>0?fixedStep:Math.min(dtRaw,0.05);
  wTime+=dt;
  frameId++; warmFrames++;
  if(warmFrames>20){ frameTimes.push(dtRaw*1000); if(frameTimes.length>600) frameTimes.shift();
    noteFrame(dtRaw*1000,chapterOf(rider.g)); }
  governResolution(dtRaw*1000,now);
  WL.uWTime.value=wTime;

  if(!rider.started){ rider.holdT+=dt; if(rider.holdT>=1.1) rider.started=true; }

    if(Math.abs(rider.g-POOL.apertureG)<60||Math.abs(rider.g-MOSSPOOL.g)<60) RUN.proximity.water=true;
    if(Math.abs(rider.g-HERO_G)<160) RUN.proximity.bellroot=true;
    if(Math.abs(rider.g-HERO_G)<26) RUN.marks.bellrootPassed=true;

    // own row spacing — past that a frame steps over a row of the road it is
    // supposed to be riding along, and the run is no longer a ride of this world.
    { const adv=Math.abs(rider.g-gPrevFrame);
      if(gPrevFrame!==null&&adv>RUN.maxStepM) RUN.maxStepM=Math.round(adv*1000)/1000;
      if(gPrevFrame!==null&&adv>QCFG.row){ RUN.stepOverruns++; markProvenance('debug'); }
      gPrevFrame=rider.g; }
    { let prev=0;
      for(const c of CH){ if(rider.g>=prev) checkpoints[c.key]=true; prev=c.end*L_TOTAL; } }
    const STOP=toLocal(rider.branch,S_STOP);
    if(rider.sM>STOP-9){
      rider.vT=Math.max(4,rider.vT-6*dt);
      rider.v=Math.min(rider.v,Math.max(0.30,(STOP-rider.sM)*0.32));

    oz=((oz%CLOUD_SPAN)+CLOUD_SPAN*1.5)%CLOUD_SPAN-CLOUD_SPAN/2;

  const yaw=Math.atan2(-camFwd.x,-camFwd.z)+yawOff;

  // frame gives its lower third back to the land instead of to the stone.
  const pitch=clamp(pitchSm+pitchOff+PITCH_BIAS,-0.55,0.5);
  const roll=clamp(-rider.lat*0.030-steer*0.010,-0.052,0.052)*clamp(rider.v/11,0,1);
  camRollDeg=Math.abs(roll)*180/Math.PI;

  camera.position.copy(_eye);
  _camE.set(pitch,yaw,roll,'YXZ');
  camera.quaternion.setFromEuler(_camE);

    sun.position.set(_eye.x+sunDir.x*240,_eye.y+sunDir.y*240,_eye.z+sunDir.z*240);
    sun.target.position.set(_eye.x+camFwd.x*22,eyeF.y,_eye.z+camFwd.z*22);
    sun.target.updateMatrixWorld();
  }
  for(const p of partSystems){
    p.m.uniforms.uCam.value.copy(_eye);
    p.m.uniforms.uGround.value=eyeF.y;

    // all; a scheduled mote event can still lift it briefly on top of that
    const air=airAmountAt(rider.g);

    }

      const sa=seenByRider(eye,a.x,a.y+1.0,a.z,3,1.0);

        const wx=P.cx+Math.cos(a)*P.rx*0.7, wz=P.cz+Math.sin(a)*P.rz*0.7;

    }
    if(Math.abs(rider.g-HERO_G)<520&&seenByRider(eye,HERO_POS.x,HERO_POS.y+18,HERO_POS.z,14,1.2)){
      RUN.seen.bellroot=true;
      if(RUN.seen.bellrootFirstSeenAtM===null) RUN.seen.bellrootFirstSeenAtM=Math.round(rider.g);
    }
    if(seenByRider(eye,SISTERS.x,SISTERS.y+16,SISTERS.z,20,1.0)){
      RUN.seen.sisters=true;
      if(RUN.seen.sistersFirstSeenAtM===null) RUN.seen.sistersFirstSeenAtM=Math.round(rider.g);
      RUN.seen.sistersLastSeenAtM=Math.round(rider.g);
      RUN.seen.sistersSeenSpanM=RUN.seen.sistersLastSeenAtM-RUN.seen.sistersFirstSeenAtM;
    }
  }

  renderer.render(scene,camera);
  lastInfo={calls:renderer.info.render.calls,tris:renderer.info.render.triangles};
  if(warmFrames>30){
    RUN.peakDrawCalls=Math.max(RUN.peakDrawCalls,lastInfo.calls);
    RUN.peakTriangles=Math.max(RUN.peakTriangles,lastInfo.tris);
  }
  renderer.info.reset();
}
