<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Afterlight Floodline</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#05060A; }
  canvas { display:block; }
  #hint {
    position:fixed; left:22px; bottom:16px; z-index:2; pointer-events:none;
    color:rgba(213,198,176,0.44); font:12px/1.4 system-ui, sans-serif;
    letter-spacing:0.13em; user-select:none;
  }
  #nogl {
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    color:#D5C6B0; font:14px/1.6 system-ui, sans-serif; background:#05060A; z-index:3;
    text-align:center; padding:0 32px; letter-spacing:0.08em;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="hint">W/S speed &middot; A/D line/fork &middot; mouse drag look &middot; Space pause &middot; R restart</div>
<div id="nogl">Afterlight Floodline needs WebGL2.<br>This browser or device did not provide a WebGL2 context.</div>
<script type="module">
import * as THREE from 'three';

/* ================================================================
   AFTERLIGHT FLOODLINE
   A seeded night cycling route through one sustained storm.
   Second edition of Afterlight Circuit — same city, following the water.

   ?seed=<integer>        default 1189   (0 is a valid seed)
   ?quality=low|standard|high|ultra       default standard
   ?d=<meters>            debug chapter inspection
   ?branch=<name>         debug fork setup
   ?camera=chase-proof    debug chase-camera readability check
   ================================================================ */

const qs = new URLSearchParams(location.search);

// ---------- seed ----------
const seedRaw = qs.get('seed');
const seedParsed = seedRaw === null ? NaN : Number.parseInt(seedRaw, 10);
const SEED = (Number.isFinite(seedParsed) ? seedParsed : 1189) | 0;   // seed 0 is honoured

// ---------- deterministic streams (no Math.random anywhere in this file) ----------
function mulberry32(a){
  a = a|0;
  return function(){
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a>>>15, 1|a);
    t = t + Math.imul(t ^ t>>>7, 61|t) ^ t;
    return ((t ^ t>>>14) >>> 0) / 4294967296;
  };
}
function stream(salt){ return mulberry32((SEED ^ salt) | 0); }
const RP = stream(0x00000000);   // world / route planning   (never touched by quality)
const RV = stream(0x51ED2701);   // visual realization
let   RA = stream(0x9E3779B9);   // ambient runtime schedule (re-seeded on restart)
const RA_SALT = 0x9E3779B9;

const clamp = THREE.MathUtils.clamp;
const lerp  = THREE.MathUtils.lerp;
const mkR = (rnd)=>({
  f: rnd,
  r: (a,b)=> a + (b-a)*rnd(),
  i: (a,b)=> Math.floor(a + (b-a+1)*rnd()),
  pick: (arr)=> arr[Math.min(arr.length-1, Math.floor(rnd()*arr.length))],
  chance: (p)=> rnd() < p,
});
const rp = mkR(RP), rv = mkR(RV);
let ra = mkR(RA);

// ---------- FNV-1a plan hashing ----------
function Hasher(){ let h = 0x811c9dc5>>>0; return {
  n(v){ const s = (Math.round(v*100)|0).toString(36); for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193)>>>0; } return this; },
  s(v){ const t = String(v); for(let i=0;i<t.length;i++){ h ^= t.charCodeAt(i); h = Math.imul(h, 0x01000193)>>>0; } return this; },
  get(){ return ('00000000' + h.toString(16)).slice(-8); },
  raw(){ return h>>>0; }
};}

// ---------- palette: eight anchors and derived values only ----------
const HEX = {
  ink:  0x05060A,   // road, void
  aub:  0x150A24,   // silhouette
  vio:  0x3C204D,   // wet violet structure
  teal: 0x7EA8B8,   // rain, transit, cool infrastructure
  rose: 0xC45D8C,   // rare human / failing light
  ora:  0xC85A2B,   // route warmth, repair culture
  amb:  0xE4AE59,   // public light
  pap:  0xD5C6B0,   // strongest neutral highlight
};
const col = h => new THREE.Color(h);
const scaleC = (c,m)=>{ const o=c.clone(); o.multiplyScalar(m); return o; };
function varyC(c,v,rnd){ const o=c.clone(); const m=1+(rnd.f()*2-1)*v; o.r=clamp(o.r*m,0,1); o.g=clamp(o.g*m,0,1); o.b=clamp(o.b*m,0,1); return o; }

// Facade masses: aubergine / wet-violet derivations. Zero neutral grey.
const FACADE_TONES = [
  col(0x150A24), col(0x1B0F2C), col(0x120A1E), col(0x1E1230),
  col(0x181026), col(0x241638), col(0x101624), col(0x1C1424),
];
const CONCRETE_TONES = [ col(0x141020), col(0x181326), col(0x110E1A), col(0x1B1528) ];
const METAL_TONES    = [ col(0x1E1730), col(0x261E38), col(0x171224), col(0x2A2140) ];

// ---------- quality ----------
const QUALITY_TIERS = {
  low:      { dprCap:1.0, renderScale:0.86, rain:2400, nearRain:140, splash:180, drones:8,  bloomDiv:8, bloomStrength:0.46, aniso:1,  mist:8  },
  standard: { dprCap:1.5, renderScale:1.0,  rain:4600, nearRain:340, splash:340, drones:14, bloomDiv:4, bloomStrength:0.52, aniso:4,  mist:16 },
  high:     { dprCap:2.0, renderScale:1.0,  rain:6400, nearRain:480, splash:470, drones:14, bloomDiv:4, bloomStrength:0.54, aniso:8,  mist:22 },
  ultra:    { dprCap:2.0, renderScale:1.12, rain:7800, nearRain:620, splash:600, drones:14, bloomDiv:2, bloomStrength:0.56, aniso:16, mist:28 },
};
const qReq = (qs.get('quality')||'').toLowerCase();
const QUALITY_REQUESTED = qReq || 'standard';
const QUALITY = QUALITY_TIERS[qReq] ? qReq : 'standard';
const Q = QUALITY_TIERS[QUALITY];
const QUALITY_NOTE = QUALITY_TIERS[qReq] || !qReq ? null
  : 'requested tier "'+qReq+'" is not available; standard presented instead';

// ---------- renderer ----------
const cv = document.createElement('canvas');
document.body.appendChild(cv);
let renderer = null;
function failGL(msg){
  const el = document.getElementById('nogl');
  el.innerHTML = 'Afterlight Floodline needs WebGL2.<br><span style="opacity:.6">'+msg+'</span>';
  el.style.display = 'flex';
  document.getElementById('hint').style.display = 'none';
}
try {
  renderer = new THREE.WebGLRenderer({ canvas: cv, antialias:false, powerPreference:'high-performance', alpha:false, stencil:false });
} catch(e){ failGL(String(e && e.message || e)); throw e; }
if (!renderer.capabilities.isWebGL2){ failGL('WebGL2 context unavailable.'); throw new Error('WebGL2 required'); }

const DPR = Math.min(window.devicePixelRatio || 1, Q.dprCap);
renderer.setPixelRatio(1);                    // the composer chain owns resolution
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.autoClear = true;
renderer.toneMapping = THREE.NoToneMapping;   // tone mapping happens once, in the grade pass
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.shadowMap.enabled = false;

const GL_INFO = (()=>{
  try {
    const gl = renderer.getContext();
    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
    return dbg ? String(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)) : String(gl.getParameter(gl.RENDERER));
  } catch(e){ return 'unknown'; }
})();
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy ? renderer.capabilities.getMaxAnisotropy() : 1;

const scene = new THREE.Scene();
scene.background = null;
const camera = new THREE.PerspectiveCamera(63, window.innerWidth/window.innerHeight, 0.14, 2600);

// A very small classic-light budget: only a handful of Lambert props use it.
scene.add(new THREE.HemisphereLight(0x241539, 0x08070E, 1.25));
const moon = new THREE.DirectionalLight(0x7EA8B8, 0.42); moon.position.set(-0.45,1,0.3); scene.add(moon);
const fillL = new THREE.DirectionalLight(0xC45D8C, 0.12); fillL.position.set(0.65,0.55,-0.5); scene.add(fillL);

// ---------- shared uniforms ----------
const ROAD_SAMPLES = 14;                       // rolling local road frame handed to water/rain shaders
const uRoadPts = []; for(let i=0;i<ROAD_SAMPLES;i++) uRoadPts.push(new THREE.Vector4(0,0,0,6));
const U = {
  uTime:      { value: 0 },     // ambient clock — never stops
  uRideTime:  { value: 0 },     // rider clock — stops on pause
  uCam:       { value: new THREE.Vector3() },
  uFogColor:  { value: col(0x0F0818) },
  uFogNear:   { value: 24 },
  uFogFar:    { value: 900 },
  uHazeY:     { value: 0.0 },
  uRoad:      { value: uRoadPts },
  uRoadY:     { value: 0 },
  uWind:      { value: new THREE.Vector2(0.42, 0.16) },
  uGust:      { value: 0 },
  uTramLight: { value: new THREE.Vector4(0,-9999,0,0) },   // xyz + intensity: the tram's cast pool
  uWeirGate:  { value: 0 },     // 0..1 lift of the moving gate leaf — drives spillway water
};

// ---------- GLSL chunks ----------
const GLSL_H = `
float h11(float p){ vec3 q=fract(vec3(p)*vec3(0.1031,0.1030,0.0973)); q+=dot(q,q.yzx+33.33); return fract((q.x+q.y)*q.z); }
float h21(vec2 p){ vec3 q=fract(vec3(p.xyx)*vec3(0.1031,0.1030,0.0973)); q+=dot(q,q.yzx+33.33); return fract((q.x+q.y)*q.z); }
vec2 h22(vec2 p){ vec3 q=fract(vec3(p.xyx)*vec3(0.1031,0.1030,0.0973)); q+=dot(q,q.yzx+33.33); return fract(vec2((q.x+q.y)*q.z,(q.y+q.z)*q.x)); }
float n2(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
  float a=h21(i), b=h21(i+vec2(1.0,0.0)), c=h21(i+vec2(0.0,1.0)), d=h21(i+vec2(1.0,1.0));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y); }
float fbm2(vec2 p){ float s=0.0, a=0.5; for(int i=0;i<4;i++){ s+=a*n2(p); p*=2.03; a*=0.5; } return s; }
float flick(float mode, float ph, float t){
  if(mode<0.5) return 0.88+0.12*sin(t*0.62+ph*6.2831);
  if(mode<1.5) return 0.58+0.46*sin(t*1.7+ph*6.2831);
  if(mode<2.5){ float h=h11(floor(t*10.0)+ph*97.0); float g=h11(floor(t*2.1)+ph*31.0); return (h<0.13?0.10:1.0)*(0.74+0.32*g); }
  if(mode<3.5){ return 0.10+step(mod(t*0.85+ph*3.0, 3.4), 1.35); }
  float h=h11(floor(t*5.0)+ph*53.0); return h<0.72?0.06:(0.92+0.34*h11(floor(t*23.0)+ph)); }
`;
const GLSL_FOG = `
uniform vec3 uFogColor; uniform float uFogNear; uniform float uFogFar; uniform float uHazeY;
float fogF(float z, float wy){
  float f = clamp((z-uFogNear)/(uFogFar-uFogNear), 0.0, 1.0);
  f = f*f*(3.0-2.0*f);
  float h = clamp(1.0 - (wy-uHazeY)/78.0, 0.0, 1.0);      // low ground holds more haze
  return clamp(f*(0.55+0.45*h), 0.0, 1.0);
}
`;
const GLSL_ROAD = `
uniform vec4 uRoad[${ROAD_SAMPLES}];
// distance from a world point to the local road ribbon, plus the ribbon's surface height
vec3 roadProbe(vec3 w){
  float best = 1e9; float by = 0.0; float bw = 6.0;
  for(int i=0;i<${ROAD_SAMPLES-1};i++){
    vec3 a = uRoad[i].xyz, b = uRoad[i+1].xyz;
    vec3 ab = b-a; float L2 = max(dot(ab.xz,ab.xz), 0.0001);
    float t = clamp(dot(w.xz-a.xz, ab.xz)/L2, 0.0, 1.0);
    vec3 p = a + ab*t;
    float d = length(w.xz-p.xz);
    if(d < best){ best = d; by = p.y; bw = mix(uRoad[i].w, uRoad[i+1].w, t); }
  }
  return vec3(best, by, bw);
}
`;

function shaderMat(o){
  const u = Object.assign({}, o.uniforms||{});
  u.uTime=U.uTime; u.uRideTime=U.uRideTime; u.uCam=U.uCam;
  u.uFogColor=U.uFogColor; u.uFogNear=U.uFogNear; u.uFogFar=U.uFogFar; u.uHazeY=U.uHazeY;
  u.uWind=U.uWind; u.uGust=U.uGust;
  if(o.road){ u.uRoad=U.uRoad; u.uRoadY=U.uRoadY; }
  if(o.tram){ u.uTramLight=U.uTramLight; }
  if(o.weir){ u.uWeirGate=U.uWeirGate; }
  const m = new THREE.ShaderMaterial({
    vertexShader:o.vs, fragmentShader:o.fs, uniforms:u,
    transparent:!!o.transparent,
    depthWrite:o.depthWrite!==undefined?o.depthWrite:true,
    depthTest:o.depthTest!==undefined?o.depthTest:true,
    blending:o.blending||THREE.NormalBlending,
    side:o.side||THREE.FrontSide,
    polygonOffset:!!o.polygonOffset, polygonOffsetFactor:o.polygonOffsetFactor||0, polygonOffsetUnits:o.polygonOffsetUnits||0,
  });
  return m;
}

// ================================================================
// WORLD PLAN — built entirely from the planning stream, before any
// quality-specific realization. Quality never reaches this section.
// ================================================================
const G = 54;                       // street centre-to-centre pitch
const IMAX = 21, JLAND = 24;        // buildable city cell extent
const BAYJ = 25;                    // first water row
const cellX = i => i*G + 30;
const cellZ = j => j*G + 30;
const BAY_Z = cellZ(BAYJ) - G*0.5;  // shoreline

const DIRS = [[0,1],[1,0],[0,-1],[-1,0]];   // N(+z) E(+x) S(-z) W(-x)
const leftOf  = d => (d+1)&3;
const rightOf = d => (d+3)&3;

function keyframeY(keys, t){
  for(let k=1;k<keys.length;k++){
    if(t <= keys[k][0] || k === keys.length-1){
      const a=keys[k-1], b=keys[k];
      const u = clamp((t-a[0])/Math.max(1e-6,b[0]-a[0]), 0, 1);
      return lerp(a[1], b[1], u*u*(3-2*u));
    }
  }
  return keys[keys.length-1][1];
}

const PLAN = (function buildPlan(){
  const P = { seed: SEED };

  // ---- hero placement -------------------------------------------------
  const rcI = rp.i(10,14), rcJ = rp.i(9,12);
  const approachSide = rp.chance(0.5) ? -1 : 1;
  P.raincatcher = { i:rcI, j:rcJ, x:cellX(rcI)+rp.r(-8,8), z:cellZ(rcJ)+rp.r(-8,8), side:approachSide, tilt: rp.r(-0.22,0.22) };

  const weirI = clamp(rcI + rp.i(-3,3), 6, IMAX-4);
  P.weir = { i:weirI, x:cellX(weirI)+rp.r(-16,16), skew: rp.r(-0.2,0.2), leaves: rp.i(5,7), z:0 };

  // ---- elevated tram line --------------------------------------------
  const tramJ = rp.i(5,7);
  const tramI = clamp(rcI + rp.i(2,4), 5, IMAX-2);
  const tramJ2 = clamp(rcJ + rp.i(4,6), tramJ+5, JLAND-3);
  P.tram = {
    j:tramJ, i:tramI, j2:tramJ2,
    pts: [ [-110, cellZ(tramJ)], [cellX(tramI), cellZ(tramJ)], [cellX(tramI), cellZ(tramJ2)], [cellX(IMAX)+140, cellZ(tramJ2)] ],
    deckY: rp.r(15.8,17.4),
    period: rp.r(82,98),
    phase: rp.r(0,1),
  };

  // ---- chapters -------------------------------------------------------
  const CH = [
    { key:'lower',    name:'Lower Blocks',        y0:0.0,  y1:4.5  },
    { key:'throat',   name:'Tram Throat',         y0:4.5,  y1:9.5  },
    { key:'promise',  name:'Raincatcher Promise', y0:9.5,  y1:30.0 },
    { key:'split',    name:'The Split',           y0:30.0, y1:20.0 },
    { key:'pressure', name:'Pressure District',   y0:20.0, y1:5.0  },
    { key:'causeway', name:'Floodline Causeway',  y0:5.0,  y1:3.6  },
    { key:'weir',     name:'The Last Weir',       y0:3.6,  y1:30.0 },
  ];
  P.chapters = CH;

  // ---- route walker ---------------------------------------------------
  const nodes = [];
  const used = new Set();
  const isUsed = (i,j)=> used.has(i*100+j);
  const inB = (i,j)=> i>=1 && i<=IMAX-1 && j>=0 && j<=JLAND-1;

  let ci = clamp(rcI + rp.i(-1,1), 2, IMAX-2), cj = 1, cd = 0;
  const startCell = { i:ci, j:cj };
  const pushNode = (ch)=> nodes.push({ i:ci, j:cj, x:cellX(ci), z:cellZ(cj), chapter:ch, y:0 });
  used.add(ci*100+cj); pushNode('lower');

  function stepLeg(dirIdx, run, ch, allowUsed){
    const d = DIRS[dirIdx];
    let moved = 0;
    for(let k=0;k<run;k++){
      const ni = ci + d[0], nj = cj + d[1];
      if(!inB(ni,nj)) break;
      if(!allowUsed && isUsed(ni,nj)) break;
      ci = ni; cj = nj; moved++; used.add(ci*100+cj);
    }
    if(moved>0){ cd = dirIdx; pushNode(ch); }
    return moved;
  }
  // A leg never moves away from its anchor, so a chapter's length is its
  // Manhattan distance plus exactly two cells per authored detour. That is
  // what keeps every seed inside the ride-duration contract.
  function walkTo(ti, tj, ch, minRun, maxRun, detours){
    let guard = 0, pending = detours|0;
    while((ci!==ti || cj!==tj) && guard++ < 90){
      const dx = ti-ci, dz = tj-cj;
      const good = [], bad = [];
      for(let k=0;k<4;k++){
        if(k === cd || k === ((cd+2)&3)) continue;
        const g = DIRS[k][0]*Math.sign(dx) + DIRS[k][1]*Math.sign(dz);
        (g > 0 ? good : bad).push(k);
      }
      if(pending > 0 && bad.length && rp.f() < 0.55){
        if(stepLeg(rp.pick(bad), 1, ch) > 0){ pending--; continue; }
      }
      if(good.length){
        const k = (good.length > 1 && rp.chance(0.5)) ? good[1] : good[0];
        const avail = Math.max(1, Math.abs(DIRS[k][0] !== 0 ? dx : dz));
        const run = Math.min(rp.i(minRun, maxRun), avail);
        if(stepLeg(k, run, ch) === 0 && stepLeg(k, 1, ch, true) === 0) break;
        continue;
      }
      const k = (dx !== 0) ? (dx>0?1:3) : (dz>0?0:2);
      if(k === ((cd+2)&3)){
        if(stepLeg(rp.chance(0.5)?leftOf(cd):rightOf(cd), 1, ch, true) === 0) break;
        continue;
      }
      const avail = Math.max(1, Math.abs(dx !== 0 ? dx : dz));
      if(stepLeg(k, Math.min(rp.i(minRun,maxRun), avail), ch, true) === 0) break;
    }
  }
  // Every leg is length-governed: an anchor is pulled in until it is within
  // its cell budget, then detours top the chapter up. Route length therefore
  // stays inside the ride-duration contract for every seed, not just the default.
  function capAnchor(ti, tj, budget){
    let di = ti-ci, dj = tj-cj;
    while(Math.abs(di)+Math.abs(dj) > budget){
      if(Math.abs(di) >= Math.abs(dj)) di -= Math.sign(di); else dj -= Math.sign(dj);
      if(di === 0 && dj === 0) break;
    }
    return [clamp(ci+di, 1, IMAX-1), clamp(cj+dj, 0, JLAND-1)];
  }
  const detoursFor = (ti,tj,budget)=> Math.max(0, Math.min(4, Math.round((budget - (Math.abs(ti-ci)+Math.abs(tj-cj)))/2)));
  function go(ti, tj, ch, minRun, maxRun, budget){
    const a = capAnchor(ti, tj, budget);
    walkTo(a[0], a[1], ch, minRun, maxRun, detoursFor(a[0], a[1], budget));
    return a;
  }

  // 1 — Lower Blocks: the hero avenue straight at the Raincatcher, then workshop streets
  const openRun = rp.i(3,4);
  stepLeg(0, openRun, 'lower');
  {
    const t1i = clamp(rcI - approachSide*rp.i(4,6), 2, IMAX-3);
    const t1j = clamp(openRun + rp.i(2,3), 3, Math.max(4, tramJ-1));
    go(t1i, t1j, 'lower', 1, 2, 12-openRun);
  }
  // 2 — Tram Throat: reach the viaduct street, then run the length of it
  {
    const t2i = clamp(tramI - rp.i(3,5), 2, IMAX-3);
    go(t2i, tramJ, 'throat', 1, 2, 5);
  }
  stepLeg(1, rp.i(3,4), 'throat') || stepLeg(3, rp.i(3,4), 'throat');   // the compression run
  {
    const t2i = clamp(tramI + rp.i(-1,1), 2, IMAX-2), t2j = clamp(tramJ + rp.i(1,2), 0, JLAND-1);
    go(t2i, t2j, 'throat', 1, 2, 3);
  }
  // 3 — Raincatcher Promise: the sustained climb, approached from a seeded side
  {
    const t3i = clamp(rcI + approachSide*rp.i(2,3), 2, IMAX-2), t3j = clamp(rcJ - rp.i(2,3), 3, JLAND-2);
    go(t3i, t3j, 'promise', 1, 3, 5);
    const t4i = clamp(rcI + approachSide, 2, IMAX-2), t4j = clamp(rcJ - 1, 3, JLAND-2);
    go(t4i, t4j, 'promise', 1, 2, 3);
    // ride past the foot of the hero, then leave it behind before the split
    const t5j = clamp(rcJ + rp.i(2,3), t4j+2, JLAND-3);
    go(t4i, t5j, 'promise', 2, 3, 3);
    const t6i = clamp(rcI + approachSide*rp.i(2,3), 2, IMAX-2);
    go(t6i, t5j, 'promise', 1, 2, 2);
  }

  // 4 — The Split
  const forkIdx = nodes.length - 1;
  const fi = ci, fj = cj, fd = cd;
  const rejI = clamp(rcI + rp.i(1,4), 3, IMAX-2);
  const rejJ = clamp(rcJ + rp.i(5,7), fj+4, JLAND-6);
  const leftIsLedge = rp.chance(0.5);

  function branchWalk(kind){
    ci = fi; cj = fj; cd = fd;
    const before = nodes.length;
    const goLeft = (kind === 'ledgeline') ? leftIsLedge : !leftIsLedge;
    stepLeg(goLeft ? leftOf(fd) : rightOf(fd), kind==='ledgeline' ? rp.i(1,2) : 1, 'split');
    if(kind === 'ledgeline'){
      // long exposed spans, wide sightlines, few corners
      const ai = clamp(rejI + (goLeft?-1:1)*rp.i(1,2), 2, IMAX-2), aj = clamp(rejJ - rp.i(2,3), 2, JLAND-2);
      go(ai, aj, 'split', 2, 3, 7);
    } else {
      // tight sheltered bays, short corners, more of them
      const ai = clamp(rejI + (goLeft?-1:1)*rp.i(2,3), 2, IMAX-2), aj = clamp(fj + rp.i(2,3), 2, JLAND-2);
      go(ai, aj, 'split', 1, 1, 5);
      const bi = clamp(rejI + (goLeft?-1:1), 2, IMAX-2), bj = clamp(rejJ - rp.i(2,3), 2, JLAND-2);
      go(bi, bj, 'split', 1, 2, 4);
    }
    walkTo(rejI, rejJ-1, 'split', 1, 2, 0);   // the merge approach is never padded
    if(cd !== 0) stepLeg(0, 1, 'split', true); else { nodes.pop(); cj = rejJ; used.add(ci*100+cj); pushNode('split'); }
    const path = nodes.splice(before);
    return path;
  }
  const pathLedge = branchWalk('ledgeline');
  const pathUnder = branchWalk('underworks');
  ci = rejI; cj = rejJ; cd = 0;
  const tailStart = nodes.length;

  // 5 — Pressure District: the controlled descent through the water works
  {
    const p1i = clamp(rcI + rp.i(1,4), 3, IMAX-2), p1j = clamp(rejJ + rp.i(3,4), 0, JLAND-4);
    go(p1i, p1j, 'pressure', 1, 2, 5);
    const p2i = clamp(weirI + rp.i(-2,0), 2, IMAX-2);
    go(p2i, JLAND-1, 'pressure', 1, 2, 5);
  }
  const shoreNode = nodes[nodes.length-1];

  // measure the land route so the crossing can be tuned to a seeded total
  let landLen = 0;
  {
    const seq = nodes.slice(0, forkIdx+1).concat(pathLedge, nodes.slice(tailStart));
    for(let k=1;k<seq.length;k++) landLen += Math.hypot(seq[k].x-seq[k-1].x, seq[k].z-seq[k-1].z);
  }
  const targetLen = rp.r(3560, 4060);
  const weirLen = rp.r(262, 318);
  const causewayLen = clamp(targetLen - landLen - weirLen, 440, 900);

  // 6 — Floodline Causeway: one long open crossing of black water
  const cx0 = shoreNode.x, cz0 = Math.max(shoreNode.z, BAY_Z - 40);
  const weirX = clamp(P.weir.x, cx0-190, cx0+190);
  P.weir.x = weirX;
  const jog = rp.r(-34, 34);
  const csSegs = 4;
  for(let k=1;k<=csSegs;k++){
    const t = k/csSegs;
    const x = lerp(cx0, weirX, t*t*(3-2*t)) + Math.sin(t*Math.PI)*jog;
    const z = cz0 + causewayLen*t;
    nodes.push({ i:Math.round((x-30)/G), j:Math.round((z-30)/G), x, z, chapter:'causeway', y:0 });
  }
  // 7 — The Last Weir: the climb onto the storm defence and the authored arrival
  const wz = cz0 + causewayLen;
  P.weir.z = wz + weirLen*0.62;
  const wkeys = [0.0, 0.32, 0.62, 0.84, 1.0];
  for(let k=0;k<wkeys.length;k++){
    const t = wkeys[k];
    nodes.push({ i:Math.round((weirX-30)/G), j:Math.round((wz+weirLen*t-30)/G),
                 x: weirX + Math.sin(t*2.1)*rp.r(2,6)*(k<4?1:0.4), z: wz + weirLen*t, chapter:'weir', y:0 });
  }

  // ---- assemble the two branch node lists ----------------------------
  const head = nodes.slice(0, forkIdx+1);
  const tail = nodes.slice(tailStart);
  P.fork = {
    index: forkIdx,
    leftBranch:  leftIsLedge ? 'ledgeline' : 'underworks',
    rightBranch: leftIsLedge ? 'underworks' : 'ledgeline',
    rejoin: { i:rejI, j:rejJ },
    nodesLedge: pathLedge.length, nodesUnder: pathUnder.length,
    headNodes: head.length, tailNodes: tail.length,
    defaultBranch: leftIsLedge ? 'underworks' : 'ledgeline',   // centred line falls to the sheltered road
  };
  P.startCell = startCell;
  P.causewayLen = causewayLen;

  // ---- heights --------------------------------------------------------
  const SPLIT_Y = {
    ledgeline:  [[0,30],[0.24,35.4],[0.56,36.2],[0.80,28.0],[1,20]],
    underworks: [[0,30],[0.18,17.0],[0.36,7.6],[0.64,7.4],[0.84,13.5],[1,20]],
  };
  function applyHeights(list, branchKey){
    const chIdx = {};
    list.forEach((n,k)=>{ (chIdx[n.chapter] = chIdx[n.chapter] || []).push(k); });
    for(const ch of CH){
      const idx = chIdx[ch.key]; if(!idx || !idx.length) continue;
      const n0 = idx[0], n1 = idx[idx.length-1];
      const cum = [0];
      for(let k=n0+1;k<=n1;k++) cum.push(cum[cum.length-1] + Math.hypot(list[k].x-list[k-1].x, list[k].z-list[k-1].z));
      const total = Math.max(1, cum[cum.length-1]);
      for(let k=n0;k<=n1;k++){
        const t = cum[k-n0]/total;
        let y;
        if(ch.key === 'split') y = keyframeY(SPLIT_Y[branchKey], t);
        else {
          y = lerp(ch.y0, ch.y1, t*t*(3-2*t));
          if(ch.key==='lower')    y += Math.sin(t*7.3+0.6)*0.85;
          if(ch.key==='throat')   y += Math.sin(t*5.1+1.7)*0.65;
          if(ch.key==='causeway') y += Math.sin(t*4.4)*0.5;
          if(ch.key==='weir' && t>0.86) y = lerp(y, ch.y1, (t-0.86)/0.14);
        }
        list[k].y = y;
      }
    }
    return list;
  }
  const cloneList = arr => arr.map(n=>({ i:n.i, j:n.j, x:n.x, z:n.z, chapter:n.chapter, y:0 }));
  P.nodesA = applyHeights(cloneList(head.concat(pathLedge, tail)), 'ledgeline');
  P.nodesB = applyHeights(cloneList(head.concat(pathUnder, tail)), 'underworks');

  function turnsOf(list){
    let t=0, pd=-1;
    for(let k=1;k<list.length;k++){
      const dx=Math.sign(list[k].x-list[k-1].x), dz=Math.sign(list[k].z-list[k-1].z);
      const d = Math.abs(list[k].x-list[k-1].x) > Math.abs(list[k].z-list[k-1].z) ? (dx>0?1:3) : (dz>0?0:2);
      if(pd>=0 && d!==pd) t++;
      pd=d;
    }
    return t;
  }
  P.turnsA = turnsOf(P.nodesA); P.turnsB = turnsOf(P.nodesB);

  // ---- districts ------------------------------------------------------
  const DKEYS = ['lower','terrace','tramworks','market','pumpworks','remnant','stormwall'];
  const kinds = DKEYS.slice();
  for(let k=kinds.length-1;k>0;k--){ const m = rp.i(0,k); const t=kinds[k]; kinds[k]=kinds[m]; kinds[m]=t; }
  const bands = [[0,5],[2,8],[5,11],[8,14],[11,17],[14,20],[17,23],[3,12],[12,21]];
  const seeds = [];
  for(let k=0;k<bands.length;k++)
    seeds.push({ i: rp.i(1,IMAX-1), j: rp.i(bands[k][0], bands[k][1]), key: kinds[k % kinds.length] });
  const district = new Map();
  for(let i=0;i<=IMAX;i++) for(let j=0;j<=JLAND;j++){
    let best=1e9, key='lower';
    for(const s of seeds){ const d=(s.i-i)*(s.i-i)*1.12 + (s.j-j)*(s.j-j); if(d<best){ best=d; key=s.key; } }
    if(Math.abs(j-tramJ)<=1 || (Math.abs(i-tramI)<=1 && j>=tramJ && j<=tramJ2)) key='tramworks';
    if(Math.abs(i-rcI)<=2 && Math.abs(j-rcJ)<=2) key='pumpworks';
    if(j>=JLAND-3) key='stormwall';
    district.set(i*100+j, key);
  }
  P.districts = district;
  P.districtSeeds = seeds;

  // ---- ambient event schedule ----------------------------------------
  const ev = [];
  const evCount = rp.i(12,16);
  for(let k=0;k<evCount;k++)
    ev.push({ kind: rp.pick(['tram-pass','sign-fail','gate-cycle','skiff-pass','drone-sweep','sluice-surge']),
              t: rp.r(4, 400), dur: rp.r(6, 26), a: rp.r(0,1), b: rp.r(0,1) });
  ev.sort((x,y)=> x.t - y.t);
  P.events = ev;

  // ---- traffic identities ---------------------------------------------
  const VK = ['van','sweeper','utility','trike','cart','hauler','taxi'];
  P.groundVehicles = [];
  for(let k=0;k<7;k++)
    P.groundVehicles.push({ kind: VK[k % VK.length], speed: rp.r(5.4, 10.8), t0: rp.r(0,1),
      i: rp.i(2, IMAX-2), j: rp.i(1, JLAND-2), axis: rp.chance(0.5)?0:1, dir: rp.chance(0.5)?1:-1,
      span: rp.i(4, 9), tint: rp.i(0,3), side: rp.chance(0.5)?1:-1 });
  P.drones = [];
  for(let k=0;k<14;k++)
    P.drones.push({ x: rp.r(70, cellX(IMAX-1)), z: rp.r(70, cellZ(JLAND-2)), y: rp.r(44, 172),
      r: rp.r(44, 190), speed: rp.r(0.055, 0.17), t0: rp.r(0,1), tilt: rp.r(-0.2,0.2), kind: rp.i(0,2), blink: rp.r(0,1) });
  P.skiffs = [];
  for(let k=0;k<3;k++)
    P.skiffs.push({ x0: rp.r(120, cellX(IMAX)-40), z0: rp.r(BAY_Z+90, P.weir.z-90),
      dx: rp.r(-210, 210), dz: rp.r(-150, 150), speed: rp.r(0.017, 0.04), t0: rp.r(0,1), kind: rp.i(0,1) });

  return P;
})();

// ---------- plan hashes ----------
const HASHES = (function(){
  const hr = Hasher(), hc = Hasher(), he = Hasher();
  hr.s('route').n(SEED);
  for(const n of PLAN.nodesA) hr.n(n.x).n(n.z).n(n.y).s(n.chapter);
  for(const n of PLAN.nodesB) hr.n(n.x).n(n.z).n(n.y).s(n.chapter);
  hr.s(PLAN.fork.leftBranch).n(PLAN.fork.index).n(PLAN.fork.rejoin.i).n(PLAN.fork.rejoin.j).n(PLAN.causewayLen);
  hr.n(PLAN.raincatcher.x).n(PLAN.raincatcher.z).n(PLAN.raincatcher.side)
    .n(PLAN.weir.x).n(PLAN.weir.z).n(PLAN.weir.leaves).n(PLAN.weir.skew);

  hc.s('city').n(SEED);
  for(const s of PLAN.districtSeeds) hc.n(s.i).n(s.j).s(s.key);
  for(const t of PLAN.tram.pts) hc.n(t[0]).n(t[1]);
  hc.n(PLAN.tram.deckY).n(PLAN.tram.period).n(PLAN.tram.phase).n(PLAN.startCell.i);

  he.s('events').n(SEED);
  for(const e of PLAN.events) he.s(e.kind).n(e.t).n(e.dur).n(e.a).n(e.b);
  for(const v of PLAN.groundVehicles) he.s(v.kind).n(v.i).n(v.j).n(v.speed).n(v.t0).n(v.axis).n(v.dir).n(v.span);
  for(const d of PLAN.drones) he.n(d.x).n(d.z).n(d.y).n(d.r).n(d.speed).n(d.t0);
  for(const s of PLAN.skiffs) he.n(s.x0).n(s.z0).n(s.dx).n(s.dz).n(s.speed);

  const route = hr.get(), city = hc.get(), events = he.get();
  const hw = Hasher(); hw.s(route).s(city).s(events).n(SEED);
  return { route, city, events, world: hw.get() };
})();

// ================================================================
// ROUTE REALIZATION — one representation drives road, city and rider
// ================================================================
const CH_INDEX = {}; PLAN.chapters.forEach((c,k)=>CH_INDEX[c.key]=k);
const SEC = { STREET:0, VIADUCT:1, ARCADE:2, CAUSEWAY:3, CREST:4 };

function roundPolyline(nodes){
  const out = [];
  const RCMAX = 17;
  for(let i=0;i<nodes.length;i++){
    const P = new THREE.Vector3(nodes[i].x, nodes[i].y, nodes[i].z);
    P.ch = nodes[i].chapter;
    if(i===0){ out.push(P); continue; }
    const Q = new THREE.Vector3(nodes[i-1].x, nodes[i-1].y, nodes[i-1].z);
    const seg = P.clone().sub(Q); const segL = Math.hypot(seg.x, seg.z) || 1;
    const dirIn = new THREE.Vector3(seg.x/segL, 0, seg.z/segL);
    const rc = Math.min(RCMAX, segL*0.36);
    const prevExit = out[out.length-1];
    const entry = new THREE.Vector3(P.x - dirIn.x*rc, lerp(Q.y, P.y, 1-rc/segL), P.z - dirIn.z*rc);
    entry.ch = nodes[i].chapter;
    const span = entry.clone().sub(prevExit); const spanL = Math.hypot(span.x, span.z);
    const steps = Math.max(1, Math.round(spanL/26));
    for(let s=1;s<steps;s++){
      const t = s/steps;
      const p = new THREE.Vector3(prevExit.x+span.x*t, prevExit.y+(entry.y-prevExit.y)*t, prevExit.z+span.z*t);
      p.ch = nodes[i].chapter; out.push(p);
    }
    out.push(entry);
    if(i === nodes.length-1){ out.push(P); break; }
    const N2 = new THREE.Vector3(nodes[i+1].x, nodes[i+1].y, nodes[i+1].z);
    const seg2 = N2.clone().sub(P); const seg2L = Math.hypot(seg2.x, seg2.z) || 1;
    const dirOut = new THREE.Vector3(seg2.x/seg2L, 0, seg2.z/seg2L);
    const rc2 = Math.min(RCMAX, seg2L*0.36);
    const exit = new THREE.Vector3(P.x + dirOut.x*rc2, lerp(P.y, N2.y, rc2/seg2L), P.z + dirOut.z*rc2);
    exit.ch = nodes[i+1].chapter;
    const mid = new THREE.Vector3((entry.x+exit.x)/2, (entry.y+exit.y)/2, (entry.z+exit.z)/2).lerp(P, 0.55);
    mid.ch = nodes[i].chapter;
    out.push(mid);
    out.push(exit);
  }
  return { pts: out };
}

const STEP = 0.7;
function buildBranch(nodes, branchKey){
  const rounded = roundPolyline(nodes);
  const curve = new THREE.CatmullRomCurve3(rounded.pts, false, 'centripetal');
  const LEN = curve.getLength();
  const NF = Math.ceil(LEN/STEP);
  const st = LEN/NF;
  const pts = curve.getSpacedPoints(NF);
  const F = {
    key: branchKey, LEN, NF, STEP: st,
    x:new Float32Array(NF+1), y:new Float32Array(NF+1), z:new Float32Array(NF+1),
    tx:new Float32Array(NF+1), ty:new Float32Array(NF+1), tz:new Float32Array(NF+1),
    lx:new Float32Array(NF+1), lz:new Float32Array(NF+1),
    k:new Float32Array(NF+1), hw:new Float32Array(NF+1), gw:new Float32Array(NF+1), grade:new Float32Array(NF+1),
    sec:new Uint8Array(NF+1), ch:new Uint8Array(NF+1),
    ux:new Float32Array(NF+1), uz:new Float32Array(NF+1),      // un-offset centreline (shared road geometry)
    off:new Float32Array(NF+1),                                // baked fork throat offset, signed
  };
  for(let i=0;i<=NF;i++){ F.x[i]=pts[i].x; F.y[i]=pts[i].y; F.z[i]=pts[i].z; }
  const yaw = new Float32Array(NF+1);
  for(let i=0;i<=NF;i++){
    const a=Math.max(0,i-1), b=Math.min(NF,i+1);
    let tx=F.x[b]-F.x[a], ty=F.y[b]-F.y[a], tz=F.z[b]-F.z[a];
    const l=Math.hypot(tx,ty,tz)||1; tx/=l; ty/=l; tz/=l;
    F.tx[i]=tx; F.ty[i]=ty; F.tz[i]=tz;
    const hl=Math.hypot(tx,tz)||1;
    F.lx[i]=tz/hl; F.lz[i]=-tx/hl;
    F.grade[i]=ty;
    yaw[i]=Math.atan2(-tx,-tz);
  }
  const wrapPi = a=>{ while(a>Math.PI)a-=2*Math.PI; while(a<-Math.PI)a+=2*Math.PI; return a; };
  const kRaw = new Float32Array(NF+1);
  for(let i=1;i<NF;i++) kRaw[i]=wrapPi(yaw[i+1]-yaw[i-1])/(2*st);
  for(let i=0;i<=NF;i++){ let s=0,n=0; for(let j=Math.max(0,i-13);j<=Math.min(NF,i+13);j++){ s+=kRaw[j]; n++; } F.k[i]=s/n; }

  // chapter boundaries come from where each design node actually falls on the
  // arc-length curve — not from a nearest-point guess that can stall
  {
    const marks = [{ d:0, c:CH_INDEX[nodes[0].chapter] || 0 }];
    let fi = 0;
    for(let n=1;n<nodes.length;n++){
      let best = 1e9, bi = fi;
      for(let i=fi;i<=NF;i++){
        const dd = (F.x[i]-nodes[n].x)**2 + (F.z[i]-nodes[n].z)**2;
        if(dd < best){ best = dd; bi = i; }
        else if(i - bi > 260) break;
      }
      fi = bi;
      const c = CH_INDEX[nodes[n].chapter] || 0;
      if(c !== marks[marks.length-1].c) marks.push({ d: bi*st, c });
    }
    let mi = 0;
    for(let i=0;i<=NF;i++){
      const d = i*st;
      while(mi < marks.length-1 && d >= marks[mi+1].d) mi++;
      F.ch[i] = marks[mi].c;
    }
    for(let i=1;i<=NF;i++) if(F.ch[i] < F.ch[i-1]) F.ch[i] = F.ch[i-1];
  }
  const CI = CH_INDEX;
  for(let i=0;i<=NF;i++){
    const c = F.ch[i], y = F.y[i];
    let sec = SEC.STREET;
    if(c === CI.causeway) sec = SEC.CAUSEWAY;
    else if(c === CI.weir) sec = (F.z[i] > PLAN.weir.z - 46) ? SEC.CREST : SEC.CAUSEWAY;
    else if(c === CI.split && branchKey === 'underworks' && y < 15) sec = SEC.ARCADE;
    else if(y > 12.5) sec = SEC.VIADUCT;
    F.sec[i] = sec;
    F.hw[i] = sec===SEC.ARCADE ? 5.05 : sec===SEC.CAUSEWAY ? 5.6 : sec===SEC.CREST ? 5.05 : sec===SEC.VIADUCT ? 5.25 : 5.35;
    F.gw[i] = F.hw[i];
    F.ux[i] = F.x[i]; F.uz[i] = F.z[i];
  }
  return F;
}

const BR = { ledgeline: buildBranch(PLAN.nodesA, 'ledgeline'), underworks: buildBranch(PLAN.nodesB, 'underworks') };
const BRANCH_KEYS = ['ledgeline','underworks'];

// ---- fork / rejoin arc distances + baked throat offsets --------------
const FORKGEO = (function(){
  const fnode = PLAN.nodesA[PLAN.fork.index];
  const rnode = PLAN.fork.rejoin;
  const rx = cellX(rnode.i), rz = cellZ(rnode.j);
  function findD(F, x, z, from, to){
    let best=1e9, bd=0;
    const i0 = Math.max(0, Math.floor(from/F.STEP)), i1 = Math.min(F.NF, Math.ceil(to/F.STEP));
    for(let i=i0;i<=i1;i++){ const d=(F.x[i]-x)**2 + (F.z[i]-z)**2; if(d<best){ best=d; bd=i*F.STEP; } }
    return bd;
  }
  const D_FORK = findD(BR.ledgeline, fnode.x, fnode.z, 0, BR.ledgeline.LEN);
  const RJ = {
    ledgeline:  findD(BR.ledgeline,  rx, rz, D_FORK+120, BR.ledgeline.LEN),
    underworks: findD(BR.underworks, rx, rz, D_FORK+120, BR.underworks.LEN),
  };
  // The split is a real Y: the shared road opens out, a kerbed island noses
  // between two throats, and the branches leave on their own centrelines.
  const OFF = 6.4;                     // throat centre offset
  const RAMP = 46;                     // metres of drift into and out of a throat
  const THROAT = 5.0;                  // throat geometry half-width
  const MSEP = 0.78;                   // offset fraction at which the throats separate cleanly
  const sideOf = { ledgeline: PLAN.fork.leftBranch==='ledgeline' ? 1 : -1,
                   underworks: PLAN.fork.leftBranch==='underworks' ? 1 : -1 };
  const range = {};
  for(const key of BRANCH_KEYS){
    const F = BR[key], side = sideOf[key], rj = RJ[key];
    const mEnd = rj - 12;              // offsets are fully gone this far before the merge point
    let dA = D_FORK, dB = mEnd;
    for(let i=0;i<=F.NF;i++){
      const d = i*F.STEP;
      let m = 0;
      if(d > D_FORK-RAMP && d < D_FORK) m = smooth01((d-(D_FORK-RAMP))/RAMP);
      else if(d >= D_FORK && d <= mEnd-RAMP) m = 1;
      else if(d > mEnd-RAMP && d < mEnd) m = 1 - smooth01((d-(mEnd-RAMP))/RAMP);
      F.off[i] = side*OFF*m;
      if(m > 0){ F.x[i] += F.lx[i]*F.off[i]; F.z[i] += F.lz[i]*F.off[i]; }
      const sep = clamp((m-MSEP)/0.16, 0, 1);
      if(m > 0){
        F.gw[i] = lerp(F.gw[i], THROAT, sep);
        F.hw[i] = lerp(F.hw[i], THROAT-0.55, sep);
      }
      // shared-ribbon width tracks the throats exactly, so the join is continuous
      F.sw = F.sw || new Float32Array(F.NF+1);
      F.sw[i] = Math.max(F.gw[i], Math.abs(F.off[i]) + THROAT);
      if(m >= MSEP){ if(d < dA) dA = d; if(d > dB) dB = d; }
    }
    range[key] = { dA, dB, mEnd };
    for(let i=0;i<=F.NF;i++){
      const a=Math.max(0,i-1), b=Math.min(F.NF,i+1);
      let tx=F.x[b]-F.x[a], ty=F.y[b]-F.y[a], tz=F.z[b]-F.z[a];
      const l=Math.hypot(tx,ty,tz)||1; tx/=l; ty/=l; tz/=l;
      F.tx[i]=tx; F.ty[i]=ty; F.tz[i]=tz;
      const hl=Math.hypot(tx,tz)||1; F.lx[i]=tz/hl; F.lz[i]=-tx/hl;
    }
  }
  return { D_FORK, RJ, OFF, RAMP, THROAT, MSEP, range, side: sideOf,

// ================================================================

const glowList = [];    // additive lamp/marker haloes
const streakList = [];  // wet-road reflections, each owned by a real source
const flowList = [];    // falling / running water sheets
const mistList = [];    // localized steam and spray
const humanList = [];   // sheltered silhouettes
function addGlow(x,y,z,size,c,mode,phase,inten){ glowList.push({x,y,z,size,c,mode,phase:phase||0,inten:inten===undefined?1:inten}); }
function addStreak(x,y,z,tx,tz,len,wid,c,mode,phase,inten){ streakList.push({x,y,z,tx,tz,len,wid,c,mode,phase:phase||0,inten:inten===undefined?1:inten}); }
function addFlow(o){ flowList.push(o); }
function addMist(x,y,z,r,h,c,rate,phase){ mistList.push({x,y,z,r,h,c,rate,phase:phase||0}); }
// A reflection only exists where a real light stands over real wet surface.
function reflectOnRoad(x,z,c,inten,mode,phase,len,wid){
  const q = distToRoute(x,z,2);
  if(q.d > q.hw + 3.4) return false;
  addStreak(x, q.y + 0.035, z, q.tx, q.tz, len||16, wid||1.5, c, mode||0, phase||0, inten===undefined?1:inten);

}

// ================================================================
// THE ROAD — the most important continuous object in the world
// ================================================================
const RK = { ASPH:0, GUT:1, KERB:2, WALK:3, GRATE:4, STEEL:5, CONC:6, SKIRT:7, ISLAND:8 };
const ROAD_TONE = col(0x080910);
const KERB_TONE = col(0x1D1729);
const WALK_TONE = col(0x121020);
const DECK_TONE = col(0x0D0B17);
const CROWN = 0.095;

function crownAt(u,w){ const t = clamp(u/w, -1, 1); return CROWN*(1.0-t*t); }

// Build the cross-section for one station. Every section type emits the same
// 19 stations across the ribbon, so a change of section never tears the strip.
function profileFor(sec, w, walkL, walkR){
  const road = (u)=>({ u, dy: crownAt(u,w),
    k: (sec===SEC.STREET||sec===SEC.ARCADE) ? RK.ASPH : RK.CONC,
    c: (sec===SEC.STREET||sec===SEC.ARCADE) ? ROAD_TONE : DECK_TONE });
  const mid = [road(-w), road(-w*0.52), road(0), road(w*0.52), road(w)];
  if(sec === SEC.STREET || sec === SEC.ARCADE){
    const oL = w+0.85+walkL, oR = w+0.85+walkR;
    return [
      { u:-oR, dy:'terr', k:RK.SKIRT, c:WALK_TONE },
      { u:-oR, dy:0.175, k:RK.WALK, c:WALK_TONE },
      { u:-oR, dy:0.175, k:RK.WALK, c:WALK_TONE },
      { u:-oR, dy:0.175, k:RK.WALK, c:WALK_TONE },
      { u:-(w+0.86), dy:0.175, k:RK.WALK, c:WALK_TONE },
      { u:-(w+0.85), dy:-0.030, k:RK.KERB, c:KERB_TONE },
      { u:-(w+0.13), dy:-0.062, k:RK.GUT, c:ROAD_TONE },
      mid[0], mid[1], mid[2], mid[3], mid[4],
      { u:(w+0.13), dy:-0.062, k:RK.GUT, c:ROAD_TONE },
      { u:(w+0.85), dy:-0.030, k:RK.KERB, c:KERB_TONE },
      { u:(w+0.86), dy:0.175, k:RK.WALK, c:WALK_TONE },
      { u:oL, dy:0.175, k:RK.WALK, c:WALK_TONE },
      { u:oL, dy:0.175, k:RK.WALK, c:WALK_TONE },
      { u:oL, dy:0.175, k:RK.WALK, c:WALK_TONE },
      { u:oL, dy:'terr', k:RK.SKIRT, c:WALK_TONE },
    ];
  }
  const crest = sec===SEC.CREST, cway = sec===SEC.CAUSEWAY;
  const po = w + (crest?2.35 : cway?1.75 : 1.60);
  const pi = w + (crest?1.70 : cway?1.20 : 1.10);
  const ph = crest?1.42 : cway?1.12 : 1.06;
  const fb = (crest||cway) ? -2.4 : -1.35;
  const kt = (crest||cway) ? 0.34 : 0.30;
  const kb = (crest||cway) ? -0.028 : -0.030;
  const gu = (crest||cway) ? 0.64 : 0.62;
  return [
    { u:-po, dy:fb, k:RK.CONC, c:DECK_TONE },
    { u:-po, dy:ph, k:RK.CONC, c:KERB_TONE },
    { u:-pi, dy:ph, k:RK.CONC, c:KERB_TONE },
    { u:-pi, dy:kt, k:RK.CONC, c:KERB_TONE },
    { u:-(w+gu), dy:kt, k:RK.WALK, c:KERB_TONE },
    { u:-(w+gu-0.02), dy:kb, k:RK.KERB, c:KERB_TONE },
    { u:-(w+0.12), dy:-0.055, k:RK.GUT, c:DECK_TONE },
    mid[0], mid[1], mid[2], mid[3], mid[4],
    { u:(w+0.12), dy:-0.055, k:RK.GUT, c:DECK_TONE },
    { u:(w+gu-0.02), dy:kb, k:RK.KERB, c:KERB_TONE },
    { u:(w+gu), dy:kt, k:RK.WALK, c:KERB_TONE },
    { u:pi, dy:kt, k:RK.CONC, c:KERB_TONE },
    { u:pi, dy:ph, k:RK.CONC, c:KERB_TONE },
    { u:po, dy:ph, k:RK.CONC, c:KERB_TONE },
    { u:po, dy:fb, k:RK.CONC, c:DECK_TONE },
  ];
}

// stations: dense in curves, economical on straights
function stationList(F, d0, d1){
  const out = [];
  let d = d0;
  while(d < d1){
    out.push(d);
    const i = clamp(Math.round(d/F.STEP), 0, F.NF);
    const curv = Math.abs(F.k[i]);
    const grade = Math.abs(F.grade[i]);
    let stepD = curv > 0.020 ? 1.6 : curv > 0.008 ? 2.6 : 5.0;
    if(grade > 0.035) stepD = Math.min(stepD, 2.3);
    d += stepD;
  }
  out.push(d1);
  return out;
}

const _pA = new THREE.Vector3(), _pB = new THREE.Vector3();
const roadFurniture = [];   // deferred: lamp posts and props placed after the ribbon
function buildRibbon(F, d0, d1, useUnoffset, tag){
  const stations = stationList(F, d0, d1);
  let prev = null, prevD = 0;
  const walkSeed = Math.floor(d0*7.3);
  for(let s=0;s<stations.length;s++){
    const d = stations[s];
    const i = clamp(Math.round(d/F.STEP), 0, F.NF);
    const cx = useUnoffset ? F.ux[i] : F.x[i], cz = useUnoffset ? F.uz[i] : F.z[i];
    const cy = F.y[i], lx = F.lx[i], lz = F.lz[i];
    const sec = F.sec[i], w = useUnoffset ? F.sw[i] : F.gw[i];
    // footway widths breathe along the street, but never pinch the corridor
    const walkL = sec===SEC.ARCADE ? 1.75 : 2.05 + 1.15*(0.5+0.5*Math.sin(d*0.017 + walkSeed*0.7));
    const walkR = sec===SEC.ARCADE ? 1.75 : 2.05 + 1.15*(0.5+0.5*Math.sin(d*0.013 + 2.4 + walkSeed*0.31));
    const prof = profileFor(sec, w, walkL, walkR);
    const ring = [];
    for(let m=0;m<prof.length;m++){
      const p = prof[m];
      const wx = cx + lx*p.u, wz = cz + lz*p.u;
      let wy;
      if(p.dy === 'terr'){ wy = Math.min(terrainY(wx,wz), cy+0.16); }
      else wy = cy + p.dy;
      ring.push({ x:wx, y:wy, z:wz, u:p.u, k:p.k, c:p.c });
    }
    if(prev){
      const B = ROADC((cx+prev.cx)*0.5, (cz+prev.cz)*0.5);
      const flowDir = F.grade[i] <= 0 ? 1 : -1;
      // gutter grates every so often, always at the low side of a grade
      const grate = (Math.floor(d/26.0) !== Math.floor(prevD/26.0)) && sec !== SEC.VIADUCT;
      const NP = Math.min(ring.length, prev.ring.length) - 1;
      for(let m=0;m<NP;m++){
        const a0 = prev.ring[m], a1 = prev.ring[m+1], b0 = ring[m], b1 = ring[m+1];
        let k = ring[m].k;
        if(k === RK.GUT && grate) k = RK.GRATE;
        if(k === RK.WALK && ring[m+1].k === RK.KERB) k = RK.WALK;
        const c = ring[m].c;
        const nx = 0, ny = 1, nz = 0;
        // face normal from the quad so kerb risers shade correctly
        _pA.set(b0.x-a0.x, b0.y-a0.y, b0.z-a0.z);
        _pB.set(a1.x-a0.x, a1.y-a0.y, a1.z-a0.z);
        _pA.cross(_pB).normalize();
        if(Math.abs(_pA.y) > 0.25){ if(_pA.y < 0) _pA.multiplyScalar(-1); }
        else {
          const uMid = (a0.u + a1.u) * 0.5;
          const inward = -(uMid >= 0 ? 1 : -1);
          if((_pA.x*lx + _pA.z*lz) * inward < 0) _pA.multiplyScalar(-1);
        }
        face(B, [[a0.x,a0.y,a0.z],[a1.x,a1.y,a1.z],[b1.x,b1.y,b1.z],[b0.x,b0.y,b0.z]],
          [_pA.x,_pA.y,_pA.z], c,
          [[a0.u,prevD],[a1.u,prevD],[b1.u,d],[b0.u,d]],
          k, NO_TINT, w, 0.5, flowDir);
      }
    }
    prev = { ring, cx, cz, cy, lx, lz, sec, w, walkL, walkR }; prevD = d;
    // ---- roadside structure sampled from the same elevation source ----
    if(s % 2 === 0) roadFurniture.push({ d, i, cx, cz, cy, lx, lz, sec, w, walkL, walkR, F, tag });
  }
}

// ---- drive the ribbon: shared spine once, each throat once -----------
{

// ---- the splitter island and the merge nose --------------------------
function islandRun(F, d0, d1, flip){
  const N = Math.max(2, Math.round((d1-d0)/2.4));
  let prev = null;
  for(let s=0;s<=N;s++){
    const d = lerp(d0, d1, s/N);
    const i = clamp(Math.round(d/F.STEP), 0, F.NF);
    const half = Math.max(0, Math.abs(F.off[i]) - FORKGEO.THROAT);
    const cx = F.ux[i], cz = F.uz[i], cy = F.y[i] + 0.30;
    const lx = F.lx[i], lz = F.lz[i];
    const cur = { half, cx, cz, cy, lx, lz, d };
    if(prev && (prev.half > 0.02 || half > 0.02)){
      const Bk = ROADC(cx, cz);
      const pa=[prev.cx - prev.lx*prev.half, prev.cy, prev.cz - prev.lz*prev.half];
      const pb=[prev.cx + prev.lx*prev.half, prev.cy, prev.cz + prev.lz*prev.half];
      const qa=[cx - lx*half, cy, cz - lz*half];
      const qb=[cx + lx*half, cy, cz + lz*half];
      face(Bk, [pa,pb,qb,qa], [0,1,0], KERB_TONE,
        [[-prev.half,prev.d],[prev.half,prev.d],[half,d],[-half,d]], RK.ISLAND, NO_TINT, 5, 0, 0);
      // kerb faces both sides
      const drop = 0.30;
      face(Bk, [[pa[0],pa[1]-drop,pa[2]],[qa[0],qa[1]-drop,qa[2]],qa,pa], [-lx,0,-lz], KERB_TONE,
        [[prev.d,0],[d,0],[d,drop],[prev.d,drop]], RK.KERB, NO_TINT, 5, 0, 0);
      face(Bk, [qb,[qb[0],qb[1]-drop,qb[2]],[pb[0],pb[1]-drop,pb[2]],pb], [lx,0,lz], KERB_TONE,
        [[d,drop],[d,0],[prev.d,0],[prev.d,drop]], RK.KERB, NO_TINT, 5, 0, 0);
      // bollards and a low marker every few metres
      if(s % 4 === 2 && half > 0.7){
        const bx = cx, bz = cz, by = cy;
        box(NEAR(bx,bz), bx-0.13, by, bz-0.13, bx+0.13, by+0.92, bz+0.13, { c:METAL_TONES[1], kind:3 });
        box(NEAR(bx,bz), bx-0.17, by+0.92, bz-0.17, bx+0.17, by+1.02, bz+0.17,
            { c:scaleC(col(HEX.amb),0.5), kind:2, tint:scaleC(col(HEX.amb),0.85), p1:0, p2:(s*0.13)%1, p3:0.3 });
        addGlow(bx, by+1.0, bz, 1.5, scaleC(col(HEX.amb),0.8), 0, (s*0.13)%1, 0.55);
      }
    }
    prev = cur;
  }
  // the nose itself: a raised kerbed prow with a direction mast
  const i0 = clamp(Math.round((flip? d1: d0)/F.STEP), 0, F.NF);
  const nx = F.ux[i0], nz = F.uz[i0], ny = F.y[i0];
  const mastX = nx + F.tx[i0]*(flip?-3.2:3.2), mastZ = nz + F.tz[i0]*(flip?-3.2:3.2);
  box(NEAR(mastX,mastZ), mastX-0.16, ny+0.3, mastZ-0.16, mastX+0.16, ny+4.4, mastZ+0.16, { c:METAL_TONES[0], kind:3 });
  const yaw = Math.atan2(F.tx[i0], F.tz[i0]);
  yawBox(NEAR(mastX,mastZ), mastX, ny+4.0, mastZ, 3.4, 0.62, 0.10, yaw,
    { c:col(0x0D0A16), kind:2, tint:scaleC(col(HEX.teal),0.72), p1:0, p2:0.3, p3:0.5 });
  addGlow(mastX, ny+4.0, mastZ, 4.6, scaleC(col(HEX.teal),0.6), 0, 0.3, 0.7);
  reflectOnRoad(mastX, mastZ, scaleC(col(HEX.teal),0.55), 0.8, 0, 0.3, 20, 2.2);
}
{
  const rA = FORKGEO.range.ledgeline, rB = FORKGEO.range.underworks;
  islandRun(BR.ledgeline, FORKGEO.D_FORK-FORKGEO.RAMP, rA.dA + 1, false);
  islandRun(BR.ledgeline, rA.dB - 1, rA.mEnd, true);
}

// ROADSIDE STRUCTURE — supports, arcades, parapets, embankments

const lampCols = [ scaleC(col(HEX.amb),0.95), scaleC(col(HEX.amb),0.80), scaleC(col(HEX.teal),0.7), scaleC(col(HEX.pap),0.7) ];
let lampCount = 0, propCount = 0, grateCount = 0;

function streetLamp(x, z, y, yaw, tint, phase, mode){
  const B = NEAR(x,z);
  box(B, x-0.13, y, z-0.13, x+0.13, y+0.30, z+0.13, { c:METAL_TONES[2], kind:4 });
  box(B, x-0.09, y+0.30, z-0.09, x+0.09, y+4.55, z+0.09, { c:METAL_TONES[0], kind:3 });
  const ax = Math.sin(yaw), az = Math.cos(yaw);
  // gooseneck arm
  strut(B, x, y+4.35, z, x+ax*1.35, y+5.05, z+az*1.35, 0.13, METAL_TONES[0], 3);
  const hx = x+ax*1.45, hz = z+az*1.45, hy = y+5.02;
  box(B, hx-0.30, hy-0.14, hz-0.30, hx+0.30, hy+0.10, hz+0.30, { c:METAL_TONES[1], kind:3 });
  box(B, hx-0.24, hy-0.20, hz-0.24, hx+0.24, hy-0.13, hz+0.24,
      { c:scaleC(tint,0.5), kind:2, tint, p1:mode, p2:phase, p3:0.55 });
  addGlow(hx, hy-0.2, hz, 5.6, tint, mode, phase, 1.0);
  reflectOnRoad(hx, hz, tint, 1.0, mode, phase, 24, 2.6);
  lampCount++;
}

// spacing gates that survive uneven station sampling
let gateTag = null; const gates = {};
function every(name, d, interval){
  if(gates[name] === undefined){ gates[name] = d - interval; }
  if(d - gates[name] >= interval){ gates[name] = d; return true; }
  return false;
}
for(const f of roadFurniture){
  const { cx, cz, cy, lx, lz, sec, w, walkL, walkR, F, d, i } = f;
  if(f.tag !== gateTag){ gateTag = f.tag; for(const k in gates) delete gates[k]; }
  const yaw = Math.atan2(F.tx[i], F.tz[i]);
  const dh = Math.floor(d);

  if(sec === SEC.VIADUCT){
    // central pier every 26 m, cast into the same elevation source as the deck
    if(every('pier', d, 26)){
      const gY = terrainY(cx, cz);
      const deckU = cy - 1.25;
      if(deckU - gY > 5 && corridorClearExcept(cx, cz, 0, gY, deckU, cy)){
        const B = NEAR(cx,cz);
        const r = 1.5;
        column(B, cx, cz, gY, deckU-1.5, r, 8, CONCRETE_TONES[1], 4, 0.78);
        // flared crosshead
        const chY = deckU-1.5;
        for(const s of [-1,1]){
          strut(B, cx, chY, cz, cx+lx*s*(w+1.3), deckU, cz+lz*s*(w+1.3), 0.95, CONCRETE_TONES[0], 4);
        }
        box(B, cx-r*1.5, gY, cz-r*1.5, cx+r*1.5, gY+0.7, cz+r*1.5, { c:CONCRETE_TONES[2], kind:4 });
        // a downpipe carrying deck runoff to the street
        const px = cx+lx*(w+1.2), pz = cz+lz*(w+1.2);
        box(B, px-0.14, gY, pz-0.14, px+0.14, deckU, pz+0.14, { c:METAL_TONES[2], kind:3 });
        addFlow({ x:px, y:gY, z:pz, h:1.4, r:0.5, kind:'splash', c:scaleC(col(HEX.teal),0.4), rate:0.9 });
        addMist(px, gY+0.5, pz, 1.5, 2.0, scaleC(col(HEX.teal),0.16), 0.5, (dh%7)/7);
        propCount++;
      }
    }
    // parapet rail posts
    if(every('vrail', d, 4.4)){
      for(const s of [-1,1]){
        const px = cx+lx*s*(w+1.35), pz = cz+lz*s*(w+1.35);
        box(NEAR(px,pz), px-0.05, cy+1.06, pz-0.05, px+0.05, cy+1.62, pz+0.05, { c:METAL_TONES[0], kind:3 });
      }
    }
  }

  if(sec === SEC.ARCADE){
    // pump-arcade colonnade and ceiling: real shelter, real occlusion
    if(every('acol', d, 6.0)){
      for(const s of [-1,1]){
        const px = cx+lx*s*(w+2.35), pz = cz+lz*s*(w+2.35);
        const B = NEAR(px,pz);
        column(B, px, pz, cy-0.4, cy+5.35, 0.52, 8, CONCRETE_TONES[0], 4, 1.0);
        box(B, px-0.72, cy+5.35, pz-0.72, px+0.72, cy+5.75, pz+0.72, { c:CONCRETE_TONES[1], kind:4 });
        // service pipes threading the bay
        const pr = 0.16;
        box(B, px-pr+lx*s*1.2, cy+4.5, pz-pr+lz*s*1.2, px+pr+lx*s*1.2, cy+4.9, pz+pr+lz*s*1.2, { c:METAL_TONES[3], kind:3 });
      }
      propCount++;
    }
    // ceiling slab + strip light every second bay
    if(every('aceil', d, 6.2)){
      const B = NEAR(cx,cz);
      const hwid = w+2.9;
      const pa=[cx-lx*hwid, cy+5.8, cz-lz*hwid], pb=[cx+lx*hwid, cy+5.8, cz+lz*hwid];
      const ax=F.tx[i]*6.2, az=F.tz[i]*6.2;
      face(B, [[pa[0],pa[1],pa[2]],[pb[0],pb[1],pb[2]],[pb[0]+ax,pb[1],pb[2]+az],[pa[0]+ax,pa[1],pa[2]+az]],
        [0,-1,0], CONCRETE_TONES[2], [[-hwid,d],[hwid,d],[hwid,d+6.2],[-hwid,d+6.2]], 4, NO_TINT, 0,0,0);
      const lx2 = cx + F.tx[i]*3.1, lz2 = cz + F.tz[i]*3.1;
      yawBox(NEAR(lx2,lz2), lx2, cy+5.66, lz2, 0.34, 0.12, 4.4, yaw,
        { c:col(0x0C0A14), kind:2, tint:scaleC(col(HEX.teal),0.62), p1:0, p2:(dh%11)/11, p3:0.35 });
      addGlow(lx2, cy+5.55, lz2, 5.0, scaleC(col(HEX.teal),0.5), 0, (dh%11)/11, 0.62);
      reflectOnRoad(lx2, lz2, scaleC(col(HEX.teal),0.42), 0.85, 0, (dh%11)/11, 26, 3.0);
    }
  }

  if(sec === SEC.CAUSEWAY || sec === SEC.CREST){
    // riprap embankment falling into black water
    const pw = sec===SEC.CREST ? 2.05 : 1.55;
    const B = ROADC(cx,cz);
    for(const s of [-1,1]){
      const u0 = w+pw, u1 = w+pw+7.5;
      const a=[cx+lx*s*u0, cy-2.2, cz+lz*s*u0], b=[cx+lx*s*u1, -1.9, cz+lz*s*u1];
      const ax=F.tx[i]*3.4, az=F.tz[i]*3.4;
      face(B, s>0? [[a[0],a[1],a[2]],[b[0],b[1],b[2]],[b[0]+ax,b[1],b[2]+az],[a[0]+ax,a[1],a[2]+az]]
                 : [[b[0],b[1],b[2]],[a[0],a[1],a[2]],[a[0]+ax,a[1],a[2]+az],[b[0]+ax,b[1],b[2]+az]],
        [s*lx*0.5, 0.86, s*lz*0.5], col(0x0C0916),
        [[0,d],[7.5,d],[7.5,d+3.4],[0,d+3.4]], 4, NO_TINT, 0,0,0);
    }
    // parapet posts and periodic scupper discharge
    if(every('crail', d, 4.8)){
      for(const s of [-1,1]){
        const px = cx+lx*s*(w+pw+0.2), pz = cz+lz*s*(w+pw+0.2);
        const ph = sec===SEC.CREST ? 1.42 : 1.12;
        box(NEAR(px,pz), px-0.06, cy+ph, pz-0.06, px+0.06, cy+ph+0.62, pz+0.06, { c:METAL_TONES[0], kind:3 });
      }
    }
    if(every('scupper', d, 34)){
      const s = (Math.floor(d/34)%2) ? 1 : -1;
      const px = cx+lx*s*(w+pw), pz = cz+lz*s*(w+pw);
      addFlow({ x:px, y:cy-0.1, z:pz, h:cy+1.6, r:0.42, kind:'fall', c:scaleC(col(HEX.teal),0.34), rate:1.1 });
      addMist(px, -1.2, pz, 3.0, 2.6, scaleC(col(HEX.teal),0.13), 0.35, (dh%13)/13);
    }
  }

  // ---- public light: every chapter gets its lamps, mounted to what is there ----
  {
    const per = sec === SEC.CAUSEWAY || sec === SEC.CREST ? 30 : 21;
    if(every('lamp', d, per)){
      const s = (Math.floor(d/per) % 2) ? 1 : -1;
      const wk = s>0 ? walkL : walkR;
      const off = sec === SEC.STREET ? (w+0.85+wk*0.55)
                : sec === SEC.ARCADE ? (w+1.35)
                : sec === SEC.VIADUCT ? (w+1.15)
                : (w+1.15);
      const px = cx+lx*s*off, pz = cz+lz*s*off;
      const baseY = cy + (sec === SEC.STREET ? 0.175 : sec === SEC.ARCADE ? 0.10 : 0.30);
      if(corridorClear(px,pz,0.35)){
        const idx = Math.floor(d/per);
        const tint = sec===SEC.CAUSEWAY||sec===SEC.CREST ? lampCols[idx%2 ? 2 : 0] : lampCols[idx % lampCols.length];
        streetLamp(px, pz, baseY, yaw + (s>0?Math.PI:0), tint, (idx*0.37)%1, idx%9===4?2:0);
      }
    }
  }
  if(sec === SEC.STREET){
    // kerbside props on a different rhythm
    const per2 = 15;
    if(every('prop', d, per2)){
      const idx = Math.floor(d/per2);
      const s = (idx%2)?-1:1;
      const wk = s>0 ? walkL : walkR;
      const px = cx+lx*s*(w+0.85+wk*0.6), pz = cz+lz*s*(w+0.85+wk*0.6);
      if(corridorClear(px,pz,0.3)){
        const B = NEAR(px,pz), y0 = cy+0.175;
        const kind = idx % 7;
        if(kind===0){        // waste bin
          box(B, px-0.28,y0,pz-0.28, px+0.28,y0+0.92,pz+0.28, { c:METAL_TONES[1], kind:3 });
          box(B, px-0.32,y0+0.92,pz-0.32, px+0.32,y0+1.02,pz+0.32, { c:METAL_TONES[2], kind:3 });
        } else if(kind===1){ // bollard pair
          for(const o of [-0.9,0.9]) box(B, px-0.11+F.tx[i]*o,y0,pz-0.11+F.tz[i]*o, px+0.11+F.tx[i]*o,y0+0.86,pz+0.11+F.tz[i]*o, { c:METAL_TONES[0], kind:3 });
        } else if(kind===2){ // bench under the wall
          yawBox(B, px, y0+0.44, pz, 0.52, 0.10, 1.9, yaw, { c:col(0x2A1B18), kind:5 });
          for(const o of [-0.7,0.7]) box(B, px-0.07+F.tx[i]*o,y0,pz-0.07+F.tz[i]*o, px+0.07+F.tx[i]*o,y0+0.44,pz+0.07+F.tz[i]*o, { c:METAL_TONES[0], kind:3 });
        } else if(kind===3){ // standpipe / hydrant riser
          box(B, px-0.13,y0,pz-0.13, px+0.13,y0+1.12,pz+0.13, { c:col(0x3A2018), kind:3 });
          box(B, px-0.22,y0+1.12,pz-0.22, px+0.22,y0+1.30,pz+0.22, { c:col(0x3A2018), kind:3 });
          addFlow({ x:px+lx*s*0.5, y:y0-0.2, z:pz+lz*s*0.5, h:0.9, r:0.30, kind:'drip', c:scaleC(col(HEX.teal),0.3), rate:0.5 });
        } else if(kind===4){ // planter with a wet shrub mass
          box(B, px-0.62,y0,pz-0.62, px+0.62,y0+0.60,pz+0.62, { c:CONCRETE_TONES[3], kind:4 });
          box(B, px-0.52,y0+0.60,pz-0.52, px+0.52,y0+1.05,pz+0.52, { c:col(0x14210F), kind:0 });
        } else if(kind===5){ // service cabinet with a status lamp
          yawBox(B, px, y0+0.62, pz, 0.44, 1.24, 0.86, yaw, { c:METAL_TONES[3], kind:3 });
          const gx=px+lx*s*0.24, gz=pz+lz*s*0.24;
          box(B, gx-0.06, y0+1.02, gz-0.06, gx+0.06, y0+1.14, gz+0.06,
              { c:col(0x120C1A), kind:2, tint:scaleC(col(HEX.rose),0.8), p1:2, p2:(idx*0.21)%1, p3:0.3 });
          addGlow(gx, y0+1.08, gz, 1.3, scaleC(col(HEX.rose),0.7), 2, (idx*0.21)%1, 0.5);
        } else {             // bike rack hoops
          for(const o of [-0.8,0,0.8]){
            const bx=px+F.tx[i]*o, bz=pz+F.tz[i]*o;
            strut(B, bx-lx*0.32, y0, bz-lz*0.32, bx-lx*0.32, y0+0.78, bz-lz*0.32, 0.06, METAL_TONES[0], 3);
            strut(B, bx+lx*0.32, y0, bz+lz*0.32, bx+lx*0.32, y0+0.78, bz+lz*0.32, 0.06, METAL_TONES[0], 3);
            strut(B, bx-lx*0.32, y0+0.78, bz-lz*0.32, bx+lx*0.32, y0+0.78, bz+lz*0.32, 0.06, METAL_TONES[0], 3);
          }
        }
        propCount++;
      }
    }
    // kerb channel outfall: a grated gully mouth with visible flow
    if(every('gully', d, 24)){
      const s = (Math.floor(d/24)%2)?1:-1;
      const px = cx+lx*s*(w+0.45), pz = cz+lz*s*(w+0.45);
      addFlow({ x:px, y:cy-0.06, z:pz, h:0.5, r:0.55, kind:'gully', c:scaleC(col(HEX.teal),0.28), rate:0.8 });
      grateCount++;
    }
  }
}

const DISTRICT_STYLE = {
  lower:     { h:[8,19],   arch:['workshop','cafe','walkup','warehouse','workshop','cafe'], warm:0.62 },
  terrace:   { h:[13,30],  arch:['terrace','walkup','terrace','slab','cafe'],               warm:0.48 },
  tramworks: { h:[10,26],  arch:['warehouse','infra','slab','workshop','walkup','market'],  warm:0.34 },
  market:    { h:[7,16],   arch:['market','cafe','market','workshop','walkup'],             warm:0.72 },
  pumpworks: { h:[26,96],  arch:['pumphouse','tower','infra','slab','pumphouse'],           warm:0.26 },
  remnant:   { h:[6,32],   arch:['stilt','warehouse','infra','stilt','slab'],              warm:0.18 },
  stormwall: { h:[10,44],  arch:['infra','pumphouse','warehouse','slab','tower'],           warm:0.22 },

const ARCH_NAMES = ['workshop','cafe','walkup','terrace','slab','tower','warehouse','market','pumphouse','infra','stilt'];
const archCensus = {}; ARCH_NAMES.forEach(a=>archCensus[a]=0);
let buildingCount = 0;
const shopfronts = [];      // {x,z,y,yaw,tint} — mounting points for signs and awnings
const signAnchors = [];

function newStyle(district, det){
  const st = {};
  st.base = varyC(rv.pick(FACADE_TONES), 0.16, rv);
  st.trim = varyC(rv.pick(CONCRETE_TONES), 0.14, rv);
  st.metal = varyC(rv.pick(METAL_TONES), 0.14, rv);
  const warm = DISTRICT_STYLE[district].warm;
  const r = rv.f();
  st.win = r < warm ? scaleC(col(HEX.amb), rv.r(0.72,1.0))
        : r < warm+0.30 ? scaleC(col(HEX.pap), rv.r(0.44,0.68))
        : r < 0.93 ? scaleC(col(HEX.teal), rv.r(0.38,0.62))
        : scaleC(col(HEX.rose), rv.r(0.55,0.88));
  st.lit = det>=2 ? rv.r(0.16, 0.42) : rv.r(0.09, 0.28);
  st.cell = rv.r(1.35, 2.15);

function parapetRing(B, x0,z0,x1,z1, y, h, c, det){

  box(B, x0,y,z0, x1,y+h,z0+t, { c, kind:4, skip:{bottom:true} });
  box(B, x0,y,z1-t, x1,y+h,z1, { c, kind:4, skip:{bottom:true} });
  box(B, x0,y,z0+t, x0+t,y+h,z1-t, { c, kind:4, skip:{bottom:true} });

function bandLedge(B, x0,z0,x1,z1, y, c){

function roofKit(B, x0,z0,x1,z1, y, det, st, near){

  // plant: tanks, ducts, condensers, aerial masts
  const n = det>=2 ? rv.i(3,6) : rv.i(1,3);
  for(let k=0;k<n;k++){
    const kind = rv.i(0,3);
    const px = x0 + rv.r(0.9, Math.max(1.0,w-2.4)), pz = z0 + rv.r(0.9, Math.max(1.0,d-2.4));

      column(B, px, pz, y+lh, y+lh+rv.r(1.6,2.8), r, 8, st.metal, 3, 1.0);
      box(B, px-r,y+lh+2.9,pz-r, px+r,y+lh+3.05,pz+r, { c:st.metal, kind:3, skip:{bottom:true} });

      else   box(B, px,y+0.4,pz, px+sh,y+0.4+sh,pz+L, { c:st.metal, kind:3 });
      box(B, px,y,pz, px+0.3,y+0.4,pz+0.3, { c:st.metal, kind:3 });
    } else {            // aerial mast with a marker light
      const mh = rv.r(2.5,6.5);
      box(B, px-0.07,y,pz-0.07, px+0.07,y+mh,pz+0.07, { c:st.metal, kind:3 });
      if(near || rv.chance(0.3)){

        box(B, px-0.11,y+mh,pz-0.11, px+0.11,y+mh+0.16,pz+0.11, { c:col(0x0E0A14), kind:2, tint:c, p1:3, p2:rv.f(), p3:0.4 });
        addGlow(px, y+mh+0.08, pz, 1.7, c, 3, rv.f(), 0.55);

}
function downspout(B, x, z, y0, y1, nx, nz, st, reg){

function fireEscape(B, x0, y0, z0, nx, nz, floors, fh, wide, st){

    const y = y0 + f*fh;

    const a=[x0 - px*wide*0.5, y, z0 - pz*wide*0.5];
    const b=[x0 + px*wide*0.5, y, z0 + pz*wide*0.5];
    face(B, [[a[0],y,a[2]],[b[0],y,b[2]],[b[0]+nx*1.25,y,b[2]+nz*1.25],[a[0]+nx*1.25,y,a[2]+nz*1.25]],
      [0,1,0], st.metal, [[0,0],[wide,0],[wide,1.25],[0,1.25]], 8, NO_TINT, 0,0,0);
    // railing
    for(const s of [-0.5, 0.5]){

    // stair stringer to the level above

      const sx = x0 + px*wide*0.34, sz = z0 + pz*wide*0.34;

      strut(B, sx+nx*0.55, y, sz+nz*0.55, sx - px*wide*0.62 + nx*1.45, y+fh, sz - pz*wide*0.62 + nz*1.45, 0.09, st.metal, 3);
    }

}
function awning(B, cx, cz, y, nx, nz, wide, st, tint){

  face(B, [a0,a1,b1,b0], nrm, scaleC(col(HEX.ora), 0.36), [[0,0],[wide,0],[wide,out],[0,out]], 0, NO_TINT, 0,0,0);
  face(B, [b0,b1,a1,a0], [-nrm[0],-nrm[1],-nrm[2]], scaleC(col(HEX.ora), 0.22), [[0,out],[wide,out],[wide,0],[0,0]], 0, NO_TINT, 0,0,0);
  // valance and support struts
  face(B, [b0,b1,[b1[0],b1[1]-0.28,b1[2]],[b0[0],b0[1]-0.28,b0[2]]], [nx,0,nz], scaleC(col(HEX.ora),0.30),
    [[0,0],[wide,0],[wide,0.28],[0,0.28]], 0, NO_TINT, 0,0,0);
  strut(B, a0[0],a0[1],a0[2], b0[0],b0[1],b0[2], 0.07, st.metal, 3);
  strut(B, a1[0],a1[1],a1[2], b1[0],b1[1],b1[2], 0.07, st.metal, 3);
  strut(B, b0[0],b0[1],b0[2], b1[0],b1[1],b1[2], 0.06, st.metal, 3);
  // sheltered light under the awning
  const gx = cx+nx*out*0.6, gz = cz+nz*out*0.6, gy = y-0.5;

  // runoff falls off the awning edge
  addFlow({ x:(b0[0]+b1[0])*0.5, y:y-1.2, z:(b0[2]+b1[2])*0.5, h:1.1, r:wide*0.42, kind:'edge', c:scaleC(col(HEX.teal),0.26), rate:0.9 });
  return { out, gy };
}

function wallMass(B, x0,z0,x1,z1, y0,y1, st, det, windows, litScale){

// ---- archetypes ------------------------------------------------------
function buildArch(arch, B, r, front, st, det, district, groundY){
  const nrm = [[0,-1],[1,0],[0,1],[-1,0]][front];
  const nx = nrm[0], nz = nrm[1];
  const cx = (r.x0+r.x1)/2, cz = (r.z0+r.z1)/2;
  const w = r.x1-r.x0, d = r.z1-r.z0;
  const faceW = (front===0||front===2) ? w : d;
  // the point on the route-facing wall
  const fx = cx + nx*(front===1||front===3 ? w/2 : 0) + (front===0? 0 : 0);
  const fpX = cx + (front===1? w/2 : front===3? -w/2 : 0);
  const fpZ = cz + (front===2? d/2 : front===0? -d/2 : 0);
  const y0 = groundY;
  let H = r.h;
  const near = det >= 2;
  archCensus[arch]++; buildingCount++;

  if(arch === 'workshop'){
    const gh = rv.r(4.0, 5.2);
    wallMass(B, r.x0,r.z0,r.x1,r.z1, y0, y0+gh, st, det, false, 1);
    if(H > gh+2.4){
      const ins = rv.r(0.5,1.6);
      wallMass(B, r.x0+ins,r.z0+ins,r.x1-ins,r.z1-ins, y0+gh, y0+H, st, det, true, 1);
      bandLedge(B, r.x0+ins,r.z0+ins,r.x1-ins,r.z1-ins, y0+gh-0.1, st.trim);
      roofKit(B, r.x0+ins,r.z0+ins,r.x1-ins,r.z1-ins, y0+H, det, st, near);
    } else roofKit(B, r.x0,r.z0,r.x1,r.z1, y0+H, det, st, near);
    if(near){
      // roll shutter workshop door with a service light and a repair mark
      const dw = Math.min(faceW*0.5, 4.6);
      yawBox(B, fpX+nx*0.06, y0+1.85, fpZ+nz*0.06, dw, 3.55, 0.12, Math.atan2(nx,nz), { c:scaleC(st.metal,0.9), kind:7 });
      box(B, fpX+nx*0.09-0.9, y0+3.75, fpZ+nz*0.09-0.9, fpX+nx*0.09+0.9, y0+3.95, fpZ+nz*0.09+0.9, { c:st.trim, kind:4 });
      const ox = fpX - (front===0||front===2 ? faceW*0.32 : 0) - (front===1||front===3 ? 0 : 0);
      entrance(B, fpX + (-nz)*faceW*0.33, fpZ + nx*faceW*0.33, y0, nx, nz, 1.5, st, det);
      const lt = scaleC(col(HEX.ora), 0.9);
      box(B, fpX+nx*0.3-0.2, y0+4.2, fpZ+nz*0.3-0.2, fpX+nx*0.3+0.2, y0+4.42, fpZ+nz*0.3+0.2,
        { c:col(0x100B18), kind:2, tint:lt, p1:2, p2:rv.f(), p3:0.5 });
      addGlow(fpX+nx*0.35, y0+4.3, fpZ+nz*0.35, 4.0, lt, 2, rv.f(), 0.85);
      reflectOnRoad(fpX+nx*1.2, fpZ+nz*1.2, lt, 0.9, 2, rv.f(), 18, 2.6);
      shopfronts.push({ x:fpX, z:fpZ, y:y0, nx, nz, faceW, tint:lt, H, kind:'workshop' });
    }
  } else if(arch === 'cafe'){
    const gh = rv.r(3.6, 4.4);
    wallMass(B, r.x0,r.z0,r.x1,r.z1, y0+gh, y0+H, st, det, true, 1);
    // glazed ground floor set back behind a colonnade of piers
    const ins = 0.55;
    box(B, r.x0+ins, y0, r.z0+ins, r.x1-ins, y0+gh, r.z1-ins,
      { c:col(0x0F0A16), kind:6, tint:scaleC(col(HEX.amb), 1.25), p1:rv.r(1.0,1.8), p2:0, p3:st.phase, skip:{bottom:true,top:true} });
    for(const s of [-0.5, 0.5]){
      const px = fpX + (-nz)*faceW*s, pz = fpZ + nx*faceW*s;
      box(B, px-0.28, y0, pz-0.28, px+0.28, y0+gh+0.3, pz+0.28, { c:st.trim, kind:4 });
    }
    bandLedge(B, r.x0,r.z0,r.x1,r.z1, y0+gh, st.trim);
    roofKit(B, r.x0,r.z0,r.x1,r.z1, y0+H, det, st, near);
    if(near){
      const tint = scaleC(col(HEX.amb), 0.95);
      awning(B, fpX+nx*0.1, fpZ+nz*0.1, y0+gh-0.55, nx, nz, Math.min(faceW*0.8, 6.5), st, tint);
      entrance(B, fpX + (-nz)*faceW*0.3, fpZ + nx*faceW*0.3, y0, nx, nz, 1.6, st, det);
      shopfronts.push({ x:fpX, z:fpZ, y:y0, nx, nz, faceW, tint, H, kind:'cafe' });
      // one figure sheltering under the awning
      if(rv.chance(0.34)) humanList.push({ x: fpX+nx*1.4 + (-nz)*rv.r(-1.6,1.6), z: fpZ+nz*1.4 + nx*rv.r(-1.6,1.6), y:y0, yaw: rv.r(0,6.28) });
    }
  } else if(arch === 'walkup' || arch === 'terrace'){
    const floors = Math.max(3, Math.round(H/st.floor));
    const bays = arch==='terrace' ? rv.i(2,3) : 1;
    for(let bcount=0;bcount<bays;bcount++){
      const t0 = bcount/bays, t1 = (bcount+1)/bays;
      const bx0 = lerp(r.x0,r.x1, front===0||front===2 ? t0 : 0), bx1 = lerp(r.x0,r.x1, front===0||front===2 ? t1 : 1);
      const bz0 = lerp(r.z0,r.z1, front===1||front===3 ? t0 : 0), bz1 = lerp(r.z0,r.z1, front===1||front===3 ? t1 : 1);
      const hh = H * rv.r(0.82, 1.12);
      wallMass(B, bx0,bz0,bx1,bz1, y0, y0+hh, st, det, true, 1);
      // string courses at each floor
      if(det>=1) for(let f=1;f<floors;f+=2) bandLedge(B, bx0,bz0,bx1,bz1, y0+f*st.floor, st.trim);
      roofKit(B, bx0,bz0,bx1,bz1, y0+hh, det, st, near && bcount===0);
    }
    if(near){
      // stacked balconies and a fire escape down the route face
      const fl = Math.min(floors-1, 4);
      for(let f=1;f<=fl;f++){
        const y = y0 + f*st.floor;
        const bw = faceW*0.42;
        const bx = fpX + nx*0.55, bz = fpZ + nz*0.55;
        box(B, bx-(front===1||front===3?0.55:bw*0.5), y, bz-(front===0||front===2?0.55:bw*0.5),
              bx+(front===1||front===3?0.55:bw*0.5), y+0.16, bz+(front===0||front===2?0.55:bw*0.5), { c:st.trim, kind:4 });
        for(let q=0;q<5;q++){
          const t = -0.5 + q/4;
          const rx = fpX + (-nz)*bw*t + nx*1.05, rz = fpZ + nx*0*t + nz*1.05 + (nx!==0 ? 0 : 0);
          const rrx = fpX + (-nz)*bw*t + nx*1.05, rrz = fpZ + (nx)*bw*t + nz*1.05;
          strut(B, rrx, y+0.16, rrz, rrx, y+1.05, rrz, 0.045, st.metal, 3);
        }
        const e0x = fpX + (-nz)*bw*-0.5 + nx*1.05, e0z = fpZ + nx*bw*-0.5 + nz*1.05;
        const e1x = fpX + (-nz)*bw*0.5 + nx*1.05,  e1z = fpZ + nx*bw*0.5 + nz*1.05;
        strut(B, e0x, y+1.05, e0z, e1x, y+1.05, e1z, 0.045, st.metal, 3);
      }
      if(rv.chance(0.6)) fireEscape(B, fpX + (-nz)*faceW*0.32 + nx*0.1, y0+st.floor, fpZ + nx*faceW*0.32 + nz*0.1, nx, nz, Math.min(floors-1,4), st.floor, 2.4, st);
      entrance(B, fpX + (-nz)*faceW*0.18, fpZ + nx*faceW*0.18, y0, nx, nz, 1.7, st, det);
    }
  } else if(arch === 'slab'){
    const setbacks = rv.i(1,3);
    let yy = y0, hx0=r.x0, hz0=r.z0, hx1=r.x1, hz1=r.z1;
    for(let s2=0;s2<setbacks;s2++){
      const seg = H*(s2===setbacks-1 ? 1 - yy/(y0+H) : rv.r(0.34,0.5));
      const top = Math.min(y0+H, yy+seg);
      wallMass(B, hx0,hz0,hx1,hz1, yy, top, st, det, true, 1);
      bandLedge(B, hx0,hz0,hx1,hz1, top-0.15, st.trim);
      yy = top;
      const ins = rv.r(0.8, 2.0);
      hx0+=ins; hz0+=ins; hx1-=ins; hz1-=ins;
      if(yy >= y0+H-0.4) break;
    }

  } else if(arch === 'tower'){
    const core = rv.r(0.62, 0.82);

  } else if(arch === 'warehouse'){

      // loading dock lip and bumpers

  } else if(arch === 'market'){

  } else if(arch === 'pumphouse'){
    // vertical pump works: a tall shaft with external pipework and valve galleries

    const x0=cx-bw/2, z0=cz-bd/2, x1=cx+bw/2, z1=cz+bd/2;

      box(B, lerp(x0,x1,t)-0.32, y0, z1-0.02, lerp(x0,x1,t)+0.32, y0+H, z1+0.30, { c:st.trim, kind:4 });
      box(B, x0-0.30, y0, lerp(z0,z1,t)-0.32, x0+0.02, y0+H, lerp(z0,z1,t)+0.32, { c:st.trim, kind:4 });
      box(B, x1-0.02, y0, lerp(z0,z1,t)-0.32, x1+0.30, y0+H, lerp(z0,z1,t)+0.32, { c:st.trim, kind:4 });

    const nPipe = det>=1 ? 3 : 1;
    for(let p=0;p<nPipe;p++){

      const px2 = lerp(x0,x1,t), pz2 = z0 - 0.55;

      if(det>=2){
        const vy = y0 + rv.r(3, 9);
        box(B, px2-0.45, vy, pz2-0.16, px2+0.45, vy+0.5, pz2+0.16, { c:st.metal, kind:3 });
        column(B, px2+0.6, pz2, vy, vy+0.10, 0.42, 8, scaleC(col(HEX.ora),0.4), 3, 1.0);
      }
    }
    // gallery bands + marker lights
    const galleries = Math.max(1, Math.floor(H/16));
    for(let g2=1;g2<=galleries;g2++){
      const gy = y0 + H*g2/(galleries+1);
      box(B, x0-0.9, gy, z0-0.9, x1+0.9, gy+0.16, z1+0.9, { c:st.metal, kind:8, skip:{} });
      for(let q=0;q<4;q++){
        const a=q/4*Math.PI*2;
        const rx=cx+Math.cos(a)*(bw/2+0.75), rz=cz+Math.sin(a)*(bd/2+0.75);
        strut(B, rx, gy+0.16, rz, rx, gy+1.05, rz, 0.05, st.metal, 3);
      }
      const c = scaleC(col(HEX.teal), 0.7);
      addGlow(x1+0.9, gy+0.5, cz, 2.4, c, 0, rv.f(), 0.55);

    roofKit(B, x0,z0,x1,z1, y0+H, det, st, true);
  } else if(arch === 'infra'){
    // substation / valve house: low, heavy, banded, with transformer yards
    const gh = Math.min(H, rv.r(5.5,9.5));
    wallMass(B, r.x0,r.z0,r.x1,r.z1, y0, y0+gh, st, det, false, 1);
    box(B, r.x0-0.4, y0+gh, r.z0-0.4, r.x1+0.4, y0+gh+0.5, r.z1+0.4, { c:st.trim, kind:4 });
    const nV = det>=1 ? rv.i(2,4) : 1;
    for(let v=0;v<nV;v++){
      const vx = lerp(r.x0+2, r.x1-2, (v+0.5)/nV), vz = lerp(r.z0+2, r.z1-2, rv.r(0.25,0.75));
      column(B, vx, vz, y0+gh+0.5, y0+gh+rv.r(2.4,4.6), rv.r(0.7,1.3), 8, st.metal, 3, 0.9);
      box(B, vx-1.1, y0+gh+0.5, vz-1.1, vx+1.1, y0+gh+0.75, vz+1.1, { c:st.trim, kind:4 });
    }
    // louvred plant wall on the route face
    if(near){
      yawBox(B, fpX+nx*0.08, y0+gh*0.55, fpZ+nz*0.08, faceW*0.72, gh*0.7, 0.14, Math.atan2(nx,nz), { c:st.metal, kind:10 });
      const c = scaleC(col(HEX.teal), 0.65);
      box(B, fpX+nx*0.2-0.35, y0+gh-0.6, fpZ+nz*0.2-0.35, fpX+nx*0.2+0.35, y0+gh-0.42, fpZ+nz*0.2+0.35,

      addGlow(fpX+nx*0.3, y0+gh-0.5, fpZ+nz*0.3, 3.4, c, 3, rv.f(), 0.6);

  } else { // 'stilt' — flooded industrial remnant standing in shallow water
    const legs = 4;
    const bw = w*0.7, bd = d*0.7;

    box(B, bx0-0.5, y0+lift-0.5, bz0-0.5, bx1+0.5, y0+lift, bz1+0.5, { c:CONCRETE_TONES[1], kind:4 });
    roofKit(B, bx0,bz0,bx1,bz1, y0+Math.max(lift+4,H), det, st, near);

  }

  // ---- always: downspouts, and a sign anchor on the route face ----
  if(det >= 1){
    const px = -nz, pz = nx;
    const nSp = det>=2 ? 2 : 1;
    for(let s2=0;s2<nSp;s2++){
      const t = nSp===1 ? 0.42 : (s2? 0.40 : -0.40);
      const sx = fpX + px*faceW*t + nx*0.22, sz = fpZ + pz*faceW*t + nz*0.22;

  }
  if(det >= 1) signAnchors.push({ x:fpX, z:fpZ, y:y0, nx, nz, faceW, H, district, arch, st });
}

// ---- ground: every cell's surface comes from the same elevation source ----
const STREET_HALF = 10.0;              // kerb-to-kerb half width of a generic street
{
  const SUB = 2;
  for(let i=-1;i<=IMAX+1;i++) for(let j=-1;j<=JLAND+1;j++){
    const bx = cellX(i)-G/2, bz = cellZ(j)-G/2;
    for(let a=0;a<SUB;a++) for(let b=0;b<SUB;b++){
      const x0 = bx + a*G/SUB, z0 = bz + b*G/SUB, x1 = x0+G/SUB, z1 = z0+G/SUB;
      const mx = (x0+x1)/2, mz = (z0+z1)/2;
      if(mz > BAY_Z - 12) continue;
      const q = distToRoute(mx, mz, 3);
      if(q.d < q.hw + 15 && q.y < 12) continue;                 // the ribbon owns this ground
      const B = FAR(mx, mz);
      const y00 = terrainY(x0,z0), y10 = terrainY(x1,z0), y11 = terrainY(x1,z1), y01 = terrainY(x0,z1);
      face(B, [[x0,y01,z1],[x1,y11,z1],[x1,y10,z0],[x0,y00,z0]], [0,1,0], col(0x090810),
        [[x0,z1],[x1,z1],[x1,z0],[x0,z0]], 7, NO_TINT, 0,0,0);
    }
  }
}

// ---- block subdivision and building placement ----
const skylineNoise = (i,j)=>{
  const a = Math.sin(i*0.73 + PLAN.raincatcher.i*0.41) * Math.cos(j*0.59 + PLAN.raincatcher.j*0.37);
  const b = Math.sin((i+j)*0.31 + PLAN.tram.phase*6.3);
  return 0.5 + 0.32*a + 0.18*b;
};
// A block occupies the land between four streets, so a route running down a
// street centre gets building faces about ten metres away — a real canyon.
for(let i=-1;i<=IMAX;i++) for(let j=-1;j<=JLAND;j++){
  const rcI = PLAN.raincatcher.i, rcJ = PLAN.raincatcher.j;
  const bx0 = cellX(i)+STREET_HALF, bx1 = cellX(i)+G-STREET_HALF;
  const bz0 = cellZ(j)+STREET_HALF, bz1 = cellZ(j)+G-STREET_HALF;
  const mx = (bx0+bx1)/2, mz = (bz0+bz1)/2;
  if(mz > BAY_Z-20 || mx < 8 || mx > cellX(IMAX)+G) continue;
  if(Math.hypot(mx-PLAN.raincatcher.x, mz-PLAN.raincatcher.z) < 88) continue;   // the plaza stays open
  const q = distToRoute(mx, mz);
  const det = q.d < 42 ? 2 : q.d < 150 ? 1 : 0;
  const district = PLAN.districts.get(Math.max(0,Math.min(IMAX,i))*100 + Math.max(0,Math.min(JLAND,j))) || 'lower';
  const DS = DISTRICT_STYLE[district];
  if(det === 0 && rv.f() > 0.60) continue;                       // negative space: yards, lots, voids
  if(det === 1 && rv.f() > 0.93) continue;
  const lots = det===2 ? rv.i(1,2) : det===1 ? rv.i(1,2) : 1;
  const along = (bx1-bx0) >= (bz1-bz0);
  const sky = skylineNoise(i,j);
  for(let l=0;l<lots;l++){
    const t0 = l/lots, t1 = (l+1)/lots;
    const gap = lots>1 ? 0.9 : 0;
    let r = {
      x0: along ? lerp(bx0,bx1,t0)+gap : bx0,
      x1: along ? lerp(bx0,bx1,t1)-gap : bx1,
      z0: along ? bz0 : lerp(bz0,bz1,t0)+gap,
      z1: along ? bz1 : lerp(bz0,bz1,t1)-gap,
    };
    const ins = rv.r(0.0, 2.2);
    r.x0+=ins; r.z0+=ins; r.x1-=ins; r.z1-=ins;
    if(r.x1-r.x0 < 6 || r.z1-r.z0 < 6) continue;
    // corridor protection: pull the lot back until it clears, or drop it
    let tries = 0, ok = false;
    while(tries++ < 4){
      const c0 = corridorClear(r.x0,r.z0, 2.4), c1 = corridorClear(r.x1,r.z0, 2.4);
      const c2 = corridorClear(r.x1,r.z1, 2.4), c3 = corridorClear(r.x0,r.z1, 2.4);
      const cm = corridorClear((r.x0+r.x1)/2,(r.z0+r.z1)/2, 2.4);
      if(c0&&c1&&c2&&c3&&cm){ ok = true; break; }
      const qq = distToRoute((r.x0+r.x1)/2,(r.z0+r.z1)/2);
      const dx = (r.x0+r.x1)/2 - mx, dz = (r.z0+r.z1)/2 - mz;
      r.x0 += 1.8*Math.sign(dx||1); r.x1 += 1.8*Math.sign(dx||1);
      r.z0 += 1.8*Math.sign(dz||1); r.z1 += 1.8*Math.sign(dz||1);
      if(r.x1-r.x0 < 6 || r.z1-r.z0 < 6) break;
    }
    if(!ok) continue;
    const lx = (r.x0+r.x1)/2, lz = (r.z0+r.z1)/2;
    // which wall faces the route
    const lq = distToRoute(lx, lz);
    const vx = lq.px - lx, vz = lq.pz - lz;
    const front = Math.abs(vx) > Math.abs(vz) ? (vx>0?1:3) : (vz>0?2:0);
    const st = newStyle(district, det);
    let H = lerp(DS.h[0], DS.h[1], sky*rv.r(0.65,1.25));
    let arch = rv.pick(DS.arch);
    // skyline punctuation: an occasional tower well away from the ribbon
    if(det===0 && sky > 0.74 && rv.chance(0.36)){ arch = 'tower'; H = rv.r(52, 128); }
    if(district==='remnant' && mz > BAY_Z-140) arch = rv.chance(0.6) ? 'stilt' : arch;
    // the plaza sits in a low bowl so the Raincatcher reads from far away
    const rcDist = Math.hypot(mx - PLAN.raincatcher.x, mz - PLAN.raincatcher.z);
    const bowl = rcDist < 190;
    if(bowl){ H = Math.min(H, rv.r(11, 30)); if(arch==='tower') arch = 'infra'; }
    // Beside an elevated ride the massing must commit: either a wall that
    // frames the deck, or low enough that the viaduct clearly flies over it.
    // Every elevated pass within reach counts, not just the nearest one.
    {
      let lo = 1e9, hi = -1e9;
      const cx3 = Math.floor(lx/RCELL)+600, cz3 = Math.floor(lz/RCELL)+600;
      for(let a=-4;a<=4;a++) for(let b=-4;b<=4;b++){
        const lst = RHASH.get((cx3+a)*8192+(cz3+b)); if(!lst) continue;
        for(let m=0;m<lst.length;m+=6){
          const dx3=lst[m]-lx, dz3=lst[m+2]-lz;
          if(dx3*dx3+dz3*dz3 > 4900) continue;
          const ry = lst[m+1];
          if(ry < 11) continue;
          lo = Math.min(lo, ry); hi = Math.max(hi, ry);
        }
      }
