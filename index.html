    float c = cos(u * 1.5707963);
    float prof = c * c;
    float lat = 0.66 + 0.34 * sin(q * A.w + B.x) * 0.62 + 0.22 * sin(q * B.y + B.z);
    gust  += A.z * prof * lat;
    swing += A.z * prof * sin(q * A.w * 0.6 + B.x + 1.7);
  }
  float turb = 0.17 * sin(a * 0.021 - uTime * 1.55 + q * 0.013)
             + 0.11 * sin(a * 0.047 + uTime * 2.45 - q * 0.031)
             + 0.07 * sin(q * 0.062 + uTime * 3.7);
  float breathe = 0.80 + 0.20 * sin(uTime * 0.093 + a * 0.00061);
  float speed = (uWindBase * breathe + gust * uWindBase * 1.45) * (0.88 + turb);
  return vec3(max(speed, 0.15), gust, swing * 0.20 + turb * 0.10);
}

// local wind vector after shelter; ex is the baked exposure at this point
vec3 windAt(vec2 p, float ex){
  vec3 r = windRaw(p);
  float shelter = 0.30 + 0.70 * ex;
  float ang = uWindAng + r.z * (1.25 - 0.5 * ex);
  return vec3(cos(ang), sin(ang), r.x * shelter);
}

// Per-material response: different things bend at different rates, so the marsh never
// turns into one lump of wind jelly.
//   stiffness : how hard it resists (1 = reed, 3 = willow trunk)
//   freq      : its own sway frequency
float windSway(vec2 p, float ex, float phase, float stiffness, float freq){
  vec3 w = windAt(p, ex);
  float s = w.z / stiffness;
  float carrier = sin(uTime * freq + phase + dot(p, uWindDir) * 0.09);
  float flutter = sin(uTime * freq * 2.7 + phase * 1.7 + dot(p, uWindDir) * 0.21);
  return s * (0.62 + 0.38 * carrier) + s * 0.16 * flutter;
}
`;


/* ==== 35_shaderlib.js =================================================== */
/* ==================================================================
 *  SHADER LIBRARY
 *  One palette, one sky, one air, one light. Every material in Reedwake
 *  is built from these chunks, which is why the road, the water, the reeds
 *  and the willows all agree about what time of day it is.
 * ================================================================== */

/* Controlled palette: graphite road, deep reed green, wet olive, lichen,
   straw gold, restrained copper, rain slate, pale tidal sky. */
const GLSL_PALETTE = /* glsl */`
vec3 s2l(vec3 c){ return pow(c, vec3(2.2)); }
#define C_ROAD    vec3(0.243,0.231,0.213)
#define C_ROAD2   vec3(0.336,0.316,0.284)
#define C_REED    vec3(0.243,0.318,0.176)
#define C_REED_D  vec3(0.129,0.192,0.129)
#define C_OLIVE   vec3(0.322,0.338,0.198)
#define C_LICHEN  vec3(0.573,0.616,0.459)
#define C_STRAW   vec3(0.769,0.675,0.416)
#define C_COPPER  vec3(0.635,0.408,0.239)
#define C_SLATE   vec3(0.361,0.416,0.447)
#define C_SKYPALE vec3(0.788,0.831,0.847)
#define C_MUD     vec3(0.263,0.243,0.196)
#define C_WOOD    vec3(0.318,0.271,0.208)
#define C_STONE   vec3(0.396,0.400,0.373)
`;

const GLSL_NOISE = /* glsl */`
float h21(vec2 p){ p = fract(p*vec2(123.34,345.45)); p += dot(p,p+34.345); return fract(p.x*p.y); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f*f*(3.0-2.0*f);
  float a = h21(i), b = h21(i+vec2(1,0)), c = h21(i+vec2(0,1)), d = h21(i+vec2(1,1));
  return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
}
float fbm2(vec2 p, int oct){
  float v=0.0, a=0.5; mat2 m = mat2(0.80,-0.60,0.60,0.80);
  for(int i=0;i<6;i++){ if(i>=oct) break; v += a*vnoise(p); p = m*p*2.07; a *= 0.5; }
  return v;
}
float fbmAbs2(vec2 p, int oct){
  float v=0.0, a=0.5; mat2 m = mat2(0.80,-0.60,0.60,0.80);
  for(int i=0;i<6;i++){ if(i>=oct) break; v += a*(1.0-abs(vnoise(p)*2.0-1.0)); p = m*p*2.11; a *= 0.5; }
  return v;
}
`;

/* Two baked field windows follow the rider: a tight one at 0.6 m per texel that carries
   the made ground, and a wide one at ~4.7 m that carries the open marsh out to the haze.
   Both fade before their toroidal wrap seam can ever come into view. */
const GLSL_FIELD = /* glsl */`
uniform vec3 uCamPos;
uniform float uTideY;
uniform float uTime;
uniform sampler2D uFieldTex;   uniform vec2 uFieldCenter;  uniform float uFieldSpan;
uniform sampler2D uFieldTexN;  uniform vec2 uFieldCenterN; uniform float uFieldSpanN;

vec4 decodeField(vec4 f){ return vec4(f.r * 9.0 - 4.0, f.g, f.b, f.a); }

vec4 sampleFieldFar(vec2 p){
  vec4 f = decodeField(texture2D(uFieldTex, fract(p / uFieldSpan)));
  vec2 d = abs(p - uFieldCenter);
  float w = 1.0 - smoothstep(uFieldSpan*0.30, uFieldSpan*0.455, max(d.x, d.y));
  return vec4(mix(-0.9, f.x, w), mix(1.0, f.y, w), f.z * w, mix(1.0, f.w, w));
}
vec4 sampleFieldNear(vec2 p){
  return decodeField(texture2D(uFieldTexN, fract(p / uFieldSpanN)));
}
/* The authority for ground height. Near and far windows are blended over a fixed
   world-space band so both terrain shells compute exactly the same surface there. */
vec4 sampleGround(vec2 p){
  vec4 fFar = sampleFieldFar(p);
  float d = distance(p, uCamPos.xz);
  float w = smoothstep(70.0, 55.0, d);
  if (w <= 0.0) return fFar;
  return mix(fFar, sampleFieldNear(p), w);
}
float groundY(vec2 p){ return sampleGround(p).x; }
`;

/* ------------------------------------------------------------------ *
 *  sky, cloud deck, and the air between here and the horizon
 * ------------------------------------------------------------------ */
const GLSL_SKY = /* glsl */`
uniform vec3  uSunDir;
uniform vec3  uSunCol;
uniform float uCloudCover;
uniform vec2  uCloudDrift;
uniform vec4  uCloudBlob[8];    // xy centre on the deck, z radius, w mass
uniform float uWarmth;

// broad accumulated masses with real negative space; seeded blobs keep cloud
// identity fixed across quality tiers
float cloudField(vec2 uv, int oct){
  // two warps at different scales: without this the perspective projection lays the
  // deck down in concentric bands, which reads as a mackerel pattern, not as weather
  vec2 w1 = vec2(fbm2(uv*0.21, 3), fbm2(uv*0.21 + vec2(37.1,11.7), 3));
  vec2 w2 = vec2(fbm2(uv*0.83 + vec2(5.3,9.1), 2), fbm2(uv*0.83 + vec2(21.7,3.3), 2));
  float d = fbmAbs2(uv + (w1-0.5)*3.10 + (w2-0.5)*0.85, oct);
  for (int i=0;i<8;i++){
    vec4 b = uCloudBlob[i];
    if (b.w <= 0.0) continue;
    float q = length((uv - b.xy)/max(b.z,0.001));
    d += b.w * 0.42 * smoothstep(1.0, 0.18, q);
  }
  return d;
}
float cloudMask(vec2 uv, int oct){
  float d = cloudField(uv, oct);
  return smoothstep(uCloudCover, uCloudCover + 0.30, d);
}

// project a view ray onto the deck
vec2 deckUV(vec3 dir, float height, float scale){
  // clamped so the deck compresses into the distance instead of smearing into ripples
  float t = height / max(dir.y, 0.075);
  return (dir.xz * t) * scale + uCloudDrift;
}

vec3 skyColor(vec3 dir, float clouds){
  float up = clamp(dir.y, -0.2, 1.0);
  float sunAmt = clamp(dot(normalize(vec3(uSunDir.x,0.0,uSunDir.z)), normalize(vec3(dir.x,0.0,dir.z))), 0.0, 1.0);
  sunAmt = pow(sunAmt, 2.2);

  vec3 zenith  = s2l(vec3(0.208,0.278,0.361))*0.86;
  vec3 horCold = s2l(vec3(0.573,0.639,0.682))*0.88;
  vec3 horWarm = s2l(vec3(0.827,0.667,0.510))*0.92;
  vec3 hor = mix(horCold, horWarm, sunAmt * (0.35 + 0.65*uWarmth));
  vec3 col = mix(hor, zenith, pow(clamp(up,0.0,1.0), 0.62));

  // low sun sitting just clear of the horizon
  float sd = max(dot(dir, uSunDir), 0.0);
  col += uSunCol * pow(sd, 900.0) * 5.5;
  col += uSunCol * pow(sd, 26.0) * 0.30 * uWarmth;

  if (clouds > 0.0){
    vec2 uvL = deckUV(dir, 1.0, 1.15);
    float m  = cloudMask(uvL, 5);
    float dens = cloudField(uvL, 5);
    // sun-facing flank sampled by stepping the field toward the sun: warm tops, cool bases
    float lit = cloudField(uvL + normalize(uSunDir.xz)*0.16, 4) - dens;
    float top = smoothstep(-0.06, 0.10, lit);
    vec3 cbase = s2l(vec3(0.325,0.365,0.416))*0.90;
    vec3 ctop  = mix(s2l(vec3(0.749,0.769,0.769)), s2l(vec3(0.882,0.749,0.596)), sunAmt*uWarmth)*0.94;
    vec3 ccol  = mix(cbase, ctop, top);
    float horizonSquash = smoothstep(0.030, 0.30, dir.y);   // deck compresses into the distance
    col = mix(col, ccol, m * horizonSquash * clouds);

    // a thin high layer for scale contrast
    vec2 uvH = deckUV(dir, 1.0, 0.42) * 1.7;
    float mh = smoothstep(uCloudCover+0.12, uCloudCover+0.40, fbmAbs2(uvH, 4));
    col = mix(col, mix(cbase, ctop, 0.72), mh * horizonSquash * 0.30 * clouds);
  }
  // mist stacked over the far water
  float band = exp(-max(dir.y,0.0)*10.0);
  col = mix(col, mix(s2l(vec3(0.545,0.600,0.635)), s2l(vec3(0.706,0.639,0.573)), sunAmt*uWarmth), band*0.50);
  return col;
}

// same field, sampled from the ground along the sun ray: the shadows on the marsh
// are cast by the clouds you can actually see
float cloudShadow(vec2 worldXZ){
  vec2 uv = (worldXZ + uSunDir.xz / max(uSunDir.y,0.06) * 900.0) * 0.00092 * 1.15 + uCloudDrift;
  float m = cloudMask(uv, 4);
  return 1.0 - m * 0.62;
}
`;

const GLSL_AIR = /* glsl */`
uniform float uHaze;
uniform float uMist;

// distance + height haze; everything converges on the sky it sits in front of
vec3 applyAir(vec3 col, vec3 worldPos, vec3 viewDir){
  float d = distance(worldPos, uCamPos);
  float hFade = exp(-max(worldPos.y + 1.0, 0.0) * 0.10);
  float f = 1.0 - exp(-d * uHaze * (0.55 + 0.45*hFade));
  vec3 air = skyColor(normalize(vec3(viewDir.x, max(viewDir.y, -0.02), viewDir.z)), 0.55);
  col = mix(col, air, clamp(f, 0.0, 0.985));
  // a low sheet of mist lying on the water
  float mist = uMist * smoothstep(2.6, 0.0, worldPos.y) * (1.0 - exp(-d*0.00085));
  return mix(col, air * 1.06, clamp(mist, 0.0, 0.72));
}
`;

/* ------------------------------------------------------------------ *
 *  shadows — one tight ortho map around the rider, important casters only
 * ------------------------------------------------------------------ */
const GLSL_SHADOW = /* glsl */`
uniform sampler2D uShadowTex;
uniform mat4  uShadowMat;
uniform float uShadowTexel;
uniform float uShadowOn;

float shadowAt(vec3 worldPos, float ndl){
  if (uShadowOn < 0.5) return 1.0;
  vec4 sp = uShadowMat * vec4(worldPos, 1.0);
  vec3 c = sp.xyz / sp.w;
  if (c.x < 0.001 || c.x > 0.999 || c.y < 0.001 || c.y > 0.999 || c.z > 1.0) return 1.0;
  float bias = 0.0016 + 0.0060 * (1.0 - ndl);
  float s = 0.0;
  for (int y=-1; y<=1; y++) for (int x=-1; x<=1; x++){
    float d = texture2D(uShadowTex, c.xy + vec2(float(x),float(y))*uShadowTexel).x;
    s += (c.z - bias > d) ? 0.0 : 1.0;
  }
  s /= 9.0;
  // let it dissolve at the edge of the map instead of ending on a line
  vec2 e = abs(c.xy - 0.5) * 2.0;
  return mix(1.0, s, 1.0 - smoothstep(0.80, 0.99, max(e.x, e.y)));
}
`;

/* ------------------------------------------------------------------ *
 *  lighting — key + sky dome + ground bounce, wrapped for soft first light
 * ------------------------------------------------------------------ */
const GLSL_LIGHT = /* glsl */`
uniform vec3 uSkyAmb;
uniform vec3 uGndAmb;
uniform float uShadowStr;

vec3 shade(vec3 N, vec3 albedo, vec3 worldPos, float ao, float wrap, float transl){
  float ndl = dot(N, uSunDir);
  float key = clamp((ndl + wrap) / (1.0 + wrap), 0.0, 1.0);
  float sh  = shadowAt(worldPos, clamp(ndl,0.0,1.0));
  float cs  = cloudShadow(worldPos.xz);
  float lit = key * mix(1.0, sh, uShadowStr) * cs;

  float sky = 0.5 + 0.5 * N.y;                       // hemisphere
  vec3 amb = uSkyAmb * sky + uGndAmb * (1.0 - sky);

  // thin leaves and reed blades pass a little light from behind
  float back = clamp(-ndl, 0.0, 1.0) * transl * cs;

  return albedo * (amb * ao + uSunCol * lit * 1.15 + uSunCol * back * 0.55);
}
`;

const GLSL_DITHER = /* glsl */`
float ordered(vec2 p){
  // 8x8 ordered matrix, generated arithmetically
  ivec2 q = ivec2(mod(p, 8.0));
  int i = q.x + q.y*8;
  int b = 0;
  b += ((i>>0)&1)<<5; b += ((i>>3)&1)<<4;
  b += ((i>>1)&1)<<3; b += ((i>>4)&1)<<2;
  b += ((i>>2)&1)<<1; b += ((i>>5)&1);
  return float(b)/64.0 - 0.5;
}
`;

const GLSL_HEAD = GLSL_PALETTE + GLSL_NOISE + GLSL_FIELD;

/** Uniform block shared by every world material — updated once per frame. */
function makeSharedUniforms() {
  const blob = []; for (let i = 0; i < 8; i++) blob.push(new THREE.Vector4(0, 0, 0, 0));
  const fa = []; const fb = [];
  for (let i = 0; i < 3; i++) { fa.push(new THREE.Vector4()); fb.push(new THREE.Vector4()); }
  return {
    uTime: { value: 0 },
    uCamPos: { value: new THREE.Vector3() },
    uSunDir: { value: new THREE.Vector3(0, 0.2, 1) },
    uSunCol: { value: new THREE.Color(1, 0.86, 0.7) },
    uSkyAmb: { value: new THREE.Color(0.30, 0.38, 0.46) },
    uGndAmb: { value: new THREE.Color(0.14, 0.15, 0.12) },
    uWarmth: { value: 0.5 },
    uHaze: { value: 0.00075 },
    uMist: { value: 0.5 },
    uCloudCover: { value: 0.42 },
    uCloudDrift: { value: new THREE.Vector2() },
    uCloudBlob: { value: blob },
    uWindDir: { value: new THREE.Vector2(1, 0) },
    uWindBase: { value: 4 },
    uWindAng: { value: 0 },
    uFrontA: { value: fa },
    uFrontB: { value: fb },
    uFieldTex: { value: null },
    uFieldCenter: { value: new THREE.Vector2() },
    uFieldSpan: { value: 2400 },
    uFieldTexN: { value: null },
    uFieldCenterN: { value: new THREE.Vector2() },
    uFieldSpanN: { value: 160 },
    uShadowTex: { value: null },
    uShadowMat: { value: new THREE.Matrix4() },
    uShadowTexel: { value: 1 / 1024 },
    uShadowOn: { value: 1 },
    uShadowStr: { value: 1 },
    uTideY: { value: 0 },
  };
}

/** Merge shared uniforms into a material's own set without copying values. */
function withShared(shared, own) {
  const o = Object.assign({}, own);
  for (const k in shared) if (!(k in o)) o[k] = shared[k];
  return o;
}


/* ==== 40_sky.js ========================================================= */
/* ==================================================================
 *  SKY
 *  A full-screen ray-reconstructed dome. No geometry, no seams, and the
 *  exact same cloud field the ground reads for its shadows.
 * ================================================================== */
function makeSky(shared) {
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([-1, -1, 0, 3, -1, 0, -1, 3, 0]), 3));
  const mat = new THREE.RawShaderMaterial({
    uniforms: withShared(shared, { uInvVP: { value: new THREE.Matrix4() } }),
    depthTest: false, depthWrite: false,
    glslVersion: THREE.GLSL1,
    vertexShader: /* glsl */`
      precision highp float;
      attribute vec3 position; varying vec2 vNdc;
      void main(){ vNdc = position.xy; gl_Position = vec4(position.xy, 1.0, 1.0); }`,
    fragmentShader: /* glsl */`
      precision highp float;
      varying vec2 vNdc;
      uniform mat4 uInvVP; uniform vec3 uCamPos;
      ${GLSL_PALETTE}${GLSL_NOISE}
      ${GLSL_SKY}
      void main(){
        vec4 p0 = uInvVP * vec4(vNdc, -1.0, 1.0);
        vec4 p1 = uInvVP * vec4(vNdc,  1.0, 1.0);
        vec3 dir = normalize(p1.xyz/p1.w - p0.xyz/p0.w);
        gl_FragColor = vec4(skyColor(dir, 1.0), 1.0);
      }`,
  });
  const m = new THREE.Mesh(geo, mat);
  m.frustumCulled = false;
  m.renderOrder = -1000;
  m.userData.mat = mat;
  return m;
}


/* ==== 45_terrain.js ===================================================== */
/* ==================================================================
 *  GROUND
 *  Two camera-following radial shells displaced on the GPU from the baked
 *  field windows, plus the road as its own exact ribbon. Nothing here is
 *  rebuilt on the CPU per frame, so the ground cannot hitch, swim or breathe.
 * ================================================================== */

const GLSL_GROUND_ALBEDO = /* glsl */`
/* One ground palette for both shells and for the ribbon's outer batter, so the road
   edge dissolves into the marsh instead of ending on an outline. */
vec3 groundAlbedo(vec2 wp, float h, float reed, float wet, float dist, out float gloss){
  vec2 warp = vec2(fbm2(wp*0.0015, 3), fbm2(wp*0.0015 + vec2(19.3,7.1), 3));
  float broad = fbm2(wp*0.0034 + (warp-0.5)*1.7, 4);       // the large value shapes
  float mid   = fbm2(wp*0.019, 3);
  float fine  = fbm2(wp*0.21, 2);
  float grain = 1.0 - smoothstep(26.0, 130.0, dist);        // micro texture fades out: no moire

  vec3 silt    = mix(s2l(C_MUD)*0.72, s2l(C_OLIVE)*0.5, mid);
  vec3 reedCol = mix(s2l(C_REED_D), s2l(C_REED), 0.30 + 0.70*broad);
  vec3 lowMead = mix(s2l(C_OLIVE)*0.80, s2l(C_LICHEN)*0.78, 0.25 + 0.55*mid);
  vec3 dryTop  = mix(s2l(C_LICHEN)*0.86, s2l(C_STRAW)*0.72, 0.30 + 0.60*broad);

  vec3 c = mix(silt, reedCol, smoothstep(-0.40, 0.12, h));
  c = mix(c, lowMead, smoothstep(0.20, 0.95, h));
  c = mix(c, dryTop,  smoothstep(1.45, 2.60, h));
  c = mix(c, reedCol * 0.60, reed * 0.66);                   // under a stand it is litter, not lawn
  c *= 0.86 + 0.22 * mix(0.5, fine, grain) + 0.30*(broad-0.5) + 0.14*(mid-0.5);
  c = mix(c, c * vec3(0.56,0.62,0.60), wet * 0.62);          // wet ground goes dark and cool
  gloss = wet * (0.35 + 0.4*grain);
  return c;
}
`;

/** Radial template: dense underfoot, geometric out to the haze.
 *  Growth is solved so the shell ends exactly where it is asked to. */
function radialGeometry(angular, rings, r0, outer, rStart) {
  const A = angular, N = rings;
  const span = outer - rStart;
  let lo = 1.0001, hi = 1.4;
  for (let it = 0; it < 60; it++) {
    const g = (lo + hi) / 2;
    const tot = r0 * (Math.pow(g, N) - 1) / (g - 1);
    if (tot > span) hi = g; else lo = g;
  }
  const growth = (lo + hi) / 2;
  const pos = new Float32Array((N + 1) * A * 3);
  const idx = [];
  let r = rStart, step = r0;
  const radii = new Float32Array(N + 1);
  for (let i = 0; i <= N; i++) { radii[i] = r; r += step; step *= growth; }
  for (let i = 0; i <= N; i++) {
    for (let j = 0; j < A; j++) {
      const a = (j / A) * TAU;
      const o = (i * A + j) * 3;
      pos[o] = Math.cos(a) * radii[i]; pos[o + 1] = 0; pos[o + 2] = Math.sin(a) * radii[i];
    }
  }
  // wound so the surface faces up: radial x tangential must come out +Y
  for (let i = 0; i < N; i++) for (let j = 0; j < A; j++) {
    const j2 = (j + 1) % A;
    const a = i * A + j, b = i * A + j2, c = (i + 1) * A + j, d = (i + 1) * A + j2;
    idx.push(a, b, c, b, d, c);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.boundingSphere = new THREE.Sphere(new THREE.Vector3(), radii[N] * 1.05);
  return { geo: g, outer: radii[N] };
}

function makeGroundMaterial(shared, opts) {
  return new THREE.ShaderMaterial({
    uniforms: withShared(shared, { uCenter: { value: new THREE.Vector2() }, uSampleStep: { value: opts.step } }),
    side: THREE.FrontSide,
    polygonOffset: !!opts.offset, polygonOffsetFactor: opts.offset || 0, polygonOffsetUnits: opts.offset || 0,
    vertexShader: /* glsl */`
      ${GLSL_HEAD}
      uniform vec2 uCenter; uniform float uSampleStep;
      varying vec3 vWorld; varying vec3 vNormal; varying vec4 vFld;
      void main(){
        vec2 wp = position.xz + uCenter;
        vec4 f = sampleGround(wp);
        float e = uSampleStep;
        float hx = sampleGround(wp + vec2(e,0.0)).x - sampleGround(wp - vec2(e,0.0)).x;
        float hz = sampleGround(wp + vec2(0.0,e)).x - sampleGround(wp - vec2(0.0,e)).x;
        vNormal = normalize(vec3(-hx, 2.0*e, -hz));
        vWorld = vec3(wp.x, f.x, wp.y);
        vFld = f;
        gl_Position = projectionMatrix * viewMatrix * vec4(vWorld, 1.0);
      }`,
    fragmentShader: /* glsl */`
      ${GLSL_HEAD}${GLSL_SKY}${GLSL_SHADOW}${GLSL_LIGHT}${GLSL_AIR}${GLSL_GROUND_ALBEDO}
      varying vec3 vWorld; varying vec3 vNormal; varying vec4 vFld;
      void main(){
        vec3 V = vWorld - uCamPos;
        float dist = length(V);
        vec3 N = normalize(vNormal);
        float gloss;
        vec3 alb = groundAlbedo(vWorld.xz, vFld.x, vFld.z, vFld.w, dist, gloss);
        vec3 col = shade(N, alb, vWorld, 0.86 + 0.14*N.y, 0.42, 0.0);
        // damp wet sheen at grazing angles rather than adding plastic highlights
        vec3 H = normalize(uSunDir - normalize(V));
        col += uSunCol * pow(max(dot(N,H),0.0), 42.0) * gloss * 0.16 * cloudShadow(vWorld.xz);
        gl_FragColor = vec4(applyAir(col, vWorld, normalize(V)), 1.0);
      }`,
  });
}

class Ground {
  constructor(shared, quality) {
    const q = quality;
    // near shell: 0 -> 112 m, driven by the 0.66 m field window
    const nr = radialGeometry(q.groundNearA, q.groundNearN, 0.55, 112, 0.0);
    this.nearMat = makeGroundMaterial(shared, { step: 0.7 });
    this.near = new THREE.Mesh(nr.geo, this.nearMat);
    // far shell: overlaps the near band, then runs out to the haze
    const fr = radialGeometry(q.groundFarA, q.groundFarN, 1.5, 4300, 55.0);
    this.farMat = makeGroundMaterial(shared, { step: 4.5, offset: 1 });
    this.far = new THREE.Mesh(fr.geo, this.farMat);
    for (const m of [this.near, this.far]) { m.frustumCulled = false; m.matrixAutoUpdate = false; }
    this.group = new THREE.Group();
    this.group.add(this.far, this.near);
    this.outer = fr.outer;
    this.tris = (q.groundNearA * q.groundNearN + q.groundFarA * q.groundFarN) * 2;
  }
  update(cx, cz) {
    // snap so the tessellation never crawls under a stationary camera
    const sx = Math.round(cx * 2) / 2, sz = Math.round(cz * 2) / 2;
    this.nearMat.uniforms.uCenter.value.set(sx, sz);
    this.farMat.uniforms.uCenter.value.set(Math.round(cx / 4) * 4, Math.round(cz / 4) * 4);
  }
  dispose() { this.near.geometry.dispose(); this.far.geometry.dispose(); this.nearMat.dispose(); this.farMat.dispose(); }
}

/* ==================================================================
 *  ROAD RIBBON
 *  Built directly from the same cross-section the terrain field uses, so the
 *  carriageway is supported by construction rather than by luck. Streamed in
 *  chunks by world distance, so both fork arms are drawn whenever visible.
 * ================================================================== */

// carriageway | seam | wet gravel | sedge verge | batter | marsh
const RIB_LAT = [-22, -16, -11.5, -9.2, -7.75, -6.3, -4.85, -3.8, -2.70, -2.36, -1.55, -0.78,
  0, 0.78, 1.55, 2.36, 2.70, 3.8, 4.85, 6.3, 7.75, 9.2, 11.5, 16, 22];
const RIB_W = RIB_LAT.length;

const GLSL_ROAD = /* glsl */`
varying float vLat; varying float vAlong; varying float vWear;
`;

function makeRoadMaterial(shared) {
  return new THREE.ShaderMaterial({
    uniforms: withShared(shared, {}),
    polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2,
    vertexShader: /* glsl */`
      ${GLSL_HEAD}
      attribute float aLat; attribute float aAlong; attribute float aWear;
      varying vec3 vWorld; varying vec3 vNormal; ${GLSL_ROAD}
      void main(){
        vWorld = position; vNormal = normal;
        vLat = aLat; vAlong = aAlong; vWear = aWear;
        gl_Position = projectionMatrix * viewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: /* glsl */`
      ${GLSL_HEAD}${GLSL_SKY}${GLSL_SHADOW}${GLSL_LIGHT}${GLSL_AIR}${GLSL_GROUND_ALBEDO}
      varying vec3 vWorld; varying vec3 vNormal; ${GLSL_ROAD}
      void main(){
        vec3 V = vWorld - uCamPos; float dist = length(V);
        float a = abs(vLat);
        float grain = 1.0 - smoothstep(46.0, 190.0, dist);

        // --- carriageway: graphite, not grey. Aggregate, patching, wheel polish.
        float agg  = fbm2(vWorld.xz * 4.3, 3);
        float agg2 = fbm2(vWorld.xz * 22.0, 2);
        float wornPatch = smoothstep(0.52, 0.78, fbm2(vWorld.xz*0.09 + vec2(3.1,8.4), 3));
        vec3 road = mix(s2l(C_ROAD), s2l(C_ROAD2), 0.30 + 0.55*agg);
        road = mix(road, s2l(C_ROAD)*0.74, wornPatch*0.62);
        road *= 0.84 + 0.34*mix(0.5, agg2, grain);
        // two faint polished wheel tracks, and grit gathering at the edges
        float track = exp(-pow((a-0.86)/0.42, 2.0)) + exp(-pow((a-1.62)/0.34, 2.0));
        road *= 1.0 + 0.10*track*grain;
        float edgeGrit = smoothstep(1.55, 2.36, a);
        road = mix(road, mix(road, s2l(C_MUD), 0.42), edgeGrit * (0.35 + 0.5*vWear));

        // --- dark contact seam: the road's own shadow line into the ground
        float seam = smoothstep(2.36, 2.44, a) * (1.0 - smoothstep(2.62, 2.74, a));
        // --- wet gravel / broken loam
        float gv = fbm2(vWorld.xz*3.1, 3), gv2 = fbm2(vWorld.xz*13.0, 2);
        vec3 gravel = mix(s2l(C_STONE)*0.62, s2l(C_MUD)*1.05, 0.35+0.5*gv);
        gravel *= 0.82 + 0.34*mix(0.5, gv2, grain);
        gravel = mix(gravel, gravel*0.66, smoothstep(0.45,0.85,fbm2(vWorld.xz*0.5,2)));  // puddled patches
        // --- sedge verge, then the batter handing over to open marsh
        float gloss;
        // the batter is made ground, not upland: read it at bank height so a 4 m causeway
        // does not paint itself dry straw all the way down to the waterline
        vec3 marsh = groundAlbedo(vWorld.xz, min(vWorld.y, 1.15), 0.60, 0.35, dist, gloss);
        vec3 verge = mix(s2l(C_REED_D)*0.82, s2l(C_OLIVE)*0.78, 0.35 + 0.4*fbm2(vWorld.xz*0.8,3));

        vec3 col = road;
        col = mix(col, gravel, smoothstep(2.62, 3.05, a));
        col = mix(col, verge,  smoothstep(3.60, 5.00, a));
        col = mix(col, marsh,  smoothstep(5.80, 8.00, a));
        col *= 1.0 - seam * 0.42;
        // no continuous bright outline anywhere: the edge is a seam, then gravel, then green

        vec3 N = normalize(vNormal);
        float wet = smoothstep(3.1, 5.4, a) * 0.5;
        vec3 lit = shade(N, col, vWorld, 0.92, 0.35, 0.0);
        vec3 H = normalize(uSunDir - normalize(V));
        float sheen = smoothstep(2.36, 0.0, a) * 0.10 + wet*0.22;
        lit += uSunCol * pow(max(dot(N,H),0.0), 60.0) * sheen * cloudShadow(vWorld.xz);
        gl_FragColor = vec4(applyAir(lit, vWorld, normalize(V)), 1.0);
      }`,
  });
}

class RoadRibbon {
  constructor(fields, shared, quality) {
    this.F = fields; this.q = quality;
    this.mat = makeRoadMaterial(shared);
    this.group = new THREE.Group();
    this.chunks = new Map();       // key -> {mesh, key}
    this.pool = [];
    this.tris = 0;
    this.CHUNK = 96;               // metres of carriageway per chunk
  }

  /** One chunk of one carriageway, built entirely from the field cross-section. */
  _build(poly, s0, s1, seedBase) {
    const F = this.F;
    // stations get sparser with distance from the chunk start; the ribbon is cheap either way
    const stations = [];
    for (let s = s0; s < s1; s += 4) stations.push(s);
    stations.push(s1);
    const NS = stations.length;
    const pos = new Float32Array(NS * RIB_W * 3);
    const nrm = new Float32Array(NS * RIB_W * 3);
    const lat = new Float32Array(NS * RIB_W);
    const alo = new Float32Array(NS * RIB_W);
    const wea = new Float32Array(NS * RIB_W);
    const P = { x: 0, z: 0, y: 0, h: 0 };

    const at = (s, out) => {
      const f = clamp(s / Math.max(1e-6, poly.len), 0, 1) * (poly.n - 1);
      const i = Math.min(poly.n - 2, Math.floor(f)), u = f - i;
      out.x = lerp(poly.x[i], poly.x[i + 1], u);
      out.z = lerp(poly.z[i], poly.z[i + 1], u);
      out.y = lerp(poly.y[i], poly.y[i + 1], u);
      out.h = poly.h[i] + angDiff(poly.h[i], poly.h[i + 1]) * u;
    };

    for (let si = 0; si < NS; si++) {
      const s = stations[si];
      at(s, P);
      const nx = -Math.sin(P.h), nz = Math.cos(P.h);
      const wear = 0.5 + 0.5 * fbm(s * 0.011, seedBase * 0.37, F.nz + 4242, 3);
      for (let li = 0; li < RIB_W; li++) {
        const t = RIB_LAT[li];
        const x = P.x + nx * t, z = P.z + nz * t;
        // the single authority — identical call the terrain field bakes from
        const r = F.roadAt(x, z);
        const marsh = F.marshH(x, z);
        const y = r ? F.roadProfile(r.d, r.y, marsh) : marsh;
        const o = (si * RIB_W + li) * 3;
        pos[o] = x; pos[o + 1] = y; pos[o + 2] = z;
        lat[si * RIB_W + li] = t;
        alo[si * RIB_W + li] = s;
        wea[si * RIB_W + li] = wear;
      }
    }
    // normals from the built grid
    for (let si = 0; si < NS; si++) for (let li = 0; li < RIB_W; li++) {
      const i0 = (si * RIB_W + li) * 3;
      const iA = (Math.max(0, si - 1) * RIB_W + li) * 3, iB = (Math.min(NS - 1, si + 1) * RIB_W + li) * 3;
      const iL = (si * RIB_W + Math.max(0, li - 1)) * 3, iR = (si * RIB_W + Math.min(RIB_W - 1, li + 1)) * 3;
      const ax = pos[iB] - pos[iA], ay = pos[iB + 1] - pos[iA + 1], az = pos[iB + 2] - pos[iA + 2];
      const bx = pos[iR] - pos[iL], by = pos[iR + 1] - pos[iL + 1], bz = pos[iR + 2] - pos[iL + 2];
      let nx2 = ay * bz - az * by, ny2 = az * bx - ax * bz, nz2 = ax * by - ay * bx;
      const l = Math.hypot(nx2, ny2, nz2) || 1;
      if (ny2 < 0) { nx2 = -nx2; ny2 = -ny2; nz2 = -nz2; }
      nrm[i0] = nx2 / l; nrm[i0 + 1] = ny2 / l; nrm[i0 + 2] = nz2 / l;
    }
    const idx = [];
    // along x lateral must come out +Y, or the carriageway is a back face
    for (let si = 0; si < NS - 1; si++) for (let li = 0; li < RIB_W - 1; li++) {
      const a = si * RIB_W + li, b = a + 1, c = a + RIB_W, d = c + 1;
      idx.push(a, b, c, b, d, c);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('normal', new THREE.BufferAttribute(nrm, 3));
    g.setAttribute('aLat', new THREE.BufferAttribute(lat, 1));
    g.setAttribute('aAlong', new THREE.BufferAttribute(alo, 1));
    g.setAttribute('aWear', new THREE.BufferAttribute(wea, 1));
    g.setIndex(idx);
    g.computeBoundingSphere();
    return { geo: g, tris: idx.length / 3 };
  }

  /** Keep chunks resident by world distance so the far arm of the fork is drawn too. */
  update(camX, camZ, budget) {
    const want = new Set();
    const R = this.q.roadRange;
    for (const rp of this.F.roadPolys) {
      const poly = rp.p, nC = Math.ceil(poly.len / this.CHUNK);
      // coarse proximity test per chunk using its mid-station
      for (let c = 0; c < nC; c++) {
        const sMid = (c + 0.5) * this.CHUNK;
        const i = clamp(Math.round((sMid / poly.len) * (poly.n - 1)), 0, poly.n - 1);
        const d = Math.hypot(poly.x[i] - camX, poly.z[i] - camZ);
        if (d < R) want.add(rp.id + ':' + c);
      }
    }
    for (const [k, ch] of this.chunks) {
      if (!want.has(k)) { this.group.remove(ch.mesh); ch.mesh.geometry.dispose(); this.tris -= ch.tris; this.chunks.delete(k); }
    }
    let built = 0;
    for (const k of want) {
      if (this.chunks.has(k)) continue;
      if (built >= budget) break;
      const [id, cs] = k.split(':');
      const rp = this.F.roadPolys.find((r) => r.id === id);
      const c = +cs;
      const s0 = c * this.CHUNK, s1 = Math.min(rp.p.len, (c + 1) * this.CHUNK + 4);
      if (s1 - s0 < 1) continue;
      const r = this._build(rp.p, s0, s1, hashStr(k));
      const mesh = new THREE.Mesh(r.geo, this.mat);
      mesh.frustumCulled = true; mesh.matrixAutoUpdate = false;
      this.group.add(mesh);
      this.chunks.set(k, { mesh, tris: r.tris });
      this.tris += r.tris; built++;
    }
    return built;
  }
  clear() {
    for (const [, ch] of this.chunks) { this.group.remove(ch.mesh); ch.mesh.geometry.dispose(); }
    this.chunks.clear(); this.tris = 0;
  }
  dispose() { this.clear(); this.mat.dispose(); }
}


/* ==== 50_water.js ======================================================= */
/* ==================================================================
 *  WATER
 *  One tide plane. Depth bands and foam come from the same baked field the
 *  ground uses; roughness, drift and glitter come from the same wind
 *  authority the reeds use. Sheltered water goes to glass, exposed water
 *  breaks to silver, and the tide wheel is reflected by an actual ray
 *  bounce off the surface rather than a painted-on circle.
 * ================================================================== */
function makeWaterMaterial(shared) {
  return new THREE.ShaderMaterial({
    transparent: true, depthWrite: true, side: THREE.FrontSide,
    uniforms: withShared(shared, {
      uCenter: { value: new THREE.Vector2() },
      uWheelC: { value: new THREE.Vector3() },      // hub centre
      uWheelN: { value: new THREE.Vector3(1, 0, 0) }, // wheel plane normal (its axle)
      uWheelP: { value: new THREE.Vector4(0, 0, 0, 0) }, // radius, rimWidth, paddles, angle
      uWheelOn: { value: 0 },
      uFlow: { value: [new THREE.Vector4(), new THREE.Vector4()] },   // xz, radius, strength
      uRefl: { value: [new THREE.Vector4(), new THREE.Vector4(), new THREE.Vector4(), new THREE.Vector4(), new THREE.Vector4(), new THREE.Vector4()] },
      uStill: { value: 0 },
    }),
    vertexShader: /* glsl */`
      ${GLSL_HEAD}${GLSL_WIND}
      uniform vec2 uCenter;
      varying vec3 vWorld; varying float vDist; varying vec4 vFld; varying float vEx;
      void main(){
        vec2 wp = position.xz + uCenter;
        vFld = sampleFieldFar(wp);
        vEx = vFld.y;
        vec3 w = windAt(wp, vEx);
        float amp = 0.010 + 0.028 * smoothstep(1.0, 8.0, w.z);
        float ph = dot(wp, w.xy);
        float y = uTideY + amp * (sin(ph*0.55 - uTime*1.7) + 0.6*sin(ph*1.31 + uTime*2.4));
        vWorld = vec3(wp.x, y, wp.y);
        vDist = distance(vWorld, uCamPos);
        gl_Position = projectionMatrix * viewMatrix * vec4(vWorld, 1.0);
      }`,
    fragmentShader: /* glsl */`
      ${GLSL_HEAD}${GLSL_WIND}${GLSL_SKY}${GLSL_SHADOW}${GLSL_AIR}
      uniform vec3 uWheelC; uniform vec3 uWheelN; uniform vec4 uWheelP; uniform float uWheelOn;
      uniform vec4 uFlow[2]; uniform vec4 uRefl[6]; uniform float uStill;
      varying vec3 vWorld; varying float vDist; varying vec4 vFld; varying float vEx;

      // ripple normal: three scrolling octaves, all travelling with the wind
      vec3 rippleNormal(vec2 p, vec2 dir, float strength, float detail){
        float e = 0.35;
        vec2 d1 = dir * uTime * 0.55, d2 = dir * uTime * 0.31, d3 = dir * uTime * 1.15;
        float s = 0.0;
        s += fbm2(p*0.55 + d1, 3) * 1.0;
        s += fbm2(p*1.90 - d2, 2) * 0.55 * detail;
        s += fbm2(p*6.10 + d3, 2) * 0.22 * detail;
        float sx = 0.0, sz = 0.0;
        sx += fbm2((p+vec2(e,0.0))*0.55 + d1, 3) - fbm2((p-vec2(e,0.0))*0.55 + d1, 3);
        sz += fbm2((p+vec2(0.0,e))*0.55 + d1, 3) - fbm2((p-vec2(0.0,e))*0.55 + d1, 3);
        sx += (fbm2((p+vec2(e,0.0))*1.90 - d2, 2) - fbm2((p-vec2(e,0.0))*1.90 - d2, 2)) * 0.6 * detail;
        sz += (fbm2((p+vec2(0.0,e))*1.90 - d2, 2) - fbm2((p-vec2(0.0,e))*1.90 - d2, 2)) * 0.6 * detail;
        return normalize(vec3(-sx * strength, 0.30, -sz * strength));
      }

      void main(){
        vec3 V = normalize(vWorld - uCamPos);
        float depth = max(0.0, uTideY - vFld.x);
        float shore = smoothstep(-0.02, 0.12, depth);
        if (shore <= 0.001) discard;

        vec3 w = windAt(vWorld.xz, vEx);
        float ws = w.z;
        float detail = 1.0 - smoothstep(90.0, 420.0, vDist);      // no shimmering at range
        float rough = smoothstep(1.2, 7.0, ws) * (0.25 + 0.75*vEx);

        // local acceleration where water is squeezed through the gates or past the wheel
        float accel = 0.0; vec2 flowDir = w.xy;
        for (int i=0;i<2;i++){
          vec4 f = uFlow[i]; if (f.w <= 0.0) continue;
          float d = distance(vWorld.xz, f.xy);
          float a = f.w * smoothstep(f.z, f.z*0.18, d);
          accel += a;
        }
        vec2 rp = vWorld.xz + flowDir * accel * uTime * 2.6;
        vec3 N = rippleNormal(rp, flowDir, 0.28 + 1.55*rough + accel*1.4, detail);
        /* Distant water is one sheet, not a field of separate ripples. Flattening the
           normal with range is the analytic equivalent of a mip: without it the grazing
           fresnel term swings between body colour and bright overcast from pixel to
           pixel, and a calm tide reads as salt-and-pepper glitter. */
        N = normalize(mix(N, vec3(0.0, 1.0, 0.0), smoothstep(22.0, 130.0, vDist)));

        // --- colour: shallow olive silt through to deep slate
        vec3 shallow = s2l(vec3(0.353,0.361,0.259));
        vec3 mid     = s2l(vec3(0.196,0.263,0.251));
        vec3 deep    = s2l(vec3(0.086,0.129,0.157));
        vec3 body = mix(shallow, mid, smoothstep(0.05, 0.55, depth));
        body = mix(body, deep, smoothstep(0.55, 1.9, depth));
        body *= 0.85 + 0.3*fbm2(vWorld.xz*0.045, 3);

        // --- reflected sky. Sheltered water mirrors hard; broken water scatters it.
        vec3 R = reflect(V, N);
        R.y = abs(R.y) * mix(1.0, 0.55, rough) + 0.012;
        vec3 sky = skyColor(normalize(R), 1.0);
        float fres = pow(1.0 - max(dot(-V, N), 0.0), 3.2);
        // and settle the grazing term itself, so a far tide is a value, not a stipple
        fres = mix(fres, 0.52, smoothstep(28.0, 190.0, vDist));
        float mirror = mix(0.90, 0.34, rough);
        vec3 col = mix(body, sky, clamp(fres*mirror + 0.10*mirror, 0.0, 0.95));

        // --- vertical smears from things standing at the edge (willows, posts, masonry)
        for (int i=0;i<6;i++){
          vec4 r = uRefl[i]; if (r.w <= 0.0) continue;
          vec2 toC = vWorld.xz - r.xy;
          vec2 view = normalize(vWorld.xz - uCamPos.xz);
          float along = dot(toC, view);
          float side = length(toC - view*along);
          float smear = smoothstep(r.z, r.z*0.25, side) * smoothstep(0.0, -r.z*2.2, along);
          smear *= (1.0 - rough*0.75) * (0.4 + 0.6*uStill);
          smear *= 0.6 + 0.4*fbm2(vWorld.xz*1.6 + w.xy*uTime*0.4, 2);
          col = mix(col, col * (0.30 + 0.25*r.w), smear * 0.8);
        }

        // --- the tide wheel, reflected by bouncing the view ray off this fragment
        if (uWheelOn > 0.5){
          float den = dot(R, uWheelN);
          if (abs(den) > 0.0025){
            float t = dot(uWheelC - vWorld, uWheelN) / den;
            if (t > 0.0){
              vec3 hit = vWorld + R * t;
              if (hit.y > 0.02){
                vec3 rel = hit - uWheelC;
                float rr = length(rel - uWheelN*dot(rel,uWheelN));
                float rim = smoothstep(uWheelP.x, uWheelP.x - uWheelP.y, rr) * step(uWheelP.x - uWheelP.y*2.6, rr);
                float ang = atan(rel.y, dot(rel, normalize(cross(uWheelN, vec3(0.0,1.0,0.0)))));
                float sp = smoothstep(0.80, 0.99, abs(cos((ang - uWheelP.w) * uWheelP.z * 0.5)));
                float mask = clamp(rim + sp * step(rr, uWheelP.x) * 0.75, 0.0, 1.0);
                mask *= (1.0 - rough*0.8) * smoothstep(120.0, 25.0, vDist);
                col = mix(col, s2l(C_WOOD) * 0.28, mask * 0.88);
              }
            }
          }
        }

        // --- glitter: only when the sun lines up, and never a permanent sheet
        vec3 sunR = reflect(-uSunDir, N);
        float spec = pow(max(dot(sunR, -V), 0.0), 260.0);
        float align = smoothstep(0.35, 0.92, dot(normalize(vec2(-V.x,-V.z)), normalize(uSunDir.xz)));
        float sparkle = smoothstep(0.55, 0.85, fbm2(vWorld.xz*7.0 + w.xy*uTime*1.3, 2)) * detail;
        col += uSunCol * spec * align * (0.35 + 0.65*sparkle) * (0.4 + 1.5*rough) * cloudShadow(vWorld.xz) * 1.45;

        // --- foam: at the waterline, and wherever the flow is forced
        float bankFoam = smoothstep(0.30, 0.05, depth) * (0.35 + 0.65*rough);
        float lace = smoothstep(0.45, 0.80, fbm2(vWorld.xz*2.2 + w.xy*uTime*0.6, 3));
        float foam = bankFoam * lace + accel * smoothstep(0.42, 0.85, fbm2(rp*1.5, 3)) * 1.4;
        col = mix(col, s2l(vec3(0.847,0.855,0.820)), clamp(foam,0.0,0.78) * 0.75);

        col *= mix(1.0, cloudShadow(vWorld.xz), 0.55);
        float alpha = mix(0.60, 0.985, smoothstep(0.02, 0.85, depth)) * shore;
        gl_FragColor = vec4(applyAir(col, vWorld, V), alpha);
      }`,
  });
}

class Water {
  constructor(shared, quality) {
    const r = radialGeometry(quality.waterA, quality.waterN, 1.1, 4400, 0.0);
    this.mat = makeWaterMaterial(shared);
    this.mesh = new THREE.Mesh(r.geo, this.mat);
    this.mesh.frustumCulled = false; this.mesh.matrixAutoUpdate = false;
    this.mesh.renderOrder = 6;
    this.tris = quality.waterA * quality.waterN * 2;
  }
  update(cx, cz) { this.mat.uniforms.uCenter.value.set(Math.round(cx * 2) / 2, Math.round(cz * 2) / 2); }
  dispose() { this.mesh.geometry.dispose(); this.mat.dispose(); }
}


/* ==== 55_vegetation.js ================================================== */
/* ==================================================================
 *  VEGETATION
 *  Six families, three overlapping representations, one wind authority.
 *
 *  Everything is solid geometry — no alpha cards anywhere — so there is no
 *  card forest, no black fringing, no moire and no shimmering one-pixel stem.
 *  Distant marks get wider and simpler rather than thinner and denser, and
 *  the ground shader underpaints the rest of the coverage.
 *
 *  Placement is a pure function of the world cell, so a patch rebuilt an hour
 *  later contains exactly the same plants in exactly the same places.
 * ================================================================== */

const FAM = {
  REED: 0,      // common reed — tall, supple, seed head
  SEDGE: 1,     // sedge / rush — shorter, stiffer, blue-olive
  MEADOW: 2,    // wet meadow grass — fine, fast, straw heads
  EDGE: 3,      // aquatic edge plant — broad, dark, low
};

/** stem template: `segs` tapered segments plus an optional seed head */
function stemTemplate(segs, head) {
  const pos = [], vert = [], idx = [];
  const push = (x, y, t, s) => { pos.push(x, y, 0); vert.push(t, s); return pos.length / 3 - 1; };
  const w = (t) => 0.5 * (1 - t * 0.82) * (0.35 + 0.65 * (1 - t * t * 0.5));
  let prevL = -1, prevR = -1;
  for (let i = 0; i <= segs; i++) {
    const t = i / segs;
    const l = push(-w(t), t, t, -1), r = push(w(t), t, t, 1);
    if (i > 0) idx.push(prevL, prevR, l, l, prevR, r);
    prevL = l; prevR = r;
  }
  if (head === 'tri') {
    const a = push(-w(0.9) * 2.3, 0.84, 0.84, -1), b = push(w(0.9) * 2.3, 0.84, 0.84, 1);
    const c = push(0, 1.16, 1.16, 0);
    idx.push(a, b, c);
  } else if (head) {
    const a = push(-w(0.9) * 2.4, 0.84, 0.84, -1), b = push(w(0.9) * 2.4, 0.84, 0.84, 1);
    const c = push(-w(1) * 1.0, 1.16, 1.16, -1), d = push(w(1) * 1.0, 1.16, 1.16, 1);
    idx.push(a, b, c, c, b, d);
  }
  const g = new THREE.InstancedBufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pos), 3));
  g.setAttribute('aVert', new THREE.BufferAttribute(new Float32Array(vert), 2));
  g.setIndex(idx);
  return { geo: g, tris: idx.length / 3 };
}
/** far mark: one wide tapered triangle standing for a whole clump */
function markTemplate() {
  const g = new THREE.InstancedBufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array([-0.5, 0, 0, 0.5, 0, 0, 0, 1, 0]), 3));
  g.setAttribute('aVert', new THREE.BufferAttribute(new Float32Array([0.10, -1, 0.10, 1, 0.78, 0]), 2));
  g.setIndex([0, 1, 2]);
  return { geo: g, tris: 1 };
}

const GLSL_VEG = /* glsl */`
attribute vec2 aVert;      // x: height along the stem, y: side
attribute vec3 iPos;
attribute vec4 iA;         // height, yaw, phase, family
attribute vec4 iB;         // bend, wet, hue, value
varying vec3 vWorld; varying vec3 vNormal; varying vec4 vIB; varying float vT; varying float vFam;
varying float vLee;

void vegVertex(float widthScale, float lodFade){
  float t = aVert.x;
  float H = iA.x * lodFade;
  float yaw = iA.y, phase = iA.z;
  float fam = floor(iA.w);            // family and baked exposure share one slot, so the
  float ex  = fract(iA.w) * 1.111;    // vertex stage needs no texture fetch at all
  vFam = fam; vT = t; vIB = iB;

  // family temperament: reeds are supple and slow, sedges stiff, meadow grass fine and quick
  float stiff = fam < 0.5 ? 1.0 : (fam < 1.5 ? 1.75 : (fam < 2.5 ? 0.82 : 1.35));
  float freq  = fam < 0.5 ? 1.35 : (fam < 1.5 ? 2.05 : (fam < 2.5 ? 3.10 : 1.70));

  vLee = ex;
  vec3 wv = windAt(iPos.xz, ex);
  float carrier = sin(uTime*freq + phase + dot(iPos.xz, uWindDir)*0.085);
  float flut    = sin(uTime*freq*2.9 + phase*1.9 + dot(iPos.xz, uWindDir)*0.23);
  float amp = (wv.z / stiff) * 0.055 * (0.60 + 0.40*carrier) + (wv.z/stiff)*0.014*flut;

  float lean = pow(t, 1.7);
  vec3 local = vec3(position.x * widthScale, position.y * H, 0.0);
  // its own resting curve, then the wind on top of that
  local.x += iB.x * t * t * H * 0.26;
  float cy = cos(yaw), sy = sin(yaw);
  vec3 rot = vec3(local.x*cy, local.y, local.x*sy);
  vec3 push = vec3(wv.x, 0.0, wv.y) * amp * lean * H;
  vec3 wp = iPos + rot + push;
  wp.y -= dot(push,push) * 0.16 / max(H,0.4);      // bending shortens the stem

  // blade normal, tilted toward the sky so a marsh full of stems is not a mosaic
  vec3 bladeN = normalize(vec3(-sy, 0.0, cy));
  if (dot(bladeN, uCamPos - wp) < 0.0) bladeN = -bladeN;
  vNormal = normalize(mix(bladeN, vec3(0.0,1.0,0.0), 0.55));
  vWorld = wp;
  gl_Position = projectionMatrix * viewMatrix * vec4(wp, 1.0);
}
`;

const GLSL_VEG_FRAG = /* glsl */`
varying vec3 vWorld; varying vec3 vNormal; varying vec4 vIB; varying float vT; varying float vFam;
varying float vLee;
vec3 vegColor(){
  vec3 reed   = mix(s2l(C_REED_D), s2l(C_REED), 0.45);
  vec3 sedge  = mix(s2l(C_REED), s2l(C_OLIVE), 0.38);
  vec3 meadow = mix(s2l(C_OLIVE), s2l(C_LICHEN), 0.38);
  vec3 edgep  = mix(s2l(C_REED_D), s2l(C_MUD), 0.35);
  vec3 c = vFam < 0.5 ? reed : (vFam < 1.5 ? sedge : (vFam < 2.5 ? meadow : edgep));
  c *= 1.26;                                   // marsh green sits above the water it grows out of
  // straw at the tips, wet dark at the root — reeds are never one flat green
  c = mix(c * 0.72, c, smoothstep(0.0, 0.35, vT));
  c = mix(c, s2l(C_STRAW), smoothstep(0.80, 1.10, vT) * (0.18 + 0.42*vIB.z));
  c *= 0.80 + 0.40 * vIB.w;
  c = mix(c, c * vec3(0.62,0.68,0.62), vIB.y * 0.55);
  return c;
}
`;

function makeVegMaterial(shared, opts) {
  return new THREE.ShaderMaterial({
    uniforms: withShared(shared, { uWidth: { value: opts.width }, uValue: { value: opts.value === undefined ? 1 : opts.value }, uFade: { value: new THREE.Vector4(...opts.fade) } }),
    side: THREE.DoubleSide,
    vertexShader: /* glsl */`
      ${GLSL_HEAD}${GLSL_WIND}${GLSL_VEG}
      uniform float uWidth; uniform vec4 uFade;   // inLo, inHi, outLo, outHi
      void main(){
        float d = distance(iPos.xz, uCamPos.xz);
        float fade = smoothstep(uFade.x, uFade.y, d) * (1.0 - smoothstep(uFade.z, uFade.w, d));
        if (iA.x <= 0.0) fade = 0.0;
        vegVertex(uWidth, fade);
      }`,
    fragmentShader: /* glsl */`
      ${GLSL_HEAD}${GLSL_SKY}${GLSL_SHADOW}${GLSL_LIGHT}${GLSL_AIR}${GLSL_VEG_FRAG}
      uniform float uValue;
      void main(){
        vec3 V = vWorld - uCamPos;
        vec3 N = normalize(vNormal);
        if (!gl_FrontFacing) N = -N;
        vec3 c = vegColor() * uValue;   // a distant band is mass and value, not lit blades
        float ao = mix(0.55, 1.0, smoothstep(0.0, 0.55, vT));     // light does not reach the litter
        vec3 col = shade(N, c, vWorld, ao, 0.55, 0.85);
        gl_FragColor = vec4(applyAir(col, vWorld, normalize(V)), 1.0);
      }`,
  });
}

/* ------------------------------------------------------------------ *
 *  one streamed band
 * ------------------------------------------------------------------ */
class VegBand {
  constructor(name, tpl, mat, cfg) {
    this.name = name; this.cfg = cfg;
    this.geo = tpl.geo; this.triPer = tpl.tris;
    this.mat = mat;
    const total = cfg.slots * cfg.cap;
    this.total = total;
    this.iPos = new Float32Array(total * 3);
    this.iA = new Float32Array(total * 4);
    this.iB = new Float32Array(total * 4);
    this.aPos = new THREE.InstancedBufferAttribute(this.iPos, 3);
    this.aA = new THREE.InstancedBufferAttribute(this.iA, 4);
    this.aB = new THREE.InstancedBufferAttribute(this.iB, 4);
    for (const a of [this.aPos, this.aA, this.aB]) a.setUsage(THREE.DynamicDrawUsage);
    this.geo.setAttribute('iPos', this.aPos);
    this.geo.setAttribute('iA', this.aA);
    this.geo.setAttribute('iB', this.aB);
    this.geo.instanceCount = total;
    this.geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 1e6);
    this.mesh = new THREE.Mesh(this.geo, mat);
    this.mesh.frustumCulled = false; this.mesh.matrixAutoUpdate = false;
    this.slots = new Map();                 // patchKey -> slot
    this.free = []; for (let i = cfg.slots - 1; i >= 0; i--) this.free.push(i);
    this.dirtyLo = Infinity; this.dirtyHi = -Infinity;
    this.live = 0;
  }
  _touch(lo, hi) { if (lo < this.dirtyLo) this.dirtyLo = lo; if (hi > this.dirtyHi) this.dirtyHi = hi; }

  fill(slot, px, pz, F, plan) {
    const c = this.cfg, base = slot * c.cap, cell = c.patch;
    const salt = c.salt;
    let n = 0;
    for (let k = 0; k < c.cap; k++) {
      const hx = ihashf(px, pz, k * 7919 + salt);
      const hz = ihashf(px, pz, k * 6971 + salt + 13);
      const x = px * cell + hx * cell, z = pz * cell + hz * cell;
      const ra = F.roadAt(x, z);
      const rd = ra ? ra.d : 999;
      if (rd < c.clear) continue;                              // strict road clearance mask
      const h = F.marshH(x, z);
      /* Stand on the ground that is actually visible. Inside the road's influence that is
         the embankment, not the marsh underneath it — planting on the marsh buried every
         stem within a batter's width of the carriageway and left a mown-looking bare band
         down both sides of the whole route. Habitat is still classified by the marsh, so a
         bank of reed climbs the batter instead of turning into dry meadow. */
      let gy = h;
      if (ra) gy = h + (F.roadProfile(ra.d, ra.y, h) - h) * smoothstep(ROAD_INFL, ROAD_INFL - 8, ra.d);
      /* the beat decides what this side of the road is for: a wall of old reed, a low
         saltmarsh sward, or nothing at all because the water is out to the horizon */
      const comp = F.causewayInfo(x, z);
      const vig = clamp(F.vigour(ra) * comp.vig, 0.24, 1.85);
      const mass = comp.mass;
      const hab = F.habitat(x, z, h);
      const r3 = ihashf(px, pz, k * 5231 + salt + 29);
      // pick a family by habitat weight; inside a corridor beat the old reed beds win,
      // and on the open hand they lose to low sedge and saltmarsh grass
      /* Low vigour means saltmarsh, not hayfield: an open, wind-scoured, half-drowned
         hand of the road goes to sedge and edge plant, never to dry straw meadow. */
      const wR = hab.reed * vig * vig, wS = hab.sedge * (0.55 + 0.95 * vig);
      const wM = hab.meadow * Math.max(0.12, 1.30 - 0.58 * vig), wE = hab.edge * Math.max(0.4, 1.55 - 0.48 * vig);
      const tot = wR + wS + wM + wE;
      if (tot < 0.10) continue;
      // stands, not fur: a mid-frequency mask spends the stems where they read as shape
      const dens = sat(tot * c.densMul * (0.20 + 1.18 * F.clump(x, z)) * (0.30 + 0.86 * mass));
      if (r3 > dens) continue;
      let fam, pick = ihashf(px, pz, k * 4021 + salt + 41) * tot;
      if (pick < wR) fam = FAM.REED; else if (pick < wR + wS) fam = FAM.SEDGE;
      else if (pick < wR + wS + wM) fam = FAM.MEADOW; else fam = FAM.EDGE;

      const g = ihashf(px, pz, k * 3373 + salt + 53);
      const baseH = fam === FAM.REED ? 1.74 : fam === FAM.SEDGE ? 0.85 : fam === FAM.MEADOW ? 0.55 : 0.68;
      let H = baseH * (0.55 + 0.9 * g) * c.hMul * (fam === FAM.REED || fam === FAM.SEDGE ? vig : 1);
      // duck under the road edge so nothing ever leans onto the carriageway
      H *= smoothstep(c.clear - 0.2, c.clear + 3.2, rd) * 0.55 + 0.45;
      const o3 = (base + n) * 3, o4 = (base + n) * 4;
      this.iPos[o3] = x; this.iPos[o3 + 1] = gy - 0.04; this.iPos[o3 + 2] = z;
      this.iA[o4] = H;
      this.iA[o4 + 1] = ihashf(px, pz, k * 2791 + salt + 61) * TAU;
      this.iA[o4 + 2] = ihashf(px, pz, k * 2377 + salt + 67) * TAU;
      this.iA[o4 + 3] = fam + Math.min(0.9, F.exposure(x, z) * 0.9);
      this.iB[o4] = (ihashf(px, pz, k * 1949 + salt + 71) - 0.5) * 1.5;
      this.iB[o4 + 1] = hab.wet;
      this.iB[o4 + 2] = ihashf(px, pz, k * 1699 + salt + 79);
      this.iB[o4 + 3] = 0.35 + 0.65 * ihashf(px, pz, k * 1523 + salt + 83);
      n++;
    }
    for (let k = n; k < c.cap; k++) { this.iA[(base + k) * 4] = 0; }   // park unused slots
    this._touch(base, base + c.cap);
    return n;
  }

  update(camX, camZ, F, plan, budget) {
    const c = this.cfg, cell = c.patch;
    const reach = c.reach;
    const p0x = Math.floor((camX - reach) / cell), p1x = Math.floor((camX + reach) / cell);
    const p0z = Math.floor((camZ - reach) / cell), p1z = Math.floor((camZ + reach) / cell);
    const want = this._want || (this._want = new Set());
    want.clear();
    for (let px = p0x; px <= p1x; px++) for (let pz = p0z; pz <= p1z; pz++) {
      const cx = (px + 0.5) * cell, cz = (pz + 0.5) * cell;
      if (Math.hypot(cx - camX, cz - camZ) > reach + cell) continue;
      want.add(px * 65536 + pz);
    }
    for (const [k, slot] of this.slots) {
      if (!want.has(k)) {
        const base = slot * c.cap;
        for (let i = 0; i < c.cap; i++) this.iA[(base + i) * 4] = 0;
        this._touch(base, base + c.cap);
        this.free.push(slot); this.slots.delete(k);
      }
    }
    let built = 0;
    for (const k of want) {
      if (this.slots.has(k)) continue;
      if (built >= budget || this.free.length === 0) break;
      const slot = this.free.pop();
      const px = Math.round((k - (((k % 65536) + 98304) % 65536 - 32768)) / 65536);
      const pz = ((k % 65536) + 98304) % 65536 - 32768;
      this.live += this.fill(slot, px, pz, F, plan);
      this.slots.set(k, slot);
      built++;
    }
    if (this.dirtyHi >= this.dirtyLo) {
      for (const a of [this.aPos, this.aA, this.aB]) a.needsUpdate = true;
      this.dirtyLo = Infinity; this.dirtyHi = -Infinity;
    }
    return built;
  }
  /** honest count of instances currently carrying a plant */
  count() {
    let n = 0;
    for (const [, slot] of this.slots) {
      const base = slot * this.cfg.cap;
      for (let i = 0; i < this.cfg.cap; i++) if (this.iA[(base + i) * 4] > 0) n++;
    }
    return n;
  }
  clear() {
    this.slots.clear(); this.free.length = 0;
    for (let i = this.cfg.slots - 1; i >= 0; i--) this.free.push(i);
    this.iA.fill(0); this.aA.needsUpdate = true; this.live = 0;
  }
  dispose() { this.geo.dispose(); this.mat.dispose(); }
}

class Vegetation {
  constructor(fields, plan, shared, q) {
    this.F = fields; this.plan = plan;
    this.group = new THREE.Group();
    this.bands = [];
    const mk = (name, tpl, matOpts, cfg) => {
      const b = new VegBand(name, tpl, makeVegMaterial(shared, matOpts), cfg);
      this.bands.push(b); this.group.add(b.mesh); return b;
    };
    // overlapping bands: each fades in and out in world space, so no ring can form
    this.near = mk('near', stemTemplate(2, true), { width: 0.098, value: 1.0, fade: [0, 0.001, q.vegNear.reach - 10, q.vegNear.reach] }, q.vegNear);
    this.mid = mk('mid', stemTemplate(1, 'tri'), { width: 0.105, value: 0.88, fade: [2.5, 13, q.vegMid.reach - 24, q.vegMid.reach] }, q.vegMid);
    this.far = mk('far', markTemplate(), { width: 1.24, value: 0.70, fade: [q.vegFar.fadeIn0, q.vegFar.fadeIn1, q.vegFar.reach - 70, q.vegFar.reach] }, q.vegFar);
    this.tris = 0;
  }
  update(camX, camZ, budget) {
    let b = 0;
    for (const band of this.bands) b += band.update(camX, camZ, this.F, this.plan, budget);
    return b;
  }
  counts() {
    const o = {};
    let total = 0, tris = 0;
    for (const band of this.bands) { const c = band.count(); o[band.name] = c; total += c; tris += c * band.triPer; }
    o.total = total; o.triangles = tris;
    return o;
  }
  clear() { for (const b of this.bands) b.clear(); }
  dispose() { for (const b of this.bands) b.dispose(); }
}
