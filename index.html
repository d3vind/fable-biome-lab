<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================================
   ASTERLINE RELAY — the long signal
   A solitary cycling journey along an abandoned orbital maintenance road.
   Single-file procedural world. Seeded, deterministic, streamed.
   ========================================================================= */

'use strict';

/* ------------------------------ deterministic core ----------------------- */

function xmur3(str){
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++){
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return function(){
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    return (h ^= h >>> 16) >>> 0;
  };
}

function sfc32(a, b, c, d){
  return function(){
    a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0;
    let t = (a + b) | 0;
    a = b ^ (b >>> 9);
    b = (c + (c << 3)) | 0;
    c = (c << 21) | (c >>> 11);
    d = (d + 1) | 0;
    t = (t + d) | 0;
    c = (c + t) | 0;
    return (t >>> 0) / 4294967296;
  };
}

class Stream {
  constructor(seedStr, name){
    const g = xmur3(seedStr + '::' + name);
    this.f = sfc32(g(), g(), g(), g());
    for (let i = 0; i < 12; i++) this.f();
  }
  float(){ return this.f(); }
  range(a, b){ return a + (b - a) * this.f(); }
  int(n){ return Math.floor(this.f() * n); }
  pick(arr){ return arr[Math.floor(this.f() * arr.length)]; }
  sign(){ return this.f() < 0.5 ? -1 : 1; }
  chance(p){ return this.f() < p; }
  gauss(){ // approx normal, bounded
    return (this.f() + this.f() + this.f() + this.f() - 2) * 0.5;
  }
}

/* FNV-1a 32-bit over a number/string sequence, quantised for float stability */
class Hasher {
  constructor(){ this.h = 0x811c9dc5 >>> 0; }
  byte(b){ this.h = Math.imul(this.h ^ (b & 0xff), 16777619) >>> 0; return this; }
  num(x){
    if (!Number.isFinite(x)) x = -123456789;
    const q = Math.round(x * 1000);
    this.byte(q).byte(q >> 8).byte(q >> 16).byte(q >> 24);
    return this;
  }
  str(s){ for (let i = 0; i < s.length; i++) this.byte(s.charCodeAt(i)); return this; }
  arr(a){ for (let i = 0; i < a.length; i++) this.num(a[i]); return this; }
  hex(){ return ('00000000' + this.h.toString(16)).slice(-8); }
}

/* --------------------------------- config -------------------------------- */

const params = new URLSearchParams(location.search);
const CONFIG = {
  seed: params.get('seed') || 'ASTERLINE-1189',
  quality: ['low','standard','high'].includes(params.get('quality')) ? params.get('quality') : 'standard',
  jump: Math.max(0, parseFloat(params.get('jump') || '0') || 0),
};

const QUALITY = {
  low:      { dpr: 1.0,  bloom: false, stars: 4200,  motes: 900,  ribStep: 6, moteSize: 1.0,
              droneExtra: 0, undersideDetail: 1, sailSeg: 6,  planetDetail: 4, farStep: 36 },
  standard: { dpr: 1.5,  bloom: true,  stars: 7400,  motes: 1500, ribStep: 4, moteSize: 1.0,
              droneExtra: 8, undersideDetail: 2, sailSeg: 10, planetDetail: 5, farStep: 24 },
  high:     { dpr: 2.0,  bloom: true,  stars: 9800,  motes: 2100, ribStep: 3, moteSize: 1.1,
              droneExtra: 16, undersideDetail: 2, sailSeg: 14, planetDetail: 5, farStep: 18 },
}[CONFIG.quality];

/* --------------------------------- palette -------------------------------- */
/* the eight-colour family; everything in the world derives from these        */

const PAL = {
  ink:       new THREE.Color(0x050308),  // void ink
  graphite:  new THREE.Color(0x16171b),  // road graphite
  aubergine: new THREE.Color(0x2a1630),  // deep shadow only
  raspberry: new THREE.Color(0xe23a6d),  // relay raspberry
  coral:     new THREE.Color(0xff7a59),  // coral ember
  burnt:     new THREE.Color(0xd95f18),  // burnt orange
  gold:      new THREE.Color(0xe8d5a0),  // old gold
  bone:      new THREE.Color(0xf2e9d8),  // bone light
  teal:      new THREE.Color(0x3fd2c7),  // cold counterpoint
  magenta:   new THREE.Color(0xe84fd0),  // neon magenta, night-market voltage
};

/* GLSL palette ramp shared by every signal shader: the prismwake sequence.
   t in [0,1) walks raspberry -> coral -> burnt -> gold, with a narrow teal
   counterpoint window. Chapter 7 biases everything toward amber/bone.       */
const GLSL_PRISM = `
vec3 prismColor(float t, float amberBias){
  vec3 c = 0.55 + 0.45 * cos(6.28318 * (t + vec3(0.00, 0.33, 0.67)));
  c = pow(c, vec3(1.35)) * 1.28;
  vec3 amber = vec3(0.900, 0.815, 0.640);
  return mix(c, amber, amberBias);
}
`;

/* prismwake envelope: how lit a piece of route furniture at arc-length s is,
   given the rider at ws. gates wake gently ahead, blaze near the rider, and
   settle to a faint permanent afterglow behind. uBreath adds the slow
   inhale/exhale of the already-lit line.                                    */
const GLSL_WAKE = `
uniform float uCrown;
uniform float uRush;
uniform float uPulseS;
uniform float uPulseAmp;
float wakeEnv(float s, float ws, float breath){
  float d = s - ws;
  float aheadWin = 95.0 + uCrown * 130.0 + uRush * 55.0;
  float ahead  = smoothstep(aheadWin, 18.0, d) * step(0.0, d);
  float behind = step(d, 0.0);
  float crest  = exp(-abs(d) * (0.025 - uCrown * 0.009));
  float after  = behind * (0.20 + 0.06 * breath + 0.15 * uCrown);
  float body   = max(after, crest * (0.55 + 0.45 * ahead) * (1.0 + 0.45 * uRush));
  float pulse  = uPulseAmp * exp(-abs(s - uPulseS) * 0.045);
  return max(body, pulse);
}
`;

const clamp = (x, a, b) => x < a ? a : (x > b ? b : x);
const lerp  = (a, b, t) => a + (b - a) * t;
const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const TAU = Math.PI * 2;

/* ============================================================================
   PLAN — quality-independent world truth. Everything here flows from named
   PRNG streams on the seed. Realization (meshes, particles, quality) happens
   elsewhere and may not touch these streams.
   ========================================================================= */

const STEP = 2;              // route sample spacing, metres
const ROAD_W = 10.8;         // deck width
const ROAD_HALF = ROAD_W / 2;
const CLEAR_R = 8.2;         // protected clear radius from centreline
const CHUNK_LEN = 200;       // detailed chunk length
const WIDEN = 160;           // fork widening approach length
const FORK_GAP = 6.1;        // arm centre offset at the split nose

const CHAPTERS = [
  { key: 'yard',     name: 'Calibration Yard',  sub: 'the road remembers its language' },
  { key: 'orchard',  name: 'Signal Orchard',    sub: 'sails and tethers'  },
  { key: 'viaduct',  name: 'Shadow Viaduct',    sub: 'beside the sleeping limb' },
  { key: 'currents', name: 'Twin Currents',     sub: 'either hand is true' },
  { key: 'freight',  name: 'Freight Eclipse',   sub: 'the caravan passes' },
  { key: 'descent',  name: 'Prismwake Descent', sub: 'the signal at full voice' },
  { key: 'afterglow',name: 'Relay Afterglow',   sub: 'amber, then bone, then quiet' },
];

function buildRouteSamples(seedStr, attempt){
  const rs = new Stream(seedStr, 'route#' + attempt);
  const L = Math.round(rs.range(6950, 8650) / STEP) * STEP;
  const n = Math.round(L / STEP) + 1;

  // --- curvature profile: piecewise-linear ramps (clothoid-like) ---------
  const kProf = new Float32Array(n);
  {
    let i = 0, k = 0, heading = 0;
    while (i < n){
      let target;
      const straight = rs.chance(0.30);
      if (straight) target = rs.range(-1, 1) * (1 / 2400);
      else {
        const R = rs.range(130, 720) * (rs.chance(0.18) ? 0.62 : 1); // rare tighter sweepers >= ~80
        let sign = rs.sign();
        if (Math.abs(heading) > 1.05) sign = -Math.sign(heading);            // steer back
        else if (Math.abs(heading) > 0.55 && rs.chance(0.7)) sign = -Math.sign(heading);
        target = sign / Math.max(R, 60);
      }
      const ramp = Math.round(rs.range(40, 70) / STEP);
      const hold = Math.round(rs.range(140, 430) / STEP);
      for (let j = 0; j < ramp && i < n; j++, i++){
        k = k + (target - k) / (ramp - j);
        kProf[i] = k; heading += k * STEP;
      }
      for (let j = 0; j < hold && i < n; j++, i++){
        kProf[i] = k; heading += k * STEP;
      }
    }
    // calm both ends (station yards / overlook approach)
    for (let i2 = 0; i2 < n; i2++){
      const s = i2 * STEP;
      const env = smooth((s - 40) / 260) * smooth((L - 60 - s) / 320);
      kProf[i2] *= env;
    }
  }

  // --- chapters ----------------------------------------------------------
  const cs = new Stream(seedStr, 'chapters#' + attempt);
  const fr = [0.050, 0.160, 0.160, 0.180, 0.115, 0.205, 0.130].map(f => f * (1 + cs.range(-0.16, 0.16)));
  const fSum = fr.reduce((a, b) => a + b, 0);
  const spans = []; let acc = 0;
  for (let c = 0; c < 7; c++){
    const s0 = acc; acc += (fr[c] / fSum) * L;
    spans.push({ s0: Math.round(s0), s1: Math.round(acc) });
  }
  spans[6].s1 = L;

  // --- elevation: integrate a soft-clamped slope profile -----------------
  const es = new Stream(seedStr, 'elevation#' + attempt);
  const dH = [ es.range(10, 22), es.range(42, 62), es.range(8, 22), es.range(-4, 10),
               es.range(-58, -78), es.range(-16, -30) ]; // deltas for ch2..ch7 trends (ch1 flat)
  const rollers = [
    { a: es.range(3.5, 5.5), l: es.range(850, 1250), p: es.range(0, TAU) },
    { a: es.range(1.6, 2.6), l: es.range(420, 610),  p: es.range(0, TAU) },
  ];
  const yProf = new Float32Array(n);
  {
    let y = 0;
    for (let i = 0; i < n; i++){
      const s = i * STEP;
      let trend = 0;
      for (let c = 1; c < 7; c++){
        const { s0, s1 } = spans[c];
        if (s >= s0 && s < s1){
          const u = (s - s0) / (s1 - s0);
          trend = (dH[c - 1] / (s1 - s0)) * Math.sin(Math.PI * u) * (Math.PI / 2);
        }
      }
      let g = trend;
      for (const r of rollers) g += (r.a * TAU / r.l) * Math.cos(TAU * s / r.l + r.p);
      g *= smooth((s - 20) / 200) * smooth((L - 30 - s) / 260);
      g = 0.092 * Math.tanh(g / 0.092);
      yProf[i] = y; y += g * STEP;
    }
  }

  // --- integrate position ------------------------------------------------
  const px = new Float32Array(n), pz = new Float32Array(n), hd = new Float32Array(n);
  {
    let x = 0, z = 0, h = 0;
    for (let i = 0; i < n; i++){
      px[i] = x; pz[i] = z; hd[i] = h;
      h += kProf[i] * STEP;
      x += Math.cos(h) * STEP;
      z += Math.sin(h) * STEP;
    }
  }

  // --- self-clearance ----------------------------------------------------
  const cell = 48, grid = new Map();
  const gkey = (x, z) => (Math.round(x / cell) * 73856093) ^ (Math.round(z / cell) * 19349663);
  let ok = true;
  outer:
  for (let i = 0; i < n; i += 4){
    const gx = Math.round(px[i] / cell), gz = Math.round(pz[i] / cell);
    for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++){
      const key = ((gx + dx) * 73856093) ^ ((gz + dz) * 19349663);
      const bucket = grid.get(key);
      if (bucket) for (const j of bucket){
        if (Math.abs(i - j) * STEP < 90) continue;
        const ddx = px[i] - px[j], ddz = pz[i] - pz[j], ddy = yProf[i] - yProf[j];
        if (ddx * ddx + ddz * ddz + ddy * ddy < 30 * 30){ ok = false; break outer; }
      }
    }
    const key = gkey(px[i], pz[i]);
    if (!grid.has(key)) grid.set(key, []);
    grid.get(key).push(i);
  }

  return { ok, L, n, px, pz, py: yProf, hd, kProf, spans };
}

function buildPlan(seedStr){
  let route = null;
  for (let attempt = 0; attempt < 24; attempt++){
    route = buildRouteSamples(seedStr, attempt);
    if (route.ok) { route.attempt = attempt; break; }
  }
  const { L, spans } = route;
  const midOf = c => (spans[c].s0 + spans[c].s1) / 2;

  /* ---- fork -------------------------------------------------------------- */
  const fs = new Stream(seedStr, 'fork');
  const side = fs.sign();                       // +1: outer current on the right
  const c4 = spans[3];
  const sFork = Math.round(c4.s0 + 0.14 * (c4.s1 - c4.s0));
  const sRejoin = Math.round(c4.s1 - 0.12 * (c4.s1 - c4.s0));
  const fork = {
    side, sFork, sRejoin,
    outerD: fs.range(42, 62), innerD: fs.range(22, 30),
    outerLift: fs.range(9, 15), innerDip: -fs.range(4, 8),
    innerWiggleN: fs.pick([2, 3]), innerWigglePh: fs.range(0, TAU), innerWiggleA: fs.range(5.5, 7.5),
  };

  /* ---- signal gates & pylons -------------------------------------------- */
  const gs = new Stream(seedStr, 'gates');
  const gates = [];
  {
    let s = 380 + gs.range(0, 160);
    while (s < L - 420){
      const inFork = s > sFork - WIDEN - 60 && s < sRejoin + WIDEN + 60;
      if (!inFork){
        gates.push({
          s: Math.round(s), side: gs.sign(), variant: gs.int(4),
          h: gs.range(7.5, 11.5), reach: gs.range(3.5, 7.0), backward: 0,
        });
      }
      s += gs.range(330, 640);
    }
    // constellation pylons cluster in the descent
    const c6 = spans[5];
    const pyN = 8 + gs.int(3);
    for (let i = 0; i < pyN; i++){
      const s2 = c6.s0 + (i + 0.5 + gs.range(-0.3, 0.3)) * (c6.s1 - c6.s0) / pyN;
      gates.push({ s: Math.round(s2), side: gs.sign(), variant: 4, h: gs.range(16, 26), reach: 0, backward: 0 });
    }
    gates.sort((a, b) => a.s - b.s);
  }

  /* ---- spectrum arches: celebration thresholds between chapters --------- */
  const asr = new Stream(seedStr, 'arches');
  const arches = [];
  {
    for (let c = 1; c <= 5; c++){
      let s = spans[c].s0 + asr.range(-40, 40);
      const mid = (sFork + sRejoin) / 2;
      if (s > sFork - WIDEN - 80 && s < mid) s = sFork - WIDEN - 130;
      else if (s >= mid && s < sRejoin + WIDEN + 80) s = sRejoin + WIDEN + 110;
      arches.push({ s: Math.round(clamp(s, 220, L - 260)), r: asr.range(10.6, 12.6) });
    }
    const c6b = spans[5];
    arches.push({ s: Math.round(lerp(c6b.s0, c6b.s1, 0.38)), r: asr.range(10.6, 12.4) });
    arches.push({ s: Math.round(lerp(c6b.s0, c6b.s1, 0.62)), r: asr.range(10.6, 12.4) });
    arches.sort((a, b) => a.s - b.s);
  }

  /* ---- chime cairns — the Cairn Chorale --------------------------------- */
  const ks = new Stream(seedStr, 'cairns');
  const scaleDeg = [0, 2, 4, 7, 9, 11, 14, 16];    // pentatonic + lydian colour
  const motif = []; for (let i = 0; i < 8; i++) motif.push(ks.pick(scaleDeg));
  const cairns = [];
  {
    let s = 260, idx = 0;
    while (s < L - 260){
      const inFork = s > sFork - WIDEN - 40 && s < sRejoin + WIDEN + 40;
      if (!inFork){
        cairns.push({ s: Math.round(s), side: (idx % 2) ? 1 : -1, note: motif[idx % 8], stones: 3 + ks.int(3) });
        idx++;
      }
      s += ks.range(230, 330);
    }
  }

  /* ---- satellites / observatories --------------------------------------- */
  const ss = new Stream(seedStr, 'satellites');
  const sats = [];
  const satN = 27 + ss.int(7);
  for (let i = 0; i < satN; i++){
    const s = ss.range(0.02, 0.99) * L;
    sats.push({
      s: Math.round(s),
      lat: ss.sign() * ss.range(95, 640),
      h: ss.range(-190, 260),
      variant: ss.int(6), scale: ss.range(0.8, 1.9),
      spin: ss.range(0.008, 0.05) * ss.sign(), phase: ss.range(0, TAU),
      tracker: 0,
    });
  }
  // four tracker observatories that watch the giant, not the rider
  for (const i of [3, 9, 15, 21]) if (sats[i]) sats[i].tracker = 1;

  /* ---- solar sails / orbital kites -------------------------------------- */
  const ws2 = new Stream(seedStr, 'sails');
  const sails = [];
  const sailN = 21 + ws2.int(6);
  for (let i = 0; i < sailN; i++){
    const s = ws2.range(0.03, 0.98) * L;
    sails.push({
      s: Math.round(s),
      lat: ws2.sign() * ws2.range(64, 430),
      h: ws2.range(-160, 220),
      size: ws2.range(18, 54), aspect: ws2.range(0.65, 1.5),
      tiltRate: ws2.range(0.02, 0.07), phase: ws2.range(0, TAU),
      hue: ws2.float(), tetherSat: ws2.chance(0.55) ? ws2.int(satN) : -1,
    });
  }

  /* ---- stations ---------------------------------------------------------- */
  const st = new Stream(seedStr, 'stations');
  const stations = {
    depart: { gantries: 5 + st.int(3), width: st.range(30, 44), platforms: 2 + st.int(2) },
    receive: {
      rings: 2 + st.int(3), ringR: st.range(90, 150), spireH: st.range(130, 210),
      dishN: 3 + st.int(4), tilt: st.range(-0.15, 0.25), apertureR: st.range(16, 26),
      armN: 4 + st.int(4), sideLobes: st.int(3),
    },
  };

  /* ---- transit caravans -------------------------------------------------- */
  const ts = new Stream(seedStr, 'transit');
  const railSide = ts.sign();
  const sCross = Math.round(midOf(4) + ts.range(80, 220));      // overhead crossing in ch5
  const overtakeS = Math.round(midOf(4) - ts.range(120, 260));
  const vCav = ts.range(15.5, 18.5);
  const modulesA = []; const modN = 9 + ts.int(3);
  for (let m = 0; m < modN; m++) modulesA.push({ variant: ts.int(5), len: ts.range(6.5, 10.5), glow: ts.range(0.6, 1) });
  const transit = {
    railSide, sCross, vCav, overtakeS,
    startS: overtakeS - vCav * (overtakeS / 10.5),   // meets rider at overtakeS at default cruise
    railLat: ts.range(34, 44), railH: ts.range(13, 17),
    modulesA,
    caravanB: { orbitR: ts.range(700, 1000), period: ts.range(420, 560), phase: ts.range(0, TAU), modN: 7 + ts.int(3) },
    /* the Dawn Service: a short caravan on a slow circle that crosses the
       opening vista, recedes, and returns on a long period                  */
    caravanC: { r: ts.range(380, 460), ahead: ts.range(680, 820), h: ts.range(38, 62),
                omega: ts.range(0.016, 0.024) * ts.sign(), modN: 6 + ts.int(3) },
  };

  /* ---- maintenance drones ------------------------------------------------ */
  const ds = new Stream(seedStr, 'drones');
  const drones = [];
  for (let i = 0; i < 20; i++)  // family A: rib inspectors
    drones.push({ fam: 0, s: Math.round(ds.range(0.03, 0.97) * L), side: ds.sign(),
                  r: ds.range(2.5, 4.5), rate: ds.range(0.25, 0.6), phase: ds.range(0, TAU) });
  for (let i = 0; i < 16; i++)  // family B: couriers between clusters
    drones.push({ fam: 1, a: ds.int(satN), b: ds.int(satN), rate: ds.range(0.012, 0.03),
                  phase: ds.range(0, 1), bow: ds.range(30, 120) });
  for (let i = 0; i < 12; i++)  // family C: sail tenders
    drones.push({ fam: 2, sail: ds.int(sailN), r: ds.range(8, 18), rate: ds.range(0.15, 0.4),
                  phase: ds.range(0, TAU), tilt: ds.range(-0.5, 0.5) });

  /* ---- kite-ray fauna ---------------------------------------------------- */
  const fs2 = new Stream(seedStr, 'fauna');
  const fauna = [];
  for (let g = 0; g < 6; g++){
    let anchorS = fs2.range(0.08, 0.95) * L;
    let latBand = fs2.sign() * fs2.range(120, 420);
    if (g === 0){ anchorS = 310; latBand = -170; }  // the poster crossing
    const pts = [];
    const pn = 6 + fs2.int(3);
    const spread = g === 0 ? 0.5 : 1.0;
    for (let p = 0; p < pn; p++){
      pts.push({
        s: anchorS + fs2.range(-900, 900) * spread,
        lat: latBand + fs2.range(-160, 160) * spread,
        h: fs2.range(-120, 200) * spread,
      });
    }
    fauna.push({
      pts, n: 3 + fs2.int(3), size: fs2.range(7, 15),
      period: fs2.range(70, 130), phase: fs2.range(0, TAU),
      flap: fs2.range(0.5, 1.1), tint: fs2.float(),
    });
  }

  /* ---- the giant --------------------------------------------------------- */
  const gs2 = new Stream(seedStr, 'giant');
  const giants = [];
  {
    let t = 46 + gs2.range(0, 22);
    const closeT = midOf(5) / 10.5;   // guaranteed near passage while in the descent (at cruise)
    let placedClose = false;
    while (t < 1500){
      let dist = gs2.range(2100, 4100), alt = gs2.range(300, 1300) * gs2.sign();
      if (!placedClose && t > closeT){ dist = 1450; alt = gs2.range(500, 800); placedClose = true; }
      giants.push({
        t0: Math.round(t), dur: gs2.range(46, 70), side: gs2.sign(),
        dist, alt, variant: gs2.int(3), scale: gs2.range(0.8, 1.35),
      });
      t += gs2.range(62, 98);
    }
  }

  /* ---- meteors ----------------------------------------------------------- */
  const ms = new Stream(seedStr, 'meteors');
  const meteors = [];
  { let t = 20 + ms.range(0, 20);
    while (t < 1600){ meteors.push({ t0: Math.round(t * 10) / 10, az: ms.range(0, TAU), el: ms.range(0.2, 0.9), roll: ms.range(0, TAU), spd: ms.range(0.7, 1.4) }); t += ms.range(24, 65); } }

  /* ---- atmosphere / celestial layout ------------------------------------- */
  const as = new Stream(seedStr, 'atmosphere');
  const planetSide = as.sign();
  const pR = as.range(2300, 2900);
  const celestial = {
    planetSide,
    planetR: pR,
    planetAz: as.range(0.52, 0.80),             // radians off the departure axis
    planetDist: as.range(4300, 5100),
    planetDrop: as.range(850, 1250),
    bandSeed: as.range(0, 100), bandFreq: as.range(5, 9),
    eclipseAz: -planetSide * as.range(0.5, 0.9), // opposite side of sky from the planet
    eclipseEl: as.range(0.28, 0.45),
    eclipseDist: 19000, eclipseR: as.range(750, 1050),
    hazeTint: as.float(),
  };

  /* ---- rare anomalies ---------------------------------------------------- */
  const an = new Stream(seedStr, 'anomalies');
  const impossible = an.pick(['borrowedStar', 'echoRoad']);
  const subtlePool = ['missingConstellation', 'backwardSignal', 'waitingCaravan'];
  const sub1 = subtlePool.splice(an.int(3), 1)[0];
  const sub2 = subtlePool.splice(an.int(2), 1)[0];
  const anomalies = { impossible, subtle: [sub1, sub2], unsentReply: true };
  // quiet-window triggers (route-distance keyed, away from fork/turns)
  const quietA = Math.round(lerp(spans[2].s0, spans[2].s1, 0.55));
  const quietB = Math.round(lerp(spans[5].s0, spans[5].s1, 0.72));
  anomalies.trigS = { borrowedStar: quietB, echoRoad: quietA, missingConstellation: -1,
                     backwardSignal: 0, waitingCaravan: 0 };
  if (anomalies.subtle.includes('backwardSignal') || 1){
    // choose a run of gates in ch3 to ignite backward (armed only if selected)
    const c3gates = gates.filter(g => g.s > spans[2].s0 && g.s < spans[2].s1 && g.variant < 4);
    if (anomalies.subtle.includes('backwardSignal'))
      for (let i = 1; i < Math.min(4, c3gates.length); i++) c3gates[i].backward = 1;
  }

  /* ---- audio event colours ------------------------------------------------ */
  const aus = new Stream(seedStr, 'audio');
  const audioPlan = { root: 146.83 * Math.pow(2, aus.int(3) / 12), chimeGain: aus.range(0.5, 0.8),
                      humDetune: aus.range(0.3, 0.8) };

  /* ---- chunks ------------------------------------------------------------- */
  const chunks = [];
  {
    let id = 0;
    for (let s = 0; s < sFork; s += CHUNK_LEN)
      chunks.push({ id: id++, lane: 'base', s0: s, s1: Math.min(s + CHUNK_LEN, sFork) });
    for (const lane of ['inner', 'outer'])
      for (let s = sFork; s < sRejoin; s += CHUNK_LEN)
        chunks.push({ id: id++, lane, s0: s, s1: Math.min(s + CHUNK_LEN, sRejoin) });
    for (let s = sRejoin; s < L; s += CHUNK_LEN)
      chunks.push({ id: id++, lane: 'base', s0: s, s1: Math.min(s + CHUNK_LEN, L) });
    chunks.push({ id: id++, lane: 'islandA', s0: sFork, s1: sFork + 90 });
    chunks.push({ id: id++, lane: 'islandB', s0: sRejoin - 90, s1: sRejoin });
  }

  const plan = {
    seed: seedStr, L, spans, route, fork, gates, arches, cairns, motif, sats, sails, stations,
    transit, drones, fauna, giants, meteors, celestial, anomalies, audioPlan, chunks,
  };
  plan.hashes = hashPlan(plan);
  return plan;
}

function hashPlan(p){
  const hr = new Hasher(); hr.str(p.seed).num(p.L).num(p.route.attempt);
  for (let i = 0; i < p.route.n; i += 8) hr.num(p.route.px[i]).num(p.route.pz[i]).num(p.route.py[i]);
  const routeHash = hr.hex();
  const hf = new Hasher();
  hf.num(p.fork.side).num(p.fork.sFork).num(p.fork.sRejoin).num(p.fork.outerD)
    .num(p.fork.innerD).num(p.fork.outerLift).num(p.fork.innerDip)
    .num(p.fork.innerWiggleN).num(p.fork.innerWiggleA);
  const forkHash = hf.hex();
  const hc = new Hasher();
  for (const sp of p.spans) hc.num(sp.s0).num(sp.s1);
  const chapterHash = hc.hex();
  const hi = new Hasher();
  for (const g of p.gates) hi.num(g.s).num(g.side).num(g.variant).num(g.h).num(g.backward);
  for (const a of p.arches) hi.num(a.s).num(a.r);
  for (const c of p.cairns) hi.num(c.s).num(c.side).num(c.note);
  for (const s of p.sats) hi.num(s.s).num(s.lat).num(s.h).num(s.variant).num(s.scale).num(s.tracker);
  for (const s of p.sails) hi.num(s.s).num(s.lat).num(s.h).num(s.size);
  hi.num(p.stations.receive.rings).num(p.stations.receive.ringR).num(p.stations.receive.spireH)
    .num(p.stations.receive.dishN).num(p.stations.receive.armN);
  const infraHash = hi.hex();
  const ht = new Hasher();
  ht.num(p.transit.railSide).num(p.transit.sCross).num(p.transit.vCav).num(p.transit.startS)
    .num(p.transit.railLat).num(p.transit.railH).num(p.transit.modulesA.length)
    .num(p.transit.caravanB.orbitR).num(p.transit.caravanB.period)
    .num(p.transit.caravanC.r).num(p.transit.caravanC.ahead).num(p.transit.caravanC.omega)
    .num(p.transit.caravanC.modN);
  for (const m of p.transit.modulesA) ht.num(m.variant).num(m.len);
  const transitHash = ht.hex();
  const ha = new Hasher();
  for (const d of p.drones) ha.num(d.fam).num(d.s || 0).num(d.rate).num(d.phase || 0);
  for (const f of p.fauna){ ha.num(f.n).num(f.size).num(f.period); for (const pt of f.pts) ha.num(pt.s).num(pt.lat).num(pt.h); }
  for (const g of p.giants) ha.num(g.t0).num(g.dur).num(g.side).num(g.dist).num(g.variant);
  const ce = p.celestial;
  ha.num(ce.planetSide).num(ce.planetR).num(ce.planetAz).num(ce.planetDist).num(ce.planetDrop)
    .num(ce.eclipseAz).num(ce.eclipseEl).num(ce.eclipseR).num(ce.bandFreq);
  const ambientHash = ha.hex();
  const hx = new Hasher();
  hx.str(p.anomalies.impossible).str(p.anomalies.subtle.join(','))
    .num(p.anomalies.trigS.borrowedStar).num(p.anomalies.trigS.echoRoad);
  for (const m of p.motif) hx.num(m);
  const rareHash = hx.hex();
  const hp = new Hasher();
  hp.str(routeHash).str(forkHash).str(chapterHash).str(infraHash).str(transitHash)
    .str(ambientHash).str(rareHash);
  return { routeHash, forkHash, chapterHash, infraHash, transitHash, ambientHash, rareHash,
           planHash: hp.hex() };
}

/* ============================================================================
   ROUTE — the one authoritative frame system. Every camera pose, mesh strip,
   prop anchor, rail, creature path and verification probe goes through here.
   ========================================================================= */

class Route {
  constructor(plan){
    this.plan = plan;
    this.L = plan.L;
    this.n = plan.route.n;
    this.px = plan.route.px; this.pz = plan.route.pz; this.py = plan.route.py;
    this.hd = plan.route.hd;
    this._v = new THREE.Vector3(); this._v2 = new THREE.Vector3();
  }

  /* lateral offset & lift of a lane relative to the base line at s */
  laneOffset(s, lane){
    const f = this.plan.fork;
    if (lane === 'base' || s <= f.sFork || s >= f.sRejoin) return { d: 0, lift: 0 };
    const u = (s - f.sFork) / (f.sRejoin - f.sFork);
    const bump = smooth(u / 0.30) * smooth((1 - u) / 0.30);
    if (lane === 'outer'){
      return { d: f.side * (FORK_GAP + (f.outerD - FORK_GAP) * bump),
               lift: f.outerLift * bump };
    }
    const wig = f.innerWiggleA * Math.sin(TAU * u * f.innerWiggleN + f.innerWigglePh)
              * smooth(u / 0.18) * smooth((1 - u) / 0.18);
    return { d: -f.side * (FORK_GAP + (f.innerD - FORK_GAP) * bump) + wig * -f.side,
             lift: f.innerDip * bump };
  }

  /* deck half-width at s for a lane (base widens near the fork) */
  halfWidth(s, lane){
    const f = this.plan.fork;
    if (lane !== 'base') return ROAD_HALF;
    let w = ROAD_HALF;
    if (s > f.sFork - WIDEN && s <= f.sFork)
      w = lerp(ROAD_HALF, FORK_GAP + ROAD_HALF, smooth((s - (f.sFork - WIDEN)) / WIDEN));
    else if (s >= f.sRejoin && s < f.sRejoin + WIDEN)
      w = lerp(FORK_GAP + ROAD_HALF, ROAD_HALF, smooth((s - f.sRejoin) / WIDEN));
    return w;
  }

  /* base-line point (no lane offset) */
  basePos(s, out){
    const t = clamp(s / STEP, 0, this.n - 1.001);
    const i = Math.floor(t), fr2 = t - i;
    out.set(this.px[i] + (this.px[i + 1] - this.px[i]) * fr2,
            this.py[i] + (this.py[i + 1] - this.py[i]) * fr2,
            this.pz[i] + (this.pz[i + 1] - this.pz[i]) * fr2);
    return out;
  }

  heading(s){
    const t = clamp(s / STEP, 0, this.n - 1.001);
    const i = Math.floor(t), fr2 = t - i;
    return this.hd[i] + (this.hd[i + 1] - this.hd[i]) * fr2;
  }

  /* full lane point: base + lateral offset along base-right + lift */
  posAt(s, lane, out){
    this.basePos(s, out);
    const off = this.laneOffset(s, lane);
    if (off.d !== 0 || off.lift !== 0){
      const h = this.heading(s);      // right = (-sin h, 0, cos h), matching frameAt
      out.x += -Math.sin(h) * off.d;
      out.z += Math.cos(h) * off.d;
      out.y += off.lift;
    }
    return out;
  }

  /* frame: pos, tan (forward), right, nrm (up-ish). gravity-oriented.       */
  frameAt(s, lane, fr){
    this.posAt(s, lane, fr.pos);
    this.posAt(Math.min(s + 2.5, this.L), lane, this._v);
    this.posAt(Math.max(s - 2.5, 0), lane, this._v2);
    fr.tan.subVectors(this._v, this._v2).normalize();
    fr.right.set(-fr.tan.z, 0, fr.tan.x).normalize();
    fr.nrm.crossVectors(fr.right, fr.tan).normalize();
    if (fr.nrm.y < 0){ fr.nrm.negate(); fr.right.negate(); }
    return fr;
  }

  grade(s){
    const a = this.py[clamp(Math.round(s / STEP), 0, this.n - 1)];
    const b = this.py[clamp(Math.round(s / STEP) + 5, 0, this.n - 1)];
    return (b - a) / (5 * STEP);
  }

  curvatureAt(s, lane){
    const fA = { pos: new THREE.Vector3(), tan: new THREE.Vector3(), right: new THREE.Vector3(), nrm: new THREE.Vector3() };
    const fB = { pos: new THREE.Vector3(), tan: new THREE.Vector3(), right: new THREE.Vector3(), nrm: new THREE.Vector3() };
    this.frameAt(s - 4, lane, fA); this.frameAt(s + 4, lane, fB);
    return fA.tan.angleTo(fB.tan) / 8;
  }

  chapterAt(s){
    for (let c = 6; c >= 0; c--) if (s >= this.plan.spans[c].s0) return c;
    return 0;
  }

  /* distance from an arbitrary world point to the nearest lane centreline    */
  clearanceOf(pos, sHint){
    let best = 1e9;
    const w = 700;
    const s0 = Math.max(0, (sHint ?? 0) - w), s1 = Math.min(this.L, (sHint ?? this.L) + w);
    const lanes = ['base'];
    if (s1 > this.plan.fork.sFork && s0 < this.plan.fork.sRejoin) lanes.push('inner', 'outer');
    for (const lane of lanes){
      for (let s = s0; s <= s1; s += 8){
        this.posAt(s, lane, this._v);
        const d = this._v.distanceTo(pos);
        if (d < best) best = d;
      }
    }
    return best;
  }
}

function makeFrame(){
  return { pos: new THREE.Vector3(), tan: new THREE.Vector3(),
           right: new THREE.Vector3(), nrm: new THREE.Vector3() };
}

/* ============================================================================
   SKY & DEEP SPACE — stars in strata, the sleeping planet, the eclipse disc
   that governs all light, paper arcs, the far network, motes, meteors.
   ========================================================================= */

class SkySystem {
  constructor(plan, route){
    this.plan = plan; this.route = route;
    this.group = new THREE.Group();
    this.disposables = [];
    this.time = 0;

    const cel = plan.celestial;

    /* ---- celestial anchors ---------------------------------------------- */
    const fr0b = makeFrame();
    route.frameAt(60, 'base', fr0b);
    const azW = route.heading(60) + cel.planetSide * cel.planetAz;
    this.planetCenter = fr0b.pos.clone().add(new THREE.Vector3(
      Math.cos(azW) * cel.planetDist, -cel.planetDrop, Math.sin(azW) * cel.planetDist));
    /* deterministic pushback: the route must never graze the planet */
    {
      const latDir = this.planetCenter.clone().sub(fr0b.pos);
      latDir.y = 0; latDir.normalize();
      const r2 = plan.route;
      for (let tries = 0; tries < 40; tries++){
        let minD = 1e12;
        for (let i = 0; i < r2.n; i += 8){
          const dx = r2.px[i] - this.planetCenter.x, dy = r2.py[i] - this.planetCenter.y,
                dz = r2.pz[i] - this.planetCenter.z;
          const d = dx * dx + dy * dy + dz * dz;
          if (d < minD) minD = d;
        }
        if (Math.sqrt(minD) > cel.planetR + 420) break;
        this.planetCenter.addScaledVector(latDir, 260);
      }
    }

    const h0 = route.heading(40);
    const az = h0 + cel.eclipseAz;
    this.sunDir = new THREE.Vector3(
      Math.cos(az) * Math.cos(cel.eclipseEl), Math.sin(cel.eclipseEl),
      Math.sin(az) * Math.cos(cel.eclipseEl)).normalize();
    this.eclipsePos = this.sunDir.clone().multiplyScalar(cel.eclipseDist);

    this._buildStars();
    this._buildPlanet();
    this._buildEclipse();
    this._buildScrims();
    this._buildAurora();
    this._buildNetwork();
    this._buildEcho();
    this._buildMotes();
    this._buildMeteors();

    /* the governing light + a whisper of fill */
    this.sun = new THREE.DirectionalLight(0xf0d9a8, 1.25);
    this.sun.position.copy(this.sunDir).multiplyScalar(100);
    this.group.add(this.sun);
    this.hemi = new THREE.HemisphereLight(0x241028, 0x0a0508, 0.55);
    this.group.add(this.hemi);
  }

  _track(...objs){ this.disposables.push(...objs); }

  /* ---- stars ------------------------------------------------------------ */
  _buildStars(){
    const rr = new Stream(this.plan.seed, 'real:stars');
    const N = QUALITY.stars;
    const pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
    const attr = new Float32Array(N * 3); // size, phase, flag(0 plain,1 cluster,2 lost)
    const shells = [24000, 30000, 37000];

    // authored density: a tilted belt, clusters, and deliberate dark holes
    const beltN = new THREE.Vector3(rr.range(-0.5, 0.5), 1, rr.range(-0.5, 0.5)).normalize();
    const holes = [];
    for (let i = 0; i < 5; i++)
      holes.push({ d: new THREE.Vector3(rr.range(-1, 1), rr.range(-0.15, 1), rr.range(-1, 1)).normalize(),
                   r: rr.range(0.22, 0.45) });
    const clusters = [];
    for (let i = 0; i < 7; i++)
      clusters.push({ d: new THREE.Vector3(rr.range(-1, 1), rr.range(0.05, 1), rr.range(-1, 1)).normalize(),
                      r: rr.range(0.06, 0.14) });

    const v = new THREE.Vector3();
    let i = 0, guard = 0;
    while (i < N - 12 && guard++ < N * 40){
      v.set(rr.range(-1, 1), rr.range(-1, 1), rr.range(-1, 1));
      if (v.lengthSq() > 1 || v.lengthSq() < 0.01) continue;
      v.normalize();
      if (v.y < -0.28 && rr.float() < 0.85) continue;      // planet owns the deep floor
      let density = 0.32;
      const belt = Math.abs(v.dot(beltN));
      density += 0.55 * Math.pow(Math.max(0, 1 - belt / 0.30), 1.6);
      for (const c of clusters){ const a = v.angleTo(c.d); if (a < c.r) density += 0.8 * (1 - a / c.r); }
      for (const h of holes){ const a = v.angleTo(h.d); if (a < h.r) density *= 0.10 + 0.9 * smooth(a / h.r); }
      if (rr.float() > density) continue;

      const shell = shells[rr.int(3)];
      pos[i * 3] = v.x * shell; pos[i * 3 + 1] = v.y * shell; pos[i * 3 + 2] = v.z * shell;
      const m = rr.float();
      let c0 = PAL.bone;
      if (m < 0.16) c0 = PAL.gold; else if (m < 0.21) c0 = PAL.coral;
      else if (m < 0.235) c0 = PAL.raspberry; else if (m < 0.25) c0 = PAL.teal;
      else if (m < 0.262) c0 = PAL.magenta;
      else if (m < 0.272) c0 = new THREE.Color(0x9fe24f);
      const b = rr.range(0.35, 1.0) * (m < 0.06 ? 1.5 : 1.0);
      col[i * 3] = c0.r * b; col[i * 3 + 1] = c0.g * b; col[i * 3 + 2] = c0.b * b;
      attr[i * 3] = rr.range(1.1, 2.6) * (m < 0.06 ? 1.7 : 1.0);
      attr[i * 3 + 1] = rr.range(0, TAU);
      attr[i * 3 + 2] = 0;
      i++;
    }

    // The Ferry — an authored nine-star constellation (candidate for loss)
    const fd = new THREE.Vector3(0.2, 0.62, -0.55).applyAxisAngle(new THREE.Vector3(0, 1, 0), this.route.heading(40)).normalize();
    const fu = new THREE.Vector3(0, 1, 0).cross(fd).normalize();
    const fv = fd.clone().cross(fu).normalize();
    const ferry = [[0,0],[1.6,0.4],[3.1,0.5],[4.4,-0.2],[5.2,-1.3],[2.2,1.8],[3.6,2.4],[0.9,-1.2],[4.9,1.4]];
    this.ferryDir = fd.clone();
    for (let k2 = 0; k2 < 9 && i < N; k2++, i++){
      const p = fd.clone().multiplyScalar(28000)
        .addScaledVector(fu, ferry[k2][0] * 520).addScaledVector(fv, ferry[k2][1] * 520);
      pos[i * 3] = p.x; pos[i * 3 + 1] = p.y; pos[i * 3 + 2] = p.z;
      col[i * 3] = PAL.bone.r * 1.6; col[i * 3 + 1] = PAL.bone.g * 1.6; col[i * 3 + 2] = PAL.bone.b * 1.5;
      attr[i * 3] = 3.1; attr[i * 3 + 1] = k2; attr[i * 3 + 2] = (k2 === 3) ? 2 : 1;
    }
    this.starCount = i;

    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos.subarray(0, i * 3), 3));
    g.setAttribute('aCol', new THREE.BufferAttribute(col.subarray(0, i * 3), 3));
    g.setAttribute('aInfo', new THREE.BufferAttribute(attr.subarray(0, i * 3), 3));
    this.starMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false,
      uniforms: {
        uTime: { value: 0 }, uMissing: { value: 0 }, uLost: { value: 0 },
        uPx: { value: 1 },
      },
      vertexShader: `
        attribute vec3 aCol; attribute vec3 aInfo;
        varying vec3 vCol; varying float vDim;
        uniform float uTime, uMissing, uLost, uPx;
        void main(){
          vCol = aCol;
          float flag = aInfo.z;
          float dim = 1.0;
          if (flag > 0.5) dim = 1.0 - uMissing;
          if (flag > 1.5) dim = min(dim, 1.0 - uLost);
          vDim = dim * (0.88 + 0.12 * sin(uTime * 0.11 + aInfo.y * 1.7));
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_Position = projectionMatrix * mv;
          gl_PointSize = aInfo.x * uPx * clamp(30000.0 / -mv.z, 0.35, 2.0);
        }`,
      fragmentShader: `
        varying vec3 vCol; varying float vDim;
        void main(){
          vec2 q = gl_PointCoord - 0.5;
          float d = length(q);
          float a = smoothstep(0.5, 0.08, d);
          if (a < 0.01) discard;
          gl_FragColor = vec4(vCol * vDim, a * vDim);
        }`,
    });
    this.stars = new THREE.Points(g, this.starMat);
    this.stars.frustumCulled = false;
    this.stars.renderOrder = -20;
    this.group.add(this.stars);
    this._track(g, this.starMat);
  }

  /* ---- planet ----------------------------------------------------------- */
  _buildPlanet(){
    const cel = this.plan.celestial;
    const g = new THREE.IcosahedronGeometry(cel.planetR, QUALITY.planetDetail);
    this.planetMat = new THREE.ShaderMaterial({
      uniforms: {
        uSun: { value: this.sunDir }, uBand: { value: cel.bandSeed },
        uFreq: { value: cel.bandFreq }, uTime: { value: 0 },
      },
      vertexShader: `
        varying vec3 vPos; varying vec3 vWorld;
        void main(){
          vPos = position;
          vec4 w = modelMatrix * vec4(position, 1.0);
          vWorld = w.xyz;
          gl_Position = projectionMatrix * viewMatrix * w;
        }`,
      fragmentShader: `
        varying vec3 vPos; varying vec3 vWorld;
        uniform vec3 uSun; uniform float uBand, uFreq, uTime;
        float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
        float noise(vec2 p){
          vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
          return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x),
                     mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
        }
        void main(){
          vec3 n = normalize(cross(dFdx(vWorld), dFdy(vWorld)));
          vec3 p = normalize(vPos);
          float lat = p.y;
          float warp = noise(vec2(p.x * 3.0 + uBand, p.z * 3.0)) * 0.35;
          float band = sin((lat + warp) * uFreq * 3.1 + uBand);
          float band2 = sin((lat + warp * 0.6) * uFreq * 7.7 + uBand * 2.0);
          // screen-printed night bands: aubergine to umber, very dark
          vec3 cA = vec3(0.058, 0.024, 0.066);
          vec3 cB = vec3(0.120, 0.050, 0.036);
          vec3 cC = vec3(0.036, 0.019, 0.026);
          vec3 base = mix(cA, cB, smoothstep(-0.4, 0.6, band));
          base = mix(base, cC, smoothstep(0.2, 0.9, band2) * 0.5);
          float NdL = dot(n, uSun);
          float lit = smoothstep(0.06, 0.52, NdL);
          float term = smoothstep(-0.22, 0.02, NdL) * (1.0 - smoothstep(0.04, 0.42, NdL));
          vec3 dayC = mix(vec3(0.32, 0.13, 0.05), vec3(0.55, 0.34, 0.13), smoothstep(-0.5, 0.8, band));
          vec3 col = base + dayC * lit * 0.52 + vec3(0.75, 0.18, 0.09) * term * 0.85;
          // sparse hand-built settlements on the night side
          float town = step(0.9985, hash(floor(vec2((p.x + 1.0) * 260.0, (p.z + p.y) * 260.0))));
          float nightside = 1.0 - smoothstep(-0.05, 0.15, NdL);
          col += vec3(0.85, 0.55, 0.22) * town * nightside * 0.7;
          gl_FragColor = vec4(col, 1.0);
        }`,
    });
    this.planet = new THREE.Mesh(g, this.planetMat);
    this.planet.position.copy(this.planetCenter);
    this.planet.rotation.z = 0.32;
    this.group.add(this.planet);
    this._track(g, this.planetMat);

    // limb glow — a restrained fresnel shell
    const g2 = new THREE.SphereGeometry(cel.planetR * 1.018, 48, 32);
    this.limbMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.BackSide,
      uniforms: { uSun: { value: this.sunDir } },
      vertexShader: `
        varying vec3 vN; varying vec3 vV;
        void main(){
          vN = normalize(mat3(modelMatrix) * normal);
          vec4 w = modelMatrix * vec4(position, 1.0);
          vV = normalize(cameraPosition - w.xyz);
          gl_Position = projectionMatrix * viewMatrix * w;
        }`,
      fragmentShader: `
        varying vec3 vN; varying vec3 vV; uniform vec3 uSun;
        void main(){
          float f = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), 3.5);
          float sunSide = 0.35 + 0.65 * smoothstep(-0.4, 0.6, dot(normalize(vN), uSun));
          vec3 col = mix(vec3(0.10, 0.03, 0.10), vec3(0.75, 0.22, 0.10), sunSide);
          gl_FragColor = vec4(col * f * 0.95, f * 0.7);
        }`,
    });
    const limb = new THREE.Mesh(g2, this.limbMat);
    limb.position.copy(this.planetCenter);
    this.group.add(limb);
    this._track(g2, this.limbMat);
  }

  /* ---- eclipse disc ------------------------------------------------------ */
  _buildEclipse(){
    const rr = new Stream(this.plan.seed, 'real:eclipse');
    const R = this.plan.celestial.eclipseR;
    const grp = new THREE.Group();
    grp.position.copy(this.eclipsePos);
    grp.lookAt(0, 0, 0);

    // corona ring — the light the disc hides
    const ringG = new THREE.RingGeometry(R * 0.96, R * 2.05, 72, 1);
    const ringMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
      uniforms: { uR: { value: R } },
      vertexShader: `varying vec2 vP; void main(){ vP = position.xy;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `
        varying vec2 vP; uniform float uR;
        void main(){
          float r = length(vP) / uR;
          float ring = exp(-(r - 1.0) * 3.4);
          float spear = pow(abs(sin(atan(vP.y, vP.x) * 4.0 + 0.6)), 24.0) * exp(-(r - 1.0) * 1.4) * 0.5;
          vec3 col = vec3(0.95, 0.72, 0.38) * ring + vec3(1.0, 0.35, 0.15) * spear;
          float a = clamp(ring + spear, 0.0, 1.0);
          if (r < 1.0){ col *= smoothstep(0.955, 1.0, r); a *= smoothstep(0.955, 1.0, r); }
          gl_FragColor = vec4(col * 1.05, a);
        }`,
    });
    const ring = new THREE.Mesh(ringG, ringMat);
    grp.add(ring);

    // the faceted occluder — cut-paper rim
    const seg = 26, shape = new THREE.Shape();
    for (let i = 0; i <= seg; i++){
      const a = (i / seg) * TAU;
      const rj = R * (0.985 + 0.03 * Math.sin(a * 7 + rr.range(0, TAU)) * rr.range(0.3, 1));
      if (i === 0) shape.moveTo(Math.cos(a) * rj, Math.sin(a) * rj);
      else shape.lineTo(Math.cos(a) * rj, Math.sin(a) * rj);
    }
    const discG = new THREE.ShapeGeometry(shape, 4);
    const discMat = new THREE.ShaderMaterial({
      side: THREE.DoubleSide,
      uniforms: {},
      vertexShader: `varying vec2 vP; void main(){ vP = position.xy;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `
        varying vec2 vP;
        float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
        void main(){
          float fac = hash(floor(vP * 0.006));
          vec3 col = mix(vec3(0.0035, 0.0018, 0.0040), vec3(0.0140, 0.0062, 0.0105), fac);
          gl_FragColor = vec4(col, 1.0);
        }`,
    });
    const disc = new THREE.Mesh(discG, discMat);
    disc.position.z = 40;
    grp.add(disc);
    /* quiet rainbow halo — the light remembering it is many colours */
    const haloG = new THREE.RingGeometry(R * 2.10, R * 2.62, 72, 1);
    const haloMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
      uniforms: { uR0: { value: R * 2.10 }, uR1: { value: R * 2.62 } },
      vertexShader: `varying vec2 vP; void main(){ vP = position.xy;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `
        varying vec2 vP; uniform float uR0, uR1;
        void main(){
          float rr = clamp((length(vP) - uR0) / (uR1 - uR0), 0.0, 1.0);
          vec3 hue = 0.55 + 0.45 * cos(6.28318 * (0.02 + rr * 0.72 + vec3(0.00, 0.33, 0.67)));
          float a = pow(sin(rr * 3.14159), 1.6) * 0.20;
          gl_FragColor = vec4(pow(hue, vec3(1.2)) * a * 1.6, a);
        }`,
    });
    const halo = new THREE.Mesh(haloG, haloMat);
    grp.add(halo);
    this._track(haloG, haloMat);
    grp.scale.setScalar(1);
    this.eclipse = grp;
    this.group.add(grp);
    this._track(ringG, ringMat, discG, discMat);
  }

  /* ---- cut-paper orbital arcs ------------------------------------------- */
  _buildScrims(){
    const rr = new Stream(this.plan.seed, 'real:scrims');
    this.scrims = [];
    const mat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, side: THREE.DoubleSide,
      uniforms: { uTint: { value: new THREE.Color(0x1a0c18) } },
      vertexShader: `varying vec2 vUv; void main(){ vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `
        varying vec2 vUv; uniform vec3 uTint;
        void main(){
          float edge = smoothstep(0.0, 0.05, vUv.y) * smoothstep(1.0, 0.95, vUv.y);
          float rim = smoothstep(0.965, 0.985, vUv.y) * 0.5 + smoothstep(0.035, 0.015, vUv.y) * 0.25;
          vec3 col = uTint + vec3(0.55, 0.38, 0.16) * rim;
          gl_FragColor = vec4(col, edge * 0.85);
        }`,
    });
    this.scrimMat = mat;
    for (let i = 0; i < 4; i++){
      const R = rr.range(7000, 13500);
      const arc = rr.range(0.5, 1.4);
      const g = new THREE.RingGeometry(R, R * rr.range(1.012, 1.03), 64, 1, rr.range(0, TAU), arc);
      const m = new THREE.Mesh(g, mat);
      m.position.set(rr.range(-1, 1) * 2000, rr.range(-2500, 2600), rr.range(-1, 1) * 2000);
      m.rotation.set(rr.range(0.8, 1.9), rr.range(0, TAU), rr.range(0, TAU));
      m.userData.drift = rr.range(0.002, 0.007) * rr.sign();
      this.scrims.push(m);
      this.group.add(m);
      this._track(g);
    }
    this._track(mat);
  }

  /* ---- aurora veils — the sky's own slow rainbow ------------------------- */
  _buildAurora(){
    const rr = new Stream(this.plan.seed, 'real:aurora');
    this.auroras = [];
    const fr2 = makeFrame();
    for (let i = 0; i < 3; i++){
      const mat = new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
        uniforms: { uTime: { value: 0 }, uPhase: { value: rr.range(0, 10) } },
        vertexShader: `
          varying vec2 vUv; uniform float uTime, uPhase;
          void main(){
            vUv = uv;
            vec3 p = position;
            p.z += sin(uv.x * 9.0 + uTime * 0.05 + uPhase) * 60.0
                 + sin(uv.x * 23.0 - uTime * 0.03 + uPhase * 2.0) * 24.0;
            p.y += sin(uv.x * 5.0 + uTime * 0.04 + uPhase) * 0.03;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
          }`,
        fragmentShader: `
          varying vec2 vUv; uniform float uTime, uPhase;
          void main(){
            float bands = 0.5 + 0.5 * sin(vUv.x * 30.0 + uTime * 0.05 + uPhase * 7.0);
            bands = pow(bands, 2.4);
            float rays = 0.6 + 0.4 * sin(vUv.x * 90.0 - uTime * 0.02 + uPhase);
            float vfade = smoothstep(0.02, 0.30, vUv.y) * (1.0 - smoothstep(0.55, 0.98, vUv.y));
            float hfade = smoothstep(0.0, 0.14, vUv.x) * (1.0 - smoothstep(0.86, 1.0, vUv.x));
            vec3 hue = 0.55 + 0.45 * cos(6.28318 * (vUv.x * 0.85 + uTime * 0.004 + uPhase + vec3(0.00, 0.33, 0.67)));
            float a = bands * rays * vfade * hfade * 0.19;
            gl_FragColor = vec4(pow(hue, vec3(1.25)) * a * 1.5, a);
          }`,
      });
      const g = new THREE.PlaneGeometry(1, 1, 56, 1);
      const m = new THREE.Mesh(g, mat);
      const sFrac = i === 0 ? 0.13 : rr.range(0.3, 0.9);
      this.route.frameAt(sFrac * this.plan.L, 'base', fr2);
      const side = i === 0 ? -this.plan.celestial.planetSide : rr.sign();
      const dist = rr.range(1700, 3100);
      m.position.copy(fr2.pos).addScaledVector(fr2.right, side * dist);
      m.position.y += rr.range(380, 780);
      m.scale.set(rr.range(2200, 3800), rr.range(650, 1100), 1);
      m.lookAt(fr2.pos.clone().add(new THREE.Vector3(0, m.position.y * 0.5, 0)));
      m.renderOrder = -12;
      this.auroras.push(m);
      this.group.add(m);
      this._track(g, mat);
    }
  }

  /* ---- the wider network — faint far asterlines -------------------------- */
  _buildNetwork(){
    const rr = new Stream(this.plan.seed, 'real:network');
    const mat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, side: THREE.DoubleSide,
      uniforms: { uTime: { value: 0 }, uReply: { value: 0 } },
      vertexShader: `varying vec2 vUv; void main(){ vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `
        varying vec2 vUv; uniform float uTime, uReply;
        void main(){
          float body = 0.05;
          float lights = step(0.982, fract(vUv.x * 90.0 - uTime * 0.015)) * (0.5 + 5.0 * uReply);
          float edge = smoothstep(0.0, 0.25, vUv.y) * smoothstep(1.0, 0.75, vUv.y);
          vec3 dash = 0.55 + 0.45 * cos(6.28318 * (vUv.x * 4.0 + uTime * 0.006 + vec3(0.00, 0.33, 0.67)));
          vec3 col = vec3(0.10, 0.05, 0.06) * body + pow(dash, vec3(1.3)) * lights * 0.9;
          gl_FragColor = vec4(col, edge * (0.5 + 0.3 * uReply));
        }`,
    });
    this.networkMat = mat;
    for (let i = 0; i < 3; i++){
      const R = rr.range(3200, 6400);
      const g = new THREE.RingGeometry(R, R + rr.range(26, 44), 96, 1, rr.range(0, TAU), rr.range(1.2, 2.6));
      const m = new THREE.Mesh(g, mat);
      const fr2 = makeFrame();
      this.route.frameAt(rr.range(0.2, 0.8) * this.plan.L, 'base', fr2);
      m.position.copy(fr2.pos).addScaledVector(fr2.right, rr.sign() * rr.range(2600, 4800));
      m.position.y += rr.range(-2200, -600);
      m.rotation.set(Math.PI / 2 + rr.range(-0.3, 0.3), rr.range(0, TAU), 0);
      this.group.add(m);
      this._track(g);
    }
    this._track(mat);
  }

  /* ---- the Echo Road anomaly --------------------------------------------- */
  _buildEcho(){
    if (this.plan.anomalies.impossible !== 'echoRoad'){ this.echo = null; return; }
    const pts = []; const fr2 = makeFrame();
    for (let s = 0; s <= this.plan.L; s += 40){
      this.route.frameAt(this.plan.L - s, 'base', fr2);
      pts.push(fr2.pos.clone().add(new THREE.Vector3(0, 640, 0)));
    }
    const g = new THREE.BufferGeometry();
    const n = pts.length; const posA = new Float32Array(n * 2 * 3); const uvA = new Float32Array(n * 2 * 2);
    const right = new THREE.Vector3();
    for (let i = 0; i < n; i++){
      const p = pts[i]; const q = pts[Math.min(i + 1, n - 1)];
      right.subVectors(q, p); right.set(-right.z, 0, right.x).normalize().multiplyScalar(9);
      posA.set([p.x - right.x, p.y, p.z - right.z, p.x + right.x, p.y, p.z + right.z], i * 6);
      uvA.set([i / n, 0, i / n, 1], i * 4);
    }
    const idx = [];
    for (let i = 0; i < n - 1; i++){ const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
    g.setAttribute('position', new THREE.BufferAttribute(posA, 3));
    g.setAttribute('uv', new THREE.BufferAttribute(uvA, 2));
    g.setIndex(idx);
    this.echoMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, side: THREE.DoubleSide,
      uniforms: { uTime: { value: 0 }, uOn: { value: 0 } },
      vertexShader: `varying vec2 vUv; void main(){ vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `
        varying vec2 vUv; uniform float uTime, uOn;
        void main(){
          float body = 0.06;
          float lights = step(0.985, fract(vUv.x * 160.0 + uTime * 0.02)) * 0.7;
          float edge = smoothstep(0.0, 0.2, vUv.y) * smoothstep(1.0, 0.8, vUv.y);
          vec3 col = vec3(0.09, 0.05, 0.07) * body + vec3(0.8, 0.5, 0.28) * lights;
          gl_FragColor = vec4(col, edge * uOn * 0.55);
        }`,
    });
    this.echo = new THREE.Mesh(g, this.echoMat);
    this.echo.visible = false;
    this.group.add(this.echo);
    this._track(g, this.echoMat);
  }

  /* ---- orbital motes ------------------------------------------------------ */
  _buildMotes(){
    const rr = new Stream(this.plan.seed, 'real:motes');
    const N = QUALITY.motes;
    const box = 860;
    const pos = new Float32Array(N * 3), info = new Float32Array(N * 3);
    for (let i = 0; i < N; i++){
      pos[i * 3] = rr.range(0, box); pos[i * 3 + 1] = rr.range(0, box); pos[i * 3 + 2] = rr.range(0, box);
      info[i * 3] = rr.range(0.7, 1.9); info[i * 3 + 1] = rr.range(0, TAU); info[i * 3 + 2] = rr.float();
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('aInfo', new THREE.BufferAttribute(info, 3));
    this.moteMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      uniforms: { uTime: { value: 0 }, uCenter: { value: new THREE.Vector3() },
                  uBox: { value: box }, uPx: { value: 1 } },
      vertexShader: `
        attribute vec3 aInfo; varying float vA; varying float vT;
        uniform float uTime, uBox, uPx; uniform vec3 uCenter;
        void main(){
          vec3 p = mod(position - uCenter + uBox * 0.5, uBox) - uBox * 0.5 + uCenter;
          p.x += sin(uTime * 0.05 + aInfo.y) * 6.0;
          p.y += sin(uTime * 0.037 + aInfo.y * 2.1) * 4.0;
          p.z += cos(uTime * 0.043 + aInfo.y * 1.3) * 6.0;
          vec4 mv = modelViewMatrix * vec4(p, 1.0);
          float d = -mv.z;
          vA = smoothstep(26.0, 90.0, d) * (1.0 - smoothstep(360.0, 440.0, d));
          vT = aInfo.z;
          gl_Position = projectionMatrix * mv;
          gl_PointSize = aInfo.x * uPx * clamp(140.0 / d, 0.4, 2.4);
        }`,
      fragmentShader: `
        varying float vA; varying float vT;
        void main(){
          if (vA < 0.01) discard;
          vec2 q = gl_PointCoord - 0.5;
          float a = smoothstep(0.5, 0.1, length(q)) * vA * 0.30;
          vec3 col = vec3(0.55, 0.42, 0.24);
          col = mix(col, vec3(0.42, 0.09, 0.36), step(0.86, vT));
          col = mix(col, vec3(0.10, 0.30, 0.28), step(0.93, vT));
          gl_FragColor = vec4(col, a);
        }`,
    });
    this.motes = new THREE.Points(g, this.moteMat);
    this.motes.frustumCulled = false;
    this.group.add(this.motes);
    this._track(g, this.moteMat);
  }

  /* ---- meteors ------------------------------------------------------------ */
  _buildMeteors(){
    const g = new THREE.PlaneGeometry(900, 14, 1, 1);
    this.meteorMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
      uniforms: { uLife: { value: 0 }, uHue: { value: 0 } },
      vertexShader: `varying vec2 vUv; void main(){ vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `
        varying vec2 vUv; uniform float uLife, uHue;
        void main(){
          float head = smoothstep(0.0, 0.85, vUv.x);
          float tail = 1.0 - smoothstep(0.85, 1.0, vUv.x);
          float w = smoothstep(0.0, 0.45, vUv.y) * smoothstep(1.0, 0.55, vUv.y);
          float a = head * tail * w * uLife;
          vec3 spectral = 0.55 + 0.45 * cos(6.28318 * (uHue + vUv.x * 0.22 + vec3(0.00, 0.33, 0.67)));
          gl_FragColor = vec4(pow(spectral, vec3(1.15)) * a * 1.5, a);
        }`,
    });
    this.meteorPool = [];
    for (let i = 0; i < 4; i++){
      const mat = this.meteorMat.clone();
      const m = new THREE.Mesh(g, mat);
      m.visible = false;
      this.meteorPool.push({ mesh: m, mat, active: false, t0: 0, dur: 0 });
      this.group.add(m);
      this._track(mat);
    }
    this._track(g, this.meteorMat);
    this.meteorIdx = 0;
  }

  /* ---- per-frame ---------------------------------------------------------- */
  update(dt, t, camPos, anomalyState){
    this.time = t;
    this.starMat.uniforms.uTime.value = t;
    this.starMat.uniforms.uMissing.value = anomalyState.missing;
    this.starMat.uniforms.uLost.value = anomalyState.lost;
    this.planet.rotation.y += dt * 0.0011;
    this.moteMat.uniforms.uTime.value = t;
    this.moteMat.uniforms.uCenter.value.copy(camPos);
    this.networkMat.uniforms.uTime.value = t;
    this.networkMat.uniforms.uReply.value = anomalyState.reply || 0;
    for (const s of this.scrims) s.rotation.z += dt * s.userData.drift * 0.01;
    for (const a of this.auroras) a.material.uniforms.uTime.value = t;
    if (this.echo){
      this.echoMat.uniforms.uTime.value = t;
      this.echoMat.uniforms.uOn.value = anomalyState.echo;
      this.echo.visible = anomalyState.echo > 0.01;
    }
    // meteors from the deterministic schedule
    const sched = this.plan.meteors;
    while (this.meteorIdx < sched.length && sched[this.meteorIdx].t0 <= t){
      const ev = sched[this.meteorIdx++];
      const slot = this.meteorPool.find(p => !p.active);
      if (slot){
        slot.active = true; slot.t0 = t; slot.dur = 2.2 / ev.spd;
        const d = new THREE.Vector3(Math.cos(ev.az) * Math.cos(ev.el), Math.sin(ev.el), Math.sin(ev.az) * Math.cos(ev.el));
        slot.mesh.position.copy(d).multiplyScalar(16000);
        slot.mesh.position.y = Math.abs(slot.mesh.position.y) * 0.6 + 2500;
        slot.mesh.lookAt(camPos);
        slot.mesh.rotateZ(ev.roll);
        slot.mat.uniforms.uHue.value = ev.az / 6.28318;
        slot.vel = new THREE.Vector3(Math.cos(ev.roll), Math.sin(ev.roll) * 0.4, 0.2).normalize().multiplyScalar(2600 * ev.spd);
        slot.mesh.visible = true;
      }
    }
    for (const p of this.meteorPool){
      if (!p.active) continue;
      const u = (t - p.t0) / p.dur;
      if (u >= 1){ p.active = false; p.mesh.visible = false; continue; }
      p.mesh.position.addScaledVector(p.vel, dt);
      p.mat.uniforms.uLife.value = Math.sin(u * Math.PI) * 0.8;
    }
  }

  setPixelScale(px){
    this.starMat.uniforms.uPx.value = px;
    this.moteMat.uniforms.uPx.value = px;
  }

  dispose(){
    for (const d of this.disposables) d.dispose && d.dispose();
  }
}

/* ============================================================================
   THE ROAD — matte graphite deck, articulated panels, parapets, dormant edge
   ribs, faceted glowing underside, fork islands, far proxy, streaming.
   ========================================================================= */

const PARA_H = 0.62, PARA_T = 0.24, RIB_H = 0.88, RIB_L = 0.55, RIB_T = 0.07;
const DETAIL_AHEAD = 620, DETAIL_BEHIND = 260, DETAIL_DROP = 140;

const ROAD_VERT = `
  attribute float aS; attribute float aLat; attribute float aPart; attribute float aAux;
  varying float vS; varying float vLat; varying float vPart; varying float vAux;
  varying vec3 vWorld;
  void main(){
    vS = aS; vLat = aLat; vPart = aPart; vAux = aAux;
    vec4 w = modelMatrix * vec4(position, 1.0);
    vWorld = w.xyz;
    gl_Position = projectionMatrix * viewMatrix * w;
  }`;

const ROAD_FRAG = `
  varying float vS; varying float vLat; varying float vPart; varying float vAux;
  varying vec3 vWorld;
  uniform float uWakeS, uBreath, uTime, uAmber, uDatum;
  uniform vec3 uSun;
  ${GLSL_PRISM}
  ${GLSL_WAKE}
  float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  float noise(vec2 p){
    vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
    return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x),
               mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
  }
  void main(){
    vec3 n = normalize(cross(dFdx(vWorld), dFdy(vWorld)));
    vec3 V = normalize(cameraPosition - vWorld);
    if (dot(n, V) < 0.0) n = -n;
    float wake = wakeEnv(vS, uWakeS, uBreath);
    vec3 prism = prismColor(vS * 0.0042 + (vS - uWakeS) * 0.0021 + uTime * 0.012, uAmber);
    vec3 col;
    float glow = 0.0; vec3 glowC = prism;

    if (vPart < 0.5){
      /* deck */
      vec3 base = vec3(0.0132, 0.0140, 0.0168);
      float wear = noise(vec2(vS * 0.11, vLat * 0.23));
      base *= 0.88 + 0.26 * wear;
      float seamL = smoothstep(0.055, 0.02, abs(fract(vLat / 2.7 + 0.5) - 0.5) * 2.7);
      float seamT = smoothstep(0.075, 0.03, abs(fract(vS / 6.0 + 0.5) - 0.5) * 6.0);
      base *= 1.0 - 0.42 * max(seamL, seamT);
      float joint = smoothstep(0.30, 0.10, abs(fract(vS / 30.0 + 0.5) - 0.5) * 30.0);
      base *= 1.0 - 0.5 * joint;
      /* luminous aggregate: faint fixed specks */
      float speck = step(0.9965, hash(floor(vec2(vS * 7.0, vLat * 7.0))));
      base += vec3(0.045, 0.036, 0.026) * speck;
      /* viewing panes outside the tire line */
      float paneBand = step(3.5, abs(vLat)) * step(abs(vLat), 4.62);
      float paneBlock = step(0.68, hash(vec2(floor(vS / 54.0), sign(vLat))));
      float paneCell = smoothstep(0.42, 0.34, abs(fract(vS / 9.0 + 0.5) - 0.5)) *
                       smoothstep(0.50, 0.40, abs(fract((abs(vLat) - 3.5) / 1.12 + 0.5) - 0.5));
      float pane = paneBand * paneBlock * paneCell;
      float paneHue = hash(vec2(floor(vS / 9.0), floor((abs(vLat) - 3.5) / 1.12) + sign(vLat) * 4.0));
      vec3 paneC = prismColor(paneHue * 0.9 + uTime * 0.006, uAmber) * 0.10
                 + vec3(0.004, 0.010, 0.012);
      col = mix(base, paneC, pane * 0.85);
      /* the painted wake: the road remembers every metre in colour */
      float dBack = vS - uWakeS;
      float back = 1.0 - smoothstep(-26.0, -6.0, dBack);
      if (back > 0.004){
        vec2 cellId = vec2(floor(vS / 6.0), floor((vLat + 5.4) / 2.7));
        float lucky = step(0.93, hash(cellId * 1.71 + 3.7));
        float amberEff = uAmber * (1.0 - smoothstep(30.0, 140.0, -dBack));
        vec3 pc = prismColor(cellId.x * 0.047 + cellId.y * 0.13 + uTime * 0.012, amberEff);
        float mosaic = 1.0 - 0.42 * max(seamL, seamT);
        col += pc * back * (0.24 + 0.10 * uBreath) * (1.0 + lucky) * mosaic;
      }
      /* warm centre datum */
      float datum = smoothstep(0.10, 0.035, abs(vLat)) * uDatum;
      glow += datum * (0.06 + 0.13 * wake);
      glowC = mix(vec3(0.82, 0.66, 0.35), prism, 0.55);
      /* faint spectral sheen outside the tire line — casino floor, barely */
      float shBand = smoothstep(1.6, 2.7, abs(vLat));
      col += prismColor(vLat * 0.06 + vS * 0.002 + uTime * 0.01, uAmber) * shBand * 0.010;
      /* restrained specular from the eclipse light */
      vec3 H = normalize(uSun + V);
      float spec = pow(max(dot(n, H), 0.0), 42.0) * (0.05 + 0.10 * pane);
      col += vec3(0.85, 0.68, 0.42) * spec;
    } else if (vPart < 1.5){
      /* faceted underside */
      float fh = hash(vec2(floor(vS / 6.0), vAux));
      vec3 base = mix(vec3(0.010, 0.005, 0.012), vec3(0.026, 0.011, 0.024), fh);
      float lit = wake * step(0.28, fh);
      col = base;
      glow += lit * (0.55 + 0.85 * fh);
      glowC = prismColor(vS * 0.0042 + (vS - uWakeS) * 0.0021 + uTime * 0.012 + fh * 0.09, uAmber);
      float NdL = max(dot(n, uSun), 0.0);
      col += vec3(0.30, 0.14, 0.06) * NdL * 0.25;
    } else if (vPart < 2.5){
      /* parapet */
      vec3 base = vec3(0.0176, 0.0180, 0.0210);
      float panel = smoothstep(0.06, 0.025, abs(fract(vS / 4.0 + 0.5) - 0.5) * 4.0);
      base *= 1.0 - 0.35 * panel;
      col = base * (0.9 + 0.2 * noise(vec2(vS * 0.2, vLat)));
      /* continuous top light seam */
      float seam = smoothstep(0.72, 0.98, vAux);
      glow += seam * (0.03 + 0.52 * wake);
      float NdL = max(dot(n, uSun), 0.0);
      col += vec3(0.32, 0.16, 0.07) * NdL * 0.30;
    } else if (vPart < 3.5){
      /* rib fin body */
      col = vec3(0.0128, 0.0132, 0.0158);
      float NdL = max(dot(n, uSun), 0.0);
      col += vec3(0.35, 0.17, 0.08) * NdL * 0.32;
      glow += 0.02;
      glowC = vec3(0.62, 0.45, 0.25);
    } else if (vPart < 4.5){
      /* rib light slit — candy-offset so neighbouring ribs walk the wheel */
      col = vec3(0.010, 0.008, 0.012);
      glowC = prismColor(floor(vS / 4.0 + 0.5) * 0.088 + uTime * 0.012, uAmber);
      glow += (0.05 + 1.45 * wake) * (0.82 + 0.18 * sin(6.28318 * vS * 0.05 - uTime * 4.2));
    } else {
      /* fork island nose */
      col = vec3(0.0150, 0.0154, 0.0182);
      float chevron = smoothstep(0.25, 0.05, abs(fract(vS / 2.6 + vLat * 0.35 + 0.5) - 0.5));
      glow += 0.10 + 0.35 * chevron * (0.3 + 0.7 * wake);
      glowC = vec3(0.82, 0.66, 0.35);
    }
    col += glowC * glow;
    gl_FragColor = vec4(col, 1.0);
  }`;

class RoadSystem {
  constructor(plan, route, scene){
    this.plan = plan; this.route = route; this.scene = scene;
    this.mat = new THREE.ShaderMaterial({
      vertexShader: ROAD_VERT, fragmentShader: ROAD_FRAG,
      uniforms: {
        uWakeS: { value: 0 }, uBreath: { value: 0 }, uTime: { value: 0 },
        uAmber: { value: 0 }, uDatum: { value: 1 }, uCrown: { value: 0 },
        uRush: { value: 0 }, uPulseS: { value: -1e6 }, uPulseAmp: { value: 0 },
        uSun: { value: new THREE.Vector3(0, 1, 0) },
      },
    });
    this.live = new Map();        // chunk id -> { mesh, chunk }
    this.built = 0; this.dropped = 0;
    this.pending = [];
    this._fr = makeFrame();
    this._buildProxy();
  }

  /* ------------------------------ chunk mesh ---------------------------- */
  buildChunk(chunk){
    const verts = [], idx = [];
    const V = (p, s, lat, part, aux) => {
      verts.push(p.x, p.y, p.z, s, lat, part, aux);
      return (verts.length / 7) - 1;
    };
    const quad = (a, b, c, d) => { idx.push(a, b, c, a, c, d); };
    const fr = this._fr;
    const rt = this.route;

    if (chunk.lane === 'islandA' || chunk.lane === 'islandB'){
      this._buildIsland(chunk, verts, idx, V, quad);
    } else {
      const s0 = chunk.s0, s1 = chunk.s1;
      const p = new THREE.Vector3();
      let prev = null;
      for (let s = s0; s <= s1 + 0.01; s += STEP){
        const ss = Math.min(s, s1);
        rt.frameAt(ss, chunk.lane, fr);
        const hw = rt.halfWidth(ss, chunk.lane);
        const row = { deck: [], paraL: [], paraR: [], under: [] };
        for (const f of [-1, -0.5, 0, 0.5, 1]){
          p.copy(fr.pos).addScaledVector(fr.right, f * hw);
          row.deck.push(V(p, ss, f * hw, 0, 0));
        }
        for (const sd of [-1, 1]){
          const arr = sd < 0 ? row.paraL : row.paraR;
          const e = sd * hw, eo = sd * (hw + PARA_T);
          p.copy(fr.pos).addScaledVector(fr.right, e); arr.push(V(p, ss, e, 2, 0));
          p.copy(fr.pos).addScaledVector(fr.right, e).addScaledVector(fr.nrm, PARA_H); arr.push(V(p, ss, e, 2, 1));
          p.copy(fr.pos).addScaledVector(fr.right, eo).addScaledVector(fr.nrm, PARA_H); arr.push(V(p, ss, eo, 2, 1));
          p.copy(fr.pos).addScaledVector(fr.right, eo).addScaledVector(fr.nrm, -0.42); arr.push(V(p, ss, eo, 2, 0));
        }
        const uPts = [[-hw, 0], [-hw * 0.63, -1.5], [0, -2.4], [hw * 0.63, -1.5], [hw, 0]];
        for (let u = 0; u < 5; u++){
          p.copy(fr.pos).addScaledVector(fr.right, uPts[u][0]).addScaledVector(fr.nrm, uPts[u][1]);
          row.under.push(V(p, ss, uPts[u][0], 1, u));
        }
        if (prev){
          for (let i = 0; i < 4; i++) quad(prev.deck[i], prev.deck[i + 1], row.deck[i + 1], row.deck[i]);
          for (const key of ['paraL', 'paraR']){
            const a = prev[key], b = row[key];
            for (let i = 0; i < 3; i++){
              if (key === 'paraL') quad(a[i + 1], a[i], b[i], b[i + 1]);
              else quad(a[i], a[i + 1], b[i + 1], b[i]);
            }
          }
          for (let i = 0; i < 4; i++) quad(prev.under[i + 1], prev.under[i], row.under[i], row.under[i + 1]);
        }
        prev = row;
        if (s >= s1) break;
      }
      /* dormant edge ribs on the parapet crown */
      const step = QUALITY.ribStep;
      const rp = new THREE.Vector3(), fwd = new THREE.Vector3(), out = new THREE.Vector3();
      for (let s = Math.ceil(s0 / step) * step; s < s1; s += step){
        rt.frameAt(s, chunk.lane, fr);
        const hw = rt.halfWidth(s, chunk.lane);
        const ribIdx = Math.round(s / step);
        const hM = (ribIdx % 4 === 0) ? 1.3 : ((ribIdx % 2) ? 0.82 : 1.0);
        for (const sd of [-1, 1]){
          const eo = sd * (hw + PARA_T * 0.5);
          fwd.copy(fr.tan).multiplyScalar(RIB_L * 0.5);
          out.copy(fr.right).multiplyScalar(RIB_T * 0.5 * sd);
          const base = rp.copy(fr.pos).addScaledVector(fr.right, eo).addScaledVector(fr.nrm, PARA_H);
          const t0 = new THREE.Vector3().copy(base).sub(fwd), t1 = new THREE.Vector3().copy(base).add(fwd);
          const mk = (b0, up, o, part) => {
            const q = new THREE.Vector3().copy(b0).addScaledVector(fr.nrm, up).add(o);
            return V(q, s, eo, part, 0);
          };
          const oIn = out.clone().negate(), oOut = out.clone();
          const iA = mk(t0, 0, oOut, 3), iB = mk(t1, 0, oOut, 3),
                iC = mk(t1, RIB_H * hM, oOut, 3), iD = mk(t0, RIB_H * 0.8 * hM, oOut, 3);
          if (sd > 0) quad(iA, iB, iC, iD); else quad(iD, iC, iB, iA);
          const jA = mk(t0, 0, oIn, 4), jB = mk(t1, 0, oIn, 4),
                jC = mk(t1, RIB_H * hM, oIn, 4), jD = mk(t0, RIB_H * 0.8 * hM, oIn, 4);
          if (sd > 0) quad(jD, jC, jB, jA); else quad(jA, jB, jC, jD);
          quad(iD, iC, jC, jD);
        }
      }
    }

    const g = new THREE.BufferGeometry();
    const f32 = new Float32Array(verts);
    const inter = new THREE.InterleavedBuffer(f32, 7);
    g.setAttribute('position', new THREE.InterleavedBufferAttribute(inter, 3, 0));
    g.setAttribute('aS', new THREE.InterleavedBufferAttribute(inter, 1, 3));
    g.setAttribute('aLat', new THREE.InterleavedBufferAttribute(inter, 1, 4));
    g.setAttribute('aPart', new THREE.InterleavedBufferAttribute(inter, 1, 5));
    g.setAttribute('aAux', new THREE.InterleavedBufferAttribute(inter, 1, 6));
    g.setIndex(idx);
    g.computeBoundingSphere();
    const mesh = new THREE.Mesh(g, this.mat);
    mesh.matrixAutoUpdate = false;
    return mesh;
  }

  _buildIsland(chunk, verts, idx, V, quad){
    const rt = this.route, f = this.plan.fork;
    const isA = chunk.lane === 'islandA';
    const pIn = new THREE.Vector3(), pOut = new THREE.Vector3(), base = new THREE.Vector3();
    const p = new THREE.Vector3();
    const frB = makeFrame();
    let prev = null;
    for (let s = chunk.s0; s <= chunk.s1 + 0.01; s += STEP){
      const ss = Math.min(s, chunk.s1);
      rt.frameAt(ss, 'base', frB);
      rt.posAt(ss, 'inner', pIn); rt.posAt(ss, 'outer', pOut);
      pIn.addScaledVector(frB.right, f.side * ROAD_HALF);
      pOut.addScaledVector(frB.right, -f.side * ROAD_HALF);
      const gap = pIn.distanceTo(pOut);
      if (gap > 7.2 && ((isA && ss > chunk.s0 + 20) || (!isA && ss < chunk.s1 - 20))){
        if (isA) break; else { prev = null; continue; }
      }
      const hEnv = isA ? smooth((chunk.s1 - ss) / 12) : smooth((ss - chunk.s0) / 12);
      const row = { d: [], wl: [], wr: [], rf: [] };
      for (const t of [0, 0.5, 1]){
        p.lerpVectors(pIn, pOut, t);
        row.d.push(V(p, ss, (t - 0.5) * gap, 5, 0));
      }
      for (const [key, edge, sd] of [['wl', pIn, 1], ['wr', pOut, -1]]){
        p.copy(edge); row[key].push(V(p, ss, sd, 2, 0));
        p.copy(edge).addScaledVector(frB.nrm, (PARA_H - 0.06) * hEnv); row[key].push(V(p, ss, sd, 2, 0.9));
      }
      /* median cap in island-deck material, not parapet glow */
      p.copy(pIn).addScaledVector(frB.nrm, (PARA_H - 0.06) * hEnv); row.rf.push(V(p, ss, -gap * 0.5, 5, 0));
      p.copy(pOut).addScaledVector(frB.nrm, (PARA_H - 0.06) * hEnv); row.rf.push(V(p, ss, gap * 0.5, 5, 0));
      if (prev){
        for (let i = 0; i < 2; i++) quad(prev.d[i], row.d[i], row.d[i + 1], prev.d[i + 1]);
        quad(prev.wl[0], prev.wl[1], row.wl[1], row.wl[0]);
        quad(prev.wr[1], prev.wr[0], row.wr[0], row.wr[1]);
        quad(prev.rf[0], prev.rf[1], row.rf[1], row.rf[0]);
      }
      prev = row;
      if (s >= chunk.s1) break;
    }
  }

  /* ------------------------------ far proxy ------------------------------ */
  _buildProxy(){
    const mk = (lane, s0, s1) => {
      const verts = [], idx = [];
      const fr = makeFrame(); const p = new THREE.Vector3();
      let row = 0;
      for (let s = s0; s <= s1; s += QUALITY.farStep){
        const ss = Math.min(s, s1);
        this.route.frameAt(ss, lane, fr);
        const hw = this.route.halfWidth(ss, lane);
        p.copy(fr.pos).addScaledVector(fr.right, -hw).addScaledVector(fr.nrm, -0.4);
        verts.push(p.x, p.y, p.z, ss, -1);
        p.copy(fr.pos).addScaledVector(fr.right, hw).addScaledVector(fr.nrm, -0.4);
        verts.push(p.x, p.y, p.z, ss, 1);
        if (row > 0){
          const a = (row - 1) * 2;
          idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
        }
        row++;
      }
      const g = new THREE.BufferGeometry();
      const f32 = new Float32Array(verts);
      const inter = new THREE.InterleavedBuffer(f32, 5);
      g.setAttribute('position', new THREE.InterleavedBufferAttribute(inter, 3, 0));
      g.setAttribute('aS', new THREE.InterleavedBufferAttribute(inter, 1, 3));
      g.setAttribute('aE', new THREE.InterleavedBufferAttribute(inter, 1, 4));
      g.setIndex(idx);
      g.computeBoundingSphere();
      return g;
    };
    this.proxyMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, side: THREE.DoubleSide,
      uniforms: {
        uWakeS: { value: 0 }, uBreath: { value: 0 }, uAmber: { value: 0 },
        uCrown: { value: 0 }, uTime: { value: 0 },
        uRush: { value: 0 }, uPulseS: { value: -1e6 }, uPulseAmp: { value: 0 },
      },
      vertexShader: `
        attribute float aS; attribute float aE;
        varying float vS; varying float vE; varying float vD;
        void main(){
          vS = aS; vE = aE;
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          vD = -mv.z;
          gl_Position = projectionMatrix * mv;
        }`,
      fragmentShader: `
        varying float vS; varying float vE; varying float vD;
        uniform float uWakeS, uBreath, uAmber, uTime;
        ${GLSL_PRISM}
        ${GLSL_WAKE}
        void main(){
          float ds = vS - uWakeS;
          float show = 1.0 - smoothstep(-${DETAIL_BEHIND}.0, -${DETAIL_BEHIND - 90}.0, ds)
                           * (1.0 - smoothstep(${DETAIL_AHEAD - 130}.0, ${DETAIL_AHEAD - 30}.0, ds));
          float wake = wakeEnv(vS, uWakeS, uBreath);
          float edge = smoothstep(0.66, 0.96, abs(vE));
          vec3 body = vec3(0.0165, 0.0170, 0.0200);
          float amberEff = uAmber * (1.0 - smoothstep(60.0, 300.0, uWakeS - vS));
          vec3 prism = prismColor(vS * 0.0042 + (vS - uWakeS) * 0.0021 + uTime * 0.012, amberEff);
          float farBoost = 1.0 + smoothstep(500.0, 2600.0, vD) * 1.6;
          float back = 1.0 - smoothstep(-20.0, 20.0, vS - uWakeS);
          vec3 col = body + prism * edge * (0.085 + 0.9 * wake) * farBoost
                   + prism * back * 0.22 * (0.6 + 0.4 * farBoost);
          float a = show * (0.95 - 0.25 * smoothstep(3000.0, 9000.0, vD));
          gl_FragColor = vec4(col, a);
        }`,
    });
    const f = this.plan.fork;
    this.proxyMeshes = [];
    const specs = [['base', 0, f.sFork], ['inner', f.sFork, f.sRejoin],
                   ['outer', f.sFork, f.sRejoin], ['base', f.sRejoin, this.plan.L]];
    for (const [lane, a, b] of specs){
      const g = mk(lane, a, b);
      const m = new THREE.Mesh(g, this.proxyMat);
      m.renderOrder = -6;
      m.frustumCulled = false;
      this.proxyMeshes.push(m);
      this.scene.add(m);
    }
  }

  /* ------------------------------ streaming ------------------------------ */
  update(riderS, wakeS, breath, amber, sunDir, time, crown, rush, pulseS, pulseAmp){
    for (const mm of [this.mat, this.proxyMat]){
      mm.uniforms.uCrown.value = crown || 0;
      mm.uniforms.uRush.value = rush || 0;
      mm.uniforms.uPulseS.value = (pulseS === undefined) ? -1e6 : pulseS;
      mm.uniforms.uPulseAmp.value = pulseAmp || 0;
    }
    this.mat.uniforms.uWakeS.value = wakeS;
    this.mat.uniforms.uBreath.value = breath;
    this.mat.uniforms.uAmber.value = amber;
    this.mat.uniforms.uTime.value = time;
    this.mat.uniforms.uSun.value.copy(sunDir);
    this.proxyMat.uniforms.uWakeS.value = wakeS;
    this.proxyMat.uniforms.uTime.value = time;
    this.proxyMat.uniforms.uBreath.value = breath;
    this.proxyMat.uniforms.uAmber.value = amber;

    const lo = riderS - DETAIL_BEHIND, hi = riderS + DETAIL_AHEAD;
    let builtThisFrame = 0;
    for (const chunk of this.plan.chunks){
      const want = chunk.s1 >= lo && chunk.s0 <= hi;
      const has = this.live.has(chunk.id);
      if (want && !has && builtThisFrame < 2){
        const mesh = this.buildChunk(chunk);
        this.scene.add(mesh);
        this.live.set(chunk.id, { mesh, chunk });
        this.built++; builtThisFrame++;
      } else if (!want && has){
        const far = chunk.s1 < lo - DETAIL_DROP || chunk.s0 > hi + DETAIL_DROP;
        if (far){
          const e = this.live.get(chunk.id);
          this.scene.remove(e.mesh);
          e.mesh.geometry.dispose();
          this.live.delete(chunk.id);
          this.dropped++;
        }
      }
    }
  }

  primeInitial(riderS){
    const lo = riderS - DETAIL_BEHIND, hi = riderS + DETAIL_AHEAD;
    for (const chunk of this.plan.chunks){
      if (chunk.s1 >= lo && chunk.s0 <= hi && !this.live.has(chunk.id)){
        const mesh = this.buildChunk(chunk);
        this.scene.add(mesh);
        this.live.set(chunk.id, { mesh, chunk });
        this.built++;
      }
    }
  }

  dispose(){
    for (const e of this.live.values()){
      this.scene.remove(e.mesh);
      e.mesh.geometry.dispose();
    }
    this.live.clear();
    for (const m of this.proxyMeshes){ this.scene.remove(m); m.geometry.dispose(); }
    this.proxyMat.dispose();
    this.mat.dispose();
  }
