/* ==================================================================
 *  TREES
 *  Pollarded willows and island alders. One template per level of detail;
 *  every tree's silhouette — shoot count, lengths, droop, lean, the gaps in
 *  its crown — is sculpted in the vertex shader from its own seed, so no two
 *  are alike and there is no broccoli sphere or canopy slab anywhere.
 *  Trunks barely move, shoots bend slowly, leafy tips flutter.
 * ================================================================== */

/** Topology only: the shader decides where every vertex actually goes. */
function treeTemplate(shoots, segs, crossed, sides, rings) {
  const pos = [], part = [], sho = [], tt = [], sd = [];
  const idx = [];
  const add = (x, y, z, p, s, t, side) => { pos.push(x, y, z); part.push(p); sho.push(s); tt.push(t); sd.push(side); return pos.length / 3 - 1; };

  // trunk + pollard knuckle: one tube, radius profile applied in the shader
  let prev = null;
  for (let r = 0; r <= rings; r++) {
    const t = r / rings, row = [];
    for (let a = 0; a < sides; a++) {
      const an = (a / sides) * TAU;
      row.push(add(Math.cos(an), t, Math.sin(an), t > 0.80 ? 1 : 0, 0, t, an));
    }
    if (prev) for (let a = 0; a < sides; a++) {
      const b = (a + 1) % sides;
      idx.push(prev[a], row[a], prev[b], prev[b], row[a], row[b]);
    }
    prev = row;
  }
  // shoots as ribbons; width profile (twig -> leafy) is applied in the shader
  const planes = crossed ? 2 : 1;
  for (let s = 0; s < shoots; s++) {
    for (let pl = 0; pl < planes; pl++) {
      let pL = -1, pR = -1;
      for (let i = 0; i <= segs; i++) {
        const t = i / segs;
        const l = add(pl, 0, -1, 2 + pl * 0.5, s, t, -1);
        const r = add(pl, 0, 1, 2 + pl * 0.5, s, t, 1);
        if (i > 0) idx.push(pL, pR, l, l, pR, r);
        pL = l; pR = r;
      }
    }
  }
  const g = new THREE.InstancedBufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pos), 3));
  g.setAttribute('aPart', new THREE.BufferAttribute(new Float32Array(part), 1));
  g.setAttribute('aShoot', new THREE.BufferAttribute(new Float32Array(sho), 1));
  g.setAttribute('aT', new THREE.BufferAttribute(new Float32Array(tt), 1));
  g.setAttribute('aSide', new THREE.BufferAttribute(new Float32Array(sd), 1));
  g.setIndex(idx);
  return { geo: g, tris: idx.length / 3, shoots };
}

const GLSL_TREE = /* glsl */`
attribute float aPart;    // 0 trunk, 1 knuckle, 2/2.5 shoot ribbon planes
attribute float aShoot;
attribute float aT;
attribute float aSide;
attribute vec3 iPos;
attribute vec4 iA;        // height, yaw, seed, kind (0 willow, 1 alder)
attribute vec4 iB;        // lean, crown scale, hue, wet
uniform float uShoots;
varying vec3 vWorld; varying vec3 vNormal; varying float vPart; varying float vT;
varying vec4 vIB; varying float vKind; varying float vLeaf;

float h11(float n){ return fract(sin(n*127.1)*43758.5453); }

void treeVertex(float lodFade){
  float H    = iA.x * lodFade;
  float yaw  = iA.y;
  float S    = iA.z;
  float kind = floor(iA.w);           // kind and baked exposure share one slot
  float ex   = fract(iA.w) * 1.111;
  vKind = kind; vPart = aPart; vT = aT; vIB = iB;

  vec3 wv = windAt(iPos.xz, ex);

  float trunkH = (kind < 0.5 ? 0.46 : 0.30) * H;      // pollards are cut low; alders run higher
  float headR  = (kind < 0.5 ? 0.16 : 0.075) * H;
  vec3 p;
  vec3 nrm;

  if (aPart < 1.5){
    // --- trunk and knuckle: lumpy taper, and it barely moves
    float t = aT;
    float taper = mix(1.0, kind < 0.5 ? 0.72 : 0.45, t);
    float knuckle = kind < 0.5 ? (1.0 + 1.35 * smoothstep(0.78, 1.0, t) * (1.0 - smoothstep(1.0, 1.06, t))) : 1.0;
    float lump = 1.0 + 0.16*sin(aSide*3.0 + S*6.3 + t*5.0) + 0.10*sin(aSide*5.0 - S*2.1 + t*11.0);
    float rad = (kind < 0.5 ? 0.105 : 0.055) * H * taper * knuckle * lump;
    p = vec3(position.x * rad, t * trunkH, position.z * rad);
    nrm = normalize(vec3(position.x, 0.25, position.z));
    vLeaf = 0.0;
  } else {
    // --- one shoot: direction, length, droop and presence all from its own hash
    float sh = aShoot;
    float r1 = h11(sh*13.7 + S*3.1), r2 = h11(sh*29.3 + S*1.7);
    float r3 = h11(sh*41.1 + S*2.3), r4 = h11(sh*57.9 + S*5.9);
    float az = (sh / uShoots) * 6.2831853 + (r1 - 0.5) * 1.15;
    // an asymmetric crown with deliberate gaps, not an even fan
    float dens = 0.52 + 0.48 * sin(az * (kind < 0.5 ? 2.0 : 3.0) + S * 6.28);
    float present = step(r4, 0.45 + 0.62 * dens);
    float el = kind < 0.5 ? mix(0.30, 1.30, r2*r2) : mix(0.55, 1.45, r2);
    float len = (kind < 0.5 ? 0.62 : 0.55) * H * iB.y * mix(0.45, 1.30, r3) * present;
    float droop = kind < 0.5 ? mix(0.42, 1.05, r3) : mix(0.08, 0.34, r3);

    vec3 base = vec3(cos(az), 0.0, sin(az)) * headR * 0.85 + vec3(0.0, trunkH * (kind<0.5?1.0:mix(0.45,1.0,r1)), 0.0);
    vec3 dir = vec3(cos(az)*cos(el), sin(el), sin(az)*cos(el));
    float t = aT;
    p = base + dir * len * t;
    p.y -= droop * len * t * t;

    // ribbon width: bare twig at the base, leafy toward the tip
    float leafy = smoothstep(0.22, 0.62, t) * (1.0 - smoothstep(0.94, 1.03, t));
    vLeaf = leafy;
    float w = (0.006 + 0.023 * leafy * iB.y) * H * (kind<0.5?1.0:1.35);
    vec3 axis = normalize(dir);
    vec3 sideV = normalize(cross(axis, vec3(0.0,1.0,0.0) + vec3(0.001)));
    if (aPart > 2.25) sideV = normalize(cross(axis, sideV));      // the crossed plane
    p += sideV * aSide * w;

    // wind: shoots bend slowly along the shoot, fine leaf mass flutters on top
    float bendAmt = wv.z * 0.030 * (0.6 + 0.4*sin(uTime*0.85 + S*4.0 + dot(iPos.xz,uWindDir)*0.05));
    float flutter = wv.z * 0.0075 * leafy * sin(uTime*4.3 + sh*2.1 + S*7.0);
    p += vec3(wv.x, 0.0, wv.y) * (bendAmt * t * t * H * 0.55 + flutter * H);
    p.y -= bendAmt * t * t * H * 0.10;
    nrm = normalize(mix(normalize(vec3(sideV.x, 0.55, sideV.z)), vec3(0.0,1.0,0.0), 0.35));
  }

  // whole-tree lean (pollards lean off the prevailing wind), then yaw
  p.x += iB.x * (p.y / max(H,0.5)) * (p.y / max(H,0.5)) * H * 0.14;
  float cy = cos(yaw), sy = sin(yaw);
  vec3 rp = vec3(p.x*cy - p.z*sy, p.y, p.x*sy + p.z*cy);
  vec3 rn = vec3(nrm.x*cy - nrm.z*sy, nrm.y, nrm.x*sy + nrm.z*cy);
  vWorld = iPos + rp;
  vNormal = rn;
  gl_Position = projectionMatrix * viewMatrix * vec4(vWorld, 1.0);
}
`;

function makeTreeMaterial(shared, shoots, fade, depthOnly) {
  const vs = /* glsl */`
    ${GLSL_HEAD}${GLSL_WIND}${GLSL_TREE}
    uniform vec4 uFade;
    void main(){
      float d = distance(iPos.xz, uCamPos.xz);
      float fade = smoothstep(uFade.x, uFade.y, d) * (1.0 - smoothstep(uFade.z, uFade.w, d));
      if (iA.x <= 0.0) fade = 0.0;
      treeVertex(fade);
    }`;
  const uniforms = withShared(shared, { uShoots: { value: shoots }, uFade: { value: new THREE.Vector4(...fade) } });
  if (depthOnly) {
    return new THREE.ShaderMaterial({
      uniforms, side: THREE.DoubleSide, vertexShader: vs,
      fragmentShader: `precision highp float; varying vec3 vWorld; varying vec3 vNormal; varying float vPart;
        varying float vT; varying vec4 vIB; varying float vKind; varying float vLeaf;
        void main(){ gl_FragColor = vec4(1.0); }`,
    });
  }
  return new THREE.ShaderMaterial({
    uniforms, side: THREE.DoubleSide, vertexShader: vs,
    fragmentShader: /* glsl */`
      ${GLSL_HEAD}${GLSL_SKY}${GLSL_SHADOW}${GLSL_LIGHT}${GLSL_AIR}
      varying vec3 vWorld; varying vec3 vNormal; varying float vPart; varying float vT;
      varying vec4 vIB; varying float vKind; varying float vLeaf;
      void main(){
        vec3 V = vWorld - uCamPos;
        vec3 N = normalize(vNormal);
        if (!gl_FrontFacing) N = -N;
        float bark = 1.0 - vLeaf;
        vec3 barkC = mix(s2l(C_WOOD)*0.55, s2l(C_STONE)*0.62, 0.30 + 0.45*fbm2(vWorld.xz*3.0 + vWorld.y*2.0, 2));
        barkC = mix(barkC, barkC*vec3(0.62,0.68,0.66), vIB.w*0.6);
        // willow leaf: cool grey-green; alder: deeper and warmer
        vec3 leafC = vKind < 0.5 ? mix(s2l(C_REED)*0.85, s2l(C_LICHEN)*0.72, 0.15 + 0.40*vIB.z)
                                 : mix(s2l(C_REED_D), s2l(C_REED), 0.35 + 0.45*vIB.z);
        leafC *= 0.80 + 0.35*fbm2(vWorld.xz*1.7 + vec2(vT*4.0), 2);
        vec3 alb = mix(barkC, leafC, vLeaf);
        float ao = mix(0.62, 1.0, smoothstep(0.1, 0.8, vT)) * mix(0.80, 1.0, vLeaf);
        vec3 col = shade(N, alb, vWorld, ao, 0.48, vLeaf * 0.95);
        gl_FragColor = vec4(applyAir(col, vWorld, normalize(V)), 1.0);
      }`,
  });
}

/* ------------------------------------------------------------------ *
 *  registry + LOD streaming
 * ------------------------------------------------------------------ */
class Trees {
  constructor(fields, plan, shared, q) {
    this.F = fields; this.plan = plan; this.q = q;
    this.group = new THREE.Group();
    this.list = [];
    this._buildRegistry();

    const specs = [
      { name: 'near', tpl: treeTemplate(q.treeNear.shoots, 5, true, 7, 5), cap: q.treeNear.cap, fade: [0, 0.001, q.treeNear.reach - 12, q.treeNear.reach] },
      { name: 'mid', tpl: treeTemplate(q.treeMid.shoots, 3, false, 5, 4), cap: q.treeMid.cap, fade: [q.treeNear.reach - 14, q.treeNear.reach - 2, q.treeMid.reach - 30, q.treeMid.reach] },
      { name: 'far', tpl: treeTemplate(q.treeFar.shoots, 2, false, 4, 3), cap: q.treeFar.cap, fade: [q.treeMid.reach - 34, q.treeMid.reach - 6, q.treeFar.reach - 90, q.treeFar.reach] },
    ];
    this.lods = specs.map((s) => {
      const geo = s.tpl.geo;
      const iPos = new Float32Array(s.cap * 3), iA = new Float32Array(s.cap * 4), iB = new Float32Array(s.cap * 4);
      const aPos = new THREE.InstancedBufferAttribute(iPos, 3), aA = new THREE.InstancedBufferAttribute(iA, 4), aB = new THREE.InstancedBufferAttribute(iB, 4);
      for (const a of [aPos, aA, aB]) a.setUsage(THREE.DynamicDrawUsage);
      geo.setAttribute('iPos', aPos); geo.setAttribute('iA', aA); geo.setAttribute('iB', aB);
      geo.instanceCount = s.cap;
      geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 1e6);
      const mat = makeTreeMaterial(shared, s.tpl.shoots, s.fade, false);
      const mesh = new THREE.Mesh(geo, mat);
      mesh.frustumCulled = false; mesh.matrixAutoUpdate = false;
      this.group.add(mesh);
      const o = { ...s, geo, iPos, iA, iB, aPos, aA, aB, mat, mesh, live: 0, tris: s.tpl.tris };
      if (s.name !== 'far') o.depthMat = makeTreeMaterial(shared, s.tpl.shoots, s.fade, true);
      return o;
    });
    this.lastX = 1e9; this.lastZ = 1e9;
  }

  /** Every tree in the world, placed by rule from the plan — never an authored list. */
  _buildRegistry() {
    const plan = this.plan, F = this.F;
    const R = new Rng(plan.seedU, 'realize:trees');
    const push = (x, z, kind, hBase, tag) => {
      const y = F.marshH(x, z);
      if (F.roadDist(x, z) < CORRIDOR + 1.2) return;
      if (y < -1.35) return;                                    // but not out in the deep channels
      const g = R.gauss(0, 1);
      this.list.push({
        x, z, y: y - 0.08, kind,
        h: hBase * (1 + g * 0.22), yaw: R.f(0, TAU), seed: R.f(0, 40),
        lean: R.f(-0.5, 0.5) + (kind === 0 ? 0.35 : 0.1), crown: R.f(0.72, 1.28),
        hue: R.f(0, 1), wet: sat(smoothstep(-0.4, 0.5, -y)), tag,
        ex: Math.min(0.9, F.exposure(x, z) * 0.9),
      });
    };

    // -- the Drowned Orchard: rows that never become a grid
    const o = plan.landmarks.find((l) => l.kind === 'orchard');
    if (o) {
      const c = Math.cos(o.rot), s = Math.sin(o.rot);
      for (let r = 0; r < o.rows; r++) {
        const rowOff = (r - (o.rows - 1) / 2) * o.rowGap;
        for (let i = 0; i < o.perRow; i++) {
          if (R.u() < o.gapChance) continue;                    // missing trees, as in any old planting
          const along = (i - (o.perRow - 1) / 2) * o.treeGap + R.f(-1, 1) * o.jitter * o.treeGap;
          const drift = R.f(-1, 1) * o.jitter * o.rowGap * 0.7;
          const lx = along, lz = rowOff + drift;
          push(o.x + lx * c - lz * s, o.z + lx * s + lz * c, 0, R.f(4.6, 7.4), 'orchard');
        }
      }
    }
    // -- willow islands and alder stands
    for (const isl of plan.islands) {
      const n = Math.round(clamp(isl.r * isl.dens * 0.34, 3, 30));
      for (let i = 0; i < n; i++) {
        const a = R.f(0, TAU), rr = Math.sqrt(R.u()) * isl.r * 0.86;
        const lx = Math.cos(a) * rr, lz = Math.sin(a) * rr * isl.e;
        const cc = Math.cos(isl.rot), ss = Math.sin(isl.rot);
        const kind = R.bool(0.42) ? 0 : 1;
        push(isl.x + lx * cc - lz * ss, isl.z + lx * ss + lz * cc, kind,
          kind === 0 ? R.f(4.2, 7.0) : R.f(6.0, 10.5), 'island');
      }
    }
    // -- pollards worked along the banks of the Willow Cut and the closing canal
    for (const [poly, every, lat] of [[plan.polys.willow, 26, 17], [plan.polys.post, 30, 15]]) {
      for (let s = 40; s < poly.len - 40; s += every * R.f(0.6, 1.5)) {
        const i = clamp(Math.round((s / poly.len) * (poly.n - 1)), 0, poly.n - 1);
        const side = R.sgn(), off = lat + R.f(-5, 16);
        const nx = -Math.sin(poly.h[i]), nz = Math.cos(poly.h[i]);
        push(poly.x[i] + nx * off * side, poly.z[i] + nz * off * side, 0, R.f(3.8, 6.6), 'canal');
      }
    }
    this.count = this.list.length;
  }

  update(camX, camZ) {
    if (Math.hypot(camX - this.lastX, camZ - this.lastZ) < 3.5) return 0;
    this.lastX = camX; this.lastZ = camZ;
    for (const l of this.lods) l.live = 0;
    const bands = [this.q.treeNear.reach, this.q.treeMid.reach, this.q.treeFar.reach];
    for (const t of this.list) {
      const d = Math.hypot(t.x - camX, t.z - camZ);
      let li = -1;
      // overlap: a tree inside a fade band is written into both levels and cross-fades
      for (let i = 0; i < 3; i++) if (d < bands[i]) { li = i; break; }
      if (li < 0) continue;
      const targets = (li > 0 && d < bands[li - 1] + 16) ? [li - 1, li] : [li];
      for (const k of targets) {
        const L = this.lods[k];
        if (L.live >= L.cap) continue;
        const n = L.live++;
        L.iPos[n * 3] = t.x; L.iPos[n * 3 + 1] = t.y; L.iPos[n * 3 + 2] = t.z;
        L.iA[n * 4] = t.h; L.iA[n * 4 + 1] = t.yaw; L.iA[n * 4 + 2] = t.seed; L.iA[n * 4 + 3] = t.kind + t.ex;
        L.iB[n * 4] = t.lean; L.iB[n * 4 + 1] = t.crown; L.iB[n * 4 + 2] = t.hue; L.iB[n * 4 + 3] = t.wet;
      }
    }
    for (const L of this.lods) {
      for (let n = L.live; n < L.cap; n++) L.iA[n * 4] = 0;
      L.aPos.needsUpdate = true; L.aA.needsUpdate = true; L.aB.needsUpdate = true;
      L.geo.instanceCount = Math.max(1, L.live);
    }
    return 1;
  }
  counts() {
    const o = { registry: this.list.length, triangles: 0 };
    for (const L of this.lods) { o[L.name] = L.live; o.triangles += L.live * L.tris; }
    return o;
  }
  shadowMeshes() { return this.lods.filter((l) => l.depthMat).map((l) => l.mesh); }
  dispose() { for (const L of this.lods) { L.geo.dispose(); L.mat.dispose(); if (L.depthMat) L.depthMat.dispose(); } }
}


/* ==== 65_landmarks.js =================================================== */
/* ==================================================================
 *  BUILT THINGS
 *  Masonry, timber and iron that has been repaired more than once.
 *  Everything is assembled from primitives with per-piece wear, so the
 *  Three Sluices and the Tide Wheel hold up to being ridden right past.
 * ================================================================== */

const MAT_STONE = 0, MAT_TIMBER = 1, MAT_IRON = 2, MAT_EARTH = 3;

class Builder {
  constructor() { this.p = []; this.n = []; this.m = []; this.w = []; this.a = []; this.i = []; this.g = []; }
  _push(v, nv, mat, wear, ao, grain) {
    this.p.push(v.x, v.y, v.z); this.n.push(nv.x, nv.y, nv.z);
    this.m.push(mat); this.w.push(wear); this.a.push(ao); this.g.push(grain);
    return this.p.length / 3 - 1;
  }
  /** axis-aligned box then transformed; ao is per-box, wear per-box */
  box(M, sx, sy, sz, mat, wear, ao, grain = 0) {
    const hx = sx / 2, hy = sy / 2, hz = sz / 2;
    const V = [[-hx, -hy, -hz], [hx, -hy, -hz], [hx, hy, -hz], [-hx, hy, -hz],
    [-hx, -hy, hz], [hx, -hy, hz], [hx, hy, hz], [-hx, hy, hz]];
    const F = [[0, 3, 2, 1, 0, 0, -1], [4, 5, 6, 7, 0, 0, 1], [0, 1, 5, 4, 0, -1, 0],
    [3, 7, 6, 2, 0, 1, 0], [0, 4, 7, 3, -1, 0, 0], [1, 2, 6, 5, 1, 0, 0]];
    const nm = new THREE.Matrix3().setFromMatrix4(M).invert().transpose();
    const tv = new THREE.Vector3(), tn = new THREE.Vector3();
    for (const f of F) {
      const base = [];
      for (let k = 0; k < 4; k++) {
        tv.set(V[f[k]][0], V[f[k]][1], V[f[k]][2]).applyMatrix4(M);
        tn.set(f[4], f[5], f[6]).applyMatrix3(nm).normalize();
        base.push(this._push(tv, tn, mat, wear, k < 2 ? ao * 0.82 : ao, grain));
      }
      this.i.push(base[0], base[1], base[2], base[0], base[2], base[3]);
    }
  }
  /** tube along local +Y */
  cyl(M, r0, r1, h, seg, mat, wear, ao, grain = 0, lump = 0, seed = 0) {
    const nm = new THREE.Matrix3().setFromMatrix4(M).invert().transpose();
    const tv = new THREE.Vector3(), tn = new THREE.Vector3();
    let prev = null;
    for (let k = 0; k <= 1; k++) {
      const row = [], r = k ? r1 : r0, y = k ? h : 0;
      for (let s = 0; s < seg; s++) {
        const a = (s / seg) * TAU;
        const rr = r * (1 + lump * Math.sin(a * 3 + seed) * 0.5 + lump * Math.sin(a * 5 - seed * 2) * 0.3);
        tv.set(Math.cos(a) * rr, y, Math.sin(a) * rr).applyMatrix4(M);
        tn.set(Math.cos(a), 0, Math.sin(a)).applyMatrix3(nm).normalize();
        row.push(this._push(tv, tn, mat, wear, k ? ao : ao * 0.86, grain));
      }
      if (prev) for (let s = 0; s < seg; s++) {
        const t = (s + 1) % seg;
        this.i.push(prev[s], row[s], prev[t], prev[t], row[s], row[t]);
      }
      prev = row;
    }
    // caps
    for (const k of [0, 1]) {
      const r = k ? r1 : r0, y = k ? h : 0;
      tn.set(0, k ? 1 : -1, 0).applyMatrix3(nm).normalize();
      tv.set(0, y, 0).applyMatrix4(M);
      const c = this._push(tv, tn, mat, wear, ao, grain);
      const ring = [];
      for (let s = 0; s < seg; s++) {
        const a = (s / seg) * TAU;
        tv.set(Math.cos(a) * r, y, Math.sin(a) * r).applyMatrix4(M);
        ring.push(this._push(tv, tn, mat, wear, ao, grain));
      }
      for (let s = 0; s < seg; s++) {
        const t = (s + 1) % seg;
        if (k) this.i.push(c, ring[s], ring[t]); else this.i.push(c, ring[t], ring[s]);
      }
    }
  }
  geometry() {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(this.p), 3));
    g.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(this.n), 3));
    g.setAttribute('aMat', new THREE.BufferAttribute(new Float32Array(this.m), 1));
    g.setAttribute('aWear', new THREE.BufferAttribute(new Float32Array(this.w), 1));
    g.setAttribute('aAo', new THREE.BufferAttribute(new Float32Array(this.a), 1));
    g.setAttribute('aGrain', new THREE.BufferAttribute(new Float32Array(this.g), 1));
    g.setIndex(this.i);
    g.computeBoundingSphere();
    return g;
  }
  get tris() { return this.i.length / 3; }
}

const M4 = () => new THREE.Matrix4();
function trs(x, y, z, ry, rx = 0, rz = 0) {
  const m = M4();
  m.compose(new THREE.Vector3(x, y, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz, 'YXZ')), new THREE.Vector3(1, 1, 1));
  return m;
}

function makeStructureMaterial(shared, depthOnly) {
  const vs = /* glsl */`
    ${GLSL_HEAD}${GLSL_WIND}
    attribute float aMat; attribute float aWear; attribute float aAo; attribute float aGrain;
    varying vec3 vWorld; varying vec3 vNormal; varying float vMat; varying float vWear;
    varying float vAo; varying float vGrain;
    void main(){
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorld = wp.xyz;
      vNormal = normalize(mat3(modelMatrix) * normal);
      vMat = aMat; vWear = aWear; vAo = aAo; vGrain = aGrain;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`;
  if (depthOnly) {
    return new THREE.ShaderMaterial({
      uniforms: withShared(shared, {}), vertexShader: vs,
      fragmentShader: `precision highp float; varying vec3 vWorld; varying vec3 vNormal; varying float vMat;
        varying float vWear; varying float vAo; varying float vGrain; void main(){ gl_FragColor = vec4(1.0); }`,
    });
  }
  return new THREE.ShaderMaterial({
    uniforms: withShared(shared, {}), side: THREE.DoubleSide,
    vertexShader: vs,
    fragmentShader: /* glsl */`
      ${GLSL_HEAD}${GLSL_SKY}${GLSL_SHADOW}${GLSL_LIGHT}${GLSL_AIR}
      varying vec3 vWorld; varying vec3 vNormal; varying float vMat; varying float vWear;
      varying float vAo; varying float vGrain;
      void main(){
        vec3 V = vWorld - uCamPos; float dist = length(V);
        vec3 N = normalize(vNormal); if(!gl_FrontFacing) N = -N;
        float grain = 1.0 - smoothstep(30.0, 140.0, dist);
        vec2 wp = vWorld.xz;

        // --- coursed masonry: irregular blocks, recessed mortar, no repeat
        vec3 up = abs(N.y) > 0.7 ? vec3(1.0,0.0,0.0) : vec3(0.0,1.0,0.0);
        vec3 tx = normalize(cross(N, up));
        vec2 muv = vec2(dot(vWorld, tx), vWorld.y);
        float course = floor(muv.y / 0.34);
        float jog = fract(sin(course*17.3)*4371.7);
        float bx = floor((muv.x + jog*0.7) / 0.62);
        float mortar = smoothstep(0.035, 0.075, abs(fract(muv.y/0.34)-0.5)*0.34)
                     * smoothstep(0.035, 0.075, abs(fract((muv.x+jog*0.7)/0.62)-0.5)*0.62);
        float blockV = fract(sin(bx*31.7 + course*11.9)*9731.3);
        // wet estuary masonry: dark, cool, and never the colour of dry sandstone
        vec3 stone = mix(s2l(C_STONE)*0.20, s2l(C_STONE)*0.46, blockV) * vec3(0.90,0.97,1.02);
        stone *= 0.70 + 0.52*mix(0.5, fbm2(vWorld.xz*7.0 + vWorld.y*3.0, 3), grain);
        stone = mix(stone*0.52, stone, mix(1.0, mortar, 0.85));

        // --- timber: grain along the piece, split and silvered where it is dry
        float gr = fbm2(vec2(dot(vWorld, tx)*(2.0+vGrain*22.0), vWorld.y*1.7 + vGrain*3.0), 3);
        vec3 timber = mix(s2l(C_WOOD)*0.55, s2l(C_WOOD)*1.15, gr);
        timber = mix(timber, s2l(C_STONE)*0.72, vWear*0.35);           // silvering
        timber *= 0.86 + 0.28*mix(0.5, fbm2(vWorld.xz*22.0, 2), grain);

        // --- iron: dark, with rust blooming out of the joints
        float rust = smoothstep(0.45, 0.85, fbm2(vWorld.xz*3.4 + vWorld.y*2.2, 3));
        vec3 iron = mix(vec3(0.028,0.030,0.034), s2l(C_COPPER)*0.42, rust*(0.4+0.6*vWear));

        vec3 earth = mix(s2l(C_MUD), s2l(C_OLIVE)*0.6, fbm2(vWorld.xz*1.4,3));

        vec3 alb = vMat < 0.5 ? stone : (vMat < 1.5 ? timber : (vMat < 2.5 ? iron : earth));

        // --- tide marks: the water writes its own history on everything it touches
        float band = smoothstep(uTideY + 0.95, uTideY + 0.10, vWorld.y) * smoothstep(uTideY - 2.0, uTideY - 0.2, vWorld.y);
        float wetLo = smoothstep(uTideY + 0.30, uTideY - 0.45, vWorld.y);
        alb = mix(alb, alb * vec3(0.38,0.44,0.38), band*0.72);
        alb = mix(alb, alb * vec3(0.24,0.29,0.27), wetLo*0.88);

        // --- moss and weed: upward-facing ledges and the damp north of every joint
        float mossN = smoothstep(-0.1, 0.75, N.y) * 0.55 + (1.0-abs(N.y))*0.25;
        float mossMask = smoothstep(0.42, 0.80, fbm2(vWorld.xz*2.1 + vWorld.y*1.3, 3)) * mossN;
        mossMask *= smoothstep(uTideY + 3.6, uTideY + 0.2, vWorld.y) * (0.30 + 0.70*vWear);
        mossMask *= (1.0 - mortar*0.4);
        alb = mix(alb, mix(s2l(C_REED_D), s2l(C_LICHEN)*0.7, 0.30), mossMask*0.82);

        float ao = vAo * (0.72 + 0.28*mortar);
        vec3 col = shade(N, alb, vWorld, ao, 0.30, 0.0);
        vec3 H = normalize(uSunDir - normalize(V));
        float spec = vMat > 1.5 && vMat < 2.5 ? 0.22 : (wetLo*0.28);
        col += uSunCol * pow(max(dot(N,H),0.0), 46.0) * spec * cloudShadow(vWorld.xz);
        gl_FragColor = vec4(applyAir(col, vWorld, normalize(V)), 1.0);
      }`,
  });
}

/* ------------------------------------------------------------------ *
 *  THE THREE SLUICES
 * ------------------------------------------------------------------ */
function buildSluices(lm, F, R) {
  const B = new Builder();
  const y0 = -1.9, deckY = lm.y - 0.30;
  const pierW = lm.pierW, wear = lm.moss;
  const openings = lm.gates;
  // lay the three openings out symmetrically about the road centre
  let totalW = 0; for (const g of openings) totalW += g.w;
  totalW += pierW * (openings.length + 1);
  let cursor = -totalW / 2;
  const piers = [];
  const deckH = lm.deck;
  const wallT = 1.15;

  const put = (lx, ly, lz, sx, sy, sz, mat, w, ao, grain = 0) => {
    B.box(trs(lx, ly, lz, 0), sx, sy, sz, mat, w, ao, grain);
  };
  // upstream + downstream abutment walls with battered faces
  for (const side of [-1, 1]) {
    for (let k = 0; k < 4; k++) {
      const t = k / 3;
      put(0, y0 + (deckY - y0) * (t + 0.125), side * (3.4 + t * 0.55), totalW + 3.2 - t * 0.7,
        (deckY - y0) * 0.25, wallT - t * 0.18, MAT_STONE, wear, 0.86 - t * 0.05);
    }
    // coping course on top
    put(0, deckY + 0.14, side * 3.9, totalW + 3.6, 0.28, 1.05, MAT_STONE, wear * 0.7, 1.0);
  }
  for (let i = 0; i <= openings.length; i++) {
    const w = pierW;
    const cx = cursor + w / 2;
    // pier: battered stone, cutwater on the seaward face
    B.box(trs(cx, (y0 + deckY) / 2, 0), w, deckY - y0, 7.6, MAT_STONE, wear, 0.88);
    B.box(trs(cx, (y0 + deckY) / 2, -4.1), w * 0.86, (deckY - y0) * 0.95, 1.5, MAT_STONE, wear, 0.8);
    B.cyl(trs(cx, y0, -4.6).multiply(M4().makeRotationX(0)), w * 0.42, w * 0.36, deckY - y0, 7, MAT_STONE, wear, 0.82, 0, 0.10, i * 3.1);
    piers.push(cx);
    cursor += w;
    if (i < openings.length) cursor += openings[i].w;
  }
  // deck slab + parapets + coping
  put(0, deckY + deckH / 2, 0, totalW + 3.2, deckH, 8.4, MAT_STONE, wear * 0.8, 0.95);
  for (const side of [-1, 1]) {
    put(0, deckY + deckH + 0.42, side * 3.55, totalW + 3.4, 0.84, 0.42, MAT_STONE, wear * 0.6, 1.0);
    put(0, deckY + deckH + 0.90, side * 3.55, totalW + 3.5, 0.14, 0.56, MAT_STONE, wear * 0.4, 1.0);
  }
  // gates, guides and winding gear
  cursor = -totalW / 2 + pierW;
  for (let i = 0; i < openings.length; i++) {
    const g = openings[i];
    const cx = cursor + g.w / 2;
    const gateMat = g.gate === 'iron' ? MAT_IRON : MAT_TIMBER;
    const sillY = y0 + 0.55;
    const gateH = deckY - sillY - 0.15;
    const lift = g.open * gateH;
    // the leaf itself, built from separate boards with iron straps
    const boards = Math.max(3, Math.round(g.w / 0.42));
    for (let b = 0; b < boards; b++) {
      const bw = g.w / boards;
      const bx = cx - g.w / 2 + bw * (b + 0.5);
      B.box(trs(bx, sillY + lift + gateH / 2, 0), bw * 0.94, gateH, 0.16, gateMat, g.wear, 0.92, 0.5 + b * 0.13);
    }
    for (const fy of [0.22, 0.72]) {
      B.box(trs(cx, sillY + lift + gateH * fy, 0.13), g.w * 1.02, 0.13, 0.06, MAT_IRON, g.wear, 0.95);
      for (let b = 0; b < boards; b++) {
        const bx = cx - g.w / 2 + (g.w / boards) * (b + 0.5);
        B.cyl(trs(bx, sillY + lift + gateH * fy - 0.035, 0.17).multiply(M4().makeRotationX(PI / 2)), 0.035, 0.035, 0.05, 6, MAT_IRON, g.wear, 1.0);
      }
    }
    // vertical guides in the pier faces
    for (const s of [-1, 1]) B.box(trs(cx + s * (g.w / 2 + 0.09), (sillY + deckY) / 2, 0), 0.18, deckY - sillY, 0.34, MAT_IRON, g.wear * 0.8, 0.86);
    // sill
    B.box(trs(cx, sillY - 0.18, 0), g.w + 0.5, 0.36, 3.0, MAT_STONE, wear, 0.8);
    // winding gear on the deck: frame, spindle, handwheel
    const gy = deckY + deckH;
    for (const s of [-1, 1]) B.box(trs(cx + s * 0.34, gy + 0.62, 0), 0.13, 1.24, 0.13, MAT_IRON, g.wear, 0.9);
    B.box(trs(cx, gy + 1.26, 0), 0.95, 0.16, 0.20, MAT_IRON, g.wear, 0.95);
    B.cyl(trs(cx, gy + 0.10, 0), 0.055, 0.055, 1.20, 6, MAT_IRON, g.wear, 0.95);
    B.cyl(trs(cx, gy + 1.42, 0).multiply(M4().makeRotationX(PI / 2)), 0.30, 0.30, 0.07, 12, MAT_IRON, g.wear, 1.0);
    B.cyl(trs(cx, gy + 1.42, 0).multiply(M4().makeRotationX(PI / 2)), 0.055, 0.055, 0.16, 6, MAT_IRON, g.wear, 1.0);
    for (let sp = 0; sp < 5; sp++) {
      const a = (sp / 5) * TAU;
      B.box(trs(cx + Math.cos(a) * 0.15, gy + 1.42 + Math.sin(a) * 0.15, 0), 0.30, 0.045, 0.045, MAT_IRON, g.wear, 1.0);
    }
    cursor += g.w + pierW;
  }
  // maintenance ladder down the end pier
  if (lm.ladder) {
    const lx = piers[piers.length - 1] + pierW * 0.5 + 0.10;
    for (const s of [-1, 1]) B.box(trs(lx, (y0 + deckY) / 2 + 0.2, s * 0.22), 0.07, deckY - y0 - 0.4, 0.07, MAT_IRON, wear, 0.9);
    const rungs = Math.floor((deckY - y0 - 0.6) / 0.32);
    for (let r = 0; r < rungs; r++) B.cyl(trs(lx, y0 + 0.5 + r * 0.32, -0.22).multiply(M4().makeRotationX(PI / 2)), 0.026, 0.026, 0.44, 5, MAT_IRON, wear, 1.0);
  }
  // an old repair: one pier has a newer concrete patch and a steel brace
  B.box(trs(piers[1], y0 + 1.1, 3.9), pierW * 1.1, 1.5, 0.5, MAT_STONE, 0.15, 0.9);
  B.box(trs(piers[1] + 0.6, y0 + 2.2, 3.5).multiply(M4().makeRotationZ(0.5)), 2.4, 0.13, 0.13, MAT_IRON, 0.9, 0.95);
  return { geo: B.geometry(), tris: B.tris, width: totalW };
}

/* ------------------------------------------------------------------ *
 *  THE TIDE WHEEL
 * ------------------------------------------------------------------ */
function buildWheel(lm, R) {
  /* Two bodies: the wheel proper (built about its own hub so it can actually turn)
     and the trestle it turns in. */
  const S = new Builder(), B = new Builder();
  const rad = lm.radius, wid = lm.width, ay = 0, np = lm.paddles, wear = lm.wear;
  const AY = lm.axleY;
  const rimR = rad;
  // two rims, each built from separate felloes with visible joints
  for (const side of [-1, 1]) {
    const zz = side * wid / 2;
    for (let i = 0; i < np; i++) {
      const a0 = (i / np) * TAU, a1 = ((i + 1) / np) * TAU;
      const am = (a0 + a1) / 2;
      const len = 2 * rimR * Math.sin((a1 - a0) / 2) * 1.02;
      const cx = Math.cos(am) * (rimR - 0.21), cy = Math.sin(am) * (rimR - 0.21);
      const m = trs(cx, ay + cy, zz).multiply(M4().makeRotationZ(am + PI / 2));
      S.box(m, 0.30, len, 0.26, MAT_TIMBER, wear * (0.6 + 0.4 * ihashf(i, side, 7)), 0.9, 0.4 + i * 0.07);
      // iron strap over each joint
      const mj = trs(Math.cos(a0) * rimR, ay + Math.sin(a0) * rimR, zz).multiply(M4().makeRotationZ(a0 + PI / 2));
      S.box(mj, 0.40, 0.14, 0.30, MAT_IRON, wear, 0.95);
    }
  }
  // hub
  S.cyl(trs(0, ay, -wid / 2 - 0.6).multiply(M4().makeRotationX(-PI / 2)), 0.44, 0.44, wid + 1.2, 12, MAT_TIMBER, wear * 0.7, 0.9, 0.2);
  // spokes: paired, with wedges at the hub
  const spokes = Math.max(6, Math.round(np / 2));
  for (const side of [-1, 1]) {
    const zz = side * wid / 2;
    for (let i = 0; i < spokes; i++) {
      const a = (i / spokes) * TAU + (side > 0 ? PI / spokes : 0);
      const m = trs(Math.cos(a) * rimR * 0.5, ay + Math.sin(a) * rimR * 0.5, zz).multiply(M4().makeRotationZ(a + PI / 2));
      S.box(m, 0.16, rimR * 1.0, 0.20, MAT_TIMBER, wear * 0.8, 0.88, 0.3 + i * 0.11);
      S.box(trs(Math.cos(a) * 0.55, ay + Math.sin(a) * 0.55, zz).multiply(M4().makeRotationZ(a + PI / 2)), 0.26, 0.34, 0.26, MAT_IRON, wear, 0.92);
    }
  }
  // paddles — individually varied in width, set angle and how much is left of them
  for (let i = 0; i < np; i++) {
    const a = (i / np) * TAU;
    const h1 = ihashf(i, 11, 3), h2 = ihashf(i, 23, 5), h3 = ihashf(i, 41, 9);
    const pw = 0.62 + h1 * 0.26;
    const tilt = (h2 - 0.5) * 0.16;
    const missing = h3 < 0.06 ? 0.35 : 1.0;          // one or two are half gone
    const m = trs(Math.cos(a) * (rimR - 0.18), ay + Math.sin(a) * (rimR - 0.18), 0).multiply(M4().makeRotationZ(a + PI / 2 + tilt));
    S.box(m, 0.09, pw * missing, wid * (0.92 + h1 * 0.06), MAT_TIMBER, 0.5 + h2 * 0.5, 0.88, 0.5 + i * 0.09);
    // the cleat that holds it
    S.box(trs(Math.cos(a) * (rimR - 0.42), ay + Math.sin(a) * (rimR - 0.42), 0).multiply(M4().makeRotationZ(a + PI / 2)), 0.16, 0.24, wid * 0.5, MAT_IRON, wear, 0.9);
  }

  /* --- the trestle, in the landmark's own local space (y measured from its base) --- */
  B.cyl(trs(0, AY, -wid / 2 - 1.5).multiply(M4().makeRotationX(-PI / 2)), 0.17, 0.17, wid + 3.0, 10, MAT_IRON, wear, 0.95);
  if (lm.housing !== 'open') {
    for (const side of [-1, 1]) {
      const zz = side * (wid / 2 + 0.95);
      B.box(trs(0, AY / 2 - 0.4, zz), 0.42, AY + 0.8, 0.42, MAT_TIMBER, wear, 0.88, 0.6);
      B.box(trs(1.55, AY / 2 - 0.4, zz).multiply(M4().makeRotationZ(-0.62)), 0.30, AY * 1.15, 0.30, MAT_TIMBER, wear, 0.86, 0.7);
      B.box(trs(-1.55, AY / 2 - 0.4, zz).multiply(M4().makeRotationZ(0.62)), 0.30, AY * 1.15, 0.30, MAT_TIMBER, wear, 0.86, 0.7);
      B.box(trs(0, AY + 0.30, zz), 0.85, 0.55, 0.70, MAT_TIMBER, wear, 0.92, 0.4);
      B.box(trs(0, AY, zz), 0.55, 0.36, 0.52, MAT_IRON, wear, 0.95);
      B.box(trs(0, -1.5, zz), 1.6, 0.5, 1.6, MAT_STONE, wear, 0.8);
    }
    B.box(trs(0, AY + 0.62, 0), 0.34, 0.30, wid + 2.4, MAT_TIMBER, wear, 0.9, 0.5);
  }
  // ladder to the bearing
  const lx = -(rimR + 0.9);
  for (const s of [-1, 1]) B.box(trs(lx, (AY + 0.4) / 2 - 1.0, wid / 2 + 0.95 + s * 0.20), 0.07, AY + 1.4, 0.07, MAT_TIMBER, wear, 0.9, 0.3);
  for (let r = 0; r < Math.floor((AY + 0.6) / 0.34); r++)
    B.cyl(trs(lx, -1.5 + r * 0.34, wid / 2 + 0.75).multiply(M4().makeRotationX(PI / 2)), 0.025, 0.025, 0.40, 5, MAT_TIMBER, wear, 1.0);
  // the race walls the wheel turns between
  for (const s of [-1, 1]) B.box(trs(0, -1.3, s * (wid / 2 + 1.75)), 7.5, 2.4, 0.7, MAT_STONE, wear, 0.85);
  return { spin: S.geometry(), frame: B.geometry(), tris: S.tris + B.tris, axleY: AY };
}

/* ------------------------------------------------------------------ *
 *  smaller built things
 * ------------------------------------------------------------------ */
function buildCulvert(lm, F) {
  const B = new Builder();
  const y = F.terrainH(lm.x, lm.z), span = lm.span, stone = lm.style === 'timber' ? MAT_TIMBER : MAT_STONE;
  for (const s of [-1, 1]) {
    B.box(trs(0, y - 1.5, s * (span / 2 + 0.45)), 9.5, 2.6, 0.9, stone, lm.wear, 0.86);
    B.box(trs(0, y - 0.28, s * (span / 2 + 0.45)), 9.9, 0.30, 1.15, stone, lm.wear * 0.6, 0.95);
    // splayed wing walls
    for (const e of [-1, 1]) B.box(trs(e * 5.1, y - 1.2, s * (span / 2 + 1.15)).multiply(M4().makeRotationY(e * s * 0.5)), 2.6, 2.0, 0.7, stone, lm.wear, 0.82);
  }
  if (lm.rail) for (const s of [-1, 1]) {
    for (const e of [-1, 1]) B.box(trs(e * 3.6, y + 0.42, s * (span / 2 + 0.45)), 0.14, 1.1, 0.14, MAT_TIMBER, lm.wear, 0.9, 0.4);
    B.box(trs(0, y + 0.86, s * (span / 2 + 0.45)), 7.4, 0.11, 0.13, MAT_TIMBER, lm.wear, 0.95, 0.8);
  }
  return { geo: B.geometry(), tris: B.tris };
}
function buildGauge(lm, F) {
  const B = new Builder();
  const y = F.marshH(lm.x, lm.z);
  B.cyl(trs(0, y - 1.2, 0), 0.15, 0.11, lm.h + 1.2, 8, MAT_TIMBER, lm.wear, 0.9, 0.7, 3.1);
  for (let i = 0; i < Math.floor(lm.h * 2); i++)
    B.box(trs(0.13, y + 0.2 + i * 0.5, 0), 0.06, 0.05, 0.34, MAT_IRON, lm.wear, 1.0);
  B.box(trs(0, y + lm.h + 0.1, 0), 0.55, 0.36, 0.05, MAT_IRON, lm.wear, 1.0);
  for (const s of [-1, 1]) B.box(trs(s * 0.9, y + 0.4, 0).multiply(M4().makeRotationZ(-s * 0.55)), 0.10, 2.4, 0.10, MAT_TIMBER, lm.wear, 0.9, 0.5);
  return { geo: B.geometry(), tris: B.tris };
}
function buildEndGate(lm, F) {
  const B = new Builder();
  const y = F.terrainH(lm.x, lm.z);
  for (const s of [-1, 1]) B.box(trs(0, y + 0.75, s * 2.6), 0.26, 2.1, 0.26, MAT_TIMBER, lm.wear, 0.9, 0.4);
  for (let i = 0; i < 5; i++) B.box(trs(0, y + 0.35 + i * 0.28, 0), 0.07, 0.11, 4.9, MAT_TIMBER, lm.wear, 0.92, 0.6 + i * 0.2);
  B.box(trs(0, y + 0.9, 0).multiply(M4().makeRotationX(0.58)), 0.07, 0.11, 5.4, MAT_TIMBER, lm.wear, 0.9, 1.1);
  B.box(trs(0, y + 0.44, -2.6), 0.16, 0.22, 0.30, MAT_IRON, lm.wear, 0.95);
  // last tide marker on the bank
  B.cyl(trs(3.4, y - 0.4, 1.8), 0.13, 0.10, 2.3, 7, MAT_TIMBER, lm.wear, 0.9, 0.6, 1.7);
  B.box(trs(3.4, y + 1.55, 1.8), 0.42, 0.30, 0.05, MAT_IRON, lm.wear, 1.0);
  return { geo: B.geometry(), tris: B.tris };
}
function buildFurniture(f, F) {
  const B = new Builder();
  const y = F.terrainH(f.x + Math.cos(f.rot + PI / 2) * f.lat * f.side, f.z + Math.sin(f.rot + PI / 2) * f.lat * f.side);
  const m = M4().makeRotationZ(f.lean);
  if (f.kind === 'marker') {
    B.cyl(M4().makeTranslation(0, -0.35, 0).multiply(m), 0.075, 0.065, f.h + 0.35, 6, MAT_TIMBER, 0.8, 0.9, 0.5, 2.2);
    B.box(M4().makeTranslation(0, f.h - 0.06, 0).multiply(m), 0.20, 0.16, 0.04, MAT_IRON, 0.7, 1.0);
  } else if (f.kind === 'tidepost') {
    B.cyl(M4().makeTranslation(0, -0.5, 0).multiply(m), 0.10, 0.085, f.h + 0.9, 7, MAT_TIMBER, 0.9, 0.9, 0.6, 5.1);
    for (let i = 0; i < 3; i++) B.box(M4().makeTranslation(0.085, 0.15 + i * 0.35, 0), 0.045, 0.045, 0.24, MAT_IRON, 0.9, 1.0);
  } else if (f.kind === 'gatepost') {
    B.box(M4().makeTranslation(0, (f.h + 0.4) / 2 - 0.4, 0).multiply(m), 0.22, f.h + 0.4, 0.22, MAT_TIMBER, 0.85, 0.9, 0.4);
    B.box(M4().makeTranslation(0, f.h - 0.12, 0).multiply(m), 0.30, 0.10, 0.30, MAT_TIMBER, 0.6, 1.0, 0.3);
  } else {
    B.cyl(M4().makeTranslation(0, -0.3, 0).multiply(m), 0.062, 0.052, f.h + 0.3, 5, MAT_TIMBER, 0.9, 0.9, 0.7, 7.7);
  }
  const g = B.geometry();
  g.translate(f.x + Math.cos(f.rot + PI / 2) * f.lat * f.side, y, f.z + Math.sin(f.rot + PI / 2) * f.lat * f.side);
  return { geo: g, tris: B.tris };
}

/* ------------------------------------------------------------------ *
 *  registry: builds on demand, keeps only what is near enough to matter
 * ------------------------------------------------------------------ */
class Landmarks {
  constructor(fields, plan, shared, q) {
    this.F = fields; this.plan = plan; this.q = q;
    this.mat = makeStructureMaterial(shared, false);
    this.depthMat = makeStructureMaterial(shared, true);
    this.group = new THREE.Group();
    this.built = new Map();
    this.tris = 0;
    this.wheel = plan.landmarks.find((l) => l.kind === 'wheel');
    this.sluices = plan.landmarks.find((l) => l.kind === 'sluices');
    this.wheelAngle = 0;
    this.items = [];
    for (const l of plan.landmarks) if (l.kind !== 'orchard') this.items.push({ kind: l.kind, id: l.id, x: l.x, z: l.z, lm: l, r: l.kind === 'wheel' ? 900 : l.kind === 'sluices' ? 1100 : l.far ? 800 : 340 });
    for (const f of plan.furniture) this.items.push({ kind: 'furniture', id: 'f' + f.s + f.side, x: f.x, z: f.z, lm: f, r: 190 });
  }
  _make(it) {
    const F = this.F;
    let r, obj;
    if (it.kind === 'sluices') {
      r = buildSluices(it.lm, F, null);
      obj = new THREE.Mesh(r.geo, this.mat);          // built in absolute world height already
      obj.position.set(it.lm.x, 0, it.lm.z); obj.rotation.y = -it.lm.rot;
    } else if (it.kind === 'wheel') {
      r = buildWheel(it.lm, null);
      // sit the wheel so its lowest paddle dips a little under the tide
      const baseY = it.lm.radius - it.lm.axleY - 0.55;
      obj = new THREE.Group();
      obj.position.set(it.lm.x, baseY, it.lm.z); obj.rotation.y = -it.lm.rot;
      const frame = new THREE.Mesh(r.frame, this.mat);
      const spin = new THREE.Mesh(r.spin, this.mat);
      spin.position.y = r.axleY;
      obj.add(frame, spin);
      this.wheelMesh = obj; this.wheelSpin = spin;
      this.wheelHubY = baseY + r.axleY;
    } else if (it.kind === 'culvert') {
      r = buildCulvert(it.lm, F);
      obj = new THREE.Mesh(r.geo, this.mat);
      obj.position.set(it.lm.x, 0, it.lm.z); obj.rotation.y = -it.lm.rot;
    } else if (it.kind === 'gauge') {
      r = buildGauge(it.lm, F); obj = new THREE.Mesh(r.geo, this.mat);
      obj.position.set(it.lm.x, 0, it.lm.z); obj.rotation.y = it.lm.rot;
    } else if (it.kind === 'endgate') {
      r = buildEndGate(it.lm, F); obj = new THREE.Mesh(r.geo, this.mat);
      obj.position.set(it.lm.x, 0, it.lm.z); obj.rotation.y = -it.lm.rot;
    } else {
      r = buildFurniture(it.lm, F); obj = new THREE.Mesh(r.geo, this.mat);
    }
    if (it.kind !== 'wheel') { obj.matrixAutoUpdate = false; obj.updateMatrix(); }
    obj.userData.tris = r.tris;
    return obj;
  }
  update(camX, camZ, budget) {
    let built = 0;
    for (const it of this.items) {
      const d = Math.hypot(it.x - camX, it.z - camZ);
      const has = this.built.has(it.id);
      if (d < it.r && !has) {
        if (built >= budget) continue;
        const o = this._make(it);
        this.group.add(o); this.built.set(it.id, o); this.tris += o.userData.tris; built++;
      } else if (d > it.r * 1.15 && has) {
        const o = this.built.get(it.id);
        this._drop(o); this.tris -= o.userData.tris; this.built.delete(it.id);
        if (o === this.wheelMesh) { this.wheelMesh = null; this.wheelSpin = null; }
      }
    }
    return built;
  }
  /** the wheel turns with the water, slowly */
  animate(dt) {
    if (this.wheel) this.wheelAngle += (this.wheel.rpm * TAU / 60) * dt;
    if (this.wheelSpin) this.wheelSpin.rotation.z = this.wheelAngle;
  }
  _drop(o) {
    this.group.remove(o);
    o.traverse((c) => { if (c.geometry) c.geometry.dispose(); });
  }
  clear() {
    for (const [, o] of this.built) this._drop(o);
    this.built.clear(); this.tris = 0; this.wheelMesh = null; this.wheelSpin = null;
  }
  shadowMeshes() { return [...this.built.values()]; }
  dispose() { this.clear(); this.mat.dispose(); this.depthMat.dispose(); }
}


/* ==== 70_life.js ======================================================== */
/* ==================================================================
 *  AMBIENT LIFE
 *  Pooled, sparse and event-driven. The marsh has to be alive while
 *  nothing is happening — and it has to be genuinely quiet in between,
 *  so nothing here runs on a metronome and nothing snows confetti.
 * ================================================================== */

const K_SWALLOW = 0, K_MARSH = 1, K_DRAGON = 2, K_HARE = 3, K_HERON = 4;

function birdGeometry() {
  // body diamond + two wings; the wings are folded and flapped in the shader
  const p = [], v = [], idx = [];
  const add = (x, y, z, part, side) => { p.push(x, y, z); v.push(part, side); return p.length / 3 - 1; };
  const a = add(0, 0, -1.0, 0, 0), b = add(0.10, 0, 0.35, 0, 0), c = add(-0.10, 0, 0.35, 0, 0), d = add(0, 0.05, 1.05, 0, 0);
  idx.push(a, b, c, b, d, c);
  for (const s of [-1, 1]) {
    const w0 = add(0, 0, -0.15, 1, s), w1 = add(s * 1.0, 0, 0.05, 1, s), w2 = add(s * 0.85, 0, 0.55, 1, s), w3 = add(0, 0, 0.42, 1, s);
    if (s > 0) idx.push(w0, w1, w2, w0, w2, w3); else idx.push(w0, w2, w1, w0, w3, w2);
  }
  const g = new THREE.InstancedBufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(p), 3));
  g.setAttribute('aPV', new THREE.BufferAttribute(new Float32Array(v), 2));
  g.setIndex(idx);
  return g;
}
function quadGeometry() {
  const g = new THREE.InstancedBufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array([-.5, -.5, 0, .5, -.5, 0, .5, .5, 0, -.5, .5, 0]), 3));
  g.setAttribute('aPV', new THREE.BufferAttribute(new Float32Array([0, 0, 1, 0, 1, 1, 0, 1]), 2));
  g.setIndex([0, 1, 2, 0, 2, 3]);
  return g;
}

function makeBirdMaterial(shared) {
  return new THREE.ShaderMaterial({
    uniforms: withShared(shared, {}), side: THREE.DoubleSide, transparent: false,
    vertexShader: /* glsl */`
      ${GLSL_HEAD}
      attribute vec2 aPV; attribute vec3 iPos; attribute vec4 iA; attribute vec4 iB;
      varying float vKind; varying float vShade; varying vec3 vWorld;
      void main(){
        float head = iA.x, ph = iA.y, sc = iA.z; vKind = iA.w;
        float bank = iB.x, rate = iB.y;
        vec3 P = position;
        if (aPV.x > 0.5){
          float f = sin(uTime*rate + ph);
          float bendUp = vKind < 0.5 ? 0.85 : (vKind < 1.5 ? 0.62 : 0.30);
          P.y += f * bendUp * abs(P.x);
          P.x *= 1.0 - 0.16*abs(f);
        }
        P *= sc;
        // bank into the turn, then yaw to heading
        float cb = cos(bank), sb = sin(bank);
        P = vec3(P.x*cb - P.y*sb, P.x*sb + P.y*cb, P.z);
        float ch = cos(head), sh = sin(head);
        vec3 wp = iPos + vec3(P.z*ch - P.x*sh, P.y, P.z*sh + P.x*ch);
        vWorld = wp; vShade = aPV.x;
        gl_Position = projectionMatrix * viewMatrix * vec4(wp, 1.0);
        if (sc <= 0.0) gl_Position = vec4(2.0,2.0,2.0,1.0);
      }`,
    fragmentShader: /* glsl */`
      ${GLSL_HEAD}${GLSL_SKY}${GLSL_AIR}
      varying float vKind; varying float vShade; varying vec3 vWorld;
      void main(){
        vec3 c = vKind < 0.5 ? vec3(0.028,0.032,0.040)                     // swallow: near black
               : vKind < 1.5 ? vec3(0.62,0.63,0.60)                        // marsh bird: white
               : vKind < 2.5 ? vec3(0.055,0.075,0.085)                     // dragonfly
               : vKind < 3.5 ? vec3(0.10,0.085,0.065) : vec3(0.30,0.31,0.30);
        c *= 0.75 + 0.35*vShade;
        gl_FragColor = vec4(applyAir(c, vWorld, normalize(vWorld-uCamPos)), 1.0);
      }`,
  });
}
function makeSpriteMaterial(shared, mode) {
  return new THREE.ShaderMaterial({
    uniforms: withShared(shared, { uMode: { value: mode } }),
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
    blending: THREE.NormalBlending,
    vertexShader: /* glsl */`
      ${GLSL_HEAD}
      attribute vec2 aPV; attribute vec3 iPos; attribute vec4 iA; attribute vec4 iB;
      varying vec2 vUv; varying vec4 vA; varying vec4 vB; varying vec3 vWorld;
      uniform float uMode;
      void main(){
        vUv = aPV; vA = iA; vB = iB;
        vec3 wp;
        if (uMode < 0.5){                       // camera-facing mote
          vec3 f = normalize(uCamPos - iPos);
          vec3 r = normalize(cross(vec3(0.0,1.0,0.0), f));
          vec3 u = cross(f, r);
          wp = iPos + (r*position.x + u*position.y) * iA.x;
        } else if (uMode < 1.5){                // flat ring on the water
          float s = iA.x;
          wp = iPos + vec3(position.x*s, 0.0, position.y*s);
        } else {                                 // tumbling leaf
          float a = iA.y;
          vec3 r = vec3(cos(a), 0.0, sin(a));
          vec3 u = normalize(vec3(sin(a)*0.5, 1.0, -cos(a)*0.5));
          wp = iPos + (r*position.x + u*position.y) * iA.x;
        }
        vWorld = wp;
        gl_Position = projectionMatrix * viewMatrix * vec4(wp, 1.0);
        if (iA.x <= 0.0) gl_Position = vec4(2.0,2.0,2.0,1.0);
      }`,
    fragmentShader: /* glsl */`
      ${GLSL_HEAD}${GLSL_SKY}${GLSL_AIR}
      varying vec2 vUv; varying vec4 vA; varying vec4 vB; varying vec3 vWorld;
      uniform float uMode;
      void main(){
        float alpha; vec3 c;
        if (uMode < 0.5){
          float d = length(vUv - 0.5)*2.0;
          alpha = smoothstep(1.0, 0.25, d) * vB.x;
          c = mix(s2l(C_STRAW), s2l(C_SKYPALE), vB.y);
        } else if (uMode < 1.5){
          float d = length(vUv - 0.5)*2.0;
          alpha = smoothstep(0.55, 0.86, d) * (1.0 - smoothstep(0.94, 1.0, d)) * vB.x;
          c = s2l(C_SKYPALE);
        } else {
          float d = length((vUv - 0.5)*vec2(1.0,2.0))*2.0;
          alpha = smoothstep(1.0, 0.6, d) * vB.x;
          c = mix(s2l(C_LICHEN), s2l(C_STRAW), vB.y);
        }
        if (alpha < 0.01) discard;
        gl_FragColor = vec4(applyAir(c, vWorld, normalize(vWorld-uCamPos)), alpha);
      }`,
  });
}

class Pool {
  constructor(geo, mat, cap, group) {
    this.cap = cap;
    this.iPos = new Float32Array(cap * 3); this.iA = new Float32Array(cap * 4); this.iB = new Float32Array(cap * 4);
    this.aPos = new THREE.InstancedBufferAttribute(this.iPos, 3);
    this.aA = new THREE.InstancedBufferAttribute(this.iA, 4);
    this.aB = new THREE.InstancedBufferAttribute(this.iB, 4);
    for (const a of [this.aPos, this.aA, this.aB]) a.setUsage(THREE.DynamicDrawUsage);
    geo.setAttribute('iPos', this.aPos); geo.setAttribute('iA', this.aA); geo.setAttribute('iB', this.aB);
    geo.instanceCount = cap;
    geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 1e6);
    this.mesh = new THREE.Mesh(geo, mat);
    this.mesh.frustumCulled = false; this.mesh.matrixAutoUpdate = false;
    group.add(this.mesh);
    this.items = [];
    for (let i = 0; i < cap; i++) this.items.push({ live: false, i });
  }
  spawn() { for (const it of this.items) if (!it.live) { it.live = true; return it; } return null; }
  kill(it) { it.live = false; this.iA[it.i * 4] = 0; }
  flush() { this.aPos.needsUpdate = true; this.aA.needsUpdate = true; this.aB.needsUpdate = true; }
  count() { let n = 0; for (const it of this.items) if (it.live) n++; return n; }
  clear() { for (const it of this.items) { it.live = false; } this.iA.fill(0); this.flush(); }
}

class Life {
  constructor(fields, plan, shared, q) {
    this.F = fields; this.plan = plan; this.q = q;
    this.group = new THREE.Group();
    this.birds = new Pool(birdGeometry(), makeBirdMaterial(shared), q.birds, this.group);
    this.motes = new Pool(quadGeometry(), makeSpriteMaterial(shared, 0), q.motes, this.group);
    this.rings = new Pool(quadGeometry(), makeSpriteMaterial(shared, 1), 12, this.group);
    this.leaves = new Pool(quadGeometry(), makeSpriteMaterial(shared, 2), q.leaves, this.group);
    this.rng = new Rng(plan.seedU, 'realize:life');
    this.nextLift = 0; this.frogIdx = 0; this.liftIdx = 0;
    this.encIdx = 0; this.active = [];
    this.events = [];                 // recent notable events, for audio + proof
    this.shadowBlob = new THREE.Vector4(0, 0, 0, 0);
    this.stats = { birds: 0, motes: 0, rings: 0, leaves: 0, encounters: 0 };
  }
  reset() {
    for (const p of [this.birds, this.motes, this.rings, this.leaves]) p.clear();
    this.liftIdx = 0; this.frogIdx = 0; this.encIdx = 0; this.active.length = 0;
    this.events.length = 0; this.shadowBlob.set(0, 0, 0, 0);
    this.rng = new Rng(this.plan.seedU, 'realize:life');
  }

  _spawnBird(kind, x, y, z, head, speed) {
    const it = this.birds.spawn(); if (!it) return null;
    it.kind = kind; it.x = x; it.y = y; it.z = z; it.head = head; it.speed = speed;
    it.bank = 0; it.ph = this.rng.f(0, TAU); it.t = 0;
    it.life = kind === K_SWALLOW ? this.rng.f(14, 34) : kind === K_DRAGON ? this.rng.f(9, 22) : this.rng.f(16, 40);
    it.turn = this.rng.f(-0.5, 0.5); it.climb = 0;
    it.sc = kind === K_SWALLOW ? 0.20 : kind === K_MARSH ? 0.42 : kind === K_DRAGON ? 0.075 : kind === K_HERON ? 0.72 : 0.24;
    return it;
  }

  /** one lift: a group leaves the ground because something arrived, not because a timer fired */
  lift(kind, x, z, n, awayFrom) {
    const F = this.F;
    for (let i = 0; i < n; i++) {
      const a = this.rng.f(0, TAU), r = this.rng.f(2, 22);
      const px = x + Math.cos(a) * r, pz = z + Math.sin(a) * r;
      const head = awayFrom !== undefined ? awayFrom + this.rng.f(-0.7, 0.7) : this.rng.f(0, TAU);
      const b = this._spawnBird(kind, px, F.marshH(px, pz) + 0.35, pz, head, kind === K_MARSH ? 7.5 : 11);
      if (b) { b.climb = this.rng.f(1.4, 3.2); b.t = -this.rng.f(0, 0.5); }
    }
    this.events.push({ kind: 'lift:' + kind, t: performance.now() });
    if (this.events.length > 24) this.events.shift();
  }

  update(dt, rider, wind, camX, camZ) {
    const F = this.F, plan = this.plan, W = wind;
    const s = rider.s;

    /* -------- scheduled lifts -------- */
    while (this.liftIdx < plan.wildlife.lifts.length && s >= plan.wildlife.lifts[this.liftIdx].s) {
      const L = plan.wildlife.lifts[this.liftIdx++];
      const ahead = 34 + this.rng.f(0, 26);
      const x = rider.x + Math.cos(rider.head) * ahead, z = rider.z + Math.sin(rider.head) * ahead;
      const side = this.rng.sgn() * this.rng.f(8, 30);
      this.lift(L.kind === 'swallow' ? K_SWALLOW : K_MARSH,
        x + Math.cos(rider.head + PI / 2) * side, z + Math.sin(rider.head + PI / 2) * side, L.n, rider.head + this.rng.f(-1.6, 1.6));
    }
    /* -------- frogs: a plop and a ring, no animal shown -------- */
    while (this.frogIdx < plan.wildlife.frogs.length && s >= plan.wildlife.frogs[this.frogIdx].s) {
      const f = plan.wildlife.frogs[this.frogIdx++];
      for (let i = 0; i < f.n; i++) {
        const a = this.rng.f(0, TAU), r = this.rng.f(10, 40);
        const x = rider.x + Math.cos(a) * r, z = rider.z + Math.sin(a) * r;
        if (F.marshH(x, z) < -0.12) this.ripple(x, z, 0.6);
      }
      this.events.push({ kind: 'frog', t: performance.now() });
    }
    /* -------- a front landing puts the marsh up: birds leave because something arrived */
    if (W.justArrived > 0.55) {
      const ahead = 26 + this.rng.f(0, 44);
      const lat = this.rng.sgn() * this.rng.f(10, 44);
      this.lift(this.rng.u() < 0.55 ? K_MARSH : K_SWALLOW,
        rider.x + Math.cos(rider.head) * ahead + Math.cos(rider.head + PI / 2) * lat,
        rider.z + Math.sin(rider.head) * ahead + Math.sin(rider.head + PI / 2) * lat,
        this.rng.i(3, 8), W.dirAngle + PI);
    }

    /* -------- rare encounters (arm-tagged ones only happen on their own arm) -------- */
    while (this.encIdx < plan.encounters.length && s >= plan.encounters[this.encIdx].s) {
      const e = plan.encounters[this.encIdx++];
      if (!e.arm || e.arm === rider.arm) this._beginEncounter(e, rider);
    }

    /* -------- ambient population, gated by habitat and quiet intervals -------- */
    const ex = F.exposure(camX, camZ);
    const wantSwallow = Math.round(this.q.birds * 0.22 * plan.wildlife.swallow.base * ex);
    const wantDragon = Math.round(this.q.birds * 0.30 * plan.wildlife.dragonfly.base * (1 - ex * 0.7));
    let nS = 0, nD = 0;
    for (const it of this.birds.items) if (it.live) { if (it.kind === K_SWALLOW) nS++; else if (it.kind === K_DRAGON) nD++; }
    if (nS < wantSwallow && this.rng.u() < dt * 0.7) {
      const a = this.rng.f(0, TAU), r = this.rng.f(40, 130);
      const x = camX + Math.cos(a) * r, z = camZ + Math.sin(a) * r;
      if (F.marshH(x, z) < 0.25) this._spawnBird(K_SWALLOW, x, 1.6 + this.rng.f(0, 5), z, this.rng.f(0, TAU), this.rng.f(9, 15));
    }
    if (nD < wantDragon && this.rng.u() < dt * 1.1) {
      const a = this.rng.f(0, TAU), r = this.rng.f(6, 26);
      const x = camX + Math.cos(a) * r, z = camZ + Math.sin(a) * r;
      if (F.marshH(x, z) < 0.1 && F.roadDist(x, z) > CORRIDOR) this._spawnBird(K_DRAGON, x, 0.45 + this.rng.f(0, 0.9), z, this.rng.f(0, TAU), this.rng.f(1.2, 3.4));
    }

    /* -------- flight -------- */
    const B = this.birds;
    for (const it of B.items) {
      if (!it.live) continue;
      it.t += dt; it.life -= dt;
      const d = Math.hypot(it.x - camX, it.z - camZ);
      if (it.life <= 0 || d > 420) { B.kill(it); continue; }
      const w = W.at(it.x, it.z, F);
      if (it.kind === K_HARE) {
        it.head += Math.sin(it.t * 0.7 + it.ph) * dt * 0.4;
        if (this.rng.u() < dt * 0.25) { it.x += Math.cos(it.head) * 1.6; it.z += Math.sin(it.head) * 1.6; it.y = F.marshH(it.x, it.z) + 0.16; }
      } else {
        // wander, plus a real push from the wind
        const wob = Math.sin(it.t * (it.kind === K_DRAGON ? 3.1 : 0.62) + it.ph);
        it.turn = approach(it.turn, wob * (it.kind === K_DRAGON ? 2.4 : 0.65), 1.4, dt);
        it.head += it.turn * dt;
        it.bank = approach(it.bank, -it.turn * 0.65, 4.0, dt);
        const drift = (w.speed / Math.max(1, W.base)) * 0.55;
        it.x += (Math.cos(it.head) * it.speed + Math.cos(w.angle) * drift) * dt;
        it.z += (Math.sin(it.head) * it.speed + Math.sin(w.angle) * drift) * dt;
        const ground = F.marshH(it.x, it.z);
        const cruise = it.kind === K_SWALLOW ? 2.2 + 3.0 * (0.5 + 0.5 * Math.sin(it.t * 0.5 + it.ph))
          : it.kind === K_DRAGON ? 0.55 : it.kind === K_HERON ? 6.5 : 4.5;
        if (it.climb > 0) { it.y += it.climb * dt; it.climb -= dt * 0.9; }
        else it.y = approach(it.y, Math.max(ground, 0) + cruise, 0.8, dt);
      }
      const o3 = it.i * 3, o4 = it.i * 4;
      B.iPos[o3] = it.x; B.iPos[o3 + 1] = it.y; B.iPos[o3 + 2] = it.z;
      B.iA[o4] = -it.head + PI / 2; B.iA[o4 + 1] = it.ph; B.iA[o4 + 2] = it.sc; B.iA[o4 + 3] = it.kind;
      B.iB[o4] = it.bank; B.iB[o4 + 1] = it.kind === K_SWALLOW ? 13 : it.kind === K_DRAGON ? 42 : 5.2;
    }
    B.flush();

    /* -------- drifting motes: sparse, and only where the habitat suggests them -------- */
    const M = this.motes;
    const wantM = Math.round(this.q.motes * 0.45 * plan.wildlife.drift.base * (0.35 + 0.65 * sat(W.raw(camX, camZ).gust)));
    let nM = 0; for (const it of M.items) if (it.live) nM++;
    if (nM < wantM && this.rng.u() < dt * 8) {
      const it = M.spawn();
      if (it) {
        const a = this.rng.f(0, TAU), r = this.rng.f(3, 34);
        it.x = camX + Math.cos(a) * r; it.z = camZ + Math.sin(a) * r;
        it.y = F.marshH(it.x, it.z) + this.rng.f(0.3, 2.6);
        it.life = this.rng.f(4, 12); it.sc = this.rng.f(0.020, 0.075);
        it.sail = 0; it.tone = this.rng.u();
      }
    }
    for (const it of M.items) {
      if (!it.live) continue;
      it.life -= dt;
      const w = W.at(it.x, it.z, F);
      const sp = w.speed * (it.sail ? -0.30 : 0.42);
      it.x += Math.cos(w.angle) * sp * dt; it.z += Math.sin(w.angle) * sp * dt;
      it.y += Math.sin(it.life * 2.1) * 0.28 * dt - 0.05 * dt;
      const d = Math.hypot(it.x - camX, it.z - camZ);
      if (it.life <= 0 || d > 80) { M.kill(it); continue; }
      const o3 = it.i * 3, o4 = it.i * 4;
      M.iPos[o3] = it.x; M.iPos[o3 + 1] = it.y; M.iPos[o3 + 2] = it.z;
      M.iA[o4] = it.sc * (it.sail ? 5.5 : 1); M.iB[o4] = sat(it.life * 0.5) * 0.75; M.iB[o4 + 1] = it.tone;
    }
    M.flush();

    /* -------- rings and leaves -------- */
    const Rg = this.rings;
    for (const it of Rg.items) {
      if (!it.live) continue;
      it.t += dt; if (it.t > it.dur) { Rg.kill(it); continue; }
      const u = it.t / it.dur;
      const o3 = it.i * 3, o4 = it.i * 4;
      Rg.iPos[o3] = it.x; Rg.iPos[o3 + 1] = 0.015; Rg.iPos[o3 + 2] = it.z;
      Rg.iA[o4] = it.r0 + u * it.grow; Rg.iB[o4] = (1 - u) * 0.6;
    }
    Rg.flush();
    const Lv = this.leaves;
    if (this.rng.u() < dt * 0.18 * plan.wildlife.drift.base) this._releaseLeaf(camX, camZ, W);
    for (const it of Lv.items) {
      if (!it.live) continue;
      it.life -= dt;
      const w = W.at(it.x, it.z, F);
      it.x += Math.cos(w.angle) * w.speed * 0.5 * dt; it.z += Math.sin(w.angle) * w.speed * 0.5 * dt;
      it.y -= 0.55 * dt; it.a += dt * 2.4;
      const ground = F.marshH(it.x, it.z);
      if (it.life <= 0 || it.y < ground) { Lv.kill(it); continue; }
      const o3 = it.i * 3, o4 = it.i * 4;
      Lv.iPos[o3] = it.x; Lv.iPos[o3 + 1] = it.y; Lv.iPos[o3 + 2] = it.z;
      Lv.iA[o4] = it.sc; Lv.iA[o4 + 1] = it.a; Lv.iB[o4] = sat(it.life * 0.6) * 0.9; Lv.iB[o4 + 1] = it.tone;
    }
    Lv.flush();

    /* -------- active encounters -------- */
    for (let i = this.active.length - 1; i >= 0; i--) {
      const e = this.active[i];
      e.t += dt;
      if (e.kind === 'long-shadow') {
        const w = W.at(camX, camZ, F);
        e.x += Math.cos(w.angle + 0.6) * 9 * dt; e.z += Math.sin(w.angle + 0.6) * 9 * dt;
        this.shadowBlob.set(e.x, e.z, 26 + 8 * Math.sin(e.t), sat(1 - Math.abs(e.t / e.dur * 2 - 1)) * 0.55);
      } else if (e.kind === 'otter-wake') {
        e.x += Math.cos(e.head) * 2.4 * dt; e.z += Math.sin(e.head) * 2.4 * dt;
        if (e.t - e.last > 0.32) { e.last = e.t; this.ripple(e.x, e.z, 0.35, 2.6, 3.0); }
      }
      if (e.t > e.dur) {
        if (e.kind === 'long-shadow') this.shadowBlob.set(0, 0, 0, 0);
        this.active.splice(i, 1);
      }
    }

    this.stats.birds = B.count(); this.stats.motes = M.count();
    this.stats.rings = Rg.count(); this.stats.leaves = Lv.count();
    this.stats.encounters = this.encIdx;
  }

  ripple(x, z, r0, grow = 2.2, dur = 2.4) {
    const it = this.rings.spawn(); if (!it) return;
    it.x = x; it.z = z; it.r0 = r0; it.grow = grow; it.dur = dur; it.t = 0;
  }
  _releaseLeaf(camX, camZ, W) {
    const it = this.leaves.spawn(); if (!it) return;
    const a = this.rng.f(0, TAU), r = this.rng.f(8, 40);
    it.x = camX + Math.cos(a) * r; it.z = camZ + Math.sin(a) * r;
    it.y = this.F.marshH(it.x, it.z) + this.rng.f(2.5, 5.5);
    it.sc = this.rng.f(0.10, 0.22); it.a = this.rng.f(0, TAU);
    it.life = this.rng.f(5, 11); it.tone = this.rng.u();
  }
  _beginEncounter(enc, rider) {
    const F = this.F;
    const ahead = 46, x = rider.x + Math.cos(rider.head) * ahead, z = rider.z + Math.sin(rider.head) * ahead;
    const lx = x + Math.cos(rider.head + PI / 2) * 22 * enc.side, lz = z + Math.sin(rider.head + PI / 2) * 22 * enc.side;
    const e = { kind: enc.kind, t: 0, dur: 12, x: lx, z: lz, head: rider.head + PI / 2 * enc.side, last: 0 };
    switch (enc.kind) {
      case 'heron-lift': {
        const b = this._spawnBird(K_HERON, lx, F.marshH(lx, lz) + 0.5, lz, rider.head + this.rng.f(-1.2, 1.2) + PI * 0.5, 6.5);
        if (b) { b.climb = 2.4; b.life = 26; }
        e.dur = 2; break;
      }
      case 'two-hares': {
        const fx = rider.x + Math.cos(rider.head) * 120 + Math.cos(rider.head + PI / 2) * 150 * enc.side;
        const fz = rider.z + Math.sin(rider.head) * 120 + Math.sin(rider.head + PI / 2) * 150 * enc.side;
        for (let i = 0; i < 2; i++) {
          const b = this._spawnBird(K_HARE, fx + i * 2.4, F.marshH(fx, fz) + 0.16, fz + i * 1.1, this.rng.f(0, TAU), 0);
          if (b) b.life = 40;
        }
        e.dur = 40; break;
      }
      case 'otter-wake': e.dur = 9; break;
      case 'seed-sails': {
        for (let i = 0; i < 6; i++) {
          const it = this.motes.spawn(); if (!it) break;
          it.x = lx + this.rng.f(-14, 14); it.z = lz + this.rng.f(-14, 14);
          it.y = F.marshH(it.x, it.z) + this.rng.f(1.2, 3.5);
          it.life = this.rng.f(9, 15); it.sc = this.rng.f(0.05, 0.09); it.sail = 1; it.tone = 0.85;
        }
        e.dur = 14; break;
      }
      case 'long-shadow': e.dur = 11; e.x = rider.x + Math.cos(rider.head) * 90; e.z = rider.z + Math.sin(rider.head) * 90; break;
      case 'gate-moves': e.dur = 6; break;
    }
    this.active.push(e);
    this.events.push({ kind: 'encounter:' + enc.kind, t: performance.now(), strange: enc.strange });
  }
  counts() { return { ...this.stats }; }
  dispose() {
    for (const p of [this.birds, this.motes, this.rings, this.leaves]) { p.mesh.geometry.dispose(); p.mesh.material.dispose(); }
  }
}


/* ==== 75_audio.js ======================================================= */
/* ==================================================================
 *  SOUND
 *  Entirely synthesised — no recordings, no files. Multi-band reed wind
 *  that answers the same gust the reeds are answering, water against
 *  stone, faster water at the gates, insects, sparse marsh birds, the
 *  wheel's timber groan, and a two-note accident where wind crosses the
 *  sluice pipes.
 * ================================================================== */
let SHARED_CTX = null;

class Audio {
  constructor(plan) {
    this.plan = plan; this.ok = false; this.nodes = []; this.started = false;
    this.t = 0; this.nextInsect = 0; this.nextBird = 0; this.nextCreak = 0;
    this.gain = 0;
  }
  _n(node) { this.nodes.push(node); return node; }

  start() {
    if (this.started) return this.ok;
    this.started = true;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      if (!SHARED_CTX || SHARED_CTX.state === 'closed') SHARED_CTX = new AC();
      const ctx = this.ctx = SHARED_CTX;
      if (ctx.state === 'suspended') ctx.resume();

      // one pink-ish noise bed, reused by every band
      const len = Math.floor(ctx.sampleRate * 3);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = buf.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0;
      const R = new Rng(this.plan.seedU, 'audio:noise');
      for (let i = 0; i < len; i++) {
        const w = R.f(-1, 1);
        b0 = 0.99765 * b0 + w * 0.0990460; b1 = 0.96300 * b1 + w * 0.2965164; b2 = 0.57000 * b2 + w * 1.0526913;
        d[i] = (b0 + b1 + b2 + w * 0.1848) * 0.16;
      }
      this.noiseBuf = buf;

      this.master = this._n(ctx.createGain()); this.master.gain.value = 0;
      const comp = this._n(ctx.createDynamicsCompressor());
      comp.threshold.value = -18; comp.ratio.value = 4;
      this.master.connect(comp); comp.connect(ctx.destination);

      const src = () => { const s = this._n(ctx.createBufferSource()); s.buffer = buf; s.loop = true; s.start(); return s; };

      // --- reed wind in three bands: body, hiss, and the fine rasp of seed heads
      this.wind = this.plan.sound.reedBands.map((f, i) => {
        const s = src(), bp = this._n(this.ctx.createBiquadFilter()), g = this._n(ctx.createGain());
        bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = 0.8 + i * 0.7;
        g.gain.value = 0;
        s.connect(bp); bp.connect(g); g.connect(this.master);
        return { g, bp, base: [0.34, 0.22, 0.12][i] };
      });
      // low pressure under everything
      {
        const s = src(), lp = this._n(ctx.createBiquadFilter()), g = this._n(ctx.createGain());
        lp.type = 'lowpass'; lp.frequency.value = 150; g.gain.value = 0.0;
        s.connect(lp); lp.connect(g); g.connect(this.master);
        this.rumble = g;
      }
      // --- water against stone
      {
        const s = src(), lp = this._n(ctx.createBiquadFilter()), g = this._n(ctx.createGain());
        lp.type = 'lowpass'; lp.frequency.value = 900; lp.Q.value = 0.6; g.gain.value = 0;
        s.connect(lp); lp.connect(g); g.connect(this.master);
        this.water = { g, lp };
      }
      // --- the gates: faster, brighter, with a resonance from the opening
      {
        const s = src(), bp = this._n(ctx.createBiquadFilter()), g = this._n(ctx.createGain());
        bp.type = 'bandpass'; bp.frequency.value = 1500; bp.Q.value = 1.4; g.gain.value = 0;
        s.connect(bp); bp.connect(g); g.connect(this.master);
        this.sluice = { g, bp };
      }
      // --- the two-note pipe tone: physics that accidentally became music
      this.pipes = this.plan.sound.sluiceTone.map((f, i) => {
        const o = this._n(ctx.createOscillator()), g = this._n(ctx.createGain());
        o.type = 'sine'; o.frequency.value = f; g.gain.value = 0;
        o.connect(g); g.connect(this.master); o.start();
        // a breath of noise riding with each note
        const s = src(), bp = this._n(ctx.createBiquadFilter()), bg = this._n(ctx.createGain());
        bp.type = 'bandpass'; bp.frequency.value = f * 2; bp.Q.value = 9; bg.gain.value = 0;
        s.connect(bp); bp.connect(bg); bg.connect(this.master);
        return { o, g, bg, f };
      });
      // --- the wheel: low timber groan plus structure resonance
      {
        const o = this._n(ctx.createOscillator()), g = this._n(ctx.createGain()), lp = this._n(ctx.createBiquadFilter());
        o.type = 'sawtooth'; o.frequency.value = this.plan.sound.wheelGroan;
        lp.type = 'lowpass'; lp.frequency.value = 260; g.gain.value = 0;
        o.connect(lp); lp.connect(g); g.connect(this.master); o.start();
        const o2 = this._n(ctx.createOscillator()), g2 = this._n(ctx.createGain());
        o2.type = 'sine'; o2.frequency.value = this.plan.sound.wheelGroan * 2.51; g2.gain.value = 0;
        o2.connect(g2); g2.connect(this.master); o2.start();
        this.wheel = { g, g2, o, lp };

      this.ok = true;
      this.master.gain.setTargetAtTime(0.85, ctx.currentTime, 2.2);

    } catch (e) { this.ok = false; return false; }
  }

  /** one-shot voices */
  _blip(freq, dur, type, vol, bend) {
    if (!this.ok) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    if (bend) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq * bend), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.15);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.05);
  }
  _burst(freq, q, dur, vol) {
    if (!this.ok) return;
    const ctx = this.ctx, t = ctx.currentTime;

    s.loop = true; s.playbackRate.value = 0.7 + Math.random() * 0.6;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = q;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.2);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(bp); bp.connect(g); g.connect(this.master);
    s.start(t); s.stop(t + dur + 0.05);
  }
  event(kind) {
    if (!this.ok) return;
    if (kind.startsWith('lift:1') || kind === 'heron') { this._burst(900, 2, 0.5, 0.12); this._blip(760, 0.35, 'sine', 0.06, 0.7); }
    else if (kind.startsWith('lift:')) this._burst(2400, 3, 0.28, 0.07);
    else if (kind === 'frog') this._blip(150 + Math.random() * 90, 0.16, 'triangle', 0.10, 0.55);
    else if (kind === 'gust') this._burst(520, 0.7, 1.8, 0.10);
  }

  /** state: {wind, gust, exposure, waterNear, sluiceD, wheelD, speed, chapter, still} */
  update(dt, st) {
    if (!this.ok) return;
    this.t += dt;
    // parameter automation runs at ~30 Hz however finely the world is stepped
    this._acc = (this._acc || 0) + dt;
    if (this._acc < 0.033) return;
    dt = this._acc; this._acc = 0;
    const ctx = this.ctx, T = ctx.currentTime;
    const set = (p, v, tau) => p.setTargetAtTime(Math.max(0.0001, v), T, tau);

    const w = clamp(st.wind / 7, 0, 1.6);
    const shel = 0.25 + 0.75 * st.exposure;
    // exposed wind is broad and hissing; sheltered wind is body only
    set(this.wind[0].g.gain, this.wind[0].base * w * (0.55 + 0.45 * shel), 0.22);
    set(this.wind[1].g.gain, this.wind[1].base * Math.pow(w, 1.4) * shel, 0.18);
    set(this.wind[2].g.gain, this.wind[2].base * Math.pow(w, 1.9) * shel * (0.4 + 0.6 * st.exposure), 0.14);
    this.wind[1].bp.frequency.setTargetAtTime(this.plan.sound.reedBands[1] * (0.85 + 0.4 * w), T, 0.3);
    set(this.rumble.gain, 0.10 * Math.pow(w, 1.6) + st.speed * 0.004, 0.4);

    set(this.water.g.gain, 0.16 * st.waterNear * (0.5 + 0.5 * w), 0.5);
    this.water.lp.frequency.setTargetAtTime(500 + 700 * w, T, 0.6);

    const sl = sat(1 - st.sluiceD / 130);
    set(this.sluice.g.gain, 0.30 * sl * sl, 0.35);

    // the pipes only speak when the wind is actually crossing the openings
    const voice = sl * smoothstep(2.4, 5.5, st.wind);
    const alt = 0.5 + 0.5 * Math.sin(this.t * 0.21);
    set(this.pipes[0].g.gain, 0.055 * voice * (0.35 + 0.65 * alt), 0.9);
    set(this.pipes[1].g.gain, 0.045 * voice * (0.35 + 0.65 * (1 - alt)), 1.1);
    set(this.pipes[0].bg.gain, 0.020 * voice, 0.7);
    set(this.pipes[1].bg.gain, 0.016 * voice, 0.7);

    const wd = sat(1 - st.wheelD / 110);
    set(this.wheel.g.gain, 0.075 * wd * (0.55 + 0.45 * Math.sin(this.t * 0.7)), 0.5);
    set(this.wheel.g2.gain, 0.020 * wd * (0.5 + 0.5 * Math.sin(this.t * 0.31 + 1.1)), 0.7);
    this.wheel.o.frequency.setTargetAtTime(this.plan.sound.wheelGroan * (0.96 + 0.08 * Math.sin(this.t * 0.43)), T, 0.8);
    if (wd > 0.25 && this.t > this.nextCreak) {
      this.nextCreak = this.t + 1.4 + Math.random() * 2.6;
      this._burst(230 + Math.random() * 180, 6, 0.28, 0.05 * wd);
    }
    // insects and birds: sparse, and quieter when the wind is up
    if (this.t > this.nextInsect) {
      this.nextInsect = this.t + 0.9 + Math.random() * 4.5 / Math.max(0.2, 1 - st.exposure * 0.5);
      if (Math.random() < 0.75 - w * 0.35) this._burst(3200 + Math.random() * 2600, 14, 0.10 + Math.random() * 0.3, 0.020 * (1 - st.exposure * 0.4));
    }
    if (this.t > this.nextBird) {
      this.nextBird = this.t + 4 + Math.random() * 16;
      if (Math.random() < 0.6) this._blip(1400 + Math.random() * 1800, 0.10 + Math.random() * 0.12, 'sine', 0.035, 1.6);
    }
  }
  setMaster(v) { if (this.ok) this.master.gain.setTargetAtTime(v, this.ctx.currentTime, 0.3); }
  stop() {
    if (!this.ok) return;
    try {
      this.master.gain.cancelScheduledValues(this.ctx.currentTime);
      this.master.gain.setValueAtTime(0, this.ctx.currentTime);
      for (const n of this.nodes) { try { if (n.stop) n.stop(); } catch (e) { } try { n.disconnect(); } catch (e) { } }
    } catch (e) { }
    this.nodes.length = 0; this.ok = false;
  }
}
