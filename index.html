/* ============================================================================
   STRUCTURE SYSTEM — placement, merging, instancing, animation, clearance.
   ========================================================================= */

const SAIL_VERT = `
  attribute float aPhase; attribute float aHue;
  varying vec2 vUv; varying float vHue; varying vec3 vWorld;
  uniform float uTime;
  void main(){
    vUv = uv; vHue = aHue;
    vec3 p = position;
    float belly = sin(uv.x * 3.14159) * sin(uv.y * 3.14159);
    p.z += belly * 0.09 + 0.03 * belly * sin(uTime * 0.4 + aPhase);
    vec4 q = vec4(p, 1.0);
    #ifdef USE_INSTANCING
      q = instanceMatrix * q;
    #endif
    vec4 w = modelMatrix * q;
    vWorld = w.xyz;
    gl_Position = projectionMatrix * viewMatrix * w;
  }`;

const SAIL_FRAG = `
  varying vec2 vUv; varying float vHue; varying vec3 vWorld;
  uniform vec3 uSun; uniform float uTime;
  void main(){
    vec3 n = normalize(cross(dFdx(vWorld), dFdy(vWorld)));
    float NdL = abs(dot(n, uSun));
    vec3 wheel = 0.55 + 0.45 * cos(6.28318 * (vHue + vec3(0.00, 0.33, 0.67)));
    vec3 tint = pow(wheel, vec3(1.5)) * 0.55;
    float grad = 0.45 + 0.55 * vUv.y;
    float edge = smoothstep(0.0, 0.05, vUv.x) * smoothstep(1.0, 0.95, vUv.x)
               * smoothstep(0.0, 0.05, vUv.y) * smoothstep(1.0, 0.95, vUv.y);
    float seam = smoothstep(0.05, 0.02, abs(fract(vUv.y * 5.0 + 0.5) - 0.5));
    vec3 col = tint * grad * (0.28 + 0.9 * NdL);
    col *= 1.0 - 0.30 * seam;
    col += tint * 0.35 * pow(NdL, 6.0);
    col = mix(vec3(0.02, 0.01, 0.012), col, edge);
    gl_FragColor = vec4(col, 1.0);
  }`;

class StructureSystem {
  constructor(plan, route, scene){
    this.plan = plan; this.route = route; this.scene = scene;
    this.mat = makeStructMaterial();
    this.disposables = [this.mat];
    this.meshes = [];
    this.minClearance = 1e9;
    this.counts = { gates: 0, pylons: 0, cairns: 0, sats: 0, sails: 0, pods: 0, trackers: 0, arches: 0 };
    this._fr = makeFrame();
    this._tmpM = new THREE.Matrix4();
    this._build();
  }

  _clear(pos, radius, sHint){
    const c = this.route.clearanceOf(pos, sHint) - radius;
    if (c < this.minClearance) this.minClearance = c;
    return c;
  }

  _addMesh(geo, mat = this.mat){
    const m = new THREE.Mesh(geo, mat);
    m.matrixAutoUpdate = false;
    this.scene.add(m);
    this.meshes.push(m);
    this.disposables.push(geo);
    return m;
  }

  _build(){
    const plan = this.plan, route = this.route;
    const fr = this._fr;

    /* ---- region-merged static furniture: gates, pylons, cairns, pods ---- */
    const REGION = 800;
    const regions = new Map();
    const kitFor = (s) => {
      const r = Math.floor(s / REGION);
      if (!regions.has(r)) regions.set(r, new GeoKit());
      return regions.get(r);
    };
    const local = new THREE.Matrix4();
    const world = new THREE.Vector3();

    /* backward-signal anomaly: mirror the wake anchor for the flagged run */
    const backGates = plan.gates.filter(g => g.backward);
    if (backGates.length){
      const anchor = Math.min(...backGates.map(g => g.s));
      for (const g of backGates) g.wakeS = 2 * anchor - g.s;
    }

    for (const g of plan.gates){
      route.frameAt(g.s, 'base', fr);
      const hw = route.halfWidth(g.s, 'base');
      const kit = kitFor(g.s);
      const mark = kit.base;
      buildGate(kit, g, hw);
      /* transform the local-frame vertices into world space */
      local.makeBasis(fr.right, fr.nrm, fr.tan).setPosition(fr.pos);
      for (let i = mark; i < kit.base; i++){
        world.set(kit.pos[i * 3], kit.pos[i * 3 + 1], kit.pos[i * 3 + 2]).applyMatrix4(local);
        kit.pos[i * 3] = world.x; kit.pos[i * 3 + 1] = world.y; kit.pos[i * 3 + 2] = world.z;
      }
      world.copy(fr.pos).addScaledVector(fr.right, g.side * (hw + PARA_T + 3.6));
      this._clear(world, 1.2, g.s);
      if (g.variant === 4) this.counts.pylons++; else this.counts.gates++;
    }

    for (const a of plan.arches){
      route.frameAt(a.s, 'base', fr);
      const kit = kitFor(a.s);
      const mark = kit.base;
      buildSpectrumArch(kit, a);
      local.makeBasis(fr.right, fr.nrm, fr.tan).setPosition(fr.pos);
      for (let i = mark; i < kit.base; i++){
        world.set(kit.pos[i * 3], kit.pos[i * 3 + 1], kit.pos[i * 3 + 2]).applyMatrix4(local);
        kit.pos[i * 3] = world.x; kit.pos[i * 3 + 1] = world.y; kit.pos[i * 3 + 2] = world.z;
      }
      world.copy(fr.pos).addScaledVector(fr.nrm, a.r);
      this._clear(world, 0.4, a.s);
      this.counts.arches = (this.counts.arches || 0) + 1;
    }

    for (const c of plan.cairns){
      route.frameAt(c.s, 'base', fr);
      const hw = route.halfWidth(c.s, 'base');
      const kit = kitFor(c.s);
      const mark = kit.base;
      buildCairn(kit, c, hw);
      local.makeBasis(fr.right, fr.nrm, fr.tan).setPosition(fr.pos);
      for (let i = mark; i < kit.base; i++){
        world.set(kit.pos[i * 3], kit.pos[i * 3 + 1], kit.pos[i * 3 + 2]).applyMatrix4(local);
        kit.pos[i * 3] = world.x; kit.pos[i * 3 + 1] = world.y; kit.pos[i * 3 + 2] = world.z;
      }
      world.copy(fr.pos).addScaledVector(fr.right, c.side * (hw + PARA_T + 4.05));
      this._clear(world, 1.3, c.s);
      this.counts.cairns++;
    }

    /* underside pods */
    { const ps = new Stream(plan.seed, 'real:pods');
      let s = 500 + ps.range(0, 300);
      while (s < plan.L - 500){
        const f2 = plan.fork;
        if (!(s > f2.sFork - 100 && s < f2.sRejoin + 100)){
          buildPod(kitFor(s), s, route);
          this.counts.pods++;
        }
        s += ps.range(520, 900);
      } }

    { const kit = new GeoKit();
      buildDepartStation(kit, plan, route);
      buildForkFurniture(kit, plan, route);
      this._addMesh(kit.build()); }

    { const kit = new GeoKit();
      buildReceiveStation(kit, plan, route);
      const g = kit.build();
      const m = this._addMesh(g);
      m.frustumCulled = true;
      this.stationMesh = m; }

    for (const kit of regions.values()) this._addMesh(kit.build());

    /* ---- satellites: instanced per variant, trackers individual ---------- */
    this.satGeos = [];
    for (let v = 0; v < 6; v++) this.satGeos.push(buildSatGeo(v, plan.seed));
    const byVariant = [[], [], [], [], [], []];
    this.trackers = [];
    this.satWorld = [];
    for (const s of plan.sats){
      route.frameAt(s.s, 'base', fr);
      const p = fr.pos.clone().addScaledVector(fr.right, s.lat).add(new THREE.Vector3(0, s.h, 0));
      const c = this._clear(p, 14 * s.scale, s.s);
      if (c < CLEAR_R + 4){
        const push = Math.sign(s.lat) * (CLEAR_R + 20 + 14 * s.scale);
        p.copy(fr.pos).addScaledVector(fr.right, push).add(new THREE.Vector3(0, s.h, 0));
        this._clear(p, 14 * s.scale, s.s);
      }
      this.satWorld.push(p);
      if (s.tracker){ this.trackers.push({ plan: s, pos: p }); this.counts.trackers++; }
      else byVariant[s.variant].push({ plan: s, pos: p });
      this.counts.sats++;
    }
    this.satInst = [];
    for (let v = 0; v < 6; v++){
      const list = byVariant[v];
      if (!list.length) continue;
      const im = new THREE.InstancedMesh(this.satGeos[v], this.mat, list.length);
      im.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      this.scene.add(im);
      this.satInst.push({ im, list });
      this.meshes.push(im);
    }
    /* trackers: body + articulated dish */
    this.trackerMeshes = [];
    const dishG = new GeoKit()
      .prim(GeoKit.G.dish, compose(0, 0, 0, -Math.PI / 2, 0, 0, 6.5), HULL.plum)
      .prim(GeoKit.G.cyl, compose(0, 0.4, 0, 0, 0, 0, 0.3, 2.6, 0.3), HULL.umber)
      .prim(GeoKit.G.oct, compose(0, 1.8, 0, 0, 0, 0, 0.5), PAL.teal, { glow: 0.8 })
      .build();
    this.disposables.push(dishG);
    for (const t of this.trackers){
      const body = new THREE.Mesh(this.satGeos[1], this.mat);
      body.position.copy(t.pos);
      body.scale.setScalar(t.plan.scale * 1.4);
      body.rotation.y = t.plan.phase;
      const dish = new THREE.Mesh(dishG, this.mat);
      dish.position.copy(t.pos).add(new THREE.Vector3(0, 6 * t.plan.scale, 0));
      this.scene.add(body, dish);
      this.meshes.push(body, dish);
      this.trackerMeshes.push({ body, dish });
    }
    for (const g of this.satGeos) this.disposables.push(g);

    /* ---- solar sails ------------------------------------------------------ */
    this.sailMat = new THREE.ShaderMaterial({
      vertexShader: SAIL_VERT, fragmentShader: SAIL_FRAG, side: THREE.DoubleSide,
      uniforms: { uTime: { value: 0 }, uSun: { value: new THREE.Vector3(0, 1, 0) } },
    });
    this.disposables.push(this.sailMat);
    const sailG = new THREE.PlaneGeometry(1, 1, QUALITY.sailSeg, QUALITY.sailSeg);
    const nSail = plan.sails.length;
    const phases = new Float32Array(sailG.attributes.position.count);
    const iPhase = new THREE.InstancedBufferAttribute(new Float32Array(nSail), 1);
    const iHue = new THREE.InstancedBufferAttribute(new Float32Array(nSail), 1);
    const sailIG = new THREE.InstancedBufferGeometry().copy(sailG);
    sailIG.instanceCount = nSail;
    sailIG.setAttribute('aPhase', iPhase);
    sailIG.setAttribute('aHue', iHue);
    this.sailMesh = new THREE.InstancedMesh(sailIG, this.sailMat, nSail);
    this.sailMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    this.sailMesh.frustumCulled = false;
    this.sailWorld = [];
    const frameKit = new GeoKit();
    for (let i = 0; i < nSail; i++){
      const sl = plan.sails[i];
      route.frameAt(sl.s, 'base', fr);
      const p = fr.pos.clone().addScaledVector(fr.right, sl.lat).add(new THREE.Vector3(0, sl.h, 0));
      const c = this._clear(p, sl.size * 0.75, sl.s);
      if (c < CLEAR_R + 4){
        p.copy(fr.pos).addScaledVector(fr.right, Math.sign(sl.lat) * (CLEAR_R + 18 + sl.size * 0.75)).add(new THREE.Vector3(0, sl.h, 0));
        this._clear(p, sl.size * 0.75, sl.s);
      }
      this.sailWorld.push(p);
      iPhase.setX(i, sl.phase); iHue.setX(i, sl.hue);
      /* spar cross + boom counterweight, merged static */
      const w = sl.size, h2 = sl.size * sl.aspect;
      strut(frameKit, p.clone().add(new THREE.Vector3(0, -h2 * 0.58, 0)), p.clone().add(new THREE.Vector3(0, h2 * 0.58, 0)), 0.30, HULL.iron);
      strut(frameKit, p.clone().add(new THREE.Vector3(-w * 0.55, 0, 0)), p.clone().add(new THREE.Vector3(w * 0.55, 0, 0)), 0.24, HULL.umber);
      frameKit.prim(GeoKit.G.oct, compose(p.x, p.y - h2 * 0.62, p.z, 0, 0, 0, 1.1), HULL.slate);
      frameKit.prim(GeoKit.G.oct, compose(p.x, p.y - h2 * 0.66, p.z, 0, 0, 0, 0.4), PAL.coral, { glow: 0.5 });
      this.counts.sails++;
    }
    this.scene.add(this.sailMesh);
    this.meshes.push(this.sailMesh);
    this.disposables.push(sailG, sailIG);
    this._addMesh(frameKit.build());

    /* ---- tether lines ----------------------------------------------------- */
    const tPos = [];
    for (let i = 0; i < nSail; i++){
      const sl = plan.sails[i];
      if (sl.tetherSat >= 0 && this.satWorld[sl.tetherSat]){
        const a = this.sailWorld[i], b = this.satWorld[sl.tetherSat];
        if (a.distanceTo(b) < 900){ tPos.push(a.x, a.y, a.z, b.x, b.y, b.z); }
      }
    }
    if (tPos.length){
      const tg = new THREE.BufferGeometry();
      tg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(tPos), 3));
      const tm = new THREE.LineBasicMaterial({ color: 0x2c1e18, transparent: true, opacity: 0.55 });
      this.tethers = new THREE.LineSegments(tg, tm);
      this.scene.add(this.tethers);
      this.meshes.push(this.tethers);
      this.disposables.push(tg, tm);
    }

    this._q = new THREE.Quaternion();
    this._e = new THREE.Euler();
    this._sc = new THREE.Vector3();
  }

  /* per-frame: satellite spin, sail tilt, tracker dishes follow the giant */
  update(t, dt, sunDir, wakeS, breath, amber, beacon, giantDim, giantPos, crown, rush, pulseS, pulseAmp){
    const u = this.mat.uniforms;
    u.uSun.value.copy(sunDir); u.uWakeS.value = wakeS; u.uBreath.value = breath;
    u.uAmber.value = amber; u.uBeacon.value = beacon; u.uGiantDim.value = giantDim;
    u.uCrown.value = crown || 0;
    u.uRush.value = rush || 0;
    u.uPulseS.value = (pulseS === undefined) ? -1e6 : pulseS;
    u.uPulseAmp.value = pulseAmp || 0;
    u.uTime.value = t;
    this.sailMat.uniforms.uTime.value = t;
    this.sailMat.uniforms.uSun.value.copy(sunDir);

    for (const { im, list } of this.satInst){
      for (let i = 0; i < list.length; i++){
        const { plan: sp, pos } = list[i];
        this._e.set(Math.sin(sp.phase) * 0.3, sp.phase + t * sp.spin, Math.cos(sp.phase * 2) * 0.2);
        this._q.setFromEuler(this._e);
        this._sc.setScalar(sp.scale * 2.2);
        this._tmpM.compose(pos, this._q, this._sc);
        im.setMatrixAt(i, this._tmpM);
      }
      im.instanceMatrix.needsUpdate = true;
    }
    const sails = this.plan.sails;
    for (let i = 0; i < sails.length; i++){
      const sl = sails[i];
      this._e.set(Math.sin(t * sl.tiltRate + sl.phase) * 0.35 + 0.2,
                  sl.phase + t * sl.tiltRate * 0.4,
                  Math.cos(t * sl.tiltRate * 0.7 + sl.phase) * 0.2);
      this._q.setFromEuler(this._e);
      this._sc.set(sl.size, sl.size * sl.aspect, 1);
      this._tmpM.compose(this.sailWorld[i], this._q, this._sc);
      this.sailMesh.setMatrixAt(i, this._tmpM);
    }
    this.sailMesh.instanceMatrix.needsUpdate = true;

    for (const { body, dish } of this.trackerMeshes){
      body.rotation.y += dt * 0.02;
      if (giantPos) dish.lookAt(giantPos);
      else dish.rotation.y += dt * 0.05;
    }
  }

  dispose(){
    for (const m of this.meshes) this.scene.remove(m);
    for (const d of this.disposables) d.dispose && d.dispose();
  }
}

/* ============================================================================
   AMBIENT LIFE — transit caravans, maintenance drones, kite-rays, the giant,
   and the anomalies. The world keeps moving whether or not the rider does.
   ========================================================================= */

/* ------------------------- caravan module geometry ------------------------- */
function buildCaravanModule(variant, seed){
  const kit = new GeoKit();
  const iron = HULL.iron, umber = HULL.umber, slate = HULL.slate;
  const win = (x, y, z, n, dx, g = 0.9, c = PAL.gold) => {
    for (let i = 0; i < n; i++) kit.box(0.42, 0.5, 0.06, compose(x + i * dx, y, z), c, { glow: g });
  };
  if (variant === 0){        /* ridge coach */
    kit.box(7.4, 2.0, 2.4, compose(0, 0, 0), iron);
    kit.box(6.6, 0.7, 1.8, compose(0, 1.3, 0), umber);
    win(-2.7, 0.25, 1.24, 5, 1.35);
    win(-2.7, 0.25, -1.24, 5, 1.35);
    kit.box(0.6, 0.3, 2.5, compose(0, 1.05, 0), slate);
  } else if (variant === 1){ /* tanker */
    kit.prim(GeoKit.G.cyl, compose(0, 0.1, 0, 0, 0, Math.PI / 2, 2.1, 6.8, 2.1), umber);
    for (const x of [-2.2, 0, 2.2]) kit.box(0.5, 2.3, 2.3, compose(x, -0.1, 0), iron);
    kit.box(0.9, 0.5, 0.9, compose(2.9, 1.2, 0), slate);
    kit.prim(GeoKit.G.oct, compose(-3.1, 1.25, 0, 0, 0, 0, 0.3), PAL.raspberry, { glow: 0.8 });
  } else if (variant === 2){ /* lattice flat + cargo */
    kit.box(7.6, 0.5, 2.3, compose(0, -0.7, 0), iron);
    for (let i = 0; i < 3; i++)
      kit.box(1.9, 1.4, 1.9, compose(-2.4 + i * 2.4, 0.25, (i % 2) * 0.3 - 0.15, 0, (i * 0.4), 0), i % 2 ? slate : umber);
    strut(kit, new THREE.Vector3(-3.5, -0.4, 1.0), new THREE.Vector3(3.5, -0.4, 1.0), 0.1, HULL.rust);
  } else if (variant === 3){ /* double-deck cabin */
    kit.box(6.8, 2.9, 2.2, compose(0, 0.3, 0), iron);
    kit.box(7.0, 0.4, 2.4, compose(0, -1.2, 0), umber);
    win(-2.4, 1.0, 1.14, 4, 1.5, 0.8);
    win(-2.4, -0.2, 1.14, 5, 1.2, 0.65, PAL.teal);
    win(-2.4, 1.0, -1.14, 4, 1.5, 0.8);
    win(-2.4, -0.2, -1.14, 5, 1.2, 0.65, PAL.magenta);
    kit.box(1.2, 0.5, 1.6, compose(0.2, 2.0, 0), slate);
  } else {                   /* power module */
    kit.box(5.6, 1.8, 2.0, compose(0, 0, 0), umber);
    for (const x of [-1.6, 0, 1.6]) kit.box(0.08, 2.8, 2.6, compose(x, 0.2, 0), HULL.plum);
    kit.prim(GeoKit.G.cyl, compose(0, 0, 0, 0, 0, Math.PI / 2, 1.0, 6.0, 1.0), slate);
    kit.prim(GeoKit.G.oct, compose(2.9, 0, 0, 0, 0, 0, 0.5), PAL.coral, { glow: 1.4 });
  }
  /* shared undercarriage: skids, bogies, magnetic shoes */
  for (const x of [-2.6, 2.6]){
    kit.box(1.6, 0.4, 1.6, compose(x, -1.45, 0), slate);
    kit.prim(GeoKit.G.cyl, compose(x, -1.75, 0, 0, 0, Math.PI / 2, 0.5, 1.7, 0.5), iron);
    kit.prim(GeoKit.G.oct, compose(x, -1.95, 0, 0, 0, 0, 0.22), PAL.teal, { glow: 0.5 });
  }
  kit.box(7.0, 0.22, 1.0, compose(0, -1.25, 0), HULL.rust);
  return kit.build();
}

function buildProw(){
  const kit = new GeoKit();
  kit.box(4.6, 1.9, 2.2, compose(-0.8, 0, 0), HULL.iron);
  kit.prim(GeoKit.G.cone, compose(1.9, 0, 0, 0, 0, -Math.PI / 2, 2.2, 2.6, 1.9), HULL.umber);
  kit.box(2.0, 0.6, 1.6, compose(-0.4, 1.25, 0), HULL.slate);
  kit.prim(GeoKit.G.oct, compose(2.6, 0.2, 0, 0, 0, 0, 0.42), PAL.bone, { glow: 1.35 });
  kit.prim(GeoKit.G.oct, compose(1.6, -0.9, 0.9, 0, 0, 0, 0.18), PAL.raspberry, { glow: 0.85 });
  kit.prim(GeoKit.G.oct, compose(1.6, -0.9, -0.9, 0, 0, 0, 0.18), PAL.raspberry, { glow: 0.85 });
  for (const x of [-2.6, 1.0]){
    kit.box(1.6, 0.4, 1.6, compose(x, -1.45, 0), HULL.slate);
    kit.prim(GeoKit.G.oct, compose(x, -1.9, 0, 0, 0, 0, 0.22), PAL.teal, { glow: 0.5 });
  }
  return kit.build();
}

class LifeSystem {
  constructor(plan, route, scene, structs, mat){
    this.plan = plan; this.route = route; this.scene = scene; this.structs = structs;
    this.mat = mat;                       // shared struct material
    this.disposables = [];
    this.meshes = [];
    this._fr = makeFrame();
    this._v = new THREE.Vector3(); this._v2 = new THREE.Vector3(); this._v3 = new THREE.Vector3();
    this._q = new THREE.Quaternion(); this._m = new THREE.Matrix4();
    this.giantPos = null; this.giantDim = 1; this.giantCloseness = 0;
    this.events = { caravanNear: 0, giantAudio: 0 };
    this._buildCaravans();
    this._buildDrones();
    this._buildFauna();
    this._buildGiant();
    this._buildAnomalies();
  }

  /* ---------------------------- caravans -------------------------------- */
  _railFrame(sc, out){
    /* caravan rail: offset line beside the route that crosses overhead once */
    const t = this.plan.transit;
    const s = clamp(sc, 0, this.plan.L);
    this.route.frameAt(s, 'base', this._fr);
    const u = clamp((s - (t.sCross - 210)) / 420, 0, 1);
    const railLat = t.railSide * t.railLat * Math.cos(u * Math.PI);
    const bulge = Math.sin(u * Math.PI);
    out.copy(this._fr.pos)
      .addScaledVector(this._fr.right, railLat)
      .addScaledVector(this._fr.nrm, t.railH + bulge * 2.5);
    return out;
  }

  _buildCaravans(){
    this.modGeos = [];
    for (let v = 0; v < 5; v++) this.modGeos.push(buildCaravanModule(v, this.plan.seed));
    this.prowGeo = buildProw();
    this.disposables.push(...this.modGeos, this.prowGeo);
    /* caravan A: articulated, will overtake */
    this.cavA = { mods: [], offs: [] };
    let off = 0;
    const prow = new THREE.Mesh(this.prowGeo, this.mat);
    this.scene.add(prow); this.meshes.push(prow);
    this.cavA.mods.push(prow); this.cavA.offs.push(0);
    off = 7.2;
    for (const m of this.plan.transit.modulesA){
      const mesh = new THREE.Mesh(this.modGeos[m.variant], this.mat);
      this.scene.add(mesh); this.meshes.push(mesh);
      this.cavA.mods.push(mesh);
      this.cavA.offs.push(off + m.len * 0.5);
      off += m.len + 1.6;
    }
    this.cavA.len = off;
    /* linkage beads */
    const linkG = new THREE.OctahedronGeometry(0.3, 0);
    const linkKit = new GeoKit();
    linkKit.prim(linkG, compose(0, 0, 0, 0, 0, 0, 1), PAL.coral, { glow: 1.5 });
    this.linkGeo = linkKit.build(); linkG.dispose();
    this.cavA.links = new THREE.InstancedMesh(this.linkGeo, this.mat, this.cavA.mods.length - 1);
    this.scene.add(this.cavA.links); this.meshes.push(this.cavA.links);
    this.disposables.push(this.linkGeo);

    /* caravan B: merged rigid body, far away near the receiving station */
    { const kit = new GeoKit();
      const bs = new Stream(this.plan.seed, 'real:caravanB');
      let x = 0;
      for (let i = 0; i < this.plan.transit.caravanB.modN; i++){
        kit.merge(this.modGeos[bs.int(5)], compose(x, 0, 0));
        x -= 9.6;
      }
      this.cavB = { mesh: new THREE.Mesh(kit.build(), this.mat), frozen: false, len: -x };
      this.scene.add(this.cavB.mesh); this.meshes.push(this.cavB.mesh);
      this.disposables.push(this.cavB.mesh.geometry);
    }

    /* caravan C — the Dawn Service: crosses the opening vista on a slow circle */
    { const kit = new GeoKit();
      const cs = new Stream(this.plan.seed, 'real:caravanC');
      const cc = this.plan.transit.caravanC;
      kit.merge(this.prowGeo, compose(4, 0, 0));
      let x = -5;
      for (let i = 0; i < cc.modN; i++){ kit.merge(this.modGeos[cs.int(5)], compose(x, 0, 0)); x -= 9.6; }
      const fr0 = makeFrame();
      this.route.frameAt(30, 'base', fr0);
      const center = fr0.pos.clone().addScaledVector(fr0.tan, cc.ahead);
      center.y += cc.h;
      /* start angle: place the caravan crossing the forward view at t = 0 */
      const seen = fr0.pos.clone().addScaledVector(fr0.tan, cc.ahead - 60).addScaledVector(fr0.right, -120);
      const rel = seen.sub(center);
      const a0 = Math.atan2(rel.z, rel.x);
      this.cavC = { mesh: new THREE.Mesh(kit.build(), this.mat), center, a0, cc };
      this.cavC.mesh.scale.setScalar(1.5);
      this.scene.add(this.cavC.mesh); this.meshes.push(this.cavC.mesh);
      this.disposables.push(this.cavC.mesh.geometry);
    }

    /* moving shadow decal for the crossing */
    const shG = new THREE.PlaneGeometry(30, 12);
    const shM = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0,
      depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2 });
    this.shadow = new THREE.Mesh(shG, shM);
    this.shadow.renderOrder = 3;
    this.scene.add(this.shadow); this.meshes.push(this.shadow);
    this.disposables.push(shG, shM);
  }

  _updateCaravans(t, dt, riderS, riderChapter){
    const tr = this.plan.transit;
    const head = tr.startS + tr.vCav * t;
    const wrap = this.plan.L + 1600;
    const headS = (((head + 400) % wrap) + wrap) % wrap - 400;
    const up = this._v3.set(0, 1, 0);
    for (let i = 0; i < this.cavA.mods.length; i++){
      const s = headS - this.cavA.offs[i];
      const mesh = this.cavA.mods[i];
      if (s < -380 || s > this.plan.L + 380){ mesh.visible = false; continue; }
      mesh.visible = true;
      this._railFrame(s, this._v);
      this._railFrame(s + 4, this._v2);
      mesh.position.copy(this._v);
      this._m.lookAt(this._v2, this._v, up);
      mesh.quaternion.setFromRotationMatrix(this._m);
      mesh.rotateY(Math.PI / 2);   /* module geometry runs along +x */
      mesh.position.y += Math.sin(t * 1.7 + i) * 0.06;
    }
    for (let i = 0; i < this.cavA.mods.length - 1; i++){
      const s = headS - (this.cavA.offs[i] + this.cavA.offs[i + 1]) / 2;
      this._railFrame(s, this._v);
      this._m.compose(this._v, this._q.identity(), this._v2.set(1, 1, 1));
      this.cavA.links.setMatrixAt(i, this._m);
    }
    this.cavA.links.instanceMatrix.needsUpdate = true;
    this.cavA.links.visible = headS > -300 && headS < this.plan.L + 300;

    /* shadow while the caravan straddles the overhead crossing */
    const envIn = smooth((headS - (tr.sCross - 50)) / 130);
    const envOut = smooth(((tr.sCross + 50) - (headS - this.cavA.len)) / 130);
    const env = Math.min(envIn, envOut);
    if (env > 0.01){
      const sh = clamp(tr.sCross + (headS - this.cavA.len * 0.5 - tr.sCross) * 0.2, 0, this.plan.L);
      this.route.frameAt(sh, 'base', this._fr);
      this.shadow.position.copy(this._fr.pos).addScaledVector(this._fr.nrm, 0.08);
      this.shadow.quaternion.setFromRotationMatrix(this._m.makeBasis(this._fr.right, this._fr.tan, this._fr.nrm));
      this.shadow.rotateX(-Math.PI / 2);
      this.shadow.material.opacity = env * 0.4;
    } else this.shadow.material.opacity = 0;

    /* how near is the caravan to the rider (for audio) */
    const dNear = Math.abs(headS - this.cavA.len * 0.5 - riderS);
    this.events.caravanNear = clamp(1 - dNear / 260, 0, 1);

    /* caravan B: distant loop near the receiving station */
    const cb = tr.caravanB;
    const anomWait = this.anom.waitingCaravan;
    let bt = t;
    if (anomWait) bt = anomWait.frozen ? anomWait.tFroze : (t - (anomWait.tOffset || 0));
    const a = (bt / cb.period) * TAU + cb.phase;
    this.route.frameAt(this.plan.L - 30, 'base', this._fr);
    const cx = this._fr.pos.clone().addScaledVector(this._fr.tan, 500).addScaledVector(this._fr.right, cb.orbitR * 0.4);
    this.cavB.mesh.position.set(cx.x + Math.cos(a) * cb.orbitR, cx.y + 60 + Math.sin(a * 2) * 30, cx.z + Math.sin(a) * cb.orbitR);
    this.cavB.mesh.rotation.y = -a;

    /* caravan C circles slowly; tangent orientation, no corridor contact */
    const C = this.cavC;
    const ca = C.a0 + C.cc.omega * t;
    C.mesh.position.set(C.center.x + Math.cos(ca) * C.cc.r, C.center.y,
                        C.center.z + Math.sin(ca) * C.cc.r);
    C.mesh.rotation.y = -ca - Math.PI / 2 * Math.sign(C.cc.omega);
  }

  /* ----------------------------- drones ---------------------------------- */
  _buildDrones(){
    const famColors = [PAL.gold, PAL.magenta, PAL.teal];
    this.droneGeos = famColors.map((c) => {
      const kit = new GeoKit();
      kit.prim(GeoKit.G.oct, compose(0, 0, 0, 0, 0, 0, 0.55, 0.75, 0.55), HULL.iron);
      kit.box(0.9, 0.05, 0.35, compose(0, 0.12, 0, 0, 0, 0.2), HULL.umber);
      kit.box(0.35, 0.05, 0.9, compose(0, -0.05, 0, 0.2, 0, 0), HULL.plum);
      kit.prim(GeoKit.G.oct, compose(0, -0.28, 0, 0, 0, 0, 0.14), c, { glow: 1.7 });
      const g = kit.build();
      this.disposables.push(g);
      return g;
    });
    const famCount = [0, 0, 0];
    for (const d of this.plan.drones) famCount[d.fam]++;
    famCount[0] += QUALITY.droneExtra;
    this.droneCount = this.plan.drones.length + QUALITY.droneExtra;
    this.droneInsts = famCount.map((n, f) => {
      const im = new THREE.InstancedMesh(this.droneGeos[f], this.mat, Math.max(n, 1));
      im.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      im.frustumCulled = false;
      this.scene.add(im); this.meshes.push(im);
      return im;
    });
    /* cosmetic extras (quality realization only): more rib inspectors */
    const er = new Stream(this.plan.seed, 'real:dronesExtra');
    this.droneExtras = [];
    for (let i = 0; i < QUALITY.droneExtra; i++)
      this.droneExtras.push({ fam: 0, s: er.range(0.05, 0.95) * this.plan.L, side: er.sign(),
                              r: er.range(2.5, 4.5), rate: er.range(0.25, 0.6), phase: er.range(0, TAU) });
  }

  _droneAt(d, t, out, qOut){
    const fr = this._fr;
    if (d.fam === 0){
      this.route.frameAt(d.s, 'base', fr);
      const hw = this.route.halfWidth(d.s, 'base');
      const a = t * d.rate + d.phase;
      out.copy(fr.pos)
        .addScaledVector(fr.right, d.side * (hw + PARA_T + 2.4 + d.r + Math.sin(a * 2) * 1.2))
        .addScaledVector(fr.nrm, 1.6 + Math.sin(a) * 1.1)
        .addScaledVector(fr.tan, Math.cos(a) * d.r * 2.2);
      qOut.setFromEuler(new THREE.Euler(0, a * 0.6, Math.sin(a) * 0.15));
    } else if (d.fam === 1){
      const A = this.structs.satWorld[d.a], B = this.structs.satWorld[d.b];
      let u2 = (t * d.rate + d.phase) % 2;
      if (u2 > 1) u2 = 2 - u2;
      const u = smooth(smooth(u2));
      out.lerpVectors(A, B, u);
      out.y += Math.sin(u * Math.PI) * d.bow;
      qOut.setFromEuler(new THREE.Euler(0, t * 0.4 + d.phase, 0));
    } else {
      const S = this.structs.sailWorld[d.sail];
      const a = t * d.rate + d.phase;
      out.set(S.x + Math.cos(a) * d.r, S.y + Math.sin(a * 1.3) * d.r * 0.5 * d.tilt + Math.sin(a) * 2, S.z + Math.sin(a) * d.r);
      qOut.setFromEuler(new THREE.Euler(0, -a, 0));
    }
  }

  _updateDrones(t){
    const idx = [0, 0, 0];
    const sc = this._v2.set(1, 1, 1);
    const place = (d) => {
      this._droneAt(d, t, this._v, this._q);
      this._m.compose(this._v, this._q, sc);
      this.droneInsts[d.fam].setMatrixAt(idx[d.fam]++, this._m);
    };
    for (const d of this.plan.drones) place(d);
    for (const d of this.droneExtras) place(d);
    for (const im of this.droneInsts) im.instanceMatrix.needsUpdate = true;
  }

  /* ----------------------------- kite-rays ------------------------------- */
  _buildFauna(){
    const g0 = new THREE.PlaneGeometry(2.4, 2.0, 8, 4);
    g0.rotateX(-Math.PI / 2);
    const count = this.plan.fauna.reduce((a, f) => a + f.n, 0);
    const g = new THREE.InstancedBufferGeometry().copy(g0);
    const aPhase = new Float32Array(count), aFlap = new Float32Array(count), aTint = new Float32Array(count);
    g.setAttribute('aPhase', new THREE.InstancedBufferAttribute(aPhase, 1));
    g.setAttribute('aFlap', new THREE.InstancedBufferAttribute(aFlap, 1));
    g.setAttribute('aTint', new THREE.InstancedBufferAttribute(aTint, 1));
    this.rayMat = new THREE.ShaderMaterial({
      side: THREE.DoubleSide,
      uniforms: { uTime: { value: 0 }, uSun: { value: new THREE.Vector3(0, 1, 0) } },
      vertexShader: `
        attribute float aPhase; attribute float aFlap; attribute float aTint;
        varying vec2 vUv; varying float vTint; varying vec3 vWorld;
        uniform float uTime;
        void main(){
          vUv = uv; vTint = aTint;
          vec3 p = position;
          p.z *= 1.0 - 0.55 * clamp(-p.x / 1.2, 0.0, 1.0);       /* delta taper */
          float span = abs(p.z) / 1.0;
          p.y += sin(uTime * aFlap + aPhase + p.x * 1.2) * span * span * 0.55;
          p.y += sin(uTime * aFlap * 0.5 + aPhase) * 0.1;
          vec4 q = vec4(p, 1.0);
          #ifdef USE_INSTANCING
            q = instanceMatrix * q;
          #endif
          vec4 w = modelMatrix * q;
          vWorld = w.xyz;
          gl_Position = projectionMatrix * viewMatrix * w;
        }`,
      fragmentShader: `
        varying vec2 vUv; varying float vTint; varying vec3 vWorld;
        uniform vec3 uSun;
        void main(){
          vec3 n = normalize(cross(dFdx(vWorld), dFdy(vWorld)));
          float NdL = abs(dot(n, uSun));
          vec3 body = vec3(0.012, 0.008, 0.014);
          vec3 wheel = 0.55 + 0.45 * cos(6.28318 * (vTint + vec3(0.00, 0.33, 0.67)));
          vec3 edgeC = pow(wheel, vec3(1.4)) * 0.75;
          float rim = smoothstep(0.75, 0.98, abs(vUv.y - 0.5) * 2.0);
          float tail = smoothstep(0.3, 0.0, vUv.x) * 0.5;
          vec3 col = body * (0.4 + 0.8 * NdL) + edgeC * (rim * 0.55 + tail * 0.2);
          gl_FragColor = vec4(col, 1.0);
        }`,
    });
    this.rayInst = new THREE.InstancedMesh(g, this.rayMat, count);
    this.rayInst.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    this.rayInst.frustumCulled = false;
    this.scene.add(this.rayInst); this.meshes.push(this.rayInst);
    this.disposables.push(g0, g, this.rayMat);

    /* world-space loop paths */
    this.rayPaths = [];
    const fr = this._fr;
    let iInst = 0;
    for (const f of this.plan.fauna){
      const pts = [];
      for (const p of f.pts){
        const s = clamp(p.s, 0, this.plan.L);
        this.route.frameAt(s, 'base', fr);
        pts.push(fr.pos.clone().addScaledVector(fr.right, p.lat).add(new THREE.Vector3(0, p.h, 0)));
      }
      const curve = new THREE.CatmullRomCurve3(pts, true, 'centripetal', 0.6);
      for (let m = 0; m < f.n; m++){
        aPhase[iInst] = f.phase + m * 1.7;
        aFlap[iInst] = f.flap;
        aTint[iInst] = f.tint;
        iInst++;
      }
      this.rayPaths.push({ f, curve });
    }
    /* gather point near the receiving station for the afterglow */
    this.route.frameAt(this.plan.L - 60, 'base', fr);
    this.gatherC = fr.pos.clone().addScaledVector(fr.tan, 160).add(new THREE.Vector3(0, 70, 0));
  }

  _updateFauna(t, riderS){
    const gatherWin = smooth((riderS - (this.plan.L - 700)) / 260) *
                      (1 - smooth((riderS - (this.plan.L - 180)) / 140));
    let idx = 0;
    for (const { f, curve } of this.rayPaths){
      for (let m = 0; m < f.n; m++){
        const u = ((t / f.period) + f.phase / TAU + m * 0.045) % 1;
        curve.getPointAt(u, this._v);
        curve.getTangentAt(u, this._v2);
        if (gatherWin > 0.001){
          const ga = m * 2.1 + f.phase + t * 0.1;
          this._v3.set(this.gatherC.x + Math.cos(ga) * 60, this.gatherC.y + Math.sin(ga * 1.3) * 22,
                       this.gatherC.z + Math.sin(ga) * 60);
          this._v.lerp(this._v3, gatherWin * 0.85);
        }
        this._m.lookAt(this._v, this._v2.add(this._v), this._v3.set(0, 1, 0));
        this._q.setFromRotationMatrix(this._m);
        this._m.compose(this._v, this._q, this._v3.setScalar(f.size));
        this.rayInst.setMatrixAt(idx++, this._m);
      }
    }
    this.rayInst.instanceMatrix.needsUpdate = true;
  }

  /* ----------------------------- the giant -------------------------------- */
  _buildGiant(){
    const kit = new GeoKit();
    const ink = new THREE.Color(0x070409);
    const deep = new THREE.Color(0x110a16);
    /* an unresolved shape: whale-hull, sail-fin, machine-keel */
    kit.prim(GeoKit.G.sph, compose(0, 0, 0, 0, 0, 0.1, 440, 130, 120), ink);
    kit.prim(GeoKit.G.sph, compose(150, 24, 0, 0, 0, 0.35, 210, 80, 70), deep);
    kit.prim(GeoKit.G.sph, compose(-260, 10, 0, 0, 0, -0.2, 180, 60, 54), ink);
    kit.box(180, 240, 6, compose(-40, 130, 0, 0, 0, -0.25), deep);
    kit.box(120, 6, 300, compose(-180, -40, 0, 0.35, 0.2, 0), ink);
    kit.box(90, 5, 200, compose(120, -30, 30, -0.3, -0.15, 0), deep);
    /* spine lights — dim constellation along the back */
    for (let i = 0; i < 9; i++)
      kit.prim(GeoKit.G.oct, compose(-320 + i * 70, 40 + Math.sin(i * 1.2) * 26, 0, 0, 0, 0, 3.2),
               i % 3 ? PAL.raspberry : PAL.gold, { glow: 0.5 });
    this.giantGeo = kit.build();
    this.disposables.push(this.giantGeo);
    this.giant = new THREE.Mesh(this.giantGeo, this.mat);
    this.giant.visible = false;
    this.scene.add(this.giant); this.meshes.push(this.giant);
    this.giantIdx = 0;
  }

  _updateGiant(t){
    const evs = this.plan.giants;
    this.giantPos = null; this.giantDim = 1; this.giantCloseness = 0;
    let active = null;
    for (const ev of evs){
      if (t >= ev.t0 && t <= ev.t0 + ev.dur){ active = ev; break; }
      if (ev.t0 > t) break;
    }
    if (!active){ this.giant.visible = false; this.events.giantAudio = 0; return; }
    const u = (t - active.t0) / active.dur;
    const sRef = clamp(active.t0 * 10.5, 200, this.plan.L - 200);
    this.route.frameAt(sRef, 'base', this._fr);
    const center = this._v2.copy(this._fr.pos)
      .addScaledVector(this._fr.right, active.side * active.dist);
    center.y += active.alt;
    const travel = active.dist * 1.15;
    const dir = this._v3.copy(this._fr.tan).multiplyScalar(-1);
    this.giant.position.copy(center).addScaledVector(dir, (u - 0.5) * travel);
    this.giant.quaternion.setFromRotationMatrix(this._m.lookAt(this._v.set(0, 0, 0), dir, this._v2.set(0, 1, 0)));
    this.giant.rotateY(Math.PI / 2);
    this.giant.scale.setScalar(active.scale);
    this.giant.position.y += Math.sin(t * 0.14) * 24;
    this.giant.visible = true;
    this.giantPos = this.giant.position;
    const close = clamp(1 - active.dist / 4200, 0, 1);
    const env = Math.sin(u * Math.PI);
    this.giantCloseness = close * env;
    this.giantDim = 1 - (active.dist < 1600 ? 0.24 : 0.08) * env;
    this.events.giantAudio = (u > 0.06 && u < 0.9) ? close * env : 0; /* delayed voice */
  }

  /* ----------------------------- anomalies -------------------------------- */
  _buildAnomalies(){
    const an = this.plan.anomalies;
    this.anom = { missing: 0, lost: 0, echo: 0, borrowed: null, waitingCaravan: null, doneMissing: false };
    if (an.subtle.includes('waitingCaravan'))
      this.anom.waitingCaravan = { frozen: true, tFroze: 8, chapterEntered: -1 };
    if (an.impossible === 'borrowedStar'){
      /* a star descends and docks into a dark pylon lamp */
      const g = new THREE.OctahedronGeometry(1.1, 1);
      const kit = new GeoKit();
      kit.prim(g, compose(0, 0, 0, 0, 0, 0, 1), PAL.bone, { glow: 3.0 });
      g.dispose();
      const geo = kit.build();
      const star = new THREE.Mesh(geo, this.mat);
      star.visible = false;
      this.scene.add(star); this.meshes.push(star);
      this.disposables.push(geo);
      /* target: the pylon-gate nearest to 400 m past the trigger */
      const trig = this.plan.anomalies.trigS.borrowedStar;
      let target = null, bd = 1e9;
      for (const gg of this.plan.gates){
        const d = Math.abs(gg.s - (trig + 420));
        if (gg.variant === 4 && d < bd){ bd = d; target = gg; }
      }
      if (!target) target = this.plan.gates[this.plan.gates.length - 1];
      this.route.frameAt(target.s, 'base', this._fr);
      const hw = this.route.halfWidth(target.s, 'base');
      const dockPos = this._fr.pos.clone()
        .addScaledVector(this._fr.right, target.side * (hw + PARA_T + 3.6))
        .addScaledVector(this._fr.nrm, target.h + 0.6);
      const skyPos = dockPos.clone().add(new THREE.Vector3(1800, 5200, -2400));
      this.anom.borrowed = { star, dockPos, skyPos, state: 0, u: 0 };
    }
  }

  _updateAnomalies(t, dt, riderS, riderChapter){
    const an = this.plan.anomalies;
    const A = this.anom;
    /* echo road window */
    if (an.impossible === 'echoRoad'){
      const trig = an.trigS.echoRoad;
      const w = smooth((riderS - trig) / 120) * (1 - smooth((riderS - trig - 900) / 260));
      A.echo = w;
    }
    /* missing constellation binds to the second giant passage */
    if (an.subtle.includes('missingConstellation') && this.plan.giants.length > 1){
      const ev = this.plan.giants[1];
      if (t > ev.t0 && t < ev.t0 + ev.dur){
        const u = (t - ev.t0) / ev.dur;
        A.missing = Math.sin(clamp(u, 0, 1) * Math.PI);
        A.doneMissing = true;
      } else A.missing = 0;
      if (A.doneMissing && t > ev.t0 + ev.dur) A.lost = 1;
    }
    /* waiting caravan unfreezes on the next chapter entry */
    if (A.waitingCaravan){
      const wc = A.waitingCaravan;
      if (wc.chapterEntered < 0) wc.chapterEntered = riderChapter;
      if (wc.frozen && riderChapter > wc.chapterEntered){
        wc.frozen = false;
        wc.tOffset = t - wc.tFroze;
      }
      if (!wc.frozen) wc.tFroze = t - (wc.tOffset || 0);
    }
    /* borrowed star */
    if (A.borrowed){
      const B = A.borrowed;
      const trig = an.trigS.borrowedStar;
      if (B.state === 0 && riderS > trig){ B.state = 1; B.u = 0; B.star.visible = true; }
      if (B.state === 1){
        B.u = Math.min(1, B.u + dt / 34);
        const e = smooth(B.u);
        B.star.position.lerpVectors(B.skyPos, B.dockPos, e);
        B.star.scale.setScalar(lerp(2.6, 0.55, e));
        if (B.u >= 1) B.state = 2;   /* docked: stays lit forever, cold-white in a warm world */
      }
    }
  }

  update(t, dt, riderS, riderChapter, sunDir){
    this.rayMat.uniforms.uTime.value = t;
    if (sunDir) this.rayMat.uniforms.uSun.value.copy(sunDir);
    this._updateCaravans(t, dt, riderS, riderChapter);
    this._updateDrones(t);
    this._updateFauna(t, riderS);
    this._updateGiant(t);
    this._updateAnomalies(t, dt, riderS, riderChapter);
  }

  dispose(){
    for (const m of this.meshes) this.scene.remove(m);
    for (const d of this.disposables) d.dispose && d.dispose();
  }
}

/* ============================================================================
   RIDER — a tired cyclist on a suspended night ribbon. Smooth route follow,
   gentle steering, one meaningful choice, and a designed exhale at the end.
   ========================================================================= */

const CRUISE = 10.5, VMAX = 17.5, VMIN = 0, EYE = 1.58, LAT_MAX = 2.6;

class Rider {
  constructor(plan, route, input, startS){
    this.plan = plan; this.route = route; this.input = input;
    this.s = clamp(startS, 0, plan.L - 6);
    this.speed = 0;
    this.lat = 0; this.latVel = 0;
    this.lane = this._laneForS(this.s);
    this.phase = 'hold';                 // hold -> ride -> overlook
    this.holdT = 2.8;
    this.overlookT = 0;
    this.lookYaw = 0; this.lookPitch = 0;
    this.autoYaw = 0;
    this.rollSm = 0;
    this._fr = makeFrame(); this._frAhead = makeFrame();
    this._camPos = new THREE.Vector3();
    this._camTarget = new THREE.Vector3();
    this.ended = false;
    if (this.lane !== 'base' && this.s > plan.fork.sFork)
      this.committed = true;
    else this.committed = false;
  }

  _laneForS(s){
    const f = this.plan.fork;
    if (s > f.sFork && s < f.sRejoin) return 'inner';   // jump into the fork defaults inner
    return 'base';
  }

  update(dt, worldT){
    const inp = this.input;
    const f = this.plan.fork;

    if (this.phase === 'hold'){
      this.holdT -= dt;
      if (this.holdT <= 0 || inp.keys['KeyW'] || inp.keys['ArrowUp']) this.phase = 'ride';
    }

    /* ---- speed ---------------------------------------------------------- */
    let target = 0;
    if (this.phase === 'ride'){
      target = CRUISE;
      if (inp.keys['KeyW'] || inp.keys['ArrowUp']) target = VMAX;
      if (inp.keys['KeyS'] || inp.keys['ArrowDown']) target = VMIN;
      if (inp.paused) target = 0;
    } else if (this.phase === 'overlook') target = 0;
    const accel = target > this.speed ? 2.6 : 4.2;
    this.speed += clamp(target - this.speed, -accel * dt, accel * dt);

    /* ---- steering ------------------------------------------------------- */
    let steer = 0;
    if (inp.keys['KeyA'] || inp.keys['ArrowLeft']) steer -= 1;
    if (inp.keys['KeyD'] || inp.keys['ArrowRight']) steer += 1;
    /* widened approach lets the rider drift toward a mouth */
    let latRange = LAT_MAX;
    if (this.lane === 'base' && this.s > f.sFork - WIDEN && this.s < f.sFork)
      latRange = this.route.halfWidth(this.s, 'base') - 2.9;
    const steerRate = 3.1;
    this.latVel += (steer * steerRate - this.latVel) * Math.min(1, dt * 6);
    if (this.phase === 'ride' && !inp.paused) this.lat += this.latVel * dt * Math.min(1, this.speed / 4);
    this.lat = clamp(this.lat, -latRange, latRange);

    /* ---- advance & fork mapping ----------------------------------------- */
    if (this.phase !== 'hold' && !inp.paused){
      const prevS = this.s;
      this.s = Math.min(this.s + this.speed * dt, this.plan.L - 0.5);
      /* commit at the split nose: the side you drifted to is the arm you get */
      if (!this.committed && prevS <= f.sFork && this.s > f.sFork){
        const side = this.lat >= 0 ? 1 : -1;
        this.lane = (side === f.side) ? 'outer' : 'inner';
        this.lat = clamp(this.lat - side * FORK_GAP, -LAT_MAX, LAT_MAX);
        this.committed = true;
      }
      /* rejoin: fold back onto the base line */
      if (this.committed && prevS <= f.sRejoin && this.s > f.sRejoin){
        const off = this.route.laneOffset(f.sRejoin - 0.5, this.lane);
        this.lane = 'base';
        this.lat = clamp(this.lat + off.d, -(this.route.halfWidth(this.s, 'base') - 2.9), this.route.halfWidth(this.s, 'base') - 2.9);
        this.committed = false;
      }
      /* after the merge zone, relax back to ordinary bounds */
      if (this.lane === 'base' && (this.s < f.sFork - WIDEN || this.s > f.sRejoin)){
        const hw = this.route.halfWidth(this.s, 'base');
        const lim = Math.min(LAT_MAX + (hw - ROAD_HALF), Math.max(LAT_MAX, hw - 2.9));
        this.lat = clamp(this.lat, -lim, lim);
        if (hw <= ROAD_HALF + 0.01 && Math.abs(this.lat) > LAT_MAX)
          this.lat = lerp(this.lat, clamp(this.lat, -LAT_MAX, LAT_MAX), Math.min(1, dt * 2.5));
      }
      if (this.s >= this.plan.L - 1 && this.phase === 'ride'){
        this.phase = 'overlook';
      }
    }

    if (this.phase === 'overlook'){
      this.overlookT += dt;
      /* gentle rise while the view pans back down the painted Asterline */
      this.rise = smooth(clamp((this.overlookT - 3.0) / 8.0, 0, 1)) * 7.5;
      if (!this.ended && this.overlookT > 2.5) this.ended = true;
    }

    /* ---- look ------------------------------------------------------------ */
    this.lookYaw += (inp.lookX * 0.62 - this.lookYaw) * Math.min(1, dt * 5);
    this.lookPitch += (inp.lookY * 0.34 - this.lookPitch) * Math.min(1, dt * 5);

    /* ---- camera ---------------------------------------------------------- */
    const rt = this.route;
    rt.frameAt(this.s, this.lane, this._fr);
    const ahead = 16 + this.speed * 0.9;
    rt.frameAt(Math.min(this.s + ahead, this.plan.L), this.lane, this._frAhead);
    this._camPos.copy(this._fr.pos)
      .addScaledVector(this._fr.nrm, EYE + (this.rise || 0))
      .addScaledVector(this._fr.right, this.lat);
    this._camTarget.copy(this._frAhead.pos)
      .addScaledVector(this._frAhead.nrm, EYE * 0.92)
      .addScaledVector(this._frAhead.right, this.lat * 0.55);
    if (this.phase === 'overlook' && this.overlookT > 2.0){
      const turn = smooth(clamp((this.overlookT - 2.0) / 9.0, 0, 1));
      rt.frameAt(Math.max(this.s - 64, 0), 'base', this._frAhead);
      this._camTarget.lerp(this._frAhead.pos, turn);
    }

    /* gentle roll into curves, capped well under 2.5 degrees */
    const k = rt.curvatureAt(this.s, this.lane);
    const lean = clamp(-Math.sign(this._fr.right.dot(this._frAhead.tan)) * k * this.speed * this.speed * 0.02, -0.035, 0.035);
    this.rollSm += (lean - this.rollSm) * Math.min(1, dt * 2);
    return {
      s: this.s, lane: this.lane, speed: this.speed,
      camPos: this._camPos, camTarget: this._camTarget,
      yaw: this.lookYaw + this.autoYaw, pitch: this.lookPitch, roll: this.rollSm,
      phase: this.phase,
    };
  }
}

/* ---------------------------------- input ---------------------------------- */
class Input {
  constructor(){
    this.keys = {};
    this.paused = false;
    this.lookX = 0; this.lookY = 0;
    this._drag = null;
    this.onRestart = null; this.onDiag = null; this.onGesture = null;
    this._bound = [];
  }
  bind(){
    const on = (el, ev, fn, opt) => { el.addEventListener(ev, fn, opt); this._bound.push([el, ev, fn]); };
    on(window, 'keydown', (e) => {
      if (e.repeat) return;
      this.keys[e.code] = true;
      if (e.code === 'Space'){ this.paused = !this.paused; e.preventDefault(); }
      if (e.code === 'KeyR' && this.onRestart) this.onRestart();
      if (e.code === 'KeyH' && this.onDiag) this.onDiag();
      if (this.onGesture) this.onGesture();
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
    });
    on(window, 'keyup', (e) => { this.keys[e.code] = false; });
    on(window, 'pointerdown', (e) => {
      this._drag = { x: e.clientX, y: e.clientY, lx: this.lookX, ly: this.lookY };
      if (this.onGesture) this.onGesture();
    });
    on(window, 'pointermove', (e) => {
      if (!this._drag) return;
      this.lookX = clamp(this._drag.lx + (e.clientX - this._drag.x) / innerWidth * 2.4, -1.2, 1.2);
      this.lookY = clamp(this._drag.ly + (e.clientY - this._drag.y) / innerHeight * 1.6, -0.8, 0.8);
    });
    on(window, 'pointerup', () => {
      this._drag = null;
      /* look eases home when released */
    });
    on(window, 'blur', () => { this.keys = {}; this._drag = null; });
  }
  update(dt){
    if (!this._drag){
      this.lookX *= Math.max(0, 1 - dt * 1.6);
      this.lookY *= Math.max(0, 1 - dt * 1.6);
    }
  }
  unbind(){ for (const [el, ev, fn] of this._bound) el.removeEventListener(ev, fn); this._bound = []; }
}

/* ---------------------------------- hud ------------------------------------ */
class Hud {
  constructor(){
    this.el = {
      title: document.getElementById('title'), chapter: document.getElementById('chapter'),
      hint: document.getElementById('hint'), diag: document.getElementById('diag'),
      end: document.getElementById('endcard'), fade: document.getElementById('fade'),
      err: document.getElementById('err'),
    };
    this.lastChapter = -1;
    this.chapterTimer = 0;
    this.diagOn = false;
  }
  boot(){ requestAnimationFrame(() => { this.el.fade.style.opacity = '0'; }); }
  gesture(){ this.el.hint.style.opacity = '0'; }
  showChapter(idx){
    const c = CHAPTERS[idx];
    const roman = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII'][idx];
    this.el.chapter.innerHTML = `${roman} · ${c.name}<em>${c.sub}</em>`;
    this.el.chapter.style.opacity = '0.9';
    this.chapterTimer = 4.6;
  }
  update(dt, chapter, phase){
    if (chapter !== this.lastChapter){
      this.lastChapter = chapter;
      this.showChapter(chapter);
    }
    if (this.chapterTimer > 0){
      this.chapterTimer -= dt;
      if (this.chapterTimer <= 0) this.el.chapter.style.opacity = '0';
    }
    if (phase === 'overlook') this.el.end.style.opacity = '1';
    else this.el.end.style.opacity = '0';
  }
  toggleDiag(){
    this.diagOn = !this.diagOn;
    this.el.diag.style.display = this.diagOn ? 'block' : 'none';
  }
  setDiag(text){ if (this.diagOn) this.el.diag.textContent = text; }
  error(msg){ this.el.err.textContent = msg; this.el.err.style.display = 'block'; }
}

/* ============================================================================
   AUDIO — procedural, gesture-gated, sparse. Silence is part of the score.
   One context, one graph, torn down and rebuilt cleanly on restart.
   ========================================================================= */

class AudioEngine {
  constructor(plan){
    this.plan = plan;
    this.ctx = null;
    this.layers = null;
    this.enabled = false;
    this.oneShots = 0;
    this.beaconPlayed = false;
    this.replyPlayed = false;
  }

  /* first user gesture (or re-arm after restart) */
  start(){
    if (!this.ctx){
      try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { return; }
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    if (this.layers) return;
    const c = this.ctx;
    this.master = c.createGain(); this.master.gain.value = 0.0;
    this.comp = c.createDynamicsCompressor();
    this.comp.threshold.value = -20; this.comp.ratio.value = 6;
    this.master.connect(this.comp).connect(c.destination);
    this.master.gain.setTargetAtTime(0.9, c.currentTime, 2.5);

    const L = this.layers = {};
    /* low orbital hum — two detuned voices through a dark filter */
    L.humGain = c.createGain(); L.humGain.gain.value = 0.0;
    const humF = c.createBiquadFilter(); humF.type = 'lowpass'; humF.frequency.value = 220; humF.Q.value = 0.7;
    const o1 = c.createOscillator(); o1.type = 'sine'; o1.frequency.value = 55;
    const o2 = c.createOscillator(); o2.type = 'triangle'; o2.frequency.value = 82.4 + this.plan.audioPlan.humDetune;
    const o2g = c.createGain(); o2g.gain.value = 0.4;
    o1.connect(humF); o2.connect(o2g).connect(humF);
    humF.connect(L.humGain).connect(this.master);
    const lfo = c.createOscillator(); lfo.frequency.value = 0.05;
    const lfoG = c.createGain(); lfoG.gain.value = 55;
    lfo.connect(lfoG).connect(humF.frequency);
    o1.start(); o2.start(); lfo.start();
    L.humNodes = [o1, o2, lfo];

    /* seeded brownish noise buffer, shared by wind / caravan / clicks */
    if (!this.noiseBuf){
      const nr = new Stream(this.plan.seed, 'real:audioNoise');
      const nbuf = c.createBuffer(1, c.sampleRate * 2, c.sampleRate);
      const nd = nbuf.getChannelData(0);
      let v = 0;
      for (let i = 0; i < nd.length; i++){ v = v * 0.97 + (nr.float() * 2 - 1) * 0.03; nd[i] = v * 8; }
      this.noiseBuf = nbuf;
    }
    const nsrc = c.createBufferSource(); nsrc.buffer = this.noiseBuf; nsrc.loop = true;
    const nf = c.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.value = 620; nf.Q.value = 0.5;
    L.windGain = c.createGain(); L.windGain.gain.value = 0.0;
    nsrc.connect(nf).connect(L.windGain).connect(this.master);
    nsrc.start();
    L.windNodes = [nsrc];

    /* caravan bed — dark rumble with a soft magnetic clack */
    const csrc = c.createBufferSource(); csrc.buffer = this.noiseBuf; csrc.loop = true; csrc.playbackRate.value = 0.4;
    const cf = c.createBiquadFilter(); cf.type = 'lowpass'; cf.frequency.value = 140;
    const clack = c.createOscillator(); clack.type = 'square'; clack.frequency.value = 2.3;
    const clackG = c.createGain(); clackG.gain.value = 0.25;
    L.cavGain = c.createGain(); L.cavGain.gain.value = 0.0;
    csrc.connect(cf).connect(L.cavGain);
    clack.connect(clackG).connect(L.cavGain.gain);
    L.cavGain.connect(this.master);
    csrc.start(); clack.start();
    L.cavNodes = [csrc, clack];

    /* giant subharmonic */
    const g1 = c.createOscillator(); g1.type = 'sine'; g1.frequency.value = 33;
    const g2 = c.createOscillator(); g2.type = 'sine'; g2.frequency.value = 26.2;
    L.giantGain = c.createGain(); L.giantGain.gain.value = 0.0;
    g1.connect(L.giantGain); g2.connect(L.giantGain);
    L.giantGain.connect(this.master);
    g1.start(); g2.start();
    L.giantNodes = [g1, g2];

    this.enabled = true;
  }

  /* short filtered click for a waking gate */
  click(side){
    if (!this.enabled || this.oneShots > 24) return;
    const c = this.ctx, t = c.currentTime;
    const src = c.createBufferSource(); src.buffer = this.noiseBuf;
    src.playbackRate.value = 2.5;
    const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 1900;
    const g = c.createGain();
    g.gain.setValueAtTime(0.11, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
    const nodes = [src, f, g];
    let tail = g;
    if (c.createStereoPanner){
      const p = c.createStereoPanner(); p.pan.value = side * 0.55; nodes.push(p);
      src.connect(f).connect(g).connect(p).connect(this.master);
    } else src.connect(f).connect(g).connect(this.master);
    src.start(t); src.stop(t + 0.12);
    this.oneShots++;
    src.onended = () => { this.oneShots--; for (const n of nodes){ try { n.disconnect(); } catch (e) {} } };
  }

  /* one cairn note of the motif */
  chime(note, side, gainMul = 1, transpose = 0){
    if (!this.enabled || this.oneShots > 24) return;
    const c = this.ctx, t = c.currentTime;
    const f0 = this.plan.audioPlan.root * Math.pow(2, (note + transpose) / 12);
    const o1 = c.createOscillator(); o1.type = 'sine'; o1.frequency.value = f0;
    const o2 = c.createOscillator(); o2.type = 'sine'; o2.frequency.value = f0 * 2.005;
    const o2g = c.createGain(); o2g.gain.value = 0.35;
    const g = c.createGain();
    const amp = 0.085 * this.plan.audioPlan.chimeGain * gainMul;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(amp, 0.001), t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0004, t + 2.9);
    const nodes = [o1, o2, o2g, g];
    o1.connect(g); o2.connect(o2g).connect(g);
    if (c.createStereoPanner){
      const p = c.createStereoPanner(); p.pan.value = side * 0.5; nodes.push(p);
      g.connect(p).connect(this.master);
    } else g.connect(this.master);
    o1.start(t); o2.start(t);
    o1.stop(t + 3.0); o2.stop(t + 3.0);
    this.oneShots++;
    o1.onended = () => { this.oneShots--; for (const n of nodes){ try { n.disconnect(); } catch (e) {} } };
  }

  /* the receiving beacon wakes: a slow chord, then the motif returns */
  beacon(){
    if (!this.enabled || this.beaconPlayed) return;
    this.beaconPlayed = true;
    const c = this.ctx, t = c.currentTime;
    const root = this.plan.audioPlan.root * 0.5;
    for (const [semi, amp, det] of [[0, 0.05, 0], [7, 0.035, 0.4], [12, 0.028, -0.3]]){
      const o = c.createOscillator(); o.type = 'sine';
      o.frequency.value = root * Math.pow(2, semi / 12) + det;
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(amp, t + 11);
      g.gain.exponentialRampToValueAtTime(0.0004, t + 40);
      o.connect(g).connect(this.master);
      o.start(t); o.stop(t + 41);
      o.onended = () => { try { o.disconnect(); g.disconnect(); } catch (e) {} };
    }
    const motif = this.plan.motif;
    for (let i = 0; i < motif.length; i++){
      const note = motif[i], pan = (i % 2) ? 0.4 : -0.4;
      setTimeout(() => this.chime(note, pan, 0.85), 6000 + i * 460);
    }
  }

  /* quick ascending sparkle — arch crossings and spectrum runners */
  arpeggio(transpose = 12, gainMul = 0.5){
    if (!this.enabled) return;
    const degs = [0, 4, 7];
    for (let i = 0; i < 3; i++){
      const d = degs[i], pan = (i - 1) * 0.4;
      setTimeout(() => this.chime(d, pan, gainMul, transpose), i * 130);
    }
  }

  /* the Unsent Reply: an answer from much too far away, much too soon */
  reply(){
    if (!this.enabled || this.replyPlayed) return;
    this.replyPlayed = true;
    const motif = this.plan.motif;
    for (let i = 0; i < motif.length; i++){
      const note = motif[i];
      setTimeout(() => this.chime(note, 0.85, 0.34, 12), i * 300);
    }
  }

  update(dt, st){
    if (!this.enabled) return;
    const T = this.ctx.currentTime;
    const L = this.layers;
    /* chapter-shaped quiet: the viaduct and the afterglow breathe lower */
    const quiet = (st.chapter === 2 || st.chapter === 6) ? 0.5 : 1.0;
    L.humGain.gain.setTargetAtTime(0.040 * quiet * (st.phase === 'hold' ? 0.5 : 1), T, 1.5);
    L.windGain.gain.setTargetAtTime(0.014 * quiet * clamp(st.speed / CRUISE, 0.2, 1.4), T, 1.2);
    L.cavGain.gain.setTargetAtTime(0.15 * st.caravanNear * st.caravanNear, T, 0.4);
    L.giantGain.gain.setTargetAtTime(0.14 * st.giantAudio, T, 2.2);
  }

  /* teardown for restart: keep the context, drop the graph */
  reset(plan){
    this.plan = plan;
    if (this.layers){
      for (const key of ['humNodes', 'windNodes', 'cavNodes', 'giantNodes'])
        for (const n of (this.layers[key] || [])){ try { n.stop(); } catch (e) {} try { n.disconnect(); } catch (e) {} }
      for (const key of ['humGain', 'windGain', 'cavGain', 'giantGain'])
        if (this.layers[key]) { try { this.layers[key].disconnect(); } catch (e) {} }
    }
    if (this.master) { try { this.master.disconnect(); } catch (e) {} }
    if (this.comp) { try { this.comp.disconnect(); } catch (e) {} }
    this.layers = null;
    this.noiseBuf = null;
    this.enabled = false;
    this.beaconPlayed = false; this.replyPlayed = false;
    if (this.ctx) this.start();   // if a gesture already happened, re-arm immediately
  }
}

/* ============================================================================
   WORLD & APP — one renderer, one canvas, one loop, one resize owner, one
   audio graph, one active world. R tears down and rebuilds deterministically.
   ========================================================================= */

class World {
  constructor(scene, seed, input, jumpS){
    this.scene = scene;
    this.plan = buildPlan(seed);
    this.route = new Route(this.plan);
    this._audit();
    this.sky = new SkySystem(this.plan, this.route);
    scene.add(this.sky.group);
    this.road = new RoadSystem(this.plan, this.route, scene);
    this.structs = new StructureSystem(this.plan, this.route, scene);
    this.life = new LifeSystem(this.plan, this.route, scene, this.structs, this.structs.mat);
    this.rider = new Rider(this.plan, this.route, input, jumpS);
    this.road.primeInitial(this.rider.s);
    this.t = 0;
    this.beaconV = 0;
    this.replyT = -1;
    this.gatePtr = this.plan.gates.findIndex(g => g.s - 95 > this.rider.s);
    if (this.gatePtr < 0) this.gatePtr = this.plan.gates.length;
    this.cairnPtr = this.plan.cairns.findIndex(c => c.s > this.rider.s);
    if (this.cairnPtr < 0) this.cairnPtr = this.plan.cairns.length;
    this.archPtr = this.plan.arches.findIndex(a => a.s - 20 > this.rider.s);
    if (this.archPtr < 0) this.archPtr = this.plan.arches.length;
    this.pulse = null;
    this.rushSm = 0;
    this.rodeOnce = false;
    this.beaconPulsed = false;
    this.nanFlag = false;
  }

  _audit(){
    const r = this.plan.route;
    let finite = true;
    for (let i = 0; i < r.n; i++){
      if (!Number.isFinite(r.px[i]) || !Number.isFinite(r.pz[i]) || !Number.isFinite(r.py[i])){ finite = false; break; }
    }
    let maxGrade = 0;
    for (let i = 5; i < r.n; i++){
      const g = Math.abs(r.py[i] - r.py[i - 5]) / (5 * STEP);
      if (g > maxGrade) maxGrade = g;
    }
    let kMax = 0;
    for (let i = 0; i < r.n; i++) if (Math.abs(r.kProf[i]) > kMax) kMax = Math.abs(r.kProf[i]);
    let minR = kMax > 1e-6 ? 1 / kMax : 1e9;
    const f = this.plan.fork;
    for (const lane of ['inner', 'outer']){
      for (let s = f.sFork + 12; s < f.sRejoin - 12; s += 16){
        const k = this.route.curvatureAt(s, lane);
        if (k > 1e-6) minR = Math.min(minR, 1 / k);
      }
    }
    this.audit = { finite, maxGrade, minTurnRadius: minR, selfOk: r.ok };
  }

  update(dt, audio, hud){
    this.t += dt;
    const t = this.t;
    const rs = this.rider.update(dt, t);
    const s = rs.s;
    const chapter = this.route.chapterAt(s);
    const spans = this.plan.spans;
    const amber = smooth((s - spans[6].s0) / Math.max(1, (this.plan.L - spans[6].s0) * 0.55));
    const breath = 0.5 + 0.5 * Math.sin(TAU * t / 12);
    const crown = smooth((s - spans[5].s0) / 260) * (1 - smooth((s - spans[5].s1 + 60) / 260));
    const rushT = clamp((rs.speed - CRUISE) / (VMAX - CRUISE), 0, 1);
    this.rushSm += (rushT - this.rushSm) * Math.min(1, dt * 2.5);

    /* spectrum runners: the first pedal, every arch, and the beacon's answer */
    if (!this.rodeOnce && rs.phase === 'ride'){
      this.rodeOnce = true;
      this.pulse = { s0: s, t0: t, dir: 1 };
    }
    const arches = this.plan.arches;
    while (this.archPtr < arches.length && arches[this.archPtr].s - 20 <= s){
      this.pulse = { s0: arches[this.archPtr].s, t0: t, dir: 1 };
      audio.arpeggio(12, 0.5);
      this.archPtr++;
    }
    let pulseS = -1e6, pulseAmp = 0;
    if (this.pulse){
      const age = t - this.pulse.t0;
      pulseS = this.pulse.s0 + this.pulse.dir * 135 * age;
      pulseAmp = Math.max(0, 1 - age / 3.4) * 1.15;
      if (pulseAmp <= 0) this.pulse = null;
    }

    /* the receiving beacon wakes on distance travelled, never rider power */
    this.beaconV = smooth((s - (spans[6].s0 + 60)) / 420);
    if (this.beaconV > 0.45) audio.beacon();
    if (!this.beaconPulsed && this.beaconV > 0.5){
      this.beaconPulsed = true;
      this.pulse = { s0: this.plan.L, t0: t, dir: -1 };
      audio.arpeggio(19, 0.4);
    }

    /* the Unsent Reply at the overlook */
    let replyV = 0;
    if (this.rider.phase === 'overlook' && this.rider.overlookT > 4.0){
      if (this.replyT < 0){ this.replyT = t; audio.reply(); }
      const ru = (t - this.replyT) / 5.0;
      replyV = ru < 1 ? Math.sin(ru * Math.PI) : 0;
    }

    this.road.update(s, s, breath, amber, this.sky.sunDir, t, crown, this.rushSm, pulseS, pulseAmp);
    this.structs.update(t, dt, this.sky.sunDir, s, breath, amber,
                        Math.max(this.beaconV, replyV * 0.4), this.life.giantDim, this.life.giantPos, crown,
                        this.rushSm, pulseS, pulseAmp);
    this.life.update(t, dt, s, chapter, this.sky.sunDir);
    this.sky.update(dt, t, rs.camPos, {
      missing: this.life.anom.missing, lost: this.life.anom.lost,
      echo: this.life.anom.echo, reply: replyV,
    });

    /* relay clicks + the cairn chorale */
    const gates = this.plan.gates;
    while (this.gatePtr < gates.length && gates[this.gatePtr].s - 95 <= s){
      audio.click(gates[this.gatePtr].side);
      this.gatePtr++;
    }
    const cairns = this.plan.cairns;
    while (this.cairnPtr < cairns.length && cairns[this.cairnPtr].s <= s){
      audio.chime(cairns[this.cairnPtr].note, cairns[this.cairnPtr].side);
      this.cairnPtr++;
    }

    audio.update(dt, {
      chapter, speed: rs.speed, phase: rs.phase,
      caravanNear: this.life.events.caravanNear,
      giantAudio: this.life.events.giantAudio,
    });
    hud.update(dt, chapter, rs.phase);

    if (!Number.isFinite(rs.camPos.x + rs.camPos.y + rs.camPos.z)) this.nanFlag = true;
    return rs;
  }

  dispose(){
    this.scene.remove(this.sky.group);
    this.sky.dispose();
    this.road.dispose();
    this.structs.dispose();
    this.life.dispose();
  }
}

class App {
  constructor(){
    this.canvas = document.getElementById('view');
    this.hud = new Hud();
    let renderer = null;
    try {
      renderer = new THREE.WebGLRenderer({ canvas: this.canvas, antialias: false,
        powerPreference: 'high-performance' });
    } catch (e) {
      this.hud.error('WebGL could not start — this world needs a GPU-capable browser.');
      throw e;
    }
    this.renderer = renderer;
    if (!renderer.capabilities.isWebGL2)
      this.hud.error('WebGL2 unavailable — the Asterline needs it. Trying anyway…');
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.info.autoReset = false;
    this.dpr = Math.min(window.devicePixelRatio || 1, QUALITY.dpr);
    renderer.setPixelRatio(this.dpr);

    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0x050308);
    this.camera = new THREE.PerspectiveCamera(66, 1, 0.3, 60000);

    /* single-sample half-float target: no MSAA gamble, no black frames */
    const rt = new THREE.WebGLRenderTarget(8, 8, { type: THREE.HalfFloatType, samples: 0 });
    this.composer = new EffectComposer(renderer, rt);
    this.renderPass = new RenderPass(this.scene, this.camera);
    this.composer.addPass(this.renderPass);
    if (QUALITY.bloom){
      this.bloom = new UnrealBloomPass(new THREE.Vector2(8, 8), 0.78, 0.42, 0.72);
      this.composer.addPass(this.bloom);
    }
    this.composer.addPass(new OutputPass());

    this.input = new Input();
    this.input.bind();
    this.input.onRestart = () => this.restart();
    this.input.onDiag = () => this.hud.toggleDiag();

    this.audio = null;   // created with the world
    this.world = null;
    this._lastFrameT = 0;
    this.frameTimes = new Float32Array(240);
    this.frameIdx = 0; this.frameCount = 0;
    this.lastDraws = 0; this.lastTris = 0;
    this.diagTimer = 0;
    this.contextLost = false;

    window.addEventListener('resize', () => this.resize());
    this.canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); this.contextLost = true; });
    this.canvas.addEventListener('webglcontextrestored', () => { this.contextLost = false; this.resize(); });
    window.addEventListener('error', (e) => {
      this.hud.error('a fault in the relay: ' + (e.message || 'unknown'));
    });
  }

  buildWorld(){
    this.world = new World(this.scene, CONFIG.seed, this.input, CONFIG.jump);
    if (!this.audio) this.audio = new AudioEngine(this.world.plan);
    this.input.onGesture = () => { this.audio.start(); this.hud.gesture(); };
    this.sceneReady = true;
  }

  restart(){
    if (!this.world) return;
    this.world.dispose();
    this.world = new World(this.scene, CONFIG.seed, this.input, CONFIG.jump);
    this.audio.reset(this.world.plan);
    this.hud.lastChapter = -1;
    this.frameIdx = 0; this.frameCount = 0;
    this._lastFrameT = 0;
  }

  resize(){
    const w = window.innerWidth, h = window.innerHeight;
    this.renderer.setSize(w, h, false);
    this.composer.setSize(w, h);
    this.camera.aspect = w / h;
    this.camera.updateProjectionMatrix();
    if (this.world) this.world.sky.setPixelScale(this.dpr);
  }

  start(){
    this.buildWorld();
    this.resize();
    this.exposeProof();
    this.hud.boot();
    this.renderer.setAnimationLoop(() => this.frame());
  }

  frame(){
    if (this.contextLost) return;
    const nowT = performance.now();
    const dtRaw = this._lastFrameT ? (nowT - this._lastFrameT) / 1000 : 0.016;
    this._lastFrameT = nowT;
    const dt = clamp(dtRaw, 0.0001, 0.05);
    this.input.update(dt);
    const rs = this.world.update(dt, this.audio, this.hud);

    const cam = this.camera;
    cam.position.copy(rs.camPos);
    cam.up.set(0, 1, 0);
    cam.lookAt(rs.camTarget);
    cam.rotateY(-rs.yaw);
    cam.rotateX(-rs.pitch);
    cam.rotateZ(rs.roll);

    this.renderer.info.reset();
    this.composer.render();
    this.lastDraws = this.renderer.info.render.calls;
    this.lastTris = this.renderer.info.render.triangles;

    this.frameTimes[this.frameIdx] = dtRaw * 1000;
    this.frameIdx = (this.frameIdx + 1) % this.frameTimes.length;
    this.frameCount++;

    this.diagTimer -= dt;
    if (this.diagTimer <= 0){ this.diagTimer = 0.5; this.updateDiag(); }
  }

  frameStats(){
    const n = Math.min(this.frameCount, this.frameTimes.length);
    if (!n) return { fps: 0, p50: 0, p95: 0 };
    const a = Array.from(this.frameTimes.subarray(0, n)).sort((x, y) => x - y);
    const sum = a.reduce((p, c) => p + c, 0);
    return {
      fps: Math.round(1000 / (sum / n) * 10) / 10,
      p50: Math.round(a[Math.floor(n * 0.5)] * 100) / 100,
      p95: Math.round(a[Math.min(n - 1, Math.floor(n * 0.95))] * 100) / 100,
    };
  }

  glInfo(){
    try {
      const gl = this.renderer.getContext();
      const ext = gl.getExtension('WEBGL_debug_renderer_info');
      if (ext) return gl.getParameter(ext.UNMASKED_RENDERER_WEBGL);
      return gl.getParameter(gl.RENDERER);
    } catch (e) { return 'unknown'; }
  }

  exposeProof(){
    const app = this;
    const proof = {
      get seed(){ return app.world.plan.seed; },
      get quality(){ return CONFIG.quality; },
      get jump(){ return CONFIG.jump; },
      get planHash(){ return app.world.plan.hashes.planHash; },
      get routeHash(){ return app.world.plan.hashes.routeHash; },
      get forkHash(){ return app.world.plan.hashes.forkHash; },
      get chapterHash(){ return app.world.plan.hashes.chapterHash; },
      get infraHash(){ return app.world.plan.hashes.infraHash; },
      get transitHash(){ return app.world.plan.hashes.transitHash; },
      get ambientHash(){ return app.world.plan.hashes.ambientHash; },
      get rareHash(){ return app.world.plan.hashes.rareHash; },
      get routeLength(){ return app.world.plan.L; },
      get chapterSpans(){ return app.world.plan.spans.map((sp, i) => ({ chapter: CHAPTERS[i].name, s0: sp.s0, s1: sp.s1 })); },
      get fork(){ const f = app.world.plan.fork;
        return { side: f.side, sFork: f.sFork, sRejoin: f.sRejoin,
                 outerOffset: Math.round(f.outerD * 10) / 10, innerOffset: Math.round(f.innerD * 10) / 10 }; },
      get anomalies(){ return { impossible: app.world.plan.anomalies.impossible,
                                subtle: app.world.plan.anomalies.subtle.slice(), unsentReply: true }; },
      get counts(){
        const c = app.world.structs.counts;
        return {
          gates: c.gates, pylons: c.pylons, spectrumArches: c.arches, cairns: c.cairns, satellites: c.sats,
          sails: c.sails, undersidePods: c.pods, trackerObservatories: c.trackers,
          caravans: 3, caravanAModules: app.world.plan.transit.modulesA.length + 1,
          drones: app.world.life.droneCount,
          faunaGroups: app.world.plan.fauna.length,
          faunaRays: app.world.plan.fauna.reduce((a, f) => a + f.n, 0),
          stars: app.world.sky.starCount, motes: QUALITY.motes,
          giantPassagesScheduled: app.world.plan.giants.length,
          meteorsScheduled: app.world.plan.meteors.length,
        };
      },
      get minRoadClearance(){ return Math.round(app.world.structs.minClearance * 100) / 100; },
      get audit(){ return { ...app.world.audit, runtimeNaN: app.world.nanFlag }; },
      get finiteOk(){ return app.world.audit.finite && !app.world.nanFlag; },
      get chunksActive(){ return app.world.road.live.size; },
      get chunksRetained(){ return app.world.road.live.size; },
      get chunksBuiltTotal(){ return app.world.road.built; },
      get chunksDroppedTotal(){ return app.world.road.dropped; },
      get drawCalls(){ return app.lastDraws; },
      get triangles(){ return app.lastTris; },
      get frame(){ return app.frameStats(); },
      get routeDistance(){ return Math.round(app.world.rider.s * 10) / 10; },
      get chapter(){ const c = app.world.route.chapterAt(app.world.rider.s);
        return { index: c + 1, name: CHAPTERS[c].name }; },
      get renderer(){ return app.glInfo(); },
      get resolution(){ return [app.renderer.domElement.width, app.renderer.domElement.height]; },
      get devicePixelRatio(){ return app.dpr; },
      get audioNodes(){ return app.audio ? app.audio.oneShots : 0; },
    };
    Object.defineProperty(window, '__proof', { value: Object.freeze(proof), writable: false, configurable: false });
  }

  updateDiag(){
    if (!this.hud.diagOn) return;
    const p = window.__proof;
    const f = p.frame;
    this.hud.setDiag(
`ASTERLINE RELAY · diagnostics
seed        ${p.seed}   quality ${p.quality}
plan        ${p.planHash}  route ${p.routeHash}  fork ${p.forkHash}
chapters    ${p.chapterHash}  infra ${p.infraHash}  transit ${p.transitHash}
ambient     ${p.ambientHash}  rare ${p.rareHash}
length      ${p.routeLength} m   s ${p.routeDistance}   ch ${p.chapter.index} ${p.chapter.name}
fork        side ${p.fork.side > 0 ? 'R' : 'L'}  ${p.fork.sFork}→${p.fork.sRejoin}
anomalies   ${p.anomalies.impossible} + ${p.anomalies.subtle.join(', ')}
clearance   ${p.minRoadClearance} m   finite ${p.finiteOk}
grade max   ${(p.audit.maxGrade * 100).toFixed(1)}%   minR ${p.audit.minTurnRadius.toFixed(0)} m
chunks      ${p.chunksActive} live · ${p.chunksBuiltTotal} built · ${p.chunksDroppedTotal} dropped
draws       ${p.drawCalls}   tris ${(p.triangles / 1000).toFixed(0)}k
frame       ${f.fps} fps · p50 ${f.p50} ms · p95 ${f.p95} ms
gl          ${String(p.renderer).slice(0, 60)}
res         ${p.resolution.join('×')} @ ${p.devicePixelRatio}x   audio 1-shots ${p.audioNodes}`);
  }
}

/* --------------------------------- boot ------------------------------------ */
const app = new App();
app.start();
window.__app = app;
</script>
</body>
</html>
