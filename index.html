}

/* ============================================================================
   ASTERLINE INFRASTRUCTURE — hand-built orbital carpentry. One geometry kit,
   one lit/emissive material family, archetypes with silhouette, mid-shot and
   close-up detail, merged into region meshes.
   ========================================================================= */

const STRUCT_VERT = `
  attribute vec3 aCol; attribute float aGlow; attribute float aWake; attribute float aS;
  varying vec3 vCol; varying float vGlow; varying float vWake; varying float vS;
  varying vec3 vWorld;
  void main(){
    vCol = aCol; vGlow = aGlow; vWake = aWake; vS = aS;
    vec4 p = vec4(position, 1.0);
    #ifdef USE_INSTANCING
      p = instanceMatrix * p;
    #endif
    vec4 w = modelMatrix * p;
    vWorld = w.xyz;
    gl_Position = projectionMatrix * viewMatrix * w;
  }`;

const STRUCT_FRAG = `
  varying vec3 vCol; varying float vGlow; varying float vWake; varying float vS;
  varying vec3 vWorld;
  uniform vec3 uSun; uniform float uWakeS, uBreath, uAmber, uBeacon, uGiantDim, uTime;
  ${GLSL_PRISM}
  ${GLSL_WAKE}
  void main(){
    vec3 n = normalize(cross(dFdx(vWorld), dFdy(vWorld)));
    float NdL = max(dot(n, uSun), 0.0);
    float fill = max(dot(n, vec3(0.0, -1.0, 0.0)), 0.0);
    vec3 col = vCol * (0.30 + 0.85 * NdL) + vCol * fill * vec3(0.16, 0.05, 0.04);
    float e = vGlow;
    if (vWake > 1.5){
      e *= uBeacon;                                  /* beacon channel: slow neon cycle */
      col += prismColor(uTime * 0.03 + vS * 0.0008, 0.5) * e * 2.2;
    } else if (vWake > 0.5){
      float w = wakeEnv(vS, uWakeS, uBreath);        /* relay channel: rainbow + marquee */
      float mar = 0.82 + 0.18 * sin(uTime * 3.0 + vS * 0.5);
      col += prismColor(vS * 0.0042 + (vS - uWakeS) * 0.0021 + uTime * 0.012, uAmber)
             * e * (0.05 + 1.9 * w) * mar * uGiantDim;
    } else {
      col += vCol * e * uGiantDim;                   /* steady lamps: colour is the lamp */
    }
    gl_FragColor = vec4(col, 1.0);
  }`;

function makeStructMaterial(){
  return new THREE.ShaderMaterial({
    vertexShader: STRUCT_VERT, fragmentShader: STRUCT_FRAG,
    uniforms: {
      uSun: { value: new THREE.Vector3(0, 1, 0) }, uWakeS: { value: -1e5 },
      uBreath: { value: 0 }, uAmber: { value: 0 }, uBeacon: { value: 0 },
      uGiantDim: { value: 1 }, uTime: { value: 0 }, uCrown: { value: 0 },
      uRush: { value: 0 }, uPulseS: { value: -1e6 }, uPulseAmp: { value: 0 },
    },
  });
}

/* colour vocabulary for built things — patinated hulls, never default grey */
const HULL = {
  iron:   new THREE.Color(0x211714), umber: new THREE.Color(0x33221a),
  plum:   new THREE.Color(0x241426), slate: new THREE.Color(0x1a1d22),
  bone:   new THREE.Color(0x6b5f4c), rust:  new THREE.Color(0x4a2618),
  brass:  new THREE.Color(0x54401f),
};

class GeoKit {
  constructor(){ this.pos = []; this.idx = []; this.col = []; this.glow = []; this.wake = []; this.s = []; this.base = 0; }
  prim(geo, m, color, opt = {}){
    const g = geo;
    const p = g.attributes.position;
    const tmp = new THREE.Vector3();
    for (let i = 0; i < p.count; i++){
      tmp.fromBufferAttribute(p, i).applyMatrix4(m);
      this.pos.push(tmp.x, tmp.y, tmp.z);
      this.col.push(color.r, color.g, color.b);
      this.glow.push(opt.glow || 0);
      this.wake.push(opt.wake || 0);
      this.s.push(opt.s || 0);
    }
    if (g.index) for (let i = 0; i < g.index.count; i++) this.idx.push(this.base + g.index.getX(i));
    else for (let i = 0; i < p.count; i++) this.idx.push(this.base + i);
    this.base += p.count;
    if (g !== geo) g.dispose();
    return this;
  }
  box(w, h, d, m, color, opt){ const g = GeoKit.G.box; GeoKit._m.makeScale(w, h, d).premultiply(m);
    return this.prim(g, GeoKit._m, color, opt); }
  /* merge a kit-built geometry, keeping its own colours/glow channels */
  merge(geo, m){
    const p = geo.attributes.position, c = geo.attributes.aCol,
          gl = geo.attributes.aGlow, wk = geo.attributes.aWake, sA = geo.attributes.aS;
    const tmp = new THREE.Vector3();
    for (let i = 0; i < p.count; i++){
      tmp.fromBufferAttribute(p, i).applyMatrix4(m);
      this.pos.push(tmp.x, tmp.y, tmp.z);
      this.col.push(c.getX(i), c.getY(i), c.getZ(i));
      this.glow.push(gl.getX(i)); this.wake.push(wk.getX(i)); this.s.push(sA.getX(i));
    }
    for (let i = 0; i < geo.index.count; i++) this.idx.push(this.base + geo.index.getX(i));
    this.base += p.count;
    return this;
  }
  build(){
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(this.pos), 3));
    g.setAttribute('aCol', new THREE.BufferAttribute(new Float32Array(this.col), 3));
    g.setAttribute('aGlow', new THREE.BufferAttribute(new Float32Array(this.glow), 1));
    g.setAttribute('aWake', new THREE.BufferAttribute(new Float32Array(this.wake), 1));
    g.setAttribute('aS', new THREE.BufferAttribute(new Float32Array(this.s), 1));
    g.setIndex(this.idx);
    g.computeBoundingSphere();
    return g;
  }
}
GeoKit.G = {
  box: new THREE.BoxGeometry(1, 1, 1),
  cyl: new THREE.CylinderGeometry(0.5, 0.5, 1, 8),
  cyl6: new THREE.CylinderGeometry(0.5, 0.5, 1, 6),
  cone: new THREE.ConeGeometry(0.5, 1, 8),
  sph: new THREE.SphereGeometry(0.5, 10, 7),
  oct: new THREE.OctahedronGeometry(0.5, 0),
  dish: new THREE.SphereGeometry(0.5, 12, 6, 0, TAU, 0, 1.05),
  ring: new THREE.TorusGeometry(0.5, 0.035, 6, 28),
  rock: new THREE.DodecahedronGeometry(0.5, 0),
  plane: new THREE.PlaneGeometry(1, 1),
};
GeoKit._m = new THREE.Matrix4();

const M4 = () => new THREE.Matrix4();
const compose = (x, y, z, rx = 0, ry = 0, rz = 0, sx = 1, sy = sx, sz = sx) => {
  const m = M4();
  m.compose(new THREE.Vector3(x, y, z),
            new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz)),
            new THREE.Vector3(sx, sy, sz));
  return m;
};

/* strut: a thin member from a to b */
function strut(kit, a, b, t, color, opt){
  const d = new THREE.Vector3().subVectors(b, a);
  const len = d.length();
  const mid = new THREE.Vector3().addVectors(a, b).multiplyScalar(0.5);
  const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
  const m = M4().compose(mid, q, new THREE.Vector3(t, len, t));
  kit.prim(GeoKit.G.box, m, color, opt);
}

/* ---------------------------- gate archetypes ------------------------------ */
/* local frame: origin on deck centreline at the gate's s. +x = toward gate    */
/* side, +y up, +z along route.                                                */
function buildGate(kit, g, hw){
  const side = g.side, s = g.s;
  const sw = (g.wakeS !== undefined) ? g.wakeS : g.s;   // backward-signal gates mirror their anchor
  const mx = side * (hw + PARA_T + 3.6);                // mast centre, well clear of the deck
  const iron = HULL.iron, umber = HULL.umber, brass = HULL.brass;
  const gold = PAL.gold, prismy = PAL.coral;
  const st = { s };
  if (g.variant === 4){
    /* constellation pylon: tall mast, star lamps, thin vanes */
    kit.prim(GeoKit.G.cyl6, compose(mx, g.h / 2, 0, 0, 0, side * 0.06, 0.55, g.h, 0.55), iron, st);
    kit.prim(GeoKit.G.cyl6, compose(mx, g.h + 0.4, 0, 0, 0, 0, 0.9, 0.8, 0.9), umber, st);
    const rrq = ((s * 7919) % 97) / 97;
    const lampN = 3 + Math.floor(rrq * 3);
    for (let i = 0; i < lampN; i++){
      const hy = g.h * (0.35 + 0.6 * i / lampN);
      const off = Math.sin(i * 2.4 + s) * 1.6;
      strut(kit, new THREE.Vector3(mx, hy, 0), new THREE.Vector3(mx + off, hy + 1.4, 1.2 * Math.cos(i * 1.9)), 0.09, iron, st);
      kit.prim(GeoKit.G.oct, compose(mx + off, hy + 1.5, 1.2 * Math.cos(i * 1.9), 0, 0, 0, 0.42), gold, { glow: 1.6, wake: 1, s: sw });
    }
    kit.box(3.4, 0.12, 0.5, compose(mx, g.h * 0.72, 0), umber, st);
    kit.box(0.5, 0.12, 3.0, compose(mx, g.h * 0.55, 0), umber, st);
    /* footing */
    kit.box(1.6, 0.5, 1.6, compose(mx, 0.22, 0), HULL.slate, st);
    for (const dz of [-0.6, 0.6]) kit.box(0.18, 0.18, 0.18, compose(mx + side * 0.7, 0.14, dz), brass, st);
    return;
  }
  /* signal gate: mast + cantilever arm + aperture ring over the parapet      */
  const armY = g.h, reach = Math.min(g.reach, 5.2);
  const tipX = mx - side * (reach + 1.5);
  kit.box(0.7, armY + 1.2, 0.9, compose(mx, (armY + 1.2) / 2, 0), iron, st);
  kit.box(0.86, 1.1, 1.06, compose(mx, armY * 0.45, 0), umber, st);           // junction box
  kit.box(0.2, 0.3, 0.2, compose(mx + side * 0.45, armY * 0.45 + 0.4, 0.4), brass, st);
  strut(kit, new THREE.Vector3(mx, armY, 0), new THREE.Vector3(tipX, armY + 0.5, 0), 0.34, iron, st);
  strut(kit, new THREE.Vector3(mx, armY - 2.2, 0), new THREE.Vector3(tipX + side * 1.2, armY + 0.28, 0), 0.14, umber, st); // tension brace
  /* counterweight lattice */
  const back = mx + side * 1.9;
  strut(kit, new THREE.Vector3(mx, armY, 0), new THREE.Vector3(back, armY - 1.1, 0), 0.2, iron, st);
  kit.box(1.0, 1.5, 1.3, compose(back, armY - 1.9, 0), HULL.slate, st);
  /* aperture at the tip — the part that wakes */
  const ringR = 0.9 + (g.variant * 0.22);
  kit.prim(GeoKit.G.ring, compose(tipX, armY + 0.5, 0, Math.PI / 2, 0, 0, ringR * 2), umber, st);
  kit.prim(GeoKit.G.cyl, compose(tipX, armY + 0.5, 0, Math.PI / 2, 0, 0, ringR * 1.5, 0.08, ringR * 1.5), prismy, { glow: 1.3, wake: 1, s: sw });
  if (g.variant >= 2){  /* twin aperture */
    kit.prim(GeoKit.G.ring, compose(tipX + side * 1.4, armY + 0.1, 0, Math.PI / 2, 0, 0, ringR * 1.2), umber, st);
    kit.prim(GeoKit.G.cyl, compose(tipX + side * 1.4, armY + 0.1, 0, Math.PI / 2, 0, 0, ringR * 0.85, 0.08, ringR * 0.85), PAL.gold, { glow: 1.0, wake: 1, s: sw });
  }
  /* small steady service lamp + hatch + fasteners (close-up read) */
  kit.prim(GeoKit.G.oct, compose(mx - side * 0.5, 1.6, 0.3, 0, 0, 0, 0.16), PAL.gold, { glow: 0.9, s });
  kit.box(0.5, 0.7, 0.06, compose(mx - side * 0.36, 1.0, 0, 0, side * Math.PI / 2, 0), HULL.slate, st);
  for (const dy of [0.35, 0.75]) kit.box(0.09, 0.09, 0.09, compose(mx, dy + 0.2, 0.5), brass, st);
  /* footing clamps under the deck edge */
  const clampX = side * (hw - 0.4);
  strut(kit, new THREE.Vector3(mx, 0.1, 0), new THREE.Vector3(clampX, -1.6, 0), 0.3, iron, st);
  kit.box(1.2, 0.4, 1.6, compose(mx, -0.15, 0), HULL.slate, st);
}

/* ---------------------------- cairn: the chorale --------------------------- */
function buildCairn(kit, c, hw){
  const side = c.side, s = c.s;
  const bx = side * (hw + PARA_T + 4.05);
  const st = { s };
  /* outrigger balcony held clear of the protected corridor */
  kit.box(2.2, 0.16, 2.6, compose(bx, -0.10, 0), HULL.slate, st);
  strut(kit, new THREE.Vector3(side * (hw - 0.2), -1.5, 0.8), new THREE.Vector3(bx, -0.2, 0.8), 0.14, HULL.iron, st);
  strut(kit, new THREE.Vector3(side * (hw - 0.2), -1.5, -0.8), new THREE.Vector3(bx, -0.2, -0.8), 0.14, HULL.iron, st);
  kit.box(0.1, 0.5, 2.4, compose(bx + side * 1.02, 0.24, 0), HULL.iron, st);
  /* stacked stones */
  let y = 0.0;
  const rrq = (n) => ((s * 131 + n * 61) % 89) / 89;
  for (let i = 0; i < c.stones; i++){
    const sc = 0.62 - i * 0.11;
    y += sc * 0.30;
    kit.prim(GeoKit.G.rock,
      compose(bx + (rrq(i) - 0.5) * 0.16, y, (rrq(i + 3) - 0.5) * 0.16, rrq(i) * 3, rrq(i + 1) * 3, 0, sc, sc * 0.62, sc),
      i % 2 ? HULL.umber : HULL.bone, st);
    y += sc * 0.24;
  }
  /* the throat lantern — sings when the wake passes */
  kit.prim(GeoKit.G.oct, compose(bx, y + 0.22, 0, 0, 0, 0, 0.20), PAL.gold, { glow: 2.0, wake: 1, s });
  /* song shard: a slender light column that keeps the note */
  kit.prim(GeoKit.G.oct, compose(bx, y + 2.0, 0, 0, 0, 0, 0.20, 2.1, 0.20), PAL.bone, { glow: 1.5, wake: 1, s });
}

/* ---------------------------- satellite archetypes ------------------------- */
function buildSatGeo(variant, seed){
  const kit = new GeoKit();
  const rr = new Stream(seed, 'real:satgeo' + variant);
  const iron = HULL.iron, umber = HULL.umber, slate = HULL.slate, plum = HULL.plum;
  const winC = PAL.gold;
  const winRow = (x, y, z, n, dz, g = 0.75) => {
    for (let i = 0; i < n; i++) kit.box(0.16, 0.30, 0.10, compose(x, y, z + i * dz), winC, { glow: g });
  };
  if (variant === 0){ /* comm hub */
    kit.box(2.6, 2.2, 3.4, compose(0, 0, 0), iron);
    kit.box(2.8, 0.3, 3.6, compose(0, 1.15, 0), umber);
    for (const sd of [-1, 1]){
      strut(kit, new THREE.Vector3(sd * 1.3, 0, 0), new THREE.Vector3(sd * 3.1, 0.2, 0), 0.16, umber);
      kit.box(3.6, 0.08, 1.7, compose(sd * 5.0, 0.25, 0, 0, 0, sd * 0.12), plum);
      kit.box(3.7, 0.05, 0.12, compose(sd * 5.0, 0.30, 0.8, 0, 0, sd * 0.12), HULL.brass);
    }
    kit.prim(GeoKit.G.dish, compose(0, 2.2, 0.6, -1.1, 0, 0, 2.4), slate);
    strut(kit, new THREE.Vector3(0, 1.1, 0.4), new THREE.Vector3(0, 2.1, 0.6), 0.14, umber);
    strut(kit, new THREE.Vector3(0, -1.1, 0), new THREE.Vector3(0, -3.4, -0.6), 0.10, iron);
    kit.prim(GeoKit.G.oct, compose(0, -3.6, -0.65, 0, 0, 0, 0.3), PAL.raspberry, { glow: 0.8 });
    winRow(1.31, 0.2, -1.2, 5, 0.6);
  } else if (variant === 1){ /* observatory */
    kit.prim(GeoKit.G.cyl, compose(0, 0, 0, 0, 0, 0, 3.0, 2.2, 3.0), iron);
    kit.prim(GeoKit.G.sph, compose(0, 1.6, 0, 0, 0, 0, 2.6), umber);
    kit.prim(GeoKit.G.cyl, compose(0.4, 2.6, 0.4, 0.7, 0, 0.5, 0.7, 2.6, 0.7), slate);
    kit.box(0.16, 1.2, 2.62, compose(0, 1.8, 0), plum);      // dome slit
    for (let i = 0; i < 4; i++){
      const a = i * TAU / 4 + 0.4;
      strut(kit, new THREE.Vector3(Math.cos(a) * 1.4, -1.1, Math.sin(a) * 1.4),
                 new THREE.Vector3(Math.cos(a) * 2.3, -2.8, Math.sin(a) * 2.3), 0.13, iron);
    }
    winRow(1.52, -0.3, -1.0, 4, 0.66, 0.6);
    kit.prim(GeoKit.G.oct, compose(0, 3.9, 0.8, 0, 0, 0, 0.22), PAL.teal, { glow: 0.9 });
  } else if (variant === 2){ /* relay node */
    kit.prim(GeoKit.G.oct, compose(0, 0, 0, 0, 0, 0, 2.6), iron);
    kit.prim(GeoKit.G.oct, compose(0, 0, 0, 0, 0, 0, 1.6, 2.9, 1.6), umber);
    for (const [rx, rz, sc] of [[Math.PI / 2, 0, 4.4], [1.9, 0.5, 5.6], [1.2, -0.7, 6.6]])
      kit.prim(GeoKit.G.ring, compose(0, 0, 0, rx, 0, rz, sc), slate);
    for (let i = 0; i < 5; i++){
      const a = i * TAU / 5;
      strut(kit, new THREE.Vector3(0, 0, 0), new THREE.Vector3(Math.cos(a) * 3.4, Math.sin(a * 2) * 1.4, Math.sin(a) * 3.4), 0.08, umber);
    }
    kit.prim(GeoKit.G.sph, compose(0, 1.9, 0, 0, 0, 0, 0.5), PAL.coral, { glow: 0.7 });
  } else if (variant === 3){ /* habitat can */
    kit.prim(GeoKit.G.cyl, compose(0, 0, 0, 0, 0, Math.PI / 2, 2.4, 6.4, 2.4), iron);
    kit.prim(GeoKit.G.cyl, compose(3.4, 0, 0, 0, 0, Math.PI / 2, 1.5, 1.2, 1.5), umber);
    kit.prim(GeoKit.G.cyl, compose(-3.5, 0, 0, 0, 0, Math.PI / 2, 2.55, 0.5, 2.55), umber);
    for (const sd of [-1, 1]) kit.box(2.6, 0.06, 3.4, compose(0.4, sd * 1.9, 0, 0.5 * sd, 0, 0), plum);   // radiators
    winRow(0.8, 0.6, -1.05, 4, 0.7); winRow(-1.4, 0.6, -1.05, 3, 0.7);
    kit.box(0.4, 0.6, 0.4, compose(1.4, 1.35, 0.6), slate);
    kit.prim(GeoKit.G.oct, compose(4.2, 0, 0, 0, 0, 0, 0.24), PAL.gold, { glow: 1.0 });
  } else if (variant === 4){ /* array raft */
    kit.box(7.0, 0.24, 1.1, compose(0, 0, 0), iron);
    for (let i = 0; i < 5; i++){
      const x = -2.8 + i * 1.4;

      kit.box(1.15, 1.5, 0.07, compose(x, 1.9, 0, 0.15, 0, 0), plum);
      kit.box(1.2, 0.08, 0.09, compose(x, 1.25, 0.02, 0.15, 0, 0), HULL.brass);

    strut(kit, new THREE.Vector3(-3.5, 0, 0), new THREE.Vector3(-4.8, -1.4, 0.4), 0.12, iron);
    kit.prim(GeoKit.G.dish, compose(-5.1, -1.7, 0.5, -2.2, 0, 0, 1.6), slate);
    kit.prim(GeoKit.G.oct, compose(3.6, -0.3, 0, 0, 0, 0, 0.2), PAL.raspberry, { glow: 0.7 });
  } else { /* derelict */
    kit.box(2.8, 2.0, 2.4, compose(0, 0, 0, 0.3, 0.2, 0.5), iron);
    kit.box(2.9, 0.5, 0.6, compose(0.4, 1.1, 0.4, 0.3, 0.2, 0.5), HULL.rust);
    kit.box(3.2, 0.07, 1.5, compose(2.4, -0.6, 0, 0.2, 0.4, 1.1), plum);
    strut(kit, new THREE.Vector3(0.6, -0.8, 0.3), new THREE.Vector3(1.6, -2.6, 1.1), 0.06, HULL.rust);
    strut(kit, new THREE.Vector3(1.6, -2.6, 1.1), new THREE.Vector3(1.2, -4.0, 1.6), 0.05, HULL.rust);
    kit.prim(GeoKit.G.dish, compose(-1.6, 0.9, -0.6, 2.6, 0.5, 0, 1.9), slate);
    /* one stubborn little window still lit */
    kit.box(0.16, 0.3, 0.1, compose(1.42, -0.3, 0.6), PAL.gold, { glow: 0.55 });
  }
  /* shared close-up garnish: seams + fasteners */
  for (let i = 0; i < 4; i++)
    kit.box(0.1, 0.1, 0.1, compose(rr.range(-1.2, 1.2), rr.range(-0.9, 0.9), rr.range(-1.2, 1.2)), HULL.brass);
  return kit.build();
}

/* --------------------------- station builders ------------------------------ */
function buildDepartStation(kit, plan, route){
  const fr = makeFrame(); const st = plan.stations.depart;
  const iron = HULL.iron, umber = HULL.umber, slate = HULL.slate;
  /* portal gantries over the first stretch — the enclosure that teaches scale */
  for (let i = 0; i < st.gantries; i++){
    const s = 14 + i * (110 / st.gantries) + (i % 2) * 4;
    route.frameAt(s, 'base', fr);
    const w = st.width / 2 - i * 0.8, h = 9.5 - i * 0.35;
    const L0 = fr.pos.clone().addScaledVector(fr.right, -w);
    const R0 = fr.pos.clone().addScaledVector(fr.right, w);
    const Lt = L0.clone().addScaledVector(fr.nrm, h), Rt = R0.clone().addScaledVector(fr.nrm, h);
    strut(kit, L0.clone().addScaledVector(fr.nrm, -3), Lt, 0.55, iron, { s });
    strut(kit, R0.clone().addScaledVector(fr.nrm, -3), Rt, 0.55, iron, { s });
    strut(kit, Lt, Rt, 0.5, umber, { s });
    strut(kit, Lt.clone().addScaledVector(fr.nrm, -1.2), Rt.clone().addScaledVector(fr.nrm, -1.2), 0.16, iron, { s });
    const mid = Lt.clone().lerp(Rt, 0.5);
    kit.prim(GeoKit.G.box, M4().compose(mid.clone().addScaledVector(fr.nrm, -0.65),
      new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(1, 0, 0), fr.right.clone()), new THREE.Vector3(2.2, 0.8, 0.8)), slate, { s });
    kit.prim(GeoKit.G.oct, M4().compose(mid.clone().addScaledVector(fr.nrm, -1.3), new THREE.Quaternion(), new THREE.Vector3(0.26, 0.26, 0.26)), PAL.gold, { glow: 0.9, wake: 1, s });
  }
  /* side repair platforms with dead instruments */
  for (let i = 0; i < st.platforms + 2; i++){
    const s = 20 + i * 34;
    route.frameAt(s, 'base', fr);
    const sd = (i % 2) ? 1 : -1;
    const px = 12 + (i % 3) * 3;
    const base = fr.pos.clone().addScaledVector(fr.right, sd * px);
    const put = (dx, dy, dz, w, h, d, c, opt) => {
      const p = base.clone().addScaledVector(fr.right, dx).addScaledVector(fr.nrm, dy).addScaledVector(fr.tan, dz);
      kit.prim(GeoKit.G.box, M4().compose(p, new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(1, 0, 0), fr.right.clone()), new THREE.Vector3(w, h, d)), c, opt || { s });
    };
    put(0, -0.3, 0, 8.5, 0.4, 12, slate);
    put(0, -2.6, 0, 1.2, 4.5, 1.2, iron);
    put(2.2, 0.6, 2.0, 1.4, 1.4, 2.0, umber);
    put(-1.8, 0.5, -3.0, 0.9, 1.1, 0.9, iron);
    put(2.2, 1.5, 2.0, 1.0, 0.5, 1.6, HULL.plum);
    put(-1.5, 0.9, 3.8, 0.16, 1.6, 0.16, HULL.rust);
    /* one dark instrument screen, faint teal — dead but not gone */
    put(0.4, 1.0, -1.2, 0.06, 0.8, 1.3, PAL.teal, { glow: 0.16, s });
  }
  /* the monumental dead departure relay behind the rider */
  route.frameAt(4, 'base', fr);
  const back = fr.pos.clone().addScaledVector(fr.tan, -95).addScaledVector(fr.right, 26);
  const q0 = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(1, 0, 0), fr.right.clone());
  const put2 = (dx, dy, dz, w, h, d, c, opt) => {
    const p = back.clone().add(new THREE.Vector3(dx, dy, dz));
    kit.prim(GeoKit.G.box, M4().compose(p, q0, new THREE.Vector3(w, h, d)), c, opt);
  };
  put2(0, 22, 0, 7, 78, 7, iron);
  put2(0, 55, 0, 11, 5, 11, umber);
  put2(0, 34, 0, 14, 2.5, 3, umber);
  kit.prim(GeoKit.G.ring, M4().compose(back.clone().add(new THREE.Vector3(0, 66, 0)), q0, new THREE.Vector3(34, 34, 34)), slate);
  kit.prim(GeoKit.G.ring, M4().compose(back.clone().add(new THREE.Vector3(0, 66, 0)), q0, new THREE.Vector3(26, 26, 26)), HULL.plum);

    new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.PI / 2, 0, 0)), new THREE.Vector3(21, 0.4, 21)), PAL.raspberry, { glow: 0.05 });

function buildReceiveStation(kit, plan, route){
  const st = plan.stations.receive;
  const fr = makeFrame();
  route.frameAt(plan.L - 4, 'base', fr);
  const C = fr.pos.clone().addScaledVector(fr.tan, 210).addScaledVector(fr.right, st.tilt * 160);
  C.y += 20;
  const q0 = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(1, 0, 0), fr.right.clone());
  const iron = HULL.iron, umber = HULL.umber, slate = HULL.slate;
  const P = (v) => C.clone().add(v);
  /* central spire */
  kit.prim(GeoKit.G.box, M4().compose(P(new THREE.Vector3(0, st.spireH * 0.5 - 40, 0)), q0, new THREE.Vector3(10, st.spireH, 10)), iron);
  kit.prim(GeoKit.G.box, M4().compose(P(new THREE.Vector3(0, st.spireH - 36, 0)), q0, new THREE.Vector3(16, 7, 16)), umber);
  kit.prim(GeoKit.G.cone, M4().compose(P(new THREE.Vector3(0, st.spireH - 26, 0)), q0, new THREE.Vector3(6, 14, 6)), umber);
  /* rings — each tilted differently: the station's signature */
  for (let r = 0; r < st.rings; r++){
    const rr2 = st.ringR * (1 - r * 0.22);
    const y = st.spireH * (0.24 + 0.3 * r) - 40;
    const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.PI / 2 + (r % 2 ? 0.24 : -0.14) + st.tilt, r * 0.8, 0));
    kit.prim(GeoKit.G.ring, M4().compose(P(new THREE.Vector3(0, y, 0)), q, new THREE.Vector3(rr2 * 2, rr2 * 2, rr2 * 2)), r % 2 ? slate : umber);
    for (let k2 = 0; k2 < 8; k2++){
      const a = k2 * TAU / 8 + r;
      const lp = new THREE.Vector3(Math.cos(a) * rr2, y, Math.sin(a) * rr2).applyQuaternion(new THREE.Quaternion().setFromEuler(new THREE.Euler((r % 2 ? 0.24 : -0.14) + st.tilt, 0, 0)));
      kit.prim(GeoKit.G.oct, M4().compose(P(lp), q0, new THREE.Vector3(1.5, 1.5, 1.5)), PAL.gold, { glow: 0.35, wake: 2 });
    }
  }
  /* cantilever arms with dishes */
  for (let a2 = 0; a2 < st.armN; a2++){
    const ang = a2 * TAU / st.armN + 0.5;
    const dir = new THREE.Vector3(Math.cos(ang), 0.12, Math.sin(ang));
    const tip = P(dir.clone().multiplyScalar(st.ringR * 1.35).add(new THREE.Vector3(0, 30, 0)));
    strut(kit, P(new THREE.Vector3(0, 32, 0)), tip, 2.2, iron);
    strut(kit, P(new THREE.Vector3(0, 62, 0)), tip, 0.8, umber);
    kit.prim(GeoKit.G.box, M4().compose(tip, q0, new THREE.Vector3(6, 4, 6)), slate);
    if (a2 < st.dishN)
      kit.prim(GeoKit.G.dish, M4().compose(tip.clone().add(new THREE.Vector3(0, 4, 0)),
        new THREE.Quaternion().setFromEuler(new THREE.Euler(-0.9, ang, 0)), new THREE.Vector3(9, 9, 9)), HULL.plum);
    /* window rhythm along the arm */
    for (let w = 1; w < 5; w++){
      const wp = P(new THREE.Vector3(0, 32, 0)).lerp(tip, w / 5);
      kit.prim(GeoKit.G.box, M4().compose(wp.clone().add(new THREE.Vector3(0, -1.6, 0)), q0, new THREE.Vector3(0.5, 0.9, 0.5)), PAL.gold, { glow: 0.30, wake: 2 });
    }
  }
  /* the receiving aperture — dead raspberry until the beacon wakes */
  const ap = P(new THREE.Vector3(0, st.spireH * 0.62 - 40, 0));
  kit.prim(GeoKit.G.ring, M4().compose(ap, q0, new THREE.Vector3(st.apertureR * 2.4, st.apertureR * 2.4, st.apertureR * 2.4)), umber);
  kit.prim(GeoKit.G.cyl, M4().compose(ap, new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.PI / 2, 0, 0)).premultiply(q0), new THREE.Vector3(st.apertureR * 1.9, 0.6, st.apertureR * 1.9)), PAL.raspberry, { glow: 0.5, wake: 2 });
  kit.prim(GeoKit.G.cyl, M4().compose(ap, new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.PI / 2, 0, 0)).premultiply(q0), new THREE.Vector3(st.apertureR * 2.2, 0.2, st.apertureR * 2.2)), PAL.raspberry, { glow: 0.06 });
  /* side lobes / precinct sheds near the overlook */
  for (let i = 0; i <= st.sideLobes; i++){
    route.frameAt(plan.L - 60 - i * 55, 'base', fr);
    const sd = i % 2 ? 1 : -1;
    const b = fr.pos.clone().addScaledVector(fr.right, sd * (16 + i * 4));
    kit.prim(GeoKit.G.box, M4().compose(b.clone().addScaledVector(fr.nrm, 1.4), q0, new THREE.Vector3(6, 3.4, 9)), iron, { s: plan.L - 60 - i * 55 });
    kit.prim(GeoKit.G.dish, M4().compose(b.clone().addScaledVector(fr.nrm, 4.4),
      new THREE.Quaternion().setFromEuler(new THREE.Euler(-0.7, sd, 0)), new THREE.Vector3(4, 4, 4)), slate);
    kit.prim(GeoKit.G.box, M4().compose(b.clone().addScaledVector(fr.nrm, 2.2).addScaledVector(fr.right, sd * -3.04), q0, new THREE.Vector3(0.1, 0.5, 1.1)), PAL.gold, { glow: 0.4, wake: 2 });
  }
}

/* spectrum arch: a full overhead celebration ring. every point of the arc
   sits exactly a.r >= 10.6 m from the centreline, outside the protected
   corridor by construction. legs end in floating counter-pods.             */
function buildSpectrumArch(kit, a){
  const iron = HULL.iron, umber = HULL.umber;
  const torus = new THREE.TorusGeometry(a.r, 0.26, 6, 40, Math.PI);
  kit.prim(torus, compose(0, 0, 0), iron, { s: a.s });
  torus.dispose();
  const inner = new THREE.TorusGeometry(a.r - 0.02, 0.09, 4, 40, Math.PI);
  kit.prim(inner, compose(0, 0, 0.30), umber, { s: a.s });
  kit.prim(inner, compose(0, 0, -0.30), umber, { s: a.s });
  inner.dispose();
  /* rainbow beads + glow slats along the arc, hue graded by pseudo-s */
  const N = 15;
  for (let i = 0; i < N; i++){
    const th = (0.06 + 0.88 * i / (N - 1)) * Math.PI;
    const x = Math.cos(th) * a.r, y = Math.sin(th) * a.r;
    kit.prim(GeoKit.G.oct, compose(x, y, 0, 0, 0, th, 0.34), PAL.gold,
             { glow: 1.7, wake: 1, s: a.s + i * 10.5 });
    kit.box(1.5, 0.13, 0.13, compose(Math.cos(th + 0.055) * (a.r - 0.42), Math.sin(th + 0.055) * (a.r - 0.42), 0, 0, 0, th + 0.055 + Math.PI / 2), PAL.bone,
            { glow: 1.0, wake: 1, s: a.s + i * 10.5 + 5.0 });
  }
  for (const sd of [-1, 1]){
    kit.box(0.7, 2.6, 0.7, compose(sd * a.r, -1.3, 0), iron, { s: a.s });
    kit.box(1.6, 1.1, 1.6, compose(sd * a.r, -3.0, 0), HULL.slate, { s: a.s });
    kit.prim(GeoKit.G.oct, compose(sd * a.r, -3.8, 0, 0, 0, 0, 0.3), PAL.teal, { glow: 0.9, s: a.s });
  }
}

/* the twin lantern gates that announce the fork */
function buildForkFurniture(kit, plan, route){
  const f = plan.fork; const fr = makeFrame();

      kit.prim(GeoKit.G.box, M4().compose(b.clone().addScaledVector(fr.nrm, 6.4),
        new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(1, 0, 0), fr.right.clone()), new THREE.Vector3(0.3, 2.2, 1.4)), HULL.umber, { s });
      kit.prim(GeoKit.G.box, M4().compose(b.clone().addScaledVector(fr.nrm, 6.4).addScaledVector(fr.right, sd * -0.2),

      kit.prim(GeoKit.G.oct, M4().compose(b.clone().addScaledVector(fr.nrm, 5.9), new THREE.Quaternion(), new THREE.Vector3(0.6, 0.85, 0.6)), PAL.gold, { glow: 1.5, wake: 1, s });
    }
