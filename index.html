<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================================================
   THE DROWNED MERIDIAN
   A seeded underwater ceremonial cycling causeway.
   One file. No assets. Deterministic plan, quality-free truth.
   ============================================================ */

// ---------- configuration ----------
const URLQ = new URLSearchParams(location.search);
const SEED = (URLQ.get('seed') || 'DROWNED-MERIDIAN-01').slice(0, 64);
const QUALITY = (() => {
  const q = (URLQ.get('quality') || 'standard').toLowerCase();
  return (q === 'low' || q === 'high') ? q : 'standard';
})();
const QF = { low: 0, standard: 1, high: 2 }[QUALITY]; // quality factor index

// ---------- palette (the seven colors) ----------
const PAL = {
  ink:      new THREE.Color('#050a12'),  // abyss ink
  petrol:   new THREE.Color('#0d3745'),  // deep petrol blue
  turquoise:new THREE.Color('#3f9184'),  // oxidized turquoise
  olive:    new THREE.Color('#6b7a3c'),  // algae olive
  marble:   new THREE.Color('#cfd6c8'),  // moonlit marble
  ember:    new THREE.Color('#d4694a'),  // coral ember
  gold:     new THREE.Color('#ffd98a'),  // bioluminescent gold
};

// ---------- deterministic PRNG ----------
function xmur3(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return function () {
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    return (h ^= h >>> 16) >>> 0;
  };
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// Named deterministic streams. stream('route'), stream('chunk:12:coral') ...
function stream(name) {
  const g = xmur3(SEED + '::' + name);
  return mulberry32(g());
}
function streamInt(name) { return xmur3(SEED + '::' + name)(); }
// helpers over a stream fn
const rr  = (rng, a, b) => a + (b - a) * rng();
const ri  = (rng, a, b) => Math.floor(rr(rng, a, b + 1));
const rpick = (rng, arr) => arr[Math.min(arr.length - 1, Math.floor(rng() * arr.length))];

// ---------- FNV-1a hashing of plan truth ----------
function mkHasher() {
  let h = 0x811c9dc5;
  const eat = (b) => { h ^= b & 255; h = Math.imul(h, 0x01000193); };
  return {
    f(v) { const q = Math.round(v * 1000) | 0; eat(q); eat(q >>> 8); eat(q >>> 16); eat(q >>> 24); return this; },
    s(str) { for (let i = 0; i < str.length; i++) eat(str.charCodeAt(i)); return this; },
    get() { return (h >>> 0).toString(16).padStart(8, '0'); }
  };
}

// ---------- deterministic lattice value-noise (JS side, world truth) ----------
function makeNoise2(seedName) {
  const S = streamInt(seedName) | 1;
  function lat(ix, iz) {
    let h = Math.imul(ix, 374761393) + Math.imul(iz, 668265263) + S;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }
  function n2(x, z) {
    const ix = Math.floor(x), iz = Math.floor(z);
    const fx = x - ix, fz = z - iz;
    const ux = fx * fx * (3 - 2 * fx), uz = fz * fz * (3 - 2 * fz);
    const a = lat(ix, iz), b = lat(ix + 1, iz), c = lat(ix, iz + 1), d = lat(ix + 1, iz + 1);
    return (a + (b - a) * ux + (c - a) * uz + (a - b - c + d) * ux * uz) * 2 - 1;
  }
  n2.fbm = function (x, z, oct = 4, lac = 2.02, gain = 0.5) {
    let s = 0, amp = 0.5, f = 1;
    for (let i = 0; i < oct; i++) { s += amp * n2(x * f, z * f); f *= lac; amp *= gain; }
    return s;
  };
  return n2;
}

// ---------- small math helpers ----------
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const TAU = Math.PI * 2;

// reusable scratch vectors (no per-frame allocation)
const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _v3 = new THREE.Vector3();
const _v4 = new THREE.Vector3(), _q1 = new THREE.Quaternion(), _m1 = new THREE.Matrix4();
const _e1 = new THREE.Euler(), _c1 = new THREE.Color();

/* ============================================================
   PLAN — all world truth flows from named seed streams.
   Quality never touches anything in this section.
   ============================================================ */

const CHUNK_LEN = 210;           // route metres per chunk
const ROAD_W = 10.8;             // road width
const CLEAR_R = 8.4;             // sovereign clear radius from each arm centerline
const EYE_H = 1.58;

// ---------- route ----------
const ROUTE = (() => {
  const rng = stream('route');
  const L = 6600 + rng() * 1900;                       // 6.6–8.5 km
  const step = 2;
  const n = Math.ceil(L / step) + 1;

  // chapter spans (fractions jittered, renormalized)
  const baseFr = [0.115, 0.115, 0.16, 0.18, 0.115, 0.155, 0.155];
  const names = ['The Sunlit Descent', 'The Kelp Gate', 'The Column Forest',
    'The Divided Current', 'The Amphitheater of Echoes', 'The Abyssal Crossing',
    'The Temple of the Last Tide'];
  const fr = baseFr.map(f => f * (1 + (rng() - 0.5) * 0.22));
  const fs = fr.reduce((a, b) => a + b, 0);
  const chapters = []; let acc = 0;
  for (let i = 0; i < 7; i++) {
    const w = fr[i] / fs * L;
    chapters.push({ i, name: names[i], s0: acc, s1: acc + w });
    acc += w;
  }
  chapters[6].s1 = L;

  const chapterAt = (s) => {
    for (let i = 6; i >= 0; i--) if (s >= chapters[i].s0) return chapters[i];
    return chapters[0];
  };

  // curvature limits per chapter (radius comfort)
  const kMaxFor = (s) => {
    const c = chapterAt(s).i;
    if (s < 150) return 0.0004;                        // poster straight
    if (s > L - 260) return 0.002;                     // calm arrival
    if (c === 5) return 1 / 150;                       // abyss: long sweeps
    if (c === 3) return 1 / 110;                       // fork zone gentler
    return 1 / 72;
  };

  // heading random-walk with eased curvature targets
  const px = new Float64Array(n), pz = new Float64Array(n);
  const tx = new Float64Array(n), tz = new Float64Array(n);
  const kap = new Float64Array(n);
  let theta = 0, k = 0, kTarget = 0, nextChange = 130;
  let x = 0, z = 0;
  for (let i = 0; i < n; i++) {
    const s = i * step;
    px[i] = x; pz[i] = z; tx[i] = Math.sin(theta); tz[i] = Math.cos(theta); kap[i] = k;
    if (s >= nextChange) {
      const km = kMaxFor(s);
      kTarget = (rng() * 2 - 1) * km;
      // avoid endless meandering: occasionally hold straight
      if (rng() < 0.24) kTarget *= 0.15;
      nextChange = s + 90 + rng() * 150;
    }
    k += (kTarget - k) * Math.min(1, step * 0.022);
    k = clamp(k, -kMaxFor(s), kMaxFor(s));
    theta += k * step;
    x += Math.sin(theta) * step; z += Math.cos(theta) * step;
  }

  // elevation: depth keys at chapter edges (+ deep key mid-abyss)
  const eRng = stream('route:elev');
  const keys = [];
  const depths = [-34, -44 + eRng() * 4, -48 + eRng() * 4, -50 + eRng() * 4, -54 + eRng() * 5,
                  -57 + eRng() * 4, -70 + eRng() * 6, -19 - eRng() * 3];
  keys.push({ s: 0, y: depths[0] });
  for (let i = 0; i < 6; i++) keys.push({ s: chapters[i].s1, y: depths[i + 1] });
  // extra deep point mid-abyss
  keys.push({ s: (chapters[5].s0 + chapters[5].s1) / 2, y: -82 - eRng() * 8 });
  keys.push({ s: L, y: depths[7] });
  keys.sort((a, b) => a.s - b.s);
  const elevNoise = makeNoise2('route:elevnoise');
  const yR = new Float64Array(n);
  for (let i = 0; i < n; i++) {
    const s = i * step;
    let j = 0; while (j < keys.length - 2 && keys[j + 1].s < s) j++;
    const a = keys[j], b = keys[j + 1];
    const t = clamp((s - a.s) / Math.max(1, b.s - a.s), 0, 1);
    const tt = t * t * (3 - 2 * t);
    yR[i] = lerp(a.y, b.y, tt) + elevNoise.fbm(s * 0.0021, 3.7, 3) * 2.6;
  }
  // low-pass road elevation as terrain datum
  const yLow = new Float64Array(n);
  const W = Math.round(150 / step);
  let sum = 0, cnt = 0;
  for (let i = 0; i < Math.min(n, W); i++) { sum += yR[i]; cnt++; }
  for (let i = 0; i < n; i++) {
    yLow[i] = sum / cnt;
    const add = i + W; const rem = i - W;
    if (add < n) { sum += yR[add]; cnt++; }
    if (rem >= 0) { sum -= yR[rem]; cnt--; }
  }
  return { L, step, n, px, pz, tx, tz, kap, yR, yLow, chapters, chapterAt };
})();

const L_TOTAL = ROUTE.L;

// interpolated route frame (allocation-free via out objects)
function routeAt(s, out) {
  const st = ROUTE.step;
  const f = clamp(s, 0, L_TOTAL) / st;
  let i = Math.floor(f); if (i >= ROUTE.n - 1) i = ROUTE.n - 2;
  const t = f - i;
  out.x = lerp(ROUTE.px[i], ROUTE.px[i + 1], t);
  out.z = lerp(ROUTE.pz[i], ROUTE.pz[i + 1], t);
  out.y = lerp(ROUTE.yR[i], ROUTE.yR[i + 1], t);
  out.yLow = lerp(ROUTE.yLow[i], ROUTE.yLow[i + 1], t);
  let ax = lerp(ROUTE.tx[i], ROUTE.tx[i + 1], t);
  let az = lerp(ROUTE.tz[i], ROUTE.tz[i + 1], t);
  const il = 1 / Math.hypot(ax, az); ax *= il; az *= il;
  out.tx = ax; out.tz = az;
  out.nx = az; out.nz = -ax;         // left normal = up × tangent
  out.k = lerp(ROUTE.kap[i], ROUTE.kap[i + 1], t);
  // extrapolate beyond ends (for vista placement)
  if (s > L_TOTAL) { out.x += ax * (s - L_TOTAL); out.z += az * (s - L_TOTAL); }
  else if (s < 0) { out.x += ax * s; out.z += az * s; }
  return out;
}
const _rf = {}, _rf2 = {}, _rf3 = {};   // scratch frames

// ---------- fork ----------
const FORK = (() => {
  const rng = stream('fork');
  const ch = ROUTE.chapters[3];
  const len = ch.s1 - ch.s0;
  const s0 = ch.s0 + 0.07 * len;
  const s1 = ch.s1 - 0.11 * len;
  const T = 100;                                        // lateral transition length
  const DL = 21 + rng() * 8;                            // garden arm reach (left)
  const DR = 24 + rng() * 9;                            // aqueduct arm reach (right)
  const rise = 4.6 + rng() * 2.6;                       // aqueduct ledge rise
  const dip = 1.1 + rng() * 0.7;                        // garden arm dip
  const defaultArm = rng() < 0.5 ? 'L' : 'R';
  return { s0, s1, T, DL, DR, rise, dip, defaultArm };
})();

function forkEnv(s) {
  if (s <= FORK.s0 || s >= FORK.s1) return 0;
  return smoothstep(FORK.s0, FORK.s0 + FORK.T, s) * (1 - smoothstep(FORK.s1 - FORK.T, FORK.s1, s));
}
function forkEnvY(s) {
  if (s <= FORK.s0 || s >= FORK.s1) return 0;
  return smoothstep(FORK.s0 + FORK.T * 0.8, FORK.s0 + FORK.T * 2.1, s) *
         (1 - smoothstep(FORK.s1 - FORK.T * 2.1, FORK.s1 - FORK.T * 0.8, s));
}
function armOffset(s, arm) {
  const e = forkEnv(s);
  return arm === 'L' ? FORK.DL * e : -FORK.DR * e;
}
function armY(s, arm, baseY) {
  const ey = forkEnvY(s);
  return baseY + (arm === 'L' ? -FORK.dip * ey : FORK.rise * ey);
}
// distance from (s,d) to nearest arm centerline; also which arm
function armDist(s, d) {
  const oL = armOffset(s, 'L'), oR = armOffset(s, 'R');
  const dL = Math.abs(d - oL), dR = Math.abs(d - oR);
  return dL < dR ? dL : dR;
}
function clearOK(s, d, margin) { return armDist(s, d) >= CLEAR_R + margin; }

// lanes at s (for road geometry + rider constraint)
function lanesAt(s, base) {
  const oL = armOffset(s, 'L'), oR = armOffset(s, 'R');
  const sep = oL - oR;
  if (sep < 0.05) return [{ c: 0, w: ROAD_W, yL: base, yR: base }];
  if (sep < 12) {
    return [{ c: (oL + oR) / 2, w: sep + ROAD_W, yL: base, yR: base }];
  }
  return [
    { c: oL, w: ROAD_W, yL: armY(s, 'L', base), yR: armY(s, 'L', base) },
    { c: oR, w: ROAD_W, yL: armY(s, 'R', base), yR: armY(s, 'R', base) },
  ];
}

// ---------- terrain truth ----------
const nT = makeNoise2('terrain:rolling');
const nD = makeNoise2('terrain:dunes');
const nS = makeNoise2('terrain:side');

// terraforms: local flatten discs {s,d,r,y,blend} — filled by architecture plan below
const TERRAFORMS = [];
const TF_BUCKET = new Map();
function tfIndex() {
  TF_BUCKET.clear();
  for (const tf of TERRAFORMS) {
    const b0 = Math.floor((tf.s - tf.r - 30) / 120), b1 = Math.floor((tf.s + tf.r + 30) / 120);
    for (let b = b0; b <= b1; b++) {
      if (!TF_BUCKET.has(b)) TF_BUCKET.set(b, []);
      TF_BUCKET.get(b).push(tf);
    }
  }
}

function terrainNatural(s, d, wx, wz) {
  const rfY = (() => { const st = ROUTE.step, f = clamp(s, 0, L_TOTAL) / st;
    let i = Math.floor(f); if (i >= ROUTE.n - 1) i = ROUTE.n - 2;
    return lerp(ROUTE.yLow[i], ROUTE.yLow[i + 1], f - i); })();
  const ch = ROUTE.chapterAt(clamp(s, 0, L_TOTAL)).i;
  let y = rfY - 2.5
    + nT.fbm(wx * 0.0042, wz * 0.0042, 3) * 7.5
    + nD.fbm(wx * 0.031, wz * 0.031, 3) * 1.1;
  const ad = Math.abs(d);
  // abyssal crossing: floor falls away both sides of the causeway ridge
  if (ch === 5) {
    const chp = ROUTE.chapters[5];
    const into = smoothstep(chp.s0, chp.s0 + 200, s) * (1 - smoothstep(chp.s1 - 240, chp.s1, s));
    y -= (24 + nS.fbm(s * 0.004, 11.7, 2) * 9) * smoothstep(15, 62, ad) * into;
  }
  // fork: abyss beyond the aqueduct arm's right shoulder
  if (s > FORK.s0 - 60 && s < FORK.s1 + 60) {
    const e = forkEnv(clamp(s, FORK.s0, FORK.s1));
    const oR = armOffset(s, 'R');
    const beyond = (oR - 11) - d;                        // metres past right shoulder
    if (beyond > 0) y -= (20 + nS.fbm(s * 0.006, 3.1, 2) * 6) * smoothstep(0, 42, beyond) * e;
  }
  // beyond the final overlook the city drops into a dark basin
  if (s > L_TOTAL - 60) {
    const past = s - (L_TOTAL - 60);
    y -= 58 * smoothstep(55, 235, past + ad * 0.4);
  }
  // terraform flats
  const bl = TF_BUCKET.get(Math.floor(s / 120));
  if (bl) for (const tf of bl) {
    const ds = s - tf.s, dd = d - tf.d;
    const dist = Math.hypot(ds, dd);
    if (dist < tf.r) y = lerp(y, tf.y, tf.blend * smoothstep(tf.r, tf.r * 0.5, dist));
  }
  return y;
}

const nBed = makeNoise2('terrain:bed');
function carveArm(nat, dd, yA, s) {
  const a = Math.abs(dd);
  if (a >= 26) return nat;
  const bed = yA - 0.52 + nBed.fbm(s * 0.09, dd * 0.11, 2) * 0.055;
  let y;
  if (a < 8.5) y = bed;
  else y = lerp(bed, nat, smoothstep(8.5, 26, a));
  if (a < 12) y = Math.min(y, yA - 0.36);
  return y;
}
function terrainY(s, d, wx, wz) {
  const nat = terrainNatural(s, d, wx, wz);
  routeAt(s, _rf3);
  const base = _rf3.y;
  const cL = carveArm(nat, d - armOffset(s, 'L'), armY(s, 'L', base), s);
  const cR = carveArm(nat, d - armOffset(s, 'R'), armY(s, 'R', base), s);
  return Math.min(cL, cR);
}
// world position of route-space (s,d,h). h above local road level if onRoad, else above terrain.
function routeToWorld(s, d, out) {
  routeAt(s, _rf3);
  out.x = _rf3.x + _rf3.nx * d;
  out.z = _rf3.z + _rf3.nz * d;
  out.y = terrainY(s, d, out.x, out.z);
  return out;
}

/* ---------- architecture plan ---------- */
// record: {t, s, d, rot, sc, ruin, v, ...extras}; d is absolute (base-centerline) lateral
const STRUCTS = [];
const OBSTACLES = [];   // {x,z,r} for fish avoidance
const POI = {};         // named points of interest for QA / camera

function addStruct(rec) {
  STRUCTS.push(rec);
  return rec;
}
function structWorld(rec) {
  routeAt(rec.s, _rf3);
  rec.x = _rf3.x + _rf3.nx * rec.d;
  rec.z = _rf3.z + _rf3.nz * rec.d;
  rec.gy = terrainY(rec.s, rec.d, rec.x, rec.z);
  rec.yaw = Math.atan2(_rf3.tx, _rf3.tz) + (rec.rot || 0);
  return rec;
}

(function planArchitecture() {
  const A = stream('architecture');
  const R = stream('ruins');
  const CH = ROUTE.chapters;

  // --- poster anchors (always present; the rest of the world varies) ---
  // left: a tall broken pair with an architrave stub, one shaft leaning
  addStruct({ t: 'col', s: 18, d: 12.6, rot: 0.3, sc: 1.18, ruin: 0.35, h: 9.2 });
  addStruct({ t: 'col', s: 21.5, d: 15.4, rot: 0.9, sc: 1.1, ruin: 0.62, h: 6.4, lean: 0.14, leanDir: 2.1 });
  addStruct({ t: 'entab', s: 19.7, d: 13.9, rot: 0.25, sc: 0.9, len: 3.4, h: 5.6 });
  // right: lower, sparser — a single stump, a toppled drum, a half-buried pediment
  addStruct({ t: 'col', s: 31, d: -11.9, rot: -0.4, sc: 1.0, ruin: 0.5, h: 7.2 });
  addStruct({ t: 'drum', s: 26, d: -14.5, rot: 1.2, sc: 1.1 });
  addStruct({ t: 'drum', s: 34, d: -13.2, rot: 2.4, sc: 0.85 });
  addStruct({ t: 'ped', s: 39, d: -16.5, rot: 2.6, sc: 1.05, ruin: 0.75 });
  addStruct({ t: 'stair', s: 44, d: 17, rot: -0.2, sc: 1.2, ruin: 0.4 });
  addStruct({ t: 'col', s: 47, d: 13.2, rot: 1.7, sc: 1.05, ruin: 0.2, h: 10.5 });
  addStruct({ t: 'entab', s: 49.4, d: 13.2, rot: 0, sc: 1.05, len: 4.6, h: 10.5 });
  addStruct({ t: 'col', s: 51.8, d: 13.2, rot: 0.4, sc: 1.05, ruin: 0.12, h: 10.5 });

  // extent-aware clearance margin per structure family
  const marginFor = (kind, rec) => {
    const sc = (rec && rec.sc) || 1;
    switch (kind) {
      case 'stair': return 4.5 * sc + 1.5;
      case 'ped': return 4 * sc + 1.5;
      case 'wall': case 'gardenwall': return ((rec && rec.len) || 10) / 2 + 1.8;
      case 'house': return 6.5 * sc + 2;
      case 'court': return 13.5 * sc + 2.5;
      case 'statue': return 3;
      default: return 2;
    }
  };

  // --- ch1: sparse scattered fragments ---
  {
    const c = CH[0];
    const nFrag = ri(A, 5, 8);
    for (let i = 0; i < nFrag; i++) {
      const s = rr(A, c.s0 + 90, c.s1);
      const side = A() < 0.5 ? 1 : -1;
      const d = side * rr(A, 11, 42);
      const kind = rpick(A, ['col', 'drum', 'wall', 'ped', 'stair']);
      const rec = { t: kind, s, d, rot: rr(A, 0, TAU), sc: rr(A, 0.8, 1.3), ruin: rr(R, 0.3, 0.9), h: rr(A, 4, 9), len: rr(A, 5, 10) };
      if (!clearOK(s, d, marginFor(kind, rec))) continue;
      addStruct(rec);
    }
  }

  // --- ch2: the Kelp Gate — a triumphal threshold + buried walls ---
  {
    const c = CH[1];
    const gS = c.s0 + 46;
    addStruct({ t: 'gate', s: gS, d: 0, rot: 0, sc: 1.25, ruin: 0.22 });
    POI.kelpGate = gS;
    addStruct({ t: 'gate', s: c.s1 - 30, d: 0, rot: 0, sc: 0.95, ruin: 0.55 });
    const nW = ri(A, 4, 7);
    for (let i = 0; i < nW; i++) {
      const s = rr(A, c.s0 + 80, c.s1 - 60);
      const d = (A() < 0.5 ? 1 : -1) * rr(A, 16, 42);
      const rec = { t: 'wall', s, d, rot: rr(A, -0.4, 0.4), sc: 1, ruin: rr(R, 0.5, 0.95), len: rr(A, 6, 14), h: rr(A, 1.5, 3.5) };
      if (!clearOK(s, d, marginFor('wall', rec))) continue;
      addStruct(rec);
    }
  }

  // --- ch3: the Column Forest ---
  {
    const c = CH[2];
    POI.columnForest = (c.s0 + c.s1) / 2;
    let s = c.s0 + 40;
    while (s < c.s1 - 60) {
      const runLen = rr(A, 55, 130);
      const side = A() < 0.5 ? 1 : -1;
      const both = A() < 0.55;
      const dBase = rr(A, 11.4, 16.5);
      const gap = rr(A, 6.2, 8.5);
      const nCols = Math.floor(runLen / gap);
      const colH = rr(A, 8.5, 12);
      const runRuin = R();     // how decayed this colonnade is overall
      for (const sd of (both ? [side, -side] : [side])) {
        let prevIntact = false, prevS = 0;
        const dRow = dBase * sd + rr(A, -0.5, 0.5);
        for (let i = 0; i < nCols; i++) {
          const cs = s + i * gap;
          if (cs > c.s1 - 30) break;
          const st = R() * (0.55 + runRuin * 0.7);
          if (st > 0.92) {  // column completely gone → maybe a drum on the ground
            if (R() < 0.6) addStruct({ t: 'drum', s: cs + rr(A, -1, 1), d: dRow + sd * rr(A, 1.5, 5), rot: rr(A, 0, TAU), sc: rr(A, 0.9, 1.15) });
            prevIntact = false; continue;
          }
          const broken = st > 0.45 ? rr(R, 0.35, 0.8) : (st > 0.25 ? rr(R, 0.08, 0.3) : 0);
          // some ruined shafts lean, always away from the road
          const lean = (broken > 0.2 && R() < 0.4) ? rr(R, 0.06, 0.2) : 0;
          addStruct({ t: 'col', s: cs, d: dRow, rot: rr(A, 0, TAU), sc: rr(A, 0.95, 1.08), ruin: broken, h: colH, lean, leanDir: sd > 0 ? 0 : Math.PI });
          const intact = broken < 0.06 && lean === 0;
          if (intact && prevIntact) addStruct({ t: 'entab', s: (cs + prevS) / 2, d: dRow, rot: 0, sc: 1, len: gap, h: colH });
          prevIntact = intact; prevS = cs;
        }
        // an occasional wall fragment with a doorway closes the run
        if (A() < 0.45) {
          const wl = rr(A, 6, 10);
          const wrec = { t: 'wall', s: s + runLen + rr(A, 4, 14), d: (dBase + rr(A, 4, 9)) * sd, rot: rr(A, -0.3, 0.3), sc: 1, ruin: rr(R, 0.3, 0.7), len: wl, h: rr(A, 3, 4.6), door: true };
          if (clearOK(wrec.s, wrec.d, wl / 2 + 1.8)) addStruct(wrec);
        }
        // second row deeper out sometimes
        if (A() < 0.4) {
          const d2 = (dBase + rr(A, 7, 12)) * sd;
          for (let i = 0; i < nCols; i += 2) {
            const cs = s + i * gap;
            if (cs > c.s1 - 30 || R() < 0.4) continue;
            addStruct({ t: 'col', s: cs, d: d2, rot: rr(A, 0, TAU), sc: 1, ruin: rr(R, 0.1, 0.85), h: colH * 0.92 });
          }
        }
      }
      s += runLen + rr(A, 25, 70);
      // interleave: courtyards / stairs / pediments off to the side
      if (A() < 0.75) {
        const cd = (A() < 0.5 ? 1 : -1) * rr(A, 30, 56);
        const cs2 = s - rr(A, 10, 40);
        const crec = { t: 'court', s: cs2, d: cd, rot: rr(A, 0, TAU), sc: rr(A, 0.9, 1.3), ruin: R() };
        if (clearOK(cs2, cd, marginFor('court', crec))) {
          addStruct(crec);
          routeAt(cs2, _rf3);
          TERRAFORMS.push({ s: cs2, d: cd, r: 24, y: terrainNatural(cs2, cd, _rf3.x + _rf3.nx * cd, _rf3.z + _rf3.nz * cd), blend: 0.85 });
        }
      }
      if (A() < 0.5) {
        const kind2 = rpick(A, ['ped', 'stair', 'statue']);
        const prec = { t: kind2, s: 0, d: 0, rot: rr(A, 0, TAU), sc: rr(A, 0.8, 1.4), ruin: R() };
        const pd = (A() < 0.5 ? 1 : -1) * rr(A, marginFor(kind2, prec) + 8.6, marginFor(kind2, prec) + 20);
        const ps = s - rr(A, 5, 25);
        prec.s = ps; prec.d = pd;
        if (clearOK(ps, pd, marginFor(kind2, prec))) addStruct(prec);
      }
    }
    // the Bell dome — ruined dome housing the unsupported bell
    const bs = c.s1 - rr(A, 80, 140);
    const bd = (A() < 0.5 ? 1 : -1) * rr(A, 26, 34);
    addStruct({ t: 'belldome', s: bs, d: bd, rot: 0, sc: 1, ruin: 0.5 });
    POI.bellDome = { s: bs, d: bd };
    routeAt(bs, _rf3);
    TERRAFORMS.push({ s: bs, d: bd, r: 20, y: terrainNatural(bs, bd, _rf3.x + _rf3.nx * bd, _rf3.z + _rf3.nz * bd), blend: 0.9 });
    // mosaic panels near the road through ch3
    for (let i = 0; i < 3; i++) {
      const ms = rr(A, c.s0 + 60, c.s1 - 60);

      if (clearOK(ms, md, 1)) addStruct({ t: 'mosaic', s: ms, d: md, rot: rr(A, 0, TAU), sc: rr(A, 1, 1.6) });
    }
  }

  // --- ch4: the Divided Current ---
  {
    const midS = (FORK.s0 + FORK.s1) / 2;
    POI.forkStart = FORK.s0; POI.forkMid = midS; POI.forkEnd = FORK.s1;
    // LEFT arm: coral-reclaimed residential quarter + flooded gardens
    let s = FORK.s0 + FORK.T * 0.9;
    while (s < FORK.s1 - FORK.T * 0.9) {
      const oL = armOffset(s, 'L');
      const side = A() < 0.62 ? 1 : -1;       // mostly outward (left of left arm)
      const kind = rpick(A, ['house', 'house', 'wall', 'gardenwall', 'court', 'statue']);
      const rec = { t: kind, s, d: 0, rot: rr(A, 0, TAU), sc: rr(A, 0.85, 1.25), ruin: rr(R, 0.35, 0.95), len: rr(A, 5, 9), h: rr(A, 2.2, 4.5) };
      const need = marginFor(kind, rec);
      const dLoc = rr(A, need + 8.6, need + 26);
      rec.d = oL + side * dLoc;
      if (clearOK(s, rec.d, need)) {
        addStruct(rec);
        if (kind === 'house' && A() < 0.4) {
          routeAt(s, _rf3);
          TERRAFORMS.push({ s, d: rec.d, r: 13, y: terrainNatural(s, rec.d, _rf3.x + _rf3.nx * rec.d, _rf3.z + _rf3.nz * rec.d), blend: 0.7 });
        }
      }
      s += rr(A, 18, 34);
    }
    // pergola columns lining the garden arm
    for (let ps = FORK.s0 + FORK.T; ps < FORK.s1 - FORK.T; ps += rr(A, 14, 22)) {
      const oL = armOffset(ps, 'L');
      const d = oL + rr(A, 9.2, 10.5);
      if (clearOK(ps, d, 0.4)) addStruct({ t: 'col', s: ps, d, rot: rr(A, 0, TAU), sc: 0.62, ruin: rr(R, 0.1, 0.75), h: 4.2 });
    }
    // RIGHT arm: aqueduct marching on its inland flank — the abyss side stays open
    const aq0 = FORK.s0 + FORK.T * 1.1, aq1 = FORK.s1 - FORK.T * 1.1;
    addStruct({ t: 'aque', s: (aq0 + aq1) / 2, d: 0, rot: 0, sc: 1, s0: aq0, s1: aq1, side: 'R', off: -13.5, ruin: R() });
    POI.aqueduct = (aq0 + aq1) / 2;
    // rejoin plaza obelisks
    addStruct({ t: 'obelisk', s: FORK.s1 + 34, d: 12.5, rot: 0, sc: 1, ruin: 0.2 });
    addStruct({ t: 'obelisk', s: FORK.s1 + 34, d: -12.5, rot: 0, sc: 1, ruin: 0.55 });
  }

  // --- ch5: the Amphitheater of Echoes ---
  {
    const c = CH[4];
    const as = (c.s0 + c.s1) / 2;
    const aSide = A() < 0.5 ? 1 : -1;
    const ad = aSide * 32.5;
    const aR = 26 + A() * 6;
    routeAt(as, _rf3);
    const floorY = terrainNatural(as, ad, _rf3.x + _rf3.nx * ad, _rf3.z + _rf3.nz * ad) - 1.2;
    // the bowl's mouth is angled toward the approaching rider (clearance-checked rotation)
    addStruct({ t: 'amphi', s: as, d: ad, rot: (aSide > 0 ? 0 : Math.PI) - 0.38 * aSide, sc: 1, r: aR, side: aSide, ruin: R() * 0.5 });
    TERRAFORMS.push({ s: as, d: ad, r: aR + 16, y: floorY, blend: 0.95 });
    POI.amphi = { s: as, d: ad, r: aR, side: aSide, floorY };
    // approach plaza + fragments
    addStruct({ t: 'gate', s: as - aR - 40, d: 0, rot: 0, sc: 0.9, ruin: 0.6 });
    for (let i = 0; i < 5; i++) {
      const fs2 = rr(A, c.s0 + 30, c.s1 - 30);
      const kind3 = rpick(A, ['statue', 'drum', 'ped', 'col']);
      const frec = { t: kind3, s: fs2, d: 0, rot: rr(A, 0, TAU), sc: rr(A, 0.8, 1.3), ruin: rr(R, 0.3, 0.9), h: rr(A, 5, 9) };
      const fd = (A() < 0.5 ? 1 : -1) * rr(A, marginFor(kind3, frec) + 8.6, 26);
      frec.d = fd;
      if (clearOK(fs2, fd, marginFor(kind3, frec))) addStruct(frec);
    }
    // the orchestra floor is a mosaic, laid over the performance disc
    addStruct({ t: 'mosaic', s: as, d: ad, rot: 0, sc: 3.6, hOff: 0.14 });
    addStruct({ t: 'mosaic', s: as - 12, d: aSide * 14, rot: 0, sc: 2.2 });
  }

  // --- ch6: the Abyssal Crossing ---
  {
    const c = CH[5];
    POI.abyssMid = (c.s0 + c.s1) / 2;
    for (let s = c.s0 + 80; s < c.s1 - 80; s += rr(A, 52, 90)) {
      const side = A() < 0.5 ? 1 : -1;
      addStruct({ t: 'pier', s, d: side * rr(A, 13.5, 17), rot: 0, sc: rr(A, 0.7, 1.05), ruin: rr(R, 0.4, 0.95) });
    }
    const hs = POI.abyssMid + rr(A, -100, 100);
    const hd = (A() < 0.5 ? 1 : -1) * rr(A, 38, 55);
    addStruct({ t: 'colossus', s: hs, d: hd, rot: rr(A, -0.8, 0.8), sc: 1 + A() * 0.3, ruin: 0.5 });
    POI.colossus = { s: hs, d: hd };
  }

  // --- ch7: the Temple of the Last Tide ---
  {
    const c = CH[6];
    addStruct({ t: 'gate', s: c.s0 + 50, d: 0, rot: 0, sc: 1.35, ruin: 0.15 });
    // processional colonnade
    for (let s = c.s0 + 90; s < c.s1 - 320; s += rr(A, 9, 12)) {
      for (const sd of [1, -1]) {
        if (R() < 0.72) addStruct({ t: 'col', s: s + rr(A, -0.6, 0.6), d: sd * rr(A, 11.4, 12.4), rot: rr(A, 0, TAU), sc: 0.92, ruin: rr(R, 0, 0.55), h: 9 });
      }
    }
    const ts = c.s1 - 235;
    // successive thresholds of the luminous climb — each gate frames the next glimpse
    addStruct({ t: 'gate', s: ts - 330, d: 0, rot: 0, sc: 1.05, ruin: 0.42 });
    addStruct({ t: 'gate', s: ts - 150, d: 0, rot: 0, sc: 1.2, ruin: 0.1 });
    // layered precinct walls stepping up toward the temple terrace
    for (let i = 0; i < 4; i++) {
      const ws2 = ts - 250 + i * 55 + rr(A, -8, 8);
      const wl2 = rr(A, 8, 13);
      const wd2 = (A() < 0.6 ? Math.sign(0.5) : -1) * rr(A, 16, 21) * (i % 2 === 0 ? 1 : -1);
      const wrec2 = { t: 'wall', s: ws2, d: wd2, rot: rr(A, -0.15, 0.15), sc: 1, ruin: rr(R, 0.15, 0.5), len: wl2, h: rr(A, 2, 3.6) };
      if (clearOK(ws2, wd2, wl2 / 2 + 1.8)) addStruct(wrec2);
    }
    const tSide = A() < 0.5 ? 1 : -1;
    const td = tSide * 37;
    routeAt(ts, _rf3);
    const platY = terrainNatural(ts, td, _rf3.x + _rf3.nx * td, _rf3.z + _rf3.nz * td);
    addStruct({ t: 'temple', s: ts, d: td, rot: tSide > 0 ? Math.PI : 0, sc: 1, side: tSide, ruin: R() * 0.4 });
    TERRAFORMS.push({ s: ts, d: td, r: 46, y: platY, blend: 0.92 });
    POI.temple = { s: ts, d: td, side: tSide };
    // sealed door faces the road — anchor of the Impossible Current
    POI.sealedDoor = { s: ts, d: tSide * 28.5 };
    addStruct({ t: 'obelisk', s: ts - 46, d: tSide * 16, rot: 0, sc: 1.2, ruin: 0.1 });
    addStruct({ t: 'obelisk', s: ts + 46, d: tSide * 16, rot: 0, sc: 1.2, ruin: 0.4 });
    // final overlook
    addStruct({ t: 'overlook', s: L_TOTAL - 4, d: 0, rot: 0, sc: 1 });
    POI.overlook = L_TOTAL - 14;
  }

  // resolve world coordinates + obstacles
  for (const r of STRUCTS) {
    structWorld(r);
    if (r.t === 'col' || r.t === 'obelisk' || r.t === 'pier') OBSTACLES.push({ x: r.x, z: r.z, r: 1.6 * (r.sc || 1) });
    if (r.t === 'gate') {
      routeAt(r.s, _rf3);
      OBSTACLES.push({ x: r.x + _rf3.nx * 9.6, z: r.z + _rf3.nz * 9.6, r: 2.2 });
      OBSTACLES.push({ x: r.x - _rf3.nx * 9.6, z: r.z - _rf3.nz * 9.6, r: 2.2 });
    }
  }
  tfIndex();
  const amphiRec = STRUCTS.find(r => r.t === 'amphi');
  if (amphiRec) POI.amphi.wYaw = amphiRec.yaw;
})();

// ---------- ecology plan ----------
const ECO = { kelp: [], coral: [], smalls: [], jellies: [] };
(function planEcology() {
  const E = stream('ecology');
  const CH = ROUTE.chapters;
  const habitatNoise = makeNoise2('ecology:habitat');

  function kelpCluster(s0, s1, count) {
    let placed = 0, guard = 0;
    while (placed < count && guard++ < count * 6) {
      const cs = rr(E, s0, s1);
      const side = habitatNoise(cs * 0.01, 0) > 0 ? 1 : -1;   // current-facing bias
      const cd = side * rr(E, 10.5, 46);
      if (!clearOK(cs, cd, 1.2)) continue;
      const nStr = ri(E, 5, 14);
      for (let i = 0; i < nStr && placed < count; i++) {
        const s = cs + rr(E, -9, 9), d = cd + rr(E, -7, 7);
        if (!clearOK(s, d, 1.0)) continue;
        ECO.kelp.push({ s, d, h: rr(E, 4.5, 13.5), ph: rr(E, 0, TAU), g: rr(E, 0.7, 1.3) });
        placed++;
      }
    }
  }
  // kelp distribution: the Kelp Gate closes in with true walls, then releases
  kelpCluster(CH[0].s0 + 8, CH[0].s1, 52);
  {
    const c = CH[1];
    const wallEnd = c.s1 - 90;                 // the release: open water before the exit gate
    let ws = c.s0 + 30, sideTogl = E() < 0.5 ? 1 : -1;
    while (ws < wallEnd - 70) {
      const wallLen = rr(E, 44, 80);
      const both = E() < 0.45;
      for (const sd of (both ? [sideTogl, -sideTogl] : [sideTogl])) {
        // a staggered double rank: packed near curtain + deeper backdrop
        for (let rank = 0; rank < 2; rank++) {
          const dBase = rank === 0 ? rr(E, 10.2, 12.8) : rr(E, 15, 22);
          const n = Math.round(wallLen / (rank === 0 ? 1.35 : 2.2));
          for (let i = 0; i < n; i++) {
            const s = ws + (i / n) * wallLen + rr(E, -0.9, 0.9);
            const d = sd * (dBase + rr(E, -1.4, 2.4));
            if (!clearOK(s, d, 1.0)) continue;
            ECO.kelp.push({ s, d, h: rank === 0 ? rr(E, 10.5, 15.5) : rr(E, 8, 13), ph: rr(E, 0, TAU), g: rr(E, 1.25, 1.9) });
          }
        }
        // understory beneath the curtain
        for (let i = 0; i < Math.round(wallLen / 2.6); i++) {
          const s = ws + rr(E, 0, wallLen), d = sd * rr(E, 9.8, 13);
          if (clearOK(s, d, 0.8)) ECO.kelp.push({ s, d, h: rr(E, 2, 4.5), ph: rr(E, 0, TAU), g: rr(E, 0.9, 1.3) });
        }
      }
      ws += wallLen + rr(E, 14, 34);
      sideTogl = -sideTogl;
      if (E() < 0.3) sideTogl = E() < 0.5 ? 1 : -1;
    }
    // sparse strands drifting through the middle of the chapter
    kelpCluster(c.s0, wallEnd, 90);
  }
  kelpCluster(CH[2].s0, CH[2].s1, 70);
  kelpCluster(FORK.s0, FORK.s1, 80);
  kelpCluster(CH[4].s0, CH[4].s1, 48);
  kelpCluster(CH[5].s0 + 100, CH[5].s1 - 100, 10);
  kelpCluster(CH[6].s0, CH[6].s1 - 160, 90);

  // guaranteed poster foreground: ember coral right, gold anemones, kelp tufts left
  const P = stream('ecology:poster');
  for (let i = 0; i < 11; i++) ECO.coral.push({ f: 'branch', s: rr(P, 7, 17), d: -rr(P, 9.6, 13.5), sc: rr(P, 0.6, 1.0), rot: rr(P, 0, TAU), tint: rr(P, 0.6, 1) });
  for (let i = 0; i < 7; i++) ECO.coral.push({ f: 'anem', s: rr(P, 8, 20), d: rr(P, 9.6, 12.5) * (P() < 0.4 ? -1 : 1), sc: rr(P, 0.8, 1.2), rot: rr(P, 0, TAU), tint: rr(P, 0.5, 1) });
  for (let i = 0; i < 6; i++) ECO.coral.push({ f: 'fan', s: rr(P, 10, 26), d: rr(P, 10, 15), sc: rr(P, 0.9, 1.4), rot: rr(P, 0, TAU), tint: rr(P, 0.4, 0.9) });
  for (let i = 0; i < 9; i++) ECO.kelp.push({ s: rr(P, 12, 27), d: rr(P, 11, 16) * (P() < 0.35 ? -1 : 1), h: rr(P, 4.5, 9), ph: rr(P, 0, TAU), g: rr(P, 0.8, 1.2) });

  const FAMS = ['branch', 'fan', 'brain', 'tube', 'anem', 'shellbed'];
  function coralPatch(s0, s1, count, famBias, tintBias, dMin, dMax, armRef) {
    let placed = 0, guard = 0;
    while (placed < count && guard++ < count * 6) {
      const cs = rr(E, s0, s1);
      const side = E() < 0.5 ? 1 : -1;
      const cd = (armRef ? armOffset(cs, armRef) : 0) + side * rr(E, dMin, dMax);
      if (!clearOK(cs, cd, 0.8)) continue;
      const nIt = ri(E, 4, 11);
      const fam = famBias[Math.floor(E() * famBias.length)];
      for (let i = 0; i < nIt && placed < count; i++) {
        const s = cs + rr(E, -6, 6), d = cd + rr(E, -5, 5);
        if (!clearOK(s, d, 0.6)) continue;
        ECO.coral.push({ f: fam, s, d, sc: rr(E, 0.7, 1.6), rot: rr(E, 0, TAU), tint: clamp(tintBias + rr(E, -0.25, 0.25), 0, 1) });
        placed++;
      }
    }
  }
  coralPatch(CH[0].s0, CH[0].s1, 70, FAMS, 0.5, 9.5, 34);
  // kelp gate floor: shell beds and anemones crowd the shoulders under the curtains
  coralPatch(CH[1].s0, CH[1].s1 - 90, 150, ['shellbed', 'anem', 'anem', 'fan'], 0.35, 9.5, 16);
  coralPatch(CH[1].s0, CH[1].s1, 60, ['fan', 'branch'], 0.4, 14, 30);
  coralPatch(CH[2].s0, CH[2].s1, 300, ['brain', 'tube', 'anem', 'branch'], 0.45, 9.5, 40);
  // fork left: ember garden quarter, hugging the garden arm
  coralPatch(FORK.s0, FORK.s1, 330, ['branch', 'branch', 'fan', 'brain'], 0.85, 9.5, 30, 'L');
  coralPatch(FORK.s0, FORK.s1, 60, ['tube', 'anem'], 0.3, 9.5, 22, 'L');
  coralPatch(CH[4].s0, CH[4].s1, 210, ['brain', 'fan', 'anem', 'tube'], 0.55, 10, 38);
  coralPatch(CH[5].s0 + 60, CH[5].s1 - 60, 16, ['tube', 'anem'], 0.1, 10, 22);
  coralPatch(CH[6].s0, CH[6].s1 - 80, 260, ['branch', 'fan', 'tube', 'anem'], 0.7, 9.5, 40);

  // shoulder-scale organisms
  function smalls(s0, s1, count, kinds, dMin, dMax) {
    let placed = 0, guard = 0;
    while (placed < count && guard++ < count * 8) {
      const s = rr(E, s0, s1);
      const d = (E() < 0.5 ? 1 : -1) * rr(E, dMin, dMax);
      if (!clearOK(s, d, 0.35)) continue;
      ECO.smalls.push({ k: rpick(E, kinds), s, d, sc: rr(E, 0.8, 1.4), rot: rr(E, 0, TAU), ph: rr(E, 0, TAU) });
      placed++;
    }
  }
  smalls(CH[0].s0, CH[2].s1, 34, ['crab', 'star', 'urchin', 'star'], 9, 17);
  smalls(CH[2].s0, CH[2].s1, 22, ['crab', 'crab', 'urchin'], 9, 15);      // debris dwellers
  smalls(FORK.s0, FORK.s1, 26, ['crab', 'star', 'urchin'], 9, 18);
  smalls(CH[4].s0, CH[4].s1, 24, ['crab', 'crab', 'star'], 9, 16);        // amphitheater seating
  smalls(CH[6].s0, CH[6].s1, 24, ['star', 'urchin', 'crab'], 9, 17);

  // jellyfish drifts
  function jellies(s0, s1, count, hMin, hMax) {
    for (let i = 0; i < count; i++) {
      const s = rr(E, s0, s1);
      const d = (E() < 0.5 ? 1 : -1) * rr(E, 6, 42);
      ECO.jellies.push({ s, d, h: rr(E, hMin, hMax), ph: rr(E, 0, TAU), sc: rr(E, 0.7, 1.5), dr: rr(E, 0, TAU) });
    }
  }
  jellies(CH[4].s0, CH[4].s1, 15, 8, 26);       // through the amphitheater opening
  jellies(CH[5].s0, CH[5].s1, 17, 5, 30);       // abyss lanterns
  jellies(CH[6].s0, CH[6].s1, 13, 7, 24);
  jellies(CH[1].s0, CH[2].s1, 7, 10, 26);
})();

// ---------- fish school plan ----------
const SCHOOLS = (() => {
  const F = stream('fish');
  const CH = ROUTE.chapters;
  const mk = (kind, count, size, speed, spread, wps) => ({ kind, count, size, speed, spread, wps });
  function loop(s0, s1, nWp, hMin, hMax, dSpan) {
    const wps = [];
    for (let i = 0; i < nWp; i++) {
      wps.push({ s: lerp(s0, s1, i / nWp) + rr(F, -40, 40), d: rr(F, -dSpan, dSpan), h: rr(F, hMin, hMax) });
    }
    return wps;
  }
  const arr = [];
  // silver baitfish — includes the poster arc, guaranteed
  const wps0 = [{ s: 52, d: -4, h: 9 }, { s: 84, d: 15, h: 12 }, { s: 130, d: -14, h: 10 }];
  wps0.push(...loop(CH[0].s1, CH[1].s1, 5, 6, 18, 34));
  arr.push(mk('silver', 58, 0.4, 7.5, 5.5, wps0));
  // dark reef fish threading the column forest
  arr.push(mk('reef', 54, 0.42, 5.2, 7, loop(CH[2].s0 + 40, CH[2].s1 - 40, 8, 3.5, 12, 22)));
  // ribbon fish threading between the kelp walls, sometimes rising above them
  arr.push(mk('ribbon', 52, 0.55, 4.2, 7, loop(CH[1].s0, CH[1].s1 + 200, 8, 4.5, 15, 18)));
  // luminous juveniles in the dark chapters
  arr.push(mk('lumen', 62, 0.22, 5.8, 6, loop(CH[5].s0 + 60, CH[5].s1 + 250, 8, 4, 16, 28)));
  // slow ceremonial school around the temple
  const t = POI.temple;
  const cw = [];
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * TAU;
    cw.push({ s: t.s + Math.cos(a) * 55, d: t.d * 0.35 + Math.sin(a) * 26, h: 9 + Math.sin(a * 2) * 4 });
  }
  arr.push(mk('ceremony', 56, 0.5, 2.6, 8, cw));
  return arr;
})();

// ---------- creature plan ----------
const CREATURES = (() => {
  const C = stream('creatures');
  const CH = ROUTE.chapters;
  const rays = [];
  // guaranteed low crossing in ch2 (shadow moment)
  rays.push({ cs: CH[1].s0 + 130, cd: 0, rad: 42, h: 8.5, sp: rr(C, 0.05, 0.07), ph: rr(C, 0, TAU), sc: 1.5 });
  // one ray owns the void above the amphitheater seats — scale for the bowl
  rays.push({ cs: POI.amphi.s, cd: POI.amphi.d, rad: 24, h: 17, sp: rr(C, 0.04, 0.055), ph: rr(C, 0, TAU), sc: 1.7 });
  for (let i = 0; i < 12; i++) {
    rays.push({
      cs: rr(C, 200, L_TOTAL - 300), cd: rr(C, -30, 30), rad: rr(C, 30, 70),
      h: rr(C, 12, 30), sp: rr(C, 0.03, 0.075), ph: rr(C, 0, TAU), sc: rr(C, 1.0, 1.9)
    });
  }
  // giant passes: opening pass + one every 50–90 s
  const passes = [{ t: 6.5, dur: 30, side: 1, dist: 258, dh: 24, dir: -1 }];
  let t0 = 55 + C() * 25;
  while (t0 < 1500) {
    passes.push({
      t: t0, dur: rr(C, 24, 40), side: C() < 0.5 ? 1 : -1,
      dist: rr(C, 180, 320), dh: rr(C, -6, 34), dir: C() < 0.5 ? 1 : -1
    });
    t0 += rr(C, 50, 90);
  }
  // the abyss pass comes close — flagged by s-range, applied to whichever pass fires there
  const abyssRange = { s0: CH[5].s0 + 100, s1: CH[5].s1 - 100, dist: 76, dh: 14 };
  // scripted moments
  const turtle = { s: CH[2].s0 + rr(C, 100, 200), side: C() < 0.5 ? 1 : -1 };
  const octopi = [
    { s: 0, d: 0, msIdx: 0 },   // resolved to mosaic panels below
    { s: 0, d: 0, msIdx: 1 },
  ];
  const mosaics = STRUCTS.filter(r => r.t === 'mosaic');
  octopi.forEach((o, i) => {
    const m = mosaics[Math.min(i, mosaics.length - 1)];
    if (m) { o.s = m.s + 1.5; o.d = m.d + (m.d > 0 ? 2 : -2); }
  });
  const cuttle = [];
  for (let i = 0; i < 4; i++) {
    cuttle.push({ s: POI.amphi.s + rr(C, -14, 14), d: POI.amphi.d + rr(C, -12, 12), h: rr(C, 2, 5), ph: rr(C, 0, TAU) });
  }
  return { rays, passes, abyssRange, turtle, octopi, cuttle };
})();

// ---------- ambient event schedule ----------
const AMBIENT = (() => {
  const M = stream('ambient');
  const groans = [], clicks = [], whales = [];
  let t = 20 + M() * 30; while (t < 1400) { groans.push(t); t += 25 + M() * 55; }
  t = 12 + M() * 15; while (t < 1400) { clicks.push(t); t += 7 + M() * 26; }
  t = 90 + M() * 120; while (t < 1400) { whales.push(t); t += 140 + M() * 260; }
  return { groans, clicks, whales };
})();

// ---------- rare phenomena ----------
const RARE = (() => {
  const X = stream('rare');
  const r1 = X(), r2 = X(), r3 = X();
  const procession = r1 < 0.42;                 // pale procession in the amphitheater
  const impossibleCurrent = !procession;        // at most one unmistakable event per ride
  const colossusEye = r2 < 0.14;                // rare gold glint
  const processionAt = 0;                       // triggered by rider position, not clock
  return { procession, impossibleCurrent, colossusEye, seedByte: Math.floor(r3 * 256) };
})();

// ---------- plan hashes ----------
const HASHES = (() => {
  const hr = mkHasher();
  hr.f(L_TOTAL).f(FORK.s0).f(FORK.s1).f(FORK.DL).f(FORK.DR).f(FORK.rise);
  for (const c of ROUTE.chapters) hr.f(c.s0).f(c.s1);
  for (let i = 0; i < ROUTE.n; i += 10) hr.f(ROUTE.px[i]).f(ROUTE.pz[i]).f(ROUTE.yR[i]);
  const routeHash = hr.get();

  const hw = mkHasher();
  for (const tf of TERRAFORMS) hw.f(tf.s).f(tf.d).f(tf.r).f(tf.y);
  hw.s(SEED).f(TERRAFORMS.length);
  const worldHash = hw.get();

  const ha = mkHasher();
  for (const r of STRUCTS) ha.s(r.t).f(r.s).f(r.d).f(r.rot || 0).f(r.sc || 1).f(r.ruin || 0).f(r.h || 0);
  for (const sk of SKYLINE) ha.s(sk.t).f(sk.x).f(sk.z).f(sk.sc);
  const archHash = ha.get();

  const he = mkHasher();
  for (const k of ECO.kelp) he.f(k.s).f(k.d).f(k.h).f(k.ph);
  for (const c of ECO.coral) he.s(c.f).f(c.s).f(c.d).f(c.sc).f(c.rot);
  for (const sm of ECO.smalls) he.s(sm.k).f(sm.s).f(sm.d);
  for (const j of ECO.jellies) he.f(j.s).f(j.d).f(j.h);
  for (const sc of SCHOOLS) { he.s(sc.kind).f(sc.count); for (const w of sc.wps) he.f(w.s).f(w.d).f(w.h); }
  const ecoHash = he.get();

  const hv = mkHasher();
  for (const p of CREATURES.passes) hv.f(p.t).f(p.dur).f(p.side).f(p.dist);
  for (const r of CREATURES.rays) hv.f(r.cs).f(r.cd).f(r.rad).f(r.h);
  for (const g of AMBIENT.groans) hv.f(g);
  hv.f(RARE.procession ? 1 : 0).f(RARE.impossibleCurrent ? 1 : 0).f(RARE.colossusEye ? 1 : 0);
  const eventHash = hv.get();

  // chunk plan hash: which entities land in which chunk
  const nCh = Math.ceil(L_TOTAL / CHUNK_LEN);
  const hc = mkHasher();
  hc.f(nCh);
  for (const r of STRUCTS) hc.f(Math.floor(r.s / CHUNK_LEN)).s(r.t.slice(0, 2));
  for (const k of ECO.kelp) hc.f(Math.floor(k.s / CHUNK_LEN));
  const chunkHash = hc.get();

  return { route: routeHash, world: worldHash, architecture: archHash, ecology: ecoHash, events: eventHash, chunks: chunkHash };
})();

/* ============================================================
   WATER, LIGHT, MATERIALS — one shared optical language.
   ============================================================ */

// shared uniforms (single objects, updated once per frame)
const U = {
  uTime:      { value: 0 },
  uCamPos:    { value: new THREE.Vector3() },
  uSunDir:    { value: new THREE.Vector3(0.22, 1, 0.13).normalize() }, // toward the surface sun
  uSunI:      { value: 1 },            // chapter sun intensity
  uCaustI:    { value: 1 },            // caustic strength
  uFogSh:     { value: new THREE.Color() },  // shallow fog (toward surface)
  uFogDp:     { value: new THREE.Color() },  // deep fog
  uFogDen:    { value: 0.011 },
  uAbsorb:    { value: new THREE.Vector3(0.06, 0.02, 0.010) },
  uDim:       { value: 1 },            // giant-shadow dimmer
  uEventPos:  { value: new THREE.Vector3(0, -9999, 0) },   // impossible-current anchor
  uEventStr:  { value: 0 },
  uCurrent:   { value: new THREE.Vector3(0.6, 0, 0.35) },  // ambient drift dir
  uInk:    { value: PAL.ink }, uPetrol: { value: PAL.petrol }, uTurq: { value: PAL.turquoise },
  uOlive:  { value: PAL.olive }, uMarble: { value: PAL.marble }, uEmber: { value: PAL.ember },
  uGold:   { value: PAL.gold },
};

const GLSL_UNI = /* glsl */`
uniform float uTime, uSunI, uCaustI, uFogDen, uDim, uEventStr;
uniform vec3 uCamPos, uSunDir, uAbsorb, uEventPos, uCurrent;
uniform vec3 uFogSh, uFogDp, uInk, uPetrol, uTurq, uOlive, uMarble, uEmber, uGold;
`;

const GLSL_LIB = /* glsl */`
float h21(vec2 p){
  p = mod(p, 256.0);            // keep magnitudes fp32-safe; period is invisible at world scale
  p = fract(p*vec2(0.3183099, 0.3678794)*vec2(123.34,345.45));
  p += dot(p,p+34.345);
  return fract(p.x*p.y);
}
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f*f*(3.0-2.0*f);
  float a = h21(i), b = h21(i+vec2(1,0)), c = h21(i+vec2(0,1)), d = h21(i+vec2(1,1));
  return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
}
float fbm2(vec2 p){
  float v = 0.0, a = 0.5;
  for(int i=0;i<3;i++){ v += a*vnoise(p); p = p*2.03 + 17.1; a *= 0.5; }
  return v;
}
float caust(vec2 p, float t){
  vec2 q = p*0.5;
  vec2 w1 = q + 0.55*vec2(sin(q.y*1.25+t*0.9), cos(q.x*1.05-t*0.7));
  vec2 w2 = q*1.83 + 0.4*vec2(cos(q.y*1.7-t*1.15), sin(q.x*1.5+t*1.0));
  float c1 = sin(w1.x*2.1+t)+sin(w1.y*2.3-t*1.25)+sin((w1.x+w1.y)*1.55);
  float c2 = sin(w2.x*2.35-t*0.85)+sin(w2.y*2.05+t*1.1);
  float l1 = pow(max(0.0,1.0-abs(sin(c1*0.62))),4.0);
  float l2 = pow(max(0.0,1.0-abs(sin(c2*0.7))),4.0);
  return clamp(l1*0.85 + l2*0.6 + l1*l2*1.3, 0.0, 2.4);
}
// depth-graded fog color: fragments toward the surface haze brighter
vec3 fogColorAt(vec3 wp, vec3 viewDir){
  float up = clamp(viewDir.y*0.5+0.55, 0.0, 1.0);
  float depthT = clamp(1.0 - (-wp.y-20.0)/85.0, 0.0, 1.0);
  vec3 fc = mix(uFogDp, uFogSh, up*0.65 + depthT*0.35);
  // faint sun bias in the fog itself
  float sunAmt = pow(max(0.0, dot(viewDir, uSunDir)), 3.0)*0.35*uSunI;
  return fc + uGold*sunAmt*0.22 + uTurq*sunAmt*0.12;
}
vec3 applyWater(vec3 col, vec3 wp){
  float dist = length(wp - uCamPos);
  vec3 viewDir = (wp - uCamPos)/max(dist, 0.001);
  vec3 absorb = exp(-dist*uAbsorb);           // reds die first
  col *= absorb;
  float f = 1.0 - exp(-dist*uFogDen);
  f = min(f, 0.985);
  return mix(col, fogColorAt(wp, viewDir), f);
}
float sunLight(vec3 n){
  float dl = dot(n, uSunDir)*0.5+0.5;         // wrapped
  return dl*dl;
}
float causticAt(vec3 wp, float scale){
  float depthGain = exp((wp.y+34.0)*0.02);
  return caust(wp.xz*scale, uTime*0.62) * uCaustI * uDim * clamp(depthGain,0.1,1.4);
}
`;

const GLSL_VARY_V = /* glsl */`
varying vec3 vWp; varying vec3 vNrm; varying vec2 vUvv;
`;
const GLSL_VARY_F = /* glsl */`
varying vec3 vWp; varying vec3 vNrm; varying vec2 vUvv;
`;

// assemble a ShaderMaterial speaking the shared water language
function waterMat(o) {
  const uniforms = Object.assign({}, U, o.uniforms || {});
  return new THREE.ShaderMaterial({
    name: o.name || 'water',
    uniforms,
    vertexShader: /* glsl */`
      ${GLSL_UNI}
      ${GLSL_VARY_V}
      ${o.vertexHead || ''}
      void main(){
        vec3 tp = position;
        vec3 tn = normal;
        ${o.vertexBody || ''}
        #ifdef USE_INSTANCING
          vec4 wp4 = modelMatrix * instanceMatrix * vec4(tp, 1.0);
          vNrm = normalize(mat3(modelMatrix) * mat3(instanceMatrix) * tn);
        #else
          vec4 wp4 = modelMatrix * vec4(tp, 1.0);
          vNrm = normalize(mat3(modelMatrix) * tn);
        #endif
        ${o.vertexWorld || ''}
        vWp = wp4.xyz;
        vUvv = uv;
        gl_Position = projectionMatrix * viewMatrix * wp4;
        ${o.vertexTail || ''}
      }`,
    fragmentShader: /* glsl */`
      ${GLSL_UNI}
      ${GLSL_LIB}
      ${GLSL_VARY_F}
      ${o.fragmentHead || ''}
      void main(){
        ${o.fragmentBody}
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`,
    side: o.side !== undefined ? o.side : THREE.FrontSide,
    transparent: !!o.transparent,
    blending: o.blending !== undefined ? o.blending : THREE.NormalBlending,
    depthWrite: o.depthWrite !== undefined ? o.depthWrite : true,
    depthTest: o.depthTest !== undefined ? o.depthTest : true,
  });
}

/* ---------- background water dome ---------- */
const matWaterDome = waterMat({
  name: 'dome',
  side: THREE.BackSide, depthWrite: false,
  fragmentBody: /* glsl */`
    vec3 vd = normalize(vWp - uCamPos);
    vec3 col = fogColorAt(uCamPos + vd*900.0, vd);
    // darker below, hint of the luminous surface above
    col *= mix(0.55, 1.15, clamp(vd.y*0.5+0.5, 0.0, 1.0));
    float sunDisk = pow(max(0.0, dot(vd, uSunDir)), 18.0);
    col += uGold * sunDisk * 0.35 * uSunI * uDim;
    col += uTurq * pow(max(0.0, dot(vd, uSunDir)), 5.0) * 0.10 * uSunI;
    // dithering against banding
    col += (h21(gl_FragCoord.xy)-0.5)*0.012;
    gl_FragColor = vec4(col, 1.0);
  `,
});

/* ---------- road ---------- */
function mkRoadMaterial() {
  return waterMat({
    name: 'road',
    uniforms: {
      uForkS0: { value: FORK.s0 }, uForkS1: { value: FORK.s1 },
      uEdgeBoost: { value: 1 },
    },
    vertexHead: `attribute vec3 aSD; varying vec3 vSD;`,
    vertexTail: `vSD = aSD;`,
    fragmentHead: /* glsl */`
      varying vec3 vSD;
      uniform float uForkS0, uForkS1, uEdgeBoost;
    `,
    fragmentBody: /* glsl */`
      float s = vSD.x, d = vSD.y, halfW = vSD.z;
      float ad = abs(d);
      float edge = halfW - ad;              // distance in from the nearest pavement edge
      // ---- fitted basalt paving, staggered bond ----
      float rowH = 1.35, colW = 2.35;
      float row = floor(s/rowH);
      float shift = mod(row,2.0)*0.5*colW;
      float cxf = (d + shift + 40.0)/colW;
      vec2 id = vec2(row, floor(cxf));
      float fx = fract(s/rowH), fy = fract(cxf);
      float mortar = smoothstep(0.0,0.05,fx)*smoothstep(1.0,0.95,fx)
                   * smoothstep(0.0,0.035,fy)*smoothstep(1.0,0.965,fy);
      // hash on bounded ids only — large inputs collapse in fp32 and glow
      vec2 idh = mod(id, 64.0);
      float tone = h21(idh*1.71+31.7);
      vec3 base = mix(uInk*1.25, uPetrol*0.95, 0.28+tone*0.38);
      base += uTurq*0.05*fbm2(vWp.xz*0.35);
      // repaired ceremonial stones: pale relative to their neighbours, never glowing
      float repaired = step(0.978, h21(idh*3.13+7.7));
      base = mix(base, base*2.1 + uMarble*0.012, repaired);
      // mismatched darker replacements
      base = mix(base, uInk*1.6, step(0.93, h21(idh*5.7+2.2))*(1.0-repaired)*0.5);
      // luminous aggregate: rare fine grains, alive only up close
      float distCam = length(vWp - uCamPos);
      float sp = step(0.9995, h21(mod(floor(vWp.xz*26.0), 128.0)+idh*0.13));
      float sparkle = sp*(0.35+0.65*abs(sin(uTime*1.7+tone*40.0)))*exp(-distCam*0.07);
      // weathering: sand creeping in from the shoulders — soft, wide drifts
      float sand = smoothstep(1.7, 0.12, edge)*(0.3+0.7*fbm2(vWp.xz*0.21));
      base = mix(base, mix(uPetrol*0.8,uMarble*0.5,0.4), sand*0.34);
      // faint pale ruts worn by centuries of wheels
      base *= 1.0 + 0.10*uSunI*exp(-pow(ad-1.15,2.0)*2.4);
      // expansion seams
      float seam = 1.0 - 0.55*smoothstep(0.16,0.03,abs(mod(s,27.0)-0.08));
      // drainage slots at the edges
      float slot = 1.0 - 0.5*step(abs(mod(s,13.0)-0.5),0.42)*smoothstep(1.45,1.2,edge)*smoothstep(0.22,0.4,edge);
      base *= mix(0.5, 1.0, mortar)*seam*slot;
      // ---- lighting ----
      float li = sunLight(vNrm)*uSunI*uDim;
      vec3 col = base*(0.35 + li*0.85);
      col += uGold*0.55*causticAt(vWp, 0.42)*0.16;
      col += uTurq*0.3*causticAt(vWp+13.0, 0.31)*0.10;
      col += uGold*sparkle*0.32;
      // ---- luminous edge markers, dashes ----
      float markLine = smoothstep(0.22,0.06,abs(edge-0.38));
      float dash = smoothstep(0.34,0.30,abs(fract(s/7.0)-0.5));
      vec3 markCol = mix(uTurq, uGold, 0.45);
      col += markCol*markLine*dash*(0.30+0.24*sin(uTime*1.2+s*0.05))*uEdgeBoost;
      // fork approach chevrons on the widening wedge — worn paint, not signage
      if (s > uForkS0-85.0 && s < uForkS0+45.0 && ad < 2.3 && halfW < 6.4){
        float ch = smoothstep(0.5,0.46,abs(fract((s+ad*1.4)*0.28)-0.5));
        float wear = 0.4+0.6*fbm2(vWp.xz*1.3);
        col += uGold*ch*0.05*wear*smoothstep(uForkS0-85.0,uForkS0-20.0,s);
      }
      col = applyWater(col, vWp);
      gl_FragColor = vec4(col, 1.0);
    `,
  });
}

/* ---------- terrain ---------- */
function mkTerrainMaterial() {
  return waterMat({
    name: 'terrain',
    uniforms: { uEndS: { value: L_TOTAL } },
    vertexHead: `attribute vec2 aSD; attribute float aBed; varying vec2 vSD; varying float vBed;`,
    vertexTail: `vSD = aSD; vBed = aBed;`,
    fragmentHead: `varying vec2 vSD; varying float vBed; uniform float uEndS;`,
    fragmentBody: /* glsl */`
      float slope = 1.0 - clamp(vNrm.y, 0.0, 1.0);
      float n1 = fbm2(vWp.xz*0.11);
      float n2 = fbm2(vWp.xz*0.026+7.0);
      vec3 sand = mix(uPetrol*0.95, uMarble*0.44, 0.26+0.24*n1);
      sand = mix(sand, uTurq*0.45, 0.12*n2);
      vec3 rock = mix(uInk*1.4, uPetrol*0.8, 0.4+0.3*n1);
      vec3 col = mix(sand, rock, smoothstep(0.12, 0.5, slope));
      // algae films on lit flats
      float algae = smoothstep(0.45,0.75,fbm2(vWp.xz*0.05+31.0))*(1.0-slope)*uSunI;
      col = mix(col, uOlive*0.7, algae*0.5);
      // road-bed: rippled pale sediment beside the causeway
      float bed = 1.0-smoothstep(6.0, 14.0, vBed);
      // the terminal terrace keeps its dignity — pale sediment recedes at the overlook
      float endFade = smoothstep(uEndS-85.0, uEndS-18.0, vSD.x);
      bed *= 1.0 - 0.72*endFade;
      float ripple = 0.5+0.5*sin(vSD.y*3.1 + fbm2(vWp.xz*0.4)*4.0);
      col = mix(col, mix(uPetrol,uMarble,0.38)*(0.85+ripple*0.2), bed*0.38);
      col *= 1.0 - 0.24*endFade;
      // deep zones drown toward ink
      col = mix(col, uInk*1.2, smoothstep(-58.0,-95.0,vWp.y)*0.6);
      float li = sunLight(vNrm)*uSunI*uDim;
      col *= 0.22 + li*0.75;
      col += uGold*0.5*causticAt(vWp, 0.33)*0.11*(1.0-slope);
      col = applyWater(col, vWp);
      // the corridor breathes out into open water at its edges
      vec3 vdT = normalize(vWp - uCamPos);
      col = mix(col, fogColorAt(vWp, vdT)*mix(0.55,1.15,clamp(vdT.y*0.5+0.5,0.0,1.0)), smoothstep(88.0, 135.0, abs(vSD.y)));
      col += (h21(gl_FragCoord.xy)-0.5)*0.008;
      gl_FragColor = vec4(col, 1.0);
    `,
  });
}

/* ---------- marble architecture ---------- */
function mkMarbleMaterial() {
  return waterMat({
    name: 'marble',
    side: THREE.DoubleSide,
    vertexHead: `attribute float aGrow; varying float vGrow; varying vec3 vCol; attribute vec3 color;`,
    vertexTail: `vGrow = aGrow; vCol = color;`,
    fragmentHead: `varying float vGrow; varying vec3 vCol;`,
    fragmentBody: /* glsl */`
      // veined ceremonial marble
      float vein = fbm2(vWp.xz*0.9 + vWp.y*0.7);
      vein = smoothstep(0.42,0.5,abs(vein-0.5));
      vec3 col = uMarble * vCol * (0.9 - vein*0.22);
      col = mix(col, uPetrol*1.1, vein*0.18);
      // algae stain: up-facing + sun-facing surfaces, patchy rather than uniform
      float upf = clamp(vNrm.y,0.0,1.0);
      float alg = (upf*0.5 + clamp(dot(vNrm,uSunDir),0.0,1.0)*0.25) * smoothstep(0.42,0.78,fbm2(vWp.xz*0.21+9.0));
      col = mix(col, uOlive*0.75, alg*0.42);
      col = mix(col, uTurq*0.6, alg*0.16);
      // marine encrustation driven by per-vertex growth
      float crust = smoothstep(0.35, 0.8, fbm2(vWp.xz*0.6+vWp.y*0.4+3.0)) * vGrow;
      col = mix(col, uEmber*0.85, crust*0.5);
      col = mix(col, uTurq*0.8, crust*0.22);
      // crevice grime
      col *= 0.82 + 0.18*smoothstep(0.0,0.35,fbm2(vWp.xz*1.7+vWp.y));
      float li = sunLight(vNrm)*uSunI*uDim;
      // faint rim from the surface light — silhouettes stay readable
      vec3 vd = normalize(vWp - uCamPos);
      float rim = pow(1.0-abs(dot(vd,vNrm)), 3.0)*0.22*(0.28+0.72*uSunI);
      col = col*(0.13 + 0.16*uSunI + li*0.95) + uTurq*rim + uGold*rim*0.4;
      col += uGold*0.5*causticAt(vWp, 0.36)*0.09*clamp(vNrm.y+0.4,0.0,1.0);
      // monumental masses keep a whisper of silhouette inside the haze
      float distM = length(vWp - uCamPos);
      vec3 vdM = (vWp - uCamPos)/max(distM, 0.001);
      col *= exp(-distM*uAbsorb);
      float fM = 1.0 - exp(-distM*uFogDen*0.8);
      vec3 fcM = fogColorAt(vWp, vdM)*mix(0.5, 1.18, clamp(vdM.y*0.5+0.5, 0.0, 1.0));
      col = mix(col, fcM*0.96, min(fM, 0.93));
      gl_FragColor = vec4(col, 1.0);
    `,
  });
}

/* ---------- distant skyline silhouettes ---------- */
function mkSkylineMaterial(dk, fogMul, fCap) {
  return waterMat({
    name: 'skyline',
    uniforms: { uDk: { value: dk }, uFogMul: { value: fogMul }, uFCap: { value: fCap } },
    fragmentHead: `uniform float uDk, uFogMul, uFCap;`,
    fragmentBody: /* glsl */`
      vec3 vd = normalize(vWp - uCamPos);
      vec3 fc = fogColorAt(vWp, vd);
      // match the background dome's vertical grading, then sit a shade darker
      fc *= mix(0.5, 1.18, clamp(vd.y*0.5+0.5, 0.0, 1.0));
      vec3 col = fc*uDk;
      float dist = length(vWp-uCamPos);
      // silhouettes fade slower than true fog — denser shapes inside the haze
      float f = 1.0-exp(-dist*uFogDen*uFogMul);
      col = mix(col, fc, min(f,uFCap));
      col += (h21(gl_FragCoord.xy)-0.5)*0.01;
      gl_FragColor = vec4(col, 1.0);
    `,
  });
}
const matSkyline = mkSkylineMaterial(0.67, 0.34, 0.90);
const matSkylineHero = mkSkylineMaterial(0.34, 0.10, 0.78);

/* ---------- kelp ---------- */
function mkKelpMaterial() {
  return waterMat({
    name: 'kelp',
    side: THREE.DoubleSide,
    uniforms: { uEventDir: { value: new THREE.Vector3(1, 0, 0) } },
    vertexHead: /* glsl */`
      attribute float aPh; attribute float aGirth;
      varying float vHgt; varying float vPhF;
      uniform vec3 uEventDir;
    `,
    vertexBody: /* glsl */`
      float hgt = uv.y;                    // 0 root → 1 tip
      vHgt = hgt; vPhF = aPh;
      float bendW = hgt*hgt;
      float sway = sin(uTime*0.75 + aPh) * 0.9 + sin(uTime*1.7 + aPh*1.7)*0.35;
    `,
    vertexWorld: /* glsl */`
      // sway + impossible-current lean happen in world space
      vec3 swayDir = normalize(vec3(uCurrent.x, 0.0, uCurrent.z));
      wp4.xyz += swayDir * sway * bendW * 1.1 * aGirth;
      float ev = uEventStr * (1.0 - smoothstep(20.0, 55.0, length(wp4.xyz - uEventPos)));
      vec3 toDoor = normalize(vec3(uEventPos.x,wp4.y,uEventPos.z) - wp4.xyz + vec3(0.001));
      wp4.xyz += toDoor * ev * bendW * 2.6;
    `,
    fragmentHead: `varying float vHgt; varying float vPhF;`,
    fragmentBody: /* glsl */`
      vec3 deep = mix(uOlive*0.6, uPetrol*1.05, 0.42);
      vec3 tip  = mix(uOlive*1.05, uTurq*0.85, 0.3);
      vec3 col = mix(deep, tip, vHgt);
      // per-blade hue drift + midrib shading so blades read as leaves, not panels
      col *= 0.82 + 0.36*fract(vPhF*3.71);
      col *= 0.78 + 0.22*smoothstep(0.0,0.4,abs(vUvv.x-0.5));
      col = mix(col, uOlive*0.85, 0.25*smoothstep(0.5,0.95,fract(vPhF*7.13)));
      // translucency: light through the blade
      float tl = pow(clamp(dot(-vNrm, uSunDir)*0.5+0.5, 0.0, 1.0), 2.0);
      col += mix(uOlive,uGold,0.3)*tl*0.6*uSunI;
      float li = sunLight(vNrm)*uSunI*uDim;
      col *= 0.5 + li*0.95 + vHgt*0.3;
      col += uGold*causticAt(vWp,0.4)*0.09*vHgt;
      col = applyWater(col, vWp);
      gl_FragColor = vec4(col, 1.0);
    `,
  });
}

/* ---------- coral families ---------- */
function mkCoralMaterial(colA, colB, flex) {
  return waterMat({
    name: 'coral',
    side: THREE.DoubleSide,
    uniforms: {
      uColA: { value: colA }, uColB: { value: colB }, uFlex: { value: flex },
    },
    vertexHead: /* glsl */`
      attribute float aTint; attribute float aPh;
      varying float vTint;
      uniform float uFlex;
    `,
    vertexBody: /* glsl */`
      vTint = aTint;
      float w = uv.y*uv.y*uFlex;
      tp.x += sin(uTime*1.1+aPh)*0.14*w;
      tp.z += cos(uTime*0.9+aPh*1.3)*0.14*w;
    `,
    fragmentHead: `varying float vTint; uniform vec3 uColA, uColB;`,
    fragmentBody: /* glsl */`
      vec3 col = mix(uColA, uColB, vTint);
      col *= 0.72 + 0.42*fbm2(vWp.xz*2.2+vWp.y);
      // shade toward the base — growth is lit from above
      col *= 0.7 + 0.3*clamp(vUvv.y+0.4, 0.0, 1.0);
      float li = sunLight(vNrm)*uSunI*uDim;
      vec3 vd = normalize(vWp-uCamPos);
      float rim = pow(1.0-abs(dot(vd,vNrm)),2.5)*0.3;
      col = col*(0.24+li*0.85) + col*rim*1.1;
      col += uGold*causticAt(vWp,0.42)*0.08;
      col = applyWater(col, vWp);
      gl_FragColor = vec4(col, 1.0);
    `,
  });
}

/* ---------- fish ---------- */
function mkFishMaterial(bodyCol, bellyCol, glow) {
  return waterMat({
    name: 'fish',
    uniforms: {
      uBody: { value: bodyCol }, uBelly: { value: bellyCol }, uGlow: { value: glow },
      uWhiten: { value: 0 },
    },
    vertexHead: /* glsl */`
      attribute float aPh;
      varying float vGl;
    `,
    vertexBody: /* glsl */`
      // tail undulation: bend increases toward the tail (negative z)
      float wag = sin(uTime*7.0 + aPh + tp.z*1.8);
      float tw = clamp(-tp.z*0.8, 0.0, 1.0);
      tp.x += wag * tw * 0.24;
      tn.x += wag * tw * 0.4;
      vGl = aPh;
    `,
    fragmentHead: `uniform vec3 uBody, uBelly; uniform float uGlow, uWhiten; varying float vGl;`,
    fragmentBody: /* glsl */`
      float belly = clamp(-vNrm.y*0.5+0.5, 0.0, 1.0);
      vec3 col = mix(uBody, uBelly, belly);
      col = mix(col, uMarble*1.05, uWhiten);
      col += uMarble*uWhiten*0.4;      // the procession is bone-white, faintly luminous
      float li = sunLight(vNrm)*uSunI*uDim;
      vec3 vd = normalize(vWp-uCamPos);
      // silver flash when the flank catches the light
      float flash = pow(abs(dot(reflect(vd,vNrm), uSunDir)), 6.0);
      col = col*(0.4+li*0.9) + uMarble*flash*0.5*uSunI;
      col += uGold*uGlow*(0.55+0.45*sin(uTime*2.4+vGl*7.0));
      col = applyWater(col, vWp);
      gl_FragColor = vec4(col, 1.0);
    `,
  });
}

/* ---------- jellyfish ---------- */
function mkJellyMaterial() {
  return waterMat({
    name: 'jelly',
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
    vertexHead: /* glsl */`
      attribute float aPh;
      varying float vPh;
    `,
    vertexBody: /* glsl */`
      float pulse = sin(uTime*1.5 + aPh);
      float rs = 1.0 + pulse*0.14*(1.0-uv.y*0.6);
      tp.x *= rs; tp.z *= rs;
      tp.y += pulse*0.08;
      vPh = aPh;
    `,
    vertexWorld: /* glsl */`
      // slow personal drift + rise
      wp4.x += sin(uTime*0.11+aPh*3.1)*2.2;
      wp4.z += cos(uTime*0.09+aPh*2.3)*2.2;
      wp4.y += sin(uTime*0.06+aPh)*1.5;
      float ev = uEventStr * (1.0 - smoothstep(20.0, 55.0, length(wp4.xyz - uEventPos)));
      wp4.xyz += normalize(uEventPos - wp4.xyz + vec3(0.001)) * ev * 1.8;
    `,
    fragmentHead: `varying float vPh;`,
    fragmentBody: /* glsl */`
      vec3 vd = normalize(vWp-uCamPos);
      float rim = pow(1.0-abs(dot(vd,vNrm)), 1.6);
      vec3 col = mix(uPetrol*1.3, uGold, 0.35+0.25*sin(vPh*3.0));
      col = col*0.25 + col*rim*1.5;
      col += uGold*pow(rim,3.0)*0.8;
      float a = 0.14 + rim*0.5;
      col = applyWater(col*1.6, vWp);
      gl_FragColor = vec4(col, a);
    `,
  });
}

/* ---------- marine snow ---------- */
function mkSnowMaterial(count) {
  return waterMat({
    name: 'snow',
    transparent: true, depthWrite: false,
    uniforms: { uBox: { value: new THREE.Vector3(240, 130, 240) } },
    vertexHead: /* glsl */`
      attribute float aSeed;
      varying float vA;
      uniform vec3 uBox;
    `,
    vertexBody: /* glsl */``,
    vertexWorld: /* glsl */`
      vec3 p = position;
      p += uCurrent * uTime * (0.35 + aSeed*0.4);
      p.y -= uTime * (0.18 + aSeed*0.35);
      p.x += sin(uTime*0.5 + aSeed*40.0)*0.8;
      p.z += cos(uTime*0.4 + aSeed*31.0)*0.8;
      // wrap into a box around the camera
      p = mod(p - uCamPos + uBox*0.5, uBox) - uBox*0.5;
      // the impossible current: nearby snow leans toward the door
      vec3 wpos = p + uCamPos;
      float ev = uEventStr * (1.0 - smoothstep(14.0, 48.0, length(wpos - uEventPos)));
      wpos += normalize(uEventPos - wpos + vec3(0.001)) * ev * 6.0 * aSeed;
      wp4 = vec4(wpos, 1.0);
      float dist = length(wpos - uCamPos);
      vA = (1.0-smoothstep(60.0, 120.0, dist)) * smoothstep(1.2, 6.0, dist);
      gl_PointSize = (1.8 + aSeed*2.6) * (150.0/max(dist,4.0));
      gl_PointSize = min(gl_PointSize, 6.0);
    `,
    fragmentHead: `varying float vA;`,
    fragmentBody: /* glsl */`
      vec2 pc = gl_PointCoord*2.0-1.0;
      float m = 1.0-smoothstep(0.4,1.0,length(pc));
      vec3 col = mix(uMarble, uFogSh*1.5, 0.4)*0.5;
      col = applyWater(col*1.3, vWp);
      gl_FragColor = vec4(col, m*vA*0.55);
    `,
  });
}

/* ---------- god-ray beams ---------- */
const matBeam = waterMat({
  name: 'beam',
  transparent: true, depthWrite: false, side: THREE.DoubleSide,
  blending: THREE.AdditiveBlending,
  vertexHead: `attribute float aPh; varying float vPh;`,
  vertexBody: /* glsl */`
    vPh = aPh;
    tp.x += sin(uTime*0.14 + aPh)*2.2*(1.0-uv.y);
  `,
  fragmentHead: `varying float vPh;`,
  fragmentBody: /* glsl */`
    float x = abs(vUvv.x*2.0-1.0);
    float core = pow(max(0.0,1.0-x), 2.2);
    float tall = smoothstep(0.0, 0.35, vUvv.y)*pow(vUvv.y,1.3);
    float flick = 0.65 + 0.35*sin(uTime*0.5 + vPh*7.0) * sin(uTime*0.23+vPh*3.0);
    vec3 col = mix(uTurq, uGold, 0.55+0.3*sin(vPh*5.0));
    float dist = length(vWp-uCamPos);
    float fade = exp(-dist*0.006);
    float a = core*tall*flick*0.34*uSunI*uDim*fade;
    gl_FragColor = vec4(col*a, a);
  `,
});

/* ---------- the surface, far above ---------- */
const matSurface = waterMat({
  name: 'surface',
  transparent: true, depthWrite: false, side: THREE.DoubleSide,
  blending: THREE.AdditiveBlending,
  fragmentBody: /* glsl */`
    float shim = caust(vWp.xz*0.02, uTime*0.35) * 0.5 + fbm2(vWp.xz*0.008+uTime*0.02)*0.7;
    vec3 vd = normalize(vWp-uCamPos);
    float sunA = pow(max(0.0,dot(vd,uSunDir)),4.0);
    float dist = length(vWp-uCamPos);
    float fade = exp(-dist*0.004);
    vec3 col = (uFogSh*0.8 + uGold*sunA*0.9 + uTurq*0.25)*shim;
    float a = fade*0.30*uSunI*uDim;
    gl_FragColor = vec4(col*a, a);
  `,
});

/* ---------- the giant ---------- */
const matGiant = waterMat({
  name: 'giant',
  uniforms: { uGlowAmt: { value: 0 } },
  vertexHead: `varying float vZ;`,
  vertexBody: /* glsl */`
    // slow full-body swim undulation
    float sw = sin(uTime*0.5 + tp.z*0.08);
    tp.x += sw * clamp(-tp.z*0.03, 0.0, 1.0) * 4.0;
    vZ = tp.z;
  `,
  fragmentHead: `uniform float uGlowAmt; varying float vZ;`,
  fragmentBody: /* glsl */`
    vec3 vd = normalize(vWp-uCamPos);
    float rim = pow(1.0-abs(dot(vd,vNrm)), 2.0);
    // when the photophores are lit, the surrounding mass becomes half-readable
    vec3 col = uInk*1.35 + uPetrol*rim*(0.85 + uGlowAmt*1.1);
    float rows = step(0.86, sin(vUvv.y*44.0)) * step(0.4, sin(vZ*0.9));
    col = applyWater(col, vWp);
    // photophores pierce the fog the way lanterns do — added after absorption
    float dist = length(vWp-uCamPos);
    col += uGold * rows * uGlowAmt * (0.5+0.5*sin(uTime*0.8+vZ*0.5)) * exp(-dist*0.006) * 0.55;
    gl_FragColor = vec4(col, 1.0);
  `,
});

/* ---------- soft additive glow sprite ---------- */
function mkGlowMaterial(color, alpha) {
  return waterMat({
    name: 'glow',
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending,
    uniforms: { uGlowCol: { value: color.clone() }, uGlowA: { value: alpha } },
    fragmentHead: `uniform vec3 uGlowCol; uniform float uGlowA;`,
    fragmentBody: /* glsl */`
      vec2 pc = vUvv*2.0-1.0;
      float m = pow(max(0.0, 1.0-length(pc)), 2.4);
      float dist = length(vWp-uCamPos);
      float fade = exp(-dist*0.008);
      gl_FragColor = vec4(uGlowCol*m*uGlowA*fade, m*uGlowA*fade);
    `,
  });
}

/* ---------- bronze (the bell) ---------- */
const matBronze = waterMat({
  name: 'bronze',
  fragmentBody: /* glsl */`
    vec3 bronze = mix(uEmber*0.5, uOlive*0.55, 0.45);
    float pat = fbm2(vWp.xz*1.4+vWp.y*1.2);
    vec3 col = mix(bronze, uTurq*0.7, smoothstep(0.45,0.75,pat)*0.7); // verdigris
    vec3 vd = normalize(vWp-uCamPos);
    float fres = pow(1.0-abs(dot(vd,vNrm)),3.0);
    float li = sunLight(vNrm)*uSunI*uDim;
    col = col*(0.3+li*0.9) + uGold*fres*0.5;
    col = applyWater(col, vWp);
    gl_FragColor = vec4(col, 1.0);
  `,
});

/* ---------- procedural mosaic canvas (shared by floors, cuttlefish, octopus) ---------- */
function makeMosaicTexture() {
  const Mr = stream('architecture:mosaic');
  const cv = document.createElement('canvas');
  cv.width = cv.height = 512;
  const g = cv.getContext('2d');
  const cols = ['#0d3745', '#3f9184', '#cfd6c8', '#b98a4a', '#d4694a', '#101c2a'];
  g.fillStyle = '#0a1420'; g.fillRect(0, 0, 512, 512);

const TESS = [
  { cyl: 10, lathe: 8, sph: 10, seg: 1 },     // low
  { cyl: 16, lathe: 12, sph: 18, seg: 2 },    // standard

function gColumn(h, sc, ruin, key) {
  const R = geoRng(key);
  const parts = [];
  const rBot = 0.52 * sc, rTop = 0.42 * sc;
  const cutT = ruin > 0.04 ? (1 - ruin * 0.82) : 1;
  const shaftH = h * cutT;

  parts.push(xf(box(rBot * 2.9, 0.3, rBot * 2.9, 0.9, 0.93, 0.93, 1.1), 0, 0.15, 0));
  parts.push(xf(box(rBot * 2.5, 0.22, rBot * 2.5, 0.93, 0.96, 0.95, 1.0), 0, 0.41, 0));
  parts.push(xf(tag(new THREE.CylinderGeometry(rBot * 1.38, rBot * 1.5, 0.2, TESS.cyl), 0.95, 0.97, 0.96, 0.95), 0, 0.6, 0));

// ---- eroded statue fragment ----

  const R = geoRng(key);

  const pts = [];
  for (let i = 0; i <= 8; i++) {

  parts.push(xf(tag(torso, 0.93, 0.96, 0.94, 1.1), 0, 0.5, 0, rr(R, -0.25, 0.25) + ruin * 0.6, rr(R, 0, TAU), rr(R, -0.2, 0.2)));
  parts.push(xf(box(1.8 * sc, 0.5, 1.8 * sc, 0.9, 0.93, 0.91, 1.0), 0, 0.25, 0));
  if (R() < 0.7) parts.push(xf(tag(new THREE.CylinderGeometry(0.16 * sc, 0.2 * sc, 1.3 * sc, 8), 0.93, 0.96, 0.94, 1.2, false),
    rr(R, 0.8, 1.6) * sc, 0.2, rr(R, -0.6, 0.6) * sc, rr(R, 0, 1.5), 0, rr(R, 0, 3)));
  return parts;
}

// ---- obelisk ----
function gObelisk(sc, ruin, key) {
  const parts = [];
  const h = 7.5 * sc * (1 - ruin * 0.55);
  const shaft = new THREE.CylinderGeometry(0.34 * sc, 0.62 * sc, h, 4, 1);
  shaft.rotateY(Math.PI / 4);
  parts.push(xf(tag(shaft, 0.9, 0.94, 0.94, 0.7), 0, h / 2 + 0.9, 0));

  if (ruin < 0.3) {
    const tip = new THREE.CylinderGeometry(0.02, 0.36 * sc, 0.8, 4, 1);
