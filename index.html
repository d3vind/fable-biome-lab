// THE RAINCATCHER — three stormwater ribs over a hung reservoir
// ================================================================
function meshFrom(B, mat){ const m = new THREE.Mesh(buildGeom(B), mat || facadeMat); m.frustumCulled = true; return m; }

const RC_METAL = col(0x191230), RC_METAL_D = col(0x0F0B1C), RC_CONC = col(0x151020);
let turbineRotors = [], reservoirY = 0;
const RCX = PLAN.raincatcher.x, RCZ = PLAN.raincatcher.z;
{
  const B = STRUCT;
  const baseTilt = PLAN.raincatcher.tilt;
  const ribs = [];
  const heights = [96, 122, 138];
  for(let k=0;k<3;k++){
    let az = baseTilt + k*(Math.PI*2/3) + rv.r(-0.16,0.16);
    const R0 = 44 + rv.r(-5,7);
    const H = heights[k] * rv.r(0.94, 1.06);
    // an anchor never lands in a ride corridor: rotate it around the plaza until it clears
    for(let t=0;t<26;t++){
      const tx = RCX + Math.cos(az)*R0, tz = RCZ + Math.sin(az)*R0;
      const gy = terrainY(tx,tz);
      if(corridorClear(tx, tz, 11.0, gy-2, gy+16) && corridorClear(tx + Math.cos(az)*7.5, tz + Math.sin(az)*7.5, 6.0, gy-2, 62)) break;
      az += 0.121;
    }
    const ax = RCX + Math.cos(az)*R0, azz = RCZ + Math.sin(az)*R0;
    const pts = [
      new THREE.Vector3(ax, 0, azz),
      new THREE.Vector3(RCX + Math.cos(az)*R0*0.80, H*0.30, RCZ + Math.sin(az)*R0*0.80),
      new THREE.Vector3(RCX + Math.cos(az)*R0*0.46, H*0.66, RCZ + Math.sin(az)*R0*0.46),
      new THREE.Vector3(RCX + Math.cos(az+0.30)*R0*0.16, H*0.94, RCZ + Math.sin(az+0.30)*R0*0.16),
      new THREE.Vector3(RCX - Math.cos(az)*R0*0.10, H, RCZ - Math.sin(az)*R0*0.10),
    ];
    ribs.push({ crv: new THREE.CatmullRomCurve3(pts, false, 'centripetal'), az, R0, H, ax, az2: azz });
    void 0;
  }
  const NB = 22;
  for(let k=0;k<3;k++){
    const rib = ribs[k];
    const samples = [];
    for(let s=0;s<=NB;s++) samples.push(rib.crv.getPoint(s/NB));
    // triangular truss: three chords, diagonals and transverse ties
    const chordR = 3.30;
    const chordPt = (p, next, ci)=>{
      const t = new THREE.Vector3().subVectors(next, p).normalize();
      const up = new THREE.Vector3(0,1,0);
      let side = new THREE.Vector3().crossVectors(up, t); if(side.lengthSq()<1e-5) side.set(1,0,0); side.normalize();
      const nrm = new THREE.Vector3().crossVectors(t, side).normalize();
      const a = ci/3*Math.PI*2 + 0.5;
      return new THREE.Vector3(
        p.x + side.x*Math.cos(a)*chordR + nrm.x*Math.sin(a)*chordR,
        p.y + side.y*Math.cos(a)*chordR + nrm.y*Math.sin(a)*chordR,
        p.z + side.z*Math.cos(a)*chordR + nrm.z*Math.sin(a)*chordR);
    };
    let prevC = null;
    for(let s=0;s<=NB;s++){
      const p = samples[s], nx = samples[Math.min(NB,s+1)];
      const cs = [0,1,2].map(ci=>chordPt(p, s===NB?samples[NB].clone().add(new THREE.Vector3(0,1,0)):nx, ci));
      if(prevC){
        for(let ci=0;ci<3;ci++){
          strut(B, prevC[ci].x,prevC[ci].y,prevC[ci].z, cs[ci].x,cs[ci].y,cs[ci].z, 1.05, RC_METAL, 3);
          const nj = (ci+1)%3;
          strut(B, prevC[ci].x,prevC[ci].y,prevC[ci].z, cs[nj].x,cs[nj].y,cs[nj].z, 0.55, RC_METAL_D, 3);
        }
      }
      for(let ci=0;ci<3;ci++){
        const nj=(ci+1)%3;
        strut(B, cs[ci].x,cs[ci].y,cs[ci].z, cs[nj].x,cs[nj].y,cs[nj].z, 0.50, RC_METAL_D, 3);
      }
      prevC = cs;
      // drainage channel riding the inner chord, with visible runoff
      if(s>0 && s%3===0){
        const c0 = cs[0];
        addFlow({ x:c0.x, y:c0.y-2.0, z:c0.z, h:6.0, r:0.34, kind:'chan', c:scaleC(col(HEX.teal),0.30), rate:1.0 });
      }
      // node markers every few bays keep the silhouette legible in fog
      if(s>1 && s%2===0){
        const teal = (s%4===0);
        const mc = teal ? scaleC(col(HEX.teal),0.95) : scaleC(col(HEX.amb),0.75);
        for(const ci of (teal ? [1,2] : [0])){
          const cN = cs[ci];
          box(B, cN.x-0.36, cN.y-0.36, cN.z-0.36, cN.x+0.36, cN.y+0.36, cN.z+0.36,
            { c:col(0x0D0914), kind:2, tint:mc, p1: teal?0:3, p2:(k*0.27+s*0.11+ci*0.2)%1, p3:0.5 });
          addGlow(cN.x, cN.y, cN.z, 6.4, mc, teal?0:3, (k*0.27+s*0.11+ci*0.2)%1, 0.95);
        }
      }
      // maintenance platform + marker light on real structure
      if(s===6 || s===12 || s===18){
        const px = p.x, pz = p.z, py = p.y;
        box(B, px-3.0, py-0.22, pz-3.0, px+3.0, py, pz+3.0, { c:RC_METAL, kind:8 });
        for(let q=0;q<4;q++){
          const a=q/4*Math.PI*2;
          strut(B, px+Math.cos(a)*2.9, py, pz+Math.sin(a)*2.9, px+Math.cos(a)*2.9, py+1.1, pz+Math.sin(a)*2.9, 0.09, RC_METAL, 3);
        }
        for(let q=0;q<4;q++){
          const a=q/4*Math.PI*2, a2=(q+1)/4*Math.PI*2;
          strut(B, px+Math.cos(a)*2.9, py+1.1, pz+Math.sin(a)*2.9, px+Math.cos(a2)*2.9, py+1.1, pz+Math.sin(a2)*2.9, 0.07, RC_METAL, 3);
        }
        // ladder cage down to the platform below
        if(s>6){
          const prev = samples[s-6];
          strut(B, px+1.6, py, pz, prev.x+1.6, prev.y, prev.z, 0.16, RC_METAL_D, 3);
          strut(B, px+2.2, py, pz, prev.x+2.2, prev.y, prev.z, 0.16, RC_METAL_D, 3);
          for(let r2=0;r2<9;r2++){
            const t=r2/9;
            const lx2 = lerp(px+1.6, prev.x+1.6, t), ly = lerp(py, prev.y, t), lz2 = lerp(pz, prev.z, t);
            strut(B, lx2, ly, lz2, lx2+0.6, ly, lz2, 0.06, RC_METAL_D, 3);
          }
        }
        const mc = scaleC(col(HEX.rose), 0.9);
        box(B, px+2.7, py+1.1, pz-0.14, px+3.0, py+1.36, pz+0.14, { c:col(0x0E0A16), kind:2, tint:mc, p1:3, p2:(k*0.31+s*0.07)%1, p3:0.4 });
        addGlow(px+2.85, py+1.24, pz, 3.2, mc, 3, (k*0.31+s*0.07)%1, 0.75);
      }
    }
    // thick base pylon with buttresses and an access door
    const bx = rib.ax, bz = rib.az2, gy = terrainY(bx,bz);
    column(B, bx, bz, gy-1.5, gy+13.5, 5.2, 8, RC_CONC, 4, 0.62);
    for(let q=0;q<4;q++){
      const a = q/4*Math.PI*2 + 0.4;
      strut(B, bx+Math.cos(a)*8.5, gy, bz+Math.sin(a)*8.5, bx+Math.cos(a)*3.0, gy+11.0, bz+Math.sin(a)*3.0, 1.5, RC_CONC, 4);
    }
    box(B, bx-8.8, gy-0.6, bz-8.8, bx+8.8, gy+0.9, bz+8.8, { c:RC_CONC, kind:4 });
    const dax = bx + Math.cos(rib.az+Math.PI)*5.2, daz = bz + Math.sin(rib.az+Math.PI)*5.2;
    yawBox(B, dax, gy+1.6, daz, 1.5, 2.6, 0.3, rib.az, { c:col(0x100B1A), kind:6, tint:scaleC(col(HEX.amb),0.55), p1:0.7, p2:0, p3:(k*0.2)%1 });
    addGlow(dax, gy+1.6, daz, 3.4, scaleC(col(HEX.amb),0.5), 0, (k*0.2)%1, 0.5);
    reflectOnRoad(dax, daz, scaleC(col(HEX.amb),0.5), 0.7, 0, (k*0.2)%1, 18, 2.6);
    // the big descending pipe: reservoir to ground, elbowed, on saddles
    const pax = bx + Math.cos(rib.az)*7.5, paz = bz + Math.sin(rib.az)*7.5;
    column(B, pax, paz, gy, 62, 1.25, 8, RC_METAL, 3, 1.0);
    for(let s2=0;s2<6;s2++){
      const sy = gy + 8 + s2*9.5;
      box(B, pax-1.9, sy, paz-0.5, pax+1.9, sy+0.7, paz+0.5, { c:RC_METAL_D, kind:3 });
    }
    addFlow({ x:pax, y:gy+0.2, z:paz, h:2.2, r:1.0, kind:'splash', c:scaleC(col(HEX.teal),0.34), rate:1.2 });
    addMist(pax, gy+1.2, paz, 4.0, 4.0, scaleC(col(HEX.teal),0.15), 0.6, k*0.33);
    // a slow beacon at the crown of every rib: the promise you can see from the first street
    {
      const top = rib.crv.getPoint(1.0);
      const bc = scaleC(col(HEX.amb), 0.95);
      box(B, top.x-0.55, top.y, top.z-0.55, top.x+0.55, top.y+1.1, top.z+0.55,
        { c:col(0x0D0914), kind:2, tint:bc, p1:3, p2:k*0.33, p3:0.6 });
      addGlow(top.x, top.y+0.6, top.z, 13.0, bc, 3, k*0.33, 1.1);
      addGlow(top.x, top.y+0.6, top.z, 28.0, scaleC(col(HEX.amb),0.5), 3, k*0.33, 0.5);
    }
  }

  // ---- the suspended reservoir: an open tank with real depth ----
  const RY = 74; reservoirY = RY;
  const RR = 34, RIN = 30.6, RD = 12.0;
  const SIDES = 26;
  for(let s=0;s<SIDES;s++){
    const a0=s/SIDES*Math.PI*2, a1=(s+1)/SIDES*Math.PI*2;
    const o0=[Math.cos(a0),Math.sin(a0)], o1=[Math.cos(a1),Math.sin(a1)];
    // outer skin
    face(B, [[RCX+o0[0]*RR, RY-RD, RCZ+o0[1]*RR],[RCX+o1[0]*RR, RY-RD, RCZ+o1[1]*RR],
             [RCX+o1[0]*RR, RY, RCZ+o1[1]*RR],[RCX+o0[0]*RR, RY, RCZ+o0[1]*RR]],
      [o0[0],0,o0[1]], RC_METAL, [[a0*RR,0],[a1*RR,0],[a1*RR,RD],[a0*RR,RD]], 3, NO_TINT, 0,0,0);
    // inner wall (visible depth)
    face(B, [[RCX+o1[0]*RIN, RY-RD, RCZ+o1[1]*RIN],[RCX+o0[0]*RIN, RY-RD, RCZ+o0[1]*RIN],
             [RCX+o0[0]*RIN, RY, RCZ+o0[1]*RIN],[RCX+o1[0]*RIN, RY, RCZ+o1[1]*RIN]],
      [-o0[0],0,-o0[1]], scaleC(RC_METAL,0.6), [[a1*RIN,0],[a0*RIN,0],[a0*RIN,RD],[a1*RIN,RD]], 3, NO_TINT, 0,0,0);
    // rim coping
    face(B, [[RCX+o0[0]*RIN, RY, RCZ+o0[1]*RIN],[RCX+o1[0]*RIN, RY, RCZ+o1[1]*RIN],
             [RCX+o1[0]*RR, RY, RCZ+o1[1]*RR],[RCX+o0[0]*RR, RY, RCZ+o0[1]*RR]],
      [0,1,0], RC_METAL, [[0,0],[2,0],[2,RR-RIN],[0,RR-RIN]], 3, NO_TINT, 0,0,0);
    // tank floor
    face(B, [[RCX, RY-RD, RCZ],[RCX+o0[0]*RIN, RY-RD, RCZ+o0[1]*RIN],[RCX+o1[0]*RIN, RY-RD, RCZ+o1[1]*RIN],[RCX, RY-RD, RCZ]],
      [0,1,0], col(0x080710), [[0,0],[RIN,0],[RIN,RIN],[0,0]], 4, NO_TINT, 0,0,0);
    // rim railing and marker lights on the ring beam
    if(s%2===0){
      strut(B, RCX+o0[0]*RR, RY, RCZ+o0[1]*RR, RCX+o0[0]*RR, RY+1.15, RCZ+o0[1]*RR, 0.10, RC_METAL, 3);
      strut(B, RCX+o0[0]*RR, RY+1.15, RCZ+o0[1]*RR, RCX+o1[0]*RR*Math.cos(0)+RCX*0, RY+1.15, RCZ+o1[1]*RR, 0.07, RC_METAL, 3);
    }
    if(s%6===0){
      const mc = scaleC(col(HEX.teal), 0.85);
      box(B, RCX+o0[0]*RR-0.2, RY+1.15, RCZ+o0[1]*RR-0.2, RCX+o0[0]*RR+0.2, RY+1.45, RCZ+o0[1]*RR+0.2,
        { c:col(0x0D0914), kind:2, tint:mc, p1:0, p2:(s*0.13)%1, p3:0.4 });
      addGlow(RCX+o0[0]*RR, RY+1.3, RCZ+o0[1]*RR, 4.2, mc, 0, (s*0.13)%1, 0.8);
    }
  }
  // ring beam and hangers from the ribs
  for(let s=0;s<SIDES;s+=2){
    const a=s/SIDES*Math.PI*2;
    strut(B, RCX+Math.cos(a)*RR, RY-RD, RCZ+Math.sin(a)*RR, RCX+Math.cos(a)*(RR+2.6), RY-RD-3.2, RCZ+Math.sin(a)*(RR+2.6), 0.42, RC_METAL, 3);
  }
  // ---- turbine hall slung beneath the tank ----
  for(let t=0;t<3;t++){
    const a = t/3*Math.PI*2 + 0.6;
    const hx = RCX+Math.cos(a)*13.5, hz = RCZ+Math.sin(a)*13.5, hy = RY-RD-7.2;
    column(B, hx, hz, hy, hy+6.4, 4.4, 10, RC_METAL, 3, 1.0);
    box(B, hx-5.0, hy-0.9, hz-5.0, hx+5.0, hy, hz+5.0, { c:RC_METAL_D, kind:3 });
    strut(B, hx, hy+6.4, hz, RCX+Math.cos(a)*RR*0.8, RY-RD, RCZ+Math.sin(a)*RR*0.8, 0.5, RC_METAL, 3);
    // the rotor: a real spinning assembly inside the housing mouth
    const RB = Builder();
    for(let b=0;b<7;b++){
      const ba = b/7*Math.PI*2;
      const c0=Math.cos(ba), s0=Math.sin(ba);
      yawBox(RB, c0*2.4, -0.0, s0*2.4, 4.2, 0.30, 1.05, -ba, { c:scaleC(RC_METAL,1.5), kind:3 });
    }
    column(RB, 0, 0, -0.7, 0.7, 1.0, 8, RC_METAL, 3, 1.0);
    const rm = meshFrom(RB);
    rm.position.set(hx, hy-1.1, hz);
    rm.rotation.x = Math.PI/2;
    scene.add(rm);
    turbineRotors.push({ mesh: rm, speed: 0.9 + t*0.22, x:hx, y:hy-1.1, z:hz });
    // turbine motion drives the spray plume and the housing light beneath it
    addFlow({ x:hx, y:terrainY(hx,hz), z:hz, h:17.0, r:2.6, kind:'column', c:scaleC(col(HEX.teal),0.15), rate:1.5, turbine:t });
    addMist(hx, terrainY(hx,hz)+2.0, hz, 7.0, 8.0, scaleC(col(HEX.teal),0.17), 0.9, t*0.33);
    const hc = scaleC(col(HEX.amb), 0.8);
    box(B, hx-0.8, hy-1.25, hz-0.8, hx+0.8, hy-1.05, hz+0.8, { c:col(0x0D0914), kind:2, tint:hc, p1:1, p2:t*0.33, p3:0.5 });
    addGlow(hx, hy-1.15, hz, 9.0, hc, 1, t*0.33, 0.9);
  }
  // ---- ground basin: everything the Raincatcher gathers lands here ----
  const basinY = terrainY(RCX, RCZ);
  for(let s=0;s<20;s++){
    const a0=s/20*Math.PI*2, a1=(s+1)/20*Math.PI*2;
    const r0=30, r1=36;
    face(B, [[RCX+Math.cos(a0)*r1, basinY+0.8, RCZ+Math.sin(a0)*r1],[RCX+Math.cos(a1)*r1, basinY+0.8, RCZ+Math.sin(a1)*r1],
             [RCX+Math.cos(a1)*r0, basinY-2.2, RCZ+Math.sin(a1)*r0],[RCX+Math.cos(a0)*r0, basinY-2.2, RCZ+Math.sin(a0)*r0]],
      [Math.cos(a0)*0.4,0.9,Math.sin(a0)*0.4], RC_CONC, [[0,0],[6,0],[6,6],[0,6]], 4, NO_TINT, 0,0,0);
  }
}

// ================================================================
// THE LAST WEIR — the downstream answer: what the city releases
// ================================================================
const WEIR = { x: PLAN.weir.x, z: PLAN.weir.z, crest: 27.0, leaves: PLAN.weir.leaves, skew: PLAN.weir.skew };
let weirGateMesh = null, weirCraneMesh = null, weirCraneSpan = 0;
{
  const B = STRUCT;
  const CW = 30;                       // bay clear width
  const PW = 11;                       // pier width
  const N = WEIR.leaves;
  const total = N*CW + (N+1)*PW;
  const ang = WEIR.skew;
  const ca = Math.cos(ang), sa = Math.sin(ang);
  const AX = (u,v)=> [WEIR.x + u*ca - v*sa, WEIR.z + u*sa + v*ca];   // u across, v downstream
  const CREST = WEIR.crest;
  const movingBay = Math.floor(N/2);

  // sea wall wings beyond the gate bays
  for(const s of [-1,1]){
    const u0 = s*(total/2), u1 = s*(total/2 + 150);
    const a = AX(u0, -9), b = AX(u1, -9), c = AX(u1, 9), d = AX(u0, 9);
    const h = CREST - 3;
    // simple mass, battered face
    const quad=(p0,p1,y0,y1,nn)=>face(B,[[p0[0],y0,p0[1]],[p1[0],y0,p1[1]],[p1[0],y1,p1[1]],[p0[0],y1,p0[1]]],nn,RC_CONC,
      [[0,y0],[Math.hypot(p1[0]-p0[0],p1[1]-p0[1]),y0],[Math.hypot(p1[0]-p0[0],p1[1]-p0[1]),y1],[0,y1]],4,NO_TINT,0,0,0);
    quad(a,b,-3,h,[-sa*(-1),0,ca*(-1)]);
    quad(c,d,-3,h,[sa,0,-ca]);
    face(B,[[a[0],h,a[1]],[b[0],h,b[1]],[c[0],h,c[1]],[d[0],h,d[1]]],[0,1,0],RC_CONC,[[0,0],[150,0],[150,18],[0,18]],4,NO_TINT,0,0,0);
    // parapet and marker lights along the wall
    for(let k=0;k<10;k++){
      const t=k/10, uu = lerp(u0,u1,t);
      const p = AX(uu, -8.4);
      box(B, p[0]-0.5, h, p[1]-0.5, p[0]+0.5, h+1.4, p[1]+0.5, { c:RC_CONC, kind:4 });
      if(k%3===0){
        const mc = scaleC(col(HEX.amb),0.7);
        box(B, p[0]-0.22, h+1.4, p[1]-0.22, p[0]+0.22, h+1.72, p[1]+0.22, { c:col(0x0D0914), kind:2, tint:mc, p1:0, p2:(k*0.17)%1, p3:0.4 });
        addGlow(p[0], h+1.56, p[1], 3.6, mc, 0, (k*0.17)%1, 0.7);
      }
    }
  }

  for(let k=0;k<=N;k++){
    const u = -total/2 + k*(CW+PW) + PW/2;
    const p0 = AX(u-PW/2, -12), p1 = AX(u+PW/2, -12), p2 = AX(u+PW/2, 26), p3 = AX(u-PW/2, 26);
    // pier mass: battered, load-bearing, with a cutwater nose upstream
    const pierQuad=(a,b,y0,y1,nn)=>face(B,[[a[0],y0,a[1]],[b[0],y0,b[1]],[b[0],y1,b[1]],[a[0],y1,a[1]]],nn,RC_CONC,
      [[0,y0],[Math.hypot(b[0]-a[0],b[1]-a[1]),y0],[Math.hypot(b[0]-a[0],b[1]-a[1]),y1],[0,y1]],4,NO_TINT,0,0,0);
    pierQuad(p0,p3,-6,CREST,[-ca,0,-sa]);
    pierQuad(p2,p1,-6,CREST,[ca,0,sa]);
    pierQuad(p1,p0,-6,CREST,[sa,0,-ca]);
    pierQuad(p3,p2,-6,CREST,[-sa,0,ca]);
    face(B,[[p0[0],CREST,p0[1]],[p1[0],CREST,p1[1]],[p2[0],CREST,p2[1]],[p3[0],CREST,p3[1]]],[0,1,0],RC_CONC,
      [[0,0],[PW,0],[PW,38],[0,38]],4,NO_TINT,0,0,0);
    // cutwater
    const n0 = AX(u, -19), m0 = AX(u-PW/2, -12), m1 = AX(u+PW/2, -12);
    tri(B, [m0[0],-6,m0[1]], [n0[0],-6,n0[1]], [n0[0],CREST,n0[1]], [-ca*0.7,0,-sa*0.7], RC_CONC, [[0,0],[8,0],[8,CREST]], 4, NO_TINT,0,0,0);
    tri(B, [m0[0],-6,m0[1]], [n0[0],CREST,n0[1]], [m0[0],CREST,m0[1]], [-ca*0.7,0,-sa*0.7], RC_CONC, [[0,0],[8,CREST],[0,CREST]], 4, NO_TINT,0,0,0);
    tri(B, [n0[0],-6,n0[1]], [m1[0],-6,m1[1]], [m1[0],CREST,m1[1]], [ca*0.7,0,sa*0.7], RC_CONC, [[0,0],[8,0],[8,CREST]], 4, NO_TINT,0,0,0);

let tramCurve = null, tramLen = 0, tramMesh = null;
{
  const B = STRUCT;
  const pts = PLAN.tram.pts, DY = PLAN.tram.deckY;
  const poly = [];
  const RCc = 26;
  for(let i=0;i<pts.length;i++){
    const Pp = new THREE.Vector3(pts[i][0], DY, pts[i][1]);
    if(i===0){ poly.push(Pp); continue; }
    const Qp = new THREE.Vector3(pts[i-1][0], DY, pts[i-1][1]);
    const seg = Pp.clone().sub(Qp); const L = Math.hypot(seg.x,seg.z);
    const dir = new THREE.Vector3(seg.x/L,0,seg.z/L);
    const rc = Math.min(RCc, L*0.4);
    poly.push(new THREE.Vector3(Pp.x-dir.x*rc, DY, Pp.z-dir.z*rc));
    if(i === pts.length-1){ poly.push(Pp); break; }
    const N2 = new THREE.Vector3(pts[i+1][0], DY, pts[i+1][1]);
    const s2 = N2.clone().sub(Pp); const L2 = Math.hypot(s2.x,s2.z);
    const d2 = new THREE.Vector3(s2.x/L2,0,s2.z/L2);
    const rc2 = Math.min(RCc, L2*0.4);
    poly.push(Pp.clone().lerp(new THREE.Vector3(Pp.x+d2.x*rc2, DY, Pp.z+d2.z*rc2), 0.5));
    poly.push(new THREE.Vector3(Pp.x+d2.x*rc2, DY, Pp.z+d2.z*rc2));
  }
  tramCurve = new THREE.CatmullRomCurve3(poly, false, 'centripetal');
  tramLen = tramCurve.getLength();
  const NS = Math.max(40, Math.round(tramLen/9));
  const samples = tramCurve.getSpacedPoints(NS);
  const DW = 4.6;
  // Where the line would meet a ride corridor at deck height it becomes a
  // flyover: the deck lifts, the piers stay outside, nothing crosses the road.
  {
    const lift = new Float32Array(NS+1);
    for(let s=0;s<=NS;s++){
      const q = distToRoute(samples[s].x, samples[s].z, 3);
      if(q.d < 34 && Math.abs(q.y - DY) < 11) lift[s] = Math.max(0, q.y + 12.5 - DY);
    }
    for(let pass=0; pass<9; pass++){
      const cp = Float32Array.from(lift);
      for(let s=0;s<=NS;s++){
        let m = cp[s];
        if(s>0) m = Math.max(m, cp[s-1]-1.15);
        if(s<NS) m = Math.max(m, cp[s+1]-1.15);
        lift[s] = m;
      }
    }
    for(let pass=0; pass<3; pass++){
      const cp = Float32Array.from(lift);
      for(let s=1;s<NS;s++) lift[s] = (cp[s-1]+cp[s]*2+cp[s+1])*0.25;
    }
    for(let s=0;s<=NS;s++) samples[s].y = DY + lift[s];
  }
  let prev = null;
  for(let s=0;s<=NS;s++){
    const p = samples[s], n = samples[Math.min(NS,s+1)], pr = samples[Math.max(0,s-1)];
    const tx = n.x-pr.x, tz = n.z-pr.z; const tl = Math.hypot(tx,tz)||1;
    const lx = tz/tl, lz = -tx/tl;
    const cur = { p, lx, lz };
    if(prev){

      const a0=[prev.p.x-prev.lx*DW, prev.p.y, prev.p.z-prev.lz*DW], a1=[prev.p.x+prev.lx*DW, prev.p.y, prev.p.z+prev.lz*DW];

      // deck top, soffit and fascias
      face(Bk,[a0,a1,b1,b0],[0,1,0],col(0x141126),[[0,s*9],[DW*2,s*9],[DW*2,(s+1)*9],[0,(s+1)*9]],4,NO_TINT,0,0,0);
      face(Bk,[[b0[0],b0[1]-1.5,b0[2]],[b1[0],b1[1]-1.5,b1[2]],[a1[0],a1[1]-1.5,a1[2]],[a0[0],a0[1]-1.5,a0[2]]],[0,-1,0],col(0x0C0A16),[[0,0],[DW*2,0],[DW*2,9],[0,9]],4,NO_TINT,0,0,0);
      face(Bk,[[a0[0],a0[1]-1.5,a0[2]],[b0[0],b0[1]-1.5,b0[2]],b0,a0],[-prev.lx,0,-prev.lz],col(0x110E20),[[0,0],[9,0],[9,1.5],[0,1.5]],4,NO_TINT,0,0,0);
      face(Bk,[b1,[b1[0],b1[1]-1.5,b1[2]],[a1[0],a1[1]-1.5,a1[2]],a1],[prev.lx,0,prev.lz],col(0x110E20),[[0,1.5],[9,0],[0,0],[0,1.5]],4,NO_TINT,0,0,0);
      // running rails

          strut(B, px, p.y-1.5, pz, p.x + lx*s2*DW, p.y-0.4, p.z + lz*s2*DW, 0.7, CONCRETE_TONES[0], 4);
          box(B, px-1.6, gY, pz-1.6, px+1.6, gY+0.6, pz+1.6, { c:CONCRETE_TONES[2], kind:4 });
          addFlow({ x:px, y:gY, z:pz, h:1.2, r:0.5, kind:'splash', c:scaleC(col(HEX.teal),0.3), rate:0.7 });
        }

    }
    // catenary masts and the contact wire
    if(s % 6 === 0 && prev){
      const mx = p.x - lx*(DW-0.5), mz = p.z - lz*(DW-0.5);

    if(prev && s%2===0){
      strut(B, prev.p.x, prev.p.y+5.9, prev.p.z, p.x, p.y+5.9, p.z, 0.05, col(0x0B0812), 3);
    }
    prev = cur;
  }
}

function buildGlowMeshes(list){

  const out = [];

      mxx=Math.max(mxx,g.x+s); mxy=Math.max(mxy,g.y+s); mxz=Math.max(mxz,g.z+s); }
    geo.boundingSphere = new THREE.Sphere(new THREE.Vector3((mnx+mxx)/2,(mny+mxy)/2,(mnz+mxz)/2),
      0.5*Math.hypot(mxx-mnx, mxy-mny, mxz-mnz));

const brightMat = new THREE.ShaderMaterial({

  fragmentShader:`uniform sampler2D tSrc; uniform float uThresh; uniform float uKnee; varying vec2 vUv;
void main(){ vec3 c = texture2D(tSrc,vUv).rgb;
  float l = max(c.r, max(c.g,c.b));
  float s = max(0.0, l - uThresh);
  s = s*s/(s + uKnee + 1e-4);
  gl_FragColor = vec4(c * (l>0.0 ? s/max(l,1e-4) : 0.0), 1.0); }`,
  depthTest:false, depthWrite:false,

const blurMat = new THREE.ShaderMaterial({
  uniforms:{ tSrc:{value:null}, uDir:{value:new THREE.Vector2(1,0)}, uTexel:{value:new THREE.Vector2(1,1)} },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader:`uniform sampler2D tSrc; uniform vec2 uDir; uniform vec2 uTexel; varying vec2 vUv;
void main(){

  c += (texture2D(tSrc,vUv+o*1.3846153846).rgb + texture2D(tSrc,vUv-o*1.3846153846).rgb)*0.3162162162;
  c += (texture2D(tSrc,vUv+o*3.2307692308).rgb + texture2D(tSrc,vUv-o*3.2307692308).rgb)*0.0702702703;
  gl_FragColor = vec4(c,1.0); }`,
  depthTest:false, depthWrite:false,
});
const downMat = new THREE.ShaderMaterial({
  uniforms:{ tSrc:{value:null}, uTexel:{value:new THREE.Vector2(1,1)} },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader:`uniform sampler2D tSrc; uniform vec2 uTexel; varying vec2 vUv;
void main(){ vec3 c = texture2D(tSrc,vUv+vec2(-1.0,-1.0)*uTexel).rgb + texture2D(tSrc,vUv+vec2(1.0,-1.0)*uTexel).rgb
  + texture2D(tSrc,vUv+vec2(-1.0,1.0)*uTexel).rgb + texture2D(tSrc,vUv+vec2(1.0,1.0)*uTexel).rgb;
  gl_FragColor = vec4(c*0.25,1.0); }`,
  depthTest:false, depthWrite:false,
});
const gradeMat = new THREE.ShaderMaterial({
  uniforms:{ tSrc:{value:null}, tB1:{value:null}, tB2:{value:null},
             uBloom:{value:Q.bloomStrength}, uTime:{value:0}, uExp:{value:1.30}, uVig:{value:0.34} },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader:`
uniform sampler2D tSrc; uniform sampler2D tB1; uniform sampler2D tB2;
uniform float uBloom; uniform float uTime; uniform float uExp; uniform float uVig;
varying vec2 vUv;
vec3 aces(vec3 x){ const float a=2.51,b=0.03,c=2.43,d=0.59,e=0.14; return clamp((x*(a*x+b))/(x*(c*x+d)+e),0.0,1.0); }
float h21(vec2 p){ vec3 q=fract(vec3(p.xyx)*vec3(0.1031,0.1030,0.0973)); q+=dot(q,q.yzx+33.33); return fract((q.x+q.y)*q.z); }
void main(){
  vec3 c = texture2D(tSrc,vUv).rgb;
  vec3 b = texture2D(tB1,vUv).rgb*0.62 + texture2D(tB2,vUv).rgb*0.38;
  c += b*uBloom;
  c *= uExp;
  c = aces(c);
  // the nocturne's own colour discipline: cool the shadows, hold the ambers
  float l = dot(c, vec3(0.2126,0.7152,0.0722));
  c = mix(c, vec3(l), -0.06);

  c = clamp(c, 0.0, 1.0);

}`,
  depthTest:false, depthWrite:false,
});

// ---- tram scheduling: one vehicle, a fixed timetable, ambient clock ----
const TRAM = { period: PLAN.tram.period, phase: PLAN.tram.phase };
const _tv = new THREE.Vector3(), _tv2 = new THREE.Vector3();
function updateTram(){
  const cyc = (ambT/TRAM.period + TRAM.phase) % 1;
  // out and back with a dwell at each end
  let u, dir;
  if(cyc < 0.44){ u = cyc/0.44; dir = 1; }
  else if(cyc < 0.50){ u = 1; dir = 1; }
  else if(cyc < 0.94){ u = 1 - (cyc-0.50)/0.44; dir = -1; }
  else { u = 0; dir = -1; }
  const ease = u<0.08 ? u/0.08 : u>0.92 ? (1-u)/0.08 : 1;
  tramCurve.getPointAt(clamp(u,0.001,0.999), _tv);
  tramCurve.getPointAt(clamp(u + dir*0.004, 0.001, 0.999), _tv2);
  tramMesh.position.copy(_tv);
  tramMesh.rotation.y = Math.atan2(_tv2.x-_tv.x, _tv2.z-_tv.z) + (dir>0?0:Math.PI);
  tramMesh.visible = ease > 0.02;
  // the tram's light travels across the wet road beneath it
  const q = distToRoute(_tv.x, _tv.z);
  const near = q.d < 90 && Math.abs(q.y - _tv.y) < 34;
  const inten = near ? clamp(1 - q.d/90, 0, 1) * ease : 0;
  U.uTramLight.value.set(_tv.x, _tv.y, _tv.z, inten*0.95);
  if(tramMesh.visible){
    pushDynGlow(_tv.x, _tv.y+2.0, _tv.z, 12.0, scaleC(col(HEX.pap),0.9), 0, 0, 0.9*ease);
    pushDynGlow(_tv.x, _tv.y+1.4, _tv.z, 20.0, scaleC(col(HEX.teal),0.6), 0, 0, 0.55*ease);
    if(inten > 0.02){
      pushDynStreak(_tv.x, q.y+0.04, _tv.z, q.tx, q.tz, 34, 5.0, scaleC(col(HEX.teal),0.75), inten*1.25);
    }
  }
}

const _m = new THREE.Matrix4(), _qt = new THREE.Quaternion(), _sc = new THREE.Vector3(1,1,1), _pv = new THREE.Vector3(), _ev = new THREE.Euler();
function updateAmbient(){
  // ground vehicles
  for(const v of vehicles){
    const t = ((ambT*v.spec.speed)/Math.max(1,v.len) + v.spec.t0) % 2;
    const u = t < 1 ? t : 2-t;
    const fwd = t < 1 ? 1 : -1;
    const x = lerp(v.path.sx, v.path.ex, u), z = lerp(v.path.sz, v.path.ez, u);
    const y = terrainY(x,z);
    const yaw = Math.atan2((v.path.ex-v.path.sx)*fwd, (v.path.ez-v.path.sz)*fwd);
    v.mesh.position.set(x, y, z);
    v.mesh.rotation.y = yaw;
    const hx = x + Math.sin(yaw)*-2.6, hz = z + Math.cos(yaw)*-2.6;
    pushDynGlow(hx, y+1.0, hz, 6.5, scaleC(col(HEX.pap),0.85), 0, 0, 0.75);
    pushDynGlow(x + Math.sin(yaw)*2.6, y+1.0, z + Math.cos(yaw)*2.6, 4.0, scaleC(col(HEX.rose),0.8), 0, 0, 0.55);
    // its headlight leaves a wake of light on any wet road it passes
    const q = distToRoute(hx, hz);
    if(q.d < q.hw + 5){
      pushDynStreak(hx, q.y+0.035, hz, q.tx, q.tz, 20, 3.0, scaleC(col(HEX.pap),0.7), clamp(1-q.d/(q.hw+5),0,1));
    }
  }
  // drones
  if(droneMesh){
    for(let i=0;i<droneCount;i++){
      const d = PLAN.drones[i];
      const a = (ambT*d.speed + d.t0)*6.2832;
      const x = d.x + Math.cos(a)*d.r, z = d.z + Math.sin(a)*d.r*0.72;
      const y = d.y + Math.sin(a*1.7 + d.t0*6.0)*5.0;
      _pv.set(x,y,z);
      _ev.set(d.tilt*Math.sin(a*2.0), -a + Math.PI/2, d.tilt*Math.cos(a*2.0));
      _qt.setFromEuler(_ev);
      _m.compose(_pv, _qt, _sc);
      droneMesh.setMatrixAt(i, _m);
      const bl = (i%3===0) ? 3 : (i%3===1) ? 2 : 0;
      pushDynGlow(x, y-0.2, z, 2.4, i%2 ? scaleC(col(HEX.rose),0.9) : scaleC(col(HEX.teal),0.9), bl, d.blink, 0.85);
    }
    droneMesh.count = droneCount;
    droneMesh.instanceMatrix.needsUpdate = true;
  }
  // skiffs on the black water, each dragging a wake
  for(const sk of skiffs){
    const sp = sk.spec;
    const t = ((ambT*sp.speed) + sp.t0) % 2;
    const u = t < 1 ? t : 2-t;
    const x = sp.x0 + sp.dx*u, z = sp.z0 + sp.dz*u;
    const yaw = Math.atan2(sp.dx*(t<1?1:-1), sp.dz*(t<1?1:-1));
    sk.mesh.position.set(x, -1.05 + Math.sin(ambT*0.8 + sp.t0*6)*0.14, z);
    sk.mesh.rotation.set(Math.sin(ambT*0.7+sp.t0*4)*0.03, yaw, Math.cos(ambT*0.55+sp.t0*3)*0.035);
    pushDynGlow(x, 1.4, z, 5.0, scaleC(col(HEX.amb),0.8), 0, 0, 0.6);
    pushDynStreak(x, -1.28, z, Math.sin(yaw), Math.cos(yaw), 26, 6.0, scaleC(col(HEX.teal),0.42), 0.55);
    pushDynStreak(x - Math.sin(yaw)*9, -1.28, z - Math.cos(yaw)*9, Math.sin(yaw), Math.cos(yaw), 30, 12.0, scaleC(col(HEX.teal),0.20), 0.4);
  }
  // the Raincatcher's turbines turn; their spray and housing light answer
  for(const r of turbineRotors){
    r.mesh.rotation.z = ambT * r.speed;
  }
  // the Last Weir cycles one gate leaf, and the sheet below it thickens
  const gc = (ambT/74 + 0.2) % 1;
  const g = gc < 0.36 ? smooth01(gc/0.36) : gc < 0.55 ? 1 : gc < 0.86 ? 1-smooth01((gc-0.55)/0.31) : 0;
  U.uWeirGate.value = g;
  if(weirGateMesh) weirGateMesh.position.y = g*9.2;
  if(weirCraneMesh){
    const cu = Math.sin(ambT*0.055)*weirCraneSpan;
    const p = WEIR.AX(cu, -5.4);
    weirCraneMesh.position.set(p[0], WEIR.crest, p[1]);
    pushDynGlow(p[0], WEIR.crest+10.2, p[1], 5.0, scaleC(col(HEX.ora),0.9), 3, 0.2, 0.8);
  }
  // wind gusts breathe through the storm
  U.uGust.value = 0.34*Math.sin(ambT*0.21) + 0.22*Math.sin(ambT*0.53+1.7);
  U.uWind.value.set(0.40 + 0.16*Math.sin(ambT*0.13), 0.14 + 0.12*Math.sin(ambT*0.17+2.1));
}

function step(dt){
  ambT += dt;
  if(!started){ holdT += dt; if(holdT > 1.0) started = true; }
  if(paused || !started){ return; }
  rideT += dt;
  // speed control, with the grade doing real work on the rider
  if(keys['KeyW'] || keys['ArrowUp'])   targetSpeed = Math.min(19, targetSpeed + 7*dt);
  if(keys['KeyS'] || keys['ArrowDown']) targetSpeed = Math.max(0,  targetSpeed - 9*dt);
  const fr = getFrame(F, s);
  // climbs cost, descents give back — proportional, so a gradient never stalls the ride
  let want = targetSpeed * (1 - clamp(fr.grade*2.4, -0.45, 0.55));
  // the authored arrival: a measured deceleration onto the overlook deck
  const remain = F.LEN - s;
  const STOP = 6.2;
  if(remain < 150) want = Math.min(want, Math.max(0, (remain - STOP) * 0.16));
  speed += (want - speed) * (1 - Math.exp(-dt*1.5));
  // arrival is declared while the rider is still rolling to a halt: no snap
  if(!ended && remain < STOP + 12 && speed < 0.45){ ended = true; endT = 0; }
  if(remain <= STOP){ speed = 0; }
  if(ended) endT += dt;
  const ds = speed*dt;
  s = Math.min(s + ds, F.LEN - 0.02);
  if(!DEBUG_JUMP) earned += ds;

  // steering, fixed-tick, bounded by the road that is actually there
  const bound = Math.max(1.4, Math.min(RIDE_HALF, fr.hw - 1.9));
  let steer = 0;
  if(keys['KeyA'] || keys['ArrowLeft'])  steer += 1;
  if(keys['KeyD'] || keys['ArrowRight']) steer -= 1;
  latTarget = clamp(latTarget + steer*3.1*dt, -bound, bound);
  if(steer === 0) latTarget *= (1 - dt*0.30);
  const stiff = 9.0, damp = 5.4;
  latVel += ((latTarget - lat)*stiff - latVel*damp)*dt;
  lat += latVel*dt;
  lat = clamp(lat, -bound-0.25, bound+0.25);

  // the fork: the line you are holding chooses the road you get
  if(!branchLatched && s >= D_FORK_GATE){
    const leftKey = PLAN.fork.leftBranch, rightKey = PLAN.fork.rightBranch;
    branch = Math.abs(lat) < 0.35 ? PLAN.fork.defaultBranch : (lat > 0 ? leftKey : rightKey);
    branchLatched = true;
    F = BR[branch];
  }
  // banking and curve anticipation
  const kk = fr.k;
  antic += ((getFrame(F, Math.min(F.LEN-1, s + Math.max(14, speed*2.0))).k - antic))*(1-Math.exp(-dt*3.0));
  rollNow += ((-kk*speed*1.05 - rollNow))*(1-Math.exp(-dt*3.4));
  // look recentres gently when the mouse is released
  if(!dragging){ yawOff *= (1-dt*0.7); pitOff *= (1-dt*0.7); }
}

function frame(now){
  requestAnimationFrame(frame);
  let dt = (now - last)/1000; last = now;
  if(!(dt > 0)) dt = 1/60;
  dt = Math.min(dt, 0.25);
  stats.frames.push(dt*1000); if(stats.frames.length > 900) stats.frames.shift();
  fpsAcc += dt; fpsN++;
  if(fpsAcc > 0.5){ stats.fps = fpsN/fpsAcc; fpsAcc = 0; fpsN = 0; }

  acc += dt;
  let guard = 0;
  while(acc >= TICK && guard++ < 32){ step(TICK); acc -= TICK; }

  U.uTime.value = ambT;
  U.uRideTime.value = rideT;

  const fr = getFrame(F, s);
  const eyeH = 1.55;
  let px = fr.x + fr.lx*lat, pz = fr.z + fr.lz*lat, py = fr.y + eyeH;
  let yaw = Math.atan2(-fr.tx, -fr.tz) + yawOff - antic*3.4;
  let pitch = pitOff + Math.asin(clamp(fr.ty, -1, 1))*0.55;
  if(CHASE_PROOF){ px -= fr.tx*3.6; pz -= fr.tz*3.6; py += 1.05; pitch -= 0.10; }
  // the arrival turns the rider back toward the city they came through
  if(ended){
    const t = smooth01(clamp((endT-0.8)/9.5, 0, 1));
    yaw += t*2.48;                 // the city, the tram line and the Raincatcher come back
    pitch += t*0.085;
    py += t*0.26;
  }
  _camPos.set(px, py, pz);
  camera.position.copy(_camPos);
  camera.rotation.set(0,0,0);
  camera.rotateY(yaw); camera.rotateX(pitch); camera.rotateZ(rollNow*0.5);
  U.uCam.value.copy(_camPos);
  updateRoadUniform();
  updateFog(PLAN.chapters[fr.ch].key, dt);

  dynG = 0; dynS = 0;
  updateTram();
  updateAmbient();
  for(let i=dynG;i<DYN_GLOW;i++) dynGlowSize[i] = 0;
  for(let i=dynS;i<DYN_STREAK;i++){ dynStrDir[i*4+2] = 0; dynStrDir[i*4+3] = 0; }
  dynGlowMesh.geometry.attributes.iPos.needsUpdate = true;
  dynGlowMesh.geometry.attributes.iSize.needsUpdate = true;
  dynGlowMesh.geometry.attributes.iCol.needsUpdate = true;
  dynGlowMesh.geometry.attributes.iMPI.needsUpdate = true;
  dynStrMesh.geometry.attributes.iPos.needsUpdate = true;
  dynStrMesh.geometry.attributes.iDir.needsUpdate = true;
  dynStrMesh.geometry.attributes.iCol.needsUpdate = true;
  dynStrMesh.geometry.attributes.iMPI.needsUpdate = true;

  // ---- render: geometry the fog has already swallowed is not submitted ----
  {
    const far = U.uFogFar.value * 1.06;
    for(let i=0;i<staticMeshes.length;i++){
      const m = staticMeshes[i], bs = m.geometry.boundingSphere;
      if(!bs){ m.visible = true; continue; }
      const dx = bs.center.x - _camPos.x, dy = bs.center.y - _camPos.y, dz = bs.center.z - _camPos.z;
      m.visible = (Math.sqrt(dx*dx+dy*dy+dz*dz) - bs.radius) < far;
    }
  }
  renderer.info.autoReset = false;
  renderer.info.reset();
  renderer.setRenderTarget(rtScene);
  renderer.clear();
  renderer.render(scene, camera);
  brightMat.uniforms.tSrc.value = rtScene.texture; blit(brightMat, rtA);
  blurMat.uniforms.tSrc.value = rtA.texture; blurMat.uniforms.uDir.value.set(1,0);
  blurMat.uniforms.uTexel.value.set(1/rtA.width, 1/rtA.height); blit(blurMat, rtB);
  blurMat.uniforms.tSrc.value = rtB.texture; blurMat.uniforms.uDir.value.set(0,1); blit(blurMat, rtA);
  downMat.uniforms.tSrc.value = rtA.texture; downMat.uniforms.uTexel.value.set(1/rtA.width, 1/rtA.height); blit(downMat, rtC);
  blurMat.uniforms.tSrc.value = rtC.texture; blurMat.uniforms.uDir.value.set(1,0);
  blurMat.uniforms.uTexel.value.set(1/rtC.width, 1/rtC.height); blit(blurMat, rtD);
  blurMat.uniforms.tSrc.value = rtD.texture; blurMat.uniforms.uDir.value.set(0,1); blit(blurMat, rtC);
  gradeMat.uniforms.tSrc.value = rtScene.texture;
  gradeMat.uniforms.tB1.value = rtA.texture;
  gradeMat.uniforms.tB2.value = rtC.texture;
  gradeMat.uniforms.uTime.value = ambT;
  blit(gradeMat, null);
  stats.calls = renderer.info.render.calls;
  stats.tris = renderer.info.render.triangles;
  if(firstFrame){ firstFrame = false; }
  updateProof(fr);
}

// ================================================================
// PROOF
// ================================================================
function pct(arr, p){
  if(!arr.length) return 0;
  const a = arr.slice().sort((x,y)=>x-y);
  return a[Math.min(a.length-1, Math.floor(a.length*p))];
}
const PROOF = {
  world: 'afterlight-floodline',
  seed: SEED,
  quality: { requested: QUALITY_REQUESTED, effective: QUALITY, note: QUALITY_NOTE,
             dprCap: Q.dprCap, dpr: DPR, renderScale: Q.renderScale },
  webgl2: true,
  glRenderer: GL_INFO,
  hashes: HASHES,
  route: {
    branches: {
      ledgeline:  { length: BR.ledgeline.LEN,  turns: PLAN.turnsA, chapters: SPANS.ledgeline.map(c=>({ key:c.key, name:c.name, start:+c.start.toFixed(1), end:+c.end.toFixed(1), length:+c.length.toFixed(1) })) },
      underworks: { length: BR.underworks.LEN, turns: PLAN.turnsB, chapters: SPANS.underworks.map(c=>({ key:c.key, name:c.name, start:+c.start.toFixed(1), end:+c.end.toFixed(1), length:+c.length.toFixed(1) })) },
    },
    forkDistance: FORKGEO.D_FORK,
    forkGate: D_FORK_GATE,
    rejoin: FORKGEO.RJ,
    leftBranch: PLAN.fork.leftBranch,
    rightBranch: PLAN.fork.rightBranch,
    defaultBranch: PLAN.fork.defaultBranch,
    forkGeometry: {
      throatOffset: FORKGEO.OFF, throatHalfWidth: FORKGEO.THROAT, driftLength: FORKGEO.RAMP,
      ledgelineSpan: +(FORKGEO.RJ.ledgeline - FORKGEO.D_FORK).toFixed(1),
      underworksSpan: +(FORKGEO.RJ.underworks - FORKGEO.D_FORK).toFixed(1),
      // sampled from the built branches: where each road actually goes
      profile: (function(){
        const out = {};
        for(const key of BRANCH_KEYS){
          const F = BR[key], a = FORKGEO.D_FORK, b = FORKGEO.RJ[key];
          const pts = [], ys = [], secs = {};
          for(let t=0;t<=8;t++){
            const fr = getFrame(F, lerp(a,b,t/8));
            pts.push([+fr.x.toFixed(1), +fr.y.toFixed(1), +fr.z.toFixed(1)]);
            ys.push(+fr.y.toFixed(1));
            secs[fr.sec] = (secs[fr.sec]||0)+1;
          }
          out[key] = { span:+(b-a).toFixed(1), minY:Math.min.apply(null,ys), maxY:Math.max.apply(null,ys),
                       samples:pts, sections:secs };
        }
        out.separationMax = (function(){
          let m = 0;
          const A = BR.ledgeline, B2 = BR.underworks;
          for(let t=0;t<=20;t++){
            const fa = getFrame(A, lerp(FORKGEO.D_FORK, FORKGEO.RJ.ledgeline, t/20));
            const ax = fa.x, az = fa.z;
            const fb = getFrame(B2, lerp(FORKGEO.D_FORK, FORKGEO.RJ.underworks, t/20));
            m = Math.max(m, Math.hypot(ax-fb.x, az-fb.z));
          }
          return +m.toFixed(1);
        })();
        return out;
      })(),
    },
    nodes: { ledgeline: PLAN.nodesA.length, underworks: PLAN.nodesB.length },
  },
  city: {
    buildings: 0, byArchetype: archCensus,
    districts: Object.keys(DISTRICT_STYLE),
    districtSeeds: PLAN.districtSeeds.map(s2=>({ i:s2.i, j:s2.j, key:s2.key })),
    signDesigns: SIGN_DESIGNS, signsPlaced: 0,
    lamps: 0, props: 0, gullies: 0, glowSources: 0, reflections: 0, waterFeatures: 0, mistVolumes: 0,
    humans: 0, cellPitch: G, extent: { i:IMAX, j:JLAND, bayZ: BAY_Z },
  },
  rain: { streaks: RAIN_N, nearStreaks: NEARRAIN_N, splashes: SPLASH_N },
  traffic: { tram: 1, ground: 0, dronesPlanned: 0, dronesRealized: 0, skiffs: 0 },
  landmarks: {
    raincatcher: { x:+RCX.toFixed(1), z:+RCZ.toFixed(1), reservoirY: reservoirY, ribs:3, turbines:3, approachSide: PLAN.raincatcher.side },
    lastWeir: { x:+WEIR.x.toFixed(1), z:+WEIR.z.toFixed(1), crest: WEIR.crest, gateBays: WEIR.leaves, movingLeaf: WEIR.movingBay, skew:+WEIR.skew.toFixed(3) },
    tram: { deckY:+PLAN.tram.deckY.toFixed(2), period:+PLAN.tram.period.toFixed(2), length:0 },
  },
  events: PLAN.events.map(e=>({ kind:e.kind, t:+e.t.toFixed(2), dur:+e.dur.toFixed(2) })),
  causality: [
    'tram headlight pool travels across the wet road as the tram passes (uTramLight)',
    'roof scuppers feed downspouts, downspouts splash into kerb channels, channels run to grated gullies',
    'turbine rotation drives the Raincatcher spray columns and their housing light',
    'the moving weir leaf changes spillway sheet width, speed and downstream race',
    'every road reflection shares its source light’s flicker mode and phase, so a failing sign takes its reflection with it',
    'ground vehicles and skiffs drag their own light along the surface they pass over',
  ],
  controls: 'W/S speed · A/D line/fork · mouse drag look · Space pause · R restart',
  debugJump: DEBUG_JUMP,
  chaseProof: CHASE_PROOF,
  // live
  distance: 0, earnedDistance: 0, chapter: '', chapterIndex: 0, branch: null, branchLatched: false,
  speed: 0, targetSpeed: 9, lateral: 0, rideClock: 0, ambientClock: 0, ended: false,
  drawCalls: 0, triangles: 0, fps: 0, frameMedianMs: 0, frameP95Ms: 0, frameP99Ms: 0,
  cameraY: 0, position: [0,0,0],
};
PROOF.city.buildings = buildingCount;
PROOF.city.signsPlaced = signInstances.length;
PROOF.city.signAnchors = signAnchors.length;
PROOF.city.shopfronts = shopfronts.length;
PROOF.city.lamps = lampCount;
PROOF.city.props = propCount;
PROOF.city.gullies = grateCount;
PROOF.city.glowSources = glowList.length;
PROOF.city.reflections = streakList.length;
PROOF.city.waterFeatures = flowList.length;
PROOF.city.mistVolumes = mistList.length;
PROOF.city.humans = Math.min(humanList.length, 9);
PROOF.traffic.ground = vehicles.length;
PROOF.traffic.dronesPlanned = PLAN.drones.length;
PROOF.traffic.dronesRealized = droneCount;
PROOF.traffic.skiffs = skiffs.length;
PROOF.landmarks.tram.length = tramLen;
PROOF.staticMeshes = staticMeshes.length;
PROOF.chunks = { near: nearChunks.size, far: farChunks.size, road: roadChunks.size, struct: structChunks.size };

function updateProof(fr){
  PROOF.distance = +s.toFixed(2);
  PROOF.earnedDistance = +earned.toFixed(2);
  PROOF.chapterIndex = fr.ch;
  PROOF.chapter = PLAN.chapters[fr.ch].name;
  PROOF.branch = branch;
  PROOF.branchLatched = branchLatched;
  PROOF.routeLength = F.LEN;
  PROOF.speed = +speed.toFixed(3);
  PROOF.targetSpeed = +targetSpeed.toFixed(2);
  PROOF.lateral = +lat.toFixed(3);
  PROOF.laneHalfWidth = +fr.hw.toFixed(2);
  PROOF.rideClock = +rideT.toFixed(2);
  PROOF.ambientClock = +ambT.toFixed(2);
  PROOF.paused = paused;
  PROOF.ended = ended;
  PROOF.endClock = +endT.toFixed(2);
  PROOF.drawCalls = stats.calls;
  PROOF.triangles = stats.tris;
  PROOF.fps = +stats.fps.toFixed(1);
  PROOF.frameMedianMs = +pct(stats.frames, 0.5).toFixed(2);
  PROOF.frameP95Ms = +pct(stats.frames, 0.95).toFixed(2);
  PROOF.frameP99Ms = +pct(stats.frames, 0.99).toFixed(2);
  PROOF.position = [+fr.x.toFixed(1), +fr.y.toFixed(1), +fr.z.toFixed(1)];
  PROOF.cameraY = +camera.position.y.toFixed(2);
  PROOF.gateState = +U.uWeirGate.value.toFixed(3);
  PROOF.tramLight = +U.uTramLight.value.w.toFixed(3);
}
window.__proof = PROOF;
requestAnimationFrame(frame);
</script>
