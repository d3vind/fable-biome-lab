/* ------------------------------------------------------------------ query -- */
function parseQuery() {
  const q = {};

/* ---------------------------------------------------------------- sha256 -- */

const SHA_K = new Uint32Array([

  0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
  0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,

  0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
  0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,

  padded.set(bytes); padded[bytes.length] = 0x80;

  dv.setUint32(padded.length - 8, Math.floor(bitLen / 0x100000000));
  dv.setUint32(padded.length - 4, bitLen >>> 0);

  const w = new Uint32Array(64);
  for (let off = 0; off < padded.length; off += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(off + i * 4);
    for (let i = 16; i < 64; i++) {
      const a = w[i - 15], b = w[i - 2];
      const s0 = ((a >>> 7) | (a << 25)) ^ ((a >>> 18) | (a << 14)) ^ (a >>> 3);
      const s1 = ((b >>> 17) | (b << 15)) ^ ((b >>> 19) | (b << 13)) ^ (b >>> 10);
      w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
    }

    for (let i = 0; i < 64; i++) {
      const S1 = ((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7));
      const ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + SHA_K[i] + w[i]) | 0;
      const S0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10));

    H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;

    h = Math.imul(h, 0x01000193) >>> 0;

    a = b ^ (b >>> 9); b = c + (c << 3) | 0;
    c = (c << 21) | (c >>> 11); c = c + t | 0;

    const t = (a + b | 0) + d | 0; d = d + 1 | 0;
    a = b ^ (b >>> 9); b = c + (c << 3) | 0;

    return (t >>> 0) / 4294967296;

  rng.int = (lo, hi) => lo + Math.floor(rng() * (hi - lo + 1));
  rng.pick = (arr) => arr[Math.floor(rng() * arr.length) % arr.length];
  rng.sign = () => (rng() < 0.5 ? -1 : 1);
  rng.chance = (p) => rng() < p;

/* Named plan streams — planned truth NEVER touches Math.random(). */
const STREAM_NAMES = ['route','fork','terrain','holes','groundworks','planting',
  'maintenance','birds','creatures','weather','ambient','rare'];
function makeStreams(seed, scope) {
  const s = {};
  for (const n of STREAM_NAMES) s[n] = makeRng(seed + '::' + scope + '::' + n);
  return s;
}

/* -------------------------------------------------------- canonical JSON -- */
const CANON = { version: 1, decimalPlaces: 3, objectKeyOrder: 'lexicographic', arrayOrder: 'as-authored' };
function canonNum(n) {
  if (typeof n !== 'number' || !isFinite(n)) throw new Error('canonNum: non-finite value in plan: ' + n);
  let v = Math.round(n * 1000) / 1000;
  if (Object.is(v, -0)) v = 0;
  return v;
}
function canonicalize(value) {
  if (typeof value === 'number') return canonNum(value);
  if (Array.isArray(value)) return value.map(canonicalize);
  if (value && typeof value === 'object') {
    const out = {};
    for (const k of Object.keys(value).sort()) out[k] = canonicalize(value[k]);
    return out;
  }
  return value;
}
function canonicalJson(value) { return JSON.stringify(canonicalize(value)); }

/* ------------------------------------------------------------------ math -- */
const TAU = Math.PI * 2, DEG = Math.PI / 180;

const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

  const t = len2 > 1e-9 ? clamp((apx * abx + apz * abz) / len2, 0, 1) : 0;

/* ============================================================== ROUTES ===== */
/* A set-piece route is authored from bend + swell primitives, integrated to
   frames at exactly FRAME_STEP spacing. Entry pose is the local origin heading

function headingAt(bends, s) {
  let th = 0;
  for (const b of bends) th += b.turnDeg * DEG * sstep5((s - b.s0) / b.len);
  return th;
}

  let e = 0;
  for (const w of swells) e += w.amp * bump((s - w.c) / w.half);
  return e;
}
function gradeAt(swells, s) {
  const h = 0.5;
  return (elevAt(swells, s + h) - elevAt(swells, s - h)) / (2 * h);
}

function buildFrames(length, bends, swells) {
  const n = Math.round(length / FRAME_STEP) + 1;
  const frames = new Array(n);
  let x = 0, z = 0;
  const SUB = 4, ds = FRAME_STEP / SUB;
  let s = 0;
  for (let i = 0; i < n; i++) {
    const th = headingAt(bends, s);
    const tx = Math.sin(th), tz = Math.cos(th);
    const thN = headingAt(bends, Math.min(s + 1, length));
    const thP = headingAt(bends, Math.max(s - 1, 0));
    const k = (thN - thP) / 2; // rad per metre (signed; + = left)
    const y = elevAt(swells, s);
    const g = gradeAt(swells, s);
    frames[i] = { s, x, y, z, tx, tz, lx: tz, lz: -tx, k,
      elevationM: y, gradePercent: g * 100 };
    for (let j = 0; j < SUB; j++) {
      const sm = s + (j + 0.5) * ds;
      const thm = headingAt(bends, sm);
      x += Math.sin(thm) * ds; z += Math.cos(thm) * ds;
    }
    s += FRAME_STEP;
  }
  return frames;
}

/* Worst heading change per 10 m over a frame list (report + guard). */
function worstHeadingPer10m(frames) {
  let worst = 0;
  const stride = Math.round(10 / FRAME_STEP);
  for (let i = 0; i + stride < frames.length; i++) {
    const a = frames[i], b = frames[i + stride];
    let d = Math.atan2(b.tx, b.tz) - Math.atan2(a.tx, a.tz);
    while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU;
    d = Math.abs(d) / DEG;
    if (d > worst) worst = d;
  }
  return worst;
}

    const f = frameAtLocal(piece.frames, s);
    const o = off(s);
    pts.push({ sA: s, o, x: f.x + f.lx * o, z: f.z + f.lz * o, y: f.y + dy(s) });
  }
  // arclength resample at FRAME_STEP
  let total = 0;
  const acc = [0];
  for (let i = 1; i < pts.length; i++) { total += dist2(pts[i-1].x, pts[i-1].z, pts[i].x, pts[i].z); acc.push(total); }
  const nB = Math.max(2, Math.round(total / FRAME_STEP));
  const bFrames = new Array(nB + 1);
  let seg = 0;
  for (let i = 0; i <= nB; i++) {
    const target = (i / nB) * total;
    while (seg < acc.length - 2 && acc[seg + 1] < target) seg++;
    const t = (target - acc[seg]) / Math.max(1e-9, acc[seg + 1] - acc[seg]);
    const a = pts[seg], b = pts[seg + 1];
    bFrames[i] = { s: i * FRAME_STEP,
      x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t), z: lerp(a.z, b.z, t),
      sA: lerp(a.sA, b.sA, t), oA: lerp(a.o, b.o, t),
      tx: 0, tz: 1, lx: 1, lz: 0, k: 0, elevationM: 0, gradePercent: 0 };
  }
  // tangents / curvature / grade numerically
  for (let i = 0; i <= nB; i++) {
    const p = bFrames[Math.max(0, i - 1)], nx = bFrames[Math.min(nB, i + 1)];
    const dx = nx.x - p.x, dz = nx.z - p.z;
    const L = Math.max(1e-9, Math.sqrt(dx * dx + dz * dz));
    const f = bFrames[i];
    f.tx = dx / L; f.tz = dz / L; f.lx = f.tz; f.lz = -f.tx;
    f.elevationM = f.y;
    f.gradePercent = ((nx.y - p.y) / L) * 100;
  }
  for (let i = 0; i <= nB; i++) {
    const p = bFrames[Math.max(0, i - 1)], nx = bFrames[Math.min(nB, i + 1)];
    let dth = Math.atan2(nx.tx, nx.tz) - Math.atan2(p.tx, p.tz);
    while (dth > Math.PI) dth -= TAU; while (dth < -Math.PI) dth += TAU;
    bFrames[i].k = dth / (2 * FRAME_STEP);
  }
  // exact endpoint sharing with arm A (contract: shared frame objects)
  const fD = piece.frames[Math.round(sD / FRAME_STEP)];
  const fR = piece.frames[Math.round(sR / FRAME_STEP)];
  bFrames[0] = fD; bFrames[nB] = fR;
  fork.armBFrames = bFrames;
  fork.armBLength = nB * FRAME_STEP;
  fork.offAt = off;
  fork.dyAt = dy;
  // SL polyline of arm B in arm-A route space (for carve/classify), every 4 m
  const sl = [];
  for (let s = sD; s <= sR + 1e-6; s += 4) sl.push([s, off(s), dy(s)]);
  fork.slPoly = sl;
  // separation zones: wedge while |off| < sepSplit, island beyond
  fork.sepSplit = 16.4;   // arms + collars fully clear before the island opens
  let sSplitA = sD, sSplitB = sR;
  for (let s = sD; s <= sR; s += 1) { if (Math.abs(off(s)) >= fork.sepSplit) { sSplitA = s; break; } }
  for (let s = sR; s >= sD; s -= 1) { if (Math.abs(off(s)) >= fork.sepSplit) { sSplitB = s; break; } }
  fork.wedgeIn = { s0: sD, s1: sSplitA };
  fork.wedgeOut = { s0: sSplitB, s1: sR };
  return fork;
}

/* Interpolated frame lookup on a frame list at local station s. */
function frameAtLocal(frames, s) {
  const maxS = (frames.length - 1) * FRAME_STEP;
  const cs = clamp(s, 0, maxS);
  const i = Math.min(frames.length - 2, Math.floor(cs / FRAME_STEP));
  const t = cs / FRAME_STEP - i;
  const a = frames[i], b = frames[i + 1];
  const tx = lerp(a.tx, b.tx, t), tz = lerp(a.tz, b.tz, t);
  const L = Math.max(1e-9, Math.sqrt(tx * tx + tz * tz));
  return {
    s: cs,
    x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t), z: lerp(a.z, b.z, t),
    tx: tx / L, tz: tz / L, lx: tz / L, lz: -tx / L,
    k: lerp(a.k, b.k, t),
    elevationM: lerp(a.elevationM, b.elevationM, t),
    gradePercent: lerp(a.gradePercent, b.gradePercent, t),
  };
}

/* Chunk slicing: chunk c carries frames [c*100 .. (c+1)*100], and for c>0 the
   preceding OVERLAP_FRAMES frames — as the SAME frame objects (contract). */
function sliceChunks(frames) {
  const lastIdx = frames.length - 1;
  const count = Math.ceil(lastIdx / CHUNK_FRAMES);
  const chunks = [];
  for (let c = 0; c < count; c++) {
    const i0 = c * CHUNK_FRAMES, i1 = Math.min(lastIdx, (c + 1) * CHUNK_FRAMES);
    const startWithOverlap = c > 0 ? i0 - OVERLAP_FRAMES : i0;
    chunks.push({
      ci: c, s0: i0 * FRAME_STEP, s1: i1 * FRAME_STEP,
      frames: frames.slice(startWithOverlap, i1 + 1),
      overlap: c > 0 ? OVERLAP_FRAMES : 0,
    });
  }
  return chunks;
}

/* ======================================================== COURSE AUTHORING == */
/* All course features live in arm-A route space: s = station, l = lateral
   (positive left). Everything here is plan truth drawn from named streams. */

function newFeatureSet() {
  return {
    lawns: [], holes: [], beds: [], stands: [], specimen: [], trees: [],
    structures: [], flags: [], sprinklers: [], heads: [], details: [],
    swales: [], drainLines: [], landLobes: [], airPockets: [], events: [],
    pond: null, creek: null, bridge: null, boundaryL: [], boundaryR: [],
    natives: [], evCurve: [], slots: [], farFlags: [], emptyRings: [],
  };
}
/* Blocking geometry may never sit inside the sovereign radius. */
function guardLat(l, halfExtent) {
  const edge = Math.abs(l) - (halfExtent || 0);
  if (edge < SOVEREIGN_R) {
    const sign = l < 0 ? -1 : 1;
    return sign * (SOVEREIGN_R + (halfExtent || 0) + 0.2);
  }
  return l;
}
function span(o, s0, s1) { o.sMin = s0; o.sMax = s1; return o; }

/* Property boundary: smooth per-side half-width curve. Neutral ends pinch to a
   plain verge so the handoff carries no identity. */
function makeBoundary(streams, L, wideLo, wideHi) {
  const n = Math.ceil(L / 120) + 1;
  const left = [], right = [];
  for (let i = 0; i < n; i++) {
    const s = (i / (n - 1)) * L;
    const endPinch = Math.min(sstep(40, NEUTRAL_M + 60, s), sstep(40, NEUTRAL_M + 60, L - s));
    const wl = lerp(24, streams.terrain.range(wideLo, wideHi), endPinch);
    const wr = lerp(24, streams.terrain.range(wideLo, wideHi), endPinch);
    left.push(wl); right.push(wr);
  }
  return { left, right, step: L / (n - 1) };
}
function boundaryAt(F, s, side) {
  const b = F.boundary;
  const i = clamp(Math.floor(s / b.step), 0, b.left.length - 2);
  const t = clamp(s / b.step - i, 0, 1);
  const arr = side > 0 ? b.left : b.right;
  const u = t * t * (3 - 2 * t);
  return lerp(arr[i], arr[i + 1], u);
}

/* --- greens / bunkers / holes ---------------------------------------------- */
function mkGreen(streams, cs, cl, opts) {
  const R = streams.holes;
  const rx = opts.rx ?? R.range(11, 16);
  const rz = opts.rz ?? R.range(9.5, 14);
  const rot = opts.rot ?? R.range(0, Math.PI);
  return span({
    cs, cl, rx, rz, rot,
    padH: opts.padH ?? R.range(0.55, 0.95),
    tierDrop: opts.tier ?? (R.chance(0.7) ? R.range(0.22, 0.34) : 0),
    tierRot: R.range(0, Math.PI),
    pitchDir: opts.pitchDir ?? Math.PI, // pitches toward its approach
    pitch: R.range(0.010, 0.016),
  }, cs - rx - 26, cs + rx + 26);
}
function mkBunker(streams, cs, cl, opts) {
  const R = streams.holes;
  const nLobes = opts.lobes ?? R.int(1, 3);
  const lobes = [];
  const baseR = opts.r ?? R.range(4.5, 8.0);
  for (let i = 0; i < nLobes; i++) {
    lobes.push({
      ds: (i === 0 ? 0 : R.range(-baseR, baseR) * 1.1),
      dl: (i === 0 ? 0 : R.range(-baseR, baseR) * 0.9),
      rx: baseR * R.range(0.6, 1.0), rz: baseR * R.range(0.5, 0.85),
      rot: R.range(0, Math.PI),
    });
  }
  return span({
    cs, cl, lobes,
    floorDrop: R.range(0.35, 0.55),
    faceH: opts.faceH ?? R.range(0.45, 0.95),
    faceDir: opts.faceDir ?? 0,   // route-space angle the built-up face points AWAY from
    carry: R.chance(0.22),        // one unswept sand carry near this bunker
  }, cs - baseR * 2.4, cs + baseR * 2.4);
}
/* A hole: tee platforms, a fairway polyline with width profile, bunkers, a
   green with pin + yesterday's plug. side: +1 left / -1 right. */
function mkHole(F, streams, spec) {
  const R = streams.holes;
  const { id, par, s0, s1, side, lNear, lFar, backward } = spec;
  const sA = backward ? s1 : s0, sB = backward ? s0 : s1;
  const dog = R.range(-1, 1) * (par >= 4 ? R.range(10, 26) : 4);
  const midL = side * lerp(Math.abs(lNear), Math.abs(lFar), 0.55) + dog * 0.4;
  const line = [
    [sA, side * Math.abs(lNear)],
    [lerp(sA, sB, 0.34), side * Math.abs(lerp(lNear, lFar, 0.45)) + dog * 0.5],
    [lerp(sA, sB, 0.68), midL],
    [sB, side * Math.abs(lFar)],
  ];
  const green = mkGreen(streams, sB, side * Math.abs(lFar), spec.green || {});
  const tees = [];
  const teeRot = Math.atan2(line[1][1] - line[0][1], line[1][0] - line[0][0]);
  for (let i = 0; i < 2; i++) {
    tees.push(span({
      cs: sA - Math.cos(teeRot) * (i * 14), cl: line[0][1] - Math.sin(teeRot) * (i * 14) + R.range(-2, 2),
      hx: R.range(5, 7.5), hz: R.range(3.2, 4.4), rot: teeRot, markers: i === 0 ? 'back' : 'day',
    }, sA - 20, sA + 20));
  }
  const bunkers = [];
  const nGreenside = R.int(1, 3);
  for (let i = 0; i < nGreenside; i++) {
    const ang = R.range(0, TAU);
    const d = green.rx + R.range(4, 9);
    let bl = green.cl + Math.sin(ang) * d;
    // keep sand out of the sovereign corridor unless the author asked for adjacency
    if (!spec.allowRoadside) bl = guardLat(bl, 9) ;
    bunkers.push(mkBunker(streams, green.cs + Math.cos(ang) * d * 0.8, bl,
      { faceDir: Math.atan2(green.cl - bl, green.cs - (green.cs + Math.cos(ang) * d * 0.8)) }));
  }
  if (par >= 4 && R.chance(0.8)) {
    const t = R.range(0.45, 0.7);
    const pd = polyDist(line, lerp(sA, sB, t), 0);
    bunkers.push(mkBunker(streams, lerp(sA, sB, t),
      guardLat(line[1][1] + R.sign() * R.range(14, 20), 8), { lobes: 1 }));
  }
  const pinAng = R.range(0, TAU), pinR = R.range(0.2, 0.55);
  const hole = span({
    id, par, line, side, backward: !!backward,
    fwHalf0: R.range(11, 14), fwHalf1: R.range(15, 21), pinch: R.range(0.55, 0.75),
    tFw0: 0.10, tFw1: 0.90,
    green, tees, bunkers,
    pin: { ds: Math.cos(pinAng) * green.rx * pinR, dl: Math.sin(pinAng) * green.rz * pinR },
    plug: { ds: Math.cos(pinAng + 2.1) * green.rx * 0.5, dl: Math.sin(pinAng + 2.1) * green.rz * 0.5 },
  }, Math.min(s0, s1) - 40, Math.max(s0, s1) + 40);
  F.holes.push(hole);
  F.flags.push({ s: green.cs + hole.pin.ds, l: green.cl + hole.pin.dl, h: 2.13, green: true, holeId: id });
  // fairway irrigation heads along the line + drainage
  const total = Math.abs(sB - sA);
  const nH = Math.max(2, Math.round(total / 42));
  for (let i = 1; i < nH; i++) {
    const px = lerp(sA, sB, i / nH);
    F.heads.push({ s: px, l: polyLatAt(line, px), kind: 'fairway' });
  }
  if (R.chance(0.75)) F.drainLines.push(span({
    poly: [[lerp(sA, sB, 0.3), polyLatAt(line, lerp(sA, sB, 0.3)) - side * 6],
           [lerp(sA, sB, 0.62), polyLatAt(line, lerp(sA, sB, 0.62)) - side * 2]],
  }, s0, s1));
  return hole;
}
/* lateral of a hole line at station s (piecewise linear in s) */
function polyLatAt(line, s) {
  for (let i = 0; i < line.length - 1; i++) {
    const a = line[i], b = line[i + 1];
    const lo = Math.min(a[0], b[0]), hi = Math.max(a[0], b[0]);
    if (s >= lo && s <= hi) {
      const t = (s - a[0]) / ((b[0] - a[0]) || 1e-9);
      return lerp(a[1], b[1], clamp(t, 0, 1));
    }
  }
  return s < Math.min(line[0][0], line[line.length-1][0]) ? line[0][1] : line[line.length - 1][1];
}

/* --- planting -------------------------------------------------------------- */
/* A stand: clustered discs of one tree family with a kept understorey. */
function mkStand(F, streams, spec) {
  const R = streams.planting;
  spec.minAbsL = spec.minAbsL ?? (SOVEREIGN_R + 10);
  const discs = [];
  const n = spec.discs ?? R.int(2, 4);
  let cs = spec.s, cl = spec.l;
  for (let i = 0; i < n; i++) {
    const r = R.range(spec.rLo ?? 16, spec.rHi ?? 30);
    discs.push({ cs, cl, r });
    cs += R.range(-r, r) * 1.1; cl += R.sign() * R.range(r * 0.4, r * 0.9);
    cl = Math.abs(cl) < spec.minAbsL ? Math.sign(cl || spec.l) * spec.minAbsL : cl;
  }
  let s0 = 1e9, s1 = -1e9;
  for (const d of discs) { s0 = Math.min(s0, d.cs - d.r - 8); s1 = Math.max(s1, d.cs + d.r + 8); }
  const stand = span({ kind: spec.kind, discs, straw: spec.kind === 'pine', trees: [], tag: spec.tag }, s0, s1);
  // trees inside the discs, kept spacing, trunks clear of the sovereign radius
  const spacing = spec.spacing ?? R.range(5.2, 7.0);
  for (const d of discs) {
    const tries = Math.floor((d.r * d.r) / (spacing * spacing) * 1.7);
    for (let i = 0; i < tries; i++) {
      const a = R.range(0, TAU), rr = Math.sqrt(R.range(0.04, 1)) * (d.r - 2);
      const ts = d.cs + Math.cos(a) * rr, tl = d.cl + Math.sin(a) * rr;
      if (Math.abs(tl) < SOVEREIGN_R + 3.4) continue;
      let ok = true;
      for (const t of stand.trees) if (dist2(ts, tl, t.s, t.l) < spacing) { ok = false; break; }
      if (!ok) continue;
      const tr = mkTree(streams, spec.kind, ts, tl);
      tr.standTag = spec.tag;
      stand.trees.push(tr);
    }
  }
  F.stands.push(stand);
  for (const t of stand.trees) F.trees.push(t);
  return stand;
}
function mkTree(streams, kind, s, l, opts) {
  const R = streams.planting;
  const o = opts || {};
  let h, crownR, crownBase, trunkR;
  switch (kind) {
    case 'pine':     h = R.range(21, 29); crownBase = h * R.range(0.55, 0.68); crownR = R.range(3.4, 5.2); trunkR = R.range(0.26, 0.4); break;
    case 'magnolia': h = R.range(9.5, 13); crownBase = h * 0.28; crownR = R.range(4.6, 6.4); trunkR = R.range(0.3, 0.42); break;
    case 'oak':      h = R.range(13, 19); crownBase = h * 0.3; crownR = R.range(6.5, 10.5); trunkR = R.range(0.45, 0.7); break;
    case 'dogwood':  h = R.range(4.5, 6.5); crownBase = h * 0.3; crownR = R.range(2.4, 3.6); trunkR = R.range(0.12, 0.2); break;
    case 'holly':    h = R.range(6, 9); crownBase = h * 0.16; crownR = R.range(2.2, 3.2); trunkR = R.range(0.16, 0.24); break;
    default:         h = R.range(8, 14); crownBase = h * 0.3; crownR = R.range(3.5, 6); trunkR = R.range(0.3, 0.5);
  }
  return { kind, s, l, h: o.h ?? h, crownR: o.crownR ?? crownR,
    crownBase: o.crownBase ?? crownBase, trunkR: o.trunkR ?? trunkR,
    lean: R.range(-0.03, 0.03), phase: R.range(0, TAU), specimen: !!o.specimen };
}
/* A bed: a planted outline with a cut edge; the instances derive from the tag. */
function mkBed(F, streams, spec) {
  const bed = span({
    poly: spec.poly, halfW: spec.halfW, kind: spec.kind, tag: spec.tag,
    density: spec.density ?? 1,
  }, Math.min(...spec.poly.map(p => p[0])) - spec.halfW - 6,
     Math.max(...spec.poly.map(p => p[0])) + spec.halfW + 6);
  F.beds.push(bed);
  return bed;
}
/* Collar irrigation + groundworks furniture along the whole piece. */
function commonGroundworks(F, streams, L) {
  const R = streams.groundworks;
  for (let s = 60 + R.range(0, 30); s < L - 60; s += R.range(46, 64)) {
    const side = R.sign();
    F.heads.push({ s, l: side * (ROAD_HALF + R.range(0.7, 1.6)), kind: 'collar' });
    if (R.chance(0.3)) F.details.push({ kind: 'valveBox', s: s + R.range(2, 6), l: side * (ROAD_HALF + R.range(1.8, 2.6)) });
  }
  for (let s = 200 + R.range(0, 80); s < L - 200; s += R.range(240, 380)) {
    F.details.push({ kind: 'yardagePlate', s, l: R.sign() * (ROAD_HALF + R.range(0.4, 0.9)) });
  }
}
/* Swales carry water to grates near the road's low points. */
function mkSwale(F, streams, s, sideL, len) {
  const R = streams.groundworks;
  const poly = [[s, sideL], [s + len * 0.5, sideL * 0.55], [s + len, Math.sign(sideL) * (SHOULDER_R + 2.2)]];
  F.swales.push(span({ poly, w: R.range(3.5, 5.5), depth: R.range(0.28, 0.45) }, s - 10, s + len + 10));
  F.details.push({ kind: 'grate', s: s + len, l: Math.sign(sideL) * (ROAD_HALF + 1.1) });
}

/* ============================================================ SET-PIECES === */
/* S1 — THE MAGNOLIA DRIVE. One idea: arrival. An enclosed corridor with the
   promise of open ground beyond it; it ends before delivering. */
function authorS1(piece, streams) {
  const F = piece.F;
  const R = streams.groundworks;
  const L = piece.length;
  F.boundary = makeBoundary(streams, L, 90, 130);

  // gate: brick piers + low walls + cattle grid — the maintained plane begins here
  const gateS = 178 + streams.route.range(0, 14);
  F.structures.push(span({ kind: 'gatepost', s: gateS, l: 8.8 }, gateS - 6, gateS + 6));
  F.structures.push(span({ kind: 'gatepost', s: gateS, l: -8.8 }, gateS - 6, gateS + 6));
  F.structures.push(span({ kind: 'cattleGrid', s: gateS, l: 0 }, gateS - 4, gateS + 4));
  F.structures.push(span({ kind: 'wall', s0: gateS + 4, s1: 1640 + R.range(0, 40), l: 15.5, h: 1.15 }, gateS, 1690));
  F.structures.push(span({ kind: 'wall', s0: gateS + 4, s1: 760 + R.range(0, 60), l: -15.5, h: 1.15 }, gateS, 830));
  F.structures.push(span({ kind: 'hedge', s0: 800, s1: 1620 + R.range(0, 40), l: -14.8, h: 1.0 }, 780, 1670));
  piece.gateS = gateS;

  // mown verge lawns from collar to the wall, striped along the drive

  F.lawns.push(span({ s0: gateS + 2, s1: 1668, l0: -15.2, l1: -(ROAD_HALF + 2.0), mow: 'route', band: 3.0 }, gateS, 1670));

  // the arcade: paired magnolias, slight stagger, with deliberate slots right
  const arcade0 = gateS + 52, arcade1 = 1600 + R.range(0, 50);
  const slotCount = streams.planting.int(2, 3);

    const c = lerp(480, 1280, i / Math.max(1, slotCount - 1)) + streams.planting.range(-60, 60);
    slots.push({ s0: c - 26, s1: c + 26 });
  }
  F.slots = slots;
  let sT = arcade0;
  while (sT < arcade1) {
    const inSlot = slots.some(sl => sT > sl.s0 && sT < sl.s1);
    const jitter = () => streams.planting.range(-1.6, 1.6);
    F.trees.push(mkTree(streams, 'magnolia', sT + jitter(), 11.6 + streams.planting.range(0, 1.4)));
    if (!inSlot) F.trees.push(mkTree(streams, 'magnolia', sT + 7.5 + jitter(), -(11.6 + streams.planting.range(0, 1.4))));
    sT += streams.planting.range(13.5, 16.5);
  }
  // ordinary trees in the neutral ends (plain country, no rhythm)
  for (const s of [48, 96, L - 52, L - 108]) {
    F.trees.push(mkTree(streams, 'oak', s + streams.planting.range(-8, 8),
      streams.planting.sign() * streams.planting.range(15, 24)));
  }
  // hedgerow fence in the neutral zones
  F.structures.push(span({ kind: 'fence', s0: 12, s1: gateS - 12, l: 12.5 }, 0, gateS));
  F.structures.push(span({ kind: 'fence', s0: 12, s1: gateS - 12, l: -12.5 }, 0, gateS));
  F.structures.push(span({ kind: 'fence', s0: L - 138, s1: L - 10, l: 12.8 }, L - 150, L));

  mkBed(F, streams, { poly: [[252, -12.6], [298, -13.4], [330, -12.8]], halfW: 2.6, kind: 'azalea', tag: 's1gate' });
  // the glimpsed hole beyond the right hedge — never entered
  const jh = streams.holes;
  const h = mkHole(F, streams, { id: 'S1-A', par: 4, s0: 430 + jh.range(-40, 40), s1: 860 + jh.range(-40, 40),
