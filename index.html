  // azalea bank seen through the first slot
  mkBed(F, streams, { poly: [[440, -22], [520, -27], [566, -24]], halfW: 6.5, kind: 'azalea', tag: 's1bankA' });
  mkBed(F, streams, { poly: [[900, 20], [980, 24]], halfW: 4.5, kind: 'mixed', tag: 's1bankB' });

  // groundworks
  commonGroundworks(F, streams, L);
  mkSwale(F, streams, 640, 26, 60);
  mkSwale(F, streams, 1180, -24, 55);

  // far property edge: pale road on a distant rise beyond the course (right)
  F.structures.push(span({ kind: 'farRoad', s: 700, l: -240 }, 500, 900));

  // life
  F.events.push({ kind: 'squirrel', s: 920, l: 13, count: 2 });
  F.events.push({ kind: 'squirrel', s: 1350, l: -12, count: 1 });
  F.events.push({ kind: 'cart', s: 1080 + Math.floor(streams.rare.range(0, 5)) * 24, l: -96, rot: streams.rare.range(0, TAU) });
  F.airPockets.push(span({ kind: 'dappleHaze', s: 620, l: 0, r: 70, h: 13, y0: 0 }, 540, 700));
  F.airPockets.push(span({ kind: 'dappleHaze', s: 1150, l: 0, r: 80, h: 13, y0: 0 }, 1060, 1240));
  piece.evCurve = (s) => 0.42 * sstep(gateS, gateS + 220, s) * sstep(L - 260, L - 480, s);
  piece.birdPlan = [
    { kind: 'flock', count: 44, cs: 760, cl: -70, r: 120, h0: 26, h1: 46, speed: 14 },
    { kind: 'crows', count: 42, cs: 1150, cl: 60, r: 160, h0: 14, h1: 26, speed: 7 },
    { kind: 'swallows', count: 41, cs: 500, cl: -40, r: 90, h0: 3, h1: 12, speed: 17 },
  ];
  piece.vocab = ['dappled-gate'];
  piece.unmapped = ['brick gate wall run', 'glimpsed hole S1-A'];
}

/* S2 — THE STRIPED NINE. One idea: the mown plane. This is the set-piece that
   must be breathtaking: stripes, shadow rake, sand, flags near and far. */
function authorS2(piece, streams) {
  const F = piece.F;
  const R = streams.groundworks;
  const L = piece.length;
  F.boundary = makeBoundary(streams, L, 110, 140);

  // gentle open landform: two broad lobes shape the nine
  F.landLobes.push(span({ cs: 620, cl: 90, r: 260, amp: streams.terrain.range(2.5, 4) }, 300, 950));
  F.landLobes.push(span({ cs: 1350, cl: -120, r: 300, amp: streams.terrain.range(4, 6) }, 1000, 1700));
  F.landLobes.push(span({ cs: 950, cl: -40, r: 420, amp: streams.terrain.range(-1.5, -0.6) }, 500, 1400));

  // five holes. h1's greenside sand deliberately sits beside the road: the
  // named value-separation trap, built on purpose and measured.
  const jh = streams.holes;
  const j = (v, a) => v + jh.range(-a, a);
  const h1 = mkHole(F, streams, { id: 'S2-1', par: 4, s0: j(230, 25), s1: j(560, 30), side: -1,
    lNear: j(30, 3), lFar: j(34, 3), allowRoadside: true, green: { rx: 13, rz: 11 } });
  h1.bunkers.push(mkBunker(streams, h1.green.cs - 55 + jh.range(-8, 8), -13.2 + jh.range(-0.8, 0.8),
    { r: 6.2, lobes: 2, faceDir: Math.PI, faceH: 0.5 }));
  const h2 = mkHole(F, streams, { id: 'S2-2', par: 5, s0: j(640, 35), s1: j(1120, 40), side: -1, lNear: j(36, 4), lFar: j(88, 8) });
  const h3 = mkHole(F, streams, { id: 'S2-3', par: 4, s0: j(320, 30), s1: j(760, 35), side: 1, lNear: j(38, 4), lFar: j(64, 6) });
  const h4 = mkHole(F, streams, { id: 'S2-4', par: 3, s0: j(830, 30), s1: j(1035, 30), side: 1, lNear: j(42, 4), lFar: j(36, 4) });
  const h5 = mkHole(F, streams, { id: 'S2-5', par: 4, s0: j(1140, 30), s1: j(1520, 30), side: -1, lNear: j(30, 3), lFar: j(52, 5) });

  // the clubhouse on its rise, with specimen oak, scoreboard, practice green
  const clubS = 1690 + R.range(0, 30);
  F.structures.push(span({ kind: 'clubhouse', s: clubS, l: -98, rot: 0.35 }, clubS - 70, clubS + 70));
  F.structures.push(span({ kind: 'scoreboard', s: clubS - 74, l: -52, rot: 0.2 }, clubS - 90, clubS - 60));
  F.structures.push(span({ kind: 'starterHut', s: 250, l: 11.8, rot: 0 }, 235, 265));
  F.structures.push(span({ kind: 'halfwayHouse', s: 1080, l: 13.4, rot: 0 }, 1060, 1100));
  F.landLobes.push(span({ cs: clubS, cl: -130, r: 220, amp: 6.5 }, clubS - 240, L));
  const oak = mkTree(streams, 'oak', clubS + 42, -78, { specimen: true, h: 21, crownR: 13 });
  F.trees.push(oak); F.specimen.push(oak);
  const pg = { cs: 1638, cl: -58, rx: 17, rz: 13, rot: 0.3, padH: 0.5, tierDrop: 0, tierRot: 0, pitchDir: 0, pitch: 0.008 };
  F.practiceGreen = span(pg, 1600, 1680);
  for (let i = 0; i < 7; i++) {
    const a = (i / 7) * TAU + 0.4;
    F.flags.push({ s: pg.cs + Math.cos(a) * pg.rx * 0.62, l: pg.cl + Math.sin(a) * pg.rz * 0.62, h: 1.9, practice: true });
  }

  // orchard row: specimen oaks down the h3 fairway edge, each in a mown ring
  const rowN = streams.planting.int(4, 5);
  for (let i = 0; i < rowN; i++) {
    const t = mkTree(streams, 'oak', 730 + i * 74 + streams.planting.range(-6, 6), 27 + streams.planting.range(-1.5, 1.5),
      { specimen: true });
    F.trees.push(t); F.specimen.push(t);
  }
  piece.orchardRow = { s0: 730, s1: 730 + (rowN - 1) * 74, l: 27, count: rowN };
  // bellroot approach: the azalea hedge run along the clubhouse drive
  mkBed(F, streams, { poly: [[1500, -30], [1596, -33], [1668, -40]], halfW: 3.4, kind: 'azalea', tag: 's2hedge' });
  mkBed(F, streams, { poly: [[300, 24], [386, 28]], halfW: 5.0, kind: 'mixed', tag: 's2entry' });

  // roadside trees: the cart path runs along a treeline; their long shadows
  // rake the road and the stripes — the world's best graphic
  {
    const RT = streams.planting;
    let sT = 260;
    while (sT < L - 260) {
      if (RT.chance(0.72)) {
        const side = RT.sign();
        const lT = side * RT.range(13.5, 19);
        const nearFeature = F.holes.some(h =>
          Math.abs(h.green.cs - sT) < 34 || h.tees.some(t => Math.abs(t.cs - sT) < 26));
        if (!nearFeature) {
          const kind = RT.chance(0.6) ? 'pine' : 'oak';
          F.trees.push(mkTree(streams, kind, sT + RT.range(-8, 8), lT));
        }
      }
      sT += streams.planting.range(80, 150);
    }
    for (let i = 0; i < 5; i++) {
      F.trees.push(mkTree(streams, 'pine', 1170 + i * 62 + RT.range(-10, 10), -RT.range(14, 17)));
    }
  }
  // treeline stands framing the open ground (pines at the property edges)
  mkStand(F, streams, { kind: 'pine', s: 420, l: 128, discs: 2, rLo: 20, rHi: 30, minAbsL: 96, tag: 's2tlA' });
  mkStand(F, streams, { kind: 'pine', s: 1240, l: 138, discs: 2, rLo: 22, rHi: 34, minAbsL: 104, tag: 's2tlB' });
  mkStand(F, streams, { kind: 'pine', s: 860, l: -142, discs: 2, rLo: 20, rHi: 30, minAbsL: 110, tag: 's2tlC' });

  // groundworks
  commonGroundworks(F, streams, L);
  mkSwale(F, streams, 560, 30, 70);
  mkSwale(F, streams, 990, -34, 60);
  mkSwale(F, streams, 1420, 28, 60);

  // the ring for no tree: the mowers keep a specimen ring in the open rough,
  // and there is nothing in it. Never explained.
  F.emptyRings = [span({ s: 700 + R.range(0, 60), l: -(66 + R.range(-3, 3)), r: 6.0 + R.range(-0.6, 0.8) }, 660, 790)];

  // distant flags on far greens beyond the corridor — the landmark system
  F.farFlags.push({ s: 690, l: 132, h: 2.1 });
  F.farFlags.push({ s: 1310, l: -146, h: 2.1 });

  // sprinklers running on schedule on the far fairway (rainbow group)
  for (let i = 0; i < 4; i++) {
    F.sprinklers.push({ s: 1180 + i * 26, l: 58 + streams.groundworks.range(-4, 4), r: 13,
      group: 'far', period: 44, duty: 0.5, phase: i * 0.25, rainbow: true });
  }
  for (let i = 0; i < 3; i++) {
    F.sprinklers.push({ s: 360 + i * 30, l: -46, r: 12, group: 'near', period: 60, duty: 0.33, phase: 0.4 + i * 0.2, rainbow: false });
  }

  // life: the signature deer moment, the hawk that does not move
  F.events.push({ kind: 'deer', s: 1130, l: 52, count: streams.creatures.int(3, 5), exitL: 120 });
  F.events.push({ kind: 'hawk', s: 1352, l: -9.6 });
  F.details.push({ kind: 'yardageMarker', s: 1352, l: -9.6 });
  F.events.push({ kind: 'struckBall', s: 880 + streams.ambient.range(0, 140) });
  F.events.push({ kind: 'cart', s: 1480 + Math.floor(streams.rare.range(0, 4)) * 30, l: 118, rot: streams.rare.range(0, TAU) });
  F.airPockets.push(span({ kind: 'goldHaze', s: 980, l: 30, r: 110, h: 20, y0: 0 }, 850, 1110));
  F.airPockets.push(span({ kind: 'mist', s: 1210, l: 58, r: 46, h: 9, y0: 0 }, 1150, 1270));
  piece.evCurve = (s) => 0;
  piece.birdPlan = [
    { kind: 'flock', count: 48, cs: 900, cl: 10, r: 220, h0: 30, h1: 60, speed: 16 },
    { kind: 'crows', count: 44, cs: 430, cl: 120, r: 180, h0: 16, h1: 30, speed: 8 },
    { kind: 'swallows', count: 42, cs: 1250, cl: 40, r: 130, h0: 2.5, h1: 10, speed: 18 },
  ];
  piece.vocab = ['orchard-row', 'bellroot-approach'];
  piece.unmapped = ['clubhouse rise', 'roadside bunker complex S2-1', 'scoreboard'];
}

/* S3 — THE PINE STRAW. One idea: verticality and hush. The counterpoint to S2;
   the only place on the property where you cannot see a flag. */
function authorS3(piece, streams) {
  const F = piece.F;
  const L = piece.length;
  F.boundary = makeBoundary(streams, L, 70, 105);

  // stands march down both sides; occasional pinches close the corridor
  const standDefs = [];
  let s = 260 + streams.planting.range(0, 60);
  let side = streams.planting.sign();
  let gi = 0;
  while (s < L - 320) {
    standDefs.push({ s, side, tag: 's3st' + gi });
    if (streams.planting.chance(0.35)) standDefs.push({ s: s + 60, side: -side, tag: 's3stp' + gi });
    s += streams.planting.range(240, 330);
    side = -side; gi++;
  }
  for (const sd of standDefs) {
    mkStand(F, streams, { kind: 'pine', s: sd.s, l: sd.side * 44, discs: streams.planting.int(2, 3),
      rLo: 20, rHi: 33, minAbsL: 13.0, spacing: streams.planting.range(5.0, 6.6), tag: sd.tag });
  }
  // light shafts live in the gaps — bounded volumes, not a screen effect
  const shaftN = streams.weather.int(4, 6);
  for (let i = 0; i < shaftN; i++) {
    const ss = lerp(340, L - 360, (i + 0.5) / shaftN) + streams.weather.range(-40, 40);
    F.airPockets.push(span({ kind: 'lightShaft', s: ss, l: streams.weather.sign() * streams.weather.range(4, 18),
      r: streams.weather.range(13, 21), h: 26, y0: 0 }, ss - 30, ss + 30));
  }
  F.airPockets.push(span({ kind: 'duskHaze', s: L * 0.5, l: 0, r: 160, h: 24, y0: 0 }, L * 0.5 - 180, L * 0.5 + 180));

  // the glimpsed hole: fairway and one lit bunker in a slot; its green hides
  // behind the far stand — a flag exists but cannot be seen from the road
  const jh3 = streams.holes;
  mkHole(F, streams, { id: 'S3-A', par: 4, s0: 880 + jh3.range(-35, 35), s1: 1300 + jh3.range(-35, 35),
    side: -1, lNear: 46 + jh3.range(-5, 5), lFar: 95 + jh3.range(-8, 8) });
  mkStand(F, streams, { kind: 'pine', s: 1330, l: -70, discs: 2, rLo: 18, rHi: 26, minAbsL: 46, tag: 's3occl' });

  // a sand service track meets the road from both sides (never crossing it)
  F.structures.push(span({ kind: 'serviceTrack', s: 780, l: 9.5, len: 46, rot: 0.9 }, 750, 830));
  F.structures.push(span({ kind: 'serviceTrack', s: 786, l: -9.5, len: 52, rot: -0.8 }, 750, 840));
  piece.sandCarry = { s: 783, w: 14 };

  // ferny hollows in deep shade at stand hearts (planting anchors)
  mkBed(F, streams, { poly: [[520, 30], [600, 36]], halfW: 7, kind: 'fern', tag: 's3fernA' });
  mkBed(F, streams, { poly: [[1120, -28], [1210, -34]], halfW: 8, kind: 'fern', tag: 's3fernB' });

  // two holly specimens hold a small clearing
  const ha = mkTree(streams, 'holly', 1478, 15, { specimen: true });
  const hb = mkTree(streams, 'holly', 1530, -17, { specimen: true });
  F.trees.push(ha, hb); F.specimen.push(ha, hb);

  commonGroundworks(F, streams, L);
  mkSwale(F, streams, 700, -20, 50);
  mkSwale(F, streams, 1500, 22, 55);

  F.events.push({ kind: 'turkeys', s: 950, l: 30, count: streams.creatures.int(5, 7) });
  F.events.push({ kind: 'squirrel', s: 600, l: 16, count: 2 });
  F.events.push({ kind: 'squirrel', s: 1180, l: -14, count: 2 });
  F.events.push({ kind: 'squirrel', s: 1690, l: 13, count: 1 });
  F.events.push({ kind: 'cart', s: 620 + Math.floor(streams.rare.range(0, 4)) * 18, l: 62, rot: streams.rare.range(0, TAU) });
  piece.evCurve = (s) => 0.5 * sstep(210, 430, s) * sstep(L - 210, L - 430, s);
  piece.birdPlan = [
    { kind: 'crows', count: 46, cs: 700, cl: 40, r: 180, h0: 20, h1: 32, speed: 8 },
    { kind: 'flock', count: 43, cs: 1200, cl: -60, r: 200, h0: 34, h1: 58, speed: 15 },
    { kind: 'swallows', count: 41, cs: 1500, cl: 10, r: 90, h0: 3, h1: 12, speed: 16 },
  ];
  piece.vocab = ['light-shaft'];
  piece.unmapped = ['sand service track junction', 'glimpsed hole S3-A'];
}

/* S4 — AZALEA HOLLOW. One idea: where the perfection comes from. The postcard
   and the machinery, two ways round the same water. Carries the fork. */
function authorS4(piece, streams) {
  const F = piece.F;
  const L = piece.length;
  F.boundary = makeBoundary(streams, L, 100, 130);

  // the hollow: valley shoulders rise either side
  F.landLobes.push(span({ cs: 930, cl: 175, r: 360, amp: streams.terrain.range(3.5, 5) }, 560, 1300));
  F.landLobes.push(span({ cs: 960, cl: -215, r: 420, amp: streams.terrain.range(3.5, 5.5) }, 540, 1400));
  F.landLobes.push(span({ cs: 300, cl: -90, r: 240, amp: streams.terrain.range(2, 3.5) }, 100, 520));

  // water: creek in, pond, spillway out. The pond reaches the road and a neck
  // passes beneath the stone bridge — the dangerous clearance zone, on purpose.
  F.creek = {
    inPoly: [[236, -36], [318, -24], [396, -14], [428, -8]],
    outPoly: [[438, 8], [520, 20], [610, 30], [700, 40]],
    spillPoly: [[1126, 18], [1200, 34], [1290, 58], [1360, 84]],
    w: 3.2, culvertS: 432,
  };
  const pondRot = streams.terrain.range(-0.15, 0.25);
  F.pond = {
    rings: [
      { cs: 952 + streams.terrain.range(-10, 10), cl: 47, rx: 92, rz: 40, rot: pondRot },
      { cs: 962, cl: 2, rx: 15, rz: 24, rot: 0 },
      { cs: 968, cl: -19, rx: 17, rz: 11, rot: 0.3 },
      { cs: 1105 + streams.terrain.range(-8, 8), cl: 50, rx: 58, rz: 24, rot: 0.5 },
    ],
    waterDrop: 1.7, depth: 2.3, edgeW: 1.5,
  };
  F.bridge = span({ s0: 940, s1: 984, parapetL: 5.75, parapetH: 1.05 }, 920, 1004);
  F.structures.push(span({ kind: 'bridgeWork', s: 962, l: 0 }, 930, 994));
  F.structures.push(span({ kind: 'spillway', s: 1124, l: 16, rot: 0.5 }, 1110, 1140));
  F.structures.push(span({ kind: 'slabCrossing', s: 352, l: -18, rot: 0.4 }, 344, 360));

  // the fork: present at a signed junction, out through the working ground,
  // back at the water. Arm A is the bridge arm; arm B is the service arm.
  piece.fork = {
    sPresent: 470, sDiverge: 516 + streams.fork.range(0, 16),
    sRejoin: 1548 + streams.fork.range(0, 16),
    maxOffset: streams.fork.range(76, 86), ramp: 415 + streams.fork.range(0, 20),
    dElev: streams.fork.range(1.2, 2.0),
  };
  F.structures.push(span({ kind: 'forkSign', s: piece.fork.sDiverge - 28, l: -8.8 }, piece.fork.sDiverge - 40, piece.fork.sDiverge));

  // the tiered green above the water, bunker face toward the road-side hollow
  const jh4 = streams.holes;
  const h2 = mkHole(F, streams, { id: 'S4-2', par: 3, s0: 1008 + jh4.range(-6, 6), s1: 1124 + jh4.range(-6, 6),
    side: -1, lNear: 40 + jh4.range(-3, 3), lFar: 30 + jh4.range(-2, 2),
    backward: true, allowRoadside: true, green: { rx: 15, rz: 12, padH: 1.15, tier: 0.3 } });
  h2.bunkers.push(mkBunker(streams, h2.green.cs - 16 + jh4.range(-3, 3), -13.6 + jh4.range(-0.6, 0.6),
    { r: 5.4, lobes: 2, faceH: 0.9, faceDir: Math.atan2(-16, 14) }));
  // par 3 over the pond tail
  const h3 = mkHole(F, streams, { id: 'S4-3', par: 3, s0: 1190 + jh4.range(-10, 10), s1: 1345 + jh4.range(-10, 10),
    side: 1, lNear: 58 + jh4.range(-5, 5), lFar: 26 + jh4.range(-3, 3),
    green: { rx: 12, rz: 10 } });

  // banks of azalea and dogwood — the hollow's colour, planted in beds
  mkBed(F, streams, { poly: [[818, 60], [900, 66], [1000, 62], [1080, 54]], halfW: 8, kind: 'azalea', tag: 's4bankL' });
  mkBed(F, streams, { poly: [[560, 13], [630, 16], [696, 19]], halfW: 4.0, kind: 'azalea', tag: 's4bankR' });
  mkBed(F, streams, { poly: [[1150, -16.5], [1262, -19], [1382, -17]], halfW: 3.6, kind: 'azalea', tag: 's4hedge' });
  mkBed(F, streams, { poly: [[884, -134], [982, -138]], halfW: 4.2, kind: 'camellia', tag: 's4yardhedge' });
  for (let i = 0; i < 8; i++) {
    const t = mkTree(streams, 'dogwood',
      streams.planting.range(0, 1) < 0.5 ? streams.planting.range(830, 1100) : streams.planting.range(590, 780),
      0, {});
    t.l = t.s > 800 ? streams.planting.range(58, 82) : streams.planting.range(12, 26);
    t.l = guardLat(t.l, t.crownR);
    F.trees.push(t);
  }
  const willowOak = mkTree(streams, 'oak', 1238, 72, { specimen: true, h: 17, crownR: 11 });
  const bridgeDogwood = mkTree(streams, 'dogwood', 916, -14.5, { specimen: true });
  bridgeDogwood.l = guardLat(bridgeDogwood.l, bridgeDogwood.crownR * 0.5);
  F.trees.push(willowOak, bridgeDogwood); F.specimen.push(willowOak, bridgeDogwood);

  // the working ground, outside the service arm: honest, ordered clutter
  F.lawns.push(span({ s0: 830, s1: 1150, l0: -146, l1: -98, mow: 'angle', ang: 0.12, band: 3.4 }, 820, 1160));
  F.structures.push(span({ kind: 'equipShed', s: 900, l: -122, rot: 0.15, w: 22, d: 10 }, 870, 930));
  F.structures.push(span({ kind: 'equipShed', s: 946, l: -128, rot: 0.15, w: 16, d: 9 }, 920, 972));
  F.structures.push(span({ kind: 'mowerRow', s: 986, l: -118, rot: 0.12, count: 5 }, 960, 1015));
  F.structures.push(span({ kind: 'mowerRow', s: 1012, l: -124, rot: 0.12, count: 4 }, 990, 1040));
  F.structures.push(span({ kind: 'sandBins', s: 1052, l: -126, rot: 0.1, bays: 3 }, 1030, 1080));
  F.structures.push(span({ kind: 'irrigationRolls', s: 1076, l: -114, rot: 0 }, 1060, 1092));
  F.structures.push(span({ kind: 'nursery', s: 1096, l: -120, rot: 0.08, strips: 3 }, 1070, 1130));
  F.structures.push(span({ kind: 'caddiePath', s: 940, l: -104, len: 60, rot: 1.2 }, 910, 1000));
  // the practice ground with its range targets
  F.structures.push(span({ kind: 'rangeTee', s: 652, l: -106, rot: 0.5 }, 640, 668));
  for (let i = 0; i < 3; i++) {
    F.structures.push(span({ kind: 'rangeTarget', s: 706 + i * 58, l: -(116 + i * 9), rot: 0.5 }, 690 + i * 58, 720 + i * 58));
  }
  F.lawns.push(span({ s0: 640, s1: 880, l0: -148, l1: -102, mow: 'angle', ang: 0.5, band: 3.2 }, 630, 890));

  commonGroundworks(F, streams, L);
  mkSwale(F, streams, 500, -26, 55);
  mkSwale(F, streams, 1560, 24, 60);

  // life at the water
  F.events.push({ kind: 'heron', s: 1042, l: 17 });
  F.events.push({ kind: 'swallowRings', s: 950, l: 40 });
  F.events.push({ kind: 'sprinklerKnows', s: 1218, l: 6.4 });
  F.sprinklers.push({ s: 1218, l: 6.4, r: 9, group: 'knows', period: 40, duty: 0.55, phase: 0.1, rainbow: false });
  for (let i = 0; i < 3; i++) {
    F.sprinklers.push({ s: 700 + i * 34, l: -34, r: 11, group: 's4f', period: 52, duty: 0.4, phase: 0.3 + 0.22 * i, rainbow: false });
  }
  F.events.push({ kind: 'cart', s: 1270 + Math.floor(streams.rare.range(0, 4)) * 22, l: 78, rot: streams.rare.range(0, TAU) });
  F.airPockets.push(span({ kind: 'pondMist', s: 952, l: 40, r: 76, h: 8, y0: -1.6 }, 860, 1050));
  F.airPockets.push(span({ kind: 'hollowHaze', s: 930, l: 0, r: 130, h: 22, y0: 0 }, 780, 1080));
  F.airPockets.push(span({ kind: 'creekMist', s: 350, l: -16, r: 28, h: 5, y0: -1 }, 310, 390));
  piece.evCurve = (s) => 0.18 * sstep(300, 560, s) * sstep(L - 300, L - 560, s);
  piece.birdPlan = [
    { kind: 'swallows', count: 46, cs: 950, cl: 42, r: 110, h0: 1.2, h1: 9, speed: 18 },
    { kind: 'flock', count: 44, cs: 700, cl: -80, r: 190, h0: 28, h1: 52, speed: 15 },
    { kind: 'crows', count: 42, cs: 1400, cl: 70, r: 170, h0: 15, h1: 26, speed: 8 },
  ];
  piece.vocab = ['water-aperture', 'fork-wedge', 'bellroot-approach'];
  piece.unmapped = ['maintenance yard', 'practice ground', 'spillway', 'creek crossings'];
}

/* ============================================================ WORLD PLAN === */
const PIECE_DEFS = [
  { id: 'azalea-s1', name: 'The Magnolia Drive', idea: 'arrival', author: authorS1,
    bendEnvelope: { n: [2, 3], turn: [7, 13], len: [230, 310] }, swellEnvelope: { n: [2, 2], amp: [0.8, 1.7], half: [260, 420] } },
  { id: 'azalea-s2', name: 'The Striped Nine', idea: 'the mown plane', author: authorS2,
    bendEnvelope: { n: [3, 4], turn: [16, 28], len: [330, 430] }, swellEnvelope: { n: [3, 3], amp: [2.2, 4.6], half: [300, 520] } },
  { id: 'azalea-s3', name: 'The Pine Straw', idea: 'verticality and hush', author: authorS3,
    bendEnvelope: { n: [3, 4], turn: [9, 16], len: [250, 330] }, swellEnvelope: { n: [2, 3], amp: [1.2, 2.6], half: [280, 460] } },
  { id: 'azalea-s4', name: 'Azalea Hollow', idea: 'where the perfection comes from', author: authorS4,
    bendEnvelope: { n: [2, 3], turn: [6, 11], len: [260, 340] }, swellEnvelope: { n: [2, 2], amp: [-7.5, -5.5], half: [420, 560] } },
];

function planPiece(seed, idx) {
  const def = PIECE_DEFS[idx];
  const streams = makeStreams(seed, def.id);
  // wrap streams to record which domains this piece actually draws from
  const used = new Set();
  const S = {};
  for (const n of STREAM_NAMES) {
    const base = streams[n];
    const f = function () { used.add(n); return base(); };
    f.range = (a, b) => { used.add(n); return base.range(a, b); };
    f.int = (a, b) => { used.add(n); return base.int(a, b); };
    f.pick = (arr) => { used.add(n); return base.pick(arr); };
    f.sign = () => { used.add(n); return base.sign(); };
    f.chance = (p) => { used.add(n); return base.chance(p); };
    S[n] = f;
  }
  const length = 1980 + S.route.int(0, 15) * 4; // 1980..2040, multiple of FRAME_STEP
  // bends: kept out of the neutral ends, rate well under the 2.0°/10m bound
  const be = def.bendEnvelope;
  const nB = S.route.int(be.n[0], be.n[1]);
  const bends = [];
  let cursor = 200 + S.route.range(0, 80);
  for (let i = 0; i < nB; i++) {
    const turn = S.route.sign() * S.route.range(be.turn[0], be.turn[1]);
    const minLen = Math.abs(turn) * 1.875 / 0.155; // deg/m rate ceiling 0.155
    const len = Math.max(be.len[0], minLen) + S.route.range(0, be.len[1] - be.len[0]);
    if (cursor + len > length - 220) break;
    bends.push({ s0: cursor, len, turnDeg: turn });
    cursor += len + S.route.range(30, 130);
  }
  const we = def.swellEnvelope;
  const nW = S.route.int(we.n[0], we.n[1]);
  const swells = [];
  for (let i = 0; i < nW; i++) {
    const half = S.route.range(we.half[0], we.half[1]);
    const c = lerp(220 + half * 0.55, length - 220 - half * 0.55, (i + S.route.range(0.2, 0.8)) / nW);
    swells.push({ c, half, amp: S.route.range(we.amp[0], we.amp[1]) });
  }
  const nRolls = S.terrain.int(8, 13);
  const rollLobes = [];
  for (let i = 0; i < nRolls; i++) {
    const rc = S.terrain.range(220, length - 220);
    const rl = S.terrain.sign() * S.terrain.range(26, 120);
    rollLobes.push({ cs: rc, cl: rl, r: S.terrain.range(55, 130), amp: S.terrain.range(0.5, 1.6) * S.terrain.sign() });
  }
  const frames = buildFrames(length, bends, swells);
  const piece = {
    idx, id: def.id, name: def.name, idea: def.idea, length, bends, swells, frames,
    streams: S, F: newFeatureSet(), fork: null, evCurve: () => 0,
    usedStreams: used,
  };
  def.author(piece, S);
  for (const rl of rollLobes) piece.F.landLobes.push(span({ cs: rl.cs, cl: rl.cl, r: rl.r, amp: rl.amp },
    rl.cs - rl.r, rl.cs + rl.r));
  if (piece.fork) buildArmB(piece, piece.fork);
  piece.chunks = sliceChunks(frames);
  piece.worstHeading = worstHeadingPer10m(frames);
  if (piece.fork) piece.worstHeadingB = worstHeadingPer10m(piece.fork.armBFrames);
  piece.elev = (s) => elevAt(swells, s);
  piece.grade = (s) => gradeAt(swells, s);
  return piece;
}

function planWorld(seed) {
  const pieces = [];
  for (let i = 0; i < 4; i++) pieces.push(planPiece(seed, i));
  // preview chaining: each piece rigid-placed at the previous exit pose
  let theta = 0, ox = 0, oy = 0, oz = 0;
  for (const p of pieces) {
    p.T = { sin: Math.sin(theta), cos: Math.cos(theta), theta, ox, oy, oz };
    const last = p.frames[p.frames.length - 1];
    const ex = ox + last.x * p.T.cos + last.z * p.T.sin;
    const ez = oz - last.x * p.T.sin + last.z * p.T.cos;
    theta += Math.atan2(last.tx, last.tz);
    ox = ex; oy = oy + last.y; oz = ez;
  }
  const rideStart = [];
  let acc = 0;
  for (const p of pieces) { rideStart.push(acc); acc += p.length; }
  const world = { seed, pieces, rideStart, totalLength: acc };
  // preview sun: fixed world azimuth relative to the average ride heading
  let avgHead = 0;
  for (const p of pieces) avgHead += p.T.theta / pieces.length;
  world.sunAzimuth = avgHead + 238 * DEG;
  world.sunElevation = 12.5 * DEG;
  return world;
}

/* piece-local -> preview-world */
function pw(piece, x, y, z, out) {
  const T = piece.T;
  out.x = T.ox + x * T.cos + z * T.sin;
  out.y = T.oy + y;
  out.z = T.oz - x * T.sin + z * T.cos;
  return out;
}
function pwDir(piece, dx, dz, out) {
  const T = piece.T;
  out.x = dx * T.cos + dz * T.sin;
  out.z = -dx * T.sin + dz * T.cos;
  return out;
}
/* route-space (s,l) -> piece-local ground position (no height) */
function slToLocal(piece, s, l, arm) {
  const f = arm === 'B' && piece.fork ? frameAtLocal(piece.fork.armBFrames, s) : frameAtLocal(piece.frames, s);
  return { x: f.x + f.lx * l, z: f.z + f.lz * l, f };
}

/* ============================================================== TERRAIN ==== */
/* Everything below is engineered contour — pads, crowns, bowls, swales,
   basins — composed from the plan. Nothing is a bare noise function. */

/* Distance to the arm-B centreline in arm-A route space; also its deck. */
function armBField(piece, s, l) {
  const fk = piece.fork;
  if (!fk || s < fk.sDiverge - 10 || s > fk.sRejoin + 10) return null;
  const poly = fk.slPoly;
  let best = 1e9, bi = 0, bt = 0;
  for (let i = 0; i < poly.length - 1; i++) {
    const r = segDist(s, l, poly[i][0], poly[i][1], poly[i + 1][0], poly[i + 1][1]);
    if (r.d < best) { best = r.d; bi = i; bt = r.t; }
  }
  const dy = lerp(poly[bi][2], poly[bi + 1][2], bt);
  const sA = lerp(poly[bi][0], poly[bi + 1][0], bt);
  return { d: best, deck: piece.elev(sA) + dy };
}
/* Signed distance (negative inside asphalt) to the full road system + deck. */
function roadField(piece, s, l) {
  const dA = Math.abs(l) - ROAD_HALF;
  const deckA = piece.elev(s);
  let d = dA, deck = deckA;
  const fk = piece.fork;
  if (fk) {
    const b = armBField(piece, s, l);
    if (b) {
      // wedge zones: one widened ribbon while the arms separate
      const off = fk.offAt(s);
      const sep = Math.abs(off);
      const inWedge = (s >= fk.wedgeIn.s0 && s <= fk.wedgeIn.s1) || (s >= fk.wedgeOut.s0 && s <= fk.wedgeOut.s1);
      if (inWedge && sep > 0.01) {
        const dw = Math.max(l - ROAD_HALF, (off - ROAD_HALF) - l); // off is negative (right)
        if (dw < d) { d = dw; }
      }
      const db = b.d - ROAD_HALF;
      if (db < d) { d = db; deck = b.deck; }
      // where both arms' shoulders reach the same ground, the carve must
      // honour the LOWER road — never lift ground into the other's corridor
      if (dA < 3.6 && db < 3.6) deck = Math.min(deckA, b.deck);
    }
  }
  return { d, deck };
}
function onBridge(piece, s) {
  // interior of the span only: the end rows carve normally so the ribbon
  // lands on properly sunk ground — the abutments dress the seam
  const b = piece.F.bridge;
  return b && s >= b.s0 + 2.6 && s <= b.s1 - 2.6;
}

/* THE one road-edge function. Every caller — terrain, collar class, apron,
   clearance QA, prop seating — goes through this shaping. */
function roadEdgeShape(piece, s, l, hNatural, rf) {
  if (onBridge(piece, s) && Math.abs(l) < 26) return hNatural; // the ribbon flies
  const d = rf.d;
  if (d >= 3.6) return hNatural;
  const target = Math.min(rf.deck - ROAD_SINK, hNatural);
  if (d < 1.2) return target;
  const w = sstep(1.2, 3.6, d);
  let h = lerp(target, hNatural, w);
  if (d < 1.6) h = Math.min(h, rf.deck - ROAD_SINK_MIN);
  return h;
}

/* Feature buckets for a station range (used per chunk and by QA samplers). */
function gatherFeatures(piece, s0, s1) {
  const F = piece.F;
  const inSpan = (o) => o.sMax >= s0 && o.sMin <= s1;
  const holes = F.holes.filter(inSpan);
  const ctx = {
    piece, s0, s1, holes,
    greens: holes.map(h => h.green),
    bunkers: holes.flatMap(h => h.bunkers),
    tees: holes.flatMap(h => h.tees),
    beds: F.beds.filter(inSpan),
    stands: F.stands.filter(inSpan),
    lawns: F.lawns.filter(inSpan),
    swales: F.swales.filter(inSpan),
    drains: F.drainLines.filter(inSpan),
    lobes: F.landLobes.filter(inSpan),
    heads: F.heads.filter(h => h.s >= s0 - 30 && h.s <= s1 + 30),
    pond: F.pond, creek: F.creek, bridge: F.bridge,
    rings: F.trees.filter(t => t.specimen && t.s >= s0 - 20 && t.s <= s1 + 20)
      .map(t => ({ s: t.s, l: t.l, r: clamp(t.crownR * 0.9, 3.5, 7) }))
      .concat((F.emptyRings || []).filter(inSpan).map(er => ({ s: er.s, l: er.l, r: er.r }))),
    practiceGreen: F.practiceGreen && inSpan(F.practiceGreen) ? F.practiceGreen : null,
  };
  if (ctx.practiceGreen) ctx.greens = ctx.greens.concat([ctx.practiceGreen]);
  return ctx;
}

/* coarse base (no hole detail) — used to anchor pads/floors deterministically */
function coarseBase(piece, s, l) {
  let h = piece.elev(s);
  const lf = 0.12 + 0.88 * sstep(4 + ROAD_HALF, 30 + ROAD_HALF, Math.abs(l));
  for (const lo of piece.F.landLobes) {
    h += lo.amp * bump(dist2(s, l, lo.cs, lo.cl) / lo.r) * lf;
  }
  const bl = boundaryAt(piece.F, s, 1), br = boundaryAt(piece.F, s, -1);
  const beyond = l > 0 ? l - bl : -l - br;
  if (beyond > 0) h += 0.7 * sstep(0, 14, beyond);
  return h;
}
function teeHeight(piece, tee) {
  if (tee._h === undefined) tee._h = coarseBase(piece, tee.cs, tee.cl) + 0.35;
  return tee._h;
}
function bunkerBase(piece, b) {
  if (b._h === undefined) b._h = coarseBase(piece, b.cs, b.cl);
  return b._h;
}
function pondLevel(piece) {
  const p = piece.F.pond;
  if (p._wl === undefined) p._wl = piece.elev(962) - p.waterDrop;
  return p._wl;
}
function bunkerSd(b, s, l) {
  let sd = 1e9;
  for (const lo of b.lobes) {
    sd = Math.min(sd, ellipseSd(s, l, b.cs + lo.ds, b.cl + lo.dl, lo.rx, lo.rz, lo.rot));
  }
  return sd;
}
function pondSd(pond, s, l) {
  let sd = 1e9;
  for (const r of pond.rings) sd = smin(sd, ellipseSd(s, l, r.cs, r.cl, r.rx, r.rz, r.rot), 6);
  return sd;
}
function standSd(stand, s, l, shrink) {
  let sd = 1e9;
  for (const d of stand.discs) sd = smin(sd, dist2(s, l, d.cs, d.cl) - (d.r - shrink), 6);
  return sd;
}
function fairwayInfo(hole, s, l) {
  const pd = polyDist(hole.line, s, l);
  const t = pd.t;
  const wid = lerp(hole.fwHalf0, hole.fwHalf1, sstep(0.1, hole.pinch, t));
  return { d: pd.d, t, wid, tanS: pd.tanX, tanL: pd.tanZ,
    perp: Math.sign((s - pd.cx) * pd.tanZ - (l - pd.cz) * pd.tanX) * pd.d };
}

/* Engineered ground height before road shaping. */
function baseHeight(piece, ctx, s, l, rfd) {
  let h = piece.elev(s);
  const lobeFall = 0.12 + 0.88 * sstep(4, 30, rfd);
  for (const lo of ctx.lobes) h += lo.amp * bump(dist2(s, l, lo.cs, lo.cl) / lo.r) * lobeFall;
  const F = piece.F;
  const bl = boundaryAt(F, s, 1), br = boundaryAt(F, s, -1);
  const beyond = l > 0 ? l - bl : -l - br;
  if (beyond > 0) h += 0.7 * sstep(0, 14, beyond);
  const rf = sstep(SOVEREIGN_R, 13, rfd + ROAD_HALF); // engineered-rise falloff near any arm
  // holes: crown, pad, tier, tee platforms, bunker bowls
  for (const hole of ctx.holes) {
    const fw = fairwayInfo(hole, s, l);
    if (fw.d < fw.wid + 6 && fw.t > 0.04 && fw.t < 0.97) {
      const c = 1 - (fw.d / (fw.wid + 2)) * (fw.d / (fw.wid + 2));
      if (c > 0) h += 0.34 * c * rf;
    }
  }
  for (const g of ctx.greens) {
    const sd = ellipseSd(s, l, g.cs, g.cl, g.rx, g.rz, g.rot);
    if (sd < 7) {
      const pad = sstep(5, -1.5, sd);
      h += g.padH * pad * rf;
      if (g.tierDrop > 0 && sd < 0.5) {
        const u = (s - g.cs) * Math.cos(g.tierRot) + (l - g.cl) * Math.sin(g.tierRot);
        h += g.tierDrop * sstep(-1.2, 1.2, u) * pad * rf;
      }
      if (sd < 1.5) {
        const px = (s - g.cs) * Math.cos(g.pitchDir) + (l - g.cl) * Math.sin(g.pitchDir);
        h += g.pitch * px * pad * rf;
      }
    }
  }
  for (const t of ctx.tees) {
    const sd = rrectSd(s, l, t.cs, t.cl, t.hx, t.hz, t.rot, 1.2);
    if (sd < 2) {
      const m = sstep(1.6, -0.4, sd) * rf;
      h = lerp(h, teeHeight(piece, t), m);
    }
  }
  for (const b of ctx.bunkers) {
    const sd = bunkerSd(b, s, l);
    if (sd < 3.4) {
      const base = bunkerBase(piece, b);
      const m = sstep(0.35, -1.1, sd) * rf;
      h = lerp(h, Math.min(h, base - b.floorDrop), m);
      // built-up face + grass lip around the rim, biased toward faceDir
      const ang = Math.atan2(l - b.cl, s - b.cs);
      let dAng = ang - b.faceDir; while (dAng > Math.PI) dAng -= TAU; while (dAng < -Math.PI) dAng += TAU;
      const facing = 0.35 + 0.65 * (0.5 + 0.5 * Math.cos(dAng));
      h += (0.22 + b.faceH * facing) * bump((sd - 0.8) / 1.7) * rf;
    }
  }
  for (const sw of ctx.swales) {
    const pd = polyDist(sw.poly, s, l);
    if (pd.d < sw.w) h -= sw.depth * (1 - (pd.d / sw.w) * (pd.d / sw.w)) * sstep(1.0, 3.0, rfd);
  }
  if (ctx.creek) {
    for (const poly of [ctx.creek.inPoly, ctx.creek.outPoly, ctx.creek.spillPoly]) {
      const pd = polyDist(poly, s, l);
      if (pd.d < ctx.creek.w * 2.4) {
        const cut = 1.25 * Math.max(0, 1 - (pd.d / ctx.creek.w) * (pd.d / ctx.creek.w));
        h -= cut;
        h += 0.14 * bump((pd.d - ctx.creek.w * 1.5) / (ctx.creek.w * 0.9));
      }
    }
  }
  if (ctx.pond) {
    const sd = pondSd(ctx.pond, s, l);
    if (sd < 4) {
      const wl = pondLevel(piece);
      const bottom = wl - ctx.pond.depth;
      h = lerp(h, Math.min(h, bottom), sstep(0.5, -5, sd));
      // hard granite edge along the road reach
      if (Math.abs(l) < 18 && sd > -ctx.pond.edgeW && sd < 1.0) {
        h = Math.max(h, wl + 0.42);
      }
    }
  }
  return h;
}

/* Final realized ground sample: height + class + stripe + wet, no shadows. */
const CLS_OUT = { h: 0, cls: CLS.ROUGH, clsB: CLS.ROUGH, edge: 9, ms: 1, ml: 0, phase: 0, phase2: 0, amp: 0, wet: 0, water: 0 };
function groundSample(piece, ctx, s, l, out) {
  out = out || CLS_OUT;
  const rf = roadField(piece, s, l);
  const natural = baseHeight(piece, ctx, s, l, rf.d);
  const h = roadEdgeShape(piece, s, l, natural, rf);
  let cls = CLS.ROUGH, clsB = CLS.ROUGH, edge = 9, ms = 1, ml = 0, phase = 0, phase2 = 0, amp = 0;
  const bridge = onBridge(piece, s);
  let done = false;
  // 1. asphalt
  if (!done && rf.d < 0 && !bridge) { cls = CLS.PATH; clsB = CLS.COLLAR; edge = -rf.d + 1.2; done = true; }
  // 2. bunkers cut everything else (sand right up to the collar where authored)
  if (!done) {
    for (const b of ctx.bunkers) {
      const sd = bunkerSd(b, s, l);
      if (sd < 0) {
        cls = CLS.BUNKER; clsB = CLS.FIRSTCUT; edge = -sd;
        for (const g of ctx.greens) {
          if (ellipseSd(s, l, g.cs, g.cl, g.rx, g.rz, g.rot) < 3.5) { clsB = CLS.GREEN; break; }
        }
        phase = -sd / 0.55; amp = 1; ms = 1; ml = 0;
        done = true; break;
      }
    }
  }
  // 3. water + stone edge + creek
  if (!done && ctx.pond) {
    const sd = pondSd(ctx.pond, s, l);
    if (sd < -ctx.pond.edgeW) { cls = CLS.WATER; clsB = CLS.STONE; edge = -sd - ctx.pond.edgeW; done = true; }
    else if (sd < 1.0 && Math.abs(l) < 18) { cls = CLS.STONE; clsB = sd < -ctx.pond.edgeW * 0.5 ? CLS.WATER : CLS.FIRSTCUT; edge = Math.min(sd + ctx.pond.edgeW, 1.0 - sd); done = true; }
    else if (sd < 1.6) { cls = CLS.FIRSTCUT; clsB = CLS.WATER; edge = 1.2; phase = sd / 1.3; amp = 0.5;
      ms = 0; ml = 1; done = true; }
  }
  if (!done && ctx.creek) {
    for (const poly of [ctx.creek.inPoly, ctx.creek.outPoly, ctx.creek.spillPoly]) {
      const pd = polyDist(poly, s, l);
      if (pd.d < ctx.creek.w) { cls = CLS.STONE; clsB = CLS.ROUGH; edge = ctx.creek.w - pd.d; done = true; break; }
    }
  }
  // 4. greens, their collars, approaches
  if (!done) {
    for (const g of ctx.greens) {
      const sd = ellipseSd(s, l, g.cs, g.cl, g.rx, g.rz, g.rot);
      if (sd < 0) {
        cls = CLS.GREEN; clsB = CLS.COLLAR; edge = -sd;
        const cU = Math.cos(g.rot + 0.785), sU = Math.sin(g.rot + 0.785);
        phase = ((s - g.cs) * cU + (l - g.cl) * sU) / 1.35;
        phase2 = (-(s - g.cs) * sU + (l - g.cl) * cU) / 1.35;
        amp = 0.55; ms = cU; ml = sU;
        done = true; break;
      } else if (sd < 1.2) {
        cls = CLS.COLLAR; clsB = CLS.GREEN; edge = Math.min(sd, 1.2 - sd) + 0.15;
        phase = sd / 0.6; amp = 0.4;
        const ang = Math.atan2(l - g.cl, s - g.cs);
        ms = -Math.sin(ang); ml = Math.cos(ang);
        done = true; break;
      }
    }
  }
  // 5. tees + their collars
  if (!done) {
    for (const t of ctx.tees) {
      const sd = rrectSd(s, l, t.cs, t.cl, t.hx, t.hz, t.rot, 1.2);
      if (sd < 0) {
        cls = CLS.TEE; clsB = CLS.COLLAR; edge = -sd;
        const c = Math.cos(t.rot + 1.5708), sn = Math.sin(t.rot + 1.5708);
        phase = ((s - t.cs) * c + (l - t.cl) * sn) / 1.4;
        amp = 0.5; ms = c; ml = sn; done = true; break;
      } else if (sd < 0.9) {
        cls = CLS.COLLAR; clsB = CLS.TEE; edge = Math.min(sd, 0.9 - sd) + 0.1; amp = 0; done = true; break;
      }
    }
  }
  // 6. road collar band (after greens/tees so their own collars win close in)
  if (!done && !bridge && rf.d >= 0 && rf.d < 3.2) {
    if (rf.d < 1.2) { cls = CLS.COLLAR; clsB = CLS.PATH; edge = rf.d + 0.3; }
    else { cls = CLS.COLLAR; clsB = CLS.FAIRWAY; edge = Math.min(rf.d - 0.0, 3.2 - rf.d) + 0.2; }
    phase = rf.d / 1.0; amp = 0.35; ms = 1; ml = 0;
    done = true;
  }
  // 7. approaches
  if (!done) {
    for (const hole of ctx.holes) {
      const g = hole.green;
      const lineEnd = hole.line[hole.line.length - 2];
      const apLen = 16;
      const dirS = g.cs - lineEnd[0], dirL = g.cl - lineEnd[1];
      const dl = Math.max(1e-6, Math.sqrt(dirS * dirS + dirL * dirL));
      const a0s = g.cs - (dirS / dl) * (apLen + g.rx), a0l = g.cl - (dirL / dl) * (apLen + g.rz);
      const r = segDist(s, l, a0s, a0l, g.cs, g.cl);
      if (r.d < 6.5) {
        cls = CLS.APPROACH; clsB = CLS.FIRSTCUT; edge = 6.5 - r.d;
        ms = dirS / dl; ml = dirL / dl;
        phase = ((s - a0s) * -ml + (l - a0l) * ms) / 2.6; amp = 0.7;
        done = true; break;
      }
    }
  }
  // 8. pine straw beds under stands (cut edge)
  if (!done) {
    for (const st of ctx.stands) {
      if (!st.straw) continue;
      const sd = standSd(st, s, l, 3.0);
      if (sd < 0) { cls = CLS.STRAW; clsB = CLS.ROUGH; edge = -sd; done = true; break; }
    }
  }
  // 9. planted beds (mulch ground; the plants are instanced above)
  if (!done) {
    for (const bd of ctx.beds) {
      const pd = polyDist(bd.poly, s, l);
      if (pd.d < bd.halfW) { cls = CLS.BED; clsB = CLS.ROUGH; edge = bd.halfW - pd.d; done = true; break; }
    }
  }
  // 10. fairways with first cut ring; lawns
  if (!done) {
    for (const hole of ctx.holes) {
      const fw = fairwayInfo(hole, s, l);
      if (fw.t > hole.tFw0 && fw.t < hole.tFw1) {
        if (fw.d < fw.wid) {
          cls = CLS.FAIRWAY; clsB = CLS.FIRSTCUT; edge = fw.wid - fw.d;
          ms = fw.tanS; ml = fw.tanL;
          phase = fw.perp / 3.6; amp = 1.0;
          done = true; break;
        } else if (fw.d < fw.wid + 2.4) {
          cls = CLS.FIRSTCUT; clsB = fw.d - fw.wid < 1.2 ? CLS.FAIRWAY : CLS.ROUGH;
          edge = Math.min(fw.d - fw.wid, fw.wid + 2.4 - fw.d) + 0.1;
          ms = fw.tanS; ml = fw.tanL; phase = fw.perp / 2.2; amp = 0.45;
          done = true; break;
        }
      }
    }
  }
  if (!done) {
    for (const lw of ctx.lawns) {
      if (s >= lw.s0 && s <= lw.s1 && l >= lw.l0 && l <= lw.l1) {
        cls = CLS.FAIRWAY; clsB = CLS.ROUGH;
        edge = Math.min(s - lw.s0, lw.s1 - s, l - lw.l0, lw.l1 - l);
        if (lw.mow === 'route') { ms = 1; ml = 0; phase = l / lw.band; }
        else { ms = Math.cos(lw.ang); ml = Math.sin(lw.ang); phase = (s * -ml + l * ms) / lw.band; }
        amp = 0.9; done = true; break;
      }
    }
  }
  // 10.9 specimen mown rings (and one that honours a tree that is not there)
  if (!done) {
    for (const rg of ctx.rings) {
      const d = dist2(s, l, rg.s, rg.l);
      if (d < rg.r) {
        cls = CLS.FIRSTCUT; clsB = CLS.ROUGH; edge = rg.r - d;
        const ang = Math.atan2(l - rg.l, s - rg.s);
        ms = -Math.sin(ang); ml = Math.cos(ang);
        phase = d / 1.15; amp = 0.5;
        done = true; break;
      }
    }
  }
  // 11. native beyond the property boundary
  if (!done) {
    const bl = boundaryAt(piece.F, s, 1), br = boundaryAt(piece.F, s, -1);
    const beyond = l > 0 ? l - bl : -l - br;
    if (beyond > 0) { cls = CLS.NATIVE; clsB = CLS.ROUGH; edge = beyond; done = true; }
    else { edge = -beyond; clsB = CLS.NATIVE; } // rough default, edged against native
  }
  // irrigation wetness + french drain lines
  let wet = 0;
  for (const hd of ctx.heads) {
    const d = dist2(s, l, hd.s, hd.l);
    if (d < 16) wet += 0.30 * bump((d - 8.2) / 7.2);
  }
  for (const dr of ctx.drains) {
    const pd = polyDist(dr.poly, s, l);
    if (pd.d < 0.9) wet -= 0.5 * (1 - pd.d / 0.9);
  }
  out.h = h; out.cls = cls; out.clsB = clsB; out.edge = edge;
  out.ms = ms; out.ml = ml; out.phase = phase; out.phase2 = phase2; out.amp = amp;
  out.wet = clamp(wet, -1, 1);
  out.water = cls === CLS.WATER ? 1 : 0;
  return out;
}

/* --------------------------------------------------- analytic sun shadows -- */
/* Long oblique canopy + trunk shadows and under-canopy dapple, evaluated in
   preview-world space against plan casters. */
function buildCasters(piece, s0, s1, sunTo) {
  const casters = [];
  const v = new THREE.Vector3();
  for (const t of piece.F.trees) {
    if (t.s < s0 - 150 || t.s > s1 + 150) continue;
    const loc = slToLocal(piece, t.s, t.l, 'A');
    const groundY = coarseBase(piece, t.s, t.l);
    pw(piece, loc.x, groundY, loc.z, v);
    const cy = groundY + t.crownBase + (t.h - t.crownBase) * 0.45;
    casters.push({ kind: 'crown', x: v.x, z: v.z, y: piece.T.oy + cy, r: t.crownR * 0.92,
      op: t.kind === 'pine' ? 0.88 : 0.94 });
    if (t.kind === 'pine' || t.kind === 'oak' || t.kind === 'magnolia') {
      casters.push({ kind: 'trunk', x: v.x, z: v.z, baseY: piece.T.oy + groundY,
        topY: piece.T.oy + groundY + t.crownBase + t.crownR * 0.5, r: Math.max(0.22, t.trunkR * 1.35), op: 0.85 });
    }
  }
  for (const st of piece.F.structures) {
    if (st.sMin < s0 - 120 && st.sMax > s1 + 120) continue;
    if (st.kind === 'clubhouse' || st.kind === 'equipShed') {
      const loc = slToLocal(piece, st.s, st.l, 'A');
      const groundY = coarseBase(piece, st.s, st.l);
      pw(piece, loc.x, groundY, loc.z, v);
      const rr = st.kind === 'clubhouse' ? 13 : (st.w || 12) * 0.55;
      casters.push({ kind: 'crown', x: v.x, z: v.z, y: piece.T.oy + groundY + 5, r: rr, op: 0.9 });
    }
  }
  return casters;
}
const SHADE_OUT = { shade: 0, dapple: 0 };
function shadeSample(casters, wx, wy, wz, sunTo, out) {
  out = out || SHADE_OUT;
  let shade = 0, dapple = 0;
  const hx = sunTo.x, hz = sunTo.z;
  const hLen = Math.max(1e-6, Math.sqrt(hx * hx + hz * hz));
  const tanE = sunTo.y / hLen;
  const ux = hx / hLen, uz = hz / hLen;
  for (let i = 0; i < casters.length; i++) {
    const c = casters[i];
    if (c.kind === 'crown') {
      const D = Math.max(0, (c.y - wy) / Math.max(0.08, tanE));
      if (D > 190) continue;
      const sx = c.x - ux * D, sz = c.z - uz * D;
      const dx = wx - sx, dz = wz - sz;
      const dd = Math.sqrt(dx * dx + dz * dz);
      const rEff = c.r * (1 + D * 0.010);
      if (dd < rEff) {
        const v = c.op * sstep(rEff, rEff * 0.62, dd);
        if (v > shade) shade = v;
      }
      const ddirX = wx - c.x, ddirZ = wz - c.z;
      const dHoriz = Math.sqrt(ddirX * ddirX + ddirZ * ddirZ);
      if (dHoriz < c.r * 1.08 && c.y - wy > 1.4 && c.y - wy < 26) {
        const dv = sstep(c.r * 1.08, c.r * 0.5, dHoriz);
        if (dv > dapple) dapple = dv;
      }
    } else {
      const lenTop = Math.max(0, (c.topY - wy) / Math.max(0.08, tanE));
      const L = Math.min(95, lenTop);
      if (L <= 0.4) continue;
      const bx = c.x, bz = c.z;
      const ex = bx - ux * L, ez = bz - uz * L;
      const r = segDist(wx, wz, bx, bz, ex, ez);
      const w = c.r * (1 + r.t * L * 0.012);
      if (r.d < w * 2.2) {
        const v = c.op * sstep(w * 2.2, w * 0.7, r.d);
        if (v > shade) shade = v;
      }
    }
  }
  out.shade = Math.min(1, shade); out.dapple = dapple;
  return out;
}

/* ============================================================== SHADERS ==== */
const GLSL_COMMON = `
  uniform vec3 uSunDir;     // toward the sun
  uniform vec3 uSunCol;
  uniform vec3 uSkyCol;
  uniform vec3 uGroundCol;
  uniform vec3 uHazeCol;
  uniform float uFogK;
  uniform float uEV;
  uniform float uFlat;
  uniform float uTime;
  uniform vec3 uCamPos;
  float vhash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453123); }
  float vnoise2(vec2 p){
    vec2 i = floor(p), f = fract(p);
    vec2 u = f*f*(3.0-2.0*f);
    return mix(mix(vhash(i), vhash(i+vec2(1.0,0.0)), u.x),
               mix(vhash(i+vec2(0.0,1.0)), vhash(i+vec2(1.0,1.0)), u.x), u.y);
  }
  vec3 lin(vec3 c){ return pow(max(c, vec3(0.0)), vec3(2.2)); }
  vec3 aces(vec3 x){
    return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0);
  }
  vec3 applyHaze(vec3 col, vec3 wpos){
    vec3 dv = wpos - uCamPos;
    float d = length(dv);
    vec3 vd = dv / max(d, 1e-3);
    float f = 1.0 - exp(-pow(d * uFogK, 1.45));
    float sunAmt = pow(max(dot(vd, uSunDir), 0.0), 6.0);
    vec3 hz = lin(uHazeCol) * 1.35 + uSunCol * sunAmt * 0.35 * (1.0 - uFlat);
    return mix(col, hz, clamp(f, 0.0, 1.0));
  }
  vec3 finishColor(vec3 col, vec3 wpos){
    col = applyHaze(col, wpos);
    col *= exp2(uEV);
    return pow(aces(col), vec3(1.0/2.2));
  }
`;

function baseUniforms() {
  return {
    uSunDir: { value: new THREE.Vector3(0.3, 0.4, 0.6) },
    uSunCol: { value: new THREE.Vector3(1.0, 0.84, 0.55).multiplyScalar(3.1) },
    uSkyCol: { value: new THREE.Vector3(0.38, 0.50, 0.66) },
    uGroundCol: { value: new THREE.Vector3(0.20, 0.26, 0.17) },
    uHazeCol: { value: new THREE.Vector3(0.845, 0.80, 0.72) },
    uFogK: { value: 1 / 1500 },
    uEV: { value: 0 },
    uFlat: { value: Q.light === 'flat' ? 1 : 0 },
    uTime: { value: 0 },
    uCamPos: { value: new THREE.Vector3() },
  };
}
let SHARED_UNIFORMS = null;
function sharedUniforms() {
  if (!SHARED_UNIFORMS) SHARED_UNIFORMS = baseUniforms();
  return SHARED_UNIFORMS;
}

/* ---- turf: one material, one stripe function, all maintenance classes ---- */
function makeTurfMaterial() {
  const vert = `
    attribute vec3 aColA;
    attribute vec3 aColB;
    attribute float aEdge;     // signed: + inside class A (lower id)
    attribute vec2 aMow;       // world-space mow direction (xz)
    attribute float aPhase;
    attribute float aPhase2;
    attribute float aAmp;
    attribute float aShade;
    attribute float aDapple;
    attribute float aWet;
    attribute vec2 aClsAB;     // class ids of A and B
    varying vec3 vColA; varying vec3 vColB;
    varying float vEdge; varying vec2 vMow;
    varying float vPhase; varying float vPhase2; varying float vAmp;
    varying float vShade; varying float vDapple; varying float vWet;
    varying vec2 vClsAB; varying vec3 vNorm; varying vec3 vPos;
    void main(){
      vColA = aColA; vColB = aColB; vEdge = aEdge; vMow = aMow;
      vPhase = aPhase; vPhase2 = aPhase2; vAmp = aAmp;
      vShade = aShade; vDapple = aDapple; vWet = aWet; vClsAB = aClsAB;
      vNorm = normal; vPos = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `;
  const frag = `
    precision highp float;
    ${'__COMMON__'}
    varying vec3 vColA; varying vec3 vColB;
    varying float vEdge; varying vec2 vMow;
    varying float vPhase; varying float vPhase2; varying float vAmp;
    varying float vShade; varying float vDapple; varying float vWet;
    varying vec2 vClsAB; varying vec3 vNorm; varying vec3 vPos;
    void main(){
      float aaE = fwidth(vEdge) * 0.9 + 0.015;
      float inA = smoothstep(-aaE, aaE, vEdge);
      vec3 albedo = lin(mix(vColB, vColA, inA));
      float cls = mix(vClsAB.y, vClsAB.x, step(0.0, vEdge));
      // stripe parity: triangle wave with screen-space AA
      float aaP = fwidth(vPhase) * 0.75 + 0.001;
      float tw = abs(fract(vPhase * 0.5) * 2.0 - 1.0);
      float par = smoothstep(0.5 - aaP, 0.5 + aaP, tw) * 2.0 - 1.0;
      bool isGreen = abs(cls - 3.0) < 0.5;
      if (isGreen) {
        float tw2 = abs(fract(vPhase2 * 0.5) * 2.0 - 1.0);
        float par2 = smoothstep(0.5 - aaP, 0.5 + aaP, tw2) * 2.0 - 1.0;
        par = par * par2;
      }
      bool isSand = abs(cls - 7.0) < 0.5;
      bool isWater = abs(cls - 12.0) < 0.5;
      float stripe = vAmp * (isSand ? 0.0 : 1.0);
      vec3 N = normalize(vNorm);
      vec3 mow3 = vec3(vMow.x, 0.0, vMow.y);
      vec3 Nb = normalize(N + mow3 * (par * 0.24 * stripe));
      if (isSand) {
        // concentric rake arcs consistent with the bunker's own shape
        float rake = sin(vPhase * 6.2831853);
        Nb = normalize(N + mow3 * rake * 0.22);
        albedo *= 1.0 + rake * 0.045;
      }
      vec3 V = normalize(uCamPos - vPos);
      float diff = max(dot(Nb, uSunDir), 0.0);
      // grass lies away/toward the eye per band: the view-angle value change
      float viewTilt = dot(normalize(vec3(V.x, 0.0, V.z)).xz, vMow) * par * 0.17 * stripe;
      albedo *= 1.0 + viewTilt + par * 0.10 * stripe;
      albedo *= 1.0 - clamp(vWet, 0.0, 1.0) * 0.13;
      albedo = mix(albedo, albedo * vec3(0.88, 1.02, 0.88), clamp(vWet, 0.0, 1.0) * 0.5);
      albedo = mix(albedo, albedo * vec3(1.10, 1.04, 0.88), clamp(-vWet, 0.0, 1.0) * 0.45);
      // shadow with moving dapple under canopy
      float dap = vnoise2(vPos.xz * 0.85 + vec2(uTime * 0.22, uTime * 0.13));
      float shadeF = vShade * mix(1.0, 0.35 + 0.85 * dap, clamp(vDapple, 0.0, 1.0) * 0.9);
      shadeF = clamp(shadeF, 0.0, 1.0);
      float sunTerm = diff * (1.0 - shadeF * 0.93);
      vec3 amb = mix(uGroundCol, uSkyCol, N.y * 0.5 + 0.5) * (1.0 - shadeF * 0.38);
      vec3 col = albedo * (amb * 1.05 + uSunCol * sunTerm);
      if (isSand) {
        float spark = step(0.955, vnoise2(vPos.xz * 47.0));
        col += uSunCol * spark * diff * (1.0 - shadeF) * 0.35;
      }
      if (isWater) col *= 0.55;
      float micro = vnoise2(vPos.xz * 2.1) * 0.06 - 0.03;
      col *= 1.0 + micro;
      gl_FragColor = vec4(finishColor(col, vPos), 1.0);
    }
  `.replace('__COMMON__', GLSL_COMMON);
  return new THREE.ShaderMaterial({ uniforms: sharedUniforms(), vertexShader: vert, fragmentShader: frag });
}

/* ---- road: near-black asphalt, joints, wear, kerb, patches, sand carry ---- */
function makeRoadMaterial() {
  const vert = `
    attribute float aS;
    attribute float aL;
    attribute float aShade;
    attribute float aDapple;
    attribute float aKerb;
    attribute float aSand;
    attribute float aSurf;   // 0 asphalt, 1 bridge stone, 2 grid steel
    varying float vS; varying float vL; varying float vShade; varying float vDapple;
    varying float vKerb; varying float vSand; varying float vSurf;
    varying vec3 vNorm; varying vec3 vPos;
    void main(){
      vS = aS; vL = aL; vShade = aShade; vDapple = aDapple;
      vKerb = aKerb; vSand = aSand; vSurf = aSurf;
      vNorm = normal; vPos = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `;
  const frag = `
    precision highp float;
    ${'__COMMON__'}
    varying float vS; varying float vL; varying float vShade; varying float vDapple;
    varying float vKerb; varying float vSand; varying float vSurf;
    varying vec3 vNorm; varying vec3 vPos;
    void main(){
      vec3 base = vec3(0.085, 0.088, 0.094);
      float agg = vnoise2(vPos.xz * 9.0);
      base *= 0.88 + agg * 0.30;
      float sparkle = step(0.965, vnoise2(vPos.xz * 61.0));
      base += sparkle * 0.028;
      // worn centre line + faint wheel tracks
      base += (1.0 - smoothstep(0.05, 0.5, abs(vL))) * 0.020;
      base += (1.0 - smoothstep(0.15, 0.5, abs(abs(vL) - 1.9))) * 0.010;
      // expansion joints every 12 m (not on the bridge)
      float jm = 1.0 - smoothstep(0.02, 0.10, abs(mod(vS, 12.0) - 6.0) - 5.94);
      // repair patches of visibly different age
      float cell = floor(vS / 17.0);
      float ph = vhash(vec2(cell, 3.7));
      float inPatch = step(ph, 0.24) * step(abs(vL - (ph * 8.0 - 4.0)), 2.4)
                    * (1.0 - smoothstep(0.2, 0.6, abs(mod(vS, 17.0) - 8.5) - 2.0 * ph - 2.0));
      base = mix(base, base * 1.16 + vec3(0.004), inPatch * 0.75);
      base *= 1.0 - jm * (1.0 - vSurf) * 0.4;
      // kerb strip on bends: pale flush granite
      float kerbBand = step(5.02, abs(vL)) * vKerb;
      base = mix(base, vec3(0.42, 0.41, 0.38) * (0.85 + agg * 0.3), kerbBand);
      // bridge stone deck
      if (vSurf > 0.5) {
        vec3 stone = vec3(0.34, 0.33, 0.30) * (0.8 + 0.4 * vnoise2(vPos.xz * 3.0));
        float sj = (1.0 - smoothstep(0.02, 0.09, abs(mod(vS, 2.2) - 1.1) - 1.02))
                 + (1.0 - smoothstep(0.02, 0.09, abs(mod(vL, 1.8) - 0.9) - 0.82));
        stone *= 1.0 - clamp(sj, 0.0, 1.0) * 0.35;
        base = stone;
      }
      // swept-but-not-perfect sand carry
      float sandMask = vSand * smoothstep(0.45, 0.85, vnoise2(vPos.xz * 5.0));
      base = mix(base, vec3(0.21, 0.19, 0.16), clamp(sandMask, 0.0, 0.38));
      base = lin(base) * 7.4;
      vec3 N = normalize(vNorm);
      vec3 V = normalize(uCamPos - vPos);
      float dap = vnoise2(vPos.xz * 0.85 + vec2(uTime * 0.22, uTime * 0.13));
      float shadeF = vShade * mix(1.0, 0.35 + 0.85 * dap, clamp(vDapple, 0.0, 1.0) * 0.9);
      shadeF = clamp(shadeF, 0.0, 1.0);
      float diff = max(dot(N, uSunDir), 0.0);
      vec3 amb = mix(uGroundCol, uSkyCol, N.y * 0.5 + 0.5) * (1.0 - shadeF * 0.38);
      vec3 col = base * (amb * 1.1 + uSunCol * diff * (1.0 - shadeF * 0.93));
      // grazing asphalt sheen toward the sun
      vec3 R = reflect(-V, N);
      float sheen = pow(max(dot(R, uSunDir), 0.0), 42.0) * 0.10 * (1.0 - shadeF) * (1.0 - vSurf);
      col += uSunCol * sheen;
      gl_FragColor = vec4(finishColor(col, vPos), 1.0);
    }
  `.replace('__COMMON__', GLSL_COMMON);
  return new THREE.ShaderMaterial({ uniforms: sharedUniforms(), vertexShader: vert, fragmentShader: frag });
}

/* ---- sky dome ---- */
function makeSkyMaterial() {
  const vert = `
    varying vec3 vDir;
    void main(){
      vDir = position;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_Position.z = gl_Position.w * 0.99999;
    }
  `;
  const frag = `
    precision highp float;
    ${'__COMMON__'}
    varying vec3 vDir;
    void main(){
      vec3 d = normalize(vDir);
      float h = clamp(d.y, -0.08, 1.0);
      vec3 zen = lin(mix(vec3(0.36, 0.55, 0.78), vec3(0.66, 0.71, 0.78), uFlat));
      vec3 hor = lin(mix(vec3(1.02, 0.87, 0.66), vec3(0.88, 0.89, 0.90), uFlat));
      vec3 col = mix(hor, zen, pow(clamp(h * 2.1, 0.0, 1.0), 0.66));
      // humid layers near the horizon
      float band = sin(h * 60.0) * 0.5 + 0.5;
      col = mix(col, hor * 1.02, (1.0 - smoothstep(0.0, 0.16, h)) * band * 0.10 * (1.0 - uFlat));
      float sunD = dot(d, uSunDir);
      float disc = smoothstep(0.9996, 0.99985, sunD);
      float glow = pow(max(sunD, 0.0), 60.0);
      float wide = pow(max(sunD, 0.0), 8.0);
      col += (uSunCol * disc * 4.0 + uSunCol * glow * 0.7 + uSunCol * wide * 0.08) * (1.0 - uFlat * 0.85);
      // slow cirrus streaks
      float cir = vnoise2(vec2(d.x * 5.0 + d.y * 14.0, d.z * 5.0) + uTime * 0.004);
      col += vec3(1.0, 0.97, 0.9) * smoothstep(0.68, 0.9, cir) * 0.05 * smoothstep(0.06, 0.4, h);
      col *= exp2(uEV * 0.6);
      gl_FragColor = vec4(pow(aces(col), vec3(1.0/2.2)), 1.0);
    }
  `.replace('__COMMON__', GLSL_COMMON);
  const m = new THREE.ShaderMaterial({ uniforms: sharedUniforms(), vertexShader: vert, fragmentShader: frag,
    side: THREE.BackSide, depthWrite: false });
  return m;
}

/* ---- pond + creek water ---- */
function makePondMaterial(extra) {
  const uni = Object.assign({}, sharedUniforms(), {
    uRings: { value: new Float32Array(32) },  // 8 rings: x, z, age, amp
    uPond: { value: new THREE.Vector4(0, 0, 60, 40) },
  });
  const vert = `
    varying vec3 vPos;
    void main(){ vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
  `;
  const frag = `
    precision highp float;
    ${'__COMMON__'}
    uniform float uRings[32];
    uniform vec4 uPond;
    varying vec3 vPos;
    void main(){
      vec2 p = vPos.xz;
      float t = uTime;
      float n1 = vnoise2(p * 0.55 + vec2(t * 0.06, t * 0.045));
      float n2 = vnoise2(p * 1.7 - vec2(t * 0.05, t * 0.08));
      vec2 grad = vec2(n1 - vnoise2(p * 0.55 + vec2(0.13, 0.0) + vec2(t * 0.06, t * 0.045)),
                       n1 - vnoise2(p * 0.55 + vec2(0.0, 0.13) + vec2(t * 0.06, t * 0.045)));
      vec3 N = normalize(vec3(grad.x * 1.7 + (n2 - 0.5) * 0.38, 1.0, grad.y * 1.7));
      // swallow strike rings
      for (int i = 0; i < 8; i++) {
        float rx = uRings[i*4+0], rz = uRings[i*4+1], age = uRings[i*4+2], amp = uRings[i*4+3];
        if (amp <= 0.0) continue;
        float d = length(p - vec2(rx, rz));
        float ring = sin((d - age * 1.6) * 9.0) * exp(-d * 0.55) * exp(-age * 0.8) * amp;
        N.xz += vec2(ring * 0.35);
      }
      N = normalize(N);
      vec3 V = normalize(uCamPos - vPos);
      vec3 R = reflect(-V, N);
      R.y = abs(R.y);
      float hh = clamp(R.y, 0.0, 1.0);
      vec3 zen = lin(mix(vec3(0.36, 0.55, 0.78), vec3(0.66, 0.71, 0.78), uFlat));
      vec3 hor = lin(mix(vec3(1.02, 0.87, 0.66), vec3(0.88, 0.89, 0.90), uFlat));
      vec3 skyR = mix(hor, zen, pow(hh * 1.6, 0.8));
      // dark far-bank reflection band
      vec2 fromC = (p - uPond.xy) / uPond.zw;
      float bank = smoothstep(0.45, 0.95, length(fromC));
      skyR = mix(skyR, vec3(0.10, 0.16, 0.11), bank * clamp(1.0 - R.y * 2.6, 0.0, 1.0) * 0.85);
      float fres = 0.34 + 0.66 * pow(1.0 - max(dot(V, N), 0.0), 2.6);
      vec3 deep = lin(vec3(0.10, 0.15, 0.13)) * 1.6;
      vec3 col = mix(deep, skyR, clamp(fres, 0.0, 1.0));
      float glint = pow(max(dot(R, uSunDir), 0.0), 340.0);
      col += uSunCol * glint * 4.0 * (1.0 - uFlat * 0.7);
      gl_FragColor = vec4(finishColor(col, vPos), 1.0);
    }
  `.replace('__COMMON__', GLSL_COMMON);
  const m = new THREE.ShaderMaterial({ uniforms: uni, vertexShader: vert, fragmentShader: frag });
  return m;
}
function makeCreekMaterial() {
  const vert = `
    attribute vec2 aFlow;   // u along flow, v across
    varying vec3 vPos; varying vec2 vFlow;
    void main(){ vPos = position; vFlow = aFlow; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
  `;
  const frag = `
    precision highp float;
    ${'__COMMON__'}
    varying vec3 vPos; varying vec2 vFlow;
    void main(){
      float u = vFlow.x - uTime * 1.9;
      float r1 = vnoise2(vec2(u * 1.4, vFlow.y * 3.0));
      float r2 = vnoise2(vec2(u * 3.2 + 7.0, vFlow.y * 6.0));
      vec3 col = lin(vec3(0.42, 0.50, 0.48)) * (0.7 + r1 * 0.5);
      float fleck = smoothstep(0.72, 0.95, r2);
      col += vec3(0.85) * fleck * 0.5;
      float edge = 1.0 - smoothstep(0.75, 1.0, abs(vFlow.y));

    transparent: true, depthWrite: false });
}

/* ---- lit material for props / foliage (instanced or merged) ---- */
function makeLitMaterial(opts) {
  const inst = !!opts.instanced;
  const sway = !!opts.sway;
  const foliage = !!opts.foliage;
  const vert = `
    ${inst ? '' : 'attribute vec3 color;'}
    varying vec3 vCol; varying vec3 vNorm; varying vec3 vPos; varying float vH;
    uniform float uTime;
    void main(){
      vec3 p = position;
      vec3 n = normal;
      ${inst ? `
      vec4 wp4 = instanceMatrix * vec4(p, 1.0);
      vec3 wp = wp4.xyz;
      n = normalize((instanceMatrix * vec4(n, 0.0)).xyz);
      vCol = instanceColor;
      float ph = instanceMatrix[3].x * 0.37 + instanceMatrix[3].z * 0.61;
      ` : `
      vec3 wp = p;
      vCol = color;
      float ph = p.x * 0.05;
      `}
      ${sway ? `
      float sw = sin(uTime * 0.85 + ph) * 0.012 + sin(uTime * 0.53 + ph * 1.7) * 0.008;
      wp.xz += sw * max(0.0, p.y) * 8.0 * vec2(0.8, 0.6);
      ` : ''}
      vNorm = n; vPos = wp; vH = p.y;
      gl_Position = projectionMatrix * viewMatrix * vec4(wp, 1.0);
    }
  `;
  const frag = `
    precision highp float;
    ${'__COMMON__'}
    varying vec3 vCol; varying vec3 vNorm; varying vec3 vPos; varying float vH;
    void main(){
      vec3 N = normalize(vNorm);
      vec3 V = normalize(uCamPos - vPos);
      float diff = max(dot(N, uSunDir), 0.0);
      ${foliage ? `
      diff = diff * 0.62 + 0.38 * max(dot(N, uSunDir) * 0.5 + 0.5, 0.0); // wrap
      ` : ''}
      vec3 amb = mix(uGroundCol, uSkyCol, N.y * 0.5 + 0.5);
      float ao = ${foliage ? 'mix(0.55, 1.0, clamp(vH * 0.14, 0.0, 1.0))' : 'mix(0.7, 1.0, clamp(vH * 0.5, 0.0, 1.0))'};
      vec3 col = lin(vCol) * (amb * 1.05 + uSunCol * diff) * ao;
      ${foliage ? `
      float back = pow(max(dot(V, -uSunDir) * 0.5 + 0.5, 0.0), 5.0);
      col += lin(vCol) * uSunCol * back * 0.30 * (1.0 - uFlat);
      float micro = vnoise2(vPos.xz * 3.1 + vPos.y) * 0.14 - 0.07;
      col *= 1.0 + micro;
      ` : ''}
      gl_FragColor = vec4(finishColor(col, vPos), 1.0);
    }
  `.replace('__COMMON__', GLSL_COMMON);
  return new THREE.ShaderMaterial({ uniforms: sharedUniforms(), vertexShader: vert, fragmentShader: frag });
}

/* ---- flags: waving cloth + landmark visibility ---- */
function makeFlagMaterial() {

    varying vec2 vUv; varying vec3 vPos;

}

/* ---- birds: flapping instanced silhouettes ---- */
function makeBirdMaterial() {
  const vert = `
    attribute float aWing;    // -1 left wing, +1 right wing, 0 body
    attribute float aPhase;
    varying vec3 vPos; varying float vLum;
    uniform float uTime;
    void main(){
      vec3 p = position;

      if (abs(aWing) > 0.5) {

        p = vec3(p.x, p.y * c - p.z * 0.0 + abs(p.x) * s * aWing, p.z);

  `.replace('__COMMON__', GLSL_COMMON);

    side: THREE.DoubleSide });
}

/* ---- additive atmosphere: shafts, mist, pollen, sprinkler jets ---- */
function makeShaftMaterial() {
  const vert = `
    varying vec2 vUv; varying vec3 vPos;
    void main(){ vUv = uv; vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
  `;
  const frag = `
    precision highp float;
    ${'__COMMON__'}
    varying vec2 vUv; varying vec3 vPos;
    void main(){
      float lat = sin(vUv.x * 3.14159);
      float tall = smoothstep(0.0, 0.25, vUv.y) * (1.0 - smoothstep(0.55, 1.0, vUv.y));
      float shimmer = 0.75 + 0.25 * vnoise2(vec2(vUv.x * 6.0, vUv.y * 2.0 - uTime * 0.05));
      vec3 V = normalize(uCamPos - vPos);

    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide });
}
function makeMistMaterial() {
  const vert = `
    attribute vec3 aCenter;
    attribute vec2 aCorner;
    attribute float aSize;
    attribute float aSeed;
    varying vec2 vC; varying float vSeed; varying vec3 vPos;
    uniform float uTime;
    void main(){
      vec3 c = aCenter;
      c.x += sin(uTime * 0.06 + aSeed * 17.0) * 4.0;
      c.z += cos(uTime * 0.05 + aSeed * 23.0) * 4.0;

      vec3 camUp = vec3(viewMatrix[0][1], viewMatrix[1][1], viewMatrix[2][1]);
      vec3 wp = c + camRight * aCorner.x * aSize + camUp * aCorner.y * aSize * 0.5;
      vC = aCorner; vSeed = aSeed; vPos = wp;
      gl_Position = projectionMatrix * viewMatrix * vec4(wp, 1.0);
    }
  `;
  const frag = `
    precision highp float;
    ${'__COMMON__'}
    varying vec2 vC; varying float vSeed; varying vec3 vPos;

    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
}
function makePollenMaterial() {
  const vert = `
    attribute vec3 aBase;
    attribute vec2 aCorner;
    attribute float aSeed;
    varying float vA; varying vec3 vPos;
    uniform float uTime; uniform vec3 uCamPos;
    void main(){
      vec3 span = vec3(56.0, 22.0, 56.0);
      vec3 drift = vec3(uTime * 0.55, sin(uTime * 0.4 + aSeed * 9.0) * 2.0 - uTime * 0.12, uTime * 0.4);
      vec3 p = mod(aBase + drift - uCamPos, span) - span * 0.5 + uCamPos;
      p.y = uCamPos.y + mod(aBase.y + drift.y, span.y) - span.y * 0.45;
      vec3 camRight = vec3(viewMatrix[0][0], viewMatrix[1][0], viewMatrix[2][0]);
      vec3 camUp = vec3(viewMatrix[0][1], viewMatrix[1][1], viewMatrix[2][1]);
      float sz = 0.010 + 0.012 * fract(aSeed * 7.0);
      vec3 wp = p + camRight * aCorner.x * sz + camUp * aCorner.y * sz;
      float d = length(p - uCamPos);
      vA = (1.0 - smoothstep(20.0, 34.0, d)) * smoothstep(1.6, 4.0, d);

      gl_Position = projectionMatrix * viewMatrix * vec4(wp, 1.0);
    }
  `;
  const frag = `
    precision highp float;
    ${'__COMMON__'}
    varying float vA; varying vec3 vPos;
    void main(){
      vec3 V = normalize(uCamPos - vPos);
      float toward = pow(max(dot(V, -uSunDir), 0.0) * 0.5 + 0.5, 3.0);
      float a = vA * (0.10 + 0.5 * toward) * (1.0 - uFlat * 0.6);

  return new THREE.ShaderMaterial({ uniforms: sharedUniforms(), vertexShader: vert, fragmentShader: frag,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
}
function makeSprayMaterial() {
  const vert = `
    attribute vec3 aRoot;      // sprinkler head world position
    attribute vec2 aCorner;
    attribute float aSeed;     // per-jet random
    attribute float aOn;       // schedule gate 0/1 set per rebuild
    varying float vA; varying vec3 vPos; varying float vT;
    uniform float uTime;
    void main(){
      // rotating impact jet: a slim arc of droplets
      float ang = uTime * 0.9 + aSeed * 6.2831;
      float len = 7.0 + 4.0 * fract(aSeed * 13.0);
      float t = fract(aSeed * 29.0);

      vec3 p = aRoot + dir * len * t + vec3(0.0, sin(t * 3.14159) * (1.1 + fract(aSeed * 7.0) * 1.2), 0.0);

    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
}
function makeRainbowMaterial() {
  const vert = `
    varying vec2 vUv; varying vec3 vPos;
    void main(){ vUv = uv; vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
  `;

/* ======================================================= CHUNK GEOMETRY ==== */
/* Terrain grids are route-aligned: rows at fixed stations, columns at fixed
   laterals — identical across quality tiers, so clearance is tier-invariant. */
function buildLatColumns(hasFork) {
  const cols = [];
  const horizon = [160, 185, 215, 255, 305, 370];   // ground runs out to the haze
  if (hasFork) {
    for (const l of [-140, -131]) cols.push(l);
    for (let l = -124; l <= 20.01; l += 1.6) cols.push(Math.round(l * 100) / 100);
    for (let l = 23.2; l <= 96.01; l += 3.2) cols.push(Math.round(l * 10) / 10);
    for (const l of [102, 110, 119, 129, 140]) cols.push(l);
    for (const l of horizon) { cols.push(l); cols.push(-l); }
  } else {
    const core = [0, 1.2, 2.6, 4.0, 5.4, 6.6, 8.2, 10, 11.2, 13.8, 16.5, 19];
    const far = [22, 25.5, 29, 33, 37, 41.5, 46, 51, 56, 61, 67, 73, 79, 86, 92, 99, 106, 114, 122, 131, 140].concat(horizon);
    const right = core.concat(far);
    for (let i = right.length - 1; i >= 1; i--) cols.push(-right[i]);
    for (const l of right) cols.push(l);
  }
  // force-include the exact road-critical laterals
  for (const need of [-6.6, -5.4, -4.0, -2.6, -1.2, 0, 1.2, 2.6, 4.0, 5.4, 6.6]) {
    if (!cols.some(c => Math.abs(c - need) < 0.05)) cols.push(need);
  }
  cols.sort((a, b) => a - b);
  const out = [];
  for (const c of cols) if (!out.length || c - out[out.length - 1] > 0.05) out.push(c);
  return out;
}
const ROW_STEP = 2.5;

/* Build state for one chunk's terrain: sliced across frames by the queue. */
function terrainRows(piece, chunk, ctx, casters, sunTo, state) {
  const lat = piece.latCols;
  const nCols = lat.length;
  const nRows = Math.round((chunk.s1 - chunk.s0) / ROW_STEP) + 1;
  if (!state.arr) {
    state.arr = {
      pos: new Float32Array(nRows * nCols * 3),
      norm: new Float32Array(nRows * nCols * 3),
      colA: new Float32Array(nRows * nCols * 3),
      colB: new Float32Array(nRows * nCols * 3),
      edge: new Float32Array(nRows * nCols),
      mow: new Float32Array(nRows * nCols * 2),
      phase: new Float32Array(nRows * nCols),
      phase2: new Float32Array(nRows * nCols),
      amp: new Float32Array(nRows * nCols),
      shade: new Float32Array(nRows * nCols),
      dapple: new Float32Array(nRows * nCols),
      wet: new Float32Array(nRows * nCols),
      clsAB: new Float32Array(nRows * nCols * 2),
      hGrid: new Float32Array(nRows * nCols),
      clsGrid: new Uint8Array(nRows * nCols),
      nRows, nCols, row: 0,
    };
  }
  const A = state.arr;
  const out = {};
  const shOut = {};
  const v = new THREE.Vector3();
  const ROWS_PER_SLICE = 3;
  const rowEnd = Math.min(A.nRows, A.row + ROWS_PER_SLICE);
  for (; A.row < rowEnd; A.row++) {
    const r = A.row;
    const s = chunk.s0 + r * ROW_STEP;
    const f = frameAtLocal(piece.frames, s);
    for (let c = 0; c < nCols; c++) {
      const l = lat[c];
      const i = r * nCols + c;
      groundSample(piece, ctx, s, l, out);
      const lx = f.x + f.lx * l, lz = f.z + f.lz * l;
      pw(piece, lx, out.h, lz, v);
      A.pos[i * 3] = v.x; A.pos[i * 3 + 1] = v.y; A.pos[i * 3 + 2] = v.z;
      A.hGrid[i] = out.h; A.clsGrid[i] = out.cls;
      // signed-edge encoding: A = lower class id side, sign + when inside it
      let clsLo = out.cls, clsHi = out.clsB, e = out.edge;

        kit.tri(p00, p10, p01, color);
        kit.tri(p01, p10, p11, color);
        if (r1 > 0.01) kit.tri(p10, [cx, cy + h, cz], p11, color);
      }
    },
    gable(cx, cy, cz, w, h, d, rot, color) {
      // triangular roof prism along local z
      const cr = Math.cos(rot || 0), sr = Math.sin(rot || 0);
      const T = (x, y, z) => [cx + x * cr + z * sr, cy + y, cz - x * sr + z * cr];
      const a0 = T(-w / 2, 0, -d / 2), a1 = T(w / 2, 0, -d / 2), a2 = T(0, h, -d / 2);
      const b0 = T(-w / 2, 0, d / 2), b1 = T(w / 2, 0, d / 2), b2 = T(0, h, d / 2);
      kit.tri(a0, a1, a2, color); kit.tri(b1, b0, b2, color);
      kit.tri(a0, a2, b2, color); kit.tri(a0, b2, b0, color);
      kit.tri(a1, b1, b2, color); kit.tri(a1, b2, a2, color);
    },
    geometry() {
      if (!pos.length) return null;
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pos), 3));
      g.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(norm), 3));
      g.setAttribute('color', new THREE.BufferAttribute(new Float32Array(col), 3));
      return g;
    },
  };
  return kit;
}

/* tee complex furniture: benches, ball washers, markers, divot boxes */
function buildTeeFurniture(kit, piece, hole) {
  const t0 = hole.tees[0];
  const side = Math.sign(t0.cl) || 1;
  const lOut = guardLat(t0.cl + side * (t0.hz + 2.2), 1.2);
  kit.begin(t0.cs - 3, lOut, 0, 0);
  kit.box(0, 0.45, 0, 0.5, 0.08, 1.8, 0, C_TIMBER);          // bench
  kit.box(0, 0.2, 0.7, 0.4, 0.42, 0.12, 0, C_TIMBER);
  kit.box(0, 0.2, -0.7, 0.4, 0.42, 0.12, 0, C_TIMBER);
  kit.begin(t0.cs + 2.5, lOut, 0, 0);
  kit.cyl(0, 0, 0, 0.09, 0.09, 0.9, 6, C_WHITE);             // ball washer
  kit.box(0, 1.05, 0, 0.34, 0.4, 0.26, 0, [0.72, 0.12, 0.10]);
  kit.begin(t0.cs + 4.2, lOut, 0, 0);
  kit.box(0, 0.3, 0, 0.5, 0.6, 0.4, 0, PAL.mower);           // divot box
  for (const tee of hole.tees) {
    for (const dx of [-2.2, 2.2]) {
      kit.begin(tee.cs + Math.sin(tee.rot) * dx, tee.cl + Math.cos(tee.rot) * dx, 0, 0);
      kit.box(0, 0.16, 0, 0.3, 0.32, 0.3, 0, tee.markers === 'back' ? [0.1, 0.15, 0.5] : C_WHITE);
    }
  }
}
/* rope-and-post cart control near a green */
function buildRopeRun(kit, piece, s0, l, n) {
  let prevTop = null;
  for (let i = 0; i < n; i++) {
    const s = s0 + i * 3.4;
    const y = kit.begin(s, l, 0, 0);
    kit.cyl(0, 0, 0, 0.05, 0.05, 0.85, 5, C_WHITE);
    if (prevTop !== null) {
      const sag = 0.16;
      for (let k2 = 0; k2 < 4; k2++) {
        const t = (k2 + 0.5) / 4;
        const yy = 0.8 - Math.sin(t * Math.PI) * sag;
        kit.begin(s - 3.4 + t * 3.4, l, 0, 0);
        kit.box(0, yy, 0, 0.03, 0.03, 0.9, 0, PAL.rope);
      }
    }
    prevTop = true;
  }
}
