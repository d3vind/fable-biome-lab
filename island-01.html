    const w=T.fwd(B.p[i],B.p[i+2]);
    B.p[i]=w[0]; B.p[i+2]=w[1]; B.p[i+1]=T.fwdY(B.p[i+1]);
  }
}
const FORMATION_STAT={ built:0, orchard:0, boundary:0, sisters:0, gates:0 };
for(let k=0;k<XFORMS.length;k++){
  const T=XFORMS[k];
  const nearB=Buf(), massB=Buf(), uB=UBuf();
  for(const t of TREES){
    if(!t.formation) continue;
    let tier=1, round=true;
    if(t.formation==='dappled-gate'){ tier=2; FORMATION_STAT.gates++; }
    else if(t.formation==='wind-sisters'){ tier=1; FORMATION_STAT.sisters++; }
    else if(t.fam==='orchard'){ tier=(t.d<30)?1:0; round=(t.d<30); FORMATION_STAT.orchard++; }
    else { tier=1; FORMATION_STAT.boundary++; }
    // Boundary row stays tier 1, re-decided against the deterministic swept
    // maximum: articulating it reads 118.3k on the default seed but 120.5k on
    // COMBE-777 at high tier — over the ceiling on reachable seeds. At its
    // honest twenty metres, welded tier-1 trunks carry the line.
    const overhang=(t.d<EXCL+10)?(t.roadY+9.0):undefined;
    buildTree(tier===2?nearB:massB,t,tier,overhang,round);
    FORMATION_STAT.built++;
    const st=subStream('base',Math.round(t.x*10),Math.round(t.z*10));
    const dark=mixc(PAL.woodDeep,PAL.bark,0.30).lerp(col(PAL.leafShade),0.18);
    addPatch(uB,t.x,seatOnGroundL(t.x,t.z,0)+0.03,t.z,1.1*t.scl+st.r(0,0.7),dark);
  }
  transformBuf(nearB,T); transformBuf(massB,T); transformUBuf(uB,T);
  if(nearB.p.length){ const m=new THREE.Mesh(bufGeo(nearB),treeMatNear);
    m.castShadow=(QCFG.shadow>0); m.matrixAutoUpdate=false; m.name='formation-near-'+k;
    scene.add(m); bookMesh(m,true,k); }
  if(massB.p.length){ const m=new THREE.Mesh(bufGeo(massB),treeMatMid);
    m.castShadow=(QCFG.shadow>0); m.matrixAutoUpdate=false; m.name='formation-mass-'+k;
    scene.add(m); bookMesh(m,true,k); }
  if(uB.p.length){ const m=new THREE.Mesh(uGeo(uB),underMat);
    m.matrixAutoUpdate=false; m.name='formation-under-'+k;
    scene.add(m); bookMesh(m,true,k); }
}
H.real.feed('formations',FORMATION_STAT.built);

// ============================================================
// BANDS — deterministic residency along the island, per copy. Identity
// comes from position in the LOCAL frame, never from realization order.
// ============================================================
const BAND=200;
const NBAND=Math.ceil(L_ISL/BAND);
const bandTreesL=Array.from({length:NBAND},()=>[]);
for(const t of TREES){
  if(t.formation||t.unseatable) continue;
  if(t.d>QCFG.farD) continue;
  const bi=clamp(Math.floor(t.s/BAND),0,NBAND-1);
  bandTreesL[bi].push(t);
}
const counts={ trees:0, articulatedNear:0, midTrees:0, farTrees:0,
  understory:0, flowers:0, seedheads:0, ferns:0, shrubs:0, reeds:0, groundContacts:0, rocksLogs:0 };
const RES={ realized:0, disposed:0, peak:0 };
let corridorRejects=0;
const COPY_BANDS=XFORMS.map(()=>Array.from({length:NBAND},(_,i)=>({i,s0:i*BAND,s1:Math.min(L_ISL,(i+1)*BAND),live:null})));

function realizeBand(copy,bi){
  const b=COPY_BANDS[copy][bi];
  if(b.live) return;
  const T=XFORMS[copy];
  const nearB=Buf(), midB=Buf(), uB=UBuf();
  const local={trees:0,articulatedNear:0,midTrees:0,farTrees:0,understory:0,flowers:0,
    seedheads:0,ferns:0,shrubs:0,reeds:0,groundContacts:0,rocksLogs:0,corridorRejects:0};
  const ordered=bandTreesL[bi].slice().sort((a,b)=>a.d-b.d||a.x-b.x||a.z-b.z);
  let nNear=0,nMid=0,nAll=0,nRound=0;
  for(const t of ordered){
    if(nAll>=QCFG.bandTreeCap) break;
    nAll++;
    let tier=(t.d<=QCFG.nearD)?2:((t.d<=QCFG.midD)?1:0);
    // the caps bound spend, but never below the rider's nose: a tier-1 trunk
    // at the verge is a slab with a sparse crown, and the rule is written —
    // anything passed within ~10 m stays articulated
    if(tier===2&&nNear>=QCFG.capNear&&t.d>12) tier=1;
    if(tier===1&&nMid>=QCFG.capMid) tier=0;
    const overhang=(t.d<EXCL+10)?(t.roadY+9.0):undefined;
    if(tier===2){ buildTree(nearB,t,2,overhang,true); local.articulatedNear++; nNear++; }
    else if(tier===1){
      const round=(nRound<QCFG.roundMid&&t.d<=64);
      if(round) nRound++;
      buildTree(midB,t,1,overhang,round); local.midTrees++; nMid++;
    }
    else { buildTree(midB,t,0,undefined,false); local.farTrees++; }
    local.trees++;
    const st=subStream('base',Math.round(t.x*10),Math.round(t.z*10));
    const dark=mixc(PAL.woodDeep,PAL.bark,0.30).lerp(col(PAL.leafShade),0.18);
    addPatch(uB,t.x,seatOnGroundL(t.x,t.z,0)+0.03,t.z,1.1*t.scl+st.r(0,0.7),dark);
    local.groundContacts++;
    if(tier>=1){
      const nr=Math.round(st.i(2,4)*QCFG.under);
      for(let i=0;i<nr;i++){
        const a=st.r(0,TAU), rr=st.r(0.7,2.4)*t.scl;
        const x=t.x+Math.cos(a)*rr, z=t.z+Math.sin(a)*rr;
        uB.can=clamp(t.enc,0,1);
        addTuft(uB,x,groundL(x,z),z,st,mixc(PAL.woodDeep,PAL.leafShade,0.5),mixc(PAL.leafShade,PAL.meadow,0.4),st.r(0.34,0.64),3);
        local.understory++;
      }
    }
  }
  // ---- growth, keyed to what the ground is actually doing here ----
  {
    const N=Math.round(QCFG.tuftBand*BAND/10*QCFG.under);
    const st=subStream('under',bi);
    for(let i=0;i<N;i++){
      const s=st.r(b.s0,b.s1);
      const fr=getFrame(LFRAME,clamp(s,0,LFRAME.len-1));
      const roll=st.f();
      const lat=(st.chance(0.5)?1:-1)*(roll<0.66?st.r(RH+0.55,RH+9):st.r(RH+9,26));
      const x=fr.x+fr.lx*lat+st.r(-3,3), z=fr.z+fr.lz*lat+st.r(-3,3);
      const ri=routeInfoL(x,z);
      if(ri.d<EXCL){ local.corridorRejects++; continue; }
      const pin=pondNorm(x,z);
      if(pin<0.92) continue;
      const y=groundL(x,z);
      const enc=enclosureAt(ri.s)*clamp(1.3-ri.d/80,0,1);
      const moist=moistL(x,z);
      const slope=Math.abs(groundL(x+2.5,z)-groundL(x-2.5,z))/5+Math.abs(groundL(x,z+2.5)-groundL(x,z-2.5))/5;
      const pa=panelAt(x,z,ri);
      const bank=(pin<1.22)?1:0;
      if(pa&&pa.P.mown&&pa.w>0.35){
        // the cut field: stubble-short tufts only, and the standing margin
        if(pa.w<0.62&&st.chance(0.5)){
          addSeedhead(uB,x,y,z,st,mixc(PAL.meadow,PAL.road,0.34),mixc(PAL.road,0xFFE79A,0.35),st.r(0.62,1.05));
          local.seedheads++;
        } else if(st.chance(0.18)){
          uB.can=0;
          addTuft(uB,x,y,z,st,C_HAY.clone().lerp(col(PAL.bark),0.18),C_HAY.clone().lerp(col(0xFFF3CE),0.2),st.r(0.10,0.18),st.i(3,4));
          local.understory++;
        }
        continue;
      }
      const patch=fbmE(x/64+3.7,z/64+21.1);
      const openField=(ri.d>10&&enc<0.35&&moist<0.3);
      if(!bank&&patch<(openField?0.56:0.50)-moist*0.16-enc*0.14) continue;
      const mask=fbmE(x/19+7,z/19+13);
      if(!bank&&mask<(openField?0.40:0.34)-slope*0.5-moist*0.12-(patch-0.50)*0.8) continue;
      if(bank&&st.chance(0.45)) continue;
      { let underTree=false;
        for(const tt of bandTreesL[bi]){
          const ddx=x-tt.x, ddz=z-tt.z, rr2=(1.05*tt.scl+0.5);
          if(ddx*ddx+ddz*ddz<rr2*rr2){ underTree=true; break; }
        }
        if(underTree) continue; }
      uB.can=clamp(enc,0,1);
      const gc=groundColorL(x,z,slope,enc,moist,y-ri.y,ri).clone();
      const r2=st.f();
      if(bank&&st.chance(0.26)){
        const r=st.r(0.10,0.26);
        addBlob(uB,x,y+r*0.4,z,st,r,r*0.6,r*st.r(0.7,1.3),
          mixc(PAL.road,PAL.bark,0.42),mixc(PAL.bark,PAL.woodDeep,0.5),0);
        addPatch(uB,x,y,z,r*st.r(1.8,3.2),mixc(PAL.bark,PAL.woodDeep,0.42));
        local.rocksLogs++;
      } else if(pin<1.75&&pin>=0.92){
        addFern(uB,x,y,z,st,mixc(PAL.leafShade,PAL.meadow,0.35),mixc(PAL.sunGrass,PAL.meadow,0.5),st.r(0.70,1.30));
        local.reeds++;
      } else if(moist>0.5){
        addFern(uB,x,y,z,st,mixc(PAL.woodDeep,PAL.leafShade,0.45),mixc(PAL.leafShade,PAL.meadow,0.45),st.r(0.52,1.00));
        local.ferns++;
      } else if(enc>0.44){
        if(r2<0.62){ addFern(uB,x,y,z,st,mixc(PAL.woodDeep,PAL.leafShade,0.4),mixc(PAL.leafShade,PAL.meadow,0.35),st.r(0.46,0.92)); local.ferns++; }
        else if(r2<0.86){ addTuft(uB,x,y,z,st,gc.clone().lerp(col(PAL.leafShade),0.34),gc.clone().lerp(col(PAL.meadow),0.34),st.r(0.28,0.58),st.i(4,6)); local.understory++; }
        else { addBlob(uB,x,y+0.18,z,st,st.r(0.42,0.78),st.r(0.30,0.52),st.r(0.42,0.78),mixc(PAL.meadow,PAL.leafShade,0.30),mixc(PAL.leafShade,PAL.woodDeep,0.26),0.18); local.shrubs++; }
      } else if(enc<0.30&&slope<0.30&&moist<0.28&&r2<(ri.d>10?0.16:0.30)){
        // seedheads are a dry-field form: none stand in the combe's damp ground
        // seedheads in twos and threes: a lone stalk in open field is a post
        const nSt=st.i(2,3);
        for(let q=0;q<nSt;q++)
          addSeedhead(uB,x+st.r(-0.9,0.9),y,z+st.r(-0.9,0.9),st,mixc(PAL.meadow,PAL.road,0.34),mixc(PAL.road,0xFFE79A,0.35),st.r(0.55,0.95));
        local.seedheads+=nSt;
      } else if(enc<0.34&&r2<(ri.d>10?0.16:0.24)){
        addFlower(uB,x,y,z,st,mixc(PAL.meadow,PAL.sunGrass,0.5),
          st.pick([mixc(PAL.blossom,PAL.meadow,0.30),mixc(PAL.blossom,0xfff3e6,0.35),mixc(PAL.road,PAL.sunGrass,0.40),mixc(PAL.road,0xFFDE79,0.35)]),st.r(0.28,0.50));
        local.flowers++;
      } else {
        addTuft(uB,x,y,z,st,gc.clone().lerp(col(PAL.leafShade),0.30),gc.clone().lerp(col(PAL.sunGrass),0.34),
          st.r(0.30,ri.d>10?0.48:0.62),st.i(4,6));
        local.understory++;
      }
    }
  }
  // ---- the verge proper ----
  {
    const st=subStream('verge',bi);
    const N=Math.round((b.s1-b.s0)/1.55*QCFG.under);
    for(let i=0;i<N;i++){
      const s=st.r(b.s0,b.s1);
      const fr=getFrame(LFRAME,clamp(s,0,LFRAME.len-1));
      const side=st.chance(0.5)?1:-1;
      const off=st.r(0,1)**0.62;
      const lat=side*(RH+0.34+off*4.6);
      const x=fr.x+fr.lx*lat, z=fr.z+fr.lz*lat;
      const ri=routeInfoL(x,z);
      if(ri.d<EXCL){ local.corridorRejects++; continue; }
      if(pondNorm(x,z)<0.95) continue;
      const y=groundL(x,z);
      const enc=enclosureAt(ri.s);
      const wear=clamp(1-off*1.6,0,1);
      uB.can=clamp(enc,0,1);
      const r2=st.f();
      const worn=mixc(PAL.meadow,PAL.bark,0.30).lerp(col(PAL.sunGrass),0.20);
      const lush=mixc(PAL.meadow,PAL.leafShade,0.20).lerp(col(PAL.sunGrass),0.26);
      if(wear>0.55&&r2<0.30){
        const r=st.r(0.07,0.20);
        addBlob(uB,x,y+r*0.4,z,st,r,r*0.62,r*st.r(0.7,1.3),
          mixc(PAL.road,PAL.bark,0.34),mixc(PAL.bark,PAL.woodDeep,0.42),0);
        local.rocksLogs++;
      } else if(r2<0.20+wear*0.34){
        addTuft(uB,x,y,z,st,worn.clone().lerp(col(PAL.woodDeep),0.38),worn.clone().lerp(col(PAL.leafShade),0.22),
          st.r(0.14,0.26)+(1-wear)*st.r(0.12,0.34),st.i(4,6));
        local.understory++;
      } else if(enc<0.40&&r2>0.86){
        addSeedhead(uB,x,y,z,st,mixc(PAL.meadow,PAL.road,0.30),mixc(PAL.road,0xFFE79A,0.30),
          st.r(0.52,1.00)*(0.5+0.5*(1-wear)));
        local.seedheads++;
      } else if(enc<0.42&&r2>0.74){
        addFlower(uB,x,y,z,st,mixc(PAL.meadow,PAL.sunGrass,0.46),
          st.pick([mixc(PAL.blossom,PAL.meadow,0.28),mixc(PAL.blossom,0xfff3e6,0.34),
                   mixc(PAL.road,0xFFDE79,0.32),mixc(PAL.sunGrass,0xffffff,0.42)]),st.r(0.24,0.44));
        local.flowers++;
      } else {
        addTuft(uB,x,y,z,st,lush.clone().lerp(col(PAL.woodDeep),0.30+enc*0.24),
          lush.clone().lerp(col(PAL.leafShade),0.34),st.r(0.28,0.62)*(0.55+0.45*(1-wear)),st.i(4,6));
        local.understory++;
      }
    }
  }
  transformBuf(nearB,T); transformBuf(midB,T); transformUBuf(uB,T);
  const live={meshes:[],local};
  if(nearB.p.length){ const m=new THREE.Mesh(bufGeo(nearB),treeMatNear);
    m.castShadow=(QCFG.shadow>0); m.matrixAutoUpdate=false; m.name='band-near-'+copy+'-'+bi;
    scene.add(m); live.meshes.push(m); bookMesh(m,true,copy); }
  if(midB.p.length){ const m=new THREE.Mesh(bufGeo(midB),treeMatMid);
    m.castShadow=(QCFG.shadow>0); m.matrixAutoUpdate=false; m.name='band-mid-'+copy+'-'+bi;
    scene.add(m); live.meshes.push(m); bookMesh(m,true,copy); }
  if(uB.p.length){ const m=new THREE.Mesh(uGeo(uB),underMat);
    m.matrixAutoUpdate=false; m.receiveShadow=(QCFG.shadow>0); m.name='band-under-'+copy+'-'+bi;
    scene.add(m); live.meshes.push(m); bookMesh(m,true,copy); }
  b.live=live;
  for(const k of Object.keys(local)) if(counts[k]!==undefined) counts[k]+=local[k];
  corridorRejects+=local.corridorRejects;
  RES.realized++;
}
function disposeBand(copy,bi){
  const b=COPY_BANDS[copy][bi];
  if(!b.live) return;
  for(const m of b.live.meshes){ scene.remove(m); m.geometry.dispose();
    const ix=ISLAND_MESHES.indexOf(m); if(ix>=0) ISLAND_MESHES.splice(ix,1); }
  for(const k of Object.keys(b.live.local)) if(counts[k]!==undefined) counts[k]-=b.live.local[k];
  b.live=null;
  RES.disposed++;
}
let residentBands=0;
function updateResidency(g,budget){
  let made=0, live=0;
  for(let c=0;c<XFORMS.length;c++){
    const seg=ISLAND_SEGS[c];
    const sLoc=g-seg.g0;
    const lo=sLoc-QCFG.behind, hi=sLoc+QCFG.ahead;
    for(let i=0;i<NBAND;i++){
      const b=COPY_BANDS[c][i];
      const want=(b.s1>lo&&b.s0<hi);
      if(want&&!b.live){ if(made<budget){ realizeBand(c,i); made++; } }
      else if(!want&&b.live) disposeBand(c,i);
      if(b.live) live++;
    }
  }
  residentBands=live;
  RES.peak=Math.max(RES.peak,live);
  return made;
}
function plannedResidentBands(g){
  let n=0;
  for(let c=0;c<XFORMS.length;c++){
    const seg=ISLAND_SEGS[c];
    const sLoc=g-seg.g0;
    for(let i=0;i<NBAND;i++){
      const b=COPY_BANDS[c][i];
      if(b.s1>sLoc-QCFG.behind&&b.s0<sLoc+QCFG.ahead) n++;
    }
  }
  return n;
}
function disposeAllBands(){ for(let c=0;c<XFORMS.length;c++) for(let i=0;i<NBAND;i++) disposeBand(c,i); }

// ============================================================
// HOST SKY FURNITURE — clouds and a far country, so the island is seen
// in a world rather than on a stage. Host-owned: none of it counts
// against the island's budget.
// ============================================================
const worldC={x:CF.cx,z:CF.cz};
const cloudMeshes=[];
{
  const cloudMat=new THREE.MeshLambertMaterial({vertexColors:true,fog:false,side:THREE.DoubleSide,
    emissive:mixc(PAL.cloud,0xFFFFFF,0.3),emissiveIntensity:0.52});
  // a cloud is welded from its lobes: any triangle whose centroid lies inside
  // a sibling lobe is never emitted, so overlapping surfaces cannot z-fight
  function weldedPuff(B,lobes,st,cTop,cBot){
    const D=ICOD[1];
    for(let li=0;li<lobes.length;li++){
      const L=lobes[li];
      const p1=st.r(0,TAU);
      const nrm=(i)=>{
        const x=D.p.getX(i), y=D.p.getY(i), z=D.p.getZ(i);
        const yy=y<0?y*0.72:y;
        let nx=x/L.rx, ny=yy/L.ry, nz=z/L.rz;
        const nl=Math.hypot(nx,ny,nz)||1;
        return [nx/nl,ny/nl,nz/nl];
      };
      const vert=(i)=>{
        const x=D.p.getX(i), y=D.p.getY(i), z=D.p.getZ(i);
        const j=1+0.07*Math.sin(Math.atan2(z,x)*2+y*2.0+p1);
        const yy=y<0?y*0.72:y;
        return [L.x+x*L.rx*j, L.y+yy*L.ry*j, L.z+z*L.rz*j, y];
      };
      for(let i=0;i<D.idx.length;i+=3){
        const a=vert(D.idx[i]), b=vert(D.idx[i+1]), c=vert(D.idx[i+2]);
        const mx=(a[0]+b[0]+c[0])/3, my=(a[1]+b[1]+c[1])/3, mz=(a[2]+b[2]+c[2])/3;
        let buried=false;
        for(let lj=0;lj<lobes.length&&!buried;lj++){
          if(lj===li) continue;
          const O=lobes[lj];
          const ex=(mx-O.x)/O.rx, ey=(my-O.y)/O.ry, ez=(mz-O.z)/O.rz;
          if(ex*ex+ey*ey+ez*ez<0.72) buried=true;
        }
        if(buried) continue;
        const ym=(a[3]+b[3]+c[3])/3;
        const cc=cBot.clone().lerp(cTop,clamp(0.48+0.55*ym,0,1));
        pushTri(B,[a[0],a[1],a[2]],[b[0],b[1],b[2]],[c[0],c[1],c[2]],cc,
          nrm(D.idx[i]),nrm(D.idx[i+1]),nrm(D.idx[i+2]));
      }
    }
  }
  for(const bandCfg of [{n:6,rr:[950,1700],h:[330,400],span:[300,470],speed:0.46},
                        {n:6,rr:[1700,3100],h:[430,530],span:[210,340],speed:0.24}]){
    const B=Buf(); B.sway=0;
    for(let i=0;i<bandCfg.n;i++){
      const st=subStream('cloud',bandCfg.n,i);
      const a=CLOUD.r(0,TAU), rr=CLOUD.r(bandCfg.rr[0],bandCfg.rr[1]);
      const cx=worldC.x+Math.sin(a)*rr, cz=worldC.z+Math.cos(a)*rr;
      const baseY=CLOUD.r(bandCfg.h[0],bandCfg.h[1]);
      const span=CLOUD.r(bandCfg.span[0],bandCfg.span[1]);
      const rot=CLOUD.r(0,TAU), dx=Math.sin(rot), dz=Math.cos(rot);
      const nL=CLOUD.i(6,9);
      const lobes=[];
      for(let k=0;k<nL;k++){
        const t=(k+0.5)/nL-0.5;
        const r=span*CLOUD.r(0.24,0.32)*(1-0.22*Math.abs(t)*2);
        const up=CLOUD.chance(0.4)?CLOUD.r(0.14,0.4):CLOUD.r(0,0.10);
        lobes.push({x:cx+dx*t*span*0.78+CLOUD.r(-10,10),y:baseY+up*span*0.2,z:cz+dz*t*span*0.78+CLOUD.r(-10,10),
          rx:r*CLOUD.r(0.95,1.15),ry:r*CLOUD.r(0.62,0.8),rz:r*CLOUD.r(0.95,1.15)});
      }
      weldedPuff(B,lobes,st,col(0xFFFFFF),mixc(PAL.cloud,PAL.sky,0.16));
    }
    const m=new THREE.Mesh(bufGeo(B),cloudMat);

let moteBoost=0;
function updateLife(dt,wT){
  WL.uGlint.value.set(0,0,0,0);
  moteBoost=Math.max(0,moteBoost-dt*0.8);
  for(let i=liveLife.length-1;i>=0;i--){
    const L=liveLife[i];
    L.t+=dt;
    const fade=clamp(Math.min(L.t/1.2,(L.dur-L.t)/1.6),0,1);
    if(L.glint){
      const s=Math.sin(clamp(L.t/L.dur,0,1)*Math.PI);
      WL.uGlint.value.set(L.glint.x,L.glint.z,L.glint.r,s*0.85);
    }
    if(L.kind){
      const im=POOLS[L.kind].im;
      for(let k=0;k<L.idx.length;k++){
        const p=L.parts[k], slot=L.idx[k];
        let sc=p.sc*fade;
        if(L.kind==='bird'){
          p.x+=p.vx*dt; p.z+=p.vz*dt;
          if(p.rise){ p.y+=p.vy*dt; p.vy=Math.max(0.6,p.vy-dt*0.35); }
          else p.y+=Math.sin(wT*1.6+p.ph)*p.bob*dt;
          _le.set(0,Math.atan2(p.vx,p.vz),Math.sin(wT*7+p.ph)*0.32);
          _lq.setFromEuler(_le); _lv.set(p.x,p.y,p.z); _ls.set(sc,sc,sc);
        } else if(L.kind==='flit'){
          const t=wT*p.sp+p.ph;
          const x=p.ax+Math.sin(t)*p.span, z=p.az+Math.cos(t*0.77)*p.span;
          const y=p.ay+Math.sin(t*(p.water?2.6:1.7))*(p.water?0.22:0.55);
          _le.set(Math.sin(wT*(p.water?26:13)+p.ph)*(p.water?0.25:0.95),Math.atan2(Math.cos(t),-Math.sin(t*0.77)),0);
          _lq.setFromEuler(_le); _lv.set(x,y,z); _ls.set(sc,sc,sc);
        } else {
          p.x+=p.vx*dt; p.z+=p.vz*dt;
          const gy=groundW(p.x,p.z);
          const hop=p.hop?Math.abs(Math.sin(wT*p.hop+p.ph))*0.22:0;
          sc=p.sc*clamp(Math.min(L.t/0.6,(p.fade-L.t)/1.1),0,1);
          _le.set(0,Math.atan2(p.vx,p.vz),0);
          _lq.setFromEuler(_le); _lv.set(p.x,gy+hop,p.z); _ls.set(sc,sc,sc);
        }
        if(sc<=0.0005) _lm.makeScale(0,0,0); else _lm.compose(_lv,_lq,_ls);
        im.setMatrixAt(slot,_lm);
      }
      im.instanceMatrix.needsUpdate=true;
    }
    if(L.t>=L.dur){ releaseLife(L); liveLife.splice(i,1); }
  }
}

function particleField(n,box,tint,size,opacity,kind){
  const N=Math.max(1,Math.round(n*QCFG.part));
  const base=new Float32Array(N*3), seed=new Float32Array(N);
  const st=subStream('particles',kind);
  for(let i=0;i<N;i++){
    base[i*3]=st.r(0,box.x); base[i*3+1]=st.r(0,box.y); base[i*3+2]=st.r(0,box.z);
    seed[i]=st.r(0,1);
  }

  g.setAttribute('position',new THREE.BufferAttribute(base,3));
  g.setAttribute('aSeed',new THREE.BufferAttribute(seed,1));
  const m=new THREE.ShaderMaterial({
    transparent:true, depthWrite:false,
    uniforms:{ uWTime:WL.uWTime, uCam:{value:new THREE.Vector3()}, uGround:{value:0},
      uBox:{value:new THREE.Vector3(box.x,box.y,box.z)}, uTint:{value:new THREE.Color(tint)},
      uSize:{value:size}, uOp:{value:opacity}, uBoost:{value:1}, uWind:{value:WL.uCloudMove.value} },
    vertexShader:`attribute float aSeed; uniform float uWTime; uniform vec3 uCam; uniform vec3 uBox;
      uniform float uGround; uniform float uSize; uniform vec2 uWind; varying float vA;
      void main(){
        vec3 p=position;
        float t=uWTime;
        ${kind===0?`p.x+=uWind.x*t*0.55+sin(t*0.35+aSeed*31.0)*2.4; p.z+=uWind.y*t*0.55+cos(t*0.29+aSeed*17.0)*2.4;
                    p.y+=sin(t*0.42+aSeed*44.0)*0.9+t*0.06;`:''}
        ${kind===1?`p.x+=uWind.x*t*1.35+sin(t*0.62+aSeed*23.0)*3.2; p.z+=uWind.y*t*1.35+cos(t*0.51+aSeed*13.0)*3.2;
                    p.y-=mod(t*0.62+aSeed*40.0,uBox.y);`:''}
        ${kind===2?`p.x+=uWind.x*t*0.9+sin(t*0.22+aSeed*29.0)*5.0; p.z+=uWind.y*t*0.9+cos(t*0.19+aSeed*37.0)*5.0;
                    p.y+=mod(t*0.30+aSeed*33.0,uBox.y)*0.6;`:''}
        vec3 anchor=vec3(uCam.x,uGround,uCam.z);
        vec3 w=mod(p-anchor+uBox*0.5,uBox)-uBox*0.5+anchor;
        w.y=anchor.y+mod(p.y,uBox.y);
        float d=distance(w,uCam);
        vA=(1.0-smoothstep(48.0,110.0,d))*smoothstep(1.6,6.0,d);

  });

  pts.frustumCulled=false;
  scene.add(pts);

  partSystems.push({m,kind,n:N});

}

function seenByRider(eye,x,y,z,r,tol){

  const D=Math.hypot(x-eye.x,z-eye.z);

      liveLifeEvents:liveLife.length },
    ambientRoster:AMBIENT_ROSTER,
    water:{ pondAtM:Math.round(POND.g), apertureAtM:Math.round(POND.apertureG),
      surfaceY:Math.round(POND.y*100)/100, dropBelowLaneM:Math.round((getFrame(LFRAME,POND.g).y-POND.y)*100)/100,
      edgeCorridorM:Math.round(VAL.pondEdgeCorridorM*10)/10,
      seenThisRun:RUN.seen.water, firstSeenAtM:RUN.seen.waterFirstSeenAtM,
      framesSeen:RUN.seen.waterFramesSeen },
    landmarks:{ knollAtM:Math.round(KNOLL.g), sistersSeenThisRun:RUN.seen.sisters,
      sistersFirstSeenAtM:RUN.seen.sistersFirstSeenAtM, sistersSeenSpanM:RUN.seen.sistersSeenSpanM },
    panels:PANELS.map(P=>({s0:Math.round(P.s0),s1:Math.round(P.s1),side:P.side,mown:P.mown})),
    life:{ planned:LIFE_EVENTS.length, fired:lifeFired, active:liveLife.length,
      kinds:LIFE_EVENTS.reduce((a,e)=>{a[e.kind]=(a[e.kind]||0)+1;return a;},{}) },
    render:{ dpr:renderer.getPixelRatio(), dprCap:DPR_CAP,
      viewport:[renderer.domElement.width,renderer.domElement.height],
      quality:QUALITY,
      drawCalls:lastInfo.calls, triangles:lastInfo.tris,
      islandDrawCalls:lastIsland.calls, islandTriangles:lastIsland.tris,
      peakIslandDrawCalls:RUN.peakIslandDrawCalls, peakIslandTriangles:RUN.peakIslandTriangles,
      peakDrawCalls:RUN.peakDrawCalls, peakTriangles:RUN.peakTriangles,
      renderer:glR, vendor:glV, contextLost,
      softwareRenderer:soft,
      softwareNote:soft?'software rasteriser: timings are honest measurements of it, not hardware evidence':null,
      steady, stallSamples:frameTimes.filter(v=>v>STALL_MS).length, stallThresholdMs:STALL_MS },
    run:{ provenance:RUN.provenance,
      continuousRideEligible:(RUN.provenance==='continuous'||RUN.provenance==='accelerated'),
      distanceRiddenM:Math.round(RUN.distanceRiddenM),
      marks:Object.assign({},RUN.marks),
      seen:Object.assign({},RUN.seen),
      pauseExercised:RUN.pauseExercised,
      ambientProvenWhilePaused:RUN.ambientProvenWhilePaused,
      completedRide:RUN.marks.rested&&RUN.marks.exited&&
        (RUN.provenance==='continuous'||RUN.provenance==='accelerated') },
    lifetime:Object.assign({},LIFETIME),
    assertions:{
      deterministicSeed:xmur3(ISLAND_ID+'::'+SEED_TEXT)()===SEED_HASH,
      planBeforeQuality:QUALITY_READS_AT_PLAN===0,
      // the machine-checkable face of "no absolute world coordinates": the
      // entire plan was frozen before the placement was ever read, and every
      // realized position is derived from plan-local data through one rigid
      // transform. Verified across placements by plan-hash equality.
      planBeforePlacement:PLACEMENT_READS_AT_PLAN===0,
      roadContinuity:VAL.roadContinuity,
      roadContrastPass:VAL.roadContrastRatio>=3.0,
      roadEdgeSupported:VAL.roadUnsupportedSamples===0,
      entryGradeWithin2Pct:VAL.boundaryContract.entryGradeWithin2Pct,
      exitGradeWithin2Pct:VAL.boundaryContract.exitGradeWithin2Pct,
      headingWithin90Deg:VAL.boundaryContract.headingWithin90,
      netElevationWithin40M:VAL.boundaryContract.netElevationWithin40,
      gradeCapKept:VAL.boundaryContract.gradeCapKept,
      lengthWithinIslandBand:VAL.boundaryContract.lengthInBand,
      exclusionCorridorClear:VAL.exclusionViolations===0,
      vocabularySubsetOfAllowlist:vocabSubset,
      residencyIdentityStable:IDENTITY_PROBE.stable,
      ambientContinuesWhilePaused:(!RUN.pauseExercised)||RUN.ambientProvenWhilePaused,
      boundedResidency:RES.peak<=(Math.ceil((QCFG.ahead+QCFG.behind)/BAND)+2)*XFORMS.length,
      islandBudget:(RUN.peakIslandDrawCalls===0)||(RUN.peakIslandDrawCalls<=45&&RUN.peakIslandTriangles<=120000),
      noRuntimeErrors:capturedErrors.length===0&&!contextLost,
    },
    exclusion:{ violations:VAL.exclusionViolations, minTreeCorridorM:Math.round(VAL.minTreeCorridorM*100)/100,
      pondEdgeCorridorM:Math.round(VAL.pondEdgeCorridorM*100)/100,
      corridorRejectedPlacements:corridorRejects },
    errors:capturedErrors.slice(0,8),
  };
}
Object.defineProperty(window,'__SUMMERGLASS_PROOF__',{get:buildProof});
window.__SUMMERGLASS_PLAN__=Object.assign({},PLAN_SUMMARY,{planHash:PLAN_HASH,quality:QUALITY});

// ---------- test surface (an aid to verification, not evidence of motion) ----------
window.__SUMMERGLASS_TEST__={
  fixedStep(dt){ fixedStep=dt||0; if(fixedStep>0) markProvenance(fixedStep>FIXED_STEP_MAX?'debug':'accelerated'); return fixedStep; },
  setSpeed(v){ rider.vT=clamp(v,4,18); },
  steer(v){ rider.latT=clamp(v,-2.6,2.6); },
  pause(v){ rider.paused=(v===undefined)?!rider.paused:!!v; return rider.paused; },
  restart(){ restartRide(); },
  warp(g){
    markProvenance('warped');
    rider.g=clamp(g,0,ROUTE_LEN-14);
    rider.started=true; rider.ended=false; rider.v=CRUISE;
    const isl=islandLocalOf(rider.g);
    for(let e=0;e<LIFE_EVENTS.length;e++) for(let c=0;c<XFORMS.length;c++){
      const seg=ISLAND_SEGS[c];
      if(rider.g-seg.g0>LIFE_EVENTS[e].s-40) eventFired[e][c]=true;
    }
    warmResidency(rider.g);
    return rider.g;
  },
  state(){ const isl=islandLocalOf(rider.g);
    return {g:rider.g,v:rider.v,paused:rider.paused,ended:rider.ended,
      islandS:isl?Math.round(isl.s*10)/10:null,copy:isl?isl.copy:null,
      movement:isl?movementOf(isl.s):'(connective)',routeLen:Math.round(ROUTE_LEN),
      entryAtG:Math.round(ISLAND_SEGS[0].g0),exitAtG:Math.round(ISLAND_SEGS[ISLAND_SEGS.length-1].g1)}; },
  identityProbe:IDENTITY_PROBE,
  lifePlan(){ return LIFE_EVENTS.map(e=>({s:Math.round(e.s),kind:e.kind})); },
  budgetIsland(){ camera.updateMatrixWorld(); refreshFrustum(camera);
    const isl=islandLocalOf(rider.g);
    return countIsland(isl?isl.copy:0); },
  // The honest budget number: a deterministic sweep, not a sample. Fixed
  // stations every `step` metres along the whole route, the rider's camera
  // posed analytically at each (same eye, lat, pitch law as the ride), full
  // residency settled synchronously before each count, maximum reported.
  // A visible-triangle count is camera-dependent; only a stated sweep like
  // this one is comparable against a fixed ceiling.
  budgetSweep(step){
    const st=step||24;
    const out={maxTris:0, maxCalls:0, atG:0, stations:0, stepM:st, from:40, to:Math.floor(ROUTE_LEN-20)};
    const saveG=rider.g;
    for(let g=40; g<ROUTE_LEN-20; g+=st){
      let guard=0;
      while(updateResidency(g,4)>0&&guard++<60){}
      const fr=frameAtG(g);
      camera.position.set(fr.x+fr.lx*0.9, fr.y+EYE_H, fr.z+fr.lz*0.9);
      const la=frameAtG(Math.min(g+30,ROUTE_LEN-1));
      const pitch=clamp(Math.atan2(la.y-fr.y,30)*0.42+PITCH_BIAS,-0.55,0.5);
      const yaw=Math.atan2(-fr.tx,-fr.tz);
      camera.quaternion.setFromEuler(new THREE.Euler(pitch,yaw,0,'YXZ'));
      camera.updateMatrixWorld();
      refreshFrustum(camera);
      const isl=islandLocalOf(g);
      const c=countIsland(isl?isl.copy:0);
      out.stations++;
      if(c.tris>out.maxTris){ out.maxTris=c.tris; out.atG=Math.round(g); }
      out.maxCalls=Math.max(out.maxCalls,c.calls);
    }
    let guard=0;
    while(updateResidency(saveG,4)>0&&guard++<60){}
    return out;
  },
  groundingProbe(){
    let worst=null, floating=0, maxAbove=-1e9, sampled=0;
    for(const t of TREES){
      if(t.unseatable) continue;
      const r=realizedGroundL(t.x,t.z);
      sampled++;
      const above=t.y-r;
      if(above>maxAbove){ maxAbove=above; worst={fam:t.fam,x:Math.round(t.x),z:Math.round(t.z),
        aboveM:Math.round(above*1000)/1000}; }
      if(above>0.05) floating++;
    }
    return {sampled,floating,maxAboveM:Math.round(maxAbove*1000)/1000,worst,
      seated:{lowered:GROUND_STAT.lowered,raised:GROUND_STAT.raised,unseatable:GROUND_STAT.culled}};
  },
  markDebug(){ markProvenance('debug'); return RUN.provenance; },
  knollProbe(){
    const sis=TREES.filter(t=>t.formation==='wind-sisters');
    return {
      knoll:{x:+KNOLL.x.toFixed(1),z:+KNOLL.z.toFixed(1),g:Math.round(KNOLL.g),r:+KNOLL.r.toFixed(1),h:+KNOLL.h.toFixed(1)},
      knollD:+routeInfoL(KNOLL.x,KNOLL.z).d.toFixed(1),
      groundAtKnoll:+groundL(KNOLL.x,KNOLL.z).toFixed(2),
      groundNearby:+groundL(KNOLL.x+60,KNOLL.z+60).toFixed(2),
      roadYatG:+getFrame(LFRAME,clamp(KNOLL.g,0,LFRAME.len-1)).y.toFixed(2),
      sisters:sis.map(t=>({x:+t.x.toFixed(1),z:+t.z.toFixed(1),y:t.y===undefined?null:+t.y.toFixed(2),scl:t.scl,uns:!!t.unseatable,d:+t.d.toFixed(1)})),
    };
  },
  // where the pond actually lands on screen, and the ground profile out to it
  pondProbe(){
    camera.updateMatrixWorld();
    const T=XFORMS[0];
    const w=T.fwd(POND.cx,POND.cz);
    const v=new THREE.Vector3(w[0],T.fwdY(POND.y),w[1]).project(camera);
    const fr=getFrame(LFRAME,POND.g);
    const prof=[];
    for(let u=0;u<=52;u+=2){
      const x=fr.x+fr.lx*u*S_LAND, z=fr.z+fr.lz*u*S_LAND;
      prof.push([u,+groundL(x,z).toFixed(2)]);
    }
    const mesh=WATER_MESHES[0];
    const sweep=[];
    for(let sl=860;sl<=1010;sl+=15){
      const f2=getFrame(LFRAME,sl);
      const T2=XFORMS[0];
      const ew=T2.fwd(f2.x,f2.z);
      const eye={x:ew[0],y:T2.fwdY(f2.y)+EYE_H,z:ew[1]};
      const pw=T2.fwd(POND.cx,POND.cz);
      const py=T2.fwdY(POND.y);
      let blocked=null;
      const dx=pw[0]-eye.x, dy=py-eye.y, dz=pw[1]-eye.z;
      for(let t=0.05;t<0.98;t+=0.02){
        const px=eye.x+dx*t, pz=eye.z+dz*t;
        if(groundW(px,pz)>eye.y+dy*t+0.05){ blocked=+(t).toFixed(2); break; }
      }
      // angle off the travel direction
      const tw=[f2.tx*T2.c+f2.tz*T2.s,-f2.tx*T2.s+f2.tz*T2.c];
      const L=Math.hypot(dx,dz);
      const ang=Math.acos(Math.max(-1,Math.min(1,(dx*tw[0]+dz*tw[1])/L)))*180/Math.PI;
      sweep.push({sl,angDeg:Math.round(ang),distM:Math.round(L),blockedT:blocked});
    }
    return { sLand:S_LAND, pondOffU:+(((POND.cx-fr.x)*fr.lx+(POND.cz-fr.z)*fr.lz)).toFixed(1),
      laneY:+fr.y.toFixed(2), waterY:+POND.y.toFixed(2), meshY:+mesh.geometry.boundingSphere.center.y.toFixed(2),
      ndc:[+v.x.toFixed(2),+v.y.toFixed(2),+v.z.toFixed(3)],
      meshInFrustum:(()=>{ refreshFrustum(camera); return _frustum.intersectsObject(mesh); })(),
      sweep, prof };
  },
};

window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
