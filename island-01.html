<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Summerglass Island 01 — The Orchard Combe</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#5EC2E8; }
  canvas { display:block; }
  #hint {
    position:fixed; left:14px; bottom:12px; user-select:none; pointer-events:none;
    color:#F2E3BC; text-shadow:0 1px 3px rgba(22,52,44,0.6);
    font:14px system-ui, sans-serif; letter-spacing:0.02em; opacity:0.9; z-index:9;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
  }
}

</head>
<body>
<div id="hint">W/S ride &middot; A/D drift &middot; drag to look &middot; Space pause &middot; R restart</div>
<script type="module">
import * as THREE from 'three';
// ============================================================
// SUMMERGLASS ISLAND 01 — THE ORCHARD COMBE
// A bounded, composable segment of road and land: an old worked
// hillside — orchard rows above a spring-cut combe holding a
// stock pond, a mown hay panel opposite, and an aged planted
// boundary row on the climb out. Authored once, in LOCAL
// coordinates, to be placed many times by a host that knows
// nothing about the interior.
//
// Two stages, as in the keeper: the PLAN freezes the island's
// identity from its seed, entirely in the local frame, before
// either the quality tier or the placement is read; the
// REALIZATION spends geometry on it at the chosen quality,
// through whatever rigid transform the host hands down.
// ============================================================

const capturedErrors=[];
window.addEventListener('error',(e)=>{ capturedErrors.push(String(e.message||e)); });
window.addEventListener('unhandledrejection',(e)=>{ capturedErrors.push('rejection: '+String((e.reason&&e.reason.message)||e.reason)); });
// three.js reports shader compile failures through console.error, which is not
// a page error — capture those too, or the proof would miss a broken material
{
  const orig=console.error.bind(console);
  console.error=(...args)=>{ try{
    const s=args.map(a=>String(a)).join(' ');
    if(/shader|program|webgl/i.test(s)) capturedErrors.push('console: '+s.slice(0,180));
  }catch(e){} orig(...args); };
}

// ---------- island identity, quality, placement ----------
const qs=new URLSearchParams(location.search);
const ISLAND_ID='summerglass-island-01';
const SEED_TEXT=(qs.get('iseed')&&qs.get('iseed').length)?qs.get('iseed'):'ISLE-8421';
// the tier and the placement are not read until the plan is frozen; both
// counters record when they first were, and the plan records what it saw
let QUALITY_READS=0, QUALITY_READS_AT_PLAN=-1;
let PLACEMENT_READS=0, PLACEMENT_READS_AT_PLAN=-1;
const QUALITY=(()=>{ const q=(qs.get('quality')||'standard').toLowerCase();
  return (q==='low'||q==='high')?q:'standard'; })();
const readQuality=()=>{ QUALITY_READS++; return QUALITY; };
const PLACEMENT_RAW={
  headingDeg:(()=>{ const v=parseFloat(qs.get('heading')); return isFinite(v)?v:0; })(),
  entryGradePct:(()=>{ const v=parseFloat(qs.get('egrade')); return isFinite(v)?Math.max(-2,Math.min(2,v)):0; })(),
  copies:(qs.get('copies')==='2')?2:1,
};
const readPlacement=()=>{ PLACEMENT_READS++; return PLACEMENT_RAW; };

function xmur3(str){ let h=1779033703^str.length;
  for(let i=0;i<str.length;i++){ h=Math.imul(h^str.charCodeAt(i),3432918353); h=(h<<13)|(h>>>19); }
  return ()=>{ h=Math.imul(h^(h>>>16),2246822507); h=Math.imul(h^(h>>>13),3266489909); return (h^=h>>>16)>>>0; };
}
const SEED_HASH=xmur3(ISLAND_ID+'::'+SEED_TEXT)();
function mb32(a){ return ()=>{ a|=0; a=(a+0x6D2B79F5)|0;
  let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
function streamFrom(f){
  return {
    f, r:(a,b)=>a+(b-a)*f(), i:(a,b)=>Math.floor(a+(b-a+1)*f()),
    chance:(p)=>f()<p, pick:(arr)=>arr[Math.floor(f()*arr.length)],
    gauss:()=>{ let s=0; for(let k=0;k<4;k++) s+=f(); return (s-2)*0.72; },
  };
}
// named, independent streams on the island's own seed channel — a change in
// one can never perturb another
function makeStream(name){ return streamFrom(mb32(xmur3(ISLAND_ID+'::'+SEED_TEXT+'::'+name)())); }
// positional sub-stream: identity depends on (islandId, seed, name, ids) only,
// never on realization order — so an object is the same object every time the
// band re-enters residency, and the same object under every placement
function subStream(name,...ids){ return streamFrom(mb32(xmur3(ISLAND_ID+'::'+SEED_TEXT+'::'+name+'#'+ids.join(','))())); }

const ROUTE=makeStream('plan/route'), ELEV=makeStream('plan/elevation'),
      LANDF=makeStream('plan/landform'), WATER=makeStream('plan/water'),
      GROVE=makeStream('plan/groves'), ECO=makeStream('plan/ecology'),
      FORM=makeStream('plan/formations'), LIFE=makeStream('plan/life'),
      CLOUD=makeStream('host/clouds');

// ---------- hashes ----------
function fnv(){ let h=0x811C9DC5; return {
  feed(...vals){ for(const v of vals){ const s=(typeof v==='number')?(Math.abs(v)<1e-7?'0.0000':v.toFixed(4)):String(v);
    for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,0x01000193); } } },
  hex(){ return (h>>>0).toString(16).padStart(8,'0'); } }; }
const H={ route:fnv(), elev:fnv(), terrain:fnv(), eco:fnv(), life:fnv(), plan:fnv(), real:fnv() };

// ---------- palette: the keeper's eight colours, one summer ----------
const PAL={
  sky:0x5EC2E8, cloud:0xFFFBEF, sunGrass:0xC3E56A, meadow:0x74B851,
  leafShade:0x3C7A55, woodDeep:0x1B4239, bark:0x6B4A34, road:0xE9DCB4,
  blossom:0xEBAFB9,
};
const EYE_H=1.86, PITCH_BIAS=0.052;
const col=(h)=>new THREE.Color(h);
const mixc=(a,b,t)=>col(a).lerp(col(b),t);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,v)=>{ const t=clamp((v-a)/(b-a||1e-6),0,1); return t*t*(3-2*t); };
const TAU=Math.PI*2;
const lumOf=(c)=>0.2126*c.r+0.7152*c.g+0.0722*c.b;

// ---------- frozen value noise (island-local: sampled in LOCAL coordinates
// only, so the land is the same land under every placement) ----------
function noiseTable(stream){ const T=new Float32Array(1024); for(let i=0;i<1024;i++) T[i]=stream.f(); return T; }
function makeNoise2(T){
  const hash=(x,y)=>{ let n=(x*374761393+y*668265263)|0; n=(n^(n>>>13))|0; n=Math.imul(n,1274126177); return T[((n^(n>>>16))>>>0)&1023]; };
  return (x,y)=>{
    const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
    const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
    return lerp(lerp(hash(xi,yi),hash(xi+1,yi),u),lerp(hash(xi,yi+1),hash(xi+1,yi+1),u),v);
  };
}
const nLand=makeNoise2(noiseTable(LANDF)), nEco=makeNoise2(noiseTable(ECO));
function fbmL(x,y){ return nLand(x,y)*0.53+nLand(x*2.07+7.7,y*2.07+3.1)*0.29+nLand(x*4.31+17.9,y*4.31+11.3)*0.18; }
function fbmE(x,y){ return nEco(x,y)*0.62+nEco(x*2.51+5.1,y*2.51+9.7)*0.38; }

// ============================================================
// PLAN — MOVEMENTS
// Five movements over roughly two kilometres: Threshold, The Rows,
// The Spring Combe, The Headland, Handover. Not chapters of a journey —
// one place, read in passing at ten metres a second.
// ============================================================
const CRUISE=10.0;
const L_ISL=ROUTE.r(1900,2060);
const MOV=[
  {key:'threshold', name:'Threshold',        end:0.13},
  {key:'rows',      name:'The Rows',         end:0.38},
  {key:'combe',     name:'The Spring Combe', end:0.59},
  {key:'headland',  name:'The Headland',     end:0.79},
  {key:'handover',  name:'Handover',         end:1.0},
];
for(let i=0;i<MOV.length-1;i++) MOV[i].end=clamp(MOV[i].end+ROUTE.r(-0.012,0.012),(i?MOV[i-1].end:0)+0.06,0.96);
const MOVS={}; for(const m of MOV) MOVS[m.key]=m.end*L_ISL;
const movEnd=(k)=>MOVS[k];
const movStart=(k)=>{ const i=MOV.findIndex(m=>m.key===k); return i?MOV[i-1].end*L_ISL:0; };
function movementOf(s){ const f=clamp(s,0,L_ISL)/L_ISL;
  for(const m of MOV) if(f<=m.end) return m.name; return MOV[MOV.length-1].name; }
H.route.feed(L_ISL); for(const m of MOV) H.route.feed(m.end);

const GRADE_CAP=0.066;
const MIN_RADIUS=158;
const SDS=2;

// ============================================================
// PLAN — CENTRELINE (LOCAL)
// Entry at the local origin, tangent along +Z. Curvature is three broad
// composed bows — out along the rows, back around the pool, out again on
// the climb — plus a small seeded wobble, faded at both ends so the
// boundary tangents are exact.
// ============================================================
const BOWS=[];
{
  // deliberate bows: sign convention measured, budget enforced numerically
  const b=(s0,s1,deg)=>BOWS.push({s0,s1,a:(deg*Math.PI/180)/((s1-s0)*2/Math.PI)});
  const j=(lo,hi)=>ROUTE.r(lo,hi);
  b(j(110,150), j(660,720),  j(30,40));     // out along the rows
  b(j(640,690), j(1250,1310),-j(44,54));    // the bow around the pool
  b(j(1230,1280),j(1780,1840), j(30,40));   // out again along the headland
  for(const w of BOWS) H.route.feed(w.s0,w.s1,w.a);
}
const WOB={ wl:ROUTE.r(300,420), a:1/ROUTE.r(1600,2400), ph:ROUTE.r(0,TAU) };
H.route.feed(WOB.wl,WOB.a,WOB.ph);
// the opening is composed, not sampled: the road bends away inside the first
// two hundred metres so the rider is promised somewhere rather than shown it.
// Its own stream, so it can never perturb what was already planned.
const OPENING=makeStream('plan/opening');
const OPEN_BOW=(OPENING.chance(0.5)?1:-1)/OPENING.r(360,450);
H.route.feed(OPEN_BOW);
function curvatureAt(s){
  let k=0;
  for(const w of BOWS){
    if(s<w.s0||s>w.s1) continue;
    k+=w.a*Math.sin(Math.PI*(s-w.s0)/(w.s1-w.s0));
  }
  k+=OPEN_BOW*Math.sin(Math.PI*clamp((s-16)/225,0,1));
  k+=WOB.a*Math.sin(TAU*s/WOB.wl+WOB.ph)*smooth(40,180,s)*(1-smooth(L_ISL-180,L_ISL-40,s));
  return k;
}

// ============================================================
// PLAN — ELEVATION (LOCAL)
// A rise through the rows, a fall into the combe, the climb over the
// headland, and an easing to the exit. Grades are zero at both ends by
// construction; the keeper's grade cap and vertical easing still apply.
// ============================================================
const ELEV_P={
  rise:ELEV.r(5.4,6.8), fall:ELEV.r(7.2,8.8), climb:ELEV.r(9.6,11.4), ease:ELEV.r(3.8,5.0),
  r1:[ELEV.r(70,100),ELEV.r(520,580)], r2:[ELEV.r(600,650),ELEV.r(990,1040)],
  r3:[ELEV.r(1100,1150),ELEV.r(1460,1510)], r4:[ELEV.r(1540,1590),ELEV.r(1870,1920)],
};
const ROLLERS=[
  {wl:ELEV.r(230,300),a:ELEV.r(0.55,0.95),ph:ELEV.r(0,TAU)},
  {wl:ELEV.r(380,470),a:ELEV.r(0.5,0.9),ph:ELEV.r(0,TAU)},
];
H.elev.feed(ELEV_P.rise,ELEV_P.fall,ELEV_P.climb,ELEV_P.ease);
for(const r of ROLLERS) H.elev.feed(r.wl,r.a,r.ph);
function baseElev(s){
  let y=ELEV_P.rise*smooth(ELEV_P.r1[0],ELEV_P.r1[1],s)
       -ELEV_P.fall*smooth(ELEV_P.r2[0],ELEV_P.r2[1],s)
       +ELEV_P.climb*smooth(ELEV_P.r3[0],ELEV_P.r3[1],s)
       -ELEV_P.ease*smooth(ELEV_P.r4[0],ELEV_P.r4[1],s);
  const fade=smooth(30,170,s)*(1-smooth(L_ISL-170,L_ISL-30,s));
  for(const r of ROLLERS) y+=r.a*Math.sin(TAU*s/r.wl+r.ph)*fade;
  return y;
}
function blurArray(y,passes){
  const n=y.length, t=new Float32Array(n);
  for(let p=0;p<passes;p++){
    t[0]=y[0]; t[n-1]=y[n-1];
    for(let i=1;i<n-1;i++) t[i]=(y[i-1]+y[i]*2+y[i+1])*0.25;
    y.set(t);
  }
}
const EDS=2;
const ELEVATION=(()=>{
  const n=Math.ceil(L_ISL/EDS)+1;
  const y=new Float32Array(n);
  for(let i=0;i<n;i++) y[i]=baseElev(i*EDS);
  for(let i=1;i<n;i++){ const d=y[i]-y[i-1], m=GRADE_CAP*EDS;
    if(d> m) y[i]=y[i-1]+m; else if(d<-m) y[i]=y[i-1]-m; }
  for(let i=n-2;i>=0;i--){ const d=y[i]-y[i+1], m=GRADE_CAP*EDS;
    if(d> m) y[i]=y[i+1]+m; else if(d<-m) y[i]=y[i+1]-m; }
  blurArray(y,44);
  let asc=0,desc=0,maxG=0;
  for(let i=1;i<n;i++){ const d=y[i]-y[i-1];
    if(d>0) asc+=d; else desc-=d;
    maxG=Math.max(maxG,Math.abs(d)/EDS); }
  return {y,asc,desc,maxG,n};
})();
function spineY(s){
  const i=clamp(s/EDS,0,ELEVATION.n-1), i0=Math.floor(i), t=i-i0, i1=Math.min(i0+1,ELEVATION.n-1);
  return lerp(ELEVATION.y[i0],ELEVATION.y[i1],t);
}
H.elev.feed(ELEVATION.asc,ELEVATION.desc,ELEVATION.maxG);

// ---------- the local spine walk: entry at origin, tangent +Z ----------
const NS=Math.ceil(L_ISL/SDS)+1;
const spine={x:new Float32Array(NS),y:new Float32Array(NS),z:new Float32Array(NS),hd:new Float32Array(NS)};
{
  let x=0,z=0,hd=0;
  for(let i=0;i<NS;i++){
    const s=i*SDS;
    spine.x[i]=x; spine.z[i]=z; spine.y[i]=spineY(s); spine.hd[i]=hd;
    const k=curvatureAt(s+SDS*0.5);
    hd+=k*SDS;
    x+=Math.sin(hd)*SDS; z+=Math.cos(hd)*SDS;
    if((i%32)===0) H.route.feed(x,z,spine.y[i]);
  }
}
function spineAt(s){
  const i=clamp(s/SDS,0,NS-1), i0=Math.floor(i), t=i-i0, i1=Math.min(i0+1,NS-1);
  return { x:lerp(spine.x[i0],spine.x[i1],t), y:lerp(spine.y[i0],spine.y[i1],t),
           z:lerp(spine.z[i0],spine.z[i1],t), hd:lerp(spine.hd[i0],spine.hd[i1],t) };
}

// ---------- frame table: 2 m arc-length samples, eight channels, matching
// the keeper exactly: x, y, z, tx, tz, lx, lz, k ----------
function framesFromPoints(pts){
  const RS=2;
  const X=[],Y=[],Z=[];
  let prev=pts[0], acc=0, target=0;
  X.push(prev[0]); Y.push(prev[1]); Z.push(prev[2]);
  for(let i=1;i<pts.length;i++){
    const p=pts[i], d=Math.hypot(p[0]-prev[0],p[2]-prev[2]);
    if(d<1e-7) continue;
    while(target+RS<=acc+d){ target+=RS; const t=(target-acc)/d;
      X.push(lerp(prev[0],p[0],t)); Y.push(lerp(prev[1],p[1],t)); Z.push(lerp(prev[2],p[2],t)); }
    acc+=d; prev=p;
  }
  const F={x:Float32Array.from(X),y:Float32Array.from(Y),z:Float32Array.from(Z),RS};
  F.N=F.x.length-1; F.len=F.N*RS;
  const tmp=new Float32Array(F.N+1);
  const blur=(arr,passes)=>{ for(let p=0;p<passes;p++){
    tmp[0]=arr[0]; tmp[F.N]=arr[F.N];
    for(let i=1;i<F.N;i++) tmp[i]=(arr[i-1]+arr[i]*2+arr[i+1])*0.25;
    arr.set(tmp); } };
  blur(F.x,5); blur(F.z,5); blur(F.y,40);
  F.tx=new Float32Array(F.N+1); F.tz=new Float32Array(F.N+1);
  F.lx=new Float32Array(F.N+1); F.lz=new Float32Array(F.N+1); F.k=new Float32Array(F.N+1);
  for(let i=0;i<=F.N;i++){
    const i0=Math.max(0,i-1), i1=Math.min(F.N,i+1);
    let tx=F.x[i1]-F.x[i0], tz=F.z[i1]-F.z[i0];
    const L=Math.hypot(tx,tz)||1; tx/=L; tz/=L;
    F.tx[i]=tx; F.tz[i]=tz; F.lx[i]=tz; F.lz[i]=-tx;
  }
  for(let i=1;i<F.N;i++){
    const cr=F.tx[i-1]*F.tz[i+1]-F.tz[i-1]*F.tx[i+1];
    F.k[i]=cr/(2*RS);
  }
  return F;
}
function getFrame(F,s){
  s=clamp(s,0,F.len-0.001);
  const i=s/F.RS, i0=Math.floor(i), t=i-i0, i1=Math.min(i0+1,F.N);
  return { x:lerp(F.x[i0],F.x[i1],t), y:lerp(F.y[i0],F.y[i1],t), z:lerp(F.z[i0],F.z[i1],t),
    tx:lerp(F.tx[i0],F.tx[i1],t), tz:lerp(F.tz[i0],F.tz[i1],t),
    lx:lerp(F.lx[i0],F.lx[i1],t), lz:lerp(F.lz[i0],F.lz[i1],t), k:lerp(F.k[i0],F.k[i1],t) };
}
const LFRAME=(()=>{
  const pts=[];
  for(let s=0;s<=L_ISL;s+=SDS){ const p=spineAt(s); pts.push([p.x,p.y,p.z]); }
  return framesFromPoints(pts);
})();
H.route.feed(LFRAME.len);

// declared boundary poses, measured on the built frames rather than assumed
const ENTRY_POSE=(()=>{
  const a=getFrame(LFRAME,0), b=getFrame(LFRAME,6);
  return { x:0,y:0,z:0, headingRad:Math.atan2(a.tx,a.tz), gradePct:(b.y-a.y)/6*100 };
})();
const EXIT_POSE=(()=>{
  const a=getFrame(LFRAME,LFRAME.len-6.01), b=getFrame(LFRAME,LFRAME.len-0.01);
  return { x:b.x,y:b.y,z:b.z, headingRad:Math.atan2(b.tx,b.tz), gradePct:(b.y-a.y)/6*100 };
})();
const HEADING_STAT=(()=>{
  let maxAbs=0;
  for(let i=0;i<=LFRAME.N;i++){
    const h=Math.atan2(LFRAME.tx[i],LFRAME.tz[i]);
    maxAbs=Math.max(maxAbs,Math.abs(h));
  }
  return { netDeg:EXIT_POSE.headingRad*180/Math.PI, maxAbsDeg:maxAbs*180/Math.PI };
})();

const ROAD_W=ROUTE.r(4.62,4.94), RH=ROAD_W/2, SHOULDER=3.0, EXCL=RH+SHOULDER;
const APRON=66;
H.route.feed(ROAD_W,ENTRY_POSE.gradePct,EXIT_POSE.gradePct,HEADING_STAT.netDeg);

// ============================================================
// PLAN — ENCLOSURE
// One pulse at the threshold gate, open air along the rows, the combe
// closing over the road, the headland thinning, and a light handover.
// The road stays legible everywhere: nothing here peaks like Fernfold.
// ============================================================
const ENC=[];
{
  const E=(s0,s1,peak)=>ENC.push({s0,s1,peak});
  E(-60,movEnd('threshold')+ECO.r(-20,30),ECO.r(0.44,0.56));
  E(movStart('rows')+ECO.r(20,60),movEnd('rows')+ECO.r(-30,20),ECO.r(0.22,0.32));
  E(movStart('combe')-ECO.r(10,40),movEnd('combe')+ECO.r(0,40),ECO.r(0.72,0.82));
  E(movStart('headland')+ECO.r(20,70),movEnd('headland')-ECO.r(0,50),ECO.r(0.30,0.40));
  E(movStart('handover')+ECO.r(30,90),L_ISL-ECO.r(60,120),ECO.r(0.16,0.26));
  for(const e of ENC) H.eco.feed(e.s0,e.s1,e.peak);
}
function enclosureAt(s){
  let w=0;
  for(const e of ENC){
    const mid=(e.s0+e.s1)*0.5, half=(e.s1-e.s0)*0.5;
    const t=1-clamp(Math.abs(s-mid)/Math.max(1,half),0,1);
    w=Math.max(w,e.peak*(t*t*(3-2*t)));
  }
  return clamp(w,0,1);
}

// ============================================================
// PLAN — THE WORKED SIDE, THE COMBE, THE POND
// Everything of consequence keeps to one side: the orchard rows, the
// spring combe, the pond it feeds, the knoll at its head, the old
// boundary row on the climb. The other side is hay meadow — one panel
// mown, one grown back. The road threads between the two readings.
// ============================================================
const S_LAND=FORM.chance(0.5)?1:-1;      // the worked side, seed-chosen

// ---------- local route field: distance to the LOCAL frames only ----------
const rCell=24, rGridL=new Map();
const rKey=(a,b)=>a*46341+b;
{
  for(let i=0;i<=LFRAME.N;i++){
    const k=rKey(Math.floor(LFRAME.x[i]/rCell),Math.floor(LFRAME.z[i]/rCell));
    let c=rGridL.get(k); if(!c){ c=[]; rGridL.set(k,c); }
    const ia=Math.max(0,i-1), ib=Math.min(LFRAME.N,i+1);
    const slope=(LFRAME.y[ib]-LFRAME.y[ia])/((ib-ia)*LFRAME.RS||1);
    c.push(LFRAME.x[i],LFRAME.y[i],LFRAME.z[i],i*LFRAME.RS,LFRAME.tx[i],LFRAME.tz[i],slope);
  }
}
const _ril={d:0,y:0,s:0,u:0};
function routeInfoL(x,z){
  const gx=Math.floor(x/rCell), gz=Math.floor(z/rCell);
  let bd=1e18,by=0,bs=0,bu=0;
  for(let R=1;R<=14;R++){
    for(let ax=gx-R;ax<=gx+R;ax++) for(let az=gz-R;az<=gz+R;az++){
      if(R>1&&Math.abs(ax-gx)<R&&Math.abs(az-gz)<R) continue;
      const c=rGridL.get(rKey(ax,az)); if(!c) continue;
      for(let i=0;i<c.length;i+=7){
        const dx=x-c[i], dz=z-c[i+2];
        const t=clamp(dx*c[i+4]+dz*c[i+5],-1,1);
        const ex=dx-c[i+4]*t, ez=dz-c[i+5]*t;
        const d=ex*ex+ez*ez;
        if(d<bd){ bd=d; by=c[i+1]+c[i+6]*t; bs=c[i+3]+t;
          const fr=c; bu=(dx*fr[i+5]-dz*fr[i+4]); }
      }
    }
    if(bd<((R-1)*rCell)*((R-1)*rCell)&&R>1) break;
  }
  if(bd>1e17){ _ril.d=999; _ril.y=0; _ril.s=clamp(z,0,L_ISL); _ril.u=999; return _ril; }
  _ril.d=Math.sqrt(bd); _ril.y=by; _ril.s=bs; _ril.u=bu;
  return _ril;
}

// ---------- the independent landform, written around the local route ----------
function bankMix(s){ return clamp(0.34+0.55*enclosureAt(clamp(s,0,L_ISL)),0.28,0.92); }
function indepLand(x,z){
  return (fbmL(x/430+3.3,z/430+9.1)-0.5)*44
       + (fbmL(x/168+21.7,z/168+5.3)-0.5)*20;
}
const INDEP_REF=(()=>{
  const n=Math.ceil(L_ISL/20)+1, a=new Float32Array(n);
  for(let i=0;i<n;i++){ const p=spineAt(i*20); a[i]=indepLand(p.x,p.z); }
  blurArray(a,26);
  return a;
})();
const indepRefAt=(s)=>{ const i=clamp(s/20,0,INDEP_REF.length-1), i0=Math.floor(i);
  return lerp(INDEP_REF[i0],INDEP_REF[Math.min(i0+1,INDEP_REF.length-1)],i-i0); };

// ---------- the pond: composed, not sampled ----------
// It sits on the worked side, on the outside of the pool bow, far enough
// down that the rider looks DOWN onto water across an open shelf.
const POND=(()=>{
  const g=WATER.r(985,1035);
  const rx=WATER.r(15,19), rz=WATER.r(10.5,13.5);
  const drop=WATER.r(2.9,3.7);
  const off=(rx*1.05+EXCL+WATER.r(6.5,10.5))*S_LAND;
  const fr=getFrame(LFRAME,g);
  const cx=fr.x+fr.lx*off, cz=fr.z+fr.lz*off;
  return { g, cx, cz, rx, rz, rot:WATER.r(-0.4,0.4)+Math.atan2(fr.tx,fr.tz),
           y:fr.y-drop, bed:fr.y-drop-1.9, apertureG:g-WATER.r(16,28), name:'springpond' };
})();
H.terrain.feed(POND.g,POND.cx,POND.cz,POND.rx,POND.rz,POND.y);

// ---------- the spring combe: where water has worked for a long time ----------
// A soft-cut valley running from the knoll at its head, down past the pond,
// and away off the worked side of the island. It never crosses the road; the
// road only feels its moisture and its shade.
const KNOLL=(()=>{
  const g=POND.g+FORM.r(140,190);
  const fr=getFrame(LFRAME,g);
  const off=(FORM.r(150,172))*S_LAND;
  return { x:fr.x+fr.lx*off, z:fr.z+fr.lz*off, g,
           r:FORM.r(85,110), h:FORM.r(20,26) };
})();
const COMBE=(()=>{
  const pts=[];
  // the spring rises on the knoll's flank, forty metres downslope — a combe
  // that begins at the summit would carve the knoll out from under its own trees
  pts.push([lerp(KNOLL.x,POND.cx,0.26),lerp(KNOLL.z,POND.cz,0.26)]);
  pts.push([lerp(KNOLL.x,POND.cx,0.5)+FORM.r(-14,14),lerp(KNOLL.z,POND.cz,0.5)+FORM.r(-14,14)]);
  pts.push([POND.cx,POND.cz]);
  // downstream: away from the road, off the island's shoulder
  const fr=getFrame(LFRAME,POND.g-FORM.r(150,210));
  pts.push([fr.x+fr.lx*S_LAND*FORM.r(120,150),fr.z+fr.lz*S_LAND*FORM.r(120,150)]);
  const fr2=getFrame(LFRAME,Math.max(40,POND.g-FORM.r(360,430)));
  pts.push([fr2.x+fr2.lx*S_LAND*FORM.r(190,220),fr2.z+fr2.lz*S_LAND*FORM.r(190,220)]);
  return { pts, depth:FORM.r(3.2,4.4), w:FORM.r(30,40) };
})();
function combeDist(x,z){
  let bd=1e18;
  for(let i=0;i<COMBE.pts.length-1;i++){
    const a=COMBE.pts[i], b=COMBE.pts[i+1];
    const abx=b[0]-a[0], abz=b[1]-a[1];
    const t=clamp(((x-a[0])*abx+(z-a[1])*abz)/Math.max(1e-6,abx*abx+abz*abz),0,1);
    const dx=x-(a[0]+abx*t), dz=z-(a[1]+abz*t);
    bd=Math.min(bd,dx*dx+dz*dz);
  }
  return Math.sqrt(bd);
}
for(const p of COMBE.pts) H.terrain.feed(p[0],p[1]);
H.terrain.feed(KNOLL.x,KNOLL.z,KNOLL.r,KNOLL.h);

// ---------- the hay panels: the season's work, already done ----------
// Panel A is mown: pale swathes in bands, a margin of standing seedheads.
// Panel B, late in the island, has grown back — a brighter green flush.
const PANELS=[
  { s0:movStart('rows')+FORM.r(20,60), s1:movEnd('rows')+FORM.r(-40,10),
    side:-S_LAND, u0:RH+4.5, u1:FORM.r(80,105), mown:true, stripeW:FORM.r(6.4,7.8), ph:FORM.r(0,10) },
  { s0:movStart('handover')+FORM.r(-30,20), s1:L_ISL-FORM.r(90,140),
    side:-S_LAND, u0:RH+4.5, u1:FORM.r(70,95), mown:false, stripeW:0, ph:0 },
];
for(const P of PANELS) H.terrain.feed(P.s0,P.s1,P.side,P.u1,P.mown?1:0);
// how much a local point is inside a panel (0..1, ragged edge)
function panelAt(x,z,ri){
  for(const P of PANELS){
    if(ri.s<P.s0-30||ri.s>P.s1+30) continue;
    const u=ri.u*P.side;
    if(u<P.u0-6||u>P.u1+18) continue;
    const rag=(fbmE(x/26+7.7,z/26+3.1)-0.5)*16;
    const w=smooth(P.s0,P.s0+26,ri.s+rag)*(1-smooth(P.s1-26,P.s1,ri.s+rag))
           *smooth(P.u0,P.u0+3,u)*(1-smooth(P.u1-9+rag,P.u1+9+rag,u));
    if(w>0.001) return {w,P};
  }
  return null;
}

// ---------- the ground: one local function, used by everything ----------
const CROWN=0.11;
function corridorProfile(a,cut){
  if(a<=RH) return CROWN*(1-(a/RH)*(a/RH));
  let h=-0.30*smooth(RH,RH+0.95,a);
  h-=0.24*smooth(RH+0.7,RH+1.9,a);
  h-=0.34*smooth(RH+1.7,RH+4.6,a);
  h-=0.44*Math.exp(-Math.pow((a-(RH+4.0))/2.4,2))*clamp(cut,0,1)*smooth(RH,RH+1.4,a);
  return h;
}
const THRESH_BANK=(()=>{
  const st=makeStream('plan/threshold');
  const out=[];
  let sb=st.r(28,70);
  for(let i=0;i<3;i++){
    const fr=getFrame(LFRAME,clamp(sb,0,LFRAME.len-1));
    const off=(st.r(28,58))*-S_LAND;
    out.push({ x:fr.x+fr.lx*off, z:fr.z+fr.lz*off, r:st.r(40,62), h:st.r(2.4,3.9) });
    sb+=st.r(78,112);
  }
  for(const b of out) H.terrain.feed(b.x,b.z,b.r,b.h);
  return out;
})();
function reliefL(x,z,d){
  const g=smooth(16,125,d);
  let r=(fbmL(x/520+11.7,z/520+2.9)-0.5)*120;
  r+=(fbmL(x/188+31.1,z/188+17.4)-0.5)*46;
  r+=(fbmL(x/62+7.7,z/62+41.3)-0.5)*12;
  r*=g;
  // (the knoll is imposed in groundL, not added here: a bump summed onto
  // unconstrained noise stood eight metres BELOW the road on this seed, and a
  // sunken knoll is how three forty-metre elders vanish from their own skyline)
  for(const b of THRESH_BANK){
    const dx=x-b.x, dz=z-b.z;
    r+=b.h*Math.exp(-(dx*dx+dz*dz)/(b.r*b.r))*smooth(EXCL+4,EXCL+16,d);
  }
  // the combe: a long soft cut, held off the corridor
  { const cd=combeDist(x,z);
    r-=COMBE.depth*(1-smooth(COMBE.w*0.3,COMBE.w,cd))*smooth(EXCL+7,EXCL+20,d); }
  return r;
}
// the pond's open shelf: ground between lane and water falls away smoothly,
// held below the rider's sight line, so the water is genuinely seen
const SHELF=(()=>{
  const fr=getFrame(LFRAME,POND.g);
  const off=(POND.cx-fr.x)*fr.lx+(POND.cz-fr.z)*fr.lz;
  // the pond's radius ALONG the lateral direction — its major axis lies
  // near the road tangent, so the near bank is set by the minor axis, and a
  // shelf sized off rx would stop half a basin short of the water
  const ca=Math.cos(POND.rot), sa=Math.sin(POND.rot);
  const cosA=Math.abs(fr.lx*sa+fr.lz*ca);
  const er=Math.sqrt(Math.pow(POND.rx*cosA,2)+Math.pow(POND.rz*Math.sqrt(Math.max(0,1-cosA*cosA)),2));
  return { fr, off, side:Math.sign(off)||1,
           uNear:Math.abs(off)-er*0.94, er,
           // the approach side reaches a hundred and seventy metres back up the
           // road: the reveal is a held view, not a glimpse at the last bend
           halfV:POND.rx*1.55+24, backV:170 };
})();
function shelfY(x,z,y){
  const S=SHELF;
  const dx=x-S.fr.x, dz=z-S.fr.z;
  const v=dx*S.fr.tx+dz*S.fr.tz;
  const ext=(v<0)?S.backV:S.halfV;
  if(Math.abs(v)>ext) return y;
  const u=(dx*S.fr.lx+dz*S.fr.lz)*S.side;
  if(u<RH+5.5||u>S.uNear+1.5) return y;
  const t=clamp((u-(RH+5.5))/Math.max(4,S.uNear+1.5-(RH+5.5)),0,1);
  // concave: the ground gives most of the drop early, so a sight line from a
  // hundred metres back clears the mid-shelf instead of grazing into it
  const ramp=lerp(S.fr.y-0.8,POND.y+0.30,Math.pow(t,0.55));
  const fade=(1-smooth(ext*0.72,ext,Math.abs(v)))*smooth(RH+5.0,RH+9.0,u);
  return lerp(y,Math.min(y,ramp),fade);
}
function inShelf(x,z,margin){
  const S=SHELF;
  const dx=x-S.fr.x, dz=z-S.fr.z;
  const vv=dx*S.fr.tx+dz*S.fr.tz;
  if(Math.abs(vv)>((vv<0)?S.backV:S.halfV)*0.92) return false;
  const u=(dx*S.fr.lx+dz*S.fr.lz)*S.side;
  return (u>RH+3.5&&u<S.uNear+(margin||0));
}
// LOCAL ground: complete, placement-free
function groundL(x,z){
  const ri=routeInfoL(x,z);
  const base=ri.y+(indepLand(x,z)-indepRefAt(ri.s))*bankMix(ri.s)+reliefL(x,z,ri.d);
  const w=1-smooth(8.5,clamp(20+Math.abs(base-ri.y)*3.4,26,132),ri.d);
  let y=base;
  if(w>1e-4){
    const eng=ri.y+corridorProfile(ri.d,base-ri.y);
    y=lerp(base,eng,w);
  }
  // pond basin, bed and rim
  { const pdx=x-POND.cx, pdz=z-POND.cz;
    if(Math.abs(pdx)<POND.rx*3.2&&Math.abs(pdz)<POND.rx*3.2){
      const pc=Math.cos(-POND.rot), ps=Math.sin(-POND.rot);
      const px=pdx*pc-pdz*ps, pz=pdx*ps+pdz*pc;
      const pr=Math.hypot(px/POND.rx,pz/POND.rz);
      if(pr<2.05){
        const t=(1-smooth(1.10,2.05,pr))*smooth(RH+9,RH+24,ri.d);
        y=lerp(y,POND.bed,t);
      }
      if(pr>=1.0&&pr<2.7){
        const rim=POND.y+0.35+1.9*smooth(1.05,2.4,pr);
        y=lerp(y,Math.max(y,rim),smooth(RH+9,RH+26,ri.d)*(1-smooth(2.3,2.7,pr)));
      }
    } }
  // the Sisters' knoll: its summit is DECLARED against the road's own height,
  // so the crowns break the skyline from the lane at every station. The noise
  // around it stays low, which gives the rise its prominence for free.
  { const kdx=x-KNOLL.x, kdz=z-KNOLL.z, kd2=kdx*kdx+kdz*kdz;
    const kw=Math.exp(-kd2/(KNOLL.r*KNOLL.r));
    if(kw>0.02) y=lerp(y,ri.y+KNOLL.h,smooth(0.06,0.75,kw)); }
  y=shelfY(x,z,y);
  // within the shoulder the ground is never permitted above the lane's edge,
  // and the metre beside the stone always carries it
  if(ri.d<RH+2.5) y=Math.min(y,ri.y+corridorProfile(Math.max(ri.d,RH+0.001),0)+0.015);
  if(ri.d<RH+1.7) y=Math.max(y,ri.y+corridorProfile(Math.max(ri.d,RH+0.001),0)-0.012);
  return y;
}
function pondNorm(x,z){
  const pdx=x-POND.cx, pdz=z-POND.cz;
  const pc=Math.cos(-POND.rot), ps=Math.sin(-POND.rot);
  const px=pdx*pc-pdz*ps, pz=pdx*ps+pdz*pc;
  return Math.hypot(px/POND.rx,pz/POND.rz);
}
// moisture: the combe's damp seam and the pond margin
function moistL(x,z){
  const cd=combeDist(x,z);
  let m=clamp(1-cd/34,0,1)*0.8;
  m=Math.max(m,clamp(1-(pondNorm(x,z)-1)/0.8,0,1));
  return clamp(m,0,1);
}
for(let s=0;s<L_ISL;s+=120){ const p=spineAt(s); H.terrain.feed(groundL(p.x+55,p.z),groundL(p.x-55,p.z+30)); }

// ============================================================
// PLAN — SIGHTLINES
// ============================================================
const SIGHT=[];
function addSight(s0,s1,side,half,tag){ SIGHT.push({s0,s1,side,half,tag}); }
function inSight(x,z,s,d,side){
  for(const S of SIGHT){
    if(s<S.s0||s>S.s1) continue;
    if(S.side&&S.side!==side) continue;
    if(d<S.half) return true;
  }
  return false;
}
// the pond is shown through one deliberate opening — water-aperture
addSight(POND.apertureG-24,POND.g+POND.rx*2.0,S_LAND,40,'water-aperture');
// the opening hundred metres stay honest so the entry never reads as a wall
addSight(4,90,0,11,'entry');

// ============================================================
// PLAN — FORMATIONS
// The worked landscape, spelled in the keeper's own vocabulary:
//   dappled-gate   threshold trees at entry and exit
//   orchard-row    the working rows, and the old planted boundary line
//   wind-sisters   three wind-combed elders on the knoll at the combe head
//   water-aperture the composed opening onto the pond
//   light-shaft / fernfold-shaft   the island's planned pockets of visible air
// fork-wedge and bellroot-approach are deliberately absent: there is no fork
// here, and the hero tree belongs to the hollow.
// ============================================================
const FORMATION_TREES=[];   // planned, placement-free; realized statically
const FAMS=['oak','beech','birch','leaning','windshaped','orchard'];

// ---- dappled-gate, twice: entering and leaving the worked land ----
const GATES=(()=>{
  const out=[];
  const mk=(s,big,tag)=>{
    const st=subStream('gate',Math.round(s));
    const side=st.chance(0.5)?1:-1;
    out.push({s:s+st.r(-6,6),side,off:EXCL+st.r(2.0,3.4),fam:'oak',
      scl:big?st.r(1.24,1.46):st.r(1.02,1.2),lean:0.9,tag});
    out.push({s:s+st.r(20,30),side:-side,off:EXCL+st.r(3.2,6.0),fam:'leaning',
      scl:big?st.r(0.94,1.12):st.r(0.8,0.98),lean:-0.9,tag});
    out.push({s:s+st.r(40,54),side,off:EXCL+st.r(5,10),fam:'birch',
      scl:st.r(0.85,1.05),lean:0.4,tag});
  };
  mk(FORM.r(140,175),true,'entry');
  mk(L_ISL-FORM.r(230,265),false,'exit');
  return out;
})();
for(const G of GATES){
  const fr=getFrame(LFRAME,clamp(G.s,0,LFRAME.len-1));
  const x=fr.x+fr.lx*G.off*G.side, z=fr.z+fr.lz*G.off*G.side;
  FORMATION_TREES.push({x,z,fam:G.fam,scl:G.scl,lean:G.lean,
    leanDir:Math.atan2(fr.tx,fr.tz)+(G.side>0?-1:1)*Math.PI*0.5,
    s:G.s,enc:0.5,formation:'dappled-gate',fruit:false});
}

// ---- orchard-row: three working rows on the contour above the road ----
const ORCHARD={ s0:movStart('rows')+FORM.r(30,70), s1:movEnd('rows')+FORM.r(-30,10),
  rows:3, lat0:FORM.r(15,18), latStep:FORM.r(13.5,15.5), step:FORM.r(11.5,14) };
{
  for(let r=0;r<ORCHARD.rows;r++){
    const lat=ORCHARD.lat0+r*ORCHARD.latStep;
    let i=0;
    for(let s=ORCHARD.s0+r*FORM.r(2,8);s<ORCHARD.s1-r*10;s+=ORCHARD.step,i++){
      const st=subStream('orchard',r,i);
      if(st.chance(0.10)) continue;              // a tree lost to age: the gap that reads as time
      const fr=getFrame(LFRAME,clamp(s,0,LFRAME.len-1));
      const off=(lat+st.r(-1.3,1.3))*S_LAND;
      const x=fr.x+fr.lx*off+st.r(-0.8,0.8), z=fr.z+fr.lz*off+st.r(-0.8,0.8);
      if(routeInfoL(x,z).d<EXCL+2.2) continue;
      if(pondNorm(x,z)<1.5) continue;
      if(combeDist(x,z)<16) continue;
      FORMATION_TREES.push({x,z,fam:'orchard',scl:st.r(0.98,1.24),lean:st.r(-0.4,0.4),
        leanDir:st.r(0,TAU),s,enc:0.25,formation:'orchard-row',fruit:true});
    }
  }
}

// ---- orchard-row again, aged: the old planted boundary line on the climb ----
const BOUNDARY={ s0:movStart('headland')+FORM.r(10,50), s1:movEnd('headland')+FORM.r(20,70),
  lat:FORM.r(19,23), step:FORM.r(25,30) };
{
  let i=0;
  for(let s=BOUNDARY.s0;s<BOUNDARY.s1;s+=BOUNDARY.step,i++){
    const st=subStream('boundary',i);
    if(st.chance(0.13)) continue;               // the gaps are part of the line's age
    const fr=getFrame(LFRAME,clamp(s,0,LFRAME.len-1));
    const off=(BOUNDARY.lat+st.r(-1.8,1.8))*S_LAND;
    const x=fr.x+fr.lx*off, z=fr.z+fr.lz*off;
    if(routeInfoL(x,z).d<EXCL+2.5) continue;
    FORMATION_TREES.push({x,z,fam:'windshaped',scl:st.r(1.0,1.28),lean:0.9,
      leanDir:Math.atan2(fr.tx,fr.tz)+st.r(-0.2,0.2),   // wind-combed along the line
      s,enc:0.3,formation:'orchard-row',fruit:false});
  }
}

// ---- wind-sisters: three elders on the knoll at the head of the combe.
// A landmark has to be a shape you can name, so the line is laid ACROSS the
// rider's own sight-lines — one designed viewpoint in the rows, one on the
// headland — so the group reads side-on as one silhouette from both, never
// end-on as three trunks. Tall, taller, short: a relationship, not a row.
const SISTERS=(()=>{
  // both sight-lines are FORWARD views a rider actually holds: one from the
  // water-aperture approach (the composite: pond below, elders above), one
  // from the early climb where the knoll stands off the shoulder
  const vA=getFrame(LFRAME,clamp(POND.apertureG-45,0,LFRAME.len-1));
  const vB=getFrame(LFRAME,clamp(POND.g+185,0,LFRAME.len-1));
  const a1=Math.atan2(vA.x-KNOLL.x,vA.z-KNOLL.z), a2=Math.atan2(vB.x-KNOLL.x,vB.z-KNOLL.z);
  const vm=Math.atan2(Math.sin(a1)+Math.sin(a2),Math.cos(a1)+Math.cos(a2));
  const across=vm+Math.PI*0.5;
  const towardPond=Math.atan2(POND.cx-KNOLL.x,POND.cz-KNOLL.z);
  const SCL=[2.7,3.4,2.0], OFF=[-33,1,29];
  const out=[];
  for(let i=0;i<3;i++){
    const st=subStream('sister',i);
    const x=KNOLL.x+Math.sin(across)*OFF[i]+st.r(-3,3);
    const z=KNOLL.z+Math.cos(across)*OFF[i]+st.r(-3,3);
    out.push({x,z,fam:'windshaped',scl:SCL[i],lean:1,
      leanDir:towardPond+st.r(-0.15,0.15),                // combed down the combe
      s:KNOLL.g,enc:0.06,formation:'wind-sisters',fruit:false});
  }
  return out;
})();
for(const t of SISTERS) FORMATION_TREES.push(t);
for(const t of FORMATION_TREES) H.eco.feed(t.x,t.z,t.fam,t.scl,t.formation);

// ============================================================
// PLAN — GROVES AND BANDED TREES
// Sparse framing and support groves in the island's own middle distance,
// one wall of woodland behind the pond so the water has a dark bank to
// read against, and the combe's own shade.
// ============================================================
const TREES=[];
const treeCell=40, treeGrid=new Map();
function treeAdd(t){
  TREES.push(t);
  const k=rKey(Math.floor(t.x/treeCell),Math.floor(t.z/treeCell));
  let c=treeGrid.get(k); if(!c){c=[];treeGrid.set(k,c);} c.push(t);
}
function treeNear(x,z,r){
  const gx=Math.floor(x/treeCell), gz=Math.floor(z/treeCell), R=Math.ceil(r/treeCell);
  for(let ax=gx-R;ax<=gx+R;ax++) for(let az=gz-R;az<=gz+R;az++){
    const c=treeGrid.get(rKey(ax,az)); if(!c) continue;
    for(const t of c) if((t.x-x)*(t.x-x)+(t.z-z)*(t.z-z)<r*r) return true; }
  return false;
}
function famScale(fam,st){
  return { oak:st.r(1.0,1.35), beech:st.r(1.0,1.3), birch:st.r(0.78,1.05),
           leaning:st.r(0.86,1.15), windshaped:st.r(0.8,1.08), orchard:st.r(0.52,0.76) }[fam];
}
const GROVES=[];
{
  const openMix=['oak','windshaped','birch','leaning'];
  const woodMix=['beech','oak','beech','birch','oak','leaning'];
  let s=-50, gi=0;
  while(s<L_ISL+40){
    const enc=enclosureAt(s);
    const st=subStream('grove',gi);
    const nG=enc>0.55?st.i(2,3):(enc>0.25?st.i(1,2):(st.chance(0.6)?1:0));
    for(let q=0;q<nG;q++){
      const roll=st.f();
      let role,off,rx,rz,dens;
      if(roll<0.30+0.24*enc){ role='frame'; off=st.r(EXCL+1.6,16); rx=st.r(6,13); rz=st.r(8,19); dens=st.r(0.6,1.0); }
      else if(roll<0.74){ role='support'; off=st.r(20,60); rx=st.r(12,26); rz=st.r(15,34); dens=st.r(0.6,1.0); }
      else { role='wall'; off=st.r(60,150); rx=st.r(26,60); rz=st.r(30,80); dens=st.r(0.7,1.0); }
      const side=st.chance(0.5)?1:-1;
      GROVES.push({ id:GROVES.length, s, side, off, rx, rz, rot:st.r(0,TAU), role, dens,
                    mix:(enc>0.5)?woodMix:openMix, enc, hero:st.chance(role==='frame'?0.10:0.05) });
    }
    gi++;
    s+=lerp(56,20,enc)*subStream('grovestep',gi).r(0.8,1.25);
  }
  // the dark bank behind the pond — the wall the water reads against.
  // Two masses: one square behind the water, one shouldering the far end,
  // so the surface always has deep green above it whichever way it is met.
  {
    const st=subStream('pondwall',0);
    const fr=getFrame(LFRAME,POND.g);
    const beyond=Math.abs((POND.cx-fr.x)*fr.lx+(POND.cz-fr.z)*fr.lz)+POND.rx+st.r(10,16);
    GROVES.push({ id:GROVES.length, s:POND.g+st.r(-24,10), side:S_LAND, off:beyond, rx:st.r(34,44), rz:st.r(38,52),
      rot:st.r(0,TAU), role:'wall', dens:1.0, mix:['beech','oak','beech','leaning'], enc:0.85, hero:false, pondWall:true });
    GROVES.push({ id:GROVES.length, s:POND.g+st.r(78,120), side:S_LAND, off:beyond*st.r(1.0,1.15), rx:st.r(22,30), rz:st.r(26,36),
      rot:st.r(0,TAU), role:'wall', dens:1.0, mix:['beech','oak','leaning'], enc:0.8, hero:false, pondWall:true });
  }
  for(const gr of GROVES) H.eco.feed(gr.s,gr.off,gr.side,gr.role);
}
{
  for(const gr of GROVES){
    const fr=getFrame(LFRAME,clamp(gr.s,0,LFRAME.len-1));
    const cx=fr.x+fr.lx*gr.off*gr.side, cz=fr.z+fr.lz*gr.off*gr.side;
    const area=Math.PI*gr.rx*gr.rz;
    const target=Math.round(clamp(area/(gr.role==='frame'?95:(gr.role==='support'?150:240))*gr.dens,1,34));
    const st=subStream('trees',gr.id);
    let placed=0;
    for(let att=0;att<target*9&&placed<target;att++){
      const a=st.r(0,TAU), rr=Math.sqrt(st.f());
      const ex=Math.cos(a)*gr.rx*rr, ez=Math.sin(a)*gr.rz*rr;
      const ca=Math.cos(gr.rot), sa=Math.sin(gr.rot);
      const x=cx+ex*ca-ez*sa, z=cz+ex*sa+ez*ca;
      const ri=routeInfoL(x,z);
      const fam=st.pick(gr.mix);
      const scl=famScale(fam,st)*(gr.hero&&placed===0?st.r(1.28,1.5):1);
      const rad=1.5*scl;
      if(ri.d<EXCL+rad+0.6) continue;
      if(pondNorm(x,z)<1.3) continue;
      if(inShelf(x,z,1.5)) continue;
      // the whole worked side is worked ground through the rows: volunteer
      // trees there would bury the orchard's order, which is the reading
      if(ri.s>ORCHARD.s0-50&&ri.s<ORCHARD.s1+40&&ri.u*S_LAND>EXCL) continue;
      // and the mown panel side stays open enough to read the swathes
      if(ri.s>PANELS[0].s0-20&&ri.s<PANELS[0].s1+20&&ri.u*(-S_LAND)>10&&ri.u*(-S_LAND)<PANELS[0].u1+14) continue;
      // the mown panel was cut this season: nothing grows tall in it
      { const pa=panelAt(x,z,ri); if(pa&&pa.P.mown&&pa.w>0.3) continue; }
      if(Math.hypot(x-KNOLL.x,z-KNOLL.z)<84) continue;   // the Sisters share their skyline with nobody
      if(inSight(x,z,ri.s,ri.d,Math.sign(ri.u)||1)) continue;
      if(treeNear(x,z,2.0*scl+st.r(0.4,2.4))) continue;
      treeAdd({ x,z,fam,scl,lean:st.r(-1,1),leanDir:st.r(0,TAU),
        role:(placed===0&&gr.hero)?'hero':gr.role, grove:gr.id,
        d:ri.d, s:ri.s, roadY:ri.y, enc:gr.enc, fruit:false, formation:null });
      placed++;
    }
  }
  // formations enter the shared tree set (identity first, so nothing crowds them)
  for(const t of FORMATION_TREES){
    const ri=routeInfoL(t.x,t.z);
    treeAdd({ x:t.x,z:t.z,fam:t.fam,scl:t.scl,lean:t.lean,leanDir:t.leanDir,
      role:t.formation==='wind-sisters'?'landmark':'formation', grove:-1,
      d:ri.d, s:t.s, roadY:ri.y, enc:t.enc, fruit:t.fruit, formation:t.formation });
  }
  TREES.sort((a,b)=>a.s-b.s||a.x-b.x);
  for(let i=0;i<TREES.length;i+=13) H.eco.feed(TREES[i].x,TREES[i].z,TREES[i].fam);
  H.eco.feed(TREES.length);
}

// ============================================================
// PLAN — AMBIENT LIFE AND VISIBLE AIR
// Scheduled by island distance (ride-clock); animated on the world's own
// clock, so pausing the rider never pauses the place. Two resident
// swallows belong to the island outright and are never scheduled at all.
// ============================================================
const LIFE_EVENTS=[];
{
  const add=(s,kind,opt)=>LIFE_EVENTS.push(Object.assign({
    s:clamp(s,40,L_ISL-40), kind, id:LIFE_EVENTS.length, fired:false },opt||{}));
  add(lerp(movStart('rows'),movEnd('rows'),0.28),'swallows');
  add(lerp(movStart('rows'),movEnd('rows'),0.68),'butterflies',{radius:24,side:S_LAND});
  add(movEnd('rows')-40,'glint',{side:-S_LAND});          // the mown margin catches the light
  add(POND.g-10,'dragonflies',{atPond:true});
  add(lerp(movStart('headland'),movEnd('headland'),0.55),'flock',{far:true});
  add(lerp(movStart('handover'),L_ISL,0.35),'rabbit',{side:-S_LAND});
  for(const e of LIFE_EVENTS){
    const st=subStream('life',e.id);
    e.dur=st.r(8,14); if(e.side===undefined) e.side=st.chance(0.5)?1:-1; e.s=clamp(e.s+st.r(-12,12),40,L_ISL-40);
    H.life.feed(e.s,e.kind,e.dur,e.side);
  }
  LIFE_EVENTS.sort((a,b)=>a.s-b.s);
}
// the island's planned pockets of visible air, named in the vocabulary
const AIR_POCKETS=(()=>{
  const out=[];
  const add=(s,w,strength,why)=>out.push({s,w,strength,why});
  add(GATES[0].s+LIFE.r(10,30),LIFE.r(40,60),LIFE.r(0.85,1.1),'light-shaft');
  add(lerp(movStart('combe'),movEnd('combe'),LIFE.r(0.35,0.55)),LIFE.r(44,64),LIFE.r(0.95,1.2),'fernfold-shaft');
  add(POND.g,LIFE.r(46,70),LIFE.r(0.85,1.1),'water-aperture');
  add(lerp(movStart('headland'),movEnd('headland'),LIFE.r(0.6,0.85)),LIFE.r(42,62),LIFE.r(0.8,1.05),'light-shaft');
  out.sort((a,b)=>a.s-b.s);
  for(const o of out) H.life.feed('air',Math.round(o.s),Math.round(o.w),o.why);
  return out;
})();
function airAmountAt(s){
  let v=0.10;
  for(const o of AIR_POCKETS){
    const t=1-clamp(Math.abs(s-o.s)/o.w,0,1);
    v=Math.max(v,0.10+o.strength*t*t*(3-2*t));
  }
  return v;
}

const VOCAB_ALLOWLIST=['dappled-gate','light-shaft','fernfold-shaft','fork-wedge',
  'water-aperture','wind-sisters','orchard-row','bellroot-approach'];
const VOCAB_USED=(()=>{
  const used=new Set();
  for(const t of TREES) if(t.formation) used.add(t.formation);
  for(const S of SIGHT) if(VOCAB_ALLOWLIST.includes(S.tag)) used.add(S.tag);
  for(const o of AIR_POCKETS) used.add(o.why);
  return Array.from(used).sort();
})();

// ============================================================
// PLAN HASH — the island's complete identity, before quality or placement
// ============================================================
const PLAN_SUMMARY={
  islandId:ISLAND_ID, seed:SEED_TEXT, lengthM:Math.round(LFRAME.len),
  movements:MOV.map(m=>m.name),
  netElevationM:Math.round((EXIT_POSE.y-ENTRY_POSE.y)*10)/10,
  netHeadingDeg:Math.round(HEADING_STAT.netDeg*10)/10,
  maxGradePct:Math.round(ELEVATION.maxG*1000)/10,
  workedSide:S_LAND, pondAtM:Math.round(POND.g), knollAtM:Math.round(KNOLL.g),
  plannedTrees:TREES.length, groves:GROVES.length,
  lifeEvents:LIFE_EVENTS.length, airPockets:AIR_POCKETS.length,
  vocabulary:VOCAB_USED.join(','),
};
{
  H.plan.feed(H.route.hex(),H.elev.hex(),H.terrain.hex(),H.eco.hex(),H.life.hex());
  for(const k of Object.keys(PLAN_SUMMARY)) H.plan.feed(k,String(PLAN_SUMMARY[k]));
}
const PLAN_HASH=H.plan.hex();
QUALITY_READS_AT_PLAN=QUALITY_READS;       // the plan never asked what tier this is
PLACEMENT_READS_AT_PLAN=PLACEMENT_READS;   // ...nor where it will stand

// ============================================================
// REALIZATION — quality tiers change representation cost, never identity
// ============================================================
const QCFG={
  low:      { row:7.0, tile:18, ahead:460, behind:190, under:0.34, nearD:13, midD:56, farD:230, shadow:0,    part:0.5, tuftBand:10, capNear:3, capMid:9,  bandTreeCap:14, lobe:0, view:1500, roundMid:3, dpr:1.0 },
  standard: { row:5.0, tile:16, ahead:540, behind:220, under:0.62, nearD:17, midD:70, farD:300, shadow:1024, part:1.0, tuftBand:14, capNear:5, capMid:11, bandTreeCap:16, lobe:1, view:1620, roundMid:6, dpr:1.25 },
  // high spends its budget on fidelity — shadow resolution, device pixels,
  // near articulation, view reach — not on more geometry than standard
  high:     { row:5.0, tile:14, ahead:520, behind:220, under:0.64, nearD:22, midD:78, farD:320, shadow:2048, part:1.3, tuftBand:13, capNear:6, capMid:10, bandTreeCap:14, lobe:1, view:1900, roundMid:7, dpr:1.5 },
}[readQuality()];
H.real.feed(QUALITY); for(const k of Object.keys(QCFG)) H.real.feed(k,QCFG[k]);

// ============================================================
// THE HOST — everything from here to the island realization is the mount:
// a placement transform, connective travel either side, and the world's
// own sky and light. It reads the island's boundary contract (entry pose,
// exit pose, road width, a ground sampler) and nothing else.
// ============================================================
const PLACEMENT=(()=>{
  const p=readPlacement();
  return { headingRad:p.headingDeg*Math.PI/180, entryGrade:p.entryGradePct/100, copies:p.copies };
})();
const APPROACH_LEN=280, EXIT_LEN=340, GAP_LEN=190;

// a rigid transform: local -> world. Rotation about Y so local +Z maps to
// the world heading; then translation.
function makeXform(wx,wy,wz,headingRad){
  const c=Math.cos(headingRad), s=Math.sin(headingRad);
  return {
    c,s,wx,wy,wz,heading:headingRad,
    fwd:(x,z)=>[wx+x*c+z*s, wz-x*s+z*c],
    fwdY:(y)=>wy+y,
    inv:(X,Z)=>{ const dx=X-wx, dz=Z-wz; return [dx*c-dz*s, dx*s+dz*c]; },
  };
}
// world assembly: approach, island copies, gap, exit — as separate frame
// tables so the island's own frames pass through untouched
const SEGMENTS=[];
const XFORMS=[];
{
  let hx=0, hz=0, hy=40, hd=PLACEMENT.headingRad;    // an arbitrary world start; nothing depends on it
  const walk=(len,gradeAt,curveAt)=>{
    const pts=[[hx,hy,hz]];
    const n=Math.ceil(len/SDS);
    for(let i=1;i<=n;i++){
      const s=i*SDS;
      hd+=(curveAt?curveAt(s):0)*SDS;
      hx+=Math.sin(hd)*SDS; hz+=Math.cos(hd)*SDS;
      hy+=(gradeAt?gradeAt(s):0)*SDS;
      pts.push([hx,hy,hz]);
    }
    return framesFromPoints(pts);
  };
  // approach: the host's grade, easing to the island's declared entry grade
  const eg=PLACEMENT.entryGrade, ig=ENTRY_POSE.gradePct/100;
  const A=walk(APPROACH_LEN,(s)=>lerp(eg,ig,smooth(APPROACH_LEN-120,APPROACH_LEN-16,s)),
    (s)=>0.0011*Math.sin(s*0.013+0.9)*(1-smooth(APPROACH_LEN-90,APPROACH_LEN-10,s)));
  SEGMENTS.push({F:A,island:false,copy:-1});
  for(let k=0;k<PLACEMENT.copies;k++){
    // mount copy k at the walker's pose
    const T=makeXform(hx,hy,hz,hd);
    XFORMS.push(T);
    const F={ RS:LFRAME.RS, N:LFRAME.N, len:LFRAME.len,
      x:new Float32Array(LFRAME.N+1), y:new Float32Array(LFRAME.N+1), z:new Float32Array(LFRAME.N+1),
      tx:new Float32Array(LFRAME.N+1), tz:new Float32Array(LFRAME.N+1),
      lx:new Float32Array(LFRAME.N+1), lz:new Float32Array(LFRAME.N+1), k:LFRAME.k };
    for(let i=0;i<=LFRAME.N;i++){
      const w=T.fwd(LFRAME.x[i],LFRAME.z[i]);
      F.x[i]=w[0]; F.z[i]=w[1]; F.y[i]=T.fwdY(LFRAME.y[i]);
      const tw=[LFRAME.tx[i]*T.c+LFRAME.tz[i]*T.s, -LFRAME.tx[i]*T.s+LFRAME.tz[i]*T.c];
      F.tx[i]=tw[0]; F.tz[i]=tw[1]; F.lx[i]=tw[1]; F.lz[i]=-tw[0];
    }
    SEGMENTS.push({F,island:true,copy:k});
    // hand the walker the island's exit pose
    const we=T.fwd(EXIT_POSE.x,EXIT_POSE.z);
    hx=we[0]; hz=we[1]; hy=T.fwdY(EXIT_POSE.y); hd=hd+EXIT_POSE.headingRad;
    if(k<PLACEMENT.copies-1){
      const xg=EXIT_POSE.gradePct/100;
      const G=walk(GAP_LEN,(s)=>lerp(xg,ig,smooth(30,GAP_LEN-30,s)),null);
      SEGMENTS.push({F:G,island:false,copy:-1});
    }
  }
  // exit: ease the island's exit grade back to the host's own idea of flat
  const xg=EXIT_POSE.gradePct/100;
  const X=walk(EXIT_LEN,(s)=>lerp(xg,0,smooth(20,140,s)),(s)=>0.0009*Math.sin(s*0.011));
  SEGMENTS.push({F:X,island:false,copy:-1});
}
{
  let off=0;
  for(const seg of SEGMENTS){ seg.g0=off; off+=seg.F.len; seg.g1=off; }
}
const ROUTE_LEN=SEGMENTS[SEGMENTS.length-1].g1;
const ISLAND_SEGS=SEGMENTS.filter(s=>s.island);
function segAt(g){
  for(const seg of SEGMENTS) if(g>=seg.g0&&g<=seg.g1) return seg;
  return g<0?SEGMENTS[0]:SEGMENTS[SEGMENTS.length-1];
}
function frameAtG(g){
  const seg=segAt(clamp(g,0,ROUTE_LEN-0.01));
  return getFrame(seg.F,clamp(g-seg.g0,0,seg.F.len-0.01));
}
// island-local station of a world ride distance (nearest copy), or null
function islandLocalOf(g){
  for(const seg of ISLAND_SEGS) if(g>=seg.g0-1&&g<=seg.g1+1) return {s:clamp(g-seg.g0,0,L_ISL),copy:seg.copy};
  return null;
}

// ---------- world route field over every segment ----------
const rGridW=new Map();
for(const seg of SEGMENTS){
  const F=seg.F;
  for(let i=0;i<=F.N;i++){
    const k=rKey(Math.floor(F.x[i]/rCell),Math.floor(F.z[i]/rCell));
    let c=rGridW.get(k); if(!c){ c=[]; rGridW.set(k,c); }
    const ia=Math.max(0,i-1), ib=Math.min(F.N,i+1);
    const slope=(F.y[ib]-F.y[ia])/((ib-ia)*F.RS||1);
    c.push(F.x[i],F.y[i],F.z[i],seg.g0+i*F.RS,F.tx[i],F.tz[i],slope);
  }
}
// coarse distance field so far queries never pay for a wide scan
const CF={cell:40};
{
  let minX=1e9,maxX=-1e9,minZ=1e9,maxZ=-1e9;
  for(const seg of SEGMENTS){ const F=seg.F;
    for(let i=0;i<=F.N;i+=4){
      minX=Math.min(minX,F.x[i]); maxX=Math.max(maxX,F.x[i]);
      minZ=Math.min(minZ,F.z[i]); maxZ=Math.max(maxZ,F.z[i]); } }
  CF.x0=minX-1200; CF.z0=minZ-1200;
  CF.nx=Math.ceil((maxX-minX+2400)/CF.cell)+1;
  CF.nz=Math.ceil((maxZ-minZ+2400)/CF.cell)+1;
  CF.cx=(minX+maxX)*0.5; CF.cz=(minZ+maxZ)*0.5;
  const n=CF.nx*CF.nz;
  CF.d=new Float32Array(n).fill(1e6); CF.y=new Float32Array(n); CF.s=new Float32Array(n);
  for(const seg of SEGMENTS){ const F=seg.F;
    for(let i=0;i<=F.N;i+=2){
      const gx=Math.round((F.x[i]-CF.x0)/CF.cell), gz=Math.round((F.z[i]-CF.z0)/CF.cell);
      if(gx<0||gz<0||gx>=CF.nx||gz>=CF.nz) continue;
      const k=gz*CF.nx+gx;
      const dx=CF.x0+gx*CF.cell-F.x[i], dz=CF.z0+gz*CF.cell-F.z[i], d=Math.hypot(dx,dz);
      if(d<CF.d[k]){ CF.d[k]=d; CF.y[k]=F.y[i]; CF.s[k]=seg.g0+i*F.RS; } } }
  const step=(k,j,add)=>{ const nd=CF.d[j]+add; if(nd<CF.d[k]){ CF.d[k]=nd; CF.y[k]=CF.y[j]; CF.s[k]=CF.s[j]; } };
  const dO=CF.cell, dD=CF.cell*Math.SQRT2;
  for(let z=0;z<CF.nz;z++) for(let x=0;x<CF.nx;x++){ const k=z*CF.nx+x;
    if(x>0) step(k,k-1,dO); if(z>0) step(k,k-CF.nx,dO);
    if(x>0&&z>0) step(k,k-CF.nx-1,dD); if(x<CF.nx-1&&z>0) step(k,k-CF.nx+1,dD); }
  for(let z=CF.nz-1;z>=0;z--) for(let x=CF.nx-1;x>=0;x--){ const k=z*CF.nx+x;
    if(x<CF.nx-1) step(k,k+1,dO); if(z<CF.nz-1) step(k,k+CF.nx,dO);
    if(x<CF.nx-1&&z<CF.nz-1) step(k,k+CF.nx+1,dD); if(x>0&&z<CF.nz-1) step(k,k+CF.nx-1,dD); }
}
function cfSample(x,z,arr){
  const fx=clamp((x-CF.x0)/CF.cell,0,CF.nx-1.001), fz=clamp((z-CF.z0)/CF.cell,0,CF.nz-1.001);
  const ix=Math.floor(fx), iz=Math.floor(fz), tx=fx-ix, tz=fz-iz;
  const a=arr[iz*CF.nx+ix], b=arr[iz*CF.nx+ix+1], c=arr[(iz+1)*CF.nx+ix], d=arr[(iz+1)*CF.nx+ix+1];
  return lerp(lerp(a,b,tx),lerp(c,d,tx),tz);
}
const _riw={d:0,y:0,s:0,u:0};
function routeInfoW(x,z){
  const approx=cfSample(x,z,CF.d);
  if(approx>150){ _riw.d=approx; _riw.y=cfSample(x,z,CF.y); _riw.s=cfSample(x,z,CF.s); _riw.u=approx; return _riw; }
  const gx=Math.floor(x/rCell), gz=Math.floor(z/rCell);
  let R=1; if(approx>18) R=2; if(approx>44) R=3; if(approx>68) R=4; if(approx>110) R=6;
  let bd=1e18,by=0,bs=0,bu=0;
  for(let ax=gx-R;ax<=gx+R;ax++) for(let az=gz-R;az<=gz+R;az++){
    const c=rGridW.get(rKey(ax,az)); if(!c) continue;
    for(let i=0;i<c.length;i+=7){
      const dx=x-c[i], dz=z-c[i+2];
      const t=clamp(dx*c[i+4]+dz*c[i+5],-1,1);
      const ex=dx-c[i+4]*t, ez=dz-c[i+5]*t;
      const d=ex*ex+ez*ez;
      if(d<bd){ bd=d; by=c[i+1]+c[i+6]*t; bs=c[i+3]+t; bu=dx*c[i+5]-dz*c[i+4]; }
    }
  }
  if(bd>1e17){ _riw.d=approx; _riw.y=cfSample(x,z,CF.y); _riw.s=cfSample(x,z,CF.s); _riw.u=approx; return _riw; }
  _riw.d=Math.sqrt(bd); _riw.y=by; _riw.s=bs; _riw.u=bu;
  return _riw;
}

// ---------- the world ground: the island owns its interior; the host owns
// everything else and adapts its edge to the island's, never the reverse ----------
function islandInfluence(lx,lz,riL){
  // 1 well inside the island's authored land, 0 outside it
  const lat=1-smooth(198,244,riL.d);
  let along=1;
  if(riL.s<3) along=smooth(-44,-6,lz);
  else if(riL.s>L_ISL-3){
    const dx=lx-EXIT_POSE.x, dz=lz-EXIT_POSE.z;
    const fwd=dx*Math.sin(EXIT_POSE.headingRad)+dz*Math.cos(EXIT_POSE.headingRad);
    along=1-smooth(6,44,fwd);
  }
  return lat*along;
}
function hostGround(x,z){
  const ri=routeInfoW(x,z);
  const base=ri.y+(fbmL(x/430+51.3,z/430+27.9)-0.5)*42*smooth(16,140,ri.d)
                +(fbmL(x/130+11.1,z/130+43.7)-0.5)*9*smooth(14,60,ri.d);
  const w=1-smooth(8.5,40,ri.d);
  let y=base;
  if(w>1e-4) y=lerp(base,ri.y+corridorProfile(ri.d,base-ri.y),w);
  if(ri.d<RH+2.5) y=Math.min(y,ri.y+corridorProfile(Math.max(ri.d,RH+0.001),0)+0.015);
  if(ri.d<RH+1.7) y=Math.max(y,ri.y+corridorProfile(Math.max(ri.d,RH+0.001),0)-0.012);
  return y;
}
function groundW(x,z){
  let best=null;
  for(const T of XFORMS){
    const l=T.inv(x,z);
    if(Math.abs(l[0])>2600||Math.abs(l[1])>2600) continue;
    const riL=routeInfoL(l[0],l[1]);
    if(riL.d>260) continue;
    const w=islandInfluence(l[0],l[1],riL);
    if(w<=0.001) continue;
    const gI=T.fwdY(groundL(l[0],l[1]));
    if(!best||w>best.w) best={w,gI};
  }
  if(!best) return hostGround(x,z);
  if(best.w>=0.999) return best.gI;
  return lerp(hostGround(x,z),best.gI,best.w);
}

const WL={ uWTime:{value:0},

  uGlint:{value:new THREE.Vector4(0,0,0,0)} };
const WL_GLSL=`
uniform float uWTime; uniform vec2 uCloudMove; uniform vec4 uGlint;
float wlHash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
float wlNoise(vec2 p){ vec2 i=floor(p),f=fract(p); vec2 u=f*f*(3.0-2.0*f);
  return mix(mix(wlHash(i),wlHash(i+vec2(1,0)),u.x),mix(wlHash(i+vec2(0,1)),wlHash(i+vec2(1,1)),u.x),u.y); }
float cloudShadowAt(vec2 w){
  vec2 p=(w+uCloudMove*uWTime*0.42)*0.00185;
  float n=wlNoise(p)*0.62+wlNoise(p*2.4+7.1)*0.38;
  float s=smoothstep(0.545,0.735,n);
  return clamp(1.0-0.40*s,0.34,1.0);
}
float dappleAt(vec2 w,float canopy){
  if(canopy<0.02) return 1.0;
  float n=wlNoise(w*0.135)*0.54+wlNoise(w*0.41+31.7)*0.31+wlNoise(w*1.1+11.3)*0.15;
  float sway=wlNoise(w*0.08+vec2(uWTime*0.055,uWTime*0.041));
  float cut=smoothstep(0.455+0.07*sway,0.63,n);
  return mix(1.0,mix(0.42,1.06,cut),clamp(canopy,0.0,1.0));
}`;
const MEADOW_GLSL=`
{
  float clump=wlNoise(vWPos.xz*0.42+vec2(4.7,1.9))*0.58+wlNoise(vWPos.xz*1.05+vec2(9.1,6.3))*0.42;
  float coarse=wlNoise(vWPos.xz*0.085+vec2(21.0,13.0));
  float lush=smoothstep(0.40,0.78,clump*0.65+coarse*0.35);
  diffuseColor.rgb*=mix(vec3(1.08,1.045,0.94),vec3(0.90,0.965,0.93),lush);
  float dry=smoothstep(0.60,0.86,coarse*0.7+wlNoise(vWPos.xz*0.30+vec2(31.0,2.0))*0.3);
  diffuseColor.rgb=mix(diffuseColor.rgb,diffuseColor.rgb*vec3(1.20,1.10,0.80),dry*0.45);
  float bare=smoothstep(0.80,0.93,wlNoise(vWPos.xz*0.62+vec2(55.0,17.0)));
  diffuseColor.rgb=mix(diffuseColor.rgb,vec3(0.40,0.33,0.23),bare*0.34);
  float grain=wlNoise(vWPos.xz*3.7)*0.5+wlNoise(vWPos.xz*9.1+3.3)*0.5;
  diffuseColor.rgb*=0.965+0.07*grain;
}`;
// The mown swathes live in the SHADER: a seven-metre stripe cannot survive
// sixteen-metre tile vertices, so the panel weight and the local station ride
// along as attributes and the banding is painted per-pixel. Positive aPanel
// is the mown field; negative is the regrown flush.
const PANEL_GLSL=`
{
  float pw=clamp(vPanel,0.0,1.0);
  if(pw>0.003){
    float ph=vPanelS/max(vPanelW,1.0);
    float band=fract(ph);
    float swathe=0.95+0.075*mod(floor(ph),2.0);
    vec3 hay=vec3(0.769,0.706,0.416);
    float rag=wlNoise(vWPos.xz*0.33+vec2(3.7,9.2));
    float w=pw*smoothstep(0.28,0.55,rag*0.5+pw*0.5);
    diffuseColor.rgb=mix(diffuseColor.rgb,hay,0.5*w);
    diffuseColor.rgb*=mix(1.0,swathe,w);
    float row=exp(-pow((band-0.5)/0.075,2.0));
    float rowBreak=wlNoise(vWPos.xz*0.9+vec2(13.0,5.0));
    diffuseColor.rgb=mix(diffuseColor.rgb,vec3(0.871,0.796,0.522),row*w*0.7*smoothstep(0.28,0.6,rowBreak));
  }
  float fw=clamp(-vPanel,0.0,1.0);
  if(fw>0.003){
    float rag=smoothstep(0.3,0.7,wlNoise(vWPos.xz*0.21+vec2(7.0,2.0)));
    diffuseColor.rgb=mix(diffuseColor.rgb,vec3(0.478,0.788,0.333),0.42*fw*rag);
  }
}`;
function groundedMat(mat,opts){
  const o=opts||{};
  mat.onBeforeCompile=(sh)=>{

    sh.vertexShader=sh.vertexShader
      .replace('#include <common>','#include <common>\nvarying vec3 vWPos;'+(o.canopy?'\nattribute float aCanopy; varying float vCanopy;':'')
        +(o.panel?'\nattribute float aPanel; attribute float aPanelS; attribute float aPanelW; varying float vPanel; varying float vPanelS; varying float vPanelW;':''))
      .replace('#include <worldpos_vertex>','#include <worldpos_vertex>\n{ vec4 wp2=modelMatrix*vec4(transformed,1.0);\n#ifdef USE_INSTANCING\n wp2=modelMatrix*instanceMatrix*vec4(transformed,1.0);\n#endif\n vWPos=wp2.xyz;'+(o.canopy?' vCanopy=aCanopy;':'')+(o.panel?' vPanel=aPanel; vPanelS=aPanelS; vPanelW=aPanelW;':'')+' }');

      .replace('#include <common>','#include <common>\nvarying vec3 vWPos;'+(o.canopy?'varying float vCanopy;':'const float vCanopy=0.0;')
        +(o.panel?'varying float vPanel; varying float vPanelS; varying float vPanelW;':'')+'\n'+WL_GLSL)
      .replace('#include <color_fragment>','#include <color_fragment>\n'+(o.meadow?MEADOW_GLSL:'')+(o.panel?PANEL_GLSL:''))
      .replace('vec3 outgoingLight = ',
        'float wl=cloudShadowAt(vWPos.xz)*dappleAt(vWPos.xz,vCanopy);\n'+
        'reflectedLight.directDiffuse*=wl;\nreflectedLight.indirectDiffuse*=mix(0.84,1.0,wl);\nvec3 outgoingLight = ');

}

// ============================================================
// GROUND COLOUR — the keeper's painted-field logic, plus the two hay
// panels: mown swathes with pale windrow lines, and the regrown flush.
// ============================================================
const C_SUN=col(PAL.sunGrass), C_MEAD=col(PAL.meadow), C_SHADE=col(PAL.leafShade),
      C_DEEP=col(PAL.woodDeep), C_ROAD=col(PAL.road);
const C_DRY=mixc(PAL.sunGrass,PAL.road,0.42);
const C_LOAM=mixc(PAL.bark,PAL.woodDeep,0.42);
const C_HAY=mixc(PAL.sunGrass,PAL.road,0.55);            // the colour of a cut field
const C_WINDROW=mixc(PAL.road,PAL.sunGrass,0.35).lerp(col(0xFFF3CE),0.22);
const C_FLUSH=mixc(PAL.meadow,PAL.sunGrass,0.42).lerp(col(0x7FD05A),0.18);
const _gc=new THREE.Color();
function groundColorL(x,z,slope,enc,moist,rel,ri){
  const t=fbmE(x/150+3.1,z/150+9.4)*0.62+fbmE(x/47+21.3,z/47+7.7)*0.38;
  const t2=fbmE(x/23+17.7,z/23+5.5);
  let e=clamp(0.16+t*1.05+rel*0.040-slope*1.55,0,1);
  _gc.copy(C_MEAD).lerp(C_SUN,e);
  _gc.lerp(C_DRY,clamp((slope-0.24)*1.7,0,0.46)*clamp(1-moist*1.6,0,1)*(0.45+0.55*t2));
  _gc.lerp(C_SHADE,clamp(enc*0.80,0,0.80));
  _gc.lerp(C_DEEP,clamp(moist*0.34+enc*moist*0.5,0,0.45));
  _gc.lerp(C_LOAM,clamp((enc-0.62)*1.5,0,0.34)*clamp(t2*1.3,0,1));
  // the hay panels are painted in the shader (PANEL_GLSL): a vertex tint at
  // tile resolution would alias the swathes away
  return _gc;
}

// ============================================================
// THE ROAD AND ITS CORRIDOR — one conformal mesh per segment, the island's
// built from its own LOCAL frames and transformed whole, so its geometry is
// identical under every placement.
// ============================================================
const C_ROAD_CORE=mixc(PAL.road,0xFFF2D2,0.16);
const C_ROAD_MID=mixc(PAL.road,PAL.bark,0.055);
const C_ROAD_EDGE=mixc(PAL.road,PAL.bark,0.26).lerp(col(PAL.leafShade),0.08);
const C_SEAM=(()=>{
  const target=lumOf(C_ROAD_MID)/3.4;
  const hue=mixc(PAL.bark,PAL.woodDeep,0.42);
  const k=target/Math.max(lumOf(hue),1e-4);
  return new THREE.Color(clamp(hue.r*k,0,1),clamp(hue.g*k,0,1),clamp(hue.b*k,0,1));
})();
const C_SHOULDER=mixc(PAL.road,PAL.bark,0.46).lerp(col(PAL.sunGrass),0.10);
const C_WORNGRASS=mixc(PAL.meadow,PAL.bark,0.24).lerp(col(PAL.sunGrass),0.16);
const ROAD_CONTRAST=lumOf(C_ROAD_MID)/lumOf(C_SEAM);
const COLS=(()=>{
  const c=[];
  for(const t of [-1,-0.72,-0.40,-0.14,0.14,0.40,0.72,1]) c.push(t*RH);
  for(const a of [0.22,0.6,1.15,1.9,2.9,4.4,8.0,12.5,18,25,33,43,54,APRON]){ c.push(RH+a); c.push(-(RH+a)); }
  c.sort((p,q)=>p-q);
  return c;
})();
const corridorMat=new THREE.MeshLambertMaterial({vertexColors:true,
  emissive:new THREE.Color(0x120e07),emissiveIntensity:1});
corridorMat.onBeforeCompile=(sh)=>{
  Object.assign(sh.uniforms,WL);
  sh.vertexShader=sh.vertexShader
    .replace('#include <common>','#include <common>\nvarying vec3 vWPos; attribute float aCanopy; attribute float aS; attribute float aLat; attribute float aMat; attribute float aPanel; attribute float aPanelS; attribute float aPanelW;\nvarying float vCanopy; varying float vS; varying float vLat; varying float vMat; varying float vPanel; varying float vPanelS; varying float vPanelW;')
    .replace('#include <worldpos_vertex>','#include <worldpos_vertex>\n{ vec4 wp2=modelMatrix*vec4(transformed,1.0); vWPos=wp2.xyz; vCanopy=aCanopy; vS=aS; vLat=aLat; vMat=aMat; vPanel=aPanel; vPanelS=aPanelS; vPanelW=aPanelW; }');
  sh.fragmentShader=sh.fragmentShader
    .replace('#include <common>','#include <common>\nvarying vec3 vWPos; varying float vCanopy; varying float vS; varying float vLat; varying float vMat; varying float vPanel; varying float vPanelS; varying float vPanelW;\n'+WL_GLSL)
    .replace('#include <color_fragment>',`#include <color_fragment>
    if(vMat<0.5){
      float slab=wlHash(vec2(floor(vS/8.7),0.0));
      float seam=smoothstep(0.42,0.0,abs(fract(vS/8.7)-0.5)*8.7-(0.30+0.30*slab));
      float repair=smoothstep(0.63,0.78,wlNoise(vWPos.xz*0.055+vec2(17.0,3.0)));
      float grain=wlNoise(vWPos.xz*2.1)*0.5+wlNoise(vWPos.xz*6.3+9.1)*0.5;
      float wear=smoothstep(0.75,0.05,abs(vLat));
      diffuseColor.rgb*=1.0-seam*0.115-repair*0.065-(grain-0.5)*0.085;
      diffuseColor.rgb*=1.0+wear*0.045;
    } else {
      float g=wlNoise(vWPos.xz*0.36)*0.6+wlNoise(vWPos.xz*1.15+5.3)*0.4;
      float edge=abs(vLat);
      float brk=wlNoise(vWPos.xz*0.55+vec2(3.1,9.7))*0.6+wlNoise(vWPos.xz*1.9)*0.4;
      float scuff=smoothstep(1.02,1.55,edge+(brk-0.5)*0.42);
      diffuseColor.rgb=mix(diffuseColor.rgb,diffuseColor.rgb*vec3(1.10,1.06,0.94),(1.0-scuff)*0.55);
      float loam=smoothstep(0.62,0.18,abs(edge-1.28)+(brk-0.5)*0.5);
      diffuseColor.rgb=mix(diffuseColor.rgb,vec3(0.44,0.36,0.25),loam*0.30);
      diffuseColor.rgb*=0.92+0.16*g;
      float blendM=smoothstep(1.5,3.4,edge);
      vec3 preM=diffuseColor.rgb;
      ${MEADOW_GLSL}
      diffuseColor.rgb=mix(preM,diffuseColor.rgb,blendM);
      ${PANEL_GLSL}
    }`)
    .replace('vec3 outgoingLight = ',
      'float wl=cloudShadowAt(vWPos.xz)*dappleAt(vWPos.xz,vCanopy);\n'+
      'if(vMat<0.5) wl=mix(1.0,wl,0.55);\n'+
      'reflectedLight.directDiffuse*=wl;\n'+
      'reflectedLight.indirectDiffuse=reflectedLight.indirectDiffuse*mix(0.86,1.0,wl)+diffuseColor.rgb*(vMat<0.5?0.30:0.34)*wl;\n'+
      'vec3 outgoingLight = ');
};

const ISLAND_MESHES=[];   // everything the island itself pays for, per copy
const HOST_MESHES=[];
function bookMesh(m,island,copy){ (island?ISLAND_MESHES:HOST_MESHES).push(m); m.userData.copy=copy; return m; }

// island corridor rows are indexed by LOCAL station so the mesh is the same
// mesh under every placement; host segments use their own world frames
function buildCorridorSegment(seg){
  const isIsland=seg.island;
  const F=isIsland?LFRAME:seg.F;
  const T=isIsland?XFORMS[seg.copy]:null;
  const row=QCFG.row;
  const rows=Math.max(2,Math.round(F.len/row)+1);
  const W=COLS.length;
  const P=new Float32Array(rows*W*3), C=new Float32Array(rows*W*3);
  const CA=new Float32Array(rows*W), SS=new Float32Array(rows*W), LT=new Float32Array(rows*W), MT=new Float32Array(rows*W);
  const PA=new Float32Array(rows*W), PS=new Float32Array(rows*W), PW=new Float32Array(rows*W);
  const IDX=[];
  for(let r=0;r<rows;r++){
    const s=F.len*r/(rows-1);
    const fr=getFrame(F,s);
    const enc=isIsland?enclosureAt(s):0.12;
    for(let j=0;j<W;j++){
      const u=COLS[j], a=Math.abs(u), k=r*W+j;
      const x=fr.x+fr.lx*u, z=fr.z+fr.lz*u;
      let y, mat, cc, pan=0, panS=0, panW=8;
      if(a<=RH+1e-4){
        y=fr.y+CROWN*(1-(a/RH)*(a/RH));
        mat=0;
        const tl=Math.abs(u)/RH;
        cc=C_ROAD_CORE.clone().lerp(C_ROAD_MID,smooth(0.0,0.62,tl)).lerp(C_ROAD_EDGE,smooth(0.62,1.0,tl));
      } else {
        mat=1;
        let base;
        if(isIsland){
          const ri=routeInfoL(x,z);
          y=groundL(x,z);
          const moist=moistL(x,z);
          base=groundColorL(x,z,0,enc,moist,y-ri.y,ri).clone();
          const pa=panelAt(x,z,ri);
          if(pa){ pan=pa.P.mown?pa.w:-pa.w; panW=pa.P.mown?pa.P.stripeW:8; }
          panS=ri.s;
        } else {
          y=groundW(x,z);
          base=groundColorL(x,z,0,enc,0,0,null).clone();
        }
        const seamW=0.34, shoW=lerp(1.05,0.55,enc), grW=lerp(2.6,1.5,enc);
        const d0=a-RH;
        cc=base;
        cc.lerp(C_WORNGRASS,1-smooth(seamW+shoW,seamW+shoW+grW,d0));
        cc.lerp(C_SHOULDER,(1-smooth(seamW,seamW+shoW,d0))*lerp(0.86,0.45,enc));
        cc.lerp(C_SEAM,1-smooth(seamW*0.55,seamW,d0));
      }
      if(isIsland){
        const w=T.fwd(x,z);
        P[k*3]=w[0]; P[k*3+1]=T.fwdY(y); P[k*3+2]=w[1];
      } else {
        P[k*3]=x; P[k*3+1]=y; P[k*3+2]=z;
      }
      C[k*3]=cc.r; C[k*3+1]=cc.g; C[k*3+2]=cc.b;
      CA[k]=enc; SS[k]=(seg.g0+s); LT[k]=u/RH; MT[k]=mat;
      PA[k]=pan; PS[k]=panS; PW[k]=panW;
    }
  }
